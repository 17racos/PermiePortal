  description: |-
    Dahoon holly is the wetland holly that actually belongs in low Florida ground without apology—evergreen, red berries on females, and a tolerance for soggy feet that makes turf cultists uncomfortable.

    North Florida / subtropical: Native component of swamps, pond margins, and flatwoods edges. If you have a rain garden that pretends to be a lawn, this is closer to honesty.

    Sun and water: Full sun to part shade; tolerates wet soils and periodic inundation better than most hollies. Mulch and organic soil help in sandy drought pockets.

    Propagation: Seeds require patience (dioecious—need male pollen near females for berries); cuttings and nursery liners are the practical route.
