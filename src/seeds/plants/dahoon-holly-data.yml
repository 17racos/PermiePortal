  description: |-
    Dahoon holly is the wetland holly that actually belongs in low Florida ground without apology—evergreen, red berries on females, and a tolerance for soggy feet that makes turf cultists uncomfortable.
    
    Native component of swamps, pond margins, and flatwoods edges. If you have a rain garden that pretends to be a lawn, this is closer to honesty.
    
    Sun and water: Full sun to part shade; tolerates wet soils and periodic inundation better than most hollies. Mulch and organic soil help in sandy drought pockets.
    ✂️ Propagation:
    Seeds require patience (dioecious—need male pollen near females for berries); cuttings and nursery liners are the practical route.
    
    🌾 Harvest / Best Use Timing:
    - Native wildlife timing matters more than human harvest -- berries support birds; leave plenty.
    - If collecting for restoration projects, take only from known-safe sites and legal permission contexts.
    - Prune for structure in cool months; hollies resent torn bark summer pruning.
  purpose: |-
    Wildlife Attractor: Wildlife shows up for calories and cover: ✂️ Propagation: Seeds require patience (dioecious -- need male pollen near females for berries); cuttings and nursery liners are the practical route. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Ornamental: Dahoon Holly earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Windbreaker: Dahoon Holly builds a living wind-skin tall enough to protect tender crops and tunnel houses from desiccating gusts -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane

