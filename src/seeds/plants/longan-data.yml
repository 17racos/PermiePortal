  description: "Dimocarpus longan is lychee's slightly less famous cousin: translucent
    aril around a jet-black seed that literally looks like a dragon's eye if you squint
    poetically. Evergreen tropical tree with glossy compound leaves and panicles of
    tiny flowers that become clustered fruit. subtropical and tropical Americas: marginal except in warm
    microclimates; young flushes hate cold snaps.\n\n🌞💧 Sun and Water Requirements:\n-
    Full sun for commercial-level fruiting; afternoon shade acceptable in brutal heat.\n-
    Deep, fertile, well-drained soil with steady moisture in fruiting season.\n- Mulch
    and wind protection for establishment.\n\n✂️🌱 Methods to Propagate:\n- Air-layering
    and grafting for true-to-type cultivars.\n- Seeds grow but produce variable,
    long-juvenile offspring.\n\n🧺 When to Harvest:\n- When skin turns tan/leathery
    and fruit separates cleanly — overripe loses snap."
