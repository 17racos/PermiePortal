plant_function:
- Edible
- Shade Provider
- Wildlife Attractor
description: |-
  Dimocarpus longan is lychee's slightly less famous cousin: translucent aril around a jet-black seed that literally looks like a dragon's eye if you squint poetically. Evergreen tropical tree with glossy compound leaves and panicles of tiny flowers that become clustered fruit. Marginal except in warm microclimates; young flushes hate cold snaps.

  Full sun for commercial-level fruiting; afternoon shade acceptable in brutal heat.
  Deep, fertile, well-drained soil with steady moisture in fruiting season.
  Mulch and wind protection for establishment.

  Air-layering and grafting for true-to-type cultivars.
  Seeds grow but produce variable, long-juvenile offspring.

  When skin turns tan/leathery and fruit separates cleanly — overripe loses snap.
purpose: |-
  Edible: Dimocarpus longan arils stay glassy-sweet around a jet-black seed -- eat fresh off the stem when skin leathers and aroma peaks; overripe fruit loses snap and ferments within days in tropical heat.
  Shade Provider: Dense evergreen crown filters sun for understory coffee and vanilla in frost-free sites -- young flushes still burn below 28°F (around -2°C), so microclimate planning is not optional.
  Wildlife Attractor: Panicles of tan fruit draw starlings and fruit bats the week humans blink -- net entire canopies or harvest slightly early for drying if wildlife tithe is not in your budget.
companions:
- Lychee
- Banana
- Papaya
cautions:
- Planting as your only fruit tree on frost-prone lots
- Waterlogging — Phytophthora does not send warnings
pests:
- Borers
- Boxelder Bug
- Caribbean Fruit Fly
- Mealybugs
- Scale Insects
- Spotted Lanternfly
food_role: support
