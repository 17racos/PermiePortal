  description: 'Dimocarpus longan is lychee''s slightly less famous cousin: translucent aril around a jet-black seed that
    literally looks like a dragon''s eye if you squint poetically. Evergreen tropical tree with glossy compound leaves and
    panicles of tiny flowers that become clustered fruit. Marginal except in warm microclimates; young flushes hate cold snaps.


    ☀️💧 Sun and Water Requirements:


    Full sun for commercial-level fruiting; afternoon shade acceptable in brutal heat.

    Deep, fertile, well-drained soil with steady moisture in fruiting season.

    Mulch and wind protection for establishment.


    ✂️ Propagation:


    Air-layering and grafting for true-to-type cultivars.

    Seeds grow but produce variable, long-juvenile offspring.


    🌾 Harvest / Best Use Timing:


    When skin turns tan/leathery and fruit separates cleanly — overripe loses snap.'
  purpose: '- Edible: Translucent aril dessert fruit when winter lows cooperate—otherwise sapindaceous experiments mean gambling
    with nursery receipts.

    - Shade Provider: Evergreen canopy for frost-safe tropical rows.

    - Wildlife Attractor: Clustered fruit draws birds and frugivores—plan netting or sharing.'
