  description: "Ebony spleenwort (Asplenium platyneuron) is a diminutive evergreen
    fern with dark, glossy stipes and narrow, once-pinnate fronds, common in thin
    soil over rock from eastern North America into parts of Mesoamerica. It colonizes
    limestone chips, old mortar, and woodland edges where other plants demand deeper
    humus. In design, it is a living grout for rock gardens, retaining walls, and
    shaded paths—low input, high texture, and allergic to fertilizer cosplay.\n\n
    ☀️💧 Sun and Water Requirements:\nPartial shade to shade; tolerates bright shade
    on moist rock. Prefers well-drained, circumneutral to basic soils derived from
    limestone; also grows on acidic rock with enough crevice organic matter. Keep evenly
    moist but not soggy; drought causes frond tip burn. Avoid heavy bark mulch smothering
    crowns.\n\n✂️ Propagation:\nSpores sown on sterile medium under humidity domes
    produce gametophytes over months—patience is equipment.\nCarefully divide small
    clumps with root and rhizome intact during cool, moist weather.\n\n🌾 Harvest
    / Best Use Timing:\nDo not wild-dig large patches—transplant only rescue material
    with permission. In gardens, refresh mulch lightly in cool seasons and remove
    winter-damaged fronds before spring growth."
