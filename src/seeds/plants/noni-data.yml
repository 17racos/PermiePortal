description: |-
  Morinda citrifolia is the tree that fruits whether you approve of the smell or not—large glossy leaves, white tubular flowers, lumpy green-white fruits that ripen to translucent stink-bombs beloved by certain Polynesian traditions and MLM nightmares.

  Marginal north of true tropics; microclimate and young-plant protection required in 10a cold pockets. Loves heat and humidity; hates long freezes.

  ☀️💧 Sun and Water Requirements:

  Full sun for best fruiting; tolerates some shade when young.
  Tolerates drought once established but fruits better with deep occasional irrigation in dry season.

  ✂️ Propagation:

  Seed (variable); large cuttings in humid warm weather.

  🌾 Harvest / Best Use Timing:

  Gather fruit when color and translucency match your cultural recipe—odor is part of the package.
purpose: |-
  Edible: Translucent ripe Morinda citrifolia syncarps enter Polynesian and Asian kitchens as fermented drinks, sharp relishes, or slow-cooked condiments -- fresh fruit smells like gym socks crossed with parmesan; harvest when skin softens and aroma matches the recipe lineage you are actually following.
  Medicinal: Iridoid and anthraquinone fractions drive export “noni juice” commerce and village first-aid narratives -- keep internal dosing inside professional guidance because rodent carcinogenicity flags and supplement law vary by country.
  Wildlife Attractor: Intense odor pulls vinegar flies and native fruit pigeons to fallen fruit within hours -- rake drops under backyard trees or accept larval souvenirs on patio furniture.
