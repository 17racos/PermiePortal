  description: 'Scrub palmetto (Sabal etonia) is a fan palm of deep sandy scrub, usually with an underground or short aboveground
    trunk and costapalmate leaves silvery underneath. It is smaller and more clumping in habit than many landscape sabals,
    fitting dry, acidic sites where irrigation is absent. Use it in fire-adapted scrub restorations, xeric borders, and wildlife
    plantings where palmetto structure beats turf theater.


    ☀️💧 Sun and Water Requirements:

    Full sun for compact form and best silver leaf display; shade stretches petioles. Extremely well-drained sandy, acidic
    soils are native truth; tolerates drought once established. Avoid heavy clay and chronic irrigation.


    ✂️ Propagation:

    Sow fresh seed in warm, humid conditions; germination is slow. Transplant young palms with minimal root disturbance. Remove
    only fully brown fronds.


    🌾 Harvest / Best Use Timing:

    Primarily ecological and ornamental—seeds feed wildlife where permitted. Growth flushes follow warm wet periods.'
  purpose: |-
    Ornamental: Scrub Palmetto earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Wildlife shows up for calories and cover: Use it in fire-adapted scrub restorations, xeric borders, and wildlife plantings where palmetto structure beats turf theater. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Erosion Control: Scrub Palmetto networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Border Plant: Scrub Palmetto tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate

