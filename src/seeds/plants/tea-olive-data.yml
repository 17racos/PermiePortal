  description: "Tea olive (Osmanthus fragrans) is an evergreen shrub to small tree with leathery leaves and tiny white flowers
    that punch far above their size in fragrance—sweet apricot perfume can carry downwind on calm evenings. It blooms in repeating
    flushes across long seasons in warm climates, making it a sensory anchor near patios, paths, and bedroom windows. Traditional
    use scents tea and sweets; modern landscapes use it where ‘low maintenance’ still means something should smell alive.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun to partial shade; hotter inland sites appreciate afternoon shade.\n- Moist, well-drained,
    acidic soils suit it best; chlorosis appears on alkaline ground without amendments.\n- Consistent moisture while establishing;
    older plants endure short drought but look richer with occasional deep watering.\n\n✂️ Propagation:\n- Semi-hardwood cuttings
    root with bottom heat and humidity in late summer.\n- Air-layering suits upgrading a branch into a new plant on old specimens.\n-
    Seeds are slow; clones preserve known fragrance forms.\n\n🌾 Harvest / Best Use Timing:\n- Pick flowers at peak open for
    infusions and syrups; process quickly—volatile aromatics fade fast.\n- Dry flowers gently for tea blends; avoid sealed
    plastic while damp.\n- Leave plenty of bloom for nighttime pollinators if your harvest is aesthetic, not survival."
  purpose: |-
    Tea olive serves multiple functions in a permaculture system:

    - Medicinal: Flower infusions appear in traditional use for soothing teas—verify species and preparation with reliable references.
    - Pollinator: Tiny flowers still feed small bees and night-flying insects when massed.
    - Wildlife Attractor: Dense evergreen cover shelters birds; fragrance draws human attention to plantings that might otherwise be ignored.
    - Ornamental: Evergreen structure plus episodic bloom supports designed landscapes without constant flower replacement.
    - Border Plant: Screens and hedges along paths where scent matters more than flower size.
  companions:
  - Azalea — shared acidic-soil culture under high shade if irrigation stays honest.
  - Comfrey — mineral mulch outside the trunk zone without changing pH overnight.
  - Rosemary — sun-loving edge contrast where drainage is sharp and limestone is not the boss.
