  description: |-
    Bitter yam is a tropical African yam species with a reputation: edible forms exist after careful processing, and ignorant snacking is how you learn respect for cyanogenic glycosides the hard way. This is not the beginner's "dig and mash" yam — it is a serious food-security crop where traditional detox methods are known. Permaculture angle: perennial vine, heavy tuber, excellent for trellising on sturdy posts in frost-free sites.

    ☀️💧 Sun and Water Requirements:
    - Full sun for productivity; tolerates bright partial shade but may yield less.
    - Deep, loose, fertile soil; consistent moisture in growth season, drier when vines senesce depending on local practice.
    - Frost-free; cold snaps damage vines and tuber quality.

    ✂️ Methods to Propagate:
    - Tubers: plant crown pieces or whole small tubers when soil is warm.
    - Vine cuttings: some Dioscorea root from nodes; success varies — keep humid until rooted.
  purpose: |-
    Bitter yam belongs in systems where processing knowledge already lives in the kitchen:

    - Edible: Starchy tuber after proper traditional preparation only — verify cultivar and method before eating; cyanogenic chemistry is not a debate club topic.
    - Ground Cover: A vigorous warm-season vine shades soil and outcompetes weeds when trained on stout posts, not on your prized fruit trees.
    - Biomass: Spent vines and leaf litter can feed compost or mulch layers in frost-free sites once you confirm no quarantine pests hit the patch.
    - Dynamic Accumulator: Deep tubers and probing roots pull minerals from lower soil volumes; residues return those minerals only if you cycle biomass on-site.
  companions:
  - Pigeon pea
  - Cassava
  - Tall sorghum (living trellis)
  avoid:
  - Shallow rocky soil that restricts tuber expansion
  - Undocumented wild harvest without ID and processing knowledge
  pests:
  - Nematodes
  - Aphids
  - Root Rot
