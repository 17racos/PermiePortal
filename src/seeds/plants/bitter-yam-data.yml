  description: |-
    Bitter yam is a tropical African yam species with a reputation: edible forms exist after careful processing, and ignorant snacking is how you learn respect for cyanogenic glycosides the hard way. This is not the beginner's "dig and mash" yam — it is a serious food-security crop where traditional detox methods are known. Permaculture angle: perennial vine, heavy tuber, excellent for trellising on sturdy posts in frost-free sites.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for productivity; tolerates bright partial shade but may yield less.
    - Deep, loose, fertile soil; consistent moisture in growth season, drier when vines senesce depending on local practice.
    - Frost-free; cold snaps damage vines and tuber quality.
    
    ✂️ Methods to Propagate:
    - Tubers: plant crown pieces or whole small tubers when soil is warm.
    - Vine cuttings: some Dioscorea root from nodes; success varies — keep humid until rooted.
    
    🌾 Harvest / Best Use Timing:
    - Bitter Yam: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
  purpose: |-
    Edible: Bitter Yam (Dioscorea dumetorum) in the edible role draws on field reality: Permaculture angle: perennial vine, heavy tuber, excellent for trellising on sturdy posts in frost-free sites. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Ground Cover: Bitter Yam carpets soil fast enough to smother early weeds while feeding surface roots and arthropods -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
    Biomass: Bitter Yam prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories
    Dynamic Accumulator: Bitter Yam pulls mobile nutrients into tissues you can chop-and-drop beside hungry crops -- moves minerals from deep or marginal horizons into chop-and-drop cycles your heavy feeders can bank on
  companions:
