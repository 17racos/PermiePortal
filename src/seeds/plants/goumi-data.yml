  description: "Goumi (Elaeagnus multiflora) is a deciduous to semi-evergreen shrub from East Asia, widely planted for silvery-scaled leaves, fragrant spring flowers, and tart scarlet berries speckled with silver. Plants typically reach 6–10 feet (1.8–3 m) and tolerate lean soils thanks to actinorhizal nitrogen fixation on roots. It suits temperate to warm-summer food hedges, windbreak understories, and poultry margins where thorns are acceptable trade for fruit.\n\n☀️💧 Sun and Water Requirements:\nFull sun for heaviest fruiting; light shade reduces yield but aids establishment in hot dry sites. Well-drained soils; tolerates drought after establishment due to salt-tolerant family physiology. Avoid waterlogged clay that rots roots while you blame the cultivar.\n\n✂️ Propagation:\nSow cleaned seed after stratification if available; vegetative propagation is more predictable for selected types. Softwood cuttings under mist root in warm weather. Prune after fruiting to open the interior for light and air.\n\n🌾 Harvest / Best Use Timing:\nBerries soften and sweeten somewhat after astringent early stages—taste before bulk processing. Use for jelly, sauces, or drying when fully colored. Flowers are powerfully scented—plant downwind of bedroom windows if you are scent-sensitive."
  purpose: |-
    - Edible: Tart fruit rewards cooks who understand sugar, acid, and patience.
    - Nitrogen Fixer: Frankia nodules on roots enrich adjacent plants through leaf drop and root turnover.
    - Wildlife Attractor: Flowers and fruit feed pollinators and birds where sharing is intentional.
    - Border Plant: Dense habit and some thorniness define edges without plastic fence cosplay.
  companions:
  - Autumn Olive — related Elaeagnus-flowering window overlap can improve fruit set where policies allow planting
  - Apple — rosaceous neighbor sharing hedgerow management and beneficial insect traffic at row edges
  - Comfrey — deep-mining herb mulch that feeds the root zone without shading the crown
  cautions:
