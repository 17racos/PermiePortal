  practitioner_notes: |-
    Cycad, not a fern—toxic if mis-ID leads to flour experiments; keep livestock and curious toddlers away from unprocessed tissue.
    Atala butterfly larvae eat foliage—holes mean ecological win, not failure; plant extra if you want perfect leaves for show.
