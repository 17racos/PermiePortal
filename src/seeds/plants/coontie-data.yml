  description: "Coontie is a low-growing, evergreen cycad native to Florida and parts
    of the southeastern United States. Resembling a fern, it features feather-like,
    light green, leathery foliage that emerges from a large underground storage root.
    Typically, it grows up to 0.9 meters (3 feet) tall and wide, forming a mounding
    shrub over time. Coontie is dioecious, producing separate male and female cones.
    The plant is highly adaptable, tolerating full sun to deep shade, and is both
    drought and salt-tolerant once established. Notably, it serves as the sole larval
    food source for the Atala butterfly, making it a valuable addition to wildlife
    gardens.\n\n✂️\U0001FAD8 Methods to Propagate:\nCoontie can be propagated through
    seeds or division. Seeds should be collected from mature female cones and cleaned
    before planting. Sow seeds in well-draining soil, keeping them moist until germination,
    which may take several months. Division involves separating offsets from the parent
    plant, ensuring each division has a portion of the root system, and replanting
    them.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nCoontie thrives in
    a range of light conditions, from full sun to full shade. It prefers well-draining
    soil and, once established, is drought-tolerant. Regular watering during the initial
    establishment period will promote healthy growth.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nWhile Coontie has historical significance as a source of starch
    (Florida arrowroot), processing requires careful removal of toxins. Due to its
    toxicity and the complexity of safe preparation, harvesting for consumption is
    not recommended without proper expertise."
