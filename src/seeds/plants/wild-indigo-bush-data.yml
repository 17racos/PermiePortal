  description: "Wild indigo bush (Amorpha fruticosa) is a deciduous leguminous shrub of riverbanks, wet prairies, and disturbed\
    \ moist ground across much of North America. Spikes of purple-blue flowers with orange stamens glow in early summer; compound\
    \ leaves read soft gray-green. Deep roots fix nitrogen while stabilizing riparian soils, making it a backbone species\
    \ for buffer strips and wet meadow restoration.\n\n ☀️\U0001F4A7 Sun and Water Requirements:\nFull sun for best bloom\
    \ and nodule activity; tolerates light shade with looser habit. Tolerates wet soils and periodic inundation better than\
    \ many shrubs; also handles average moisture once established. Not for dry xeric berms without irrigation.\n\n✂️ Propagation:\n\
    Scarify seed and sow after last frost or fall-sow outdoors; germination improves with warm water soaks. Hardwood cuttings\
    \ taken in dormancy can root. Transplant young shrubs in cool wet weather.\n\n \U0001F33E Harvest / Best Use Timing:\n\
    Not a primary human food; historical dye references exist for related species—verify chemistry before experiments. For\
    \ conservation, cut old stems in late winter to encourage vigorous spring growth and leave some standing for insects."
  purpose: '- Nitrogen Fixer: Root nodules house rhizobia that convert atmospheric nitrogen into plant-available forms for
    neighbors via turnover and root exudates.

    - Wildlife Attractor: Flowers feed native bees; seeds feed birds in winter thickets.

    - Erosion Control: Extensive roots bind saturated banks during flood pulses.

    - Border Plant: Forms loose hedgerows along ditches and pond margins without forming impenetrable monocultures if diversified.'
  companions:
  - Swamp Sunflower — tall late color behind indigo spikes; shared moisture and sun
  - Switchgrass — warm-season matrix reduces weed pressure around shrub bases
  - Elderberry — quick fruiting shrub at drier upper bank while indigo holds toe slope
  cautions:
  - Spreading clumps — suckers may appear in ideal wet sites; mow margins if containment matters
  - False indigo name confusion — not Baptisia; different genus, different garden habits
