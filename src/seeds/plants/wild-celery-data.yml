  description: "Apium graveolens in the wild-type form is the bitter, stringy ancestor
    of grocery celery — stronger flavor, smaller petioles, same Apiaceae caution
    about lookalikes in wet ditches. It shows up naturalized in moist disturbed
    ground. Culinary use historically focused on leaves and seeds; stalks need
    selection or cooking.\n\nNorth Florida: prefers cool wet pockets; may grow through
    winter as a rosette and bolt when days lengthen.\n\n☀️💧 Sun and Water:\n- Full
    sun to light shade.\n- Consistent moisture; tolerates brief inundation better
    than drought.\n- Rich loam with organic matter.\n\n✂️ Propagation:\n- Seed; light-dependent
    germination for some lines — surface sow.\n- Division possible on clumping forms
    but seed is standard."
  purpose: |-
    Wild celery ties crop genetics to foraging reality:

    - Edible: Leaves and seeds as seasoning; stalks only where palatable.
    - Wildlife Attractor: Umbels attract beneficial insects when allowed to flower.
    - Border Plant: Moist edge herb in polyculture beds.
    - Dynamic Accumulator: Biomass and deep roots improve mulch cycles in wet soils.
  companions:
  - Lovage
  - Onion
  - Lettuce
  avoid:
  - Drying out in peak heat without mulch
