  description: "Wild parsnip is the escaped biennial cousin of the root vegetable.
    Yellow umbels look innocent; the sap plus sunlight can cause brutal phytophotodermatitis
    — blisters, scars, weeks of regret. Wear gloves, long sleeves, and eye protection
    if you must handle it. This entry is honest ecology, not a foraging endorsement:
    many managers treat it as a hazardous weed; know your land goals before you
    \"leave it for pollinators.\"\n\nsubtropical and tropical Americas: present along roads and disturbed
    ground. If you allow it, isolate from paths and children's play zones.\n\n☀️💧
    Sun and Water:\n- Full sun.\n- Tolerates poor, dry soils; classic roadside weed.\n-
    Drought-tolerant once established.\n\n✂️ Propagation:\n- Not recommended to
    cultivate deliberately; seeds spread easily.\n- Mechanical control timing matters
    — cut before seed set if removing."
  purpose: |-
    Documented here because it shows up whether invited or not:

    - Wildlife Attractor: Insects use the flowers; tradeoffs vs. human safety.
    - Border Plant: Only in low-traffic, signed, managed contexts if at all.
    - Dynamic Accumulator: Deep taproot mines subsoil — useful conceptually, risky practically.
  companions:
  - Yarrow
