  description: 'Wild parsnip is the escaped biennial cousin of the root vegetable. Yellow umbels look innocent; the sap plus
    sunlight can cause brutal phytophotodermatitis — blisters, scars, weeks of regret. Wear gloves, long sleeves, and eye
    protection if you must handle it. This entry is honest ecology, not a foraging endorsement: many managers treat it as
    a hazardous weed; know your land goals before you "leave it for pollinators."


    subtropical and tropical Americas: present along roads and disturbed ground. If you allow it, isolate from paths and children''s
    play zones.


    ☀️💧 Sun and Water:

    - Full sun.

    - Tolerates poor, dry soils; classic roadside weed.

    - Drought-tolerant once established.


    ✂️ Propagation:

    - Not recommended to cultivate deliberately; seeds spread easily.

    - Mechanical control timing matters — cut before seed set if removing.'
