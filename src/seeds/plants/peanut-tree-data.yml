  description: 'The Peanut Tree, native to Australia, is a small to medium-sized tree reaching heights of 10 to 20 meters
    (33 to 66 feet). It is known for its distinctive bright red, woody fruit that splits open to reveal black seeds encased
    in a thin, edible, peanut-flavored aril. The tree has glossy green leaves and produces small, inconspicuous flowers. It
    prefers well-drained soils and can tolerate a range of soil types, including sandy and loamy soils. The Peanut Tree is
    drought-tolerant once established and can be grown in tropical and subtropical climates.


    ✂️🫘 **Methods to Propagate:**

    Propagation is typically done through seeds. Fresh seeds have higher germination rates and should be sown in well-draining
    soil. Soaking seeds in water overnight before planting can improve germination success. Seedlings should be protected
    from frost and strong winds during the early stages of growth.


    🌞💧 **Sun and Water Requirements:**

    The Peanut Tree thrives in full sun but can tolerate partial shade. It prefers well-drained soils and is drought-tolerant
    once established. Regular watering is essential during the establishment phase to ensure healthy growth.


    🧑‍🌾👩‍🌾 **When to Harvest:**

    The fruits are typically harvested when they turn bright red and begin to split open, revealing the seeds inside. This
    usually occurs in late summer to early autumn. The edible arils can be consumed fresh once extracted from the fruit.'
  purpose: '- **Edible:** The tree produces edible seeds with a peanut-like flavor, consumed fresh or roasted.

