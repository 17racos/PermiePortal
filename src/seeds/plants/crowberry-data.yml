  description: 'Crowberry (Empetrum nigrum) is a low, needle-leaved evergreen subshrub of cold bogs, heaths, and windswept
    barrens across northern regions and high elevations, forming mats studded with small glossy black berries. Height is usually
    under 1 foot (0.3 m) with creeping stems that root at nodes. The fruit is mildly sweet-tart and historically important
    where other fruits are scarce; ecologically it is ground-hugging armor against wind and thin soil.


    ☀️💧 Sun and Water Requirements:

    Full sun in cool climates; partial shade acceptable where summer heat spikes. Prefers acidic, organic soils that stay
    moist but not sewage-soggy; tolerates droughty rock once established in its comfort band. Avoid lime-heavy beds that erase
    Ericaceae chemistry.


    ✂️ Propagation:

    Layer low stems onto moist peat-sand; hold with stones until roots anchor. Sow seed after cold stratification; germination
    is slow and irregular, matching the plant’s personality. Softwood cuttings under mist can work for named selections if
    you have them.


    🌾 Harvest / Best Use Timing:

    Berries ripen late in the short season; taste improves after frost in many sites. Pick by hand along the mat; expect modest
    yields that reward patience, not capitalism. Leave some fruit for ground-foraging birds that evolved with these systems.'
