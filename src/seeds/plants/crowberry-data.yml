  description: "Crowberry (Empetrum nigrum) is a low, needle-leaved evergreen subshrub of cold bogs, heaths, and windswept barrens across northern regions and high elevations, forming mats studded with small glossy black berries. Height is usually under 1 foot (0.3 m) with creeping stems that root at nodes. The fruit is mildly sweet-tart and historically important where other fruits are scarce; ecologically it is ground-hugging armor against wind and thin soil.\n\n☀️💧 Sun and Water Requirements:\nFull sun in cool climates; partial shade acceptable where summer heat spikes. Prefers acidic, organic soils that stay moist but not sewage-soggy; tolerates droughty rock once established in its comfort band. Avoid lime-heavy beds that erase Ericaceae chemistry.\n\n✂️ Propagation:\nLayer low stems onto moist peat-sand; hold with stones until roots anchor. Sow seed after cold stratification; germination is slow and irregular, matching the plant’s personality. Softwood cuttings under mist can work for named selections if you have them.\n\n🌾 Harvest / Best Use Timing:\nBerries ripen late in the short season; taste improves after frost in many sites. Pick by hand along the mat; expect modest yields that reward patience, not capitalism. Leave some fruit for ground-foraging birds that evolved with these systems."
  purpose: |-
    - Edible: Small berries add acidic fruit to preserves and beverages in cold-climate foraging rotations.
    - Wildlife Attractor: Berries feed birds and small mammals when other sugar is buried under snow.
    - Ground Cover: Evergreen needles knit soil on exposed slopes and bog margins.
    - Erosion Control: Mat-forming stems reduce surface wash on thin organics over rock.
  companions:
  - Lingonberry — shared acidity and similar cultural needs in Ericaceous beds
  - Lowbush Cranberry — complementary fruiting times and bog-culture synergy
  - Yarrow — shallow roots and insectary flowers at the edge without shading the mat
  cautions:
  - Hot humid summers — often declines outside its native chill band no matter how much you cheer
  - High pH soils — chlorosis and slow death; fix the bed or pick another plant
  pests:
  - Spider Mites
  - Aphids
  practitioner_notes: |-
    Berries look like punctuation on a carpet—harvest kneeling, not sprinting.
    Two sexes exist in many populations; single clones yield little without partners nearby.
    Peat use has ethics; mimic structure with local coarse organics when you can.
    Taste tests vary by population; some are resinous until fully ripe—wait for the shrug to become a nod.
  growth_habit: Low mat-forming evergreen subshrub; needle leaves; black berries; cold-climate specialist
