  description: 'Rough blazingstar (Liatris aspera) is a taprooted prairie perennial of central and eastern North America,
    with stiff, rough leaves and tall spikes of purple florets opening top-down in late summer. Plants reach 2–4 feet (60–120
    cm), often on dry slopes and sandy soils where less rugged forbs surrender. It is a monarch-supporting landscape companion
    when combined with milkweeds, and a vertical accent in meadow mixes that refuse irrigation.


    ☀️💧 Sun and Water Requirements:

    Full sun for upright stems and dense spikes; shade invites leaning and fewer flowers. Dry to average, well-drained soils
    are native truth; tolerates drought once established. Avoid wet clay that rots taproots; mulch lightly without burying
    crowns.


    ✂️ Propagation:

    Sow seed with cold-moist stratification or direct-sow in fall. Division is difficult due to taproot—prefer seed for large
    areas. Cut old stems in late winter if tidy gardens matter; otherwise leave for insects.


    🌾 Harvest / Best Use Timing:

    Cut flowering stems for dried arrangements when color holds along the spike. Leave seed heads for finches. Bloom peaks
    in late warm season when many early flowers have retired.'
  purpose: '- Pollinator: Late-season nectar supports bees and butterflies during a critical energy window.

    - Wildlife Attractor: Seeds feed birds; standing stems shelter beneficial insects if not mowed flat.

    - Ornamental: Tall purple wands add rhythm between grasses and shorter forbs.

    - Erosion Control: Taproot anchors dry, disturbed slopes better than shallow annuals.'
  companions:
  - Little Bluestem — drought-class grass matrix sharing sun and drainage
