  description: "Tree collards are perennial leafy greens belonging to the Brassica
    family, closely related to traditional collards and kale. They can grow over 1.8
    meters (6 feet) tall, developing into tall, spindly plants with few leaves if
    left unpruned. The leaves are large, crinkly, and range in color from blue-green
    to purple, depending on the variety. Tree collards are known for their mild flavor
    and are a reliable source of nutritious greens year-round.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefer full sun but can tolerate partial shade.\n-
    Thrive in well-drained, loamy soil rich in organic matter.\n- Require consistent
    moisture; approximately 2.5 cm (1 inch) of water per week.\n\n✂️\U0001FAD8 Methods
    to Propagate:\n- Cuttings: The most common method; take 15–20 cm (6–8 inch) cuttings
    from healthy plants and root them in soil or water.\n- Seeds: Less common due
    to potential variability; sow seeds 0.6–1.2 cm (0.25–0.5 inch) deep in nutrient-rich
    soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Harvest
    individual leaves when they reach 15–20 cm (6–8 inches) long.\n- Regular harvesting
    encourages bushier growth and prevents legginess.\n- Leaves can be harvested year-round,
    even after frost, which can enhance their sweetness."
  purpose: |-
    Tree collards serve multiple functions in a permaculture system:

    - Edible: Provide a continuous supply of nutritious leafy greens rich in vitamins A, C, and K.
    - Wildlife Attractor: Flowers attract pollinators such as bees and butterflies, enhancing biodiversity.
    - Mulcher: Fallen leaves contribute organic matter to the soil, improving fertility and structure.
    - Dynamic Accumulator: Deep roots draw up nutrients like calcium and potassium, enriching the topsoil.
    - Erosion Control: Extensive root systems help stabilize soil, reducing erosion on slopes.
    - Animal Fodder: Leaves can be used as nutritious feed for livestock.
    - Border Plant: Can be used to define garden boundaries and create windbreaks.
