  description: 'Virginia rose (Rosa virginiana) is a native eastern North American rose forming upright to arching canes with
    pink fragrant flowers in summer and red hips persisting into winter. Plants reach 3–6 feet (0.9–1.8 m), often in moist
    to average soils at meadow edges. Hips support teas and jellies where processing respects tannins; petals flavor syrups
    on unsprayed plants.


    ☀️💧 Sun and Water Requirements:

    Full sun to light partial shade; best flowering with strong light. Average to moist, well-drained soils suit it; tolerates
    clay if drainage moves. Mulch during establishment.


    ✂️ Propagation:

    Hardwood cuttings in dormancy; stratified seed for diversity. Renewal-prune old canes after several years.


    🌾 Harvest / Best Use Timing:

    Gather hips when fully red and slightly soft—process for tea or jelly. Peak bloom tracks mid-summer warmth.'
