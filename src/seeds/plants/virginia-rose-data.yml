  practitioner_notes: 'Rosa virginiana likes moisture honesty more than pasture rose cousins—site accordingly or accept pouty
    canes.

    Hips need processing respect—raw crunch punishes impatient tasters.

    Japanese beetles throw petal parties—hand-pick at dusk or deploy nematodes thoughtfully.

    Arching canes root at tips sometimes—edit colonies before they annex the path.'
