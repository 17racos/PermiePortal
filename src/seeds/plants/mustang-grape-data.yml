  description: "Mustang grape (Vitis mustangensis) is a high-climbing deciduous
    vine native to the south-central United States and adjacent northeastern Mexico,
    common in woodland margins and sandy soils. Leaves are thick, often slightly white
    beneath, and fruit clusters bear small dark berries with a tart, musky flavor
    that cooks into jelly better than it eats out of hand. It is a resilient native
    grape for trellises, living pergolas, and wildlife corridors where European wine
    grapes struggle with humidity and disease.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun for heaviest fruiting; tolerates partial shade with fewer clusters.\n-
    Drought tolerant once established in deep sand; young vines need regular water.\n-
    Well-drained to sandy-loam soils; tolerates poor rocky ground if roots can run.\n\n✂️
    Propagation:\n- Hardwood cuttings taken in dormancy, callus in moist medium, pot
    before spring flush.\n- Layering low canes to soil in early spring; sever when
    rooted.\n- Seeds require cold-moist stratification and years to fruit—clonal
    methods are practical.\n\n🌾 Harvest / Best Use Timing:\n- Pick fruit when fully
    colored and slightly soft, usually mid to late summer into early autumn by climate.\n-
    Heat with sugar and strain for jelly, syrup, or wild-ferment experiments—skins
    are tannic.\n- Prune in winter to limit weight on supports and improve air circulation."
  purpose: |-
    - Edible: Small berries yield tart juice and preserves after cooking and sweetening.
    - Wildlife Attractor: Fruit feeds birds and mammals; dense growth shelters nesting songbirds.
    - Shade Provider: Thick summer canopy cools patios, livestock pens, and west walls when trained overhead.
  companions:
  - Sand Live Oak — sturdy limbs support heavy vine weight along fencerows
