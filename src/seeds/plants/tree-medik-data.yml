  description: "Tree Medick (*Medicago arborea*) is an evergreen shrub native to the
    Mediterranean Basin, typically growing between 1 to 2 meters (3.3 to 6.6 feet)
    in height, with some specimens reaching up to 4 meters (13 feet). It features
    silvery-white stems that are soft to the touch and trifoliate leaves with obovate
    leaflets. The plant produces clusters of pale yellow flowers from February to
    April, followed by coiled seed pods. Tree Medick thrives in dry, rocky habitats
    with calcareous soils and is known for its nitrogen-fixing capabilities, enriching
    the soil in which it grows.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nPropagation
    is typically done through seeds, which should be inoculated with appropriate Rhizobium
    bacteria to ensure effective nitrogen fixation. Seeds can be sown directly into
    well-draining soil in a sunny location. Alternatively, propagation can be achieved
    through semi-hardwood cuttings taken in late summer.\n\n\U0001F31E\U0001F4A7 **Sun
    and Water Requirements:**\nTree Medick requires full sun exposure and prefers
    well-drained, calcareous soils. It is highly drought-tolerant once established
    and does not require frequent watering. Overwatering or poorly drained soils can
    lead to root rot.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E **When to Harvest:**\nWhile
    not commonly harvested for direct human consumption, Tree Medick can be pruned
    to provide high-protein forage for livestock, especially during late winter and
    spring when other forage options may be limited."
  purpose: |-
    - **Nitrogen Fixer:** Through symbiosis with Sinorhizobium meliloti bacteria, Tree Medick enriches soil nitrogen content, benefiting surrounding plants.
    - **Animal Fodder:** The foliage serves as nutritious forage for livestock, particularly in arid regions where other forage is scarce.
    - **Soil Improvement:** Its deep root system enhances soil structure and organic matter content, improving soil fertility.
    - **Erosion Control:** The extensive root network stabilizes soil, making it effective for erosion control on slopes and degraded lands.
    - **Ornamental:** With its attractive silvery foliage and yellow flowers, Tree Medick is used as an ornamental plant in gardens and landscapes.
