  description: 'Tree Medick (*Medicago arborea*) is an evergreen shrub native to the Mediterranean Basin, typically growing
    between 1 to 2 meters (3.3 to 6.6 feet) in height, with some specimens reaching up to 4 meters (13 feet). It features
    silvery-white stems that are soft to the touch and trifoliate leaves with obovate leaflets. The plant produces clusters
    of pale yellow flowers from February to April, followed by coiled seed pods. Tree Medick thrives in dry, rocky habitats
    with calcareous soils and is known for its nitrogen-fixing capabilities, enriching the soil in which it grows.


    ✂️🫘 **Methods to Propagate:**

    Propagation is typically done through seeds, which should be inoculated with appropriate Rhizobium bacteria to ensure
    effective nitrogen fixation. Seeds can be sown directly into well-draining soil in a sunny location. Alternatively, propagation
    can be achieved through semi-hardwood cuttings taken in late summer.


    🌞💧 **Sun and Water Requirements:**

    Tree Medick requires full sun exposure and prefers well-drained, calcareous soils. It is highly drought-tolerant once
    established and does not require frequent watering. Overwatering or poorly drained soils can lead to root rot.


    🧑‍🌾👩‍🌾 **When to Harvest:**

    While not commonly harvested for direct human consumption, Tree Medick can be pruned to provide high-protein forage for
    livestock, especially during late winter and spring when other forage options may be limited.'
