  description: 'Syzygium smithii is a lilly pilly species from eastern Australia, commonly used for hedges and small-tree
    screens, with small glossy leaves, white fluffy flowers, and edible pink to purple fruit when fully ripe. Plants range
    from large shrubs to trees around 20–35 feet (6–10.5 m) depending on pruning and cultivar. It suits humid subtropical
    food forests where psyllid-resistant selections are chosen and myrtle rust policies are monitored.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright partial shade; densest hedges in strong light with steady moisture. Rich, well-drained soils suit it;
    mulch to buffer roots in heat. Short drought once established shows as tip burn—irrigate during dry spells for fruit.


    ✂️ Propagation:

    Sow fresh seed; semi-hardwood cuttings for hedge lines. Shear hedges after flowering flushes; thin interiors periodically
    for airflow.


    🌾 Harvest / Best Use Timing:

    Pick fruit when soft and fully colored—process into jams where tartness is managed. Peak loads track warm wet periods.'
