  description: |-
    Arrowleaf balsamroot (Balsamorhiza sagittata) is a taprooted perennial sunflower relative of western North American mountains and steppes. Basal rosettes carry large, arrow-shaped, often fuzzy leaves, while spring stems push showy yellow daisy flowers that feed early pollinators; deep roots can exceed several feet and stabilize rocky slopes.

    subtropical and tropical Americas are outside its comfort zone for in-ground culture—low-elevation heat and relentless humidity invite rot and misery. Treat it as a specialty container or cool microclimate experiment (shade cloth, excellent drainage, deliberate dry-down) rather than a default food-forest staple in the subtropical/tropical core.

    ☀️💧 Sun and Water Requirements:
    - Full sun in climates where summers are not tropical saunas; in Florida trials, bright morning sun with afternoon protection is saner.
    - Sharp drainage; drought-tolerant once established—wet feet in humid air is how optimism dies.

    ✂️ Methods to Propagate:
    - Seeds: fall sow outdoors in cold frames where winters exist; in warm zones, moist-cold stratify then sow cool.
    - Division is possible but resents root disturbance—only for skilled hands with a sharp spade and low expectations.

    🌾 Harvest / Best Use Timing:
    - Traditional edible use targets roots and young leaves with cultural knowledge—do not freestyle without documentation.
    - For seed saving, collect when heads dry and goldfinches have had their share—share the tax.
  purpose: |-
    Where it can be grown honestly, balsamroot is an early-succession pollinator anchor on tough ground.

    - Edible: Roots and young leaves have documented food use in western Indigenous traditions—respect and cite sources.
    - Pollinator: Early yellow rays feed bees and flies when little else is loud.
    - Wildlife Attractor: Seeds feed birds; foliage hosts herbivores in native food webs.
    - Erosion Control: Deep taproot grips lean, rocky soils that shallow-rooted ornamentals abandon.
    - Ornamental: Big leaves and bold flowers sell the “western spring” aesthetic—if your climate agrees.
  companions:
