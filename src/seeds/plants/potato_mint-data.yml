  description: "Potato Mint is a fast-growing, herbaceous perennial with sprawling
    growth, forming a dense ground cover. It produces round, edible tubers underground
    and has mint-like, aromatic leaves with a slightly fuzzy texture. The plant is
    easy to cultivate in warm climates, tolerating a variety of soil types. It is
    primarily grown for its tubers, which are used as a starchy vegetable in various
    cuisines.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nPotato Mint thrives
    in full sun to partial shade and prefers well-drained, loamy soil. It requires
    regular watering but does not tolerate waterlogged conditions. Mulching helps
    retain moisture and improve soil quality.\n\n✂️\U0001FAD8 Methods to Propagate:\nThe
    plant is propagated through tubers or stem cuttings. Tubers can be planted directly
    in the soil, spaced 30 cm (12 inches) apart. Stem cuttings root easily when placed
    in moist soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nTubers
    are ready for harvest 5-7 months after planting when the foliage begins to yellow
    and die back. Carefully dig up the tubers, cure them for a few days, and store
    them in a cool, dry place."
