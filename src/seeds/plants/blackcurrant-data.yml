description: |-
  Blackcurrant (Ribes nigrum) is a deciduous shrub native to Europe and parts of northern Asia. It typically grows about 1–1.5 m (3–5 ft) tall and forms dense canes topped with fragrant leaves and clusters of dark berries. In permaculture, blackcurrant earns its spot as a reliable small-structure plant: it gives edible fruit, supports beneficial insects with early blooms, and leaves behind prunable wood and leaf litter that feed the soil cycle.

  Full sun to partial shade; some afternoon shade helps reduce heat stress. Water consistently during fruit development; drought can reduce berry size. Prefers rich, well-drained soil with organic matter; avoid soggy beds. Hardy across cool temperate zones, but avoid planting where summers are scorching and dry.

  Cuttings: take hardwood or semi-hardwood cuttings in dormancy or after leaf-out; rooting commonly takes 6–10 weeks with steady moisture. Layering: bend a low cane to the ground and keep it in contact with moist soil until it roots (often 2–3 months). Seeds: sow cold-stratified seeds; germination may take weeks to a few months.

  Harvest berries when fully black and flavorful; pick in rounds because ripeness changes across clusters. Use fresh, freeze for later, or process into syrups, sauces, and preserves. Leaves can be dried for tea-style infusions, but start small and only with proper plant identification.
purpose: |-
  Edible: Ribes nigrum yields tart black berries high in vitamin C for jam, cordial, and freezer batches when the cluster ripens unevenly across the bush.
  Medicinal: Dark skins and seeds carry anthocyanins and polyphenols used in concentrated syrups and teas where growers already meter sugar load and serving size like other tart small fruits.
  Wildlife Attractor: Early yellow-green racemes pull bees in cool spring; ripe strings feed birds fast unless you net the ends you mean to keep.
  Border Plant: Woody canes sprout from the base so you can renew a low screen by removing old wood without replanting the whole line.
