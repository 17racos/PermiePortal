  description: "Frost grape (Vitis vulpina) is a high-climbing native grape of eastern
    and central North America, with shredding bark, broad leaves, and small blue-black
    berries that hang late into cool season—hence the common name. Fruit is tart and
    seedy but useful for jelly, juice trials, and wildlife buffets; it is not a table
    grape without breeding and sugar. The vine fits food forest edges, riparian corridors,
    and trellis systems where Japanese beetles are a tax you already budgeted.\n\n
    ☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best fruiting in canopy
    gaps with strong light. Prefers moist, fertile, well-drained soils along woods
    edges and streams; tolerates periodic drought once deep roots establish. Avoid
    root drowning in compacted swales. Hardy through cold-temperate winters; late
    frosts can nip tender shoots in unpredictable springs.\n\n✂️ Propagation:\nHardwood
    cuttings taken in dormancy root under humidity and bottom heat.\nLayer long canes
    to soil to start new crowns on fence lines.\n\n🌾 Harvest / Best Use Timing:\n
    Pick clusters after the first light frosts sweeten berries slightly, or when birds
    schedule their own harvest. Process quickly into juice or jelly; seeds are honest
    about existing. Prune hard in dormancy to maintain airflow and reduce fungal load."
  purpose: |-
    - Edible: Late berries suit jelly, juice, and small-batch ferments with added sugar.
    - Wildlife Attractor: Fruit feeds birds and mammals; foliage hosts grape-specialist insects in native food webs.
    - Erosion Control: Woody stems stabilize fence lines and rough banks when allowed to climb.
    - Mulcher: Large leaves drop abundantly, feeding soil biology in woodland edges.
