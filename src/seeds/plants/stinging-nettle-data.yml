  description: "Urtica dioica is nature's spicy spinach: nutrient-dense leaves and
    shoots if you cook or dry them, and microscopic hypodermic hairs if you brush
    them wrong. Loves rich, disturbed, moist soils — ditches, barnyards, and the edge
    of your compost pile all qualify. Florida and Puerto Rico: treat as a cool-season champion
    that may sulk in the dead of summer without shade and moisture.\n\n🌞💧 Sun and
    Water Requirements:\n- Part sun to light shade in hot climates; tolerates more
    sun where summers are mild.\n- Consistent moisture; classic riparian / fertile
    bottomland energy.\n- Nitrogen-happy soil — think compost, not sand starvation.\n\n✂️🌱
    Methods to Propagate:\n- Root divisions in cool weather relocate clumps fast.\n-
    Seeds: tiny; surface sow or lightly cover in moist flats.\n- It self-sows where
    happy; contain if your HOA has opinions.\n\n🧺 When to Harvest:\n- Young tops
    before flowering, with gloves; blanch, steam, or dry to neutralize the sting."
  purpose: |-
