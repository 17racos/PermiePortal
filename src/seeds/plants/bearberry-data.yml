  description: 'Bearberry (Arctostaphylos uva-ursi) is a prostrate evergreen ericaceous subshrub of northern and montane regions,
    rooting where stems touch soil and forming mats of small, leathery leaves. Pink urn-shaped flowers yield red mealy berries
    beloved by bears and birds; height is typically under roughly 12 inches in spread forms.


    subtropical and tropical Americas are mostly outside its happy thermal envelope—Panhandle pockets and cool high-elevation
    Puerto Rican sites are the only semi-plausible in-ground conversation; lowland tropical heat invites slow death unless
    you treat it as a refrigerated bonsai joke. Lead with acidity, drainage, and airflow if you insist.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light shade in cool climates; in marginal warm trials, morning sun only.

    - Acidic, gritty, perfectly drained soil; bearberry despises summer wet feet in heat—think alpine ethics, not swale life.


    ✂️ Methods to Propagate:

    - Softwood cuttings with bottom heat in late spring—slow but true for clones.

    - Layering stems pinned to grit in autumn—lets the plant do the patience work.


    🌾 Harvest / Best Use Timing:

    - Berries ripen late summer to fall in native ranges; flavor is mealy-tart—jams and experiments, not candy.

    - Leave a share for wildlife wherever the plant actually fruits—ego versus ecology.'
  purpose: 'Bearberry is acid-soil ground armor for cold worlds; respect its limits elsewhere.


    - Edible: Berries are food for humans where tradition exists—modest yields, honest calories for wildlife first.

    - Wildlife Attractor: Grouse, bears, and thrushes map to berries in native biomes—your patio may disappoint them.

    - Ground Cover: Evergreen mat excludes weeds on lean, sunny banks that lawn cultists fear.

    - Erosion Control: Fine roots stabilize gravelly slopes where deeper rooted shrubs cannot thread.

    - Ornamental: Red stems and wintergreen leaves sell the northern rock garden aesthetic—if humidity agrees.'
  companions:
  - Blueberry — shared ericaceous pH and mycorrhizal culture; stagger heights for light.
  - Rhododendron — taller acid-soil anchor that casts light shade matching bearberry’s montane ethics.
  - Cranberry — bog cranberry shares low pH values; keep bearberry on the drier berm above the bog if you mix both.
  cautions:
