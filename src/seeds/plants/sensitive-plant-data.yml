scientific_name: Mimosa pudica
aka:
- Shameplant
- Touch-me-not
- Humble plant
family: Fabaceae
zone: 9-11
ideal_temp_min: 70
ideal_temp_max: 90
min_temp: 32
max_temp: 100
perennial: true
layers:
