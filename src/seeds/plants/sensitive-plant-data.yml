  description: |-
    Sensitive plant is the drama queen of the legume world: brush a leaflet and it folds like you insulted its thesis. Low, branching, slightly prickly stems; fluffy pink powder-puff flowers. In subtropical Florida it can self-seed and spread—charming in a pot, potentially rude in a native planting if you let it run wild.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; leggy shade makes it look even more pathetic (in the botanical sense).
    - Evenly moist, well-drained soil; tolerates brief dry downs but sulks in drought.

    ✂️ Methods to Propagate:
    - Seeds: scarify or soak warm water, sow after frost danger; fast in heat.
    - Cuttings: take semi-hardwood tips in warm weather, keep humidity high until rooted.

    🌾 Harvest notes:
    - Not a food crop for most people—this entry is about soil, pollinators, and curiosity, not salad.
  purpose: |-
    - Nitrogen Fixer: Legume nodules quietly feed the soil biota while you play with the leaves.
    - Soil Improvement: Fast cover on disturbed ground if you manage spread.
    - Wildlife Attractor: Flowers for small pollinators when allowed to bloom.
    - Ornamental: Instant party trick for kids and skeptical in-laws.
  companions:
  - Sunflower
  - Basil
  - Low-growing herbs that do not mind occasional shade
  avoid:
  - Letting it escape into conservation areas where it competes with natives
  - Overwatering heavy clay that never dries
  pests:
