  description: 'Partridge pea is a native annual legume with feathery leaves, yellow flowers freckled with red, and pods that
    rattle like tiny maracas. It colonizes disturbed sand and roadsides across the Southeast—including subtropical and tropical
    Americas—fixing nitrogen while feeding bees and caterpillars. Not a lawn monoculture plant; think pollinator strips, food
    forest edges, and “stop mowing this sandhill” experiments.


    ☀️💧 Sun and Water Requirements:

    - Full sun; blooms thin out fast in shade.

    - Sandy, well-drained soils preferred; drought-tolerant once seedlings establish—classic Florida sandhill attitude.


    ✂️ Methods to Propagate:

    - Seeds: scarify or winter-sow; self-sows freely where happy—manage if you do not want a yellow takeover.

    - Direct sow after last frost when soil warms.


    🌾 Harvest notes:

    - Ecological harvest: seed for next year’s strips; not a primary human food crop in most gardens.'
  purpose: '- Nitrogen Fixer: Fast cover that feeds the next succession without asking for a fertilizer sermon.

    - Wildlife Attractor: Pollen and nectar for native bees; host plant relationships for certain insects—learn your local
    lists.

    - Soil Improvement: Biomass and nodulation on poor ground.

    - Ground Cover: Temporary cover on disturbed zones while slower perennials establish.'
