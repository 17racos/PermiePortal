  description: 'Partridge pea is a native annual legume with feathery leaves, yellow flowers freckled with red, and pods that
    rattle like tiny maracas. It colonizes disturbed sand and roadsides across the Southeast—including subtropical and tropical
    Americas—fixing nitrogen while feeding bees and caterpillars. Not a lawn monoculture plant; think pollinator strips, food
    forest edges, and “stop mowing this sandhill” experiments.


    ☀️💧 Sun and Water Requirements:

    - Full sun; blooms thin out fast in shade.

    - Sandy, well-drained soils preferred; drought-tolerant once seedlings establish—classic Florida sandhill attitude.


    ✂️ Methods to Propagate:

    - Seeds: scarify or winter-sow; self-sows freely where happy—manage if you do not want a yellow takeover.

    - Direct sow after last frost when soil warms.


    🌾 Harvest notes:

    - Ecological harvest: seed for next year’s strips; not a primary human food crop in most gardens.'
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: Partridge pea is a native annual legume with feathery leaves, yellow flowers freckled with red, and pods that rattle like tiny maracas. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Wildlife Attractor: Partridge Pea layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Soil Improvement: Partridge Pea accelerates tilth gains when residues and roots are planned into rotations instead of left as accidental thatch -- accelerates organic matter and biology gains in tired beds when managed as part of a rotation
    Ground Cover: Partridge Pea carpets soil fast enough to smother early weeds while feeding surface roots and arthropods -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
