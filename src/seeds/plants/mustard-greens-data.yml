  description: |-
    Mustard greens (Brassica juncea) are leafy brassicas grown for peppery-tasting leaves used in salads, sautés, and quick cooked dishes. They form rosettes of textured leaves and can be harvested young for tender flavor. In permaculture, they matter because they add fast nutrition while also functioning as a pest-aware crop in brassica rotations, giving you an opportunity to manage insect cycles instead of blindly feeding them. Plants commonly reach 20–60 cm (8–24 in) depending on variety and harvest style.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for fastest leaf growth; partial shade helps slow bolting.
    - Water consistently; drying makes leaves harsher and triggers earlier flowering.
    - Prefers fertile, well-drained soil amended with compost.
    - Avoid waterlogged beds that invite rot and disease.
    
    ✂️ Propagation:
    - Seeds: direct-sow in cool weather; germination often takes 4–7 days when moisture is steady.
    - Succession sow: repeat every 1–2 weeks to keep harvest continuous and avoid one big bolting panic.
    - Thin early so plants have room for leaf expansion instead of skinny competition.
    
    🌾 Harvest / Best Use Timing:
    - Harvest leaves when young and tender; cut outer leaves for a “cut-and-come-again” cycle.
    - For milder flavor, harvest earlier and keep soil moisture even.
    - When plants bolt, you can still harvest tender flower shoots or switch to a warm-season crop.
