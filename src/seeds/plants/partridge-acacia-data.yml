  description: 'Partridge acacia here maps to sweet acacia (Vachellia farnesiana), a fragrant-flowered, often multi-trunked
    leguminous tree or large shrub of warm drylands. Ferny foliage and golden puffball flowers perfume late winter and spring;
    thorns remind mammals that shortcuts have consequences. Height is commonly 15–25 feet but responds to drought and pruning
    like a stoic comedian.


    subtropical and tropical Americas: At home on sandy, well-drained sites from Florida scrub edges to Puerto Rico’s drier
    coasts; intense humidity plus heavy clay invites root rot and drama—berm, drain, and stop loving it with sprinklers.


    ☀️💧 Sun and Water Requirements:

    - Full sun for dense growth and floral honesty; shade produces lanky, offended teenagers.

    - Drought-tolerant once established; deep soak occasionally, not daily misting cosplay.


    ✂️ Propagation:

    - Scarify seeds, soak overnight, sow warm; inoculate with compatible rhizobia if your soil is suspiciously sterile.

    - Transplant young seedlings with minimal root disturbance; larger specimens sulk and send invoices.


    🌾 Harvest / Best Use Timing:

    - Flowers are perfumery crop in some regions—harvest ethically without stripping every branch like a clearance sale.

    - Prune for structure after main bloom if you need clearance; avoid butcher cuts that open large wounds before wet seasons.'
  purpose: |-
    Nitrogen Fixer: Vachellia farnesiana nodulates on lateral roots, feeding understory pigeon pea and prickly pear with fixed N on lean calcareous sand -- interplant on berms so irrigation hits feeder roots without drowning the crown.
    Wildlife Attractor: Golden puffball inflorescences perfume late winter air for honeybees and native bees; legume pods feed quail and doves when left un-mowed -- expect caterpillar loads on feathery bipinnate leaves that songbirds pick clean.
    Windbreaker: Open, fine-textured canopy trims desiccating coastal trades above cactus understory while letting enough light through for agaves to keep color -- not a dense wind wall like live oak, more a filtered baffle.
    Border Plant: White-thorned multi-trunks knit livestock-proof edges along arid fencelines when trained young -- plan access gates wide because mature arms weep low and still poke curious calves.
  companions:
  - Pigeon Pea — fast legume chop-and-drop on the sunny margin; keep offset so mature acacia roots do not file harassment
    claims.
  - Agave — succulent skirt that respects dry shade and reflects heat; shallow roots avoid taproot trench warfare.
  - Desert Ironwood — long-lived neighbor for layered desert canopy; ironwood’s mass complements acacia’s perfume and lighter
    frame.
