  practitioner_notes: |-
    The same tree base that fruited last October will fruit again — mark locations
    and check after the first sustained cool rain of fall rather than hoping to
    stumble onto them.
    Morning harvest holds moisture and texture; afternoon heat after a cool night
    steals shelf life fast — bring a cooler if you are hiking to a spot.
    Outdoor cultivation patches need 1-3 years before expecting reliable flushes;
    do not disturb the colonized zone and do not mow over the root zone.
    Indoor blocks require long colonization runs and cool fruiting triggers that
    Florida kitchens do not naturally provide — a temperature-controlled space is
    not optional here.
    Trim base cleanly; leave the attached mycelial mat in place — it is the perennial
    structure that drives future flushes.
