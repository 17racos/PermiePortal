  description: "Passiflora edulis is the tropical passion fruit vine — the one
    producing the wrinkled purple or yellow fruit sold in markets worldwide. Native
    to southern Brazil, Paraguay, and northern Argentina, it climbs aggressively
    by tendrils to 15–20 ft (4.5–6m) and flowers prolifically in warm climates.
    The intricate white and purple flowers are among the most structurally complex
    in the plant kingdom and attract bees, wasps, and hummingbirds. Fruit ripens
    when it drops or the skin wrinkles — tart, aromatic pulp with edible seeds.\n\n
    ☀️💧 Sun and Water:\n- Full sun required for flowering and fruiting; part shade
    reduces yield significantly.\n- Regular moisture during establishment and flowering;
    drought-tolerant once established but consistent irrigation improves fruit set.\n\n
    ✂️ Propagation:\n- Seeds: fresh seed germinates readily; older seed benefits
    from scarification and 24-hour soak.\n- Cuttings: semi-hardwood cuttings root
    easily in warm humid conditions — faster to fruit than seed.\n- Layering works
    well where stems touch moist soil.\n\n🌾 Harvest / Best Use Timing:\n- Fruit
    is ripe when it falls naturally or skin wrinkles and turns deep purple.\n- Pick
    daily during peak season — fruit left on ground deteriorates quickly.\n- Pulp
    and seeds eaten fresh, juiced, or used in desserts and drinks."
  purpose: |-
    Productive tropical vine for warm climates:

    - Edible: Tart aromatic pulp eaten fresh or juiced; seeds edible; flowers edible raw.
    - Medicinal: Traditional use as mild sedative and anxiolytic; leaves used in herbal preparations — research interactions before use.
    - Pollinator: Complex flowers require buzz pollination; specialist bee magnet.
    - Wildlife Attractor: Flowers feed bees and hummingbirds; foliage hosts Gulf Fritillary and Zebra Longwing butterfly larvae.
    - Ornamental: Extraordinary flower structure makes it a conversation plant on any trellis or fence.
  companions:
  - Banana
  - Comfrey
  - Lemongrass
  cautions:
  - Frost sensitive — hard freeze kills the vine; roots may not survive below 28°F (-2°C)
  - Aggressive grower — can overtake small shrubs if not managed
  - Not the same as Maypop (Passiflora incarnata) which is cold-hardy to zone 5
  pests:
  - Aphids
  - Whiteflies
  - Spider Mites
  - Caterpillars
  practitioner_notes: |-
    Plant on a sturdy trellis from day one — a cattle panel or heavy wire works better than PVC in wind.
    Gulf Fritillary and Zebra Longwing butterflies will use it as a host plant; this is a feature not a bug.
    In zone 9b expect die-back in cold winters — the roots often survive and resprout in spring.
    Two plants cross-pollinate better than one for fruit set.
    Fruit drops when ripe — check daily during peak season or you will find it on the ground half eaten.
  growth_habit: Woody perennial vine
  data_quality_score: 0.9
