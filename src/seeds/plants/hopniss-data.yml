  description: |-
    Hopniss is the native legume vine that grows underground tubers like a survivalist pantry — strings of starchy nodules, pink pea flowers, and a climbing habit that wants sun for beans but shade for soil moisture politeness. Florida and Puerto Rico: fine in 8b/9a riparian edges with structure to climb.

    ☀️💧 Sun and Water Requirements:
    - Full sun for flowering and tuber yield if roots stay moist.
    - Rich, moist, loamy soil wins; drought makes small tubers and grudges.
    - Provide trellis, shrubs, or corn — classic Three Sisters teammate.

    ✂️ Methods to Propagate:
    - Tubers: plant chain segments in spring like potato eyes with ambition.
    - Seeds: scarify; slower than tubers but expands genetics.
  purpose: |-
