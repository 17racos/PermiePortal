  description: 'Syzygium luehmannii is the riberry tree, an Australian rainforest margin species grown for small crimson fruit
    with clove-cinnamon aromatics used in sauces, jams, and boutique drinks. Plants reach 20–40 feet (6–12 m) in humid subtropical
    climates, with glossy foliage and flaky bark on older trunks. It belongs in bird-friendly food forests and specialty orchards
    where myrtle rust regulations still permit planting.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright partial shade; afternoon shade reduces tip burn in hot districts. Rich, well-drained soils with steady
    moisture through the warm wet season and irrigation in dry spells support fruit sizing. Wind protection helps large leaf
    canopies.


    ✂️ Propagation:

    Sow fresh seed promptly; air-layer or graft selections with superior fruit chemistry. Prune for clearance and hedge form
    as needed.


    🌾 Harvest / Best Use Timing:

    Pick when color and aroma peak—process quickly. Peak loads track local heat and rainfall cycles.'
