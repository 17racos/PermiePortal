  description: "Bok Choy (Brassica rapa subsp. chinensis) is a fast-growing, cool-season leafy green vegetable commonly used\
    \ in Asian cuisine. It forms loose, upright rosettes with dark green, tender leaves and thick, crunchy white stems. Depending\
    \ on the variety, it can grow between 15–45 cm (6–18 inches) in height.\n\nBok Choy thrives in well-drained, fertile soil\
    \ and is best grown in spring and fall to avoid bolting in hot weather. It is highly nutritious, rich in vitamins A, C,\
    \ and K, and is a good source of calcium and antioxidants. The plant is commonly grown in vegetable gardens, raised beds,\
    \ and containers.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade.\n\
    - Requires well-drained, nutrient-rich soil with consistent moisture.\n- Needs regular watering; avoid water stress to\
    \ prevent premature bolting.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct sow in early spring or late summer\
    \ for fall crops.\n- Transplants: Start seeds indoors 4–6 weeks before the last frost and transplant outdoors when seedlings\
    \ are 10 cm (4 inches) tall.\n- Regrowing: Can be regrown from cut bases placed in water until roots develop.\n\n\U0001F9D1\
    ‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Baby Bok Choy can be harvested as early as 30 days after planting.\n\
    - Full-size plants are ready in 45–60 days.\n- Outer leaves can be harvested individually, or the entire plant can be\
    \ cut at the base."
