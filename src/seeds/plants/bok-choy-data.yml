  practitioner_notes: 'Bolts fast when nights stay above roughly 75°F (24°C) or days stretch—switch to heat-tolerant types
    or grow as microgreens in summer.

    Row cover from transplant skips a generation of flightless moths landing eggs; remove for pollination only if you let
    plants bolt on purpose.

    Harvest wet outer leaves at dawn for market crunch; midday heat wilts stems before you reach the kitchen.

    Regrowing bases in water is a stunt for a week or two—plant into soil once roots show or flavor goes bland.'
