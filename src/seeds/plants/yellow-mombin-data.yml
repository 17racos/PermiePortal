  description: 'Yellow mombin (Spondias mombin) is a tropical deciduous tree from Mexico through northern South America and
    the Caribbean, bearing dense sprays of small yellow fruit with tart-sweet pulp used fresh, in drinks, and in preserves.
    Trees reach 30–50 feet (9–15 m), often broad-crowned and briefly leafless before flowering. It extends the Spondias toolkit
    alongside red mombin for staggered harvest personalities in warm orchards.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; juveniles accept partial shade. Deep, fertile, well-drained soils with irrigation through
    pronounced dry seasons prevent fruit drop. Wind protection helps heavy-cropping branches.


    ✂️ Propagation:

    Graft selections for fruit quality; seedlings vary. Prune after harvest for structure.


    🌾 Harvest / Best Use Timing:

    Pick clusters when fruit yellows and yields slightly—process quickly; thin skins invite rapid spoilage. Peak loads track
    tropical wet-dry calendars, not temperate months.'
  purpose: '- Edible: Small yellow fruit diversifies beverages and preserves where acid balances sugar.

    - Wildlife Attractor: Flowers and fruit engage birds and insects where sharing is planned.

    - Shade Provider: Broad crown shelters understory during wet-season leaf cover.

    - Windbreaker: Rows blunt steady winds on exposed tropical lots.'
