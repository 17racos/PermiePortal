  description: "Tangelo (Citrus × tangelo) is a mandarin–grapefruit class hybrid grown for large, easy-peel fruit with sweet–tart
    juice and a memorable neck on classic ‘Minneola’ types. Evergreen trees resemble other mid-sized citrus: glossy foliage,
    fragrant blooms, and heavy spring bee traffic. It shines in humid subtropical home orchards where winter color breaks line
    up with holiday harvest windows and kitchen demand for something louder than a plain sweet orange.\n\n☀️💧 Sun and Water
    Requirements:\n- Full sun for size, sugar, and peel texture; shaded sides yield lopsided flavor.\n- Even moisture in
    well-drained soil; avoid chronic wet feet that invite root rot.\n- Protect blooms and young fruit from hard freezes; thin
    rinds can scar in wind if canopies are open.\n\n✂️ Propagation:\n- Grafted nursery trees preserve hybrid traits and precocity.\n-
    Seeds are unreliable for matching known hybrids—treat seedlings as experiments.\n- Topwork only with compatible citrus stock
    and clean cuts.\n\n🌾 Harvest / Best Use Timing:\n- Pick when flavor peaks; some types hold on-tree quality for a window,
    not forever.\n- Clip stems to reduce peel tears that invite decay.\n- Juice soon after harvest; aromatics fade faster than
    acid in storage."
