scientific_name: Avena sativa
aka: []
family: Poaceae
zone: 3-7
ideal_temp_min: 45
ideal_temp_max: 75
min_temp: -30
max_temp: 0
perennial: true
layers:
- Herbaceous
plant_function:
- Animal Fodder
- Mulcher
- Erosion Control
description: |-
  Oat (Avena sativa) is a cool-season cereal grown for grain, straw, and fast ground coverage as a cover crop. It forms upright stems topped with oat heads and creates a dense mat of biomass that can be chopped, grazed, or left to decompose. In permaculture, it matters because it turns short cool-season windows into soil protection and nutrient cycling: the canopy shields the ground, residues feed soil life, and rotations with legumes keep fertility managed instead of purchased.

  - Full sun for best growth; light shade reduces biomass and stand density.
  - Moderate water during germination and early development; once established it tolerates typical cool-season rainfall.
  - Prefers well-drained soil with compost and steady organic matter.
  - Avoid long waterlogged periods that invite root and crown problems.

  - Seeds (spring sow): direct-seed after soil is workable; germination often occurs in 4–7 days.
  - Seeds (fall cover): sow before winter to establish green cover; expect regrowth in spring.
  - Sow thick if your goal is ground coverage; thin if you want grain.

  - Grain: harvest when heads are mature and kernels are dry and hard.
  - Straw/mulch: cut or mow when plants are mature but before full senescence to keep residues breakdown-friendly.
  - Green fodder: harvest young growth for fresh feed-style use when appropriate.
purpose: |-
  Animal Fodder: Soft-dough Avena sativa hay cut in boot to early-dough stage feeds dairy and poultry through cool seasons when C₄ pastures are dormant -- whole-crop silage also works where you need fermentable fiber without maize heat units.
  Mulcher: Carbon-heavy oat straw from combine aftermath or mowing lays winter armor over vegetable beds -- residues tie up surface nitrogen briefly, so pair termination timing with the next nitrogen-fixing cover or compost layer.
  Erosion Control: Fibrous crown and fine roots knit bare soil after summer vegetables finish, catching autumn rains on slopes -- thick broadcast seeding closes canopy before winter sheet flow carves gullies in naked beds.
companions:
- Crimson Clover (Trifolium incarnatum) — adds nitrogen to pair with oat’s carbon-heavy
  straw residues.
- Radish (Raphanus sativus) — roots help loosen soil so residues break down with better
  aeration.
- Garlic (Allium sativum) — supports rotation timing in beds and helps diversify bed
  scent in mixed plots.
cautions:
- Rotate oats with non-grasses; continuous cereal planting increases disease and pest
  buildup.
pests:
- Aphids
- Borers
- Root Rot
- Caterpillars