    edge species. Root tea and safrole chemistry got tangled in regulatory theater
    — do your own homework before marketing 'traditional' beverages.\n\n🌞💧 Sun
    and Water Requirements:\n- Full sun to part shade; tolerates forest edge life.\n-
    Prefers moist, fertile, well-drained soils but handles lean sand better than
    pampered exotics.\n- Drought tolerance improves with age.\n\n✂️🌱 Methods to
    Propagate:\n- Root suckers transplant if you tame the taproot ego.\n- Seeds need
    prompt sowing; viability drops if they desiccate.\n\n🧺 When to Harvest:\n- Young
    leaves for filé (dried, powdered sassafras leaf in gumbo tradition) where culturally
    and legally appropriate — not a medical prescription, just kitchen anthropology."
