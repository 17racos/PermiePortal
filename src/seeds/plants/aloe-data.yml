  description: "Aloe vera is a succulent plant forming a rosette of lance-shaped,
    fleshy leaves with serrated edges. The leaves are green to gray-green and can
    grow up to 60 cm (24 inches) long. Mature plants produce a tall spike of tubular
    yellow or orange flowers. Aloe vera is renowned for the gel contained within its
    leaves, which has various medicinal and cosmetic applications. The gel is composed
    of water, vitamins, enzymes, and amino acids, giving it anti-inflammatory, antimicrobial,
    and wound-healing properties. Aloe thrives in sandy, well-drained soils and can
    survive in arid conditions due to its water-retentive leaves.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nAloe vera prefers bright, indirect sunlight but
    can tolerate some direct sun. It requires well-drained soil and should be watered
    deeply but infrequently, allowing the soil to dry out between waterings to prevent
    root rot. Overwatering is a common cause of failure.\n\n✂️\U0001FAD8 **Methods
    to Propagate:**\nAloe vera is easily propagated by:\n- **Offsets (Pups):** Small
    offshoots that grow at the base can be removed and replanted.\n- **Leaf Cuttings:**
    Although less common, leaf cuttings can be used but have a lower success rate
    due to high moisture content.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E **When
    to Harvest:**\nAloe leaves can be harvested year-round, but it's best to wait
    until the plant is mature (usually 2-3 years). Harvest the outer leaves by cutting
    them at the base, allowing the plant to continue growing."
