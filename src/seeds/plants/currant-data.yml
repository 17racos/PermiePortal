  practitioner_notes: |-
    Mulch lightly and keep moisture consistent through berry sizing; dry swings turn into sour fruit.
    Prune for airflow; dense canes hold humidity and invite fungal problems.
    If you want bigger clusters, thin lightly instead of just hoping harder.
