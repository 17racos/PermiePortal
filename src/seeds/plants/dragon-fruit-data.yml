  description: |-
    Dragon fruit (Hylocereus undatus) is a vigorous climbing cactus native to tropical regions of the Americas and widely cultivated in warm climates. It produces long, segmented stems that use support and form airy, branching growth that can reach several meters when trained. The fruits are edible and sweet when ripe, and in permaculture they matter because a trellised cactus gives you shade-filtered vertical structure plus a high-value fruit harvest from a heat-loving plant that hates soggy feet.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; more light supports faster growth and better fruiting.
    - Water regularly during active growth, then reduce to drought-tolerant levels after establishment.
    - Prefers fast-draining, gritty soil; roots rot when kept wet.
    - Avoid frost; cold damages tender stem tissue even if the plant survives.
    
    ✂️ Propagation:
    - Stem cuttings: take healthy segments, let the cut end callus (often 3–7 days), then plant in dry-ish mix until new growth appears (usually 3–8 weeks).
    - Seeds: sow warm and keep evenly moist; germination can be slow and seedlings take time to fruit.
    
    🌾 Harvest / Best Use Timing:
    - Harvest fruit when the skin color deepens and the fruit feels slightly soft; pick in dry, cool parts of the day.
    - Eat fresh, blend into smoothies, or freeze pulp for later.
    - Train and prune after fruiting so new growth forms in the next season.
  purpose: |-
    Edible: Sweet fruits are a compact, high-yield harvest that plugs into fruit-forest calendars.
    Medicinal: Traditional use highlights antioxidant-rich fruit components; in permaculture it’s a functional food-plus-herbal option.
    Pollinator: Cactus flowers produce nectar and draw nocturnal pollinators, supporting ecosystem resilience around your trellis.
  companions:
  - Aloe (Aloe vera) — shares the “dry feet” principle and benefits from gritty soil and trellis microclimate.
  - Ginger (Zingiber officinale) — thrives in warm, sheltered understories while dragon fruit offers partial shade.
  - Banana (Musa acuminata) — provides tall windbreak and leaf litter to enrich understory while you train the cactus upward.
  cautions:
  - Avoid overwatering; consistently wet soil triggers root and stem rot.
  - Expect thorns on older segments; harvest carefully to avoid injuries and stem damage.
  practitioner_notes: |-
    Train the stems early and keep support contact consistent; janky trellises slow fruiting.
    Let cuttings callus—rushing into wet soil turns a cutting into a rot experiment.
    Fruit ripeness is mostly color plus feel; use the “slightly giving” test.
  pests:
  - Aphids
  - Spider Mites
  - Scale Insects
  - Root Rot
