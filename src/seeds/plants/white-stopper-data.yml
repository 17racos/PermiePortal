  description: "White stopper (Eugenia axillaris) is an evergreen shrub to small tree of coastal strands, hammocks, and limestone\
    \ margins in the Caribbean and humid subtropical Gulf–Atlantic coastal plain where hardy. Small opposite leaves, peeling\
    \ bark on older trunks, and white flowers followed by dark berries make it a backbone native for hedges, bird gardens,\
    \ and salt-tolerant windbreak understory. It tolerates pruning and shapes well for formal native screens.\n\n☀️\U0001F4A7\
    \ Sun and Water Requirements:\n Full sun to bright part shade; densest hedge in sun. Well-drained soils are essential;\
    \ tolerates coastal wind and light salt spray once established. Moderate drought tolerance after rooting; irrigate young\
    \ plants through dry seasons. Avoid chronic waterlogging without aeration.\n\n✂️ Propagation:\nSow fresh seed soon after\
    \ cleaning; germination can be irregular. Semi-hardwood cuttings under mist in warm months root for clones. Transplant\
    \ during warm wet weather; mulch to suppress competing vines.\n\n\U0001F33E Harvest / Best Use Timing:\nBerries are eaten\
    \ by birds; human use is minor and ID-dependent. Clip hedge faces after flowering if formal shape matters, or wait until\
    \ post-fruiting to preserve bird calories."
