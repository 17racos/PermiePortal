  description: "Peanut butter fruit tree (Bunchosia argentea) is a small evergreen
    tree or large shrub from Central and northern South America, often kept under
    about 10–15 feet in cultivation but capable of growing larger in the wild. It
    has glossy, simple leaves and clusters of small yellow flowers followed by oval
    red-orange drupes; the ripe pulp is soft and famously smells and tastes reminiscent
    of peanut butter or dried figs, with a sticky sweetness.\n\n☀️💧 Sun and Water
    Requirements:\n- Full sun to light shade for best flowering and fruit set; protect
    young plants from harsh midday sun until established.\n- Likes steady moisture
    in subtropical and tropical Americas’s humid warm season; use well-drained soil and reduce
    watering briefly in the coolest, drier months to avoid soggy roots.\n\n✂️ Methods
    to Propagate:\n- Seeds: clean fresh seed, sow in warm (75–85°F) moist mix; germination
    can be slow and irregular—patience helps.\n- Cuttings: semi-hardwood cuttings
    in late warm season, kept humid and warm, root for genetically identical clones
    of a good-tasting selection.\n\n🌾 When to Harvest:\n- Pick fruit when fully colored
    and slightly soft; flavor peaks at full ripeness. In tropical and subtropical frost-free
    sites, harvest may repeat across much of the year with peaks after rainy-season
    flushes."
  purpose: |-
    In a food forest or home orchard, peanut butter fruit tree layers in as a small tree or accent shrub.

    - Edible: The sweet-aromatic fruit is eaten fresh or used in spreads and desserts where a novelty crop is welcome.
    - Pollinator: Small flowers draw bees and other insects during bloom, supporting guild diversity.
    - Wildlife Attractor: Fruit feeds birds and small mammals; plant where you accept some sharing.
    - Ornamental: Glossy foliage and showy fruit make it a useful visual anchor in a mixed border.
    - Shade Provider: Modest canopy shades understory herbs and young plants during intense subtropical sun.
