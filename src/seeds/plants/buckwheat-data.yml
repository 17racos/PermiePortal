  description: "Buckwheat is a fast summer annual with heart-shaped leaves, white
    to pinkish flowers that honeybees mob, and triangular \"groats\" that are not
    a true cereal but behave like one in the kitchen. It smothers weeds, pulls phosphorus,
    and finishes before frost if you time sowing right.\n\nNorth Florida: excellent
    cover between spring and fall crops; sow after soil warms. It will decline once
    nights stay tropical-hot unless you keep moisture up.\n\nSun and water: Full sun;
    loamy, well-drained soil; keep moist during establishment, somewhat drought-tolerant
    once rooted. Poorly drained fields invite root rots.\n\nPropagation: Direct seed
    broadcast or drill; do not transplant—life is too short. Turn under before hard
    seed set if you do not want volunteer buckwheat forever."
  purpose: |-
    Smother crop, bee pasture, and emergency grain/greens; breaks disease cycles
    when rotated with solanums. The flowers smell like old honey and hot metal—in
    the best way.
