  description: "Buckwheat is a fast summer annual with heart-shaped leaves, white
    to pinkish flowers that honeybees mob, and triangular \"groats\" that are not
    a true cereal but behave like one in the kitchen. It smothers weeds, pulls phosphorus,
    and finishes before frost if you time sowing right. Excellent
    cover between warm-season crops; sow after soil warms. It will decline once
    nights stay tropical-hot unless you keep moisture up.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun;
    loamy, well-drained soil; keep moist during establishment, somewhat drought-tolerant
    once rooted.\nPoorly drained fields invite root rots.\n\n✂️ Propagation:\n\nDirect seed
    broadcast or drill; do not transplant—life is too short.\nTurn under before hard
    seed set if you do not want volunteer buckwheat forever.\n\n🌾 Harvest / Best Use Timing:\n\nCut or incorporate at bloom peak for green manure; harvest grain/greens before hard frost if you are eating or seed-saving—timing ties to your rotation goals."
  purpose: |-
    - Edible: Emergency grain and greens; triangular groats behave like pseudo-cereal in the kitchen.
    - Green Manure: Smother crop that breaks disease cycles when rotated with solanums and pulls phosphorus.
    - Pollinator: White to pinkish flowers that honeybees mob; nectar pulse smells like old honey and hot metal—in the best way.
    - Wildlife Attractor: Dense bloom supports broader insect traffic during the short flowering window.
