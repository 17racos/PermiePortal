  practitioner_notes: |-
    Flowers inside about six weeks from sowing—time plantings so bloom overlaps your target cash crop’s pollination gap.
    Incorporate before seeds mature or you will grow a volunteer buckwheat farm next season; cut at white petal peak for cleanest kill.
    Honeybees work it hard midday; short bloom means nectar is a pulse, not a month-long buffet.
    Acid-loving follow crops love the residue—avoid following with crops that hate rapid residue decay without extra nitrogen buffer.
