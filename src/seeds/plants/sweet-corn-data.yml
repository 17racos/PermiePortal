  companions:
  - Beans (Phaseolus vulgaris) — helps support nitrogen in companion-style planting for corn systems.
  - Sunflower (Helianthus annuus) — provides additional pollinator nectar and layered canopy structure.
  - Cucumbers (Cucumis sativus) — ground-cover and trellis timing can reduce bare soil between corn rows.
  cautions:
  - Avoid planting corn where you’ll have persistent waterlogging; root stress shows quickly.
  practitioner_notes: |-
