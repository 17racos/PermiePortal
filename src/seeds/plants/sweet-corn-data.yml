  description: |-
    Sweet corn (Zea mays) is a warm-season cereal grown for its immature ears harvested as sweet kernels. It originates from the Americas and is widely cultivated across the entire temperate-to-tropical range where summer heat is sufficient. Plants typically grow 1–3 m (3–10 ft) tall with strong stalks and tassels/pollinating structures. In permaculture, sweet corn matters because it provides high-output edible harvest in summer while also producing large biomass residues that become mulch and animal feed after the harvest cycle ends. Dense corn stands can also reduce soil erosion during warm-season storms when fields otherwise get bare.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun is essential; corn needs long bright days to fill ears.
    - Water consistently during tasseling and ear development; drought during this period reduces kernel sweetness and size.
    - Prefers fertile, well-drained soil with compost.
    - Avoid waterlogged soils; roots need oxygen.
    
    ✂️ Propagation:
    - Seeds (direct sow): sow in warm soil after frost danger; germination often occurs in 5–10 days.
    - Plant in blocks (not single rows) to ensure wind pollination.
    - Succession sow: plant multiple small batches for a longer harvest window.
    
    🌾 Harvest / Best Use Timing:
    - Harvest ears when silk is brown and kernels are plump and milky; check every day near expected maturity.
    - Pick early in the day for best sweetness and texture.
    - Use husks and stalks for compost/mulch after harvest; also suitable for fodder in some systems.
  purpose: |-
