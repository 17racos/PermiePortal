  description: 'Purple chokeberry (Aronia prunifolia) is a deciduous shrub of eastern North American wetlands and moist thickets,
    bearing white spring flowers, glossy summer leaves, and dark purple to black astringent berries prized for juices and
    jellies after processing. Plants typically reach 6–10 feet (1.8–3 m), often suckering into bird-friendly colonies. It
    belongs in rain-garden backs, hedgerows, and any moist border where native fruit chemistry meets human patience.


    ☀️💧 Sun and Water Requirements:

    Full sun to light partial shade; best fruit color in sun with adequate moisture. Prefers moist, acidic, well-drained soils;
    tolerates seasonal wet feet better than many fruit shrubs. Mulch with organic matter; avoid drought baking on sandy sites
    without irrigation.


    ✂️ Propagation:

    Sow stratified seed; suckers transplant in early spring. Softwood cuttings root under humidity. Prune out old canes after
    several years to renew fruiting wood and reduce crowding.


    🌾 Harvest / Best Use Timing:

    Pick berries when fully dark and slightly soft; process into juice with sugar balance—raw handfuls punish casual tasters.
    Leave some fruit for birds if hedgerow ethics matter. Peak ripeness follows late warm-season heat, not a single calendar
    week.'
