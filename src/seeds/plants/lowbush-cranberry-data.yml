  description: "Lowbush cranberry (Vaccinium oxycoccos) is a dwarf evergreen cranberry of cold bogs, fens, and acidic wetlands across northern regions, with wiry stems, tiny leaves, and tart red berries smaller than commercial cranberry but beloved by foragers and birds. Mats creep low over sphagnum. It belongs in bog gardens, constructed wetlands with ethics, and restoration—not in a dry raised bed next to rosemary.\n\n☀️💧 Sun and Water Requirements:\nFull sun in cool climates; partial shade where summer heat spikes. Constantly moist, acidic, organic soils with high water table or irrigation mimicry; tolerates true bog chemistry. Alkaline tap water is slow death—design water sources accordingly.\n\n✂️ Propagation:\nLayer stems onto moist peat; hold until rooted. Sow seed after cold stratification; slow. Divide small mats carefully with minimal root desiccation.\n\n🌾 Harvest / Best Use Timing:\nBerries ripen late in the short season; pick after full color for sauce and drying. Leave fruit for wildlife if harvest pressure is already high on the site. Do not drain wetlands to farm cranberries—ethics and law both frown."
  purpose: |-
    - Edible: Tart berries process like cranberries where patience beats industrial scale.
    - Wildlife Attractor: Berries feed birds and mammals in northern bog systems.
    - Ground Cover: Evergreen mat knits sphagnum surfaces where other crops rot or pout.
    - Ornamental: Tiny leaves and red fruit reward bog-garden nerds who kneel with hand lenses.
  companions:
  - Lingonberry — related Ericaceous species for garden culture comparisons at bed edges with pH control
  - Highbush Cranberry — taller fruiting shrub upland of bog zone only if moisture gradient is real
  - Yarrow — insectary forb on drier bog margins where drainage begins—do not shade the mat
  cautions:
  - Hot dry summers — fails outside boreal band; accept limits or build serious bog infrastructure
  - Wetland regulations — wild harvest and planting may need permits; ignorance is not a strategy
  pests:
  - Spider Mites
  - Aphids
  practitioner_notes: |-
