  description: 'Lowbush cranberry (Vaccinium oxycoccos) is a dwarf evergreen cranberry of cold bogs, fens, and acidic wetlands
    across northern regions, with wiry stems, tiny leaves, and tart red berries smaller than commercial cranberry but beloved
    by foragers and birds. Mats creep low over sphagnum. It belongs in bog gardens, constructed wetlands with ethics, and
    restoration—not in a dry raised bed next to rosemary.


    ☀️💧 Sun and Water Requirements:

    Full sun in cool climates; partial shade where summer heat spikes. Constantly moist, acidic, organic soils with high water
    table or irrigation mimicry; tolerates true bog chemistry. Alkaline tap water is slow death—design water sources accordingly.


    ✂️ Propagation:

    Layer stems onto moist peat; hold until rooted. Sow seed after cold stratification; slow. Divide small mats carefully
    with minimal root desiccation.


    🌾 Harvest / Best Use Timing:

    Berries ripen late in the short season; pick after full color for sauce and drying. Leave fruit for wildlife if harvest
    pressure is already high on the site. Do not drain wetlands to farm cranberries—ethics and law both frown.'
