    and thirst-quenching rather than intensely sweet. It wants monsoon humidity and
    frost-free years.\n\nFlorida: common in tropical and subtropical zones landscapes; marginal and
    angry north of roughly 10a except in greenhouse cosplay. Psyllids love myrtaceae—expect
