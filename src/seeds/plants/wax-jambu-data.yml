  description: 'Wax jambu is a tropical myrtle relative with glossy leaves, fluffy cream flowers, and bell-shaped, waxy fruit
    in white, pink, or red—crisp, mild, and thirst-quenching rather than intensely sweet. It wants monsoon humidity and frost-free
    years.


    Common in tropical landscaping; marginal and angry north of roughly 10a except in greenhouse cosplay.

    Psyllids love myrtaceae—expect pitted leaves and learn your IPM.


    ☀️💧 Sun and Water Requirements:


    Full sun for fruit; deep, fertile, well-drained soil with steady moisture; wind protection reduces leaf tatter.


    ✂️ Propagation:


    Seeds (variable); air layering; grafting superior cultivars. Buy named types if you want predictable fruit size and color.


    🌾 Harvest / Best Use Timing:


    Pick bells when waxy skin colors and flesh is still crisp—mild thirst-quencher, not a sugar bomb.'
  purpose: '- Edible: Crisp backyard snack fruit—living water balloon more than candy.

    - Ornamental: Fluffy flowers and glossy myrtle canopy for smaller yards.

    - Wildlife Attractor: Birds audit crops—plant enough to share.

    - Shade Provider: Compact tree throws light shade once trained.'
