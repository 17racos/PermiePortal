  description: "Sugar hackberry (Celtis laevigata) is a medium to large deciduous tree
    of river bottoms, bottomland woods, and humid subtropical lowlands across the
    southeastern United States into parts of Mexico and the Caribbean rim where hardy.
    Mature trees develop light gray, often warty bark and a rounded crown casting
    dappled shade; small sweet drupes feed migrating songbirds and mammals. It is
    a workhorse native canopy for windbreaks, riparian buffers, and heat-tolerant
    urban plantings.\n\n☀️💧 Sun and Water Requirements:\nFull sun for best form and
    fruiting; tolerates partial shade as a younger tree in mixed woods. Prefers deep,
    moist soils but accepts periodic drought once roots are established; handles short
    inundation typical of floodplain pulses. Tolerates alkaline conditions better
    than many eastern hardwoods.\n\n✂️ Propagation:\nSow fresh cleaned seed immediately
    or cold-moist stratify; germination improves after passing through bird guts in
    the wild—mimic with scarification tests. Transplant liners in cool wet weather.
    Air-layering is possible but uncommon; grafting is rare for landscape use.\n\n
    🌾 Harvest / Best Use Timing:\nFruit is thin-fleshed but edible when fully dark;
    mostly leave for wildlife. Collect fallen twigs for mushroom logs only from healthy
    trees. Prune for clearance in late winter; avoid heavy summer cuts that stress
    drought-stressed specimens."
  purpose: |-
    - Wildlife Attractor: Copious small fruits fuel birds during migration; caterpillars of hackberry specialists feed higher trophic levels.
    - Erosion Control: Extensive roots stabilize banks during floodplain rise and fall.
    - Shade Provider: Open canopy gives high shade without deep gloom—useful over shade-tolerant understory crops.
    - Mulcher: Annual leaf drop feeds soil food web and buffers soil temperature.
    - Ornamental: Warty bark and fine twigs add character to native-designed street and park plantings.
  companions:
  - American Beautyberry — shrub layer beneath open canopy; fruit display for birds at two heights
  - Switchgrass — warm-season matrix along wet margins; filters runoff before it hits the trunk zone
  - Elderberry — quick fruiting shrub at sunny edges; shares wet-foot tolerance without root-graft issues of oaks
  cautions:
  - Hackberry nipple gall — cosmetic leaf bumps from insects; usually harmless to tree vigor
  - Surface roots — mulch a wide ring instead of mowing tight against the trunk
  pests:
  - Scale Insects
  - Japanese Beetles
  practitioner_notes: |-
