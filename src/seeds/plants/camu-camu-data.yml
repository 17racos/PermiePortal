  description: 'Camu camu is the Amazonian myrtle that fruits in floodplain energy—sour cherry-sized berries with vitamin
    C numbers that make supplement grifters sweat. In cultivation it behaves as a multi-stemmed riverine shrub to small tree.


    Marginal. Loves humidity and acidic soils; cold tolerance is not its brand. Serious growers use greenhouse or the warmest
    coastal microclimates.


    ☀️💧 Sun and Water Requirements:


    Full sun to bright part shade.

    High water table tolerance compared to desert fruit; still needs drainage between flood pulses—potted growers mimic wet/dry
    rhythm carefully.


    ✂️ Propagation:


    Seeds (short viability—fresh is best); air-layering for known selections.


    🌾 Harvest / Best Use Timing:


    Pick sour green fruit for peak vitamin C or riper purple fruit for easier eating—timing follows juice versus fresh-use
    goals.'
  purpose: |-
    Edible: Myrciaria dubia sour cherry-sized berries juice into extremely acidic vitamin C–rich drinks, syrups, and powders when picked green for peak acid or riper purple for softer eating.
    Wildlife Attractor: Myrciaria dubia clusters along river margins draw birds, bats, and insects to sweet-tart fruit that ripens during flood pulses in native Amazonian rhythms.
    Erosion Control: Myrciaria dubia multi-stemmed roots grip silty banks and pond edges in acidic wet soils where it tolerates seasonal inundation better than upland fruit trees.
