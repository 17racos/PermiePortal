  description: "Camu camu is the Amazonian myrtle that fruits in floodplain energy—sour
    cherry-sized berries with vitamin C numbers that make supplement grifters sweat.
    In cultivation it behaves as a multi-stemmed riverine shrub to small tree.\n\nMarginal. Loves humidity and acidic soils; cold tolerance
    is not its brand. Serious growers use greenhouse or the warmest coastal microclimates.\n\nSun
    and water: Full sun to bright part shade. High water table tolerance compared to
    desert fruit; still needs drainage between flood pulses—potted growers mimic wet/dry
    rhythm carefully.\n\nPropagation: Seeds (short viability—fresh is best); air-layering
    for known selections."
