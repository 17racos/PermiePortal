  description: "Juçara is the southern Brazilian sister to açaí (**Euterpe oleracea**):
    a slender clustering palm with pinnate leaves, hanging inflorescences, and edible
    purple fruit pulp—when you can beat the pests and humidity to harvest. Wild
    populations have been hammered by illegal palm-heart cutting; sustainable cultivation
    matters.\n\nIn Florida, treat like other tropical understory palms: frost-free,
    humid, shaded when young. Not a subtropical and tropical Americas staple unless you have a conservatory
    and a humidity kink.\n\nSun and water: Bright shade to partial sun as juvenile;
    more sun in cloud-forest humidity. Rich, organic, well-drained but moist soil;
    never dry to wilting for long.\n\nPropagation: Fresh seed in warm, humid media;
    divisions of clustering stems on mature clumps (specialist work). Patience measured
    in years."
  purpose: |-
    Subcanopy palm for tropical food forests; superfood fruit in the right climate;
    ornamental texture. If someone offers you \"sustainable\" palm heart from wild
