  description: "Juçara is the southern Brazilian sister to açaí (**Euterpe oleracea**):
    a slender clustering palm with pinnate leaves, hanging inflorescences, and edible
    purple fruit pulp—when you can beat the pests and humidity to harvest. Wild
    populations have been hammered by illegal palm-heart cutting; sustainable cultivation
    matters.\n\nTreat like other tropical understory palms: frost-free,
    humid, shaded when young. Not an outdoor staple in cool subtropical areas unless you have a conservatory
    and reliable humidity.\n\n☀️💧 Sun and Water Requirements:\n\nBright shade to partial sun as juvenile;
    more sun in cloud-forest humidity.\nRich, organic, well-drained but moist soil;
    never dry to wilting for long.\n\n✂️ Propagation:\n\nFresh seed in warm, humid media;
    divisions of clustering stems on mature clumps (specialist work). Patience measured
    in years.\n\n🌾 Harvest / Best Use Timing:\n\nFruit pulp when clusters ripen; palm-heart harvest kills that stem—if someone offers you \"sustainable\" heart from wild juçara, ask rude questions."
