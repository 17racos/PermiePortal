  description: "Pigeonwood (Trema orientalis) is a fast-growing, broadly distributed
    tropical and subtropical tree found from Africa through Asia and islands of the
    Pacific; it colonizes disturbed ground and forest edges. It has simple alternate
    leaves with serrated margins, small greenish flowers, and tiny drupes that birds
    devour; mature height is often 20–40 feet but can be larger in ideal conditions,
    with a light canopy that closes gaps quickly.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun to partial shade; pioneers open sites and tolerates competition as a
    nursery tree.\n- Drought-tolerant once established but responds to seasonal rains;
    in Florida and Puerto Rico’s wet season ensure drainage on heavy clay to reduce
    root stress in prolonged saturation.\n\n✂️ Methods to Propagate:\n- Seeds: abundant
    from bird-dispersed fruit; sow fresh seed in warm moist mix for high germination.\n-
    Root suckers: appears naturally from roots near the parent—dig and transplant
    suckers in early wet season with some roots attached.\n\n🌾 Best Use Timing:\n-
    Often managed as chop-and-drop biomass during the warm growing season when growth
    is rapid; leave some trees to mature for wildlife and shade. Thin before crowns
    overtake slower fruit trees if used in a successional alley."
  purpose: |-
    Pigeonwood is a classic pioneer species in humid tropical and subtropical systems.

    - Wildlife Attractor: Fruit feeds pigeons, doves, and many other birds; supports rapid food-web turnover on new ground.
    - Biomass: Fast soft wood and leafy growth supply mulch and quick organic matter.
    - Erosion Control: Aggressive roots stabilize bare soil on cuts and fills after disturbance.
    - Animal Fodder: Leaves are browsed by livestock where local practices allow; verify palatability for your stock.
    - Mulcher: Leaf litter and prunings break down quickly, feeding soil life under young plantings.
