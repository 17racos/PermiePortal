  description: |-
    Cattail is the swamp multitool: edible shoots, pollen pancakes if you are ambitious, and dense rhizomes that stabilize muck while filtering water like a grumpy intern. In subtropical and tropical Americas it dominates ditches, pond margins, and anywhere society forgot drainage. Harvest only from clean water — cattails are not a heavy-metal detox strategy, they are a sponge.

    ☀️💧 Sun and Water Requirements:
    - Full sun in shallow water or saturated margins; tolerates seasonal drawdowns.
    - Mucky, anaerobic soils are home; not a xeriscape flex.
    - Spreads by rhizome — contain with liners or accept wetland empire.

    ✂️ Methods to Propagate:
    - Rhizome division: move chunks in dormancy or early growth with mud attached.
    - Seeds: fluffy parachutes travel; sow in wet mud for experiments.
  purpose: |-
    Edible: Typha latifolia spring shoots, summer pollen, and starchy rhizomes become food only after ID checks and harvest from clean water because heavy metals concentrate in tissues from dirty ditches.
    Water Purifier: Typha latifolia floating-leaf stands trap silt and uptake dissolved nutrients in their rhizosphere so suspended solids drop -- managers still harvest biomass to export phosphorus instead of expecting endless sorption.
    Wildlife Attractor: Typha latifolia dense stems hide red-winged blackbirds, rails, and amphibians while seeds fluff feeds finches after heads brown in late fall marshes.
    Mulcher: Typha latifolia senesced leaves collapse into anaerobic muck that feeds detritivores and builds peat edges when cut material is rolled back into the wetland instead of bagging every stem.
