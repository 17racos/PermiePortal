  description: |-
    Cattail is the swamp multitool: edible shoots, pollen pancakes if you are ambitious, and dense rhizomes that stabilize muck while filtering water like a grumpy intern. In subtropical and tropical Americas it dominates ditches, pond margins, and anywhere society forgot drainage. Harvest only from clean water — cattails are not a heavy-metal detox strategy, they are a sponge.

    ☀️💧 Sun and Water Requirements:
    - Full sun in shallow water or saturated margins; tolerates seasonal drawdowns.
    - Mucky, anaerobic soils are home; not a xeriscape flex.
    - Spreads by rhizome — contain with liners or accept wetland empire.

    ✂️ Methods to Propagate:
    - Rhizome division: move chunks in dormancy or early growth with mud attached.
    - Seeds: fluffy parachutes travel; sow in wet mud for experiments.
  purpose: |-
    Cattail is infrastructure with calories:

    - Edible: Young shoots, pollen, and starchy rhizomes where water quality is verified.
    - Water Purifier: Rhizosphere traps sediments and nutrients — not magic, biomass cycling.
    - Wildlife Attractor: Cover and food for birds, amphibians, insects.
    - Mulcher: Dead leaves feed marsh detritus pathways.
  companions:
  - Pickerelweed
  - Duck potato
  - Water lily
  cautions:
  - Harvest from roadside ditches with mystery runoff
  - Small ornamental ponds without containment if you dislike monoculture
  pests:
