description: |-
  Dendrocnide moroides is the plant that turned “don’t touch the foliage” into performance art — silica hairs inject a neurotoxic-level sting stories are written about. This is Australian rainforest, not a subtropical and tropical Americas native. The entry exists as identification and caution: do not import, do not “prank” friends, do not confuse with harmless mulberry lookalikes if you travel. If you live where it is native, management is protective gear and respect, not permaculture whimsy.

  - Tropical understory to edge light; high rainfall climates.
  - Rich volcanic or alluvial soils in natural range.

  - Not recommended outside conservation or expert research contexts.

  subtropical and tropical Americas note: you are unlikely to plant this legally or wisely; know the photo so you do not hug the wrong continent’s leaves.

  - There is no human-use harvest window -- contact is the hazard; photography uses long lenses and sense.
  - Management timing in native range is protective gear and trained response, not kitchen prep.
  - If you encounter unfamiliar large-leaved rainforest trees while traveling, identify before touch -- this species is the argument for that habit.
purpose: |-
  Wildlife Attractor: Dendrocnide moroides heart-shaped leaves look temptingly mulberry-soft yet silica hairs inject potent neurotoxin-grade stings -- Australian rainforest insects still chew specialized tracks while mammals avoid foliage contact.
  Border Plant: In native Queensland understory it marks edges biologists survey with hazard tape, not hedging shears -- export bans exist because even dried specimens hospitalize the careless.
