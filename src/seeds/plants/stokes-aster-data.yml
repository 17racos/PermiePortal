  description: "Stokes aster (Stokesia laevis) is a low perennial wildflower of southeastern pine savannas and sandy soils,
    bearing large lavender-blue ray flowers that read ‘aster’ without the late-fall timing of many symphyotrichums. Rosettes
    of basal leaves push flowering stems in warm months, feeding native bees and butterflies with accessible pollen and nectar
    when massed. It tolerates heat and drought once established, making it a honest front-border plant for pollinator beds
    and dry rain gardens.\n\n☀️💧 Sun and Water Requirements:\n- Full sun to light shade; bloom declines in dim corners.\n-
    Well-drained sandy or sandy-loam soils; hates standing water.\n- Moderate moisture improves flower size; drought shrinks
    but rarely kills mature clumps.\n\n✂️ Propagation:\n- Divide basal clumps in early spring as new growth appears.\n- Root
    cuttings from basal offsets under humidity.\n- Seeds germinate warm; selections are often divided to preserve flower form.\n\n🌾
    Harvest / Best Use Timing:\n- Cut flowers for bouquets at early open for longest vase life.\n- Leave late blooms if seed
    feeding finches fits your site ethos.\n- Refresh tired clumps by division every few years to keep centers from going bald."
