  description: "Chia (Salvia hispanica) is an annual herbaceous plant native to central
    and southern Mexico and Guatemala. It typically grows up to 1 meter (3 feet) tall,
    featuring opposite lime-green leaves with serrated edges. The plant produces spikes
    of small blue, purple, or white flowers that are highly self-pollinating. Its
    tiny oval seeds, about 1 millimeter in diameter, are mottled in shades of brown,
    gray, black, and white. When soaked, these seeds form a mucilaginous gel.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nChia thrives in full sun and prefers well-drained
    soils. It is drought-tolerant once established but benefits from regular watering
    during germination and early growth stages.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation
    is primarily through seeds. Sow seeds directly into the soil after the last frost,
    ensuring they receive consistent moisture until germination.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nHarvest occurs approximately 100 to 150 days after planting,
    once the flowers have dried and seeds are easily shaken free."
  purpose: |-
    - **Edible:** Chia seeds are rich in omega-3 fatty acids, fiber, and protein, making them a nutritious addition to diets.
    - **Medicinal:** Traditionally used for their anti-inflammatory and antioxidant properties.
    - **Pollinator:** The flowers attract bees and other pollinators, supporting biodiversity.
    - **Wildlife Attractor:** Seeds and plants provide food for various wildlife species.
    - **Mulcher:** Chia plants can be used as green mulch to improve soil health.
    - **Dynamic Accumulator:** Accumulates nutrients, enhancing soil fertility.
    - **Erosion Control:** The dense growth habit helps prevent soil erosion.
    - **Animal Fodder:** Can serve as forage for livestock.
    - **Border Plant:** Suitable for creating borders in gardens due to its manageable size.
    - **Pest Management:** Emits essential oils that may repel certain insects.
    - **Biofuel:** Potential source of biofuel due to its oil-rich seeds.
    - **Ground Cover:** Provides effective ground cover, suppressing weeds and retaining soil moisture.
