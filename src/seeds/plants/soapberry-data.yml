description: |-
  Soapberry (Sapindus saponaria) is a deciduous tree from subtropical Americas, bearing compound leaves, small flowers, and translucent yellow berries rich in saponins that foam in water—hence traditional soap uses where knowledge is sound. Trees reach 30–50 feet (9–15 m), often along streams and limestone soils. It is not a snack tree—internal use of saponins is risky—but it excels as wildlife food, shade, and erosion control on tough sites.

  Full sun for dense crown and reliable fruiting. Well-drained soils from sandy to rocky limestone suit it; tolerates seasonal drought once established. Occasional deep watering speeds establishment; avoid waterlogging.

  Sow scarified seed after soaking until imbibed. Transplant young seedlings with root integrity. Prune for clearance under fruiting branches.

  Berries for soap demonstrations should use verified traditional methods—do not improvise ingestion. Wildlife harvest peaks when fruits ripen through warm months. Leaf drop follows dry-season cues in seasonal climates.
purpose: |-
  Wildlife Attractor: Sapindus saponaria amber drupes foam when crushed yet still fuel mockingbirds and mammals -- that handle the glycoside suite.
  Border Plant: Low-branching semi-evergreen outline marks limestone fencelines from Texas to Florida -- without demanding irrigation once taproots reach subsurface moisture.
  Erosion Control: Fibrous roots lace thin soil over karst rock -- backyard berms stop washing during summer cloudbursts once the root mat closes.
  Ornamental: Ferny bipinnate leaves flash light green against dark live oak canopies -- in subtropical mixed screens.
