  description: |-
    Alder here is the Eastern riparian workhorse Alnus serrulata — a nitrogen-fixing birch relative that laughs at wet feet while feeding streambanks. Catkins look like fuzzy earrings; roots partner with Frankia bacteria so you can stop pretending only legumes fix N. In subtropical and tropical Americas it lines seeps, pond edges, and stormwater cuts where "ornamental turf" would drown or lie. Other Alnus species exist; match site to native range.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade along wet edges.
    - Saturated to moist soils; tolerates seasonal flooding better than drought.
    - Not for dry sandhill unless you enjoy watching sticks die.

    ✂️ Methods to Propagate:
    - Seeds: needs moisture stratification; sow in wet media.
    - Hardwood cuttings: treated cuttings in humid conditions for some species; seed easier for serrulata in restoration contexts.
  purpose: |-
    Alder is wetland infrastructure with chemistry:

    - Nitrogen Fixer: Feeds successional plantings cheaply.
    - Wildlife Attractor: Seeds and cover for birds; early pollen for insects.
    - Erosion Control: Roots knit soggy banks.
    - Mulcher: Leaf litter feeds aquatic and riparian food webs.
    - Water Purifier: Riparian buffer strips intercept runoff when planted as bands.
