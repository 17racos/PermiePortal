  description: "Butterfly pea (Clitoria ternatea) is a twining legume vine from tropical and subtropical Asia, now widely
    grown across the Americas for electric-blue flowers, tender shoots, and protein-rich flowers used in drinks and rice
    coloring. Compound leaves and slender stems reach roughly 2–3 meters (6–10 feet) on a trellis in one warm season, with
    daily blooms that age from deep indigo toward violet. It earns a spot in food forests and kitchen gardens as a nitrogen
    partner, pollinator magnet, and conversation piece that still behaves like a crop if you harvest on a rhythm.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for heaviest flowering; light partial shade is tolerated in hottest subtropical
    summers.\n- Moderate water during establishment; somewhat drought-tolerant once roots run deep but not a desert specialist.\n-
    Well-drained, fertile loam suits it best; cold, wet crowns invite decline anywhere frost lingers.\n\n✂️ Methods to Propagate:\n-
    Seeds: nick or soak overnight, then sow after soil stays above roughly 65°F (18°C); germination often in 1–2 weeks in
    warm media.\n- Cuttings: semi-hardwood tips in warm wet season root quickly under humidity domes or mist.\n- Direct transplant
    of peat-grown seedlings once frost risk is past in marginal areas treated as annual production.\n\n🌾 Harvest / Best Use
    Timing:\n- Pick open flowers early in the day for peak color in teas and syrups; frequent picking extends the flush.\n-
    Young tips and small leaves can enter stir-fries like other legume greens where culinary tradition supports it.\n-
    Dry flowers on screens out of direct sun for pantry-stable dye jars through the off-season."
