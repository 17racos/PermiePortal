  description: "Butterfly pea (Clitoria ternatea) is a twining legume vine from tropical and subtropical Asia, now widely
    grown across the Americas for electric-blue flowers, tender shoots, and protein-rich flowers used in drinks and rice
    coloring. Compound leaves and slender stems reach roughly 2–3 meters (6–10 feet) on a trellis in one warm season, with
    daily blooms that age from deep indigo toward violet. It earns a spot in food forests and kitchen gardens as a nitrogen
    partner, pollinator magnet, and conversation piece that still behaves like a crop if you harvest on a rhythm.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for heaviest flowering; light partial shade is tolerated in hottest subtropical
    summers.\n- Moderate water during establishment; somewhat drought-tolerant once roots run deep but not a desert specialist.\n-
    Well-drained, fertile loam suits it best; cold, wet crowns invite decline anywhere frost lingers.\n\n✂️ Methods to Propagate:\n-
    Seeds: nick or soak overnight, then sow after soil stays above roughly 65°F (18°C); germination often in 1–2 weeks in
    warm media.\n- Cuttings: semi-hardwood tips in warm wet season root quickly under humidity domes or mist.\n- Direct transplant
    of peat-grown seedlings once frost risk is past in marginal areas treated as annual production.\n\n🌾 Harvest / Best Use
    Timing:\n- Pick open flowers early in the day for peak color in teas and syrups; frequent picking extends the flush.\n-
    Young tips and small leaves can enter stir-fries like other legume greens where culinary tradition supports it.\n-
    Dry flowers on screens out of direct sun for pantry-stable dye jars through the off-season."
  purpose: |-
    Butterfly pea slots into warm-climate guilds as a working vine, not just garnish:

    - Edible: Flowers and young growth contribute color, mild flavor, and protein to drinks and dishes where recipes call for them.
    - Medicinal: Traditional preparations use aerial parts in teas; modern claims vary—treat folklore as a map, not a prescription.
    - Nitrogen Fixer: Rhizobia in root nodules convert atmospheric nitrogen into forms neighboring plants can access through turnover and guild design.
    - Pollinator: Open, nectar-rich flowers draw bees and other daytime visitors during long bloom cycles.
    - Wildlife Attractor: Generalist pollinators and small beneficials visit dense floral canopies on trellis edges.
    - Dye Plant: Anthocyanins shift hue with pH, giving natural color to rice, drinks, and fibers without synthetic dyes.
    - Ornamental: Twining habit and saturated blooms verticalize fences, arbors, and porch rails in humid subtropical to tropical settings.
  companions:
  - Roselle — shares warm-season water and fertility without casting heavy shade if the vine runs the sunny face of the bed.
  - Malabar Spinach — another twiner for stacked vertical harvest on a sturdy shared trellis with staggered pick timing.
  - Sweet Potato — sprawling ground cover cools soil and suppresses weeds while the pea climbs where irrigation is coordinated.
  cautions:
  - Heavy self-seeding in frost-free years can demand deadheading if you dislike volunteers.
  practitioner_notes: |-
    Flowers fade from sapphire toward mauve naturally—if your product pitch needs neon forever, you are marketing against biology.
    Overfed vines push leaves over flowers; a leaner diet often reads as more blooms in humid tropics and subtropics.
    Rotate climbing supports every few years if old twine traps moisture against wood posts.
