description: |-
  Blue star creeper (Isotoma fluviatilis) is a low, mat-forming perennial used widely as a ground cover, with tiny green leaves and pale blue star-shaped flowers held just above the foliage. It spreads by slender runners and typically stays under about 10 cm (4 inches) tall, filling gaps between stepping stones, pond margins, or moist garden paths.

  Part sun to light shade in hot climates; more sun acceptable where summers are mild and soil stays moist. Consistently moist, well-drained soil is ideal; tolerates brief wet feet better than drought. In subtropical and tropical Americas, afternoon shade and mulch reduce stress in the dry season; irrigate during prolonged drought. Avoid baking on reflective hardscape without irrigation.

  Division: Tear or cut mats in spring or early wet season; replant pieces immediately and keep damp until rooted. Runners: Peg stems lightly into moist soil to layer; sever when rooted.

  Trim back ragged edges after heavy bloom or heat stress to refresh mats. Best establishment window is warm, humid months with reliable moisture.
purpose: |-
  Ground Cover: Isotoma fluviatilis runners root at every node, tolerating light foot traffic between pavers -- where thyme cooks off in reflected heat.
  Ornamental: Pale blue star flowers hover a centimeter above tiny leaves for months in moist part shade -- giving fine texture under ferns without woody shade.
  Pollinator: Minute sweat bees and hoverflies work the short tubes at ground level, a useful fill -- when taller meadow plants are still in bud.
  Water Retention: Living mats cap evaporation along pond lips and stepping-stone joints -- if irrigation keeps soil evenly damp through dry weeks.
