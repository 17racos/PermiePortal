  description: "Blue star creeper (Isotoma fluviatilis) is a low, mat-forming perennial
    used widely as a ground cover, with tiny green leaves and pale blue star-shaped
    flowers held just above the foliage. It spreads by slender runners and typically
    stays under about 10 cm (4 inches) tall, filling gaps between stepping stones,
    pond margins, or moist garden paths.\n\n🌞💧 Sun and Water Requirements:\n- Part
    sun to light shade in hot climates; more sun acceptable where summers are mild
    and soil stays moist.\n- Consistently moist, well-drained soil is ideal; tolerates
    brief wet feet better than drought. In subtropical and tropical Americas, afternoon shade
    and mulch reduce stress in the dry season; irrigate during prolonged drought.\n-
    Avoid baking on reflective hardscape without irrigation.\n\n✂️ Methods to Propagate:\n-
    Division: Tear or cut mats in spring or early wet season; replant pieces immediately
    and keep damp until rooted.\n- Runners: Peg stems lightly into moist soil to
    layer; sever when rooted.\n\n🌾 Harvest / Best Use Timing:\n- Trim back ragged
    edges after heavy bloom or heat stress to refresh mats. Best establishment window
    is warm, humid months with reliable moisture."
