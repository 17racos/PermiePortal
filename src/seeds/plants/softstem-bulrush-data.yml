  description: "Schoenoplectus tabernaemontani is the classic upright wetland sedge
    that softens pond edges and gives dragonflies something to posture on. Round stems
    (triangular would be a different drama), clumping habit, handles fluctuating water
    depths better than most ornamental grasses pretending to like wet feet. Native-friendly choice for swales, retention basins, and rain gardens
    with honest moisture.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to light
    shade.\nSaturated soils to shallow standing water — this is not a rock garden
    flex.\nTolerates brackish edges in some sites; check ecotype.\n\n✂️ Propagation:\n\nDivision of clumps during cool seasons.\nRhizome sections with
    buds.\n\n🌾 Harvest / Best Use Timing:\n\nEcological use — leave standing stems for overwintering
    insects unless you have a maintenance plan that replaces that habitat."
  purpose: |-
    Erosion Control: Softstem Bulrush networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Wildlife Attractor: Softstem Bulrush layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Water Purifier: Softstem Bulrush can sit inside constructed wetland edges or settlement plantings where roots and biofilm polish water before storage -- supports water-polishing goals in constructed wetlands or settlement tanks when scaled realistically

