common_name: Softstem Bulrush
picture: softstem_bulrush.webp
scientific_name: Schoenoplectus tabernaemontani
aka:
- Soft-stem bulrush
- Great bulrush (name soup — verify local keys)
family: Cyperaceae
zone: 4-11
ideal_temp_min: 45
ideal_temp_max: 90
min_temp: -30
max_temp: 105
perennial: true
layers:
- Aquatic
- Herbaceous
plant_function:
- Erosion Control
- Wildlife Attractor
- Water Purification
description: |-
  Schoenoplectus tabernaemontani is the classic upright wetland sedge that softens pond edges and gives dragonflies something to posture on. Round stems (triangular would be a different drama), clumping habit, handles fluctuating water depths better than most ornamental grasses pretending to like wet feet. Native-friendly choice for swales, retention basins, and rain gardens with honest moisture.

  Full sun to light shade.
  Saturated soils to shallow standing water — this is not a rock garden flex.
  Tolerates brackish edges in some sites; check ecotype.

  Division of clumps during cool seasons.
  Rhizome sections with buds.

  Ecological use — leave standing stems for overwintering insects unless you have a maintenance plan that replaces that habitat.
purpose: |-
  Erosion Control: Schoenoplectus tabernaemontani rhizomes armor pond shelves -- where wave fetch would otherwise undercut liner or clay caps.
  Wildlife Attractor: Round culms give dragonflies vertical perches above warm shallows -- while red-wing blackbirds weave nests into dense clumps.
  Water Purification: Oxygen leaking from roots fuels bacteria that settle suspended fines -- and strip dissolved nitrogen from stormwater cells before discharge.
companions:
- Pickerelweed
- Cattail
- Blue Flag Iris
cautions:
- Dry berms that only flood once a decade
- Chemical warfare on adjacent lawns washing into the planting
pests:
- Aphids
- Mealybugs
- Snails
