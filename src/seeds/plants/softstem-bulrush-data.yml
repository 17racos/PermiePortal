  description: "Schoenoplectus tabernaemontani is the classic upright wetland sedge
    that softens pond edges and gives dragonflies something to posture on. Round stems
    (triangular would be a different drama), clumping habit, handles fluctuating water
    depths better than most ornamental grasses pretending to like wet feet. subtropical and tropical Americas: native-friendly choice for swales, retention basins, and rain gardens
    with honest moisture.\n\n🌞💧 Sun and Water Requirements:\n- Full sun to light
    shade.\n- Saturated soils to shallow standing water — this is not a rock garden
    flex.\n- Tolerates brackish edges in some sites; check ecotype.\n\n✂️🌱 Methods
    to Propagate:\n- Division of clumps during cool seasons.\n- Rhizome sections with
    buds.\n\n🧺 When to Harvest:\n- Ecological use — leave standing stems for overwintering
    insects unless you have a maintenance plan that replaces that habitat."
  purpose: |-
