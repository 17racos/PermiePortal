  description: |-
    Sunn hemp (Crotalaria juncea) is a fast-growing warm-season legume cultivated as a green manure and soil-improving cover crop. Native to warm tropical and subtropical regions, it is widely used because it establishes quickly, produces abundant biomass, and enriches soil fertility through nitrogen-fixing roots. Plants typically reach 1–2.5 m (3–8 ft) tall with upright stems and yellow to golden flowers. In permaculture, sunn hemp matters because it turns heat-driven “idle soil” into a nitrogen-rich mulch system that protects the surface and improves the next planting window.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for fastest growth; shade slows it down dramatically.
    - Moderate water helps germination and early establishment; once established it tolerates warm-season drought well.
    - Prefers well-drained soil; waterlogged beds reduce performance.
    - Dislikes cold snaps; cold can stall growth or kill young stands.
    
    ✂️ Propagation:
    - Seeds (warm sow): direct-seed in late spring or early summer when soil is warm; germination commonly takes 3–7 days.
    - Relay sow: reseed into spaces between rows or after mowing to keep continuous cover.
    - Pre-soak seeds (optional): soak 8–12 hours to speed emergence when conditions are marginal.
    
    🌾 Harvest / Best Use Timing:
    - Cut/mow for green manure around 6–8 weeks when biomass is high but before seed pods toughen.
    - Leave residues as surface mulch; avoid deep turning so soil biology stays active.
    - If you want flowers for beneficial insects, leave a small portion to bloom while mowing the main stand.
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: Sunn hemp (Crotalaria juncea) is a fast-growing warm-season legume cultivated as a green manure and soil-improving cover crop. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Mulcher: Mulch workflows love predictable biomass: Sunn hemp (Crotalaria juncea) is a fast-growing warm-season legume cultivated as a green manure and soil-improving cover crop. -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Erosion Control: Erosion control needs roots that grip: Sunn hemp (Crotalaria juncea) is a fast-growing warm-season legume cultivated as a green manure and soil-improving cover crop. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
  companions:
  - Sunflower (Helianthus annuus) — tall canopy pairing adds structure while both contribute biomass for mulching.
  - Corn (Zea mays) — warm-season compatibility supports rotation layout and creates layered cover.
  - Borage (Borago officinalis) — nectar blooms add pollinator support as you rely on sunn hemp for soil bulk.
  cautions:
  - Avoid grazing growing stands; seeds/pods can be harmful if eaten.
  practitioner_notes: |-
    Cut before pods toughen—once it’s seeding, the “cover crop” becomes a future volunteer project.
    Seed thick enough for rapid canopy closure; bare patches invite weeds.
    Use chop-and-leave instead of deep digging to keep soil life alive.
