  practitioner_notes: |-
    Divide clumps every few years—centers go hollow and flower less; spring split heals fastest.
    Flowers are edible and bee magnets—remove scapes if you want pure leaf production for market bunches.
    Onion maggot hits where alliums repeat yearly—rotate chive pots or beds and avoid fresh manure dressings at sowing.
    Cut leaves scissors-clean; torn ends oxidize gray at salad bars and annoy chefs.
