  description: 'Boneset (Eupatorium perfoliatum) is a native North American perennial of wet meadows and stream banks, recognized
    by opposite leaves fused around the stem (perfoliate) and flat-topped clusters of white fuzzy flowers in late summer and
    fall. Plants typically grow 60–120 cm (2–4 feet) tall with a bushy, upright habit.


    🌞💧 Sun and Water Requirements:

    - Full sun to light shade.

    - Rich, moist to wet soil; tolerates seasonal saturation. In subtropical and tropical Americas, grow in rain gardens,
    pond buffers, or heavily mulched beds with steady irrigation—dry sand will cause wilting and poor bloom.

    - Airflow helps foliage during humid wet season.


    ✂️ Methods to Propagate:

    - Seeds: Surface-sow in fall or stratify moist cold 4–6 weeks; germinates in warm, moist conditions.

    - Division: Split fibrous clumps in early spring; replant at the same depth and water well.


    🌾 Harvest / Best Use Timing:

    - Gather flowering tops at full bloom on dry mornings for drying; traditional use focuses on aerial parts. Leave late
    flowers for migrating pollinators.'
  purpose: 'Boneset anchors late-season wetland guilds:


    - **Medicinal**: Long-used as a diaphoretic bitter tea; quality depends on clean air, correct ID, and harvest stage.

    - **Pollinator**: White compound inflorescences attract bees, wasps, butterflies, and beneficial flies after many spring
    plants finish.

    - **Wildlife Attractor**: Seeds feed birds; dense stems shelter overwintering beneficial insects if left standing.

    - **Biomass**: Soft stems and leaves add carbon-rich chop-and-drop mulch to moist-zone plantings.'
