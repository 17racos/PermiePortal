  description: "Horsemint (Monarda punctata) is an aromatic mint-family perennial of
    prairies, sandy openings, and coastal grasslands in eastern and central North America,
    with stacked yellow flowers spotted in purple and foliage rich in thymol-scented
    oils. It is a long-tongued bee and wasp magnet—less showy than scarlet Monarda
    didyma but arguably louder to insects wearing antennae. Use it in meadow strips,
    pollinator hedges, and rain-garden berms with sharp drainage; heavy clay wetness
    rots crowns like most monardas.\n\n☀️💧 Sun and Water Requirements:\nFull sun; lean,
    well-drained soils produce oil-rich, upright plants. Moderate moisture improves
    bloom; drought tolerance is fair once established but extreme dry spells shorten
    flowering. Avoid wet winter crowns in heavy soil—raise beds or amend with gravel
    and organic matter. Cold-hardy into northern temperate zones; humid heat suits
    its natural range.\n\n✂️ Propagation:\nSeeds benefit from cold stratification; sow
    in fall outdoors or refrigerate moist seed.\nSoft tip cuttings under humidity root
    in warm months.\n\n🌾 Harvest / Best Use Timing:\nCut flowering tops for drying
    when most florets are open but before browning; hang with airflow to prevent mold.
    Leave late stems for seed-eating birds where meadows are managed for wildlife."
