  description: |-
    Hoary plantain is the fuzzy-leaf lawn gatecrasher Eurasia exported while everyone obsessed on dandelions. Young leaves are milder than broadleaf plantain; older leaves remind you that fiber exists. Tolerant of mowing abuse and mediocre soil — classic "weed" that is also lunch if you stop spraying glyphosate like cologne. In North Florida it behaves as a cool-season happy rosette with summer slowdown.

    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; tolerates compacted lawns more than pampered perennials.
    - Average moisture; drought-tolerant once established but softer leaves with steady water.
    - Lean soil is fine; excess nitrogen just feeds slugs.

    ✂️ Methods to Propagate:
    - Seeds: surface sow; light-dependent germination like cousins.
    - Division: split rosettes in cool weather for instant patches.
  purpose: |-
    Hoary plantain is underfoot resilience:

    - Edible: Young leaves raw or cooked; seed heads fiddly but possible.
    - Medicinal: Plantain-family topical poultice folklore — not sterile gauze.
    - Wildlife Attractor: Flowers feed small pollinators.
    - Ground Cover: Low rosettes cover bare patches where grass gave up honestly.
