  description: "Virginia spiderwort (Tradescantia virginiana) is the same species many files label simply “spiderwort”—a clump-forming perennial with blue-violet three-petaled flowers opening fresh each morning. Plants reach 1–2 feet (30–60 cm) in meadows and open woods. This duplicate entry exists for searchers using the regional common name.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; afternoon shade slows petal melt in heat. Average to moist, well-drained soils suit it; avoid stagnant wet crowns.\n\n✂️ Propagation:\nDivide clumps in spring; sow seed in fall. Deadhead near paths if volunteers annoy pavers.\n\n🌾 Harvest / Best Use Timing:\nEdible young shoots only with certain ID and clean sites. Peak bloom tracks late spring into summer warmth."
