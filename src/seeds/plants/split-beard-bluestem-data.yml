  description: 'Split beard bluestem (Andropogon ternarius) is a warm-season bunchgrass of southeastern North American dry
    prairies, sandhills, and roadsides, with blue-green summer foliage turning copper and fluffy white seed tails catching
    backlight in fall. Stems usually reach 2–4 feet (60–120 cm). It is a fine-textured companion to little bluestem in restoration
    mixes and a low-input ornamental for lean, sunny beds.


    ☀️💧 Sun and Water Requirements:

    Full sun for upright habit and showy seed heads; shade reduces flowering. Well-drained, lean soils suit it; tolerates
    drought once established. Avoid wet clay; water only to establish.


    ✂️ Propagation:

    Sow seed in warm soil after frost risk. Divide bunches in spring if needed. Cut back old growth in late winter.


    🌾 Harvest / Best Use Timing:

    Collect seed when tails are dry for restoration. Leave standing for winter structure and birds. Peak color tracks late-summer
    into fall heat.'
