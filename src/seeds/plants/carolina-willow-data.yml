  description: |-
    Carolina willow (Salix caroliniana) is a fast-growing woody tree/shrub native to moist areas across eastern North America. It forms flexible branches, spreads by rooting at the edges, and is built for wet ground where many plants fail. In permaculture, it’s a repair tool: strong roots stabilize banks and slopes, dense growth creates cooling shade, and fast leaf biomass becomes chop-and-drop mulch that keeps soil life humming.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; growth accelerates with bright light.
    - Water-loving: performs best with consistently moist soil and can tolerate flooded edges.
    - Prefers deep, fertile, well-aerated soils; avoid long dry spells once established.
    - Handles wet seasons well; don’t plant where you only get occasional water.
    
    ✂️ Propagation:
    - Cuttings: take dormant or semi-dormant cuttings and root them in moist media; roots often establish in 4–8 weeks.
    - Suckers/layering: bend low shoots toward wet soil and keep contact until they root (often 2–3 months).
    - Seeds: use cleaned seed quickly and sow after cold stratification; germination timing depends on temperature stability.
    
    🌾 Harvest / Best Use Timing:
    - Coppice for poles: cut for woven/woodwork in 1–3 years after establishment, then repeat on a rotation.
    - Use leaves and small prunings as fodder or compost input whenever pruning happens.
    - Harvest in cool parts of the day; avoid heavy cutting during extreme stress.
  purpose: |-
    Erosion Control: Erosion control needs roots that grip: It forms flexible branches, spreads by rooting at the edges, and is built for wet ground where many plants fail. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Water Retention: Carolina Willow increases effective water security through mulch-form litter, dense roots, or slowed surface flow on your contour -- adds living mulch, root channels, or canopy drip patterns that even out soil moisture between rains
    Shade Provider: Shade design leans on real canopy behavior: In permaculture, it’s a repair tool: strong roots stabilize banks and slopes, dense growth creates cooling shade, and fast leaf biomass becomes chop-and-drop mulch that keeps soil life humming. -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
    Animal Fodder: Carolina Willow offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan

  companions:
  - Comfrey (Symphytum officinale) — chop-and-drop complements willow biomass and pairs well in moist edge guilds.
  - Cattail (Typha latifolia) — wetland neighbor that fits the same water rhythm and helps stabilize saturated margins.
  - Elderberry (Sambucus canadensis) — understory shrub layer that shares moisture needs and builds layered habitat.
  cautions:
  - Rooting can push into drains, sidewalks, and foundations; keep a separation zone.
  practitioner_notes: |-
    Plant willow where water actually happens; in dry uplands it becomes maintenance, not a tool.
    Coppice in rotation so you always have young, leafy regrowth for mulch and fodder-style inputs.
    Expect roots to explore—set a clear “this bed is for willow” boundary before it teaches itself geography.
