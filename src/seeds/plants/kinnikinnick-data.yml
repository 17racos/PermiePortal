  description: |-
    Kinnikinnick is a prostrate evergreen ericaceous shrub of northern latitudes and high elevations, rooting where lean, acidic soils bake in sun. Small leathery leaves, pink urn-shaped flowers, and red mealy berries carpet rocky slopes and sand plains in massive mats only inches tall.

    In subtropical and tropical Americas it is a microclimate experiment: cooler, well-drained ridges and pine-derived acidity can host it in the northern part of the Florida peninsula; Puerto Rico only makes sense at elevation with cool nights and uncompacted gravelly media. Humid lowland heat usually melts it unless you are consciously mimicking montane conditions—do not pretend the beach keys are bearberry country.

    ☀️💧 Sun and Water Requirements:
    - Full sun to very light shade; dense shade weakens mats and invites mildew.
    - Acidic, sharply drained soil; sand, gravel, or raised crevice gardens; never heavy clay muck.
    - Low to moderate water; drought-tolerant when established but not a swamp plant.

    ✂️ Propagation:
    - Semi-hardwood cuttings in late summer with bottom heat and excellent drainage.
    - Layer stems pinned to gritty soil while attached to the mother plant.
    - Divide small rooted mats in cool weather, handling shallow roots gently.

    🌾 Harvest / Best Use Timing:
    - Berries ripen red in late season in climates where it fruits; harvest sparingly for wildlife-first designs.
    - Medicinal leaf harvest, if pursued, should follow ethical wildcrafting or cultivated patches only with expert guidance.
  purpose: |-
    Kinnikinnick is specialized ground armor:

    - Ground Cover: Evergreen mat excludes weeds on harsh banks where turf refuses to participate.
    - Wildlife Attractor: Berries feed birds and small mammals in northern-tier food webs where the plant is native.
    - Medicinal: Arbutin-rich leaves have a long herbal history—potency and kidney concerns mean respect, not casual tea parties.
    - Ornamental: Red fruit and bronze winter foliage sell it to rock gardeners who accept acidic dogma.
