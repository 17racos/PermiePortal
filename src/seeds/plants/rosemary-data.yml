  description: "Rosemary (Rosmarinus officinalis) is a woody, aromatic, evergreen
    herb that grows as a perennial shrub. It can reach up to 1.5 meters (5 feet) tall
    and produces needle-like leaves with a strong fragrance. In the right conditions,
    rosemary can live for decades and becomes a low-maintenance, drought-tolerant
    plant. It blooms in late winter through spring with small blue to purple flowers
    that attract pollinators.\n\nThe plant thrives in well-drained, sandy, or loamy
    soil with a slightly alkaline pH. Rosemary is highly drought-resistant once established
    and prefers warm climates with mild winters. In colder regions, it can be grown
    in containers and moved indoors during winter.\n\n \U0001F31E\U0001F4A7 Sun and
    Water Requirements:\n- Prefers full sun (6-8 hours of direct sunlight daily).\n-
    Requires well-drained soil with low to moderate moisture.\n- Avoid overwatering,
    as rosemary is susceptible to root rot.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Cuttings: Best method—take 10-15 cm (4-6 inch) cuttings from young stems, remove
    lower leaves, and root in moist soil or water.\n- Layering: Bend a stem to the
    ground, cover part of it with soil, and allow it to develop roots before cutting
    from the parent plant.\n- Seeds: Difficult to germinate; takes weeks to months
    for successful sprouting.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to
    Harvest:\n- Can be harvested year-round in warm climates.\n- Clip sprigs as needed
    once the plant is well-established (after at least 1 year).\n- Best flavor comes
    from young, fresh growth before flowering."
