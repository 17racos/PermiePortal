  description: "Caucasian spinach (Hablitzia tamnoides) is a long-lived edible vine
    from the Caucasus, climbing 2–3 m (6–10 feet) or more by twining stems and bearing
    heart-shaped leaves with a mild spinach flavor, plus small greenish flowers in
    airy panicles. It emerges very early in spring from a crown and can form a lush
    curtain on partial-shade supports.\n\n🌞💧 Sun and Water Requirements:\n- Partial
    shade to light shade in warm climates; tolerates morning sun with steady moisture.\n-
    Rich, humusy, well-drained soil; likes even moisture but not bogging. In Florida
    and Puerto Rico, treat it as a cool microclimate experiment—highland shade, misty
    courtyards, or winter-dormant pots moved out of summer inferno—lowland tropical
    heat often causes summer dormancy or decline.\n- Mulch crown to keep roots cool.\n\n✂️
    Methods to Propagate:\n- Seeds: Sow in cool conditions; germination can be slow
    and irregular—start many.\n- Division: Split crowns in early spring before vines
    elongate; keep divisions watered.\n\n🌾 Harvest / Best Use Timing:\n- Pick young
    leaves and shoot tips in spring and early summer; flavor can toughen and flower
    stalks appear in midseason. Repeated tipping encourages bushier growth."
  purpose: |-
    Caucasian spinach is a forest-garden vine for shade eaters:

    - **Edible**: Nutritious leafy tips extend the \"greens\" season before true spinach likes to bolt.
    - **Shade Provider**: Leafy curtain cools north walls, livestock pens, and nursery shade frames.
    - **Wildlife Attractor**: Insectary flowers support small pollinators along semi-shady edges.
    - **Ground Cover**: Lower leaves and self-layering stems can mantle root zones of larger plants when trained low.
  companions:
