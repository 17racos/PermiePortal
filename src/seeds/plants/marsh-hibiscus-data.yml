  description: |-
    Marsh hibiscus is a robust herbaceous to shrubby mallow of eastern North American wetlands, pushing up stems 4–7 feet tall with huge maple-like leaves and summer flowers that range white to pink with a deep red eye. It thrives in sunny edges of swales, pond margins, and rain gardens where soil alternates between wet and moist.

    In Florida and Puerto Rico it fits naturalistic water features, bioswales, and detention basins—humid summers are on-brand; dry season drawdown should not bake roots forever without mulch or residual moisture. Use it where mosquitoes are managed by ecology (fish, predators) rather than denial.

    ☀️💧 Sun and Water Requirements:
    - Full sun for maximum bloom; light shade only where heat and glare are extreme.
    - Rich, organic, moisture-retentive soil; tolerates brief inundation; not a desert plant.
    - Consistent moisture during bloom; mulch with leaf litter to buffer evaporation in sandy sites.

    ✂️ Propagation:
    - Seeds after last chill risk; nick or soak seeds to improve germination.
    - Divide crowns in early spring before heavy growth; keep divisions wet.
    - Softwood cuttings in summer under mist root quickly for clone expansion.

    🌾 Harvest / Best Use Timing:
    - For landscape, deadhead if you dislike self-sowing; leave seed heads if you want finch food and winter structure.
    - Cut back frost-killed stems after they bronze in cooler zones; in frost-free areas prune for shape after main flush.
  purpose: |-
    Marsh hibiscus is wetland theater with ecosystem receipts:

    - Ornamental: Dinner-plate flowers anchor rain garden aesthetics without pretending to be turf.
    - Pollinator: Bees and hummingbirds work large blooms in summer when diversity matters.
    - Wildlife Attractor: Seeds and cover support birds and insects along wet ecotones.
    - Water Retention: Deep roots and lush tops slow runoff, polish stormwater, and shade water to moderate temperature spikes.
  companions:
  - Pickerelweed — emergent aquatics share pond margins and complementary flower forms for pollinator pathways.
  - Duck Potato — overlapping wetland niche with edible tuber interest at deeper water transition zones.
  - Cattail — vertical texture contrast; manage cattail vigor so it does not shade out hibiscus completely.
