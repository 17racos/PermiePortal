description: |-
  Water yam is the winged-stem Dioscorea that climbs trellises, trees, and homeowner patience—massive tubers possible where the frost-free season is long enough. Some forms are regulated or problematic; verify local rules before you plant your yard into a liability.

  Long-vined types need a serious frost-free window; harvest before freeze damages vines. Shorter-cycle selections help 8b/9a.

  Full sun for yield.
  Deep, loose soil with steady moisture during growth; dry-down before harvest reduces rots.

  Headsetts (bulbils), tuber pieces with buds, or vine cuttings for some lines—label everything so you remember which experiment is which.

  Dig tubers when vines senesce or before freeze damages storage roots.
purpose: |-
  Edible: Dioscorea alata winged yams exceed 50 kg in pampered plots -- purple flesh types need long frost-free seasons; verify regional invasiveness before gifting bulbils to neighbors.
  Ground Cover: Annual vines smother trellises and fence tops -- assign serious arbor strength; girdling young trees is a documented bad habit if you look away midsummer.
  Mulcher: Frost-blackened foliage drops in place -- chop coarse stems before composting so piles heat evenly.
companions: []
cautions:
  - Planting invasive forms where prohibited
  - Weak trellising
pests:
  - nematodes
  - rootknot nematodes
  - aphids
growth_habit: Herbaceous perennial twining vine with annual stems from tuber
