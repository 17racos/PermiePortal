  description: "Water yam is the winged-stem Dioscorea that climbs trellises, trees,
    and homeowner patience—massive tubers possible where the frost-free season is long
    enough. Some forms are regulated or problematic; verify local rules before
    you plant your yard into a liability.\n\nLong-vined
    types need a serious frost-free window; harvest before freeze damages vines. Shorter-cycle
    selections help 8b/9a.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for yield.\nDeep, loose soil with
    steady moisture during growth; dry-down before harvest reduces rots.\n\n✂️ Propagation:\n\nHeadsetts (bulbils), tuber pieces with buds, or vine cuttings for some lines—label
    everything so you remember which experiment is which.\n\n🌾 Harvest / Best Use Timing:\n\nDig tubers when vines senesce or before freeze damages storage roots."
  purpose: |-
