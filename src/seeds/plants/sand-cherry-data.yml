  description: 'Sand cherry (Prunus pumila) is a suckering deciduous shrub of sandy shores, dunes, and dry slopes around the
    Great Lakes and adjacent regions, forming low thickets with narrow leaves and fragrant white spring flowers followed by
    dark red to purple cherry-like drupes. Height is commonly 2–6 feet with a wide, colonial spread from roots; it tolerates
    lean, fast-draining soil and full sun.


    ☀️💧 Sun and Water Requirements:

    - Full sun for best flowering and fruit; open, breezy sites reduce foliar disease.

    - Low water needs once established; absolutely requires sharp drainage. In subtropical and tropical Americas this species
    is outside its comfort zone—only attempt in cool, elevated microclimates or as a seasonal container curiosity, not as
    a reliable lowland fruit crop.


    ✂️ Methods to Propagate:

    - Seeds: stratify moist seed for several months in cool conditions, then sow; seedlings vary.

    - Root suckers: detach rooted shoots in early spring before bud break and transplant with soil intact.


    🌾 When to Harvest:

    - Pick fruit when fully colored and slightly soft in mid to late summer in its native range; flavor is tart and best for
    jams or wildlife sharing. Net or accept bird losses.'
  purpose: 'Sand cherry is a cold-climate stabilizer shrub with tart fruit for preserves.


    - Edible: Small fruits are processed like sour cherries; high pectin for jelly.

    - Wildlife Attractor: Flowers feed early pollinators; fruit feeds birds along shorelines.

    - Erosion Control: Rhizomatous thickets hold sand and gravel slopes.

    - Border Plant: Low hedge along paths where harsh conditions exclude fussy ornamentals.

    - Ornamental: Spring blossom and red fruit give seasonal interest in northern designs.'
