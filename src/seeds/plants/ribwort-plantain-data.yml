  description: |-
    Ribwort plantain is the lawn weed that herbalists respect and turf purists spray. Basal rosette, tight flower spikes, pulls easy after rain—if you decide it owes you rent.

    subtropical and tropical Americas / subtropical: Thrives in winter cool and mild seasons; can look tatty in brutal summer drought unless given a little shade and moisture.

    Sun and water: Full sun to part shade. Tolerates poor, compacted soil—that is the brand. Irrigate if you want lush leaves for harvest.

    Propagation: Self-seeds abundantly; transplant rosettes when soil is moist.
