  description: "Virginia stonecrop (Sedum ternatum) is a native eastern North American succulent groundcover for shade and partial sun, with whorled leaves and white starry flowers in late spring. It spreads by shallow rhizomes into mats along rocks, logs, and woodland edges without becoming a lawn. It tolerates dry shade better than many forbs once established.\n\n☀️💧 Sun and Water Requirements:\nPartial shade to light sun; afternoon sun in hot climates can scald leaves. Well-drained, humus-rich soils suit it; tolerates short drought once rooted. Avoid wet clay stagnation.\n\n✂️ Propagation:\nDivide mats in spring; take soft cuttings in early summer. Keep moist until rooted.\n\n🌾 Harvest / Best Use Timing:\nPrimarily ornamental—leave flowers for small pollinators. Peak bloom follows local late-spring warmth after frost risk near 32°F (0°C) declines."
  purpose: |-
    - Ground Cover: Mats fill shady gaps where turf refuses honest work.
    - Ornamental: White flowers and succulent leaves soften rock gardens and log edges.
    - Erosion Control: Shallow roots stabilize loose soil on shaded slopes.
    - Pollinator: Small flowers feed native bees during a brief spring window.
  companions:
  - Wild Columbine — spring forb neighbor above low stonecrop mats
  - Wild Ginger — shade groundcover pairing with different leaf texture
  - Serviceberry — small tree dappling light over stonecrop colonies
  cautions:
