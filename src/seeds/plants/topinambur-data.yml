  description: |-
    Topinambur is the European name for the same sunflower-tuber chaos North Americans call sunchoke—inulin, flatulence jokes, and volunteer tubers hiding like landmines. Same plant, different passport stamp.

    Grows vigorously; harvest in cooler months for firmer texture. Confine if your yard has boundary issues.

    Sun and water: Full sun for tall stems and heavy tubers. Steady moisture during growth; well-drained soil reduces rot angst.
    ✂️ Propagation:
    Tubers left in soil (inevitable); replant golf-ball pieces in spring; moving clumps resets spread when diplomacy fails.
  purpose: |-
    - Edible: Tubers deliver starchy perennial calories with inulin sweetness—socially engineer portion sizes for dinner guests before the punchline arrives.
    - Animal Fodder: Pigs and other stock historically grazed tops and dug tubers when herds were allowed to work the crop honestly.
    - Mulcher: Tall sunflower stems and leaves become chop-and-drop mulch that feeds soil life once frost or management knocks them down.
    - Wildlife Attractor: Late flowers support pollinators after many garden annuals quit, extending nectar availability into autumn.
    - Dynamic Accumulator: Deep-spreading roots and vigorous top growth pull nutrients and carbon into the system, especially when residues return to the bed instead of leaving the site.
