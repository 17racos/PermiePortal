  description: 'Illinois bundleflower is a deep-rooted native legume of central North American prairies, forming ferny mimosa-like
    leaves and round white powder-puff flowers in midsummer. Plants reach 2–4 feet, spread by rhizomes into loose colonies,
    and fix nitrogen while tolerating grazing and drought.


    In subtropical and tropical Americas use it in sunny savanna edges, orchard alleys, and poultry paddocks where soil drains
    between downpours—constant bogging rots crowns, while Puerto Rico’s dry season rewards its dormancy strategy if roots
    are already deep. It is a prairie specialist transplanted into subtropical/tropical rotational systems, not a shade understory
    filler.


    ☀️💧 Sun and Water Requirements:

    - Full sun for reliable bloom and nodulation.

    - Well-drained loam to sandy soil; tolerates poor fertility once inoculated with compatible rhizobia.

    - Water to establish; thereafter drought-tolerant but benefits from occasional deep soaking before heavy seed set.


    ✂️ Propagation:

    - Scarify seeds mechanically or with hot water, then sow warm; inoculate with appropriate legume inoculant.

    - Divide rhizomatous clumps during dormancy or early regrowth when soils are workable.

    - Direct seed into prepared beds after last frost risk in marginal zones; in frost-free areas time with onset of warm
    rains.


    🌾 Harvest / Best Use Timing:

    - For hay or mulch, cut before full seed drop if you want to limit self-sowing; leave some pods for self-reseeding guilds.

    - Graze rotationally while plants rebound between bites to protect crowns.'
  purpose: 'Bundleflower is a prairie legume module for sunny systems:


    - Nitrogen Fixer: Rhizobia on roots bank fertility for neighboring grasses and fruit trees in alley designs.

    - Animal Fodder: Palatable, protein-rich herbage supports poultry, sheep, and cattle in multispecies rotations.

    - Biomass: Cut-and-drop stems build carbon in orchard rows and hugel-adjacent zones.

    - Pollinator: Nectar-rich globes attract bees and small butterflies during summer dearth periods.'
  companions:
  - Muhly Grass — warm-season matrix grass shares sun and drainage while bundleflower’s nitrogen lifts the whole polyculture.
  - Echinacea — overlapping midsummer bloom widens pollinator support and pairs with legume fertility in orchard edges.
  - Black-eyed Susan — similar height class and full-sun habit; deep roots occupy different strata than bundleflower rhizomes.
