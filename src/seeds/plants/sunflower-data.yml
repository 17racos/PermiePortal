  description: "Sunflowers are tall, annual plants with large, bright yellow flowers that can grow up to 3.6 meters (12 feet)\
    \ in height. They have deep taproots that improve soil structure and reduce erosion. The flowers produce abundant nectar\
    \ and pollen, attracting bees, butterflies, and birds.\n\nThe plant thrives in full sun and well-drained soil. It is drought-tolerant\
    \ once established and can grow in a variety of soil conditions. Sunflowers are commonly used as windbreaks, living fences,\
    \ and companion plants.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun (6-8 hours of direct\
    \ sunlight daily).\n- Drought-tolerant but benefits from moderate watering.\n- Grows well in well-drained, sandy or loamy\
    \ soils.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct sow in the garden after the last frost when the soil is\
    \ at least 10°C (50°F).\n- Spacing: Plant seeds 2.5 cm (1 inch) deep, spaced 30 cm (12 inches) apart.\n\n\U0001F9D1‍\U0001F33E\
    \U0001F469‍\U0001F33E When to Harvest:\n- Flowers bloom in summer and early fall.\n- Harvest seeds when the back of the\
    \ flower head turns brown.\n- Allow seeds to dry completely before storage."
