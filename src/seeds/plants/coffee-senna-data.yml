  description: "Coffee senna (*Senna occidentalis*) is a fast-growing warm-season
    legume herb to subshrub, often treated as an annual weed in cropland but occasionally
    used on purpose for biomass and insect interactions. Compound leaves look somewhat
    coffee-like; yellow flowers mature into narrow pods. Height commonly 0.5–2 m
    in a single season. **All parts, especially seeds, are toxic to humans and many
    animals if ingested**—treat it as a utility plant, not a salad bar. In Florida
    and Puerto Rico it appears in disturbed, sunny, moist-to-dry soils and completes
    life cycles quickly in heat.\n\n☀️💧 **Sun and Water Requirements:**\nFull sun.
    Tolerates poor soils; moderate water speeds growth but it survives short dry spells
    once rooted. Avoid encouraging it near livestock paddocks or poultry yards because
    of seed toxicity.\n\n✂️ **Methods to Propagate:**\n- **Seeds:** Scarify or soak
    warm water, then direct-sow after soil temperatures stay above 21 °C (70 °F).\n-
    **Self-sowing:** Allow pods to dry on-plant only in controlled areas where seedlings
    are welcome; otherwise remove pods before shatter.\n\n🌾 **Best Use Timing:**\nChop
    before heavy seed set if using for green manure; compost hot piles break down
    stems. If managing as a nectar bank for beneficials, time mowing between bloom
    waves to prolong flowers without spreading seed recklessly."
  purpose: |-
    - **Biomass:** Rapid summer growth supplies bulk organic matter for compost and chop-and-drop in disturbed rows.
    - **Nitrogen Fixer:** Legume roots associate with rhizobia, feeding soil biology when residues are returned.
    - **Wildlife Attractor:** Flowers can draw pollinators and some beneficial insects during warm months.
    - **Pest Management:** Strategic patches (away from food) can host predators or serve as trap-adjacent habitat—plan carefully.
