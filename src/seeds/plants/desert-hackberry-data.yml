  description: "Desert hackberry (*Celtis pallida*) is a drought-hardy, often thorny
    deciduous shrub or small tree from the southwestern United States and northern
    Mexico, now occasionally planted in warm, dry corners of subtropical and tropical Americas
    as a wildlife and erosion-control plant. It forms a rounded crown with small,
    rough leaves and produces orange-red drupes that birds love. Mature plants are
    typically 6–15 feet tall and wide, sometimes larger with irrigation.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nGive full sun to light shade. This plant is built
    for lean, well-drained soils and tolerates extreme heat and long dry spells once
    roots are established. In humid subtropical and tropical sites, avoid heavy clay
    that stays wet; root problems show up fast where drainage is poor.\n\n✂️ **Methods
    to Propagate:**\n- **Seeds:** Clean ripe fruits and sow in warm soil after last
    cool weather; germination is often improved with a short soak and warm (75–85°F)
    conditions.\n- **Hardwood cuttings:** Take semi-hardwood cuttings in late summer,
    treat with rooting hormone, and keep humid until roots form.\n\n\U0001F9D1‍\U0001F33E
    **Harvest / Best Use Timing:**\nRipe fruits are picked when fully colored and
    soft; flavor is sweet-tart and variable. In subtropical and tropical Americas, harvest
    windows track the warm season—often late spring through fall depending on plant
    age and moisture. Leaves have forage value for some livestock; prune after fruiting
    if managing size."
  purpose: |-
    - **Edible:** Small drupes are eaten fresh, in jellies, or fermented in traditional southwestern foodways; use only ripe fruit from known plants.
    - **Wildlife Attractor:** Dense branching, thorns, and fruit make it a songbird and small-mammal magnet in arid-style plantings.
    - **Erosion Control:** Fibrous roots and tough habit stabilize sandy banks, roadsides, and disturbed slopes.
    - **Border Plant:** Thorny stems create a living fence or wind-slowing edge in dry gardens and food-forest margins.
    - **Shade Provider:** As a small tree, it throws light shade for understory herbs without casting deep rainforest shade.
