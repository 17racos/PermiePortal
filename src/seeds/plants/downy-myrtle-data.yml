  description: 'Downy myrtle (Rhodomyrtus tomentosa) is an evergreen myrtle-family shrub of Asian and Pacific island forests,
    bearing opposite aromatic leaves softly hairy beneath and pink flowers followed by dark purple berries. Plants commonly
    reach 3–7 feet (1–2 m) in cultivation, sometimes taller without pruning. It is grown for ornamental fruit displays, hedges,
    and edible berries where the species is culturally established and legally permitted.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright part shade; dense shade reduces flowering and fruit. Prefers well-drained, humus-rich soils with steady
    moisture in the warm season and less in cool periods. Salt tolerance is moderate compared with true coastal mangrove specialists—do
    not confuse resilience with invulnerability.


    ✂️ Propagation:

    Sow cleaned seed warm after removing pulp; germination improves with freshness. Semi-hardwood cuttings root under humidity
    in warm weather for known fruiting clones. Tip-prune young plants to encourage branching before they stretch into lanky
    adolescence.


    🌾 Harvest / Best Use Timing:

    Pick berries fully colored and soft for fresh eating or processing where local tradition supports safe use. Flowers attract
    pollinators—avoid blanket insecticides during bloom if fruit is the goal. Remove suckers at invasion-prone sites to limit
    spread into adjacent natural areas.'
  purpose: '- Edible: Ripe berries are eaten fresh or preserved in cuisines where the fruit is traditional.

    - Ornamental: Pink blooms and dark fruit give long-season interest in humid subtropical and tropical gardens.

    - Wildlife Attractor: Fruits feed birds; confirm this is desirable in your biome before planting.

    - Border Plant: Resprouting habit can form dense screens where regulations allow.'
