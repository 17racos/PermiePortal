  description: "Water hyacinth is a floating rosette with glossy leaves and lavender
    flowers—gorgeous, fast, and ecologically obnoxious when it escapes. It strips
    nutrients from water, mats thick enough to stall boats, and is illegal to possess
    in many jurisdictions, **including Florida**, because it clogs springs and rivers.\n\nTreat
    this entry as ID + historical use, not a planting recommendation. In permitted
    research or wastewater systems overseas it is grown in contained tanks—not open
    ponds that touch public water.\n\nSun and water: Full sun; floating on nutrient-rich
    freshwater; explodes with heat and fertility.\n\nPropagation: Daughter plants on
    stolons—absurdly easy, which is the problem. Do not \"share\" with neighbors unless
    you dislike them and local laws."
  purpose: |-
    Nutrient sponge in closed systems where legal; compost feedstock where allowed;
