  purpose: |-
    Water Purifier: Eichhornia crassipes floating roots strip dissolved nitrogen and phosphorus from eutrophic water in hours -- containment barrels only; open water releases are ecological crimes in warm climates.
    Animal Fodder: Chopped foliage fed dairy trials in tropics after sun-wilting to reduce water content -- legality and hygiene vary; never feed from sewage-fed mats without lab clearance.
    Mulcher: Ton-per-acre biomass hauls to hot compost piles -- mix with browns; succulent tissue alone goes anaerobic fast.
    Green Manure: Rapid growth fixes little nitrogen itself but concentrates nutrients from water into plant tissue -- incorporate into terrestrial beds as mineral transfer, not as cover-crop nitrogen fantasy.
