description: |-
  Water hyacinth is a floating rosette with glossy leaves and lavender flowers—gorgeous, fast, and ecologically obnoxious when it escapes. It strips nutrients from water, mats thick enough to stall boats, and is illegal to possess in many warm-climate jurisdictions because it clogs springs and rivers.

  Treat this entry as ID + historical use, not a planting recommendation. In permitted research or wastewater systems overseas it is grown in contained tanks—not open ponds that touch public water.

  Full sun; floating on nutrient-rich freshwater; explodes with heat and fertility.

  Daughter plants on stolons—absurdly easy, which is the problem.
  Do not "share" with neighbors unless you dislike them and local laws.

  Remove biomass on a schedule in contained systems for compost or fodder—never dump into open waterways.
purpose: |-
  Water Purifier: Eichhornia crassipes floating roots strip dissolved nitrogen and phosphorus from eutrophic water in hours -- containment barrels only; open water releases are ecological crimes in warm climates.
  Animal Fodder: Chopped foliage fed dairy trials in tropics after sun-wilting to reduce water content -- legality and hygiene vary; never feed from sewage-fed mats without lab clearance.
  Mulcher: Ton-per-acre biomass hauls to hot compost piles -- mix with browns; succulent tissue alone goes anaerobic fast.
  Green Manure: Rapid growth fixes little nitrogen itself but concentrates nutrients from water into plant tissue -- incorporate into terrestrial beds as mineral transfer, not as cover-crop nitrogen fantasy.
companions:
- None outdoors (contained systems only)
cautions:
- Open waterways
- Natural ponds
pests:
- Aphids
- Snails