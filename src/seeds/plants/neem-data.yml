    their life choices.\n\nMarginal in warm outer margins; young trees freeze-kill; older
    specimens sometimes resprout after light freezes in protected microclimates. True tropical
    climates onward it becomes a serious shade and windbreak tree.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun;
    deep soil with good drainage; drought-tolerant once established; young trees need
    consistent moisture to outrun pests.\n\n✂️ Propagation:\n\nSeeds (fresh, short-lived);
    root suckers; grafted selections for uniform chemistry in commercial plantings.\n\n🌾 Harvest / Best Use Timing:\n\nCollect drupes for oil processing and traditional preparations when local rules allow—check regulations where self-sowing is a concern."
