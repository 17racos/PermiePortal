  description: "Neem is a fast tropical evergreen tree with compound leaves, sweet-scented
    flowers, and olive-like drupes whose oil powers organic sprays and traditional
    medicine. It is not a subtle chemical factory—azadirachtin makes insects rethink
    their life choices.\n\nsubtropical and tropical Americas: marginal; young trees freeze-kill; older
    specimens sometimes resprout after light freezes in 9b microclimates. tropical and subtropical zones
    onward it becomes a serious shade and windbreak tree.\n\nSun and water: Full sun;
    deep soil with good drainage; drought-tolerant once established; young trees need
    consistent moisture to outrun pests.\n\nPropagation: Seeds (fresh, short-lived);
    root suckers; grafted selections for uniform chemistry in commercial plantings."
  purpose: |-
    Pharmacy tree, spray ingredient source, and broad canopy for understory guilds
    in frost-free sites. Check local regulations—some areas restrict neem because
    it can self-sow in warm climates.
