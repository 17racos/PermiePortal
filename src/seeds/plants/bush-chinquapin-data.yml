  description: "Bush chinquapin is a low, clumping relative of chestnuts in the Castanea
    pumila complex of the southeastern United States, forming thickets with small,
    heavily toothed leaves and spiny burrs enclosing a single small nut. Height is
    commonly 3–8 feet (1–2.5 m) in open sandhill and oak understories, spreading by
    root sprouts. It provides mast where taller chestnut species are absent, fitting
    savanna restoration, wildlife plots, and droughty acidic edges.\n\n☀️💧 Sun and
    Water Requirements:\nFull sun to partial shade; best mast in high light. Prefers
    well-drained, acidic, often sandy soils; tolerates drought once established compared
    with riparian shrubs. Mulch young sprouts; avoid alkaline irrigation.\n\n✂️ Propagation:\nSow
    fresh nuts after stratification or outdoors in protected beds. Transplant root
    sprouts with ample roots in dormancy. Grafting to blight-tolerant stock is a specialist
    orchard path.\n\n🌾 Harvest / Best Use Timing:\nGather burrs as they split in fall;
    cure nuts briefly before eating or roasting. Expect heavy wildlife losses unless
    protected. Prune crowded interior stems to reduce disease pressure in humid years."
  purpose: |-
    - Edible: Small kernels offer chestnut flavor for patient hand harvesters.
    - Wildlife Attractor: Mast supports birds and mammals in fire-maintained oak ecosystems.
    - Erosion Control: Sprouting habit stabilizes sandy slopes and road cuts.
    - Mulcher: Leaf litter feeds acid-soil food webs under pine-oak canopies.
  companions:
  - Longleaf Pine — classic overstory for southeastern sandhill chinquapin thickets
  - Turkey Oak — shared dry oak habitat with complementary acorn timing
