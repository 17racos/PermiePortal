  description: "Cumin is an ancient annual umbellifer grown for its ridged seeds —
    warm days, sharp drainage, and low humidity make it happy. North Florida is not
    its favorite office: summer wetness invites foliar funk, so treat it like a
    dry-season experiment in raised beds or containers, or grow it in the coolest
    slice of spring you can steal. Leaves are edible but mild; the prize is the
    seed head harvested when brown and fragrant.\n\n☀️💧 Sun and Water:\n- Full sun
    and excellent drainage; wet feet are a hard no.\n- Moderate water while growing;
    ease off as seeds mature.\n- Sandy-loam mixes beat heavy clay; airflow matters.\n\n✂️
    Propagation:\n- Seed: direct-sow after last frost when soil is warm; barely cover.\n-
    Thin for airflow; crowded cumin invites powdery issues."
  purpose: |-
    Wild cumin here means the real species grown where the climate tolerates it:

    - Edible: Seeds for spice; leaves as a light herb where you like the flavor.
    - Medicinal: Traditional digestive associations; reality is still spice-in-food,
      not a pill.
    - Pollinator: Tiny flowers on fine umbels feed small beneficials.
    - Border Plant: Fine texture in a dry herb row when conditions cooperate.
