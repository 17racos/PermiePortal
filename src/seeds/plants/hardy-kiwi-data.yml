  description: |-
    Hardy kiwi (Actinidia arguta) is a temperate relative of supermarket kiwi, producing grape-sized, smooth-skinned fruit without the fuzzy peel. Vigorous vines climb by twining stems and can cover arbors, fences, and trellis wires; many cultivars are dioecious, requiring separate male and female plants for pollination. Leaves are broad and heart-shaped, often showy in spring.

    It suits backyard fruit walls, pergolas, and livestock fencing in cool-summer and continental climates where winter chilling hours accumulate.

    Full sun yields maximum sugar; roots need deep, fertile, well-drained soil with consistent moisture during fruit swell. Avoid windy ridges that desiccate large leaves.

    Propagate from dormant hardwood cuttings or grafted nursery plants for known sex and flavor. Train cordons on sturdy wire to simplify pruning.

    Harvest brix-rich berries when they yield slightly to thumb pressure and detach easily; they do not store like apples, so pick in batches during peak week.
  purpose: |-
    Edible: Whole small fruit can be eaten out of hand -- vitamin C content is high and acidity balances sweetness when fully ripe.
    Pollinator: Flowers offer pollen and nectar to bees that transfer pollen between male and female clones -- place male vines within bee flight range of females.
    Ornamental: Dense summer foliage and clean fruiting display upgrade utilitarian fences -- seasonal interest without annual replanting.
    Wildlife Attractor: Fallen fruit feeds birds if you miss a picking -- accept some loss or net rows for human-first harvests.
    Shade Provider: Leafy canopy shades patios and livestock lanes -- reduces radiant heat on west-facing walls compared to bare siding.
