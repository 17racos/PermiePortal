  description: "Indian cherry (Frangula caroliniana), widely known as Carolina buckthorn,
    is a deciduous shrub to small tree of moist woodlands, riverbanks, and limestone
    margins in the southeastern United States, with glossy leaves, inconspicuous
    flowers, and red to black berries that ripen for birds rather than human dessert
    platters. Some buckthorns are invasive elsewhere—this native species still demands
    positive ID before you plant because exotic Rhamnus cousins ruined the family
    photo. Use it in hedgerows, riparian buffers, and bird gardens where seasonal
    berries and fine branching beat lawn piety.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun to partial shade; tolerates moist, well-drained soils along streams and
    bottomlands. Drought tolerance is modest—mulch and occasional deep watering help
    young plants on upland transitions. Tolerates alkaline limestone soils better
    than many forest shrubs. Hardy through cool-temperate winters; late freezes can
    nip early flowers.\n\n✂️ Propagation:\nSeeds cleaned and cold-stratified germinate
    over one to two seasons.\nSemi-hardwood cuttings under mist can clone known fruiting
    individuals.\n\n🌾 Harvest / Best Use Timing:\nBerries are low-toxin for birds
    but not a recommended human snack—leave for wildlife. Prune in late winter to
    shape; avoid heavy summer cuts that stress drought-stressed plants."
  purpose: |-
