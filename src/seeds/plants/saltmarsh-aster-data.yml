  description: "Saltmarsh aster (Symphyotrichum tenuifolium) is a perennial composite
    of coastal and interior saline wetlands in eastern North America, bearing clouds
    of small lavender-pink flowers very late in the season. Narrow leaves and salt-tolerant
    roots let it thrive where lawn species throw a tantrum. It belongs in living shorelines,
    brackish rain gardens, and pollinator corridors that still respect tidal truth.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun; shade reduces bloom and encourages flopping.\n-
    Moisture-loving; tolerates periodic inundation and salt spray in coastal plantings.\n-
    Sandy to muddy soils; avoid pure freshwater potting mixes that lack mineral buffering.\n\n✂️
    Propagation:\n- Division in early spring before new growth surges.\n- Seeds: sow
    fresh or cold stratify; keep soil moist until establishment.\n- Cuttings from
    soft tips possible in humid greenhouses.\n\n🌾 Harvest / Best Use Timing:\n-
    Leave most flowers for migrating pollinators; seeds feed finches if heads stand
    into winter.\n- Cut stems for bouquets at peak color; vase life is modest.\n-
    Reduce freshwater irrigation if leaves yellow from overly sweet soil in brackish
    designs."
  purpose: |-
    - Pollinator: Late nectar supports bees and butterflies when fewer natives bloom.
    - Wildlife Attractor: Seeds feed birds; dense stems shelter insects at the marsh edge.
