  practitioner_notes: 'Salinity is data, not attitude—if leaves look miserable, test water before you blame the plant.

    Flopping means too little sun or too much nitrogen—marsh plants are not corn impersonators.

    Late bloom is the point—design paths so you are not “cleaning up” pollinator supper mid-flight.'
