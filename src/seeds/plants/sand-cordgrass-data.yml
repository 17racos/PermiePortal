    Water Retention: Sand Cordgrass increases effective water security through mulch-form litter, dense roots, or slowed surface flow on your contour -- adds living mulch, root channels, or canopy drip patterns that even out soil moisture between rains
    Biomass: Sand Cordgrass prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories

