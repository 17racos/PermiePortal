    Ornamental: Finger Lime earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Pollinator: Finger Lime opens reliable nectar and pollen during the window your warm-season or early-spring crops are setting fruit -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
