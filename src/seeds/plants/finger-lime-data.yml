description: |-
  Finger lime is the citrus that filled its vesicles with lime Pop Rocks and dares chefs to charge extra. Thorny, shrubby, Australian native in the rue family—same pest and regulatory attention as any commercial citrus, with jewel-like “caviar” pulp inside slender fruit.

  In subtropical and tropical Americas it behaves like other frost-tender citrus: reliable in warm frost-free areas; in cooler subtropical pockets use warm microclimates, pot culture, or accept occasional dieback after cold snaps. Puerto Rico’s steady heat suits container or in-ground culture with excellent drainage.

  Full sun for flowering and heavy fruit set once established. Deep, fertile, well-drained soil; even moisture in growth, never swampy around the crown. Mulch to buffer roots; wind protection helps young plants in exposed sites.

  Grafting onto compatible citrus rootstock for predictable vigor, disease tolerance, and early fruit. Cuttings under high humidity for hobby propagation; seedlings variable and slow to fruit.

  Pick when fruit colors and gives slightly; vesicles stay firm-turgid at peak garnish quality. Store briefly refrigerated; freeze pulp or pickle in cuisines that treat it like a specialty citrus.
purpose: |-
  Edible: Citrus australasica fruit splits to show separate lime-green vesicles that pop like citrus caviar over oysters -- harvest when rind colors and segments stay turgid before interior vesicles soften past garnish quality on grafted 10-11 trees.
  Ornamental: Thorn-armed weeping habit carries finger-length fruit visible from paths in collector citrus courtyards where fine foliage reads lighter than standard sweet-orange scaffold canopies.
  Pollinator: White waxy rue-family blooms perfume warm months -- while honeybees pack heavy pollen loads on anthers heavier than nectar rewards on Australian types grafted to US rootstocks for phytophthora resilience.
