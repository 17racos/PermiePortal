  description: "Cordyceps militaris is the cultivated species — not the cinematic
    zombie-ant fungus (that is Ophiocordyceps unilateralis), though the genus earns
    its reputation for strange life cycles. Wild C. militaris parasitizes moth and
    butterfly pupae; cultivated production skips the insect entirely and runs on
    sterile grain or rice substrate in filtered-air grow rooms. This is not a back-porch
    trellis crop. Subtropical outdoor cultivation is not viable for consistent fruiting
    bodies; if you want the orange clubs, buy cultures from experienced labs and
    expect closet-to-tent energy, not garden bed simplicity.\n\n☀️💧 Sun and Water:\n-
    Indoor cultivation: dark or indirect light during colonization, then introduce
    diffuse light to trigger pinning.\n- High humidity (85-95%) for pinning; reduce
    slightly during fruiting to limit bacterial contamination.\n- Fresh air exchange
    is critical — CO₂ accumulation stalls clubs and encourages aborts.\n\n✂️ Propagation:\n-
    Liquid culture or agar to grain spawn to fruiting substrate (rice, grain, or
    silkworm pupae in commercial operations).\n- Do not attempt to transfer wild
    insect mummies — contamination risk is high and results are not worth the cost."
  purpose: |-
    Cordyceps is a specialty indoor cultivation project with genuine medicinal
    interest if you separate tradition from supplement marketing:

    - Edible: Cultivated militaris produces fruiting bodies used in cooking; flavor
      is mild and earthy.
    - Medicinal: Traditional Tibetan and Chinese use is real; modern adaptogen claims
      vary widely in quality — read clinical studies, not label copy.
  substrate:
  - Sterilized grain (brown rice, millet, wheat)
  - Silkworm pupae (commercial operations)
  - Sawdust/rice bran blend (advanced)
  mycelium_type: Entomopathogenic parasite in nature; saprobic on sterilized grain
    in cultivation
  fruiting_season: Indoor year-round with controlled environment; 60-90 day grow
    cycles
  cultivation_difficulty: Advanced — requires sterile technique and environmental
    controls
  spawn_type: Liquid culture or grain spawn; agar transfers for genetics preservation
  companions:
  - Ophiocordyceps host insects -- parasitizes specific insect larvae in forest soil
  - Oak -- forest floor habitat where host insects pupate
  - Pine -- conifer duff provides the moist habitat for host arthropod lifecycles
  cautions:
  - Open-air cultivation is not viable — contamination rates will be near 100%
  - Do not confuse with Ophiocordyceps species; taxonomy has shifted significantly
  pests:
  - Fungus Gnats
  - Mites
  practitioner_notes: |-
    Sterility is the entire job — every shortcut in prep shows up as Trichoderma
    or bacterial slime within a week.
    Full grain colonization before fruiting conditions is non-negotiable; rushing
    to pinning stage yields stunted, aborted clubs.
    CO₂ management is the most common failure point in tents — fresh air exchange
    beats humidity obsession every time.
    Log fruiting parameters from every batch; small environmental variables compound
    across cycles and you cannot fix what you did not track.
    Yellow sticky cards plus top-dry substrate cycles beat drowning your jars in
    misdirected kindness when gnats appear.
  growth_habit: Entomopathogenic in nature; cultivated on sterilized grain substrates
    indoors
