  description: "Ohio spiderwort (Tradescantia ohiensis) is a resilient prairie-edge perennial with arching grass-like leaves and three-petaled blue-violet flowers that open in morning cool and melt by afternoon heat—a honest schedule for busy pollinators. Plants form clumps 1–2 feet (30–60 cm) tall, spreading slowly into sunny openings. Young shoots and flowers are mild edibles where identification is certain, and the plant excels in meadow strips, rain-garden shoulders, and any border tired of thirsty annuals.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; blooms heaviest with good light. Tolerates average to moist soils; occasional drought once established but looks fresher with steady moisture through warm periods. Avoid permanently soggy anaerobic muck; prefers well-drained loam with mulch.\n\n✂️ Propagation:\nDivide clumps in early spring or after flowering; pieces reroot quickly in warm soil. Sow seed outdoors in fall for natural stratification or cold-stratify 4–6 weeks. Deadhead if self-sowing becomes chatty in formal beds.\n\n🌾 Harvest / Best Use Timing:\nGather tender young leaves and flowers in cool mornings for salads—verify ID and site cleanliness. For ornamental use, cut spent stems after the purple flush fades to tidy clumps. Peak bloom tracks lengthening warm days, not a single holiday."
