  description: 'Buffalo gourd is the xeric cucurbit that smells like gym socks and still fed people, oil presses, and craft
    projects where water was a rumor. Roots run deep; fruits are small and attitude-heavy.


    Tolerates heat and sand; hates constant wet feet—give it lean, sunny ground or watch it sulk fungal.


    Sun and water: Full sun. Very drought-tolerant once established; occasional deep soak mimics desert arroyo logic better
    than daily spritzing.

    ✂️ Propagation:

    Seeds; taproot makes transplant of large plants a bad bet.'
