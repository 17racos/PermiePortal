  description: |-
    Buffalo gourd is the xeric cucurbit that smells like gym socks and still fed people, oil presses, and craft projects where water was a rumor. Roots run deep; fruits are small and attitude-heavy.
    
    Tolerates heat and sand; hates constant wet feet—give it lean, sunny ground or watch it sulk fungal.
    
    Sun and water: Full sun. Very drought-tolerant once established; occasional deep soak mimics desert arroyo logic better than daily spritzing.
    ✂️ Propagation:
    Seeds; taproot makes transplant of large plants a bad bet.
    
    🌾 Harvest / Best Use Timing:
    - Buffalo Gourd: pick fruits young for vegetable use or fully ripe for seed and sweetness goals -- one plant rarely serves both fantasies.
    - Cut stems morning; afternoon wilt reduces quality fast above 90°F (32°C).
    - Check trellis daily during peak set; hidden fruits split after rain.
