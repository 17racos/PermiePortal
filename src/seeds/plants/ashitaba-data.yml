  description: 'Ashitaba (Angelica keiskei) is a long-lived Japanese perennial umbellifer with thick celery-ish stems and
    glossy compound leaves; the common name nods to basal sprouting after cutting—"tomorrow leaf" folklore meets a plant that
    actually resprouts if the crown stays healthy. Mature clumps reach roughly 3–4 feet in humid shade gardens and throw umbels
    of small white flowers when allowed to bloom. Flavor is bitter-green; treat medicinal chatter online with the skepticism
    it earns.


    ☀️💧 Sun and Water Requirements:

    - Part sun to bright shade in subtropical and tropical Americas; avoid blasting midday sun on shallow roots.

    - Rich, moist, well-drained soil; steady humidity suits subtropical and tropical porches—never let containers dry to dust.

    - Heavy mulch cools the root crown through humid summers and cuts splash-borne rot drama.


    ✂️ Propagation:

    - Fresh seed (viability drops fast—sow soon after receipt) in warm, humid media.

    - Crown division in warm wet weather; keep each piece rooted and shaded until new growth firms up.


    🌾 Harvest / Best Use Timing:

    - Snip young leaves and tender stem tips for small culinary trials—positive Apiaceae ID first, always.

    - If saving seed, let a few stems flower for pollinators, then collect when umbels brown and dry.'
