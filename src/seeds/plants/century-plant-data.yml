  practitioner_notes: 'Bloom spike is a retirement party—plan pups before the mother rosette collapses post-seed.

    Wet crown in frost invites rot—grit and slope beat tarp hats that hold moisture against the heart.

    Weevil larvae sometimes tunnel hearts—fishy smell or collapsing newest leaves means surgery or removal, not denial.

    Pups root faster if dried a day after removal—wet potting immediately invites basal black mush.'
