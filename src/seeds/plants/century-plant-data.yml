  description: |-
    Century plant is the meme agave: rosette for years, then one absurd flowering spike, then the rosette dies like it finished the boss fight. Sap can irritate skin; spine tips file human stupidity down to the bone. Edible use centers on roasted hearts and careful processing traditions — not random backyard tequila fantasies without permits and sense. In subtropical and tropical Americas it grows bold until a wet winter tries to rot the crown; drainage is non-negotiable.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun and lean, gritty, well-drained soil; wet clay is a death sentence with extra drama.
    - Extremely drought-tolerant once established; summer rain is fine if soil sheds water fast.
    - Cold: dry cold tolerates better than cold + wet.
    
    ✂️ Methods to Propagate:
    - Pups: remove offsets when roots have started; let cuts callus before potting.
    - Bulbils on inflorescence (species/clone dependent) can be rooted when present.
    
    🌾 Harvest / Best Use Timing:
    - Piña harvest is a years-long commitment -- mark planting dates and size targets before you commit tools.
    - Cut leaves close to the core with sharp pikes; sap irritates skin for many people -- gloves and eye sense.
    - After harvest, dry or cook processing lines matter as much as field timing; sweet agave work is not a midnight whim.
  purpose: |-
    Edible: Century Plant yields human food from the parts your description documents -- pods, fruits, leaves, roots, or seeds depending on variety and timing -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Fiber: Century Plant supplies harvestable fiber where small-scale cordage, crafts, or mulch substitutes beat buying plastic twine -- supplies harvestable fiber for cordage, crafts, or mulch substitutes where woody biomass is scarce
    Ornamental: Century Plant earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Erosion Control: Century Plant networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Mulcher: Century Plant tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
