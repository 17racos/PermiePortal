  description: 'Century plant is the meme agave: rosette for years, then one absurd flowering spike, then the rosette dies
    like it finished the boss fight. Sap can irritate skin; spine tips file human stupidity down to the bone. Edible use centers
    on roasted hearts and careful processing traditions — not random backyard tequila fantasies without permits and sense.
    In subtropical and tropical Americas it grows bold until a wet winter tries to rot the crown; drainage is non-negotiable.


    ☀️💧 Sun and Water Requirements:

    - Full sun and lean, gritty, well-drained soil; wet clay is a death sentence with extra drama.

    - Extremely drought-tolerant once established; summer rain is fine if soil sheds water fast.

    - Cold: dry cold tolerates better than cold + wet.


    ✂️ Methods to Propagate:

    - Pups: remove offsets when roots have started; let cuts callus before potting.

    - Bulbils on inflorescence (species/clone dependent) can be rooted when present.'
  purpose: 'Century plant is armored biomass for dry edges:


    - Edible: Traditional foods from pit-roasted hearts where legal and culturally appropriate — not casual nibbling.

    - Fiber: Leaf fiber historically used where processing exists.

    - Ornamental: Architectural rosettes for xeric design.

    - Erosion Control: Roots stabilize rocky slopes in dry microclimates.

    - Mulcher: Spent leaves chop-and-drop sparingly — spines complicate handling.'
  companions:
  - Prickly pear
  - Desert spoon
  - Low sedums
  cautions:
  - Shade and irrigation addiction
  - High-traffic paths (spines)
  pests:
  - Asparagus Beetle
  - Borers
  - Scale insects
  practitioner_notes: 'Bloom spike is a retirement party—plan pups before the mother rosette collapses post-seed.

    Wet crown in frost invites rot—grit and slope beat tarp hats that hold moisture against the heart.

    Weevil larvae sometimes tunnel hearts—fishy smell or collapsing newest leaves means surgery or removal, not denial.

    Pups root faster if dried a day after removal—wet potting immediately invites basal black mush.'
