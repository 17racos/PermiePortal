  description: "Dill (Anethum graveolens) is an aromatic, feathery-leaved annual herb that grows up to 90 cm (3 feet) tall.\
    \ It produces delicate, umbrella-shaped clusters of yellow flowers that attract beneficial insects. The entire plant,\
    \ including leaves, seeds, and flowers, is edible.\n\nDill thrives in well-drained, slightly acidic to neutral soil and\
    \ is commonly used as a culinary and medicinal herb. It self-seeds easily, making it a great addition to herb gardens\
    \ and food forests.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade.\n\
    - Grows best in well-drained, sandy or loamy soil.\n- Requires moderate watering; avoid overwatering to prevent root rot.\n\
    \n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct sow in early spring or late summer; does not transplant well.\n\
    - Self-seeding: Reseeds easily if flowers are left to mature.\n- No division: Best grown from seed rather than division\
    \ or cuttings.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Leaves can be harvested once plants reach\
    \ 20 cm (8 inches) tall.\n- Flowers should be harvested when fully open for best flavor.\n- Seeds are ready when they\
    \ turn brown and dry on the plant."
