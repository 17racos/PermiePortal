  description: "Silverberry (Elaeagnus commutata) is a cold-hardy deciduous to semi-evergreen
    shrub of North American prairies and open woods, bearing silvery-scaly leaves,
    fragrant pale flowers in spring, and dry, mealy red-speckled drupes enjoyed by
    wildlife. It typically forms thickets 3–10 feet tall from rhizomes, fixing nitrogen
    with actinorhizal root symbionts unlike legumes.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun for dense growth and heaviest fruiting; tolerates wind.\n- Drought-tolerant
    once established in well-drained soil; in subtropical and tropical Americas this species
    is primarily suited to rare cool upland microclimates or trials—heat and humidity
    often favor thorny evergreen Elaeagnus instead, so treat silverberry as a continental
    design plant unless you can mimic dry-cool nights.\n\n✂️ Methods to Propagate:\n-
    Seeds: stratify drupes, clean seed, sow in cool conditions; germination can be slow.\n-
    Hardwood cuttings: take in dormant season, use rooting hormone, keep humid until
    callus forms.\n\n🌾 When to Harvest:\n- Fruit is mealy and astringent fresh but
    usable dried or processed; pick when fully silvery-red and softening. Thin old
    stems after fruiting to renew vigor."
