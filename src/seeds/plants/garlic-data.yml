  description: "Garlic (Allium sativum) is a bulbous perennial typically grown as
    an annual for its pungent, edible cloves. The plant has long, slender leaves and
    produces small white or purple flowers. It is one of the oldest cultivated plants
    and is valued for both culinary and medicinal uses.\n\nGarlic thrives in well-drained,
    fertile soil with full sun exposure. It is commonly used as a companion plant
    due to its strong aroma, which repels many pests and improves overall garden health.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun for optimal
    growth.\n- Requires well-drained, fertile soil; sandy loam is ideal.\n- Moderate
    water needs; avoid overwatering to prevent bulb rot.\n\n✂️\U0001FAD8 Methods to
    Propagate:\n- Cloves: Plant individual cloves in fall for a summer harvest.\n-
    Bulbils: Some varieties produce small bulbils in flower heads, which can be replanted.\n-
    No seeds: Garlic rarely produces viable seeds and is best propagated by cloves.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Harvest when leaves turn yellow and begin to dry out, typically
    8–10 months after planting.\n- Allow bulbs to cure in a dry, shaded area for 2–3
    weeks before storage.\n- Can be used fresh or stored for long-term use in a cool,
    dry place."
  purpose: |-
    Garlic serves multiple functions in a permaculture system:

    - Edible: Cloves are used in cooking, herbal medicine, and preservation.
    - Medicinal: Has antimicrobial, antifungal, and cardiovascular health benefits.
    - Pest Management: Repels aphids, mites, and nematodes; used as a natural pesticide.
    - Dynamic Accumulator: Accumulates sulfur, which can improve soil health.
    - Border Plant: Used in garden borders to deter pests and enhance soil microbiology.
