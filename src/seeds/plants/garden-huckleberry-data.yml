  description: "Garden huckleberry (Solanum melanocerasum) is a fast-growing warm-season solanaceous annual widely grown in\
    \ temperate to subtropical gardens for cooked berries and sometimes young cooked greens, with glossy leaves and dark fruits\
    \ that demand full ripening and cooking—green berries and foliage carry solanine baggage. It is not a wild Vaccinium huckleberry;\
    \ the name is garden-center poetry. Use it in diversified annual beds, subsistence polycultures, and teaching gardens\
    \ where nightshade literacy is part of the curriculum.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n Full sun; fertile,\
    \ well-drained loam with steady moisture yields largest plants. Heat-tolerant in humid summers; stops hard below about\
    \ 50°F (10°C) growth thresholds. Avoid waterlogging—damping-off murders seedlings. In cool-temperate zones, start transplants\
    \ indoors after last frost risk.\n\n✂️ Propagation:\nSow seeds indoors 6–8 weeks before warm planting or direct-sow into\
    \ warm soil.\nTake soft tip cuttings in tropical perennializations if you overwinter plants in frost-free tunnels.\n\n\
    \ \U0001F33E Harvest / Best Use Timing:\nPick leaves young for cooking greens. Harvest berries only when fully soft, dark,\
    \ and ripe; cook into pies or jams with sugar and acid—never snack unripe fruit unless you enjoy solanine theater."
