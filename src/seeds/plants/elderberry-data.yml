  description: "Elderberry (Sambucus nigra) is a fast-growing, deciduous shrub reaching
    heights of 2–4 meters (6–12 feet). It produces clusters of small, fragrant white
    flowers followed by dark purple to black berries in late summer. \n\nThis hardy
    plant thrives in moist, well-drained soil and is commonly found along riverbanks,
    woodlands, and hedgerows. It is widely cultivated for its edible and medicinal
    uses, as well as its ability to attract pollinators and wildlife.\n\n \U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade.\n-
    Requires moist, well-drained soil but can tolerate occasional drought.\n- Benefits
    from deep watering during dry spells.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Seeds: Sow in fall or cold-stratify before planting in spring.\n- Cuttings: Softwood
    cuttings in spring or hardwood cuttings in late winter root easily.\n- Suckers:
    Can be propagated by transplanting root suckers.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Flowers are harvested in late spring or early summer for teas
    and syrups.\n- Berries are ready for harvest in late summer to early fall when
    fully ripe and dark purple-black.\n- Only ripe berries should be used; unripe
    berries contain toxins."
