  description: "Lanceleaf coreopsis (Coreopsis lanceolata) is a sunny perennial wildflower of prairies, roadsides, and open\
    \ woods in eastern and central North America, with lance-shaped leaves and large golden-yellow ray flowers on wiry stems\
    \ that dance in wind like they owe money to gravity. It is a dependable pollinator plant for bees and butterflies and\
    \ a self-seeding citizen in meadow mixes—sometimes enthusiastic enough to need editing. Use it in rain-garden berms, pollinator\
    \ strips, and chop-and-drop edges where turf is a political statement you lost.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n\
    \ Full sun; lean, well-drained soils reduce flop and prolong bloom. Tolerates drought once established; overwatering and\
    \ rich compost produce lush stems that lodge in storms. Not for deep shade or soggy clay without amendment. Cold-hardy\
    \ into northern temperate zones; wet winters on heavy soil can shorten lifespan—treat as short-lived perennial and allow\
    \ self-sowing.\n\n✂️ Propagation:\nSow seed in fall or early spring; barely cover.\nDivide mature clumps in early spring\
    \ or fall to refresh vigor.\n\n \U0001F33E Harvest / Best Use Timing:\nDeadhead to extend bloom or allow seed for finches\
    \ and natural regeneration. Cut spent stems in late winter for insect nesting habitat where tidy culture is not law."
