  description: "Lavender (Lavandula angustifolia) is a perennial, aromatic herb known
    for its fragrant purple flowers and gray-green foliage. It grows up to 60–90 cm
    (2–3 feet) tall and is widely cultivated for essential oil production, medicinal
    uses, and as an ornamental plant.\n\nThis drought-tolerant plant thrives in full
    sun and well-drained, sandy or loamy soils. It attracts pollinators, repels certain
    pests, and adds beneficial organic matter to the soil when used as mulch.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Requires full sun with at
    least 6–8 hours of direct sunlight daily.\n- Prefers well-drained, sandy or rocky
    soil; does not tolerate heavy clay.\n- Drought-tolerant once established; water
    sparingly to prevent root rot.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds:
    Start indoors 8–10 weeks before the last frost; germination is slow.\n- Cuttings:
    Softwood cuttings in spring or hardwood cuttings in fall.\n- Division: Established
    plants can be divided and replanted.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Flowers should be harvested when buds are fully formed but
    before full bloom for the highest essential oil content.\n- Cut stems early in
    the morning when oils are most concentrated.\n- Dry in a shaded, well-ventilated
    area for long-term storage."
  purpose: |-
    Lavender serves multiple functions in a permaculture system:

    - Medicinal: Used for relaxation, sleep aid, wound healing, and skin care.
    - Pollinator: Flowers attract bees, butterflies, and other beneficial insects.
    - Wildlife Attractor: Provides nectar for pollinators and improves biodiversity.
    - Mulcher: Dried lavender leaves break down into the soil, adding organic matter.
    - Dynamic Accumulator: Helps improve soil structure and aeration.
    - Border Plant: Works well in garden edges, pathways, and herbal beds.
    - Pest Management: Repels moths, mosquitoes, fleas, and aphids with its strong fragrance.
