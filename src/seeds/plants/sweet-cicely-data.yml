  description: |-
    Sweet cicely is a big, soft Apiaceae perennial with ferny leaves, a gentle anise scent, and umbels of white flowers that read "Victorian cottage meets bear buffet." Leaves, unripe seeds, and roots have been used like sweet seasoning — reduces sugar need in fruit dishes say the old herbals. It prefers cool, moist summers; subtropical and tropical Americas is marginal, so plant in dappled shade with rich soil and realistic expectations.
    
    ☀️💧 Sun and Water:
    - Light shade to half-day sun in hot climates.
    - Steady moisture; mulch to keep roots cool.
    - Deep, humus-rich loam.
    
    ✂️ Propagation:
    - Fresh seed (germination drops as seed ages).
    - Division in early spring or fall.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Sweet Cicely growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
