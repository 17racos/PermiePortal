  description: "Sweet cicely is a big, soft Apiaceae perennial with ferny leaves,
    a gentle anise scent, and umbels of white flowers that read \"Victorian cottage
    meets bear buffet.\" Leaves, unripe seeds, and roots have been used like sweet
    seasoning — reduces sugar need in fruit dishes say the old herbals. It prefers
    cool, moist summers; North Florida is marginal, so plant in dappled shade with
    rich soil and realistic expectations.\n\n☀️💧 Sun and Water:\n- Light shade to
    half-day sun in hot climates.\n- Steady moisture; mulch to keep roots cool.\n-
    Deep, humus-rich loam.\n\n✂️ Propagation:\n- Fresh seed (germination drops as seed
    ages).\n- Division in early spring or fall."
  purpose: |-
    Sweet cicely is shade-edge flavor and insect fuel:

    - Edible: Anise-sweet foliage and seeds for kitchen experiments.
    - Medicinal: Traditional digestive/carminative uses — standard herb disclaimers apply.
    - Pollinator: Umbellifers pull short-tongued bees and beneficial flies.
    - Wildlife Attractor: Insect diversity around bloom.
    - Border Plant: Tall, airy backdrop in moist partial shade.
