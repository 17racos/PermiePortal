  description: 'Coastalplain honeycombhead (Balduina angustifolia) is a perennial sunflower relative of sandy pine savannas
    and coastal plain scrub, forming a basal rosette of narrow leaves and sending up 1–3 foot (0.3–0.9 m) stems topped with
    yellow composite heads in late summer to fall. The disk looks honeycombed up close—nature’s answer to overdesigned garden
    art. In restoration and native gardens on well-drained, low-nutrient sand it supports late-season pollinators when many
    early forbs have clocked out.


    ☀️💧 Sun and Water Requirements:

    Full sun for strong stems; shade causes flop. Tolerates droughty sand once established; still benefits from occasional
    deep watering during prolonged dry spells in container trials. Avoid heavy clay and chronic irrigation that feeds competing
    weeds.


    ✂️ Propagation:

    Sow seed after cold stratification or fall-sow outdoors; germination improves with warmth and light. Divide mature rosettes
    in early spring before bolting. Avoid rich compost topdressing that shifts competitive balance toward generic weeds.


    🌾 Harvest / Best Use Timing:

    Leave flowers for pollinators; collect dry seed heads when brown for restoration mixes. Cut spent stalks in late winter
    if tidy aesthetics matter—otherwise leave stems for stem-nesting insects.'
  purpose: '- Pollinator: Late yellow composites feed bees and butterflies when nectar menus thin.

    - Ornamental: Honeycomb disks and narrow foliage suit native sandhill aesthetics without mulch cosplay.

    - Wildlife Attractor: Seeds feed songbirds if heads stand into autumn.

    - Erosion Control: Roots stabilize sandy cuts and road edges in fire-maintained ecosystems.

    - Border Plant: Defines sunny, lean beds where thirsty exotics would demand irrigation apologies.'
  companions:
