  description: 'Rattlesnake master (Eryngium yuccifolium) is a striking prairie perennial of central and eastern North America
    with yucca-like leaves and spherical white flower heads that hum with insect life. Deep taproots punch through tough soils
    where shallow-rooted perennials stall. It belongs in meadow plantings, bioswale berms, and pollinator strips that refuse
    to look like bedding annuals.


    ☀️💧 Sun and Water Requirements:

    - Full sun; shade causes weak floppy stems.

    - Drought tolerant once established; still benefits from occasional deep watering in sand.

    - Well-drained to mesic soils; tolerates clay if winter wet does not rot crowns.


    ✂️ Propagation:

    - Seeds: cold moist stratify; germination improves after winter.

    - Root cuttings from young plants; older taproots resent disturbance.

    - Transplant small seedlings; mature plants sulk if moved casually.


    🌾 Harvest / Best Use Timing:

    - Roots historically appear in herbal literature—modern use belongs to trained practitioners.

    - Leave most flower heads for pollinators; collect seed when spheres brown and detach easily.

    - Cut old stems in late winter to leave hollow stalks for cavity-nesting insects.'
  purpose: '- Edible: Young leaves and roots have limited traditional uses; caution and positive ID are mandatory.

    - Pollinator: Dense flower heads attract bees, wasps, beetles, and butterflies in high summer.

    - Wildlife Attractor: Seeds feed birds; structure shelters overwintering insects.

    - Ornamental: Architectural foliage suits dry gardens and modern prairie palettes.'
  companions:
  - Narrowleaf Mountain Mint — fine-leaved insectary contrast beside bold eryngium rosettes
  - Mountain Mint — late-summer pollinator synergy with overlapping bloom windows
  - Roughleaf Dogwood — shrub backdrop that frames tall prairie forbs without shading them flat
