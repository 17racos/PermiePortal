  description: 'Jakfruit (Artocarpus heterophyllus) is a large evergreen to briefly deciduous tree of South and Southeast
    Asian origin, widely planted in humid tropics for enormous compound fruits that can exceed human patience and kitchen
    counter space. Trees often reach 30–70 feet (9–21 m) with glossy leaves and sticky latex. It is a staple carbohydrate
    and fruit crop in tropical food forests where heat is reliable and frost is mythology.


    ☀️💧 Sun and Water Requirements:

    Full sun for heavy fruiting; young trees tolerate light shade during establishment. Deep, fertile, well-drained soils
    with steady moisture in the warm season; tolerates short dry spells in humid air with mulch. Protect from desiccating
    wind on young plants.


    ✂️ Propagation:

    Graft known cultivars for fruit quality; seedlings vary wildly. Air-layering and budding are common in the tropics. Prune
    for strong scaffold branches—heavy fruit punishes weak crotches.


    🌾 Harvest / Best Use Timing:

    Harvest when odor and color shift per cultivar cues; unripe fruit cooks as vegetable, ripe fruit as dessert chaos. Sap
    sticks to tools and pride—oil blades and gloves. Process quickly in heat to avoid fermentation surprises.'
  purpose: '- Edible: Immature and mature stages diversify meals from curries to sweets on one tree.

    - Shade Provider: Broad canopy shelters understory in humid tropical polycultures.

    - Mulcher: Large leaves build biomass for chop-and-drop when cycled responsibly.

    - Animal Fodder: Seeds and surplus pulp can feed livestock where local practice supports safe use.'
  companions:
  - Banana — fast biomass neighbor during jackfruit establishment years
  - Papaya — early fruiting gap-filler before jack canopy closes the sky
