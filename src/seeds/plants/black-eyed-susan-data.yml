description: |-
  Black-eyed Susan (Rudbeckia hirta) is a familiar aster-family perennial or short-lived perennial across much of North America, though many garden strains behave as biennials in hot southern gardens. Hairy stems carry rough leaves and golden-yellow ray flowers around a dark brown central cone, typically reaching roughly 2–3 feet in bloom.

  subtropical and tropical Americas welcome it as a warm-season wildflower where soil drains and air moves—coastal breezes help; stagnant humid pockets invite foliar ugliness. It reseeds freely—design for succession, not shock when volunteers arrive.

  ☀️💧 Sun and Water Requirements:
  - Full sun for stiff stems and heavy flower load; partial shade trades flowers for stretchy weakness.
  - Average, well-drained soil; drought-tolerant once established—overhead sprinklers every night are mildew donations.

  ✂️ Methods to Propagate:
  - Seeds: surface sow in spring after last frost danger; thin to avoid fungal pile-ups.
  - Division of clumps in spring or fall for named perennial selections—wild-type often easier from seed.

  🌾 Harvest / Best Use Timing:
  - Cut flowers at early opening for bouquets; deadhead if you fear self-seeding, leave seed heads if you love finches.
  - For biomass chop-and-drop, cut stems after seeds mature if you are not collecting—compost hot.
purpose: |-
  Pollinator: Rudbeckia hirta golden rays and chocolate cones feed sweat bees, syrphids, and small butterflies through August heat when many spring forbs quit -- deadheading cuts seed but also cuts finch groceries.
  Wildlife Attractor: Goldfinches shred dry cones while hairy stems shelter overwintering lacewings if you leave standing dead through March -- tidy February buzzcuts delete that habitat invoice.
  Border Plant: 60-90 cm clumps read clearly from paths across grass-heavy food forests -- biennial strains in hot south behave like short-lived perennials, so plan reseeding strips.
  Ornamental: Gloriosa-type doubles amp cottage drama; straight species reads meadow honest -- rust on lower leaves is genotype × humidity conversation, not moral failure.
  Biomass: Cut spent stalks after seeds drop for carbon-heavy chop-and-drop between comfrey dumps -- mix with high-nitrogen greens so piles do not sour anaerobic.
companions:
