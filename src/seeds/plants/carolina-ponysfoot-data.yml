  description: 'Carolina ponysfoot (Dichondra carolinensis) is a native, creeping perennial herb of warm-temperate to subtropical
    North America, forming mats of small kidney-shaped leaves on slender stems that root at nodes. It hugs soil in partial
    shade to sun with adequate moisture, filling gaps between pavers, pond edges, and low shade paths where turf struggles.
    Height stays under a few inches, spreading widely in favorable microclimates.


    ☀️💧 Sun and Water Requirements:

    Partial shade to full sun in humid climates; afternoon shade reduces scorch in hot dry sites. Consistent moisture produces
    the lushest mats; drought induces dormancy or browning. Well-drained but water-retentive soil is ideal; salty irrigation
    water can burn margins.


    ✂️ Propagation:

    Divide mats in spring; keep moist until rooted. Take stem cuttings with nodes and root in humid shade. Allow controlled
    spread from plugs into prepared gaps—edging may be needed near formal beds.


    🌾 Harvest / Best Use Timing:

    Occasionally grazed as a minor edible green in some traditions—verify identity and cleanliness before tasting. For groundcover,
    trim ragged edges with shears after winter damage; top-dress thin areas with compost in wet season to speed fill.'
  purpose: '- Ground Cover: Living mulch that cools soil and excludes weeds in light-traffic zones.

    - Ornamental: Rounded leaves give a clover-like look without the same invasiveness issues in some regions.

    - Erosion Control: Dense mats bind soil on gentle slopes and pond margins.

    - Wildlife Attractor: Low cover shelters small insects and amphibians in moist gardens.'
  companions:
  - Dwarf Mondo Grass — fine texture contrast in shade paths with similar moisture needs
  - Blue Flag Iris — upright leaves rise from dichondra carpets at pond edges
  - Swamp Sunflower — taller seasonal color behind low ponysfoot foreground in wet sun
  cautions:
  - Foot traffic — not a sports lawn substitute; breaks down under heavy compaction
  - Winter cold — marginal in cooler zone 7 without protected microsites
  pests:
  - Slugs
  - Snails
  - Sweet Potato Weevil
  practitioner_notes: 'Kidney-shaped leaves + rooting nodes = dichondra bingo; do not confuse with dollarweed unless you enjoy
    mistakes.

    Drought brown patches often resprout from nodes when rains return—wait before declaring funeral.

    Between pavers, it is charming until it swallows the joints—edging is design, not fussiness.

    Salt spray near coasts bronzes margins—freshwater rinse after storms buys time.'
