  description: "Florida pusley (Richardia scabra) is a low, branching annual to short-lived
    perennial forb of disturbed ground, lawns, and field edges across warm parts of
    the Americas, with whorled leaves, small white flowers, and a tolerance for mowing
    that turf managers find rude. It is listed by some sources as a mild edible green
    when young—identification and clean sites matter more than enthusiasm. Ecologically,
    it is a living diagnostic of compaction, irrigation schedules, and soil fertility
    patterns: abundant pusley usually means the ground is telling you a story you
    tried to mute with grass seed.\n\n☀️💧 Sun and Water Requirements:\nFull sun to
    light shade; thrives where soil stays intermittently moist and fertility is modest
    to high. Tolerates drought once established but looks lush with lawn-level irrigation—hence
    the conflict. Poor drainage plus overwatering produces mats; reducing irrigation
    shifts competition back toward chosen ground covers.\n\n✂️ Propagation:\nSeeds
    germinate quickly on disturbed soil; rake-exposed beds repopulate in warm weather.\n
    Stem fragments can reroot in wet conditions—clean tools between beds if you need
    to limit spread.\n\n🌾 Harvest / Best Use Timing:\nIf foraging, collect young
    leaves before flowering from unsprayed areas; wash well. For management, mow or
    hand-pull before seed set to slow bank deposits in managed turf."
  purpose: |-
    - Ground Cover: Dense low mats protect soil from splash erosion in wet, disturbed sites.
    - Wildlife Attractor: Small flowers feed tiny pollinators often ignored in lawn deserts.
    - Mulcher: Rapid growth returns organic matter when turned in or composted from pulled mats.
    - Edible: Young leaves are reported edible in some traditions—verify ID and site cleanliness first.
  companions:
  - Clover — legume companion in low turf polycultures; shares mowing height experiments
  - Dichondra — alternative lawn species that can coexist or compete depending on water
  - Purslane — succulent ground layer in similar disturbed, sunny niches
  cautions:
  - Do not eat from sprayed lawns or uncertain irrigation water—soluble salts and herbicide residues do not rinse away with optimism
  pests:
