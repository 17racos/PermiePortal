  description: 'Coccinia grandis is the tropical cucurbit vine that climbs like it is paid by the vertical inch and fruits
    like a cherry tomato that went gourd. Florida reality: regulated invasive in much of the state — birds spread seeds, vines
    mantle trees, and land managers develop opinions about your life choices. Only grow with containment you can defend ethically
    and legally.


    ☀️💧 Sun and Water Requirements:


    Full sun for best fruit load.

    Fertile, well-drained soil with steady moisture during growth.

    Strong trellis or you will hate yourself.


    ✂️ Propagation:


    Cuttings root readily — which is also why escapes happen.

    Seeds from ripe fruit; label lines to reduce surprise genetics.


    🌾 Harvest / Best Use Timing:


    Green fruit for crunchy cooking; red soft fruit for sweeter uses — harvest often or the vine sets seed and the ecosystem
    sends invoices.'
