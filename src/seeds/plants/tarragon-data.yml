  growth_habit: Upright herbaceous perennial
  description: |-
    French tarragon (Artemisia dracunculus) is a sterile, vegetatively propagated herb prized for its sweet anise-like leaves and clean, warm aroma. Plants form clumps of narrow, smooth leaves typically 60 to 90 cm (2 to 3 feet) tall with a spreading habit. True French tarragon must come from cuttings or divisions; seed packets labeled tarragon are usually inferior Russian types with harsher flavor.

    It suits temperate kitchen gardens and perennial herb borders from cool-summer maritime climates to continental zones, and it translates well to high-elevation tropics as a cool-season annual where summer heat is extreme.

    Provide full sun to light afternoon shade and fertile, well-drained soil with steady moisture during the growing season; it dislikes wet feet in winter. In hot-summer climates, mulch roots and site where it receives morning sun.

    Take stem cuttings in late spring, or divide established crowns in early spring before new growth accelerates. Root divisions with several buds in compost-enriched soil and water until new shoots firm up.

    Snip leafy tips through the growing season for fresh use; harvest heavily before flowering for drying, then hang bundles in shade with good airflow. Flavor peaks before intense heat or bloom.
  purpose: |-
    Edible: Leaves flavor vinegar, butter, poultry, and early summer sauces without heavy oils -- volatile estragole carries the signature aroma best when added at the end of cooking.
    Medicinal: Traditional European use centers on digestion and appetite -- bitter-tasting leaf teas appear in older herbals; avoid therapeutic dosing in pregnancy without qualified guidance.
    Pollinator: Inconspicuous flowers still draw small pollinators when allowed to bloom lightly -- leave a few stems if seed is not a concern (French tarragon rarely sets viable seed).
    Pest Management: Strong-scented foliage can mask crop odors in mixed beds -- interplant near brassicas or alliums where you want complexity, not monoculture.
    Border Plant: Upright, fine texture contrasts with broad-leaf herbs -- edges paths without shading low sun crops.
