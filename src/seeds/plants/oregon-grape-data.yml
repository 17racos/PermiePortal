  description: |-
    Oregon grape (Berberis aquifolium) is an evergreen, holly-ish shrub with compound, spiny leaflets, bright yellow early-spring flowers, and dusty-blue berries with a tart pucker that educates children about honesty. Plants range from low mounding forms to 6-foot thickets depending on cultivar and site; they prefer woodland edges with organic mulch, not parking-lot heat islands.

    subtropical and tropical Americas: Treat as a northern ornamental experiment in shade and acidic, well-drained soil; humid lowland heat can bring foliar drama—airflow and avoiding shearing wet foliage reduces fungal gossip.

    ☀️💧 Sun and Water Requirements:
    - Part shade to full shade in hot climates; cool regions tolerate more sun if roots stay cool and moist.
    - Medium moisture; drought-tolerant once established but not a desert mascot; improve organic matter.

    ✂️ Propagation:
    - Semi-hardwood cuttings in late summer under humidity; bottom heat speeds rooting if your house is emotionally cold.
    - Seed requires cleaning and stratification for many lots; expect variability—berberis genetics enjoy surprises.

    🌾 Harvest / Best Use Timing:
    - Berries when fully blue with a bloom, after flavor shifts from insult to usable tart; process into jelly or ferment if your palate is brave.
    - Bark and root harvesting for traditional use stresses plants—rotate patches, never strip a single individual like a corporate raider.
  purpose: |-
    - Edible: Tart berries for preserves where sugar exists; not a fresh-snack fantasy unless you enjoy lemon masochism.
    - Medicinal: Berberine-containing tissues appear in herbal practice; legality and dosing are between you and professionals, not this YAML file.
    - Wildlife Attractor: Early nectar feeds bees; berries feed birds after you declare human quota.
    - Border Plant: Spiny foliage defines paths and keeps casual shortcuts honest.
    - Pest Management: Physical deterrence for large browsers; not a magic spray, just botanical attitude.
  companions:
