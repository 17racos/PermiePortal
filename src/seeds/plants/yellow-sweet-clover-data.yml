  description: "Yellow sweet clover (Melilotus officinalis) is a biennial legume
    with bright yellow pea-flowers on tall branching stems and trifoliate leaves
    that smell sweetly of coumarin—especially when dry. First year forms a rosette;
    second year rockets upward 1–2 m (3–6 ft), sets seed, and finishes the job.
    It has escaped cultivation in many regions; use it as a managed cover crop or
    bee forage, not as a gift to fragile natural areas. In subtropical and tropical Americas
    it performs in cool-season windows; summer heat often ends the cycle quickly.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for maximum bloom and nectar.\n- Tolerates
    droughty, poor soils; still benefits from irrigation during establishment.\n-
    Avoid waterlogging—legume roots need air even when rhizobia are working.\n\n✂️
    Methods to Propagate:\n- Scarify hard seed or buy inoculated clover seed; broadcast
    in fall or early spring depending on frost calendar.\n- Thin dense stands if
    saving seed; isolation helps keep lines true.\n- Incorporate before hard seed
    set if using strictly as green manure—late timing means volunteer melilot next
    year.\n\n🌾 Harvest / Best Use Timing:\n- Cut at early bloom for maximum biomass
    and manageable coumarin considerations in forage contexts.\n- Beekeepers value
    full bloom; land managers balance pollinators against seed rain."
  purpose: |-
    Yellow sweet clover is a biennial nitrogen hose with attitude:

    - Nitrogen Fixer: Rhizobia on roots bank fertility for the following crop rotation.
    - Biomass: Tall stems add carbon-heavy mulch when mowed or crimped on schedule.
    - Wildlife Attractor: Abundant flowers support bees and other pollinators during peak bloom.
    - Animal Fodder: Used cautiously in hay systems—coumarin issues spike with moldy, spoiled feed; know your livestock limits.
