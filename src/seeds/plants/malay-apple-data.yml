  description: 'Malay apple (Syzygium malaccense) is a tropical myrtle-family tree of humid lowlands, bearing large glossy
    leaves, puffy red-to-white flowers, and oblong, bell-shaped fruit often red or white with crisp, mild, watery flesh. Heights
    of 30–60 feet (9–18 m) occur in open growth. It is a backyard fruit and shade tree in equatorial and humid subtropical
    climates where fruit flies are managed and frost is absent.


    ☀️💧 Sun and Water Requirements:

    Full sun for flowering and fruiting; young trees tolerate partial shade. Deep, fertile, well-drained soils with steady
    moisture in the warm season; mulch buffers heat at roots. Wind protection reduces fruit bruising.


    ✂️ Propagation:

    Air-layering and grafting preserve quality; seedlings vary. Prune for strong scaffold branches and reachable fruit. Remove
    inward-crossing wood after harvest cycles.


    🌾 Harvest / Best Use Timing:

    Pick when color deepens and fruit yields slightly to gentle pressure; flavor is mild—season with realistic expectations.
    Process or refrigerate quickly in heat. Expect multiple flowering peaks per year in warm climates.'
  purpose: '- Edible: Fresh fruit and light preserves where mild crunch and floral aroma are appreciated.

