  description: |-
    Giant bulrush is the vertical wetland wallpaper — tall triangular stems, rhizomatous expansion, and a work ethic for stabilizing pond margins. Not the edible headline like duck potato; more the structure and filtration crew. In subtropical and tropical Americas it belongs in restoration and intentional wetland cells, not dry berms.

    ☀️💧 Sun and Water Requirements:
    - Full sun in shallow water or saturated soils along edges.
    - Tolerates seasonal flooding and some brackish influence depending on ecotype.
    - Rhizomes spread — contain with liners or design for expansion.

    ✂️ Methods to Propagate:
    - Rhizome division: transplant chunks with roots in warm wet weather.
    - Seeds: available for restoration; establishment slower than vegetative plugs.
  purpose: |-
    Giant bulrush is wetland engineering:

    - Water Purifier: Dense roots trap sediment and take up nutrients from stormwater drama.
    - Wildlife Attractor: Cover for birds, amphibians, and insects at the water interface.
    - Mulcher: Dead stems compost into marsh detritus pathways.
    - Erosion Control: Rhizome mats armor shorelines against wave and wake nonsense.
  companions:
