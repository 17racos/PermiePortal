  description: "Butterfly Ginger (*Hedychium coronarium*) is an upright perennial
    native to the forest understory of Asia. It typically reaches heights of 1.2 to
    1.5 meters (4 to 5 feet) and spreads about 1.2 to 1.8 meters (4 to 6 feet). The
    plant features long, lanceolate green leaves arranged alternately along its stems.
    During late summer to fall, it produces fragrant white flowers reminiscent of
    butterflies, which are particularly attractive to pollinators. The plant thrives
    in hot and humid conditions, preferring consistently moist soils.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nButterfly Ginger flourishes in full sun to partial
    shade. In hotter climates, providing afternoon shade can help prevent leaf scorch.
    The plant prefers consistently moist, well-draining soils and benefits from regular
    watering, especially during dry periods.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation
    is commonly achieved through division of rhizomes. This is best done in early
    spring before new growth begins. Dig up the clump, separate the rhizomes ensuring
    each division has at least one growth bud, and replant them at the same depth
    in prepared soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nWhile
    primarily grown for ornamental purposes, in regions where Butterfly Ginger is
    cultivated for its edible and medicinal properties, the rhizomes are typically
    harvested in late fall. This is when the plant's aerial parts begin to die back,
    indicating the rhizomes have stored maximum nutrients."
