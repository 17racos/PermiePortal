  practitioner_notes: 'Chill-hour mismatch is silent failure—low-chill varieties on wrong rootstock bloom thin or abort fruit
    in warm winters.

    Fruiting spurs are short knobby twigs—do not mistake them for dead wood and strip them during zealous pruning.

    Mature apples store longest at about 32°F (0°C) with high humidity—warmer kitchens shorten cellar life fast.'
