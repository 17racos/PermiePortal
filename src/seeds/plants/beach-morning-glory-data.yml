  description: 'Beach morning glory (Ipomoea pes-caprae) is a pantropical perennial vine of upper beaches and frontal dunes,
    famous for running many meters along sand with succulent, bilobed leaves shaped like a goat’s hoof and large pink-purple
    trumpet flowers that open in morning sun. It is a primary sand-binding species in Caribbean, Gulf, Atlantic, and Pacific
    tropical coasts, tolerating salt spray, heat, and periodic burial. The plant rarely climbs tall supports, instead forming
    a low green ribbon behind the high-tide line.


    ☀️💧 Sun and Water Requirements:

    Full sun; requires excellent drainage and tolerates drought between coastal rains. Salt aerosols are normal; rinse is
    provided by storms. Inland use demands lean sand mixes and strict avoidance of overwatering; cold wet soils rot stems
    in marginal winters near 32°F (0°C).


    ✂️ Propagation:

    Root sections of stem with nodes buried in warm sand; keep moist until anchored. Sow seed after soaking overnight; transplant
    small plugs into restoration fabric if crabs are abundant. Avoid importing beach material across regions where this species
    is regulated.


    🌾 Harvest / Best Use Timing:

    Not a standard food crop in modern gardens—historical uses exist but require expert knowledge. For restoration, trim to
    encourage lateral fill before storm season; remove smothered sections after wrack deposits if mats lift and dry.'
  purpose: |-
    Erosion Control: Beach Morning Glory networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ground Cover: Beach Morning Glory carpets soil fast enough to smother early weeds while feeding surface roots and arthropods -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
    Ornamental: Beach Morning Glory earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Beach Morning Glory layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
  companions:
  - Sea Oats — classic pairing on dunes; morning glory lower, grasses higher on the slope
  - Bay Bean — legume neighbor that adds nitrogen to shared sandy substrate
  - Cocoplum — shrubby island between beach vine and inland plantings in subtropical designs
  cautions:
  - Frost — dies back to roots or kills outright where freezes are hard or prolonged
  - Smothering adjacent delicate natives — steer runners with sand trenching or trim
  pests:
