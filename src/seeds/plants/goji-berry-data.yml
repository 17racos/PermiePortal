  description: 'The Goji Berry (Lycium barbarum) is a deciduous woody shrub native to East Asia, growing between 1 to 3 meters
    in height. It features arching branches with pale gray bark and lanceolate leaves that are green and slightly fleshy.
    The plant produces small, tubular flowers that are lavender or light purple, leading to bright orange-red, ellipsoid berries
    approximately 1-2 cm in diameter. These berries are renowned for their sweet taste and high nutritional value.


    🌞💧 Sun and Water Requirements:

    Goji berries prefer full sun, receiving around 6-8 hours of direct sunlight daily. While they can tolerate partial shade,
    berry production may decrease with reduced light. They thrive in well-draining soils rich in organic matter and can tolerate
    moderately fertile soils, including clay. During the first year, maintain consistent soil moisture to help establish the
    plant; once established, goji berries become drought-tolerant. Mulching around the base helps retain soil moisture and
    suppress weeds. :contentReference[oaicite:0]{index=0}


    ✂️🫘 Methods to Propagate:

    Goji berries can be propagated through seeds, cuttings, or division. Seed propagation involves planting seeds in well-draining
    soil and keeping them moist until germination. Softwood or hardwood cuttings can be taken and rooted in a suitable medium.
    Division of established plants is also possible, ensuring each division has adequate roots for successful transplantation.


    🧑‍🌾👩‍🌾 When to Harvest:

    The berries ripen from late summer to early autumn, typically from August to October in the Northern Hemisphere. Harvest
    the bright orange-red berries when they are fully colored and slightly soft to the touch. Handle them gently to avoid
    bruising, as they are delicate when fresh.'
