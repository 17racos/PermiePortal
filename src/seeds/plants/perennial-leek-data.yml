  description: 'Perennial leek refers to perennial forms of Allium ampeloprasum, including the Babington-type clones valued
    in permaculture for returning year after year without replanting. Plants form clumps of strap-like blue-green leaves from
    a swelling base and may produce a tall round flower head of pink-purple florets if allowed to bolt; height is often 2–4
    feet when flowering, shorter as a leafy clump.


    ☀️💧 Sun and Water Requirements:

    - Full sun to partial shade; afternoon shade reduces stress during subtropical and tropical Americas heat waves.

    - Consistent moisture but never waterlogged; rich, organic, well-drained soil mimics its preferred hedgerow niche and
    prevents bulb rot in humid wet seasons.


    ✂️ Methods to Propagate:

    - Offsets: divide clumps in late cool season or early wet season when growth resumes; replant offsets immediately and
    water in.

    - Bulbils: some perennial strains produce aerial bulbils on the flower stalk—collect when firm and sow or tuck into soil
    like miniature bulbs.


    🌾 When to Harvest:

    - Cut outer leaves continuously like a clumping leek; milder when young. For a thicker “stem,” blanch by hilling with
    mulch. In the subtropical/tropical year-round growing period, harvest lightly so the clump keeps regenerating.'
