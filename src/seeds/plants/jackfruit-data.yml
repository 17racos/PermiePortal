  description: 'Jackfruit is the largest tree-borne fruit that shows up in memes and Southeast Asian kitchens—sticky latex,
    enormous syncarps, and a growth rate that laughs at modest lot sizes. Evergreen in the tropics; smaller ‘compact’ selections
    exist for people who read labels. True tropical species; warm subtropical growers push margins; north of that you are
    in greenhouse or “one winter away from heartbreak” territory unless you are very lucky with microclimate.


    ☀️💧 Sun and Water Requirements:


    Full sun for fruit.

    Deep, regular watering when young; established trees take some drought but not limestone desert cosplay.


    ✂️ Propagation:


    Grafting onto seedling rootstock for known fruit types; seeds grow fast but quality varies; air-layering possible for
    some selections.


    🌾 Harvest / Best Use Timing:


    Harvest mature fruit for ripe eating; cut young pods for vegetable-stage curries before latex turns bitter—timing follows
    culinary use.'
