  description: 'Lingonberry (Vaccinium vitis-idaea) is a low evergreen subshrub of cold boreal and montane heaths, forming
    mats with leathery leaves, pale bell flowers, and tart red berries famous in Nordic kitchens. Height is usually under
    1 foot (0.3 m) with creeping stems. It suits acidic edible groundcovers, rock gardens in cool climates, and container
    culture where pH and drainage are controlled honestly.


    ☀️💧 Sun and Water Requirements:

    Full sun in cool summers; partial shade where heat spikes. Moist, acidic, well-drained organic soils; tolerates short
    dry periods in cool air but not droughty heat. Avoid lime and alkaline water that chloroses Ericaceae into yellow ghosts.


    ✂️ Propagation:

    Layer low stems onto moist peat-sand; hold until rooted. Sow seed after cold stratification; slow but possible. Divide
    small clumps in early spring with minimal root disturbance.


    🌾 Harvest / Best Use Timing:

    Berries ripen late in the short season; flavor improves after frost in many sites. Pick for sauce, jam, or drying—birds
    compete, so schedule honestly. Prune old wood lightly after harvest to renew vigor.'
