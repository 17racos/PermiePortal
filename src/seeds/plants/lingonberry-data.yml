  description: "Lingonberry (Vaccinium vitis-idaea) is a low evergreen subshrub of cold boreal and montane heaths, forming mats with leathery leaves, pale bell flowers, and tart red berries famous in Nordic kitchens. Height is usually under 1 foot (0.3 m) with creeping stems. It suits acidic edible groundcovers, rock gardens in cool climates, and container culture where pH and drainage are controlled honestly.\n\n☀️💧 Sun and Water Requirements:\nFull sun in cool summers; partial shade where heat spikes. Moist, acidic, well-drained organic soils; tolerates short dry periods in cool air but not droughty heat. Avoid lime and alkaline water that chloroses Ericaceae into yellow ghosts.\n\n✂️ Propagation:\nLayer low stems onto moist peat-sand; hold until rooted. Sow seed after cold stratification; slow but possible. Divide small clumps in early spring with minimal root disturbance.\n\n🌾 Harvest / Best Use Timing:\nBerries ripen late in the short season; flavor improves after frost in many sites. Pick for sauce, jam, or drying—birds compete, so schedule honestly. Prune old wood lightly after harvest to renew vigor."
  purpose: |-
    - Edible: Tart berries anchor classic sauces and preserves in cold-climate pantries.
    - Ground Cover: Evergreen mat suppresses weeds on acidic beds without turf pretense.
    - Wildlife Attractor: Berries feed birds and mammals where sharing aligns with goals.
    - Ornamental: Glossy leaves and red fruit give winter interest in cool gardens.
  companions:
  - Lowbush Cranberry — related Ericaceous fruiting neighbor with overlapping pH needs
  - Yarrow — insectary forb at the sunnier edge without shading the mat
  - Highbush Cranberry — taller viburnum layer outside the acidic mat for vertical structure
  cautions:
  - Heat and humidity — often struggles south of its comfort band no matter how much you cheer
  - High pH water — chronic iron chlorosis; fix water or choose different crops
  pests:
  - Spider Mites
  - Aphids
  practitioner_notes: |-
