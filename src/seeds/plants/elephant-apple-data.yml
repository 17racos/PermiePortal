  description: "Elephant apple (Dillenia indica) is a tropical tree of Asian lowland forests and village margins, bearing large oblong leaves, showy fragrant flowers, and green woody fruits the size of small melons that require culinary skill. In cultivation it often reaches 30–50 feet (9–15 m) with a rounded crown. It suits humid tropical food forests as a shade tree and seasonal fruit crop where elephants—or humans with recipes—know what to do with the hard, sour fruit.\n\n☀️💧 Sun and Water Requirements:\nFull sun for flowering and fruiting once established; young plants appreciate light shade in blazing equatorial sites. Likes deep, moist, well-drained soils rich in organic matter; tolerates brief dry periods in humid air but not long drought on sand without irrigation. Wind protection helps large leaves avoid tattering during squalls.\n\n✂️ Propagation:\nSow fresh seed warm after removing pulp; viability drops if seed desiccates. Air-layering or grafting is used where superior fruit lines exist. Prune for a single leader in windy sites; open vase forms reduce wind sail on spreading crowns.\n\n🌾 Harvest / Best Use Timing:\nFruits are harvested mature green for pickles and curries in traditional cuisines—raw casual tasting is not the move. Flowers can be abundant; manage nutrient budgets if alternate bearing appears. Mulch fallen leaves—they are large and make honest biomass if you chop them."
