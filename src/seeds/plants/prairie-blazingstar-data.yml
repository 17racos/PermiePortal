  description: "Prairie blazingstar (Liatris pycnostachya) is a tall meadow perennial of central North American prairies and moist low ground, carrying dense spikes of purple florets that open top-down along stems reaching 3–5 feet (0.9–1.5 m). Narrow leaves line the stalks, and fibrous roots anchor plants in loamy soils that swing between moist spring and summer dry downs. It is a staple in pollinator mixes, rain-garden backs, and any sunny border that wants vertical color without shrub bulk.\n\n☀️💧 Sun and Water Requirements:\nFull sun for stiff stems and dense flower spikes; shade causes leaning apologies. Moist, well-drained soils suit it best; tolerates average garden beds if watered during drought. Mulch to keep roots cool; avoid stagnant water over crowns in humid heat.\n\n✂️ Propagation:\nSow seed with cold-moist stratification or direct-sow in fall. Divide clumps in early spring before growth surges. Cut old stems in late winter if tidy gardens matter; otherwise leave for insect nesting.\n\n🌾 Harvest / Best Use Timing:\nCut flowering stems for dried arrangements when color holds along most of the spike. Leave some heads for goldfinches and structural winter interest. Bloom peaks track mid-to-late warm season heat and daylength, not a single holiday."
  purpose: |-
    - Pollinator: Dense floral tubes offer nectar to bees and butterflies during a focused late-season pulse.
    - Wildlife Attractor: Seed heads feed finches; standing stems shelter beneficial insects if not mowed flat.
    - Ornamental: Vertical purple wands add rhythm between grasses and shorter forbs.
    - Erosion Control: Fibrous roots stabilize moist meadow soils on gentle slopes.
  companions:
  - Switchgrass — tall warm-season matrix grass contrasting texture and sharing sun
  - Marsh Blazingstar — related Liatris with overlapping ecology for extended color blocks
  - Wild Bergamot — aromatic forb neighbor with complementary flower shape for pollinators
  cautions:
  - Wet clay without percolation — crown rot during warm humid spells
  - Dry shade — thin spikes and existential flopping
  pests:
  - Aphids
  - Japanese Beetles
  - Powdery Mildew
  practitioner_notes: |-
    Liatris species rhyme in catalogs—this entry is Liatris pycnostachya, the tall prairie form; compare spike density before buying mystery bags.
    Goldfinches shred seed heads—decide between bouquets and bird buffets per row.
    Japanese beetles lace leaves—hand-pick at dusk or deploy traps without luring the whole neighborhood.
    Moisture-loving does not mean swamp—air must still move at the crown after summer storms.
  growth_habit: Tall clumping perennial; dense purple spikes; moist prairie and meadow margins
