  description: 'Prairie blazingstar (Liatris pycnostachya) is a tall meadow perennial of central North American prairies and
    moist low ground, carrying dense spikes of purple florets that open top-down along stems reaching 3–5 feet (0.9–1.5 m).
    Narrow leaves line the stalks, and fibrous roots anchor plants in loamy soils that swing between moist spring and summer
    dry downs. It is a staple in pollinator mixes, rain-garden backs, and any sunny border that wants vertical color without
    shrub bulk.


    ☀️💧 Sun and Water Requirements:

    Full sun for stiff stems and dense flower spikes; shade causes leaning apologies. Moist, well-drained soils suit it best;
    tolerates average garden beds if watered during drought. Mulch to keep roots cool; avoid stagnant water over crowns in
    humid heat.


    ✂️ Propagation:

    Sow seed with cold-moist stratification or direct-sow in fall. Divide clumps in early spring before growth surges. Cut
    old stems in late winter if tidy gardens matter; otherwise leave for insect nesting.


    🌾 Harvest / Best Use Timing:

    Cut flowering stems for dried arrangements when color holds along most of the spike. Leave some heads for goldfinches
    and structural winter interest. Bloom peaks track mid-to-late warm season heat and daylength, not a single holiday.'
