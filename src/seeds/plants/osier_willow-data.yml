  description: "Osier Willow (Salix viminalis) is a fast-growing, deciduous shrub
    or small tree known for its long, flexible branches that make it ideal for basket
    weaving and coppicing. It thrives in moist soils and is often found along riverbanks
    and wetlands. The tree provides valuable wildlife habitat, erosion control, and
    windbreak functions in a permaculture system.\n\n \U0001F31E\U0001F4A7 Sun and
    Water Requirements:\n- Prefers full sun but tolerates partial shade.\n- Thrives
    in moist, well-drained soil but tolerates waterlogged conditions.\n- Requires
    moderate to high watering, especially in dry climates.\n\n✂️\U0001FAD8 Methods
    to Propagate:\n- Cuttings: Root easily from hardwood cuttings in late winter or
    early spring.\n- Seeds: Can be grown from seed but is less common due to the ease
    of propagation from cuttings.\n- Coppicing: Can be cut back regularly to encourage
    new growth.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Branches for weaving should be harvested in winter when dormant.\n- Coppiced wood
    can be cut back every 1-2 years for optimal growth."
