  description: |-
    Elder is a fast-suckering shrub or small tree famous for foamy white flower clusters that smell like summer sneaked into a beehive. Berries and flowers are edible only with correct prep — raw green berries and bark are not snack food. In subtropical and tropical Americas, native American elder (often treated as Sambucus canadensis) behaves similarly; this entry centers the common European type many cultivars derive from.
    
    ☀️💧 Sun and Water:
    - Full sun to part shade; more sun usually means heavier bloom.
    - Likes steady moisture but tolerates average garden soils; mulch keeps roots cool in Panhandle heat.
    
    ✂️ Propagation:
    - Hardwood cuttings in dormancy root readily.
    - Root suckers can be dug and transplanted.
    - Seed needs stratification and patience; named varieties are cloned.
    
    PermieBro note: plant where you can mow or chop suckers, or you will invent new curse words.
    
    🌾 Harvest / Best Use Timing:
    - Elderflower: pick berries when fully colored and detach with a gentle tug -- whitish bloom still present is fine.
    - Cool mornings beat hot afternoons for shelf life; chill soon if not eating the same day.
    - Freeze dry on trays before bagging so berries do not fuse into a single ice meteor.
