  description: "Elder is a fast-suckering shrub or small tree famous for foamy
    white flower clusters that smell like summer sneaked into a beehive. Berries
    and flowers are edible only with correct prep — raw green berries and bark are
    not snack food. In subtropical and tropical Americas, native American elder (often treated as
    Sambucus canadensis) behaves similarly; this entry centers the common European
    type many cultivars derive from.\n\n☀️💧 Sun and Water:\n- Full sun to part shade;
    more sun usually means heavier bloom.\n- Likes steady moisture but tolerates
    average garden soils; mulch keeps roots cool in Panhandle heat.\n\n✂️ Propagation:\n-
    Hardwood cuttings in dormancy root readily.\n- Root suckers can be dug and
    transplanted.\n- Seed needs stratification and patience; named varieties are
    cloned.\n\nPermieBro note: plant where you can mow or chop suckers, or you will
    invent new curse words."
  purpose: |-
    Elder is a workhorse edge plant:

    - Edible: Flowers for cordials and fritters; ripe cooked berries for syrup and wine.
    - Medicinal: Traditional cold/flu teas from flowers; modern evidence is mixed — be sane.
    - Wildlife Attractor: Insects mob the bloom; birds raid berries if you share.
    - Border Plant: Informal hedge or back-row shrub in a guild.
    - Mulcher: Vigorous growth chops and drops for biomass.
