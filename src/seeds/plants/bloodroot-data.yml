  description: "Bloodroot (Sanguinaria canadensis) is a spring ephemeral of eastern
    North American deciduous forests, emerging wrapped in a single folded leaf that
    unfurls as a lobed canopy over a white, many-petaled flower. Orange-red latex in
    roots and stems gives the plant its name and historical dye and medicine associations.
    Plants spread slowly by rhizomes, forming low colonies in rich, moist soils before
    trees leaf out, then often going dormant by early summer.\n\n☀️💧 Sun and Water
    Requirements:\nPartial shade under deciduous canopy; needs bright spring light before
    closure, then shade and cool soil through summer dormancy. Moist, humus-rich, well-drained
    soil is ideal; dry sandy sites shorten display. Avoid standing water around rhizomes.\n\n✂️
    Propagation:\nDivide rhizomes in dormancy with each piece bearing a bud; replant
    shallowly. Sow fresh seed before it dries; keep moist through warm then cold cycles.
    Ants distribute elaiosome-bearing seeds naturally—mimic forest floor moisture if
    starting indoors.\n\n🌾 Harvest / Best Use Timing:\nOrnamental peak is early spring
    bloom; do not strip wild populations. Any medicinal or dye use requires correct
    identification and toxicity awareness—alkaloids are real. Collect seed when pods
    begin to open if propagating selected forms."
