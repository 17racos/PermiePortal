  description: |-
    Garden angelica is a statuesque biennial (sometimes triennial) umbellifer with huge divided leaves and globes of greenish-white flowers that smell like honeyed gin. Stems are candied, seeds flavor liqueurs, and young shoots appear in Nordic cookery. It wants cold stratification for reliable germination and sulks in relentless heat — give subtropical and tropical Americas plants afternoon shade, deep soil, and airflow to limit fungal drama.
    
    ☀️💧 Sun and Water:
    - Sun to light shade; afternoon shade in zone 9.
    - Consistently moist, fertile soil — not a xeric plant.
    - Space generously; mature plants are broad.
    
    ✂️ Propagation:
    - Sow fresh seed in fall or cold-stratify for spring.
    - Transplant young seedlings carefully; taproot sulk if mangled.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Angelica growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
