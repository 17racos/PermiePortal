  description: "Garden angelica is a statuesque biennial (sometimes triennial) umbellifer
    with huge divided leaves and globes of greenish-white flowers that smell like
    honeyed gin. Stems are candied, seeds flavor liqueurs, and young shoots appear
    in Nordic cookery. It wants cold stratification for reliable germination and
    sulks in relentless heat — give subtropical and tropical Americas plants afternoon shade, deep soil,
    and airflow to limit fungal drama.\n\n☀️💧 Sun and Water:\n- Sun to light shade;
    afternoon shade in zone 9.\n- Consistently moist, fertile soil — not a xeric
    plant.\n- Space generously; mature plants are broad.\n\n✂️ Propagation:\n- Sow
    fresh seed in fall or cold-stratify for spring.\n- Transplant young seedlings
    carefully; taproot sulk if mangled."
  purpose: |-
    Angelica is vertical insectary architecture:

    - Edible: Stems, seeds, and selective young parts in traditional cuisines.
    - Medicinal: Long European herbal history — modern use should be informed.
    - Pollinator: Umbels are insect airports.
    - Wildlife Attractor: Beneficial wasps and flies join the party.
    - Border Plant: Dramatic height at the back of moist beds.
