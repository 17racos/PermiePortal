  description: |-
    Ulluco is the Andean technicolor tuber that refuses to be a potato cosplay. Daylength-sensitive and frost-tender, it wants cool nights and mild days — think high-elevation vibe in a Florida winter garden experiment, not July furnace beds. Tubers form late; patience is the whole personality. Skin pigments mean anthocyanin stains and smug salad photos.
    
    ☀️💧 Sun and Water Requirements:
    - Bright light without brutal midday heat; afternoon shade helps in warm latitudes.
    - Loose, fertile, moisture-retentive soil; never let pots dry to bone mid-tuber-fill.
    - Protect from frost; freezes turn vines to compost statistics.
    
    ✂️ Methods to Propagate:
    - Tubers: plant small tubers when soil is cool-warm in fall/winter subtropical windows.
    - Stem cuttings: root tips in humid shade to clone productive lines.
    
    🌾 Harvest / Best Use Timing:
    - Ulluco: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
  purpose: |-
