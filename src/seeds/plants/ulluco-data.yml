  description: 'Ulluco is the Andean technicolor tuber that refuses to be a potato cosplay. Daylength-sensitive and frost-tender,
    it wants cool nights and mild days — think high-elevation vibe in a Florida winter garden experiment, not July furnace
    beds. Tubers form late; patience is the whole personality. Skin pigments mean anthocyanin stains and smug salad photos.


    ☀️💧 Sun and Water Requirements:

    - Bright light without brutal midday heat; afternoon shade helps in warm latitudes.

    - Loose, fertile, moisture-retentive soil; never let pots dry to bone mid-tuber-fill.

    - Protect from frost; freezes turn vines to compost statistics.


    ✂️ Methods to Propagate:

    - Tubers: plant small tubers when soil is cool-warm in fall/winter subtropical windows.

    - Stem cuttings: root tips in humid shade to clone productive lines.'
  purpose: 'Ulluco is a specialty tuber for cool-season subtropical nerds:


    - Edible: Boiled or roasted tubers; mucilaginous texture surprises the uninitiated.

    - Ground Cover: Low sprawling stems shade soil briefly before frost ends the season.

    - Dynamic Accumulator: Fast leafy growth in cool windows can pull nutrients into vine biomass for chop-and-drop before
    vines senesce, recycling minerals within the bed.'
