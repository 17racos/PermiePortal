  description: "Flax is the skinny blue-flowered annual that gave us linen and linseed
    oil long before fast fashion and industrial seed oils pretended they invented fiber
    and fat. In a homestead row it is a short, upright crop with delicate five-petaled
    flowers that honeybees actually notice.\n\nFlorida and Puerto Rico / subtropical note: classic
    fiber flax prefers cool establishment; here you often run it as a winter–early spring
    annual or accept shorter stems when heat arrives early. Seed (linseed) types tolerate
    more heat than fussy long-fiber lines.\n\nSun and water: Full sun, well-drained soil.
    Drought-tolerant once established but wants even moisture during germination and
    early stem elongation—do not let seedlings crust over.\n\nPropagation: Direct-seed;
    barely cover seed. Thin for fiber stands; leave more space for heavy seed heads
    if you are after oilseed."
  purpose: |-
    Linen-grade fiber, linseed for food or finish oils, and a quick cover crop that
    feeds pollinators during bloom. Break crop in rotation—not a heavy feeder if you
    manage residues.
