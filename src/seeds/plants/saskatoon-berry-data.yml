  description: 'Saskatoon berry (Amelanchier alnifolia) is a multistemmed deciduous shrub to small tree of northern North
    American prairies and open woods, bearing white spring flowers and sweet purple pomes ripening in early summer. Plants
    typically reach 6–15 feet (1.8–4.5 m), spreading by suckers into bird-friendly thickets. Fruit quality suits fresh eating,
    pies, and preserves where cedar-apple rust management is planned.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best fruiting with strong light and airflow. Moist, well-drained, humus-rich soils suit it;
    tolerates cold winters and short drought once established. Mulch to reduce grass competition; avoid waterlogging.


    ✂️ Propagation:

    Sow stratified seed; suckers transplant in early spring. Softwood cuttings under mist for clones. Prune for open centers
    to reduce leaf wetness and improve fruit color.


    🌾 Harvest / Best Use Timing:

    Pick when berries soften and color fully—flavor peaks before complete bird takeover. Process quickly for freezing or baking.
    Bloom follows last hard frosts near 20°F (-7°C) risk in boreal sites.'
