  description: "Blue vervain (Verbena hastata) is a native North American perennial
    of moist meadows and stream edges, bearing slender spikes of small blue-violet
    flowers from midsummer into fall. Plants reach about 90–150 cm (3–5 feet) tall
    with opposite, lance-shaped leaves and stiffly upright stems.\n\n🌞💧 Sun and
    Water Requirements:\n- Full sun to light shade; blooms heaviest in sun.\n- Likes
    consistently moist, average to rich soil; tolerates brief inundation. In Florida
    and Puerto Rico, site it in rain gardens, pond margins, or irrigated pollinator
    beds—dry sand will stunt it quickly.\n- Mulch to buffer soil temperature and reduce
    evaporation in the dry season.\n\n✂️ Methods to Propagate:\n- Seeds: Cold-moist
    stratify 4–8 weeks or winter-sow outdoors; surface-sow or barely cover; germination
    improves with fluctuating temperatures.\n- Division: Split crowns in early spring
    before flowering; keep divisions watered until established.\n\n🌾 Harvest / Best
    Use Timing:\n- For traditional herb use, gather aerial parts at early-to-mid bloom
    on dry mornings; dry promptly with good airflow. Leave late flowers for migrating
    pollinators."
  purpose: |-
    Blue vervain strengthens wet-edge and prairie-mosaic plantings:

    - **Medicinal**: Historically used as a relaxing bitter and for cold-season teas; harvest timing matters for quality.
    - **Pollinator**: Dense flower spikes feed long-tongued bees, wasps, and butterflies during a long bloom window.
    - **Wildlife Attractor**: Seeds feed songbirds; structure hosts beneficial insects in the herb layer.
    - **Biomass**: Upright stems produce leafy chop-and-drop material for mulching moist-zone guilds.
  companions:
  - Joe Pye Weed
  - Bee Balm
  - Swamp Milkweed
  cautions:
  - None documented
  pests:
  - Aphids
  - Japanese Beetles
  practitioner_notes: |-
    Self-sows in damp disturbed soil—thin volunteers early if you want single-species rows instead of a verbena meadow.
    First-year plants can stay short and shy; second-year height arrives once the taproot finds the water table it likes.
    Dry-down between waterings reduces Japanese beetle buffet hours; overhead irrigation extends beetle happy hour.
    Harvest flowering tops in dry weather before powdery mildew paints lower leaves in stagnant air pockets.
  growth_habit: Upright clumping perennial; self-sows in moist open soil
