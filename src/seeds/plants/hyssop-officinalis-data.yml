  description: |-
    True hyssop is a compact, semi-woody mint relative bearing narrow aromatic leaves and spikes of blue, pink, or white tubular flowers. Mature plants form tidy 1–3 foot mounds with stiff upright stems, reading like a formal herb shrub rather than a mint runner.

    In subtropical and tropical Americas treat hyssop as a short-lived perennial or renewal crop in humid heat—give perfect drainage, full sun, and air space to limit root rots during wet season. Puerto Rico’s drier season matches its Mediterranean comfort zone better than soggy flats.

    ☀️💧 Sun and Water Requirements:
    - Full sun for dense growth and richest essential oils.
    - Lean, well-drained soil; lime or grit helps where rains are heavy.
    - Water deeply then allow dry-down; avoid misting foliage in muggy weather.

    ✂️ Propagation:
    - Seeds surface-sown in spring; light aids germination—do not bury deeply.
    - Softwood cuttings in late spring; dip and root under humidity dome.
    - Semi-hardwood cuttings in early summer for stock plants in frost-free cycles.

    🌾 Harvest / Best Use Timing:
    - Snip leafy stems before full bloom for culinary and tea use; flavor is bold—use sparingly.
    - Harvest flowering tops for drying when half the spike has opened for bee forage balance and aroma peak.
  purpose: |-
    Hyssop stacks kitchen, medicine, and habitat roles:

    - Edible: Flowers and leaves flavor syrups, bitters, and savory dishes where intense mint-sage notes are welcome.
    - Medicinal: Traditional use for respiratory and digestive support ties to volatile oils—respect potency and contraindications.
    - Pollinator: Tubular flowers favor bees and butterflies along herb garden drifts.
    - Ornamental: Upright spikes give structure in knot gardens and path edges without sprawing chaos.
  companions:
  - Sage — similar sun and drainage; stagger bloom for continuous small-bee support.
  - Thyme — carpets soil surface, reducing splash-borne disease spores onto hyssop stems.
  - Echinacea — contrasting form and shared pollinator traffic make mixed borders function as living insectaries.
