  description: "Florida leadplant (Amorpha herbacea) is a low, fine-textured leguminous shrub of sandhills, scrub, and dry\
    \ pinelands in the southeastern United States, with tiny compound leaves and slender spikes of purple pea flowers that\
    \ call bumble bees like a polite dinner bell. It is a dwarf cousin in the false-indigo tribe—nitrogen fixation without\
    \ pretending to be a six-foot meadow statue. Use it in xeric polycultures, pine understories, and roadsides where irrigation\
    \ is a rumor and sun is abundant.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun; requires well-drained, sandy\
    \ or rocky soils and tolerates drought once established. Not for heavy clay swales or chronically irrigated turf margins.\
    \ Mildly salt-tolerant on some coastal sands but not a mangrove. Hardy through warm-temperate winters; stems may die back\
    \ after hard freezes and resprout from crown.\n\n✂️ Propagation:\n Scarified seed sown warm improves germination speed.\n\
    Softwood cuttings under humidity can clone selected forms with compact habit.\n\n\U0001F33E Harvest / Best Use Timing:\n\
    Chop-and-drop prunings after flowering to mulch neighboring plants lightly—avoid removing all photosynthetic wood at once.\
    \ Leave some spent spikes for seed-eating insects where aesthetics allow."
