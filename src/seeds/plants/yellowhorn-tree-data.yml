  description: "Yellowhorn (Xanthoceras sorbifolium) is a deciduous Chinese tree
    reaching 5–8 m (16–26 ft), valued for showy panicles of white flowers with yellow
    eyes and edible seeds inside leathery capsules once roasted or processed. Compound
    leaves resemble mountain ash, giving a tidy orchard aesthetic. It requires winter
    chill to flower reliably—low-chill subtropical and tropical Americas lowlands are poor
    matches except in upland microclimates or as a curiosity that may grow leafy
    but shy to bloom.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for flowering
    and fruit set.\n- Deep, fertile, well-drained soil; tolerates alkaline conditions
    better than many nut crops.\n- Regular moisture during establishment; somewhat
    drought-tolerant when older but not a desert specialist.\n\n✂️ Methods to Propagate:\n-
    Stratify seeds 8–12 weeks cold-moist; sow in deep pots to accommodate taproot.\n-
    Graft improved selections onto seedling understocks for predictable nut quality.\n-
    Take summer budding or whip grafts in active growth with clean cambium contact.\n\n🌾
    Harvest / Best Use Timing:\n- Collect capsules when they begin to split; dry
    and extract seeds before storage pests arrive.\n- Roast or process seeds before
    eating—raw quality varies and preparation traditions matter.\n- Prune for central
    leader structure while young to prevent weak angles."
