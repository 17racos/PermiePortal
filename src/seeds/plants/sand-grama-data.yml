  description: 'Sand grama (Bouteloua chondrosioides) is a warm-season bunchgrass of southwestern North American grasslands
    and desert grasslands, bearing comb-like inflorescences on wiry stems usually 1–2 feet (30–60 cm) tall. It thrives in
    sandy, well-drained soils with lean fertility and rewards growers who stop fertilizing like it is corn. Use it in xeric
    meadows, green roofs, and any border that wants fine texture without sprinkler entitlement.


    ☀️💧 Sun and Water Requirements:

    Full sun for flowering and drought resilience; shade yields sparse plants. Sandy, well-drained soils are ideal; tolerates
    alkaline conditions. Water deeply only to establish; prolonged irrigation invites weeds that outcompete lean-grass ethics.


    ✂️ Propagation:

    Sow seed in warm soil after frost risk. Divide small bunches in spring if needed. Cut back old growth in late winter for
    tidy designs.


    🌾 Harvest / Best Use Timing:

    Collect seed when comb inflorescences dry—use for restoration mixes. Leave standing material for ground-feeding birds
    where aesthetics allow. Peak growth follows summer heat and monsoon moisture patterns.'
  purpose: '- Erosion Control: Fibrous roots bind sandy slopes and terrace cuts in arid climates.

    - Ground Cover: Fine texture fills gaps between larger succulents and forbs.

    - Wildlife Attractor: Seeds feed birds; clumps shelter insects at soil level.

    - Ornamental: Comb seed heads add graphic lines to xeric designs.'
  companions:
