  description: 'Sand grama (Bouteloua chondrosioides) is a warm-season bunchgrass of southwestern North American grasslands
    and desert grasslands, bearing comb-like inflorescences on wiry stems usually 1–2 feet (30–60 cm) tall. It thrives in
    sandy, well-drained soils with lean fertility and rewards growers who stop fertilizing like it is corn. Use it in xeric
    meadows, green roofs, and any border that wants fine texture without sprinkler entitlement.


    ☀️💧 Sun and Water Requirements:

    Full sun for flowering and drought resilience; shade yields sparse plants. Sandy, well-drained soils are ideal; tolerates
    alkaline conditions. Water deeply only to establish; prolonged irrigation invites weeds that outcompete lean-grass ethics.


    ✂️ Propagation:

    Sow seed in warm soil after frost risk. Divide small bunches in spring if needed. Cut back old growth in late winter for
    tidy designs.


    🌾 Harvest / Best Use Timing:

    Collect seed when comb inflorescences dry—use for restoration mixes. Leave standing material for ground-feeding birds
    where aesthetics allow. Peak growth follows summer heat and monsoon moisture patterns.'
  purpose: |-
    Erosion Control: Erosion control needs roots that grip: It thrives in sandy, well-drained soils with lean fertility and rewards growers who stop fertilizing like it is corn. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ground Cover: Sand Grama carpets soil fast enough to smother early weeds while feeding surface roots and arthropods -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
    Wildlife Attractor: Sand Grama layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Ornamental: Sand Grama earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight

