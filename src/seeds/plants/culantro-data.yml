  description: "Eryngium foetidum is the saw-toothed cilantro alternative that laughs
    at heat while true cilantro bolts for the door. Strong aromatic leaves — 'foetidum'
    was taxonomy shade — power Caribbean, Southeast Asian, and Latin American pots.
    Likes humidity and warmth; North Florida summers are on-brand if you keep moisture
    sane.\n\n🌞💧 Sun and Water Requirements:\n- Part shade in brutal heat; morning
    sun + afternoon relief is chef's kiss.\n- Consistent moisture; stress invites
    flowering and tougher leaves.\n- Rich, organic soil beats starved sand.\n\n✂️🌱
    Methods to Propagate:\n- Seeds: can be slow/erratic — patience and warmth.\n-
    Careful root division of clumps once established.\n\n🧺 When to Harvest:\n- Outer
    leaves continuously; flower stalks mean shift to seed saving or replace plants
    if flavor goes feral."
  purpose: |-
    Culantro is the subtropical herb bridge for people tired of cilantro drama. Stack
    near kitchen gardens and wetter microclimates; let it reseed modestly if your
