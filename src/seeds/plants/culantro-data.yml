description: |-
  Eryngium foetidum is the saw-toothed cilantro alternative that laughs at heat while true cilantro bolts for the door. Strong aromatic leaves — 'foetidum' was taxonomy shade — power Caribbean, Southeast Asian, and Latin American pots. Likes humidity and warmth; hot wet-season weather is on-brand if you keep moisture sane.

  ☀️💧 Sun and Water Requirements:

  Part shade in brutal heat; morning sun + afternoon relief is chef's kiss.
  Consistent moisture; stress invites flowering and tougher leaves.
  Rich, organic soil beats starved sand.

  ✂️ Propagation:

  Seeds: can be slow/erratic — patience and warmth.
  Careful root division of clumps once established.

  🌾 Harvest / Best Use Timing:

  Outer leaves continuously; flower stalks mean shift to seed saving or replace plants if flavor goes feral.
purpose: |-
  Edible: Eryngium foetidum leaves carry saw-toothed recao flavor that holds in heat while true cilantro bolts -- chop into sofrito, salsas, and Southeast Asian soups.
  Medicinal: Long folk use for digestive and antimicrobial support tracks apiol-related chemistry -- separate from unrelated Eryngium species before tasting experiments.
  Pest Management: Pungent leaf oils can confuse some chewing insects at guild edges -- scout aphids anyway; scent is not a fence.
