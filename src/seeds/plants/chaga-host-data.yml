  description: "Chaga is the cracked charcoal canker on birch bark — not a mushroom
    in the cap-and-stem sense but a sterile conk stage of Inonotus obliquus. It wants
    cold-climate birch forests; North Florida is mostly the wrong movie. If you are
    here, you are either planning travel, mail-order tea, or experimenting up north.
    Harvesting from live public trees is a jerk move; sustainable practice matters
    because slow-growing conks tempt greed.\n\n☀️💧 Sun and Water:\n- Natural range
    tied to birch in cool, humid continental climates.\n- No honest outdoor substitute
    on local palms; manage expectations.\n- Cultivation research exists but is not
    backyard trivial.\n\n✂️ Propagation:\n- Essentially not a home propagation crop
    in the subtropics; buy from reputable growers if you want the tea arc."
  purpose: |-
    Chaga host entries exist so nobody plants river birch in Gainesville expecting
    a conk:

    - Medicinal: Traditional northern use; subtropical FL is not the production
      zone.
    - Mulcher: In its native range it is part of birch forest decay ecology.
