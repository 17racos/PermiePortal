    arranged in simple spikes that rise above the foliage. Its unique flavor profile,
    reminiscent of anise, eucalyptus, and sassafras, makes it a valued culinary herb
    in Mexican cuisine.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nPrefers
    partial shade to full shade and thrives in moist, well-draining soils. While it
    enjoys ample water, it's important to avoid waterlogged conditions to prevent
