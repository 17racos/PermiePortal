  cautions:
  - Pregnancy, infants, pets chewing experiments
  - Letting it escape into sensitive wetlands
  pests:
  - Aphids
  - Spider mites
  - Whiteflies
  practitioner_notes: |-
    Label jars with plant part and date the day you seal—future you is not psychic.
    Deadhead for repeat bloom if the species responds; leave late heads if birds or beneficials need seed.
    Foot traffic after establishment only—early walks tear stems and invite weeds in the wounds.
    Watch the plant’s own signals first—catalog zone numbers do not replace your site’s microclimate truth.
