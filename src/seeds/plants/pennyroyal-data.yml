  description: |-
    Pennyroyal is the mint that comes with a safety lecture. Essential oil is dangerous — especially around pregnancy — and the plant's reputation is half insect-repellent folklore, half poison-control case study. Use it as a creeping moist-edge ground cover with boundaries, not as tea cosplay. In subtropical and tropical Americas it wants damp spots; baking sand will ghost it.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; hotter climates appreciate afternoon shade and moisture.
    - Consistently moist, rich soil; pond margins and rain garden edges are classic.
    - Do not let pots dry completely in peak heat if you want lush mats.
    
    ✂️ Methods to Propagate:
    - Division: easiest mint path — split mats in spring or fall.
    - Cuttings: root stem tips in water or humid media.
    
    🌾 Harvest / Best Use Timing:
    - Harvest Pennyroyal aerial parts in early flowering for many mint-family uses -- oils shift after full bloom.
    - Dry in shade with airflow between 95-110°F (35-43°C) until crisp; mold invalidates the batch.
    - Label harvest date and plant part -- winter you will not remember which jar was optimism.
