  description: |-
    Pennyroyal is the mint that comes with a safety lecture. Essential oil is dangerous — especially around pregnancy — and the plant's reputation is half insect-repellent folklore, half poison-control case study. Use it as a creeping moist-edge ground cover with boundaries, not as tea cosplay. In North Florida it wants damp spots; baking sand will ghost it.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; hotter climates appreciate afternoon shade and moisture.
    - Consistently moist, rich soil; pond margins and rain garden edges are classic.
    - Do not let pots dry completely in peak heat if you want lush mats.

    ✂️ Methods to Propagate:
    - Division: easiest mint path — split mats in spring or fall.
    - Cuttings: root stem tips in water or humid media.
  purpose: |-
    Pennyroyal is powerful chemistry in a small leaf package:

    - Medicinal: Historical uses for digestion and menstruation — modern safety says hard no to casual internal oil use.
    - Pollinator: Small flowers feed beneficials when allowed to bloom briefly.
    - Ground Cover: Creeping mats for moist, contained beds.
    - Pest Management: Crush-tested repellent folklore for fleas and mosquitoes — verify expectations.
  companions:
  - Elderberry
  - Iris
  - Cattail
  avoid:
  - Pregnancy, infants, pets chewing experiments
  - Letting it escape into sensitive wetlands
  pests:
  - Aphids
  - Spider mites
  - Whiteflies
