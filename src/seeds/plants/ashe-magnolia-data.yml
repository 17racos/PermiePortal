  description: "Ashe magnolia (Magnolia ashei) is a rare, small deciduous tree of
    humid temperate woodlands in parts of the southeastern United States, valued for
    enormous leaves that can exceed 12 inches (30 cm) in length and fragrant creamy
    flowers marked with rose-purple inner bases. Plants often grow as multi-stemmed
    understory individuals roughly 10–25 feet (3–8 m), spreading by root sprouts in
    favorable litter-rich soils. It suits native plant collections, shaded courtyards,
    and oak-pine edges where humidity stays moderate and root zones stay cool.\n\n☀️💧
    Sun and Water Requirements:\nPartial shade, especially from high canopy or east-facing
    exposures; harsh midday sun burns leaves on young plants. Moist, well-drained,
    acidic organic soil mimics forest floor conditions; drought and compacted fill
    cause rapid decline. Mulch deeply but keep mulch off stem flare.\n\n✂️ Propagation:\nSow
    fresh seed after removing red sarcotesta; do not let seed desiccate. Warm stratification
    followed by cold may improve germination in some lots. Softwood cuttings are difficult
    for amateurs—seed is the practical route for most growers.\n\n🌾 Harvest / Best
    Use Timing:\nNot a crop plant—enjoy flowers in spring and large tropical-looking
    foliage through summer. Collect ripe follicles before wildlife scatter all seed
    if you propagate. Minimal pruning; remove only dead wood or crowded sprouts to
    preserve natural form."
