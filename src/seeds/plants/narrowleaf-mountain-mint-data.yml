  description: "Narrowleaf mountain mint (Pycnanthemum tenuifolium) is a fine-textured
    eastern North American perennial whose needle-like leaves and flat white flower
    platforms read almost like a miniature yarrow until you crush the stems and get
    the mint slap. It tolerates heat and leaner soil than many mints, making it
    a backbone plant for insectary rows and rain-garden berms.\n\n☀️💧 Sun and Water
    Requirements:\n- Full sun to light shade; more sun tightens growth and increases
    bloom density.\n- Moderate moisture; tolerates short dry spells after establishment
    but wilts in extreme drought without mulch.\n- Adaptable soil; prefers average
    fertility and good drainage, not stagnant muck.\n\n✂️ Propagation:\n- Division
    in spring or fall; replant vigorous sections with buds.\n- Soft tip cuttings
    in late spring under humidity.\n- Seed: cold stratify; variable germination—division
    is faster.\n\n🌾 Harvest / Best Use Timing:\n- Snip flowering tops in peak bloom
    for tea; dry in shade with airflow.\n- Stagger harvests so at least half the
    stand stays open for pollinators.\n- Cut back frost-killed stems in late winter
    to tidy before spring emergence."
  purpose: |-
    - Edible: Aromatic leaves flavor teas and syrups with a sharp, clean mint note.
    - Pollinator: Tiny flowers pack nectar accessible to small bees and beneficial wasps.
    - Pest Management: Strong scent can confuse herbivores when woven through vegetable beds.
  companions:
  - Mountain Mint — silver-bracted cousin for contrasting texture in the same pollinator band
  - Rattlesnake Master — yucca-like leaves juxtapose fine mint foliage in full-sun beds
