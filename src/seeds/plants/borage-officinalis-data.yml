  description: |-
    Borage officinalis (Borago officinalis) is a fast, bushy herb grown for its fuzzy leaves and striking blue star flowers that draw insects like a neon sign. It originates from the Mediterranean region and has spread widely as both a culinary and medicinal garden plant. Plants typically reach 30–70 cm (12–28 in) tall. In permaculture, borage earns its place by giving you edible “greens + flowers” while keeping pollinators active and the soil surface covered with chop-and-drop biomass.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for the best flowering; partial shade still works but slows blooms.
    - Average water while establishing, then moderate watering as plants mature.
    - Prefers fertile, well-drained soil; it does poorly in heavy, waterlogged beds.
    - Tolerates some dry spells once established.
    
    ✂️ Propagation:
    - Seeds: direct-sow after last frost; germination often occurs in 7–14 days when kept evenly moist.
    - Seeds (timed sowing): sow in late summer for fall flowers where summers are long.
    - Seedlings: start indoors 3–4 weeks ahead if you want earlier blooms; transplant while small to reduce shock.
    
    🌾 Harvest / Best Use Timing:
    - Pick young leaves regularly for salads and cooked greens; harvest in the morning for crisp texture.
    - Harvest flowers when fully open; use fresh in drinks, salads, or as a garnish.
    - For dried flowers, dry quickly in airflow and store cool and dry.
  purpose: |-
    Edible: Borago officinalis young leaves taste cucumber-cool in salads while fresh blue stars drop into drinks without the slime of okra cousins.
    Medicinal: Seed oil is the commercial gamma-linolenic acid crop, while leaf tea traditions stay mild diuretic kitchen use, not pharmacy substitution.
    Pollinator: Refilling nectaries on starry blue flowers keep honeybees working one plant for many minutes through long summer days.
    Wildlife Attractor: Caterpillars of the painted lady use the foliage, so leaving a chewed corner feeds butterflies without ending your leaf harvest on the rest of the clump.
  companions:
  - Tomato (Solanum lycopersicum) — borage flowers boost beneficial insects that help keep common tomato pests calmer.
  - Lettuce (Lactuca sativa) — shared cool-season timing lets you harvest together while borage supplies insect support.
  - Marigold (Tagetes patula) — pulls beneficial insects into the bed and adds bright contrast that helps you spot trouble early.
  cautions:
  - Remove or manage seed heads if you don’t want runaway self-seeding; borage can outcompete slow corners.
  practitioner_notes: |-
    Harvest leaves often—more picking usually means more branching.
    If plants go to seed, let a small portion stay and remove the rest to control the “oops, it spread” effect.
    Use flowers immediately; flavor fades fast after picking.
  pests:
  - Aphids
  - Spider Mites
  - Caterpillars
