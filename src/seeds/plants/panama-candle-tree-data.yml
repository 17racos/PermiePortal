  description: "Panama candle tree (Parmentiera cereifera) is a slow-growing tropical tree famous for cauliflorous, cucumber-shaped green fruits that hang like tapered candles from trunk and older branches. Native to Central America, it reaches 20–40 feet (6–12 m) in cultivation, with compound leaves and a narrow crown useful in tight lots. The crisp fruit is eaten raw or pickled where traditions exist, and the tree doubles as a conversation piece in humid lowland food forests.\n\n☀️💧 Sun and Water Requirements:\nFull sun after establishment; young plants appreciate light shade during the hottest months. Rich, well-drained soils with steady moisture through the warm wet season and irrigation in dry spells support fruit sizing. Wind protection helps large leaflets; avoid salt spray and chronically waterlogged roots.\n\n✂️ Propagation:\nSow fresh seed; germination improves with warmth and humidity. Graft or air-layer selections with superior fruit quality. Prune for clearance along walkways where dangling fruit could head-butt humans.\n\n🌾 Harvest / Best Use Timing:\nPick fruits when firm-green for crunchy use; timing is read from size and gloss rather than calendar months. Process pickles quickly; thin skin loses water in refrigeration wars. Peak production follows heat and rainfall cycles typical of tropical lowlands."
