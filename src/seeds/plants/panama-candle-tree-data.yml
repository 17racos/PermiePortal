description: |-
  Panama candle tree (Parmentiera cereifera) is a slow-growing tropical tree famous for cauliflorous, cucumber-shaped green fruits that hang like tapered candles from trunk and older branches. Native to Central America, it reaches 20–40 feet (6–12 m) in cultivation, with compound leaves and a narrow crown useful in tight lots. The crisp fruit is eaten raw or pickled where traditions exist, and the tree doubles as a conversation piece in humid lowland food forests.

  Full sun after establishment; young plants appreciate light shade during the hottest months. Rich, well-drained soils with steady moisture through the warm wet season and irrigation in dry spells support fruit sizing. Wind protection helps large leaflets; avoid salt spray and chronically waterlogged roots.

  Sow fresh seed; germination improves with warmth and humidity. Graft or air-layer selections with superior fruit quality. Prune for clearance along walkways where dangling fruit could head-butt humans.

  Pick fruits when firm-green for crunchy use; timing is read from size and gloss rather than calendar months. Process pickles quickly; thin skin loses water in refrigeration wars. Peak production follows heat and rainfall cycles typical of tropical lowlands.
purpose: |-
  Edible: Parmentiera cereifera cauliflorous “candles” stay cucumber-crisp for salads, quick pickles, and Latin American relishes when picked green-tender -- site harvest away from glass roofs because ripe drops dent optimism.
  Ornamental: Trunk-hanging tapered fruit and bipinnate foliage read as botanical curiosity in humid lowland courtyards -- slow juvenile years test patience before the drip line becomes a conversation piece.
  Shade Provider: Narrow 6–12 m crown throws broken shade over cacao, ginger, or nursery tables while the tree is young -- mature specimens still filter light lightly compared with dense mango canopies.
  Wildlife Attractor: Bat-pollinated night flowers on older wood set fruit that hits ground for beetles and rodents if you skip daily pickup -- relaxed sanitation builds soil fauna, tight sanitation keeps flies off patio stone.
