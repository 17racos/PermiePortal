  description: "Persian lilac (Syringa × persica) is a compact, fine-branched lilac hybrid group valued for lavender flower clusters in late spring and a rounded habit smaller than many common lilacs. Plants typically reach 4–8 feet (1.2–2.4 m), suckering modestly into airy thickets that perfume hedgerows without shading entire yards. It suits temperate permaculture borders where early pollinator support and cut flowers matter more than edible yield.\n\n☀️💧 Sun and Water Requirements:\nFull sun for heaviest bloom; fewer flowers in shade. Average, well-drained loam is ideal; tolerates alkaline soils common near foundations. Water deeply during establishment and dry heat waves; avoid waterlogging that invites root issues.\n\n✂️ Propagation:\nLayer low branches or take softwood cuttings in early summer with humidity. Sow seed from hybrids for surprises, not clones. Prune immediately after flowering—next year’s buds form on old wood.\n\n🌾 Harvest / Best Use Timing:\nCut flower panicles when one-third of florets are open for longest vase life. Deadhead if you dislike seedling volunteers. Bloom timing tracks local spring warmth, typically after last hard freezes near 28°F (-2°C)."
  purpose: |-
    Ornamental: Persian Lilac earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Persian Lilac layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Border Plant: Persian Lilac tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Windbreaker: Windbreak value is structural: Plants typically reach 4 - 8 feet (1.2 - 2.4 m), suckering modestly into airy thickets that perfume hedgerows without shading entire yards. -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
