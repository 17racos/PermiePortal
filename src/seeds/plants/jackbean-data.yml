  description: |-
    Jackbean (Canavalia ensiformis) is a warm-season legume grown for its ability to quickly build biomass, fix nitrogen, and produce large seeds used in food systems and as a fodder resource when properly processed. It forms twining vines with leathery leaves and produces long pods that hold seeds big enough to make you pay attention. In permaculture, it matters because it turns hungry soil time into living soil work: ground cover, nitrogen input, and harvestable biomass for mulch or feed cycles.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun; growth needs heat to really sprint.
    - Water moderately during establishment; once established it tolerates typical warm-season dry spells.
    - Prefers well-drained soil and does poorly in cold, wet ground.
    - Avoid frost; cold stalls growth and can kill young vines.
    
    ✂️ Propagation:
    - Seeds: soak seeds 12–24 hours to speed emergence; then direct-sow after soil warms.
    - Seeds (spacing): plant thickly if your goal is ground cover, thinner if you want seed/pod production.
    - Optional: re-sow after mowing to keep cover consistent through the season.
    
    🌾 Harvest / Best Use Timing:
    - Pods: harvest green pods for forage-style uses when they’re still tender.
    - Seeds: harvest mature seeds when pods dry; process thoroughly before eating (never assume raw is safe).
    - Biomass: cut vines for mulch when you’re ready to switch beds; residues decompose into soil carbon.
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: Jackbean (Canavalia ensiformis) is a warm-season legume grown for its ability to quickly build biomass, fix nitrogen, and produce large seeds used in food systems and as a fodder resource when properly processed. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Animal Fodder: Jackbean offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Mulcher: Mulch workflows love predictable biomass: Jackbean (Canavalia ensiformis) is a warm-season legume grown for its ability to quickly build biomass, fix nitrogen, and produce large seeds used in food systems and as a fodder resource when properly processed. -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
  companions:
  - Corn (Zea mays) — warm-season canopy partner that supports vertical structure and rotation timing.
  - Sunflower (Helianthus annuus) — tall companion adds biomass and helps keep the ground shaded.
  - Garlic (Allium sativum) — aromatic bulb helps diversify bed scent and rotation in mixed plots.
  cautions:
  - Raw seeds can be toxic; process thoroughly before any food use and keep out of reach of pets/livestock.
  practitioner_notes: |-
    Soak seeds: it’s the difference between “it’s growing” and “it’s contemplating soil.”
    For mulch, cut before vines toughen; early residues break down faster.
    If frost arrives, switch to a warmer cover crop next cycle.
  pests:
  - Aphids
  - Caterpillars
