  description: 'Lovage is celery''s loud cousin — tall perennial clumps, glossy leaves, and a flavor that is soup stock incarnate.
    Every part is usable in the kitchen if you like intensity. It pumps biomass for chop-and-drop and pulls minerals from
    deep soil like other deep-rooted Apiaceae.


    subtropical and tropical Americas: afternoon shade and mulch keep it from looking fried in August; it will still grow
    in winter cool snaps that make true celery pout.


    ☀️💧 Sun and Water:

    - Sun to part shade.

    - Rich, moist, well-drained soil; tolerates clay if not waterlogged.

    - Regular water in heat.


    ✂️ Propagation:

    - Division in spring or fall.

    - Seed sown fresh or in cool weather; germination can be slow.'
  purpose: 'Lovage is a one-plant soup base and insectary:


