  description: "Lovage is celery's loud cousin — tall perennial clumps, glossy leaves,
    and a flavor that is soup stock incarnate. Every part is usable in the kitchen
    if you like intensity. It pumps biomass for chop-and-drop and pulls minerals from
    deep soil like other deep-rooted Apiaceae.\n\nNorth Florida: afternoon shade and
    mulch keep it from looking fried in August; it will still grow in winter cool
    snaps that make true celery pout.\n\n☀️💧 Sun and Water:\n- Sun to part shade.\n-
    Rich, moist, well-drained soil; tolerates clay if not waterlogged.\n- Regular
    water in heat.\n\n✂️ Propagation:\n- Division in spring or fall.\n- Seed sown
    fresh or in cool weather; germination can be slow."
  purpose: |-
    Lovage is a one-plant soup base and insectary:

    - Edible: Leaves, stems, seeds, roots — potent celery-anise notes.
    - Medicinal: Traditional digestive uses — use modern references.
    - Pollinator: Compound umbels attract beneficial insects.
    - Wildlife Attractor: Generalist pollinators and predators.
    - Border Plant: Back-of-bed vertical accent.
    - Dynamic Accumulator: Deep roots mine nutrients for mulch cycles.
