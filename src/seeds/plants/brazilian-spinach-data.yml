  practitioner_notes: |-
    Viable seed is rare in cultivation—treat every planting as cutting stock; keep mother plants frost-free insurance pots.
    Tip cuttings root in damp shade within two weeks; long bare stems rot before they callus if you bury too deep.
    Older leaves toughen and taste sharper—harvest outer tips weekly like mint, not once-a-season hedge shearing.
