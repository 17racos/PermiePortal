  description: "Big bluestem (Andropogon gerardii) is a warm-season bunchgrass of North
    American tallgrass prairie, forming tall clumps with blue-green spring blades that
    shift copper-red in autumn and seed heads shaped like a turkey’s foot. Culms commonly
    reach 4–8 feet (1.2–2.4 m) in favorable moisture, shorter on dry ridges. It is
    a backbone species for prairie restoration, pasture diversification, and ornamental
    meadows that refuse to pretend Kentucky bluegrass is native.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun for strongest growth and flowering; shade weakens stems.
    Tolerates drought and lean soils once deep roots develop; responds to occasional
    summer rain or irrigation with rapid regrowth. Avoid chronic wet, compacted sites
    that favor cool-season weeds over warm-season roots.\n\n✂️ Propagation:\nSow fresh
    or cold-stratified seed in late spring when soil warms; establishment is slow the
    first year, explosive the next. Divide dormant crowns in early spring for landscape
    plugs. Use local ecotype seed when restoring genetics matched to rainfall and daylength.\n\n
    🌾 Harvest / Best Use Timing:\nFor hay or silage, cut during early boot to early
    bloom for quality; leave standing through winter for wildlife cover if forage is
    not the priority. Burn or mow on restoration schedules appropriate to your region
    and regulations—not random weekend boredom."
  purpose: |-
    - Animal Fodder: High-quality warm-season forage when rotation timing respects boot-stage nutrition.
    - Biomass: Deep roots and tall shoots build soil carbon and mulch banks in prairie systems.
    - Erosion Control: Fibrous roots stabilize slopes and disturbed ground during establishment years.
    - Wildlife Attractor: Seeds and structure feed birds and insects; standing stems shelter overwintering fauna.
    - Ornamental: Copper fall color and bold vertical form beat ornamental grass catalogs on honest sites.
  companions:
