  max_temp: 105
  perennial: false
  layers:
  - Vine
  plant_function:
  - Edible
  - Nitrogen Fixer
  - Pollinator
  - Animal Fodder
  description: "Vigna unguiculata subsp. sesquipedalis is the cowpea that learned
    to climb—long tender pods, heat tolerance that laughs at common beans, and vines
    that will annex your fence if you blink.\n\nFlorida and Puerto Rico: Plant after
    soil warms; produces through brutal summer when Phaseolus sulk. Keep picking
    or pods go fibrous fast.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for
    heaviest pod set; fertile, well-drained soil.\n- Steady moisture during flowering
    and pod set; drought during bloom drops pods overnight.\n\n✂️ Propagation:\n-
    Direct-sow once nights stay warm; inoculate with cowpea rhizobia if you want
    the nitrogen bragging rights.\n- Reseed every warm season in frost pockets;
    perennial only where frost never trims the crown.\n\n🌾 Harvest / Best Use Timing:\n-
    Pick pods pencil-thick daily; missed pods become fibrous teaching moments."
  purpose: |-
    Summer protein and living trellis filler for humid subtropical and tropical gardens:

    - Edible: Pods stir-fried, grilled, or pickled before they turn rope—texture stays crisp if you stay greedy with the harvest basket.
    - Nitrogen Fixer: Rhizobia on roots bank atmospheric nitrogen into nodules; slash residues into mulch so the next bed inherits the gift instead of the landfill.
    - Pollinator: Cowpea flowers feed bees and small wasps during the dog days when many crops have quit blooming.
    - Animal Fodder: Vines, leaves, and surplus pods can supplement poultry or small livestock rotations if disease pressure stays low.
  companions:
  - Corn
  - Sweet Potato
  - Marigold
  avoid:
  - Cold wet soil at planting
  - Letting pods hide until they qualify as fiber supplements
  pests:
  - Cowpea Curculio
  - Bean Leaf Beetle
  growth_habit: Twining annual vine to 8–12 feet
  data_quality_score: 0.8
