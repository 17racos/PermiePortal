  description: 'Vigna unguiculata subsp. sesquipedalis is the cowpea that learned to climb—long tender pods, heat tolerance
    that laughs at common beans, and vines that will annex your fence if you blink.


    subtropical and tropical Americas: Plant after soil warms; produces through brutal summer when Phaseolus sulk. Keep picking
    or pods go fibrous fast.


    ☀️💧 Sun and Water Requirements:

    - Full sun for heaviest pod set; fertile, well-drained soil.

    - Steady moisture during flowering and pod set; drought during bloom drops pods overnight.


    ✂️ Propagation:

    - Direct-sow once nights stay warm; inoculate with cowpea rhizobia if you want the nitrogen bragging rights.

    - Reseed every warm season in frost pockets; perennial only where frost never trims the crown.


    🌾 Harvest / Best Use Timing:

    - Pick pods pencil-thick daily; missed pods become fibrous teaching moments.'
  purpose: 'Summer protein and living trellis filler for humid subtropical and tropical gardens:


    - Edible: Pods stir-fried, grilled, or pickled before they turn rope—texture stays crisp if you stay greedy with the harvest
    basket.

    - Nitrogen Fixer: Rhizobia on roots bank atmospheric nitrogen into nodules; slash residues into mulch so the next bed
    inherits the gift instead of the landfill.

    - Pollinator: Cowpea flowers feed bees and small wasps during the dog days when many crops have quit blooming.

    - Animal Fodder: Vines, leaves, and surplus pods can supplement poultry or small livestock rotations if disease pressure
    stays low.'
  companions:
