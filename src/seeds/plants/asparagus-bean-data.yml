description: |-
  Vigna unguiculata subsp. sesquipedalis is the cowpea that learned to climb—long tender pods, heat tolerance that laughs at common beans, and vines that will annex your fence if you blink.

  subtropical and tropical Americas: Plant after soil warms; produces through brutal summer when Phaseolus sulk. Keep picking or pods go fibrous fast.

  ☀️💧 Sun and Water Requirements:
  - Full sun for heaviest pod set; fertile, well-drained soil.
  - Steady moisture during flowering and pod set; drought during bloom drops pods overnight.

  ✂️ Propagation:
  - Direct-sow once nights stay warm; inoculate with cowpea rhizobia if you want the nitrogen bragging rights.
  - Reseed every warm season in frost pockets; perennial only where frost never trims the crown.

  🌾 Harvest / Best Use Timing:
  - Pick pods pencil-thick daily; missed pods become fibrous teaching moments.
purpose: |-
  Edible: Vigna unguiculata subsp. sesquipedalis pods stay stir-fry tender when picked pencil-thick daily -- miss a weekend and the same vine turns rope overnight in 90°F heat.
  Nitrogen Fixer: Cowpea-type rhizobia nodulate roots so chopped vines and nodule-rich soil boost the following corn or squash bed -- inoculate seed if your soil lacks native cowpea rhizobia.
  Pollinator: Yellow-throat pea flowers open mornings through humid summer when common beans quit blooming, feeding honeybees and small carpenter bees on trellis edges.
  Animal Fodder: Soft leaves and surplus pods go to poultry and goats as warm-season protein when you rotate browse before vines lignify -- watch for same legume foliar diseases you see on field peas.
