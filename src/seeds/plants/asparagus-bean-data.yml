  description: "Vigna unguiculata subsp. sesquipedalis is the cowpea that learned
    to climb—long tender pods, heat tolerance that laughs at common beans, and vines
    that will annex your fence if you blink.\n\nNorth Florida / subtropical: Plant
    after soil warms; produces through brutal summer when Phaseolus sulk. Keep picking
    or pods go fibrous fast.\n\nSun and water: Full sun; fertile well-drained soil.
    Steady moisture during flowering and pod set; drought during bloom drops pods.\n\n
    Propagation: Direct-sow; inoculate with cowpea rhizobia if you want the nitrogen
    bragging rights."
