  description: "Basil (Ocimum basilicum) is a fast-growing, aromatic herb widely used
    for culinary and medicinal purposes. It has bright green, oval leaves with a strong,
    slightly sweet aroma. The plant grows between 30–90 cm (12–36 inches) tall and
    produces small white or purple flowers that attract pollinators.\n\nBasil thrives
    in warm, sunny conditions with well-drained soil and requires regular pruning
    to promote bushy growth. It is highly valued for its ability to repel certain
    pests while attracting beneficial insects. Basil is commonly grown in herb gardens,
    companion planted with vegetables, or grown in containers.\n\n \U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade.\n-
    Requires well-drained, moist, fertile soil.\n- Needs regular watering; soil should
    be kept evenly moist but not waterlogged.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Seeds: Sow indoors 4–6 weeks before the last frost or direct sow after the danger
    of frost has passed.\n- Cuttings: Can be propagated from stem cuttings placed
    in water or moist soil.\n- Succession Planting: Recommended every few weeks for
    a continuous harvest.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Leaves can be harvested once the plant reaches 15 cm (6 inches) in height.\n-
    Regular pruning encourages bushy growth and prevents early flowering.\n- Flowers
    should be pinched off to prolong leaf production unless grown for pollinators."
  purpose: |-
    Basil serves multiple functions in a permaculture system:

    - Edible: Leaves are used fresh, dried, or in oils, teas, and culinary dishes.
    - Medicinal: Traditionally used for digestion, anti-inflammatory, and antimicrobial properties.
    - Pollinator: Flowers attract bees, butterflies, and other beneficial insects.
    - Wildlife Attractor: Supports pollinators while deterring certain pests.
    - Border Plant: Commonly used to define garden edges and mixed planting beds.
    - Pest Management: Repels mosquitoes, aphids, and whiteflies while attracting predatory insects.
