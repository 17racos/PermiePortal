  description: "\"Tropical spinach\" is a bucket label for heat-proof leafy greens—**Basella
    alba/rubra** (Malabar spinach) is the usual suspect: succulent vine, mild flavor,
    mucilage that thickens soups, laughs at weather that makes true spinach bolt
    and weep.\n\nNorth Florida: plant after frost; expect rampant summer growth on
    a trellis; may overwinter mild years or reseed. In true tropics it is a short-lived
    perennial vine.\n\nSun and water: Full sun to part shade in brutal heat; fertile,
    well-drained soil with steady moisture—drought makes leaves small and sassy.\n\nPropagation:
    Seeds; cuttings root trivially in water. Perennial tip cuttings indoors before
    frost if you want winter salads."
  purpose: |-
