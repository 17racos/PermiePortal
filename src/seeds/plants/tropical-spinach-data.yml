  description: '"Tropical spinach" is a bucket label for heat-proof leafy greens—**Basella alba/rubra** (Malabar spinach)
    is the usual suspect: succulent vine, mild flavor, mucilage that thickens soups, laughs at weather that makes true spinach
    bolt and weep.


    Plant after frost; expect rampant summer growth on a trellis; may overwinter mild years or reseed. In true tropics it
    is a short-lived perennial vine.


    ☀️💧 Sun and Water Requirements:


    Full sun to part shade in brutal heat; fertile, well-drained soil with steady moisture—drought makes leaves small and
    sassy.


    ✂️ Propagation:


    Seeds; cuttings root trivially in water.

    Perennial tip cuttings indoors before frost if you want winter salads.


    🌾 Harvest / Best Use Timing:


    Clip succulent leaves and tips continuously; mucilage thickens soups—feature or bug depending on the recipe.'
  purpose: |-
    Edible: Basella alba succulent leaves and tips stay mild in heat that makes Spinacia bolt -- mucilage thickens soups; clip stems daily if slimy stir-fries annoy you.
    Ground Cover: Twining stems carpet trellis feet and bed edges once frost risk passes -- constant tip harvest keeps the vine bushy instead of woody.
    Shade Provider: Heart-shaped leaves laminate vertical space -- west-wall trellises throw afternoon shade on pots and understory herbs during subtropical infernos.
    Pollinator: Tiny white to pink axillary flowers feed bees when you pause harvest and let some stems bloom -- re-root pruned tips if you want insurance before cold snaps.
  companions:
  - Okra
  - Sweet Potato
  - Pigeon Pea
  - Roselle
  cautions:
  - Hard frost without protection
  pests:
  - Aphids
  - Leafhoppers
  - Ulluco Weevil
  - Whiteflies
  practitioner_notes: 'Mucilage in stems—stir-fry high heat or accept slimy salads.

    Tip harvest keeps plants bushy—basal lignification if ignored.

    Perennial in frost-free sites—mulch crown after light freezes.'
