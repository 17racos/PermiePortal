  description: "Calamint (Calamintha nepeta) is a compact perennial mint relative of
    Europe and western Asia widely grown in temperate gardens for clouds of tiny white
    to lavender flowers and oregano-like aromatic foliage. Mounding plants reach roughly
    12–18 inches (30–45 cm) and bloom for long periods in sun, attracting small bees
    and parasitoid wasps. It suits herb spirals, path edgings, and pollinator strips
    where aggressive true mints are unwelcome.\n\n☀️💧 Sun and Water Requirements:\nFull
    sun for dense habit and best bloom; tolerates light shade with looser form. Well-drained,
    average to lean soil; drought-tolerant once established compared with mint. Avoid
    wet winter soils that rot crowns.\n\n✂️ Propagation:\nSow seed indoors 6–8 weeks
    before last frost or direct-sow after frost. Softwood cuttings in late spring
    root quickly. Divide mature clumps in spring or fall to renew vigor.\n\n🌾 Harvest
    / Best Use Timing:\nSnip leafy stems for culinary use before heavy flowering for
    mildest flavor, or harvest blooms for garnish. Dry bundles upside down in shade
    with airflow. Shear after first flush to encourage repeat bloom in long summers."
  purpose: |-
    - Edible: Leaves flavor sauces and teas similarly to mild oregano or mint, in smaller quantities.
    - Pollinator: Small flowers feed diverse bees and tiny beneficial insects during mid-season dearth.
    - Ornamental: Fine texture and long bloom make it a workhorse in sunny borders.
    - Pest Management: Aromatic foliage can confuse or repel some herbivores when interplanted lightly.
  companions:
  - Lavender — shared sun, drainage, and pollinator synergy without root aggression of mint
  - Rosemary — structural contrast; both prefer lean dryish soils in Mediterranean-style beds
  - Coneflower — taller summer blooms pair with low calamint skirt for layered pollinator forage
  cautions:
  - Heavy wet clay in winter — crown rot in marginal zones without slope or amendment
  - Overfertilization — lush growth with fewer flowers and more flopping
  pests:
  - Aphids
  - Spider Mites
  practitioner_notes: |-
    It looks like baby oregano that went to finishing school—taste before you dump a handful in stew.
    Shear the first spent flush if you want a second act; calamint responds like a well-trained understudy.
    Deer usually pass; rabbits sometimes disagree—fence young plugs if your local rabbits are literate.
    Drying temperature matters—oven zeal turns aromatics into hay-scented regret.
  growth_habit: Low mounding perennial; tiny tubular flowers; aromatic mint-relative foliage
