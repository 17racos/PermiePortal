  description: "Buffalo plum commonly refers to western sand cherry (Prunus besseyi), a suckering shrub of Great Plains sandhills\
    \ and rocky soils bearing fragrant white spring flowers and black edible cherries on a plant that often stays under 4–6\
    \ feet (1.2–1.8 m). It spreads by roots into thickets stabilizing blowing sand and feeding wildlife during harsh seasons.\
    \ In cold, dry-temperate systems it is a pioneer fruiting shrub for hedgerows and windbreak understories where irrigation\
    \ is scarce and honesty about flavor matters.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun for best flowering\
    \ and fruit; tolerates wind exposure once established. Prefers sandy or gravelly well-drained soils; tolerates drought\
    \ better than pampered orchard hybrids. Occasional deep watering during fruit swell improves size; mulch reduces moisture\
    \ swing at the root collar.\n\n✂️ Propagation:\nDig rooted suckers in early spring; softwood cuttings in early summer\
    \ root under humidity. Sow pits after stratification for breeding diversity. Prune old stems to renew fruiting wood inside\
    \ thickets.\n\n\U0001F33E Harvest / Best Use Timing:\n Pick cherries when black, soft, and fully colored—flavor is tart\
    \ and true. Use in jams, wines, or syrups; fresh eating is seed-forward. Net or accept bird share depending on your ethics\
    \ and pantry goals."
