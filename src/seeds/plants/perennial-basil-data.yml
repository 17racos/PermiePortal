  description: |-
    Perennial basil here means the clove-scented shrubby Ocimum that survives where sweet basil goes to compost — woody base, strong aroma, bee traffic. North Florida: often root-hardy in 9b with mulch; top freezes, crown sometimes laughs and resprouts. Not the same as sterile 'African Blue' pots on Pinterest.

    ☀️💧 Sun and Water Requirements:
    - Full sun for dense oils; part shade tolerable but stretches stems.
    - Well-drained fertile soil; drought-tolerant once established but basil-class flavor needs moisture.
    - Avoid boggy winter pots — roots rot when cold meets sogginess.

    ✂️ Methods to Propagate:
    - Cuttings: root softwood to semi-hardwood in warm months under humidity.
    - Seeds: start warm; variability in scent intensity — cull boring seedlings.
    - Division: split older crowns in spring when actively pushing.
  purpose: |-
    Perennial basil is spice hedge reality:

    - Edible: Leaves in cooked dishes and teas; stronger than Genovese — taste before you batch pesto for guests.
    - Medicinal: Traditional uses across cultures — verify claims, respect potency.
    - Wildlife Attractor: Flowers pull pollinators when you let it bloom strategically.
