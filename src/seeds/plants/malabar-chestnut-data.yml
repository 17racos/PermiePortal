description: |-
  Pachira aquatica is the wetland giant that became a braided office mascot—palmate leaves, huge night-blooming flowers, woody pods stuffed with edible nuts when you have a real tree, not a desk bonsai.

  True outdoor success is mostly 10+; 9b is stunt-and-cover theater. Loves summer wet feet if drainage exists below; hates salt.

  Sun and water: Full sun to part shade; rich soil. Heavy drinker in growth season if not in natural swales.

  - Malabar Chestnut: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both.
  - Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer.
  - Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Pachira aquatica pods split to release large edible seeds that roast like chestnuts when trees are full size -- office “money tree” braids rarely fruit, so judge landscape specimens, not desk souvenirs.
  Ornamental: Palmate leaves and smooth gray bark read tropical along pond edges -- protect from frost; young wood scars if cold snaps follow lush flushes.
  Wildlife Attractor: Night-blooming, bat-pollinated flowers open huge and white -- ripe pods feed squirrels and fruit bats in tropical sites, so harvest early if human share matters.
