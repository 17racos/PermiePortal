    Pachira aquatica is the wetland giant that became a braided office mascot—palmate leaves, huge night-blooming flowers, woody pods stuffed with edible nuts when you have a real tree, not a desk bonsai.
    
    True outdoor success is mostly 10+; 9b is stunt-and-cover theater. Loves summer wet feet if drainage exists below; hates salt.
    
    Sun and water: Full sun to part shade; rich soil. Heavy drinker in growth season if not in natural swales.
    
     ✂️ Propagation: Seed from fresh nuts; large cuttings in humid heat.
    
