  description: 'Artocarpus altilis is the Pacific starch tree—huge lobed leaves, milky sap, and green fruits that roast or
    fry like potato’s overachieving cousin. Seedless cultivars exist; seeded forms blur into breadnut. Not a serious outdoor
    crop until true frost-free tropics—low 40s°F (~4°C) and below damages growth. Greenhouse or brave microclimate only on
    the peninsula margins.


    ☀️💧 Sun and Water Requirements:


    Full sun; deep fertile soil with steady moisture in growth season. Wind protection while young.


    ✂️ Propagation:


    Root cuttings, suckers, or grafted clones—seedlings are a long game.


    🌾 Harvest / Best Use Timing:


    Pick and prepare fruit by maturity stage—immature as vegetable, mature roasted or processed.'
  purpose: '- Edible: Immature fruit as vegetable; mature fruit roasted or processed for starchy calories.

    - Mulcher: Enormous leaves for chop-and-drop when space allows.

    - Animal Fodder: Excess fruit and leaves fold into tropical livestock systems.'
