  practitioner_notes: 'Latex from cut stems can irritate skin—wear gloves when pruning heavy wood or you will learn why harvest
    crews suit up.

    Seedless cultivars are propagated by root cuttings or grafts; seedlings revert toward seedy wild types with variable fruit
    texture.

    Fruit is starchy when mature-green and bakes like a potato; wait for full yellowing and aromatic give if you want dessert
    sweetness.

    Drop mulch builds fast—rake fruit you will not process or you will host fruit fly block parties and feral pig fan clubs.'
