  description: "Mango is a large, evergreen tree native to South Asia, capable of
    reaching heights of 15-30 meters (50-100 feet). It has a dense canopy of glossy,
    dark green leaves and produces fragrant, small white flowers. The fruit is a fleshy
    drupe, varying in size and color, with a sweet, juicy, orange-yellow flesh surrounding
    a large seed.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nMango trees
    prefer full sun and well-drained, slightly acidic to neutral soils rich in organic
    matter. They are drought-tolerant once established but benefit from regular watering
    during dry periods.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation is typically
    through grafting to ensure desirable fruit characteristics. Seed propagation is
    possible but may not produce true-to-type fruit. Grafting involves joining a scion
    from a desired variety onto a rootstock.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nHarvesting occurs when fruits mature and develop full coloration,
    usually in late spring to summer. Mature fruits emit a sweet fragrance and yield
    slightly to gentle pressure."
