  description: "Stevia (Stevia rebaudiana) is a tender herbaceous perennial whose leaves pack intense sweetness from steviol
    glycosides—useful where you want sweetness without sucrose drama in drinks and preserves. Plants branch into bushy mounds
    with soft serrated leaves and small white flowers that bees visit if you allow bloom (flavor quality often drops once
    plants shift energy to seed). It thrives in warm seasons with bright light and steady moisture, and it fits herb spirals,
    raised beds, and patio pots that move indoors when frost threatens.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for highest
    leaf sweetness; light afternoon shade in hottest subtropical summers reduces tip burn.\n- Consistent moisture in well-drained,
    fertile soil; drought makes leaves thin and mean.\n- Protect from hard frost; stems die back but roots may resprout in
    mild zones if mulched.\n\n✂️ Propagation:\n- Softwood cuttings root quickly in warm, humid media.\n- Seeds are tiny and
    variable; named selections are usually cloned.\n- Divide crowded clumps in spring when new shoots appear.\n\n🌾 Harvest /
    Best Use Timing:\n- Harvest leaves before heavy flowering for sweetest glycoside profiles.\n- Dry whole stems in airflow,
    then strip; powder leaves or make alcohol tinctures depending on your kitchen religion.\n- Tiny amounts replace sugar—overdoing
    it reads bitter, not generous."
  purpose: |-
    Stevia serves multiple functions in a permaculture system:

    - Edible: Leaf sweetener for teas, smoothies, and experimental preserves where sugar reduction is the goal.
    - Medicinal: Traditional use overlaps with modern interest in glycoside extracts—respect extract potency versus leaf tea.
    - Border Plant: Compact mounds edge beds and paths where you want a repeatable harvest rhythm.
    - Pest Management: Strong leaf chemistry changes the insect buffet compared with sweet annuals—scout rather than assume invincibility.
    - Pollinator: If bloom is allowed, small flowers feed tiny bees—balance with leaf quality goals.
  companions:
  - Basil — shares warm-season culture and kitchen timing for pesto–tea harvest days.
  - Lemon Balm — mint-family neighbor that tolerates similar moisture if given elbow room.
  - Chamomile — low, cooling edge plant that flowers on a different schedule for pollinator overlap.
  cautions:
