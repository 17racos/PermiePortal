  - Spider Mites
  - Whiteflies
  practitioner_notes: |-
    Bitter aftertaste shows up when you push concentration—start with microdoses in drinks.
    Flowering shifts chemistry—pick your priority: leaves or seeds, not both in the same week.
    Pots dry fast on concrete patios; saucers lie about soil moisture.
    Label dried jars with month—year-old leaf tastes like regret faster than sugar.
