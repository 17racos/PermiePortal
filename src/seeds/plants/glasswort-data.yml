  description: "Glasswort is a jointed, succulent halophyte you find in salt marsh
    and brackish edges — the kind of plant that laughs while your lawn grass throws
    a tantrum in saline soil. Young tips are salty-crisp and edible raw or pickled;
    older stems get woody. A niche edible for coastal and brackish food systems, not a row-crop fantasy.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun; needs high light to stay compact.\nWet
    to moist, poorly drained salty or brackish soils; do not try to drought-stress
    it like a Mediterranean herb.\nTolerates periodic inundation; hates drying out
    in hot wind without salt-marsh humidity.\n\n✂️ Propagation:\n\nSeeds: Sow in spring in damp, salty growing media; germination can be slow and
    irregular.\nTip cuttings: Root in humid conditions for quick clonal increase.\nTransplant small clumps from permitted collection sites only — check local coastal
    harvesting rules.\n\n🌾 Harvest / Best Use Timing:\n\nSnip tender tips in spring and early summer before stems lignify.\nHarvest
    from clean sites only; salt marsh can hide runoff issues you do not want on the
    plate."
