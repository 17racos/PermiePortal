  description: "Glasswort is a jointed, succulent halophyte you find in salt marsh
    and brackish edges — the kind of plant that laughs while your lawn grass throws
    a tantrum in saline soil. Young tips are salty-crisp and edible raw or pickled;
    older stems get woody. In subtropical and tropical Americas / warm coastal regions contexts it is a niche edible
    for coastal food systems, not a row-crop fantasy.\n\n \U0001F31E\U0001F4A7 Sun
    and Water Requirements:\n- Full sun; needs high light to stay compact.\n- Wet
    to moist, poorly drained salty or brackish soils; do not try to drought-stress
    it like a Mediterranean herb.\n- Tolerates periodic inundation; hates drying out
    in hot wind without salt-marsh humidity.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Seeds: Sow in spring in damp, salty growing media; germination can be slow and
    irregular.\n- Tip cuttings: Root in humid conditions for quick clonal increase.\n-
    Transplant small clumps from permitted collection sites only — check local coastal
    harvesting rules.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Snip tender tips in spring and early summer before stems lignify.\n- Harvest
    from clean sites only; salt marsh can hide runoff issues you do not want on the
    plate."
  purpose: |-
