  description: 'The Pineapple Pear is a hardy, deciduous fruit tree known for its heavy yields of large, firm pears with a
    unique pineapple-like flavor. Typically reaching heights of 6–9 meters (20–30 feet) with a spread of 3–6 meters (10–20
    feet), it has a pyramidal growth habit. This cultivar is valued for its adaptability to various soil types, including
    sandy clay or loam, provided they are well-drained. It can tolerate seasonal wet soils if they drain well. The tree blooms
    in early to late spring, producing white blossoms that are susceptible to late frosts. While it is self-fertile, planting
    additional pear varieties nearby can enhance fruit set. The Pineapple Pear is relatively low-maintenance but requires
    attention to watering, especially during establishment. It is susceptible to fire blight, anthracnose, canker, scab, and
    powdery mildew. Insect pests include pear psylla, codling moth, and borers.


    🌞💧 **Sun and Water Requirements:**

    Prefers full sun exposure for optimal growth and fruit production. Requires medium moisture levels; regular watering is
    essential, especially during dry periods. Once established, it exhibits moderate drought tolerance but benefits from consistent
    soil moisture.


    ✂️🫘 **Methods to Propagate:**

    Commonly propagated through grafting onto compatible rootstocks to ensure desired fruit characteristics and disease resistance.
    Grafting is typically performed in late winter or early spring while the tree is still dormant.


    🧑‍🌾👩‍🌾 **When to Harvest:**

    Fruits ripen between August and September. Harvest when pears are firm but have developed their characteristic color.
    For best quality, allow pears to ripen off the tree in a cool, dry place.'
