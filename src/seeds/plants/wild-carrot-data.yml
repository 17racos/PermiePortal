  description: |-
    Wild carrot is the frothy white umbel of roadsides and meadows, often with a single purple floret in the "lace." First-year rosettes are easier to confuse with bad actors than second-year flowering plants — if you cannot split hairs with a botanist's patience, do not eat it. Where it is truly Daucus carota, roots smell like carrot and are edible young; seeds have old herbal use as a spice.
    
    subtropical and tropical Americas: common in disturbed sunny spots. It will cross with garden carrot if both flower — save seed away from Queen Anne if you care about cultivar purity.
    
    ☀️💧 Sun and Water:
    - Full sun.
    - Dry to average, well-drained soils; laughs at poor dirt.
    - Drought-tolerant once established.
    
    ✂️ Propagation:
    - Seed; self-sows freely.
    - Transplant young rosettes in cool, wet weather only.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Wild Carrot growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
