  description: "Wild carrot is the frothy white umbel of roadsides and meadows, often
    with a single purple floret in the \"lace.\" First-year rosettes are easier to
    confuse with bad actors than second-year flowering plants — if you cannot split
    hairs with a botanist's patience, do not eat it. Where it is truly Daucus carota,
    roots smell like carrot and are edible young; seeds have old herbal use as a
    spice.\n\nsubtropical and tropical Americas: common in disturbed sunny spots. It will cross with garden
    carrot if both flower — save seed away from Queen Anne if you care about cultivar
    purity.\n\n☀️💧 Sun and Water:\n- Full sun.\n- Dry to average, well-drained soils;
    laughs at poor dirt.\n- Drought-tolerant once established.\n\n✂️ Propagation:\n-
    Seed; self-sows freely.\n- Transplant young rosettes in cool, wet weather only."
  purpose: |-
    Wild carrot is free insectary with caveats:

    - Edible: Young roots and ripe seeds where ID is bulletproof.
    - Medicinal: Traditional uses of seed — modern caution and ID first.
    - Pollinator: Umbels are busy with small bees, flies, wasps.
    - Wildlife Attractor: Insects and birds (goldfinches on seeds).
    - Border Plant: Airy white fence-line texture.
    - Dynamic Accumulator: Taproot pulls minerals from subsoil.
  companions:
  - Yarrow
  - Clover
  - Black-Eyed Susan
  cautions:
  - Confusion with poison hemlock and water hemlock
  pests:
  - Carrot Rust Fly
  - Aphids
  - Parsley Worms
  practitioner_notes: |-
    Morning picks hold turgor; afternoon heat steals shelf life even if the cooler feels honest.
    Label jars with plant part and date the day you seal—future you is not psychic.
    Cluster patches three feet or wider—tiny one-offs get ignored by bees cruising for volume.
    Notebook one weird year—weather anomalies repeat; memory lies, scribbles do not.
  growth_habit: Biennial taprooted forb
