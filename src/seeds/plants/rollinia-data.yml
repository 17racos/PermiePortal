  description: |-
    Rollinia (Rollinia deliciosa) is a fast-growing, soft-wooded tree in the custard-apple family, bearing large, yellow, soft-spined fruits with creamy, citrus-banana flavored pulp. Mature trees are typically small to medium in stature with open, somewhat brittle branching; fruit hangs on long stalks and ripens in warm, humid weather. It is native to South American lowlands and is grown wherever true tropical conditions hold.

    In subtropical and tropical Americas, rollinia is a collector’s fruit outdoors only in reliably frost-free pockets (roughly zone 10b+); younger wood is cold-sensitive. Puerto Rico’s year-round warmth suits fruiting cycles; Florida growers in marginal areas use greenhouses or heavy microclimate protection. Salt spray and drought during fruit set reduce quality.

    ☀️💧 Sun and Water Requirements:
    - Young trees appreciate partial shade; fruiting adults tolerate more sun in humid tropics if soil moisture stays steady.
    - Deep, fertile, well-drained soil; consistent watering through flowering and fruit fill; poor drainage invites root problems.
    - Protect from strong, drying winds that tear soft leaves and stress fruit set.

    ✂️ Propagation:
    - Seeds are common for home use but offspring vary; sow fresh seed in warm, moist medium.
    - Grafting onto compatible Annona rootstocks is used where skilled growers want known fruit quality.

    🌾 Harvest / Best Use Timing:
    - Pick fruit when color brightens and spines soften slightly; overripe fruit drops and attracts wildlife overnight.
    - Use fresh pulp soon after harvest; flavor is best before fermentation sets in.
  purpose: |-
    Rollinia fills niche roles in humid food forests:

    - Edible: Fresh dessert fruit with high appeal where climate cooperates; pulp suits smoothies and frozen treats.
    - Ornamental: Unusual fruit form and open canopy add tropical drama to a diversified yard or orchard edge.
    - Wildlife Attractor: Fallen or split fruit feeds birds, fruit bats where present, and insects—plan harvest timing or accept shared yields.
