description: |-
  Vietnamese Mint (Persicaria odorata) is a useful perennial species in the Polygonaceae family, native or long-naturalized across parts of the Americas and Eurasia depending on lineage. Mature growth is typically a ground cover form suited to layered guilds, with reliable productivity when site conditions match its ecology. In a permaculture system it contributes food, habitat, and system resilience rather than single-crop output.

  ☀️💧 Sun and Water Requirements:
  Best performance comes with full sun to light partial shade, depending on heat intensity. Keep soil moisture steady during establishment, then water by seasonal demand. Well-drained fertile soil works for most upland entries, while wetland species require saturated margins. Most growth accelerates between 70°F (21°C) and 95°F (35°C), with stress rising near 105°F (41°C).

  ✂️ Propagation:
  Direct seeding is the simplest method where climate allows; sow at the start of the local favorable season and keep the seed zone evenly moist through germination. A second pathway is transplanting nursery starts or divisions once roots are active and temperatures are stable. Woody entries can also be established from dormant bare-root stock or grafted material for cultivar reliability.

  🌾 Harvest / Best Use Timing:
  Harvest edible portions at peak maturity for intended use: leafy crops before heat stress, fruiting types at full color, root crops after starch set, and nuts or grains once fully mature and dry. For ecological functions, the strongest value appears after canopy closure, flowering, and annual residue cycling, when soil cover and habitat effects become consistent.
purpose: |-
  Edible: Persicaria odorata leaves bring cilantro-citrus punch to laksa, salads, and fish wraps -- heat and humidity make it explode where true cilantro bolts.
  Medicinal: Vietnamese sources use the tea for digestion and topical cooling -- high oxalic tang means moderation for kidney-stone-prone eaters.
  Ground Cover: Rooted stems creep along pond margins and wet shade -- constant moisture keeps tips tender; drought turns leaves leathery and sharp.
companions:
- Taro - both thrive in moist soils and partial shade.
- Lemongrass - vertical structure pairs with creeping mint habit.
- Turmeric - similar humidity preference and seasonal harvest rhythm.
