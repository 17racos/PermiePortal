  description: 'Chinese fan palm forms a single trunk topped with large, costapalmate leaves that read "subtropical lawn statue"
    from space. Young specimens are bushy; with age they lift crowns on tall columns. Immature seeds and cabbage have limited
    traditional food use—do your homework before nibbling random palm hearts. Fine in protected 9a/b with frost cloth discipline;
    defoliates in hard freezes but often resprouts if meristem survives. Do not plant if you hate winter anxiety.


    ☀️💧 Sun and Water Requirements:


    Full sun once established; part shade acceptable when young.

    Well-drained but irrigated landscape soil; tolerates brackish wind better than many broadleaf trees.


    ✂️ Propagation:


    Fresh seed in warm, humid media; divisions rare—this is mostly a seedling palm.


    🌾 Harvest / Best Use Timing:


    Immature seeds and palm cabbage have limited traditional food use—verify safe handling before any nibbling experiments.'
  purpose: |-
    Ornamental: Costapalmate fronds on a single clean trunk give formal subtropical structure in courtyards and parking islands where cold snaps only nip tips.
    Edible: Immature endosperm and very young folded leaves appear in niche Asian palm dishes; most landscape use stays ornamental because processing and ID stakes are high.
    Shade Provider: Expanding crown casts moving shade over patios and low shrubs once the trunk lifts the head of foliage above eye level.
    Wildlife Attractor: Dark blue drupes pass through fruit-eating birds; that mobility is exactly why regulators flag Livistona plantings near natural areas.
  companions:
  - Coontie
  - Beautyberry
  - Firebush
  - Pineland Croton
  cautions:
