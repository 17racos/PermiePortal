  description: "Chinese fan palm forms a single trunk topped with large, costapalmate
    leaves that read \"subtropical lawn statue\" from space. Young specimens are
    bushy; with age they lift crowns on tall columns. Immature seeds and cabbage
    have limited traditional food use—do your homework before nibbling random palm
    hearts.\n\nsubtropical and tropical Americas: fine in protected 9a/b with frost cloth discipline;
    defoliates in hard freezes but often resprouts if meristem survives. Do not plant
    if you hate winter anxiety.\n\nSun and water: Full sun once established; part
    shade acceptable when young. Well-drained but irrigated landscape soil; tolerates
    brackish wind better than many broadleaf trees.\n\nPropagation: Fresh seed in
    warm, humid media; divisions rare—this is mostly a seedling palm."
  purpose: |-
    Vertical texture, dappled shade for understory herbs, and that resort aesthetic
    without importing every coconut disease. Invasive potential is regional—check
    county guidance before mass planting near natural areas.
