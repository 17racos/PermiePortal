  practitioner_notes: 'Old boots cling if untrimmed—clean crown carefully; weevils love hidden pockets of decaying organic
    mash.

    Seedlings tolerate shade; mature crowns want sun for tight compact habit—stretched petioles mean past shade regret.

    Spiraling whitefly honeydew rains sooty mold on everything under the skirt—wash fronds or accept black patio furniture.

    Check local invasive-plant guidance before mass landscape seeding—birds move fruit into wild margins faster than policy
    updates.'
