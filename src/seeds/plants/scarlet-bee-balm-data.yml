  description: |-
    Scarlet bee balm (Monarda didyma) is a mint-family perennial of eastern North American moist woods and thickets, bearing shaggy heads of bright red tubular flowers atop square stems with aromatic leaves. Plants reach 60 to 120 cm (2 to 4 feet) and spread by shallow rhizomes into clonal patches. Leaves are used for tea where traditions support safe harvest.

    It suits rain garden centers, pollinator borders, and dappled shade edges in temperate climates with adequate air flow to limit foliar mildew.

    Partial sun with moist, fertile, well-drained soil matches ecology; afternoon shade reduces stress in hot-summer regions. Avoid crowding that blocks air movement.

    Divide clumps every few years in spring, or sow seed outdoors after stratification. Select mildew-resistant cultivars for humid sites.

    Harvest leaves for tea before flowering for mildest flavor; pick flowers for short-term use in salads where food-safety practices match local guidance.
  purpose: |-
    Edible: Flowers and leaves appear in teas and garnishes -- volatile oils are strong; use sparingly until flavor is calibrated.
    Medicinal: Traditional use focuses on digestive and cold-season teas -- thymol-related chemistry demands respect for concentration and individual tolerance.
    Pollinator: Tubular red flowers feed hummingbirds and long-tongued bees -- plant in drifts visible from seating areas for observation.
    Wildlife Attractor: Seed heads feed finches in autumn -- leave stems for overwintering insects when aesthetics allow.
    Ornamental: Bold color breaks shade monotony -- pairs with ferns and large-leaf perennials for textural contrast.
