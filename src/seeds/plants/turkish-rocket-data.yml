  description: "Turkish rocket (Bunias orientalis) is a long-lived mustard relative
    from Eurasia that forms a basal rosette of blistered, warty leaves and sends
    up 1–1.5 m (3–5 ft) flowering stems with small yellow four-petaled blooms. It
    is considered invasive in parts of North America—plant only where you will manage
    seed set and expansion, and prefer managed beds over wildlands in Florida and
    Puerto Rico introductions.\n\n☀️💧 Sun and Water Requirements:\n- Full sun
    to light shade; rosettes persist in partial shade but bloom weakens.\n- Average
    soil moisture; drought-tolerant once established but grows lusher with summer
    rain.\n- Tolerates poor, alkaline, or disturbed soils—do not mistake toughness
    for permission to neglect containment.\n\n✂️ Methods to Propagate:\n- Sow seed
    in spring or autumn in situ; thin to strong spacing to reduce self-sowing chaos.\n-
    Divide mature crowns in early spring when the plant breaks dormancy; replant
    immediately and water until rooted.\n- Root cuttings from young side shoots can
    work in nursery conditions.\n\n🌾 Harvest / Best Use Timing:\n- Pick young spring
    leaves for cooked greens; flavor is mustard-adjacent and benefits from blanching.\n-
    Flower buds compare to broccoli raab when still tight.\n- Cut flowering stems
    before seed set if you are containing spread; compost biomass away from fence
    lines."
  purpose: |-
    Turkish rocket is a brassica for the lazy perennial kitchen—if you police its ego:

    - Edible: Rosette leaves and flower shoots extend the mustard-green season without replanting yearly.
    - Biomass: Chopped leaves and stems bulk compost piles and mulch paths when harvested aggressively.
    - Wildlife Attractor: Early-season flowers feed pollinators before many annuals wake up.
    - Border Plant: Bold texture reads structural at bed edges—again, only where expansion is controlled.
    - Dynamic Accumulator: Deep taproot mines minerals that return when plant material is cycled on-site.
