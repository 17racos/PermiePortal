  description: |-
    Cornelian cherry (Cornus mas) is a deciduous shrub or small tree native to Europe and western Asia, famous for its early spring blooms. It typically grows about 3–8 m (10–26 ft) tall and forms dense, branching growth with leathery leaves and clusters of small yellow flowers that arrive before many other garden plants wake up. In permaculture, that early nectar is free pollinator fuel, while the red, tangy drupes become a jam-and-snack harvest that extends the food calendar.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; flowering is best with more light.
    - Water moderately during establishment; once established it tolerates short dry spells.
    - Prefers well-drained soil with compost; heavy waterlogged ground can cause decline.
    - Handles cool winters and recovers with pruning and good soil.
    
    ✂️ Propagation:
    - Seeds: cold-stratify for about 3–4 months; germination can take 6–18 months depending on temperature stability.
    - Hardwood cuttings: take in dormancy; root with bottom heat and consistent moisture, often in 6–12 weeks.
    - Suckers: transplant naturally forming shoots into prepared spots for faster “already grown” plants.
    
    🌾 Harvest / Best Use Timing:
    - Harvest drupes when they turn dark red and soften slightly (late summer into fall depending on climate).
    - Eat fresh if you like tart fruit, or process into jam, syrups, compote, and baked fillings.
    - You can also dry some fruit slices for off-season snacks.
  purpose: |-
    Edible: The fruit’s tart flavor is ideal for preserves that keep your harvest productive during lean seasons.
    Wildlife Attractor: Early blossoms feed pollinators when fewer flowers exist, strengthening the whole system’s insect rhythm.
    Ornamental: Yellow spring flowering plus attractive fruit makes it a living seasonal landmark.
    Shade Provider: Dense branches and canopy mass offer partial shade that reduces evaporation for understory crops.
  companions:
  - Comfrey (Symphytum officinale) — deep roots and chop-and-drop mulch pair with cornelian cherry’s soil-building role.
  - Hazel (Corylus avellana) — similar climate tolerance and understory spacing supports layered woodland-style plantings.
  - Garlic (Allium sativum) — helps manage pest pressure in nearby beds and keeps the ground productive between tree roots.
  cautions:
  - Avoid planting where drainage is poor; cornelian cherry dislikes long waterlogged seasons.
  practitioner_notes: |-
    Prune for structure right after bloom, not in the middle of heat stress.
    Keep weeds down the first year so the root system doesn’t lose its “no competition” start.
    Fruit ripeness is uneven—pick in rounds for the best sweetness and flavor.
  pests:
