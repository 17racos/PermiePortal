  description: "Katuk is a perennial shrub native to Southeast Asia, commonly growing
    up to 2-3 meters (6-10 feet) in height. It features dark green, oval-shaped leaves
    approximately 5-6 cm long, with small, flat, round yellow to red flowers that
    bloom in the leaf axils during summer and fall. The plant produces purple capsules
    containing small black seeds. Katuk thrives in tropical climates and is known
    for its rapid growth under warm, humid conditions.\n\n\U0001F31E\U0001F4A7 Sun
    and Water Requirements:\nKatuk prefers partial shade, mimicking its natural understory
    habitat, but can tolerate full sun if provided with ample water. It grows best
    in moist, well-drained soils rich in organic matter and can withstand short periods
    of flooding. Regular watering is essential, especially when grown in full sun,
    to maintain its lush foliage.\n\n✂️\U0001FAD8 Methods to Propagate:\nKatuk can
    be propagated through stem cuttings or seeds. For cuttings, select semi-woody
    stems at least 30 cm (12 inches) long and plant them in moist soil, keeping them
    in the shade until they establish roots. Seeds can be sown in potting medium and
    typically germinate rapidly, with seedlings growing quickly under favorable conditions.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nThe young leaves and shoots of Katuk can be harvested year-round
    in tropical climates. Regular pruning encourages bushier growth and a continuous
    supply of tender foliage. In cooler regions, growth may slow during colder months,
    and the plant may lose its leaves, resuming vigorous growth with the return of
    warmer temperatures."
