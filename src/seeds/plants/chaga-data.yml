  description: "Chaga is not a mushroom in the cap-and-stem sense — it is a sterile
    conk stage of Inonotus obliquus, erupting from birch bark as a cracked, charcoal-black
    mass with an orange-brown interior. It belongs to cold-climate birch forests
    and has no honest outdoor analog in subtropical Florida. If you are reading this
    in Jacksonville, you are planning a sourcing strategy, not a planting calendar.
    Wild harvest ethics matter here: slow-growing conks are easily overharvested,
    and stripping live public trees is bad form in any zip code.\n\n☀️💧 Sun and
    Water:\n- Native range is cool, humid continental climates tied to paper and
    yellow birch.\n- No subtropical substitute; river birch in FL will not produce
    meaningful conks.\n- Indoor cultivation research exists but is not backyard-accessible.\n\n✂️
    Propagation:\n- Not a home propagation crop in the subtropics.\n- Source from
    reputable northern foragers or certified growers if you want the tea.\n- Inoculation
    of birch logs exists experimentally but requires years of colonization."
  purpose: |-
    Chaga is a cold-climate medicinal with deep traditional roots in Siberian and
    northern European folk medicine:

    - Edible: Prepared as a long-simmered decoction or tea; not eaten as a food
      mushroom in the conventional sense.
    - Medicinal: Traditional use for immune support; modern research is active but
      overhyped in supplement marketing — read primary sources.
    - Mulcher: In native range it is part of birch forest decay ecology; conks
      signal internal rot, not a bonus crop on healthy stock.
  substrate:
  - Birch (primary)
  - Alder
  - Elm (rarely)
  mycelium_type: Parasitic / white rot
  fruiting_season: Perennial conk; harvest traditionally after hard freeze, late
    fall through winter
  cultivation_difficulty: Not recommended for subtropical cultivation
  spawn_type: Outdoor only — natural inoculation or experimental log colonization
