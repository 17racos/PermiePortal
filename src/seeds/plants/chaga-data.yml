  practitioner_notes: |-
    Chaga is a tree stress signal, not a bonus crop — a conk on a live birch means
    internal rot is already underway; harvest ethically and sparingly.
    Confirm charcoal-black exterior and orange-brown interior before use — other
    dark conks exist and misidentification is not worth the trend.
    Winter harvest after hard freezes is traditional; summer tissue is soft and
    spoils quickly.
    Leave a portion of any conk you find — complete removal strips inoculum and
    collapses local patch recovery.
    Source from certified northern foragers if you are in Florida; mail-order is
    the honest path here.
  growth_habit: Parasitic canker on birch and related hosts; cold northern climates
