    Biomass: Chaga prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories
  companions:
  - Birch -- primary host tree; Chaga parasitizes Betula species almost exclusively in the wild
  - Alder -- secondary host in some northern regions; same Betulaceae family
  - Comfrey -- dynamic accumulator planted near host trees feeds the surrounding soil biology
  cautions:
  - Not suitable for subtropical or tropical cultivation
  - Repeated conk harvesting from live trees accelerates host decline
