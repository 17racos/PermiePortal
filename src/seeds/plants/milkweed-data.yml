  description: "Milkweed is a perennial plant native to North America, known for its
    clusters of pink to lavender-colored flowers that bloom in midsummer. The plants
    can vary in height, typically ranging from 0.6 to 1.8 meters (2 to 6 feet). They
    have broad, lance-shaped leaves and produce seed pods filled with silky-haired
    seeds.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nMilkweeds generally
    prefer full sun and well-drained soils. Species like Butterfly Milkweed (Asclepias
    tuberosa) are drought-tolerant, while Swamp Milkweed (Asclepias incarnata) thrives
    in moist to wet soils.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation can
    be done through seeds or root cuttings. Seeds often require cold stratification
    to germinate effectively. Planting should be done in the fall or after a period
    of cold treatment.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nFor
    medicinal or edible uses, harvest young shoots or flower buds before they fully
    open. Ensure proper identification and preparation, as some parts can be toxic
    if not handled correctly."
