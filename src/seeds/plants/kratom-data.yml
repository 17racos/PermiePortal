description: |-
  Kratom is a fast-growing tropical tree in the coffee family with a legal and cultural profile that varies by jurisdiction—check local law before you treat your yard like a pharmacopeia. Botanically it wants heat, humidity, and zero frost delusions.

  Outdoor year-round is mostly a zone 11+ fantasy; greenhouse or seasonal patio plant is the realistic script for most of the peninsula.

  Sun and water: Bright light to partial sun when young; protect from desiccating wind. Rich, moist, well-drained soil with steady humidity during growth.

  Fresh seed (viability drops quickly); cuttings with bottom heat in protected conditions.

  - Leaf harvest timing follows documented alkaloid curves in regions where cultivation is legal -- check jurisdiction before planting drama.
  - Pick mature leaves in dry weather; rapid wet piles compost themselves.
  - Dry flat with excellent airflow; label vein color and date for your own notes.
purpose: |-
  Medicinal: Mitragyna speciosa leaves contain mitragynine-related alkaloids used in traditional Southeast Asian labor culture -- legality shifts by country and state, so verify statutes before growing trees for anything beyond horticultural curiosity.
  Mulcher: Juvenile trees produce large, soft leaves that rot fast into tropical mulch -- useful where law allows managed plantings; still avoid drainage ditches where seeds or cuttings might escape into native hammocks.
companions:
- Leucaena
- Shade-tolerant understory herbs (in controlled plantings)
cautions:
- Planting where prohibited
- Overwatering in cool, dark corners (root rot invites itself)
pests:
- scale insects
- aphids
- caterpillars
growth_habit: Tall tropical tree in optimal climate; smaller in containers
