  description: "Cherimoya is a smallish deciduous-to-semi-evergreen annonaceous
    tree with hand-sized, scaly green fruit and sweet, custardy flesh that tastes like
    someone crossed a pear with a pineapple and a hug. Hand pollination is often
    required outside its native Andean window because natural pollinators can be lazy
    tourists.\n\nFlorida and Puerto Rico is marginal—occasional fruit in the warmest pockets,
    more reliable from South Florida into the true tropics. Young trees are frost-tender;
    established specimens tolerate brief cool dips better than hype suggests, but not
    a real freeze party.\n\nSun and water: Full sun once established; partial shade
    acceptable inland in blazing heat. Deep, fertile, well-drained soil; consistent
    moisture during fruit swell; reduce overwatering in cool wet winters.\n\nPropagation:
    Grafted trees for known cultivars; seedlings for rootstocks and gambling; cuttings
    and air layering possible but fussier. Plant two genetically different trees or
    learn to paint pollen with a brush like a caffeinated bee."
  purpose: |-
    High-value dessert fruit in a frost-protected food forest. Summer shade for
    understory guilds once the canopy builds. If you skip pollination homework, you
    get a handsome foliage plant that owes you fruit.
