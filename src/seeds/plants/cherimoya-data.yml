  description: "Cherimoya is a smallish deciduous-to-semi-evergreen annonaceous
    tree with hand-sized, scaly green fruit and sweet, custardy flesh that tastes like
    someone crossed a pear with a pineapple and a hug. Hand pollination is often
    required outside its native Andean window because natural pollinators can be lazy
    tourists. Warm outer margins are marginal—occasional fruit in the warmest pockets,
    more reliable deep into true tropical climates. Young trees are frost-tender;
    established specimens tolerate brief cool dips better than hype suggests, but not
    a real freeze party.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun once established; partial shade
    acceptable inland in blazing heat.\nDeep, fertile, well-drained soil; consistent
    moisture during fruit swell; reduce overwatering in cool wet winters.\n\n✂️ Propagation:\n\nGrafted trees for known cultivars; seedlings for rootstocks and gambling; cuttings
    and air layering possible but fussier.\nPlant two genetically different trees or
    learn to paint pollen with a brush like a caffeinated bee.\n\n🌾 Harvest / Best Use Timing:\n\nHarvest fruit when mature green begins to yield and aroma builds; ripening finishes off the tree with hand pollination often required for good set."
