  description: "Parsley hawthorn (Crataegus marshallii) is a small native hawthorn of southeastern North American wood margins, named for deeply cut leaves that resemble parsley and for showy white spring flowers followed by red pomes. Plants typically grow 10–20 feet (3–6 m), often multi-stemmed, with thorns that reward honest pruning gloves. It fits permaculture hedgerows for early pollinator support, bird food, and slope stabilization where partial shade and decent drainage exist.\n\n☀️💧 Sun and Water Requirements:\nFull sun to bright partial shade; best flowering with morning sun and afternoon relief in hot climates. Moist, well-drained loams mimic woodland edges; tolerates occasional dry spells once established but not desert baking without mulch. Avoid standing water over roots.\n\n✂️ Propagation:\nSow stratified seed after 90–120 days cold-moist; seedlings vary. Take hardwood cuttings in dormancy with hormone and humidity. Prune crossing branches after bloom to improve airflow and reduce leaf-spot drama.\n\n🌾 Harvest / Best Use Timing:\nFruit is small and seedy—traditionally used for jellies where sugar and patience exist. Harvest pomes when fully colored and slightly soft; process quickly. Leave some fruit for migrating birds if hedgerow ecology matters."
  purpose: |-
