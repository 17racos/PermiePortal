    Double-flower ornamentals nearby can confuse hawthorn pollination timing—keep natives grouped for cleaner genetics.
    Cedar-apple rust life cycles exist—separate Rosaceae from alternate hosts when designing disease-quiet guilds.
    Jelly yield is humble—scale sugar and time to realistic fruit volume, not Instagram buckets.
