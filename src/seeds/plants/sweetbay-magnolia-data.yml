  description: "Sweetbay magnolia (Magnolia virginiana) is an evergreen to semi-evergreen
    tree of acidic swamps, bay forests, and moist woodlands along the Atlantic and
    Gulf coastal plains and northward in sheltered microclimates. Lemon-scented creamy
    flowers open in late spring and sporadically in warm weather; red cone-like fruits
    show silver seeds. It supplies high-canopy shade in humid subtropical food forests
    without the heavy darkness of dense broadleaf evergreens.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun to part shade; afternoon shade reduces leaf burn where
    winters are mild and summers long. Prefers consistently moist, acidic, organic
    soils; tolerates brief flooding typical of swamps. Not for high pH desert soils
    without major amendment and ongoing acidification.\n\n✂️ Propagation:\nSow fresh
    seed after removing red coating; do not let seed dry completely. Semi-hardwood
    cuttings in summer under mist can work for clones. Transplant young trees in cool,
    wet weather; mulch wide to protect surface roots.\n\n🌾 Harvest / Best Use Timing:\nFlowers
    are occasionally used for teas or flavoring in tiny amounts with confident
    ID; focus landscape harvest on aesthetic pruning after bloom if shaping is needed.
    Collect fallen leaves for acidic mulch under blueberries; avoid heavy summer
    pruning that stresses heat-stressed trees."
