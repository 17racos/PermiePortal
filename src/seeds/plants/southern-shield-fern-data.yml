  description: "Southern shield fern (Thelypteris kunthii) is a semi-evergreen to
    deciduous fern of moist woodlands, stream banks, and shaded ditches across the
    southeastern United States into tropical America. Fronds are long, tapering,
    and produce a lush fountain where humidity stays honest. It is a workhorse ground
    layer for shaded rain gardens, palm understories, and tropical-transition food
    forests.\n\n☀️💧 Sun and Water Requirements:\n- Light shade to part shade; morning
    sun only if soil stays moist.\n- Moisture-loving; tolerates short dry spells
    in humid air but crisping follows drought.\n- Rich, organic, well-drained soils;
    mulch with leaf litter to mimic forest floor.\n\n✂️ Propagation:\n- Division
    of crowns in spring before new croziers expand.\n- Spores on sterile medium
    under humidity—slow.\n- Transplant divisions with steady watering the first dry
    season.\n\n🌾 Harvest / Best Use Timing:\n- Not a crop fern; leave fronds for
    structure and habitat.\n- Remove frost-tattered blades in late winter to tidy
    before spring flush.\n- For nursery increase, divide when fiddleheads are thumb-high."
  purpose: |-
