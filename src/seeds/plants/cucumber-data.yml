    Pollinator: Cucumber opens reliable nectar and pollen during the window your warm-season or early-spring crops are setting fruit -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
    Wildlife Attractor: Wildlife shows up for calories and cover: Cucumber (Cucumis sativus) is a warm-season vine grown for crisp, refreshing fruits harvested before they turn seedy and tough. -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Water Retention: Cucumber increases effective water security through mulch-form litter, dense roots, or slowed surface flow on your contour -- adds living mulch, root channels, or canopy drip patterns that even out soil moisture between rains
  companions:
