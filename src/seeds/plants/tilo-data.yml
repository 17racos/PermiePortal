  description: "Tilo (Justicia pectoralis) is a low, shade-loving herbaceous perennial of Central America and the Caribbean,
    grown for leaves that smell sharply of coumarin—vanilla-hay perfume that signals identity faster than a field guide lecture.
    It is used in traditional calming teas and respiratory formulas in some cultures; modern use belongs with accurate ID and
    safety research, not vibes. Soft stems root easily, making it a useful understory ground layer in humid subtropical food
    forests where sun-loving herbs fry.\n\n☀️💧 Sun and Water Requirements:\n- Bright shade to partial sun; full tropical sun
    can scorch leaves.\n- Consistent moisture in well-drained, organic-rich soil; drought makes leaves thin and cranky.\n-
    Protect from frost; mulch crowns in marginal zones.\n\n✂️ Propagation:\n- Cuttings root readily in warm, humid seasons.\n-
    Divide clumps when pots or beds get crowded.\n- Seeds are less common in home practice—cloning preserves known chemotypes.\n\n🌾
    Harvest / Best Use Timing:\n- Harvest tender shoot tips for freshest aroma; older leaves can read harsher.\n- Dry in airflow
    out of direct sun to preserve volatile character.\n- Leave flowering stems for pollinators if seeds are not your hobby."
  purpose: |-
    Tilo serves multiple functions in a permaculture system:

    - Medicinal: Traditional aromatic teas for calming and respiratory support—verify species, dosage, and contraindications with reliable references.
