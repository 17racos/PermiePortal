description: |-
  Tilo (Justicia pectoralis) is a low, shade-loving herbaceous perennial of Central America and the Caribbean, grown for leaves that smell sharply of coumarin—vanilla-hay perfume that signals identity faster than a field guide lecture. It is used in traditional calming teas and respiratory formulas in some cultures; modern use belongs with accurate ID and safety research, not vibes. Soft stems root easily, making it a useful understory ground layer in humid subtropical food forests where sun-loving herbs fry.

  Bright shade to partial sun; full tropical sun can scorch leaves. Consistent moisture in well-drained, organic-rich soil; drought makes leaves thin and cranky. Protect from frost; mulch crowns in marginal zones.

  Cuttings root readily in warm, humid seasons. Divide clumps when pots or beds get crowded. Seeds are less common in home practice—cloning preserves known chemotypes.

  Harvest tender shoot tips for freshest aroma; older leaves can read harsher. Dry in airflow out of direct sun to preserve volatile character. Leave flowering stems for pollinators if seeds are not your hobby.
purpose: |-
  Medicinal: Justicia pectoralis leaves carry a sharp coumarin-vanilla perfume used in traditional calming and respiratory teas -- coumarin potency is real; confirm ID, dose, and drug interactions before scaling batches.
  Ornamental: Low, shade-tolerant mats reward placement along humid paths -- where brushing releases the signature hay-sweet scent faster than any label.
  Wildlife Attractor: Small understory flowers reach tiny bees and flies in niches big tropical blossoms skip -- steady moisture keeps foliage plush enough to advertise.
  Border Plant: Soft, non-vining texture can edge shade beds and ginger-turmeric zones -- without forming a tall light barrier.
  Ground Cover: Stems root at nodes in organic-rich, evenly moist soil -- a living mulch under fruit trees where sun-loving herbs scorch.
