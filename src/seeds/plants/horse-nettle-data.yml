  description: "Horse nettle (Solanum carolinense) is a deep-rooted herbaceous perennial nightshade of pastures, roadsides,\
    \ and disturbed ground across eastern and central North America, with lobed leaves, purple star flowers, and yellow berries\
    \ that look like toy tomatoes but carry solanine chemistry you should not cosplay. Livestock and curious mammals can be\
    \ poisoned by grazing; humans confuse it with other solanums at their peril. In ecology it feeds specialist insects and\
    \ teaches respect for plant ID—cultivation is rarely intentional except in native plant collections with signage and ethics.\n\
    \n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun; tolerates droughty, low-fertility soils and heavy clay once established—taprooted\
    \ toughness is the brand. Thrives where soil is disturbed and competition is weak. Not shade-tolerant long term; dense\
    \ cover suppresses it better than moral lectures.\n\n✂️ Propagation:\n Spreads by rhizomes and seed; root fragments resprout—tillage\
    \ without follow-up can multiply patches.\nDo not propagate for food systems; if managing out of pastures, combine mowing\
    \ timing with competitive perennial grasses.\n\n\U0001F33E Harvest / Best Use Timing:\nDo not harvest for food. For research\
    \ or seed banking, collect ethically with permits; wear gloves—spines on stems and leaves are sincere."
