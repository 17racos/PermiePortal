  description: "Desert marigold (*Baileya multiradiata*) is a short-lived perennial
    or self-seeding subshrub from the southwestern deserts, forming low mounds of woolly
    gray foliage topped with bright yellow daisy flowers for much of the warm season.
    Plants are usually under 18 inches tall and spread in loose clumps. It is grown
    in Florida and Puerto Rico mainly in rock gardens, berms, and pollinator strips
    where drainage is sharp and humidity around the crown stays moderate.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nGive full sun and excellent drainage; avoid
    heavy irrigation and wet nights, which promote rot in humid subtropical and tropical
    gardens. A quick soak then dry-down mimics desert storms better than daily sprinkles.\n\n✂️
    **Methods to Propagate:**\n- **Seeds:** Sow on the surface of sandy mix in warmth;
    light helps germination. Thin or transplant while small.\n- **Division:** Lift
    and split modest clumps in early warm weather if the crown is not woody; replant
    immediately into dryish soil.\n\n\U0001F9D1‍\U0001F33E **Harvest / Best Use Timing:**\n
    Pick flowers at midday on dry days for longest vase life. For seed saving, wait
    until heads are crisp and straw-colored before collecting. Deadheading can extend
    bloom but reduces self-sowing; leave late flowers if you want a naturalized drift."
  purpose: |-
    - **Ornamental:** Long yellow bloom provides high-contrast color in xeric and Mediterranean-style plantings.
    - **Pollinator:** Small native bees and butterflies work the many disc and ray florets during warm months.
    - **Ground Cover:** Low habit covers bare mineral soil between larger succulents and shrubs.
    - **Erosion Control:** Fibrous roots knit sandy slopes while foliage reduces rain splash.
    - **Wildlife Attractor:** Seeds feed finches and other small birds when heads mature.
