description: |-
  Mexican sunflower (Tithonia diversifolia) is a fast-growing, sun-loving plant prized for its big orange daisy blooms and its ability to pump out biomass quickly. It belongs to the daisy family and is commonly grown across warm temperate and subtropical climates as a short-season annual or managed perennial. In permaculture, it matters because it gives you two inputs at once: a high-visibility nectar source for pollinators and a chopable mass you can turn into mulch so the soil stays covered instead of cooking under bare sun.

  ☀️💧 Sun and Water Requirements:
  - Full sun for heavy flowering; shade delays blooms.
  - Moderate water during establishment; once growing it tolerates warm-season dry spells.
  - Prefers fertile, well-drained soil; too much nitrogen can cause tall, floppy growth.
  - Avoid wet, stagnant beds that invite root problems.

  ✂️ Propagation:
  - Seeds (spring sow): direct-sow after soil warms and frost risk passes; germination often takes 5–12 days.
  - Seeds (start indoors): start in trays 3–4 weeks earlier and transplant after hardening off.
  - Optional: pinch young plants to encourage branching for more blooms.

  🌾 Harvest / Best Use Timing:
  - For flowers: trim often to keep the nectar engine running; harvest blooms in the morning.
  - For mulch: cut back stems before they become woody; leave residues on the surface or compost.
  - For seed: allow some heads to mature and dry on the plant before collecting.
purpose: |-
  Pollinator: Tithonia diversifolia opens big orange Asteraceae heads that pump nectar through warm months -- trim spent blooms to keep the nectar engine running rather than letting the plant put energy into one towering seed wave.
  Wildlife Attractor: Dense stems and late-season nectar support butterflies, swallowtails, and hunting spiders -- seed heads left standing feed finches once frost thins other forage.
  Mulcher: Fast soft stems chop into surface mulch before lignification -- layer residues directly on bare soil to suppress weeds and retain moisture without importing bales from off-site.
  Dynamic Accumulator: Rapid growth pulls nitrogen, phosphorus, and potassium from subsoil and concentrates them in soft leaf tissue -- the chop-and-drop value is highest when stems are cut young before lignin locks nutrients into slow-decomposing fibers.
  Border Plant: A single row of diversifolia screens compost piles, water tanks, or unsightly fence lines within one warm season without the permanent shade commitment of a tree hedge.
  Erosion Control: Dense fibrous root mass binds topsoil on disturbed slopes and orchard alleys where bare soil would compact and crust between rain events.
companions:
- Corn (Zea mays) — tall structure improves edge microclimate while sunflower adds
  nectar and chopable residue.
- Marigold (Tagetes patula) — keeps beneficial insect pressure active and makes it
  easier to spot pest surges early.
- Basil (Ocimum basilicum) — shares warm-season growth and benefits from sunflower’s
  canopy shading when plants are young.
cautions:
- Manage self-seeding; it can turn into a stubborn volunteer in small gardens.
pests:
- Aphids
- Spider Mites
- Root Rot
- Caterpillars
