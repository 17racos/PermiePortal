  description: "Rusty blackhaw (Viburnum rufidulum) is a deciduous shrub to small
    tree of southeastern and central North America, common in dry woods, thickets,
    and limestone glades. Leathery leaves and rusty-hairy twigs set it apart from
    smoother viburnums; blue-black drupes ripen for wildlife in autumn. It is a
    drought-tough native for hedges, bird plantings, and savanna restoration where
    possumhaw wants more moisture than you have.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun to partial shade; best flowering and fruiting with strong light.\n-
    Drought tolerant once established; appreciates occasional deep watering in extreme
    heat.\n- Well-drained soils; tolerates alkaline rocky ground.\n\n✂️ Propagation:\n-
    Seeds: double dormancy possible—sow fresh or stratify in stages.\n- Softwood cuttings
    in early summer under mist.\n- Transplant small container plants; older specimens
    resent bare-root moves.\n\n🌾 Harvest / Best Use Timing:\n- Fruit is edible
    when fully ripe but often astringent raw; jams appear in regional traditions.\n-
    Leave most drupes for migrating birds.\n- Prune after flowering to preserve next
    season’s bloom wood."
  purpose: |-
    - Edible: Ripe drupes can be processed like other viburnums with sugar and acid balance.
    - Wildlife Attractor: Flowers support pollinators; fruit feeds birds and mammals.
    - Border Plant: Dense habit and thornless twigs suit informal screens on dry sites.
    - Ornamental: Glossy foliage and showy autumn color add landscape value.
  companions:
  - Possumhaw Viburnum — wet-site cousin for moisture gradient plantings in large gardens
