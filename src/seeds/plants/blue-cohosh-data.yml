  description: "Blue cohosh (Caulophyllum thalictroides) is a long-lived woodland
    perennial of eastern North America, bearing blue-green, thrice-compound leaves
    reminiscent of meadow-rue and odd yellow-green to brownish spring flowers that
    mature into striking blue berries on thick stalks. Plants stand roughly 1–3 feet
    (30–90 cm) in flower and fruit, spreading slowly by rhizomes in rich, moist forest
    soils. Berries and roots appear in historical herbal literature but contain alkaloids—modern
    use belongs strictly to trained practitioners.\n\n☀️💧 Sun and Water Requirements:\nPartial
    to full shade; morning sun with afternoon shade works in cooler zones. Moist, well-drained,
    humus-rich soil mimics maple-beech forest floors; drought causes early dormancy
    and weak fruiting. Mulch with leaf mold; avoid waterlogged clay.\n\n✂️ Propagation:\nSow
    fresh seed promptly; double dormancy may delay germination 1–2 years—label pots
    and wait. Divide dormant rhizomes in early spring, ensuring each piece has buds.
    Patience beats forcing heat on this species.\n\n🌾 Harvest / Best Use Timing:\nGarden
    value peaks at the blue-berry stage in early summer—photograph, do not overpick
    wild stands. Any root harvest for medicine should come only from abundant cultivated
    patches with legal and ethical review; toxicity is real."
  purpose: |-
