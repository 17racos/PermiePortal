  description: |-
    Mexican tarragon is the anise-flavored marigold that fakes tarragon in heat where French tarragon sulks. Tea, mole herbs, pollinator bait—pick your lane.
    
    Dies back in hard frost; returns from roots in mild 9a/b if mulched. In cold snaps it becomes a memory unless potted.
    
    Sun and water: Full sun for dense oils and upright habit. Average, well-drained soil; drought-tolerant once established but wilts dramatically when thirsty—mostly theater.
    ✂️ Propagation:
    Cuttings root easily; seeds for diversity; divide clumps in spring.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Mexican Tarragon growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
