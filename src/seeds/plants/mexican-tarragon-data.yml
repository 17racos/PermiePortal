  description: 'Mexican tarragon is the anise-flavored marigold that fakes tarragon in heat where French tarragon sulks. Tea,
    mole herbs, pollinator bait—pick your lane.


    Dies back in hard frost; returns from roots in mild 9a/b if mulched. In cold snaps it becomes a memory unless potted.


    Sun and water: Full sun for dense oils and upright habit. Average, well-drained soil; drought-tolerant once established
    but wilts dramatically when thirsty—mostly theater.

    ✂️ Propagation:

    Cuttings root easily; seeds for diversity; divide clumps in spring.'
  purpose: '- Edible: Anise-scented leaves replace heat-sulking French tarragon in moles, beans, and everyday cooking where
    marigold flavor is welcome.

    - Medicinal: Tea and digestive traditions show up wherever Tagetes lucida is culturally embedded—harvest before frost
    if you want aerial parts dry.

    - Ornamental: Upright stems, gold flowers, and resinous foliage behave like a structural perennial herb that still reads
    pretty from the path.

    - Wildlife Attractor: Late-season blooms pump nectar to butterflies and bees after many culinary herbs have called it
    a season.'
