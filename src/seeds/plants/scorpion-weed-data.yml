  description: "Heliotropium angiospermum is a sprawling, salt-tolerant native of
    coastal and disturbed sandy spots, with coils of tiny white flowers that earned
    the scorpion-tail nickname. It is pretty, tough, and not a salad green — many
    heliotropes carry pyrrolizidine alkaloids, so treat it as habitat and eye-candy,
    not lunch, unless you have a vetted, species-specific ethnobotanical source.\n\n
    In Florida and Puerto Rico it shines in briny edges, dunes, and roadsides where less
    interesting weeds would dominate. Give it sun and drainage; it sulks in soggy
    shade.\n\n☀️💧 Sun and Water:\n- Full sun.\n- Drought-tolerant once established;
    tolerates occasional salt spray and brackish influence.\n- Sandy or sandy-loam;
    avoid heavy wet clay.\n\n✂️ Propagation:\n- Seed in warm weather on prepared sand.\n-
    Softwood cuttings root easily in humid conditions."
  purpose: |-
    Scorpion weed is a native ground-layer for harsh edges:

    - Wildlife Attractor: Small flowers feed diverse pollinators in harsh sites.
    - Border Plant: Soft texture along paths, dunes, and food-forest margins.
    - Erosion Control: Mats stabilize loose sand.
  companions:
  - Beach Bean
  - Railroad Vine
  - Saltbush
  avoid:
