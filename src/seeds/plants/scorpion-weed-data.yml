description: |-
  Heliotropium angiospermum is a sprawling, salt-tolerant native of coastal and disturbed sandy spots, with coils of tiny white flowers that earned the scorpion-tail nickname. It is pretty, tough, and not a salad green — many heliotropes carry pyrrolizidine alkaloids, so treat it as habitat and eye-candy, not lunch, unless you have a vetted, species-specific ethnobotanical source.

   In subtropical and tropical Americas it shines in briny edges, dunes, and roadsides where less interesting weeds would dominate. Give it sun and drainage; it sulks in soggy shade.

  Full sun. Drought-tolerant once established; tolerates occasional salt spray and brackish influence. Sandy or sandy-loam; avoid heavy wet clay.

  Seed in warm weather on prepared sand. Softwood cuttings root easily in humid conditions.

  Small flowers support native bees -- treat as support species, not salad bulk. If managing in restoration, collect seed when capsules brown and before full shatter. Avoid heavy grazing timing on restoration sites until stands establish.
purpose: |-
  Wildlife Attractor: Heliotropium angiospermum throws scorpioid cymes of tiny white flowers that still feed small native bees on salt-sprayed berms where most forbs look crisp.
  Border Plant: Prostrate soft gray stems read as living mulch along dune paths and rockery edges without the height of shrubs.
  Erosion Control: Matting roots lock beach sand and road-shoulder shell that would otherwise lift in the first onshore gust.
companions:
  - Beach Bean
  - Railroad Vine
  - Saltbush
cautions:
  - Heavy irrigation in poorly drained clay
pests:
  - Aphids
  - Whiteflies
growth_habit: Sprawling perennial forb
