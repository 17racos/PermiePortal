  description: |-
    Heliotropium angiospermum is a sprawling, salt-tolerant native of coastal and disturbed sandy spots, with coils of tiny white flowers that earned the scorpion-tail nickname. It is pretty, tough, and not a salad green — many heliotropes carry pyrrolizidine alkaloids, so treat it as habitat and eye-candy, not lunch, unless you have a vetted, species-specific ethnobotanical source.
    
     In subtropical and tropical Americas it shines in briny edges, dunes, and roadsides where less interesting weeds would dominate. Give it sun and drainage; it sulks in soggy shade.
    
    ☀️💧 Sun and Water:
    - Full sun.
    - Drought-tolerant once established; tolerates occasional salt spray and brackish influence.
    - Sandy or sandy-loam; avoid heavy wet clay.
    
    ✂️ Propagation:
    - Seed in warm weather on prepared sand.
    - Softwood cuttings root easily in humid conditions.
    
    🌾 Harvest / Best Use Timing:
    - Small flowers support native bees -- treat as support species, not salad bulk.
    - If managing in restoration, collect seed when capsules brown and before full shatter.
    - Avoid heavy grazing timing on restoration sites until stands establish.
  purpose: |-
    Scorpion weed is a native ground-layer for harsh edges:

    - Wildlife Attractor: Small flowers feed diverse pollinators in harsh sites.
    - Border Plant: Soft texture along paths, dunes, and food-forest margins.
    - Erosion Control: Mats stabilize loose sand.
  companions:
  - Beach Bean
  - Railroad Vine
  - Saltbush
  cautions:
  - Heavy irrigation in poorly drained clay
  pests:
  - Aphids
  - Whiteflies
  practitioner_notes: |-
    Notebook one weird year—weather anomalies repeat; memory lies, scribbles do not.
    Watch the plant’s own signals first—catalog zone numbers do not replace your site’s microclimate truth.
    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.
    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.
  growth_habit: Sprawling perennial forb
