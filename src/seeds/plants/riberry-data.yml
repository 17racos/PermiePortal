  description: 'Riberry (Syzygium luehmannii) is an Australian rainforest margin tree or large shrub, farmed for small, crimson,
    slightly pear-shaped fruit with clove-cinnamon aromatics that anchor jams, sauces, and boutique beverages. Plants typically
    reach 20–40 feet (6–12 m) in humid subtropical climates, with glossy leaves and flaky bark that peels like tired wallpaper
    in humid air. In warm-climate permaculture it is a hedge candidate, bird feeder, and conversation fruit for growers bored
    with bland berries.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright partial shade; young plants appreciate afternoon shade in hot districts. Rich, well-drained soils with
    steady moisture through the warm wet season and irrigation in dry spells support fruit sizing. Mulch to buffer roots;
    wind protection reduces leaf tatter on exposed ridges.


    ✂️ Propagation:

    Sow fresh seed; viability drops quickly—plant promptly. Graft or air-layer selections with superior fruit chemistry. Prune
    hedges after fruiting flushes to keep screens dense without interior dieback.


    🌾 Harvest / Best Use Timing:

    Pick when color deepens and aroma peaks—flavor improves off-tree within a day for some recipes. Process quickly into sauces
    or ferments; thin skin bruises if tossed. Peak loads track local warm wet periods rather than temperate calendars.'
  purpose: '- Edible: Tart-aromatic fruit diversifies sauces, jellies, and beverages where spice notes are desired.

    - Wildlife Attractor: Flowers feed bees; fruit feeds birds where sharing is acceptable.

    - Ornamental: Flaky bark and glossy foliage justify placement even before fruit sets.

    - Border Plant: Responds to hedging for screens along paths and poultry paddocks.'
