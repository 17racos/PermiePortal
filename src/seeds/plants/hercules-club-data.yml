  description: 'Hercules club (Zanthoxylum clava-herculis) is a spiny deciduous shrub to small tree of coastal plain thickets,
    dunes, and shell middens in the southeastern United States, with aromatic compound leaves, corky warty bark, and sharp
    thorns that announce personal space clearly. It is related to Sichuan pepper—fruits and bark carry pungent oils used cautiously
    in traditional practice. The plant fits living fences, wildlife thicket plantings, and storm-resilient edges where softer
    shrubs pretend wind does not exist.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; tolerates sandy, droughty soils and brackish influence better than many broadleaf shrubs. Moderate
    moisture increases growth rate. Avoid chronic wet clay without slope. Hardy through warm-temperate freezes; stems resprout
    after damage in humid climates.


    ✂️ Propagation:

    Seeds cleaned and sown warm after scarification may germinate over weeks.

    Root cuttings from young plants can clone thorny hedgerow stock.


    🌾 Harvest / Best Use Timing:

    If collecting aromatic bark or fruit for experienced herbal use, harvest small amounts from healthy plants in ethical
    sites—never strip wild populations. For landscape, prune after fruit drop to shape; wear gloves and eye protection.'
