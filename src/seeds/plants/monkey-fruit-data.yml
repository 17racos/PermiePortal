  description: 'Monkey fruit (Artocarpus lacucha) is a medium to large tropical tree in the jackfruit tribe, native to South
    and Southeast Asia and planted in humid lowland and foothill sites across the tropics where jack-type crops are valued.
    The fruit is rough-skinned, variable in size, and borne directly on trunk and branches like its better-known relatives;
    flavor profiles range from tangy to sweet depending on genotype and ripeness. Mature trees commonly reach 30–50 feet (9–15
    m) with a dense crown useful for understory shade. In diversified warm-climate systems it extends the Artocarpus toolkit
    beyond breadfruit and jackfruit for growers tracking niche markets and home use.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting once the canopy is established; young plants appreciate light shade during the hottest
    months. Deep, fertile, well-drained soils with steady moisture through the warm wet season and irrigation during pronounced
    dry spells prevent fruit drop and tip burn. Wind protection helps large leaves; salt spray tolerance is limited compared
    to coastal true mangrove specialists.


    ✂️ Propagation:

    Seedlings are the common path for landrace material—plant fresh seed and plan years to first fruit. Graft known cultivars
    onto seedling rootstocks when local grafters work Moraceae. Prune for clearance under fruiting trunks and remove weak
    interior wood to improve airflow in humid climates.


    🌾 Harvest / Best Use Timing:

    Harvest timing is judged by color shift, aroma, and gentle yield to pressure—variability between seedlings is real, so
    label mother trees you like. Process quickly after picking; like other Artocarpus, waste piles draw fruit flies if left
    in the open kitchen. Peak production tracks heat and rainfall cycles rather than temperate calendar months.'
  purpose: |-
    Edible: Cauliflorous Artocarpus lacucha syncarps swing from tangy to sweet by genotype and ripeness -- judge harvest by color shift, aroma, and slight yield; cook into curries, pickles, or jack-style preserves and process trim quickly or vinegar flies colonize the scrap pile.
    Shade Provider: Broad humid-climate crown throws dappled shade for cacao understory, vanilla poles, nursery tables, or human lunch breaks -- prune low interior wood for airflow where monsoon humidity stacks fungal pressure.
    Wildlife Attractor: Bat, bird, and insect frugivores cue on ripe Moraceae odors along trunks and limbs -- net fruiting scaffolds or accept shared harvests because trunk-borne fruit advertises calories.
    Mulcher: Very large deciduous leaves and spent fruit skins decay fast into sweet-smelling litter rings -- rake chop-and-drop into guild beds to spike fungal decomposition without importing bagged mulch.
