  description: "Monkey fruit (Artocarpus lacucha) is a medium to large tropical tree in the jackfruit tribe, native to South and Southeast Asia and planted in humid lowland and foothill sites across the tropics where jack-type crops are valued. The fruit is rough-skinned, variable in size, and borne directly on trunk and branches like its better-known relatives; flavor profiles range from tangy to sweet depending on genotype and ripeness. Mature trees commonly reach 30–50 feet (9–15 m) with a dense crown useful for understory shade. In diversified warm-climate systems it extends the Artocarpus toolkit beyond breadfruit and jackfruit for growers tracking niche markets and home use.\n\n☀️💧 Sun and Water Requirements:\nFull sun for reliable fruiting once the canopy is established; young plants appreciate light shade during the hottest months. Deep, fertile, well-drained soils with steady moisture through the warm wet season and irrigation during pronounced dry spells prevent fruit drop and tip burn. Wind protection helps large leaves; salt spray tolerance is limited compared to coastal true mangrove specialists.\n\n✂️ Propagation:\nSeedlings are the common path for landrace material—plant fresh seed and plan years to first fruit. Graft known cultivars onto seedling rootstocks when local grafters work Moraceae. Prune for clearance under fruiting trunks and remove weak interior wood to improve airflow in humid climates.\n\n🌾 Harvest / Best Use Timing:\nHarvest timing is judged by color shift, aroma, and gentle yield to pressure—variability between seedlings is real, so label mother trees you like. Process quickly after picking; like other Artocarpus, waste piles draw fruit flies if left in the open kitchen. Peak production tracks heat and rainfall cycles rather than temperate calendar months."
  purpose: |-
    - Edible: Fruit pulp and selected preparations enter regional cuisines where acidity and texture are balanced with local recipes.
    - Shade Provider: Broad crown shelters cacao, vanilla vines, or nursery tables during peak tropical sun.
    - Wildlife Attractor: Flowers and ripe fruit engage bats, birds, and insects in forest-garden contexts—plan sharing or netting.
    - Mulcher: Large leaves and spent fruit build rapid organic matter banks under the drip line when managed intentionally.
