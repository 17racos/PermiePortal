description: |-
  Water Hickory (Carya aquatica) is a useful perennial species in the Juglandaceae family, native or long-naturalized across parts of the Americas and Eurasia depending on lineage. Mature growth is typically a tree form suited to layered guilds, with reliable productivity when site conditions match its ecology. In a permaculture system it contributes food, habitat, and system resilience rather than single-crop output.

  Best performance comes with full sun to light partial shade, depending on heat intensity. Keep soil moisture steady during establishment, then water by seasonal demand. Well-drained fertile soil works for most upland entries, while wetland species require saturated margins. Most growth accelerates between 65°F (18°C) and 92°F (33°C), with stress rising near 104°F (40°C).

  Direct seeding is the simplest method where climate allows; sow at the start of the local favorable season and keep the seed zone evenly moist through germination. A second pathway is transplanting nursery starts or divisions once roots are active and temperatures are stable. Woody entries can also be established from dormant bare-root stock or grafted material for cultivar reliability.

  Harvest edible portions at peak maturity for intended use: leafy crops before heat stress, fruiting types at full color, root crops after starch set, and nuts or grains once fully mature and dry. For ecological functions, the strongest value appears after canopy closure, flowering, and annual residue cycling, when soil cover and habitat effects become consistent.
purpose: |-
  Wildlife Attractor: Carya aquatica nuts are small but still feed squirrels, wood ducks, and wild hogs in southern swamps -- leave mast for wetland fauna if human cracking is not worth the effort.
  Water Retention: Shallow-rooted floodplain specialist soaks up seasonally inundated sites -- canopy shade and leaf litter reduce evaporation from blackwater sloughs.
  Erosion Control: Buttressed trunks and cable roots armor riverbanks where only taxodium and bald cypress feel equally at home -- plant on inside bends where sediment deposits build soil instead of washing away.
