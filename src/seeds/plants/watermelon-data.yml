  description: |-
    Watermelon (Citrullus lanatus) is a warm-season vine grown for its refreshing, sweet fruit. It originates from Africa and is now cultivated across warm temperate and subtropical regions throughout the Americas. Plants sprawl with large leaves and tendrils, typically reaching 1–3 m (3–10 ft) of spread depending on spacing and training. In permaculture, watermelon matters because it provides heavy summer edible output while its leaf canopy reduces soil evaporation and helps keep the bed shaded and stable when the season is aggressively hot.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun is essential for flowering and sugar development; shade reduces yield.
    - Water consistently during vine growth and fruit sizing; drought reduces sweetness and can cause cracking.
    - Prefers fertile, well-drained soil with compost.
    - Avoid waterlogged soil; root and crown diseases increase.
    
    ✂️ Propagation:
    - Seeds (direct sow): sow after soil warms; germination often occurs in 3–10 days.
    - Start and transplant: start indoors when your season is short; transplant carefully to avoid root disturbance.
    - Relay sow: plant small batches for staggered harvest and reduced weather risk.
    
    🌾 Harvest / Best Use Timing:
    - Harvest when rind color is deep, the fruit sounds hollow, and the stem end dries slightly (varies by variety).
    - Pick in the cool part of the day for best texture.
    - Eat fresh; store short-term in the fridge or process into juice/freeze for later use.
  purpose: |-
    Edible: Watermelon (Citrullus lanatus) in the edible role draws on field reality: Watermelon (Citrullus lanatus) is a warm-season vine grown for its refreshing, sweet fruit. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Pollinator: Watermelon opens reliable nectar and pollen during the window your warm-season or early-spring crops are setting fruit -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
    Water Retention: Watermelon increases effective water security through mulch-form litter, dense roots, or slowed surface flow on your contour -- adds living mulch, root channels, or canopy drip patterns that even out soil moisture between rains

  companions:
  - Corn (Zea mays) — creates edge structure and shade timing that can reduce extreme hot-sun stress for nearby plants.
  - Marigold (Tagetes patula) — flowers attract beneficial insects and improve pest monitoring in the patch.
  - Dill (Anethum graveolens) — provides flowers for beneficial insects while you harvest watermelons.
  cautions:
  - Keep fruit off wet soil with straw/boards to reduce rot.
  practitioner_notes: |-
    Watermelon rewards consistency: swingy irrigation usually turns into bland fruit.
    Train vines or mulch early to stop fruit from contacting mud.
    Harvest by smell and stem feel, not just by calendar dates.
  pests:
  - Aphids
