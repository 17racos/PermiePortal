  description: 'Orange coneflower (Rudbeckia fulgida) is a durable perennial sunflower relative of eastern and central North
    American meadows, bearing golden orange rays around a dark central cone through the warm months. Plants typically reach
    2–3 feet (60–90 cm), spreading into dense clumps that laugh at mediocre soil if drainage exists. It is a workhorse in
    pollinator strips, rain-garden berms, and any sunny border that needs color without coddling.


    ☀️💧 Sun and Water Requirements:

    Full sun for strongest stems and richest color; light shade yields fewer flowers. Average to moist, well-drained soils
    are ideal; tolerates short drought once established but benefits from deep watering during heat waves. Avoid standing
    water over crowns in humid weather.


    ✂️ Propagation:

    Divide clumps in spring or fall; pieces establish quickly in warm soil. Sow seed outdoors in fall or cold-stratify 30
    days for spring trays. Cut back dead stems in late winter if you dislike the tufted look, or leave them for finch seed.


    🌾 Harvest / Best Use Timing:

    Cut long stems for bouquets when rays are fully open and cones firm. Leave late heads for birds and winter structure.
    Deadheading extends bloom but reduces self-sowing—choose your philosophy.'
  purpose: '- Pollinator: Composite heads feed bees, beetles, and butterflies with accessible nectar and pollen during peak
    warmth.

    - Wildlife Attractor: Finches and other seed eaters work mature cones; stems shelter overwintering insects if left standing.

    - Ornamental: Reliable orange-yellow color in native-inspired designs without annual replanting theater.

    - Border Plant: Clumping habit defines edges along paths, signs, and vegetable beds without shading crops.'
  companions:
