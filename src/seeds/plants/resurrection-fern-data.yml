  description: "Resurrection fern (Pleopeltis polypodioides) is an epiphytic and
    lithophytic fern of southeastern North America and parts of the Neotropics, famous
    for curling brown in drought and greening within hours after rain. It roots on
    oak limbs and shaded rock with a creeping rhizome net. In gardens it is a living
    lecture on desiccation tolerance mounted on bark slabs, living walls, and mossy
    trunks.\n\n☀️💧 Sun and Water Requirements:\n- Bright shade to dappled light;
    direct midday sun desiccates fronds even if the plant survives.\n- Drought tolerant
    in the sense of dormancy, not happiness—mist or rain rhythm keeps it lush.\n-
    Needs a porous substrate: tree bark, tree fern fiber, or rock with organic pockets;
    soggy potting mix rots rhizomes.\n\n✂️ Propagation:\n- Division of rhizome mats
    wired to fresh bark with moss interlayer.\n- Spores on sterile medium under high
    humidity—slow, for hobbyists.\n- Transplant patches after summer rains when
    rehydrated.\n\n🌾 Harvest / Best Use Timing:\n- Not a food plant; value is display
    and microhabitat for invertebrates.\n- Reattach fallen mats after storms before
    they bake on pavement.\n- Reduce summer irrigation frequency in humid greenhouses
    to avoid black rot between scales."
