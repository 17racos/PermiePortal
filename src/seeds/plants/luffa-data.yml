  description: 'Luffa is the shower sponge that was a vegetable first. Young fruit harvests like a zucchini; left to mature,
    the flesh dries into fibrous skeleton you can peel like a weird banana of scrubbing. Long-season vine — subtropical and
    tropical Americas needs early start, trellis, and cultivars that finish before cool nights stall fruit fill.


    ☀️💧 Sun and Water:

    - Full sun.

    - Steady water during growth; reduce as fruits mature for sponges to dry down cleanly.


    ✂️ Propagation:

    - Direct-sow after frost or start indoors 3-4 weeks ahead; roots resent rough transplanting — use deep pots.

    - Trellis for straight fruit; ground fruits curve and collect slug opinions.


    You can buy plastic loofahs, but where is the drama in that.'
  purpose: 'Two crops in one obnoxious vine:


    - Edible: Harvest small fruit like summer squash.

    - Fiber: Mature sponges for skin, scrubbers, and craft projects.

    - Ornamental: Yellow flowers are cheerful if the vine has not eaten your fence.'
