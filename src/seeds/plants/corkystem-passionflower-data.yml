  description: "Corkystem passionflower (Passiflora suberosa) is a wiry native vine
    in the passionfruit family, named for the corky, ridged stems on older growth.
    It climbs or scrambles through fence lines and rough ground from the southern
    United States through the Caribbean and into tropical mainland America, bearing
    small ornate flowers and marble-sized fruit. The plant is a workhorse for wildlife
    guilds: it is a larval host for fritillary butterflies, offers nectar to small
    pollinators, and fits food forests where you want a tough, low-input climber
    rather than a pampered orchard vine.\n\n☀️💧 Sun and Water Requirements:\nFull
    sun to partial shade; flowers best with good light. Drought-tolerant once established
    on well-drained soils; tolerates lean sand or rocky edges. Avoid chronic wet
    feet—root rots appear when drainage is poor. Hardy only to light frost; protect
    young plants below about 20°F (-7°C) until wood hardens.\n\n✂️ Propagation:\nSeeds:
    soak overnight, sow warm, and expect variable germination over several weeks.\n
    Cuttings: take semi-hardwood tips in warm weather, use well-drained mix, and
    keep humidity moderate until roots form.\n\n🌾 Harvest / Best Use Timing:\nRipe
    fruit can be nibbled fresh when fully colored and soft; flavor is tart and
    variable. For habitat value, leave plenty of foliage for caterpillars through
    the growing season. Prune after fruiting if you need to restrain spread on trellises."
  purpose: |-
    - Edible: Small fruits are edible when fully ripe; treat as a forage accent, not a primary crop.
    - Wildlife Attractor: Foliage feeds passionflower-specialist larvae; flowers draw small bees and butterflies.
    - Pollinator: Provides nectar in warm months when many insects are active along edges and thickets.
    - Ground Cover: Low, scrambling stems can blanket rough ground where turf struggles honestly.
    - Pest Management: Supports specialist predators indirectly by feeding butterfly larvae that complete local food webs.
  companions:
