  description: |-
    Skirret (Sium sisarum) is an old European root vegetable in the carrot family: clumps of narrow pinnate leaves and clusters of small white umbel flowers, with sweet, pale roots that split like unruly parsnips underground. Expect leafy tops about 2–4 feet and harvestable roots after a season of steady growth.

    subtropical and tropical Americas: This is a cool-season temperament in a hot-climate audience. In subtropical Florida it behaves like a winter–spring crop or microclimate experiment—summer heat and humidity invite bolting and rot unless you shade, mulch heavily, and keep soil draining fast. Puerto Rico’s lowland tropics are even less forgiving; treat it as a curiosity in elevated, cooler pockets or skip the heartbreak and grow true tropical roots instead.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light afternoon shade in hot districts; roots need loose, deep, organic-rich soil.
    - Consistent moisture without sogginess; mulch to buffer downpours in the wet season and reduce cracking in dry spells.

    ✂️ Propagation:
    - Divide mature crowns in late winter or early spring while dormant; replant pieces with buds and keep moist until established.
    - Sow seed in cool weather (Florida/Puerto Rico: aim for the coolest planting window) in a fine seedbed; thin to strong spacing so roots size up.

    🌾 Harvest / Best Use Timing:
    - Dig roots after tops begin to yellow or after a light frost where frost exists; in frost-free areas, harvest when foliage starts to decline in late cool season.
    - Scrub, peel if woody, then roast, mash, or fry—texture lands somewhere between parsnip and potato if the plant liked you.
  purpose: |-
    Edible: Harvest carbohydrate roots for the perennial kitchen garden without pretending they replace cassava in the tropics.
    Ground Cover: Dense leaf clumps smother weeds between rows when spaced as a block crop.
    Water Retention: Mulched skirret beds hold soil moisture around fibrous roots and reduce splash erosion in intense rains.
  companions:
  - Garlic — pungent row edges may confuse some root-munching insects; skirting keeps soil structure open for both crops if you avoid compaction.
  - Lettuce — quick shallow roots use the upper soil while skirret works below; harvest lettuce before skirret needs the full bed.
  - Comfrey — chop-and-drop between rows feeds the hungry apiaceous roots without synthetic shortcuts.
  cautions:
  - Wet heavy clay without amendment
  - Aggressive running grasses that tangle harvest
  pests:
