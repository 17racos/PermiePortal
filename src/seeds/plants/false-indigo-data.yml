  description: "False indigo (Baptisia australis) is a long-lived leguminous perennial of prairies, open woods, and roadsides\
    \ in eastern and central North America, forming shrub-like clumps of blue-green trifoliate leaves and tall spikes of indigo-blue\
    \ pea flowers followed by inflated pods. It fixes atmospheric nitrogen via root nodules, feeds long-tongued bees, and\
    \ laughs at drought once the taproot finds depth—after a sulky first year that tests beginner patience. Use it as a structural\
    \ herb in rain gardens, meadow edges, and fruit-tree understories where you want fertility without pretending clover is\
    \ the only legume.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n Full sun for strongest bloom and upright habit; lean\
    \ in part shade. Prefers well-drained soils; tolerates drought and lean ground after establishment. Wet feet in winter\
    \ rots crowns—raise beds or choose wet-tolerant species for swamp cosplay. Cold-hardy through northern temperate winters;\
    \ heat-tolerant with deep soil moisture access.\n\n ✂️ Propagation:\nScarify seeds and soak overnight; germination improves\
    \ with warm stratification cycles.\nDivide large crowns carefully in early spring—roots resent casual slicing.\n\n\U0001F33E\
    \ Harvest / Best Use Timing:\nCut spent flower stalks for arrangements before pods fully mature if you dislike self-sowing.\
    \ Leave some pods for rattling winter interest and local seed fall. Chop-and-drop leaves after frost as mulch around neighboring\
    \ plants."
  purpose: '- Nitrogen Fixer: Rhizobia in root nodules supply plant-available nitrogen to the guild over years.

    - Pollinator: Bumble bees and other long-tongued bees work the pea flowers heavily in bloom windows.

    - Ornamental: Blue inflorescences and glaucous foliage read as shrub architecture without wood.

    - Dynamic Accumulator: Deep taproot pulls minerals for redistribution via leaf drop when managed with chop-and-drop.

    - Border Plant: Bold clumps define bed edges in sunny perennial polycultures.'
  companions:
  - Switchgrass — vertical warm-season grass frames Baptisia mounds in meadow designs
  - Coneflower — overlapping bloom periods support pollinators across mid-summer
  - Wild Bergamot — mint-family flowers extend nectar service after indigo spikes fade
  cautions:
  - Transplanting mature taprooted clumps often fails—site young plants where they can age in place
