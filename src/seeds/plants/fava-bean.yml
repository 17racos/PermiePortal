  practitioner_notes: 'Morning picks hold turgor; afternoon heat steals shelf life even if the cooler feels honest.

    Chop-and-drop timing matters: green mulch feeds soil; woody brown mulch ties up surface nitrogen briefly.

    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.

    Overfertilized fast growth dilutes flavor and invites sap feeders—lean soil often tastes more like itself.'
