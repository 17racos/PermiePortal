  description: |-
    Fava bean (*Vicia faba*), also known as broad bean, is an annual legume that can grow up to 1.8 meters (6 feet) tall. It has stout, erect stems with large, leathery leaves composed of 2–7 leaflets. The plant produces clusters of white or purplish flowers, leading to large, green pods containing 3–8 seeds each. Fava beans are known for their hardiness and can tolerate cooler temperatures, making them suitable for early spring or late autumn planting.

    🌞💧 **Sun and Water Requirements:**
    Fava beans prefer full sun but can tolerate partial shade. They thrive in well-drained, fertile soil with consistent moisture. Regular watering is essential, especially during flowering and pod development.

    ✂️🫘 **Methods to Propagate:**
    Propagation is through direct seeding. Sow seeds 5 cm deep and 15–20 cm apart in rows spaced 60–90 cm apart. In mild climates, seeds can be sown in late autumn for an early spring harvest; in colder regions, sow in early spring.

    🧑‍🌾👩‍🌾 **When to Harvest:**
    Harvesting occurs when pods are fully formed and seeds have reached desired size. Young pods can be picked for fresh consumption, while mature pods are left to dry for storage beans.
  purpose: |-
    - **Edible:** Fava beans are consumed globally, either fresh, dried, or processed into various dishes, including soups, stews, and salads.
    - **Nitrogen Fixer:** Through symbiotic relationships with Rhizobia bacteria, fava beans enrich soil nitrogen levels, benefiting subsequent crops.
    - **Cover Crop:** Fava beans are used as a cover crop to improve soil structure, suppress weeds, and prevent erosion.
  companions:
    - Carrot
    - Lettuce
    - Pea
  cautions:
