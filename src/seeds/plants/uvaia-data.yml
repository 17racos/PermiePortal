description: |-
  Uvaia is a Brazilian myrtle relative with yellow, heavily perfumed fruit that tastes like guava went to jazz school — aromatic, acidic-sweet, full of attitude. Slow-growing tree to large shrub; protect from hard freezes. subtropical and tropical Americas coastal 10a/b microclimates are the realistic gamble; inland 9a is science fair with blankets.

  - Full sun for flowering and fruit; young plants appreciate partial shade.
  - Regular water when establishing; tolerates brief dry spells once rooted but sulks in drought.

  - Seeds lose viability fast — sow fresh.
  - Grafting on related rootstocks used where industry exists; home growers mostly run seedlings.

   If you can keep it alive, your fruit nerd card levels up.

  - Uvaia: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both.
  - Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer.
  - Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Eugenia pyriformis yellow fruit smells like guava dialed to eleven -- acidic-sweet pulp makes jam and juice where rain splitting is controlled by picking ahead of monsoon weeks.
  Wildlife Attractor: Creamy myrtle flowers feed small bees; ripe fruit draws tanagers and fruit bats in native range -- net clusters if you want human share in bird-heavy yards.
  Ornamental: Glossy evergreen scaffold and coppery new growth earn front-yard space -- slow growth means patience before heavy crops in marginal 9b pockets.
