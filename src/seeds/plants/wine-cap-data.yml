  practitioner_notes: |-
    Fresh hardwood chips beat bark nuggets and wood pellets — size uniformity,
    moisture retention, and colonization speed all improve with proper chip material;
    fresh-cut tree service chips are often free and ideal.
    Top-dress beds every 6-12 months with new chips to sustain the patch; once
    the existing substrate is fully digested, fruiting drops off and mycelium moves on.
    Young buttons are best eating — as caps flatten and open, flavor sharpens and
    shelf life shortens rapidly.
    Moving colonized substrate is the fastest way to expand; a shovel of white,
    rhizomorphic mycelium spread into a new bed gets a head start on contaminants.
    Summer heat does not kill the patch — it just pauses fruiting; keep moisture
    up and the mycelium will be ready when temperatures drop in fall.
