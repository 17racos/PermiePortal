  description: "Madrone (Arbutus menziesii) is an iconic evergreen tree of Pacific coastal
    woodlands from British Columbia into California and Mexico, famous for peeling
    cinnamon bark, leathery leaves, and red berries that feed birds and bears. It is
    a mycorrhizal prima donna: transplanting large specimens often fails, and irrigation
    overkill kills roots that expect summer drought after marine fog lifts. For West
    Coast permaculture it is canopy jewelry on rocky slopes—shade, wildlife mast, and
    a reminder that some natives reject pampering.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun to partial shade; established trees tolerate dry Mediterranean summer
    patterns with cool root runs. Requires excellent drainage; hates lawn sprinklers
    hitting trunks daily. Neutral to slightly acidic soils suit it; avoid heavy compaction
    and grade changes over root zones. Heat waves inland demand established roots;
    young trees need attentive but infrequent deep watering.\n\n✂️ Propagation:\nSow
    fresh seed; germination can be slow and irregular.\nNursery liners are safer than
    mature transplant fantasies—buy small and site once.\n\n🌾 Harvest / Best Use Timing:\n
    Berries are mealy human snacks but valuable wildlife food—leave them. Prune only
    for clearance; bark peels naturally and should not be carved for social media."
  purpose: |-
    - Wildlife Attractor: Berries feed birds and mammals; flowers support diverse native pollinators.
    - Erosion Control: Roots anchor rocky, thin-soil slopes typical of coastal and montane sites.
    - Ornamental: Exfoliating bark and evergreen crown are landscape icons where climate allows.
    - Shade Provider: Open evergreen canopy moderates understory for shrubs and bulbs adapted to dry shade.
  companions:
