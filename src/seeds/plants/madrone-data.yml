description: |-
  Madrone (Arbutus menziesii) is an iconic evergreen tree of Pacific coastal woodlands from British Columbia into California and Mexico, famous for peeling cinnamon bark, leathery leaves, and red berries that feed birds and bears. It is a mycorrhizal prima donna: transplanting large specimens often fails, and irrigation overkill kills roots that expect summer drought after marine fog lifts. For West Coast permaculture it is canopy jewelry on rocky slopes—shade, wildlife mast, and a reminder that some natives reject pampering.

  ☀️💧 Sun and Water Requirements:
   Full sun to partial shade; established trees tolerate dry Mediterranean summer patterns with cool root runs. Requires excellent drainage; hates lawn sprinklers hitting trunks daily. Neutral to slightly acidic soils suit it; avoid heavy compaction and grade changes over root zones. Heat waves inland demand established roots; young trees need attentive but infrequent deep watering.

  ✂️ Propagation:
  Sow fresh seed; germination can be slow and irregular.
  Nursery liners are safer than mature transplant fantasies—buy small and site once.

  🌾 Harvest / Best Use Timing:
   Berries are mealy human snacks but valuable wildlife food—leave them. Prune only for clearance; bark peels naturally and should not be carved for social media.
purpose: |-
  Wildlife Attractor: Arbutus menziesii red-orange berries feed varied thrushes and small mammals while spring urn flowers supply nectar to native bees -- leave fruit on the tree if wildlife pantry beats human curiosity.
  Erosion Control: Shallow, wide-spreading roots grip thin soil over bedrock on coastal bluffs -- avoid grade changes and irrigation donuts that suffocate roots accustomed to summer drought.
  Ornamental: Cinnamon peeling bark on muscular trunks reads like West Coast jewelry -- site once from small liners because mature specimens hate transplanting and irrigation overload.
  Shade Provider: Open, round crown casts light shade for salal, bulbs, and drought bulbs -- match companions to dry summer shade, not lawn sprinkler culture against the trunk.
companions:
- Douglas Fir — conifer overstory common in Pacific mosaic forests with madrone gaps
- Oregon White Oak — deciduous oak contrast with evergreen Arbutus in valley savannas
- Salal — ericaceous ground cover shares mycorrhizal aesthetics under partial shade
cautions:
- Sudden Oak Death (Phytophthora ramorum) and related phytophthoras threaten Arbutus
  in parts of its range—sanitize tools and source clean nursery stock
