  description: "Mountain apple (Syzygium malaccense) is a tropical tree from Southeast Asia and Melanesia, widely planted in humid lowlands and island food forests for crimson new growth, fluffy flowers, and large bell-shaped fruit with crisp, mildly sweet white flesh. Trees often reach 40–60 feet (12–18 m) in protected sites, forming a rounded crown that shades understory crops. It is a classic backyard fruit along equatorial coasts and a reliable heat-lover that sulks when nights dip near freezing.\n\n☀️💧 Sun and Water Requirements:\nFull sun for dense flowering and fruiting; young trees accept light shade during establishment. Rich, well-drained soils with steady moisture through the warm wet season and irrigation in pronounced dry spells prevent fruit abortion. Wind-sheltered sites protect large leaves from tattering; salt spray is not its favorite neighbor.\n\n✂️ Propagation:\nAir-layer or graft selected cultivars; seeds yield variable fruit quality but are fine for rootstocks and experiments. Prune to a single leader initially, then open the crown for light on fruiting wood. Remove water sprouts after heavy rains to keep structure legible.\n\n🌾 Harvest / Best Use Timing:\nPick when color deepens and fruit yields slightly to gentle pressure—lines vary from white to deep red skins. Eat fresh quickly; thin skin bruises if handled like baseballs. Expect peak loads synchronized with local wet-season warmth rather than calendar holidays."
  purpose: |-
    - Edible: Fruit is eaten out of hand or sliced into salads where mild crunch is prized over intense sugar.
    - Shade Provider: Broad crown shelters cacao, vanilla, or nursery tables during peak tropical insolation.
    - Wildlife Attractor: Masses of stamens feed bees and flies; fruit feeds birds where sharing is acceptable.
    - Ornamental: Flushes of red new leaves justify placement near sight lines even before fruit appears.
