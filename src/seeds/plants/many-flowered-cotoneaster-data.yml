  description: 'Many flowered cotoneaster (Cotoneaster multiflorus) is a deciduous to semi-evergreen East Asian shrub grown
    for arching stems, clusters of small white flowers in late spring, and red pome fruit that can persist into winter. Plants
    often reach 6–10 feet (1.8–3 m) with spreading habit. It suits temperate hedges, slopes, and bird-friendly borders where
    the species is not listed as invasive and airflow reduces foliar disease pressure.


    ☀️💧 Sun and Water Requirements:

    Full sun for best flowering and fruiting; partial shade reduces berry display. Average well-drained soils; tolerates urban
    conditions once established. Avoid waterlogged clay that rots roots while tags still claim ‘easy’.


    ✂️ Propagation:

    Semi-hardwood cuttings root under mist in summer. Sow seed after stratification for species reproduction—cultivars should
    be cloned. Rejuvenate old shrubs with staged pruning over several seasons.


    🌾 Harvest / Best Use Timing:

    Berries feed birds through winter—delay heavy pruning until after wildlife use if possible. Flowers are modest en masse;
    fruit is the winter paycheck. Thin congested centers to reduce fire blight and mildew pressure.'
