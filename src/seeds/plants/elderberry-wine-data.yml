  description: "Elderberry Wine is a dark-leafed cultivar group of European black elder (Sambucus nigra) selected for deeply cut purple foliage and pink flower clusters, valued in temperate ornamental borders before fruit ripens to glossy black berries. Shrubs often reach 6–10 feet (1.8–3 m) unless renewed by hard pruning. While primarily landscape theater, ripe cooked berries follow the same food-safety rules as other elders—raw berries upset stomachs and bad processing writes memorable evenings.\n\n☀️💧 Sun and Water Requirements:\nFull sun for richest foliage color; too much shade shifts leaves greener and reduces flower impact. Moist, fertile, well-drained soils mirror productive elder culture; drought turns leaf edges crisp during heat waves. Mulch root zones to buffer temperature and reduce weed string trimmer wounds at the base.\n\n✂️ Propagation:\nHardwood cuttings taken in dormancy root readily in cool humid media. Softwood cuttings in late spring can clone a known plant if humidity is managed. Seed from cultivars does not come true—vegetative propagation preserves leaf form.\n\n🌾 Harvest / Best Use Timing:\nPick flower umbels at full bloom for cordials where local law and sensitivity allow—leave plenty for pollinators. Harvest berries only fully ripe and process with established recipes; uncooked consumption is a bad idea regardless of influencer confidence. Rejuvenate older wood every few years to keep foliage vibrant near eye level."
  purpose: |-
    - Edible: Flowers and ripe processed berries extend elder products into ornamental beds with known cultivar traits.
    - Ornamental: Dark dissected leaves provide long-season color contrast against green neighbors.
    - Wildlife Attractor: Flowers feed insects; berries feed birds if you share the crop.
    - Border Plant: Upright habit defines edges and backs mixed shrub borders in temperate climates.
  companions:
