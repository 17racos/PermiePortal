  practitioner_notes: |-
    Cultivar flowers can be darker than wild types—taste before you cater a wedding.
    Heart-leaf lookalikes exist—confirm Cercis before you teach foraging classes.
    Short tree does not mean short roots—give it space from pavement and pipes.
    Spring frosts after bloom are mood events, not management failures—record dates, not drama.
