  description: "Yarrow is a hardy perennial herb that grows up to 0.6–1 m (2–3 feet) tall. It features feathery, aromatic,\
    \ finely divided leaves and small white, yellow, pink, or red flowers arranged in flat-topped clusters. Yarrow is drought-tolerant\
    \ and thrives in poor, dry soils, making it an excellent low-maintenance plant for permaculture designs.\n\nThe plant\
    \ spreads through underground rhizomes and self-seeding, forming dense patches over time. It is well known for its role\
    \ in attracting beneficial insects and acting as a living mulch.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n\
    - Prefers **full sun** (6+ hours of sunlight).\n- Requires **well-drained soil**, tolerates sandy and rocky conditions.\n\
    - Drought-resistant but benefits from occasional watering in dry climates.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Seeds**:\
    \ Sow directly in the garden in early spring or fall.\n- **Division**: Separate clumps in spring or fall.\n- **Cuttings**:\
    \ Root softwood cuttings in water or soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Flowers and\
    \ leaves can be harvested **anytime during the growing season**, but are most potent when flowers first bloom.\n- Dry\
    \ leaves and flowers for long-term storage."
  purpose: 'Yarrow is an excellent addition to permaculture gardens due to its many beneficial functions:


    - Medicinal: Traditionally used for wound healing, digestive aid, and reducing fevers.

    - Pollinator: Attracts bees, butterflies, and other beneficial insects.

    - Wildlife Attractor: Provides habitat and food for pollinators and predatory insects.

    - Mulcher: Its dense growth suppresses weeds and adds organic matter to the soil.

    - Dynamic Accumulator: Draws up nutrients from deep soil layers, making them available to other plants.

    - Erosion Control: Helps stabilize slopes and prevent soil erosion.

    - Border Plant: Used as an edging plant to define garden spaces.

    - Water Purifier: Used for soil filtration and wetland restoration.'
