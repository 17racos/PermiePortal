description: |-
  Pumpkin (Cucurbita pepo) is a warm-season creeping vine grown for its edible fruit and thick, storage-friendly flesh. It originates from North America and has been widely cultivated across the Americas for centuries, producing large leaves and sprawling, tendril-guided growth. In permaculture, pumpkins matter because their rapid cover shades soil, reduces evaporation, and creates a dense living mulch that helps suppress weeds while you harvest food that stores well through the off-season. Mature plants commonly sprawl several meters, with fruits ranging widely by variety.

  Full sun; vines flower and set fruit much better with long bright days. Water regularly while plants establish and fruit sizes; drought can reduce yield. Prefers fertile, well-drained soil amended with compost. Avoid waterlogged patches; soggy ground invites rot in vines and fruits.

  Seeds (direct sow): sow after soil warms and frost danger passes; germination often takes 5–10 days. Start and transplant: start indoors in warm conditions if your season is short; transplant carefully with intact root systems. Relay sow: plant additional seeds in small batches to spread harvest and reduce weather risk.

  Harvest when fruit rind hardens and stem dries/cures; pick carefully to avoid skin damage. Cure harvested pumpkins in warm, dry airflow if needed so they store better. Use flesh for roasting, soups, pies, and freezing; keep seeds for roasting and oil extraction.
purpose: |-
  Edible: Cucurbita pepo field pumpkins set starchy walls for pie, soup, and long-curing storage types when stems cork and skin resists thumbnail -- maxima moschata crosses confuse seed savers; label vines if you keep pure lines.
  Ground Cover: Hairy vines with plate-sized leaves carpet row middles under corn scaffolds, shading pigweed and slowing soil evaporation during fruit swell -- lift fruit onto boards or straw to keep belly rot off wet nights.
  Water Retention: Dense canopy traps humidity at soil line, cutting irrigation pulses needed through fruit set -- still risks powdery mildew if airflow stalls, so prune vine tips where they pile thicker than your ethics allow.
companions:
  - Corn (Zea mays) — corn stalks provide vertical structure; pumpkin spreads below for living mulch.
  - Nasturtium (Tropaeolum majus) — trailing flowers attract beneficial insects and occupy space without harsh competition.
  - Marigold (Tagetes patula) — helps draw beneficial insects and gives you a visible monitor bed for pest activity.
cautions:
  - Keep fruit off wet soil with straw or boards; fruit rot steals harvest fast.
  - Powdery mildew risk rises with poor airflow—avoid crowding vines.
pests:
  - Aphids
  - Spider Mites
  - Root Rot
  - Caterpillars
