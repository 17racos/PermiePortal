  description: "Maypop is the native Southeast passionflower that dies back to the
    roots like a responsible perennial, then erupts into intricate lavender flowers
    and greenish edible fruit that pop when you step on them—hence the name, and hence
    childhood memories.\n\nRight at home—edge plant, fence
    cover, butterfly magnet (Gulf fritillary will use it hard). Expect defoliation some
    years; the vine usually laughs it off.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to light shade.\nAverage moisture; tolerates drought once established but fruits better with steady
    water.\n\n✂️ Propagation:\n\nSeeds, hardwood cuttings, or digging dormant root suckers
    with permission on your own land.\n\n🌾 Harvest / Best Use Timing:\n\nPick maypops when they yield slightly and aroma peaks; leave some for caterpillar cycles if you are sharing the vine."
