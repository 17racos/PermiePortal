  description: 'Showy partridge pea (Chamaecrista fasciculata) is a warm-season annual legume native to open sandy soils,
    prairies, and roadsides across much of eastern and central North America. Bright yellow flowers with red nectar guides
    flag down pollinators; feathery leaves fold at night like it still has secrets. It is a standard insectary annual for
    vegetable edges, meadow mixes, and disturbed-site recovery where fast nitrogen and color beat waiting on slow perennials.


    ☀️💧 Sun and Water Requirements:

    - Full sun; shade reduces bloom and root nodulation.

    - Drought tolerant once established in warm months; irrigate germinating seeds until first true leaves.

    - Sandy or well-drained soils; intolerant of prolonged waterlogging.


    ✂️ Propagation:

    - Direct-sow after soil warms; scarify hard seed lots.

    - Thin crowded rows to reduce powdery mildew pockets.

    - Allow end-of-season pods to shatter for volunteer stands where desired.


    🌾 Harvest / Best Use Timing:

    - For green manure, mow or crimp before seeds mature if you do not want volunteers.

    - Collect dry pods for intentional resowing in spring.

    - Leave patches blooming for sulphur butterflies and specialist bees that read the nectar guides.'
  purpose: '- Nitrogen Fixer: Root nodules enrich soil during a single fast warm-season cycle.

    - Pollinator: Showy flowers with nectar guides attract bees and other pollinators.

    - Wildlife Attractor: Foliage hosts sulphur caterpillars; seeds feed birds if left standing.

    - Ground Cover: Branching stems shade soil between slower perennials in young meadows.'
  companions:
