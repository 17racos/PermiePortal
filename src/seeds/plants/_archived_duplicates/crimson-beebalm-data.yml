  description: "Crimson beebalm (Monarda didyma) is an upright mint-family perennial of moist woods and stream edges in eastern North America, bearing shaggy scarlet heads that read like fireworks for hummingbirds. Plants typically reach 2–4 feet (0.6–1.2 m) in bloom, spreading by shallow rhizomes into generous clumps. Leaves are aromatic when crushed; the species is a backbone plant for rain gardens, meadow margins, and pollinator strips in temperate to warm-summer climates.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; afternoon shade reduces stress where summers are long and hot. Likes rich, moisture-retentive but not stagnant soil; mulch helps even moisture through dry spells. Airflow matters—dense humid pockets invite foliar mildew that makes the plant look punished.\n\n✂️ Propagation:\nDivide crowded clumps in cool wet-season weather or early growth flushes; replant divisions promptly so roots do not desiccate. Sow seed outdoors after chill stratification or start indoors before last frost for first-year blooms in short-season sites. Soft tip cuttings root in humid shade if you want clones of a mildew-resistant selection.\n\n🌾 Harvest / Best Use Timing:\nPick leaves and flowers at peak bloom for tea or drying; flavor is brightest before heavy senescence. For wildlife-first plantings, leave spent heads until finches finish if your aesthetic allows. Cut back hard after flowering to refresh basal growth where mildew appeared."
  purpose: |-
