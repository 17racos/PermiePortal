  description: 'Lilly pilly (Syzygium paniculatum) is an Australian rainforest margin tree or large shrub, widely planted
    in humid subtropical landscapes for glossy evergreen leaves, cream fluffy flowers, and magenta to crimson pear-shaped
    fruit. Heights of 15–40 feet (4.5–12 m) occur unless hedged. It is a Myrtaceae hedge and fruiting screen where psyllids
    are managed and frost is rare.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright part shade; dense shade reduces flowering and fruit. Rich, well-drained soils with steady moisture
    in the warm season; mulch buffers surface roots. Wind protection reduces leaf tatter on exposed lots.


    ✂️ Propagation:

    Sow fresh seed after cleaning; cuttings root under humidity for uniform hedges. Shear formally after major flowering if
    hedge shape matters more than fruit. Open up interior wood periodically for airflow.


    🌾 Harvest / Best Use Timing:

    Pick fruit when deep colored and slightly yielding for jams and fresh eating—flavor varies by selection. Monitor new flush
    for psyllid curl—early water or biological control beats panic. Leave some fruit for birds if diplomacy matters.'
