  description: 'Prairie potato (Pediomelum esculentum), also called breadroot, is a perennial legume of the Great Plains of
    North America bearing a starchy, edible tuber historically gathered by Indigenous peoples. Above ground it shows hairy,
    clover-like trifoliate leaves on low stems and spikes of purple pea-flowers followed by small pods; mature plants are
    usually under 18 inches tall with the harvestable tuber several inches below the crown.


    ☀️💧 Sun and Water Requirements:

    - Full sun in deep, well-drained loam or sandy soil; resents standing water.

    - Drought-adapted once established; in subtropical and tropical Americas it is primarily a curiosity or trial crop in
    cool, fast-draining raised beds because heat and summer humidity stress it—treat as experimental outside its native continental
    climate.


    ✂️ Methods to Propagate:

    - Seeds: scarify and soak legume seed, direct-sow after last frost in its hardiness range; first-year growth builds the
    tuber.

    - Division: carefully lift and split crowns with visible buds in very early spring before strong growth, replanting immediately—risky
    because tubers are fragile.


    🌾 When to Harvest:

    - Dig tubers after tops die back in fall in temperate zones; in warm trials, harvest when vines yellow and rest the bed.
    Replant a portion of tubers to maintain the stand.'
  purpose: 'Prairie potato is a heritage perennial staple for continental climates and a teaching plant elsewhere.


    - Edible: Tubers are starchy and nutty—cooked like a root vegetable or dried as flour.

    - Nitrogen Fixer: Legume roots improve nitrogen cycling in prairie-style polycultures.

    - Ground Cover: Low foliage covers soil between taller companions in dry gardens.

    - Wildlife Attractor: Flowers feed native bees and other pollinators in its native range.'
