  description: "This is the crunchy corm crop sold canned for stir-fries—not the
    spiny **Trapa** invader sometimes called water chestnut up north. **Eleocharis
    dulcis** is a sedge with upright tubular leaves and underwater rhizomes that
    form crisp, sweet corms when grown in warm, long seasons.\n\nDoable
    in sun-heated tubs or shallow paddies if you can give 7+ frost-free months; harvest
    before hard chill kills tops. Not a casual pond plant—manage fertility and avoid
    escapes into sensitive wetlands.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun; shallow flooded soil
    or mucky containers 3–8 inches deep; high organic matter; keep consistently wet
    during growth, drain to force corm finish where growers use that trick.\n\n✂️ Propagation:\n\nCormlets at rhizome tips; divide clumps at repot.\nStart with disease-free corms
    from reputable sources.\n\n🌾 Harvest / Best Use Timing:\n\nDig corms after a long frost-free run before chill kills tops—this is Eleocharis, not the spiny Trapa invader."
  purpose: |-
