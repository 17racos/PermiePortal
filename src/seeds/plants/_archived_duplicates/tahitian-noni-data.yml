  description: "Tahitian noni is a market name for selected Morinda citrifolia lines associated with Pacific cultivation and export juice chains, sharing the species’ evergreen habit, large leaves, and pungent soft fruit. Plants reach 10–20 feet (3–6 m) in cultivation, fruiting repeatedly in humid tropical climates. This entry duplicates taxonomy with other noni records—use practitioner notes to track cultivar claims versus seedling lottery.\n\n☀️💧 Sun and Water Requirements:\nFull sun for heaviest fruit set; partial shade for juvenile establishment. Well-drained, moderately fertile soils with deep watering through dry seasons prevent fruit drop. Mulch to buffer surface roots from heat.\n\n✂️ Propagation:\nClone known lines by rooted cuttings or air-layering; seedlings vary in fruit chemistry. Prune for clearance under fruiting wood.\n\n🌾 Harvest / Best Use Timing:\nHarvest soft fruit as it ripens—process quickly for juice or ferments per vetted methods. Peak production tracks heat and rainfall cycles."
