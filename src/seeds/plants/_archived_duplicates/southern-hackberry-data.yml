  description: "Southern hackberry (Celtis laevigata), often called sugarberry, is
    a medium to large deciduous tree of floodplains, river terraces, and bottomlands
    across the southeastern United States into parts of the south-central region.
    Small sweet drupes feed birds for months; warty bark hosts lichens like a vertical
    reef. It is a workhorse canopy for riparian buffers, livestock shade, and native
    hedgerows where elms once stood.\n\n☀️💧 Sun and Water Requirements:\n- Full
    sun for strong form and heavy fruiting.\n- Moisture-loving; tolerates seasonal
    flooding yet needs drainage between events.\n- Deep, fertile alluvial soils ideal;
    tolerates clay if not permanently stagnant at the root collar.\n\n✂️ Propagation:\n-
    Seeds: cold stratify; sow in deep pots to accommodate taproot.\n- Transplant
    young seedlings; large specimens need professional equipment.\n- Prune for
    clearance and storm structure; avoid topping.\n\n🌾 Harvest / Best Use Timing:\n-
    Fruit is small but edible when fully ripe; mostly left for wildlife.\n- Collect
    seeds after natural drop if growing nursery stock.\n- Mulch under young trees
    to exclude mower strikes."
  purpose: |-
    - Wildlife Attractor: Persistent fruit feeds birds and mammals; foliage hosts hackberry butterflies and more.
    - Shade Provider: Broad crown cools livestock, people, and understory guilds.
    - Windbreaker: Row plantings trim wind along fields and waterways.
    - Edible: Ripe drupes are nibbled fresh or used experimentally where sweetness justifies picking labor.
