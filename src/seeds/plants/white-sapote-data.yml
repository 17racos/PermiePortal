description: |-
  Casimiroa edulis is the creamy-textured fruit tree that tricks people into thinking custard grew on branches. Evergreen-ish in warm climates, with hand-shaped compound leaves and fruit quality that swings hard by seedling genetics — named grafted varieties are the non-lottery path. Possible in protected 9b/10a with frost planning; younger wood is the drama queen.

  ☀️💧 Sun and Water Requirements:

  Full sun for reliable fruiting.
  Deep, well-drained soil; consistent water reduces fruit drop tantrums.
  Mulch to stabilize root zone temps.

  ✂️ Propagation:

  Seeds: easy but variable fruit — fine for rootstock experiments.
  Grafting: align dreams with reality.

  🌾 Harvest / Best Use Timing:

  When skin lightens/yellows (type-dependent) and fruit softens — ripens off-tree like a polite avocado cousin.
purpose: |-
  Edible: Casimiroa edulis custard flesh varies from banana-vanilla to soap opera depending on seedling -- grafted cultivars end the lottery; skin bruises if you look at it wrong.
  Shade Provider: Hand-shaped evergreen leaves cast soft shade over coffee and vanilla understory -- young wood is frost-tender; protect flushes below 28°F (-2°C).
  Wildlife Attractor: Raccoons and squirrels score fruit before you do -- groundfalls recruit fruit flies overnight; harvest on color shift, not procrastination.
companions:
- Guava
- Banana
- Papaya
cautions:
- Open low spots that radiate frost onto new flushes
- Chronic waterlogging — roots rot, dreams follow
