description: |-
  Araza is a loud tropical myrtle from the Amazon headwaters—soft yellow fruit, extreme acidity, and aromatics that want sugar the way lemonade wants a business model. Often grown as a shrubby tree for juice and nectars.

  Collector plant for warmest pockets or greenhouse. Occasional light frost may be survived briefly when mature—do not bet the farm on 9a without protection.

  ☀️💧 Sun and Water Requirements:

  Full sun for productivity. Loves steady moisture and organic mulch; intolerant of drought once fruiting hard.

  ✂️ Propagation:

  Seeds (variable); grafting onto related rootstocks where expertise exists.

  🌾 Harvest / Best Use Timing:

  Pick fruit when soft yellow and aromatic for juice, nectars, or heavily sweetened desserts; plan processing around extreme acidity.
purpose: |-
  Edible: Eugenia stipitata soft yellow fruit runs so acidic that kitchens treat it like citrus concentrate for nectars, sorbets, and blended juices -- birds strip ripe fruit fast, so pick when aroma peaks and skin yields.
  Wildlife Attractor: Amazonian myrtle flowers and soft fruit pull specialist fruit flies and frugivorous birds in humid heat -- net outer branches if humans need volume beyond what wildlife taxes.
  Ornamental: Evergreen shrubby crowns with glossy leaves give humid subtropical structure between taller canopy trees -- tip-prune young plants for bush form if ladder harvest is not your hobby.
