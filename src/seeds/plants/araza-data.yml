  description: 'Araza is a loud tropical myrtle from the Amazon headwaters—soft yellow fruit, extreme acidity, and aromatics
    that want sugar the way lemonade wants a business model. Often grown as a shrubby tree for juice and nectars.


    Collector plant for warmest pockets or greenhouse. Occasional light frost may be survived briefly when mature—do not bet
    the farm on 9a without protection.


    ☀️💧 Sun and Water Requirements:


    Full sun for productivity. Loves steady moisture and organic mulch; intolerant of drought once fruiting hard.


    ✂️ Propagation:


    Seeds (variable); grafting onto related rootstocks where expertise exists.


    🌾 Harvest / Best Use Timing:


    Pick fruit when soft yellow and aromatic for juice, nectars, or heavily sweetened desserts; plan processing around extreme
    acidity.'
