  description: 'Blue palo verde (Parkinsonia florida) is a Sonoran icon: a small tree with chlorophyll-rich bark that photosynthesizes
    even when leaves are absent, plus a crown of tiny leaflets that flicker like green lace in wind. Spring brings intense
    yellow flowers that turn desert roadsides into a pollen rave; mature height is often 15–25 feet with an open, shelterbelt-friendly
    silhouette.


    subtropical and tropical Americas: Thrives in Florida’s dry sandy ridges and urban heat islands where drainage is honest;
    in Puerto Rico use only on well-drained, lean sites—humid clay is how roots file grievances.


    ☀️💧 Sun and Water Requirements:

    - Full, blazing sun; shade makes it lanky and emotionally needy.

    - Extremely drought-tolerant once established; deep occasional soak beats daily spritzing that trains shallow roots.


    ✂️ Propagation:

    - Scarify seeds and soak overnight; direct-sow warm soil or start in deep pots to respect the taproot’s ambitions.

    - Transplant young trees carefully—taproot sulk is legendary.


    🌾 Harvest / Best Use Timing:

    - Best use is ecosystem service: light shade, nectar pulse, and nitrogen facilitation—this is not a timber lottery ticket.

    - Prune for clearance under branches in late dry season when pathogens are less chatty.'
  purpose: '- Nitrogen Fixer: Rhizobia on roots feed the soil economy so companions need fewer imported fertility sermons.

    - Shade Provider: Open canopy shades understory cactus, agaves, and people without dark-forest gloom.

    - Wildlife Attractor: Flowers overload native bees; seeds feed birds willing to work for calories.

    - Ornamental: Green bark and gold bloom make xeriscape look intentional, not abandoned.'
  companions:
  - Desert Ironwood — long-lived nurse/overstory texture; ironwood’s density contrasts palo verde’s airy crown for layered
    desert guilds.
  - Agave — succulent understory that respects dry shade and reflects glare; shallow roots avoid taproot turf wars.
  - Pigeon Pea — fast legume edge for chop-and-drop on the sunny side of the drip line if you keep it offset from the trunk.
