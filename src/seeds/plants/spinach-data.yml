description: |-
  Spinach (Spinacia oleracea) is a cool-season leafy green grown for its tender leaves eaten fresh or cooked. It originated in Persia and quickly became a staple across temperate vegetable gardens, where it performs best in cool weather. Plants typically grow about 15–30 cm (6–12 in) tall in rosettes, and in permaculture spinach matters because it turns short, cool windows into repeatable nutrition while the leaf canopy shades soil and helps keep beds usable between longer crop cycles. Regular harvests also encourage fresh leaf production when temperatures are still forgiving.

  ☀️💧 Sun and Water Requirements:
  - Full sun in cool weather; partial shade helps slow bolting during warmer days.
  - Keep soil consistently moist for tender leaves; drying makes leaves tough.
  - Prefers fertile, well-drained soil amended with compost.
  - Avoid waterlogged beds; rot and disease appear when roots stay wet.

  ✂️ Propagation:
  - Seeds (direct sow): sow in cool weather; germination often occurs in 5–10 days.
  - Succession sow: repeat every 1–2 weeks for continuous harvest.
  - Thin early so plants can form usable leaves rather than crowded stress.

  🌾 Harvest / Best Use Timing:
  - Harvest young leaves regularly; cut-and-come-again keeps production going.
  - Harvest in the cool part of the day for best texture.
  - When plants bolt, let some flower if you want pollinator support and seed, then switch beds.
purpose: |-
  Edible: Spinacia oleracea savoy leaves stack vitamin A and nitrate punch for spring salads -- harvest outer leaves before stalks elongate into bitter seed pillars.
  Medicinal: Iron-folate nutrition underpins clinic advice for anemia-prone diets -- coordinate portions with blood-thinning meds because vitamin K density is real.
  Ground Cover: Dense rosettes shade spinach alleys under taller brassicas so weed seeds never see sunlight between rows.
companions:
- Lettuce (Lactuca sativa) — shared cool-season timing and manageable watering simplifies
  bed work.
- Garlic (Allium sativum) — strong scent helps diversify pest pressure in mixed cool-season
  plantings.
- Radish (Raphanus sativus) — quick roots loosen soil and help you harvest something
  fast while spinach grows.
cautions:
- Heat triggers bolting; plan shade or shift sowing windows.
