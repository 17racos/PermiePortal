  description: "Maitake forms rosettes of overlapping caps at the base of living or
    dying hardwoods — oaks are the headline host. It is a cool-weather fruiter that
    shows up when nights drop; Florida and Puerto Rico gets fewer classic flushes than the
    Appalachians, but oak-rich sites still produce after wet-cool snaps. Outdoor
    cultivation attempts use buried stem butts or inoculated substrates at tree
    bases; success is part science, part bribery to the mycelium gods. Wild harvest
    demands rock-solid ID.\n\n☀️💧 Sun and Water:\n- Root-zone shade at tree bases;
    mulch to buffer soil moisture.\n- Seasonal rains drive flushes; irrigation cannot
    fully fake a cold autumn.\n- Avoid compacted, anaerobic soil around host roots.\n\n✂️
    Propagation:\n- Outdoor patches from commercial kits or stem-butt transfers
      (experimental).\n- Protect colonized zones from foot traffic and mower abuse."
