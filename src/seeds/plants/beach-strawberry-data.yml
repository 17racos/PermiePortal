  description: 'Beach strawberry (Fragaria chiloensis) is a stoloniferous perennial strawberry native to Pacific coasts of
    the Americas, forming evergreen to semi-evergreen mats of trifoliate leaves and white flowers followed by small, aromatic
    fruit. It hugs sand and gravel, typically staying low—roughly 4–8 inches—with runners that root at nodes.


    subtropical and tropical Americas gardeners meet it as a coastal-sand specialist or container curiosity: humid inland
    Florida invites foliar disease unless airflow and spacing are disciplined; Puerto Rico coastal sites can work with afternoon
    shade and salt-tolerant neighbors. It is not a substitute for commercial strawberry culture in the Deep South.


    ☀️💧 Sun and Water Requirements:

    - Full sun on cool coasts; in subtropical and tropical Americas, bright partial sun reduces leaf scald.

    - Sandy, well-drained soil; tolerates salt spray better than inland berries—avoid heavy clay saucers.


    ✂️ Methods to Propagate:

    - Runners: peg rooted plantlets into pots or adjacent soil in spring—fastest expansion for ground cover jobs.

    - Division of crowns in early spring or fall when temperatures are mild—reset aging mats.


    🌾 Harvest / Best Use Timing:

    - Pick fruit when fully colored and aromatic; yields are modest—treat as garnish and wildlife tithe, not a jam factory.

    - Clip spent foliage after heavy fruiting if disease pressure builds; compost hot, do not coddle pathogens.'
  purpose: 'Beach strawberry is living mulch with honest fruit.


    - Edible: Small berries punch above their size in flavor where climate cooperates.

    - Ground Cover: Runners knit sand and slope faces that taller plants skip.

    - Erosion Control: Roots and stolons reduce surface wash on coastal banks.

    - Pollinator: Flowers feed small native bees early in the coastal sequence.

    - Ornamental: Clean trifoliate mats read as intentional design, not failed lawn.'
  companions:
  - Yarrow — tough neighbor that shares sun and drainage without smothering low mats if yarrow stays upslope.
  - Sea Kale — perennial vegetable aesthetic on coastal-influenced beds; different height class reduces light theft.
  - Wax Myrtle — native shrubby windbreak that lifts salt spray above the strawberry plane without shading entirely if pruned.
