  description: "Fringe tree (Chionanthus virginicus) is a small deciduous tree or
    large shrub of moist woodlands, stream bluffs, and limestone glades across the
    eastern United States. Spring clouds of slender white petals look like shredded
    tissue from a distance; female plants (when pollinated) bear dark olive-like drupes.
    It is a signature native ornamental for understory edges where dogwoods finish
    too early.\n\n☀️💧 Sun and Water Requirements:\nFull sun to part shade; best flowering
    with at least half-day sun. Prefers moist, fertile, well-drained soils; tolerates
    limestone where organic matter is present. Mulch root zone to buffer summer heat
    on shallow soils.\n\n✂️ Propagation:\nSow seed after double dormancy treatment
    or fall outdoor sowing for natural cycles. Semi-hardwood cuttings under mist can
    work for clones. Minimal pruning except removing crossing branches in late winter.\n\n
    🌾 Harvest / Best Use Timing:\nFruits are not a human crop focus; leave for birds.
    Enjoy flowers as ephemeral garden events; avoid heavy shearing that removes next
    year’s bloom wood."
  purpose: |-
    - Ornamental: Fringed white inflorescences are among the showiest native spring displays for small yards.
    - Wildlife Attractor: Drupes feed birds; flowers support pollinators during spring peaks.
    - Pollinator: Abundant small flowers offer nectar and pollen resources in forest-edge gardens.
    - Shade Provider: Open crown gives light shade for woodland understory companions.
  companions:
