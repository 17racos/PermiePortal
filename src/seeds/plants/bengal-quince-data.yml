  description: "Bengal quince here refers to wood apple or elephant apple (Limonia acidissima), a thorny deciduous tree of\
    \ South and Southeast Asia bearing hard-shelled, aromatic fruit with sticky brown pulp used in drinks, chutneys, and traditional\
    \ medicine where appropriate. It is taxonomically separate from bael (Aegle marmelos) despite overlapping common names\
    \ in older literature. Trees can reach 30–50 feet (9–15 m) with compound leaves and a rough, fissured trunk; the canopy\
    \ is relatively open, allowing some undergrowth during wet season growth pulses.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n\
    Full sun for flowering and fruiting; tolerates hot lowland climates with a pronounced dry season. Prefers deep, well-drained\
    \ soils; drought-deciduous behavior is normal where irrigation is absent. Young plants need protection from hard frost;\
    \ mature trees handle brief cool spells in marginal subtropical sites better than tropical understory herbs.\n\n✂️ Propagation:\n\
    Sow fresh seed; germination can be slow and irregular—scarify carefully following regional practice. Budding onto seedling\
    \ rootstocks captures superior pulp types. Air-layer selected limbs during warm, humid weather for clonal copies.\n\n\U0001F33E\
    \ Harvest / Best Use Timing:\n Fruit is typically used when mature but still firm for processing; pulp is scooped, strained,\
    \ and sweetened. Fallen fruit ferments fast—collect on a schedule, not when you remember after three coffee refills."
