  description: 'Goldenmane tickseed (Coreopsis basalis) is a showy annual or short-lived coreopsis of prairies, roadsides,
    and open sandy ground in the south-central United States and adjacent regions, with dark-centered gold ray flowers and
    fine foliage that self-sows politely in warm climates. It is a pollinator snack bar in spring-to-summer windows when many
    beds are still deciding their personality. Use it in meadow mixes, rain-garden margins with sharp drainage, and chop-and-drop
    annual rotations that refuse turf monoculture.


    ☀️💧 Sun and Water Requirements:

    Full sun; lean, well-drained soils produce compact plants and intense bloom. Tolerates drought once established but looks
    fuller with moderate moisture between rains. Poor performance in heavy wet clay without amendment. Not reliably perennial
    in cold zones—treat as self-seeding annual northward.


    ✂️ Propagation:

    Sow seed directly after frost risk; barely cover—light aids germination.

    Collect dry heads before shatter to curate color placement next season.


    🌾 Harvest / Best Use Timing:

    Cut flowers for bouquets at early open stage; deadhead to prolong bloom or allow seed for finches and self-sowing.'
