  description: "Sea rocket (Cakile lanceolata) is an annual or winter annual mustard
    of upper beaches and saline sands around much of North America and beyond. Succulent
    leaves and four-petaled flowers give way to jointed pods that travel tides like
    tiny rafts. It is an edible oddity for careful foragers, a pioneer on disturbed
    sand, and a reminder that the beach is an ecosystem, not a parking lot with
    waves.\n\n☀️💧 Sun and Water Requirements:\n- Full sun; shade quickly weakens
    beach annuals.\n- Drought tolerant in maritime humidity; roots follow the shallow
    freshwater lens where it exists.\n- Sand and shell; tolerates salt spray and
    occasional inundation.\n\n✂️ Propagation:\n- Direct-sow seed after last cool
    weather in coastal gardens; keep sand moist until emergence.\n- Collect ripe
    pods before full shatter if managing a controlled planting.\n- Thin crowded
    seedlings to reduce powdery mildew pockets.\n\n🌾 Harvest / Best Use Timing:\n-
    Snip young leaves and stems for peppery salads only from uncontaminated beaches—pollution
    is not abstract here.\n- Pick pods when firm if saving seed; they split fast
    when dry.\n- Leave plants on public dunes unless regulations and safety allow—restoration
    beats souvenir harvesting."
  purpose: |-
    - Edible: Young leaves add mustard heat in salads where water quality is verified.
    - Erosion Control: Roots knit upper sand after storms and foot traffic.
    - Wildlife Attractor: Flowers feed insects; seeds feed birds along the strand.
    - Ground Cover: Low branching stems cover bare sand between slower perennials.
  companions:
  - Railroad Vine — perennial vine behind annual sea rocket on stable foredunes
  - Sea Oxeye Daisy — perennial mound adds structure when rockets finish their annual sprint
  - Saltwort — lower marsh succulent for salinity gradients in restoration mixes
  cautions:
