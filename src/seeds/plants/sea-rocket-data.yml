  description: 'Sea rocket (Cakile lanceolata) is an annual or winter annual mustard of upper beaches and saline sands around
    much of North America and beyond. Succulent leaves and four-petaled flowers give way to jointed pods that travel tides
    like tiny rafts. It is an edible oddity for careful foragers, a pioneer on disturbed sand, and a reminder that the beach
    is an ecosystem, not a parking lot with waves.


    ☀️💧 Sun and Water Requirements:

    - Full sun; shade quickly weakens beach annuals.

    - Drought tolerant in maritime humidity; roots follow the shallow freshwater lens where it exists.

    - Sand and shell; tolerates salt spray and occasional inundation.


    ✂️ Propagation:

    - Direct-sow seed after last cool weather in coastal gardens; keep sand moist until emergence.

    - Collect ripe pods before full shatter if managing a controlled planting.

    - Thin crowded seedlings to reduce powdery mildew pockets.


    🌾 Harvest / Best Use Timing:

    - Snip young leaves and stems for peppery salads only from uncontaminated beaches—pollution is not abstract here.

    - Pick pods when firm if saving seed; they split fast when dry.

    - Leave plants on public dunes unless regulations and safety allow—restoration beats souvenir harvesting.'
