  description: "Bottlebrush (Callistemon citrinus) is an evergreen Australian shrub with aromatic leaves and cylindrical
    crimson flower spikes that read like bottle brushes dipped in paint. It flowers heavily in warm months and again in flushes
    where winters stay mild, pulling hummingbirds, bees, and butterflies into a predictable nectar schedule. Tough once established,
    it tolerates heat, sandy soils, and periodic drought—useful on sunny margins, wildlife corridors, and wind-softening rows
    where irrigation is not a religion.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for dense flowers; shade stretches
    stems and dulls bloom.\n- Well-drained soil; tolerates lean ground once roots run deep.\n- Young plants need steady moisture;
    mature plants endure dry spells better than pampered ones.\n\n✂️ Propagation:\n- Semi-hardwood cuttings root under humidity
    in warm seasons.\n- Seeds are fine for species experiments; named forms are cloned.\n- Light pruning after bloom keeps
    compact habit and renews flowering wood.\n\n🌾 Harvest / Best Use Timing:\n- If harvesting for craft or dye experiments,
    pick spikes at peak color before brownout.\n- Leave plenty for pollinators—this plant earns its keep in nectar, not just
    aesthetics.\n- Rake spent flowers if mulch pests become a conversation under the canopy."
