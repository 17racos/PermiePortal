  description: "Myrtle oak (Quercus myrtifolia) is an evergreen shrub to small tree
    of sandy scrub, coastal strands, and dry pinelands in the southeastern United
    States. Small, glossy, myrtle-like leaves hug stiff twigs; acorns feed wildlife
    where turf fantasies usually fail. It excels in lean, sunny food forests as
    a low wind-skim and edge feather between open ground and taller canopy.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun; dense compact growth needs bright light.\n-
    Drought tolerant when established; hates prolonged root drowning.\n- Sandy,
    well-drained acidic soils match its natural scrub ecology.\n\n✂️ Propagation:\n-
    Acorns sown fresh in autumn in deep tubes; protect from rodents.\n- Seedlings
    transplant best when small; root prune if pot-bound.\n- Air-layering possible
    on flexible branches but seldom necessary for landscape stock.\n\n🌾 Harvest
    / Best Use Timing:\n- Acorns mature in autumn; collect soon after drop before
    weevils hollow them.\n- For habitat, leave the bulk on the ground for jays,
    squirrels, and insects.\n- Light tip pruning in warm seasons shapes hedges without
    heavy lopping that invites dieback."
  purpose: |-
    - Wildlife Attractor: Acorns and cover support birds, mammals, and insects in fire-adapted ecosystems.
    - Windbreaker: Low, tough canopy trims desiccating winds along coasts and sand ridges.
    - Border Plant: Evergreen edge definition where irrigation is minimal and soil is poor.
  companions:
