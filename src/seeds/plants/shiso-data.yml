  description: |-
    Shiso is the mint-adjacent annual with green or purple serrated leaves that sashimi plates and Korean pickles cannot live without. Self-sows like it pays rent in seeds — subtropical and tropical Americas gardeners either love the volunteers or learn to deadhead before the deed is done. Flavor is bold anise-cinnamon; not a shy herb.
    
    ☀️💧 Sun and Water:
    - Full sun to light shade; purple forms color best with sun.
    - Steady moisture; heat flags plants in dry pots fast.
    
     ✂️ Propagation:
    - Seed: surface sow after frost; cold stratification optional but improves some lots.
    - Transplant starts for head start against summer.
    
     Invasive alerts exist in some southeastern states — keep it in the kitchen garden, not the conservation easement.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Shiso growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
