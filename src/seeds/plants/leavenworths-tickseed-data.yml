description: |-
  Leavenworth’s tickseed (Coreopsis leavenworthii) is an annual or short-lived perennial wildflower of wet prairies, ditches, and ruderal openings in the southeastern United States, bearing bright yellow ray flowers with dark centers on wiry stems. Height is often 1–3 feet (0.3–1 m). It self-sows enthusiastically in moist sunny sites, making it valuable for rain gardens, bioswale edges, and native meadow mixes in humid subtropical climates.

  Full sun for dense bloom; light shade reduces flowers. Moist to wet, organic soils match natural ditches; tolerates short dry spells after establishment but sulks on xeric berms. Avoid planting in sealed clay saucers without overflow.

  Sow seed in fall or early spring; self-sown volunteers often outperform fussy trays. Thin dense carpets if airflow becomes a mildew invitation. Cut back spent stalks if you dislike the brown phase—leave some for seed if you want free reruns.

  Peak bloom tracks warm wet season—plan pollinator tours then. Collect dry seed heads for sharing with ethical local genotype notes. Leave late heads for finches if winter mess is acceptable.
purpose: |-
  Pollinator: Coreopsis leavenworthii paints wet ditches yellow with dark-centered disks that syrphid flies and small bees work during summer heat -- blooms peak when rain gardens stay moist.
  Ornamental: Airy wiry stems read cheerful along bioswale toes -- pair with muhly grasses upslope for texture contrast without irrigation addiction.
  Wildlife Attractor: Finches pick mature achenes from upright stalks -- leave dead stems until spring if winter structure matters more than instant tidiness.
  Erosion Control: Fibrous roots bind saturated ditch banks where turf rots -- mass plugs on contour so roots interlock before next monsoon sheet flow.
