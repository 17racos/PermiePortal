  description: 'Syzygium cumini is the tropical myrtle that stains sidewalks purple— glossy leaves, fragrant cream flowers,
    dark astringent fruit that goes from ‘spit it out’ to ‘jam material’ as it ripens.


    Fruiting in 9b+ with young-tree protection from hard freezes; thrives in heat and humidity. Can self-sow in frost-free
    pockets—mind your local invasive lists.


    ☀️💧 Sun and Water Requirements:


    Full sun for heavy fruiting; tolerates some shade when young.

    Deep watering in dry spells improves fruit size; mulch to protect surface roots.


    ✂️ Propagation:


    Seed (comes mostly true); air-layering and grafting for known fruit quality.


    🌾 Harvest / Best Use Timing:


    Pick when purple stain says ripe for jam, vinegar, or wine trials—expect dye-grade fingers.'
