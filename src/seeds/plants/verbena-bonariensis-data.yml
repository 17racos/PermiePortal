  description: "Verbena bonariensis is a clump-forming perennial famous for wiry
    1.2–1.8 m (4–6 ft) stems that hover small purple flower clusters at eye level,
    like a meadow on stilts. It self-sows politely to enthusiastically depending on
    site—deadhead if you want control, shake seed if you want a drift. In Florida
    and Puerto Rico it often behaves as a short-lived perennial or self-replacing
    annual; plan for renewal, not immortality.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun for strongest stems; some afternoon shade acceptable in hottest pockets.\n-
    Average to lean soil; drought-tolerant once established—overwatering and tight
    airless corners invite mildew.\n- Sharp drainage helps during humid wet season
    downpours.\n\n✂️ Methods to Propagate:\n- Sow seed indoors 8–10 weeks before
    last frost or direct-sow after soil warms; germinates in warm conditions.\n-
    Basal cuttings in spring root quickly under humidity dome.\n- Divide mature clumps
    in early spring before new growth accelerates.\n\n🌾 Harvest / Best Use Timing:\n-
    Cut stems for long-lasting pollinator support in borders; remove spent heads
    before seed drop if containing spread.\n- Leave late stems standing for beneficial
    insects where self-sowing is welcome."
