description: |-
  Sand live oak (Quercus geminata) is an evergreen oak of deep sandy ridges, coastal scrub, and pine savannas in the southeastern United States. Leaves are stiff, often rolled under, with pale undersides; acorns feed a long list of wildlife. It is a cornerstone canopy for fire-adapted ecosystems and a drought-tough shade tree where irrigation is philosophy, not plumbing.

  - Full sun; dense compact crowns need bright light.
  - Drought tolerant when established; young trees benefit from deep occasional watering the first years.
  - Deep sand to sandy loam; intolerant of prolonged root drowning.

  - Acorns planted fresh in autumn; protect from rodents.
  - Transplant small seedlings with taproots intact.
  - Prune only for clearance or storm structure; avoid lion-tailing that invites wind throw.

  - Acorns mature in autumn; collect soon after drop for propagation or wildlife feeding trials.
  - Mulch under young trees to exclude mower strikes.
  - Thin lower epicormic sprouts if you need trunk clarity for paths.
purpose: |-
  Wildlife Attractor: Quercus geminata sweet acorns concentrate on sand ridges where deer, squirrels, scrub jays, and woodpeckers schedule autumn calories while stiff evergreen leaves shelter canopy insects year-round.
  Windbreaker: Low broad evergreen crowns blunt steady onshore gusts across coastal scrub corridors where deciduous hardwoods stay bare half the year.
  Shade Provider: Dense foliage casts summer shade over palmettos, grapes, and livestock lanes without the deep darkness of taller bottomland oaks.
  Erosion Control: Wide lateral roots knit deep aeolian sand that would drift off dunes if left to herbaceous cover alone.
companions:
- Myrtle Oak — lower evergreen oak layer beneath taller sand live oak canopies
- Scrub Hickory — adds mast diversity and contrasting bark in scrub restoration
- Sand Blackberry — thorny understory fruiting layer in sunny oak openings
