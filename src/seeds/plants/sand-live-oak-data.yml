  description: 'Sand live oak (Quercus geminata) is an evergreen oak of deep sandy ridges, coastal scrub, and pine savannas
    in the southeastern United States. Leaves are stiff, often rolled under, with pale undersides; acorns feed a long list
    of wildlife. It is a cornerstone canopy for fire-adapted ecosystems and a drought-tough shade tree where irrigation is
    philosophy, not plumbing.


    ☀️💧 Sun and Water Requirements:

    - Full sun; dense compact crowns need bright light.

    - Drought tolerant when established; young trees benefit from deep occasional watering the first years.

    - Deep sand to sandy loam; intolerant of prolonged root drowning.


    ✂️ Propagation:

    - Acorns planted fresh in autumn; protect from rodents.

    - Transplant small seedlings with taproots intact.

    - Prune only for clearance or storm structure; avoid lion-tailing that invites wind throw.


    🌾 Harvest / Best Use Timing:

    - Acorns mature in autumn; collect soon after drop for propagation or wildlife feeding trials.

    - Mulch under young trees to exclude mower strikes.

    - Thin lower epicormic sprouts if you need trunk clarity for paths.'
  purpose: '- Wildlife Attractor: Acorns and canopy support birds, mammals, and countless insects.

    - Windbreaker: Evergreen mass trims desiccating winds along coasts and open sandhills.

    - Shade Provider: Broad evergreen shade for livestock, people, and understory guilds.

    - Erosion Control: Root systems anchor deep sand that would otherwise blow or slump.'
  companions:
  - Myrtle Oak — lower evergreen oak layer beneath taller sand live oak canopies
  - Scrub Hickory — adds mast diversity and contrasting bark in scrub restoration
  - Sand Blackberry — thorny understory fruiting layer in sunny oak openings
