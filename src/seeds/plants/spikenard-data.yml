  description: "Spikenard (Aralia racemosa) is a bold herbaceous perennial of eastern
    North American woodlands, forming a shrub-like clump to about 3–8 feet (1–2.5 m)
    with large compound leaves and airy summer panicles of tiny white flowers followed
    by purple-black berries. The thick aromatic root has a long history in herbal
    traditions and modest wild-food use; berries feed birds. It brings lush understory
    biomass and late-season pollinator support to shaded food forests and restoration
    edges.\n\n☀️💧 Sun and Water Requirements:\nPart shade to full shade matches its
    woodland ecology; dappled light at woodland edges also works. Likes consistently
    moist, rich, well-drained humus; tolerates short dry spells once established but
    not drought on sandy sun-baked sites. Mulch to mimic forest floor and hold even
    soil moisture.\n\n✂️ Propagation:\nSow fresh ripe seed outdoors in fall or cold-stratify
    dry seed for spring sowing; germination can be slow and irregular. Divide dormant
    crowns in early spring before break. Root cuttings from thick rhizomes in late
    winter under gentle bottom heat can expand a patch.\n\n🌾 Harvest / Best Use Timing:\nFor
    herbal use, harvest roots in fall after several years of growth, clean, slice,
    and dry thoroughly with airflow. Berries are eaten in very small quantities only
    with confident ID and caution; leave most for wildlife. Cut back spent flowering
    stems after fruit drop if you want tidier clumps."
  purpose: |-
    - Edible: Young shoots and ripe berries have limited traditional use; treat as a specialist wild food with careful identification and moderation.
    - Medicinal: Aromatic roots are valued in herbal practice for adaptogen-style tonics; verify local regulations and safety before use.
    - Wildlife Attractor: Berries are taken by many songbirds; flowers draw small bees and flies in forest gaps.
    - Pollinator: Late-summer bloom fills a shady niche when many sun plants have finished.
    - Mulcher: Large deciduous leaves build fast leaf litter that feeds soil mesofauna under trees.
  companions:
  - Black Cohosh — shared moist shade; staggered bloom and contrasting foliage structure in woodland borders
  - Wild Ginger — low carpet under spikenard’s tall stems; both prefer rich woodland soil and steady moisture
  - American Hazelnut — shrubby edge provides dappled light; nut drop and leaf litter reinforce the forest-floor mulch regime
  cautions:
  - Confusion with other Aralia species — misidentification risks; verify leaves, inflorescence, and habitat before eating roots or fruit
  - Pets and livestock — berries and other parts may cause illness if grazed in quantity; not a pasture plant
  pests:
