description: |-
  Spikenard (Aralia racemosa) is a bold herbaceous perennial of eastern North American woodlands, forming a shrub-like clump to about 3–8 feet (1–2.5 m) with large compound leaves and airy summer panicles of tiny white flowers followed by purple-black berries. The thick aromatic root has a long history in herbal traditions and modest wild-food use; berries feed birds. It brings lush understory biomass and late-season pollinator support to shaded food forests and restoration edges.

  Part shade to full shade matches its woodland ecology; dappled light at woodland edges also works. Likes consistently moist, rich, well-drained humus; tolerates short dry spells once established but not drought on sandy sun-baked sites. Mulch to mimic forest floor and hold even soil moisture.

  Sow fresh ripe seed outdoors in fall or cold-stratify dry seed for spring sowing; germination can be slow and irregular. Divide dormant crowns in early spring before break. Root cuttings from thick rhizomes in late winter under gentle bottom heat can expand a patch.

  For herbal use, harvest roots in fall after several years of growth, clean, slice, and dry thoroughly with airflow. Berries are eaten in very small quantities only with confident ID and caution; leave most for wildlife. Cut back spent flowering stems after fruit drop if you want tidier clumps.
purpose: |-
  Edible: Aralia racemosa purple-black berry clusters taste like spicy grape bubblegum in tiny tastes -- roots belong to trained harvesters only because ginseng-adjacent confusion kills enthusiasm fast.
  Medicinal: Aromatic roots entered Cherokee and eclectic pharmacy as lung and fatigue tonics -- modern commerce still fights CITES-style sustainability fights on wild populations.
  Wildlife Attractor: Fat-rich fruit disappears into thrushes -- while deer browse giant compound leaves only when pressed.
  Pollinator: Cream panicles open in humid August shade where goldenrod crowds have already peaked -- in sunnier fields.
  Mulcher: Huge divided leaves carpet tulip poplar duff with fast fungal food -- for millipedes under intact canopy.
