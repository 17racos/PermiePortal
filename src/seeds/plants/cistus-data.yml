  description: "Cistus, the rockroses, are evergreen to semi-evergreen Mediterranean
    shrubs famous for crinkled, resin-scented leaves and short-lived papery flowers
    in white, pink, or magenta. Mature size is typically 0.6–2 m tall and somewhat
    wider, forming loose mounds that laugh at drought. In subtropical and tropical Americas
    they are best treated as sun-baked, fast-draining specimens—humid, wet feet
    during tropical wet seasons can trigger root issues, so site them like coastal
    scrub: airy, lean, and never boggy.\n\n☀️💧 **Sun and Water Requirements:**\nFull
    sun and excellent drainage are non-negotiable. Once established, water sparingly;
    in rainy climates plant on berms or in containers with mineral grit. Avoid heavy
    organic mulches pressed against crowns.\n\n✂️ **Methods to Propagate:**\n- **Seeds:**
    Sow in well-drained mix; germination can be erratic—surface sow and keep warm.\n-
    **Cuttings:** Semi-hardwood cuttings in late warm season root quickly with bottom
    heat; take material before plants harden off for winter cool snaps in marginal
    zones.\n\n🌾 **Best Use Timing:**\nPrune lightly after main flowering waves to
    shape; avoid heavy renovation cuts on old wood. Enjoy resinous foliage year-round
    for aromatic hedges; flowers peak in warm dry stretches."
