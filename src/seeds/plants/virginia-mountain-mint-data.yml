    herb spirals.\n\n☀️💧 Sun and Water Requirements:\nFull sun for tightest growth
    and heaviest bloom; tolerates light shade with looser habit. Prefers moist, average
    to rich soils; handles short drought once established but looks best with even
    moisture. Airflow helps foliage stay clean in humid summers.\n\n✂️ Propagation:\n
    Sow seed in fall outdoors or cold-stratify for spring. Divide clumps in early
    spring or fall; pieces with roots establish quickly. Soft tip cuttings root under
    humidity in late spring.\n\n🌾 Harvest / Best Use Timing:\nSnip flowering tops
    at peak bloom for teas or drying; flavor is strong—start with small amounts. Leave
    late stems for beneficial insect nesting habitat if you are not collecting seed."
