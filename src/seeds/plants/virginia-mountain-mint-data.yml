description: |-
  Virginia mountain mint (Pycnanthemum virginianum) is a clump-forming perennial mint relative of moist meadows, roadsides, and open woods across eastern North America. Aromatic leaves and flat terminal heads of tiny white spotted flowers draw insect clouds in mid to late summer. Unlike aggressive true mints, it spreads modestly and behaves in pollinator strips, rain-garden shoulders, and herb spirals.

  ☀️💧 Sun and Water Requirements:
  Full sun for tightest growth and heaviest bloom; tolerates light shade with looser habit. Prefers moist, average to rich soils; handles short drought once established but looks best with even moisture. Airflow helps foliage stay clean in humid summers.

  ✂️ Propagation:
   Sow seed in fall outdoors or cold-stratify for spring. Divide clumps in early spring or fall; pieces with roots establish quickly. Soft tip cuttings root under humidity in late spring.

  🌾 Harvest / Best Use Timing:
  Snip flowering tops at peak bloom for teas or drying; flavor is strong—start with small amounts. Leave late stems for beneficial insect nesting habitat if you are not collecting seed.
purpose: |-
  Pollinator: Pycnanthemum virginianum flat corymbs of spotted white florets host small bees, wasps, and halictids during midsummer dearth -- air movement keeps mildew off in humid eastern summers.
  Edible: Leaves and flowering tops steep to a bold mint-oregano tea -- not supermarket Mentha; start with short steeps to respect potency.
  Pest Management: High monoterpene foliage can mask host cues for some chewing insects -- weave into mixed insectary bands, not monoculture blocks.
  Ornamental: Clumping habit stays civilized compared with true mints -- white disks read like buttons in both rain gardens and formal borders.
companions:
- New England Aster — late purple-blue daisies after mountain mint peaks; shared sun
  and average moisture
- Goldenrod — complementary late gold; both support specialist bees without aggressive
  root wars
- Joe-Pye Weed — taller pink backdrop behind mid-height mint masses in moist sunny
  beds
cautions:
- True mint confusion — verify square stems and floral structure; do not swap care
  with Mentha species blindly
- Skin sensitivity — aromatic oils plus sun can irritate some handlers; wash hands
  before UV tanning experiments
pests:
- Aphids
- Spider Mites
growth_habit: Clump perennial; aromatic leaves; flat white flower heads; moist meadows
