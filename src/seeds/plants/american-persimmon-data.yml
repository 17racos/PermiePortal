  description: 'American persimmon is the native astringent poker that ripens into sugar only after frost—or patience—then
    feeds everything with a sweet tooth. Taprooted, slow to fruit from seed, worth it for honest regional food forests.


    Right at home; fruit quality varies wildly by genetics—grafted cultivars exist for people who dislike botanical roulette.


    Sun and water: Full sun for best fruiting. Tolerates poor, dry soils once established; appreciates deep watering when
    sizing fruit in sandy drought.

    ✂️ Propagation:

    Seeds (deep taproot, long juvenility); grafting onto seedling rootstock for known fruit; transplant very young trees only.'
  purpose: '- Edible: Human-grade fruit from improved selections once astringency breaks down; seedling trees vary wildly,
    so grafted material is how growers get predictable dessert quality.

    - Wildlife Attractor: Ripening fruit becomes a mast crop for birds, mammals, and insects with a sweet tooth—an honest
    wildlife food layer in temperate food systems.

    - Timber: Dense, fine-grained wood suits turning, tool handles, and small timber uses where trees are ethically thinned
    or salvaged rather than pillaged.

    - Ornamental: Fall color, handsome bark, and architectural branching add long-season landscape interest without demanding
    a separate “show” plant.'
  companions:
  - Pawpaw
  - Black locust
  - Native grasses
  cautions:
  - Expecting instant gratification from seedling trees
  - Planting under aggressive turf competition without mulch ring honesty
  pests:
