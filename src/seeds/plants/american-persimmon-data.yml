  - scale insects
  practitioner_notes: 'Astringency drops after soft-ripe—if the fruit splats when dropped a few inches, sugar beat astringency.

    Seedling trees can stay juvenile a decade—grafted wood is how impatient humans get predictable fruit.

    Transplant young; older taprooted specimens sulk or fail after bare-root moves.'
  growth_habit: Medium deciduous tree; often multi-trunked; deep taproot
