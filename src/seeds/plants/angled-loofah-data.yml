  description: |-
    Angled loofah is the ridged cousin of the sponge loofah — young fruit stir-fries like a cucumber with ambition; old fruit becomes fibrous skeletons for scrubbing dishes and exfoliating your bad decisions. It is a heat-loving annual vine that will climb your fence, your tomatoes, and your dignity if you skip a trellis. In Florida and Puerto Rico plant after soil warms; the first cold snap ends the party.

    ☀️💧 Sun and Water Requirements:
    - Full sun and rich, organic soil with steady moisture during fruit set.
    - Heavy feeder — compost and occasional balanced fertility beat miracle-gro cosplay.
    - Trellis strongly; fruit hangs straighter and rots less than fruits on wet ground.

    ✂️ Methods to Propagate:
    - Direct sow 2–3 seeds per hill after last frost, thin to strongest.
    - Transplant: start indoors 3–4 weeks before last frost if you need head start on short seasons.
  purpose: |-
    Angled loofah is food plus utility fiber in one vine:

    - Edible: Harvest young fruit for cooking before fibers toughen.
    - Fiber: Mature gourds yield luffa sponges when dried and peeled.
    - Pollinator: Large yellow flowers feed bees if you stop spraying every bug.
  companions:
  - Beans
  - Nasturtium
  - Marigold
  avoid:
  - Wet foliage without airflow (disease city)
  - Letting vines sprawl on damp soil
  pests:
