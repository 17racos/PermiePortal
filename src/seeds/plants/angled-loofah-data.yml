common_name: Angled Loofah
picture: angled_loofah.webp
scientific_name: Luffa acutangula
aka:
  - Ridge gourd
  - Chinese okra
family: Cucurbitaceae
zone: 3-11
ideal_temp_min: 70
ideal_temp_max: 92
min_temp: 50
max_temp: 100
perennial: false
layers:
  - Vine
plant_function:
  - Edible
  - Fiber
  - Pollinator
description: |-
  Angled loofah is the ridged cousin of the sponge loofah — young fruit stir-fries like a cucumber with ambition; old fruit becomes fibrous skeletons for scrubbing dishes and exfoliating your bad decisions. It is a heat-loving annual vine that will climb your fence, your tomatoes, and your dignity if you skip a trellis. In subtropical and tropical Americas plant after soil warms; the first cold snap ends the party.

  Full sun and rich, organic soil with steady moisture during fruit set. Heavy feeder — compost and occasional balanced fertility beat miracle-gro cosplay. Trellis strongly; fruit hangs straighter and rots less than fruits on wet ground.

  Direct sow 2–3 seeds per hill after last frost, thin to strongest. Transplant: start indoors 3–4 weeks before last frost if you need head start on short seasons.

  Angled Loofah: pick fruits young for vegetable use or fully ripe for seed and sweetness goals -- one plant rarely serves both fantasies. Cut stems morning; afternoon wilt reduces quality fast above 90°F (32°C). Check trellis daily during peak set; hidden fruits split after rain.
purpose: |-
  Edible: Luffa acutangula young ridged fruits stir-fry crisp like assertive cucumbers when picked under 20 cm -- ridges hide sudden fiber, so harvest often during heat waves when fruits jump from tender to rope overnight.
  Fiber: Fully mature gourds dry to rattling seeds inside, then peel to expose angular sponge skeletons for scrubbing and crafts -- leave too long on the vine and pith rots before fibers set clean.
  Pollinator: Big yellow cucurbit flowers offer pollen and nectar mornings before squash bees dominate -- trellis vines so blooms stay off wet mulch where cucumber beetles party less.
companions:
  - Beans
  - Nasturtium
  - Marigold
cautions:
  - Wet foliage without airflow (disease city)
  - Letting vines sprawl on damp soil
pests:
  - Banded Cucumber Beetle
  - Broad Mite
  - Greenhouse Whitefly
  - Melonworm
  - Pickleworm
  - Reniform Nematode
  - Shore Fly
  - Squash Bug
  - Squash vine borer
  - Striped Cucumber Beetle
  - Fusarium Wilt
  - Leaf Spot
  - Papaya Ringspot Virus
  - Pythium Root Rot
  - Spotted cucumber beetle
