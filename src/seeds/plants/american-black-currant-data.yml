description: |-
  American black currant (Ribes americanum) is a deciduous native shrub of cool, moist North American thickets and riparian edges, forming an upright clump roughly 3–6 feet (1–2 m) with maple-like lobed leaves and dangling racemes of greenish-yellow spring flowers. Glossy black berries ripen in early to mid summer, tart and aromatic, valued for jelly, syrup, and wildlife forage where commercial Ribes crops are uncommon. It fits food forests, hedgerows, and wetland buffers that stay sunny and damp but not stagnant.

  Full sun to light shade; best fruiting in at least half-day sun. Prefers consistently moist, humus-rich, well-drained soil; tolerates brief inundation on stream margins but not permanent anaerobic muck. Mulch keeps roots cool; drought reduces berry size quickly.

  Sow seed after cold stratification 90–120 days, or sow outdoors in fall. Hardwood cuttings taken in late dormancy root under bottom heat. Dig suckers with roots in early spring before bud break and reset in prepared beds.

  Pick clusters when berries are fully black, slightly soft, and aromatic—before birds take the entire crop. Process within a day or two; currants freeze well for off-season cooking. Prune out oldest canes after several years to renew fruiting wood.
purpose: |-
  Edible: Ribes americanum clusters stay lip-puckering raw but cook into jewel-clear jellies where sugar meets high pectin -- pick fully black, slightly soft berries before cedar waxwings finish the accounting.
  Wildlife Attractor: Glossy black fruit and maple-lobed leaves feed catbirds, chipmunks, and moth larvae along damp thickets -- leave a few canes uncut each year so fruiting wood stays sunlit.
  Pollinator: Dangling greenish racemes open before many canopy trees leaf out, offering early pollen loads to bees waking from winter carbohydrate debt.
  Dynamic Accumulator: Fibrous roots mine moist riparian subsoil for potassium and magnesium that return via leaf litter under elderberry and dogwood guild partners.
