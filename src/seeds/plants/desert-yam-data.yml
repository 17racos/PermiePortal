  description: "Desert yam (*Ipomoea costata*) is a warm-climate trailing vine from
    arid Australia, grown for starchy tubers and as a tough ornamental ground cover
    on lean soils. Leaves are variable and often deeply lobed; pink morning-glory
    flowers appear in favorable seasons. The edible tuber forms deep in sandy or gravelly
    ground and can reach substantial size over years. In subtropical and tropical Americas it
    is a novelty crop for frost-free sites with sharp drainage—not a substitute for
    true *Dioscorea* yams, but a legitimate desert-adapted root for experimental dry
    gardens.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nFull sun and
    very well-drained soil are non-negotiable. Water deeply but rarely; constant moisture
    invites rot. Humid air is tolerated if soil dries between rains—raised beds and
    coarse mulch help.\n\n✂️ **Methods to Propagate:**\n- **Stem cuttings:** Root
    nodal cuttings in sand during warm weather; keep barely moist until new growth
    firms.\n- **Tuber pieces:** In spring, plant chunks with eyes in deep, loose
    media like sand mixed with compost, mimicking natural wash-deposits.\n\n\U0001F9D1‍\U0001F33E
    **When to Harvest:**\nHarvest mature tubers after several seasons of growth or
    when vines die back in a cool snap (rare in tropical Puerto Rico—there, reduce
    water to signal dormancy). Always positively identify the plant before eating
    any morning-glory relative; only known *Ipomoea costata* should be consumed."
