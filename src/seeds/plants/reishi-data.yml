  description: |-
    Eastern reishi is a lacquered bracket fungus on hardwoods and root crowns — glossy, kidney-shaped, woody, with a distinctive red-to-orange varnished cap. Taxonomy is genuinely messy: the Ganoderma lucidum sold in Asian commerce is likely a different species than what grows on American oaks and maples; G. sessile is the common eastern U.S. lacquered bracket. In subtropical Florida they appear on stressed oaks, sweetgums, and other hardwoods — the tree is usually signaling root rot or internal decay when a bracket shows up. Outdoor log cultivation in shade with buried or stump-inoculated blocks is viable but slow. Sawdust blocks indoors produce antler-form fruiting bodies in high-CO₂ conditions, classic caps in fresh air — both are usable.
    
    ☀️💧 Sun and Water:
    - Natural fruiting on trunks and stumps in partial shade.
    - Outdoor cultivation uses buried hardwood logs or stumps; long timelines (6-18 months before first flush).
    - Humidity helps conk formation; dry Florida summers require irrigation pulses on outdoor substrate.
    
    ✂️ Propagation:
    - Sawdust blocks or supplemented hardwood substrate for indoor production.
    - Outdoor burial of colonized logs or stump inoculation for landscape integration.
    - Research strain-to-host match; not all Ganoderma strains perform equally on all substrates.
    
    🌾 Harvest / Best Use Timing:
    - Harvest mature brackets when still flexible -- chalky dry conks are past prime for tea quality.
    - Slice ribbons and air-dry with fan flow; finish crisp before jar sealing.
    - Long low simmers extract polysaccharide body; label batches with wood host and date.
  purpose: |-
    Medicinal: Reishi is kept as kitchen-level medicine where aerial parts, roots, or bark match references you trust before dosing -- keeps informed-adult herbal capacity on-site where drying, teas, and tinctures fit your actual risk tolerance
    Decomposer: Reishi partners with fungal and bacterial decomposer networks when humidity, airflow, and substrate match its niche -- cycles lignin-rich residues into usable humus pathways when placed with the right moisture and airflow
    Soil Builder: Reishi accelerates tilth gains when residues and roots are planned into rotations instead of left as accidental thatch -- feeds fungal networks and aggregate stability through roots and residues you plan for, not hope for
    Biomass: Reishi prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories
  companions:
  - Oak -- primary hardwood host; Ganoderma grows on living and dead Quercus roots and stumps
  - Maple -- common secondary host in temperate food forests
  - Sweetgum -- southeastern US host tree; grows at base of stressed or dying specimens
  cautions:
  - Ganoderma on a live landscape oak usually means root or trunk decay — consult
    an arborist before the tree becomes a liability
  - Do not harvest grandmother's oak for tea clout
  pests:
  - Borers
  - Root Rot
  practitioner_notes: |-
    Antler forms in high CO₂, classic caps in fresh air — both are valid; shape
    tells you about airflow, not potency.
    Dry harvested conks quickly with strong airflow; slow drying in bags or humid
    corners produces mold that looks like aging only in marketing copy.
    Outdoor log inoculation is a 6-18 month patience exercise — inoculate fresh
    logs in late winter, expect first flushes the following year or later.
    A lacquered bracket on a live landscape tree is a decay signal; photograph it,
    note the tree's structural condition, and do not pretend the fungus is decorating
    a healthy sentinel.
    Strain selection matters more than substrate perfection — buy from suppliers
    who document fruiting performance, not just tradition.
