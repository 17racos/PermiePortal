  description: "Buck plantain (Plantago coronopus) is a low, rosette-forming plant
    with narrow, toothed leaves that look a bit like antlers — hence the horn names.
    Young leaves are a salty, mineral-rich salad green; older foliage gets tougher
    but still works chopped into soups or as livestock forage. It tolerates poor,
    compacted soil and is a classic \"pavement weed\" that permies reclaim as food.\n\n
    In subtropical and tropical Americas it behaves like a cool-season hero: happy through winter and
    early spring, then often burning out or going to seed once the real heat sets in.
    Let it bolt if you want free seed for next year.\n\n☀️💧 Sun and Water:\n- Full
    sun to light shade.\n- Average moisture; tolerates short dry spells once roots
    are down.\n- Not fussy about soil; sand to clay if drainage is not a swamp.\n\n
    ✂️ Propagation:\n- Seed: direct-sow in fall or early spring; lightly cover.\n-
    Self-sows freely where happy — thin volunteers or transplant rosettes while small."
  purpose: |-
    Buck plantain fits edge zones, paths, and chicken runs:

    - Edible: Nutty, slightly salty leaves when young.
    - Medicinal: Plantain family tradition for minor skin irritation (poultice from crushed leaf).
    - Dynamic Accumulator: Mines minerals from tight soils into biomass you can eat or compost.
    - Animal Fodder: Poultry and rabbits usually approve.
    - Border Plant: Low, tough ground layer along beds and walkways.
  companions:
  - Clover
  - Chicory
  - Yarrow
  cautions:
  - None documented
  pests:
  - Aphids
  - Slugs
  - Snails
  practitioner_notes: |-
    Leaves read “weird salty lettuce” in cool weather—summer heat turns them tougher; harvest young rosettes for table use.
    Tolerates salt-spray edges better than broadleaf plantain—useful for paths beside unpaved drive grit.
    Aphids love the central crown—blast with water at dawn so leaves dry by night and mildew does not replace the bugs.
    Roots are shallow but tenacious—sheet mulch beats repeated shallow cultivation if you are shrinking a patch.
  growth_habit: Rosette herb
