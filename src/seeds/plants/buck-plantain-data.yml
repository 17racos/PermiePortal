  description: |-
    Buck plantain (Plantago coronopus) is a low, rosette-forming plant with narrow, toothed leaves that look a bit like antlers — hence the horn names. Young leaves are a salty, mineral-rich salad green; older foliage gets tougher but still works chopped into soups or as livestock forage. It tolerates poor, compacted soil and is a classic "pavement weed" that permies reclaim as food.
    
     In subtropical and tropical Americas it behaves like a cool-season hero: happy through winter and early spring, then often burning out or going to seed once the real heat sets in. Let it bolt if you want free seed for next year.
    
    ☀️💧 Sun and Water:
    - Full sun to light shade.
    - Average moisture; tolerates short dry spells once roots are down.
    - Not fussy about soil; sand to clay if drainage is not a swamp.
    
     ✂️ Propagation:
    - Seed: direct-sow in fall or early spring; lightly cover.
    - Self-sows freely where happy — thin volunteers or transplant rosettes while small.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Buck Plantain growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
