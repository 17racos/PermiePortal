  description: 'The carob tree (Ceratonia siliqua) is an evergreen Mediterranean legume tree, often 10–15 m (30–50 feet) tall,
    with glossy compound leaves, small red flowers, and long brown pods that ripen from late summer into winter depending
    on climate. It is extremely drought-tolerant once established and tolerates poor, rocky soils.


    🌞💧 Sun and Water Requirements:

    - Full sun.

    - Deep, well-drained soil; tolerates alkalinity and maritime exposure. In subtropical and tropical Americas, carob handles
    heat well but demands sharp drainage—raised mounds help during the wet season. Young trees need regular water; mature
    trees survive on rainfall in dry months once roots are deep.

    - Protect from waterlogging and compaction.


    ✂️ Methods to Propagate:

    - Seeds: Scarify and soak; germination can be slow; seedlings variable for pod quality.

    - Grafting: Named, high-sugar pod types are grafted onto seedling understocks for reliable yields.


    🌾 Harvest / Best Use Timing:

    - Pick pods when brown and slightly flexible; dry for storage. Carob is roasted for chocolate-like flavor, ground for
    flour, and used in animal feed; chocolate alternative hype is real but still not chocolate.'
  purpose: 'Carob anchors dry, sun-blasted food-forest edges:


    - **Edible**: Sweet pods are human food and fermentable stock; seeds yield locust bean gum industry cares about.

    - **Animal Fodder**: Livestock browse fallen pods; useful in silvopasture where irrigated alfalfa is a fantasy.

    - **Shade Provider**: Evergreen canopy cools understory for tender herbs, nursery tables, and human sanity.

    - **Windbreaker**: Dense crown cuts desiccating wind along coasts and exposed fields.'
