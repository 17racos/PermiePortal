  description: "Moonseed vine (Menispermum canadense) is a dioecious woody vine
    of eastern North American thickets, riverbanks, and woodland edges. Round, peltate
    leaves resemble wild grape from a distance, but the slender crescent seeds in
    dark fruit are a toxic look-alike lesson for foragers. It climbs by twining and
    adds quick vertical biomass where native biodiversity matters more than fruit
    harvest.\n\n☀️💧 Sun and Water Requirements:\n- Part shade to sun along edges;
    interior forest gaps with side light work best.\n- Moderate moisture; tolerates
    seasonal wet feet better than prolonged drought on sandy banks.\n- Average to
    rich soil; mulch base to keep roots cool in hot summers.\n\n✂️ Propagation:\n-
    Seeds: cold stratify several months; sow in deep pots—seedlings establish slowly.\n-
    Semi-hardwood cuttings in summer under humidity; rooting is uneven but possible.\n-
    Transplant small plants in spring; provide trellis, shrub, or deadwood for
    support.\n\n🌾 Harvest / Best Use Timing:\n- Fruit is not a human food; it is
    toxic and easily confused with small wild grapes.\n- Cut back excessive growth
    in late winter to direct energy into fruit for birds if managing habitat.\n-
    Document male and female plants if you want berries—both are needed for pollination."
