description: |-
  Prairie coneflower (Ratibida columnifera) is a taprooted perennial of central North American prairies and roadsides, famous for daisy-like flowers with a tall central cone and drooping yellow or bicolor rays that look like a sombrero in generous moods. Plants reach 1–3 feet (30–90 cm), thriving in lean, well-drained soils where turf would beg for mercy. It is a drought-class hero for pollinator strips, gravel gardens, and any sunny edge that needs color without sprinkler addiction.

  Full sun for compact habit and heavy bloom; shade invites floppy stems and fewer cones. Dry to average, well-drained soils are ideal; tolerates alkaline cuts and poor subsoils. Water only during establishment or extreme drought—overwatering and rich compost produce lush leaves and modest flowers.

  Sow seed outdoors in fall for natural stratification or cold-stratify 30–60 days. Taproot makes division tricky—prefer fresh seed for large areas. Deadhead if volunteers are unwelcome in manicured beds.

  Cut flowers when rays are fully reflexed and cones firm for long-lasting bouquets. Leave late heads for goldfinches and structural winter interest. Bloom waves track heat and daylength through warm months, not imported holiday schedules.
purpose: |-
  Pollinator: Ratibida columnifera drooping ray disks present flat nectar platforms for small halictid bees and checkerspot butterflies during mid-summer heat -- columnar cones stay reachable without long corolla tools.
  Wildlife Attractor: Persistent central cones feed finches long after petals fall; stiff stems shelter stem-boring bee larvae if you skip autumn scalping -- roadside crews mowing every week erase this value fast.
  Erosion Control: Deep taproot drills gravelly cuts and alkaline road berms where shallow-rooted annuals wash -- tolerates drought once established; irrigation and compost luxury mostly grow leaves, not sombrero hats.
  Ornamental: Yellow-and-maroon bicolor rays read as “Mexican hat” geometry in dry meadow mixes -- pairs visually with blue grama low turf without color clash on lean soils.
