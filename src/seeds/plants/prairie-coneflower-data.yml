  description: 'Prairie coneflower (Ratibida columnifera) is a taprooted perennial of central North American prairies and
    roadsides, famous for daisy-like flowers with a tall central cone and drooping yellow or bicolor rays that look like a
    sombrero in generous moods. Plants reach 1–3 feet (30–90 cm), thriving in lean, well-drained soils where turf would beg
    for mercy. It is a drought-class hero for pollinator strips, gravel gardens, and any sunny edge that needs color without
    sprinkler addiction.


    ☀️💧 Sun and Water Requirements:

    Full sun for compact habit and heavy bloom; shade invites floppy stems and fewer cones. Dry to average, well-drained soils
    are ideal; tolerates alkaline cuts and poor subsoils. Water only during establishment or extreme drought—overwatering
    and rich compost produce lush leaves and modest flowers.


    ✂️ Propagation:

    Sow seed outdoors in fall for natural stratification or cold-stratify 30–60 days. Taproot makes division tricky—prefer
    fresh seed for large areas. Deadhead if volunteers are unwelcome in manicured beds.


    🌾 Harvest / Best Use Timing:

    Cut flowers when rays are fully reflexed and cones firm for long-lasting bouquets. Leave late heads for goldfinches and
    structural winter interest. Bloom waves track heat and daylength through warm months, not imported holiday schedules.'
