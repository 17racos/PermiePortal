  description: "Wild chervil is a cool-climate biennial umbellifer with soft, ferny
    foliage and white flowers — carrot-family looks without the taproot drama of
    Queen Anne's lace. It is listed invasive in parts of North America; in subtropical and tropical Americas it is more of a short-lived novelty that struggles in brutal summers
    unless you treat it like a winter-spring crop. Young leaves have a mild parsley-anise
    vibe; always ID carefully because the Apiaceae family also hosts plants that
    can ruin your week.\n\n☀️💧 Sun and Water:\n- Light shade to full sun in cool
    weather; afternoon shade once days stay hot.\n- Even moisture; drought makes
    it run to flower.\n- Rich, organic soil keeps leaves tender longer.\n\n✂️
✂️ Propagation:
\n- Seed: sow in fall or earliest spring for a cool-season flush.\n-
    Remove flower heads where spread is a legal or ecological headache."
  purpose: |-
    Wild chervil is a cool-season forage herb for the patient:

    - Edible: Young leaves and stems as a mild herb; use sensible caution with ID.
    - Pollinator: Early nectar for small flies and bees.
    - Wildlife Attractor: Insect traffic in bloom; swallowtails may visit related
      chemistry in the planting.
    - Border Plant: Soft texture in the back of a cool-season bed.
  companions:
  - Lettuce
  - Chives
  - Yarrow
  cautions:
  - None documented
  pests:
  - Aphids
  - Caterpillars
  - Leafhoppers
  - Powdery Mildew
  practitioner_notes: |-
    Umbel ID is life safety—confusion with toxic lookalikes is documented.
    Biennial—first year low rosette, second year tall flower.
    Self-sows along roadsides—cultivated beds need deadheading if you hate volunteers.
  growth_habit: Upright biennial forb
