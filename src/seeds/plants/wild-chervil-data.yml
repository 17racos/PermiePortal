description: "Wild chervil is a cool-climate biennial umbellifer with soft, ferny foliage and white flowers — carrot-family looks without the taproot drama of Queen Anne's lace. It is listed invasive in parts of North America; in subtropical and tropical Americas it is more of a short-lived novelty that struggles in brutal summers unless you treat it like a winter-spring crop. Young leaves have a mild parsley-anise vibe; always ID carefully because the Apiaceae family also hosts plants that can ruin your week.\n\n💧 Sun and Water:\nLight shade to full sun in cool weather; afternoon shade once days stay hot. Even moisture; drought makes it run to flower. Rich, organic soil keeps leaves tender longer.\n\n  Propagation: \nSeed: sow in fall or earliest spring for a cool-season flush. Remove flower heads where spread is a legal or ecological headache.\n\n🌾 Harvest / Best Use Timing:\nSnip tender Wild Chervil growth in cool mornings for best texture -- heat-stressed leaves taste like their day job. Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths. Dry herbs in thin layers; deep piles steam themselves into compost."
purpose: |-
  Edible: Anthriscus sylvestris young leaves taste parsley-anise -- still Apiaceae; never confuse with poison hemlock inflorescence.
  Pollinator: Lacy white umbels open in May before heat shuts the party -- small flies and bees mob the first big umbels of the year.
  Wildlife Attractor: Swallowtail larvae use related chemistry -- insect traffic spikes during bloom; watch for listed invasive status before letting seed fly.
  Border Plant: Ferny second-year stems reach 1 m with foamy umbels -- back-of-bed soft texture for cool, moist soils.
