  description: "Wild chervil is a cool-climate biennial umbellifer with soft, ferny foliage and white flowers — carrot-family\
    \ looks without the taproot drama of Queen Anne's lace. It is listed invasive in parts of North America; in subtropical\
    \ and tropical Americas it is more of a short-lived novelty that struggles in brutal summers unless you treat it like\
    \ a winter-spring crop. Young leaves have a mild parsley-anise vibe; always ID carefully because the Apiaceae family also\
    \ hosts plants that can ruin your week.\n\n☀️\U0001F4A7 Sun and Water:\n- Light shade to full sun in cool weather; afternoon\
    \ shade once days stay hot.\n- Even moisture; drought makes it run to flower.\n- Rich, organic soil keeps leaves tender\
    \ longer.\n\n✂️ ✂️ Propagation: \n- Seed: sow in fall or earliest spring for a cool-season flush.\n- Remove flower heads\
    \ where spread is a legal or ecological headache."
