  description: "Ground cherry (Physalis pruinosa) is a warm-season solanaceous annual
    related to tomatillos, producing sweet-tart berries inside papery lanterns that
    drop when ripe—nature's portion control with built-in packaging. Native and naturalized
    forms occur across much of temperate North America; cultivated selections improve
    size and flavor for jam, pie, and fermentation projects. It fits annual polycultures
    with corn and beans, row edges, and containers where nightshade literacy is assumed,
    not optional.\n\n☀️💧 Sun and Water Requirements:\nFull sun; fertile, well-drained
    loam with steady moisture yields the largest lanterns. Heat-loving; growth stalls
    below about 50°F (10°C). Mulch soil to reduce splash-borne diseases and keep fallen
    fruit clean. Avoid waterlogging—damping-off and root rots murder seedlings.\n\n
    ✂️ Propagation:\nStart seeds indoors 6–8 weeks before last frost or direct-sow in
    warm soil.\nStake or cage like determinate tomatoes if winds roll branches.\n\n
    🌾 Harvest / Best Use Timing:\nGather fallen lanterns when husks dry and berries
    color inside; flavor sweetens off-plant for a few days in the husk. Remove husks
    before cooking; process ripe fruit only—green berries retain solanine baggage."
  purpose: |-
