  description: |-
    ‘Elliott’ is a southern highbush blueberry (*Vaccinium corymbosum*) cultivar prized for very late fruit — when early-season bragging rights have rotted on the counter, Elliott is still dangling berries for patient pickers. Like all highbush types, it wants acidic, organic, well-drained soil and disciplined pruning to stay productive and airy.
    
    subtropical and tropical Americas: confirm chill-hour fit for your site; mismatched cultivars produce fancy twig collections instead of fruit.
    
    ☀️💧 Sun and Water:
    - Full sun (6+ hours) for reliable fruit.
    - Consistent moisture during fruit swell; pine-bark mulch, drip or soaker preferred. Never let roots sit anaerobic.
    
    ✂️ Propagation:
    - Commercially grafted or tissue-cultured — home cloners use softwood cuttings in early summer with mist and rooting hormone.
    - Buy named liners for predictable chill and fruit traits.
    
    🌾 Harvest / Best Use Timing:
    - Elliott Blueberry: pick berries when fully colored and detach with a gentle tug -- whitish bloom still present is fine.
    - Cool mornings beat hot afternoons for shelf life; chill soon if not eating the same day.
    - Freeze dry on trays before bagging so berries do not fuse into a single ice meteor.
