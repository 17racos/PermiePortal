description: |-
  ‘Elliott’ is a southern highbush blueberry (*Vaccinium corymbosum*) cultivar prized for very late fruit — when early-season bragging rights have rotted on the counter, Elliott is still dangling berries for patient pickers. Like all highbush types, it wants acidic, organic, well-drained soil and disciplined pruning to stay productive and airy.

  subtropical and tropical Americas: confirm chill-hour fit for your site; mismatched cultivars produce fancy twig collections instead of fruit.

  Full sun (6+ hours) for reliable fruit. Consistent moisture during fruit swell; pine-bark mulch, drip or soaker preferred. Never let roots sit anaerobic.

  Commercially grafted or tissue-cultured — home cloners use softwood cuttings in early summer with mist and rooting hormone. Buy named liners for predictable chill and fruit traits.

  Elliott Blueberry: pick berries when fully colored and detach with a gentle tug -- whitish bloom still present is fine. Cool mornings beat hot afternoons for shelf life; chill soon if not eating the same day. Freeze dry on trays before bagging so berries do not fuse into a single ice meteor.
purpose: |-
  Edible: Vaccinium corymbosum 'Elliott' ripens weeks after early southern highbush cultivars -- pick berries blue-black with slight tug for late August fresh trays and freezer loads when earlier rows are already empty in zone 7-9 acid beds.
  Pollinator: Short white bells along twigs feed native Andrena blueberry specialists -- while honeybees still work clusters if spray calendars stay conservative on commercial-style rows.
  Wildlife Attractor: Cedar waxwings and catbirds strip canes the day after berries soften unless netting matches their migration timing on coastal pine-mulch plantings.
  Ornamental: Red winter stems and upright vase habit read tidy along paths where pH stays below 5.5 with pine-bark mulch and drip irrigation holding moisture without drowning crowns.
