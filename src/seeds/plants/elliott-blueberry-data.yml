  description: "‘Elliott’ is a southern highbush blueberry (*Vaccinium corymbosum*)
    cultivar prized for very late fruit — when early-season bragging rights have
    rotted on the counter, Elliott is still dangling berries for patient pickers.
    Like all highbush types, it wants acidic, organic, well-drained soil and
    disciplined pruning to stay productive and airy.\n\nNorth Florida: confirm chill-hour
    fit for your site; mismatched cultivars produce fancy twig collections instead
    of fruit.\n\n☀️💧 Sun and Water:\n- Full sun (6+ hours) for reliable fruit.\n-
    Consistent moisture during fruit swell; pine-bark mulch, drip or soaker preferred.
    Never let roots sit anaerobic.\n\n✂️ Propagation:\n- Commercially grafted or
    tissue-cultured — home cloners use softwood cuttings in early summer with mist
    and rooting hormone.\n- Buy named liners for predictable chill and fruit traits."
  purpose: |-
    - Edible: Late-season fresh eating, freezing, and baking.
    - Pollinator: Flowers support native and managed bees when pesticides are kept boring (i.e., minimal).
    - Wildlife Attractor: Netting drama proves birds agree the fruit is edible.
    - Ornamental: Fall color on some sites; tidy shrub form in rows or clusters.
