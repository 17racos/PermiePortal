  description: |-
    Yaupon holly is the native caffeinated shrug — small evergreen leaves, red berries on females, historically brewed into a black drink colonizers misread as "vomitoria" theater. Contains caffeine; respect concentration and personal wiring. subtropical and tropical Americas workhorse for hedges, dunes, and food forest edges that need tough.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to part shade; denser in sun, looser in shade.
    - Tolerates drought and salt spray once established — coastal sand is not an insult.
    - Almost any soil that drains; over-irrigation is insecurity, not love.
    
    ✂️ Methods to Propagate:
    - Seeds: stratify; need both sexes nearby for berries on females.
    - Cuttings: semi-hardwood roots with humidity and patience.
    - Transplant volunteers carefully — roots resent rude moves when large.
    
    🌾 Harvest / Best Use Timing:
    - Yaupon Holly: pick when full color, slight give, and aroma align -- early picks often ripen off-tree in a 65-72°F (18-22°C) room.
    - Taste-test one fruit per tree sector; sun-exposed shoulders ripen faster than shaded interiors.
    - Process windfalls within hours for jam or pulp; leaving them invites fruit fly internships.
