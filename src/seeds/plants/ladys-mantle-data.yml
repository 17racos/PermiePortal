  description: |-
    Lady's mantle (Alchemilla mollis) is a mounding perennial grown for soft, pleated leaves that bead dew into silvery pearls at leaf tips, and for airy chartreuse flower clusters in early summer. Plants form dense clumps 30 to 45 cm (12 to 18 inches) tall and spread slowly by self-seeding in moist climates. It is native to parts of Europe and widely naturalized in cool gardens.

    It suits partial-shade borders, rain garden edges, and orchard understories in temperate climates where summers are not extremely hot and dry.

    Provide morning sun with afternoon shade in hot regions, or light shade all day. Fertile, moisture-retentive yet well-drained soil supports lush growth; drought causes browning along margins.

    Divide crowns in spring or autumn every few years to rejuvenate centers. Sow seed in cool weather; fresh seed germinates readily.

    Cut flowering stems after color fades to limit self-seeding where naturalizing is unwanted. Collect leaves early in the day for drying if using in teas.
  purpose: |-
    Ornamental: Pleated foliage and chartreuse inflorescences anchor cottage-style beds -- dew-beading leaves add morning sparkle near paths.
    Ground Cover: Clumps merge into weed-suppressing mats under shrubs -- tolerates light foot traffic at edges if soil stays even.
    Medicinal: Dried leaf teas appear in European herbals for mild astringent use -- align dosing with current references and pregnancy cautions.
    Border Plant: Soft mounds edge walkways without sharp spines -- visually buffers hardscape corners.
    Pollinator: Tiny flowers feed small bees and flies during early summer -- bridges bloom between spring bulbs and midsummer perennials.
