  description: "Oregano (Origanum vulgare) is a hardy, aromatic perennial herb native
    to the Mediterranean. It grows in clumps with small, dark green leaves and produces
    clusters of purple to pink flowers that attract pollinators. The plant is well-suited
    for dry, well-drained soils and is highly drought-tolerant once established. Known
    for its strong, pungent flavor, oregano is a staple in Mediterranean cuisine.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun but tolerates
    partial shade.\n- Thrives in well-drained, sandy or loamy soil.\n- Drought-tolerant
    once established; requires moderate watering.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Seeds: Direct sow or start indoors 6-8 weeks before the last frost.\n- Cuttings:
    Stem cuttings root easily in water or soil.\n- Division: Established plants can
    be divided and transplanted.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When
    to Harvest:\n- Harvest leaves once the plant reaches at least 10 cm (4 in) tall.\n-
    Cut stems just before flowering for the strongest flavor.\n- Best harvested in
    the morning when oils are most concentrated."
  purpose: |-
    Oregano plays several important roles in permaculture systems:

    - Edible: Used fresh or dried in cooking, adding flavor to a variety of dishes.
    - Medicinal: Contains antibacterial and antifungal properties; used in herbal medicine for respiratory and digestive issues.
    - Pollinator: Flowers attract bees, butterflies, and other beneficial insects.
    - Wildlife Attractor: Provides nectar for pollinators.
    - Mulcher: Can be chopped and used as a mulch to retain soil moisture.
    - Dynamic Accumulator: Extracts minerals from the soil and improves soil health.
    - Border Plant: Useful as a low-growing border in garden beds.
    - Pest Management: The strong scent deters pests like aphids and cabbage moths.
