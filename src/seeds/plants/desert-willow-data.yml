  description: "Desert willow (*Chilopsis linearis*) is not a true willow but a
    heat-loving small tree from southwestern stream sides and arroyos, famous for
    orchid-like pink-to-lavender trumpet flowers and long, narrow willow-like leaves.
    It typically grows 15–25 feet tall with an open, airy canopy, sometimes multi-trunked.
    In subtropical and tropical Americas it performs best in full sun with fast drainage—think
    berms, gravel mulch, and no standing water after summer downpours.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nFull sun for maximum bloom. Deep, infrequent
    watering beats shallow daily sprays; established trees tolerate drought but look
    lusher with occasional soak. Root rot is the main killer in humid climates—elevate
    the root zone and avoid lawn sprinklers hitting the trunk.\n\n✂️ **Methods to
    Propagate:**\n- **Seeds:** Collect long pods when dry; sow in warm, well-drained
    mix. Seedlings vary in flower color.\n- **Softwood cuttings:** Take green tips
    in warm weather, use rooting hormone, and keep high humidity until rooted.\n\n\U0001F9D1‍\U0001F33E
    **Harvest / Best Use Timing:**\nFor nursery or bonsai use, prune after the main
    spring–summer flush to shape size. Flowers are at peak in warm months; collect
    seed pods in late summer or fall when they split easily."
  purpose: |-
    - **Ornamental:** Showy blooms and fine foliage give a desert oasis aesthetic without true willow water demands.
    - **Pollinator:** Bumblebees, carpenter bees, and hummingbirds visit the tubular flowers heavily.
    - **Wildlife Attractor:** Seeds and cover support birds; flowers extend nectar resources in hot dry periods.
    - **Shade Provider:** Light, dappled shade suits agaves, herbs, and seating areas without deep shade.
    - **Erosion Control:** Roots stabilize sandy banks along swales and pond edges where soil drains between events.
    - **Border Plant:** Linear leaves and seasonal bloom mark property lines and windbreak understories in dry designs.
