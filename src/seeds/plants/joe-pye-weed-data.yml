  description: "Joe Pye Weed is a robust, herbaceous perennial native to eastern and
    central North America. It typically grows between 1.5 to 2.4 meters (5 to 8 feet)
    tall and about 1.2 meters (4 feet) wide. The plant features upright, sturdy stems
    that are often green with purple spots or entirely purple. Leaves are arranged
    in whorls of three to five per node, each up to 30 centimeters (12 inches) long
    with a slightly wrinkled texture. In mid to late summer, it produces large, domed
    clusters of tiny, fragrant, mauve or pink-purple flowers that are highly attractive
    to butterflies and other pollinators.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nJoe
    Pye Weed thrives in full sun to partial shade and prefers moist, well-drained
    soils. It is commonly found in natural habitats like moist meadows, woodland edges,
    and stream banks, indicating its preference for consistently moist conditions.\n\n✂️\U0001FAD8
    Methods to Propagate:\nPropagation can be achieved through seed sowing or division.
    Seeds require cold stratification and should be sown in the fall or early spring.
    Division is best done in early spring or late fall by separating clumps and replanting
    them immediately.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nFor
    medicinal purposes, roots are typically harvested in the fall after the plant
    has flowered. Aerial parts can be collected during the flowering period for use
    in teas and tinctures."
