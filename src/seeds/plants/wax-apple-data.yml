description: |-
  Wax apple (Syzygium samarangense) is a tropical myrtle tree grown for bell-shaped, often waxy-skinned fruit that ranges from pale green to deep red depending on cultivar, with crisp, watery flesh and mild sweetness. Trees reach 25–40 feet (7.5–12 m) in humid climates, flowering intermittently with fluffy stamens. It belongs in warm orchards where heat is reliable and frost is rare.

  Full sun for reliable fruiting; juveniles accept partial shade. Rich, well-drained soils with steady moisture through the warm wet season and irrigation in dry spells prevent fruit cracking. Wind protection reduces branch rub on heavy clusters.

  Air-layer or graft known cultivars; seedlings vary in fruit size and color. Prune after harvest flushes for height and interior airflow.

  Pick when color deepens and flesh feels firm-crisp—lines vary widely by clone. Eat fresh quickly; thin skin loses water in refrigeration wars. Peak loads track tropical heat and rainfall cycles.
purpose: |-
  Edible: Syzygium samarangense bell fruit snaps crisp with high water volume -- thin skin loses turgor in dry cold rooms; eat or refrigerate immediately after harvest flushes.
  Wildlife Attractor: Puffball stamen flowers feed honeybees in humid lowlands -- fruit bats and birds puncture thin skins overnight if you delay picking.
  Shade Provider: Open tropical canopy casts dappled shade for understory gingers -- not dense shade; still enough to cut UV on west patios.
  Ornamental: Waxy blush-to-crimson fruit clusters hang like Christmas ornaments -- glossy foliage stays presentable in coastal heat where temperate ornamentals sulk.
companions:
- Carambola Tree — contrasting fruit geometry in a myrtle-rich warm-climate guild
- Lemongrass — perimeter herb along driplines marking irrigation
- Papaya — fast fruiting neighbor using vertical space during wax apple juvenile years
cautions:
- Name collision with other “rose apples”—Syzygium samarangense is this entry’s anchor
- Frost near 30°F (-1°C) damages young growth—protect saplings on marginal sites
pests:
- Aphids
- Caribbean Fruit Fly
- Oriental Fruit Fly
- Scale Insects
