  description: 'Wax apple (Syzygium samarangense) is a tropical myrtle tree grown for bell-shaped, often waxy-skinned fruit
    that ranges from pale green to deep red depending on cultivar, with crisp, watery flesh and mild sweetness. Trees reach
    25–40 feet (7.5–12 m) in humid climates, flowering intermittently with fluffy stamens. It belongs in warm orchards where
    heat is reliable and frost is rare.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; juveniles accept partial shade. Rich, well-drained soils with steady moisture through
    the warm wet season and irrigation in dry spells prevent fruit cracking. Wind protection reduces branch rub on heavy clusters.


    ✂️ Propagation:

    Air-layer or graft known cultivars; seedlings vary in fruit size and color. Prune after harvest flushes for height and
    interior airflow.


    🌾 Harvest / Best Use Timing:

    Pick when color deepens and flesh feels firm-crisp—lines vary widely by clone. Eat fresh quickly; thin skin loses water
    in refrigeration wars. Peak loads track tropical heat and rainfall cycles.'
