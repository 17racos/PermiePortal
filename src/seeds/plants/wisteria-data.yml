  description: "Wisterias are twining leguminous vines famous for long racemes of
    fragrant pea-flowers and for yanking down shoddy pergolas. **Wisteria frutescens**
    (American wisteria) is the polite native option for much of the Southeast: slower,
    less thuggish, still gorgeous. **W. sinensis** and **W. floribunda** are the
    classic Asian species—stunning, heavy, and invasive in many areas if you let
    them fruit and seed.\n\nHeat is usually not the problem;
    mismatched chill or poor pruning is. Give a stout arbor, train a single trunk if
    you want tree-form drama, and do not plant under eaves or power lines unless you
    enjoy expensive regrets.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for best bloom.\nDeep, fertile,
    well-drained soil; consistent moisture while young, somewhat drought-tolerant on
    big roots.\nAvoid soggy roots—Phytophthora does not send thank-you notes.\n\n✂️ Propagation:\n\nSeed (slow, variable, risky for invasiveness on Asian spp.); layering; grafting
    named cultivars; softwood cuttings under mist.\nAmerican wisteria from cuttings
    or reputable native nursery is the permie-bro move.\n\n🌾 Harvest / Best Use Timing:\n\nPrune hard after bloom to control weight; seedpods on Asian spp. mean invasive homework—remove before spread."
  purpose: |-
    - Ornamental: Long fragrant racemes on a stout arbor—woody python if you pick the wrong species and skip pruning.
    - Nitrogen Fixer: Leguminous roots fix nitrogen once nodulated.
    - Wildlife Attractor: Massive spring pollinator draw on flowering wood.
    - Shade Provider: Mature vines shade pergolas and sturdy overstory limbs when trained with judgment.
