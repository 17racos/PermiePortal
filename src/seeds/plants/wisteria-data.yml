  description: "Wisterias are twining leguminous vines famous for long racemes of
    fragrant pea-flowers and for yanking down shoddy pergolas. **Wisteria frutescens**
    (American wisteria) is the polite native option for much of the Southeast: slower,
    less thuggish, still gorgeous. **W. sinensis** and **W. floribunda** are the
    classic Asian species—stunning, heavy, and invasive in many areas if you let
    them fruit and seed.\n\nFlorida and Puerto Rico / subtropical note: heat is not the problem;
    mismatched chill or poor pruning is. Give a stout arbor, train a single trunk if
    you want tree-form drama, and do not plant under eaves or power lines unless you
    enjoy expensive regrets.\n\nSun and water: Full sun for best bloom. Deep, fertile,
    well-drained soil; consistent moisture while young, somewhat drought-tolerant on
    big roots. Avoid soggy roots—Phytophthora does not send thank-you notes.\n\nPropagation:
    Seed (slow, variable, risky for invasiveness on Asian spp.); layering; grafting
    named cultivars; softwood cuttings under mist. American wisteria from cuttings
    or reputable natives nursery is the permie-bro move."
  purpose: |-
    Overstory vine on strong trellis or mature trees (use judgment—do not strangle
    young plantings). Fixes atmospheric nitrogen once nodulated. Massive spring
    pollinator draw. If you pick the wrong species and ignore maintenance, you have
    installed a woody python.
