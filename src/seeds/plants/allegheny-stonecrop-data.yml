  description: "Allegheny stonecrop (Hylotelephium telephioides) is a hardy succulent
    perennial of rocky eastern North American outcrops, forming clumps of blue-green,
    toothed leaves and broad flat heads of pale pink to white flowers that pull late-season
    pollinators. Plants typically stay under 18 inches (45 cm) in flower with a slowly
    spreading base—useful on lean soil where thirsty ground covers throw tantrums.
    In permaculture it is a low-input filler for sun-baked edges, green roofs, and
    stonework where organic matter accumulates slowly but steadily.\n\n☀️💧 Sun and
    Water Requirements:\nFull sun to light partial shade; dense shade stretches stems
    and reduces flowering. Extremely drought-tolerant once rooted; prefers gritty,
    well-drained soil and tolerates poor, shallow substrates. Winter wet on heavy
    clay without slope or amendment can rot crowns—add gravel or plant higher.\n\n
    ✂️ Propagation:\nDivide clumps in spring as new shoots emerge or after flowering
    in early fall while soil remains warm. Detach rosette offsets with a bit of stem
    and root; pot briefly if the bed is not ready. Stem-tip cuttings taken in summer
    root quickly in sharp sand under bright indirect light.\n\n🌾 Harvest / Best Use
    Timing:\nNot a primary food crop for most systems—value is ecological and visual.
    If experimenting with edible uses, research species-specific guidance first; focus
    harvest timing on leaving plenty for pollinators during peak bloom."
