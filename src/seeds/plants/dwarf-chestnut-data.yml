  description: "Dwarf chestnut (Castanea pumila), widely called Allegheny chinquapin,
    is a multi-stemmed nut shrub of dry to mesic woodlands and savannas in eastern
    North America, producing small, sweet nuts in spiny burs on older wood. It is
    not a toy orchard chestnut—yield is modest and bur handling is sincere—but it
    persists on tough sites where timber-form Castanea demands deeper soil. The species
    matters for food forests seeking chestnut flavor without waiting for cathedral
    spacing, and for wildlife that treat chinquapins like gas-station snacks along
    forest edges.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; heavier
    flowering and nut set with more light if soil moisture holds. Prefers well-drained,
    acidic to neutral soils rich in organic matter; tolerates droughty slopes better
    than many forest nuts once established. Avoid wet feet; Phytophthora-sensitive
    relatives make drainage a serious design constraint.\n\n✂️ Propagation:\nSow fresh
    nuts immediately after fall drop; desiccated seed dies quietly.\nGraft improved
    selections onto seedling rootstocks for predictable quality, as wild seedlings
    vary.\n\n🌾 Harvest / Best Use Timing:\nCollect burrs when they split and nuts
    are brown; cure briefly in a breathable tray. Roasting removes residual peel
    cling. Prune for air movement to reduce foliar disease pressure in humid climates."
  purpose: |-
    - Edible: Small nuts are sweet and starchy; suitable for roasting, flour trials, and small-batch baking.
    - Wildlife Attractor: Nuts, catkins, and leaf litter feed birds, mammals, and soil fauna.
    - Mulcher: Leaf drop feeds fungal decomposition typical of oak-family systems.
    - Erosion Control: Clonal thickets stabilize slopes on sandy or rocky ground.
