  description: "The Bird of Paradise (*Strelitzia reginae*) is a striking evergreen
    perennial native to South Africa, renowned for its vibrant flowers that resemble
    a bird in flight. The plant typically reaches heights of 1.2 to 1.8 meters (4
    to 6 feet) with a similar spread, forming clumps of large, banana-like leaves.
    Its unique orange and blue flowers emerge from a horizontal inflorescence, providing
    a tropical aesthetic to gardens and landscapes.\n\n\U0001F31E\U0001F4A7 **Sun
    and Water Requirements:**\nPrefers full sun to partial shade; optimal flowering
    occurs with ample sunlight. Requires moderate watering; soil should be kept moist
    but well-drained to prevent root rot.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nPropagation
    is commonly achieved through division of clumps or by seed. Dividing mature plants
    ensures genetic consistency, while seed propagation may result in variability
    and requires patience, as seedlings can take several years to flower.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nAs an ornamental plant, there is no traditional harvest.
    However, mature flowers can be cut for floral arrangements when fully developed."
