  description: 'Rice (Oryza sativa) is an annual grass species widely cultivated for its edible grains. The plant typically
    grows to heights between 1 and 2 meters, featuring erect stems with smooth surfaces and long, lanceolate leaves. The inflorescence
    is a terminal panicle bearing numerous small spikelets, each containing a single floret. The fruit is a caryopsis, commonly
    known as a rice grain.


    🌞💧 Sun and Water Requirements:

    Rice thrives in full sun and requires abundant water, often grown in flooded fields known as paddies. Consistent moisture
    is crucial throughout its growth cycle.


    ✂️🫘 Methods to Propagate:

    Propagation is primarily through direct sowing of seeds or transplanting seedlings. Seeds are sown in nurseries and later
    transplanted to paddies.


    🧑‍🌾👩‍🌾 When to Harvest:

    Harvest occurs when grains turn golden brown and reach full maturity, typically 3 to 6 months after planting, depending
    on the variety.'
