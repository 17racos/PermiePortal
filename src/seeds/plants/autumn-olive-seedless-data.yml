    flowers, and tart fruit on some lines. The species remains widely invasive in many
    temperate regions; seedlessness does not erase suckering, legacy seed banks, or
    ecological history. Treat this entry as cultivar-aware identification: verify local
    legality and non-native plant guidance before any new planting, regardless of catalog
    adjectives.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light partial shade;
    drought-tolerant on lean soils once established. Avoid wet, airless sites that favor
    root rots on stressed transplants. Irrigation during establishment should taper so
    plants harden off rather than producing floppy extension growth.\n\n✂️ Propagation:\n
    Nurseries historically used cuttings and budding; home propagation can still create
    unwanted spread if material escapes management. Prefer buying from regulated channels
    where legal, and avoid sharing unnamed clones across regions. Renewal prune old wood
    after bloom to keep habit dense where hedges are intentional.\n\n🌾 Harvest / Best
    Use Timing:\nWhere fruit is produced, pick at full color for processing; low-seed
    lines still demand kitchen use plans. If managing out legacy plants, remove flowers
    or young fruit when local control protocols call for cutting reproductive output."
