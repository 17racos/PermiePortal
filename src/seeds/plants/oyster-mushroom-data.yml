  description: "Oysters are the beginner's handshake with log culture — they grow
    on many hardwoods, colonize fast, and forgive a little clumsy technique. In subtropical and tropical Americas pick fresh-cut, living hardwood (oak, sweetgum, poplar types) and keep
    stacks off the ground on pallets or rails. Wet season humidity helps; dry season
    needs soaking pulses. They also run on straw and coffee grounds in buckets if
    you want urban mycopunk. Still: identify the flush; look-alikes exist in the
    wild.\n\n☀️💧 Sun and Water:\n- Shade to bright shade; avoid all-day sun on thin
    logs.\n- Soak or sprinkle logs to trigger fruiting; let them drain fully.\n-
    Bark intact slows drying; vertical or lean-to stacks balance moisture and air.\n\n✂️
✂️ Propagation:
\n- Plug, sawdust, or totem inoculation into green wood.\n- After
    harvest, rest logs; rotate soaking to time flushes with weather."
  purpose: |-
    Oyster mushroom hosts turn thinnings into meals:

    - Edible: Reliable outdoor crop on suitable hardwoods.
    - Medicinal: Popular in supplement hype; separate tradition from marketing.
    - Mulcher: Spent logs become hugel and pathway fill.
    - Soil Improvement: Mycelium exits the log into surrounding organic matter.
