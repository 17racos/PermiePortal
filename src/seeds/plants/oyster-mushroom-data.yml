  practitioner_notes: |-
    Pink oyster (Pleurotus djamor) is the Florida summer species — standard P.
    ostreatus sulks and aborts above 75°F; switch species, not technique.
    Harvest before caps fully flatten and edges begin to wave — velvety cap texture
    and firm, white gills are the window; past it, flavor sharpens and the caps
    drop spores aggressively.
    Spore dumps from mature caps are white and heavy; harvest before this stage
    or you will be cleaning everything in a 10-foot radius.
    Soak trigger on outdoor logs: 12 hours submerged or equivalent sustained rain;
    expect pins within 5-7 days in the right temperature range — if nothing pins
    in 10 days the log may need more rest or warmer weather.
    Spent blocks and logs are not waste — break them into paths, hugel fill, or
    compost; the mycelium keeps working after the production cycle ends.
  growth_habit: White-rot saprobe on hardwood logs, stumps, and lignocellulosic
    substrates; cluster fruiting on log ends and sides
