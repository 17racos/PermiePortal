  description: |-
    Oyster mushrooms are the beginner's handshake with log culture — they colonize fast, tolerate a wider range of substrates than almost any other cultivated species, and forgive clumsy technique better than shiitake or lion's mane. In subtropical Florida, fresh-cut hardwoods (oak, sweetgum, alder, poplar-type species) inoculated with plug or sawdust spawn and kept in shade will produce within 6-12 months. They also run on straw, coffee grounds, cardboard, and supplemented sawdust blocks — the most substrate-flexible edible species for urban and small-scale growing. Multiple Pleurotus species exist (pink oyster P. djamor handles Florida heat better than standard P. ostreatus); match species to season. Wild flushes from dead hardwoods after rain are common and identifiable with care — gilled mushroom ID discipline still applies.
    
    ☀️💧 Sun and Water:
    - Shade to bright shade on logs; thin logs in direct afternoon sun dry out and abort flushes.
    - Soak or sprinkle logs to trigger fruiting in dry periods; allow full drainage between soaks.
    - Bark-intact logs slow drying; vertical or lean-to stacking balances moisture and airflow.
    
    ✂️ Propagation:
    - Plug, sawdust, or totem-style inoculation into green wood.
    - Grain to sawdust blocks for indoor or sheltered production.
    - After harvest, rest logs 4-8 weeks before re-soaking; rotate through a batch to stagger flushes.
    
    🌾 Harvest / Best Use Timing:
    - Flush Oyster Mushroom before caps flatten and spores dust -- younger tissue holds better flavor for most logs and beds.
    - Twist or cut at base; second flushes often follow if humidity stays honest.
    - Refrigerate in paper bags and use within days; saute or pickle rather than letting slimy regret arrive.
  purpose: |-
    Edible: Oyster Mushroom (Pleurotus ostreatus) in the edible role draws on field reality: djamor handles Florida heat better than standard P. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Medicinal: Medicinal use stays grounded in what growers actually report: - Bark-intact logs slow drying; vertical or lean-to stacking balances moisture and airflow. -- keeps informed-adult herbal capacity on-site where drying, teas, and tinctures fit your actual risk tolerance
    Mulcher: Oyster Mushroom tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Soil Improvement: Oyster Mushroom accelerates tilth gains when residues and roots are planned into rotations instead of left as accidental thatch -- accelerates organic matter and biology gains in tired beds when managed as part of a rotation

  companions:
