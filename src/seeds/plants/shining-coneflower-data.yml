  description: 'Shining coneflower (Rudbeckia nitida) is a robust perennial of moist prairies and wet meadows, with glossy
    leaves and bright yellow ray flowers around a tall greenish central cone on stems reaching 3–6 feet (0.9–1.8 m). It tolerates
    clay and seasonal wetness better than many dry-land rudbeckias, making it valuable in rain gardens, pond margins, and
    sunny swales. Late-season bloom feeds pollinators when earlier flowers retire.


    ☀️💧 Sun and Water Requirements:

    Full sun for stiff stems and dense bloom; light shade reduces flower count. Moist to average soils suit it; tolerates
    short dry downs once established but looks freshest with steady moisture. Mulch to keep roots cool; avoid stagnant water
    over crowns in humid heat.


    ✂️ Propagation:

    Divide clumps in spring; sow seed with cold stratification or direct-sow in fall. Cut back dead stems in late winter if
    tidy gardens matter.


    🌾 Harvest / Best Use Timing:

    Cut flowers when rays are fully open for bouquets. Leave seed heads for finches. Peak bloom tracks late warm season.'
