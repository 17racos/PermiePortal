  description: "Saltbush (Atriplex halimus) is a silvery Mediterranean shrub often
    4–10 feet tall with scaly, drought-tolerant leaves and inconspicuous flowers followed
    by small fruits. It thrives in saline or alkaline soils where many plants fail,
    making it a workhorse for coastal gardens, drylands, and reclamation plantings;
    the foliage reads as a soft gray mound that can be clipped into a hedge.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun; lean, well-drained soil. Tolerates seaside
    spray and poor fertility.\n- Drought-tolerant when established; in Florida and
    Puerto Rico’s wet season, plant on mounded sand or gravel so roots never sit
    anaerobic for weeks—saltbush wants periodic dry-down between rains.\n\n✂️ Methods
    to Propagate:\n- Seeds: sow in spring in a sandy mix; keep warm until germination.\n-
    Cuttings: hardwood cuttings taken in cool months root under mist in a sharp sand/perlite
    blend.\n\n🌾 When to Harvest:\n- Harvest young leaves for cooked greens or salt-flavored
    seasoning in moderation; clip for livestock fodder during active growth. Avoid
    heavy stripping of weak plants in the hottest drought stress."
  purpose: |-
    Saltbush fits brackish edges, dry berms, and salt-affected urban soils.

    - Edible: Young leaves are used like spinach with a naturally salty note—balance with fresh dishes.
