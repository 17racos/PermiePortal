  description: 'Sunshine mimosa is a native Florida prostrate legume: feathery compound leaves, pink powderpuff flowers, and
    stems that hug the ground while it quietly fixes nitrogen like a polite anarchist. It handles sun, heat, and occasional
    wet feet better than a lawn ever will, and laughs at drought once established. Good for slopes, path edges, and anywhere
    you want living mulch without pretending turfgrass is ecological.


    🌞💧 Sun and Water Requirements:

    - Full sun to light shade; blooms heavier with more sun.

    - Any reasonable soil; tolerates poor, sandy Florida dirt and seasonal inundation.

    - Water to establish; afterward it is genuinely low-input compared to fussy exotics.


    ✂️🌱 Methods to Propagate:

    - Seed: scarify or pour near-boiling water over seed, soak overnight, then sow warm.

    - Cuttings with a node root easily in moist media.

    - It naturally layers—pinned stems root without a TED talk.


    🧑‍🌾 When to Harvest:

    - Ornamental / ecosystem use: occasional trim to keep it off sidewalks or neighbor aesthetics. Flowers feed pollinators;
    leave some blooms if you are not a buzzkill.'
  purpose: '- Ground Cover: Forms a durable, walk-tolerant mat (not golf-green turf—manage expectations).

    - Erosion Control: Fibrous roots and spreading habit stabilize sandy banks.

    - Nitrogen Fixer: Legume symbiosis feeds the soil food web under fruit trees.

    - Pollinator: Pink puff flowers attract bees and other pollinators in warm months.'
