  description: "Sunshine mimosa is a native Florida prostrate legume: feathery compound
    leaves, pink powderpuff flowers, and stems that hug the ground while it quietly
    fixes nitrogen like a polite anarchist. It handles sun, heat, and occasional wet
    feet better than a lawn ever will, and laughs at drought once established. Good
    for slopes, path edges, and anywhere you want living mulch without pretending
    turfgrass is ecological.\n\n🌞💧 Sun and Water Requirements:\n- Full sun to light
    shade; blooms heavier with more sun.\n- Any reasonable soil; tolerates poor, sandy
    Florida dirt and seasonal inundation.\n- Water to establish; afterward it is
    genuinely low-input compared to fussy exotics.\n\n✂️🌱 Methods to Propagate:\n-
    Seed: scarify or pour near-boiling water over seed, soak overnight, then sow warm.\n-
    Cuttings with a node root easily in moist media.\n- It naturally layers—pinned
    stems root without a TED talk.\n\n🧑‍🌾 When to Harvest:\n- Ornamental / ecosystem
    use: occasional trim to keep it off sidewalks or neighbor aesthetics. Flowers feed
    pollinators; leave some blooms if you are not a buzzkill."
  purpose: |-
    - Ground Cover: Forms a durable, walk-tolerant mat (not golf-green turf—manage expectations).
    - Erosion Control: Fibrous roots and spreading habit stabilize sandy banks.
    - Nitrogen Fixer: Legume symbiosis feeds the soil food web under fruit trees.
    - Pollinator: Pink puff flowers attract bees and other pollinators in warm months.
  companions:
  - Saw Palmetto
  - Beautyberry
  - Elderflower
  cautions:
  - None documented
  pests:
  - Aphids
  - Spider Mites
  - Scale Insects
  practitioner_notes: |-
    Inoculate with the correct rhizobia group—wrong packet gives pretty leaves and empty nodules.
    Morning photos for ID are useless if you only look at dusk—check midday nectar presentation too.
    Shear ragged mats after heat waves; two weeks of ugly beats six months of thatch rot.
    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.
  growth_habit: Tree
