  description: |-
    Arracacha is the Andean root crop that tastes like carrot met celery met potato and forgot to be boring. Creamy yellow roots form from a crown of stems; leaves resemble parsley's dramatic cousin. In Florida and Puerto Rico it is marginal in the hottest lowland pockets—think cool microclimates, afternoon shade in summer, and zero heroics during heat waves. Treat it like a pampered perennial carrot guild member, not a set-and-forget sweet potato.

    ☀️💧 Sun and Water Requirements:
    - Part sun / bright shade in hot subtropics; cooler highland conditions allow more sun.
    - Deep, loose, fertile loam with steady moisture—swings between bone dry and swamp rot the crown.
    - Heavy mulch to buffer soil temperature and flatter the roots.

    ✂️ Methods to Propagate:
    - Crown divisions and offsets from established plants—primary practical method.
    - True seed is rare in cultivation; commercial propagation is vegetative.

    🌾 Harvest notes:
    - Dig roots when crowns go dormant or after 8–12 months growth; handle like bruise-prone potatoes.
  purpose: |-
    Arracacha slots into a hand-tended food guild where soil stays loose and cool:

    - Edible: Starchy roots and sometimes young stems—cooking unlocks the flavor; raw checks are cautious nibbles only.
    - Soil Improvement: Heavy mulch and steady organic inputs flatter the crown; the crop rewards living soil, not scraped sand.
    - Mulcher: Disease-free tops and old leaves can be chopped and dropped to feed fungi and buffer soil moisture between rains.
    - Biomass: Seasonal leaf and stem bulk becomes on-site compost fodder so you import less bagged matter in a small system.
  companions:
  - Comfrey
  - Yacon
  - Legumes
  avoid:
  - Baking full-sun sand without irrigation
  - Waterlogged clay that murders crowns
  pests:
  - Aphids
  - Rootknot Nematodes
  - Cutworms
