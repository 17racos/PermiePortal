  - Parsnip Canker
  - Rootknot Nematodes
  - Swallowtail Caterpillar
  practitioner_notes: 'Crowns rot if mulch packs wet against the stem—keep a dry collar like you would for potato hills.

    Roots oxidize brown fast when peeled—drop into acidulated water if presentation matters.

    Nematode hotspots show knobby forked roots—rotate beds and add organic matter before replanting divisions.'
