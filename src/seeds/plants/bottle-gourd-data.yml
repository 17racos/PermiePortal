  description: 'Bottle gourd is humanity’s original canteen project—vines that climb like they owe money, young fruit edible
    like summer squash, mature fruit dried into containers, instruments, and birdhouses your uncle swears are artisanal.


    Plant after soil warms; long season helps huge gourds cure on the vine before first frost. Downy mildew arrives on schedule
    every year—plan succession or resistant mindset.


    ☀️💧 Sun and Water Requirements:


    Full sun, fertile well-drained soil, consistent moisture during fruit sizing; cut water as fruits mature for hard-shell
    types.


    ✂️ Propagation:


    Direct-sow or transplant carefully; provide trellis or regret ground rot.


    🌾 Harvest / Best Use Timing:


    Pick young fruit for summer-squash use; let mature fruits cure on-vine before first frost for hard-shell containers and
    crafts.'
