    on the vine before first frost. Downy mildew arrives on schedule every year—plan
    succession or resistant mindset.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun, fertile well-drained
    soil, consistent moisture during fruit sizing; cut water as fruits mature for hard-shell
