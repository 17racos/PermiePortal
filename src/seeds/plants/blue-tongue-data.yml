    \ reaches 20–40 feet (6–12 m) in cultivation with a dense crown and flaky bark on older trunks. In humid subtropical to\
    \ tropical plantings it works as a hedge tree, wind-sift screen, and bird-feeding shrub that doubles as a backyard snack\
    \ if fruit quality matches your selected clone.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun to partial shade;\
    \ young plants establish faster with afternoon shade in hot districts. Prefers rich, moist, well-drained soils with steady\
    \ organic mulch; tolerates short dry spells once rooted but fruits better with even moisture through flowering. Protect\
    \ from hard frost; marginal sites need wind shelter and attentive establishment watering.\n\n✂️ Propagation:\nSow fresh\
    \ seed soon after cleaning; viability fades if allowed to dry excessively. Semi-hardwood cuttings under humidity root\
    \ during warm months. Select named hedge types if you need predictable height and fruiting.\n\n \U0001F33E Harvest / Best\
    \ Use Timing:\nPick fruit when deep blue-purple, slightly soft, and aromatic—flavor varies by tree. Use fresh, in jams,\
    \ or fermented; seeds are small but present. Net portions you need for humans if local birds treat the crop as municipal\
    \ service."
