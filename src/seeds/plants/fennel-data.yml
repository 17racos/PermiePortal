  description: "Fennel (Foeniculum vulgare) is a tall, aromatic, and feathery-leaved
    perennial herb that grows up to 1.8 meters (6 feet) tall. It produces umbrella-shaped
    clusters of small yellow flowers in summer, which attract beneficial insects.\n\nThis
    plant thrives in well-drained, fertile soil and is highly drought-resistant once
    established. It is commonly used for its edible bulbs, seeds, and leaves, as well
    as for medicinal purposes.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n-
    Prefers full sun and thrives in warm climates.\n- Requires well-drained, loamy,
    or sandy soil.\n- Drought-tolerant once established but benefits from occasional
    deep watering.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct sow in early
    spring or fall, as fennel does not transplant well.\n- Self-seeding: Readily reseeds
    if flower heads are left to mature.\n- No division: Root division is not commonly
    used for propagation.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Leaves can be harvested anytime during the growing season.\n- Bulbs should be
    harvested when they reach 8–10 cm (3–4 inches) in diameter.\n- Seeds are collected
    in late summer when flower heads dry and turn brown."
  purpose: |-
    Fennel serves multiple functions in a permaculture system:

    - Edible: Bulbs, seeds, and leaves are used in cooking, herbal teas, and natural remedies.
    - Medicinal: Traditionally used for digestion, colic relief, and as a mild expectorant.
    - Pollinator: Flowers attract bees, butterflies, and predatory wasps.
    - Wildlife Attractor: Provides food for swallowtail butterfly larvae.
    - Dynamic Accumulator: Extracts minerals such as sulfur and potassium, enriching nearby soil.
    - Border Plant: Used as a visual and functional garden divider.
  companions:
