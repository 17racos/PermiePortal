  description: "Wild bergamot (Monarda fistulosa) is a fragrant perennial of North American prairies and open woods, with lavender tubular flowers in rounded clusters atop square stems usually 2–4 feet (60–120 cm). It feeds long-tongued bees, hummingbird moths, and hummingbirds where ranges overlap. Leaves smell like oregano’s wild cousin—use that fact in teas and pest-confusion sprays where ethics and ID align.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light partial shade; best flowering with good light and airflow. Average to slightly moist, well-drained soils suit it; tolerates clay if drainage moves. Avoid overhead evening watering in humid climates.\n\n✂️ Propagation:\nDivide clumps in spring; sow seed with cold stratification. Cut back after flowering to refresh foliage.\n\n🌾 Harvest / Best Use Timing:\nHarvest leaves and flowers for teas when blooms are active—follow vetted guidance. Peak bloom tracks mid-summer heat."
  purpose: |-
    Pollinator: Monarda fistulosa heads are whorls of narrow lavender tubes that release nectar only after bees push past exerted stamens -- hummingbird moths and migrating hummingbirds work the same heads in humid evenings when daytime bee traffic slows.
    Medicinal: Thymol- and carvacrol-rich leaf tea is traditional for sweat-inducing cold protocols and topical fungal washes -- high volatile oil means pregnancy limits and skin photosensitivity follow the same rules as oregano oil concentrates.
    Wildlife Attractor: Seed nutlets linger into January on stiff stalks for juncos along prairie edges -- hollow stems also shelter cavity-nesting native bees if you cut some clumps at eighteen inches (45 cm) in rotation each March.
    Ornamental: Lavender lipped bracts read graphic from ten feet (3 m) back in matrix plantings with little bluestem -- mildew shows as white powder on lower leaves in stagnant air, so spacing reads as both aesthetics and disease prevention.
  companions:
  - Little Bluestem — warm-season grass matrix sharing sun and drainage
  - Milkweed — complementary forb for monarch habitat in pollinator strips
  - Prairie Coneflower — forb neighbor with contrasting flower architecture
  cautions:
  - Powdery Mildew — improve spacing and morning watering discipline
  - Strong aroma divides households—site seating deliberately
  pests:
  - Aphids
  - Japanese Beetles
  - Spider Mites
  practitioner_notes: |-
    Square stems rat out mint family posers—roll stems before you brew mystery teas.
    Mildew is a humidity receipt—airflow beats panic sprays in honest gardens.
    Hummingbird moths look like flying mice—do not swat your pollinators mid-awe.
    Seed heads feed finches—deadhead paths, not entire colonies, if you want both order and birds.
  growth_habit: Aromatic perennial; lavender tubular flower clusters; prairies and edges
