  description: 'Sand pine (Pinus clausa) is a small to medium pine of deep sandy ridges and scrub in the southeastern United
    States, often multi-trunked with twisted form in harsh exposure and serotinous cones that open after fire in many populations.
    Heights of 20–40 feet (6–12 m) are typical, though stunted forms hug windswept dunes. It stabilizes sand, feeds squirrels
    with seeds, and teaches patience to anyone expecting timber-straight specimens.


    ☀️💧 Sun and Water Requirements:

    Full sun for dense needles and reliable cone production. Deep, acidic, excessively drained sands are home; tolerates drought
    once established. Avoid alkaline or compacted clay unless you enjoy pine funerals.


    ✂️ Propagation:

    Sow seed; heat may be needed to open serotinous cones—follow restoration nursery protocols. Transplant small seedlings
    with root balls intact. Prune only for clearance; do not top pines.


    🌾 Harvest / Best Use Timing:

    Pine straw mulch can be raked sustainably from needle drop—avoid stripping living crowns. Timber use is modest; ecological
    value often exceeds board feet. Growth flushes follow warm wet periods.'
  purpose: '- Erosion Control: Roots bind deep sand where broadleaf trees fail without irrigation theater.

    - Wildlife Attractor: Seeds feed squirrels and birds; canopy shelters scrub fauna.

    - Windbreaker: Multi-trunk clumps blunt steady coastal-plain winds when grouped.

    - Biomass: Needle drop feeds acidic mulch banks under oaks and palmettos.'
  companions:
  - Scrub Palmetto — shared scrub architecture with complementary fan leaves
  - Longleaf Pine — taller pine neighbor in fire-managed sandhill systems where both occur
  - Wax Myrtle — nitrogen-fixing shrub layer at scrub margins
  cautions:
  - Fire ecology — many populations need periodic fire for recruitment; follow regulations
  - Alkaline soil — chlorosis and chronic sulking
  pests:
  - Aphids
  - Bagworm
  - Scale Insects
  - Spider Mites
  practitioner_notes: 'Pinus clausa is the scrub pine—do not expect loblolly height on dune sand without embarrassment.

    Serotiny means cones wait for heat—explain that before neighbors panic about “dead cones.”

    Crooked trunks are habitat—straight poles are plantation cosplay.

    Needle drop is mulch income—rake paths, not crowns, unless you hate the tree.'
