  description: "The Nectarine Tree (Prunus persica var. nucipersica) is a deciduous
    fruit tree producing smooth-skinned, juicy fruits similar to peaches. Typically
    reaching heights of 4–6 meters (13–20 feet), nectarines are prized for their sweet
    flavor and are consumed fresh, dried, or used in cooking and baking.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Requires full sun exposure to ensure healthy growth
    and fruit development.\n- Prefers well-drained, loamy soils with a slightly acidic
    to neutral pH (6.0–7.0).\n- Needs regular watering, especially during dry periods,
    to maintain soil moisture without waterlogging.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Grafting: Common method to propagate specific cultivars, ensuring fruit quality
    and disease resistance.\n- Seeds: Can be grown from seeds, but the resulting trees
    may not produce true-to-type fruit and can take longer to bear.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Fruits typically ripen in late spring to summer, depending
    on the variety and climate.\n- Harvest when the fruit develops full color and
    yields slightly to gentle pressure.\n- Handle with care to avoid bruising, and
    consume or process shortly after harvesting for best flavor and quality."
  purpose: |-
    Nectarine trees offer several benefits in permaculture designs:

    - Edible: Provide sweet, nutritious fruits rich in vitamins A and C, dietary fiber, and antioxidants.
