  description: "Blue grama (Bouteloua gracilis) is a warm-season bunchgrass of shortgrass prairie and dry foothills from central\
    \ Canada to Mexico, famous for eyebrow-shaped one-sided seed heads that hover above fine blue-green blades. It typically\
    \ grows 6–20 inches (15–50 cm) depending on rainfall, forming dense tufts that outcompete weeds once established. In permaculture\
    \ it is a low-input lawn alternative, path edge stabilizer, and forage component that respects water budgets better than\
    \ cool-season turf cosplay.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun; shade weakens stands and invites weed\
    \ takeover. Extremely drought-tolerant with deep roots after establishment; occasional deep watering speeds establishment\
    \ the first year. Tolerates alkaline, rocky, and lean soils; hates prolonged waterlogging without air.\n\n✂️ Propagation:\n\
    \ Sow seed in warm soil after frost risk; keep weed pressure down while seedlings are tiny. Divide dormant bunches in\
    \ early spring for landscape plugs. Use local ecotype seed when restoring rainfall patterns matched to your site.\n\n\U0001F33E\
    \ Harvest / Best Use Timing:\nFor grazing, rotate before severe defoliation during drought—warm-season grasses recover\
    \ from crown reserves when rain returns. For seed harvest, collect when spikelets dry and detach; ornamental mowing can\
    \ wait until after winter interest if you like the seed-flag aesthetic."
