    Southern magnolia is glossy evergreen ego with lemon-cream flowers and a leaf-drop habit that refuses minimalism. Native to the Southeast, it reads "estate driveway" but works as heat-season shade and bird cover in food forests if you accept litter.

    ☀️💧 Sun and Water Requirements:
    - Full sun to part shade; denser in sun, thinner in shade — pick your aesthetic tax.
    - Moist, acidic, organic-rich soil preferred; tolerates clay if drainage exists.
    - Drought-tolerant when established but looks richer with summer water.

    ✂️ Methods to Propagate:
    - Seeds: stratify; slow road to treehood, good for cheap experiments.
    - Cuttings: semi-hardwood with auxin and humidity for patient propagators.
    - Grafting and air layering used for named cultivars with predictable form.
