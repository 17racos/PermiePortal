  description: 'Prairie turnip is a Great Plains legume with a starchy taproot that fed humans long before grocery aisles—blue-purple
    flowers, silvery leaves, and a root that does not appreciate rushed harvest. It is slow from seed; wild harvest has ethics
    and ID requirements. subtropical and tropical Americas is outside its native heartland; treat trials as experimental unless
    you are deliberately mimicking prairie drainage and sun.


    ☀️💧 Sun and Water Requirements:

    - Full sun; open grassland vibes.

    - Well-drained, often calcareous or sandy soils; drought-tolerant once established—wet winter clay is rude.


    ✂️ Methods to Propagate:

    - Seeds: scarify and stratify protocols improve germination—research landrace notes.

    - Careful division rare; seed is standard.


    🌾 Harvest notes:

    - Roots after several years of growth in suitable climates; overharvesting wild stands is how traditions end—grow your
    own.'
  purpose: '- Edible: Traditional cooked starch food after proper identification and preparation.

    - Nitrogen Fixer: Nodules on prairie soils—pair with appropriate rhizobia in garden tests.

    - Wildlife Attractor: Flowers for native bees in range.

    - Soil Improvement: Deep root architecture on dry sites.'
