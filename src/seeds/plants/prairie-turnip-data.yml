description: |-
  Prairie turnip is a Great Plains legume with a starchy taproot that fed humans long before grocery aisles—blue-purple flowers, silvery leaves, and a root that does not appreciate rushed harvest. It is slow from seed; wild harvest has ethics and ID requirements. subtropical and tropical Americas is outside its native heartland; treat trials as experimental unless you are deliberately mimicking prairie drainage and sun.

  ☀️💧 Sun and Water Requirements:
  - Full sun; open grassland vibes.
  - Well-drained, often calcareous or sandy soils; drought-tolerant once established—wet winter clay is rude.

  ✂️ Methods to Propagate:
  - Seeds: scarify and stratify protocols improve germination—research landrace notes.
  - Careful division rare; seed is standard.

  🌾 Harvest notes:
  - Roots after several years of growth in suitable climates; overharvesting wild stands is how traditions end—grow your own.
purpose: |-
  Edible: Pediomelum esculentum starchy taproots roast or boil like prairie potatoes after positive ID and respectful harvest ethics on wild stands -- slow from seed; cultivate dedicated beds instead of stripping remnant prairies.
  Nitrogen Fixer: Rhizobia nodulate roots on dry Great Plains soils, feeding companion grasses through nodule turnover -- inoculate new garden soil with prairie legume inoculant so nodules fill instead of staying empty jewelry.
  Wildlife Attractor: Purple papilionaceous flowers feed native bees during early-summer prairie bloom -- foliage hosts specialist larvae where local ecotypes still exist; do not transplant wild-dug roots without permits.
  Soil Improvement: Deep taproots and periodic top dieback drill organic matter channels into calcareous sand -- pair with leadplant and bluestem so biomass cycles return without single-species thatch mats.
