  description: 'Rhapidophyllum hystrix is the low, clumping palm that laughs at winters that murder lesser fronds. Fan leaves,
    sharp needle-like spines protecting the crown — yes, it earned the name — and a native range hugging the Southeast. Excellent
    understory / edge palm for shady, moist hammocks and food forest transition zones.


    ☀️💧 Sun and Water Requirements:


    Part shade to shade in hot climates; tolerates more sun with ample moisture.

    Likes steady soil moisture and organic matter; tolerates short dry spells once established.

    Avoid baking it on reflective heat walls without irrigation training wheels.


    ✂️ Propagation:


    Seeds: slow germination, long game.

    Division of clumps possible but heavy work and spiny — dress like you mean it.


    🌾 Harvest / Best Use Timing:


    Ecological / landscape — leave the clump intact; fallen material becomes mulch.'
  purpose: '- Wildlife Attractor: Low clumping cover and fruiting habitat without skyscraper height.

    - Erosion Control: Fibrous roots stabilize shady, moist edges.

    - Windbreaker: Dense spiny clumps buffer wind at ground level—place paths away from petting-zoo fantasies.'
  companions:
  - Saw Palmetto
  - Beautyberry
  - Wild Ginger
  cautions:
  - Kid-high planting beds along narrow walkways
  - Deep dry shade on pure sand with zero mulch
  pests:
  - Coconut Mite
  - Ganoderma Butt Rot
  - Heart Rot
  - Palm Weevil
  - Palmetto Weevil
  - Red Palm Weevil
  - Rhinoceros Beetle
  - Scale Insects
  practitioner_notes: 'Trunk stays mostly subterranean—what looks shrubby may be crown on buried stem.

    Spines on petioles are serious—plant back from paths kids cut through.

    Slow from seed—division of clustering offsets is the practical landscape route.'
