  description: 'Chalk maple (Acer leucoderme) is a small deciduous tree of dry limestone and chalky soils in the southeastern
    United States, forming a rounded crown typically 20–35 feet (6–11 m) with smooth pale bark on younger trunks and three-lobed
    leaves reminiscent of sugar maple but smaller. It is a drought-tough native for rocky savannas, parking-lot islands with
    depth, and oak understories where alkaline pockets appear. Fall color varies from soft yellow to orange in cool years.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; tolerates heat better than many maples when roots are mulched and established. Well-drained,
    alkaline to neutral soils are its specialty; performs poorly in acidic peat bogs. Drought-tolerant relative to swamp maples
    once taproots develop.


    ✂️ Propagation:

    Sow fresh seed after stratification; germination can be irregular. Graft or bud selected forms onto seedling rootstocks.
    Transplant young trees during dormancy; protect trunks from sunscald in open sites.


    🌾 Harvest / Best Use Timing:

    Sap sugar is low—this is not a syrup species for most sites. Enjoy ornamental bark and fall color; collect local seed
    for restoration genetics. Prune for clearance in late winter; avoid heavy summer cuts that stress heat-loaded trees.'
  purpose: |-
    Wildlife Attractor: Chalk Maple layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Shade Provider: Chalk Maple throws enough canopy to run ginger-class understory or to blunt afternoon heat on west-facing beds -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
    Ornamental: Chalk Maple earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Mulcher: Chalk Maple tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds

  companions:
  - Texas Oak — shared dry calcareous woodlands in southern parts of the range
  - Redbud — understory pink bloom before maple leaves expand; both handle thin rocky soils
  - Juniper — evergreen contrast on limestone barrens where maple crowns break vertical monotony
  cautions:
  - Compacted urban pits — slow establishment unless root ball is wide and mulch is generous
  - Overirrigation on clay — root rots in constantly soggy winter soils
  pests:
