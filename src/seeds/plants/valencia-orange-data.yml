description: |-
  Valencia orange is a late-holding sweet orange (Citrus sinensis) type prized for high juice yield, balanced acid, and the ability to hang on the tree while later flushes mature—useful where staggered harvest spreads labor. Trees are classic evergreen citrus with glossy leaves, fragrant bloom, and heavy crops that reward honest pruning and feeding schedules in humid subtropical plantings. It anchors home-scale juicing and small-scale processing because the fruit stores on-tree better than many early navels.

  Full sun for brix and peel integrity during long hang times. Consistent soil moisture without saturation; long drought followed by flood splits rinds and invites rot. Wind can scar peel; shelter edges or accept cosmetic peel if juice is the goal.

  Grafted trees on tested rootstocks match regional soil and disease pressures. Seedlings are for curiosity, not for matching known Valencia clones. Renew old blocks by replanting or topworking with professional timing.

  Taste-test weekly once color shifts; acid drops and sugar climbs over the season. Juice within days of picking for brightest flavor; frozen juice holds well if strained. Leave some canopy leaves when stripping heavy loads—sunburned twigs are expensive art.
purpose: |-
  Edible: Valencia-type Citrus sinensis hangs green into summer while sugar climbs -- juice yield and acid balance beat early navels for backyard bottling marathons.
  Medicinal: Flavedo oil and flavonoids show up in zest and pulp -- vitamin C is real; furanocoumarin drug-interaction risk is lower than grapefruit but not zero for sensitive meds.
  Pollinator: White waaxy citrus flowers perfume cool-season orchards -- honeybees work clusters while you schedule thinning for fruit size.
  Wildlife Attractor: Split fruit on the ground feeds raccoons and rats faster than humans -- harvest drops or accept urban safari.
  Biomass: Annual pruning yields chipper loads of glossy leaves -- compost in-place if HLB and canker status allow; otherwise solarize or export chips per local quarantine sense.
companions:
  - Comfrey — mineral-rich mulch cuts fed outside the trunk zone.
  - Lemongrass — heat-tolerant edge grass that marks irrigation stops and pairs with citrus cuisine.
  - Nasturtium — aphid diversion and edible flowers along the orchard margin.
