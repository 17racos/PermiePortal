  practitioner_notes: |-
    Regreening happens in warm hangs—color lies; sugar tells.
    Heavy on-tree storage invites drywood—scout before you promise gallons to neighbors.
    Thinning crowded clusters improves rind quality where humidity drives fungal cheer.
    If juice ferments overnight in the fridge, your sanitation story needs editing.
