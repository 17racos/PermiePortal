  description: "Viper bugloss is a dramatic biennial — first year a bristly rosette,
    second year a spike of intense blue flowers that honey bees mob. It reseeds
    like it has something to prove. Note the dark side: it is listed invasive in
    parts of North America, and honey heavy on Echium can carry alkaloids — another
    reason backyard beekeepers should know their bloom calendar.\n\nsubtropical and tropical Americas
    is on the warm edge; it may finish its life cycle fast in hot wet summers. Treat
    as a self-limiting experiment, deadhead if you fear spread, and pull volunteers
    where they are unwelcome.\n\n☀️💧 Sun and Water:\n- Full sun for stiff, upright
    bloom.\n- Well-drained, poor-to-average soil; too much fertility = flop.\n-
    Moderate water; drought-tolerant once taproot develops.\n\n✂️ Propagation:\n-
    Seed in late summer or fall; needs light to germinate — surface sow.\n- Thin
    to avoid crowding rosettes."
  purpose: |-
