  description: 'Weeping lovegrass (Eragrostis curvula) is a warm-season bunchgrass from southern Africa, widely planted for
    erosion control and fine-textured ornamental borders, forming dense fountains of narrow leaves and airy panicles on plants
    about 2–3 feet (60–90 cm) tall. It tolerates heat, drought, and poor soils once established. Check regional invasive lists—some
    areas classify lovegrasses as problematic.


    ☀️💧 Sun and Water Requirements:

    Full sun for upright fountains; shade yields thin patches. Well-drained sandy to loamy soils suit it; drought-tolerant
    after establishment. Water deeply to establish; avoid waterlogging.


    ✂️ Propagation:

    Sow seed in warm soil; divide bunches in spring. Cut back in late winter before new growth.


    🌾 Harvest / Best Use Timing:

    Primarily functional and ornamental—seed can spread; manage seedheads near natural areas. Peak growth follows summer heat.'
  purpose: '- Erosion Control: Fibrous roots stabilize disturbed slopes and roadsides quickly.

    - Ornamental: Weeping habit softens hardscapes and gravel gardens.

    - Biomass: Supplies fine mulch residue when cut and dropped in controlled plantings.

    - Border Plant: Defines edges along paths and utilities in hot climates.'
