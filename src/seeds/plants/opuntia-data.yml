  practitioner_notes: |-
    Glochids are invisible until they are not—torch hairs off pads if tradition matches your fire policy.
    Weedy Opuntia spreads where birds plant it—harvest fruit before the neighborhood becomes a pincushion.
    Cold + wet is the villain—grit under crowns beats sympathy posts.
    Nopal slime is real—grill or blanch before you judge texture forever.
