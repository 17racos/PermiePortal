---
- common_name: Edible Cactus
  slug: opuntia
  scientific_name: Opuntia ficus-indica
  family: Cactaceae
  picture: opuntia.jpg
  zone: 8-11
  layers: [Shrub]
  plant_function: [Edible, Medicinal, Wildlife, Windbreak]
  growth_rate: Fast
  mature_height: 6-15 ft
  sun: Full Sun
  water: Very Low
  soil: Sandy, Well-drained
  propagation: [Cuttings]
  companions: [Agave, Aloe, Moringa]
  description: >-
    Prickly pear cactus with flat paddle-shaped pads (nopales) and fruit (tunas)
    both edible. Pads harvested young and cooked as a vegetable — mucilaginous
    texture, used extensively in Mexican cuisine. Fruit sweet when ripe. Extremely
    drought-tolerant. Useful as a living barrier. Remove spines before eating.
    One of the most productive edible plants per unit of water used.
