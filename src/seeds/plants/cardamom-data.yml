  description: "Cardamom (*Elettaria cardamomum*) is an herbaceous perennial native
    to tropical regions of India, Burma, and Sri Lanka. It forms clumps up to 5.5
    meters (18 feet) tall, with lush, bright green, lance-shaped leaves up to 60 centimeters
    (24 inches) long, arranged alternately on pseudostems. The plant produces white,
    butterfly-shaped flowers with reddish-purple markings, occurring in clusters near
    the base on stems up to 1 meter (3.3 feet) long. The fruit is a light green, three-sided
    capsule containing 15-20 aromatic black seeds.\n\n\U0001F31E\U0001F4A7 Sun and
    Water Requirements:\nCardamom thrives in partial shade to full shade conditions,
    preferring loamy, well-draining soil with an acidic pH. It requires consistent
    moisture, so regular watering is essential to keep the soil evenly moist but not
    waterlogged.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation is typically achieved
    through division of rhizomes. This should be done during the warm season, ensuring
    each division has at least one healthy shoot and a portion of the root system.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nThe plant begins flowering at 2-3 years of age, with white flowers
    appearing in spring and summer. The fruiting period is approximately 120 days
    after flowering. Harvest the pods just before they fully ripen to maintain their
    aromatic qualities."
