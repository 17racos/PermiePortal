  description: "Konjac is the elephant-foot yam famous for glucomannan noodles and
    jelly that bounce like science. Same genus vibe as suran but different species —
    konjac corms become shirataki after processing, not mash-and-pray yam fries.
    Hardy oddity in warm zones; dormant corms survive mild winters with mulch. In
    subtropical and tropical Americas, site in part shade with excellent drainage and dry winter
    dormancy; humid wet seasons favor rapid leaf growth if corms stay off saturated
    pads.\n\n☀️💧
    Sun and Water:\n- Bright shade to filtered sun; hot dry sun scorches petioles.\n-
    Moist while in leaf; almost dry when dormant to prevent rot.\n\n✂️ Propagation:\n-
    Offset cormlets split at dormancy.\n- Tissue culture and commercial corms for
    food industry — home growers use offsets.\n\nFlower smells like a dare; your
    nose has been warned."
  purpose: |-
