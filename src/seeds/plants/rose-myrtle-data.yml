  description: 'Rose myrtle (Rhodomyrtus tomentosa) is an evergreen shrub native to southern and eastern Asia, naturalized
    in parts of the humid subtropics and tropics, bearing aromatic leaves, pink-purple flowers, and dark edible berries about
    the size of large grapes. Plants typically reach 3–8 feet (0.9–2.4 m), forming dense mounds that tolerate pruning into
    hedges. Fruit flavor is sweet-tart with rose-guava perfume—valuable where myrtle rust policies still allow planting.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright partial shade; best fruiting in strong light. Rich, well-drained, slightly acidic soils mirror native
    sites; mulch with organic matter. Steady moisture through warm periods sizes fruit; short drought once established is
    tolerated but shows on leaf margins.


    ✂️ Propagation:

    Sow fresh seed; semi-hardwood cuttings root under humidity. Prune after harvest for hedge shape; open interior occasionally
    for airflow in rainy climates.


    🌾 Harvest / Best Use Timing:

    Pick berries when fully dark and slightly soft; eat fresh or process into jellies and wines where tradition exists. Peak
    loads track warm wet seasons rather than temperate months. Net only if regulations and ethics allow—birds adore the crop.'
  purpose: '- Edible: Aromatic fruit diversifies warm-climate desserts and ferments where acidity balances sugar.

    - Wildlife Attractor: Flowers feed bees; fruit feeds birds when sharing is intentional.

    - Ornamental: Downy foliage and pink blooms justify shrub borders even in off-years.

    - Border Plant: Responds to shearing for screens along paths and poultry paddocks.'
