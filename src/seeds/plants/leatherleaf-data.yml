  description: |-
    Leatherleaf (Chamaedaphne calyculata) is an evergreen shrub of cold acidic bogs and peatlands, with small, leathery alternate leaves and racemes of white, urn-shaped flowers in spring. Plants spread by layering branches over sphagnum to form low thickets rarely taller than 1.5 meters (5 feet). It is a classic associate of sphagnum moss and other ericads across northern North America and parts of Eurasia.

    It suits constructed bog gardens, pond margins with stable water levels, and restoration projects where pH stays low and moisture consistent.

    Full sun in open bogs or partial shade at range edges; constant moisture without stagnant anaerobic stagnation around crowns is critical.

    Propagate from softwood cuttings under mist or purchase liners from bog-plant specialists. Seed is dust-like and challenging for beginners.

    Do not consume plant parts; andromedotoxins are present. Manage browsing mammals if establishing sensitive restoration plugs.
  purpose: |-
    Erosion Control: Surface roots intertwine with moss to stabilize floating mat edges -- reduces peat slumping on pond margins.
    Wildlife Attractor: Berries feed songbirds; dense cover shelters small animals near water -- integrate with emergent sedges for vertical structure.
    Ornamental: Evergreen texture and spring racemes suit designed bog displays -- reads natural when massed with cranberry and sphagnum.
    Ground Cover: Layering stems fill space slowly without rhizomatous invasion -- predictable for curated wetland beds.
    Pollinator: Early nectar supports bees active during cool spring weather -- overlaps with other ericaceous bloom in bog systems.
