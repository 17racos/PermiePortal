  description: 'Coquinho azedo maps cleanly to the Central American sour guava — small yellow fruit, tart pulp, guava aromatics
    without the focus-group sweetness. Shrubby myrtle relative for humid frost-free sites; in subtropical and tropical Americas
    it fruits where winters stay mild (roughly zone 10+); cooler subtropical pockets mean greenhouse, pot culture, or treating
    it as a collector’s gamble.


    ☀️💧 Sun and Water Requirements:

    - Full sun for best flowering and fruit; some afternoon shade in hottest microclimates.

    - Rich, well-drained, slightly acidic soil; steady moisture when fruiting; avoid chronic waterlogging.

    - Protect young trees from drying winds; mulch to stabilize root zone. Hard freezes damage young wood—site with heat sinks
    or plan protection in marginal areas.


    ✂️ Methods to Propagate:

    - Seeds: plant fresh; long juvenility before fruit — bring patience and labels.

    - Cuttings and air layering used where clones are valued; grafting onto related Psidium is practiced in some collections.


    🌾 Harvest / Best Use Timing:

    - Pick fruit when fully colored and aromatic; tart types often sweeten slightly as they soften.

    - Process quickly into juice, jelly, or ferments—thin skin and high aromatics mean short shelf life compared to commercial
    guava.'
