  description: 'Frosted hawthorn (Crataegus pruinosa) is a deciduous rosaceous tree or large shrub of eastern North American
    wood margins, thickets, and old fields, named for the waxy bloom that makes ripe haws look frosted. Height often ranges
    15–25 feet (4.5–7.5 m) with a thorny framework and white spring blossoms. It is a wildlife hedgerow workhorse and a modest
    fruit crop for jelly makers who enjoy tart chemistry.


    ☀️💧 Sun and Water Requirements:

    Full sun to light shade; more sun improves flowering and fruit set if moisture exists. Adaptable soils if drainage is
    reasonable; tolerates alkaline substrates in some genotypes. Mulch the root zone to reduce grass competition while young.


    ✂️ Propagation:

    Sow seed after warm-cold stratification cycles typical for Crataegus. Graft or bud selected fruit lines for predictable
    quality. Prune in late winter for open structure; avoid heavy summer topping that invites weak regrowth.


    🌾 Harvest / Best Use Timing:

    Collect haws after the waxy bloom dulls and fruit softens slightly for processing. Taste before committing buckets—astringency
    varies. Leave clusters for birds if your preservation bandwidth is already full.'
