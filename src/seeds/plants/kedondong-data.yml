description: |-
  Kedondong (Spondias pinnata) is a tropical tree of South and Southeast Asia, bearing pinnate leaves, small flowers, and oval green to yellow fruit used green in pickles and sambals or ripe for fresh eating where acidity is appreciated. Heights of 30–60 feet (9–18 m) occur in open growth. It belongs in humid tropical food forests alongside other Spondias species, with the same family chemistry respect you would give mango relatives.

  Full sun for fruiting; young trees tolerate partial shade. Deep, fertile, well-drained soils with steady moisture in the warm season; reduce irrigation when growth slows. Wind protection limits fruit scarring in exposed sites.

  Sow fresh seed; graft known lines for predictable fruit character. Prune for scaffold strength—heavy fruit punishes weak angles. Remove suckers if maintaining a single leader.

  Pick green fruit for cooking and pickles; allow ripening for fresh use where flavor suits your palate. Process harvests quickly in heat to limit fermentation and fly interest. Expect seasonal flushes tied to rainfall cycles.
purpose: |-
  Edible: Spondias pinnata fruit runs tart-green for pickles and sambals, then yellow-soft for out-of-hand eating -- core fibrous strands before you serve guests because texture surprises newcomers.
  Shade Provider: Wide pinnate canopy filters tropical sun for understory vanilla or ginger -- mulch surface roots wide because annonaceous surface feeders hate compaction.
  Wildlife Attractor: Inflorescences feed small pollinators while ripe drupes feed hornbills and fruit bats -- harvest drops promptly if flies staging on pavement violate neighbor diplomacy.
  Medicinal: Bark and leaf enter Malay and Indonesian materia medica for digestive tonics -- work with trained practitioners because anacardiaceous sap irritates skin during casual pruning experiments.
