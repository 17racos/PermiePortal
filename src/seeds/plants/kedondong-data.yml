  description: "Kedondong (Spondias pinnata) is a tropical tree of South and Southeast Asia, bearing pinnate leaves, small flowers, and oval green to yellow fruit used green in pickles and sambals or ripe for fresh eating where acidity is appreciated. Heights of 30–60 feet (9–18 m) occur in open growth. It belongs in humid tropical food forests alongside other Spondias species, with the same family chemistry respect you would give mango relatives.\n\n☀️💧 Sun and Water Requirements:\nFull sun for fruiting; young trees tolerate partial shade. Deep, fertile, well-drained soils with steady moisture in the warm season; reduce irrigation when growth slows. Wind protection limits fruit scarring in exposed sites.\n\n✂️ Propagation:\nSow fresh seed; graft known lines for predictable fruit character. Prune for scaffold strength—heavy fruit punishes weak angles. Remove suckers if maintaining a single leader.\n\n🌾 Harvest / Best Use Timing:\nPick green fruit for cooking and pickles; allow ripening for fresh use where flavor suits your palate. Process harvests quickly in heat to limit fermentation and fly interest. Expect seasonal flushes tied to rainfall cycles."
