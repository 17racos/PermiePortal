  description: |-
    Jerusalem artichoke is the sunflower that went underground and invented fart jokes. Tubers are inulin-rich — great for diabetics on paper, chaotic for dinner parties if portions are naive. It spreads from overlooked tuber bits; treat it like bamboo's polite cousin that still invades if you ignore boundaries. North Florida grows it fine; harvest in cool months for firmer texture.

    ☀️💧 Sun and Water Requirements:
    - Full sun for tall stems and heavy tuber set.
    - Average to rich soil; steady moisture during growth, drier at harvest if soil allows.
    - Confine to beds or barrels if you fear eternal volunteers.

    ✂️ Methods to Propagate:
    - Tubers: replant golf-ball-sized pieces in spring after last frost.
    - Crowns: moving clumps resets spread when neighbors complain.
  purpose: |-
    Sunchokes are starchy perennials for the brave:

    - Edible: Roasted, pickled, or soup — start small to test gut politics.
    - Animal Fodder: Pigs historically earned their keep cleaning patches.
    - Mulcher: Tall tops chop-and-drop generously each fall.
    - Wildlife Attractor: Late flowers feed pollinators when goldenrod feels mainstream.
    - Dynamic Accumulator: Mines nutrients with robust roots — chop and drop responsibly.
  companions:
  - Beans
  - Corn
  - Comfrey
  avoid:
  - Unbounded planting in manicured yards
  - Serving huge portions to guests without warning
  pests:
  - Aphids
  - Powdery Mildew
