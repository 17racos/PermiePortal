  description: |-
    Jerusalem artichoke is the sunflower that went underground and invented fart jokes. Tubers are inulin-rich — great for diabetics on paper, chaotic for dinner parties if portions are naive. It spreads from overlooked tuber bits; treat it like bamboo's polite cousin that still invades if you ignore boundaries. subtropical and tropical Americas grows it fine; harvest in cool months for firmer texture.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for tall stems and heavy tuber set.
    - Average to rich soil; steady moisture during growth, drier at harvest if soil allows.
    - Confine to beds or barrels if you fear eternal volunteers.
    
    ✂️ Methods to Propagate:
    - Tubers: replant golf-ball-sized pieces in spring after last frost.
    - Crowns: moving clumps resets spread when neighbors complain.
    
    🌾 Harvest / Best Use Timing:
    - Jerusalem Artichoke: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
  purpose: |-
