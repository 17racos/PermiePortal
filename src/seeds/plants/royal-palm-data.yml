  description: 'Royal palm (Roystonea regia) is a towering pinnate-leaf palm of the Caribbean and parts of Central America,
    instantly recognized by a smooth green shaft, swollen mid-trunk profile on many individuals, and a crown of long feathery
    fronds. Heights of 50–80 feet (15–24 m) are common in ideal sites, making it an avenue and park icon. In tropical permaculture
    it supplies high shade, vertical structure, and that undeniable “we are not in Kansas” silhouette.


    ☀️💧 Sun and Water Requirements:

    Full sun for straight trunks and full crowns; juveniles accept partial shade during establishment. Rich, well-drained
    soils with steady moisture through warm periods prevent nutrient deficiencies; drought shows on older fronds first. Avoid
    chronic salt spray on exposed beach lots without rinsing after storms.


    ✂️ Propagation:

    Sow fresh seed in warm humid conditions; germination is reliable but juveniles grow slowly at first. Transplant with root
    ball integrity—palms do not forgive bare-root experiments. Remove only dead fronds; never spike the green crown for aesthetics.


    🌾 Harvest / Best Use Timing:

    Primarily ornamental—seeds are not a standard crop for beginners. Collect fallen fruit to reduce slippery hazards on paths.
    Growth flushes track year-round warmth in true tropics.'
