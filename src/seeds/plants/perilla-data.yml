description: |-
  Perilla (Perilla frutescens) is a useful annual species in the Lamiaceae family, native or long-naturalized across parts of the Americas and Eurasia depending on lineage. Mature growth is typically a herbaceous form suited to layered guilds, with reliable productivity when site conditions match its ecology. In a permaculture system it contributes food, habitat, and system resilience rather than single-crop output.

  Best performance comes with full sun to light partial shade, depending on heat intensity. Keep soil moisture steady during establishment, then water by seasonal demand. Well-drained fertile soil works for most upland entries, while wetland species require saturated margins. Most growth accelerates between 60°F (16°C) and 86°F (30°C), with stress rising near 100°F (38°C).

  Direct seeding is the simplest method where climate allows; sow at the start of the local favorable season and keep the seed zone evenly moist through germination. A second pathway is transplanting nursery starts or divisions once roots are active and temperatures are stable. Woody entries can also be established from dormant bare-root stock or grafted material for cultivar reliability.

  Harvest edible portions at peak maturity for intended use: leafy crops before heat stress, fruiting types at full color, root crops after starch set, and nuts or grains once fully mature and dry. For ecological functions, the strongest value appears after canopy closure, flowering, and annual residue cycling, when soil cover and habitat effects become consistent.
purpose: |-
  Edible: Perilla frutescens bicolor leaves wrap Korean ssam, pickle as umeboshi partners, and fry tempura with shiso aromatics -- red types color vinegar; seed oil is omega-3 rich but oxidizes fast once crushed, so small batches beat hero jars.
  Medicinal: Leaf and seed fractions appear in Kampo and TCM lines for cough and seafood-poisoning narratives -- perilla ketone loads vary by chemotype; keep concentrated extracts inside practitioner dosing, not casual tea megadoses.
  Pollinator: Open-faced whorled spikes feed long-tongued bees and syrphid flies in late-summer heat when many herbs quit -- let a few plants bolt in insectary rows while you keep kitchen rows cut for leaf quality.
companions:
- Basil - similar harvest rhythm and pollinator value in herb strips.
- Eggplant - perilla can act as aromatic intercrop and living mulch.
- Marigold - supports beneficial insect diversity around annual beds.
