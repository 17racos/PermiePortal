  description: "Sago palm (Cycas revoluta) is a cycad, not a true palm, with a stout trunk or subterranean stem, stiff glossy fronds, and cones produced separately by male and female plants. It is native to southern Japan and widely planted in warm temperate to tropical landscapes for architectural foliage. Mature specimens can reach 6–10 feet (1.8–3 m) of visible trunk over decades. All parts contain toxic compounds—especially seeds—so design it as ornamental structure, not snack aisle.\n\n☀️💧 Sun and Water Requirements:\nFull sun along coasts; bright partial shade inland in hot climates prevents frond burn. Well-drained, gritty soils prevent root rot; drought-tolerant once established but looks freshest with deep occasional watering in dry seasons. Avoid chronically wet pots or heavy clay without drainage holes.\n\n✂️ Propagation:\nSow cleaned seed in warm, humid conditions—germination is slow. Remove offsets (“pups”) with sterile tools if cloning is desired. Prune only fully brown fronds; yellowing may be nutrient signal, not automatic excuse for scissors.\n\n🌾 Harvest / Best Use Timing:\nNot a food crop for casual harvest—seeds are dangerous without specialized traditional processing. Growth flushes appear in warm wet periods; expect one or two leaf crowns per year in ideal heat."
  purpose: |-
    - Ornamental: Sculptural fronds anchor xeric and tropical borders where palms are overused clichés.
    - Border Plant: Low trunk forms define paths and entries without shading entire yards.
    - Shade Provider: Juvenile rosettes cast ground-level shade for succulents and herbs.
    - Wildlife Attractor: Cone structure engages specialist pollinators where compatible insects exist.
  companions:
