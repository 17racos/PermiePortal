  description: 'Curry leaf tree (Murraya koenigii) is a multi-stemmed tropical to subtropical shrub or small tree from South
    and Southeast Asia, famous for aromatic compound leaves used as a fresh seasoning. In frost-free climates it reaches roughly
    10–20 feet (3–6 m) unless kept smaller by pruning. White fragrant flowers yield small dark berries that are not the culinary
    focus—leaves are the crop that earns it space near kitchens and herb gardens.


    ☀️💧 Sun and Water Requirements:

    Full sun for dense aromatic foliage; light shade acceptable in hottest deserts if humidity exists. Rich, well-drained
    soil with steady moisture during warm growth periods; reduce water when nights cool and growth slows. Protect from drying
    wind on marginally cold sites.


    ✂️ Propagation:

    Sow fresh seed warm; viability drops quickly with age—old packets are decoration. Root semi-hardwood cuttings under humidity
    in warm weather for clones of high-oil selections. Air-layering works on older stems if you want a instant small tree.


    🌾 Harvest / Best Use Timing:

    Pick young leaflets for brightest flavor; frequent tipping keeps plants bushy and within reach. Flowers are pleasant but
    removing some inflorescences can redirect energy to leaves on small specimens. Freeze or dry leaves carefully—quality
    drops if they stew in plastic.'
