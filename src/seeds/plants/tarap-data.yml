  description: 'Tarap (Artocarpus odoratissimus) is a Bornean jackfruit relative bearing large, knobby syncarps with sweet,
    aromatic flesh distinct from jackfruit and chempedak in texture and odor profile. Trees reach 50–80 feet (15–24 m) in
    tropical lowlands, with a dense crown and latex-bearing tissues like other Artocarpus. It belongs in humid tropical food
    forests where heat and rainfall stay generous and frost is a rumor.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting once established; young plants appreciate partial shade. Deep, fertile, well-drained soils
    with steady moisture through the warm wet season and irrigation in dry spells support large fruit. Wind protection helps
    big leaves and heavy fruit clusters.


    ✂️ Propagation:

    Graft known cultivars; seedlings vary in fruit quality and odor diplomacy. Prune for clearance under heavy fruiting branches.


    🌾 Harvest / Best Use Timing:

    Harvest when aroma peaks and color shifts—process quickly; thin skin and soft flesh spoil fast. Peak loads track tropical
    wet-dry rhythms, not temperate months.'
  purpose: '- Edible: Sweet aromatic fruit diversifies jackfruit-family harvests for fresh eating and processing.

    - Shade Provider: Broad crown shelters understory crops during peak tropical sun.

    - Wildlife Attractor: Fruit and flowers engage bats, birds, and insects—plan sharing or netting.

    - Mulcher: Large leaves build rapid organic matter banks under the drip line.'
  companions:
