  description: "Carolina snailseed (Cocculus carolinus) is a deciduous twining vine
    of southeastern North American thickets and woodland edges, with bright green
    leaves and showy clusters of glossy red berries (on female plants) that persist
    into winter on some sites. Stems climb by twining to roughly 10–20 feet (3–6 m)
    on supports, forming airy screens on fences, trellises, and scrub. Birds distribute
    seed; humans should treat berries as ornamental-wildlife food, not trail snacks,
    without expert knowledge.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial
    shade; berries color best with good light. Average to moist, well-drained soil;
    tolerates heat and humidity typical of humid subtropical summers. Mulch roots;
    avoid drought on sandy berms without irrigation.\n\n✂️ Propagation:\nSow cleaned
    seed after cold stratification; germination may be slow. Semi-hardwood cuttings
    in summer with hormone. Layer stems to ground in moist mulch; detach rooted sections
    next year.\n\n🌾 Harvest / Best Use Timing:\nEnjoy red bead display in fall and
    early winter; prune after fruiting if you need to control height on trellises.
    Remove volunteers at the root if spread exceeds design intent."
