  description: "Cattley guava is the adorable fruit shrub that eats Florida hammocks if you blink. Sweet, aromatic berries\
    \ make killer jelly; birds make new infestations. It is regulated or targeted for control in parts of the state — treat\
    \ existing plants as a management job, not a flex. Sun, heat, and sandy soil are easy mode; drought tolerance is real\
    \ once established.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun for maximum fruit.\n- Moderate water;\
    \ tolerates short droughts when mulched.\n- Well-drained acid-to-neutral soils typical of coastal Florida.\n\n✂️\U0001FAD8\
    \ Methods to Propagate:\n- Seeds via fruit — please do not spread.\n- Cuttings and air-layering for controlled clones\
    \ where legal.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Pick when deep maroon and aromatic.\n\
    - Remove fallen fruit if you are serious about seed control."
  purpose: |-
    Edible: Psidium cattleianum marble-sized red or yellow berries make tart jam, wine, and fresh snacks after sorting out fruit fly damage in humid yards.
    Wildlife Attractor: Psidium cattleianum ripe fruit pulls frugivorous birds and fruit flies that spread seeds into hammocks and conservation land, so fallen fruit cleanup is part of stewardship where listed.
    Ornamental: Psidium cattleianum smooth exfoliating bark and glossy myrtle leaves stay evergreen in warm climates so the shrub reads ornamental even when managers must treat it as a regulated landscape plant.
