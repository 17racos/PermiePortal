  practitioner_notes: 'Carrot fly smells wounded foliage—thin at dusk, not midday, and avoid fresh manure before sowing if
    root splits attract them.

    Stone-free beds prevent forked roots; heavy clay without organic depth grows stunted pencils, not market carrots.

    Bare soil over winter invites wireworm drama—cover crop or tarp before spring root crops in problem fields.

    Overdense stands need ruthless thinning—crowding grows hairy roots and invites leaf blights that start at soil splash.'
