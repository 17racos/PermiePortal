  description: |-
    Guayule is a drought-adapted, resinous shrub from the Chihuahuan Desert region that stores natural rubber in its bark and tissues. Silvery, finely divided leaves and a rounded, many-branched frame typically reach 3 feet tall and wider in favorable sites, reading like a compact sagebrush that wants limestone grit and air movement.

    In Florida and Puerto Rico it is a specialty dryland crop for frost-free pockets with sharp drainage—humid low spots invite root rots, while Puerto Rico’s dry southern coasts and Florida’s well-drained coastal berms can mimic its native bajada conditions if you refuse to over-irrigate. Think permaculture fence lines and biomass hedges, not bog gardens.

    ☀️💧 Sun and Water Requirements:
    - Full sun for maximum resin and rubber precursor production.
    - Deep, very well-drained soil; raised beds or coarse sand mixes in rainy climates.
    - Water deeply but rarely once established; wet feet kills faster than dry air.

    ✂️ Propagation:
    - Seeds after last cool spell; surface sow or lightly cover in warm media (germination can be slow and irregular).
    - Semi-hardwood cuttings in late warm season with bottom heat and intermittent mist.
    - Transplant container-grown liners into the field at the start of the rainy season so roots chase moisture downward.

    🌾 Harvest / Best Use Timing:
    - For rubber or resin trials, harvest whole shrubs on a multi-year rotation after lignification, processing bark while fresh.
    - For biomass mulch, coppice or heavy prune after flowering when tissues are firm but before winter chill stress in marginal zones.
  purpose: |-
    Guayule is industrial hedgerow material with a permaculture twist:

    - Fiber: Latex-bearing tissues are the historic source of hypoallergenic rubber and specialty resins.
    - Biomass: Woody stems and leafy prunings chip into long-lasting carbon-rich mulch for arid-system pathways.
    - Erosion Control: Deep taproot and shrubby frame armor coarse slopes where turf dies and bare soil would sheet-erode.
    - Border Plant: Dense branching and resinous scent create a visual and aromatic wind-sieve along dry property edges.
  companions:
  - Agave — shares sun, drainage, and low supplemental water philosophy without shading guayule out.
  - Desert Willow — deeper-rooted flowering tree uses a different water horizon while casting light, dappled shade on guayule’s windward side.
  - Prickly Pear — shallow, water-frugal pads occupy different root strata and reduce foot traffic compaction along fence lines.
