  description: "Bilimbi (Averrhoa bilimbi) is a small tropical tree closely related
    to star fruit, bearing extremely sour, cucumber-shaped fruits used pickled, cooked,
    and in beverages across humid tropical kitchens. It typically reaches 15–33 feet
    (5–10 m) with a short trunk, many spreading branches, and pinnate leaves; flowers
    and fruit arise directly from trunks and older wood. The species suits home orchards
    and spice gardens where acid is an ingredient, not an insult.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun drives flowering and heavy fruiting; partial shade reduces
    yield. Likes steady moisture in well-drained, fertile soils; drought during fruit
    set causes drop. Protect from prolonged cold below about 32°F (0°C); light frosts
    damage young growth quickly.\n\n✂️ Propagation:\nSow seeds fresh for volunteer trials;
    vegetative propagation maintains known sourness levels. Air-layer fruitful branches
    during warm, humid months. Container culture works in marginal zones if moved during
    cold spells—still a chore, not a cheat code.\n\n🌾 Harvest / Best Use Timing:\nPick
    fruit green for pickles and curries, or allow slight yellowing for different uses—flavor
    remains aggressively tart. Harvest frequently; heavy loads can stress brittle wood.
    Prune to open the center and reduce wind breakage on overloaded limbs."
  purpose: |-
    - Edible: Extreme acidity brightens pickles, sambals, and drinks where sugar balances the slap.
