description: "Ilama is a Central American annona with green or pink types, aromatic flesh ranging from sweet to tangy depending on form. Less commercial hype than cherimoya, more niche fruit-nerd treasure. Tree is small to medium, needs warmth and humidity. subtropical and tropical Americas: experimental coastal plantings only; inland freezes are the usual villain.\n\n💧 Sun and Water:\nFull sun to light shade when young. Consistent moisture; intolerant of drought and of sodden roots — the usual annona paradox solved with mulch and slope.\n\nHand-pollination can boost fruit set like other annonas.\n\nName looks like “llama”; tastes nothing like one.\n\n🌾 Harvest / Best Use Timing:\nIlama: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both. Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer. Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate."
purpose: |-
  Edible: Annona diversifolia produces green or pink forms with melon-meets-custard flesh ranging from sweet to tangy -- ripen on the counter until aroma peaks, then eat soon because annona flesh bruises and ferments overnight.
  Wildlife Attractor: Nitrophilous beetles pollinate the protogynous flowers while ripe fruit draws fruit bats and birds -- bag clusters or harvest early if vertebrate tithe is not in your budget.
  Shade Provider: Small-to-medium canopy casts dappled shade for understory bananas, taro, or coffee -- mulch heavily and slope planting holes because annonas hate both drought and sodden roots.
