    inland freezes are the usual villain.\n\n☀️💧 Sun and Water:\n- Full sun to
    light shade when young.\n- Consistent moisture; intolerant of drought and of
    sodden roots — the usual annona paradox solved with mulch and slope.\n\n✂️
    Propagation:\n- Seeds, grafting, and air-layering where material exists.\n-
    Hand-pollination can boost fruit set like other annonas.\n\nName looks like
    “llama”; tastes nothing like one."
