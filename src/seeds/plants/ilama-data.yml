    ☀️💧 Sun and Water:
    - Full sun to light shade when young.
    - Consistent moisture; intolerant of drought and of sodden roots — the usual annona paradox solved with mulch and slope.
    
    ✂️ ✂️ Propagation: 
    - Seeds, grafting, and air-layering where material exists.
    - Hand-pollination can boost fruit set like other annonas.
    
