  description: 'Fetterbush (Lyonia lucida) is an evergreen ericaceous shrub of wet pine savannas, pocosin edges, and acid
    bogs around the Gulf and Atlantic coastal plains, with glossy leaves, arching stems, and urn-shaped flowers that announce
    membership in the blueberry tribe. It handles periodic wet feet better than many ornamental acid-loving shrubs sold in
    big-box pots, and it feeds specialist bees adapted to bell-shaped corollas. Use it in rain gardens, pond margins, and
    native screens where drainage is inconsistent but chemistry stays sour.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best flowering with strong light if roots stay moist. Tolerates acidic, peaty, or sandy wet
    soils; not for alkaline fill or dry roof runoff deserts. Avoid prolonged drought without irrigation—evergreen leaves desiccate.
    Cold tolerance suits warm-temperate to subtropical zones; hard freezes damage tips on marginally hardy sites.


    ✂️ Propagation:

    Semi-hardwood cuttings under humidity root with bottom heat in warm months.

    Seeds are tiny and slow; use for restoration batches, not instant hedges.


    🌾 Harvest / Best Use Timing:

    Landscape value peaks during bloom; prune lightly after flowering to shape. Do not strip wild populations—source nursery-grown
    liners for new projects.'
  purpose: |-
    Wildlife Attractor: Fetterbush layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Border Plant: Fetterbush tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Ornamental: Fetterbush earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Erosion Control: Fetterbush networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
  companions:
  - Sweetbay Magnolia — shares moist acidic edges; seasonal flowers stagger visual interest
  - Inkberry — another evergreen ericaceous screen for layered wetland borders
  - Cardinal Flower — red tubular flowers contrast Lyonia bells in hummingbird-friendly wet sun
  cautions:
