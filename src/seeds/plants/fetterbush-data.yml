  description: "Fetterbush (Lyonia lucida) is an evergreen ericaceous shrub of wet
    pine savannas, pocosin edges, and acid bogs around the Gulf and Atlantic coastal
    plains, with glossy leaves, arching stems, and urn-shaped flowers that announce
    membership in the blueberry tribe. It handles periodic wet feet better than
    many ornamental acid-loving shrubs sold in big-box pots, and it feeds specialist bees
    adapted to bell-shaped corollas. Use it in rain gardens, pond margins, and native
    screens where drainage is inconsistent but chemistry stays sour.\n\n☀️💧 Sun and
    Water Requirements:\nFull sun to partial shade; best flowering with strong light
    if roots stay moist. Tolerates acidic, peaty, or sandy wet soils; not for alkaline
    fill or dry roof runoff deserts. Avoid prolonged drought without irrigation—evergreen
    leaves desiccate. Cold tolerance suits warm-temperate to subtropical zones; hard
    freezes damage tips on marginally hardy sites.\n\n✂️ Propagation:\nSemi-hardwood
    cuttings under humidity root with bottom heat in warm months.\nSeeds are tiny
    and slow; use for restoration batches, not instant hedges.\n\n🌾 Harvest / Best
    Use Timing:\nLandscape value peaks during bloom; prune lightly after flowering
    to shape. Do not strip wild populations—source nursery-grown liners for new projects."
  purpose: |-
