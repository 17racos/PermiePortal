  description: 'Ribbon palm (Livistona decipiens) is a medium-tall fan palm from eastern Australia, valued for costapalmate
    leaves with drooping, split segments that move like green ribbon in wind. Trunks reach 30–50 feet (9–15 m) in ideal tropical
    and subtropical sites, carrying a neat crown that casts filtered shade. It suits avenue plantings, pool buffers, and food-forest
    edges where a solitary palm silhouette beats another turf island.


    ☀️💧 Sun and Water Requirements:

    Full sun for compact trunk diameter and strong petioles; juvenile plants accept partial shade. Rich, well-drained soils
    with steady moisture through warm periods prevent tip burn; drought once established is possible but shows on leaflet
    tips. Avoid chronic salt spray; rinse foliage after storms on exposed coastal lots.


    ✂️ Propagation:

    Sow fresh seed in warm, humid conditions; germination is slow and steady, not instant gratification. Transplant seedlings
    with minimal root disturbance. Remove only dead fronds—green fronds feed the trunk; “hurricane cuts” are palm abuse cosplaying
    as landscaping.


    🌾 Harvest / Best Use Timing:

    Primarily ornamental—seeds are not a standard food crop. Collect fallen fruit to reduce seedling volunteers near pavers.
    Growth flushes track year-round warmth in true tropics and warm wet seasons in subtropics.'
