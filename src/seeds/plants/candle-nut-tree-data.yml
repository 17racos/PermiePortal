  description: "The candle nut tree (Aleurites moluccanus), known as kukui in Hawaiʻi,
    is a fast-growing tropical tree to about 15–25 m (50–80 feet) with large, alternate,
    three- to five-lobed leaves and clusters of small white flowers followed by round,
    very hard nuts rich in oil. It is native across the Pacific and Southeast Asia
    and naturalized in many subtropical/tropical landscapes.\n\n🌞💧 Sun and Water
    Requirements:\n- Full sun for strong structure and nut production once established.\n-
    Prefers deep, fertile, well-drained soil with steady moisture in the warm season;
    tolerates brief drought when mature. In subtropical and tropical Americas it thrives in
    humid heat—give young trees mulch and wind protection during hurricanes prep (prune
    for strong scaffolding).\n- Avoid standing water on roots.\n\n✂️ Methods to Propagate:\n-
    Seeds: Fresh nuts germinate best; plant on their side in warm, moist medium;
    seedlings appear in several weeks.\n- Air-layering or cuttings: Used by enthusiasts
    for known cultivars; slower than seed.\n\n🌾 Harvest / Best Use Timing:\n- Collect
    fallen nuts when husks age; dry and crack carefully—raw nuts are toxic in quantity;
    traditional use involves roasting or processing for oil. Leaves and history
    carry medicinal lore; modern use should respect toxicity and local guidance."
  purpose: |-
    Kukui is a classic multipurpose tree of warm-island systems:

    - **Edible**: Processed oil and carefully prepared kernels enter traditional foods; not a casual raw snack.
    - **Medicinal**: Historically used for skin and inflammation support; potency and safety depend on preparation.
    - **Mulcher**: Large leaves drop steadily, feeding soil biology and shading understory guilds.
    - **Windbreaker**: Broad crown reduces wind stress for tender understory crops on exposed lots.
