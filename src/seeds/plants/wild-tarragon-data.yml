  description: "True tarragon lineage lives here — wiry stems, narrow leaves, and
    that sweet anise-herb note that makes tomatoes behave. French tarragon is sterile
    and propagated by division; seed-grown \"Russian\" types are coarser but tougher.
    subtropical and tropical Americas heat is not Paris: give afternoon shade, sharp drainage, and air
    movement, or pivot to Tagetes lucida (Mexican mint marigold) for tarragon flavor
    when Artemisia sulks. Cut often to prevent woody stems and encourage soft tips.\n\n☀️💧
    Sun and Water:\n- Full sun in cool months; part sun when heat index mocks you.\n-
    Low to moderate water once established; hates wet winter pots.\n- Gritty or
    raised soil; humidity plus soggy roots rots crowns.\n\n✂️ Propagation:\n- Division
    of spreading clumps in spring or fall.\n- Softwood cuttings for true French types."
  purpose: |-
    Wild tarragon is the finesse herb that separates cooks from people who only own
    garlic powder:

    - Edible: Classic with eggs, chicken, vinegar, and late-summer tomatoes.
    - Medicinal: Traditional digestive bitters; modern use is mostly culinary.
    - Pollinator: Inconspicuous flowers still fit insectary margins.
    - Border Plant: Upright wands along paths and dry edges.
