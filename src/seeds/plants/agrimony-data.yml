  description: |-
    Agrimony (Agrimonia eupatoria) is a clumping herbaceous perennial in the rose family, native to Europe and naturalized in parts of North America. It forms upright stems roughly 2–4 feet tall with pinnately compound leaves softly hairy beneath and slender spikes of small yellow flowers that ripen into burr-like fruits that snag socks with enthusiasm.

    In subtropical and tropical Americas it is a cooler-season or north-Florida personality: the Panhandle and elevated sites tolerate it more than steamy tropical and subtropical zones lowlands, while Puerto Rico gardeners may treat it as a high-elevation or winter-active curiosity unless a local ecotype proves otherwise. Humidity increases foliar disease pressure—airflow matters.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; more shade in the hottest end of its range.
    - Average, well-drained soil; steady moisture beats boom-bust irrigation; avoid standing water around the crown.

    ✂️ Methods to Propagate:
    - Seeds: cold-moist stratify several weeks, surface-sow in spring; expect variable germination.
    - Division of established clumps in early spring or fall when the crown is visible—faster than seed for a defined hedge row.

    🌾 Harvest / Best Use Timing:
    - Harvest aerial parts at early bloom for traditional herb use; dry quickly in thin layers to reduce mold in humid air.
    - Leave late flowers for pollinators if you are not running a commercial drying rack—ethics beat maximalist stripping.
  purpose: |-
    Agrimony is a meadow-edge plant that pays rent in insects and herbal tradition.

    - Medicinal: Aerial parts have a long folk history—research modern guidance before internal use, obviously.
    - Pollinator: Small yellow flowers supply nectar to diverse small bees and flies in succession.
    - Wildlife Attractor: Seeds feed birds; structure supports beneficial insects along borders.
    - Border Plant: Upright spikes visually anchor mixed perennial strips without pretending to be a hedge shrub.
    - Ground Cover: Basal rosettes help occupy niche space against bare soil in mixed plantings—not a lawn replacement.
  companions:
