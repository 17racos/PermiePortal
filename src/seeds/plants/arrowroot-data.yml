common_name: Arrowroot
picture: arrowroot.webp
scientific_name: Maranta arundinacea
aka:
- Bermuda arrowroot
family: Marantaceae
zone: 10-12
ideal_temp_min: 65
ideal_temp_max: 95
min_temp: 35
max_temp: 105
perennial: true
layers:
- Herbaceous
plant_function:
- Edible
- Ground Cover
- Mulcher
description: |-
  True arrowroot is a shade-tolerant tropical perennial that produces rhizomes valued for clear, bland starch — thickener without the cornstarch industrial aftertaste. It wants heat, humidity, and protection from frost. In subtropical and tropical Americas, grow as a pampered perennial in frost-free microclimates or lift rhizomes; it is not a cactus cosplay.

  - Part shade to dappled light; harsh midday sun bleaches leaves.
  - Consistently moist, rich, well-drained soil.
  - Mulch to mimic forest floor stability.

  - Rhizome division at warm soil temperatures.
  - Offsets from clumps.

  - Dig rhizomes when plants are mature and dormant from cold stress.
  - Process into starch with clean water discipline — this is kitchen chemistry, not instant rice.
purpose: |-
  Edible: Maranta arundinacea rhizomes yield clear bland starch once grated, washed, and settled -- thickens sauces without the chalky finish of cheap cornstarch and resists acid breakdown better than wheat flour.
  Ground Cover: Low leafy clumps tile under banana, cacao, and ginger where dappled shade stops harsh midday bleach -- not a xeric plant, so skip full-sun sand ovens without irrigation honesty.
  Mulcher: Soft tropical leaves drop steadily into humid guilds, feeding earthworms and feeding fungi that appreciate steady moisture -- rake only where mats threaten speargun ginger shoots.
companions:
- Banana
- Cacao
- Ginger
cautions:
- Full-sun sand ovens without irrigation
pests:
- Aphids
- Mealybugs
- Root Rot