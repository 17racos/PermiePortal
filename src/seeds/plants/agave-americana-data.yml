  description: |-
    Century plant is the big rosette succulent that launches a telephone-pole flower spike once, then dies theatrically while pups carry the bloodline. Margins and terminal spines are honest; drunk landscaping is how emergency rooms stay busy. Florida and Puerto Rico coastal and inland 9a+ microclimates grow it fine with drainage; winter wet + cold snaps rot pampered specimens.

    ☀️💧 Sun and Water Requirements:
    - Full sun for tight growth; shade yields etiolated, less hardy rosettes.
    - Sharp drainage mandatory; drought-tolerant—summer rain is fine if soil sheds water fast.

    ✂️ Methods to Propagate:
    - Pups: remove when sizable and root in dry mix; wait for callus before watering.
    - Seeds possible but slow—clones via offsets are practical.

    🌾 Harvest notes:
    - Roasted heart (“quiote” traditions) is real food culture with labor and tools—do not improvise without mentorship; sap can irritate skin.
