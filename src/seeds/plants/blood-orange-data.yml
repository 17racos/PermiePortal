  description: "Blood orange is a pigmented sweet orange (Citrus sinensis) group whose flesh and sometimes rind blush red
    from anthocyanins when cool nights and genetics align. Trees match standard sweet orange habit—evergreen, rounded crowns,
    fragrant blooms—while fruit brings berry-like notes and visual drama to fresh eating and marmalade. In humid subtropical
    climates, color may be milder than in Mediterranean cycles, but flavor can still be excellent if you pick on taste, not
    Instagram saturation.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for sugar development and rind color cues.\n- Consistent
    irrigation with sharp drainage; wet feet invite root rot and nutrient collapse.\n- Cool night temperature swings improve
    blush where winters actually cool; in steady tropical heat, manage expectations on red intensity.\n\n✂️ Propagation:\n-
    Budded or grafted trees on modern rootstocks keep size and disease traits predictable.\n- Seeds are a genetic dice roll
    and delay fruiting—fine for experiments, not for planned harvests.\n- Topwork older frames only with compatible stock and
    clean technique.\n\n🌾 Harvest / Best Use Timing:\n- Sample across the canopy; blood oranges can color unevenly on one
    tree.\n- Juice soon after picking for brightest flavor; segments dehydrate fast in dry refrigerators.\n- Marmalade loves
    the bitter edge in peel—balance sugar with honesty, not hope."
