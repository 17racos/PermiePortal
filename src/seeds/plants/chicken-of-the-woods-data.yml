  scientific_name: Laetiporus sulphureus (species complex)
  aka:
  - Sulphur Shelf
  - Chicken Mushroom
  - Crab of the Woods
  family: Fomitopsidaceae
  zone: 4-11
  ideal_temp_min: 55
  ideal_temp_max: 80
  min_temp: -10
  max_temp: 95
  perennial: true
  layers:
  - Fungal
  plant_function:
  - Edible
  - Mulcher
  - Wildlife Attractor
  description: "Chicken of the woods is the traffic-cone bracket — overlapping shelves
    in electric orange and sulfur yellow fruiting from trunks and large limbs of
    hardwoods and occasionally conifers. It is one of the most visually distinctive
    edible fungi in North America; a confident ID is achievable even for beginners
    when the specimen is fresh and the host is confirmed. Florida has its own Laetiporus
    complex species (L. gilbertsonii and others) on oaks and other hosts; taxonomy
    in this group is still being resolved, but the practical harvest rules are the
    same. The host tree is often already stressed or dying when brackets appear;
    brackets signal internal decay, not decoration of a healthy tree. Some people
    react poorly even to properly prepared specimens — the 'small taste first' rule
    is not optional here.\n\n☀️💧 Sun and Water:\n- Natural fruiting on trunks and
    large limbs in sun to partial shade.\n- Rain cycles trigger growth; does not
    respond to micro-managed irrigation like a garden vegetable.\n- Cannot be reliably
    cultivated outdoors; wild observation and ethical harvest is the primary relationship.\n\n✂️
    Propagation:\n- Stump or log inoculation with plug spawn is experimental and
    inconsistent — this is primarily a wild-harvest species.\n- Respect property
    rules and park regulations before harvesting from public lands."
  purpose: |-
    Chicken of the woods turns visible wood decay into a striking, unmistakable
    edible harvest:

    - Edible: Popular when young and tender with moist pore surface; texture
      genuinely resembles cooked chicken; cook thoroughly and confirm host species
      and individual reaction before committing to a large meal.
    - Mulcher: White-rot activity accelerates wood recycling in the canopy and
      on fallen timber.
    - Wildlife Attractor: Bracket shelves feed insects, beetles, and the birds
      that follow them.
  substrate:
  - Oak (primary in eastern U.S.)
  - Cherry
  - Willow
  - Sweetgum
  - Locust
  - Eucalyptus and conifers (associated with GI reactions in some foragers — avoid)
  mycelium_type: White rot; saprobic and weakly parasitic on stressed hardwoods
  fruiting_season: Spring through fall in Florida; multiple flushes possible on
    the same log or stump after rain events
  cultivation_difficulty: Not recommended for deliberate cultivation — primarily
    a wild-harvest species; stump inoculation is experimental
  spawn_type: Plug spawn for experimental stump inoculation only; natural colonization
    is the primary pathway
  companions:
  - Oak
  - Cherry
  - Willow
  cautions:
  - Avoid specimens on conifers, eucalyptus, or black locust — associated with
    GI reactions in a meaningful subset of foragers
  - Always cook thoroughly; raw consumption causes reactions even in tolerant individuals
  - First taste test applies even if you have eaten it before — individual responses
    vary by specimen, host, and preparation
  pests:
  - Borers
  - Scale Insects
  practitioner_notes: |-
    Harvest young brackets with moist, supple pore surfaces — the sulfur-yellow
    edge zone is the prize; dry, chalky, or crumbling margins are past their table
    prime and often bitter.
    Confirm host species before harvesting; oak and cherry are safe track records,
    conifers and eucalyptus are not — the tree tells you as much as the fungus.
    Cook thoroughly every time; this species has a higher rate of reaction than
    most common edibles even when properly prepared; small first tasting is not
    overcaution.
    Older brackets continue to sporulate and feed the ecosystem — strip-mining
    every visible shelf ends local populations faster than they recover; take the
    young growth and leave the rest.
    A bracket at the base or on a limb of a live tree signals internal decay;
    photograph the tree and monitor structural integrity rather than treating the
    find as unrelated good luck.
  growth_habit: Bracket polypore on hardwood trunks and stumps; multiple overlapping
    shelves
  data_quality_score: 0.82
