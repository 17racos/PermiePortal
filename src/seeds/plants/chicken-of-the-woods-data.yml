  description: |-
    Chicken of the woods is the traffic-cone bracket — overlapping shelves in electric orange and sulfur yellow fruiting from trunks and large limbs of hardwoods and occasionally conifers. It is one of the most visually distinctive edible fungi in North America; a confident ID is achievable even for beginners when the specimen is fresh and the host is confirmed. Florida has its own Laetiporus complex species (L. gilbertsonii and others) on oaks and other hosts; taxonomy in this group is still being resolved, but the practical harvest rules are the same. The host tree is often already stressed or dying when brackets appear; brackets signal internal decay, not decoration of a healthy tree. Some people react poorly even to properly prepared specimens — the 'small taste first' rule is not optional here.
    
    ☀️💧 Sun and Water:
    - Natural fruiting on trunks and large limbs in sun to partial shade.
    - Rain cycles trigger growth; does not respond to micro-managed irrigation like a garden vegetable.
    - Cannot be reliably cultivated outdoors; wild observation and ethical harvest is the primary relationship.
    
    ✂️ Propagation:
    - Stump or log inoculation with plug spawn is experimental and inconsistent — this is primarily a wild-harvest species.
    - Respect property rules and park regulations before harvesting from public lands.
    
    🌾 Harvest / Best Use Timing:
    - Harvest young overlapping shelves while still juicy -- old brackets toughen into shoe leather.
    - Trim close to wood, transport in paper, cook thoroughly day-of.
    - Never mix unknown brackets on the same skillet -- ID certainty first, brunch second.
  purpose: |-
    Edible: Chicken of the Woods (Laetiporus sulphureus (species complex)) in the edible role draws on field reality: Chicken of the woods is the traffic-cone bracket  --  overlapping shelves in electric orange and sulfur yellow fruiting from trunks and large limbs of hardwoods and occasionally conifers. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Mulcher: Chicken of the Woods tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Wildlife Attractor: Wildlife shows up for calories and cover: Chicken of the woods is the traffic-cone bracket  --  overlapping shelves in electric orange and sulfur yellow fruiting from trunks and large limbs of hardwoods and occasionally conifers. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot

