  description: |-
    Coco plum (*Chrysobalanus icaco*) is a coastal workhorse: salt-tolerant, wind-sculpted, and willing to fruit white to dark purple drupes with mild, sometimes insipid, sometimes surprisingly pleasant pulp around a big seed. Forms range from low mounding shrubs to taller upright types depending on ecotype and genetics.
    
    In subtropical and tropical Americas it is a gamble without protection; treat serious freezes as a reset button unless you are on thermal mass near the coast.
    
    ☀️💧 Sun and Water:
    - Full sun for best fruiting; tolerates light shade.
    - Drought-tolerant once established but fruits better with regular deep watering in well-drained soil. Tolerates brackish wind and sandy coasts.
    
    ✂️ Propagation:
    - Seeds: crack or scarify hard endocarp or patience-soak; germination is slow.
    - Cuttings: hardwood cuttings possible with warmth and humidity.
    - Transplants: common from nursery containers; stake if exposed to steady coastal wind.
    
    🌾 Harvest / Best Use Timing:
    - Coco Plum: pick peak flavor when fruits soften slightly and detach easily -- birds are a parallel calendar.
    - Harvest after dew dries to reduce mold in baskets.
    - Jam batches same day if humidity is high; acid and sugar balance matter more than Instagram gloss.
