  description: "Coco plum (*Chrysobalanus icaco*) is a coastal workhorse: salt-tolerant,
    wind-sculpted, and willing to fruit white to dark purple drupes with mild,
    sometimes insipid, sometimes surprisingly pleasant pulp around a big seed.
    Forms range from low mounding shrubs to taller upright types depending on ecotype
    and genetics.\n\nIn subtropical and tropical Americas it is a gamble without protection; treat
    serious freezes as a reset button unless you are on thermal mass near the coast.\n\n☀️💧
    Sun and Water:\n- Full sun for best fruiting; tolerates light shade.\n- Drought-tolerant
    once established but fruits better with regular deep watering in well-drained
    soil. Tolerates brackish wind and sandy coasts.\n\n✂️ Propagation:\n- Seeds: crack
    or scarify hard endocarp or patience-soak; germination is slow.\n- Cuttings:
    hardwood cuttings possible with warmth and humidity.\n- Transplants: common
    from nursery containers; stake if exposed to steady coastal wind."
  purpose: |-
    - Edible: Fruits are eaten fresh, jellied, or fermented experimentally — manage expectations on sweetness.
    - Erosion Control: Roots stabilize dunes and coastal berms.
    - Wildlife Attractor: Fruits feed birds and mammals; flowers support pollinators.
    - Windbreaker: Multi-stem habit cuts salt wind in coastal buffers.
  companions:
  - Sea Grape
  - Myrsine
  - Simpson Stopper
  - Beach Sunflower
  cautions:
  - Prolonged waterlogging in heavy clay
  pests:
  - Scale Insects
  - Whiteflies
  - Mealybugs
  - Aphids
  practitioner_notes: |-
    White and red fruit forms differ in sweetness—taste before designing a hedge around the wrong one.
    Salt-front plantings still need establishment water—first two dry seasons determine whether you get a hedge or sticks.
    Suckers from roots—edging or mowing strips keeps formal lines; wild coast plantings look better untamed.
    Mealybugs hide at leaf bases—detail spray with soap hits crawlers; ignoring them paints sooty mold on top leaves.
  growth_habit: Shrub
