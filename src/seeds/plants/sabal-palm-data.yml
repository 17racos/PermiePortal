  description: "Sabal palmetto is the icon that says 'you are definitely in the
    Southeast.' Slow, tough, hurricane-flexible, and deeply wired into coastal and
    inland ecosystems. The terminal bud was historically eaten as 'swamp cabbage'
    — harvesting kills the tree, so treat that as history-class trivia, not lunch
    planning. North Florida: native backbone species for pine savanna, hammocks,
    and food forest edges.\n\n🌞💧 Sun and Water Requirements:\n- Full sun to part
    shade once established.\n- Tolerates wet feet and droughty sand better than most
    ornamentals pretending to be low-maintenance.\n- Transplant 'sabal minors' carefully;
    large specimens hate root disturbance.\n\n✂️🌱 Methods to Propagate:\n- Seeds:
    slow but straightforward; clean flesh, warm stratification optional, patience mandatory.\n-
    Transplant nursery-grown specimens for landscape speed.\n\n🧺 When to Harvest:\n-
    Do not harvest the heart unless you dislike the tree. Use fallen boots / fronds
    for mulch and habitat."
  purpose: |-
    Sabal palm is structure, storm resilience, and native street cred. It shades
    understory, feeds pollinators with flowers, and hosts a food web including the
    palmetto weevil — plan for that drama on stressed or damaged palms.
  companions:
  - Saw Palmetto
  - Beautyberry
  - Muscadine
  - Yucca
  avoid:
  - Wounding trunks with string trimmers — weevil invitation letters
  - Expecting fast shade — this is a long game
  pests:
  - Palmetto Weevil
  - Scale Insects
  - Borers
  - Rugose Spiraling Whitefly
  - Spiraling Whitefly
