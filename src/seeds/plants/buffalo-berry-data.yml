  description: "Buffalo berry (Shepherdia argentea) is a thorny deciduous shrub of
    central North America, named for silvery-scaly leaves and tart red or yellow berries
    on female plants (dioecious). Mature shrubs often reach 2–4 m (6–13 feet) tall
    and wide, forming stiff thickets useful for hedges and windbreaks.\n\n🌞💧 Sun
    and Water Requirements:\n- Full sun for best fruiting and nitrogen fixation.\n-
    Tolerates poor, alkaline, and sandy soils; drought-tolerant once established but
    fruits better with occasional deep watering. In subtropical and tropical Americas it is
    marginal in hot, humid lowlands—trial only in breezy, well-drained microclimates
    or elevated sites; winter-chill needs can limit fruiting in the tropics.\n- Avoid
    waterlogged heavy clay.\n\n✂️ Methods to Propagate:\n- Seeds: Scarify and stratify;
    germination can be slow and variable—plant extras.\n- Hardwood cuttings: Take
    in dormant season and root under mist or in cool greenhouse conditions.\n\n🌾
    Harvest / Best Use Timing:\n- Pick berries when fully colored and slightly soft;
    tart flavor suits jams and sauces. Plant both male and female clones for fruit;
    net or accept bird share."
  purpose: |-
    Buffalo berry fits windbreak and poultry-range edges in suitable climates:

    - **Edible**: Berries are sour but usable; supports homestead fruit diversity outside typical orchard crops.
    - **Nitrogen Fixer**: Actinorhizal roots enrich surrounding soil for neighboring fruiting shrubs and herbs.
    - **Wildlife Attractor**: Berries feed birds; thorny thickets provide cover for beneficial predators.
    - **Windbreaker**: Multi-stem habit slows wind on exposed berms, livestock lanes, and zone-4 transitions.
