  description: 'Scrub cherry (Eugenia foetida) is an evergreen myrtle shrub to small tree of Caribbean and subtropical coastal
    scrub, with small opposite leaves, inconspicuous flowers, and dark berries valued by birds. Plants typically reach 6–15
    feet (1.8–4.5 m), often multi-stemmed and tolerant of salt spray, drought, and limestone. It belongs in coastal buffers,
    wildlife hedges, and xeric subtropical borders where maintenance budgets are honest.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; densest growth in strong light. Well-drained sandy or rocky soils suit it; tolerates brackish
    exposure and seasonal drought once established. Mulch young plants; avoid chronic waterlogging.


    ✂️ Propagation:

    Sow fresh seed; semi-hardwood cuttings root under humidity. Prune for hedge shape or clearance; open interior occasionally
    for airflow in humid spells.


    🌾 Harvest / Best Use Timing:

    Berries are primarily wildlife food—human use is uncommon. Leave fruit for birds during migration windows. Growth flushes
    follow warm wet periods.'
