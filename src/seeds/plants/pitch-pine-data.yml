  description: |-
    Pitch pine (Pinus rigida) is a rugged northeastern North American pine of sandy barrens, rocky ridges, and fire-influenced forests, with twisted trunks, bundled needles in threes, and serotinous cones that open after heat. Trees range from shrubby to 20 meters (65 feet) in optimal sites. It tolerates poor, acidic soils where other pines struggle.

    It suits restoration on droughty sands, windbreaks on coastal exposures, and low-input timber systems where stem form is less critical than persistence.

    Full sun is required; sharp drainage and low fertility match ecology. Survives periodic drought but benefits from establishment irrigation on harsh sites.

    Sow seed in mineral mix after cold stratification, or plant bareroot nursery stock. Expect variable form from seed; select local ecotypes for restoration.

    Prune for clearance along trails; avoid flush cuts that invite resin bleeding. Manage fuel loads near structures because needles are flammable when dry.
  purpose: |-
    Wildlife Attractor: Seeds feed crossbills and small mammals; open canopy structure supports shrub-nesting birds -- retain diverse age classes where fire management allows.
    Erosion Control: Taproot and lateral roots bind sandy soils -- stabilizes coastal bluffs where salt spray selects tough conifers.
    Windbreaker: Stiff needles and flexible wood reduce wind speeds -- use on exposed edges with setback from buildings for ember risk.
    Mulcher: Acidic needle litter builds mor layers -- favors ericaceous understory when light reaches ground level.
    Ornamental: Irregular crowns read authentic in naturalistic designs -- contrasts with columnar cultivars of other species in designed plantings.
