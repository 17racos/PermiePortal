description: |-
  Arugula (Eruca vesicaria) is a fast-growing leafy annual in the mustard family, native to the Mediterranean and long cultivated across temperate and subtropical food systems. Plants form low rosettes 8-18 inches tall with deeply lobed leaves and spicy flavor, then send up flower stalks with cream-white blooms. In permaculture beds it earns its space as a quick turnover green, early nectar source, and living cover between slower crops.

  Arugula performs best in full sun to light partial shade. It prefers evenly moist, well-drained loam rich in organic matter and bolts fast in prolonged heat or drought stress. Mulch helps hold moisture and keep leaf flavor mild. It tolerates light frost down to about 25°F (-4°C) but declines in sustained heat above 90°F (32°C).

  Direct sow seed every 2-3 weeks during cool periods for steady harvests; germination usually takes 4-8 days. It can also be started in modules and transplanted at 2-3 true leaves for tighter spacing control. Volunteer reseeding is common if a few plants are allowed to flower and set seed.

  Cut outer leaves once plants reach 4-6 inches tall, usually 20-30 days from sowing. For bunch harvest, cut whole rosettes before bolting. Flowers are edible and useful in salads, and mature seed can be saved or used as a pungent spice.
purpose: |-
  Edible: Eruca vesicaria rosettes give mustard-pepper bite in salads while flower clusters and young siliques stay edible before heat turns them harsh -- cut outer leaves at 10-15 cm for cut-and-come-again beds between slower brassicas.
  Pollinator: Small cream flowers along bolted racemes feed solitary bees and syrphid flies in cool shoulder weeks when few other annuals are blooming -- let a few plants flower if you want volunteer seed without starving the pick row.
  Ground Cover: Dense 20-30 day sowings tile bare soil between tomatoes and carrots, cutting splash erosion and smothering chickweed flushes until the canopy crop closes the row.
