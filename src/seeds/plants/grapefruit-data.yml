  practitioner_notes: |-
    Color break can lie in humid winters—taste-test before you strip the tree for guests.
    Heavy fruit years load branches; thin young fruit on weak wood before summer storms do it for you.
    Root flare should breathe—mulch donuts, not mulch volcanoes, unless you enjoy stem rot fanfiction.
    If leaves look hungry but soil tests fine, look up—canopy shade and psyllid stress can mimic deficiency.
