description: |-
  Grapefruit (Citrus paradisi) is a large evergreen citrus tree, often 15–20 feet in cultivation on standard rootstock, with glossy leaves, fragrant white flowers, and big yellow to blush-pink fruit that can run sweet-tart depending on variety and ripeness. It is widely grown in humid subtropical and tropical food systems for fresh eating, juice, and marmalade, and it anchors many home orchards from the Gulf Coast through the Caribbean because the crop is heavy once the canopy matures.

  ☀️💧 Sun and Water Requirements:
  - Full sun (6–8+ hours) for sweet, well-colored fruit; thin inner canopy if branches shade each other.
  - Consistent moisture in well-drained, slightly acidic soil; citrus hates standing water and responds badly to long drought followed by flood irrigation.
  - Protect young bark and fruit from prolonged freezes near the lower end of its zone range; mature wood tolerates brief dips better than flowers and young fruit.

  ✂️ Propagation:
  - Commercial trees are almost always grafted (Tristeza-tolerant rootstocks are standard) for predictable fruit and disease traits.
  - Seeds grow but rarely match parent fruit quality and add years to first harvest.
  - Air-layering or rooted cuttings are possible for hobbyists but are uncommon compared with nursery grafts.

  🌾 Harvest / Best Use Timing:
  - Pick when sugar/acid balance tastes right on your site—color is a hint, not the whole story in warm winters.
  - Fruit can hold on the tree; stagger picks to avoid a single glut if you are feeding a household, not a packing house.
  - Juice and segments freeze reasonably; zest the peel before you compost thick rinds you will not candy.
purpose: |-
  Edible: Citrus paradisi bears large yellow to blush globes with bitter-sweet juice and aromatic peel -- eat fresh, juice for breakfast, candy thick rinds, and zest the flavedo before composting what you will not use.
  Medicinal: The flesh delivers vitamin C and bitter flavonoids from peel and pith -- grapefruit famously alters metabolism of several prescription drugs via liver enzymes, so verify interactions before medicinal self-experimentation.
  Pollinator: Masses of white, intensely fragrant citrus flowers offer nectar to honeybees and hoverflies during the warm-season bloom flush -- time understory herbs to avoid spraying when petals are open.
  Wildlife Attractor: Split fruit and pecked rinds attract orioles, mockingbirds, and other fruit specialists at the orchard edge -- leave a sacrificial branch outside netting if you want birds working pests elsewhere.
  Border Plant: A single grafted tree or tight row can define a sunny yard edge or driveway orchard -- space for mower swing radius and winter frost drainage, because crowding trunks invites skimpy fruit and bark issues.
companions:
- Comfrey — chop-and-drop mulch at the drip line feeds soil life without stealing
  the shallow feeder root zone if kept a foot or two out from the trunk.
- Nasturtium — bright trap crop at the orchard edge; edible flowers and leaves for
  salads while aphid pressure watches the nasturtium first.
- Marigold — root-zone companionship in citrus guild plantings; flowers also read
  as a visual scout row for soil critter activity.
