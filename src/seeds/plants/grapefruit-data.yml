  description: "Grapefruit (Citrus paradisi) is a large evergreen citrus tree, often 15–20 feet in cultivation on standard
    rootstock, with glossy leaves, fragrant white flowers, and big yellow to blush-pink fruit that can run sweet-tart depending
    on variety and ripeness. It is widely grown in humid subtropical and tropical food systems for fresh eating, juice, and
    marmalade, and it anchors many home orchards from the Gulf Coast through the Caribbean because the crop is heavy once
    the canopy matures.\n\n☀️💧 Sun and Water Requirements:\n- Full sun (6–8+ hours) for sweet, well-colored fruit; thin inner
    canopy if branches shade each other.\n- Consistent moisture in well-drained, slightly acidic soil; citrus hates standing
    water and responds badly to long drought followed by flood irrigation.\n- Protect young bark and fruit from prolonged
    freezes near the lower end of its zone range; mature wood tolerates brief dips better than flowers and young fruit.\n\n✂️
    Propagation:\n- Commercial trees are almost always grafted (Tristeza-tolerant rootstocks are standard) for predictable
    fruit and disease traits.\n- Seeds grow but rarely match parent fruit quality and add years to first harvest.\n- Air-layering
    or rooted cuttings are possible for hobbyists but are uncommon compared with nursery grafts.\n\n🌾 Harvest / Best Use Timing:\n-
    Pick when sugar/acid balance tastes right on your site—color is a hint, not the whole story in warm winters.\n- Fruit can
    hold on the tree; stagger picks to avoid a single glut if you are feeding a household, not a packing house.\n- Juice and
    segments freeze reasonably; zest the peel before you compost thick rinds you will not candy."
