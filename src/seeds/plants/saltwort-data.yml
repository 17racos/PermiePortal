description: |-
  Saltwort (Batis maritima) is a succulent perennial herb of tropical and subtropical coasts in the Americas, forming bright green mats in salt marshes, mangrove edges, and tidal flats. Jointed stems handle daily salt baths without drama. It is a core native for living shorelines, brackish restoration cells, and honest coastal food gardens where freshwater assumptions fail.

  Full sun; shade weakens stems and invites rot in humid air. Requires brackish to saline soil moisture; not a freshwater rock garden plant. Sand, mud, or shell substrates; tolerates periodic inundation.

  Stem cuttings root in brackish sand if nights stay warm. Seeds when available; sow in tidal nursery tables that mimic natural wetting cycles. Transplant plugs after stable salinity is confirmed on site.

  Young tips are eaten in some coastal traditions; confirm clean water quality before any harvest. For restoration, avoid stripping donor beds—use nursery-grown stock. Trim storm-tattered mats after calm weather to stimulate fresh joints.
purpose: |-
  Edible: Batis maritima jointed tips enter coastal kitchens only after you verify heavy-metal clean water -- texture is crisp-briny, not a suburban spinach substitute.
  Erosion Control: Succulent mats lock shell hash -- and mud under twice-daily tides where bare flats would liquefy under boat wake.
  Wildlife Attractor: Crabs and snails work the stem bases -- small fish nose the flooded carpet on high tides.
  Ground Cover: Bright green carpets exclude freshwater weeds -- salt glands on leaf surfaces eliminate competition that cannot handle salinity.
companions:
  - Saltmarsh Aster — upper-marsh composite adds late flowers above low saltwort carpet
  - Sea Oxeye Daisy — back-dune perennial with overlapping salt tolerance in protected zones
  - Sea Rocket — upper beach annual reseeds where salinity fluctuates beside perennial saltwort mats
cautions:
  - Harvest only from uncontaminated water; bioaccumulation is not a conspiracy theory
growth_habit: Succulent jointed stems forming low mats in intertidal and supratidal zones
