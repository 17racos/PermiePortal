  description: "Spicebush is an eastern North American understory laurel whose twigs
    smell like honest citrus-spice tea when scratched. Yellow early spring flowers,
    glossy leaves, and red drupes on female plants feed migrating birds. In subtropical and tropical Americas
    panhandle and cooler 8b/9a pockets it shines in partial shade; farther south heat
    and humidity can stress it — site like a woodland edge, not a parking lot median.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Part shade to dappled sun;
    tolerates more sun if soil stays moist.\n- Rich, acidic, woodsy soil with mulch.\n-
    Avoid drought baking on sand without organic matter.\n\n✂️\U0001FAD8 Methods to
    Propagate:\n- Seeds need warm/cold cycles; sow fresh or stratify thoughtfully.\n-
    Softwood cuttings with humidity.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Twigs and leaves for tea/tincture traditions where ethically
    harvested.\n- Berries: spice experiments — verify sexed plants and ID."
  purpose: |-
    Spicebush is native guild glue for humid eastern forests:

    - Edible: Berries and aromatic twigs in traditional uses (learn safe preparation).
    - Wildlife Attractor: Early nectar, fall fruit for birds.
    - Medicinal: Ethnobotanical history — not a supplement aisle endorsement.
    - Border Plant: Soft texture along shady paths and food-forest understory.
