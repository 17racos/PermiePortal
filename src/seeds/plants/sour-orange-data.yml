- common_name: Sour Orange
  picture: sour_orange.jpg
  scientific_name: Citrus × aurantium
  aka:
  - Seville orange
  - Bitter orange
  family: Rutaceae
  zone: "9-11"
  ideal_temp_min: 55
  ideal_temp_max: 95
  min_temp: 22
  max_temp: 105
  perennial: true
  layers:
  - Tree
  - Shrub
  plant_function:
  - Edible
  - Medicinal
  - Wildlife Attractor
