  description: |-
    Sour orange is Citrus × aurantium wearing its working-class name tag — thorny, aromatic, and historically the rootstock and marmalade backbone of the humid South. Naturalized in places that now side-eye it. subtropical and tropical Americas: marginal in 9a without protection; citrus greening and psyllid politics are the real HOA.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for fruit and flower density.
    - Well-drained, slightly acidic soil; consistent moisture but not saturated roots.
    - Windbreak reduces cosmetic leaf miner damage; does not cure industry-scale disease.
    
    ✂️ Methods to Propagate:
    - Budding and grafting onto selected rootstocks — how the trade does it.
    - Seeds: variable offspring; useful for rootstock experiments and hedgerow chaos.
    
    🌾 Harvest / Best Use Timing:
    - Pick Sour Orange fruit when sugar-acid balance peaks for your use -- marmalade wants different timing than fresh slices.
    - Color is a hint, not a contract; sample one fruit from each sector of the canopy.
    - Store fresh citrus cool and dry; zest freezes well if you strip peel before shrivel sets in.
  purpose: |-
