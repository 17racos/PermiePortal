  description: |-
    Sour orange is Citrus × aurantium wearing its working-class name tag — thorny, aromatic, and historically the rootstock and marmalade backbone of the humid South. Naturalized in places that now side-eye it. Florida and Puerto Rico: marginal in 9a without protection; citrus greening and psyllid politics are the real HOA.

    ☀️💧 Sun and Water Requirements:
    - Full sun for fruit and flower density.
    - Well-drained, slightly acidic soil; consistent moisture but not saturated roots.
    - Windbreak reduces cosmetic leaf miner damage; does not cure industry-scale disease.

    ✂️ Methods to Propagate:
    - Budding and grafting onto selected rootstocks — how the trade does it.
    - Seeds: variable offspring; useful for rootstock experiments and hedgerow chaos.
  purpose: |-
    Sour orange is hedgerow utility citrus:

    - Edible: Marmalade, liqueurs, and bitter culinary traditions — respect the acid.
    - Medicinal: Peel and flower uses in herbal lineages — verify safety and sourcing.
    - Wildlife Attractor: Flowers for pollinators; fruit for wildlife if you surrender some.
    - Windbreaker: Dense, thorny growth can armor microclimates — also armor your arms while pruning.
  companions:
  - Comfrey
  - Clover
  - Nasturtium
  avoid:
  - Planting as naive "easy citrus" without regional disease context
  - Heavy wet feet in winter cold
  pests:
  - Asian Citrus Psyllid
  - Citrus Leafminer
  - Citrus Greening
  - Brown Citrus Aphid
  - Citrus Rust Mite
  - Citrus Whitefly
  - Citrus Root Weevil
  - Diaprepes Root Weevil
  - Sooty Mold
