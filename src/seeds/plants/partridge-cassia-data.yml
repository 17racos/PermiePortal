  description: "Partridge cassia here maps to Chamaecrista nictitans, a warm-season
    annual or short-lived legume of open sandy soils, roadsides, and disturbed ground
    across much of the Americas in tropical to warm-temperate climates. Leaves fold
    on touch like a modest mimosa; small yellow flowers give way to slender pods.
    It is a native disturbance responder that fixes nitrogen while early succession
    looks messy to lawn purists.\n\n☀️💧 Sun and Water Requirements:\n- Full sun;
    shade reduces bloom and nodulation.\n- Drought tolerant once established in
    warm months; still benefits from rain after germination.\n- Sandy or well-drained
    soils match its ecology; avoids stagnant wet clay.\n\n✂️ Propagation:\n- Direct-sow
    seed after soil warms; scarify if germination is slow.\n- Thin seedlings to avoid
    overcrowding that favors powdery mildew.\n- Do not transplant taprooted volunteers
    late—move tiny seedlings if needed.\n\n🌾 Harvest / Best Use Timing:\n- For cover,
    mow or crimp at early pod set if managing a succession bed; leave some plants
    to reseed.\n- Seeds mature unevenly—collect brown pods before full shatter for
    intentional replanting.\n- Leave patches blooming for specialist bees that recognize
    small cassioid flowers."
  purpose: |-
