  description: 'Partridge cassia here maps to Chamaecrista nictitans, a warm-season annual or short-lived legume of open sandy
    soils, roadsides, and disturbed ground across much of the Americas in tropical to warm-temperate climates. Leaves fold
    on touch like a modest mimosa; small yellow flowers give way to slender pods. It is a native disturbance responder that
    fixes nitrogen while early succession looks messy to lawn purists.


    ☀️💧 Sun and Water Requirements:

    - Full sun; shade reduces bloom and nodulation.

    - Drought tolerant once established in warm months; still benefits from rain after germination.

    - Sandy or well-drained soils match its ecology; avoids stagnant wet clay.


    ✂️ Propagation:

    - Direct-sow seed after soil warms; scarify if germination is slow.

    - Thin seedlings to avoid overcrowding that favors powdery mildew.

    - Do not transplant taprooted volunteers late—move tiny seedlings if needed.


    🌾 Harvest / Best Use Timing:

    - For cover, mow or crimp at early pod set if managing a succession bed; leave some plants to reseed.

    - Seeds mature unevenly—collect brown pods before full shatter for intentional replanting.

    - Leave patches blooming for specialist bees that recognize small cassioid flowers.'
  purpose: '- Nitrogen Fixer: Root nodules feed soil nitrogen during the fast warm-season growth window.

    - Pollinator: Yellow flowers supply pollen and nectar to small bees in open sunny sites.

    - Wildlife Attractor: Foliage feeds caterpillars of sulphur butterflies; seeds feed birds if left standing.

    - Ground Cover: Low branching stems cover bare soil between slower perennials in young meadows.'
