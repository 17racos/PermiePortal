  description: 'Bouteloua dactyloides is the warm-season turf species that actually evolved on North American prairies instead
    of in a petrochemical marketing deck. Fine texture, stolons, dioecious populations — male and female plants are separate,
    which matters if you buy seed mixes expecting instant lawn. Humid-warm regions sit near the edge of its comfort; some
    cultivars sulk where summer nights stay tropical wet.


    ☀️💧 Sun and Water Requirements:


    Full sun — shade turns it into a thin regret.

    Low water once established; deep infrequent beats daily spritzing.

    Well-drained soils; tolerates heat and modest salinity better than Kentucky bluegrass cosplay.


    ✂️ Propagation:


    Plugs or sod for predictable cover.

    Seed with correct male/female expectations — read the label like it matters.


    🌾 Harvest / Best Use Timing:


    Mow or graze lightly if using as low-input ground cover—not a hay monster.'
  purpose: |-
    Ground Cover: Ground-cover behavior is the product: Fine texture, stolons, dioecious populations  --  male and female plants are separate, which matters if you buy seed mixes expecting instant lawn. -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
    Erosion Control: Buffalo Grass networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Drought Tolerant: Buffalo Grass carries marginal beds once established, buying time between irrigations in dry subtropical to temperate swings -- carries the system through dry spells with less irrigation drama once roots find their depth
