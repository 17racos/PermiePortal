description: |-
  Bouteloua dactyloides is the warm-season turf species that actually evolved on North American prairies instead of in a petrochemical marketing deck. Fine texture, stolons, dioecious populations — male and female plants are separate, which matters if you buy seed mixes expecting instant lawn. Humid-warm regions sit near the edge of its comfort; some cultivars sulk where summer nights stay tropical wet.

  ☀️💧 Sun and Water Requirements:

  Full sun — shade turns it into a thin regret.
  Low water once established; deep infrequent beats daily spritzing.
  Well-drained soils; tolerates heat and modest salinity better than Kentucky bluegrass cosplay.

  ✂️ Propagation:

  Plugs or sod for predictable cover.
  Seed with correct male/female expectations — read the label like it matters.

  🌾 Harvest / Best Use Timing:

  Mow or graze lightly if using as low-input ground cover—not a hay monster.
purpose: |-
  Ground Cover: Bouteloua dactyloides stolons weave a fine blue-green turf in full sun once soil hits steady 60°F for germination, giving warm-season cover where fescue thins every August.
  Erosion Control: Rhizomatous mats lock shallow topsoil on berms after two growing seasons, cutting rill formation when thunderstorms hit bare clay caps.
  Drought Tolerant: Deep roots survive weeks without irrigation once established, though the same trait means it sulks in deep shade under evergreen oak canopies.
