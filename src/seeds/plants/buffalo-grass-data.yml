  practitioner_notes: 'It is a warm-season stolon grass—spring seeding into cold soil buys you a weed nursery; soil needs
    sustained 60°F (16°C) before germination wakes.

    Mixes with blue grama for more complete cover—pure buffalo can look thin on heavy clay without summer rest from foot traffic.

    Mow high or not at all—scalping exposes crowns; three inches or taller reads shaggy but survives dog summers.

    Weed competition in year one is the whole battle—frequent light watering beats deep soak until stolons knit.'
