  description: "Bouteloua dactyloides is the warm-season turf species that actually
    evolved on North American prairies instead of in a petrochemical marketing deck.
    Fine texture, stolons, dioecious populations — male and female plants are separate,
    which matters if you buy seed mixes expecting instant lawn. North Florida sits
    near the humidity edge; some cultivars sulk where summer nights stay tropical
    wet.\n\n🌞💧 Sun and Water Requirements:\n- Full sun — shade turns it into a
    thin regret.\n- Low water once established; deep infrequent beats daily spritzing.\n-
    Well-drained soils; tolerates heat and modest salinity better than Kentucky bluegrass
    cosplay.\n\n✂️🌱 Methods to Propagate:\n- Plugs or sod for predictable cover.\n-
    Seed with correct male/female expectations — read the label like it matters.\n\n🧺
    When to Harvest:\n- Mow or graze lightly if using as low-input ground cover —
    not a hay monster."
  purpose: |-
    Buffalo grass is xeric lawn rebellion: fewer inputs than cool-season grass cults,
    decent erosion control on sunny slopes, and honest warm-season timing. It is not
    a shade solution or a tropical rainforest understory — design accordingly.
