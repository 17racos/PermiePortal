  description: "American filbert (Corylus americana) is the same species widely called
    American hazelnut: a suckering deciduous shrub of eastern and central North America
    that forms clumps roughly 8–16 feet (2.5–5 m) tall, with softly hairy leaves and
    long pale catkins in late winter to early spring. Small nuts hide in leafy husks
    that squirrels treat as a public buffet. It is a backbone plant for hedgerows,
    windbreaks, and savanna-style food forests where you want native genetics and informal
    structure rather than a single-trunk orchard tree.\n\n☀️💧 Sun and Water Requirements:\nFull
    sun to partial shade; best nut production in high light. Prefers moist, well-drained,
    fertile loam with steady organic matter; tolerates rocky slopes but fills nuts
    slowly under drought. Mulch conserves moisture around shallow roots; avoid compacted
    heavy clay without amendment.\n\n✂️ Propagation:\nLayer stems that touch soil;
    sever rooted layers the next dormant season. Sow fresh nuts outdoors in rodent-proof
    beds or stratify and sow in spring. Transplant suckers with ample fibrous roots
    in early spring; bare-root large clumps slowly.\n\n🌾 Harvest / Best Use Timing:\nGather
    when husks loosen and nuts can be twisted free, usually in early fall in temperate
    areas. Dry thoroughly before storage; crack soon for eating or roast to improve
    flavor and storage stability."
  purpose: |-
    - Edible: Small sweet kernels reward hand processing and home roasting.
    - Wildlife Attractor: Catkins, nuts, and thicket cover feed birds, mammals, and insects.
