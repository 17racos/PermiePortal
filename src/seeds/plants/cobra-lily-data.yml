  description: "Darlingtonia californica, commonly known as the Cobra Lily, is a unique
    carnivorous plant native to Northern California and Oregon. Its tubular leaves
    resemble a rearing cobra, complete with a forked \"tongue,\" which lures insects
    into its trap. The plant's pitchers can grow up to 1 meter (approximately 3.3
    feet) tall under optimal conditions. Unlike other pitcher plants, the Cobra Lily
    regulates the water level in its pitchers by absorbing or releasing water through
    its roots. It thrives in nutrient-poor, acidic bogs and seeps with cold running
    water, often on serpentine soils.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nPrefers
    sunny conditions in humid, warm environments but can tolerate part-shade if humidity
    is low. Requires consistently moist, cool soils, often found near cold mountain
    streams or bogs.\n\n✂️\U0001FAD8 Methods to Propagate:\nBest propagated through
    stolon division in late winter or early spring. Cut stolons into sections with
    roots attached and place on moist sphagnum moss in a humid environment with bright
    light.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nAs a carnivorous
    plant primarily grown for ornamental purposes, there is no specific harvest period.
    Regular observation and maintenance are recommended to ensure plant health."
