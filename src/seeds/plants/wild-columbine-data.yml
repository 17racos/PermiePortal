  description: "Wild columbine (Aquilegia canadensis) is a short-lived perennial of eastern North American wood margins and cliffs, with red and yellow nodding flowers adapted to hummingbirds and long-tongued bees. Plants reach 1–2 feet (30–60 cm), self-sowing into rocky, well-drained pockets. It thrives in dappled shade and lean soils where irrigation is modest.\n\n☀️💧 Sun and Water Requirements:\nPartial shade to light sun; afternoon shade reduces scorch in hot climates. Well-drained, humus-rich soils suit it; tolerates rocky slopes. Avoid wet clay; mulch lightly.\n\n✂️ Propagation:\nSow seed outdoors in fall; allow self-sowing where volunteers are welcome. Divide carefully—taproot resents shovel violence.\n\n🌾 Harvest / Best Use Timing:\nLeave flowers for pollinators; collect seed when capsules split if expanding patches ethically. Peak bloom tracks local spring warmth."
