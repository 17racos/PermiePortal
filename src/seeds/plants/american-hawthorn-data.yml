  description: 'American hawthorn here refers to downy hawthorn (Crataegus mollis), a native North American small tree of
    woodland edges and pastures, bearing showy white spring blossoms, red fall fruit, and thorny architecture that laughs
    at casual browsing. It typically grows 20–30 feet (6–9 m) with a rounded crown and rough, scaly bark; fruit is mealy but
    usable for jellies where traditions still remember how. In permaculture it is a hardy windbreak element, wildlife pantry,
    and informal hedge species for temperate hedgerows.


    ☀️💧 Sun and Water Requirements:

    Full sun to light partial shade; more sun equals denser flowering and heavier fruit. Tolerates a wide soil range if drainage
    is reasonable; occasional deep watering helps young trees through dry spells. Avoid planting in stagnant low spots that
    keep roots hypoxic for weeks.


    ✂️ Propagation:

    Sow seed after warm-cold stratification cycles typical for the genus—many growers outdoor-sow in fall and wait. Chip or
    soak hard seeds to improve germination speed. Graft named selections if you require specific fruit traits; seed-grown
    plants vary.


    🌾 Harvest / Best Use Timing:

    Collect ripe red haws after the first light frost softens tannins for some recipes, or follow regional jelly timing. Screen
    out stems and insect-damaged fruit before cooking. Prune in late winter to remove crossing branches and improve light
    inside the crown.'
  purpose: '- Edible: Fruit processes into jelly, syrup, and fermented preparations where sugar and acid balance.

    - Wildlife Attractor: Flowers feed pollinators; haws feed birds and mammals through cold months.

    - Windbreaker: Thorny, twiggy crown slows wind along fencelines and field margins.

    - Border Plant: Dense habit and thorns define edges without plastic fence cosplay.

    - Ornamental: Spring bloom and scarlet fruit give long-season structure in multifunctional rows.'
