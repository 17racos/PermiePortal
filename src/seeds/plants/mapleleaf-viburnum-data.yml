description: |-
  Mapleleaf viburnum (Viburnum acerifolium) is a deciduous understory shrub of eastern North American forests, with three-lobed leaves reminiscent of maple, creamy late-spring flowers, and dark berries that ripen for birds in late summer. Humans can sample berries cautiously—flavor is mild and variable, and positive ID is mandatory because not all viburnums are snack allies. It thrives in dappled shade under oaks and hickories, filling the niche between spring ephemerals and tall canopy drama.

  Partial to full shade; tolerates morning sun in cool climates. Prefers moist, well-drained, humus-rich forest soils; tolerates dry shade once established but grows slowly. Mulch with leaf mold; avoid bark volcanoes against stems. Cold-hardy deep into northern zones; heat stress appears in full-sun exposures southward without irrigation.

  Softwood cuttings under mist in early summer root for clones.
  Seeds require double dormancy warm-cold cycles—plan multi-year nursery patience.

  Sample berries only when fully ripe, soft, and confirmed by multiple field marks—spit test first. For wildlife-first gardens, leave fruit clusters intact. Prune after fruiting if shaping; avoid heavy spring cuts that remove flowers.
purpose: |-
  Wildlife Attractor: Viburnum acerifolium clusters of black-blue drupes feed thrushes and small mammals -- while flat-topped spring flowers supply nectar to native bees in oak-hickory understories.
  Edible: Fully ripe berries taste mildly sweet with almond-adjacent notes -- nibble only with confident ID because other viburnums carry compounds you do not want to trial-and-error.
  Border Plant: Three-lobed leaves echo maple texture at knee height along shaded paths -- tolerates dry shade once established if oak leaf mulch keeps roots cool.
  Ornamental: Fall shifts mauve-pink before leaf drop -- pairs with witch-hazel for late-season interest when most understory shrubs are sticks.
