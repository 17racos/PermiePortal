description: |-
  Corsican stonecrop (*Sedum dasyphyllum*) is a tiny, mat-forming succulent with bead-like leaves that blush rose in sun, rooting along stems as it creeps over rocks and wall caps. Individual rosettes are only millimeters across, but colonies spread widely in favorable cracks. It is a classic green roof and crevice plant for sharp drainage. In subtropical and tropical Americas it thrives in bright, breezy, fast-drying microsites—humid shade invites rot, so give it rooftop, path edge, or hypertufa conditions.

  Full sun to very bright shade. Extremely well-drained gritty mix; essentially no irrigation once established except during prolonged drought in containers.

  Stem fragments: Press broken pieces onto moist grit; roots form at nodes in warm weather. Offsets: Detach rooted mats from mother colonies in spring and press into crevices.

  Refresh mats every few years if centers thin out—replant vigorous edge growth. Avoid heavy foot traffic; best viewed, not stepped on.
purpose: |-
  Ornamental: Bead-like blue-green leaves blush rose in sun, rooting into hypertufa pockets and wall caps where larger plants would desiccate.
  Ground Cover: Mat-forming Sedum dasyphyllum excludes many annual weeds on green roofs and path cracks once colonies knit.
  Erosion Control: Interlocking stems and adventitious roots grip thin soil on vertical stonework and alpine berms until mortar joints stabilize.
  Water Retention: CAM tissue stores water through droughty weeks, plumping again within hours of a rare summer shower.
