  description: "Corsican stonecrop (*Sedum dasyphyllum*) is a tiny, mat-forming succulent
    with bead-like leaves that blush rose in sun, rooting along stems as it creeps
    over rocks and wall caps. Individual rosettes are only millimeters across, but
    colonies spread widely in favorable cracks. It is a classic green roof and crevice
    plant for sharp drainage. In subtropical and tropical Americas it thrives in bright, breezy,
    fast-drying microsites—humid shade invites rot, so give it rooftop, path edge,
    or hypertufa conditions.\n\n☀️💧 **Sun and Water Requirements:**\nFull sun to
    very bright shade. Extremely well-drained gritty mix; essentially no irrigation
    once established except during prolonged drought in containers.\n\n✂️ **Methods
    to Propagate:**\n- **Stem fragments:** Press broken pieces onto moist grit; roots
    form at nodes in warm weather.\n- **Offsets:** Detach rooted mats from mother
    colonies in spring and press into crevices.\n\n🌾 **Best Use Timing:**\nRefresh
    mats every few years if centers thin out—replant vigorous edge growth. Avoid heavy
    foot traffic; best viewed, not stepped on."
  purpose: |-
    - **Ornamental:** Living grout between pavers and stones reads as deliberate, not neglected.
    - **Ground Cover:** Succulent carpet excludes some weeds on lean soils where turf would demand absurd inputs.
    - **Erosion Control:** Interlocking roots and stems armor thin soil on slopes and wall tops.
    - **Water Retention:** CAM succulence buffers short dry spells without sprinklers.
