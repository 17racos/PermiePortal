  description: "Cuban oregano (*Coleus amboinicus*) is a semi-succulent perennial
    herb native to southern and eastern Africa. It features thick, fleshy, and aromatic
    leaves covered with fine hairs, emitting a strong fragrance reminiscent of oregano
    with hints of thyme and turpentine. The plant typically grows up to 45 cm in height
    and spreads widely, making it suitable as a ground cover or container plant. It
    produces small, tubular flowers in shades of pink, white, or lavender. Cuban oregano
    thrives in well-drained soil with full sun to partial shade and requires protection
    from frost, as it is sensitive to cold temperatures.\n\n\U0001F31E\U0001F4A7 Sun
    and Water Requirements:\n- **Sun:** Prefers full sun but tolerates partial shade;
    in hot climates, some afternoon shade can prevent leaf scorching.\n- **Water:**
    Requires well-drained soil; water sparingly once established, allowing the soil
    to dry out between waterings to prevent root rot.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    **Stem Cuttings:** Take 10-15 cm cuttings from healthy, non-flowering stems. Remove
    the lower leaves and plant the cuttings in well-draining soil. Keep the soil moist
    until roots develop, typically within 2-3 weeks.\n- **Division:** Mature plants
    can be divided in spring. Carefully separate the root ball into sections, ensuring
    each section has healthy roots and shoots, then replant immediately.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Harvest leaves as needed throughout the growing season. For
    the best flavor, pick leaves in the morning after the dew has dried. Regular harvesting
    encourages bushier growth and prevents flowering, which can alter the flavor of
    the leaves."
  purpose: |-
    - Edible: The aromatic leaves are used sparingly in culinary applications to flavor meats, stews, and soups due to their strong, pungent taste.
    - Medicinal: Traditionally utilized in various cultures to address respiratory issues, digestive problems, and skin conditions.
    - Pollinator: The tubular flowers attract bees and other pollinators, enhancing garden biodiversity.
    - Ground Cover: Its spreading habit makes it effective in covering soil, reducing weed growth and soil erosion.
