  description: 'Coral Bean (*Erythrina herbacea*) is a deciduous to evergreen shrub native to the southeastern United States.
    It typically grows between 0.9 to 6 meters (3 to 20 feet) tall, featuring thorny stems and trifoliate leaves with arrowhead-shaped
    leaflets. The plant produces striking scarlet tubular flowers arranged in elongated clusters, which bloom from spring
    to early summer and are highly attractive to hummingbirds and butterflies. Following the flowering period, it develops
    seed pods containing bright red seeds. Coral Bean thrives in sandy, well-drained soils and is commonly found in open woodlands,
    coastal hammocks, and disturbed areas.


    ✂️🫘 Methods to Propagate:

    - **Seeds:** Collect seeds from mature pods and plant them in well-draining soil. Scarification or soaking may improve
    germination rates.

    - **Cuttings:** Semi-hardwood cuttings can be taken during the growing season and rooted in a moist, well-draining medium.


    🌞💧 Sun and Water Requirements:

    - **Sun:** Prefers full sun to partial shade.

    - **Water:** Drought-tolerant once established but benefits from regular watering during prolonged dry periods.


    🧑‍🌾👩‍🌾 When to Harvest:

    - **Seeds:** Harvest mature seed pods in late summer to early fall when they turn brown and begin to split open.'
