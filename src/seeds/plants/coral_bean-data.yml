  description: "Coral Bean (*Erythrina herbacea*) is a deciduous to evergreen shrub
    native to the southeastern United States. It typically grows between 0.9 to 6
    meters (3 to 20 feet) tall, featuring thorny stems and trifoliate leaves with
    arrowhead-shaped leaflets. The plant produces striking scarlet tubular flowers
    arranged in elongated clusters, which bloom from spring to early summer and are
    highly attractive to hummingbirds and butterflies. Following the flowering period,
    it develops seed pods containing bright red seeds. Coral Bean thrives in sandy,
    well-drained soils and is commonly found in open woodlands, coastal hammocks,
    and disturbed areas.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Seeds:** Collect
    seeds from mature pods and plant them in well-draining soil. Scarification or
    soaking may improve germination rates.\n- **Cuttings:** Semi-hardwood cuttings
    can be taken during the growing season and rooted in a moist, well-draining medium.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- **Sun:** Prefers full sun to partial shade.\n-
    **Water:** Drought-tolerant once established but benefits from regular watering
    during prolonged dry periods.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When
    to Harvest:\n- **Seeds:** Harvest mature seed pods in late summer to early fall
    when they turn brown and begin to split open."
  purpose: |-
    - **Edible:** While the seeds are toxic if ingested, the flowers have been used in traditional Central American cuisine, added to soups and patties for their mild narcotic properties.
    - **Medicinal:** Various Native American tribes have utilized parts of the plant for medicinal purposes, such as treating bowel pain, digestive issues, and rheumatic disorders.
    - **Wildlife Attractor:** The vibrant flowers provide nectar for hummingbirds, butterflies, and bees, supporting local pollinator populations.
    - **Erosion Control:** The extensive root system helps stabilize soil, making it useful for erosion control on slopes and disturbed sites.
    - **Border Plant:** Its striking appearance and thorny stems make it an excellent choice for natural fencing and as a deterrent for unwanted foot traffic.
