  description: 'Pindo palm is the cold-tolerant feather palm that drops messy, fragrant yellow fruit and dares you to make
    jelly. Landscape architects love the blue-gray fronds; squirrels love everything.


    A realistic palm for 8b/9a with established specimens handling short dips better than marketing brochures admit. Still:
    plant the crown high, improve drainage, and skip the fantasy that it is a coconut.


    Sun and water: Full sun once established; young plants appreciate part shade. Drought-tolerant when mature but fruits
    better with deep, occasional watering in well-drained soil.

    ✂️ Propagation:

    Fresh seeds (slow germination, months are normal); transplant only small specimens—large palms resent root disturbance.'
  purpose: '- Edible: Ripe yellow fruit fuels jelly, syrup, and wine-adjacent kitchen experiments—process soon after harvest
    before enzymes keep chewing in silence.

    - Ornamental: Blue-gray feather fronds and a rounded crown deliver evergreen structure and dappled shade where a coconut
    fantasy would lie.

    - Windbreaker: Plant in groups or rows on dry, windy sites to blunt desiccating air the way softer shrubs cannot.

    - Wildlife Attractor: Fallen fruit feeds squirrels, birds, and opportunists regardless of human approval schedules.'
  companions:
