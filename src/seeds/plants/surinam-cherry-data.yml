  description: "Surinam cherry is a myrtle relative with ribbed, lantern fruits that taste resinous-tropical — love it or\
    \ pretend you never met it. In Florida it is a documented invasive in many counties, seeding into hammocks and disturbed\
    \ ground. If you already have it, harvest hard and remove seedlings; if you are planting new, pick native alternatives\
    \ unless you enjoy explaining yourself to land managers. Full sun, heat, and decent drainage make it fruit; freezes nip\
    \ northern margins.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun for heaviest fruiting.\n- Moderate\
    \ water; drought-tolerant once established but fruits better with even moisture.\n- Well-drained soil; tolerates sandy\
    \ Florida yards.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds germinate readily — which is the ecological problem.\n\
    - Cuttings and air-layering for clones.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Pick fully colored\
    \ fruit; unripe berries are not a prank worth repeating.\n- Overripe can taste better to some palates, animal-bait to\
    \ others."
