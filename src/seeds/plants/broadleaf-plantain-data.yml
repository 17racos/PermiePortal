  description: "Plantago major is the rosette that colonized sidewalks worldwide—low,
    ribbed leaves, stringy leaf veins you peel like nature’s dental floss, and flower
    spikes bees occasionally bother with. Young leaves are mild cooked; older ones
    need the ‘desperation greens’ mindset.\n\nFlorida and Puerto Rico / subtropical: Thrives
    in cool wet seasons and irrigated lawn dystopia; slows in deep drought but usually
    rebounds. Not shade-phobic.\n\nSun and water: Full sun to part shade; tolerates
    compaction and mediocre soil—hence the footprint nickname. Likes consistent moisture
    but survives dry spells as a sad but alive rosette.\n\nPropagation: Self-sows freely;
    dig and transplant rosettes; root pieces can resprout—plan accordingly if you
    wanted it ‘contained.’"
  purpose: |-
