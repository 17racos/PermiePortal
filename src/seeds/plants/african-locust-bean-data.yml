  description: 'African locust bean (Parkia biglobosa) is a tall, deciduous-in-dry-season legume tree of African savannas
    and woodlands, famous for pompom-like flower heads and long brown pods holding edible seeds and pungent fermented condiments.
    Mature trees commonly reach roughly 15–25 m with a spreading crown and bipinnate leaves that cast dappled shade.


    subtropical and tropical Americas suit it only in the warmest, frost-rare pockets—think tropical and subtropical zones
    10b/11 and Puerto Rico lowlands—where dry-season clarity matches its natural rhythm. Humid wet seasons are acceptable
    with drainage; root rot politics follow soggy clay.


    ☀️💧 Sun and Water Requirements:

    - Full sun for strong nodulation, flowering, and pod set.

    - Deep, well-drained soil; deep watering when young, then lean toward drought-tolerant management once anchored—avoid
    continuous wilting in Puerto Rico’s dry season if you want pod production.


    ✂️ Methods to Propagate:

    - Seeds: scarify or soak overnight, sow in warm mix; keep heat consistent for uniform emergence.

    - Wildlings or grafted selections where available—preferred if you need known pod chemistry for kitchen use.


    🌾 Harvest / Best Use Timing:

    - Gather pods when mature and brown before they disintegrate on the tree if you want clean seed recovery.

    - Seeds and fermented products are the human-use headline; pods also matter for livestock in traditional systems—match
    harvest to your actual processing tolerance, not Instagram aesthetics.'
  purpose: 'Parkia is a classic savanna legume tree that slots into tropical agroforestry as food, feed, and soil infrastructure.


    - Edible: Seeds and fermented condiments anchor regional cuisines where the tree is already integrated.

    - Nitrogen Fixer: Rhizobial nodules on roots enrich surrounding soil for guild partners at the drip line.

    - Animal Fodder: Pods and processed pulp historically feed livestock—integrate with rotational browsing, not bulldozer
    stocking rates.

    - Shade Provider: Open canopy shades understory crops during brutal sun without turning the yard into a cave.

    - Mulcher: Leaf fall feeds detritivores and buffers soil temperature in tropical heat.

    - Wildlife Attractor: Flowers are a nectar spectacle; pods feed mammals and insects—plan accordingly.'
  companions:
  - Sorghum — seasonal grain at the edge uses the light gap under open canopy without demanding irrigation theater.
  - Pigeon Pea — second legume layer for staggered nitrogen inputs and chop-and-drop mulch at a different height class.
  - Cassava — drought-tolerant understory carbohydrate that tolerates part shade once Parkia is tall enough.
