  practitioner_notes: 'Dawadawa flavor is fermentation-forward—small batches beat giant bucket experiments until you like
    the aroma profile.

    Pods harvested too green are a chore to thresh; wait for the woody rattle but before total pod explosion on the tree.

    Crown lift helps understory light, but surface roots still hunt mulch—keep heavy tillage away from the drip line.'
