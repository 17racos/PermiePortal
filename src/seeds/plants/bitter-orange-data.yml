  description: |-
    Bitter orange is the citrus your marmalade dreams are built on — too sour for polite juice, perfect for candied peel and existential cooking. Thorny and tough, it has escaped and naturalized in places that now regret casual planting. In subtropical and tropical Americas it is marginal outside protected 9b pockets; young trees freeze, older wood can return from below if rootstock cooperates. Citrus greening territory means management reality, not Pinterest.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for flower and fruit density.
    - Well-drained, slightly acidic soil; consistent moisture but not soggy roots.
    - Wind protection reduces leaf miner tears cosmetically, not politically.
    
    ✂️ Methods to Propagate:
    - Budding and grafting onto selected rootstocks — commercial path.
    - Seeds: grow for rootstock or curiosity; fruit quality diverges wildly.
    
    🌾 Harvest / Best Use Timing:
    - Pick Bitter Orange fruit when sugar-acid balance peaks for your use -- marmalade wants different timing than fresh slices.
    - Color is a hint, not a contract; sample one fruit from each sector of the canopy.
    - Store fresh citrus cool and dry; zest freezes well if you strip peel before shrivel sets in.
  purpose: 'Bitter orange is utility citrus with hedgerow attitude:


    - Edible: Marmalade, liqueurs, and traditional bitter preparations.

    - Medicinal: Peel and flower waters show up in herbal traditions — verify safety and sourcing.

    - Ornamental: Fragrant flowers and glossy evergreen leaves.

    - Wildlife Attractor: Flowers feed pollinators; fruit feeds wildlife if you surrender some.'
