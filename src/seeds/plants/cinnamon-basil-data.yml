  description: |-
    Cinnamon basil is a sweet basil cultivar with purple stems and a warm spicy note that whispers cinnamon without being dessert. Standard culinary basil life cycle: heat-loving annual in most of the U.S., possible short-lived perennial in frost-free Florida if you do not let it flower into exhaustion. subtropical and tropical Americas: plant after frost, harvest aggressively, let a few spikes bloom for pollinators if you can spare the leaf quality dip.
    
    ☀️💧 Sun and Water:
    - Full sun and warm nights; sulks below 50°F.
    - Even moisture; avoid wet feet; mulch reduces splash-borne disease.
    
    ✂️ Propagation:
    - Seed each season for volume; clones from cuttings keep flavor true.
    - Pinch tips for bushiness; flower spikes are bee candy.
    
    Pairs with tomatoes like sarcasm pairs with committee meetings.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Cinnamon Basil growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
  purpose: |-
    Edible: Purple-stemmed leaves bring clove-cinnamon perfume to fruit salads, syrups, teas, and Southeast Asian dishes where sweet basils read too flat.
    Pollinator: Whorls of small white flowers open along spikes to feed bees once you allow a few columns to bloom past the leaf-harvest stage.
    Pest Management: High volatile-oil foliage can obscure host-plant odors for thrips and aphids when Ocimum is woven through tomato and pepper rows.
    Ornamental: Bronze stems and columnar habit photograph cleanly for nursery benches and front-yard herb spirals in frost-free towns.
