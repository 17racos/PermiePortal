  practitioner_notes: 'Drooping petals are a feature—if you want stiff mopheads, buy a different coneflower at the impulse
    rack.

    Taproot species hate “casual” transplanting—plan position like you mean marriage, not speed dating.

    Aster yellows turns cones green and weird—remove infected plants before phytoplasma spreads via leafhoppers.

    Goldfinches will shred seed heads—decide whether bouquets or birds win each row.'
