  description: 'The Ponytail Palm (*Beaucarnea recurvata*) is a drought-tolerant plant native to eastern Mexico. Despite its
    common name, it is not a true palm. The plant features a bulbous trunk base that stores water and long, slender, arching
    leaves that resemble a ponytail. It can grow up to 9 meters (30 feet) outdoors but remains much smaller indoors.


    🌞💧 **Sun and Water Requirements:**

    Thrives in bright light, including full sun. Requires infrequent watering; allow the soil to dry out between waterings
    to prevent root rot.


    ✂️🫘 **Methods to Propagate:**

    Propagation is typically done through seeds or by removing and planting offsets (pups) that grow at the base of mature
    plants.


    🧑‍🌾👩‍🌾 **When to Harvest:**

    As an ornamental plant, there is no traditional harvest. Offsets can be removed and replanted when they are about 10 centimeters
    (4 inches) tall.'
  purpose: '- Ornamental: Valued for its unique bottle-trunk silhouette and cascading leaves—sculpture first, humility second.

    - Indoor Plant: Tolerates dry pot culture and bright interior light if you refuse to overwater.

