  description: "The Ponytail Palm (*Beaucarnea recurvata*) is a drought-tolerant plant
    native to eastern Mexico. Despite its common name, it is not a true palm. The
    plant features a bulbous trunk base that stores water and long, slender, arching
    leaves that resemble a ponytail. It can grow up to 9 meters (30 feet) outdoors
    but remains much smaller indoors.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nThrives
    in bright light, including full sun. Requires infrequent watering; allow the soil
    to dry out between waterings to prevent root rot.\n\n✂️\U0001FAD8 **Methods to
    Propagate:**\nPropagation is typically done through seeds or by removing and planting
    offsets (pups) that grow at the base of mature plants.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nAs an ornamental plant, there is no traditional harvest.
    Offsets can be removed and replanted when they are about 10 centimeters (4 inches)
    tall."
