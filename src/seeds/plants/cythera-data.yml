  description: "Cythera (Phlomis × cytherea) is a small evergreen subshrub in the mint family, a named hybrid of Mediterranean Phlomis species, valued for sage-like gray-green leaves and stacked whorls of soft yellow hooded flowers over a long warm-season window. Plants typically form rounded mounds about 2–3 feet (0.6–1 m) tall and wide with woody bases. It suits dry borders, sunny banks, and pollinator strips in Mediterranean and warm-temperate climates where summer rain is unreliable.\n\n☀️💧 Sun and Water Requirements:\nFull sun for dense habit and reliable flowering; lean soils reduce lankiness. Excellent drainage is non-negotiable—winter wet rots crowns faster than summer drought stresses leaves. Occasional deep watering during establishment beats daily spritzing that encourages shallow roots.\n\n✂️ Propagation:\nTake semi-ripe cuttings in warm weather and root under gentle humidity; hardwood cuttings can work in mild climates. Division of older clumps in cool moist weather resets congested centers. Seed is not true to hybrid type—use vegetative methods to preserve known performance.\n\n🌾 Harvest / Best Use Timing:\nCut flowering stems for arrangements at first color; bees still use partially open whorls if you leave some plants untouched. Shear lightly after bloom to tidy, not scalp—wood does not resprout from bare old stubs on every clone. Mulch crowns after hard freezes in marginal zones."
