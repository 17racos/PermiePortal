description: |-
  Cythera (Phlomis × cytherea) is a small evergreen subshrub in the mint family, a named hybrid of Mediterranean Phlomis species, valued for sage-like gray-green leaves and stacked whorls of soft yellow hooded flowers over a long warm-season window. Plants typically form rounded mounds about 2–3 feet (0.6–1 m) tall and wide with woody bases. It suits dry borders, sunny banks, and pollinator strips in Mediterranean and warm-temperate climates where summer rain is unreliable.

  ☀️💧 Sun and Water Requirements:
  Full sun for dense habit and reliable flowering; lean soils reduce lankiness. Excellent drainage is non-negotiable—winter wet rots crowns faster than summer drought stresses leaves. Occasional deep watering during establishment beats daily spritzing that encourages shallow roots.

  ✂️ Propagation:
  Take semi-ripe cuttings in warm weather and root under gentle humidity; hardwood cuttings can work in mild climates. Division of older clumps in cool moist weather resets congested centers. Seed is not true to hybrid type—use vegetative methods to preserve known performance.

  🌾 Harvest / Best Use Timing:
  Cut flowering stems for arrangements at first color; bees still use partially open whorls if you leave some plants untouched. Shear lightly after bloom to tidy, not scalp—wood does not resprout from bare old stubs on every clone. Mulch crowns after hard freezes in marginal zones.
purpose: |-
  Ornamental: Phlomis × cytherea stacks soft yellow hooded whorls on gray-green sage-like mounds -- Mediterranean structure without lawn pretense.
  Pollinator: Hooded lipped flowers stay open in midday heat for long-tongued bees when many plants stop nectar flow.
  Wildlife Attractor: Rattling seed heads feed finches if stems stand into cool weather instead of deadheading everything.
  Border Plant: Rounded 2–3 foot mounds fit dry path edges and stone walls where drainage is sharp and winters stay mild.
companions:
- Lavender — shared drainage religion and complementary flower color temperature
- Rosemary — matches sun and dry feet while contrasting leaf shape along the border
