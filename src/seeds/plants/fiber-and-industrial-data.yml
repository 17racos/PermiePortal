  description: |-
    Fiber and industrial plants are the ones green influencers skip because Instagram hates coveralls — **kenaf**, **hemp** (where legal), **sisal**, **henequen**, **cotton**, **flax**, **ramie**, and oil crops that double as lubricants and soaps. In permaculture they are biomass, rope, mulch, and sometimes animal feed, not just craft-fair lanyards.
    
    ☀️💧 Sun and Water Requirements:
    - Most fiber giants want full sun and serious square footage — shade makes weak stems.
    - Water ranges from dryland agaves to thirsty bast fibers — read the actual species sheet.
    - Soil: deep tilth helps root crops and bast quality; compaction yields sad string.
    
    ✂️ Methods to Propagate:
    - Species-specific — seeds for annual bast fibers, pups for agaves, rhizomes for some canes.
    - Processing is the hidden labor: retting, decortication, and drying are not "low maintenance," they are honest work.
    
    🌾 Harvest / Best Use Timing:
    - Bast fibers: harvest stems at bloom or just before for best fiber length -- species sheets beat one rule.
    - Seed crops: combine or thresh when moisture hits the storage-safe window for that grain -- mold is not a preservative strategy.
    - Agave and bromeliad fiber: strip mature leaves after documented years in ground -- safety gear for sap is non-optional.
  purpose: |-
    Animal Fodder: Fiber and Industrial offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Mulcher: Mulch workflows love predictable biomass: In permaculture they are biomass, rope, mulch, and sometimes animal feed, not just craft-fair lanyards. -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Erosion Control: Fiber and Industrial networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Edible: Fiber and Industrial yields human food from the parts your description documents -- pods, fruits, leaves, roots, or seeds depending on variety and timing -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater

