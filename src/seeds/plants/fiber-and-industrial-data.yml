  description: |-
    Fiber and industrial plants are the ones green influencers skip because Instagram hates coveralls — **kenaf**, **hemp** (where legal), **sisal**, **henequen**, **cotton**, **flax**, **ramie**, and oil crops that double as lubricants and soaps. In permaculture they are biomass, rope, mulch, and sometimes animal feed, not just craft-fair lanyards.

    ☀️💧 Sun and Water Requirements:
    - Most fiber giants want full sun and serious square footage — shade makes weak stems.
    - Water ranges from dryland agaves to thirsty bast fibers — read the actual species sheet.
    - Soil: deep tilth helps root crops and bast quality; compaction yields sad string.

    ✂️ Methods to Propagate:
    - Species-specific — seeds for annual bast fibers, pups for agaves, rhizomes for some canes.
    - Processing is the hidden labor: retting, decortication, and drying are not "low maintenance," they are honest work.
  purpose: |-
    Fiber and industrial species earn space when markets or homestead crafts are real:

    - Animal Fodder: Many fiber crops produce leafy biomass or seed meals as by-products.
    - Mulcher: Spent stalks and bagasse return carbon to beds and compost.
    - Erosion Control: Deep-rooted perennials stabilize ground while you grow string.
    - Edible: Secondary yields (oil, syrup, emergency calories) exist on several industrial species — never assume without ID.
  companions:
  - Autumn Olive
  - Comfrey
  - Pollinator strips
  cautions:
  - Growing restricted species where law and HOA intersect badly
  - Underestimating processing labor — romance dies at the retting tub
  pests:
  - Armyworms
  - Japanese Beetles
  - Rootknot Nematodes
  practitioner_notes: |-
    Blanch or process within hours if you are freezing—enzymes keep chewing while paperwork waits.
    Notebook one weird year—weather anomalies repeat; memory lies, scribbles do not.
    Harvest texture changes faster than color—nip one sample before you commit the whole row to a pick date.
    Watch the plant’s own signals first—catalog zone numbers do not replace your site’s microclimate truth.
