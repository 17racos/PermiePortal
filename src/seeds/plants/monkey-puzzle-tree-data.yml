  - Maidenhair Fern — ground-layer humidity buffer under partial shade; fern fronds do not compete for sun with the araucaria crown.
  - Southern Magnolia — complementary broadleaf evergreen that handles heat where monkey puzzle is marginal; both appreciate deep mulch and wind respect.
