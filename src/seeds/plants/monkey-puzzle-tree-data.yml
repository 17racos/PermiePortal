  description: |-
    The monkey puzzle tree (Araucaria araucana) is a living fossil conifer with stiff, sharp, overlapping leaves spiraling up massive limbs until the whole silhouette looks like a botanical flamethrower. In the wild it becomes a skyline tree; in gardens it is a slow, dramatic specimen that laughs at casual bumping. Female trees bear large cones with edible seeds (pehuén) valued in southern Chile—harvest ethics belong to local tradition and land tenure, not your Pinterest board.

    subtropical and tropical Americas: Possible in humid subtropical pockets with excellent drainage and air movement; Puerto Rico’s tropical heat is generally rude to it except at elevation or unusually cool microclimates. Plan decades ahead—this is not a “swap next year” impulse buy.

    ☀️💧 Sun and Water Requirements:
    - Full sun once established; young plants appreciate light shade in hottest districts.
    - Deep, acidic, well-drained soil; hates stagnant wet feet—raised berm or sandy slope beats bathtub planters.

    ✂️ Propagation:
    - Seed: fresh seed germinates best; keep evenly moist and protect from damping-off with airflow, not paranoia.
    - Grafting of known sex forms is a specialist game—retail mortals buy labeled plants if they want predictability.

    🌾 Harvest / Best Use Timing:
    - Seed harvest only where legal, ethical, and culturally appropriate; cones mature on long cycles—this is not a microwave crop.
    - Best use timing for most yards: enjoy structure, mulch the drip line, and stop trying to hug it.
  purpose: |-
    - Ornamental: Architectural evergreen that makes every other “specimen tree” look like it is trying too hard.
    - Windbreaker: Dense, spiny scaffold filters wind on exposed sites—also filters nosy neighbors.
    - Shade Provider: Light, open shade under mature trees suits shade-tolerant companions without lawn pretense.
    - Edible: Nutrient-dense seeds where harvest is permitted; integrates human calories into long-rotation forestry thinking.
  companions:
