  description: "Great blue lobelia (Lobelia siphilitica) is a moisture-loving perennial of streambanks, seeps, and rain garden bottoms in eastern and central North America, producing upright spikes of intense blue tubular flowers in late summer. Height is commonly 2–3 feet (0.6–1 m) with lance-shaped leaves. It pairs with cardinal flower for red-blue drama and belongs anywhere sun hits wet soil without apology.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; afternoon shade reduces stress where heat and humidity stack. Consistently moist, organic soils are ideal; tolerates brief inundation in swales. Do not maroon it on a dry berm and expect loyalty.\n\n✂️ Propagation:\nSow seed on moist surface; tiny seedlings need gentle handling. Divide clumps in early spring before rapid growth. Self-sows where happy—edit volunteers early if design is strict.\n\n🌾 Harvest / Best Use Timing:\nLeave flowers for hummingbirds and bees; cut a few stems for short-lived bouquets if guilt permits. Seed capsules scatter fine seed—collect intentionally for sharing. Cut back frost-killed stems in late winter to tidy without harming crowns."
