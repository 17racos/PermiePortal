  description: |-
    Chicory is the roadside blue daisy that coffee adulterers and Belgian endive fans share a species with — different selections, same tough taproot swagger. Roasted root makes a bitter brew; forcing blanched chicons is advanced kitchen cosplay. subtropical and tropical Americas: grows as biennial/perennial rosette with tall bloom spikes in year two; reseeds freely if you let sky-blue flowers set seed.
    
    ☀️💧 Sun and Water:
    - Full sun for tight rosettes; tolerates poor soil that makes lettuce cry.
    - Drought-tolerant once established; overwatering in heavy clay rots crowns.
    
    ✂️ Propagation:
    - Seed in spring or fall; self-sows where happy.
    - Root cuttings from selected varieties for endive forcing clones.
    
     Weed or crop depends on whether you invited it.
    
    🌾 Harvest / Best Use Timing:
    - Chicory: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
  purpose: 'Bitter backbone of forage and foraging:


    - Edible: Leaves, forced chicons, roasted root beverage.

    - Dynamic Accumulator: Deep taproot mines minerals for chop-and-drop if managed.

    - Pollinator: Summer flowers feed bees when many ornamentals are done bragging.

    - Ground Cover: Basal rosette occupies space between taller perennials early season.'
  companions:
  - Dandelion
  - Plantain
