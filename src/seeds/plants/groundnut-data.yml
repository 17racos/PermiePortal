  description: "Groundnut is a twining legume that buries protein-rich tubers like a buried snack stash for people who read\
    \ ethnobotany for fun. Not the peanut — this is Apios americana, eastern North America’s perennial starch-and-nitrogen\
    \ combo. In subtropical and tropical Americas it grows vigorously in warm seasons; give it vertical structure or it will\
    \ audition as a ground-eating kraken.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun to light shade;\
    \ more sun usually means more tubers.\n- Consistent moisture during tuber fill; tolerates wetter soils than many beans.\n\
    - Rich, organic loam rewards you; starvation yields folklore-level disappointment.\n\n✂️\U0001FAD8 Methods to Propagate:\n\
    - Tubers: Plant dormant tubers in spring like mini-potatoes.\n- Rhizome divisions from established patches.\n- Seeds:\
    \ Slow; stratification helps; clones are faster food security.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n\
    - Dig tubers after frost kills vines or in late fall once vines yellow.\n- Start eating small tubers; large ones can stay\
    \ fibrous — breeding lines differ."
  purpose: |-
    Edible: Apios americana forms chains of high-protein tubers on rhizomes -- boil or roast like new potatoes after frost kills vines, and cook mature seeds because raw legume chemistry is not your friend.
    Nitrogen Fixer: Rhizobial nodules on climbing stems fix atmospheric nitrogen -- run the vine on sunflower stalks, corn, or trellis so leaf drop and root turnover feed the bed below without synthetic N.
    Wildlife Attractor: Pink-purple pea flowers feed long-tongued bees, and caterpillars of specialist legume feeders may appear -- accept some leaf holes if you want native insect completion in the guild.
    Ground Cover: Given horizontal space, the twining canopy blankets soil in late summer -- it will smother weeds under the vine but needs vertical structure so it does not bury neighboring crops.
