  description: 'Jelly palm is the cold-hardier Butia crowd favorite for "actual fruit, not just landscaping lies." Yellow-orange
    fruits are sweet-tart and messy — plant it where falling pulp will not paint your Prius. Trunk is stout, slow, and serious;
    this is not a rental-apartment houseplant. subtropical and tropical Americas 8b microclimates grow it with mulch and patience;
    younger plants need frost protection during insult winters.


    ☀️💧 Sun and Water Requirements:

    - Full sun for best flowering and fruit; juvenile plants appreciate light shade while roots expand.

    - Well-drained soil; tolerates drought when established but fruits better with summer moisture.

    - Avoid chronic bog — palms rot roots and blame you in silence.


    ✂️ Methods to Propagate:

    - Seeds: clean pulp, sow warm; germination is slow — think palm time, not radish time.

    - Patience: select mother trees with good fruit if you start from seed.'
  purpose: 'Jelly palm is food forestry with a tropical silhouette:


    - Edible: Pulp around seeds for jelly, wine, and out-of-hand sampling when ripe.

    - Ornamental: Feathery canopy reads "resort" without corporate irrigation budgets if designed well.

    - Wildlife Attractor: Fruit feeds birds and mammals; plan for cleanup.

    - Windbreaker: Solitary trunks buffer wind at mid height in mixed systems.'
  companions:
  - Citrus
  - Feijoa
  - Comfrey
  cautions:
  - Dark shade and wet feet
  - Planting under eaves where fruit stains concrete
  pests:
  - Aphids
  - Coconut Mite
  - Ganoderma Butt Rot
  - Heart Rot
  - Palm Weevil
  - Palmetto Weevil
  - Red Palm Weevil
