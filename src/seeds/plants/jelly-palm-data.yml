  description: |-
    Jelly palm is the cold-hardier Butia crowd favorite for "actual fruit, not just landscaping lies." Yellow-orange fruits are sweet-tart and messy — plant it where falling pulp will not paint your Prius. Trunk is stout, slow, and serious; this is not a rental-apartment houseplant. subtropical and tropical Americas 8b microclimates grow it with mulch and patience; younger plants need frost protection during insult winters.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for best flowering and fruit; juvenile plants appreciate light shade while roots expand.
    - Well-drained soil; tolerates drought when established but fruits better with summer moisture.
    - Avoid chronic bog — palms rot roots and blame you in silence.
    
    ✂️ Methods to Propagate:
    - Seeds: clean pulp, sow warm; germination is slow — think palm time, not radish time.
    - Patience: select mother trees with good fruit if you start from seed.
    
    🌾 Harvest / Best Use Timing:
    - Jelly Palm: harvest fruit when fully colored and aromatic -- underripe jelly fruit stays stubbornly starchy.
    - Use pole baskets or hooks on tall trunks; ripe heads bruise if they free-fall onto concrete morality plays.
    - Pulp ferments fast -- process within a day or two, or freeze puree in flat bags for later.
