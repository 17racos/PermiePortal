  description: "Wild oregano (Lippia graveolens) is a resinous aromatic shrub of
    dry scrub, thorn forests, and limestone hills from the southwestern United States
    through Mexico and Central America. Small opposite leaves and clusters of tubular
    white to pink flowers make it a drought-tough culinary shrub for xeric herb gardens
    and pollinator hedges. The flavor is bold oregano-thyme, not mild supermarket
    Origanum.\n\n☀️💧 Sun and Water Requirements:\nFull sun for tightest growth and
    strongest oils. Excellent drainage is mandatory; tolerates extended dry season
    once established. Avoid heavy wet clay unless sharply bermed; cold wet winters
    kill marginal plants in cool zone 9 pockets.\n\n✂️ Propagation:\nSow seed in warm
    soil after last frost in frost-free starts; germination variable. Semi-hardwood
    cuttings root with bottom heat. Prune after bloom to prevent woody legginess in
    containers.\n\n🌾 Harvest / Best Use Timing:\nClip leafy tips before heavy flowering
    for peak kitchen potency; dry in thin layers out of direct sun. Leave some blooms
    for bees if you are not running a commercial spice operation."
