  description: "Wild guava (Psidium guineense) is a shrub to small tree native to the Neotropics, widely planted and naturalized\
    \ in parts of the Caribbean and humid subtropical lowlands where frosts are rare. Thick, aromatic leaves and small white\
    \ flowers yield round aromatic fruits used like guava where sweetness allows. Thorny forms can deter casual browsers,\
    \ making it useful in layered food forests and livestock exclusion hedges.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n\
    Full sun for heaviest flowering and fruiting; tolerates bright part shade with reduced crops. Prefers deep, well-drained\
    \ soils with steady moisture in the warm season and a distinct dry season in tropical climates. Protect from hard freezes;\
    \ young plants need irrigation through establishment.\n\n✂️ Propagation:\nSow fresh seed promptly; viability drops if\
    \ dried carelessly. Air-layering and cuttings work for thornless selections. Transplant during warm wet months; mulch\
    \ to reduce grass competition.\n\n \U0001F33E Harvest / Best Use Timing:\nPick fruits when fully colored and aromatic;\
    \ use for jelly, juice, or out-of-hand eating if acidity and sweetness suit your clone. Prune after main crop to open\
    \ canopy for airflow and reduce fruit-fly hangouts."
  purpose: |-
    Edible: Psidium guineense marble-sized fruit runs tart-aromatic -- jelly and juice need sugar; thornless clones exist for painless harvest.
    Wildlife Attractor: White myrtle flowers feed honeybees; fruit feeds birds that spread seeds into natural areas -- check local invasive status.
    Ornamental: Coppery peeling bark and glossy opposite leaves read tropical even when fruit is sparse -- drought-tough once established.
    Border Plant: Thorny selections stop goats and humans -- living fence for frost-free ranch edges.
  companions:
  - Papaya — fast overstory for young guava; both want warm-season moisture management
  - Pineapple — ground-level bromeliad production under open guava skirt where light penetrates
  - Mexican Sunflower — nutrient-scavenging chop-and-drop support in tropical polycultures; attracts pollinators
  cautions:
  - Fruit fly pressure — sanitation and harvest timing matter in humid tropics; bag fruit if needed
  - Naturalization risk — confirm local invasive status before planting near natural areas
  pests:
  - Caribbean Fruit Fly
  - Oriental Fruit Fly
  - Scale Insects
  practitioner_notes: 'Seedlings are a flavor lottery; graft known good clones if you want predictable jam, not existential
    jam.

    Thorny types are security theater with photosynthesis—great for fences, bad for barefoot shortcuts.

    If leaves look bronze and sad, check drainage before you dump fertilizer on a drowning root.

    Drought hardening happens after roots run deep; baby trees still want water like reasonable beings.'
  growth_habit: Evergreen myrtle relative; aromatic foliage; small guava-like fruits; frost-free climates
