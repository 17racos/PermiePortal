  description: "Wild guava (Psidium guineense) is a shrub to small tree native to
    the Neotropics, widely planted and naturalized in parts of the Caribbean and
    humid subtropical lowlands where frosts are rare. Thick, aromatic leaves and small
    white flowers yield round aromatic fruits used like guava where sweetness allows.
    Thorny forms can deter casual browsers, making it useful in layered food forests
    and livestock exclusion hedges.\n\n☀️💧 Sun and Water Requirements:\nFull sun for
    heaviest flowering and fruiting; tolerates bright part shade with reduced crops.
    Prefers deep, well-drained soils with steady moisture in the warm season and a
    distinct dry season in tropical climates. Protect from hard freezes; young plants
    need irrigation through establishment.\n\n✂️ Propagation:\nSow fresh seed promptly;
    viability drops if dried carelessly. Air-layering and cuttings work for thornless
    selections. Transplant during warm wet months; mulch to reduce grass competition.\n\n
    🌾 Harvest / Best Use Timing:\nPick fruits when fully colored and aromatic; use
    for jelly, juice, or out-of-hand eating if acidity and sweetness suit your clone.
    Prune after main crop to open canopy for airflow and reduce fruit-fly hangouts."
