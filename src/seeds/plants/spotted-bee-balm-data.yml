  description: "Spotted bee balm (Monarda punctata) is an aromatic mint-family perennial
    of sandy prairies, pine barrens, and open coastal plain habitats across much of
    eastern and central North America. Plants are often biennial-acting in harsh sites
    but persist by seed; whorls of creamy flowers spotted with purple ride stacked
    tiers up the stem, smelling of thyme and oregano. Long-tongued bees, wasps, and
    butterflies mob it in late summer when many flowers quit.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun gives the sturdiest, most fragrant growth; tolerates bright
    part sun. Prefers lean, well-drained sand or gravelly soils; hates constant soggy
    roots. Drought-tolerant once established compared with many mints; in humid rainy
    periods improve airflow to reduce foliar disease pressure.\n\n✂️ Propagation:\n
    Sow seed in fall outdoors or cold-stratify for spring; light-dependent germination
    is common. Soft tip cuttings in late spring root under humidity. Divide young
    clumps in early spring before rapid growth; plants can be short-lived—allow some
    seed to drop for replacements.\n\n🌾 Harvest / Best Use Timing:\nCut leafy flowering
    tops at peak bloom for teas, steam distillation experiments, or dried bouquets;
    dry quickly in thin layers. Leave a portion of stems for native pollinators and
    seed maturity if you want self-sowing."
