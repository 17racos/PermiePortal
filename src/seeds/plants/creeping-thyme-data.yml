  description: |-
    Creeping thyme is a low, mat-forming perennial herb that smells like pizza walked through a meadow. Tiny flowers mob bees in spring; leaves handle light foot traffic on paths if you are not trying to host a monster truck rally. In North Florida it wants sharp drainage—humid wet winters will rot drama queens without grit.

    ☀️💧 Sun and Water Requirements:
    - Full sun for dense growth and best flavor; open shade quickly becomes leggy and sparse.
    - Lean, well-drained soil; drought-tolerant once established—wet clay is enemy number one.

    ✂️ Methods to Propagate:
    - Division: lift mats in spring or fall and replant plugs.
    - Soft cuttings root easily in warm weather under light humidity.

    🌾 Harvest notes:
    - Snip young growth for kitchen use; heavy shearing after bloom keeps mats tight and less woody.
  purpose: |-
    - Edible: Culinary thyme flavor in ground-cover form—intensity varies by clone and stress.
    - Medicinal: Traditional aromatic uses align with other thymes—verify dosage with serious references, not vibes alone.
    - Pollinator: Spring flowers for small bees and beneficials.
    - Ground Cover: Living mulch between stepping stones and on dry banks.
  companions:
  - Lavender
  - Rosemary
  - Oregano
  avoid:
