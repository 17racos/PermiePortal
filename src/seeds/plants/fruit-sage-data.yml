  description: |-
    Fruit sage here is the pineapple-scented Salvia elegans crowd-pleaser: scarlet late-season tubes that make hummingbirds insufferably smug. Leaves smell like candy propaganda and taste mild-sweet in teas and syrups. In North Florida it often dies to the roots in a rude freeze then returns like nothing happened — mulch the crown and stop acting shocked.

    ☀️💧 Sun and Water Requirements:
    - Full sun for dense growth and flowers; light afternoon shade reduces wilt in brutal August.
    - Average garden soil with decent drainage; steady moisture beats boom-bust drought cycling.
    - Container culture: upsize pots before it hits root-bound drama.

    ✂️ Methods to Propagate:
    - Softwood cuttings: take tips in warm months, root in perlite/peat under humidity.
    - Division: split established clumps in spring as shoots emerge.
  purpose: |-
    Fruit sage is an insectary workhorse dressed as ornament:

    - Edible: Leaves and flowers for tea, syrups, and garnish; flavor is strong — taste before dumping a cup in.
    - Medicinal: Traditional calming teas — not a substitute for real medical care.
    - Pollinator: Late nectar when many plants quit.
    - Ornamental: Red flowering spikes read well in layered beds.
    - Wildlife Attractor: Hummingbirds will lobby for more.
