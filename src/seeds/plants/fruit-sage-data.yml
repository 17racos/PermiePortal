  description: |-
    Fruit sage here is the pineapple-scented Salvia elegans crowd-pleaser: scarlet late-season tubes that make hummingbirds insufferably smug. Leaves smell like candy propaganda and taste mild-sweet in teas and syrups. In subtropical and tropical Americas it often dies to the roots in a rude freeze then returns like nothing happened — mulch the crown and stop acting shocked.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for dense growth and flowers; light afternoon shade reduces wilt in brutal August.
    - Average garden soil with decent drainage; steady moisture beats boom-bust drought cycling.
    - Container culture: upsize pots before it hits root-bound drama.
    
    ✂️ Methods to Propagate:
    - Softwood cuttings: take tips in warm months, root in perlite/peat under humidity.
    - Division: split established clumps in spring as shoots emerge.
    
    🌾 Harvest / Best Use Timing:
    - Snip leaves and tender tips before flowering for mildest tea flavor -- post-bloom foliage turns sharper.
    - Pick scarlet flower tubes at full color for syrups; use same day or refrigerate briefly.
    - Dry small bundles upside down in shade; strip when crisp and store airtight out of direct sun.
