 description: |-
 Winged bean is the overachieving legume vine—ridged pods, edible leaves, flowers, and tuberous roots on long-day types that actually cooperate. It wants heat and long seasons; Trellis like you mean it; flimsy cages get humiliated.

 ☀️💧 Sun and Water Requirements:
 - Full sun for flowers and pods.
 - Rich, well-drained soil; steady moisture during vine run—reduce when cool.

 ✂️ Methods to Propagate:
 - Seeds: inoculate with cowpea-type rhizobia; sow warm after frost risk drops.
 - Tubers from short-day landraces where available—verify type before expecting underground payoffs.

 🌾 Harvest notes:
 - Pick pods young for snap use; flowers and tips in cuisines that know what to do with them.
 purpose: |-
 - Edible: Multi-use vegetable for warm climates—learn which parts your variety handles best.
 - Nitrogen Fixer: Nodules feed the bed; still rotate like an adult.
 - Ground Cover: Temporary living mulch on trellis footprint.
 - Animal Fodder: Leaves and vines in integrated systems with species-appropriate testing.
 companions:
