description: |-
  Corylus americana is the native multi-stemmed hazel of eastern North America—soft fuzzy husks hiding small sweet nuts squirrels annotate as ‘mine.’ Suckering habit makes a thicket unless you edit.

  Northern ecotypes sulk in zone 9 heat—seek southern-provenance plants if you are on the peninsula. Needs chill for reliable flowering in some selections.

  ☀️💧 Sun and Water Requirements:

  Full sun to light shade; moist, well-drained, humus-rich soil. Mulch to keep roots cool; drought slows nut fill.

  ✂️ Propagation:

  Layering suckers; seed (squirrel-assisted); grafted improved selections for bigger nuts.

  🌾 Harvest / Best Use Timing:

  Gather nuts when husks loosen in fall; finish drying before storage and expect squirrels to audit your schedule.
purpose: |-
  Edible: Corylus americana kernels inside frilly husks taste sweet raw or toasted once you crack the thick shell -- wild-type shell-to-meat ratios humble humans, so plant clusters if you want bowl-scale harvests.
  Wildlife Attractor: Catkins shed pollen when maples still look sleepy while nuts feed blue jays and squirrels that do not read your harvest calendar -- beat them by gathering when husks loosen but before full drop.
  Windbreaker: Suckering thickets form informal wind-slowing hedges along northern field edges where single-trunk trees would blow over -- keep rows wide enough for air so foliar diseases do not party in stagnant pockets.
companions:
- American Elderberry
- Pawpaw
