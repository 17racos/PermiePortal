  description: |-
    Maidenhair fern is the lacy black-stem drama queen — fan-shaped leaflets on wiry stalks, happiest on limestone seeps and humid shade. In North Florida it naturalizes near springs and moist walls; indoors it tests your misting discipline and honesty about drafty HVAC.

    ☀️💧 Sun and Water Requirements:
    - Bright shade to dappled light; direct sun fries fronds like bad critique.
    - Consistent moisture with good air movement; hates drying cycles and salt buildup.
    - Limestone-tolerant; appreciates alkaline seep chemistry where applicable.

    ✂️ Methods to Propagate:
    - Division: split crowns in spring with sharp tools and minimal root trauma.
    - Spores: slow lab-art path — division is the backyard sanity move.
  purpose: |-
