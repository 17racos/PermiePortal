  description: "Bee Bush is an aromatic shrub that typically grows between 0.9 to
    3 meters (3 to 10 feet) in height. It features slender, erect stems with light
    gray bark and small, narrow leaves that are pale underneath, measuring approximately
    0.6 to 2.5 centimeters (0.25 to 1 inch) long. The plant produces tiny white to
    blue flowers from March to November, which are highly fragrant and attract various
    pollinators.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nBee Bush thrives
    in full sun or lightly filtered sun. It is drought-tolerant once established but
    benefits from weekly watering to maintain optimal appearance. The plant prefers
    well-drained soils but can adapt to poorer soils.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation
    is typically achieved through semi-hardwood cuttings taken in late summer. Ensure
    the cuttings are kept in a humid environment until roots develop.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nWhile Bee Bush is primarily grown for its ornamental and ecological
    benefits, any harvesting of plant material should be done during its active growing
    season, ensuring not to over-prune to maintain plant health."
  purpose: |-
    Wildlife Attractor: Bee Bush layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Border Plant: Bee Bush tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Erosion Control: Bee Bush networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains

