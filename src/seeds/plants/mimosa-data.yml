  description: "Silk tree ‘mimosa’ is the pretty invasive your county extension loves to scold. Ferny leaves, pink powder-puff\
    \ flowers, and a talent for seeding into roadsides and disturbed sand. It fixes nitrogen and feeds pollinators — also\
    \ outcompetes natives in many southeastern sites. In subtropical and tropical Americas, treat it as a design ethics pop\
    \ quiz, not a default canopy tree.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun for reliable bloom\
    \ and fast growth.\n- Drought-tolerant once established; laughs at thin soils.\n- Avoid planting near fragile natural\
    \ areas or conservation buffers.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Scarify/soak; germinates eagerly — which\
    \ is the problem.\n- Root suckers from established trees.\n- Not recommended to spread intentionally in invasion-prone\
    \ regions.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Not a food focus; seedpods are ornamental,\
    \ not dinner."
  purpose: 'Documented with eyes open — not an endorsement where it escapes:


    - Nitrogen Fixer: Rhizobial symbiosis on disturbed ground.

    - Shade Provider: Fast, light canopy.

    - Wildlife Attractor: Bees visit flowers; seeds feed some birds.

    - Ornamental: Aesthetic appeal is why it spread in the first place.'
