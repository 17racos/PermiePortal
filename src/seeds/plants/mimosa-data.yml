description: |-
  Silk tree ‘mimosa’ is the pretty invasive your county extension loves to scold. Ferny leaves, pink powder-puff flowers, and a talent for seeding into roadsides and disturbed sand. It fixes nitrogen and feeds pollinators — also outcompetes natives in many southeastern sites. In subtropical and tropical Americas, treat it as a design ethics pop quiz, not a default canopy tree.

  - Full sun for reliable bloom and fast growth.
  - Drought-tolerant once established; laughs at thin soils.
  - Avoid planting near fragile natural areas or conservation buffers.

  - Seeds: Scarify/soak; germinates eagerly — which is the problem.
  - Root suckers from established trees.
  - Not recommended to spread intentionally in invasion-prone regions.

  - Not a food focus; seedpods are ornamental, not dinner.
purpose: |-
  Nitrogen Fixer: Albizia julibrissin hosts rhizobia on lateral roots that convert atmospheric N₂ on thin, disturbed soils -- expect vigorous resprouting after chop; do not plant where seed rain threatens native buffers because spread is documented across warm roadsides.
  Shade Provider: Twice-pinnate ferny foliage makes a fast, high, light-filtering crown that cools understory paths within a few seasons -- useful only where containment matches the growth rate.
  Wildlife Attractor: Pink powder-puff inflorescences feed bees through early-summer heat; leathery legume pods split to feed finches and other granivores once seeds mature.
  Ornamental: Horizontal limbs and silky pink blooms are the landscape hook that drove historic planting along streets -- treat showiness as an invasion-risk flag, not a green light on sensitive sites.
