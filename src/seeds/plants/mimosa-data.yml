  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: It fixes nitrogen and feeds pollinators  --  also outcompetes natives in many southeastern sites. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Shade Provider: Shade design leans on real canopy behavior: In subtropical and tropical Americas, treat it as a design ethics pop quiz, not a default canopy tree. -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
    Wildlife Attractor: Wildlife shows up for calories and cover: Ferny leaves, pink powder-puff flowers, and a talent for seeding into roadsides and disturbed sand. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Ornamental: Mimosa earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight

