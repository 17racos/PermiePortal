  description: "Mugwort is the bitter aromatic perennial your garden will regret if you underestimate rhizomes. Tall, silvery-green\
    \ leaves, inconspicuous flowers, and a talent for marching through mulch. Traditional medicine and dreaming folklore follow\
    \ it around — potency is real, allergies happen, and pregnant folks should steer clear. In subtropical and tropical Americas\
    \ it grows vigorously in cool season and can look rough in summer heat without partial shade and moisture.\n\n \U0001F31E\
    \U0001F4A7 Sun and Water Requirements:\n- Full sun to part shade in hot climates.\n- Average to moist soil; tolerates\
    \ poor soils better than pampered divas.\n- Contain rhizomes or plan on editing patches forever.\n\n✂️\U0001FAD8 Methods\
    \ to Propagate:\n- Rhizome division — easiest and most dangerous for spread.\n- Seeds: wind-dispersed; deadhead if you\
    \ fear the neighborhood.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Aerial parts before flowering\
    \ for drying.\n- Use reputable ID; wormwood relatives punish cocky foragers."
  purpose: 'Mugwort is powerful medicine and powerful weed energy:


    - Medicinal: Bitter aromatic herb with long traditional use (learn contraindications).

    - Pest Management: Strong scent can confuse some pests in polycultures — not magic smoke.

    - Dynamic Accumulator: Mines and cycles minerals in chop-and-drop systems when managed.

    - Wildlife Attractor: Supports pollinators on inconspicuous flowers.'
  companions:
  - Yarrow
  - Comfrey
  - Elderberry
  cautions:
  - Small raised beds without rhizome barriers
  pests:
  - Aphids
  - Banded Winged Whitefly
  - Greenhouse Whitefly
  - Leafhoppers
  - Lettuce Aphid
  - Lubber Grasshopper
  - Powdery Mildew
  - Root Aphid
  practitioner_notes: 'Label jars with plant part and date the day you seal—future you is not psychic.

    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.

    Weigh small test batches before scaling tinctures—solvent ratio mistakes are expensive at gallon ambition.

    Harvest flowering tops at first full open for many mint-family herbs; past-brown is mulch grade.'
