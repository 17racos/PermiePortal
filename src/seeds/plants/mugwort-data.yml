scientific_name: Artemisia vulgaris
aka:
- Common mugwort
- Cronewort
family: Asteraceae
zone: 3-9
ideal_temp_min: 45
ideal_temp_max: 85
min_temp: -30
max_temp: 100
perennial: true
layers:
- Herbaceous
plant_function:
- Medicinal
- Pest Management
- Dynamic Accumulator
