  description: "Peas (*Pisum sativum*) are annual, cool-season legumes known for their
    climbing habit, utilizing tendrils to support themselves on trellises or other
    structures. They produce white, pink, or purple flowers that develop into pods
    containing multiple seeds. Peas thrive in full sun and well-drained, loamy soil
    with a pH between 6 and 7.5. They prefer consistent moisture but are sensitive
    to waterlogged conditions.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Direct Seeding:**
    Sow seeds directly into the soil as soon as it is workable in early spring, approximately
    2.5 cm deep and 5 cm apart. In regions with mild winters, a fall planting is also
    possible.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\n- **Sun:** Full
    sun (at least 6-8 hours of direct sunlight daily).\n- **Water:** Regular watering
    to maintain consistent soil moisture, avoiding waterlogged conditions.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Harvest edible-pod varieties when pods are young and tender,
    before seeds fully develop.\n- For shelling peas, pick when pods are plump, but
    seeds are still tender.\n- Regular harvesting encourages continued production."
  purpose: |-
    - **Edible:** Peas provide a nutritious food source rich in protein, vitamins, and minerals.
    - **Nitrogen Fixer:** Through symbiosis with Rhizobium bacteria, peas enrich soil fertility by fixing atmospheric nitrogen.
    - **Ground Cover:** Dense foliage helps suppress weeds and protect soil from erosion.
