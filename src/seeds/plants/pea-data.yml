description: |-
  Peas (*Pisum sativum*) are annual, cool-season legumes known for their climbing habit, utilizing tendrils to support themselves on trellises or other structures. They produce white, pink, or purple flowers that develop into pods containing multiple seeds. Peas thrive in full sun and well-drained, loamy soil with a pH between 6 and 7.5. They prefer consistent moisture but are sensitive to waterlogged conditions.

  Direct Seeding: Sow seeds directly into the soil as soon as it is workable in early spring, approximately 2.5 cm deep and 5 cm apart. In regions with mild winters, a fall planting is also possible.

  Sun: Full sun (at least 6-8 hours of direct sunlight daily). Water: Regular watering to maintain consistent soil moisture, avoiding waterlogged conditions.

  Harvest edible-pod varieties when pods are young and tender, before seeds fully develop. For shelling peas, pick when pods are plump, but seeds are still tender. Regular harvesting encourages continued production.
purpose: |-
  Edible: Pisum sativum snaps, snows, and shelling types give sweet pods and starchy seeds for spring stir-fries, dal, and freezer bags -- pick sugars before starches flip in hot weather; blanch seconds for reliable texture.
  Nitrogen Fixer: Rhizobium leguminosarum bv. viciae nodulates cool roots, leaving nodules that rot into nitrate for the following brassica or corn row -- inoculate new ground and avoid waterlogging that turns nodules into mush.
  Ground Cover: Tendril-climbing vines and bushy dwarfs shade row soil by early summer, smothering chickweed between trellis posts -- underplant with radish markers that finish before pea canopy closes.
