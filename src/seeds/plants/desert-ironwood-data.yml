  description: "Desert ironwood (*Olneya tesota*) is a slow-growing, extremely long-lived
    leguminous tree of the Sonoran Desert, valued for rock-hard timber, dense shade,
    and wildlife habitat. In cultivation it forms a rounded, often multi-trunk canopy
    with tiny gray-green leaves and showy pink-purple pea flowers. Mature trees commonly
    reach 20–30 feet tall and wide, with some specimens much larger given deep soil
    and time.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nPlant in full
    sun on very well-drained, lean mineral soil. Ironwood tolerates brutal heat and
    months without rain once established; it sulks in soggy ground. In Florida and
    Puerto Rico, treat it like a specialty arid canopy tree—excellent drainage, no
    lawn over the roots, and careful watering only to establish.\n\n✂️ **Methods to
    Propagate:**\n- **Seeds:** Scarify or soak seed in hot water, then sow in a fast-draining
    mix at warm temperatures; germination can be slow and irregular.\n- **Transplants:**
    Container-grown specimens establish best; move young trees during the warm season
    and protect from root disturbance.\n\n\U0001F9D1‍\U0001F33E **Harvest / Best Use
    Timing:**\nPods mature dry on the tree; collect before heavy rains if saving seed.
    Wood harvest (where legal and ethical) is a decades-scale decision—this species
    is a desert elder, not a quick coppice. For permaculture, the best \"crop\" is
    shade, mulch from leaf drop, and nitrogen-rich leaf litter over decades."
  purpose: |-
    - **Nitrogen Fixer:** As a legume, it partners with rhizobia to add biologically available nitrogen to poor desert soils, supporting understory guilds.
    - **Wildlife Attractor:** Flowers feed pollinators; canopy shelters birds, reptiles, and insects in extreme heat.
    - **Shade Provider:** Dense evergreen foliage creates cool microclimates for succulents, herbs, and people in hot climates.
    - **Windbreaker:** Tough wood and compact form reduce wind stress on nearby tender crops and structures on exposed sites.
    - **Erosion Control:** Deep roots anchor rocky slopes and washes where few other trees persist.
    - **Mulcher:** Fine leaf drop builds a mineral-rich duff layer that protects soil surface from sun and splash erosion.
