  practitioner_notes: 'Chop-and-drop timing matters: green mulch feeds soil; woody brown mulch ties up surface nitrogen briefly.

    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.

    Do not yank test nodules off every root—sacrifice one plant, not the whole stand’s recovery.

