  description: "Tickseed sunflower (Bidens aristosa) is a warm-season annual to short-lived
    perennial composite native to much of the central and southeastern United States,
    including wet ditches and pond margins that show up after summer rains in Florida
    and Puerto Rico plantings if seed is introduced. Plants typically reach 1–1.5 m
    (3–5 ft) with bright yellow daisy-like heads and bristly seeds that snag socks
    like they mean it—plan placement away from high-traffic paths.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun to light shade; blooms heaviest with strong light.\n-
    Likes consistent moisture—rain gardens, pond edges, or irrigated wildlife beds;
    tolerates brief drying better than desert species.\n- In humid subtropical and
    tropical sites, give air space to reduce foliar disease pressure.\n\n✂️ Methods
    to Propagate:\n- Direct-sow seed outdoors after soil warms (late spring through
    summer in subtropical and tropical Americas); keep seedbed moist until true leaves appear.\n-
    Collect dry heads in fall; cold-moist stratify only if your seed lot proves stubborn—many
    populations germinate readily without fuss.\n\n🌾 Harvest / Best Use Timing:\n-
    Young leaves are occasionally used like other mild greens—identify carefully
    and eat only from clean sites.\n- Best landscape value is late summer through
    fall bloom for pollinators; leave some seed heads for finches and beneficial
    insect habitat."
