  description: "Lemongrass (Cymbopogon citratus) is a tall, clumping grass that can grow up to 1.2–1.8 meters (4–6 feet) tall.\
    \ It has long, narrow, green leaves with a strong lemony scent due to its high citral content. It is commonly used in\
    \ cooking, herbal medicine, and essential oil production.\n\nThe plant thrives in tropical and subtropical climates, requiring\
    \ warm temperatures and moist but well-drained soil. It is a fast-growing grass that can be used as a natural pest repellent\
    \ and soil stabilizer in permaculture systems.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Requires full sun\
    \ for optimal growth.\n- Prefers well-drained, loamy or sandy soil with regular watering.\n- Drought-tolerant once established\
    \ but benefits from occasional deep watering.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Not commonly used, as germination\
    \ is slow and unreliable.\n- Division: The most effective method; divide clumps and replant in early spring.\n- Cuttings:\
    \ Root stems in water or moist soil for propagation.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n\
    - Harvest stalks when they reach about 30 cm (12 inches) in height for best flavor.\n- Cut stalks at the base, leaving\
    \ the plant to continue growing.\n- Leaves can also be harvested and dried for teas and herbal remedies."
