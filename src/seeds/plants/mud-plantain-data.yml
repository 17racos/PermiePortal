  description: "Heteranthera limosa is a charming native of muddy pond margins and
    seasonally wet ground. Low mats of spoon-shaped leaves set off short-lived blue
    flowers with a goofy \"monkey face\" look — great for wetland biodiversity and
    prettier than bare mud. It spreads by seed and creeping stems, filling gaps where
    water fluctuates.\n\nsubtropical and tropical Americas ponds and rain gardens can host it without
    drama; pair with other warm-zone aquatics and avoid drying the root crown for
    long stretches.\n\n☀️💧 Sun and Water:\n- Full sun for best bloom; tolerates
    light shade.\n- Wet mud to shallow water; recedes if baked dry for weeks.\n-
    Rich organic muck is welcome.\n\n✂️ Propagation:\n- Division of rooted mats in
    warm weather.\n- Seed on saturated soil; keep humid until established."
  purpose: |-
    Mud plantain is wetland filler with personality:

    - Wildlife Attractor: Pollinators visit the oddball flowers; cover for microfauna.
    - Border Plant: Softens the water's edge in polyculture ponds.
    - Erosion Control: Mats reduce splash erosion on bare shorelines.
  companions:
  - Pickerelweed
  - Duck Potato
  - Spatterdock
  cautions:
  - None documented
  pests:
  - Aphids
  - Snails
  growth_habit: Mat-forming aquatic herb
