  description: |-
    Heteranthera limosa is a charming native of muddy pond margins and seasonally wet ground. Low mats of spoon-shaped leaves set off short-lived blue flowers with a goofy "monkey face" look — great for wetland biodiversity and prettier than bare mud. It spreads by seed and creeping stems, filling gaps where water fluctuates.
    
    subtropical and tropical Americas ponds and rain gardens can host it without drama; pair with other warm-zone aquatics and avoid drying the root crown for long stretches.
    
    ☀️💧 Sun and Water:
    - Full sun for best bloom; tolerates light shade.
    - Wet mud to shallow water; recedes if baked dry for weeks.
    - Rich organic muck is welcome.
    
    ✂️ Propagation:
    - Division of rooted mats in warm weather.
    - Seed on saturated soil; keep humid until established.
    
    🌾 Harvest / Best Use Timing:
    - Ecological value and subtle edible uses depend on correct ID -- harvest only where law and sanitation allow.
    - Thin dense stands if mosquito habitat becomes a managed-water issue.
    - Leave regenerating rhizome patches after any removal.
  purpose: |-
    Wildlife Attractor: Wildlife shows up for calories and cover: It spreads by seed and creeping stems, filling gaps where water fluctuates. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Border Plant: Mud Plantain tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Erosion Control: Erosion control needs roots that grip: subtropical and tropical Americas ponds and rain gardens can host it without drama; pair with other warm-zone aquatics and avoid drying the root crown for long stretches. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains

