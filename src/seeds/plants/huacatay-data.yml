  description: 'Huacatay is a tall, pungent marigold relative used in Andean cooking—think cilantro’s weird cousin who lifts
    weights. The smell is strong enough to split a room; some insects agree and move out. In subtropical and tropical Americas
    grow it as a warm-season annual unless you are in a frost-free pocket. Do not assume “herb” means “plant anywhere next
    to delicate seedlings without consequences”—it can bully neighbors through scent chemistry.


    ☀️💧 Sun and Water Requirements:

    - Full sun for sturdy stems and aromatic oils.

    - Average to rich, well-drained soil; steady moisture while young, tolerates short dry spells once tall.


    ✂️ Methods to Propagate:

    - Seeds: surface sow warm; light helps germination.

    - Self-sows in mild winters—deadhead if you dislike volunteer committees.


    🌾 Harvest notes:

    - Harvest young leaves for culinary use; flavor is potent—start small in recipes.'
  purpose: '- Edible: Traditional herb for stews, sauces, and marinades—verify personal tolerance and preparation.

    - Pest Management: Strong volatile compounds can confuse or repel some pests in interplanting experiments—results vary
    with spacing and species.

    - Soil Improvement: Biomass chop-and-drop at season’s end.

    - Border Plant: Tall aromatic screen at the edge of veg beds—place with intent.'
