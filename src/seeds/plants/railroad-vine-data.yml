  description: "Railroad vine (Ipomoea pes-caprae) is a pantropical and warm-subtropical
    trailing morning glory famous for stabilizing dunes and beach roadsides across
    the Atlantic, Gulf, and Caribbean coasts. Succulent leaves are notched like a
    cloven hoof; pink-purple funnels open at dawn. It is a first-line defense against
    sand blowouts where turfgrass is both thirsty and absurd.\n\n☀️💧 Sun and Water
    Requirements:\n- Full sun; shade makes leggy weak growth on sand.\n- Drought
    tolerant; salt spray and wind desiccation are normal working conditions.\n- Pure
    sand to sandy loam; excellent drainage mandatory—never pot without bottom holes.\n\n✂️
    Propagation:\n- Cuttings root quickly in damp sand if nights stay warm.\n- Seeds
    scarify gently; germinate in warm trays.\n- Transplant mats after storms only
    with local regulations respected—some dunes are protected.\n\n🌾 Harvest / Best
    Use Timing:\n- Not a primary human food crop; focus on stabilization and pollinator
    value.\n- Trim runners encroaching on paths after peak bloom to reduce tripping
    hazards.\n- Replace sections killed by unusual cold snaps once soil warms in frost-free climates."
  purpose: |-
    - Erosion Control: Dense mats bind foredunes and road verges against wind shear.
    - Ground Cover: Succulent stems root at nodes, knitting bare sand rapidly after disturbance.
    - Wildlife Attractor: Flowers feed pollinators including bee species active at beach edges.
    - Ornamental: Showy blooms and silver-green foliage suit xeric coastal landscapes.
  companions:
