  description: "Blue Ridge blueberry is a marketing name applied to northern highbush
    selections (Vaccinium corymbosum) chosen for large sweet berries in cool, humid
    temperate climates with reliable winter chill. Upright shrubs typically reach 4–7
    feet (1.2–2.1 m), with oval deciduous leaves, white bell flowers in spring, and
    blue clusters ripening from late spring through summer depending on heat units.
    They anchor acidic edible hedgerows, patio plantings in large containers, and diversified
    farms from upper subtropical transition zones northward where summers stay moderate.\n\n☀️💧
    Sun and Water Requirements:\nFull sun for maximum sugar and yield; light afternoon
    shade helps in hot-summer margins. Requires acidic pH roughly 4.5–5.5, abundant
    organic matter, and consistent moisture—drip irrigation stabilizes fruit size through
    dry spells. Mulch with pine needles or wood chips; avoid lime.\n\n✂️ Propagation:\nSoftwood
    cuttings in early summer under mist root reliably for clonal cultivars. Layer low
    branches in moist mulch. Seedlings vary—buy named cultivars for predictable flavor
    and chill requirements.\n\n🌾 Harvest / Best Use Timing:\nPick when berries turn
    fully blue and detach with a slight twist—repeat every couple of days at peak.
    Refrigerate dry fruit promptly; freeze or dry extras within days. Prune out old
    canes after year five or six to renew vigor."
  purpose: |-
