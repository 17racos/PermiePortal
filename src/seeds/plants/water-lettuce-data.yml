  description: |-
    Water lettuce is the floating rosette that multiplies like a group chat gone feral. In Florida it is an aggressive aquatic weed in open waters—containment is ethics, not aesthetics.
    
    Only keep in closed systems (tubs, pools, lined ponds) where escape is impossible. Do not “gift” extras to local waterways.
    
    Sun and water: Full sun to part shade on still, nutrient-rich water. Roots hang in the water column stripping nutrients—great in a drum, catastrophic in a spring run.
    ✂️ Propagation:
    Daughter rosettes on stolons—absurdly easy; your job is saying no to release.
    
    🌾 Harvest / Best Use Timing:
    - For Water Lettuce, value timing follows ecology -- thin or skim when biomass blocks flow or outcompetes natives per local guidance.
    - Floating mats: work cool mornings so fragments do not drift downstream and colonize new sins.
    - Compost hot active piles after any removal so wet tissues do not restart the invasion from your own yard.
  purpose: |-
    - Water Purifier: Floating roots strip dissolved nutrients in drums, lined ponds, and closed aquaponics loops while shading water column and calming algae swings—not for open-water releases or ecosystem roulette.
    - Animal Fodder: Livestock fodder trials happen only where law, hygiene, and species tolerances align; treat it as experimental biomass, not default pasture feed.
