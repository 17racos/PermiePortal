  description: "Honey Melon Sage is a market name for pineapple-scented Salvia
    elegans selections — same species pool as classic pineapple sage. Scarlet late-
    season tubes are hummingbird crack. Leaves smell like fruit salad and work in
    tea, syrups, and aggressive potpourri. In Florida and Puerto Rico it often dies back in
    winter and returns from roots around 9a/b; mulch the crown after frost.\n\n☀️💧
    Sun and Water:\n- Full sun for best bloom and compact habit; part shade tolerable
    but stretches stems.\n- Average water; drought-tolerant once established but
    sulks in bone-dry pots.\n\n✂️ Propagation:\n- Softwood cuttings in spring/summer
    root easily.\n- Divisions of clumps in early spring.\n\nName game: if the tag
    says honey melon and it smells like pineapple, you are not hallucinating — nurseries
    love adjectives."
  purpose: |-
