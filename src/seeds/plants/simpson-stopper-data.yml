  description: "Simpson stopper (*Myrcianthes fragrans*) is a Florida-native evergreen
    shrub or small tree in the myrtle family. It usually stays in the 6–15 ft range,
    with glossy leaves, smooth tan bark, and fragrant white flowers followed by red
    to orange berries that birds love — and humans can nibble too (mild, resinous,
    not a supermarket fruit). It handles limestone, drought once established, and
    coastal exposure better than a lot of fussy exotics.\n\nIn subtropical and tropical Americas /
    subtropical food forests it shines as a backbone shrub: evergreen structure,
    pollinator buzz, and low drama if drainage is decent.\n\n☀️💧 Sun and Water:\n-
    Full sun to light shade; more sun = denser growth and heavier flowering/fruiting.\n-
    Well-drained soil; tolerates dry spells after establishment. Avoid boggy spots.\n\n✂️
✂️ Propagation:
\n- Seeds: clean fresh seed, sow in well-drained mix; germination can
    be slow and irregular — patience, PermieBro.\n- Cuttings: semi-hardwood cuttings
    with humidity dome/rooting hormone in warm weather.\n- Transplants: nursery liners
    or container plants; water regularly the first year."
  purpose: |-
    - Edible: Small fruits are edible raw or in jellies; flavor is subtle — treat as a wildlife share crop unless you love tart-resin notes.
    - Wildlife Attractor: Flowers feed pollinators; fruits feed birds.
    - Ornamental: Evergreen, neat habit, attractive bark on older stems.
    - Pollinator: Fragrant flowers pull small bees and flies into the system.
    - Border Plant: Useful edge species between open sun and understory plantings.
  companions:
  - Wild Coffee
  - Marlberry
  - Coontie
