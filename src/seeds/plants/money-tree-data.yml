  description: "The Money Tree (*Pachira aquatica*) is a tropical wetland tree native
    to Central and South America. It can grow up to 18 meters (60 feet) in the wild
    but is commonly kept as a much smaller indoor plant. The tree features shiny,
    palmate leaves and smooth green bark. Its flowers are large, with long, narrow
    petals that curl back to reveal clusters of long, thread-like stamens. The plant
    produces large, woody seed pods containing edible nuts.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nPrefers bright, indirect light but can tolerate
    low light conditions. Requires regular watering to keep the soil moist but not
    waterlogged; overwatering can lead to root rot.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nPropagation
    is typically done through seeds or cuttings. Seeds should be planted fresh, while
    cuttings should be taken from semi-hardwood branches and rooted in moist soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nIn its native habitat, nuts are harvested when the seed
    pods mature and split open. As an indoor plant, it is primarily grown for ornamental
    purposes."
