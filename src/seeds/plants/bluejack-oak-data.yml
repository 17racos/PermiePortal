    Acorns are small but numerous; wildlife spreadsheets do not care about human portion sizes.

    Multi-trunk form is stability on sand, not a pruning failure—fight the urge to “fix” it.

    Tuberculosis of turf dreams: if irrigation is constant, pick a different tree.'
