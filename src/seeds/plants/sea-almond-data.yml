  description: "Sea almond (Terminalia catappa) is a large tropical tree widely planted along tropical coasts for horizontal branches, glossy leaves that color before abscission, and almond-flavored seeds inside fibrous drupes. Heights of 40–60 feet (12–18 m) are common, casting broad shade on beaches and village commons. Seeds are eaten roasted where traditions exist; the tree also stabilizes sandy shores and tolerates salt spray better than many broadleaf species.\n\n☀️💧 Sun and Water Requirements:\nFull sun for dense crown and reliable fruiting on mature trees. Sandy, well-drained soils near coasts match native ecology; tolerates seasonal drought once established with deep roots. Irrigation during establishment speeds growth inland; avoid waterlogging.\n\n✂️ Propagation:\nSow fresh seed; germination is rapid in warm humid conditions. Transplant when young—large specimens resent root disturbance. Prune for clearance under wide limbs; avoid topping.\n\n🌾 Harvest / Best Use Timing:\nCollect fallen fruits when husks dry; crack seeds for roasting per vetted methods. Leaf drop is seasonal in many climates—plan paths accordingly. Peak growth tracks year-round warmth in true tropics."
  purpose: |-
    - Edible: Kernel inside the seed coat provides roasted snack where processing removes fibrous husk safely.
    - Shade Provider: Wide crown shelters beaches, markets, and understory nurseries.
    - Windbreaker: Grouped trees blunt coastal winds and salt spray for interior plantings.
    - Ornamental: Red fall-like leaf color before drop adds tropical drama without maple imports.
  companions:
