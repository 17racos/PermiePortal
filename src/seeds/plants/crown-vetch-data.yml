  description: 'Crown vetch (*Securigera varia*) is a rhizomatous perennial legume that forms dense, pink-purple flowering
    mats along roadsides and disturbed ground. Pinnate leaves climb via tendril-tipped leaflets, and roots spread aggressively
    belowground. Height is usually under 60 cm when unsupported. It was once promoted for erosion control but is now recognized
    as invasive or problematic in many regions, smothering diverse plant communities. **Do not plant where it can escape into
    natural areas, rights-of-way stewardship sites, or native restoration projects in Florida and Puerto Rico**—local regulations
    and land ethics should win over nostalgia for quick greenwash fixes.


    ☀️💧 **Sun and Water Requirements:**

    Full sun to light shade. Tolerates poor, dry soils once established; moderate moisture speeds spread. Only consider contained
    settings (e.g., bounded beds with root barriers) if you accept ongoing management.


    ✂️ **Methods to Propagate:**

    - **Seeds:** Scarify and sow in spring; germination improves with warm soil.

    - **Rhizome pieces:** Any fragment can root—this is why it is a containment risk, not a selling point for careless planting.


    🌾 **Best Use Timing:**

    If already on your land, mow or graze before seed set to slow invasion (check toxicity concerns for livestock). Replace
    long-term with native legumes suited to your biome rather than feeding perpetual battle.'
  purpose: |-
