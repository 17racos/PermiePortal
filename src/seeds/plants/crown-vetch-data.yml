  description: "Crown vetch (*Securigera varia*) is a rhizomatous perennial legume
    that forms dense, pink-purple flowering mats along roadsides and disturbed ground.
    Pinnate leaves climb via tendril-tipped leaflets, and roots spread aggressively
    belowground. Height is usually under 60 cm when unsupported. It was once promoted
    for erosion control but is now recognized as invasive or problematic in many regions,
    smothering diverse plant communities. **Do not plant where it can escape into natural
    areas, rights-of-way stewardship sites, or native restoration projects in Florida
    and Puerto Rico**—local regulations and land ethics should win over nostalgia for
    quick greenwash fixes.\n\n☀️💧 **Sun and Water Requirements:**\nFull sun to light
    shade. Tolerates poor, dry soils once established; moderate moisture speeds spread.
    Only consider contained settings (e.g., bounded beds with root barriers) if you
    accept ongoing management.\n\n✂️ **Methods to Propagate:**\n- **Seeds:** Scarify
    and sow in spring; germination improves with warm soil.\n- **Rhizome pieces:**
    Any fragment can root—this is why it is a containment risk, not a selling point
    for careless planting.\n\n🌾 **Best Use Timing:**\nIf already on your land, mow
    or graze before seed set to slow invasion (check toxicity concerns for livestock).
    Replace long-term with native legumes suited to your biome rather than feeding
    perpetual battle."
  purpose: |-
    - **Nitrogen Fixer:** Rhizobia on roots add nitrogen to soil when biomass is cycled responsibly.
    - **Erosion Control:** Dense mats hold soil on cuts and fills—ironically the same trait drives ecological harm off-site.
    - **Biomass:** Fast growth can be chopped for mulch in **contained** systems only.
    - **Animal Fodder:** Historically grazed where adapted; verify local toxicity guidance before feeding animals.
