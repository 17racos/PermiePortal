  description: 'Edible hibiscus here means **Abelmoschus manihot**, a tall malvaceous shrub with huge maple-ish leaves and
    showy pale yellow flowers. Young leaves and shoot tips are cooked like mild greens; mucilage behaves okra-adjacent in
    stews.


    Dies back in hard freezes, returns from crown or mulch if mild; treat as annual in cooler margins or overwinter cuttings.


    ☀️💧 Sun and Water Requirements:


    Full sun to light shade; rich, moist, well-drained soil; heavy feeding during rapid summer growth; mulch to keep roots
    cool.


    ✂️ Propagation:


    Seeds; basal cuttings; division of multi-stem clumps. Save seed from the most tender-leafed plants you like.


    🌾 Harvest / Best Use Timing:


    Cut young leaves and shoot tips continuously for greens through rapid summer growth.'
  purpose: '- Edible: Monster greens for humid summers with okra-adjacent mucilage in stews; if you expected cranberry-colored
    roselle calyces, that is a different hibiscus—still Malvaceae, different snack.

    - Ornamental: Huge leaves and pale yellow flowers at a pollinator-friendly scale.

    - Mulcher: Rapid summer growth returns chop-and-drop biomass when managed.

    - Wildlife Attractor: Large flowers draw pollinators during peak bloom.'
  companions:
