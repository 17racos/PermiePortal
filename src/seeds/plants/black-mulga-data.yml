  description: 'Black mulga refers to the dark-barked forms of mulga wattle (Acacia aneura), a dominant Australian arid-zone
    acacia with needle-like phyllodes, yellow rod flowers, and woody pods. It grows as a shrubby tree often roughly 6–12 m
    in favorable sites, with a root system built for long dry spells and sudden rain.


    subtropical and tropical Americas suit it only where frost is rare and drainage is aggressive—think xeric landscape collections,
    Keys-adjacent microclimates, and Puerto Rican rain-shadow pockets. Humid air is tolerable if soil never stays sour-wet;
    root rot is the usual tropical insult.


    ☀️💧 Sun and Water Requirements:

    - Full sun for dense phyllodes and reliable flowering.

    - Sandy, well-drained soil; deep occasional watering beats daily spritz—this is not a pond margin plant.


    ✂️ Methods to Propagate:

    - Seeds: treat with hot water soak until swelling, sow warm—classic hard-seeded acacia protocol.

    - Seedlings from reputable sources for known provenance—avoid casual import ethics violations.


    🌾 Harvest / Best Use Timing:

    - For browse trials, offer fresh growth in rotation after rains when tannin balance shifts—livestock responses vary by
    animal and plant form.

    - For mulch, prune after flowering if you need material without deleting next year’s buds entirely—coppice thoughtfully.'
