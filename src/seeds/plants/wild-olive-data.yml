  description: "Wild olive (Osmanthus americanus) is a native southeastern evergreen
    shrub to small tree, unrelated to edible European olives but sharing a lean, dark-leaf
    dignity. It typically grows 3–7 m (10–23 ft), with opposite, leathery leaves
    and small creamy tubular flowers that perfume late winter to early spring—exact
    timing shifts with latitude. It belongs in naturalistic buffers, woodland edges,
    and wildlife hedges from parts of Florida through the coastal plain.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun to partial shade; afternoon shade reduces
    stress in hottest exposures.\n- Average moisture; established plants tolerate
    short drought but look best with even rainfall.\n- Well-drained acidic to neutral
    soils mirror its native hammocks and slopes.\n\n✂️ Methods to Propagate:\n-
    Semi-hardwood cuttings in late summer; keep humid until roots initiate.\n- Layer
    low branches to soil and sever after rooting.\n- Fresh seed sown promptly may
    germinate the following warm season; viability drops if seed dries carelessly.\n\n🌾
    Harvest / Best Use Timing:\n- Not a food crop; ornamental and ecological value
    peak when flowering for early pollinators.\n- Prune for structure after bloom
    if shaping is required—avoid heavy shearing into old wood without regrowth buds."
