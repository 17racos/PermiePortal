  description: "Roughleaf dogwood (Cornus drummondii) is a deciduous shrub to small
    tree of central North American thickets, stream edges, and limestone glades.
    Leaves are sandpapery above, veins prominent beneath; creamy spring flowers precede
    white berries on red pedicels. It is a tough native for hedgerows, bioswale edges,
    and wildlife plantings where showier dogwoods demand pampering.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun to partial shade; blooms and fruit better with
    more light.\n- Moderate moisture; tolerates intermittent wet feet along banks.\n-
    Adaptable soils; tolerates alkaline rocky sites better than many Cornus.\n\n✂️
    Propagation:\n- Seeds: clean and stratify; germination may take two winters.\n-
    Softwood cuttings in early summer under mist.\n- Suckers transplant in early
    spring with roots attached.\n\n🌾 Harvest / Best Use Timing:\n- Berries are
    technically edible but bitter; leave primarily for birds.\n- Prune after flowering
    if shaping; winter cuts remove spring bloom potential.\n- Collect cut stems for
    habitat piles before bud swell if managing thicket density."
  purpose: |-
    - Wildlife Attractor: Flowers feed pollinators; berries feed birds and mammals.
    - Erosion Control: Fibrous roots stabilize moist banks and disturbed edges.
    - Border Plant: Forms dense thickets that define fencerows without shearing.
    - Ornamental: Textured leaves and colorful fruiting pedicels add late-season interest.
