  description: "Buttonbush (Cephalanthus occidentalis) is a deciduous wetland shrub
    native to much of North America, bearing glossy leaves and extraordinary spherical
    white flower heads that look like pincushions in early summer. Plants typically
    reach 6–12 feet (2–3.5 m), often wider than tall, rooting in saturated soils along
    ponds, swales, and river margins. It is a flagship species for rain gardens, bioswales,
    and wildlife ponds from cool-temperate to humid subtropical climates.\n\n☀️💧 Sun
    and Water Requirements:\nFull sun to partial shade; flowers best with strong light.
    Tolerates standing water for periods each year; also grows in moist garden soil
    if never allowed to dry completely. Not a desert plant—roots expect steady moisture.\n\n✂️
    Propagation:\nSow seed after cold stratification or direct-sow in wet outdoor beds.
    Hardwood cuttings taken in late winter root under mist. Transplant container liners
    into soggy sites; mulch to exclude competing weeds.\n\n🌾 Harvest / Best Use Timing:\nNot
    a food shrub for humans—value is ecological and ornamental. Deadhead if you dislike
    brown balls, or leave seed heads for winter structure. Cut back old stems hard
    in late winter every few years to rejuvenate very leggy specimens."
  purpose: |-
    - Wildlife Attractor: Flowers are magnets for bees, butterflies, and hummingbirds; seeds feed waterfowl and songbirds.
    - Water Retention: Thrives in designed wetlands that slow runoff and filter sediment.
    - Erosion Control: Fibrous roots stabilize pond banks and ditch slopes.
    - Ornamental: Unique spherical blooms and glossy foliage elevate engineered stormwater plantings.
  companions:
  - Swamp Milkweed — shared wet sun and complementary flower forms for pollinators
  - Pickerelweed — emergent aquatic neighbor at the pond edge beneath buttonbush skirts
  - Bald Cypress — taller canopy over deep swales; buttonbush occupies shallower margins
  cautions:
  - Droughty berms — chronic wilting and dieback without irrigation
  - Heavy shade — sparse flowering and lanky growth
  pests:
  - Aphids
  - Japanese Beetles
  practitioner_notes: |-
    If the soil never dries, buttonbush smiles; if it does, you will hear about it in crispy leaves.
    Spherical blooms photograph like props—plant where reflections double the joke in still water.
    Deer may browse young stems; cage until woody if pressure is high locally.
    Rejuvenation pruning every few years prevents the “tall bare legs” look in old specimens.
