  description: |-
    Baptisia is the perennial legume that builds its own fertilizer, then flowers like a lupine that skipped leg day and went straight to architecture. Deep taproot; do not plan on moving it twice.

    Florida and Puerto Rico / subtropical: Fine through 9a as long as soil drains; intense heat plus wet can shorten lifespan—give it space and sun, not swale soup.

    Sun and water: Full sun for stiff stems and best bloom. Average to lean, well-drained soil; drought-tolerant once established. Overwatering and heavy clay are the usual killers.

    Propagation: Scarified seeds (slow, honest work); division of young clumps if you must; transplant small plants only.
