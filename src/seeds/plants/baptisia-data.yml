  description: 'Baptisia is the perennial legume that builds its own fertilizer, then flowers like a lupine that skipped leg
    day and went straight to architecture. Deep taproot; do not plan on moving it twice.


    Fine through 9a as long as soil drains; intense heat plus wet can shorten lifespan—give it space and sun, not swale soup.


    Sun and water: Full sun for stiff stems and best bloom. Average to lean, well-drained soil; drought-tolerant once established.
    Overwatering and heavy clay are the usual killers.

    ✂️ Propagation:

    Scarified seeds (slow, honest work); division of young clumps if you must; transplant small plants only.'
  purpose: '- Nitrogen Fixer: Root nodules feed the soil nitrogen budget in perennial borders and savanna-style plantings,
    supporting neighbors through root exchange and eventual litter drop.

    - Ornamental: Indigo spikes and shrub-like mounds read as structural perennials—big architecture without woody winter
    skeleton angst.

    - Wildlife Attractor: Long-season flowers pull bumblebees and other pollinators like a tab was left open; seed pods extend
    winter interest for birds that work dry legumes.

    - Dynamic Accumulator: Deep taproot mines subsoil minerals that return when tops die back, offering responsible chop-and-drop
    after dormancy instead of bagged fertilizer theater.'
