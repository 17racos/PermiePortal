description: |-
  Bilimbi is the sour, waxy cousin of carambola on a short tree that fruits from the trunk and branches like it is showing off. Crisp green pickles, fiery sambals, and acid for fish all come off one cranky tropical tree. It is not a beginner frost plant.

  Treat it like zone denial unless you have greenhouse ambitions or a very protected 10a microclimate. One rude winter and you are explaining yourself to the plant.

  Sun and water: Full sun for heaviest flowering and fruit. Deep, even moisture in rich, well-drained soil; backs off on water in cool weather. Mulch the root zone; hates standing water.
  ✂️ Propagation:
  Seeds (variable offspring, fresh seed best); air-layering or grafting onto related stock if you are chasing known fruit quality.

  🌾 Harvest / Best Use Timing:
  - Bilimbi: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both.
  - Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer.
  - Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Averrhoa bilimbi crisp green ridges pickle like aggressive cucumbers while ripe fruit acids curries and fish sauces across Malay kitchens -- cauliflorous clusters on trunk wood need padded harvest bags to avoid bruise.
  Ornamental: Small symmetrical evergreen canopy and rank-and-file fruit along stems read as living sculpture in zone 10b yards -- one hard freeze turns the conversation to compost quickly on exposed sites.
  Wildlife Attractor: Small fragrant flowers pull honeybees through wet-season flushes when starfruit relatives pause -- fallen sour fruit feeds fruit flies fast if you skip daily pickup during glut weeks.
