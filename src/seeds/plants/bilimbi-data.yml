  description: |-
    Bilimbi is the sour, waxy cousin of carambola on a short tree that fruits from the trunk and branches like it is showing off. Crisp green pickles, fiery sambals, and acid for fish all come off one cranky tropical tree. It is not a beginner frost plant.

    Treat it like zone denial unless you have greenhouse ambitions or a very protected 10a microclimate. One rude winter and you are explaining yourself to the plant.

    Sun and water: Full sun for heaviest flowering and fruit. Deep, even moisture in rich, well-drained soil; backs off on water in cool weather. Mulch the root zone; hates standing water.
    ✂️ Propagation:
    Seeds (variable offspring, fresh seed best); air-layering or grafting onto related stock if you are chasing known fruit quality.
  purpose: |-
    - Edible: Acid fruit, pickles, and sambal-friendly tartness for cuisines that want slap-in-the-face sour without apologizing.
    - Ornamental: Compact evergreen tree with odd cauliflorous fruiting reads as a conversation piece in frost-free landscapes and food forests.
    - Wildlife Attractor: Flowering periods offer nectar for generalist pollinators when many other guild members are between flushes.
