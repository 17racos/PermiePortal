common_name: Epazote
picture: epazote.webp
scientific_name: Dysphania ambrosioides
aka:
  - Mexican tea
  - Wormseed (old common name)
family: Amaranthaceae
zone: 8-11
ideal_temp_min: 55
ideal_temp_max: 95
min_temp: 25
max_temp: 105
perennial: true
layers:
  - Herbaceous
plant_function:
  - Edible
  - Medicinal
  - Pest Management
description: |-
  Epazote is the pungent herb beans tolerate and gringos underestimate. Jagged leaves, weedy enthusiasm, and chemistry you should not treat like parsley. Traditional bean-pot herb; also historically used against intestinal uninvited guests — potency means respect the dose. In subtropical and tropical Americas it self-seeds through warm seasons and sulks in hard frost unless protected. Sun, moderate fertility, and drainage keep oils strong.

  Full sun for strongest flavor. Average soil; tolerates poor ground better than snob herbs. Moderate moisture; avoid constant soggy stagnation.

  Seeds: abundant; easy. Transplant volunteers.

  Pinch young leaves for cooking; flavor intensifies with age. Pregnant people should avoid medicinal experimentation — this plant is not casual.
purpose: |-
  Edible: Dysphania ambrosioides tips go into black bean pots at tablespoon-per-pot rates -- carvone-forward oils read camphor-mint and intensify as stems lignify, so pinch young growth for milder salsas in zone 8-11 self-seeding rows.
  Medicinal: Ascaridole-rich essential oil backs traditional anthelmintic reputation -- pregnancy contraindications and neurotoxicity at concentrate doses are documented, so keep culinary pinches small and skip essential-oil experiments without clinician oversight.
  Pest Management: Strong methyl-salicylate-class volatiles show up in intercropping studies as mild whitefly masking on adjacent tomatoes -- treat the effect as polyculture noise confusion, not a certified replacement for scouting and biological controls.
companions:
  - Green Bean
  - Tomato
  - Potato
cautions:
  - Overwatered heavy clay without sun
pests:
  - Aphids
  - Leafhoppers
  - Whiteflies
