  description: "Epazote is the pungent herb beans tolerate and gringos underestimate.
    Jagged leaves, weedy enthusiasm, and chemistry you should not treat like parsley.
    Traditional bean-pot herb; also historically used against intestinal uninvited
    guests — potency means respect the dose. In subtropical and tropical Americas it self-seeds through
    warm seasons and sulks in hard frost unless protected. Sun, moderate fertility,
    and drainage keep oils strong.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n-
    Full sun for strongest flavor.\n- Average soil; tolerates poor ground better than
    snob herbs.\n- Moderate moisture; avoid constant soggy stagnation.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Seeds: abundant; easy.\n- Transplant volunteers.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Pinch young leaves for cooking; flavor intensifies with age.\n-
    Pregnant people should avoid medicinal experimentation — this plant is not casual."
  purpose: |-
    Edible: Dysphania ambrosioides tips go into black bean pots at tablespoon-per-pot rates -- carvone-forward oils read camphor-mint and intensify as stems lignify, so pinch young growth for milder salsas in zone 8-11 self-seeding rows.
    Medicinal: Ascaridole-rich essential oil backs traditional anthelmintic reputation -- pregnancy contraindications and neurotoxicity at concentrate doses are documented, so keep culinary pinches small and skip essential-oil experiments without clinician oversight.
    Pest Management: Strong methyl-salicylate-class volatiles show up in intercropping studies as mild whitefly masking on adjacent tomatoes -- treat the effect as polyculture noise confusion, not a certified replacement for scouting and biological controls.
