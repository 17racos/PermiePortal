  description: "The peach tree (Prunus persica) is a deciduous stone fruit species from northwest China, naturalized and
    bred across temperate to warm-temperate belts of the Americas for juicy drupes with fuzzy skin (or smooth in nectarine
    forms). Standard trees may reach roughly 4–6 meters (13–20 feet) on seedling roots, while modern rootstocks keep crowns
    smaller for ladders, light, and spray-threshold honesty. Bark is glossy reddish-brown when young; spring bloom is pink
    to rose before leaves fully expand, making peaches a seasonal signal in orchards and backyard rows alike.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun drives fruit sugar and disease recovery—shade yields leafy disappointment.\n- Deep, infrequent
    irrigation beats chronic sprinkle patterns that only flirt with roots.\n- Well-drained loam limits phytophthora drama;
    heavy soils demand berming or species honesty about replant stress.\n\n✂️ Methods to Propagate:\n- Grafting onto labeled
    rootstocks is the practical path for known cultivars, chill requirement, and tree size.\n- Budding in late summer pairs
    scion wood with active cambium on compatible Prunus understocks.\n- Seeds grow trees but fruit quality roulette is real—use
    for rootstock experiments, not promised dessert.\n\n🌾 Harvest / Best Use Timing:\n- Pick when background color lightens
    and fruit yields slightly to gentle pressure; aroma beats Instagram gloss for flavor truth.\n- Process windfalls fast—peaches
    wait for no one's calendar.\n- Summer prune after harvest in humid climates to reopen canopy and reduce brown-rot microclimate."
  purpose: |-
    Peach belongs in diversified systems as a seasonal carbohydrate pillar with ecosystem side gigs:

    - Edible: Fruit supplies fresh eating, canning, drying, and fermentation projects where sugar and acid balance shines.
    - Medicinal: Traditional cultures use parts of Prunus spp. in preparations; modern use demands identification and safety homework.
    - Pollinator: Massed flowers feed early-season bees when many other crops are still thinking about waking up.
    - Wildlife Attractor: Fruit drops feed birds and mammals you may or may not welcome—design fencing accordingly.
    - Mulcher: Prunings and leaf drop return bulk carbon to alley mulch if chipped or laid under drip lines.
    - Dynamic Accumulator: Root and leaf turnover in mature systems contributes to nutrient cycling when biomass stays on site.
    - Border Plant: Dwarfing stocks define orchard edges and food-forest transitions without reading like a parking-lot island.
  companions:
  - Comfrey — chop-and-drop leaves feed shallow feeder roots without competing for trunk space if kept outside the dripline.
  - White Clover — living understory fixes nitrogen and cushions soil while mower strips stay away from trunks.
  - Lavender — sun-loving shallow roots occupy different horizons while supporting generalist pollinators near bloom overlap.
  cautions:
  - Black Walnut — juglone and related allelopathy from walnut-family neighbors stress many Prunus roots; keep separation literal.
  practitioner_notes: |-
    Thin fruit like you mean it—overloaded branches make small, rot-prone peaches and broken wood confessions.
    Brown rot loves touching fruit; pick spacing and pruning for airflow, not hope alone.
    Label scion wood when you cut it; winter grafting amnesia is a tradition nobody needs.
  pests:
  - Brown Rot
  - Leaf Curl
  - Oriental Fruit Moth
  - Peachtree Borer
  - Peach Twig Borer
  - Plum Curculio
  - Scale Insects
