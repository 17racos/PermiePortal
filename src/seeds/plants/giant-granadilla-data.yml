  description: |-
    Giant granadilla is the passion vine that skipped leg day and never looked back: huge leaves, big green fruit, mild aromatic pulp. It needs serious trellising—think pergola engineered for weight, not a flimsy tomato cage having an existential crisis. subtropical and tropical Americas is marginal for reliable fruiting; coastal 10a microclimates with frost plans are the honest conversation.

    ☀️💧 Sun and Water Requirements:
    - Full sun for flowering and fruit; partial shade tolerated in peak heat if humidity stays reasonable.
    - Rich, organic, well-drained soil; steady moisture during vine push and fruit swell.

    ✂️ Methods to Propagate:
    - Cuttings: preferred for clones; semi-hardwood in warm, humid conditions.
    - Seeds possible but variable; slower than cuttings for production-minded growers.

    🌾 Harvest notes:
    - Fruit size and skin color vary by clone; harvest when skin begins to yield slightly and aroma develops—patience beats premature pick pucker.
  purpose: |-
    - Edible: Pulp for drinks and desserts; rind sometimes cooked in traditional recipes—verify cultivar notes.
    - Wildlife Attractor: Passionflower specialist relationships where sprays are restrained.
    - Shade Provider: Serious summer shade on beefy structures.
    - Ornamental: Tropical vibe without pretending you are in Costa Rica unless your microclimate agrees.
  companions:
  - Comfrey
  - Beans
  - Perennial Peanut
  cautions:
  - Undersized trellis or fence panels
  - Unprotected young vines in open frost pockets
  pests:
  - Aphids
  - Whiteflies
  - Caterpillars
  practitioner_notes: |-
    Overfertilized fast growth dilutes flavor and invites sap feeders—lean soil often tastes more like itself.
    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.
    Harvest texture changes faster than color—nip one sample before you commit the whole row to a pick date.
    Blanch or process within hours if you are freezing—enzymes keep chewing while paperwork waits.
