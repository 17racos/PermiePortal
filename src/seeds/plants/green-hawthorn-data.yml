  description: "Green hawthorn (Crataegus viridis) is a deciduous rosaceous tree or large shrub of southeastern and eastern North American lowlands, river margins, and old fields, bearing glossy green leaves, white spring blossoms, and red to orange haws. Heights of 20–35 feet (6–10.5 m) are common in open conditions. It is a thorny, wildlife-friendly edge species for hedgerows and restoration mixes in humid temperate to subtropical climates.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; more sun improves flowering and fruit. Tolerates moist soils and periodic inundation better than many hawthorns, yet still needs oxygenated root zones between flood pulses. Mulch young trees to reduce competition from turf.\n\n✂️ Propagation:\nSow seed following standard Crataegus stratification protocols. Field-collect local ecotypes for restoration fidelity. Prune for open vase shape to improve airflow in humid climates.\n\n🌾 Harvest / Best Use Timing:\nCollect haws when fully colored for jelly experiments—flavor varies by genotype. Leave fruit for migrating birds when your pantry is full. Inspect thorny branches before reaching—blood donations are optional."
