  description: |-
    Illawarra plum is an Australian podocarp “conifer” that fruits like a shameless gymnosperm: dark, grape-sized, plum-flavored arils on female trees, with glossy evergreen needles and a dense crown that can reach 30–40 feet in favorable subtropical sites.

    In Florida and Puerto Rico it slots into food-forest mid-canopy or windbreak rows where drainage is good and salt spray is moderate—humid summers are fine if soil never stagnates; Puerto Rico’s steady warmth accelerates growth compared to marginal mainland frosts. Male and female plants are separate; you need a pollen partner for fruit.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; young plants appreciate partial shade in hottest exposures.
    - Deep, fertile, well-drained soil; tolerates sandy coastal soils with organic mulch and irrigation establishment.
    - Regular water during fruit swell; reduce once deep-rooted, but avoid prolonged drought during heavy crop load.

    ✂️ Propagation:
    - Seeds cleaned of pulp and sown fresh; germination can be slow—patience and bottom heat help.
    - Hardwood cuttings with hormone on bottom heat for clonal lines when available.
    - Air-layering low branches on known fruiting females to preserve genetics.

    🌾 Harvest / Best Use Timing:
    - Pick arils when fully colored, slightly soft, and aromatic—timing shifts with wet/dry season rainfall.
    - Process quickly into jams, sauces, or fermentations; fruit is soft and perishable off the tree.
  purpose: |-
    Illawarra plum is canopy infrastructure with dessert attached:

    - Edible: Sweet-tart arils extend the unusual-fruit portfolio beyond typical annona and citrus.
    - Shade Provider: Evergreen crown cools understory livestock, poultry, and shade-loving shrubs.
    - Windbreaker: Dense foliage and flexible wood reduce desiccating winds along coasts and exposed ridges.
    - Wildlife Attractor: Fruit feeds birds and fruit bats where present; plan netting or guild sacrifice branches if you want a human share.
  companions:
  - Citrus — similar cultural rhythm for irrigation and foliar scouting; staggered harvest spreads labor.
  - Papaya — fast soft-fruited neighbor that uses vertical space differently while appreciating some midday shade when young.
  - Comfrey — mineral-rich chop-and-drop under the drip line without competing for canopy.
