- Animal Fodder
description: |-
  Velvet bean (Mucuna pruriens) is a vigorous twining legume grown as a warm-season cover crop for its ability to build fertility and produce abundant biomass. It is native to tropical regions and is widely used across humid tropics because it grows fast, covers soil quickly, and forms nitrogen-fixing relationships through its roots. Plants can reach several meters when trellised and typically produce large pods with dense seeds. In permaculture, velvet bean matters because it turns hot-season idle time into nitrogen-rich mulch, suppresses weeds with its canopy, and can provide fodder resources when handled appropriately.

  - Full sun; growth is strongly heat-dependent.
  - Moderate water during establishment; once rooted it tolerates warm-season dry spells.
  - Prefers fertile, well-drained soil with organic matter.
  - Avoid waterlogged beds; legume roots rot in stagnant moisture.

  - Seeds (direct sow): sow warm and soak seeds 12–24 hours to improve emergence.
  - Scarification (optional): gently nick hard seed coats to speed germination if your conditions are slow.
  - Trellised or mulch mode: plant thickly for cover, then adjust spacing for biomass or seed.

  - For mulch/green manure: cut before pods fully mature and leave residues as surface cover.
  - For seed: harvest pods when dry, then process seeds thoroughly before any food or feed use.
  - For flowers/beneficial insects: allow partial stands to bloom while managing the rest.
purpose: |-
  Nitrogen Fixer: Mucuna pruriens nodulates aggressively in tropical heat -- rotate with maize or sorghum so the next crop eats the nitrogen left in vine residues.
  Mulcher: Rampant twinning growth smothers weeds and returns tons of leafy biomass when slashed pre-pod -- wear gloves; many accessions bear irritating hairs on pods.
  Animal Fodder: Roasted or thoroughly processed seed can supplement ruminant protein -- raw seed contains L-DOPA and lectins; never feed uncooked seed to stock or humans.
companions:
- Corn (Zea mays) — trellis/edge support and warm-season compatibility for mixed cover-crop
  planning.
- Sunflower (Helianthus annuus) — tall companion provides additional canopy and supports
  beneficial insects.
- Garlic (Allium sativum) — rotation partner that helps diversify bed odors and reduce
  pest continuity.
cautions:
- Many velvet bean seeds/parts can be toxic if eaten raw; process thoroughly before
  any food/feed use.
pests:
- Aphids
- Spider Mites
- Root Rot
- Caterpillars