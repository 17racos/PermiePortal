  description: "Wine caps are the extroverts of wood-chip beds — big burgundy caps,
    a ring on the stipe, and a habit of running through straw, chips, and garden
    paths like they pay rent. North Florida works if you keep the bed moist through
    dry weeks and replenish woody mulch as it breaks down. They are not a magic
    slug eraser, but they are a legitimate outdoor protein crop that turns cardboard
    aesthetics into dinner. Pair with woody debris under fruit trees; avoid eating
    anything you have not keyed out.\n\n☀️💧 Sun and Water:\n- Part shade to dappled
    sun; mulch caps soil temperature.\n- Steady moisture during colonization; deep
    occasional soak beats constant sprinkle if drainage is good.\n- Fresh hardwood
    chips and straw layers; anaerobic pits smell bad and grow regrets.\n\n✂️ Propagation:\n-
    Spawn into fresh chip/straw beds; top-dress yearly with new woody material.\n-
    Move bits of colonized substrate to new beds when active."
  purpose: |-
    Wine cap substrate is path and guild mulch that happens to taste good:

    - Edible: Choice when identified correctly; cook thoroughly like any wild mushroom.
    - Mulcher: Accelerates breakdown of woody debris in place.
    - Soil Improvement: Mycelium stitches organic matter into living soil.
