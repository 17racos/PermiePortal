  description: "Creeping raspberry (*Rubus hayata-koidzumii*) is a low, evergreen
    bramble that trails across soil and stone instead of arching upward like traditional
    cane fruit. Rounded, crinkled leaves often read as quilted; small white flowers
    may yield modest, edible orange-red fruits that are pleasant but not commercial-crop
    sized. Mats stay roughly 10–20 cm tall and spread widely by tip-rooting stems.
    It tolerates heat better than many temperate groundcovers, making it a candidate
    for subtropical and tropical Americas shade gardens, path edges, and terraces if humidity
    is paired with drainage.\n\n☀️💧 **Sun and Water Requirements:**\nPart shade to
    dappled sun in hot climates; morning sun with afternoon shade reduces leaf scorch.
    Rich, well-drained loam with consistent moisture; dries slowly between waterings
    in humid air to limit fungal spotting.\n\n✂️ **Methods to Propagate:**\n- **Tip
    layering:** Pin trailing stems to soil until roots anchor, then sever and transplant.\n-
    **Division:** Slice rooted mats in cool, moist weather and reset pieces with mulch.\n\n🌾
    **When to Harvest:**\nPick soft, fully colored berries for fresh eating or small-batch
    jams; yields are light—treat as a bonus, not a staple crop. Trim wandering stems
    that climb into delicate neighbors."
  purpose: |-
    - **Edible:** Nibble-grade fruit rewards patient gardeners without pretending to replace highbush raspberry plantings.
    - **Ground Cover:** Evergreen mat smothers weeds on shady banks where turf fails ethically.
    - **Erosion Control:** Dense stems and roots armor slopes under trees and along stone steps.
    - **Wildlife Attractor:** Flowers and fruit feed small pollinators and birds along semi-wild edges.
