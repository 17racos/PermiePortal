  description: 'Sand lovegrass (Eragrostis trichodes) is a warm-season bunchgrass of central North American sandy prairies
    and roadsides, producing large, airy panicles that catch light like smoke on stems often 2–4 feet (60–120 cm). It roots
    quickly on disturbed sand, making it useful for erosion control during early succession while longer-lived prairie species
    establish. In ornamental design it pairs with purple lovegrass for a two-stage lovegrass drama nobody asked for but everyone
    photographs.


    ☀️💧 Sun and Water Requirements:

    Full sun for strongest stems and fullest panicles. Well-drained sandy to coarse loamy soils suit it; tolerates drought
    and lean fertility. Avoid wet clay; water deeply only during establishment or extreme drought.


    ✂️ Propagation:

    Sow seed in warm soil; lightly cover. Divide bunches in spring if necessary. Cut back in late winter before new growth.


    🌾 Harvest / Best Use Timing:

    Cut inflorescences for dried arrangements when color is tan-gold but before heavy shattering. Leave seed for birds if
    winter structure is acceptable. Peak display tracks late-summer heat.'
  purpose: |-
    Erosion Control: Erosion control needs roots that grip: It roots quickly on disturbed sand, making it useful for erosion control during early succession while longer-lived prairie species establish. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ornamental: Sand Lovegrass earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Sand Lovegrass layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Biomass: Sand Lovegrass prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories
