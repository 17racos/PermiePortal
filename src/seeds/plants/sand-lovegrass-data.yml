description: |-
  Sand lovegrass (Eragrostis trichodes) is a warm-season bunchgrass of central North American sandy prairies and roadsides, producing large, airy panicles that catch light like smoke on stems often 2–4 feet (60–120 cm). It roots quickly on disturbed sand, making it useful for erosion control during early succession while longer-lived prairie species establish. In ornamental design it pairs with purple lovegrass for a two-stage lovegrass drama nobody asked for but everyone photographs.

  ☀️💧 Sun and Water Requirements:
  Full sun for strongest stems and fullest panicles. Well-drained sandy to coarse loamy soils suit it; tolerates drought and lean fertility. Avoid wet clay; water deeply only during establishment or extreme drought.

  ✂️ Propagation:
  Sow seed in warm soil; lightly cover. Divide bunches in spring if necessary. Cut back in late winter before new growth.

  🌾 Harvest / Best Use Timing:
  Cut inflorescences for dried arrangements when color is tan-gold but before heavy shattering. Leave seed for birds if winter structure is acceptable. Peak display tracks late-summer heat.
purpose: |-
  Erosion Control: Eragrostis trichodes germinates fast on highway cuts and blow-sand wounds so slower prairie forbs have a root scaffold the first wet season.
  Ornamental: Huge airy panicles catch backlight like pale smoke above knee-high foliage in lean meadow mixes that skip irrigation guilt.
  Wildlife Attractor: Tiny seeds feed sparrows and longspurs while bunch bases shelter insects at soil level through winter dormancy.
  Biomass: Standing straw-colored stems chop into coarse mulch that feeds fungal chains on carbon-starved coastal sands when timed after seed shatter.
companions:
- Sand Bluestem — taller warm-season grass neighbor sharing sandhill ethics
- Purple Lovegrass — smaller Eragrostis cousin with contrasting purple haze timing
- Prairie Coneflower — forb verticals above lovegrass mounds in dry mixes
cautions:
- Short-lived on rich irrigated beds—lean sand extends performance
- Self-sowing in gravel—delightful or deplorable per driveway politics
