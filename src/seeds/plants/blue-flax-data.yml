  description: "Blue flax (Linum lewisii) is a short-lived perennial or sometimes
    biennial wildflower native to western North America, valued for sky-blue flowers
    on wiry stems and narrow gray-green leaves. Mature plants reach about 45–90 cm
    (18–36 inches) tall with an airy, upright habit and often reseed politely in
    open, sunny spots.\n\n🌞💧 Sun and Water Requirements:\n- Full sun to very light
    afternoon shade; shade reduces bloom.\n- Well-drained, lean to average soil;
    dislikes wet feet. In subtropical and tropical Americas, treat as a cool-season accent
    or grow in drier, breezy sites—humid wet-season saturation shortens life.\n-
    Moderate water during establishment; thereafter fairly drought-tolerant.\n\n✂️
    Methods to Propagate:\n- Seeds: Sow in fall or early spring; lightly cover seed;
    germinates in 2–4 weeks with warmth.\n- Transplants: Move young self-sown seedlings
    while small; older taproots resent disturbance.\n\n🌾 Harvest / Best Use Timing:\n-
    Collect seeds when capsules brown and rattle. Stems historically used for cordage
    fiber in small homestead batches; flowers are short-lived in the vase but lovely
    for seasonal bouquets."
  purpose: |-
    Pollinator: Linum lewisii opens sky-blue saucers on wiry stems each morning, giving small solitary bees a landing pad in lean prairie edges where heavier flowers stay closed.
    Ornamental: Gray-green needles and upright habit carry color at knee height along gravel paths without irrigation guilt in dry summers.
    Wildlife Attractor: Finches and juncos strip dry capsules when stems stand into winter, so leave a patch uncut if you want free seeding next year.
    Fiber: Bast from stems yields short, tough cordage in homestead-scale batches when you rett and scrape after seed ripens, nothing like long-flax linen mills.
  companions:
  - Echinacea
  - Yarrow
  - California Poppy
  cautions:
  - None documented
  pests:
  - Aphids
  - Japanese Beetles
  practitioner_notes: |-
    Taproot sulks if you wrench mature plants—move volunteers while small or direct-sow where you want permanence.
    Capsules rattle when brown; collect before wind empties them if you are curating color strains in a meadow mix.
    In long hot summers it behaves like a biennial—plan succession seeding rather than expecting a decade clump.
    Overfeeding produces lush flop and fewer flowers; lean soil reads as cruel but gives the airy blue you planted for.
  growth_habit: Upright wiry perennial; often behaves as short-lived where heat is intense
