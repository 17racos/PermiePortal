  description: "This is the crunchy corm crop sold canned for stir-fries—not the
    spiny **Trapa** invader sometimes called water chestnut up north. **Eleocharis
    dulcis** is a sedge with upright tubular leaves and underwater rhizomes that
    form crisp, sweet corms when grown in warm, long seasons.\n\nNorth Florida: doable
    in sun-heated tubs or shallow paddies if you can give 7+ frost-free months; harvest
    before hard chill kills tops. Not a casual pond plant—manage fertility and avoid
    escapes into sensitive wetlands.\n\nSun and water: Full sun; shallow flooded soil
    or mucky containers 3–8 inches deep; high organic matter; keep consistently wet
    during growth, drain to force corm finish where growers use that trick.\n\nPropagation:
    Cormlets at rhizome tips; divide clumps at repot. Start with disease-free corms
    from reputable sources."
  purpose: |-
    Starchy wetland crop for controlled systems; texture hero in home kitchens. If
    someone says \"water chestnut\" and means floating rosettes with barbed nuts, that
    is a different genus and a different ethics lecture.
