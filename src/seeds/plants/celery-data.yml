  practitioner_notes: 'Blanch stems two weeks before cut—boards or tubes; otherwise inner ribs stay bitter and string talks
    back.

    Consistent moisture prevents hollow stalks—big dry swings split pith and invite rot in the core.

    Leafminer trails mean it is already inside—remove worst leaves, avoid broad sprays that torch parasitic wasps.

    Heavy feeders without compost show yellow bottom leaves—side-dress light nitrogen on schedule, not one heroic dump.'
