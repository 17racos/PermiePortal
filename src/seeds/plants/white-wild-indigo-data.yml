  description: 'White wild indigo (Baptisia alba) is a long-lived legume perennial of southeastern North American prairies
    and open woods, with blue-green trifoliate leaves and tall spikes of white pea flowers in late spring. Plants reach 3–4
    feet (0.9–1.2 m), forming shrub-like clumps with deep taproots. It fixes nitrogen slowly but steadily—patience beats bagged
    urea for lean-soil ethics.


    ☀️💧 Sun and Water Requirements:

    Full sun for strongest flowering and nodule activity; shade reduces bloom. Well-drained, average to lean soils suit it;
    wet clay rots crowns. Water deeply during establishment only.


    ✂️ Propagation:

    Sow scarified seed with cold stratification; division is difficult—prefer fresh seed for large areas. Cut back dead stems
    in late winter if tidy gardens matter.


    🌾 Harvest / Best Use Timing:

    Leave seed pods for ornamental rattles and bird interest. Peak bloom follows late-spring warmth after frost risk near
    28°F (-2°C) declines.'
  purpose: '- Nitrogen Fixer: Rhizobia nodules enrich soil when tops are cut and dropped or decompose in place.

    - Pollinator: Pea flowers feed bumblebees during a focused late-spring window.

    - Ornamental: White spires add vertical rhythm in native borders.

    - Erosion Control: Deep roots stabilize sunny slopes once established.'
