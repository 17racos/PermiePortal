  description: "White wild indigo (Baptisia alba) is a long-lived legume perennial of southeastern North American prairies and open woods, with blue-green trifoliate leaves and tall spikes of white pea flowers in late spring. Plants reach 3–4 feet (0.9–1.2 m), forming shrub-like clumps with deep taproots. It fixes nitrogen slowly but steadily—patience beats bagged urea for lean-soil ethics.\n\n☀️💧 Sun and Water Requirements:\nFull sun for strongest flowering and nodule activity; shade reduces bloom. Well-drained, average to lean soils suit it; wet clay rots crowns. Water deeply during establishment only.\n\n✂️ Propagation:\nSow scarified seed with cold stratification; division is difficult—prefer fresh seed for large areas. Cut back dead stems in late winter if tidy gardens matter.\n\n🌾 Harvest / Best Use Timing:\nLeave seed pods for ornamental rattles and bird interest. Peak bloom follows late-spring warmth after frost risk near 28°F (-2°C) declines."
  purpose: |-
    - Nitrogen Fixer: Rhizobia nodules enrich soil when tops are cut and dropped or decompose in place.
    - Pollinator: Pea flowers feed bumblebees during a focused late-spring window.
    - Ornamental: White spires add vertical rhythm in native borders.
    - Erosion Control: Deep roots stabilize sunny slopes once established.
  companions:
  - Little Bluestem — warm-season grass matrix sharing sun and drainage
  - Orange Coneflower — yellow forb contrast after indigo bloom fades
  - Milkweed — complementary pollinator forb with different bloom timing
  cautions:
  - Transplanting large clumps—taproot sulk is legendary
  - Overwatering + heavy soil — crown rot invites replacement shopping
  pests:
  - Aphids
  - Japanese Beetles
  - Spider Mites
  practitioner_notes: |-
    First-year sleep, second-year creep—taprooted legumes hate rush culture.
    White spikes photograph best against dark green neighbors—design contrast intentionally.
    Seed pods rattle like honest percussion—leave some for kids, birds, and winter ears.
    Weevils sometimes drill seeds—float-test if you need high germination rates.
  growth_habit: Long-lived legume perennial; white pea flower spikes; lean sunny soils
