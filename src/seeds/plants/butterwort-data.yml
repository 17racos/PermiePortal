  description: "Butterworts are carnivorous plants with rosettes of succulent, glandular
    leaves that excrete a sticky fluid to trap insects. They are typically found in
    moist, acidic environments such as bogs and fens. Butterworts produce attractive,
    funnel-shaped flowers that can be white, pink, or purple. They require partial
    shade to full sun and consistently moist, well-draining soil to thrive.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Seed: Sow seeds on the surface of a moist peat and sand
    mix; do not cover, as they require light to germinate. Maintain high humidity
    and temperatures between 60-75°F (16-24°C). Germination may take several weeks.\n-
    Leaf Pullings: Gently pull a leaf from the base and place it on moist sphagnum
    moss; new plantlets may form at the base of the leaf.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Sun: Partial shade to full sun; avoid intense midday
    sun, especially in hotter climates.\n- Water: Keep soil consistently moist using
    distilled or rainwater; avoid tap water due to mineral sensitivity. Ensure good
    drainage to prevent root rot.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When
    to Harvest:\n- Butterworts are primarily cultivated for ornamental purposes and
    natural pest control rather than harvest."
  purpose: |-
    Pest Management: Butterwort supports IPM stacks through scent masking, trap-crop sacrifice, or predator habitat when rotated thoughtfully -- confuses or repels problem insects through scent, trap crops, or habitat for predators you actually want
    Ground Cover: Butterwort carpets soil fast enough to smother early weeds while feeding surface roots and arthropods -- closes the soil surface against weeds and evaporation while feeding roots and arthropods at ground level
    Ornamental: Butterwort earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Pollinator: Pollinator service is measurable at the flower: Butterworts produce attractive, funnel-shaped flowers that can be white, pink, or purple. -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
  companions:
  - Sphagnum Moss
  - Sundew
  - Pitcher Plant
  cautions:
  - Plants requiring high nutrient soils
  pests:
  - Aphids
  - Root Rot
  practitioner_notes: |-
    Never fertilize like houseplants—mineral buildup kills sticky leaves faster than drought.
    Mexican types need a dry winter rest; temperate ones want cool wet dormancy—mixing regimes rots crowns.
    Aphids on carnivores mean the plant is too dry or too stressed to glue them—fix culture before oil sprays smother traps.
    Repot in late winter before new glue—disturb roots gently; old media that turned salty is usually the culprit.
