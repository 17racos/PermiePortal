  description: "Butterworts are carnivorous plants with rosettes of succulent, glandular
    leaves that excrete a sticky fluid to trap insects. They are typically found in
    moist, acidic environments such as bogs and fens. Butterworts produce attractive,
    funnel-shaped flowers that can be white, pink, or purple. They require partial
    shade to full sun and consistently moist, well-draining soil to thrive.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Seed: Sow seeds on the surface of a moist peat and sand
    mix; do not cover, as they require light to germinate. Maintain high humidity
    and temperatures between 60-75°F (16-24°C). Germination may take several weeks.\n-
    Leaf Pullings: Gently pull a leaf from the base and place it on moist sphagnum
    moss; new plantlets may form at the base of the leaf.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Sun: Partial shade to full sun; avoid intense midday
    sun, especially in hotter climates.\n- Water: Keep soil consistently moist using
    distilled or rainwater; avoid tap water due to mineral sensitivity. Ensure good
    drainage to prevent root rot.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When
    to Harvest:\n- Butterworts are primarily cultivated for ornamental purposes and
    natural pest control rather than harvest."
  purpose: |-
    Butterworts are specialist guild members for boggy edges and obsessive houseplant keepers:

    - Pest Management: Sticky leaf glands intercept fungus gnats, fruit flies, and other tiny dipterans before they tank your seedling trays.
    - Ground Cover: Rosettes knit into a living mat in humid shade beds or glass tanks where drainage is honest and minerals stay low.
    - Ornamental: Funnel-shaped flowers and jeweled leaves read as high-design ground layer in patio collections across subtropical Florida and indoor Puerto Rico plant walls.
    - Pollinator: Blooms still offer nectar to small native bees where species persist outdoors in mild, wet microclimates.
  companions:
