  description: 'Sea oxeye daisy (Borrichia frutescens) is a salt-spray tough perennial shrublet of coastal dunes, mangrove
    edges, and brackish flats around the Gulf and Atlantic coasts of the Americas. Bright yellow radiate flowers cap succulent,
    often gray-green foliage. It is a backbone plant for dune restoration and coastal polycultures where inland daisies would
    desiccate in a week.


    ☀️💧 Sun and Water Requirements:

    - Full sun; anything less invites leggy weak growth.

    - Drought tolerant in maritime exposure once established; occasional salt wetting is normal.

    - Pure sand to shell; intolerant of heavy shade and stagnant freshwater pots.


    ✂️ Propagation:

    - Semi-hardwood cuttings in warm seasons with fast-draining mix.

    - Seeds when available; sow in sandy mix with salt regime matching destination.

    - Trim storm damage after calm weather to reshape mounds.


    🌾 Harvest / Best Use Timing:

    - Not a primary food plant; ornamental and ecological value lead.

    - Deadhead only if invasive seeding is a documented local issue—otherwise leave seed heads for birds.

    - Mulch with shell sand, not bark, in authentic coastal designs.'
  purpose: |-
    Ornamental: Borrichia frutescens rubbery shrubs carry chrome-yellow radiate heads above gray succulent leaves -- reads graphic against shell hash and turquoise water without irrigation guilt.
    Pollinator: Coastal halictids and syrphids work short-ray flowers when steady trade wind keeps inland daisy species folded.
    Erosion Control: Woody crowns resprout after salt splash so foredune mats hold sand where annual colonizers wash away each spring tide series.
    Wildlife Attractor: Seed heads feed small passerines while stiff stems anchor spider silk that catches insect drift above high tide wrack.
  companions:
  - Railroad Vine — prostrate morning glory runs along foredune while oxeye forms mounded clumps
  - New Zealand Ice Plant — succulent mat behind front-line dunes shares salt ethics
  - Sea Rocket — annual brassy filler reseeding in upper beach zones
