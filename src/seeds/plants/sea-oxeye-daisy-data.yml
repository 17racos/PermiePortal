  description: "Sea oxeye daisy (Borrichia frutescens) is a salt-spray tough perennial
    shrublet of coastal dunes, mangrove edges, and brackish flats around the Gulf
    and Atlantic coasts of the Americas. Bright yellow radiate flowers cap succulent,
    often gray-green foliage. It is a backbone plant for dune restoration and coastal
    polycultures where inland daisies would desiccate in a week.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun; anything less invites leggy weak growth.\n-
    Drought tolerant in maritime exposure once established; occasional salt wetting
    is normal.\n- Pure sand to shell; intolerant of heavy shade and stagnant freshwater
    pots.\n\n✂️ Propagation:\n- Semi-hardwood cuttings in warm seasons with fast-draining
    mix.\n- Seeds when available; sow in sandy mix with salt regime matching destination.\n-
    Trim storm damage after calm weather to reshape mounds.\n\n🌾 Harvest / Best
    Use Timing:\n- Not a primary food plant; ornamental and ecological value lead.\n-
    Deadhead only if invasive seeding is a documented local issue—otherwise leave
    seed heads for birds.\n- Mulch with shell sand, not bark, in authentic coastal
    designs."
  purpose: |-
    - Ornamental: Bold yellow flowers and silvery foliage read clean against blue sky and sand.
    - Pollinator: Coastal pollinators use flowers during windy seasons when fewer plants bloom.
    - Erosion Control: Woody base and roots stabilize foredunes and upper beach margins.
    - Wildlife Attractor: Seeds and structure support beach-edge birds and insects.
  companions:
