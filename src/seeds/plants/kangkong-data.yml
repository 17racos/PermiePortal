description: |-
  Kangkong is a heat-loving aquatic/moist-soil vine grown like spinach that actually respects summer. Hollow stems, lush leaves, stir-fry royalty. In Florida it is regulated as an invasive aquatic plant in many contexts—grow it like you mean containment (tanks, raised beds lined from waterways, zero “let’s see what the canal thinks”). subtropical and tropical Americas frosts set the calendar; treat it as annual or greenhouse winter crop unless you are frost-free.

  Full sun to light shade; fastest growth with heat + nutrients + moisture. Hydrophilic: moist soil, hydroponic, or clean recirculating aquaponics—never introduce to natural water bodies.

  Cuttings: 20–30 cm tips root in water or wet media—commercial growers repeat this all season. Seeds in warm conditions if you can source them reliably.

  Snip tips repeatedly; plant responds with bushier growth—harvest before flowering for tenderest stems.
purpose: |-
  Edible: Ipomoea aquatica hollow stems and leaves stir-fry like mustard spinach -- blanch before high heat to tame oxalate bite, and never harvest from waterways where city runoff or snail vectors make the pot a hospital trip.
  Ground Cover: Floating or moist-soil vines close canopy over aquaponic rafts and wet beds -- containment is mandatory because escaped stems form mats that regulators list as invasive in subtropical drainage ditches.
  Soil Improvement: Tonnes of succulent biomass compost into nitrogen-rich slurry when beds are drained for season turnover -- keep residues on your farm, not in public canals.
