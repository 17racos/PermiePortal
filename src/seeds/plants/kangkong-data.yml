    and tropical Americas frosts set the calendar; treat it as annual or greenhouse winter crop unless you are frost-free.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light shade; fastest growth with heat + nutrients + moisture.

    - Hydrophilic: moist soil, hydroponic, or clean recirculating aquaponics—never introduce to natural water bodies.


    ✂️ Methods to Propagate:

    - Cuttings: 20–30 cm tips root in water or wet media—commercial growers repeat this all season.

    - Seeds in warm conditions if you can source them reliably.


    🌾 Harvest tips:

    - Snip tips repeatedly; plant responds with bushier growth—harvest before flowering for tenderest stems.'
