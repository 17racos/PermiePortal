  description: |-
    Kangkong is a heat-loving aquatic/moist-soil vine grown like spinach that actually respects summer. Hollow stems, lush leaves, stir-fry royalty. In Florida it is regulated as an invasive aquatic plant in many contexts—grow it like you mean containment (tanks, raised beds lined from waterways, zero “let’s see what the canal thinks”). North Florida frosts set the calendar; treat it as annual or greenhouse winter crop unless you are frost-free.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; fastest growth with heat + nutrients + moisture.
    - Hydrophilic: moist soil, hydroponic, or clean recirculating aquaponics—never introduce to natural water bodies.

    ✂️ Methods to Propagate:
    - Cuttings: 20–30 cm tips root in water or wet media—commercial growers repeat this all season.
    - Seeds in warm conditions if you can source them reliably.

    🌾 Harvest tips:
    - Snip tips repeatedly; plant responds with bushier growth—harvest before flowering for tenderest stems.
  purpose: |-
    - Edible: Leaf and tender stem vegetable in many Asian cuisines—cook like spinach, season like you mean it.
    - Ground Cover: Temporary wet-soil cover in controlled beds—not a native replacement for shorelines.
    - Soil Improvement: Biomass returns to compost when season ends—keep it on your land.
  companions:
  - Aquaponic lettuce
  - Taro (in separate containment philosophy)
  - Wetland-edge species only where law and ethics allow zero escape
  avoid:
  - Floating mats that can reach public water
  - Ignoring regional invasive-plant rules
  pests:
  - Aphids
  - Caterpillars
  - Leafhoppers
