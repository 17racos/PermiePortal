  description: 'This entry keys on sweet Annie—an annual artemisia that smells like camphor candy and self-sows like it pays
    rent in seeds. Feathery leaves, tiny cream flowers, legendary medicinal chemistry that launched modern antimalarial research
    (not a DIY prescription—respect the plant and the pharmacology). In subtropical and tropical Americas it completes a fast
    cycle in warm seasons; humid summers can bring foliar funk without airflow.


    ☀️💧 Sun and Water Requirements:

    - Full sun for aromatic oils and sturdy stems.

    - Well-drained, average fertility; drought-tolerant once established—wet clay rots crowns.


    ✂️ Methods to Propagate:

    - Seeds: surface sow; tiny seeds need light and steady moisture.

    - Self-sows; thin volunteers unless you want a monoculture perfume riot.


    🌾 Harvest notes:

    - Harvest leafy tops before full bloom for traditional drying—timing affects chemistry; use vetted guides.'
