  description: 'Sweet alyssum (Lobularia maritima) is a low, honey-scented workhorse: tiny four-petalled flowers in white,
    pink, or purple clouds over rounded gray-green leaves. In cool weather it forms carpets 4–10 inches tall; in heat it can
    get scraggly unless you give it afternoon shade and deadheading discipline. It self-sows where winters are mild.


    subtropical and tropical Americas: Treat it as a cool-season superstar in Florida—fall through spring borders, vegetable
    bed edges, and container spillers when nights finally drop the attitude. Puerto Rico’s upland pockets can grow it in the
    cooler months; lowland wet-season heat turns it into compost unless drainage is cruelly sharp. It is the annual apology
    tour for gardeners who want beneficial insects without another lecture.


    ☀️💧 Sun and Water Requirements:

    - Full sun in cool months; part shade in brutal summer microclimates.

    - Even moisture; do not drown crowns—raised beds and grit save lives in humid downpours.


    ✂️ Propagation:

    - Sow seed directly in prepared soil after heat breaks; barely cover seed, keep evenly moist until true leaves appear.

    - Soft tip cuttings root quickly in perlite mix for cloning favorite colors before they bolt.


    🌾 Harvest / Best Use Timing:

    - Cut and compost spent waves to prevent moldy thatch; shear lightly to force fresh bloom.

    - Let some plants set seed if you want free volunteers—control chaos or regret volunteers.'
  purpose: '- Pollinator: Tiny flowers feed syrphid flies, small bees, and other micro-pollinators when massed along bed edges.

    - Ground Cover: Living mulch between rows suppresses weeds without stealing deep nutrients from big crops.

    - Pest Management: Aphid-magnet reputation is a feature—pair with insectary planning so predators camp nearby.'
  companions:
  - Tomato — low edge planting invites hoverflies without shading the crop if kept trimmed.
  - Kale — brassica pests get watched when alyssum pulls early aphids into the open for predators.
  - Chives — upright allium lines contrast texture and may confuse some chewing insects at the border.
  cautions:
