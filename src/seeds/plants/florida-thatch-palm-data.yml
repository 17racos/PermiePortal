    Fiber: Florida Thatch Palm supplies harvestable fiber where small-scale cordage, crafts, or mulch substitutes beat buying plastic twine -- supplies harvestable fiber for cordage, crafts, or mulch substitutes where woody biomass is scarce
    Border Plant: Florida Thatch Palm tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
