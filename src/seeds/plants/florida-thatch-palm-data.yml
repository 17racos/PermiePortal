  description: 'Florida thatch palm (Thrinax radiata) is a medium fan palm of coastal tropical hammocks and limestone substrates
    in the Caribbean basin and parts of southern peninsular Florida, forming a slender gray trunk topped with green palmate
    leaves. Height commonly reaches 20–30 feet (6–9 m) in open conditions. Historically used for thatch and crafts, it now
    anchors wind-tolerant landscaping, parking islands, and coastal food-forest edges where salt breeze is part of the contract.


    ☀️💧 Sun and Water Requirements:

    Full sun once established; young plants tolerate light shade during establishment. Well-drained soils, including limestone
    and sandy coastal profiles; tolerates salt spray better than many broadleaf trees. Irrigate regularly during root establishment;
    reduce as the crown lifts and roots explore.


    ✂️ Propagation:

    Sow fresh seed in warm humid conditions; germination is slow and variable—plan for nursery patience. Transplant with intact
    root balls; minimizing root damage improves survival. Remove only fully brown fronds; green leaves still feed the palm.


    🌾 Harvest / Best Use Timing:

    Thatch harvest is specialized and can stress palms if overcut—learn traditional timing if pursuing fiber. Landscape maintenance
    peaks before hurricane season when dead material becomes projectile humor. Watch spear growth after cold events before
    writing off a specimen.'
  purpose: |-
