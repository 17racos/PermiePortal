  description: "Florida anise (Illicium floridanum) is an evergreen shrub of moist
    ravines, bluffs, and streambanks around the Gulf and Atlantic coastal plains,
    with aromatic, redolent leaves and bizarre maroon star-flowers that look like
    props from a noir film. It is not culinary star anise—fruits and plant parts are
    toxic if treated like spice-rack inventory. In landscapes it delivers deep shade
    texture, year-round structure, and flowers that intrigue pollinators adapted
    to oddball blooms. Permaculture value is mostly habitat, edge screening, and
    honest warnings about foraging illiteracy.\n\n☀️💧 Sun and Water Requirements:\n
    Partial to full shade in hot climates; morning sun with afternoon shade works
    on moist sites. Requires steady soil moisture and organic, acidic soils; wilts
    dramatically in drought or root heat from black plastic mulch crimes. Sheltered
    sites reduce winter desiccation in the cooler end of its range.\n\n✂️ Propagation:\n
    Semi-hardwood cuttings root under mist with warmth and humidity.\nSeeds germinate
    slowly; keep moist and shady for year-one seedlings.\n\n🌾 Harvest / Best Use Timing:\n
    Do not harvest for food. For ornamental use, prune after bloom to shape; avoid
    heavy shearing that exposes inner twigs to sunburn."
  purpose: |-
