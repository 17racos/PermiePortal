  description: "Deerberry (Vaccinium stamineum) is an open, deciduous blueberry relative of acidic woodlands and savanna edges,\
    \ recognizable by long, exserted stamens that make flowers look starry and brush-like. It ranges widely in eastern North\
    \ America, forming airy shrubs with small, dark berries that are tart and seedy but edible when fully ripe. In permaculture\
    \ it fills the niche between ornamental blueberry rows and wild thickets—less commercial yield, more resilience on poor\
    \ acid sands where rhizosphere honesty beats irrigation theater.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun\
    \ to partial shade; fruiting improves with more light if soil stays acidic. Needs moist, well-drained, organic-acid soils\
    \ typical of ericaceous plants; chlorosis on alkaline ground is a billboard for wrong pH. Drought tolerance is modest\
    \ compared with sandhill oaks—mulch and avoid root baking.\n\n ✂️ Propagation:\nSoftwood cuttings under mist in late spring\
    \ can root for clones of known fruit quality.\nSeeds require cold-moist stratification and patience; seedlings vary in\
    \ vigor and flavor.\n\n\U0001F33E Harvest / Best Use Timing:\nPick berries when fully colored, soft, and detaching easily;\
    \ underripe fruit is astringent. Use for jams with other fruit, small-batch ferments, or wildlife share agreements. Prune\
    \ old stems after winter to renew growth on multi-stemmed plants."
