  description: |-
    Lemon thyme (Thymus citriodorus) is a compact, lemon-scented herb valued for its aromatic foliage and small flowers that attract pollinators. It forms a low mound that can spread gently, typically 20–40 cm (8–16 in) tall depending on pruning and soil. In permaculture, it matters because it gives you a high-frequency herb harvest from the front edge of beds while acting as living mulch that shades soil and reduces evaporation.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; sun keeps stems compact and flavorful.
    - Water lightly while establishing; once rooted it tolerates drought well.
    - Prefers fast-draining, gritty or sandy loams; it dislikes persistent wet soil.
    - Protect from winter wet more than winter cold in humid climates.
    
    ✂️ Propagation:
    - Cuttings: take softwood or semi-hardwood cuttings in warm months and root under humidity (often 4–8 weeks).
    - Seeds: direct-sow or start indoors; germination can be uneven, sometimes taking 2–6 weeks with steady moisture.
    - Division: split clumps in spring for faster, true-to-type plants.
    
    🌾 Harvest / Best Use Timing:
    - Harvest leaves as needed once plants are established; cut stems lightly to encourage new growth.
    - Harvest flowers when in full bloom for teas and infused oils.
    - Dry gently in airflow if you want long storage.
  purpose: |-
    Medicinal: Aromatic leaves are used as a functional herbal input in tea-style preparations; in permaculture this adds an on-site remedy option.
    Pollinator: Small flowers feed bees and beneficial insects, helping keep the food garden’s insect traffic steady.
    Ground Cover: Low spread shades soil, reduces weed germination, and keeps moisture from evaporating as quickly.
  companions:
  - Rosemary (Salvia rosmarinus) — both prefer sun and drainage, making bed care simpler.
  - Marigold (Tagetes patula) — adds nectar and helps you monitor pest changes in the same front-edge zone.
  - Thyme (Thymus vulgaris) — same cultural needs and layered aroma encourages a stable herb patch guild.
  cautions:
  - Avoid heavy, waterlogged soil; crown rot is the main long-term problem.
  practitioner_notes: |-
    Harvest often, but don’t hack it down to sticks—trim for shape and flavor.
    In wet winters, raised beds beat “hope and drainage.”
    If it stops smelling like lemons, it probably needs more sun.
  pests:
  - Aphids
  - Spider Mites
  - Root Rot
