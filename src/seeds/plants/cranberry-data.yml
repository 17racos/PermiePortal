  description: 'Cranberry (Vaccinium macrocarpon) is a low-growing, evergreen shrub native to North America, particularly
    thriving in wetlands and bogs. It features slender, wiry stems that form dense mats, with small, leathery leaves that
    are dark green in summer and turn bronze in winter. The plant produces pink to red flowers in late spring, which develop
    into bright red berries known for their tart flavor.


    🌞💧 Sun and Water Requirements:

    Cranberries prefer full sun but can tolerate partial shade. They require acidic, well-drained, consistently moist soils,
    often found in bog-like conditions. Regular watering is essential to maintain soil moisture.


    ✂️🫘 Methods to Propagate:

    Propagation is commonly achieved through cuttings or layering. Softwood cuttings taken in late spring or early summer
    root well. Alternatively, existing stems can be pinned to the ground to encourage rooting at nodes.


    🧑‍🌾👩‍🌾 When to Harvest:

    Berries are typically harvested in the fall, from September to November, when they turn a deep red color and have a firm
    texture. In commercial operations, fields are often flooded to facilitate easier collection of the floating berries.'
