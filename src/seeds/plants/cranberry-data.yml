  description: "Cranberry (Vaccinium macrocarpon) is a low-growing, evergreen shrub
    native to North America, particularly thriving in wetlands and bogs. It features
    slender, wiry stems that form dense mats, with small, leathery leaves that are
    dark green in summer and turn bronze in winter. The plant produces pink to red
    flowers in late spring, which develop into bright red berries known for their
    tart flavor.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nCranberries
    prefer full sun but can tolerate partial shade. They require acidic, well-drained,
    consistently moist soils, often found in bog-like conditions. Regular watering
    is essential to maintain soil moisture.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation
    is commonly achieved through cuttings or layering. Softwood cuttings taken in
    late spring or early summer root well. Alternatively, existing stems can be pinned
    to the ground to encourage rooting at nodes.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nBerries are typically harvested in the fall, from September
    to November, when they turn a deep red color and have a firm texture. In commercial
    operations, fields are often flooded to facilitate easier collection of the floating
    berries."
  purpose: |-
    - **Edible**: The tart berries are used in sauces, juices, jellies, and dried snacks.
    - **Medicinal**: Traditionally used to prevent urinary tract infections due to their antibacterial properties.
    - **Ground Cover**: The plant's low-growing habit makes it effective for soil stabilization and erosion control.
    - **Wildlife Attractor**: Provides food for various bird species and other wildlife.
