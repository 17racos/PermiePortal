  description: "Iceberg lettuce is an annual vegetable known for its crisp, pale green
    leaves forming dense, cabbage-like heads. Each head typically measures 15-23 cm
    (6-9 inches) in diameter. Introduced in 1894, it remains popular for its mild
    flavor and crunchy texture. While not as nutrient-dense as darker leafy greens,
    it provides hydration and a satisfying crunch to salads and sandwiches. Iceberg
    lettuce thrives in cooler temperatures and may bolt or fail to form tight heads
    in warmer climates.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nPrefers
    full sun exposure but can tolerate partial shade, especially in warmer regions.
    Requires consistent moisture; soil should be kept evenly moist but not waterlogged.
    Mulching helps retain soil moisture and maintain cooler soil temperatures.\n\n✂️\U0001FAD8
    Methods to Propagate:\nPrimarily grown from seeds. Sow seeds directly into the
    garden 1/8 inch deep as soon as the soil can be worked in early spring or late
    summer for a fall crop. Thin seedlings to 30 cm (12 inches) apart to allow room
    for head development.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nHarvest
    when heads are firm and reach full size, typically 70-80 days after planting.
    Cut the head at the base with a sharp knife. For best flavor and texture, harvest
    in the morning before the day warms up."
  purpose: |-
    - **Edible**: Provides a crunchy texture and mild flavor, ideal for salads, sandwiches, and garnishes.
    - **Ground Cover**: Dense heads and tight spacing shade soil, slowing weeds and reducing splash on neighboring crops.
    - **Biomass**: Trimmings, thinnings, and post-harvest residue feed compost or worm bins, closing the loop in intensive vegetable beds.
