  description: 'Elliott''s bluestem (Andropogon gyrans) is a warm-season bunchgrass of dry woodlands, sandhills, and open
    pine savannas in the southeastern United States, named for stems that shed spikelets in a way that suggests mechanical
    drama. Clumps reach about 2–4 feet (0.6–1.2 m) with bluish summer foliage turning copper in autumn. It belongs in native
    meadow mixes, restoration blocks, and low-input ornamental plantings where little bluestem cousins need a regional teammate.


    ☀️💧 Sun and Water Requirements:

    Full sun for flowering and fall color; open canopy pine shade matches natural ecology. Well-drained, often sandy or gravelly
    soils; tolerates drought after establishment and sulks in wet clay that suffocates warm-season grass crowns. Avoid irrigation
    schedules designed for turf monocultures.


    ✂️ Propagation:

    Sow seed in warm soil after frost risk; establishment requires weed control the first season. Divide dormant crowns in
    early growth before heat; keep roots moist during transplant. Burn or mow according to local ecological guidance—some
    sites benefit from periodic renewal.


    🌾 Harvest / Best Use Timing:

    For restoration, collect seed when spikelets mature and disperse naturally if timing aligns with project goals. For gardens,
    leave standing through winter for structure and insect habitat; cut back before new spring growth. Do not overgraze young
    stands if integrating livestock—roots need recovery time.'
