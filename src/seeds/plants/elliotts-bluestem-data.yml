- Indiangrass — taller neighbor for vertical layering in savanna-inspired mixes
- Dense Blazingstar — forb spikes that flower among grasses without demanding lawn
  care
cautions:
- Wet heavy clay — winter wet rots crowns; amend drainage or choose different species
- Shrub encroachment without fire or mowing — grasses lose light in abandoned savanna
  cosplay
