description: |-
  Sweet granadilla is a vigorous passionflower vine with big, leathery fruit and clear, sweet pulp—less “pucker war” than some purple passion fruits. It wants heat and vertical real estate; in subtropical and tropical Americas treat it as a pampered perennial on a strong trellis, not a shrug-and-ignore ground cover.

  Full sun for heavy flowering; some afternoon shade acceptable in hottest months. Rich, organic, well-drained soil; consistent moisture during flowering and fruiting, less when cool.

  Seeds: clean and sow fresh in warm media; germination can be slow and variable. Cuttings: semi-hardwood cuttings under humidity in warm weather root reliably for clones.

  Fruit cracks slightly at color break and becomes fragrant—inside should be jelly-like and aromatic.
purpose: |-
  Edible: Passiflora ligularis melon-sweet pulp scoops from tennis-ball fruit once skins yellow -- crunchy seeds stay swallow-or-spit, not chew toys.
  Wildlife Attractor: Lime-green passionflowers drip nectar for carpenter bees big enough to trip sticky anthers on Andean-origin vines now grown -- across humid tropics.
  Erosion Control: Coiling stems knit cocoa-shell mulch on terrace banks -- once hog panels give vines purchase against cloudburst wash.
  Shade Provider: Broad grape-leaf canopy roofs nursery tables and goat loafing sheds after arbor posts pass engineer loads -- for seasonal fruit tonnage.
