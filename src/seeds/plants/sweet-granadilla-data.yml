  description: |-
    Sweet granadilla is a vigorous passionflower vine with big, leathery fruit and clear, sweet pulp—less “pucker war” than some purple passion fruits. It wants heat and vertical real estate; in subtropical and tropical Americas treat it as a pampered perennial on a strong trellis, not a shrug-and-ignore ground cover.

    ☀️💧 Sun and Water Requirements:
    - Full sun for heavy flowering; some afternoon shade acceptable in hottest months.
    - Rich, organic, well-drained soil; consistent moisture during flowering and fruiting, less when cool.

    ✂️ Methods to Propagate:
    - Seeds: clean and sow fresh in warm media; germination can be slow and variable.
    - Cuttings: semi-hardwood cuttings under humidity in warm weather root reliably for clones.

    🌾 Harvest notes:
    - Fruit cracks slightly at color break and becomes fragrant—inside should be jelly-like and aromatic.
