  description: "Zigzag spiderwort (Tradescantia subaspera) is a woodland perennial of eastern North America, with broader leaves than many tradescantias and stems that zigzag between nodes, bearing three-petaled blue-violet flowers opening fresh each morning. Plants reach 1–2 feet (30–60 cm), spreading into loose colonies in partial shade with steady moisture. It suits native shade borders and rain-garden shoulders where turf is a bad joke.\n\n☀️💧 Sun and Water Requirements:\nPartial shade to light sun; afternoon shade reduces petal melt in heat. Moist, humus-rich, well-drained soils suit it; tolerates short dry spells once established with mulch. Avoid stagnant water over crowns.\n\n✂️ Propagation:\nDivide clumps in spring; sow seed outdoors in fall.\n\n🌾 Harvest / Best Use Timing:\nPrimarily ornamental—flowers feed pollinators in late spring to summer. Deadhead near paths if spread is too chatty."
