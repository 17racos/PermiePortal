  description: "Mashua is an Andean nasturtium relative that climbs like it owes
    money and forms underground tubers that look like alien fingerling potatoes.
    Leaves and flowers are edible in small amounts like garden nasturtiums; tubers
    have a sharp, peppery kick that mellows with cooking. In North Florida treat
    it as a cool-season crop: grow through fall/winter/spring, lift tubers before
    deep heat or rot risk.\n\n☀️💧 Sun and Water:\n- Full sun in cool months; part
    afternoon shade when temperatures climb.\n- Even moisture, excellent drainage;
    tubers rot in soggy clay.\n\n✂️ Propagation:\n- Plant tubers after last frost
    danger (or start early under protection).\n- Save smallest tubers for seed
    stock; vines can layer where they touch soil.\n\nNot a beginner calorie staple
    — flavor is loud — but it is a conversation piece that actually yields."
  purpose: |-
    Mashua fills niche vertical-and-root niches:

    - Edible: Tubers, leaves, and flowers with peppery chemistry — respect quantities.
    - Ground Cover: Dense leaf canopy smothers weeds until frost.
    - Ornamental: Orange nasturtium blooms read decorative if you are shy about Andean carbs.
    - Wildlife Attractor: Pollinators visit flowers; you visit tubers first.
