  description: |-
    Mashua is an Andean nasturtium relative that climbs like it owes money and forms underground tubers that look like alien fingerling potatoes. Leaves and flowers are edible in small amounts like garden nasturtiums; tubers have a sharp, peppery kick that mellows with cooking. In subtropical and tropical Americas treat it as a cool-season crop: grow through fall/winter/spring, lift tubers before deep heat or rot risk.
    
    ☀️💧 Sun and Water:
    - Full sun in cool months; part afternoon shade when temperatures climb.
    - Even moisture, excellent drainage; tubers rot in soggy clay.
    
    ✂️ Propagation:
    - Plant tubers after last frost danger (or start early under protection).
    - Save smallest tubers for seed stock; vines can layer where they touch soil.
    
    Not a beginner calorie staple — flavor is loud — but it is a conversation piece that actually yields.
    
    🌾 Harvest / Best Use Timing:
    - Mashua: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
