  description: "Virginia buttonweed (Diodia virginiana) is a mat-forming perennial herb
    of moist lawns, pond margins, and low fields across the southeastern United States
    and into the Caribbean where hardy. Opposite leaves and tiny white starry flowers
    produce button-like seed clusters; stems root at nodes and spread through turf.
    It is primarily documented as a challenging lawn weed, yet in restoration contexts
    it stabilizes wet margins and feeds small pollinators.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun to light shade; densest mats where irrigation or rainfall keeps soil
    consistently moist. Tolerates brief flooding at edges; struggles on dry xeric
    berms without supplemental water. Compacted turf with frequent shallow watering
    often favors it—deeper, less frequent irrigation shifts competition.\n\n✂️ Propagation:\n
    Stem fragments and rooted nodes establish new patches; cultivation spreads it
    unless tools are cleaned. For containment in turf, raise mower height, reduce
    compaction, and improve drainage. Seed also germinates in warm wet soils.\n\n
    🌾 Harvest / Best Use Timing:\nNot a food crop. If managing in restoration plugs,
    transplant during cool wet weather and expect rapid spread. For lawn conversion
    projects, solarize or smother patches before seed drop in late season."
