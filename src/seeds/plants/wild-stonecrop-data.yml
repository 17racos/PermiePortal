  description: "Wild stonecrop (Sedum ternatum) is the same species listed as Virginia stonecrop in this database—a native eastern North American succulent groundcover for shade and partial sun, with whorled leaves and white starry flowers in late spring. Mats spread along rocks and logs, tolerating dry shade once established. Duplicate entries exist only to catch different common-name searches.\n\n☀️💧 Sun and Water Requirements:\nPartial shade to light sun; hot afternoon sun scorches leaves. Well-drained, humus-rich soils suit it; avoid wet clay stagnation.\n\n✂️ Propagation:\nDivide mats in spring; soft cuttings root easily.\n\n🌾 Harvest / Best Use Timing:\nOrnamental and ecological—peak bloom follows late-spring warmth."
