  description: "Italian oregano (*Origanum x majoricum*) is a perennial herb that
    combines the robust flavors of oregano and marjoram. It typically grows up to
    60 cm (24 inches) tall, featuring aromatic, oval-shaped green leaves and small
    white to pink flowers that bloom in summer. This herb thrives in full sun to partial
    shade and prefers well-drained soil. It's drought-tolerant once established and
    can spread to form a lush ground cover.\n\n\U0001F31E\U0001F4A7 Sun and Water
    Requirements:\n- **Sun:** Full sun to partial shade\n- **Water:** Moderate; allow
    soil to dry out between waterings\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Cuttings:**
    Take 10 cm (4-inch) stem cuttings in spring or early summer and root them in moist
    soil.\n- **Division:** Divide established plants in spring, ensuring each section
    has roots attached.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Harvest leaves as needed once the plant reaches 15 cm (6 inches) in height.\n-
    For optimal flavor, harvest just before the plant flowers.\n- Regular harvesting
    encourages bushier growth."
