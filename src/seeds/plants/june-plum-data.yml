  description: "June plum (Spondias dulcis), widely called ambarella in Caribbean markets, is the same species many lists share with golden apple: a fast tropical tree with pinnate leaves and oval green-yellow fruit eaten crisp when green and juicier when ripe. Heights of 25–50 feet (7.5–15 m) are common. This entry highlights its role in humid subtropical and tropical home orchards where dual-purpose fruit (savory when young, sweeter when mature) stretches kitchen seasons.\n\n☀️💧 Sun and Water Requirements:\nFull sun for reliable fruiting; partial shade only for juvenile establishment. Deep, fertile, well-drained soils with irrigation in dry seasons; mulch conserves moisture at the surface. Windbreaks help in exposed coastal lots.\n\n✂️ Propagation:\nSow fresh seed; graft selections for predictable quality. Prune for low scaffold branches if harvest-by-ladder is not your aesthetic. Remove inward-crossing wood after harvest waves.\n\n🌾 Harvest / Best Use Timing:\nPick green for crunchy salads and pickles; allow yellowing for sweeter fresh eating. Process windfalls quickly to reduce fruit fly festivals. Expect seasonal flushes tied to rainfall and heat."
  purpose: |-
    - Edible: Green and ripe stages diversify kitchen use without planting separate crops.
    - Shade Provider: Spreading crown shelters understory herbs and young fruit trees.
    - Wildlife Attractor: Flowers and fruit engage birds and insects where sharing is intentional.
    - Windbreaker: Flexible branches blunt steady coastal winds on exposed sites.
