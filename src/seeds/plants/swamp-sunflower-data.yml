  description: 'Swamp sunflower (Helianthus angustifolius) is a robust herbaceous perennial sunflower of wet prairies, roadside
    ditches, and freshwater marshes from the eastern United States through Texas. Plants spread by rhizomes into tall golden
    walls 4–6 feet (1.2–1.8 m) in bloom, with narrow leaves and many small sunflower heads. Late-season nectar supports migrating
    pollinators when goldenrod companions peak.


    ☀️💧 Sun and Water Requirements:

    Full sun for maximum bloom density; tolerates bright part sun with fewer flowers. Thrives in moist to wet soils; also
    handles average garden beds if watered during drought. Rhizomes wander—plan barriers if you need geometric obedience.


    ✂️ Propagation:

    Divide rhizomatous clumps in late winter before new growth; replant chunks with buds. Sow seed after last frost; keep
    trays moist. Cut back dead stems in late winter to leave standing habitat, or mow after seed drop if expansion must be
    checked.


    🌾 Harvest / Best Use Timing:

    Cut flowers for bouquets at first color; stems are tall—stake in windy sites. Seeds are small but feed finches if heads
    remain; chop biomass for mulch after frost kills foliage.'
  purpose: |-
