  description: 'Wild leek—ramps—is the Appalachian spring onion that launched a thousand overharvest threads. Broad smooth
    leaves, burgundy stems, pungent bulbs, and a life cycle that wants rich woodland soil and patience.


    Outside eastern deciduous forest range, trial only in cool shaded moist pockets with ethical sourcing.

    Do not cosplay as a forager in public parks—grow your own patch or buy from growers who propagate.


    ☀️💧 Sun and Water Requirements:


    Dappled shade to part sun; rich, moist, well-drained humus.

    Summer dormancy—respect the disappearing act.


    ✂️ Propagation:


    Seed (slow), division of offsets from cultivated patches, or transplant nursery-grown bulbs ethically sourced.


    🌾 Harvest / Best Use Timing:


    Take only sustainable cuts of leaves and bulbs from cultivated patches; let some plants flower for pollinators.'
