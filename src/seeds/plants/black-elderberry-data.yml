  description: "Black elderberry (Sambucus nigra) is a fast-growing deciduous shrub
    to small tree from Europe and western Asia, widely cultivated for flower cordials,
    berries used cooked in syrups and wines, and coarse wood for stakes. Pinnate leaves
    and flat white cymes appear in early summer; ripe black berries hang in heavy clusters
    on purple-black stems in forms like 'Haschberg'. Mature plants often reach 8–15
    feet (2.5–4.5 m) depending on pruning. In cool-temperate food systems it is a high-yield
    shrub wall for processing—not a raw-snack berry without proper preparation knowledge.\n\n
    ☀️💧 Sun and Water Requirements:\nFull sun to light partial shade; more sun increases
    bloom and berry load. Prefers rich, moist, well-drained soil with steady organic
    matter; tolerates heavier soils better than droughty sand without irrigation. Mulch
    preserves soil moisture during fruit swell; avoid root drowning in compacted low
    spots.\n\n✂️ Propagation:\nHardwood cuttings taken in late winter root readily
    under mist or in deep pots outdoors. Sow seed after stratification for diversity
    trials; named cultivars are cloned. Hard-prune old wood in dormancy to renew fruiting
    shoots and keep height manageable.\n\n🌾 Harvest / Best Use Timing:\nPick flower
    umbels when most buds are open but before heavy browning. Harvest berries when clusters
    turn glossy black and stems begin to bend—cook before consumption following trusted
    food-safety guidance for your region."
  purpose: |-
    - Edible: Flowers and fully ripe cooked berries support cordials, jams, and syrups with documented prep.
    - Medicinal: Traditional European herbal uses focus on flowers and berries where law and training allow.
    - Wildlife Attractor: Flowers feed insects; berries feed birds—balance harvest share with ecology.
    - Border Plant: Fast screens and informal hedges for wind and sight breaks on larger lots.
    - Mulcher: Leaf litter builds humus quickly under dense plantings.
  companions:
