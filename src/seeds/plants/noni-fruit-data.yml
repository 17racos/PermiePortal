  description: "Noni fruit is the market name for Morinda citrifolia, a tropical Rubiaceous tree or large shrub bearing compound-appearing opposite leaves and distinctive bumpy syncarps that ripen to soft, translucent yellow-white with a bold aroma. Typical garden specimens reach 10–18 feet (3–5.5 m) and fruit repeatedly where nights stay warm and days bring heat. The plant belongs in permaculture conversations about resilient biomass, pollinator support, and culturally specific food-medicine—not in the same sentence as mild table grapes.\n\n☀️💧 Sun and Water Requirements:\nFull sun drives heaviest flowering and fruit set; partial shade works for young plants during establishment. Deep watering through dry seasons increases fruit size; good drainage prevents root decline in prolonged wet weather. Mulch to keep surface roots cool; avoid stagnant water over the root crown.\n\n✂️ Propagation:\nStart from fresh seed or vegetative clones of known performers. Air-layer high-yielding limbs to avoid seedling roulette. Head back overly dense centers after harvest flushes to improve light penetration and reduce fungal lodging.\n\n🌾 Harvest / Best Use Timing:\nPick when fruit softens and skin thins—texture beats color alone. Process quickly into juice, ferments, or dried products per vetted recipes. Leaf harvest can continue year-round in tropical climates; stagger picks to avoid stripping single branches bare."
  purpose: |-
    - Edible: Ripe fruit and controlled ferments anchor Pacific and Asian traditions where flavor education comes with the territory.
    - Medicinal: Leaf and fruit preparations appear in herbal systems—respect contraindications and local regulatory reality.
    - Wildlife Attractor: Night visitors including bats and moths interact with flowers and fruit; design access accordingly.
    - Dynamic Accumulator: Fast leaf turnover and deep roots pull minerals into biomass that returns as mulch or compost feedstock.
