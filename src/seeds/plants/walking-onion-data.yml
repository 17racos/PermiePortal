  description: "Walking onion (Allium × proliferum) is a perennial bunching onion
    that forms bulbils on tall stalks; when heavy, the stalks arch, plantlets touch
    soil, and the patch “walks” outward—hence the drama. Underground bulbs divide
    like shallots while topsets give you instant clones. In subtropical and tropical Americas
    it grows through cool season peaks and may slow in deep summer heat; treat it
    like a hardy perennial allium that still appreciates drainage during wet season.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for best bulb and topset size.\n- Moderate
    water; excellent drainage—onions sulk in puddles.\n- Mulch lightly to moderate
    soil temperature but keep necks dry.\n\n✂️ Methods to Propagate:\n- Plant topsets
    in moist soil 2–3 cm deep when they separate easily; roots form in weeks during
    mild weather.\n- Split parent clumps in fall or early spring, replanting offsets
    immediately.\n- Save the largest underground bulbs for kitchen; replant smaller
    divisions for propagation stock.\n\n🌾 Harvest / Best Use Timing:\n- Snip green
    onion tops anytime; harvest underground bulbs when tops begin to yellow and flop.\n-
    Gather topsets when firm and well-colored before they sprout on the stalk if
    you want clean planting stock."
  purpose: |-
    Walking onion is a self-distributing allium for lazy resilience:

    - Edible: Greens, bulbs, and young topsets all read onion-garlic in the kitchen.
    - Pest Management: Allium chemistry can confuse or repel some chewing pests near vulnerable crops—use as a buffer, not a miracle shield.
    - Border Plant: Upright clumps edge beds with a utilitarian look honest about their purpose.
    - Biomass: Trim spent foliage into compost to recycle sulfur notes without waste.
