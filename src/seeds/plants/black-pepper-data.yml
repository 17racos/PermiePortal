  description: |-
    Black pepper (Piper nigrum) is a tropical forest vine that climbs rough bark or trellis supports with adventitious roots, producing long, alternate, glossy leaves and slender pendulous spikes of tiny flowers that ripen into dense clusters of green then red berries. Mature vines can cover several meters vertically in humid subtropical to tropical climates and are the source of black, white, and green peppercorn products depending on harvest timing and processing.

    It fits humid food forests and spice understories from lowland tropics into lower montane sites where nights stay warm. Plants need dappled shade or short morning sun, constant humidity, and rich organic soil that never dries completely yet drains after heavy rain.

    Propagate from nodal cuttings taken during the wet season, rooting in warm shade under mist or high humidity. Layer low stems onto moist mulch to start new plants along the base of supports.

    Harvest spikes when a few berries turn red, then thresh, wash, and dry for black pepper, or process per traditional methods for white pepper. Expect several years from establishment to heavy yields.
  purpose: |-
    Edible: Immature green and fully ripened berries supply the global peppercorn trade -- piperine heat layers with citrus-pine aromatics from volatile oils in the pericarp.
    Medicinal: Black pepper appears in Ayurvedic and Chinese formulas to enhance bioavailability of other botanicals -- piperine is the studied enhancer; respect drug interactions.
    Ornamental: Glossy cordate leaves and pendant fruiting spikes suit humid conservatory or outdoor trellis displays -- reads as lush green architecture where frost never visits.
    Shade Provider: Leafy vines shade shorter spice crops like ginger and turmeric -- creates a humid microclimate at ground level without building plastic.
    Pollinator: Tiny flowers on long spikes feed small flies and bees in the forest understory -- flowering is subtle but steady when moisture and fertility stay even.
