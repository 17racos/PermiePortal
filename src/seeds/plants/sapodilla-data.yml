common_name: Sapodilla
picture: sapodilla.webp
scientific_name: Manilkara zapota
aka:
  - Nispero
  - Chico sapote
family: Sapotaceae
zone: 10-12
ideal_temp_min: 65
ideal_temp_max: 95
min_temp: 28
max_temp: 110
perennial: true
layers:
  - Tree
plant_function:
  - Edible
  - Shade Provider
  - Wildlife Attractor
description: |-
  Sapodilla is the brown-sugar fruit that looks like a potato and tastes like dessert cheating. Evergreen tree, milky latex historically used for chicle, and a serious heat requirement. subtropical and tropical Americas is marginal — young trees need frost protection; mature specimens tolerate brief chills better but are not hobby orchard material without microclimate lies you can live with.

  Full sun for fruiting. Deep, regular watering in establishment; somewhat drought-tolerant later. Well-drained soil; hates standing water on roots.

  Grafting selected cultivars onto seedling rootstocks. Seeds grow but fruit quality varies wildly.

  Pick when brown, slightly soft, and fragrant — unripe astringency is a memorable mistake. Sap can irritate skin; handle like an adult.
purpose: |-
  Edible: Manilkara zapota fruits shift from astringent to brown-sugar sweet only after full ripeness and a few days of counter rest -- latex from the peel can irritate skin during messy peeling sessions.
  Shade Provider: Evergreen glossy foliage builds a wide dome that shelters cacao, understory vanilla vines, -- and orchard workers in humid lowland plantings.
  Wildlife Attractor: Bats, birds, and fruit flies find fallen ripe sapodillas fast when drops hit leaf litter under unmanaged backyard trees.
companions:
  - Banana
  - Papaya
  - Cacao
cautions:
  - Exposed frost sinks and poorly drained lawns
pests:
  - Caribbean Fruit Fly
  - Scale Insects
  - Mealybugs
human_uses:
  - Timber
