  description: "Sand grape (Vitis rupestris) is a North American wild grape of river
    gravels, sandy banks, and rocky prairies, famous for deep roots and small thick
    leaves. Berries are blue-black and seedy but useful for jelly; the species is
    a historic rootstock for drought and nematode pressure. It suits stabilizing
    hot slopes and living fences where pampered table grapes melt.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun; partial shade reduces fruit and encourages
    mildew in humid air.\n- Drought tolerant once established; young vines need steady
    moisture to root deeply.\n- Sandy, gravelly, or rocky well-drained soils; tolerates
    alkaline river cobble.\n\n✂️ Propagation:\n- Hardwood cuttings root readily in
    late winter.\n- Layering canes in spring on loose soil.\n- Seeds stratify; use
    when breeding, not when hungry this decade.\n\n🌾 Harvest / Best Use Timing:\n-
    Pick berries at full color for small-batch jelly; yield is modest, labor honest.\n-
    Prune in dormancy to keep vines off young trees you value.\n- Leave some clusters
    for birds along migration corridors."
