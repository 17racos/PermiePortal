  description: |-
    Air potato is the poster yam for “just because it is edible somewhere does not mean you should unleash it.” In Florida it is a regulated invasive that smothers canopy; the aerial bulbils travel like gossip. This entry is documentation, not encouragement.

    subtropical and tropical Americas / subtropical: Already a known ecosystem problem in parts of the state. If you are researching control, assume any bulbil you drop is a lawsuit against the forest.

    Sun and water: Rampant in sun to partial shade with summer moisture; tolerates seasonal dry-down once established—that is part of why it wins.

    Propagation: Unfortunately extremely easy from bulbils and tubers—which is exactly why land managers lose sleep. Do not propagate for permaculture cosplay where it is illegal or unethical.
  purpose: |-
    In its native range, starchy food from tubers and some forms of bulbils with proper processing knowledge. In invaded landscapes: prioritize reporting, mechanical removal, and site-appropriate control per local guidance—not backyard cultivation.
  companions:
  - None recommended in invasion zones
  cautions:
  - Planting where prohibited or ecologically reckless
  - Confusing it with benign ornamental vines
  pests:
