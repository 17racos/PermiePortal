  description: |-
    Winter squash (Cucurbita maxima) is a warm-season vine grown for its thick-rinded, storage-friendly fruits harvested at full maturity. It is native to the Americas and now thrives across temperate-to-subtropical gardens where warm seasons are long enough. Plants sprawl with large leaves and tendrils and typically reach a few meters in spread depending on spacing and training. In permaculture, winter squash matters because it produces serious off-season calories and its dense canopy shades soil, moderates evaporation, and reduces weed pressure while you wait for longer crop cycles to finish.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for strong vine growth and fruit maturation.
    - Water consistently as vines establish and fruits size up; drought reduces fruit quality.
    - Prefers fertile, well-drained soil amended with compost.
    - Avoid waterlogged soil to reduce vine/fruit rot.
    
    ✂️ Propagation:
    - Seeds (direct sow): sow after soil warms and frost risk passes; germination often occurs in 5–10 days.
    - Start indoors: transplant carefully when seedlings are sturdy if your season is short.
    - Relay sow: plant in small batches to spread harvest risk.
    
    🌾 Harvest / Best Use Timing:
    - Harvest when rind is hard and stems are dry/corky; then cure in warm, dry airflow.
    - Store in a cool, dry place for months.
    - Use flesh for roasting, soups, pies, and freezing.
