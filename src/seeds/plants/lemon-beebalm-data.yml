  description: "Lemon beebalm (Monarda citriodora) is an aromatic mint-family annual or short-lived perennial of central North American prairies and roadsides, bearing stacked whorls of pink to lavender tubular flowers with citrus-scented foliage. Height is commonly 2–3 feet (0.6–1 m). It excels in pollinator strips, herb gardens, and meadow edges where soil drains between rains and airflow exists to temper mildew’s ego.\n\n☀️💧 Sun and Water Requirements:\nFull sun for strongest bloom; afternoon shade helps in hottest deserts if humidity exists. Average to lean, well-drained soils; tolerates drought better than swamp monardas. Avoid soggy clay that rots crowns while you blame the cultivar.\n\n✂️ Propagation:\nSow seed outdoors after frost risk; readily self-sows where happy. Divide short-lived clumps in cool weather if crowns expand. Cut back after bloom to refresh basal growth where mildew visited.\n\n🌾 Harvest / Best Use Timing:\nPick young leaves for tea before flowering for brightest lemon note; leave plenty for pollinators. Collect seed when heads brown if you want controlled replanting. Deadhead if volunteers offend your symmetry."
  purpose: |-
    - Edible: Aromatic leaves flavor teas and syrups when harvested clean and identified correctly.
    - Medicinal: Traditional soothing tea uses mirror other Monarda—context and dosage still matter.
    - Pollinator: Tubular flowers attract bees, butterflies, and hummingbirds in warm months.
    - Ornamental: Vertical whorls add mint-family drama without turf’s thirsty obedience.
  companions:
