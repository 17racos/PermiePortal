  description: 'Swamp rose (Rosa palustris) is a native wetland rose of eastern North America, forming arching canes with
    pink fragrant flowers in summer and red hips that persist for birds. Plants reach 4–7 feet (1.2–2.1 m), rooting where
    soils stay moist to wet. It stabilizes pond margins, rain-garden backs, and any sunny wet edge tired of invasive pretenders.


    ☀️💧 Sun and Water Requirements:

    Full sun to light shade; best flowering with strong light. Moist to wet, acidic to neutral soils suit it; tolerates seasonal
    inundation better than dry-site roses. Mulch with organic matter; avoid drought baking on sandy banks without irrigation.


    ✂️ Propagation:

    Hardwood cuttings in dormancy; stratified seed for diversity. Remove old canes after several years to renew flowering
    wood.


    🌾 Harvest / Best Use Timing:

    Hips for tea and jelly when fully colored—verify spray history. Peak bloom tracks mid-summer warmth. Leave fruit for birds
    if sharing matters.'
