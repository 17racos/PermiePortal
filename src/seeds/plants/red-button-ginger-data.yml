  description: "Red Button Ginger (*Costus woodsonii*) is a tropical, evergreen perennial
    native to Central and South America. It is renowned for its vibrant red, cone-shaped
    inflorescences from which yellow-orange flowers emerge sequentially, providing
    year-round visual interest. The plant typically grows to a height of 1–2 meters
    (3–6 feet) with lush, dark green, spirally arranged leaves.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefers partial shade to bright indirect light;
    avoid strong, direct sunlight to prevent leaf burn.\n- Thrives in consistently
    moist, well-drained soils rich in organic matter.\n- Requires regular watering
    to maintain soil moisture but should not be waterlogged.\n\n✂️\U0001FAD8 Methods
    to Propagate:\n- **Division:** The most common method; divide rhizomes during
    the growing season ensuring each section has viable shoots.\n- **Stem Cuttings:**
    Take 10–15 cm (4–6 inches) stem cuttings with at least one node; root in moist,
    well-draining medium.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Harvest young shoots and flowers as needed throughout the year for culinary or
    medicinal use."
  purpose: |-
    Red Button Ginger serves multiple functions in a permaculture system:

    - **Edible:** Young shoots and flowers are consumed in various culinary dishes.
    - **Medicinal:** Traditionally used to treat ailments such as coughs, colds, and fever.
    - **Wildlife Attractor:** Produces extrafloral nectar that attracts ants, which can deter herbivores; also attracts bees and hummingbirds.
    - **Erosion Control:** Robust root system helps stabilize soil, reducing erosion.
    - **Border Plant:** Used decoratively in garden borders for its aesthetic appeal.
    - **Ground Cover:** Dense foliage provides effective ground coverage, suppressing weed growth.
