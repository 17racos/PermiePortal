  description: 'Pear hawthorn (Crataegus calpodendron) is a North American hawthorn of woodland openings, recognized for larger,
    pear-shaped yellow to bronzy fruit and the usual white spring flower clusters of the genus. It grows as a large shrub
    or small tree roughly 15–25 feet (4.5–7.5 m), with thorny architecture that rewards honest pruning plans. In hedgerow
    design it extends the hawthorn toolkit for bird food and early nectar beyond tiny pome species.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best fruiting with strong light. Moist, well-drained loam mimics woodland edge; tolerates seasonal
    dryness once established with mulch. Avoid compacted swales that stay soggy through warm weather.


    ✂️ Propagation:

    Stratify seed 90–120 days cold-moist before spring sowing. Graft or bud known selections if you find superior fruit. Prune
    for an open vase shape to reduce leaf wetness duration after rains.


    🌾 Harvest / Best Use Timing:

    Collect fruit when color shifts fully and flesh yields slightly—haw pomes vary in astringency. Process into jellies or
    experimental ferments; do not expect pear-crisp texture despite the common name. Leave some fruit for wildlife queues.'
