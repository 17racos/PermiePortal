  description: |-
    Pawpaw is North America’s native annonaceous fruit — custardy, tropical-candy flavor from a tree that laughs at eastern winters. Clonal thickets are normal; fruit set improves with genetic diversity, so plant at least two unrelated seedlings or grafted cultivars. subtropical and tropical Americas: thrives in rich bottomlands and part shade; protect young trees from full blasting sun and from deer that browse leaves.
    
    ☀️💧 Sun and Water:
    - Young trees: part shade; mature tolerate more sun with deep mulch and moisture.
    - Likes steady moisture and deep organic soil; tolerates wet feet better than drought.
    
    ✂️ Propagation:
    - Seeds: keep moist — they do not tolerate desiccation; long taproot, transplant carefully.
    - Grafting named varieties for quality.
    
    Zebra swallowtail caterpillars eat leaves — that is a feature, not a crisis.
    
    🌾 Harvest / Best Use Timing:
    - Pawpaw: pick when full color, slight give, and aroma align -- early picks often ripen off-tree in a 65-72°F (18-22°C) room.
    - Taste-test one fruit per tree sector; sun-exposed shoulders ripen faster than shaded interiors.
    - Process windfalls within hours for jam or pulp; leaving them invites fruit fly internships.
  purpose: |-
    Native fruit that embarrasses grocery melons:

    - Edible: Ripe fruit fresh or frozen; seeds are not snacks.
    - Wildlife Attractor: Flowers and fruit feed insects and mammals; host for zebra swallowtail.
    - Shade Provider: Small tree canopy for understory guilds.
    - Mulcher: Large leaves chop-and-drop like green plates.
