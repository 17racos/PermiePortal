  description: "Elecampane (*Inula helenium*) is a robust perennial herb from Eurasia,
    naturalized in parts of North America, with large basal leaves and towering yellow
    daisy flowers on stems that can exceed 6 feet. Roots are thick, aromatic, and
    long used in herbal traditions. In subtropical and tropical Americas it is a specialty plant
    for morning sun, rich soil, and steady moisture—expect shorter stature and possible
    mildew if air circulation is poor in the wet season.\n\n\U0001F31E\U0001F4A7 **Sun
    and Water Requirements:**\nFull sun to bright partial shade. Keep soil evenly
    moist but not boggy; a deep organic mulch buffers heat. Afternoon shade helps
    in lowland tropical humidity.\n\n✂️ **Methods to Propagate:**\n- **Root divisions:**
    Split crowns in early spring or fall; replant pieces with buds facing up.\n- **Seeds:**
    Sow fresh seed on the surface, press in, and keep warm and humid; transplant
    when true leaves appear.\n\n\U0001F9D1‍\U0001F33E **When to Harvest:**\nDig
    roots in fall of the second or third year after growth slows; wash, slice, and
    dry with good airflow. Flowers can be collected at full yellow disk stage for
    tinctures or drying if desired."
  purpose: |-
    - **Medicinal:** Bitter root is traditionally prepared as tea or tincture for respiratory support; verify dosage with qualified guidance.
    - **Pollinator:** Large composite heads attract bees, beetles, and butterflies during mid to late season.
    - **Wildlife Attractor:** Seeds feed finches and other birds if heads are left standing.
    - **Dynamic Accumulator:** Deep taproot pulls minerals that return to topsoil when leaves and stalks are chopped and dropped.
    - **Biomass:** Tall stems and leaves add bulk to compost and mulch systems in temperate-style herb gardens.
