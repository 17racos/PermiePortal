  description: 'Elecampane (*Inula helenium*) is a robust perennial herb from Eurasia, naturalized in parts of North America,
    with large basal leaves and towering yellow daisy flowers on stems that can exceed 6 feet. Roots are thick, aromatic,
    and long used in herbal traditions. In subtropical and tropical Americas it is a specialty plant for morning sun, rich
    soil, and steady moisture—expect shorter stature and possible mildew if air circulation is poor in the wet season.


    🌞💧 **Sun and Water Requirements:**

    Full sun to bright partial shade. Keep soil evenly moist but not boggy; a deep organic mulch buffers heat. Afternoon shade
    helps in lowland tropical humidity.


    ✂️ **Methods to Propagate:**

    - **Root divisions:** Split crowns in early spring or fall; replant pieces with buds facing up.

    - **Seeds:** Sow fresh seed on the surface, press in, and keep warm and humid; transplant when true leaves appear.


    🧑‍🌾 **When to Harvest:**

    Dig roots in fall of the second or third year after growth slows; wash, slice, and dry with good airflow. Flowers can
    be collected at full yellow disk stage for tinctures or drying if desired.'
