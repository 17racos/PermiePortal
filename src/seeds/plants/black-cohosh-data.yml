  description: "Black cohosh (Actaea racemosa) is a long-lived herbaceous perennial
    of cool eastern North American woodlands, sending up bold compound leaves and tall
    wands of creamy white flowers in midsummer that can reach 4–7 feet (1.2–2.1 m).
    The inflorescences are strongly scented, attractive to pollinating flies and beetles,
    and persist as architectural spikes. Roots and rhizomes have a long documented place
    in herbal practice—modern use should respect potency, contraindications, and sustainable
    harvest ethics.\n\n☀️💧 Sun and Water Requirements:\nPartial to full shade; tolerates
    dappled morning sun in northern climates but scorches in hot afternoon exposure.
    Rich, moist, well-drained soil high in organic matter mimics forest edge sites;
    drought causes collapse of tall flowering stems. Mulch with leaf mold to keep roots
    cool.\n\n✂️ Propagation:\nSow seed after warm-cold stratification cycles; germination
    can be slow and irregular. Divide mature crowns in early spring before growth or
    in fall, keeping each division well rooted. Patience is required—plants resent
    frequent disturbance.\n\n🌾 Harvest / Best Use Timing:\nFor medicine, dig rhizomes
    in fall after several years of establishment from cultivated patches only—never
    deplete wild stands. Dry slices with airflow before storage. For garden use, leave
    flowers for pollinators and collect seed when follicles split if breeding."
  purpose: |-
