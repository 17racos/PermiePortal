  description: "Marigold (Tagetes spp.) is a hardy, fast-growing flowering plant known
    for its bright yellow, orange, and red blossoms. It is commonly used in gardens
    for pest control and soil improvement. Marigolds are easy to grow, requiring minimal
    maintenance, and they bloom profusely throughout the growing season.\n\nThe plant
    is particularly valued in companion planting, as it helps repel nematodes, aphids,
    and other garden pests. It thrives in garden beds, borders, and containers, adding
    vibrant color while also benefiting the surrounding plants.\n\n \U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefers full sun but can tolerate partial shade.\n-
    Requires well-drained soil; thrives in loamy or sandy soil.\n- Moderate watering
    needs; avoid overwatering to prevent root rot.\n\n✂️\U0001FAD8 Methods to Propagate:\n-
    Seeds: Easily grown from seeds; sow directly in soil after the last frost.\n-
    Transplants: Can be started indoors and transplanted once seedlings are established.\n-
    Cuttings: Some varieties can be propagated from cuttings.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Flowers can be harvested once fully bloomed for medicinal
    or ornamental uses.\n- Regular deadheading promotes continuous blooming.\n- Collect
    seeds from dried flower heads at the end of the growing season for future planting."
  purpose: |-
    Marigold serves multiple functions in a permaculture system:

    - Edible: Certain species like Tagetes lucida are used as culinary herbs.
    - Medicinal: Known for antibacterial and antifungal properties; used in traditional medicine.
    - Pollinator: Attracts bees, butterflies, and other beneficial insects.
    - Wildlife Attractor: Provides nectar for pollinators.
    - Pest Management: Repels nematodes, aphids, whiteflies, and other garden pests.
