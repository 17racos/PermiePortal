  description: |-
    Feijoa is the shrub that eats like dessert and still pretends to be landscape-tough. Flowers are edible marshmallow weirdos; fruit is pineapple-guava jam waiting to happen if you have two compatible varieties or a neighbor who does. subtropical and tropical Americas can grow it well in 8b+ with wind protection; young wood can burn in hard freezes — plan site, mulch, and realistic expectations.

    ☀️💧 Sun and Water Requirements:
    - Full sun for heaviest fruit; light afternoon shade reduces leaf scorch in hottest sites.
    - Well-drained loam; tolerates some drought when established but fruits better with even moisture.
    - Avoid standing water; roots rot quietly while you blame the cultivar.

    ✂️ Methods to Propagate:
    - Cuttings: semi-hardwood in late summer under mist or humidity dome.
    - Grafting: named varieties often grafted for reliable fruit quality.
    - Seeds: variable offspring; fun for breeding, not for instant clones.
  purpose: |-
    Feijoa is a dual-purpose myrtle for subtropical edges:

    - Edible: Flowers, fruit pulp, and limited culinary uses where flavor matches your palate.
    - Ornamental: Evergreen leaves with silvery undersides photograph well even when fruit fails.
    - Windbreaker: Hedge-trained plants buffer smaller guild members.
    - Wildlife Attractor: Flowers draw pollinators; fallen fruit feeds whoever shows up first.
