    \ Attractor: Flowers are pollinated by birds (petals attract them) and bees;\n  fallen fruit feeds ground-feeding birds\
    \ and small mammals.\n- Pollinator: Unusual bird-pollinated flowers — honeyeaters and similar species are\n  primary pollinators\
    \ in native range; bees also work the flowers effectively."
