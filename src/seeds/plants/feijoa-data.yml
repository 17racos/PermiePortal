  description: 'Feijoa (Acca sellowiana) is an evergreen shrub or small tree in the myrtle family, native to highland subtropical
    South America — southern Brazil, Uruguay, Paraguay, and northern Argentina. It typically reaches 10–15 feet (3–4.5m) as
    a shrub, taller when trained as a tree. Leaves are oval, leathery, and distinctively silver-felted on the undersides.
    Flowers are showy with thick white petals and a burst of red stamens — both flowers and fruit are edible. Fruit is oval,
    green-skinned with cream jelly-like pulp that tastes like pineapple crossed with guava and mint. Hardy to around 12°F
    (-11°C) when established; young wood more vulnerable.


    ☀️💧 Sun and Water Requirements:

    - Full sun produces heaviest fruit; afternoon shade reduces scorch in hottest climates.

    - Well-drained loam preferred; drought-tolerant once established but fruits better with consistent moisture.

    - Avoid standing water — roots rot in poorly drained soil.

    - Wind protection improves fruit set in exposed sites.


    ✂️ Methods to Propagate:

    - Cuttings: semi-hardwood in late summer under humidity dome; rooting takes 6–8 weeks.

    - Grafting: named varieties grafted for reliable fruit quality and self-fertility.

    - Seeds: germinates readily but offspring are variable — useful for breeding, not for cloning a known cultivar.


    🌾 Harvest / Best Use Timing:

    - Fruit ripens fall through early winter depending on variety and location.

    - Ripe fruit falls from the tree — collect from the ground daily during peak drop.

    - Shelf life is extremely short — 2–3 days at room temperature, up to a week refrigerated.

    - Eat fresh by slicing equatorially and scooping pulp; skin is edible but tannic.

    - Process surplus immediately into jam, chutney, wine, or freeze pulp for later use.'
  purpose: "- Edible: Fruit pulp, flowers (petals), and young leaves are all edible with distinctive\n  pineapple-mint-guava\
