  description: |-
    Wild ginger is the low heart-leaved groundcover of eastern woodlands—flowers hidden at soil level for ants and curiosity, not Instagram. Not culinary ginger; different family, different rules.

    Only in cool pockets and northward; heat and long humid summers are not its personality—try native Hexastylis species farther south if you want ginger-ish leaves.

    Sun and water: Full to partial shade; rich, moist, humusy soil that never bakes. Mimics forest floor, not parking median.
    ✂️ Propagation:
    Rhizome division when dormant; fresh seed sown immediately; slow spread—patience is currency.
  purpose: |-
