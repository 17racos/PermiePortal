  description: "Celtuce (Lactuca sativa var. asparagina), also known as Stem Lettuce, Celery Lettuce, Asparagus Lettuce, or\
    \ Chinese Lettuce, is a unique lettuce cultivar grown primarily for its thick, crunchy stem. Originating from the Mediterranean\
    \ region and popularized in China, celtuce combines the characteristics of lettuce and celery, offering both edible leaves\
    \ and stems.\n\nThe plant begins by producing elongated, light-green leaves that can be harvested early for salads. As\
    \ it matures, the central stem thickens, reaching about 15–20 cm (6–8 inches) in length and 3–4 cm (1–1.5 inches) in diameter.\
    \ This stem is crisp with a mild, nutty flavor, making it versatile for various culinary applications. Celtuce is a cool-season\
    \ crop, best grown in spring or fall to avoid bolting, which can occur in high temperatures.\n\n \U0001F31E\U0001F4A7\
    \ Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade, especially in warmer climates.\n- Thrives\
    \ in well-drained, fertile soil with consistent moisture.\n- Regular watering is essential to maintain stem tenderness\
    \ and prevent bolting.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Seeds**: Sow seeds directly into the soil or start indoors\
    \ 4–6 weeks before the last frost. Transplant seedlings when they have 3–4 true leaves.\n- **Spacing**: Plant seeds or\
    \ transplants 20–30 cm (8–12 inches) apart in rows spaced 30–40 cm (12–16 inches) apart.\n\n\U0001F9D1‍\U0001F33E\U0001F469\
    ‍\U0001F33E When to Harvest:\n- **Leaves**: Harvest young leaves approximately 4–5 weeks after planting for use in salads.\n\
    - **Stems**: Harvest when stems reach about 15–20 cm (6–8 inches) in length and 3–4 cm (1–1.5 inches) in diameter, typically\
    \ 70–90 days after planting. Peel the fibrous outer layer before consumption."
  purpose: 'Celtuce serves multiple functions in a permaculture system:


    - **Edible**: Provides nutritious leaves and stems suitable for raw or cooked dishes; peel mature stems before stir-frying
    away the fibrous jacket.

    - **Ground Cover**: Dense rosettes shade soil between rows in cool-season Florida beds and block weeds until the stem
    starts to bolt.

    - **Biomass**: Spent leaves and bolted tops chop into compost, returning organic matter when the cool window closes and
    heat pushes the crop to flower.'
