    Border Plant: Redcurrant tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
  companions:
  - Comfrey (Symphytum officinale) — chopped comfrey supports soil fertility and pairs with clonal pruning cycles.
  - Garlic (Allium sativum) — strong scent helps confuse some pest travel paths around berry shrubs.
  - Lettuce (Lactuca sativa) — cool-season understory fits the partially shaded root zone and shares manageable watering.
  cautions:
