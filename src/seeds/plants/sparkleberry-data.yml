  description: "Sparkleberry (*Vaccinium arboreum*) is a southeastern native that
    can grow shrubby or downright tree-like, with flaky bark and small dark berries
    that read ‘bird food’ more than ‘pie filling’ for most humans — tart, seedy,
    honest. It tolerates poor sandy acid soils where blueberries feel at home, and
    it laughs at drought better than pampered cultivars.\n\nsubtropical and tropical Americas: excellent
    backbone species for oak-scrub edges, pine understories, and ‘stop mowing that
    sandhill’ projects.\n\n☀️💧 Sun and Water:\n- Full sun to part shade; more sun
    usually means more flowers and fruit.\n- Well-drained acidic soil; drought-tolerant
    once established. Avoid lime and alkaline water love.\n\n✂️ Propagation:\n- Seeds:
    cold stratify several months; slow but doable.\n- Cuttings: hardwood cuttings
    with acid media and patience.\n- Transplants: small plants establish best; protect
    from root desiccation."
  purpose: |-
    - Edible: Berries are edible but small and tart — jelly and experimental ferments, not bulk calories.
    - Wildlife Attractor: Heavy bird use; flowers support native bees.
    - Ornamental: Attractive bark on older stems; nice multi-trunk silhouette.
    - Pollinator: Early-season nectar resource in forest edges.
  companions:
  - Shiny Blueberry
  - Highbush Blueberry
  - Gopher Apple
  - Pine
  cautions:
  - High-pH soils and chronic irrigation with hard water
  pests:
  - Scale Insects
  - Japanese Beetles
  - Powdery Mildew
  - Spider Mites
  - Aphids
  practitioner_notes: |-
    Overfertilized fast growth dilutes flavor and invites sap feeders—lean soil often tastes more like itself.
    Cluster patches three feet or wider—tiny one-offs get ignored by bees cruising for volume.
    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.
    Morning photos for ID are useless if you only look at dusk—check midday nectar presentation too.
  growth_habit: Shrub
