  description: |-
    Sparkleberry (*Vaccinium arboreum*) is a southeastern native that can grow shrubby or downright tree-like, with flaky bark and small dark berries that read ‘bird food’ more than ‘pie filling’ for most humans — tart, seedy, honest. It tolerates poor sandy acid soils where blueberries feel at home, and it laughs at drought better than pampered cultivars.
    
    subtropical and tropical Americas: excellent backbone species for oak-scrub edges, pine understories, and ‘stop mowing that sandhill’ projects.
    
    ☀️💧 Sun and Water:
    - Full sun to part shade; more sun usually means more flowers and fruit.
    - Well-drained acidic soil; drought-tolerant once established. Avoid lime and alkaline water love.
    
    ✂️ Propagation:
    - Seeds: cold stratify several months; slow but doable.
    - Cuttings: hardwood cuttings with acid media and patience.
    - Transplants: small plants establish best; protect from root desiccation.
    
    🌾 Harvest / Best Use Timing:
    - Sparkleberry: pick berries when fully colored and detach with a gentle tug -- whitish bloom still present is fine.
    - Cool mornings beat hot afternoons for shelf life; chill soon if not eating the same day.
    - Freeze dry on trays before bagging so berries do not fuse into a single ice meteor.
