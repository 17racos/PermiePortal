  description: "Monstera deliciosa is a tropical evergreen vine native to the rainforests
    of southern Mexico and Central America. It is renowned for its large, glossy,
    heart-shaped leaves that develop distinctive splits and holes, known as fenestrations,
    as they mature. In its natural habitat, Monstera can climb up to 20 meters (approximately
    65 feet) using its aerial roots to anchor onto trees. When cultivated indoors,
    it typically reaches heights of 1.8 to 2.4 meters (6 to 8 feet). The plant produces
    an inflorescence with a cream-white spathe and a spadix, leading to an elongated
    fruit that is edible when ripe, offering a flavor reminiscent of a blend between
    pineapple and jackfruit. However, unripe fruits contain calcium oxalate crystals,
    which can cause irritation if consumed.\n\n\U0001F31E\U0001F4A7 Sun and Water
    Requirements:\nMonstera thrives in bright, indirect light but can tolerate lower
    light conditions. Direct sunlight can scorch its leaves. It prefers well-draining
    soil and should be watered when the top 2.5 to 5 centimeters (1 to 2 inches) of
    soil are dry. Overwatering can lead to root rot, so ensuring proper drainage is
    essential.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation is commonly done
    through stem cuttings. Select a stem with at least one node and aerial root, cut
    it cleanly, and place it in water or moist soil until roots develop. Air layering
    is another effective method, where a section of the stem is encouraged to root
    while still attached to the parent plant.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nIn its native tropical habitat, Monstera deliciosa produces
    fruit that takes about a year to mature. The fruit is ready to harvest when the
    scales begin to lift and emit a strong, sweet aroma. Caution is advised, as consuming
    unripe fruit can cause irritation due to the presence of calcium oxalate crystals."
