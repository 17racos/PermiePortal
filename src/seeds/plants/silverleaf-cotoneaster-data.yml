  description: 'Silverleaf cotoneaster (Cotoneaster pannosus) is an evergreen to semi-evergreen shrub from western China,
    valued for small silvery leaves, white spring flowers, and red berries that persist for birds. Plants reach 6–10 feet
    (1.8–3 m), arching and often used on slopes for soil holding. Check local invasive lists before mass planting—some regions
    regulate cotoneasters.


    ☀️💧 Sun and Water Requirements:

    Full sun for densest foliage and best fruiting; partial shade reduces berry display. Well-drained average soils suit it;
    tolerates drought once established. Avoid wet feet; mulch to buffer roots.


    ✂️ Propagation:

    Semi-hardwood cuttings in summer with humidity. Sow stratified seed for diversity. Prune after fruiting to shape and open
    interiors.


    🌾 Harvest / Best Use Timing:

    Berries are wildlife food—leave standing through winter for birds. Spring bloom timing follows local frost exit.'
