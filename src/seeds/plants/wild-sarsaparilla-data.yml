  description: "Wild sarsaparilla (Aralia nudicaulis) is a low woodland perennial
    of cool-temperate North American forests, spreading by rhizomes beneath leaf
    litter. A single leaf stalk splits into three compound leaves; separate leafless
    stalks carry spherical umbels of greenish flowers followed by dark berries on
    red pedicels. Roots have a long folk history distinct from tropical Smilax “sarsaparilla,”
    so common-name shopping must stay species-specific.\n\n☀️💧 Sun and Water Requirements:\n
    Shade to dappled light; avoid full sun except in coolest summers. Moist, humus-rich,
    well-drained forest soils match ecology; tolerates dry shade once established
    but not drought on sandy ridges without mulch. Mimic forest floor with leaf mold.\n\n
    ✂️ Propagation:\nSow seed after double dormancy cycles or fall sow outdoors for
    natural stratification. Divide rhizomes in early spring with patience—pieces are
    fragile. Transplant small offsets under nurse trees.\n\n🌾 Harvest / Best Use Timing:\n
    Root harvest for herbal use only after patches are abundant and laws allow; rotate
    harvest zones. Berries are sparingly used in some traditions—verify safety and
    ID. Leave most fruit for wildlife."
