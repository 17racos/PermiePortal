  description: 'Windmill palm is the palm Northerners point at and whisper “see, we can too.” Single trunk, fan leaves, modest
    size by palm standards. In subtropical and tropical Americas it is one of the more plausible trunking palms if you avoid
    salt blast and remember that “hardy” is not “immune to idiot pruning.” Old leaf bases (“boots”) are aesthetic choice—clean
    trunk or shaggy wizard staff, your call.


    ☀️💧 Sun and Water Requirements:

    - Full sun to partial shade; juveniles appreciate some shade in hottest inland sites.

    - Well-drained but fertile soil; steady moisture when establishing, then fairly drought-tolerant for a palm.


    ✂️ Methods to Propagate:

    - Seeds: slow germination, variable timing—warm stratification helps some batches.

    - Transplant young seedlings with root ball intact; mature specimens hate casual moves.


    🌾 Harvest notes:

    - Ornamental and structural; not a primary food palm for most growers in this region.'
  purpose: |-
    Ornamental: Windmill Palm earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Windbreaker: Windbreak value is structural: Windmill palm is the palm Northerners point at and whisper “see, we can too.” Single trunk, fan leaves, modest size by palm standards. -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
    Wildlife Attractor: Windmill Palm layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Mulcher: Windmill Palm tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds

  companions:
  - Ferns
