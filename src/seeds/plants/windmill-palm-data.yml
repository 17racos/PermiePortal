common_name: Windmill Palm
picture: windmill_palm.webp
scientific_name: Trachycarpus fortunei
aka:
- Chusan palm
- Chinese windmill palm
family: Arecaceae
zone: 7-11
ideal_temp_min: 55
ideal_temp_max: 85
min_temp: 5
max_temp: 105
perennial: true
layers:
- Tree
plant_function:
- Ornamental
- Windbreaker
- Wildlife Attractor
- Mulcher
description: |-
  Windmill palm is the palm Northerners point at and whisper “see, we can too.” Single trunk, fan leaves, modest size by palm standards. In subtropical and tropical Americas it is one of the more plausible trunking palms if you avoid salt blast and remember that “hardy” is not “immune to idiot pruning.” Old leaf bases (“boots”) are aesthetic choice—clean trunk or shaggy wizard staff, your call.

  - Full sun to partial shade; juveniles appreciate some shade in hottest inland sites.
  - Well-drained but fertile soil; steady moisture when establishing, then fairly drought-tolerant for a palm.

  - Seeds: slow germination, variable timing—warm stratification helps some batches.
  - Transplant young seedlings with root ball intact; mature specimens hate casual moves.

  - Ornamental and structural; not a primary food palm for most growers in this region.
purpose: |-
  Ornamental: Trachycarpus fortunei fan leaves and fiber-wrapped trunks read Chusan exotic -- one of few trunking palms for zone 7b with winter protection myths kept honest.
  Windbreaker: Plant staggered clumps on north-west wind sides -- fronds flex without shedding like brittle pines.
  Wildlife Attractor: Insect-pollinated spring inflorescences drip honey; blue-black fruit feeds starlings where allowed to set -- remove seedheads near patios if mess annoys.
  Mulcher: Cast fronds chop-and-drop for mulch rings -- petiole spines demand gloves; decay is slower than deciduous leaf litter.
companions:
- Ferns
- Ginger
- Understory shrubs that tolerate root competition
cautions:
- Coastal salt spray without acclimation
- Grade changes that bury root crowns
pests:
- Coconut Mite
- Mealybugs
- Palm Weevil
- Palmetto Weevil
- Red Palm Weevil
- Rhinoceros Beetle
- Scale Insects
- Ganoderma Butt Rot
- Heart Rot