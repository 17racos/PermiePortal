  description: "Elephant Grass (*Pennisetum purpureum*) is a robust perennial grass
    native to tropical and sub-Saharan Africa. It forms dense clumps with tall, bamboo-like
    stems that can reach heights of 2–3.5 meters, and in some cases up to 7.5 meters.
    The leaves are long, slender, and mid-green, measuring up to 120 cm in length
    with a prominent whitish central vein. The plant produces large, bristly flower
    heads that are typically yellow-brown, though they can also appear greenish or
    purplish.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nElephant Grass
    thrives in full sun and requires moderate water once established. It is drought-tolerant
    and can grow in poor, dry soils, making it suitable for a variety of landscapes.\n\n✂️\U0001FAD8
    Methods to Propagate:\nPropagation is primarily through stem cuttings or division,
    as seed production is inconsistent. Cuttings from mature stems can be planted
    directly into the soil during the growing season.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nFor use as animal fodder, harvest the grass when it reaches
    about 1–1.5 meters in height to ensure optimal nutritional value. Regular harvesting
    promotes new growth and maintains the plant's palatability."
  purpose: |-
    - **Animal Fodder:** Widely cultivated as a high-yielding forage crop for livestock, providing essential nutrients for cattle, goats, and other grazing animals.
    - **Erosion Control:** Its dense root system helps stabilize soil, preventing erosion in vulnerable areas.
    - **Windbreaker:** Serves as an effective windbreak due to its tall and dense growth habit, protecting other crops and reducing wind erosion.
    - **Biofuel:** Utilized in the production of biofuels, including biogas and bio-oil, due to its high biomass yield.
  companions:
  - Pigeon Pea — fixes nitrogen at the row edge; cut-and-come-again legume biomass between elephant grass harvests.
  - Cowpea — summer legume intercrop or rotation partner that tolerates heat when grass is cut back for fodder.
  - Leucaena — managed fodder-tree strips alongside grass for ruminant systems; match species to local invasiveness guidance and animal tolerance.
  cautions:
