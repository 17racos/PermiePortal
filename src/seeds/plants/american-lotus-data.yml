  description: "American lotus (Nelumbo lutea) is a native perennial aquatic of still,
    shallow water bodies across warm-temperate to subtropical North America, famous for
    broad floating leaves, fragrant pale yellow flowers, and edible seeds and young
    rhizome tips used in traditional cuisines. Plants spread by rhizomes in muck or
    silty bottoms and can cover large areas where depth stays roughly 6–24 inches (15–60
    cm) over a stable substrate. In designed systems it is a centerpiece species for
    pond edges, constructed wetlands, and wildlife pools—provided you respect its talent
    for expansion.\n\n☀️💧 Sun and Water Requirements:\nFull sun for strongest flowering
    and seed set; shade weakens bloom. Requires standing or very slow-moving fresh water;
    tolerates seasonal water-level shifts if rhizomes remain submerged or damp during
    growth. Heavy pollution or chronic herbicide drift kills the honest way first.\n\n
    ✂️ Propagation:\nDivide dormant rhizome sections in early spring before new growth
    hardens, keeping each piece with growing tips. Sow scarified seed into warm shallow
    water after frost risk in the zone; seedlings root down into pond muck. Containerize
    in large submerged tubs if you need to limit spread in small ponds.\n\n🌾 Harvest
    / Best Use Timing:\nGather young leaves, stems, or rhizome tips only where law and
    land ethics allow; regulations vary widely. Collect ripe seeds from receptacles
    when they loosen—dry and parch before cracking. Stop harvest if local populations
    are protected or stressed."
