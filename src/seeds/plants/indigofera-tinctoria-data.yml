  description: 'True indigo is a leafy shrubby legume historically farmed for blue dye precursors in its fermented leaves.
    Pinnate leaves and pink to purplish pea flowers form bushy plants 2–6 feet tall in warm climates, with woody bases where
    frosts are absent.


    In subtropical and tropical Americas it thrives as a wet-season grower with sharp drainage between storms—humidity is
    fine if air moves; Puerto Rico’s dry season slows growth, which matches a harvest-and-process rhythm. Treat it as a rotational
    shrub in diversified systems, not a monoculture invitation to every legume pest in the county.


    ☀️💧 Sun and Water Requirements:

    - Full sun for vigorous leaf production and flowering.

    - Fertile, well-drained loam; raised beds in high-rainfall sites.

    - Steady moisture during leaf expansion; reduce water after major harvests to limit root stress rots.


    ✂️ Propagation:

    - Seeds scarify lightly and sow warm; inoculate with appropriate rhizobia for your region.

    - Hardwood cuttings from mature wood with rooting hormone and bottom heat in humid propagation.

    - Divide older crowns carefully where plants layer roots at the base.


    🌾 Harvest / Best Use Timing:

    - Cut leafy stems for dye vats when growth is lush but before heavy lignification—often multiple cuts per warm year.

    - Leave recovery windows between heavy harvests so roots recharge nitrogen and carbohydrates.'
  purpose: |-
    Nitrogen Fixer: Indigofera tinctoria carries rhizobia that fix nitrogen while you repeatedly shear leafy stems -- alley-crop with sunflowers or roselle so fixed N and leaf litter feed the hungry row without urea topdresses.
    Medicinal: Leaves enter traditional protocols for liver and skin support, but indigo precursors are potent -- treat any internal use as trained herbalism, not casual salad garnish.
    Biomass: Multiple leafy cuts per warm season produce carbon-rich slash for compost and deep mulch -- rotate heavy harvests so roots rebuild starch before the next dye batch.
    Border Plant: Upright 3-6 foot shrubs knit into sun edges with pink pea flowers -- site where air moves because humid stagnation still invites legume foliar diseases.
  companions:
  - Roselle — shares warm-season production logic; indigo’s nitrogen supports heavy-feeding calyx crop.
  - Sunflower — tall warm-season annual gives light afternoon shade to indigo shoulders while feeding birds after seed set.
  - Lemongrass — aromatic clumps confuse some chewing insects at the row edge while tolerating indigo’s fertility lift.
