  description: 'Wild mustard greens here refers to naturalized and feral populations of Brassica juncea—fast-bolting mustard
    with lobed leaves and bright yellow four-petaled flowers on tall racemes. Plants behave as cool-season annuals or biennials,
    often 0.6–1.5 m (2–5 ft) when flowering, and colonize disturbed ground with brassica confidence. In subtropical and tropical
    Americas they shine in the cooler months; summer heat pushes quick bolting unless you select heat-tolerant lines and harvest
    young.


    ☀️💧 Sun and Water Requirements:

    - Full sun for compact growth; light shade slows bolting briefly in warm snaps.

    - Steady moisture for tender leaves; mature plants tolerate drier spells.

    - Avoid waterlogged beds—clubroot relatives hate suffocated roots.


    ✂️ Methods to Propagate:

    - Direct-sow seed in fall through early spring (adjust for subtropical/tropical cool windows).

    - Thin seedlings to 15–20 cm for leaf crops; allow wider spacing for seed saving.

    - Save dry pods when brown; winnow chaff before storing.


    🌾 Harvest / Best Use Timing:

    - Pick rosette and stem leaves while young and mild; older leaves need longer cooking.

    - Flower buds can be treated like broccolini; identify confidently before eating from roadsides.'
