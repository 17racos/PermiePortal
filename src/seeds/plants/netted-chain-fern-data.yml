  description: "Netted chain fern (Woodwardia areolata) is a deciduous fern of eastern
    North American swamps, blackwater streams, and floodplain forests. Fronds are
    once-pinnate with netted veins easy to see against the light—hence the name—and
    colonies spread by slender rhizomes through muck. It is a signature ground layer
    for restoration plantings where cinnamon fern and royal fern already hint at the
    water table.\n\n☀️💧 Sun and Water Requirements:\n- Light shade to part sun
    if soil stays wet; full sun over dry soil kills fronds.\n- Moisture-loving;
    tolerates shallow standing water for short periods.\n- Acidic, organic-rich
    soils typical of low woods; add composted leaf mold in garden settings.\n\n✂️
    Propagation:\n- Division of rhizomes in early spring with a bud per piece.\n-
    Spores on sterile medium under humidity—slow, for enthusiasts.\n- Transplant
    small offsets with minimal root disturbance; keep wet the first season.\n\n🌾
    Harvest / Best Use Timing:\n- Not a crop plant; value is habitat and soil binding.\n-
    For expansion, divide when fiddleheads are thumb height, before heat waves.\n-
    Avoid removing fronds from public wetlands—propagate only ethically sourced stock."
  purpose: |-
    - Ground Cover: Rhizomes weave a living mat along shady wet margins.
    - Wildlife Attractor: Moist fern groves support amphibians and invertebrates in forested wetlands.
    - Erosion Control: Roots stabilize organic banks that would otherwise slough in floods.
    - Ornamental: Net-veined pinnae are a teaching moment in designed wetland gardens.
  companions:
  - Royal Fern — taller sterile fronds create layered wetland texture beside chain fern
  - Marsh Fern — similar hydrology with contrasting frond division patterns for teaching ID
  - Pond Cypress — in soggy sunny edges, knees and ferns signal authentic swamp aesthetic
