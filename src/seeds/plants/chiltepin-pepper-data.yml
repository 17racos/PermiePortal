  description: 'Chiltepin (*Capsicum annuum* var. *glabriusculum*) is the wild ancestor complex behind many domestic chiles—tiny
    round fruits pack fierce heat and citrusy aroma. Plants are wiry shrubs usually 0.5–2 m tall with small oval leaves and
    white flowers followed by upright red berries. In Florida and Puerto Rico they behave more like short-lived perennials
    or true shrubs where frosts are rare, producing year-round flushes during warm wet seasons with a slowdown in cool dry
    spells.


    ☀️💧 **Sun and Water Requirements:**

    Full sun for dense growth and heaviest fruiting. Use very well-drained soil; container culture helps in rainy sites. Water
    deeply when dry, but never let roots sit soggy—humid summers demand airflow and gravelly mixes.


    ✂️ **Methods to Propagate:**

    - **Seeds:** Start indoors or in a shaded nursery bed after last cool spell; germination is faster around 24–30 °C (75–86
    °F).

    - **Cuttings:** Take woody tip cuttings in warm weather, keep humid until roots form—clones preserve a favorite wild-type
    flavor.


    🌾 **When to Harvest:**

    Pick red, fully ripe fruits for seed saving and maximum flavor; green fruits are edible but sharper. Dry small batches
    on screens out of direct tropical midday sun, or freeze for long-term kitchen use.'
  purpose: '- **Edible:** Fruits deliver intense heat for ferments, vinegars, and spice mixes with minimal garden space.

    - **Pest Management:** Interplanted chiles can confuse or repel some chewing pests through odor and chemistry in mixed
    beds.

    - **Wildlife Attractor:** Flowers feed small pollinators; ripe fruits feed birds that disperse seed in wilder edges.

    - **Ornamental:** Bright red pea-sized peppers on fine branches read as jewel-like accents in edible landscaping.'
