  description: "Pigeon Pea (Cajanus cajan) is a fast-growing, drought-resistant shrub
    that can reach up to 3-5 meters (10-16 feet) tall. It produces small, oval green
    to brown pods containing edible seeds, commonly used in traditional dishes. The
    plant is highly resilient, thriving in poor soils and restoring fertility through
    nitrogen fixation. It is valued for its ability to improve degraded land and its
    use as a windbreak.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers
    full sun but can tolerate partial shade.\n- Grows best in well-drained, sandy
    or loamy soils.\n- Drought-tolerant but benefits from occasional deep watering
    during dry periods.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Seed**: Direct
    sowing is the most common method, with seeds germinating in 10-15 days.\n- **Cuttings**:
    Can be propagated from semi-hardwood cuttings for faster establishment.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Pods mature 4-6 months after planting.\n- Young green pods
    can be harvested for fresh consumption.\n- Dried seeds are ready for harvest when
    the pods turn brown and brittle."
  purpose: |-
    Pigeon Pea serves multiple functions in a permaculture system:

    - Edible: Provides high-protein peas that can be eaten fresh, dried, or ground into flour.
    - Nitrogen Fixer: Enriches soil by converting atmospheric nitrogen into a usable form.
    - Mulcher: Produces abundant biomass that can be used for mulch and composting.
    - Dynamic Accumulator: Draws up deep soil nutrients and makes them available to surrounding plants.
    - Erosion Control: Stabilizes slopes and prevents soil loss with its deep root system.
    - Animal Fodder: Leaves and stems are an excellent protein source for livestock.
    - Wildlife Attractor: Provides food and shelter for pollinators and beneficial insects.
    - Windbreaker: Acts as a natural wind barrier to protect more delicate crops.
