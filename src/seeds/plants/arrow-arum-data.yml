  description: |-
    Arrow arum (Peltandra virginica) is a native eastern North American emergent wetland perennial in the arum family. It forms colonies of arrowhead-shaped leaves on long petioles from thick rhizomes in muck or shallow water, with a greenish spathe-and-spadix inflorescence easy to miss unless you are looking. Plants typically stand roughly 1–3 feet above the water or mud surface.

    subtropical and tropical Americas are inside its natural humid subtropical/tropical tolerance—edges of ponds, swales, rain gardens, and slow streams. It handles warm, muggy summers; winter dormancy in cooler Florida still works with rhizome persistence.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; more shade reduces algae film on standing water edges.
    - Saturated soil to a few inches of slow-moving or still water; not a desert plant—do not park it on a sand mound with drip irrigation denial.

    ✂️ Methods to Propagate:
    - Division of rhizomes in late winter before new growth pushes—each chunk needs buds and roots.
    - Seeds after berries ripen: clean, sow in wet medium; patience required—wild wetland plants do not rush for your spreadsheet.

    🌾 Harvest / Best Use Timing:
    - Traditional food use of some arums demands serious processing knowledge—treat this primarily as habitat and erosion plant unless you have trained guidance.
    - For ecology, leave seed heads for wildlife where safe; structural harvest is for propagation splits, not dinner whimsy.
  purpose: |-
    Arrow arum is infrastructure for wet edges, not a row crop.

    - Aquatic: Defines the shallow-water herb layer in pond margins and biofilters.
    - Wildlife Attractor: Offers cover and food web structure for amphibians, insects, and water birds at the edge.
    - Erosion Control: Rhizomes knit mucky banks that would otherwise slough during sheet flow.
    - Ornamental: Bold leaves read as clean geometry in native pond aesthetics—less chaotic than pure mud.
  companions:
