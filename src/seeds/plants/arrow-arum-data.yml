description: |-
  Arrow arum (Peltandra virginica) is a native eastern North American emergent wetland perennial in the arum family. It forms colonies of arrowhead-shaped leaves on long petioles from thick rhizomes in muck or shallow water, with a greenish spathe-and-spadix inflorescence easy to miss unless you are looking. Plants typically stand roughly 1–3 feet above the water or mud surface.

  subtropical and tropical Americas are inside its natural humid subtropical/tropical tolerance—edges of ponds, swales, rain gardens, and slow streams. It handles warm, muggy summers; winter dormancy in cooler Florida still works with rhizome persistence.

  Full sun to light shade; more shade reduces algae film on standing water edges. Saturated soil to a few inches of slow-moving or still water; not a desert plant—do not park it on a sand mound with drip irrigation denial.

  Division of rhizomes in late winter before new growth pushes—each chunk needs buds and roots. Seeds after berries ripen: clean, sow in wet medium; patience required—wild wetland plants do not rush for your spreadsheet.

  Traditional food use of some arums demands serious processing knowledge—treat this primarily as habitat and erosion plant unless you have trained guidance. For ecology, leave seed heads for wildlife where safe; structural harvest is for propagation splits, not dinner whimsy.
purpose: |-
  Aquatic: Peltandra virginica holds the emergent arum niche in a few inches of still water with arrow-shaped leaves on long petioles -- rhizomes spread colonies, so bury liners or plan annual division on small formal ponds.
  Wildlife Attractor: Spathe-and-spadix inflorescences feed pollinating flies while dense leaves shelter frogs and damselflies at the waterline -- red berries look tempting but carry calcium oxalate risk for curious mammals.
  Erosion Control: Thick rhizomes knit mucky banks during hurricane sheet flow where turf would wash -- plant bands along pond toes instead of isolated specimens on dry berms.
  Ornamental: Bold sagittate leaves give native pond geometry without tropical water-arum vibes -- pair with pickerelweed for complementary vertical flowers along the same shelf.
companions:
  - Blue Pickerelweed — overlapping wetland niche with complementary flowers; shared pollinator traffic at the waterline.
  - Pickerelweed — taller flowering structure mixes with arrow arum foliage for layered edge planting.
  - Cattail — structural backdrop and nutrient sponge; manage spread so arrow arum keeps light.
