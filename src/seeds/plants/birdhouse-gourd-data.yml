  description: "Birdhouse gourd is Lagenaria siceraria selected for big hollow
    fruits that dry into lightweight shells — crafts, rattles, and yes, actual
    birdhouses if you drill holes like a landlord who respects building codes.
    Young fruit is edible like other bottle gourds when tender; most growers chase
    size and shell thickness instead of salad. subtropical and tropical Americas: plant after soil
    warms; long vines need a sturdy arbor or you will find them in the neighbor's
    oak.\n\n☀️💧 Sun and Water:\n- Full sun for strong vines and large fruit.\n-
    Consistent water during growth; cut back before harvest hardening to reduce rot.\n\n
    ✂️ Propagation:\n- Direct-sow 2-3 seeds per hill after frost, or start indoors 3-4
    weeks ahead on fast-draining mix.\n- Provide trellis for clean fruit or mulch
    heavily if letting sprawl.\n\nPermie angle: one season of chaos, years of
    nest boxes and weird gifts."
