  description: |-
    New Jersey tea (Ceanothus americanus) is a deciduous, fine-textured shrub of dry savannas and open woods, bearing small serrated leaves and dense clusters of tiny white flowers that read as “foam parties for pollinators.” Height commonly stays 2–3 feet in harsh sites, taller with moisture; roots partner with Frankia actinobacteria for nitrogen fixation—subtle, not as flashy as legume nodules, still paying rent.

    subtropical and tropical Americas: Northern and central Florida can host it on sandy, well-drained banks; deep south humidity demands extra spacing, airflow, and avoidance of heavy clay swamps—this plant prefers honesty about drainage.

    ☀️💧 Sun and Water Requirements:
    - Full sun for tight habit and maximum bloom; light shade acceptable but flowering drops the mic early.
    - Dry to medium moisture; drought-tolerant once established; hates wet feet—berm it or regret it.

    ✂️ Propagation:
    - Scarified seed with a short hot-water soak; stratify if indoor germination is stubborn.
    - Softwood cuttings in late spring under mist; keep humidity high until roots call back.

    🌾 Harvest / Best Use Timing:
    - Historical use as a caffeine-free tea substitute involved dried leaves; confirm ID and personal tolerance before hosting a tasting party.
    - Prune after bloom to shape; avoid heavy late-season cuts that remove next year’s wood.
  purpose: |-
    - Nitrogen Fixer: Actinorhizal roots enrich lean soils, subsidizing neighbors without bagged blue crystals.
    - Pollinator: Small flowers pack nectar accessible to tiny native bees and wasps mainstream catalogs ignore.
