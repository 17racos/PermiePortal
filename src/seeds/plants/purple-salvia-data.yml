  description: "Purple salvia here refers to mealycup sage (Salvia farinacea), a mint-family perennial treated as a tender
    perennial or seasonal annual depending on winter lows. Upright spikes of violet-blue flowers rise above powdery, often
    whitish stems that signal its common name, reaching roughly 45–60 cm (18–24 inches) in rich soils and holding shorter
    in lean ones. It is a workhorse for pollinator strips, pot clusters, and dry borders from warm-temperate through subtropical
    gardens where humidity does not instantly melt every sage fantasy.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for
    densest spikes; light partial shade only where afternoon heat is brutal.\n- Moderate water with dry-down between events;
    soggy winter pots are root-rot receipts.\n- Well-drained soil; tolerates lean mixes better than heavy feeding schedules.\n\n✂️
    Methods to Propagate:\n- Seeds: start indoors 6–8 weeks before stable warm nights or direct sow after frost risk in annual
    rotations.\n- Softwood cuttings in late spring to early summer root under intermittent mist.\n- Division of older clumps
    in early wet season where winters are mild resets woody bases.\n\n🌾 Harvest / Best Use Timing:\n- Cut flower spikes for
    bouquets when two-thirds of florets are open; later cuts hold less stem strength.\n- Harvest edible flowers sparingly
    with positive mint-family ID if you serve them—aroma, not hype, is the safety cue.\n- Shear after first big flush in
    long-season climates to force a secondary wave before daylength shuts the party."
