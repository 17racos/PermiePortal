field_observations: |-
  Farinacea means mealy—if leaves look sugar-dusted, you probably have the right plant, not a pesticide drift mystery.
  Overwatered sages rot quietly; lift pots or improve slope before the center goes hollow.
  Deer opinions vary by hunger and neighborhood; fence first, philosophy second.
diseases:
- Powdery Mildew
