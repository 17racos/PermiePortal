  description: 'Marang (Artocarpus odoratissimus) is a close relative of jackfruit and breadfruit, a large tropical tree of
    Borneo and nearby humid regions, bearing smaller, more aromatic compound fruits with soft sweet arils prized where the
    species is grown. Heights of 50–85 feet (15–25 m) occur in open conditions. Latex and fruiting habit echo jackfruit—plan
    space, tools, and cleanup before romantic planting.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; young trees tolerate partial shade during establishment. Deep, fertile, well-drained soils
    with steady moisture in the warm season; mulch buffers heat at surface roots. Wind protection reduces fruit and leaf damage
    on exposed sites.


    ✂️ Propagation:

    Graft or air-layer known selections; seedlings vary in fruit quality. Prune for strong scaffolds capable of carrying heavy
    fruit loads. Remove inward branches that shade interior fruiting wood.


    🌾 Harvest / Best Use Timing:

    Harvest when aroma and color cues match local practice—marang ripens quickly and ferments fast in heat. Process arils
    soon after opening; latex sticks to knives and dignity. Expect seasonal flushes tied to rainfall and heat.'
  purpose: '- Edible: Sweet aromatic arils diversify tropical desserts and fresh eating for patient growers.

    - Shade Provider: Large crown shelters understory in humid food forests.

    - Wildlife Attractor: Flowers and fallen fruit engage wildlife where that aligns with management.

    - Mulcher: Big leaves return biomass when cycled through chop-and-drop routines.'
  companions:
