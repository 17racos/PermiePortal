  description: |-
    Bell pepper (Capsicum annuum) is a warm-season fruiting plant grown for thick-fleshed peppers eaten fresh, cooked, or preserved. Originating in the Americas, it forms sturdy, branching plants that typically reach about 45–90 cm (18–35 in) tall. In permaculture, bell peppers earn their keep twice: fruits feed people, while flowers support pollinators and the plant’s leafy biomass can be composted as carbon-rich matter.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun; flowering and fruit set drop fast when light is limited.
    - Water regularly during growth; keep soil evenly moist but never waterlogged.
    - Prefers fertile, well-drained loam amended with compost.
    - Cold is the enemy: growth stalls when nights drop near 50°F (10°C).
    
    ✂️ Propagation:
    - Seeds: start indoors 8–10 weeks before transplanting; germination commonly takes 7–21 days at warm temperatures.
    - Transplants: move seedlings outdoors after danger of frost and when soil is consistently warm (often above ~60°F / 16°C).
    - Optional: start a second sowing 2–3 weeks later to spread harvest risk across weather swings.
    
    🌾 Harvest / Best Use Timing:
    - Harvest when fruits reach full size; pick green for crispness or let them ripen toward yellow/red for sweetness.
    - Cut peppers with a short stem to avoid tearing vines.
    - Roast, sauté, dehydrate, or pickle for storage; freeze chopped pieces after blanching.
