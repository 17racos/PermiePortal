  description: "Russet buffaloberry (Shepherdia canadensis) is a cold-hardy nitrogen-fixing shrub of northern North American forests and river terraces, bearing silvery-scaly leaves, inconspicuous flowers, and tart orange-red berries high in saponins that foam when crushed. Plants reach 3–8 feet (0.9–2.4 m), often thicket-forming. Fruit supports Indigenous foodways where processing is understood; raw handfuls are astringent and soapy—respect the chemistry.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best fruiting in bright sites. Tolerates poor, alkaline, and sandy soils thanks to actinorhizal roots; prefers consistent moisture in summer but handles cold dry winters. Avoid waterlogged clay without percolation.\n\n✂️ Propagation:\nSow stratified seed; semi-hardwood cuttings with bottom heat. Prune to renew fruiting wood and reduce thicket density along paths.\n\n🌾 Harvest / Best Use Timing:\nHarvest berries when fully colored and slightly soft; whip, dry, or process per traditional recipes—do not treat like supermarket blueberries. Peak picking tracks mid-summer warmth in boreal and montane sites."
