  description: |-
    Lemon eucalyptus is a fast Australian gum that smells like someone hid a lemon drop in the canopy. Essential oil from leaves powers citronella-type products; the tree itself is a skyscraper with opinions about fire ecology — not a cute patio pot forever. In subtropical and tropical Americas it grows where winters are mild; young trees are frost-tender in cooler subtropical pockets, while mature specimens handle brief chills better—still not a parka substitute.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun; open sky or forget serious height.
    - Tolerates poor soils once established; young trees want consistent moisture to outrun stress.
    - Avoid chronic waterlogging; roots hate suffocation.
    
    ✂️ Methods to Propagate:
    - Seeds: sow fine seed on surface; do not bury deeply; warmth speeds germination.
    - Cuttings: possible for some clones but variable; seed lines are more common for home growers.
    
    🌾 Harvest / Best Use Timing:
    - Harvest Lemon Eucalyptus aerial parts in early flowering for many mint-family uses -- oils shift after full bloom.
    - Dry in shade with airflow between 95-110°F (35-43°C) until crisp; mold invalidates the batch.
    - Label harvest date and plant part -- winter you will not remember which jar was optimism.
  purpose: |-
    Medicinal: Medicinal use stays grounded in what growers actually report: Essential oil from leaves powers citronella-type products; the tree itself is a skyscraper with opinions about fire ecology  --  not a cute patio pot forever. -- keeps informed-adult herbal capacity on-site where drying, teas, and tinctures fit your actual risk tolerance
    Windbreaker: Windbreak value is structural: Lemon eucalyptus is a fast Australian gum that smells like someone hid a lemon drop in the canopy. -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
    Mulcher: Lemon Eucalyptus tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Wildlife Attractor: Lemon Eucalyptus layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Ornamental: Lemon Eucalyptus earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight

  companions:
  - Comfrey — deep-rooted chop-and-drop under the drip line; handles litter load and recycles leaf-fall nutrients without
    competing for height.
  - Sweet Potato — sprawling ground cover at the canopy edge to hold soil where bark and leaf shed; keep back from trunk flare
    to reduce rodent hideouts.
  - Lemongrass — clumping aromatic grass in the open skirt for visual rhythm and harvest; tolerates heat and occasional litter
    acidity if drainage is good.
  cautions:
  - Planting under power lines unless you enjoy angry letters
  - Fire-prone wildland edges without management plan
  pests:
  - Borers
  - Leafhoppers
  - Oriental Fruit Fly
  - Scale insects
  practitioner_notes: 'Dry aerial parts fast with airflow, not slow plastic bags—mold reads as ‘aged’ only in marketing copy.

    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.

    Label jars with plant part and date the day you seal—future you is not psychic.

    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.'
