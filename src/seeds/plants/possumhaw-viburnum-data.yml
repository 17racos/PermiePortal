description: |-
  Possumhaw viburnum (Viburnum nudum) is a multi-stemmed deciduous shrub of eastern North American swamps, stream banks, and moist woods. Creamy flower clusters ripen through pink to blue-black drupes that read like beadwork along the stems. It is a backbone plant for rain gardens, bird hedges, and native borders where wet feet would kill fussier ornamentals.

  ☀️💧 Sun and Water Requirements:
  - Full sun to partial shade; best fruiting with at least half-day sun.
  - Moisture-loving; tolerates seasonal wet; still needs drainage over weeks, not permanent stagnation over the crown.
  - Acidic organic soils typical; mulch with leaf mold in landscape plantings.

  ✂️ Propagation:
  - Softwood cuttings in early summer under mist.
  - Seeds: double dormancy is common—warm stratify, then cold, or sow fresh and wait.
  - Suckers can be separated with roots in early spring.

  🌾 Harvest / Best Use Timing:
  - Fruit is technically edible but often bitter-astringent raw; some cooks experiment with jelly after acid and sugar balance.
  - For wildlife, leave clusters until fully colored—migratory birds cue on that signal.
  - Prune after flowering if shaping; heavy winter cuts remove next spring’s bloom wood.
purpose: |-
  Edible: Viburnum nudum drupes shift cream to pink to blue-black with astringency that jelly makers tame with acid and sugar -- raw flavor educates palates; cook tests small batches before gifting jars.
  Wildlife Attractor: Flat-topped cymes feed mason bees and hoverflies; ripe drupes fuel cedar waxwings and thrushes during migration -- plant two unrelated clones because many selections are self-sterile without cross pollen.
  Ornamental: Simultaneous rainbow fruit clusters on one shrub sell rain-garden tours from late summer through fall color -- glossy leaves stay clean-looking where powdery mildew pressure stays low with airflow.
  Border Plant: Multi-stem twiggy frame defines pond margins and bioswale toes without formal shearing -- tolerates wet feet better than most ornamental viburnums if crown stays above stagnant winter water.
companions:
- Rusty Blackhaw — drier-site viburnum cousin for staggered fruiting and height layers
- Roughleaf Dogwood — shares moist edge ecology and extends bloom sequence for insects
- Netted Chain Fern — ground layer for shady wet feet under open shrub stems
