  description: "Possumhaw viburnum (Viburnum nudum) is a multi-stemmed deciduous
    shrub of eastern North American swamps, stream banks, and moist woods. Creamy
    flower clusters ripen through pink to blue-black drupes that read like beadwork
    along the stems. It is a backbone plant for rain gardens, bird hedges, and native
    borders where wet feet would kill fussier ornamentals.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun to partial shade; best fruiting with at least half-day sun.\n- Moisture-loving;
    tolerates seasonal wet; still needs drainage over weeks, not permanent stagnation
    over the crown.\n- Acidic organic soils typical; mulch with leaf mold in landscape
    plantings.\n\n✂️ Propagation:\n- Softwood cuttings in early summer under mist.\n-
    Seeds: double dormancy is common—warm stratify, then cold, or sow fresh and wait.\n-
    Suckers can be separated with roots in early spring.\n\n🌾 Harvest / Best Use Timing:\n-
    Fruit is technically edible but often bitter-astringent raw; some cooks experiment
    with jelly after acid and sugar balance.\n- For wildlife, leave clusters until
    fully colored—migratory birds cue on that signal.\n- Prune after flowering if
    shaping; heavy winter cuts remove next spring’s bloom wood."
