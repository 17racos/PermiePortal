  description: "‘Corsican’ is a Lagenaria siceraria landrace selected for warty, ornamental, often huge fruits—same species\
    \ as smooth bottle gourds, different drama. Young fruit can be eaten like summer squash; most growers chase the fully\
    \ cured shell for crafts and absurd table centerpieces.\n\nSow after soil warms; long frost-free season helps fruits size\
    \ and shells harden before cold. Humidity invites the usual cucurbit leaf fungi—trellis for airflow and cleaner fruit.\n\
    \nSun and water: Full sun, fertile well-drained soil, steady moisture while vines run and fruit swells; ease off as shells\
    \ cure on the vine.\n\n ✂️ Propagation: Direct-sow or transplant carefully; fragile roots hate rough handling. Strong\
    \ trellis or you will triage mud-rot gourds."
  purpose: 'Vertical annual biomass, food while young, craft stock when old:


    - Edible: Tender immature fruit in the kitchen.

    - Ornamental: Sculptural fruits that outshine your minimalist phase.

    - Fiber: Cured shells for containers, birdhouses, and percussion regrets.'
  companions:
