  description: |-
    Custard apple is a small tropical tree with irregular, knobbly fruit and soft, sweet pulp that tastes like the tropics remembered you exist. Deciduous in cool snaps; in subtropical and tropical Americas you are flirting with the edge of its patience—microclimate, wind protection, and young-tree frost plans are not optional flexes.

    ☀️💧 Sun and Water Requirements:
    - Full sun once established; young trees appreciate light shade during brutal midday heat.
    - Deep, fertile, well-drained soil; steady moisture during flowering and fruit fill, backing off when cool.

    ✂️ Methods to Propagate:
    - Seeds: viable fresh seed; variable offspring and long road to fruit—fine for experimentation.
    - Grafting selected cultivars onto seedling annona rootstock is how serious growers keep quality predictable.

    🌾 Harvest notes:
    - Fruit yields slightly under finger pressure and detaches easily when ripe; flavor peaks after softening—do not confuse “firm” with “ready.”
  purpose: |-
    - Edible: Fresh pulp and smoothies; handle seeds carefully—they are not snack food.
    - Wildlife Attractor: Flowers and fruit feed pollinators and frugivores where fruit is allowed to ripen.
    - Mulcher: Leaf drop feeds understory guilds in humid sites.
    - Shade Provider: Open canopy for understory guilds once the tree sizes up.
  companions:
