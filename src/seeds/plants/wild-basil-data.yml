    relative native to Europe and temperate Asia, naturalized in parts of North America
    in meadows, woodland edges, and roadsides. Aromatic foliage and whorls of small
    pink-purple tubular flowers draw pollinators in summer. It behaves more politely
    than spearmint in many gardens, forming expanding patches rather than launching
    subterranean coups.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade;
    leaner soils and sun intensify aroma. Average moisture suits it; drought-tolerant
    once established compared with culinary basil. Avoid waterlogged winter clay
    without slope or amendment.\n\n✂️ Propagation:\nSow seed in spring after last frost;
    germination moderate. Divide rhizomatous patches in spring or fall. Softwood cuttings
    root under humidity in late spring.\n\n🌾 Harvest / Best Use Timing:\nSnip leafy
    stems before heavy bloom for strongest kitchen flavor; use like mild oregano
    or savory. Dry bundles in shade with airflow; strip leaves once crisp."
