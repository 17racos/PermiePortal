  description: "Trailing mimosa (Mimosa strigillosa) is a low, creeping native legume
    of sandy pine savannas, roadsides, and open coastal plain grasslands from the
    humid subtropical Gulf–Atlantic region into parts of the Caribbean where hardy.
    Soft compound leaves fold when disturbed; pink powderpuff flowers hug the ground
    on short stalks. Rhizomes knit sand, fix nitrogen, and replace thirsty turf in
    sunny hellstrips.\n\n☀️💧 Sun and Water Requirements:\nFull sun for dense mats and
    reliable bloom; becomes sparse in shade. Excellent drainage is non-negotiable—sandy
    or gravelly soils preferred. Drought-tolerant once established; tolerates brief
    soil saturation after storms better than many turf grasses if slope drains.\n\n
    ✂️ Propagation:\nStart from scarified seed after last frost; warmth speeds germination.
    Rhizome sections with buds transplant during warm wet weather. Space plugs to
    merge—this plant is designed to wander.\n\n🌾 Harvest / Best Use Timing:\nNot a
    food crop; occasional traditional forage mentions exist—treat as groundcover, not
    salad. Mow or string-trim edges if expansion breaches paths; avoid scalping during
    drought stress."
  purpose: |-
    - Nitrogen Fixer: Root nodules supply biologically fixed nitrogen to neighboring plants via turnover and exudates.
    - Ground Cover: Rhizomatous mat excludes bare sand and reduces soil heating in open sites.
    - Pollinator: Low flowers still attract small bees in hot months when taller forbs desiccate.
    - Erosion Control: Interwoven stems and roots armor sandy slopes against sheet erosion.
    - Ornamental: Pink pompoms on a sensitive-plant carpet beats flat mulch visually.
  companions:
  - Sand Live Oak — dappled edge shade as oak matures; mimosa holds the sunny foreground
  - Muhly Grass — fine texture contrast; both handle lean coastal sands
  - Blanket Flower — short colorful forb pockets within mimosa matrix without root dominance battles
  cautions:
