description: |-
  Rue (Ruta graveolens) is a hardy, evergreen perennial herb known for its strong aroma and bitter-tasting leaves. It grows to a height of 60-90 cm (2-3 feet) and has blue-green, feathery foliage with small, yellow flowers that bloom in late spring and summer. The plant is drought-tolerant and thrives in poor, well-drained soils.

  Rue is often grown as an ornamental herb, but it also has traditional medicinal uses. However, its leaves contain furanocoumarins, which can cause skin irritation in some people. It is best handled with gloves.

   🌞💧 Sun and Water Requirements:
  - Prefers full sun (at least 6-8 hours of sunlight per day).
  - Thrives in dry, well-drained soil with low to moderate watering.
  - Tolerates drought but should not be overwatered.

  ✂️🫘 Methods to Propagate:
  - Seeds: Direct sow in spring or start indoors 6-8 weeks before the last frost.
  - Cuttings: Take softwood cuttings in early summer and root in moist soil.
  - Division: Can be divided in early spring or fall.

  🧑‍🌾👩‍🌾 When to Harvest:
  - Harvest leaves as needed once the plant is well-established.
  - Best flavor when harvested before flowering.
  - Use gloves when handling to avoid skin irritation.
purpose: |-
  Medicinal: Ruta graveolens leaf is a bitter European spasmolytic herb with documented phototoxic furanocoumarins -- skin plus sun equals blistering; internal use belongs in trained hands, not casual salad experiments.
  Pollinator: Four-petaled yellow cups sit above blue glaucous foliage in late spring, feeding small Halictid bees and solitary wasps before heat shuts nectar down by July -- nectar is shallow, so honeybees work it only on calm mornings.
  Wildlife Attractor: Ripe capsules split to show shiny black seeds that mourning doves pick from gravel paths -- low semi-woody mounds also give spider habitat under skirts where you skip bare cultivation.
  Pest Management: Strong methyl ketone odor from bruised leaf masks host cues for some aphids and flea beetles in tight alley trials -- radius is a few feet and fades after rain, so repeat bruising or interplant density matters.
  Border Plant: Two-foot (60 cm) mounds of dissected blue leaves read as formal edging along lavender rows -- droughty lean soil keeps oils high; irrigation and shade turn it lanky and milder smelling.
