  description: "Rue (Ruta graveolens) is a hardy, evergreen perennial herb known for its strong aroma and bitter-tasting leaves.\
    \ It grows to a height of 60-90 cm (2-3 feet) and has blue-green, feathery foliage with small, yellow flowers that bloom\
    \ in late spring and summer. The plant is drought-tolerant and thrives in poor, well-drained soils.\n\nRue is often grown\
    \ as an ornamental herb, but it also has traditional medicinal uses. However, its leaves contain furanocoumarins, which\
    \ can cause skin irritation in some people. It is best handled with gloves.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n\
    - Prefers full sun (at least 6-8 hours of sunlight per day).\n- Thrives in dry, well-drained soil with low to moderate\
    \ watering.\n- Tolerates drought but should not be overwatered.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct\
    \ sow in spring or start indoors 6-8 weeks before the last frost.\n- Cuttings: Take softwood cuttings in early summer\
    \ and root in moist soil.\n- Division: Can be divided in early spring or fall.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E\
    \ When to Harvest:\n- Harvest leaves as needed once the plant is well-established.\n- Best flavor when harvested before\
    \ flowering.\n- Use gloves when handling to avoid skin irritation."
