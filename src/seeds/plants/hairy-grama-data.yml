  description: 'Hairy grama (Bouteloua hirsuta) is a warm-season shortgrass of dry prairies, rocky slopes, and open woodlands
    from central North America into Mexico, recognizable by comb-like spikes and hairy lemmas that give the species its common
    name. Plants form low tufts often under 1 foot (0.3 m) with flowering stems reaching slightly higher. It belongs in xeric
    meadow mixes, green roofs with depth, and restoration seedings where water is honest scarcity, not temporary inconvenience.


    ☀️💧 Sun and Water Requirements:

    Full sun; shade quickly thins stands. Well-drained, often calcareous or sandy soils; excellent drought tolerance after
    establishment. Avoid irrigation schedules designed for bluegrass cosplay.


    ✂️ Propagation:

    Sow seed in warm soil after frost risk; keep seed shallow. Divide small clumps in spring if you must increase known material.
    Control early weeds aggressively—shortgrass seedlings are not competitive celebrities.


    🌾 Harvest / Best Use Timing:

    For grazing systems, follow local range guidelines for warm-season utilization and recovery. For gardens, enjoy summer
    flowering combs and leave seed for birds into fall. Mow or burn per ecological plan—random scalp mowing is not a management
    strategy.'
