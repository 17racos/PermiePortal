  description: 'Syzygium australe is an Australian rainforest margin tree or hedge plant, widely sold as brush cherry or lilly
    pilly, with glossy leaves, fluffy white flowers, and crisp pink to magenta fruit used in jams and sauces where acidity
    is balanced. Plants reach 15–40 feet (4.5–12 m) depending on cultivar and pruning. It responds well to shearing for screens
    while still feeding birds when fruit is allowed to ripen.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright partial shade; best fruiting in strong light with steady moisture. Rich, well-drained soils suit it;
    mulch to buffer roots in heat. Wind protection reduces leaf tatter; short drought once established is tolerated with tip
    burn honesty.


    ✂️ Propagation:

    Sow fresh seed; semi-hardwood cuttings for hedge clones. Prune hedges after flowering waves to maintain density without
    interior dieback.


    🌾 Harvest / Best Use Timing:

    Pick fruit when color deepens and flesh yields slightly—process quickly into sauces or ferments. Peak loads track warm
    wet periods rather than temperate calendars.'
