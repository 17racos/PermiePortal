  description: "Sida (Sida rhombifolia) is a warm-climate mallow relative of fields,
    roadsides, and disturbed ground throughout tropical and subtropical Americas and
    beyond. Upright to sprawling stems carry yellow flowers and small dry fruits; stems
    yield coarse fiber in traditional systems. It can behave as a weed in agriculture
    yet still functions as a summer nectar plant and erosion stitch on brutal soils.\n\n
    ☀️💧 Sun and Water Requirements:\nFull sun for strongest growth and flowering;
    tolerates part shade with lax habit. Tolerates drought and poor soils once established;
    also accepts irrigated garden conditions where it grows faster—often unwelcome
    there. Drainage should prevent chronic root rot in cool wet winters at northern
    range limits.\n\n✂️ Propagation:\nSelf-sows freely; sow seed after last frost
    in warm soil. Cut back before seed set in managed beds if containment matters.
    Not typically divided; treat as short-lived perennial or annual northward.\n\n
    🌾 Harvest / Best Use Timing:\nFiber-focused harvests cut stems at early bloom
    before lignification climbs; rett and rinse carefully. For ecology, leave late
    flowers for bees; collect seed only in controlled trials to avoid spreading invasives."
  purpose: |-
    - Fiber: Bast from stems supports rough cordage and traditional textile experiments where labor and isolation allow.
    - Pollinator: Open yellow mallow flowers feed bees in hot months.
    - Wildlife Attractor: Seeds feed birds in weedy edges; foliage hosts some specialist herbivores.
    - Ground Cover: Low-branching forms can knit disturbed ground until intentional plantings establish.
