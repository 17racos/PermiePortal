  companions:
  - Carrot (Daucus carota) — staggered root/leaf layering keeps space productive and improves bed structure.
  - Radish (Raphanus sativus) — quick rooting loosens and creates a rotation rhythm that complements lettuce’s fast harvest.
  - Garlic (Allium sativum) — strong aroma disrupts pest travel paths around cool-season greens.
  cautions:
  - Bolting in heat is normal; use shade cloth or shift sowing windows to cool periods.
  practitioner_notes: |-
