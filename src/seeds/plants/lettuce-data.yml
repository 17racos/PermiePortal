  description: |-
    Lettuce (Lactuca sativa) is a cool-season leafy crop grown for crisp greens eaten fresh and for its ability to keep producing when the weather stays reasonable. It forms low rosettes or loose heads depending on variety, and plants typically reach 15–30 cm (6–12 in) tall. In permaculture, it matters because it turns short-season space into repeatable harvests and its quick leaf cover helps reduce bare-soil evaporation and soil temperature swings for the next crop.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; partial shade reduces bolting and bitterness in warm spells.
    - Keep moisture consistent; drying triggers bitterness and speeds flowering.
    - Prefers fertile, well-drained soil amended with compost.
    - Avoid wet, stagnant beds; root stress invites rot.
    
    ✂️ Propagation:
    - Seeds: direct-sow in cool weather; germination often takes 2–7 days depending on temperature.
    - Succession sowing: repeat every 1–2 weeks to spread harvest and reduce “all-at-once” disappointment.
    - Thinning: thin early so plants form usable heads instead of crowded leaf pile regret.
    
    🌾 Harvest / Best Use Timing:
    - Harvest leaves young using cut-and-come-again, or harvest heads when they reach desired size.
    - Pick in the cool part of the day for best texture.
    - When bolts, let some flower for pollinator support and seed harvest if needed.
