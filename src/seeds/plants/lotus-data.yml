description: |-
  Lotus is the poster child for emergent aquatics—huge peltate leaves, flowers that look like they hired a stylist, and rhizomes humans have eaten for millennia when prepared correctly. Nelumbo lutea is the yellow American cousin; nucifera is the pink/white cultigen complex most people picture.

  Pick hardy cultivars for outdoor ponds in 8b/9a; tropical types need winter protection or greenhouse tubs. Deep water over rhizomes reduces temperature swings.

  Full sun for bloom.
  Shallow to moderate depth over rich mud; calm water—lotus hates chop like a bad hair day.

  Division of rhizome sections with growing tips; seed scarification and patience for the botanically stubborn.

  Dig rhizomes and gather seeds when traditional processing steps are understood; young stems only with positive ID and kitchen knowledge.
purpose: |-
  Edible: Nelumbo nucifera rhizomes starch like potatoes when cooked through, while seeds need scarification and roasting knowledge -- young stems enter Asian stir-fry only with positive ID and clean water.
  Ornamental: Peltate leaves and pink-white flowers taller than the waterline read temple formal -- site in wide tubs so rhizomes cannot crack concrete liners from inside.
  Wildlife Attractor: Flowers feed beetles and bees while pads give perch for dragonflies -- fish balance matters; koi without rock barriers shred fresh rhizome tips.
    Water Purification: Submerged rhizomes and leaf canopy reduce algae pressure -- nutrient uptake from pond water measurably lowers phosphorus load in closed aquatic systems.
