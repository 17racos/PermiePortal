  description: "Lotus is the poster child for emergent aquatics—huge peltate leaves,
    flowers that look like they hired a stylist, and rhizomes humans have eaten for millennia
    when prepared correctly. Nelumbo lutea is the yellow American cousin; nucifera is
    the pink/white cultigen complex most people picture.\n\nPick hardy cultivars for outdoor ponds in 8b/9a; tropical types need winter protection
    or greenhouse tubs. Deep water over rhizomes reduces temperature swings.\n\nSun
    and water: Full sun for bloom. Shallow to moderate depth over rich mud; calm water—lotus
    hates chop like a bad hair day.\n\nPropagation: Division of rhizome sections with
    growing tips; seed scarification and patience for the botanically stubborn."
  purpose: |-
    Edible rhizome, seeds, and young stems where processing knowledge exists; stunning
