  description: 'Wild indigo is the yellow-flowered Baptisia cousin—shorter, scrappier, and happy on sandier, drier ground
    than some of the big blue false indigos. Deep roots; moving mature plants is a negotiation you lose.


    Solid through 9a in well-drained sites; hates wet winter stagnation more than a little summer roast.


    Sun and water: Full sun for stiff stems and bright bloom. Lean to average, well-drained soil; drought-tolerant once established.

    ✂️ Propagation:

    Scarified seed; young divisions; avoid repeated transplant tantrums.'
  purpose: '- Nitrogen Fixer: Yellow baptisia fixes nitrogen in lean, dryish perennial beds where wet-loving legumes would
    rot or sulk.

    - Ornamental: Bright pea flowers and fine-textured foliage read lighter than shrubby blue false indigo—good for sunny,
    fast-draining drama.

    - Wildlife Attractor: Long-tongued bees work the blooms when many generalist flowers are too shallow to bother with.

    - Dynamic Accumulator: Deep roots pull subsoil minerals upward; cut or drop dormant tops responsibly and you recycle that
    pump without bagged inputs.'
