  description: |-
    Wild indigo is the yellow-flowered Baptisia cousin—shorter, scrappier, and happy on sandier, drier ground than some of the big blue false indigos. Deep roots; moving mature plants is a negotiation you lose.
    
    Solid through 9a in well-drained sites; hates wet winter stagnation more than a little summer roast.
    
    Sun and water: Full sun for stiff stems and bright bloom. Lean to average, well-drained soil; drought-tolerant once established.
    ✂️ Propagation:
    Scarified seed; young divisions; avoid repeated transplant tantrums.
    
    🌾 Harvest / Best Use Timing:
    - For Wild Indigo, harvest timing follows the primary function you planted for -- flowers, fodder, mulch, or structure.
    - Coppice or prune dormant windows where winters exist; subtropical plants often prefer dry-season cuts.
    - Always sanitize tools between diseased and clean plants -- drama spreads faster than newsletters.
  purpose: |-
    Nitrogen Fixer: Wild Indigo hosts root-zone nitrogen partnerships typical of its family so neighboring feeders trade sugars for usable N -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Ornamental: Wild Indigo earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Wild Indigo layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Dynamic Accumulator: Dynamic accumulation shows up where roots mine depth: Deep roots; moving mature plants is a negotiation you lose. -- moves minerals from deep or marginal horizons into chop-and-drop cycles your heavy feeders can bank on
