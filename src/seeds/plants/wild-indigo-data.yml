  practitioner_notes: 'Do not yank test nodules off every root—sacrifice one plant, not the whole stand’s recovery.

    Watch the plant’s own signals first—catalog zone numbers do not replace your site’s microclimate truth.

    Inoculate with the correct rhizobia group—wrong packet gives pretty leaves and empty nodules.

    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.'
