  description: "Bog bean (Menyanthes trifoliata) is a circumboreal aquatic perennial
    with creeping rhizomes, glossy trifoliate leaves that rise above the water, and
    clusters of fuzzy white-to-pink flowers with fringed petals. In cold, acidic bogs
    and pond margins it forms expanding mats; foliage typically reaches 15–45 cm (6–18
    inches) above the surface.\n\n🌞💧 Sun and Water Requirements:\n- Full sun to
    light shade; flowers best with good light.\n- Requires cool, oxygenated shallow
    water or saturated peat—classic bog-garden species. In subtropical and tropical Americas
    it is a specialty plant for highland ponds, shaded spring runs, or artificially
    cooled demonstration pools; lowland tropical heat often limits long-term success.\n-
    Never allow rhizomes to dry; avoid hot, stagnant, anaerobic muck.\n\n✂️ Methods
    to Propagate:\n- Division: Slice rhizomes in late winter while dormant in cool
    climates; anchor pieces in aquatic baskets with acidic mix.\n- Seeds: Sow on
    wet sphagnum surface; germination is slow and benefits from cold stratification.\n\n🌾
    Harvest / Best Use Timing:\n- Do not wild-harvest sensitive bog species; in garden
    settings, thin excess rhizomes in cool months to manage spread and share divisions."
