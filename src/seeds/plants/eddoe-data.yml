scientific_name: Colocasia esculenta (eddoe type)
aka:
- Taro (corm type)
- Malanga isleña
family: Araceae
zone: 8-12
ideal_temp_min: 70
ideal_temp_max: 95
min_temp: 35
max_temp: 110
perennial: true
layers:
