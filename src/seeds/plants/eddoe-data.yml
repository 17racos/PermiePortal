    It grows big, elephant-ear leaves and starchy corms used like potato or taro. In
    subtropical and tropical Americas you treat it as a long-season annual or lift corms before hard frost;
    humid summers are its happy place.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n-
    Part sun to full sun; some afternoon shade helps in brutal heat.\n- Consistently
    moist, rich soil for best corm bulk; tolerates brief wet feet better than true
    desert crops.\n- Mulch heavily to hold moisture and feed the soil food web.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Corm division: Split offsets when dormant in warm soil.\n-
    Suckers: Separate pups from the mother clump at the start of the growing season.\n-
    Not a beginner seed crop — buy known eddoe types, not random ornamental elephant
    ear.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Dig corms
    after tops yellow or before first killing frost.\n- Cure briefly in shade with
    airflow before storage.\n- Leaves must be cooked; do not eat raw."
  purpose: |-
