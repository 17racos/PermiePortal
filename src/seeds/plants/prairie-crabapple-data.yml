  description: "Prairie crabapple (Malus ioensis) is a small native tree of central North American prairies and savannas, famous for fragrant pink spring blossoms and small yellow-green fruit that hangs into winter for birds. Heights of 15–25 feet (4.5–7.5 m) are typical, often with a broad crown and occasional thorns on wild forms. It is a hardy rootstock candidate, hedgerow anchor, and pollinizer for orchard apples where cross-compatibility is confirmed.\n\n☀️💧 Sun and Water Requirements:\nFull sun for best flowering and fruiting; tolerates light shade with fewer blooms. Average to moist, well-drained soils suit it; tolerates clay if drainage is not stagnant. Mulch to reduce grass competition while young; deep watering speeds establishment in dry years.\n\n✂️ Propagation:\nSow stratified seed; seedlings vary in thorniness and fruit quality. Graft cultivars onto seedling roots for predictable ornament or fruit. Prune for an open vase shape to improve airflow and reduce scab pressure.\n\n🌾 Harvest / Best Use Timing:\nFruit is small and tart—jelly, pectin, and wildlife food are honest uses. Pick after color ripens and before complete bird depredation if humans want a share. Bloom timing tracks local spring warmth after hard freezes near 24°F (-4°C) risk passes."
  purpose: |-
