  description: "The Avocado tree is a fast-growing, evergreen tree that can reach
    heights of 12-18 meters (40-60 feet), depending on the variety. It has large,
    dark green, glossy leaves and produces small, greenish-yellow flowers. The tree
    bears large, pear-shaped fruits containing creamy, nutrient-rich flesh surrounding
    a large seed. Avocado trees require well-drained, rich soil and thrive in warm,
    humid environments.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nAvocado
    trees require full sun and grow best in well-drained, sandy or loamy soils with
    a slightly acidic to neutral pH. They need consistent moisture but do not tolerate
    waterlogging. Mulching helps retain soil moisture and regulate temperature.\n\n✂️\U0001FAD8
    Methods to Propagate:\nAvocados can be propagated from seeds, but for consistent
    fruit quality, grafting onto rootstock is preferred. Seed-grown trees can take
    8-10 years to bear fruit, while grafted trees start producing within 3-5 years.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nAvocado fruit does not ripen on the tree. Harvesting occurs
    when fruits reach full size, typically 6-12 months after flowering. Fruits are
    picked while still firm and allowed to ripen at room temperature."
