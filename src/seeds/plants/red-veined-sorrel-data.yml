  description: 'Red veined sorrel is a hardy perennial forming clumps of vibrant green leaves accented with deep red veins.
    The leaves offer a sharp, lemony flavor and can be harvested young for salads or when mature for cooking. The plant reaches
    about 30 cm in height and is both decorative and edible, making it suitable for ornamental gardens and containers.


    🌞💧 Sun and Water Requirements:

    Grows best in full sun to partial shade and prefers moist, well-drained soil. It can tolerate wet conditions and is suitable
    for planting near ponds or in bog gardens.


    ✂️🫘 Methods to Propagate:

    Propagate by sowing seeds directly into the garden in spring or by dividing established plants. Seeds can also be started
    indoors and transplanted after the last frost.


    🧑‍🌾👩‍🌾 When to Harvest:

    Harvest young leaves as needed throughout the growing season. Regular harvesting encourages new growth and prevents the
    plant from becoming too tall or flowering prematurely.'
