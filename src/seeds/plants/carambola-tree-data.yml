  description: "Carambola or star fruit (Averrhoa carambola) is a small evergreen
    to semi-deciduous tropical tree grown for crisp, ribbed yellow fruit that slices
    into stars, with flavor ranging from tart to sweet depending on cultivar and ripeness.
    It typically reaches 20–35 feet (6–10.5 m) with a rounded crown and compound leaves
    sensitive to wind desiccation. In humid subtropical and tropical home orchards it
    is a high-visual crop—plan for oxalate sensitivity in diets and for fruit drop if
    you park beneath the canopy.\n\n☀️💧 Sun and Water Requirements:\nFull sun for
    heaviest flowering and fruiting; young trees benefit from wind protection. Prefers
    deep, fertile, well-drained soils with steady moisture during fruit expansion; drought
    during sizing causes fruit split and drop. Protect from frost; damage begins not
    far below 32°F (0°C) on tender growth.\n\n✂️ Propagation:\nGraft named cultivars
    for sugar balance and productivity; seedlings vary wildly. Air-layer proven limbs
    in warm, humid weather. Prune to open the center for light and air—dense twig clouds
    invite sap feeders.\n\n🌾 Harvest / Best Use Timing:\nPick when ribs yellow and
    fruit yields slightly—green fruit stays tart for cooking; overripe fruit loses texture
    fast. Slice crosswise for the star gimmick; process extras into dehydrator sheets
    before fruit flies charter a convention."
