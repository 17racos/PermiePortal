  description: "Sea purslane is the succulent carpet of coastal flats—fleshy leaves, reddish
    stems, and the casual ability to drink brackish water while your lettuce throws
    a fit. Young tips are eaten in some cuisines; ID carefully and respect local harvest
    rules near protected shores.\n\nNative-ish coastal
    vibe along both coasts; great for salty swales, living shoreline buffers, and “nothing
    else will grow here” beds.\n\nSun and water: Full sun. Tolerates salt spray and periodic
    inundation; also handles garden irrigation if drainage exists—do not marinate it
    in stagnant muck.\n\nPropagation: Cuttings root obnoxiously easily; seed where legal
    and ecologically appropriate."
