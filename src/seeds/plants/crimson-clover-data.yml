  companions:
  - Oats (Avena sativa) — cereal “straw” partners thicken biomass and improve residue layering after crimson clover breaks down.
  - Comfrey (Symphytum officinale) — deep taproot mineral mining plus chop-and-drop complements clover mulch timing in many food-forest transitions.
  - Garlic (Allium sativum) — cool-season rotation use; clover cover helps stabilize the bed and supplies nitrogen inputs before garlic demand peaks.
  cautions:
  - Manage reseeding: if you let too much set seed, crimson clover can volunteer later and crowd slower crops.
  practitioner_notes: |-
    Mow before seed pods tighten—once seeds mature, you’ve basically planted future weeds.
    Keep the seedbed lightly compacted after sowing for good soil contact; clover seeds want to touch moisture.
    Don’t plant crimson clover for long-term summer coverage; plan your heat-season swap.
