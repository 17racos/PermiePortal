field_observations: |-
  Mow before seed pods tighten—once seeds mature, you’ve basically planted future weeds.
  Keep the seedbed lightly compacted after sowing for good soil contact; clover seeds want to touch moisture.
  Don’t plant crimson clover for long-term summer coverage; plan your heat-season swap.
