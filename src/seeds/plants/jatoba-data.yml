  description: 'Jatoba is a massive neotropical legume tree with resinous drama, hardwood timber dreams, and a podded fruit
    that tastes better than its playground nicknames suggest—when fully ripe and properly handled.


    Frost-free lowlands suit in-ground culture; outside the warmest coastal pockets treat it as marginal unless you accept
    occasional cold damage—collector or greenhouse logic applies in cooler subtropical zones.


    ☀️💧 Sun and Water Requirements:


    Full sun for strong architecture and reliable flowering.

    Deep, well-drained soil; established trees tolerate seasonal dry periods typical of savanna and forest-edge habitats.


    ✂️ Propagation:


    Fresh seeds after scarification; germination improves with warmth and moisture.

    Long taproot—transplant young or plan permanent placement; field-grown stock resents root disturbance.


    🌾 Harvest / Best Use Timing:


    Fruit pulp when pods mature and aroma peaks—regional recipes use ripe pulp for drinks and sweets.

    Timber only where legal, sustainable, and sized for the site; this is a lifetime canopy commitment, not a patio impulse.'
  purpose: '- Edible: Starchy-aromatic pulp for regional beverages and sweets where processing is known.

    - Timber: High-value wood where legal, sustainable, and matched to rotation length.

    - Wildlife Attractor: Fallen fruit feeds ground-level wildlife in large tropical systems.

    - Nitrogen Fixer: Legume canopy that supports guild fertility through nodulated roots.'
  companions:
  - Cacao — shade-loving understory crop that appreciates dappled light and humidity under a tall legume canopy where management
    keeps air movement.
  - Papaya — fast soft-wood pioneer that uses light before jatoba closes the canopy; similar tropical soil and irrigation
    logic on well-drained sites.
  - Grumichama — smaller myrtle relative for the shrub layer; shares fruit-garden guild aesthetics without competing for the
    upper canopy.
  cautions:
