description: |-
  Jatoba is a massive neotropical legume tree with resinous drama, hardwood timber dreams, and a podded fruit that tastes better than its playground nicknames suggest—when fully ripe and properly handled.

  Frost-free lowlands suit in-ground culture; outside the warmest coastal pockets treat it as marginal unless you accept occasional cold damage—collector or greenhouse logic applies in cooler subtropical zones.

  Full sun for strong architecture and reliable flowering.
  Deep, well-drained soil; established trees tolerate seasonal dry periods typical of savanna and forest-edge habitats.

  Fresh seeds after scarification; germination improves with warmth and moisture.
  Long taproot—transplant young or plan permanent placement; field-grown stock resents root disturbance.

  Fruit pulp when pods mature and aroma peaks—regional recipes use ripe pulp for drinks and sweets.
  Timber only where legal, sustainable, and sized for the site; this is a lifetime canopy commitment, not a patio impulse.
purpose: |-
  Edible: Hymenaea courbaril pods yield mealy pulp around seeds that sweetens into caramel notes when fully ripe -- regional drinks and sweets start there; ignore playground nicknames until you taste a properly aged pod.
  Wildlife Attractor: Large woody pods hit the litter layer for agoutis, peccaries, and beetles -- leave some pods uncollected if ground wildlife pantry matters on large lots.
  Nitrogen Fixer: Root nodules partner with rhizobia typical of detarioide legumes -- leaf litter and root turnover bank nitrogen into tropical guild soils beneath cacao without urea passes.
