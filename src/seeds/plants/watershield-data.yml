  description: |-
    Brasenia schreberi is a native floating-leaf plant whose oval pads sit under the water surface just enough to look like stained glass from above. New stems and leaf undersides coat themselves in a gelatinous slime — nature's weird sunscreen — which historically was eaten in some cultures after careful preparation. Fish and waterfowl use it for cover; dragonflies love the real estate.
    
     It spreads by rhizomes and can colonize calm ponds across subtropical and tropical Americas. Balance with emergents so you still have open water for circulation.
    
    ☀️💧 Sun and Water:
    - Full sun to part shade.
    - Quiet, acidic to neutral water; rooted in soft bottom sediments.
    - Not for fast streams or chlorinated pools.
    
    ✂️ Propagation:
    - Rhizome division while dormant or early growth.
    - Seed is possible but division is the practical backyard route.
    
    🌾 Harvest / Best Use Timing:
    - Harvest Watershield in warm active growth when leaves or shoots look crisp, before yellow water-stress marches in.
    - Morning picks ship better than wilted afternoon drama -- rinse grit in clean water, not pond soup.
    - Use quickly or blanch and freeze; aquatic tissues turn slimy faster than upland herbs in plastic bags.
  purpose: |-
    Edible: Brasenia schreberi young leaves and stems carry edible mucilage after indigenous prep sequences -- slime is the feature; research tribal protocols before foraging projects.
    Wildlife Attractor: Floating oval pads give dragonflies perches and sunfish shade -- gelatinous coating deters grazers enough to leave habitat structure intact.
    Border Plant: Rooted rhizomes mark the deep-to-shallow transition with understated oval pads -- pairs with spatterdock where you want native texture without lotus drama.
  companions:
  - Floating Heart
  - Spatterdock
  - Duck Potato
  cautions:
