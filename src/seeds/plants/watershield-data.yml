  description: "Brasenia schreberi is a native floating-leaf plant whose oval pads
    sit under the water surface just enough to look like stained glass from above.
    New stems and leaf undersides coat themselves in a gelatinous slime — nature's
    weird sunscreen — which historically was eaten in some cultures after careful
    preparation. Fish and waterfowl use it for cover; dragonflies love the real estate.\n\n
    It spreads by rhizomes and can colonize calm ponds across Florida and Puerto Rico. Balance
    with emergents so you still have open water for circulation.\n\n☀️💧 Sun and Water:\n-
    Full sun to part shade.\n- Quiet, acidic to neutral water; rooted in soft bottom
    sediments.\n- Not for fast streams or chlorinated pools.\n\n✂️ Propagation:\n-
    Rhizome division while dormant or early growth.\n- Seed is possible but division
    is the practical backyard route."
  purpose: |-
    Watershield is a native floater with forage cred:

    - Edible: Young mucilage-covered parts documented in some traditions — ID and prep matter.
    - Wildlife Attractor: Structure for fish, amphibians, and insects.
    - Border Plant: Naturalizes the deep-to-shallow transition in ponds.
