  practitioner_notes: |-
    Thin stems in humid summers—open the clump like a vase or mildew camps inside.
    Rhizomes travel under mulch—edging or annual spade cuts keep neighbors from becoming bee balm colonies.
    Hummingbirds prefer red cultivars; bees still work lighter pinks—plant both if you want traffic diversity.
