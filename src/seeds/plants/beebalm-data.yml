  description: "Bee Balm (Monarda didyma) is a hardy, herbaceous perennial known for
    its vibrant red, pink, or purple flowers that attract bees, butterflies, and hummingbirds.
    The plant grows between 60–120 cm (2–4 feet) tall with square stems and aromatic,
    lance-shaped leaves.\n\nIt thrives in moist, well-drained soil and spreads via
    rhizomes, forming dense patches over time. The flowers bloom from mid to late
    summer, providing a long-lasting nectar source. Bee Balm is commonly grown in
    pollinator gardens, herbal medicine gardens, and as a companion plant in vegetable
    gardens.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full
    sun but tolerates partial shade.\n- Grows best in rich, well-drained soil with
    consistent moisture.\n- Moderate water needs; avoid waterlogging to prevent powdery
    mildew.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Start indoors 8–10 weeks
    before the last frost or direct sow in spring.\n- Division: Easily propagated
    by dividing root clumps in early spring or fall.\n- Cuttings: Stem cuttings can
    be rooted in water or moist soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Leaves can be harvested anytime during the growing season
    for tea or fresh use.\n- Flowers should be harvested at peak bloom for medicinal
    or culinary purposes.\n- Regular pruning promotes new growth and extends the flowering
    season."
