  description: "Cassia alata—now classified as Senna alata—is a fast-growing tropical
    shrub or soft-wooded perennial to about 2–4 m (6–13 feet), famous for vertical
    spikes of bright yellow flowers that resemble rows of candles. Large pinnate
    leaves close at night; plants seed readily in frost-free climates.\n\n🌞💧 Sun
    and Water Requirements:\n- Full sun for dense growth and heavy bloom.\n- Fertile,
    well-drained soil; tolerates seasonal moisture in the wet season but not prolonged
    root drowning. In subtropical and tropical Americas it performs as a rank-growing wet-season
    ornamental—prune after bloom to control height and self-seeding.\n- Regular water
    during establishment; somewhat drought-tolerant when older.\n\n✂️ Methods to Propagate:\n-
    Seeds: Scarify lightly and soak overnight; sow warm; germinates quickly.\n-
    Cuttings: Take greenwood cuttings during the growing season under humidity.\n\n🌾
    Harvest / Best Use Timing:\n- Collect dry pods before they shatter if you want
    controlled seed. Medicinal topical use appears in traditional literature—verify
    safety and local regulations before experimenting on skin."
  purpose: |-
    Senna alata is a tropical guild anchor—showy biomass, not a nitrogen bank:

    - **Medicinal**: Folkloric leaf preparations target ringworm and other skin complaints; potency varies and mis-ID is dangerous—treat it like a pharmacy, not a meme.
    - **Biomass**: Rank wet-season growth can be pruned into mulch around hungry crops (unlike true N-fixers, this is carbon and potassium logistics, not free nitrogen from the air).
    - **Ornamental**: Obvious vertical yellow architecture along fences and pond edges.
    - **Wildlife Attractor**: Flowers draw pollinators; foliage hosts sulphur butterflies in regions where they overlap—plan for caterpillar leaf loss.
  companions:
