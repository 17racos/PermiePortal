  description: 'Cassia alata—now classified as Senna alata—is a fast-growing tropical shrub or soft-wooded perennial to about
    2–4 m (6–13 feet), famous for vertical spikes of bright yellow flowers that resemble rows of candles. Large pinnate leaves
    close at night; plants seed readily in frost-free climates.


    🌞💧 Sun and Water Requirements:

    - Full sun for dense growth and heavy bloom.

    - Fertile, well-drained soil; tolerates seasonal moisture in the wet season but not prolonged root drowning. In subtropical
    and tropical Americas it performs as a rank-growing wet-season ornamental—prune after bloom to control height and self-seeding.

    - Regular water during establishment; somewhat drought-tolerant when older.


    ✂️ Methods to Propagate:

    - Seeds: Scarify lightly and soak overnight; sow warm; germinates quickly.

    - Cuttings: Take greenwood cuttings during the growing season under humidity.


    🌾 Harvest / Best Use Timing:

    - Collect dry pods before they shatter if you want controlled seed. Medicinal topical use appears in traditional literature—verify
    safety and local regulations before experimenting on skin.'
