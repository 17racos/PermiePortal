  description: 'Chickpea (*Cicer arietinum*), also known as garbanzo bean, is an annual legume that grows up to 20–50 cm (8–20
    inches) tall. It has small, feathery pinnate leaves and produces white, pink, or purple flowers. Each plant bears small,
    inflated pods containing 1–3 round seeds, which are widely consumed worldwide. Chickpeas thrive in arid and semi-arid
    climates due to their deep taproots that allow them to access groundwater efficiently.


    🌞💧 **Sun and Water Requirements:**

    Chickpeas prefer full sun and well-drained soil with moderate moisture. They are drought-tolerant but require some irrigation
    during flowering and pod development.


    ✂️🫘 **Methods to Propagate:**

    Propagation is done by direct seeding. Sow seeds 2.5–5 cm deep and space plants 7.5–15 cm apart in rows 45–60 cm apart.
    Best planted in early spring when soil temperatures reach at least 50°F (10°C).


    🧑‍🌾👩‍🌾 **When to Harvest:**

    Harvest occurs when plants dry out and turn brown, typically 90–100 days after planting. Pods can be picked by hand or
    harvested mechanically.'
