  description: 'The genus Artocarpus groups mulberry-relatives such as breadfruit (Artocarpus altilis) and jackfruit (Artocarpus
    heterophyllus), staple canopy trees across humid tropical and subtropical regions grown for massive starchy or sweet fruits,
    timber, and leaf fodder. Mature trees form a deep, glossy canopy often 40–60 feet (12–18 m) or more, with milky latex
    and strong lateral roots that command space. In multistory food systems they are carbohydrate banks and shade engines—plan
    understory light budgets accordingly.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; young plants appreciate wind protection. Deep, fertile, well-drained soils support sustained
    yields; drought-stressed trees abort fruit. Irrigation during dry season builds starch in breadfruit; jackfruit benefits
    from even moisture during rapid fruit expansion. Frost near 32°F (0°C) damages young growth; mature wood tolerates brief
    cool snaps only in marginal zones.


    ✂️ Propagation:

    Breadfruit is often propagated by root shoots or grafted clones because seedless forms dominate cultivation. Jackfruit
    grows from large fresh seeds sown immediately; grafting captures superior fruit lines. Air-layering works on many tropical
    Moraceae during warm, humid months.


    🌾 Harvest / Best Use Timing:

    Breadfruit picks green for cooking stages or ripe for softer preparations depending on cultivar use-class. Jackfruit harvests
    when rind yields aromatic cues and color shifts—handle latex with oil and gloves. Process large fruits in planned sessions;
    industrial influencers rarely mention cleanup time.'
  purpose: '- Edible: Breadfruit and jackfruit deliver starchy or sweet bulk for household and community kitchens.

    - Shade Provider: Broad evergreen to semi-evergreen canopy cools understory for shade-tolerant crops.

    - Mulcher: Large leaves build rapid litter banks that feed soil fauna when left in place.

    - Animal Fodder: Leaves and culled fruit feed livestock and poultry in integrated systems where diets allow.

    - Windbreaker: Wide crowns and tough wood reduce wind stress on downwind beds and structures.'
  companions:
