  practitioner_notes: |-
    Peel thickness varies by season—thin skins bruise faster at peak sugar.
    Navels can granulate in hot, dry finishes; water honesty beats panic foliar feeds.
    If the ‘navel’ grows weird on young fruit, that is biology, not a moral failing.
    Store fruit with ventilation; plastic bags invite mold parties.
