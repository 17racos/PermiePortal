  description: "Navel orange is a seedless (or nearly seedless) sweet orange (Citrus sinensis) selection famous for easy-peeling
    fruit and a secondary ‘navel’ at the blossom end. Evergreen trees carry glossy foliage and heavy spring fragrance, producing
    table-quality oranges where heat units and irrigation line up in humid subtropical orchards. It is a household staple
    because fresh-eating quality is high and kitchen waste is minimal compared with seedy types.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun drives sugar and peel thickness appropriate to handling.\n- Deep, infrequent watering once established; short
    pulses that only wet the top few inches train shallow roots and invite stress.\n- Protect blooms and young fruit from advective
    freezes; mature wood tolerates brief dips better than flowers.\n\n✂️ Propagation:\n- Commercial trees are grafted clones
    so the navel trait stays stable.\n- Seeds do not reproduce true navel morphology—do not plant grocery seeds for this
    goal.\n- Topworking can convert an older sweet orange scaffold if compatibility and sanitation are respected.\n\n🌾 Harvest
    / Best Use Timing:\n- Pick when sugar/acid tastes right; navels do not improve off-tree like some pears.\n- Clip stems
    to avoid torn peel entries for decay organisms.\n- Juice promptly if you freeze; navels can turn bitter in storage compared
    with juicing oranges—taste small batches first."
