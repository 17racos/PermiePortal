description: |-
  Okra (Abelmoschus esculentus) is a warm-season crop grown for its edible seed pods and tender leaves. It forms a sturdy, upright plant with large hibiscus-like flowers, typically 1–2 m (3–6 ft) tall depending on variety and growing conditions. Originating in tropical Africa and widely cultivated across warm regions worldwide, okra matters in permaculture because it turns heat into food while also producing blossoms that keep pollinators active during the hottest stretch of the season. Its deep roots and dense foliage can also help shade soil and slow evaporation when you plant it well.

  Full sun is required for strong flowering and pod production; shade reduces yield. Water regularly while plants grow; drought makes pods tough and reduces harvest volume. Prefers fertile, well-drained soil with compost; waterlogged beds invite root disease. Handles humid subtropical conditions better than many temperate vegetables when soil drains well.

  Seeds (direct sow): sow after nights are warm; germination often takes 5–10 days. Seeds (pre-soak): soak overnight to speed emergence where growth feels slow. Succession: sow small batches every 2–3 weeks to keep pods coming longer.

  Harvest pods young and tender (often around 5–10 cm / 2–4 in), cutting frequently to encourage more flowering. Use a sharp knife and don’t tear stems; injured plants slow down. Pods can be cooked fresh, pickled, or dried for later thickening in stews.
purpose: |-
  Animal Fodder: The leaves and stems are often used as high-protein forage -- for chickens and other livestock.
  Edible: Young pods harvest every 2-3 days at 3-4 inches for best texture -- dry or pickle mature pods for year-round storage when fresh harvest peaks.
  Medicinal: Traditional uses emphasize supportive herbal preparations -- in permaculture, that makes okra a practical kitchen-medication crop.
  Dynamic Accumulator: Sturdy taproots penetrate compacted clay -- acts as a biological drill and the fast-growing stems make valuable chop-and-drop mulch.
  Mulcher: Produces abundant biomass for green manure and composting specifically noted -- for mining Calcium, Potassium, and Iron.
  Pollinator: Bright hibiscus-type flowers feed bees and beneficial insects -- when many beds are heat-stressed.
  Wildlife Attractor: Large yellow hibiscus flowers draw bees and beneficial insects -- seed pods left to mature feed birds and support insect populations in the wider guild.
