  description: "This entry describes the same species as wild chiltepin—*Capsicum
    annuum* var. *glabriusculum*—grown as a woody, multi-branched “pepper tree” in
    frost-free subtropical and tropical Americas. Left unpruned in full sun, plants lignify
    at the base and form a broad crown 1–3+ m tall, dripping with tiny hot fruits
    after each bloom cycle. The look is shrubby rather than a true canopy tree, but
    the persistent framework behaves like a small fruiting tree in tropical and subtropical
    yards.\n\n☀️💧 **Sun and Water Requirements:**\nFull sun for woodiness and heavy
    fruit set. Plant in raised beds or mounds where summer rains are relentless;
    water deeply then allow slight dry-down between irrigations once established.\n\n✂️
    **Methods to Propagate:**\n- **Seeds:** Sow in warm weather; select seedlings
    that show strong basal thickening if you want a tree-like habit.\n- **Cuttings:**
    Hardwood to semi-hardwood cuttings taken in the warm season root under mist;
    choose upright mother plants for a naturally vertical frame.\n\n🌾 **When to
    Harvest:**\nStrip ripe red fruits in waves through the year in zone 11 and warm
    zone 10 sites; prune lightly after heavy crops to open the canopy for airflow
    before the wet season."
  purpose: |-
    - **Edible:** Persistent woody plants supply continual pinches of fire for salsa seca, pickles, and fermented hot sauces.
    - **Wildlife Attractor:** Masses of small flowers support pollinators; fruit feeds birds along fencerows.
    - **Border Plant:** Thornless but twiggy density can mark yard edges when combined with lower herbs.
    - **Ornamental:** Red fruit against fine green foliage reads as ornamental color in dry corners and rock gardens.
