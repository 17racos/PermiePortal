  description: 'Southern hawthorn (Crataegus flava) is a small native tree of southeastern North American wood margins, bearing
    showy white spring flowers and yellow to orange pomes ripening in summer—earlier than many hawthorns. Plants reach 15–25
    feet (4.5–7.5 m), often thorny and wide-crowned. Fruit supports jellies for patient cooks; birds arrive for the leftovers.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best fruiting with strong light. Moist, well-drained loams suit it; tolerates clay if drainage
    moves. Mulch to reduce competition; water during establishment droughts.


    ✂️ Propagation:

    Sow stratified seed; graft known selections if you find superior fruit. Prune for open vase shape to reduce leaf diseases.


    🌾 Harvest / Best Use Timing:

    Pick fruit when color shifts fully and flesh yields slightly—process into jelly quickly. Bloom peaks in spring after frost
    risk falls near 32°F (0°C) for local climate.'
