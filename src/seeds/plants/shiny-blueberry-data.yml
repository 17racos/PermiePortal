description: "Shiny blueberry (*Vaccinium myrsinites*) is a low, rhizomatous native\
  \ blueberry of pine flatwoods and sandhills — glossy little leaves, small tasty\
  \ fruit, and a refusal to impersonate a 6-foot northern highbush. It spreads into\
  \ colonies that stabilize sandy acid soils and feed wildlife (and humans who kneel\
  \ politely).\n\nsubtropical and tropical Americas: a righteous native layer under\
  \ pines and with other ericaceous species; do not expect bucket yields — expect\
  \ authenticity.\n\n☀️\U0001F4A7 Sun and Water:\n- Full sun to bright part-shade.\n\
  - Sandy, acidic, well-drained soil; tolerates dry spells once established. Mulch\
  \ with pine needles or pine bark.\n\n✂️ ✂️ Propagation: \n- Rhizome division during\
  \ warm wet weather.\n- Cuttings: softwood or semi-hardwood in humid propagation\
  \ setups.\n- Seeds: cold stratify; slow.\n- Transplant small chunks with roots rather\
  \ than bare rhizome jerky.\n\n\U0001F33E Harvest / Best Use Timing:\n- Shiny Blueberry:\
  \ pick berries when fully colored and detach with a gentle tug -- whitish bloom\
  \ still present is fine.\n- Cool mornings beat hot afternoons for shelf life; chill\
  \ soon if not eating the same day.\n- Freeze dry on trays before bagging so berries\
  \ do not fuse into a single ice meteor."
purpose: |-
  Edible: Vaccinium myrsinites tiny teal berries demand crouching patience yet taste intensely of pine understory resin when sampled off sandhill mats.
  Wildlife Attractor: Thrushes beat you to clusters while spring bell flowers feed specialist bees still waking before canopy closure.
  Ground Cover: Rhizomatous ankle-high thickets stitch wiregrass openings without shading sand oak seedlings.
  Pollinator: Urn-shaped blooms hang early enough to supply nectar before domestic blueberries open two counties north.
