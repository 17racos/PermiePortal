  description: "Shiny blueberry (*Vaccinium myrsinites*) is a low, rhizomatous native blueberry of pine flatwoods and sandhills\
    \ — glossy little leaves, small tasty fruit, and a refusal to impersonate a 6-foot northern highbush. It spreads into\
    \ colonies that stabilize sandy acid soils and feed wildlife (and humans who kneel politely).\n\nsubtropical and tropical\
    \ Americas: a righteous native layer under pines and with other ericaceous species; do not expect bucket yields — expect\
    \ authenticity.\n\n☀️\U0001F4A7 Sun and Water:\n- Full sun to bright part-shade.\n- Sandy, acidic, well-drained soil;\
    \ tolerates dry spells once established. Mulch with pine needles or pine bark.\n\n✂️ ✂️ Propagation: \n- Rhizome division\
    \ during warm wet weather.\n- Cuttings: softwood or semi-hardwood in humid propagation setups.\n- Seeds: cold stratify;\
    \ slow.\n- Transplant small chunks with roots rather than bare rhizome jerky."
  purpose: '- Edible: Small sweet berries — labor-intensive harvest, high flavor per square inch.

