  description: "St. John's Mint (*Clinopodium brownei*), also known as Browne's Savory,
    is a perennial herb native to the southeastern United States. It forms dense mats
    of aromatic foliage, emitting a strong minty scent when crushed. The plant produces
    small, tubular flowers that attract pollinators. Its creeping stems root at the
    nodes, making it an excellent ground cover that can suppress weeds.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nPrefers partial shade to full sun and thrives
    in moist, well-drained soils. It can tolerate occasional flooding and is often
    found in wet habitats.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nPropagation
    is typically achieved through stem cuttings or division. Stems that touch the
    ground readily form roots, allowing for easy establishment of new plants.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nLeaves can be harvested throughout the growing season as
    needed for culinary or medicinal purposes."
  purpose: |-
    - **Edible:** Leaves can be used fresh or dried to add a minty flavor to dishes and teas.
    - **Medicinal:** Traditionally used to treat colds, digestive issues, and as a mild antiseptic.
