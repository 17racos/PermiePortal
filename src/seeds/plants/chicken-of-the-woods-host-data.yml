  description: "Chicken of the woods is the traffic-cone bracket fungus — overlapping
    shelves, often orange to yellow, growing on living or dead hardwoods (and sometimes
    other hosts depending on genetics and who's splitting species this decade). subtropical and tropical Americas has flushes after wet periods; always confirm host, age of specimen, and
    local look-alikes. Some people react badly even to \"safe\" species — first
    small taste still applies. The host tree is often already stressed; do not pretend
    the fungus is decorating a healthy sentinel.\n\n☀️💧 Sun and Water:\n- Natural
    fruiting on trunks and large limbs; partial sun to shade.\n- Rain cycles trigger
    growth; cannot be micro-managed like a tomato.\n- Keep vulnerable landscape trees
    pruned for structure if brackets signal internal decay.\n\n✂️ Propagation:\n-
    Mostly wild observation; cultivation on stumps or logs is experimental hobby
    territory.\n- Respect property and park rules before harvesting."
  purpose: |-
    Chicken of the woods hosts are living decay signals that sometimes feed you:

    - Edible: Popular when young, tender, and verified; cook thoroughly.
    - Mulcher: White-rot speeds wood recycling in the canopy.
    - Wildlife Attractor: Shelves feed insects and the things that eat them.
  companions:
  - Oak
  - Cherry
  - Willow
  cautions:
  - None documented
  pests:
  - Borers
  - Scale Insects
  practitioner_notes: |-
    Harvest young sulfur shelves with moist pores—dry chalky layers are past prime for the table.
    Avoid conifers and eucalyptus—Laetiporus on wrong hosts correlates with GI misery in many foragers’ logs.
    Leave older brackets to sporulate—strip-mining every log ends local patches faster than they rebuild.
    Softer wood hosts rot faster after heavy harvest—take half, photograph location, revisit next season instead of clearing the tree.
  growth_habit: Bracket polypore on hardwood trunks
