field_observations: |-
  Breba vs main crop timing splits by cultivar—label trees before you prune the wrong wood.
  Sap and latex irritate skin—long sleeves when stripping branches in June.
  Root-prune or barrier plantings near slabs—figs lift pavement without asking.
