  description: "Fig (Ficus carica) is a deciduous tree or large shrub that grows between
    3–10 meters (10–33 feet) tall. It has broad, lobed leaves and produces sweet,
    soft, fleshy fruit that varies in color from green to purple when ripe. \n\nFig
    trees are well-adapted to Mediterranean and subtropical climates but can survive
    in cooler regions if protected from frost. They are drought-tolerant once established
    and can grow in a wide range of soil conditions. The tree's deep roots help stabilize
    soil, making it useful for erosion control.\n\n \U0001F31E\U0001F4A7 Sun and Water
    Requirements:\n- Prefers full sun with at least 6–8 hours of sunlight per day.\n-
    Grows best in well-drained, loamy, or sandy soil.\n- Drought-tolerant but benefits
    from occasional deep watering, especially in hot climates.\n\n✂️\U0001FAD8 Methods
    to Propagate:\n- Cuttings: Hardwood cuttings in winter or softwood cuttings in
    early summer.\n- Layering: Air layering works well for propagation.\n- Seeds:
    Can be grown from seeds but often results in variable fruit quality.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Fruit is ready when soft, slightly drooping, and changes color
    (typically summer to early fall).\n- Harvest figs gently to avoid bruising.\n-
    Best eaten fresh, dried, or processed into jams and preserves."
