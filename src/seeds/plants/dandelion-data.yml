  description: "Dandelion (*Taraxacum officinale*) is a hardy, herbaceous perennial
    native to Eurasia, now widespread across temperate regions globally. It features
    a basal rosette of deeply toothed, lance-shaped leaves measuring approximately
    5–25 cm (2–10 inches) in length. The plant produces bright yellow composite flowers
    on hollow, leafless stalks that can reach up to 30 cm (12 inches) tall. Following
    pollination, the flowers develop into spherical seed heads known as \"clocks,\"
    which disperse seeds via wind.\n\n✂️\U0001FAD8 Methods to Propagate:\n- **Seeds:**
    Sow seeds directly on the soil surface in early spring or fall, as they require
    light for germination. Ensure the soil remains moist until seedlings establish.\n-
    **Division:** Mature plants can be divided by carefully excavating the taproot
    and separating offsets, which can then be replanted.\n\n\U0001F31E\U0001F4A7 Sun
    and Water Requirements:\n- **Sun:** Prefers full sun but can tolerate partial
    shade. Optimal growth occurs with at least 6 hours of direct sunlight daily.\n-
    **Water:** Dandelions are drought-tolerant once established but thrive in consistently
    moist, well-drained soils. Overwatering should be avoided to prevent root rot.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- **Leaves:** Young leaves are best harvested in early spring
    before the plant flowers, as they are less bitter. These can be used fresh in
    salads or cooked.\n- **Roots:** Harvest roots in late fall when nutrient concentration
    is highest, typically after the first frost. Roots can be roasted for beverages
    or used in herbal preparations.\n- **Flowers:** Collect fully opened flowers on
    dry, sunny days for use in culinary dishes or to infuse oils."
  purpose: |-
    - Edible: All parts of the dandelion are edible. Young leaves add a slightly bitter note to salads and soups. Roots can be roasted and used as a coffee substitute, while flowers are utilized in making wines and jellies.
    - Medicinal: Traditionally employed for their diuretic and liver-supporting properties. Dandelion roots and leaves are used in herbal medicine to stimulate digestion and support detoxification processes.
    - Dynamic Accumulator: The deep taproot draws up nutrients such as calcium and potassium from the subsoil, enriching the topsoil when the plant decomposes.
    - Pollinator: Early spring blooms provide a crucial nectar source for bees and other pollinators when few other flowers are available.
    - Ground Cover: The dense rosette of leaves helps suppress weeds and protect soil from erosion.
