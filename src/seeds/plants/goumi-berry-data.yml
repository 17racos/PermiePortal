  description: "Goumi berry (*Elaeagnus multiflora*) is a deciduous to semi-evergreen
    shrub from East Asia, widely planted for tart-sweet red speckled fruits and silvery,
    aromatic foliage. Plants typically grow 6–10 feet tall and wide with arching
    branches. It fixes nitrogen via actinorhizal symbiosis. In subtropical and tropical Americas,
    choose a spot with some afternoon shade in the hottest lowlands, good air movement,
    and drainage—fruit flavor is often best where winters are cool enough to provide
    chill hours, though some cultivars fruit in warm winters with adequate cultivar
    selection.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nFull sun to
    light shade. Average water during fruit swell; drought-tolerant once established
    but yields drop without irrigation in dry season. Avoid standing water.\n\n✂️ **Methods
    to Propagate:**\n- **Softwood cuttings:** Take summer cuttings with hormone and
    bottom heat for uniform clones of known cultivars.\n- **Seeds:** Stratify and
    sow; seedlings vary in fruit quality but grow vigorous root systems.\n\n\U0001F9D1‍\U0001F33E
    **When to Harvest:**\nFruits soften slightly and develop full color—often late spring
    into summer depending on climate. Birds love them; net or pick early daily during
    peak ripeness."
