  description: "Tropical almond (Terminalia catappa) is the same species many coastal plantings call sea almond or Indian almond—a large tree with tiered branches, glossy leaves that color before abscission, and fibrous drupes containing edible kernels when roasted properly. Heights of 40–60 feet (12–18 m) are common along tropical shores. This duplicate listing exists for searchers using “tropical almond” language; see Sea Almond entry for parallel copy.\n\n☀️💧 Sun and Water Requirements:\nFull sun for dense crown and reliable fruiting near coasts. Sandy, well-drained soils with seasonal moisture suit it; tolerates salt spray better than many broadleaf trees. Irrigation speeds establishment inland.\n\n✂️ Propagation:\nSow fresh seed; transplant young trees with root integrity. Prune for clearance under wide limbs.\n\n🌾 Harvest / Best Use Timing:\nCollect fallen fruit when husks dry; process kernels with care—fibers are not dental floss. Leaf drop seasons can be messy—plan paths accordingly."
  purpose: |-
    Edible: Tropical Almond yields human food from the parts your description documents -- pods, fruits, leaves, roots, or seeds depending on variety and timing -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Shade Provider: Tropical Almond throws enough canopy to run ginger-class understory or to blunt afternoon heat on west-facing beds -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
    Windbreaker: Tropical Almond builds a living wind-skin tall enough to protect tender crops and tunnel houses from desiccating gusts -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
    Ornamental: Tropical Almond earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
