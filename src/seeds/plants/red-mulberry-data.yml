  description: "Red mulberry (Morus rubra) is a fast-growing deciduous tree native
    to eastern North America, bearing dark sweet fruits that stain fingers and sidewalks
    with equal enthusiasm. Variable leaves may be mitten-lobed; bark becomes chunky
    with age. It is a resilient yard tree for poultry runs, food forests, and silvopasture
    edges where messy fruit is a feature, not a liability.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun for heaviest fruiting; tolerates partial shade with fewer berries.\n-
    Moderate moisture; drought tolerant once established but fruits better with even
    water.\n- Adaptable soils; tolerates clay, sand, and urban edges better than
    many fruit trees.\n\n✂️ Propagation:\n- Seeds: sow fresh after pulp removal;
    stratify if storing.\n- Hardwood cuttings root with bottom heat.\n- Graft named
    selections if you found a truly superior wild tree.\n\n🌾 Harvest / Best Use Timing:\n-
    Pick when berries release easily and stain deep purple—taste before buckets,
    flavor varies by tree.\n- Process quickly into jam, wine, or dried fruit; ripe
    mulberries wait for no one.\n- Prune for clearance under branches if paths or
    vehicles dislike purple rain."
  purpose: |-
    - Edible: Sweet fruits are eaten fresh, dried, or cooked where staining is acceptable.
    - Wildlife Attractor: Fruit feeds birds, mammals, and insects; flowers feed pollinators.
    - Shade Provider: Broad crown cools yards, pens, and understory guilds.
    - Animal Fodder: Poultry and livestock relish fallen fruit in multispecies systems.
  companions:
