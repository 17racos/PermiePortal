  description: 'Red mulberry (Morus rubra) is a fast-growing deciduous tree native to eastern North America, bearing dark
    sweet fruits that stain fingers and sidewalks with equal enthusiasm. Variable leaves may be mitten-lobed; bark becomes
    chunky with age. It is a resilient yard tree for poultry runs, food forests, and silvopasture edges where messy fruit
    is a feature, not a liability.


    ☀️💧 Sun and Water Requirements:

    - Full sun for heaviest fruiting; tolerates partial shade with fewer berries.

    - Moderate moisture; drought tolerant once established but fruits better with even water.

    - Adaptable soils; tolerates clay, sand, and urban edges better than many fruit trees.


    ✂️ Propagation:

    - Seeds: sow fresh after pulp removal; stratify if storing.

    - Hardwood cuttings root with bottom heat.

    - Graft named selections if you found a truly superior wild tree.


    🌾 Harvest / Best Use Timing:

    - Pick when berries release easily and stain deep purple—taste before buckets, flavor varies by tree.

    - Process quickly into jam, wine, or dried fruit; ripe mulberries wait for no one.

    - Prune for clearance under branches if paths or vehicles dislike purple rain.'
