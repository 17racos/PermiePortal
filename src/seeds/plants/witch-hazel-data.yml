  growth_habit: Deciduous large shrub to small tree; uneven-margined leaves; late fall to winter flowers with long straplike petals
  data_quality_score: 0.72
  practitioner_notes: |-
    - Flowers may perfume the gray weeks when little else blooms—plant where you actually walk past in late season.
    - Seed capsules mature over winter and can fling seeds several meters; not aggressive like some invasives, but surprises volunteers near paths.
    - Bark/twig tannins are the traditional extraction target; leaves are not a stand-in for pharmacy-grade material.
    - In hot summer climates, afternoon shade and mulch keep root run cooler than full-sun on thin roadside soil.
