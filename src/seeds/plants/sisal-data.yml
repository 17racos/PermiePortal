    - Leaf harvest for fiber on a staggered schedule once plants mature.\n- Wear gloves; agave does not negotiate."
  purpose: |-
    Fiber: Fiber harvests stay honest about processing labor: Sisal is a giant agave grown for coarse fiber  --  the rope your permaculture uncle swears is ‘more ethical than nylon’ until you try processing it. -- supplies harvestable fiber for cordage, crafts, or mulch substitutes where woody biomass is scarce
    Erosion Control: Sisal networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ornamental: Sisal earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Animal Fodder: Sisal offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan

