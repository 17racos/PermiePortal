description: |-
  Sisal is a giant agave grown for coarse fiber — the rope your permaculture uncle swears is ‘more ethical than nylon’ until you try processing it. Rosettes of sword leaves, eventual flower spike, then the usual agave death after bloom (many clones offset first). In subtropical and tropical Americas it survives light frosts with damage; hard freezes are a personality test.

  Full sun; shade makes floppy, sad swords. Extremely drought-tolerant once established; wet, cold soil invites rot. Sharp drainage; raised beds or berms in rainy subtropics.

  Bulbils and offsets from the base. Tissue culture on the farm-industry side. Seeds rare in commercial clones.

  Leaf harvest for fiber on a staggered schedule once plants mature. Wear gloves; agave does not negotiate.
purpose: |-
  Fiber: Agave sisalana leaf flesh decorticates into stiff sisal tow still twisted into binder twine and dart mats where small factories survive near plantations.
  Erosion Control: Rosetting swords grip tropical road cuts against monsoon runoff until flowering spikes launch and clones replace tired hearts.
  Ornamental: Blue-green saber mounds anchor xeric entrances with Agave grandeur minus century-plant footprint when pups stay managed.
  Animal Fodder: Juice-extracted pulp shows up as cattle roughage trials after fiber mills strip sap -- crude protein stays low so balance with legume hay before trusting textbook recipes.
companions:
  - Century Plant
  - Sedum
  - Cactus
cautions:
  - Heavy clay + summer monsoon + poor airflow
pests:
  - Asparagus Beetle
  - Scale Insects
  - Root Rot
