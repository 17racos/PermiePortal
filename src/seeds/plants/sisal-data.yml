    \ are a personality test.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun; shade makes floppy, sad swords.\n\
    - Extremely drought-tolerant once established; wet, cold soil invites rot.\n- Sharp drainage; raised beds or berms in\
    \ rainy subtropics.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Bulbils and offsets from the base.\n- Tissue culture on the\
