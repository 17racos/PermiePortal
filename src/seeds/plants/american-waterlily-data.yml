  description: "American waterlily (Nymphaea odorata) is a widespread native aquatic
    perennial with floating round leaves and fragrant white (sometimes pink-tinged)
    flowers that open by day across still ponds, lakes, and slow backwaters. Rhizomes
    creep in shallow muck while leaf stalks reach the surface from roughly 1–6 feet
    (0.3–1.8 m) of water depending on form and clarity. It fits permaculture water features
    as a food, medicine, and habitat plant—when used with containment forethought in
    small artificial ponds.\n\n☀️💧 Sun and Water Requirements:\nFull sun for maximum
    bloom; light shade still grows leaves but flowers shy. Requires cleanish, still
    or slow fresh water; tolerates seasonal level changes if rhizomes stay anchored
    in substrate. Excess lawn fertilizer runoff produces algae blooms that smother leaves—fix
    the watershed, not just the symptom.\n\n✂️ Propagation:\nDivide rhizomes in spring
    as shoots emerge, ensuring each piece has roots and a growing tip. Pot divisions
    in heavy loam submerged at the correct depth for your container. Sow seed in very
    warm shallow water after careful scarification; seedlings grow slowly compared to
    divisions.\n\n🌾 Harvest / Best Use Timing:\nYoung leaves and flower petals appear
    in some traditional foods—verify local regulations and sustainable harvest limits
    before collecting from wild waters. Rhizomes were historically used where legal
    and abundant; never deplete sensitive populations for a trend. In garden tubs, thin
    annually to prevent complete surface cover."
