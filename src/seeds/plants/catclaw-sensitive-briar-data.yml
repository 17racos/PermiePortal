  description: 'Catclaw sensitive briar (Mimosa quadrivalvis) is a prostrate to low-spreading native legume of warm grasslands
    and openings in the south-central United States and adjacent regions, bearing pink powderpuff flowers and divided leaves
    that fold when touched. Curved prickles on stems snag boots and curious mammals, a defense against overgrazing. Plants
    form mats to low mounds under 1 foot (30 cm) tall but wider across, fixing nitrogen in sunny, dryish soils.


    ☀️💧 Sun and Water Requirements:

    Full sun; prefers well-drained, often sandy or rocky soils typical of prairies and savanna edges. Drought-tolerant once
    established; poor performance in shade or constantly wet muck. Avoid heavy fertilization that favors competing weeds.


    ✂️ Propagation:

    Scarify seed and sow warm; inoculate with appropriate rhizobia if establishing on sterile soil. Divide crowns carefully—prickles
    punish rushed handling. Protect young plants from intense rabbit pressure until prickles harden.


    🌾 Harvest / Best Use Timing:

    Grazed lightly by livestock when young before prickles toughen—management intensive. For restoration, collect seed when
    pods brown and rattle. Mow adjacent weeds before seed set to reduce competition in year one.'
