  description: "Catclaw sensitive briar (Mimosa quadrivalvis) is a prostrate to low-spreading
    native legume of warm grasslands and openings in the south-central United States
    and adjacent regions, bearing pink powderpuff flowers and divided leaves that
    fold when touched. Curved prickles on stems snag boots and curious mammals, a
    defense against overgrazing. Plants form mats to low mounds under 1 foot (30 cm)
    tall but wider across, fixing nitrogen in sunny, dryish soils.\n\n☀️💧 Sun and
    Water Requirements:\nFull sun; prefers well-drained, often sandy or rocky soils
    typical of prairies and savanna edges. Drought-tolerant once established; poor
    performance in shade or constantly wet muck. Avoid heavy fertilization that favors
    competing weeds.\n\n✂️ Propagation:\nScarify seed and sow warm; inoculate with
    appropriate rhizobia if establishing on sterile soil. Divide crowns carefully—prickles
    punish rushed handling. Protect young plants from intense rabbit pressure until
    prickles harden.\n\n🌾 Harvest / Best Use Timing:\nGrazed lightly by livestock
    when young before prickles toughen—management intensive. For restoration, collect
    seed when pods brown and rattle. Mow adjacent weeds before seed set to reduce competition
    in year one."
  purpose: |-
    - Nitrogen Fixer: Rhizobia nodules enrich low-fertility warm grassland soils for companion grasses.
    - Wildlife Attractor: Flowers feed bees; seeds feed game birds where pods mature.
    - Ground Cover: Low stature fills gaps between bunchgrasses without closing canopy.
    - Animal Fodder: Brief palatable window when young; prickles later limit browse.
  companions:
  - Little Bluestem — classic matrix grass; mimosa fills interspaces with nitrogen input
  - Indiangrass — taller warm-season partner on deeper soils with similar sun demands
  - Butterfly Weed — complementary bloom color and pollinator synergy on dry banks
  cautions:
  - Stem prickles — gloves for planting and weeding; not a barefoot lawn
  - Overgrazing — can eliminate sensitive briar patches; rest paddocks to recover
  pests:
  - Aphids
  - Japanese Beetles
  practitioner_notes: |-
    Touch the leaves—if nothing folds, you might have the wrong mimosa drama entirely.
    Prickles are the plant’s résumé for “do not trample”; believe it.
    Seed pods rattle like tiny maracas when dry—harvest before they launch into your neighbor’s yard.
    Rhizobia matter on sterile fill; without inoculation, you get pretty leaves and lazy nitrogen.
  growth_habit: Low spreading legume; sensitive compound leaves; hooked stem prickles
