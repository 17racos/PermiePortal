  description: |-
    Tree spinach (chaya) is the shrubby leaf crop that demands respect: cyanogenic compounds mean you cook leaves like an adult—no raw salad cosplay. Hardy for a euphorb; still not a houseplant for toddlers.
    
    subtropical and tropical Americas: Dies back in hard frost in subtropical and tropical Americas; in Puerto Rico and tropical and subtropical zones it can behave nearly evergreen with steady warmth. Mulch crowns or keep backup cuttings after cold snaps.
    
    Sun and water: Full sun to part shade. Drought-tolerant once established but yields more with deep occasional watering in fast-draining soil.
    ✂️ Propagation:
    Hardwood cuttings (easy); keep planting stock protected until rooted.
    
    🌾 Harvest / Best Use Timing:
    - Tree Spinach: pick peak flavor when fruits soften slightly and detach easily -- birds are a parallel calendar.
    - Harvest after dew dries to reduce mold in baskets.
    - Jam batches same day if humidity is high; acid and sugar balance matter more than Instagram gloss.
