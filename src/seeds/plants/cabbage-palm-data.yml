  description: "Cabbage palm (Sabal palmetto) is the iconic fan palm of subtropical coasts and lowlands, forming a single\
    \ trunk topped with large costapalmate leaves and heavy sprays of black fruit. Heights of 30–50 feet (9–15 m) are common\
    \ in open settings; boots of old leaf bases linger on trunks until they shed. Young hearts were historically eaten as\
    \ survival food at unsustainable harvest cost—modern landscapes value the species for canopy structure, storm resilience,\
    \ and wildlife food, not heart-of-palm fads on wild trees.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun to light\
    \ partial shade; establishment faster with irrigation in dry districts. Tolerates sandy, salty air and periodic inundation;\
    \ still needs drainage for long-term root health. Mulch young trunks to reduce weed competition; avoid piling mulch against\
    \ the growing point.\n\n✂️ Propagation:\nSow seed in warm, humid conditions; germination is slow but reliable with patience.\
    \ Transplant young palms with as much root ball as logistics allow. Remove only dead fronds; green fronds are still feeding\
    \ the crown.\n\n \U0001F33E Harvest / Best Use Timing:\nDo not harvest terminal buds from landscape or wild palms—killing\
    \ the meristem ends the tree. Collect fallen fruit for wildlife feeding stations or seed propagation where ethical. Schedule\
    \ professional trimming only when dead material creates hazard, not for cosmetic anxiety."
  purpose: '- Edible: Fruit pulp and seeds are minor human food; hearts are not ethical harvest on specimen trees.

    - Wildlife Attractor: Fruit feeds birds, mammals, and insects across subtropical food webs.

    - Ornamental: Silhouette reads as honest regional identity better than non-adapted exotics.

    - Windbreaker: Flexible fronds shed wind in storms better than rigid broadleaf trees pretending otherwise.

    - Mulcher: Persistent frond drop feeds fire-adapted and mesic soils depending on site.'
  companions:
  - Blue Palmetto — smaller Sabal for layered palm understory in large moist plantings
  - Elderberry — quick shrub layer at palm margins shares moist soils without matching final height
  - Lemongrass — clumping herb handles sun at the dripline where mowing is awkward
  cautions:
