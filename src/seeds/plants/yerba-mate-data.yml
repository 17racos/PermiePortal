description: |-
  Yerba mate (Ilex paraguariensis) is an evergreen tree to large shrub of Atlantic forests in South America, grown for dried leaves brewed into mate—a caffeinated, theobromine-carrying drink with deep cultural roots far beyond ‘trend tea.’ Leaves are leathery, lightly toothed, and harvestable once plants size up; young plants look like polite holly cousins until trunks thicken. In humid subtropical sites it appreciates acidic, well-drained soil, dappled to full sun transitions, and honest air movement to reduce foliar funk.

  Young plants often favor partial shade; mature trees accept more sun where roots can explore moisture. Consistent moisture without swamp conditions; mulch keeps roots cool in heat. Protect from hard freezes when young; mature specimens tolerate brief dips better with site protection.

  Seeds need fresh sowing and patience—germination can be slow and variable. Cuttings from semi-hardwood can clone known selections when humidity is managed. Air-layering works for backyard propagation of proven trees.

  Harvest leaves on a rotation that leaves enough canopy for recovery—this is a tree crop, not basil. Dry with airflow to prevent mold; mate flavor depends on clean fermentation and drying steps if you go traditional. Store dried leaf like tea: airtight, dark, away from spice-cabinet chaos.
purpose: |-
  Edible: Ilex paraguariensis leaves dry-roast into mate with caffeine plus theobromine -- traditional processing includes blanching and aging steps for flavor.
  Medicinal: Guaraná-class stimulant profile -- anxiety, insomnia, and MAOI interactions are real; treat like tea, not a supplement stack.
  Wildlife Attractor: Small insect-pollinated holly flowers feed native bees -- birds perch in dense canopy without expecting coffee cherries.
  Shade Provider: 15 m evergreen umbrella suits banana and ginger understory in humid subtropics -- air movement prevents fungal sulk.
  Border Plant: Row-plant on 3 m centers for leaf harvest -- width matches eventual buttressed trunks, not one-year wishful spacing.
