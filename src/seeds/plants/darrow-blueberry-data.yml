description: "‘Darrow’ is a southern highbush blueberry (*Vaccinium corymbosum*) cultivar\
  \ known for large berries and vigorous growth when site and chill requirements are\
  \ met. It is the kind of plant that rewards boring fundamentals: pH in the blueberry\
  \ band, mulch, irrigation that does not suffocate roots, and annual pruning to renew\
  \ fruiting wood.\n\nsubtropical and tropical Americas: pair with other cultivars\
  \ for cross-pollination and staggered harvest; verify chill fit before you emotionally\
  \ invest.\n\n☀️\U0001F4A7 Sun and Water:\n- Full sun.\n- Steady moisture from bloom\
  \ through harvest; reduce soggy spells with raised beds, pine mulch, and drainage.\n\
  \n✂️ ✂️ Propagation: \n- Home growers usually buy liners; cloning is softwood cuttings\
  \ under mist.\n- Avoid growing from seed if you want ‘Darrow’ — genetics will wander.\n\
  \n\U0001F33E Harvest / Best Use Timing:\n- Darrow Blueberry: pick berries when fully\
  \ colored and detach with a gentle tug -- whitish bloom still present is fine.\n\
  - Cool mornings beat hot afternoons for shelf life; chill soon if not eating the\
  \ same day.\n- Freeze dry on trays before bagging so berries do not fuse into a\
  \ single ice meteor."
purpose: |-
  Edible: Vaccinium corymbosum 'Darrow' sets large southern highbush berries for fresh eating and freezing when chill hours match the cultivar.
  Pollinator: White urn-shaped spring flowers feed specialist blueberry bees and honeybees during the narrow bloom window.
  Wildlife Attractor: Ripe blue fruit feeds catbirds and thrushes -- net rows or share a percentage honestly.
  Ornamental: Upright vigorous shrubs give bold edible structure in acid-mulched yards where pH and irrigation stay consistent.
