  description: "‘Darrow’ is a southern highbush blueberry (*Vaccinium corymbosum*)
    cultivar known for large berries and vigorous growth when site and chill requirements
    are met. It is the kind of plant that rewards boring fundamentals: pH in the
    blueberry band, mulch, irrigation that does not suffocate roots, and annual
    pruning to renew fruiting wood.\n\nFlorida and Puerto Rico: pair with other cultivars for
    cross-pollination and staggered harvest; verify chill fit before you emotionally
    invest.\n\n☀️💧 Sun and Water:\n- Full sun.\n- Steady moisture from bloom through
    harvest; reduce soggy spells with raised beds, pine mulch, and drainage.\n\n✂️
    Propagation:\n- Home growers usually buy liners; cloning is softwood cuttings
    under mist.\n- Avoid growing from seed if you want ‘Darrow’ — genetics will
    wander."
  purpose: |-
    - Edible: Large berries for fresh eating and processing.
    - Pollinator: Bloom patches feed bees; keep spray schedules intelligently dull.
    - Wildlife Attractor: Birds require netting or negotiated tribute.
    - Ornamental: Bold shrub presence in edible landscaping.
