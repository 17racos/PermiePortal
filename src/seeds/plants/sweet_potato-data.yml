  description: "Sweet potato is a herbaceous perennial vine native to tropical regions
    of the Americas. It features heart-shaped or lobed leaves and bears funnel-shaped
    flowers, typically in shades of pink or violet. The plant is primarily cultivated
    for its edible tuberous roots, which vary in color from white and yellow to orange
    and purple, depending on the cultivar.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nSweet
    potatoes thrive in full sun, requiring at least 6 hours of direct sunlight daily.
    They prefer well-drained, loamy to sandy soils with a slightly acidic to neutral
    pH (5.5 to 6.5). Consistent moisture is essential, especially during the establishment
    phase and root development, but waterlogging should be avoided to prevent root
    rot.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation is typically achieved
    through \"slips,\" which are shoots grown from mature sweet potato tubers. To
    produce slips:\n1. Select healthy, disease-free tubers.\n2. Place them in a warm,
    moist environment, partially submerged in water or soil.\n3. After several weeks,
    sprouts (slips) will emerge.\n4. Once slips reach approximately 15 cm (6 inches)
    in length, they can be gently removed and planted directly into the soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nHarvesting usually occurs 90 to 170 days after planting, depending
    on the variety and growing conditions. Indicators for harvest include yellowing
    leaves and the size of the tubers. It's advisable to harvest before the first
    frost, as cold temperatures can damage the tubers. Carefully dig up the tubers
    to avoid bruising, and cure them in a warm, humid environment for about 7 to 10
    days to enhance sweetness and storage potential."
