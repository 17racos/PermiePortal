  description: 'Caraway is the biennial-perennial spice carrot your rye bread remembers — feathery leaves, umbels of white-to-pink
    flowers, then seeds with that warm, resinous bite. In subtropical and tropical Americas it behaves like a cool-season
    worker: lush in winter and spring, cranky when nights stop cooling off. Grow for leaves, taproot experiments, and seed
    heads; harvest seeds when brown and crisp. Not a tropical hero, but a fun rotation herb if you refuse to only plant basil.


    ☀️💧 Sun and Water:

    - Full sun in cool months; light afternoon shade when heat spikes.

    - Even moisture; drought pushes premature flowering.

    - Deep, fertile soil helps the root and seed cycle.


    ✂️ Propagation:

    - Seed: sow in fall or early spring; thinning improves airflow.

    - Second-year plants produce the heaviest seed — plan the cycle.'
  purpose: 'Wild caraway is old-world baking spice with a permaculture work ethic:


    - Edible: Seeds for bread, kraut, and meat; leaves and roots in small amounts.

    - Medicinal: Traditional digestive associations with the volatile oils.

    - Pollinator: Umbels attract small beneficial insects.

    - Border Plant: Fine foliage in cool-season polycultures.'
