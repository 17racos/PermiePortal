description: |-
  Marang is a jackfruit cousin with a spiky football of a fruit that splits to reveal sweet, aromatic arils — tropical decadence without the focus-group smoothie branding. It is a large evergreen tree for true lowland tropics; subtropical and tropical Americas is mostly a frost-tempting prank unless you have serious microclimate armor and low expectations.

  - Full sun for fruiting canopy.
  - Deep, regular water in dry spells; hates prolonged drought once sized up.
  - Rich, well-drained loam; wind protection while young.

  - Seeds: Fresh seeds germinate quickly; seedlings variable.
  - Grafting: Preferred for known quality fruit.
  - Air-layering: Used for true-to-type clones where practiced.

  - Pick when rind color shifts and aroma peaks; overripe splits on the tree.
  - Handle latex with gloves; cleanup is not romantic.
purpose: |-
  Edible: Artocarpus odoratissimus opens to reveal intensely aromatic, custard-sweet arils clinging to large seeds -- eat when rind yellows and aroma peaks; latex from stem drips stains clothes and skin.
  Shade Provider: Broad evergreen canopy shelters cacao, vanilla, or understory gingers in wet lowlands -- windbreak young trees because brittle branches shed in squalls if crowns catch too much sail.
  Wildlife Attractor: Fruit bats and civets work ripe syncarps in native forests -- harvest daily in home orchards or accept pulp splats and seedling volunteers under the drip line.
  Mulcher: Huge simple leaves drop steadily, feeding fungal decomposition -- rake excess away from trunks if mulch depth invites stem rot in monsoon humidity.
