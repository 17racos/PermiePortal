  description: |-
    Betony (Stachys officinalis) is a clump-forming mint-family perennial from Europe, naturalized in parts of North America. Basal rosettes send up square stems roughly 1–2 feet tall topped with dense spikes of magenta-pink tubular flowers attractive to bees. Leaves are softly textured and often slightly wrinkled, with a tidy habit in good drainage.

    Florida and Puerto Rico lowlands treat it as a cool-season or north-Florida candidate—humid subtropical summers invite mildew unless sited with morning sun, afternoon relief, and ruthless airflow. Puerto Rico highlands may behave more kindly than steamy coasts.

    ☀️💧 Sun and Water Requirements:
    - Full sun in cool summers; light afternoon shade where heat spikes above its European comfort.
    - Average, well-drained loam; tolerates moderate drought once established—wet clay in August is fungal summer camp.

    ✂️ Methods to Propagate:
    - Division in spring or fall—split crowns with a sharp knife and replant promptly.
    - Seeds: surface sow in spring; germination moderate—label trays so you do not confuse betony with actual mint chaos.

    🌾 Harvest / Best Use Timing:
    - Harvest flowering tops at early full bloom for drying; strip leaves for tea earlier if that is your use case.
    - Leave late spikes for pollinators if you are not running a commercial drying operation—bees pay rent too.
  purpose: |-
    Betony is a meadow mint that behaves compared with true mint runners.

    - Medicinal: Long European herbal history—modern safety research is your job, not mine.
    - Pollinator: Tubular flowers target long-tongued bees in succession with other border perennials.
    - Border Plant: Upright spikes punctuate mixed beds without swallowing paths whole.
    - Ground Cover: Basal rosettes occupy niche space against bare soil when clumps expand politely.
    - Ornamental: Pink wands read as cottage-garden sincerity—ironic or not, your call.
  companions:
