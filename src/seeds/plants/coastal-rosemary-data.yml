  description: "Coastal rosemary (*Westringia fruticosa*) is not a true rosemary,
    but a fine-leaved Australian shrub that plays the same visual role—gray-green
    linear leaves and a dense, rounded habit to about 1–2 m tall and wide. Small
    white to pale lilac flowers with speckled throats appear in waves through the
    warm months. It tolerates salt breeze, making it useful near Florida and Puerto
    Rico shorelines, yet still needs drainage during tropical downpours.\n\n☀️💧 **Sun
    and Water Requirements:**\nFull sun for tightest habit; tolerates light shade
    with a looser form. Well-drained sandy or rocky soil; water to establish, then
    moderate drought tolerance. Avoid chronic wet feet.\n\n✂️ **Methods to Propagate:**\n-
    **Cuttings:** Semi-hardwood cuttings root easily under humidity in warm weather.\n-
    **Layering:** Low branches touching soil can be pegged and severed once rooted
    for hedge expansion.\n\n🌾 **Best Use Timing:**\nShear lightly after major bloom
    flushes to keep formal hedges; in informal food forests, prune for clearance around
    trunks of taller trees. Best planting is at the start of the rainy season for
    root establishment without daily hand watering."
  purpose: |-
    - **Ornamental:** Fine texture and neutral color read as “instant structure” in dry gardens and parking strips.
    - **Wildlife Attractor:** Flowers draw small bees and beneficials along sunny edges.
    - **Border Plant:** Dense form defines paths, dog runs, and orchard understory lanes without thorns.
    - **Windbreaker:** Repeated shrubs in a row trim salt-laden winds along coastal lots.
