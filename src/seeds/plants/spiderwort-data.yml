  description: "Spiderwort (Tradescantia virginiana) is a clump-forming perennial of eastern North American meadows and open woods, with arching leaves and three-petaled blue-violet flowers that open fresh each morning for weeks. Plants reach 1–2 feet (30–60 cm), self-sowing politely in gardens that tolerate a little chaos. Young shoots are mild edibles where ID and spray history are clean.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; afternoon shade reduces petal melt speed in hot climates. Average to moist, well-drained soils suit it; tolerates clay if drainage moves. Mulch to buffer roots; avoid stagnant water over crowns.\n\n✂️ Propagation:\nDivide clumps in spring; sow seed outdoors in fall. Deadhead near paths if volunteers annoy pavers.\n\n🌾 Harvest / Best Use Timing:\nGather young leaves and flowers in cool mornings for salads—verify ID. Cut back floppy stems after heavy bloom to refresh foliage. Peak bloom tracks late spring into summer warmth."
  purpose: |-
    - Pollinator: Morning flowers feed small bees when many doubles offer theater only.
    - Ground Cover: Clumps fill sunny gaps between taller forbs.
    - Edible: Mild shoots diversify wild salads on clean sites.
    - Ornamental: Blue flowers and grassy leaves soften formal borders without turf lies.
  companions:
