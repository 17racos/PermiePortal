  description: 'Indiangrass (Sorghastrum nutans) is a tall warm-season bunchgrass of North American prairies and open oak
    savannas, famous for golden plume-like panicles in late summer and blue-green foliage with a distinctive ligule like a
    rifle sight. Clumps reach 4–7 feet (1.2–2.1 m) in rich moist sites, shorter on dry slopes. It anchors restoration mixes,
    meadow gardens, and livestock rotations where deep-rooted natives beat annual erosion theater.


    ☀️💧 Sun and Water Requirements:

    Full sun for flowering; open pine shade matches savanna ecology. Adaptable from dry uplands to mesic lowlands if drainage
    exists between rains. Over-irrigation on clay invites lodging; match water to soil texture.


    ✂️ Propagation:

    Sow seed shallow in warm soil; weed control year one is the real crop. Divide dormant crowns in early spring. Burn or
    mow on schedules aligned with local ecological guidance—not random scalp dates.


    🌾 Harvest / Best Use Timing:

    For hay or grazing, follow forage timing rules for warm-season grasses. For gardens, leave winter stems for structure;
    cut back before spring green-up. Collect seed when awns mature if expanding restoration plots.'
