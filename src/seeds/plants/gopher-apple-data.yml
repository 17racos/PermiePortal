  description: |-
    Gopher apple (*Geobalanus oblongifolius*) is a prostrate native of pine sandhills and scrub — think low, leathery leaves, underground stems, and edible fruit that actually matters to gopher tortoises (share, do not monocrop their pantry). It is not a turf replacement for soccer; it is an ecological ground layer that laughs at drought once established.
    
    Perfect PermieBro move: under open pine canopy with wiregrass aesthetics and zero St. Augustine guilt.
    
    ☀️💧 Sun and Water:
    - Full sun; this is a scrub species, not a shade houseplant.
    - Extremely drought-tolerant; sandy, well-drained soil. hates standing water.
    
    ✂️ Propagation:
    - Seeds: sow cleaned seed in sandy mix; germination can be slow.
    - Rhizome sections: carefully transplant rooted runners during warm wet periods.
    - Nursery pots: easiest for humans who dislike waiting on scrub time.
    
    🌾 Harvest / Best Use Timing:
    - Low apple-like fruits ripen summer into fall for wildlife -- human nibbling is curiosity, not calorie planning.
    - Leave groundcover intact; roots stabilize sandy soils for adjacent species.
    - Photograph for ID help instead of stripping every fruit for novelty.
