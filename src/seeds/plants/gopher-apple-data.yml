  description: |-
    Gopher apple (*Geobalanus oblongifolius*) is a prostrate native of pine sandhills and scrub — think low, leathery leaves, underground stems, and edible fruit that actually matters to gopher tortoises (share, do not monocrop their pantry). It is not a turf replacement for soccer; it is an ecological ground layer that laughs at drought once established.
    
    Perfect PermieBro move: under open pine canopy with wiregrass aesthetics and zero St. Augustine guilt.
    
    ☀️💧 Sun and Water:
    - Full sun; this is a scrub species, not a shade houseplant.
    - Extremely drought-tolerant; sandy, well-drained soil. hates standing water.
    
    ✂️ Propagation:
    - Seeds: sow cleaned seed in sandy mix; germination can be slow.
    - Rhizome sections: carefully transplant rooted runners during warm wet periods.
    - Nursery pots: easiest for humans who dislike waiting on scrub time.
    
    🌾 Harvest / Best Use Timing:
    - Low apple-like fruits ripen summer into fall for wildlife -- human nibbling is curiosity, not calorie planning.
    - Leave groundcover intact; roots stabilize sandy soils for adjacent species.
    - Photograph for ID help instead of stripping every fruit for novelty.
  purpose: |-
    Wildlife Attractor: Geobalanus oblongifolius produces low, apple-like drupes that gopher tortoises and other scrub wildlife recognize as food -- plant generous patches and keep dogs off if tortoises are present.
    Ground Cover: Prostrate stems with leathery leaves creep through pine sandhills, knitting a weed-suppressing mat under open canopy -- not turf for foot traffic, but durable ground armor in blazing sun.
    Erosion Control: Rhizomatous roots and wiry stems bind shifting sand on slopes and road cuts where shallow-rooted annuals wash away -- pair with wiregrass aesthetics for structurally honest restoration.
    Drought Tolerant: Once established, the plant runs on rainfall in well-drained scrub soils and shrugs off dry-season drought that would crisp irrigated lawn species -- water only to establish, then back off.
  companions:
  - Longleaf Pine
  - Wiregrass
  - Sparkleberry
  - Turkey Oak
  cautions:
  - Irrigation-heavy lawn culture
  - Deep shade
  pests:
  - Scale Insects
  - Spider Mites
  - Aphids
  practitioner_notes: |-
    Edge containment beats regret—runners respect metal or deep trench more than promises.
    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.
    Shear ragged mats after heat waves; two weeks of ugly beats six months of thatch rot.
    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.
  growth_habit: Ground Cover
