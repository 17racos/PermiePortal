  description: "Gopher apple (*Geobalanus oblongifolius*) is a prostrate native
    of pine sandhills and scrub — think low, leathery leaves, underground stems,
    and edible fruit that actually matters to gopher tortoises (share, do not
    monocrop their pantry). It is not a turf replacement for soccer; it is an
    ecological ground layer that laughs at drought once established.\n\nPerfect
    PermieBro move: under open pine canopy with wiregrass aesthetics and zero
    St. Augustine guilt.\n\n☀️💧 Sun and Water:\n- Full sun; this is a scrub species,
    not a shade houseplant.\n- Extremely drought-tolerant; sandy, well-drained
    soil. hates standing water.\n\n✂️ Propagation:\n- Seeds: sow cleaned seed in sandy
    mix; germination can be slow.\n- Rhizome sections: carefully transplant rooted
    runners during warm wet periods.\n- Nursery pots: easiest for humans who dislike
    waiting on scrub time."
  purpose: |-
    - Wildlife Attractor: Fruits feed gopher tortoises and other wildlife — plant generously, fence dogs, respect CITES-adjacent ethics.
    - Ground Cover: Spreads low, excludes weeds in harsh sun where fussy covers die.
    - Erosion Control: Networks stems and roots in sandy soils.
    - Drought Tolerant: Loves Florida dry seasons once established.
  companions:
  - Longleaf Pine
  - Wiregrass
  - Sparkleberry
  - Turkey Oak
  cautions:
