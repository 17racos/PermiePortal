scientific_name: Pouteria campechiana
aka:
- Egg fruit
- Yellow sapote
family: Sapotaceae
zone: 10-11
ideal_temp_min: 65
ideal_temp_max: 90
min_temp: 30
max_temp: 100
perennial: true
layers:
