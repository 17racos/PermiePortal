  description: |-
    Canistel is the egg-yolk fruit: sweet, mealy, and deeply tropical — not a crisp apple moment. Small evergreen tree, latex in the sap like its sapote cousins. In subtropical and tropical Americas it is a gamble outside the warmest 10b pockets and greenhouse ego; one hard freeze on young wood ends the season's optimism.

    ☀️💧 Sun and Water Requirements:
    - Full sun for flowering and fruit set once established.
    - Deep, rich, well-drained soil; steady moisture in growth, less when cool.
    - Wind break helps young trees; salt not its favorite neighbor.

    ✂️ Methods to Propagate:
    - Seeds: fresh seed germinates erratically but works for backyard trials.
    - Grafting onto related sapote rootstocks is the commercial reliability path.
    - Air layering: possible on mature branches with patience and humidity.
  purpose: |-
    Canistel earns its space where frost is rare:

    - Edible: Ripe flesh fresh or in custards; treat unripe fruit like a hard no.
    - Wildlife Attractor: Flowers and fruit feed pollinators and fruit-eaters if you share.
    - Shade Provider: Modest canopy for understory herbs in a frost-free stack.
  companions:
  - Banana
  - Papaya
  - Comfrey
  cautions:
  - Low, frost pockets without protection
  - Waterlogged clay without drainage fixes
  pests:
  - Scale Insects
  - Caribbean Fruit Fly
  - Mealybugs
