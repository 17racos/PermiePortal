  description: "Spanish stopper (Eugenia axillaris) is an evergreen shrub to small
    tree native to the Caribbean, the Bahamas, and extreme southern Florida, common
    in hammocks, coastal strands, and limestone pinelands. Small opposite leaves
    and smooth bark read refined; black berries feed birds quietly without suburban
    mess theater. It suits salt-tolerant hedges, native buffers, and patio plantings
    in frost-free climates.\n\n☀️💧 Sun and Water Requirements:\n- Full sun to light
    shade; densest screens in bright light.\n- Drought tolerant once established
    in humid maritime air; irrigate young plants through first dry seasons.\n- Well-drained,
    often alkaline rocky soils; container mixes must drain fast.\n\n✂️ Propagation:\n-
    Seeds cleaned and sown fresh; germination can be slow.\n- Semi-hardwood cuttings
    under humidity in warm weather.\n- Shear lightly for formal hedges; avoid heavy
    cuts into bare wood without latent buds.\n\n🌾 Harvest / Best Use Timing:\n-
    Fruit is edible when fully ripe and soft; flavor is mild—birds often disagree
    and arrive first.\n- Pick propagation seed before full pilferage if cages are
    used.\n- Mulch root zone to reduce evaporative stress in dry-season heat."
