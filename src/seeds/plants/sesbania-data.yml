  description: 'Sesbania species are fast-growing shrubs or small trees that can reach heights of up to 8 meters (26 feet).
    They have pinnately compound leaves with numerous small leaflets and produce yellow or white flowers, often with brown
    or purple streaks. The plants are commonly found in tropical and subtropical regions, thriving in a variety of soil types,
    including sandy and clay soils, often in wet or flooded conditions. Sesbania is known for its ability to fix nitrogen,
    improving soil fertility. Propagation is typically done through seeds, which can be sown directly into the soil. Harvesting
    for fodder or green manure can occur multiple times a year due to its rapid growth.

    ☀️💧 Sun and Water Requirements — Full sun for strongest growth and nitrogen fixation. Adaptable to sandy through clay
    soils; many taxa tolerate seasonal wet feet or brief flooding better than drought. Steady moisture during establishment;
    mature plants in wet sites want drainage between flood pulses—avoid stagnant, anaerobic muck around crowns in containers.'
