description: |-
  Asperula orientalis is a frothy annual with whorls of narrow leaves and dreamy sky-blue flowers — the woodruff label is about look and habit, not a promise it tastes like Galium odoratum. Grow it where you want spring sparkle under taller perennials, then let it reseed or collect seed before the heat turns it crispy.

  subtropical and tropical Americas: treat as cool-season-to-early-summer annual; afternoon shade helps when the thermostat mocks your ambitions.

  Full sun in cool weather; part shade as days lengthen and bake. Even moisture; avoid bone-dry pots. Average garden soil; not a bog plant.

  Direct-sow after last frost or start indoors 4–6 weeks early. Self-sows lightly where happy.

  For Blue Woodruff, harvest timing follows the primary function you planted for -- flowers, fodder, mulch, or structure. Coppice or prune dormant windows where winters exist; subtropical plants often prefer dry-season cuts. Always sanitize tools between diseased and clean plants -- drama spreads faster than newsletters.
purpose: |-
  Pollinator: Asperula orientalis opens tiny sky-blue tubes in whorled leaf axils, so small sweat bees and syrphids work the patch while larger bees ignore it overhead.
  Wildlife Attractor: Cool-season bloom bridges bare soil weeks before warm annuals fire, giving early protein for flies that later feed chick broods in hedgerows.
  Border Plant: Six-to-ten-inch froth lines path fronts under taller perennials, then dies back cleanly once heat turns rosettes crisp if you let seed fall first.
companions:
  - Dill
  - Calendula
  - Borage
cautions:
