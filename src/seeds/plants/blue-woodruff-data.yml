  description: "Asperula orientalis is a frothy annual with whorls of narrow leaves
    and dreamy sky-blue flowers — the woodruff label is about look and habit, not a
    promise it tastes like Galium odoratum. Grow it where you want spring sparkle
    under taller perennials, then let it reseed or collect seed before the heat turns
    it crispy.\n\nFlorida and Puerto Rico: treat as cool-season-to-early-summer annual; afternoon
    shade helps when the thermostat mocks your ambitions.\n\n☀️💧 Sun and Water:\n-
    Full sun in cool weather; part shade as days lengthen and bake.\n- Even moisture;
    avoid bone-dry pots.\n- Average garden soil; not a bog plant.\n\n✂️ Propagation:\n-
    Direct-sow after last frost or start indoors 4–6 weeks early.\n- Self-sows lightly
    where happy."
  purpose: |-
