  description: 'Shaving brush tree (Pseudobombax ellipticum) is a dry-season deciduous tropical tree famous for large pink
    flowers with hundreds of stamens that resemble barber brushes, opening on leafless branches after winter-thin canopies
    in seasonal climates. Trees reach 20–40 feet (6–12 m), often with a broad spreading crown and smooth pale bark. It is
    a spectacle plant for humid tropical and subtropical gardens where winter cool triggers leaf drop and spring heat triggers
    bloom.


    ☀️💧 Sun and Water Requirements:

    Full sun for heaviest flowering; young trees accept partial shade. Well-drained, moderately fertile soils suit it; drought-tolerant
    during leafless periods once established. Water during leaf expansion and flowering to maximize bloom size; avoid waterlogging.


    ✂️ Propagation:

    Sow fresh seed in warm, humid conditions. Air-layer known bloomers for predictable flower form. Prune for clearance under
    wide branches; avoid topping.


    🌾 Harvest / Best Use Timing:

    Primarily ornamental—flowers are short-lived but unforgettable. Growth and bloom track wet-dry seasonality rather than
    temperate months. Rake fallen petals if paths must stay pristine.'
