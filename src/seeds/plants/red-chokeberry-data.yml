  description: "Red chokeberry (Aronia arbutifolia) is a multi-stemmed deciduous shrub of eastern North American wetlands and moist woods, bearing white spring flower clusters, glossy summer foliage, bright red persistent fruit, and strong red fall color. Heights of 6–10 feet (1.8–3 m) are common with suckering colonies along pond margins and rain-garden berms. Fruit is tart and astringent raw but valuable for juices and preserves where sugar and processing meet respectfully.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best fruiting and fall color in sun with steady moisture. Tolerates wet soils better than many fruit shrubs if drainage moves; also handles average beds with mulch and irrigation during drought. Acidic to neutral soils suit it; chlorosis appears on alkaline sites without organic matter.\n\n✂️ Propagation:\nSow stratified seed; divide suckers in early spring. Softwood cuttings root under mist. Renewal-prune old canes after several years to keep fruiting wood young and airflow honest.\n\n🌾 Harvest / Best Use Timing:\nPick berries when fully red and slightly soft; process quickly into juice or jelly. Frost often improves palatability for wildlife—decide who gets the second wave. Peak human harvest tracks late warm-season ripening."
  purpose: |-
    - Edible: Anthocyanin-rich fruit supports juices and preserves after cooking tames astringency.
    - Wildlife Attractor: Flowers feed pollinators; fruit feeds birds, especially after cold sweetens tannins.
    - Erosion Control: Suckering roots stabilize moist banks and swale sides.
    - Ornamental: Fall red foliage and fruit double the garden receipt without extra purchases.
  companions:
  - Highbush Cranberry — moist-site neighbor extending winter fruit and bird interest
  - Serviceberry — earlier fruit at the slightly drier margin of the guild
  - Marsh Blazingstar — upright forb in moist sun below open shrub canopies
  cautions:
  - Raw fruit punch—tannins punish unprepared tasters
  - Suckering into paths—edge with intent or mow a buffer
  pests:
  - Aphids
  - Japanese Beetles
  - Powdery Mildew
  practitioner_notes: |-
    Aronia vs Photinia labels argue in older books—Aronia arbutifolia is the current chokeberry anchor for this shrub.
    Juice yield rewards steam extraction—hand squeezing is a wrist tax, not a business model.
    Fall color competes with maples—site where backlight can read both leaves and fruit.
    Bird netting ethics vary—share rows or defend rows, but decide before peak ripeness drama.
  growth_habit: Suckering deciduous shrub; red fruit; red fall color; moist soils and rain gardens
