  description: |-
    Ahipa is the lesser-hyped Pachyrhizus cousin: bushy, short-day, and grown for starchy roots and edible beans in some landraces — with the usual legume caveat that raw beans can be toxic stupidity if you skip cooking. It fixes nitrogen while pretending to be a root crop, which is exactly the kind of multitasking permaculture likes. Treat it as a warm-season annual outside the true tropics.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for tuber fill; half-day sun yields disappointment and excuses.
    - Loose, deep soil for root expansion; steady moisture, no constant swamp.
    - Frost ends the season; plan harvest before first freeze.
    
    ✂️ Methods to Propagate:
    - Seeds: sow after soil warms; in short-season areas start indoors.
    - Tubers: replant crown pieces in frost-free climates where tradition supports it.
    
    🌾 Harvest / Best Use Timing:
    - Ahipa: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
    - Loosen soil wide first -- snapped necks invite rot in storage.
    - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
