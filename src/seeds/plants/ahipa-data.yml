description: |-
  Ahipa is the lesser-hyped Pachyrhizus cousin: bushy, short-day, and grown for starchy roots and edible beans in some landraces — with the usual legume caveat that raw beans can be toxic stupidity if you skip cooking. It fixes nitrogen while pretending to be a root crop, which is exactly the kind of multitasking permaculture likes. Treat it as a warm-season annual outside the true tropics.

  Full sun for tuber fill; half-day sun yields disappointment and excuses. Loose, deep soil for root expansion; steady moisture, no constant swamp. Frost ends the season; plan harvest before first freeze.

  Seeds: sow after soil warms; in short-season areas start indoors. Tubers: replant crown pieces in frost-free climates where tradition supports it.

  Ahipa: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches. Loosen soil wide first -- snapped necks invite rot in storage. Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
purpose: |-
  Edible: Pachyrhizus ahipa forms starchy tubers under short-day tropical conditions while some landraces also offer edible seed after thorough cooking -- never treat raw seed like snack food because legume-type inhibitors in the genus do not negotiate.
  Nitrogen Fixer: Bushy vines nodulate on roots so the bed gains nitrogen credit for the following corn or squash rotation -- dig nodules on a test root before assuming inoculation happened on new ground.
