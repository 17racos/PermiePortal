  description: 'Broomsedge bluestem (Andropogon virginicus) is a warm-season bunchgrass native to the Americas, recognizable
    by tufted clumps and coppery winter stems that catch low sun like forgotten brooms. It colonizes old fields, roadsides,
    and pine savannas, typically 2–4 feet (0.6–1.2 m) tall. Outside its native range it behaves as an invasive pasture weed
    in some Pacific and other regions—verify local status before romanticizing it. Where native, it is a cheap biomass and
    wildlife structure plant that laughs at low fertility.


    ☀️💧 Sun and Water Requirements:

    Full sun; shade weakens tussocks. Thrives on lean, well-drained soils; high nitrogen and heavy grazing favor it over preferred
    forages—soil fertility management changes outcomes. Tolerates drought; dislikes permanent inundation.


    ✂️ Propagation:

    Sow seed on warm bare soil; needs light for germination. Clumps expand slowly; division possible in early spring for restoration
    plugs. Prescribed fire or mowing on appropriate schedules can renew stands where regulations allow.


    🌾 Harvest / Best Use Timing:

    For forage, graze early while quality is higher; mature stands are filler fiber. For mulch, cut after seed set only if
    you accept volunteer spread—timing is an ecological vote.'
  purpose: '- Biomass: Stems build carbon-rich mulch and thatch layers on low-input sites.

    - Wildlife Attractor: Structure shelters small fauna; seeds feed birds where stands persist.

    - Erosion Control: Fibrous roots hold disturbed ground during early succession.

    - Ornamental: Winter color beats brown lawn shock after frost.

    - Animal Fodder: Early growth offers modest grazing before lignin rises with maturity.'
