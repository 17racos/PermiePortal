  description: "Pineapple Sage (Salvia elegans) is a perennial herb known for its
    vibrant red tubular flowers and fragrant foliage that smells like pineapple. It
    grows as a bushy shrub reaching 1-1.5 meters (3-5 feet) tall and spreads moderately.
    The plant thrives in warm climates and is commonly grown for its ornamental value,
    culinary use, and attractiveness to pollinators such as hummingbirds and bees.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun but tolerates
    partial shade.\n- Requires well-drained soil, ideally sandy or loamy.\n- Moderate
    drought tolerance; water regularly but allow soil to dry between watering.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- **Seed**: Best started indoors in early spring and transplanted
    after frost.\n- **Cuttings**: Softwood cuttings root easily in water or moist
    soil.\n- **Division**: Can be divided from mature plants to propagate new growth.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Leaves can be harvested year-round in warm climates.\n- Flowers
    bloom in late summer to fall and can be used fresh or dried."
