description: |-
  Dioscorea rotundata is the West African white yam of serious calorie farming—large starchy tubers, vigorous vines, and a growing season that demands frost-free months measured in seasons, not weekends.

  Greenhouse or experimental outdoor culture only where freezes are rare; field scale belongs in true tropics.

  Full sun for the vine canopy; deep loose soil with organic matter; consistent moisture during vine growth, then dry-down before harvest depending on local practice.

  Small whole tubers (‘seed yams’), vine cuttings in some systems, or miniset—follow regional methods.

  Dig mature tubers after vine senescence or local calendar—serious calorie crop timing, not weekend hobby scale.
purpose: |-
  Edible: Dioscorea rotundata produces starchy 5--15 kg tubers where 10--11 month frost-free seasons allow bulking -- peel and boil; some landraces stay bitter without proper post-harvest handling.
  Ground Cover: Vines smother trellis walls in monsoon humidity -- stake hard; left alone they swamp neighboring rows by August.
  Mulcher: Frost-killed haulm piles high -- chip coarse stems before composting so piles heat evenly.
  Animal Fodder: Vine tips graze cattle in West African systems after wilt/sun-dry steps -- verify cyanogenic glycoside protocols for your stock class before turning animals in.
