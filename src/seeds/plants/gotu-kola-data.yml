  description: "Gotu kola is a low, creeping perennial herb with kidney-shaped leaves
    on thin stems that roots freely at nodes—classic moist-shade groundcover energy.
    It is widely used as a mild salad green and in traditional herbal systems; PermieBro
    translation: respect the plant, do not turn it into a wellness grift. In subtropical
    Florida and Puerto Rico it runs year-round in protected, damp spots; hard freezes can brown
    it, but it often rebounds from the roots.\n\n🌞💧 Sun and Water Requirements:\n-
    Part shade to dappled sun; tolerates more sun if soil stays consistently moist.\n-
    Likes steady moisture and humus—think bog-adjacent, not swamp-in-a-pot. Good drainage
    still matters to avoid anaerobic funk.\n- Container culture works if you refuse to
    let it dry out.\n\n✂️🌱 Methods to Propagate:\n- Division: tear a mat apart; any
    piece with stem nodes contacts soil and roots.\n- Stem cuttings laid on moist
    medium root in days.\n- Seed is possible but slow and uneven; vegetative propagation
    is what people actually do.\n\n🧑‍🌾 When to Harvest:\n- Snip young leaves and
    short stems anytime; frequent harvest keeps growth tender. Avoid harvesting from
    questionable roadside sites—heavy metals and dog traffic are not seasoning."
  purpose: |-
    - Edible: Mild, slightly bitter leaves in salads, teas, and Southeast Asian soups.
    - Medicinal: Long history of topical and internal use in traditional medicine; verify sources and contraindications yourself.
    - Ground Cover: Dense mat suppresses weeds in shade gardens and food forests.
