    want heat, humidity, and shade when young.\n\nFlorida and Puerto Rico / subtropical: Marginal
    at best outdoors; coastal south Florida triers with canopy shade and winter protection
    experiments exist. Everyone else: greenhouse or vacation.\n\nSun and water: Part
    shade for juveniles; more sun with age in humid air. Consistent soil moisture; intolerant
    of drought once pushing new spears.\n\nPropagation: Fresh seed; clumping habit from
    multiple stems—division is not a casual weekend trick on big specimens."
