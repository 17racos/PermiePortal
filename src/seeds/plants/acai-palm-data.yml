description: |-
  Açaí is the multi-stemmed palm behind the purple smoothie bowl industrial complex—slender trunks, pinnate leaves, and fruit borne in hanging clusters that want heat, humidity, and shade when young. Marginal at best outdoors; coastal tropical and subtropical zones triers with canopy shade and winter protection experiments exist. Everyone else: greenhouse or vacation.

  Part shade for juveniles; more sun with age in humid air.
  Consistent soil moisture; intolerant of drought once pushing new spears.

  Fresh seed.
  Clumping habit from multiple stems—division is not a casual weekend trick on big specimens.

  Process fruit pulp soon after harvest; quality drops fast once picked, especially on hot days. Palm-heart harvest kills that stem—plan accordingly (sustainability debates apply).
purpose: |-
  Edible: Euterpe oleracea clusters yield fatty purple pulp for same-day processing into bowls and beverages while palm-heart harvest removes one entire stem from the clump -- plan which trunks you sacrifice because that stem does not regrow.
  Wildlife Attractor: Pendant infructescences in Amazonian-style humidity feed fruit bats, parrots, and insects that evolved with clustering palms -- leave lower heads in wilder margins if you want honest frugivore traffic beyond the smoothie economy.
  Mulcher: Evergreen pinnate fronds shed steadily in wet heat, building a thick acidic litter mat that cools soil for cacao seedlings, turmeric, and other shade guild members tucked under the outer drip line.
