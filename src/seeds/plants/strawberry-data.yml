  description: "Strawberry plants are low-growing, spreading perennials that produce sweet, red fruits. They spread via runners\
    \ and are commonly grown in garden beds, containers, or as ground cover. The plant has trifoliate green leaves with serrated\
    \ edges, and it produces small white or pink flowers before fruiting.\n\nStrawberries thrive in well-draining soil rich\
    \ in organic matter. They require full sun and consistent moisture to produce a bountiful harvest. The plant attracts\
    \ pollinators, especially bees, and provides a food source for wildlife.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n\
    - Requires full sun (6-8 hours per day).\n- Prefers moist but well-drained soil.\n- Regular watering is necessary, but\
    \ avoid waterlogging.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Runners: The primary method; daughter plants root and establish\
    \ themselves.\n- Seeds: Less common; requires cold stratification for germination.\n- Division: Established clumps can\
    \ be divided every 3 years for better yield.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- Harvest\
    \ when berries are fully red and plump.\n- Best picked in the morning when temperatures are cooler.\n- Continual harvesting\
    \ encourages more fruit production."
