  description: "Prickly elder (Aralia spinosa), widely called devil’s walking stick,
    is a deciduous understory tree of eastern North America that erupts each spring
    with huge bipinnate leaves on spiny stems. Creamy panicles tower above foliage
    in summer, followed by dark berries on colorful pedicels. It is a statement plant
    for naturalistic edges where drama beats lawn minimalism.\n\n☀️💧 Sun and Water
    Requirements:\n- Part shade to sun; best stem color and bloom in bright edge
    light.\n- Moderate moisture; tolerates seasonal dry once roots run but wilts
    in extreme drought without mulch.\n- Rich, well-drained humus; tolerates clay
    if drainage is honest.\n\n✂️ Propagation:\n- Seeds: double dormancy common—sow
    fresh and wait, or stratify in stages.\n- Root cuttings from thick roots in winter.\n-
    Suckers can be dug with roots in spring.\n\n🌾 Harvest / Best Use Timing:\n- Berries
    are sparingly used in traditional foodways; modern foragers should verify preparation
    and tolerance.\n- Cut spent inflorescences if self-sowing is unwanted in small
    lots.\n- Wear leather when handling stems—spines are not decorative fiction."
