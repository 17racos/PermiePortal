  description: "Cockspur hawthorn (Crataegus crus-galli) is a native North American hawthorn of thickets, pastures, and woodland\
    \ edges, armed with long thorns and bearing white spring blossoms followed by red to maroon haws. It typically forms a\
    \ broad crown 20–30 feet (6–9 m) tall with glossy, often nearly evergreen leaves in mild winters. In hedgerows it is a\
    \ livestock barrier and wildlife pantry—plan access routes before the thorns write policy.\n\n☀️\U0001F4A7 Sun and Water\
    \ Requirements:\nFull sun to light partial shade; more sun improves flowering and fruiting. Tolerates drought and poor\
    \ soils once established; occasional deep watering helps young transplants. Avoid planting in low pockets that stay saturated\
    \ for weeks without oxygen.\n\n ✂️ Propagation:\nSow seed after warm-cold stratification typical for Crataegus; chip hard\
    \ seed coats to reduce wait time. Hardwood cuttings are possible but slow; graft selected fruit lines if you chase specific\
    \ haw traits.\n\n\U0001F33E Harvest / Best Use Timing:\nCollect haws when fully colored and slightly soft for jellies;\
    \ tannins vary by timing and clone. Prune in late winter to remove crossing branches and improve light inside the crown—wear\
    \ armor."
  purpose: '- Edible: Fruit processes into jelly and syrup where sugar balances tannic structure.

