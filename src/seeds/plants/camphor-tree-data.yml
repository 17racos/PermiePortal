  description: |-
    Camphor tree (Cinnamomum camphora) is an evergreen tree from East Asia with aromatic leaves and wood that release a strong camphor scent when crushed. It can grow into a substantial canopy tree, often 15–30 m (50–98 ft) tall depending on climate and management. In permaculture, it earns the “structure” role: it shades understory crops, slows wind, and contributes fragrant leaf litter that supports soil life while you build a long-lived canopy system.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; brighter sites generally mean denser foliage.
    - Moderate watering during establishment, then it tolerates dry spells once rooted.
    - Prefers well-drained soil; prolonged waterlogging stresses roots.
    - Cold sensitivity appears as leaf damage; protect young trees during harsh freezes.
    
    ✂️ Propagation:
    - Seeds: use fresh seed when possible, warm-sow first, then use stratification if germination is slow; expect weeks to a few months.
    - Cuttings: semi-hardwood cuttings root under humidity in warm seasons, usually taking a couple of months.
    - Transplanting: where available, plant rooted seedlings/suckers to get canopy structure faster.
    
    🌾 Harvest / Best Use Timing:
    - Harvest leaves during routine pruning and use them as mulch; refresh leaf litter to keep soil covered.
    - Harvest aromatic material in small batches for better scent retention and easier drying.
    - Use trimmed wood as dry-stacking feedstock for paths, trellises, or small wood chips.
  purpose: |-
    Ornamental: Camphor Tree earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Shade Provider: Shade design leans on real canopy behavior: It can grow into a substantial canopy tree, often 15 - 30 m (50 - 98 ft) tall depending on climate and management. -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
    Windbreaker: Windbreak value is structural: It can grow into a substantial canopy tree, often 15 - 30 m (50 - 98 ft) tall depending on climate and management. -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
    Pest Management: Camphor Tree supports IPM stacks through scent masking, trap-crop sacrifice, or predator habitat when rotated thoughtfully -- confuses or repels problem insects through scent, trap crops, or habitat for predators you actually want
  companions:
  - Sweet Potato (Ipomoea batatas) — tolerates warm understory conditions and benefits from camphor litter mulch.
  - Ginger (Zingiber officinale) — likes humus-rich shade; leaf-litter mulch keeps moisture even.
  - Lemon Balm (Melissa officinalis) — aromatic understory companion that supports flexible harvesting around shade.
  cautions:
  - Keep leaf-litter from smothering seedlings; rake back and re-mulch after plants establish.
  practitioner_notes: |-
    Crushed leaves smell strong—work with intention, then compost or mulch once you’ve used the aromatic material.
    Plant where you want shade for years, not months; young camphor trees resent root disturbance.
    Prune to shape, not to “thin for fun”—heavy cuts invite stress and leaf drop.
  pests:
