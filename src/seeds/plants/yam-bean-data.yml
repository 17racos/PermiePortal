  description: 'Yam bean is a twining legume grown for the crunchy, sweet storage root—everything above ground is basically
    “do not snack unless you enjoy lectins yelling at you.” Seeds and raw pods are not party food. In subtropical and tropical
    Americas grow as a long warm-season annual; day-length varieties matter—short-day types tuberize where tropical types
    sulk.


    ☀️💧 Sun and Water Requirements:

    - Full sun for maximum photosynthate shoved into the root.

    - Deep, loose, well-drained soil; steady moisture during vine growth, backing off before harvest to reduce splitting.


    ✂️ Methods to Propagate:

    - Seeds: sow warm after frost; inoculate with appropriate rhizobia if your soil is sterile-minded.

    - Tubers do not reliably propagate like potatoes—seed is standard.


    🌾 Harvest notes:

    - Dig before hard frost; roots enlarge late—patience beats golf-ball disappointment.'
  purpose: '- Edible: Crisp root raw or in salads; cooking options exist—peel like you mean it.

    - Nitrogen Fixer: Nodules quietly help the bed if you treat roots gently at harvest.

    - Ground Cover: Temporary vine cover on trellis—do not confuse vigor with permission to ignore supports.'
  companions:
  - Corn
  - Sunflower
  - Low-growing herbs at the base that tolerate shade
  cautions:
