description: |-
  Campomanesia phaea is a slow Brazilian myrtle with dark aromatic leaves and yellow aromatic fruit that taste like pineapple had a fling with guava— soft pulp, big seeds, and a cult following among rare-fruit people.

  Best in protected 9b+ microclimates; young plants need frost care. Likes humidity but wants drainage—classic myrtle paradox.

  Full sun to part shade; rich acidic soil preferred.
  Regular deep watering in dry spells; mulch to keep roots cool.

  Seeds (variable, slow); grafting onto related rootstocks for serious orchards.

  Harvest soft yellow fruit when aroma peaks for fresh eating and preserves; handle gently to avoid bruising.
purpose: |-
  Edible: yellow aromatic berries yield soft pineapple-guava pulp -- for fresh spoonsful and small-batch preserves once seeds are spat or sieved out.
  Ornamental: keeps glossy myrtle foliage on a slow small tree frame that suits collectors who want structure -- without instant orchard volume in warm acidic beds.
  Wildlife Attractor: ripe fruit perfumes the air for birds and mammals that strip branches quickly unless nets or early picks beat their timing -- in humid sites.
