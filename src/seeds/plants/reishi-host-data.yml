    target; \"Ganoderma lucidum\" on American yard trees is often not what Asian
    commerce sells. In subtropical and tropical Americas they appear on stressed oaks and other hardwoods;
    the tree is usually telling you something about roots or heart rot. Harvest
    ethics include not killing your grandmother's live oak for tea clout.\n\n☀️💧
    Sun and Water:\n- Natural on trunks and stumps; partial shade typical.\n- Outdoor
    cultivation uses buried logs or stumps in shade with long timelines.\n- Humidity
    helps conk formation; dry yards produce sad little coasters.\n\n✂️ Propagation:\n-
    Commercial kits and sawdust blocks for controlled production.\n- Landscape
    inoculation is slow and site-specific — research strain and host."
