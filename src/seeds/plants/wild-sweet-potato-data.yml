    vigorously in warm months; manage it like a native vine with boundaries.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun to light shade; blooms more in sun.\n-
    Average soil moisture; tolerates summer humidity but rots in constantly soggy
    low spots.\n- Provide a trellis, dead tree, or tolerant shrub—do not unleash
    on delicate perennials without a plan.\n\n✂️ Methods to Propagate:\n- Sow scarified
    seed after frost danger in spring; nick seed coat carefully to improve soak.\n-
    Root cuttings from young root pieces are possible but slow—mostly a curiosity.\n-
    Easiest expansion is allowing established plants to resprout from root crown;
