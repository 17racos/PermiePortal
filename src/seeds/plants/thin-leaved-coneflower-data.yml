  description: 'Thin-leaved coneflower (Rudbeckia triloba) is a short-lived perennial or biennial of North American prairies
    and disturbed ground, with small yellow rays, dark central cones, and deeply lobed leaves on branched stems often 2–5
    feet (60–150 cm). It self-sows enthusiastically into sunny gaps, feeding pollinators during mid-to-late summer. Treat
    it as a dynamic meadow element—not a static foundation shrub.


    ☀️💧 Sun and Water Requirements:

    Full sun for densest bloom; light shade reduces flower count. Average to slightly moist, well-drained soils suit it; tolerates
    poor soils and short drought once established. Mulch lightly; avoid waterlogging.


    ✂️ Propagation:

    Sow seed outdoors in fall or cold-stratify for spring trays. Allow self-sowing where volunteers are welcome; deadhead
    near paths if pavers matter.


    🌾 Harvest / Best Use Timing:

    Cut flowers when rays are fresh for short bouquets. Leave seed heads for finches. Peak bloom tracks mid-to-late warm season
    heat.'
