  description: "Dioscorea polystachya is the twining yam with tiny edible bulbils
    (“air potatoes”) and larger underground tubers—nutty when cooked, invasive where
    laws say so. Florida and several states side-eye it; check before planting.\n\n
    Florida and Puerto Rico: Vigorous in humid summers; dies back after cool snaps in
    the cooler parts of the Florida peninsula while tubers persist. In frost-free islands and south Florida
    it never rests—trellis hard or watch it audition as a strangler.\n\n
    ☀️💧 Sun and Water Requirements:\n- Full sun to part shade; fertile soil with
    deep loosened zones for tuber expansion.\n- Steady moisture while vines run;
    dry-down cues vary by climate—learn your local calendar.\n\n✂️ Propagation:\n-
    Bulbils, tuber pieces, or seed (less common in gardens)—assume everything wants
    to spread.\n- Collect aerial bulbils before they ping neighbors' fences.\n\n🌾
    Harvest / Best Use Timing:\n- Dig main tubers after vines yellow; cook bulbils
    like mini yams once ID and legality are squared away."
  purpose: |-
    Calories with legal homework:

    - Edible: Main tubers and fingernail-sized aerial bulbils are starchy fare when cooked—never raw, never ambiguous ID.
    - Ground Cover: Summer leaf wall shades soil and can climb trellises designed for weight, not for delicate saplings you forgot to prune.
    - Biomass: Vines compost into bulky mulch for the next bed once frost or machete ends the season.
    - Dynamic Accumulator: Years of tuber growth mine deeper horizons; you only capture that mineral freight if you cycle residues and compost on-site.
  companions:
  - Comfrey
  - Sunflower
  - Pawpaw
  avoid:
