    return them as leaf litter, tea, or compost. Classic examples include comfrey,
    yarrow, dandelion, and dock; your actual lineup depends on zone, ethics, and
    whether you are okay with aggressive spreaders. In humid food forests, pair accumulators with fruit trees and mulch circles, not with naive
    “set and forget” optimism.\n\n☀️💧 Sun and Water Requirements:\n\nVaries by species; most accumulators want full sun to partial shade.\nDeep moisture
    helps comfrey-class miners; taprooted weeds laugh at occasional drought once established.\nAvoid waterlogging-prone species on flat, saturated sites during long humid rainy spells unless the planting is elevated or drained.\n\n✂️ Propagation:\n\nSpecies-specific: root cuttings,
    seed, division — see each plant’s file (e.g. Comfrey).\nDesign move: plant downslope
    of fruit trees and cycle clippings uphill as mulch.\n\n🌾 Harvest / Best Use Timing:\n\nCut leafy biomass before flowering for maximum mulch quality
