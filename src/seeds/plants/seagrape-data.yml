description: |-
  Seagrape is the coastal shrub with round leaves the size of salad plates and fruit clusters that look like micro-grapes—astringent fresh, friendlier in jelly and wine after you respect the seed. It stabilizes dunes and laughs at salt spray; inland subtropical and tropical Americas lacks the maritime vibe it prefers, though warm pockets try. Dioecious: plant both sexes for fruit, or enjoy the foliage architecture solo.

  Full sun on coast; tolerates some shade inland with less fruit. Sandy, well-drained soils; salt-tolerant—do not drown roots in lawn bowls.

  Seeds: clean and sow warm; germination moderate. Hardwood cuttings used in restoration nursery practice.

  Fruit darkens when ripe; process for jam—expect tannin without sugar.
purpose: |-
  Edible: Coccoloba uvifera pendulous clusters ripen burgundy with astringent bite -- simmer into jelly or wine after you spit the large seeds and plant both sexes if you expect fruit at all.
  Erosion Control: Spreading stems root along prostrate branches so dunes keep elevation -- while roots hang onto coastal shell cuts.
  Wildlife Attractor: Cream flower spikes drip nectar for coastal insects -- before pea-sized fruit fuels migrating songbirds that strip clusters overnight.
  Windbreaker: Dinner-plate evergreen leaves shed salt spray and knock velocity off trade winds -- planted leeward of vegetable tunnels it extends the growing season.
