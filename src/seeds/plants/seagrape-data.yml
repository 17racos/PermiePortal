  description: 'Seagrape is the coastal shrub with round leaves the size of salad plates and fruit clusters that look like
    micro-grapes—astringent fresh, friendlier in jelly and wine after you respect the seed. It stabilizes dunes and laughs
    at salt spray; inland subtropical and tropical Americas lacks the maritime vibe it prefers, though warm pockets try. Dioecious:
    plant both sexes for fruit, or enjoy the foliage architecture solo.


    ☀️💧 Sun and Water Requirements:

    - Full sun on coast; tolerates some shade inland with less fruit.

    - Sandy, well-drained soils; salt-tolerant—do not drown roots in lawn bowls.


    ✂️ Methods to Propagate:

    - Seeds: clean and sow warm; germination moderate.

    - Hardwood cuttings used in restoration nursery practice.


    🌾 Harvest notes:

    - Fruit darkens when ripe; process for jam—expect tannin without sugar.'
  purpose: '- Edible: Jellies and beverages where fruit is available—spit seeds like a civilized mammal.

    - Erosion Control: Roots and sprawling habit on dunes and coastal cuts.

    - Wildlife Attractor: Birds on fruit; pollinators on flowers.

    - Windbreaker: Broad leaves knock wind near shore plantings.'
  companions:
  - Saw Palmetto
  - Muhly Grass
  - Yucca
  cautions:
  - Deep freeze inland sites without protection
  - Heavy clay with poor drainage away from coast
  pests:
  - Aphids
  - Rhubarb Curculio
  - Scale Insects
  - Whiteflies
  practitioner_notes: 'Dioecious—single-sex plantings yield pretty leaves, empty fruit bowls.

    Fruit ripens unevenly on the cluster—pick by color stage, not one-cut harvest.

    Salt wind sculpts plants—expect lean silhouette on beachfront sites.'
