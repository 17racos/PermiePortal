  description: "Florida willow (Salix caroliniana) is a fast-growing native willow
    of riverbanks, swales, and freshwater wetlands across the southeastern United
    States and parts of the Caribbean, often multi-trunked with narrow leaves and
    catkins that arrive as early insect groceries. It stabilizes banks while dropping
    fine litter that feeds aquatic food webs—engineering with twigs instead of riprap
    cosplay. Use it in restoration, livestock shade along ponds, and biomass coppice
    trials where periodic cutting is part of the plan, not a crisis response.\n\n
    ☀️💧 Sun and Water Requirements:\nFull sun to partial shade; demands abundant soil
    moisture or proximity to water tables. Tolerates brief inundation; struggles on
    dry uplands without irrigation. Roots are aggressive toward pipes and septic fields—site
    with infrastructure paranoia. Hardy through cool-temperate winters at the north
    end of its range; heat-tolerant in humid subtropical climates.\n\n✂️ Propagation:\n
    Hardwood cuttings stuck directly into moist soil root readily in warm weather.\n
    Wild-collected poles for live staking should follow ethical and legal guidelines;
    nursery liners are simpler.\n\n🌾 Harvest / Best Use Timing:\nCoppice on 2–4 year
    rotations for basket willow trials or mulch chips; cut during dormancy when
    possible. Leave flowering wood early in the season for pollinators if managing
    for wildlife."
