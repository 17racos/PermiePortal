  description: 'Corchorus olitorius is the dual-use annual malvaceous workhorse: edible leafy greens in many cuisines and
    bast fiber in the ''actually industrial'' sense. It wants long sultry days, fertile soil, and moisture when it is stacking
    biomass—heat the way monsoon summers deliver it. Treat it like kenaf''s slimmer cousin: not subtle, not evergreen, not
    impressed by your spring frost dates.


    ☀️💧 Sun and Water Requirements:


    Full sun.

    Rich, well-drained soil with steady moisture during explosive growth.

    Heavy feeding — feed the plant before it feeds your regrets.


    ✂️ Propagation:


    Direct sow after soil warms; dense planting for fiber trials, wider for leaf harvest.

    Optional indoor starts if you are racing the season.


    🌾 Harvest / Best Use Timing:


    Young leaves for greens; stems for fiber at stages before they turn into rope that hates you.'
  purpose: '- Fiber: Summer bast fiber trials without corporate supply chains—rotate beds and compost residues.

    - Edible: Leafy greens for molokhia-style dishes during hot-season flushes.

    - Cover Crop: Fills the hot-season biomass slot between other crops—not a landscape shrub.

    - Green Manure: Turn under before seed if you want organic matter without volunteer jute forests.'
  companions:
  - Pigeon Pea
  - Sunflower
  - Cowpea
  cautions:
  - Cold wet soil at sowing — seeds rot fast
  - Letting it dry to straw mid-growth if you wanted edible leaves
  pests:
  - Aphids
  - Banded Winged Whitefly
  - Cocoa Pod Borer
  - Japanese Beetles
  - Whiteflies
  practitioner_notes: 'Blanch or process within hours if you are freezing—enzymes keep chewing while paperwork waits.

    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.

    Notebook one weird year—weather anomalies repeat; memory lies, scribbles do not.

    Overfertilized fast growth dilutes flavor and invites sap feeders—lean soil often tastes more like itself.'
