    ☀️💧 Sun and Water Requirements:


    Full sun.

    Rich, well-drained soil with steady moisture during explosive growth.

    Heavy feeding — feed the plant before it feeds your regrets.


    ✂️ Propagation:


    Direct sow after soil warms; dense planting for fiber trials, wider for leaf harvest.

    Optional indoor starts if you are racing the season.


    🌾 Harvest / Best Use Timing:


    Young leaves for greens; stems for fiber at stages before they turn into rope that hates you.'
