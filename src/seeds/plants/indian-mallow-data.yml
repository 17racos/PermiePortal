  description: "Indian mallow (Abutilon theophrasti), better known as velvetleaf,
    is a warm-season annual malvaceous weed of row crops and disturbed ground across
    much of North America after centuries of accidental introduction from Asia. Heart-shaped
    softly hairy leaves and yellow-orange flowers give it away; seeds persist in soil
    seed banks like grudges. Fiber traditions exist in its native range—here it is
    mostly an agricultural antagonist and a case study in seed longevity. Mentioning
    it in permaculture is honest only if the word 'invasive' leads the sentence.\n\n
    ☀️💧 Sun and Water Requirements:\nFull sun; thrives in fertile, moist agricultural
    soils—exactly where you do not want it competing with cash crops. Tolerates heat
    and moderate drought once established but grows largest with irrigation and nitrogen.
    Shade suppresses it; dense living mulches reduce seedling success better than speeches.\n\n
    ✂️ Propagation:\nAccidental—seeds shatter near parent plants and ride equipment
    between fields.\nTo reduce spread, mow or pull before seed set; compost hot piles
    to kill seeds if feasible.\n\n🌾 Harvest / Best Use Timing:\nFiber trials harvest
    stems at bloom to early seed for retting experiments—wear gloves; hairs irritate
    skin. Do not promote seed production near farms or natural areas."
  purpose: |-
