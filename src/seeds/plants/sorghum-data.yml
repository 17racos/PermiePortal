description: |-
  Sorghum (Sorghum bicolor) is a warm-season cereal grown for grain, forage, and sturdy biomass. It is native to Africa and now thrives in many warm temperate and subtropical regions, especially where heat and drought are routine. Plants typically reach 1–3 m (3–10 ft) tall with strong stems and flowering heads that dry into seed. In permaculture, sorghum matters because it provides reliable calories and feed while acting like living armor: dense stems and roots protect soil from wind and rain, and residues become compost and mulch inputs.

  Full sun; growth depends on bright, warm conditions. Moderate water for establishment; sorghum tolerates drought better than many grains. Prefers well-drained soil; avoid prolonged waterlogging. Heat during flowering is usually manageable if soil moisture isn’t extreme.

  Seeds (direct sow): sow after soil warms; germination commonly occurs within 4–10 days. Thin for spacing if you want better head/seed development. Relay sow: stagger plantings for harvest spread and to keep ground covered.

  Grain: harvest when heads are dry and seeds hard. Forage: cut green growth at appropriate stage for fresh or dried feed. Biomass/mulch: cut after seed set or earlier for green material depending on your plan.
purpose: |-
  Edible: Sorghum bicolor white and red grain grinds into gluten-free flours, popped snacks, and beer malts that keep in dry storage -- when moisture stays below 14 percent in the bin.
  Animal Fodder: Sweet-stem types cut for silage while still juicy -- match prussic acid protocols on frosted forage before turning cattle in.
  Erosion Control: C4 tillers close canopy fast on summer fallow so monsoon rains meet living roots -- instead of bare subsoil.
