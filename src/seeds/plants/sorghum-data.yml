  companions:
  - Soybean (Glycine max) — warm-season pairing lets you balance grain output with nitrogen input when managed in rotation.
  - Sunflower (Helianthus annuus) — tall companion helps shade ground and creates a diverse canopy structure.
  - Corn (Zea mays) — shared warm timing and canopy layering creates a stable, weed-suppressing mix.
  cautions:
  - Avoid planting repeatedly in the same spot; grain pests and diseases build with continuous cereal culture.
  practitioner_notes: |-
    Cut for green feed before stems get woody if you want better palatability.
    For grain, let heads truly dry—harvesting too early increases spoilage.
    Relay sow so bare ground doesn’t become your weed invitation.
