  description: "Beautyberry (*Callicarpa americana*) is a deciduous shrub native to
    the southeastern United States. It typically grows 3 to 6 feet (0.9 to 1.8 meters)
    tall and wide, featuring an open, loose appearance with arching branches. The
    plant bears medium green, opposite leaves with a coarse texture. In summer, small,
    pink to lavender flowers emerge in clusters (cymes) at the leaf axils, giving
    way to striking clusters of glossy, bright purple berries in the fall. These vibrant
    fruits often persist into winter, providing visual interest and food for wildlife.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- **Seeds:** Collect fully ripened (purple) berries and
    extract the seeds. Sow them in pots or directly in the ground in fall or spring,
    covering lightly with soil. Germination may take several weeks.\n- **Cuttings:**
    Take semi-hardwood cuttings in late summer. Remove the lower leaves and plant
    the cuttings in a well-draining medium. Maintain high humidity and indirect light
    until roots develop.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\n- **Sun:**
    Thrives in full sun to partial shade. While it can tolerate full shade, berry
    production is more prolific with increased sunlight.\n- **Water:** Prefers moist,
    well-drained soils but is adaptable to various soil types. Once established, it
    exhibits moderate drought tolerance. Regular watering promotes healthy growth
    and fruiting.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    **Berries:** Harvest the berries in early fall when they are fully mature and
    vibrant in color. They can be used to make jellies, wines, or left on the shrub
    to support local wildlife."
