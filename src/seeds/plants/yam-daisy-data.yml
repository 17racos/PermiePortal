  description: "Yam daisy (Microseris walteri) is an Australian perennial grown for
    elongated tuberous roots that were a staple for First Nations peoples—flavor is
    mild, starchy, and sweet when roasted. Rosettes of narrow leaves sit close to
    the ground, sending up dandelion-like stems with yellow composite flowers when
    mature. Plants are still niche outside their homeland; in Florida and Puerto
    Rico treat trials as experimental—provide sharp drainage, avoid tropical oven
    nights without research selections, and source ethically propagated stock.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for strongest flowering and tuber sizing.\n-
    Low to moderate water once established; tubers rot in compacted wet clay.\n- Sandy-loam
    with organic matter mimics many successful Australian production beds.\n\n✂️ Methods
    to Propagate:\n- Sow fresh seed on surface; light helps germination—do not bury
    deeply.\n- Divide dormant tubers like small fingerlings before spring growth;
    heal cuts in dry shade briefly before replanting.\n- Save seed from multiple
    plants to maintain diversity if your line fruits.\n\n🌾 Harvest / Best Use Timing:\n-
    Dig tubers after tops die back in cool-dry weather; cure briefly and store like
    other root vegetables.\n- Flowers support pollinators; delay full-site tillage
    until you understand your population’s dormancy cues."
  purpose: |-
