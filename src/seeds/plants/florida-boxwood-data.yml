  description: "Florida boxwood (Schaefferia frutescens) is a slow-growing evergreen
    shrub of coastal hammocks, shell mounds, and limestone margins in southern peninsular
    areas and the Caribbean, bearing small leathery leaves, inconspicuous flowers,
    and bird-dispersed fruits on female plants. It offers a native alternative aesthetic
    to imported Buxus hedges—without pretending identical shearing tolerance. Use
    it in salt-touched landscapes, dune scrub interiors, and food forest edges where
    you want fine texture and low stature that does not pretend to be turf.\n\n☀️💧
    Sun and Water Requirements:\nFull sun to partial shade; densest growth in bright
    light with adequate moisture. Tolerates brackish winds and lean, well-drained,
    alkaline soils derived from shell; poor fit for heavy wet clay inland. Drought
    tolerance increases with establishment but young plants need even watering. Protect
    from hard freezes below roughly 25°F (-4°C) on exposed sites.\n\n✂️ Propagation:\n
    Seeds cleaned and sown warm may germinate irregularly; patience is standard equipment.\n
    Semi-hardwood cuttings under mist can clone known female fruiting plants if you
    want berries.\n\n🌾 Harvest / Best Use Timing:\nLandscape maintenance is the main
    yield—light tip pruning after warm-season growth preserves natural form. Collect
    local seed only where legal and ethical for restoration projects."
  purpose: |-
