  description: |-
    Sea plantain is the coastal cousin of the plantains your lawn hates — same genus, salt on its boots, better PR. Young leaves are a salty-green nibble; older leaves teach you about fiber. It hugs brackish margins, shell middens, and dunes where lesser herbs cry. In subtropical and tropical Americas it is a legit native-adjacent forage along Gulf and Atlantic edges if you ID carefully and skip polluted wrack lines.

    ☀️💧 Sun and Water Requirements:
    - Full sun typical of coastal exposure.
    - Tolerates salt spray and periodic inundation; needs drainage between tides in garden mimic beds.
    - Freshwater garden culture: lean, gritty soil; do not over-fertilize into lush slug bait.

    ✂️ Methods to Propagate:
    - Seeds: cold stratify or direct sow in cool season; keep moist until established.
    - Division: split tight crowns in cool weather for quick clumps.
  purpose: |-
    Sea plantain earns its spot on the edge:

    - Edible: Young leaves raw or cooked; harvest ethics: rotate patches, do not strip public dunes.
    - Medicinal: Plantain-family topical use shows up in folk practice — research before pretending you are a clinic.
    - Erosion Control: Fibrous roots stabilize sandy, salty soils.
    - Wildlife Attractor: Flowers feed small pollinators in lean habitats.
  companions:
  - Saltwort
  - Sea purslane
