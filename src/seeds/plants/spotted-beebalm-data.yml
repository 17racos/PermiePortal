  description: "Spotted beebalm (Monarda punctata) is an aromatic perennial of eastern North American dry prairies, sandhills, and roadsides, bearing tiered whorls of creamy flowers speckled with purple spots and bracts that read like tiny pagodas. Plants reach 1–3 feet (30–90 cm), thriving in sun and lean soils where beebalm mildew would otherwise monologue. It is a powerhouse for native bees and wasps when mass-planted in restoration strips.\n\n☀️💧 Sun and Water Requirements:\nFull sun for densest flowering and strongest fragrance. Well-drained, sandy to gravelly soils are ideal; tolerates drought once established. Avoid heavy wet clay; mulch lightly without burying crowns.\n\n✂️ Propagation:\nSow seed outdoors in fall or cold-stratify 60 days. Divide clumps in spring. Cut back after seed set if spread is too chatty near paths.\n\n🌾 Harvest / Best Use Timing:\nHarvest aerial parts for teas and experiments when flowers are active—follow vetted guidance. Peak bloom tracks mid-to-late warm season heat."
  purpose: |-
    - Pollinator: Spotted flowers and oils attract specialist bees and wasps during mid-summer.
    - Medicinal: Traditional uses exist for aromatic oils—verify safety before internal use.
    - Wildlife Attractor: Dense flower tiers support diverse insects in lean-soil meadows.
    - Ornamental: Architectural whorls add vertical rhythm to dry garden designs.
  companions:
