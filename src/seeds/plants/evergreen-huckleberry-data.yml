  description: "Evergreen huckleberry (*Vaccinium ovatum*) is a West Coast native
    shrub with small leathery leaves, pinkish urn-shaped flowers, and dark sweet-tart
    berries. It typically forms a dense mound 3–8 feet tall in sun or part shade,
    taller in dim forest edges. In subtropical and tropical Americas it is a collector's acid-soil
    plant—think pine bark, peat-free ericaceous mixes, and reliable irrigation without
    waterlogging; lowland heat and alkaline water make it a challenge without deliberate
    soil management.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nMorning
    sun with afternoon shade, or bright dappled shade all day. Keep root zone moist
    and acidic; drip irrigation beats overhead watering during humid spells to reduce
    leaf spot pressure.\n\n✂️ **Methods to Propagate:**\n- **Softwood cuttings:**
    Take semi-ripe cuttings in summer, use rooting hormone, and keep humid until
    roots form.\n- **Seeds:** Cold-moist stratify seed for several weeks, then sow
    in acidic medium; seedlings are slow but true to type.\n\n\U0001F9D1‍\U0001F33E
    **When to Harvest:**\nBerries ripen dark purple-black, often late summer into
    fall depending on climate. Pick when fully soft; flavor improves after a light
    frost in climates that freeze, but in frost-free sites judge by color and tug."
  purpose: |-
    - **Edible:** Berries are eaten fresh, cooked, or preserved; a high-flavor acid fruit for forest-garden shrub layers.
    - **Wildlife Attractor:** Flowers feed native bees; fruit feeds birds and small mammals.
    - **Border Plant:** Evergreen foliage gives year-round structure along paths and woodland edges.
    - **Erosion Control:** Fibrous roots stabilize slopes under trees where grass struggles.
    - **Ornamental:** New growth is often bronzy; neat habit suits formal and naturalistic plantings.
