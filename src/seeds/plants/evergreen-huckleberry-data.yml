  description: 'Evergreen huckleberry (*Vaccinium ovatum*) is a West Coast native shrub with small leathery leaves, pinkish
    urn-shaped flowers, and dark sweet-tart berries. It typically forms a dense mound 3–8 feet tall in sun or part shade,
    taller in dim forest edges. In subtropical and tropical Americas it is a collector''s acid-soil plant—think pine bark,
    peat-free ericaceous mixes, and reliable irrigation without waterlogging; lowland heat and alkaline water make it a challenge
    without deliberate soil management.


    🌞💧 **Sun and Water Requirements:**

    Morning sun with afternoon shade, or bright dappled shade all day. Keep root zone moist and acidic; drip irrigation beats
    overhead watering during humid spells to reduce leaf spot pressure.


    ✂️ **Methods to Propagate:**

    - **Softwood cuttings:** Take semi-ripe cuttings in summer, use rooting hormone, and keep humid until roots form.

    - **Seeds:** Cold-moist stratify seed for several weeks, then sow in acidic medium; seedlings are slow but true to type.


    🧑‍🌾 **When to Harvest:**

    Berries ripen dark purple-black, often late summer into fall depending on climate. Pick when fully soft; flavor improves
    after a light frost in climates that freeze, but in frost-free sites judge by color and tug.'
