  description: "Florida tasselflower (Emilia fosbergii) is a warm-climate asteraceous annual or short-lived forb with bright\
    \ orange-red composite flowers on slender stems, naturalized in disturbed sites through much of the humid subtropics and\
    \ tropics of the Americas and beyond. Young leaves appear in some regional diets when identified correctly—treat eating\
    \ as a literacy test, not a dare. In gardens it is a quick nectar source for small butterflies and a self-seeding filler\
    \ in wildflower mixes; in agriculture it is sometimes labeled a weed because it tells the truth about bare soil and irrigation.\n\
    \n☀️\U0001F4A7 Sun and Water Requirements:\n Full sun; tolerates lean to moderately fertile, well-drained soils. Moderate\
    \ moisture speeds growth; drought slows flowering. Not frost-hardy—dies back below roughly 30°F (-1°C) without protection.\
    \ Avoid waterlogged heavy clay that rots the taprooted seedling stage.\n\n✂️ Propagation:\nSeeds: sow after frost risk;\
    \ germinates warm in days to weeks.\nTransplant thinned volunteers into beds where you want controlled color drifts.\n\
    \n\U0001F33E Harvest / Best Use Timing:\nIf using leaves as a pot herb, pick young growth before stems toughen. For pollinator\
    \ value, leave flowers until seeds mature if you want volunteers; deadhead early if self-sowing is unwelcome."
  purpose: '- Pollinator: Bright ligulate flowers attract small butterflies and skippers in warm months.

    - Edible: Young leaves are used in some cultures—verify species, site cleanliness, and personal tolerance.

    - Wildlife Attractor: Supports generalist pollinators in disturbed, sunny niches.

    - Ornamental: Saturated flower color on thin stems reads well in informal tropical borders.'
  companions:
