  description: "Prairie wild petunia (Ruellia humilis) is a low, spreading perennial of central North American dry prairies and glades, with lavender funnel flowers that last a day but repeat through warm months and hairy leaves that shrug at drought. Plants typically reach 6–18 inches (15–45 cm), rooting at nodes where stems touch soil. It is a quiet workhorse for dry rain-garden berms, rock gardens, and path edges that bake in summer.\n\n☀️💧 Sun and Water Requirements:\nFull sun for densest bloom; light shade acceptable in hot climates. Well-drained, lean to average soils mimic glade truth; wet clay rots crowns. Drought-tolerant once established; water deeply only during prolonged dry spells in the first year.\n\n✂️ Propagation:\nDivide clumps in spring; rooted layers transplant easily. Sow seed after last hard frost with surface press—germination warms with soil temperature above roughly 60°F (16°C). Cut back ragged stems after heavy bloom flushes to refresh foliage.\n\n🌾 Harvest / Best Use Timing:\nPrimarily ornamental—flowers are short-lived but produced in succession. Collect seed when capsules dry if expanding restoration patches. Peak bloom tracks heat waves through warm months, not imported holiday calendars."
