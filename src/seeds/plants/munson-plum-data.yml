  description: 'Munson plum (Prunus munsoniana) is a North American wild plum complex member—often thicket-forming—valued
    for small tart fruit, spring bloom, and wildlife cover on slopes and fence lines. Plants behave as large shrubs to small
    trees around 8–15 feet (2.5–4.5 m), spreading by suckers into bird-friendly thickets when soil disturbance allows. In
    temperate permaculture it fills early-succession edges, stabilizes cuts, and supplies jam-grade fruit without pretending
    to be a supermarket hybrid.


    ☀️💧 Sun and Water Requirements:

    Full sun for best flowering and fruit; tolerates light shade with reduced yield. Adapted to a range of soils if drainage
    is honest; occasional deep watering speeds establishment on dry banks. Mulch to reduce grass competition while suckers
    expand the thicket by design.


    ✂️ Propagation:

    Dig suckers with some root in dormancy and transplant immediately. Stratify seed 90–120 days cold-moist, then sow in spring.
    Thin interior stems after fruiting to reduce fungal lodging and improve air movement.


    🌾 Harvest / Best Use Timing:

    Pick when fruit softens and color shifts fully—often mid-to-late warm season depending on latitude. Process quickly into
    jams, shrubs, or ferments; thin skins do not imply long storage. Leave some fruit for birds if thicket ecology is part
    of the design.'
