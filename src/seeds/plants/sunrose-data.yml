  description: |-
    Sunrose (Helianthemum nummularium) is a low, wiry evergreen subshrub that carpets lean ground with gray-green leaves and short-lived saucer flowers in yellow, orange, or white—each bloom lasts a day, but the plant pumps more like a confetti machine. Mature mats run about 6–12 inches tall and spread 12–24 inches unless you shear them into submission.

    subtropical and tropical Americas: Think “rocky Mediterranean mood,” not “August parking lot.” In Florida’s humid subtropical summers it needs sharp drainage, air movement, and lean soil; wet roots rot faster than optimism. Puerto Rico’s wet season is brutal without grit and slope—treat as a container pet on a breezy patio or skip to native sun-loving groundcovers that do not sulk in monsoon humidity.

    ☀️💧 Sun and Water Requirements:
    - Full sun for maximum bloom; half-day sun only if heat is savage and soil drains like a colander.
    - Drought-tolerant once established; water deeply but rarely—never let pots sit in saucers of soup.

    ✂️ Propagation:
    - Semi-hardwood cuttings in late summer; use free-draining mix and gentle bottom heat if you are fancy.
    - Sow seed in spring after last frost risk; do not bury deeply—light helps germination in many cistaceous species.

    🌾 Harvest / Best Use Timing:
    - Ornamental use: shear lightly after main flush to tidy and encourage another wave of flowers.
    - No meaningful edible harvest—this is for bees, eyes, and ego, not the stew pot.
  purpose: |-
    - Ornamental: Flowers and silver foliage read as “designed chaos” on berms, rock gardens, and path edges.
    - Pollinator: Short-lived blooms still pump pollen and nectar for small bees when massed.
    - Ground Cover: Low mats exclude weeds on poor soils where fussier plants throw tantrums.
  companions:
  - Lavender — shared love of sun, drought, and insulting soil; both hate wet feet.
  - Sedum — shallow roots and succulence match drainage needs without root trench warfare.
  - Yarrow — deeper taproots and airy flowers contrast texture while tolerating lean beds.
  cautions:
  - Wet clay bowls that never dry
  - Aggressive irrigated turf that swamps the crown
  pests:
  - Aphids
  - Spider Mites
  - Root Rot
  practitioner_notes: |-
    Cluster patches three feet or wider—tiny one-offs get ignored by bees cruising for volume.
    Shear ragged mats after heat waves; two weeks of ugly beats six months of thatch rot.
    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.
    Foot traffic after establishment only—early walks tear stems and invite weeds in the wounds.
  growth_habit: Low evergreen subshrub; mats outward; daily flowers in season
