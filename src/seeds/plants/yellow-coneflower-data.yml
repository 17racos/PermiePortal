  description: 'Yellow coneflower (Rudbeckia laciniata) is a robust perennial of moist North American meadows, stream edges,
    and rain gardens, with deeply cut leaves and bright yellow rays around tall greenish central cones on stems often 3–8
    feet (0.9–2.4 m). It tolerates wet feet better than many rudbeckias, making it valuable in swales and pond margins where
    color is needed without drainage denial.


    ☀️💧 Sun and Water Requirements:

    Full sun to light partial shade; best flowering with strong light. Moist to average, well-drained soils suit it; tolerates
    seasonal wetness. Mulch to keep roots cool; avoid stagnant anaerobic muck over crowns.


    ✂️ Propagation:

    Divide clumps in spring; sow seed with cold stratification. Cut back in late winter if tidy gardens matter.


    🌾 Harvest / Best Use Timing:

    Cut flowers when rays are fresh for tall bouquets. Leave seed heads for finches. Peak bloom tracks mid-to-late warm season.'
  purpose: '- Pollinator: Large composite heads feed bees and butterflies during summer peaks.

    - Wildlife Attractor: Seeds feed birds; tall stems add vertical structure for insects.

    - Ornamental: Bright yellow flowers elevate moist meadow aesthetics.

    - Erosion Control: Fibrous roots stabilize moist banks and swale sides.'
  companions:
  - Swamp Milkweed — milkweed neighbor for monarch habitat in moist sun
  - Marsh Blazingstar — purple vertical forb contrast in wet meadow mixes
  - Switchgrass — warm-season grass matrix sharing moisture in sunny swales
  cautions:
  - Dry xeric berms without irrigation — stunted plants and fewer flowers
  - Tall stature — site at back of borders unless you enjoy hiding shorter plants
