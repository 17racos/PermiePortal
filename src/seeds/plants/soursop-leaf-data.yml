description: |-
  Annona muricata leaves get their own entry because humans love tea, tincture lore, and chop-and-drop mulch from the same tree that makes soursop fruit. Large, glossy, alternate leaves on a tropical tree that hates hard frost. Outside true tropics: greenhouse or heroic microclimate; outdoor year-round is mostly a collector conversation.

  ☀️💧 Sun and Water Requirements:

  Full sun once established in true tropical plantings.
  Deep, fertile, well-drained soil with steady moisture.
  Wind protection for young trees.

  ✂️ Propagation:

  Seeds from fresh fruit; long road to fruiting.
  Grafting selected cultivars for fruit quality.

  🌾 Harvest / Best Use Timing:

  Mature healthy leaves for drying/tea experiments — research safety and drug interactions yourself; this is not medical advice, it is leaf logistics.
purpose: |-
  Medicinal: Annona muricata dried leaves steep into folk teas beside acetogenin neurotoxicity papers -- align cup counts with clinicians when patients already take chronic meds.
  Edible: Leaves flavor wraps in some islands yet stay strictly seasoning -- same tree bears dessert pulp while foliage is not a crisp salad green.
  Mulcher: Plate-sized evergreen blades chop-and-drop acid-rich litter straight onto roots of understory ginger without hauling mulch off-site.
  Wildlife Attractor: Same canopy shelters anole lizards and sphinx larvae while overripe fruit on the ground pulls Caribbean fruit fly pressure if cleanup lags.
companions:
- Banana
- Papaya
- Guava
cautions:
- Marketing cures without doing homework and ethics
- Exposed frost for young flushes
pests:
- Caribbean Fruit Fly
- Scale Insects
- Mealybugs
- Caterpillars
