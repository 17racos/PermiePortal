- Edible
- Erosion Control
- Wildlife Attractor
description: |-
  Salicornia europaea is the jointed, salt-blessed succulent stem vegetable people pickle or blanch like the ocean sent asparagus. Thrives in saline soils and tidal margins where polite vegetables rage-quit. Coastal salt marshes are on-brand; inland gardeners can try salty irrigation experiments if they enjoy science projects.

  ☀️💧 Sun and Water Requirements:

  Full sun.
  Salt or brackish moisture — true halophyte energy.
  Not a freshwater shade bog plant.

  ✂️ Propagation:

  Seeds: sow where salinity and drainage match its coastal job description.

  🌾 Harvest / Best Use Timing:

  Young stems in summer; snap tops like you mean it and leave bases to regrow where sustainable.
purpose: |-
  Edible: Salicornia europaea young jointed stems blanch or pickle into clean ocean snap -- harvest tops on morning tides and leave basal joints when beds are sustainable.
  Erosion Control: Dense halophyte roots stitch mud banks and saline furrows where glycophyte vegetables chlorose and stall.
  Wildlife Attractor: Invertebrate density under dwarf succulent stems fuels shorebirds probing the marsh edge on rising water.
companions:
- Seagrape
- Sea Purslane
- Pond Apple
cautions:
- Standard vegetable bed logic — it wants salt, not compost monoculture
- Harvesting wild stands without knowing local protection rules
pests:
- Aphids
- Slugs
