  description: "Seminole pumpkin is a heat-loving Cucurbita moschata landrace tied to
    Florida Indigenous agriculture—tough vines, hard-shelled fruit, and a reputation
    for shrugging off humidity that makes northern pumpkins sulk. Fruit is typically
    round to squat, tan or green-striped, with sweet orange flesh used like winter
    squash or calabaza. In Florida and Puerto Rico it behaves like a very long-season annual
    unless winter is mild; farther south old vines can persist and resprout, which is
    why it is often called perennial pumpkin country lore.\n\n🌞💧 Sun and Water Requirements:\n-
    Full sun (6–8+ hours) for strong vines and fruit set.\n- Rich, well-drained soil;
    heavy feeders—compost or aged manure helps.\n- Steady moisture while fruiting;
    avoid wet foliage overnight where powdery mildew thrives. Cut water slightly as
    fruit nears maturity for storage quality.\n\n✂️🌱 Methods to Propagate:\n- Seed:
    Direct-sow after soil warms (~60°F+); in Florida and Puerto Rico many growers start indoors
    2–3 weeks before last frost to beat the clock.\n- Save seed from fully ripe fruit;
    this is a landrace—select from your best plants if you want local adaptation.\n-
    Not a cutting crop; propagation is by seed only.\n\n🧑‍🌾 When to Harvest:\n-
    When the stem corks and the rind resists a fingernail—before hard frost if you are
    on the cool edge of its range. Cure in warm dry air like other moschatas."
  purpose: |-
    - Edible: Nutrient-dense winter squash flesh; seeds are edible roasted.
    - Ground Cover: Aggressive vines shade soil and outcompete weeds between rows.
    - Animal Fodder: Vines and surplus fruit have traditional use as pig and poultry feed.
