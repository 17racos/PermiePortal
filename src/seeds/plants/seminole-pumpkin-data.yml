  description: 'Seminole pumpkin is a heat-loving Cucurbita moschata landrace tied to Florida Indigenous agriculture—tough
    vines, hard-shelled fruit, and a reputation for shrugging off humidity that makes northern pumpkins sulk. Fruit is typically
    round to squat, tan or green-striped, with sweet orange flesh used like winter squash or calabaza. In subtropical and
    tropical Americas it behaves like a very long-season annual unless winter is mild; farther south old vines can persist
    and resprout, which is why it is often called perennial pumpkin country lore.


    🌞💧 Sun and Water Requirements:

    - Full sun (6–8+ hours) for strong vines and fruit set.

    - Rich, well-drained soil; heavy feeders—compost or aged manure helps.

    - Steady moisture while fruiting; avoid wet foliage overnight where powdery mildew thrives. Cut water slightly as fruit
    nears maturity for storage quality.


    ✂️🌱 Methods to Propagate:

    - Seed: Direct-sow after soil warms (~60°F+); in subtropical and tropical Americas many growers start indoors 2–3 weeks
    before last frost to beat the clock.

    - Save seed from fully ripe fruit; this is a landrace—select from your best plants if you want local adaptation.

    - Not a cutting crop; propagation is by seed only.


    🧑‍🌾 When to Harvest:

    - When the stem corks and the rind resists a fingernail—before hard frost if you are on the cool edge of its range. Cure
    in warm dry air like other moschatas.'
