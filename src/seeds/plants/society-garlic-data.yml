  description: 'Tulbaghia violacea, known as Society Garlic, is a clump-forming perennial native to southern Africa. It reaches
    up to 0.5 meters (1.5 feet) in height and features narrow, strap-like, gray-green leaves that emit a garlic-like scent
    when bruised. From early summer to fall, it produces sweetly fragrant, lilac-pink tubular flowers arranged in umbels.
    The plant is both heat and drought-tolerant, making it suitable for various garden settings.


    🌞💧 Sun and Water Requirements:

    Thrives in full sun but can tolerate partial shade. Prefers well-drained soil and, once established, exhibits good drought
    tolerance. Regular watering during the growing season promotes optimal growth and flowering.


    ✂️🫘 Methods to Propagate:

    Propagation is commonly done through division of clumps during spring or autumn. Seeds can also be sown but may require
    smoke treatment to enhance germination rates.


    🧑‍🌾👩‍🌾 When to Harvest:

    Leaves and flowers can be harvested as needed throughout the growing season for culinary or medicinal uses.'
  purpose: |-
    Edible: Strappy leaves and lilac umbels taste milder than true garlic -- chop into cream cheese, butter, or potato salad where you want allium perfume without Allium sativum heat.
    Medicinal: Zulu and South African kitchens use leaf tea for cough and sinus pressure -- sulfur compounds can upset empty stomachs; separate occasional soup flavor from medicinal cup frequency.
    Pest Management: Bruised leaves confuse aphids on adjacent roses in small garden trials -- effect is contact and short-lived, not a fence against every insect flight.
    Ground Cover: Clumping mats eighteen inches tall fill dry berm plantings where liriope would want more water; divide every few years before centers go hollow in humid clay.
