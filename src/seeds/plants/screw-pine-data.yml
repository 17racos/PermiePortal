  description: "Screw pine (Pandanus utilis) is a tropical monocot tree with a stout,
    often prop-rooted trunk and spiral crowns of long, strap-like, spiny-margined
    leaves—hence the common name despite not being a true pine. Native to Madagascar
    and widely planted in the tropics, it reaches 20–40 feet or more, with aerial prop
    roots that thicken into buttresses at the base, giving storm resistance on coastlines.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun for dense crowns; tolerates coastal exposure
    and salt spray.\n- Moderate to generous water in the warm season; drought-tolerant
    once established but grows faster with steady moisture. In Florida and Puerto
    Rico, plant with room for roots and prop roots—avoid paving tight against the trunk.\n\n✂️
    Methods to Propagate:\n- Suckers/offshoots: remove well-rooted shoots from the
    base during the warm wet season and replant immediately.\n- Cuttings: large terminal
    cuttings are used in the tropics by skilled growers; keep humid until roots anchor.\n\n🌾
    When to Harvest:\n- Collect mature fruits for their fibrous keys; leaves are harvested
    for weaving and thatch when fully hardened. Wear gloves—margins are sharply serrated."
