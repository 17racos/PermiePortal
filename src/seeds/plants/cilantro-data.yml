  description: |-
    Cilantro (Coriandrum sativum) is a cool-season annual herb grown for two harvests: fresh leafy greens (cilantro) and dried aromatic seeds (coriander). It is native to the Mediterranean region and parts of Southwest Asia, and it typically reaches 30–60 cm (12–24 in) tall depending on conditions. In permaculture, cilantro buys you quick returns from short seasons, and when it flowers it turns into a nectar supplier that helps support the rest of the garden’s insect crew.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun works in cool weather; partial shade helps slow bolting during warmer periods.
    - Keep moisture steady for tender leaves; dry stress makes plants bolt faster.
    - Prefers loose, fertile soil with compost; heavy compaction reduces flavor and growth.
    - Manage heat: once hot spells start, leaf quality drops and flowering speeds up.
    
    ✂️ Propagation:
    - Seeds: direct-sow outdoors when days are cool; germination commonly takes 7–14 days with consistent moisture.
    - Succession sowing: repeat every 2–3 weeks to keep a continuous leaf harvest instead of one dramatic “all at once” bolting event.
    - Transplant (optional): start indoors briefly, then transplant carefully to avoid root disturbance.
    
    🌾 Harvest / Best Use Timing:
    - Leaves: harvest early and often, before stems get tall; cut outer stems and let the plant regrow if possible.
    - Seeds: let umbels dry on the plant until brown; cut, bag, and finish drying, then rub out seeds.
    - Use fresh leaves for bright flavor; dry seeds for storage and grinding.
  purpose: |-
    Edible: Leaves and seeds provide fast kitchen inputs, letting you harvest repeatedly from the same bed section.
    Medicinal: Cilantro’s aromatic compounds show up in traditional use for digestive comfort; in permaculture it’s a functional “kitchen herb” crop.
    Pollinator: Umbels of small flowers feed beneficial insects during the transition from leafy harvest to seed harvest.
  companions:
  - Lettuce (Lactuca sativa) — shared cool-season window and similar moisture needs make scheduling easier.
  - Marigold (Tagetes patula) — attracts beneficial insects and helps you spot aphid flare-ups sooner.
  - Carrot (Daucus carota) — rotating between roots and greens diversifies your bed structure and supports soil biodiversity.
  cautions:
  - Bolting happens in heat; use partial shade and succession sowing to keep leaves usable.
  practitioner_notes: |-
    Harvest early, not when you feel brave—cilantro flavor collapses fast once it wants to seed.
    For long runs, sow in small batches instead of one big gesture.
    If you want coriander seeds, stop snipping leaves; let flowering complete.
  pests:
  - Aphids
  - Slugs
  - Root Rot
  - Spider Mites
