description: |-
  Calathea allouia is the shade-loving arrowroot relative that makes crunchy, juicy corms with a mild sweet flavor—think water chestnut that went tropical. Leaves are big and ornamental; no full-sun machismo.

      subtropical and tropical Americas: Best under partial shade of fruit trees; protect from hard freezes in cooler pockets. Loves humidity; mulch hard.

  ☀️💧 Sun and Water Requirements:
  - Part to full shade in hot climates; avoid blasting midday sun on leaves.
  - Rich, moist, well-drained soil high in organic matter; never let pots sit saucer-wet.

  ✂️ Propagation:
  - Divide clumps when dormant or during active growth with care to buds on rhizomes.
  - Harvest corms and replant smaller offsets; label clones if you maintain named lines.

  🌾 Harvest / Best Use Timing:
  - Lift corms when tops begin to senesce or when size is right for the recipe—boiled, pickled, or sliced like water chestnut analogs.
  - Replant the smallest offsets immediately so the clump regenerates.
purpose: |-
  Edible: Calathea allouia corms stay crunchy after boiling or pickling like water-chestnut analogs -- peel the fibrous jacket before slicing into stir-fry because skins toughen faster than flesh cooks.
  Ground Cover: Broad paddle leaves shade soil under banana or papaya -- clumps spread by rhizome without stoloniferous takeover if mulch keeps weeds down through the wet season.
  Ornamental: Marantaceae leaf movement and silver striping read tropical even when corms are the real crop -- site in bright shade; midday sun scorches leaves into tatters.
