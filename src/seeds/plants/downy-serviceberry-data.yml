  description: "Downy serviceberry (Amelanchier arborea) is a small native tree or multistem shrub of eastern North American wood edges, young forests, and slopes, showing early white flowers and red to purple pome fruit ripening as summer heat builds. Young stems and new leaves are softly hairy—hence downy—while mature height often lands near 15–25 feet (4.5–7.5 m). It is a bridge species between ornamental spring display and quiet edible landscaping for birds and patient humans.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light woodland edge; more sun improves flowering and fruit set if soil moisture holds. Prefers well-drained, humus-rich soils; tolerates rocky slopes better than stagnant clay pans. Mulch root zones to buffer temperature swings and reduce grass competition.\n\n✂️ Propagation:\nSow seed after cold stratification; germination can be slow but steady. Softwood cuttings under mist work for clonal selections. Transplant small seedlings in cool moist weather; larger specimens sulk without irrigation support.\n\n🌾 Harvest / Best Use Timing:\nPick fruit when fully colored and slightly soft—flavor improves a few days after color change if birds permit. Flowers are short-lived but critical for early pollinators—avoid spraying during bloom. Prune for open vase shape in late winter to reduce twig blight pressure in humid climates."
  purpose: |-
    - Edible: Berries are sweet when fully ripe and usable fresh, baked, or dried where harvest beats birds.
    - Wildlife Attractor: Early nectar and later fruit stitch seasonal hunger gaps for insects and birds.
    - Ornamental: Delicate spring bloom and clean summer foliage suit small yards and edge plantings.
    - Erosion Control: Fibrous roots stabilize slopes and disturbed transitions into woodland.
  companions:
