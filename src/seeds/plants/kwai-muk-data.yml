  description: "Kwai Muk is a compact, slow-growing relative of jackfruit and breadfruit,
    topping out around 15–25 feet in cultivation—think jackfruit for people who do not
    have a stadium parking lot for one tree. The yellowish, waxy-skinned fruit is smaller
    than jackfruit but still a starchy-sweet conversation piece when you actually get
    one to ripen.\n\nsubtropical and tropical Americas / subtropical reality check: this is a true tropical.
    In 9a/9b you are basically running a pet tree—cold winter nights will insult it,
    so microclimate, frost cloth, or a large pot you can roll under cover are the honest
    options. tropical and subtropical zones and greenhouse people have the easier job.\n\nSun and water:
    Full sun for best growth once established. Young trees want steady moisture; mature
    specimens tolerate short dry spells but not desert cosplay. Well-drained soil—wet
    feet rot roots like any Moraceae.\n\nPropagation: Fresh seed is the usual path;
    air-layering or grafting are options for clones of a known good fruiting individual.
    Start warm (think summer bench) and do not let seedlings sit soggy."
  purpose: |-
