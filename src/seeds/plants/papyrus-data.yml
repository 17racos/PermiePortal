  description: "Papyrus (*Cyperus papyrus*) is the famous emergent sedge of the Nile—upright
    triangular stems topped with an umbrella spray of fine green rays. It is not a true
    grass; it roots in saturated mud or shallow water and can form dense clumps at pond
    edges, rain gardens, or stock tanks. Historically grown for fiber and craft; today
    it is mostly ornamental habitat plant that gives dragonflies, frogs, and shy fish
    something to brag about on social media.\n\nsubtropical and tropical Americas / subtropical: Treat it
    like a tender aquatic perennial. It sulks in hard freezes; in 8b–9a keep roots
    below the frost line (deeper pond margin or lift pots into a frost-free shed) or
    expect top-kill and slow spring comeback. Summer heat and humidity are fine—this
    plant was not built for Minnesota.\n\nSun and water: Full sun to light shade for
    the lushest growth; more shade = leggier stems. Roots want constant moisture—standing
    water a few inches deep is ideal; never let the rhizome dry out for long. Nutrient-rich
    muck is welcome; it pulls nutrients from water like a living sponge.\n\nPropagation:
    Division of rhizome clumps in warm weather is the workhorse method. Tip cuttings of
    young side shoots can root in water. Seed is possible but slow and inconsistent for
    most home growers—division is faster than negotiating with a seed packet."
  purpose: |-
    Papyrus in a permaculture stack:

    - Water Purifier: Dense roots and rhizomes trap sediment and take up dissolved nutrients,
      calming algae's house-party instincts at the pond edge.
    - Wildlife Attractor: Cover for small fish, perches for odonates, and general swamp
      charisma for anything that likes wet feet.
    - Border Plant: Dramatic vertical structure at the waterline—reads as "intentional
      oasis" instead of "forgotten ditch."
  companions:
  - Pickerelweed
  - Cattail
  - Lotus
  cautions:
  - Invasive floating aquatics where escape is likely (check local lists—Florida has opinions)
  pests:
  - Aphids
  - Whiteflies
  - Spider Mites
  practitioner_notes: |-
    Rhizomes wander in warm water—contain liner ponds or expect monoculture.
    Umbrella tops catch wind—pot culture tips in gusty balconies.
    Divide in warm months—cold mud splits rot dormant rhizomes.
