  description: "Papyrus (*Cyperus papyrus*) is the famous emergent sedge of the Nile—upright
    triangular stems topped with an umbrella spray of fine green rays. It is not a true
    grass; it roots in saturated mud or shallow water and can form dense clumps at pond
    edges, rain gardens, or stock tanks. Historically grown for fiber and craft; today
    it is mostly ornamental habitat plant that gives dragonflies, frogs, and shy fish
    something to brag about on social media.\n\nTreat it
    like a tender aquatic perennial. It sulks in hard freezes; in 8b–9a keep roots
    below the frost line (deeper pond margin or lift pots into a frost-free shed) or
    expect top-kill and slow spring comeback. Summer heat and humidity are fine—this
    plant was not built for cold continental winters.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to light shade for
    the lushest growth; more shade = leggier stems.\nRoots want constant moisture—standing
    water a few inches deep is ideal; never let the rhizome dry out for long.\nNutrient-rich
    muck is welcome; it pulls nutrients from water like a living sponge.\n\n✂️ Propagation:\n\nDivision of rhizome clumps in warm weather is the workhorse method.\nTip cuttings of
    young side shoots can root in water.\nSeed is possible but slow and inconsistent for
    most home growers—division is faster than negotiating with a seed packet.\n\n🌾 Harvest / Best Use Timing:\n\nCut stems for fiber or craft trials when clumps are mature; pond maintenance timing follows your aquatic design."
  purpose: |-
    Water Purifier: Papyrus can sit inside constructed wetland edges or settlement plantings where roots and biofilm polish water before storage -- supports water-polishing goals in constructed wetlands or settlement tanks when scaled realistically
    Wildlife Attractor: Wildlife shows up for calories and cover: Historically grown for fiber and craft; today it is mostly ornamental habitat plant that gives dragonflies, frogs, and shy fish something to brag about on social media. -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Border Plant: Papyrus tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
  companions:
  - Pickerelweed
  - Cattail
  - Lotus
  cautions:
  - Invasive floating aquatics where escape is likely (check local lists—Florida has opinions)
  pests:
  - Aphids
  - Whiteflies
  - Spider Mites
  practitioner_notes: |-
    Rhizomes wander in warm water—contain liner ponds or expect monoculture.
    Umbrella tops catch wind—pot culture tips in gusty balconies.
    Divide in warm months—cold mud splits rot dormant rhizomes.
