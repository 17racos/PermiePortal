  description: 'Stevia rebaudiana is the small aster-family herb whose leaves taste sweet without sugar—glycosides do the
    trick, bitterness shows up if you overdo concentration or harvest late.


    Grow as tender perennial with mulch in 9b+; colder pockets treat as annual or overwinter cuttings indoors. Intense summer
    rain can beat up leaves—give drainage.


    ☀️💧 Sun and Water Requirements: Full sun to light afternoon shade in brutal heat; light fertile soil, steady moisture,
    never soggy.


    ✂️ Propagation: Soft cuttings root easily; seed germination is moody and variable.


    🌾 Harvest / Best Use Timing: Pick leaves steadily before heavy flowering for the mildest sweetness; remove flowering stems
    if you want more leaf than bitterness.'
  purpose: '- Edible: Sugar skeptic''s patio plant—fresh leaf nibble or dried for tea—extract chemistry at your own risk.

    - Medicinal: Traditional use; modern diabetes claims need doctors, not vibes.

    - Border Plant: Compact, repeated harvest keeps stevia as a neat edge in herb beds—defining paths while staying easy to
    monitor for pests.'
