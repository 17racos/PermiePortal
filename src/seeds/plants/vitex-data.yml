  description: "Vitex (Vitex agnus-castus) is a multi-stemmed deciduous shrub to small tree with aromatic, palmately compound
    leaves and long spikes of lavender-blue flowers that arrive in summer when many spring showboats are finished. Native
    to Mediterranean and western Asian dry margins, it handles heat and drought once established and attracts bees, butterflies,
    and hummingbirds to a steady nectar stream. Traditional medicine discusses chasteberry for hormonal support—modern use belongs
    with qualified guidance, not forum confidence.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for dense flowering and upright
    habit; shade makes floppy growth and fewer blooms.\n- Well-drained soil; tolerates drought after establishment but benefits
    from occasional deep watering in sand.\n- Cold hardy in many temperate zones; late freezes can nip early flush—wait before
    panic-pruning.\n\n✂️ Propagation:\n- Semi-hardwood cuttings in summer root under mist or humidity tents.\n- Seeds germinate
    irregularly; scarify/stratify strategies help.\n- Hard prune late winter to renew bloom wood—flowers on new growth of the
    season.\n\n🌾 Harvest / Best Use Timing:\n- Harvest ripe berries for tinctures or drying on clean screens when color and
    texture read fully mature.\n- Leaf also appears in some traditions—document identity before you process.\n- Leave some
    spikes for pollinators if your harvest plan is not survival-critical."
  purpose: |-
    Vitex serves multiple functions in a permaculture system:

    - Medicinal: Chasteberry enters herbal practice around hormonal support—verify species ID and consult professionals for contraindications.
    - Pollinator: Summer flower spikes feed bees and butterflies during a nectar gap in many plantings.
    - Wildlife Attractor: Nectar and structure draw beneficial insects and small birds at the shrub edge.
    - Ornamental: Long bloom season and fine foliage earn a visible spot along paths and patios.
    - Border Plant: Repeatable size with pruning for hedgerows and wind-softening rows where drainage is honest.
  companions:
  - Rosemary — drought-tolerant Mediterranean neighbor that shares sun and sharp drainage ethics.
  - Lavender — overlapping cultural needs when soil is not soggy; both hate wet feet.
  - Comfrey — chop-and-drop mulch at the drip line without smothering the crown.
  cautions:
  - None documented
  pests:
