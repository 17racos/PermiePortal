  description: "Desert date (*Balanites aegyptiaca*) is a slow-growing, extremely
    drought-tolerant tree from arid regions of Africa and parts of the Middle East,
    armed with spines and bearing narrow, compound-looking branchlets. Mature height
    is often 3–10 m depending on moisture; the yellow-green drupes are used in some
    traditions after careful processing while other plant parts can be toxic—**treat
    all use as advanced homework, not casual foraging**. In subtropical and tropical Americas
    it suits frost-free, rain-shadow microclimates, rockeries, and xeric demonstration
    plantings; it will rot in lawn sprinklers and heavy clay.\n\n☀️💧 **Sun and Water
    Requirements:**\nFull sun. Deep, very well-drained soil; essentially dry-season
    survival once established. Water deeply but rarely during establishment only.\n\n✂️
    **Methods to Propagate:**\n- **Seeds:** Soak or scarify hard seeds; sow in warm,
    fast-draining mix and keep lightly moist until germination.\n- **Transplants:**
    Move young taprooted seedlings carefully into final positions to minimize disturbance.\n\n🌾
    **When to Harvest / Best Use Timing:**\nFruit handling belongs to knowledgeable
    processors only. For landscape use, prune for clearance around thorns in the cool
    morning and disinfect tools—spines are not decorative jokes."
