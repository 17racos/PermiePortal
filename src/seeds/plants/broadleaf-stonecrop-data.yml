  description: "Broadleaf stonecrop (Phedimus kamtschaticus), still sold as Sedum kamtschaticum,
    is a mat-forming succulent perennial from East Asia widely planted in temperate
    gardens for scalloped evergreen leaves and yellow star flowers in summer. Plants
    spread modestly to form weed-suppressing carpets 4–8 inches (10–20 cm) tall, rooting
    lightly at nodes. In permaculture it covers dry strip edges, green roof trays, and
    rockwork where thirsty turf would demand irrigation apologies.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun to light partial shade; dense dry shade thins coverage.
    Drought-tolerant once established; prefers gritty, well-drained soil. Winter wet
    on heavy clay without slope can rot crowns—add drainage or raise beds.\n\n✂️ Propagation:\n
    Divide mats in spring or early fall; reset pieces with contact to soil for rooting.
    Detach rooted offsets anytime during the growing season. Soft tip cuttings in summer
    root quickly in sharp sand.\n\n🌾 Harvest / Best Use Timing:\nPrimarily ornamental
    and ecological; not a staple food crop for most systems. If experimenting with edible
    uses, verify species guidance—harvest timing should leave plenty for pollinators
    during bloom peaks."
  purpose: |-
    - Ground Cover: Succulent mat excludes weeds on dry edges and stone joints.
    - Ornamental: Yellow flowers and tidy foliage suit low-input design without bark mulch fetishes.
    - Pollinator: Small star flowers feed bees and flies in mid-summer when many spring showboats quit.
    - Erosion Control: Roots stabilize thin soil on slopes and wall crevices.
    - Border Plant: Defines paths and bed lips where mower wheels should not visit.
  companions:
