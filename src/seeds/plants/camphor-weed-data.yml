  description: 'Camphor weed (Heterotheca subaxillaris) is a resinous annual to biennial aster of open sandy ground, roadsides,
    and old fields in eastern and central North America, often branching 1–4 feet (30–120 cm) with yellow daisy flowers and
    aromatic foliage when crushed. It colonizes disturbance quickly, feeding pollinators in late season when many species
    fade. Treat it as a native pioneer, not a formal border staple, unless you enjoy self-seeding surprises.


    ☀️💧 Sun and Water Requirements:

    Full sun; thrives in dry, infertile sand and tolerates drought once taproots establish. Poor fit for irrigated perennial
    beds where seed rain becomes a nuisance. Avoid overwatering in heavy clay that promotes root rots.


    ✂️ Propagation:

    Direct-sow after frost; needs light for germination—surface sow and press in. Transplant volunteers early if curating
    a pioneer patch. Remove seed heads before dispersal if excluding from a refined garden.


    🌾 Harvest / Best Use Timing:

    Not a standard crop—value is ecological. For experiments in aromatic oils, harvest flowering tops on dry mornings; research
    processing before scaling. Mow or pull before heavy seed set if managing succession to grasses.'
