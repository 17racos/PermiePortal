  description: "Highbush blueberry (*Vaccinium corymbosum*) covers a swarm of cultivars
    from chill-loving northern types to lower-chill southern highbush selections.
    The species story is simple: acidic soil, plenty of organic matter, sun, water
    at the right times, and pruning that removes old wood without turning the plant
    into a hat rack. Pick cultivars matched
    to your chill hours at warm low-chill margins — otherwise you are landscaping with excuses.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for best yields.\nEven moisture, especially during
    bloom and fruit sizing; excellent drainage is non-negotiable.\n\n✂️ Propagation:\n\nSoftwood cuttings under mist in summer — standard nursery method.\nLayering:
    low branches pinned to mulch can root if kept moist.\nSeeds: variable offspring;
    fine for breeding projects, silly for expecting ‘Bluecrop’ from a berry.\nBuy tested cultivars for predictable results.\n\n🌾 Harvest / Best Use Timing:\n\nPick when berries darken and slip ripe; staggered ripening means repeat passes through the row."
  purpose: |-
    - Edible: Primary backyard fruit crop in acidic-soil regions.
    - Pollinator: Dependable early-summer forage for bees when sprays are restrained.
    - Wildlife Attractor: Birds, mammals, and children compete at harvest — plan netting or share.
    - Ornamental: Flowers, fruit, and fall color in mixed borders.
  companions:
  - Strawberry
  - Pine
  - Darrow Blueberry
  - Elliott Blueberry
  cautions:
  - Heavy clay bowls without berms or raised beds
  pests:
  - Blueberry Maggot
  - Japanese Beetles
  - Powdery Mildew
  - Aphids
  - Scale Insects
  practitioner_notes: |-
    Sulfur or peat adjusts pH slowly—test yearly; chlorotic new growth screams high pH first.
    Bird netting before color break beats arguing with catbirds at breakfast.
    Renewal prune oldest canes at ground after year six—productivity lives on young wood.
  growth_habit: Shrub
  data_quality_score: 0.8
