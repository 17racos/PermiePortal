  perennial: true
  layers:
  - Shrub
  plant_function:
  - Edible
  - Pollinator
  - Wildlife Attractor
  - Ornamental
  description: "Highbush blueberry (*Vaccinium corymbosum*) covers a swarm of cultivars
    from chill-loving northern types to lower-chill southern highbush selections.
    The species story is simple: acidic soil, plenty of organic matter, sun, water
    at the right times, and pruning that removes old wood without turning the plant
    into a hat rack.\n\nFlorida and Puerto Rico / subtropical edge: pick cultivars matched
    to your chill hours — otherwise you are landscaping with excuses.\n\n☀️💧 Sun
    and Water:\n- Full sun for best yields.\n- Even moisture, especially during
    bloom and fruit sizing; excellent drainage is non-negotiable.\n\n✂️ Propagation:\n-
    Softwood cuttings under mist in summer — standard nursery method.\n- Layering:
    low branches pinned to mulch can root if kept moist.\n- Seeds: variable offspring;
    fine for breeding projects, silly for expecting ‘Bluecrop’ from a berry.\n-
    Buy tested cultivars for predictable results."
  purpose: |-
    - Edible: Primary backyard fruit crop in acidic-soil regions.
    - Pollinator: Dependable early-summer forage for bees when sprays are restrained.
    - Wildlife Attractor: Birds, mammals, and children compete at harvest — plan netting or share.
    - Ornamental: Flowers, fruit, and fall color in mixed borders.
  companions:
  - Strawberry
  - Pine
  - Darrow Blueberry
  - Elliott Blueberry
  avoid:
  - Heavy clay bowls without berms or raised beds
  pests:
  - Blueberry Maggot
  - Japanese Beetles
  - Powdery Mildew
  - Aphids
  - Scale Insects
  growth_habit: Shrub
  data_quality_score: 0.8
