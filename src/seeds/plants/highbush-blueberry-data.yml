  practitioner_notes: 'Sulfur or peat adjusts pH slowly—test yearly; chlorotic new growth screams high pH first.

    Bird netting before color break beats arguing with catbirds at breakfast.

    Renewal prune oldest canes at ground after year six—productivity lives on young wood.'
