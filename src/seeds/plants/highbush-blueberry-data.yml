  description: 'Highbush blueberry (*Vaccinium corymbosum*) covers a swarm of cultivars from chill-loving northern types to
    lower-chill southern highbush selections. The species story is simple: acidic soil, plenty of organic matter, sun, water
    at the right times, and pruning that removes old wood without turning the plant into a hat rack. Pick cultivars matched
    to your chill hours at warm low-chill margins — otherwise you are landscaping with excuses.


    ☀️💧 Sun and Water Requirements:


    Full sun for best yields.

    Even moisture, especially during bloom and fruit sizing; excellent drainage is non-negotiable.


    ✂️ Propagation:


    Softwood cuttings under mist in summer — standard nursery method.

    Layering: low branches pinned to mulch can root if kept moist.

    Seeds: variable offspring; fine for breeding projects, silly for expecting ‘Bluecrop’ from a berry.

    Buy tested cultivars for predictable results.


    🌾 Harvest / Best Use Timing:


    Pick when berries darken and slip ripe; staggered ripening means repeat passes through the row.'
