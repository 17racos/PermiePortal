description: |-
  Corsican mint is the tiny creeping mint that carpets cracks and smells like someone stepped on a mojito. Step-on-it release is the feature; turf monoculture is the enemy.

  Treat as a cool-season carpet; summer humidity can rot it in heavy soil—grit, slope, or morning sun help.

  Sun and water: Part sun to light shade in hot climates; more sun OK where summers are mild. Sharp drainage; keep evenly moist but never soggy.

  Division; small rooted pieces; seeds are fiddly—vegetative wins.

  Snip tender Corsican Mint growth in cool mornings for best texture -- heat-stressed leaves taste like their day job. Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths. Dry herbs in thin layers; deep piles steam themselves into compost.
purpose: |-
  Edible: Minute menthol-rich leaves punch above their weight as cocktail garnishes and fruit salad accents -- where a little heat meets sweet.
  Ground Cover: Flat carpets thread between pavers and stone steps -- releasing perfume when shoes brush the leaves in damp shade.
  Ornamental: Tiny rounded leaves form tight lime-green to chartreuse mats -- that read as intentional grout in rock gardens and fairy-scale borders.
