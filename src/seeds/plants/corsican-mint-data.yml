  description: |-
    Corsican mint is the tiny creeping mint that carpets cracks and smells like someone stepped on a mojito. Step-on-it release is the feature; turf monoculture is the enemy.

    Treat as a cool-season carpet; summer humidity can rot it in heavy soil—grit, slope, or morning sun help.

    Sun and water: Part sun to light shade in hot climates; more sun OK where summers are mild. Sharp drainage; keep evenly moist but never soggy.
✂️ Propagation:
Division; small rooted pieces; seeds are fiddly—vegetative wins.
  purpose: |-
    Pathway ground cover between stepping stones; intense mint aroma for sensory gardens; tiny garnish leaves if you like twee plating.
