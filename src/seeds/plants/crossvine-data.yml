  description: "Crossvine (Bignonia capreolata) is a woody, semi-evergreen climber
    of the trumpet-creeper alliance, native to wooded floodplains and moist slopes
    across much of the eastern and central United States into northeastern Mexico.
    It climbs by tendrils with adhesive disks, reaching the sub-canopy on trunks
    and fences, and opens showy orange-red tubular flowers in late cool-season to
    warm-season flushes that hummingbirds notice. Mature vines develop shaggy bark
    and a calm, forest-garden presence—useful for vertical structure without the
    brittle formality of generic ornamental walls.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun to partial shade; best flowering with at least half-day sun. Prefers
    moist, fertile, well-drained soils but tolerates periodic dry spells once established.
    Not a true bog plant—avoid standing water around the crown. Young growth can
    burn in desiccating wind; site with some shelter in arid microclimates.\n\n✂️
    Propagation:\nSemi-hardwood cuttings in warm, humid conditions root reliably with
    bottom heat.\nLayer low stems where they touch soil and sever rooted layers the
    following season.\n\n🌾 Harvest / Best Use Timing:\nBloom peaks vary by climate;
    enjoy flowers and hummingbird traffic as the primary yield. Prune after major
    flowering to control size on trellises; avoid heavy shearing that removes next
    season's buds on some forms."
  purpose: |-
    - Wildlife Attractor: Tubular flowers feed hummingbirds; dense cover shelters small birds along edges.
    - Pollinator: Early-season nectar supports migrating hummingbirds and long-tongued insects where ranges overlap.
    - Ornamental: Showy flowers and shaggy stems add vertical drama on pergolas and tree snags.
    - Erosion Control: Woody stems and attached disks stabilize mesh fences and rough banks when allowed to climb.
  companions:
  - Eastern Redbud — understory pink blooms contrast timing with crossvine's later tubular show
  - American Wisteria — another native twiner; stagger pruning so one partner is not stripped bare each year
  - Oak — rough bark accepts tendrils; high branches carry flowers at hummingbird height
  cautions:
  - Black Walnut — juglone-sensitive plants nearby may struggle; crossvine is often more tolerant than herbaceous companions, but guild design still matters
  pests:
  - Scale Insects
  - Spider Mites
  practitioner_notes: |-
    Adhesive disks mark paint and siding—give it timber, wire, or stone, not your lease deposit.
