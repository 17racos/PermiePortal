  description: "Zamia integrifolia, widely known as coontie, is a cycad native to subtropical southeastern North America and the Caribbean rim, forming a low shrub of stiff pinnate leaves from an underground stem. It tolerates sun, drought, and poor sandy soils once established, making it a backbone plant in xeric subtropical gardens and atala butterfly habitat restoration. All parts contain toxic compounds—especially improperly processed roots—so treat it as landscape and ecology, not emergency calories.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best form with good light and airflow. Extremely well-drained sandy soils are classic; tolerates salt spray modestly near coasts. Drought-tolerant once established; occasional deep watering reduces tip burn in prolonged dry spells.\n\n✂️ Propagation:\nSow cleaned seed in warm, humid conditions—germination is slow. Divide offsets carefully with sterile tools. Remove only fully brown fronds.\n\n🌾 Harvest / Best Use Timing:\nNot a casual food crop—historical starch processing required expertise and legal respect. Growth flushes follow warm wet periods. Leave seed cones for specialist insects where conservation goals include atala recovery."
