description: |-
  Creeping phlox (*Phlox subulata*) is a mat-forming evergreen perennial famous for spring sheets of five-petaled flowers in pink, purple, blue, or white. Needle-like leaves pack tightly on stems that root as they spread, typically staying under 15 cm tall but covering wide areas over time. Native to eastern North American rocky slopes, it wants sharp drainage. In subtropical and tropical Americas it is best on berms, rock gardens, or containers—humid, wet pockets invite mildew unless air moves freely and soil dries between rains.

  Full sun for heaviest bloom; very light shade only where heat is extreme. Lean, gritty, well-drained soil; water during establishment, then occasional deep drinks during drought. Avoid overhead irrigation late in the day.

  Soft tip cuttings: Take non-flowering shoots in early summer; root under humidity. Division: Lift and split rooted mats after flowering, replanting pieces immediately.

  Shear spent flowers lightly to tidy mats. Major trim after bloom if centers become woody—replace with rooted edge pieces for renewal.
purpose: |-
  Ornamental: Phlox subulata paints slopes and rock gardens with spring sheets of five-petaled pink, purple, blue, or white flowers -- mats stay under 15 cm but spread wide on gritty, well-drained ground.
  Pollinator: Early bloom feeds bees when many woody plants are still leafing out -- open flowers offer accessible nectar on south-facing banks.
  Ground Cover: Evergreen needle-like stems root as they spread -- knitting dense mats that exclude many weeds on lean soil too harsh for turf.
  Erosion Control: Interwoven stems and fibrous roots slow rain splash on berms, terrace faces, and thin-soil inclines.
