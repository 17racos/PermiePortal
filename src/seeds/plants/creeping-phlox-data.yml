  description: "Creeping phlox (*Phlox subulata*) is a mat-forming evergreen perennial
    famous for spring sheets of five-petaled flowers in pink, purple, blue, or white.
    Needle-like leaves pack tightly on stems that root as they spread, typically staying
    under 15 cm tall but covering wide areas over time. Native to eastern North American
    rocky slopes, it wants sharp drainage. In subtropical and tropical Americas it is best on
    berms, rock gardens, or containers—humid, wet pockets invite mildew unless
    air moves freely and soil dries between rains.\n\n☀️💧 **Sun and Water Requirements:**\nFull
    sun for heaviest bloom; very light shade only where heat is extreme. Lean, gritty,
    well-drained soil; water during establishment, then occasional deep drinks during
    drought. Avoid overhead irrigation late in the day.\n\n✂️ **Methods to Propagate:**\n-
    **Soft tip cuttings:** Take non-flowering shoots in early summer; root under humidity.\n-
    **Division:** Lift and split rooted mats after flowering, replanting pieces immediately.\n\n🌾
    **Best Use Timing:**\nShear spent flowers lightly to tidy mats. Major trim after
    bloom if centers become woody—replace with rooted edge pieces for renewal."
  purpose: |-
    - **Ornamental:** Spring color masses read as intentional ground painting on slopes and walls.
    - **Pollinator:** Early-season flowers feed bees when canopy trees have not yet fully leaf out.
    - **Ground Cover:** Dense mats exclude many weeds on thin soils too harsh for lawn fantasy.
    - **Erosion Control:** Interwoven stems slow rain impact on inclined beds.
