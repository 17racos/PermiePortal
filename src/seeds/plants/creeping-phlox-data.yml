    Plant on slopes for sharp drainage—flat clay holds splash moisture and rots crowns during warm rains.
    Evergreen needles catch debris—gentle rake or blow in late winter so light reaches basal buds.
    Aphids cluster on tender bloom stems—blast before flowers open if ants are farming them up stems.
