  description: 'Sea kale (Crambe maritima) is a perennial brassica of European and Black Sea coasts, forming a basal rosette
    of thick, waxy blue-green leaves and summer clouds of white four-petaled flowers on branching stems to about 2–3 feet.
    Plants spread slowly by rhizomes and resemble a wild cabbage adapted to sand, salt spray, and poor fertility; blanched
    spring shoots (“sea kale chicory” style) are a traditional crop.


    ☀️💧 Sun and Water Requirements:

    - Full sun with excellent drainage; tolerates light coastal salinity.

    - Regular water in fast-draining soil; hates summer waterlogging. In subtropical and tropical Americas lowland tropics
    it is a cool-season or maritime-trial crop—grow during the coolest months in raised gritty beds, or accept dormancy during
    intense heat.


    ✂️ Methods to Propagate:

    - Root cuttings: take thick root pieces in winter, bury horizontally in sand, keep moist until shoots appear.

    - Seeds: sow fresh; plants take a few years to reach full cropping size.


    🌾 When to Harvest:

    - Mound plants in late winter to blanch tender shoots in early spring; harvest leaves young for cooking like kale. Avoid
    stripping all foliage from first-year plants.'
