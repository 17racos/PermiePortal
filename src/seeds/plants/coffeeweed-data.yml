  description: "Coffeeweed (Senna occidentalis) is a fast-growing warm-season legume
    of disturbed tropical and subtropical sites worldwide, often seen along roads,
    pastures, and waste ground, reaching 3–6 feet (1–2 m) with pinnate leaves, yellow
    flowers, and flat pods. Seeds have been roasted as a coffee substitute in folklore—modern
    use is risky because toxicity varies and misidentification is dangerous. Treat
    it primarily as a pioneer indicator, green manure candidate, or managed weed depending
    on context.\n\n☀️💧 Sun and Water Requirements:\nFull sun; thrives in poor, well-drained
    soils with seasonal rainfall. Tolerates heat and humidity; fails in deep shade or
    saturated muck. Irrigation accelerates growth in intentional green manure cycles.\n\n✂️
    Propagation:\nScarify seed and sow warm after frost risk. Inoculate with appropriate
    rhizobia if building nitrogen on degraded soil. Mow or incorporate before hard seed
    set if excluding from pastures.\n\n🌾 Harvest / Best Use Timing:\nFor biomass,
    slash before pods mature to limit seed rain. Do not feed seeds to livestock—toxicity
    reports exist. If experimenting with any beverage use, verify species with a qualified
    botanist and toxicology references first."
  purpose: |-
    - Nitrogen Fixer: Rhizobia nodules enrich disturbed ground during early succession.
    - Dynamic Accumulator: Rapid growth concentrates nutrients in slash for compost or mulch.
    - Wildlife Attractor: Flowers feed bees in warm months; manage seed if invasive locally.
    - Mulcher: Chopped pre-seed growth can feed compost piles in subtropical wet season cycles.
  companions:
  - Sunn Hemp — taller warm legume for structured green manure mixes where regulations allow species
