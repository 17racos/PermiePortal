  description: 'Cempedak (Artocarpus integer) is a Southeast Asian relative of jackfruit, producing smaller, aromatic syncarps
    with soft, sweet to savory arils eaten fresh, fried, or cooked in regional cuisines, often with stronger scent than jackfruit
    at peak ripeness. Trees reach 50–80 feet (15–24 m) with glossy leaves and milky latex; fruit hangs from short stems on
    trunks and branches. In humid tropical food forests it is a calorie canopy—site it where neighbors cannot complain about
    perfume they did not vote for.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; wind protection reduces torn leaves on young trees. Deep, fertile, well-drained soil with
    steady moisture during fruit expansion yields best aril quality. Drought during sizing causes drop; waterlogged clay rots
    roots without berming or drainage work.


    ✂️ Propagation:

    Bud or graft selected cultivars onto seedling rootstocks; seedlings vary in flesh color and odor intensity. Air-layer
    fruitful branches during warm, humid months. Prune for clearance and light penetration—dense inner twigs invite sap feeders.


    🌾 Harvest / Best Use Timing:

    Cut fruit when aroma builds and rind yields slightly—timing is learned by nose and thumb, not calendar influencers. Oil
    hands and knives against latex; process outdoors if household noses are sensitive.'
  purpose: '- Edible: Arils and fritters anchor tropical calorie harvests where cultivars match your palate.

    - Animal Fodder: Culled fruit and seeds can feed livestock systems that already manage waste heat and smell.

    - Shade Provider: Broad canopy cools understory for shade-tolerant perennials.

    - Mulcher: Large leaves drop steadily, feeding soil biology when left in place.

    - Wildlife Attractor: Flowers and fallen fruit engage insects and vertebrates in native ranges.'
