  description: |-
    Pentas (Pentas lanceolata) is a tropical and subtropical perennial grown for flat-topped clusters of star-shaped flowers in pink, red, or white, and for glossy, lance-shaped leaves on bushy plants typically 45 to 90 cm (18 to 36 inches) tall. It blooms during warm months in humid climates and is widely used in pollinator-friendly bedding where frost is absent or brief.

    It suits frost-free courtyard gardens, butterfly waystations, and container displays across humid subtropical to tropical lowlands.

    Plant in full sun to light shade with fertile, well-drained soil and even moisture; drought during bud formation reduces flowering. Avoid cold, wet soil in winter at the northern edge of hardiness.

    Propagate from softwood cuttings; seed is possible but variable. Overwinter potted plants indoors in cool climates.

    Deadhead spent clusters to extend bloom; cut back leggy stems in early warm weather to promote branching.
  purpose: |-
    Ornamental: Continuous flowers at accessible heights suit pathway edges -- color range supports design palettes without annual replanting in zone-appropriate sites.
    Pollinator: Nectar-rich tubes feed butterflies and hawkmoths during daytime and dusk -- cluster plants in sun for maximum visitation.
    Wildlife Attractor: Blooms draw hummingbirds where species overlap -- pair with other tubular flowers for succession through the wet season.
    Border Plant: Mounded habit defines beds without sharp thorns -- softens hardscape corners near seating areas.
    Ground Cover: Dense branching suppresses weeds when massed -- mulch between plants until canopies close.
