purpose: |-
  Nitrogen Fixer: Colutea arborescens nodulates like other fabaceous shrubs -- so edge rows pick up a slow trickle of fixed nitrogen in leaf litter and fine-root turnover rather than from a one-season pulse crop.
  Ornamental: Papery inflated pods color tan and rattle on the bush -- giving a clear winter ID handle when yellow pea flowers are gone.
  Wildlife Attractor: Nectar-rich yellow banners feed early bees -- ripe pods spill seed where thrushes and finches work the shrub for a week or two each fall.
  Border Plant: Arching stems hit roughly 8–12 feet and read informal -- so you can soften a wire fence line without shearing a formal hedge.
  Mulcher: Deciduous pinnate leaves drop a light, airy litter that chips easily under taller trees when you prune after bloom for size.
