  description: 'Bladder senna (Colutea arborescens) is a deciduous legume shrub native to southern Europe and western Asia,
    widely planted for its odd inflated seed pods that rattle like tiny paper lanterns. Pinnate leaves and yellow pea flowers
    appear on arching stems; plants often reach roughly 8–12 feet tall and wide with an informal habit. Humid summers are
    workable if you refuse overhead irrigation cosplay.


    ☀️💧 Sun and Water Requirements:

    - Full sun for heaviest flowering and pod spectacle.

    - Well-drained average soil; drought-tolerant once established—wet feet invite decline faster than ideology.


    ✂️ Methods to Propagate:

    - Seeds: soak overnight, sow warm; seedlings variable—fun for plant nerds, chaos for perfectionists.

    - Softwood cuttings in early summer under humidity—clone a favorite pod shape if you must.


    🌾 Harvest / Best Use Timing:

    - Pods are ornamental, not a grocery headline—collect for crafts when inflated and tan if you like rattles.

    - Prune in late winter to shape before spring push; summer pruning removes flower wood—choose intentionally.

    purpose: |-

    Bladder senna is a conversation shrub that still fixes a little nitrogen.


    - Nitrogen Fixer: Legume roots nodule and feed edge plantings without pretending to replace a bean crop.

    - Ornamental: Inflated pods are the punchline—kids and adults poke them; accept the silliness.

    - Wildlife Attractor: Flowers draw bees; pods rattle seeds for birds where they mature.

    - Border Plant: Informal outline softens fence lines without demanding boxwood fascism.

    - Mulcher: Leaf drop adds light mulch—chop-and-drop with other shrubs for layered carbon.

    companions:

    - Desert Sage — silvery aromatic contrast with similar sun and drainage; different flower color keeps the border honest.

    - Yarrow — pollinator bridge species that tolerates lean soil beside the shrub’s drip line.

    - Lavender — Mediterranean drainage buddy; do not overwater either plant out of misplaced kindness.

    cautions:

    - None documented

    pests:

    - Aphids

    - Scale Insects

    - Caterpillars

    practitioner_notes: |-

    Inflated pods rattle when dry—fun for seed saving with kids, not a human food project.

    Summer shearing removes next year’s flower wood; prune right after bloom if you need size control and still want lanterns.

    Seed coat is hard—overnight soak or nick before sowing cuts weeks off uneven germination.

    Arching stems root where they touch damp soil—use that for deliberate layering or stop it if borders should stay crisp.

    growth_habit: Deciduous arching legume shrub; pinnate leaves; yellow pea flowers; inflated papery pods

