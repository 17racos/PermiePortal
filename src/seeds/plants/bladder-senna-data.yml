description: |-
  Bladder senna (Colutea arborescens) is a deciduous legume shrub native to southern Europe and western Asia, widely planted for its odd inflated seed pods that rattle like tiny paper lanterns. Pinnate leaves and yellow pea flowers appear on arching stems; plants often reach roughly 8–12 feet tall and wide with an informal habit. Humid summers are workable if you refuse overhead irrigation cosplay.

  Full sun for heaviest flowering and pod spectacle. Well-drained average soil; drought-tolerant once established—wet feet invite decline faster than ideology.

  Seeds: soak overnight, sow warm; seedlings variable—fun for plant nerds, chaos for perfectionists. Softwood cuttings in early summer under humidity—clone a favorite pod shape if you must.

  Pods are ornamental, not a grocery headline—collect for crafts when inflated and tan if you like rattles. Prune in late winter to shape before spring push; summer pruning removes flower wood—choose intentionally.
  purpose: |-
  Bladder senna is a conversation shrub that still fixes a little nitrogen.

  Nitrogen Fixer: Legume roots nodule and feed edge plantings without pretending to replace a bean crop. Ornamental: Inflated pods are the punchline—kids and adults poke them; accept the silliness. Wildlife Attractor: Flowers draw bees; pods rattle seeds for birds where they mature. Border Plant: Informal outline softens fence lines without demanding boxwood fascism. Mulcher: Leaf drop adds light mulch—chop-and-drop with other shrubs for layered carbon.
  companions:
  Desert Sage — silvery aromatic contrast with similar sun and drainage; different flower color keeps the border honest. Yarrow — pollinator bridge species that tolerates lean soil beside the shrub’s drip line. Lavender — Mediterranean drainage buddy; do not overwater either plant out of misplaced kindness.
