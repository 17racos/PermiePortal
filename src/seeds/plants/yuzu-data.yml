description: |-
  Yuzu is the cold-hardier citrus eccentric — knobby fruit, fierce aromatics, and a fan club among chefs who like marmalade with philosophy. Not sweet juice box citrus; peel and juice are the point. subtropical and tropical Americas still gets freeze quizzes; site on south slopes, mulch roots, and accept occasional wood dieback without identity crisis.

  Full sun for flowering and oil-rich peel. Well-drained, fertile, slightly acidic soil; consistent moisture but not wet feet in winter cold. Wind protection reduces desiccation during Arctic selfie fronts.

  Budding and grafting onto compatible rootstocks — commercial norm. Seeds: heterozygous offspring; fine for rootstock experiments, not clone fidelity.

  Pick Yuzu fruit when sugar-acid balance peaks for your use -- marmalade wants different timing than fresh slices. Color is a hint, not a contract; sample one fruit from each sector of the canopy. Store fresh citrus cool and dry; zest freezes well if you strip peel before shrivel sets in.
purpose: |-
  Edible: Citrus junos knobby peel packs aromatic oils for ponzu and marmalade -- juice is sharp-tart, not navel-sweet; seed count is high.
  Medicinal: Hot yuzu tea shows up in East Asian cold-season comfort -- vitamin C is real; drug interactions follow standard citrus rules.
  Ornamental: Thorny twigs hold fragrant white flowers and odd yellow fruit -- conversation piece on patios where freezes stay mild.
