  description: |-
    Yuzu is the cold-hardier citrus eccentric — knobby fruit, fierce aromatics, and a fan club among chefs who like marmalade with philosophy. Not sweet juice box citrus; peel and juice are the point. subtropical and tropical Americas still gets freeze quizzes; site on south slopes, mulch roots, and accept occasional wood dieback without identity crisis.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for flowering and oil-rich peel.
    - Well-drained, fertile, slightly acidic soil; consistent moisture but not wet feet in winter cold.
    - Wind protection reduces desiccation during Arctic selfie fronts.
    
    ✂️ Methods to Propagate:
    - Budding and grafting onto compatible rootstocks — commercial norm.
    - Seeds: heterozygous offspring; fine for rootstock experiments, not clone fidelity.
    
    🌾 Harvest / Best Use Timing:
    - Pick Yuzu fruit when sugar-acid balance peaks for your use -- marmalade wants different timing than fresh slices.
    - Color is a hint, not a contract; sample one fruit from each sector of the canopy.
    - Store fresh citrus cool and dry; zest freezes well if you strip peel before shrivel sets in.
