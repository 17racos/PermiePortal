  description: "Rock rose (Cistus salviifolius) is a Mediterranean evergreen subshrub
    valued for crinkled sage-scented leaves and white flowers with a yellow eye at
    the center, each bloom lasting only a day but produced in succession through the
    warm season. Plants form mounds typically 3–5 feet tall and somewhat wider, with
    resinous stems that help them endure drought and poor soil; they are classic maquis
    and coastal scrub species.\n\n☀️💧 Sun and Water Requirements:\n- Full sun and
    excellent drainage; shade or soggy soil causes leggy growth and root decline.\n-
    Very drought-tolerant once established; in Florida and Puerto Rico plant on berms
    or rock gardens so summer downpours never leave roots anaerobic for days.\n\n✂️
    Methods to Propagate:\n- Seeds: sow in well-drained mix; germination can be variable—fresh
    seed and warmth help.\n- Softwood cuttings: take non-flowering shoots in late spring
    or early summer, strip lower leaves, use rooting hormone, and keep humid until
    roots form.\n\n🌾 Best Use Timing:\n- Light pruning after main bloom shapes the
    mound; avoid heavy cutting into old wood which may not resprout. Mulch lightly
    with gravel to reflect heat and reduce collar rot in humid wet seasons."
  purpose: |-
    Rock rose suits dry-edge plantings in subtropical gardens with Mediterranean-style drainage.

    - Ornamental: Masses of short-lived flowers give long-season color without heavy irrigation.
    - Ground Cover: Low, interlocking stems cover harsh slopes where turf fails.
    - Wildlife Attractor: Flowers draw solitary bees and other pollinators adapted to open, dry habitats.
    - Erosion Control: Fibrous roots bind thin soil on banks and rocky ground.
    - Mulcher: Resinous prunings and leaf drop add aromatic litter that breaks down slowly on site.
