description: |-
  Rock rose (Cistus salviifolius) is a Mediterranean evergreen subshrub valued for crinkled sage-scented leaves and white flowers with a yellow eye at the center, each bloom lasting only a day but produced in succession through the warm season. Plants form mounds typically 3–5 feet tall and somewhat wider, with resinous stems that help them endure drought and poor soil; they are classic maquis and coastal scrub species.

  - Full sun and excellent drainage; shade or soggy soil causes leggy growth and root decline.
  - Very drought-tolerant once established; in subtropical and tropical Americas plant on berms or rock gardens so summer downpours never leave roots anaerobic for days.

  - Seeds: sow in well-drained mix; germination can be variable—fresh seed and warmth help.
  - Softwood cuttings: take non-flowering shoots in late spring or early summer, strip lower leaves, use rooting hormone, and keep humid until roots form.

  - Light pruning after main bloom shapes the mound; avoid heavy cutting into old wood which may not resprout. Mulch lightly with gravel to reflect heat and reduce collar rot in humid wet seasons.
purpose: |-
  Ornamental: Cistus salviifolius opens white saucers with a yellow eye from crinkled sage-scented foliage, each bloom lasting a day but repeating in waves through warm months -- reads crisp on berms beside gravel mulch that reflects heat off resinous stems.
  Ground Cover: Low mounding stems interlock on thin soil and coastal scrub slopes where irrigation-dependent turf would cook -- spacing for air cuts humidity stagnation that rots crowns in Florida wet spells.
  Wildlife Attractor: Short-lived flowers with a burst of pollen reward specialist solitary bees on dry edges where heavy nectar hybrids underdeliver -- not a butterfly bar, but honest bee shift work.
  Erosion Control: Fibrous roots bind gritty banks and limestone pockets after summer monsoons sheet across lean ground -- avoid bottom-of-swale placement where roots sit anaerobic for days.
  Mulcher: Resinous prunings and small evergreen leaves drop waxy litter that weathers to gray mats under shrubs -- chop trimmings fine if you want faster breakdown; whole twigs persist like slow-release brush mulch.
