  practitioner_notes: |-
    Fresh air exchange is the most common failure point indoors — CO₂ buildup
    causes the teeth to cluster into dense blobs instead of long cascading spines;
    fan intervals matter more than misting schedules.
    Harvest before yellowing — once tips go gold the flavor sharpens toward bitter
    and shelf life collapses quickly.
    Outdoor logs need shade that actual forecasts deliver, not shade you planned
    for — move stacks if summer kills moisture retention.
    First-flush fruiting bodies are usually largest; subsequent flushes from the
    same log taper in size but not necessarily flavor.
    Sauté dry on high heat before adding fat — water release is substantial and
    a wet pan steams instead of sears.
