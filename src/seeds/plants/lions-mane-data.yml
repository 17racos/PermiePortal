  description: |-
    Lion's mane fruits as a cascading mass of white spines from hardwood wounds, dead trunks, and log ends — beech and oak are classic hosts, maple works too. The fruiting body looks like nothing else in the forest; misidentification risk is very low, which makes it a good species for careful beginners. In subtropical Florida, outdoor log inoculation works in shaded, humid microclimates — north-facing lean-tos and canopy shade are your allies. Indoor kit grows are how most Florida growers meet this species and they are genuinely beginner-friendly. Brain health marketing is louder than the evidence, but the flavor — crab-like, meaty, sweet — needs no advertising.
    
    ☀️💧 Sun and Water:
    - Shade stacks and forest edge; protect from desiccating wind and afternoon sun.
    - Logs need consistent moisture retention without waterlogging; vertical stacking improves drainage.
    - Indoor: high humidity (85-95%) at pinning, strong fresh air exchange to prevent long spiny teeth from balling up into blobs.
    
    ✂️ Propagation:
    - Sawdust or plug spawn into fresh-cut hardwood logs; seal holes with cheese wax.
    - Supplemented sawdust blocks for indoor production.
    - Save clean genetics on agar if you find an exceptional wild strain.
    
    🌾 Harvest / Best Use Timing:
    - Flush Lion's Mane before caps flatten and spores dust -- younger tissue holds better flavor for most logs and beds.
    - Twist or cut at base; second flushes often follow if humidity stays honest.
    - Refrigerate in paper bags and use within days; saute or pickle rather than letting slimy regret arrive.
  purpose: |-
