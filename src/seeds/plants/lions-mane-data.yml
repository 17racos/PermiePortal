    Medicinal: Lion's Mane is kept as kitchen-level medicine where aerial parts, roots, or bark match references you trust before dosing -- keeps informed-adult herbal capacity on-site where drying, teas, and tinctures fit your actual risk tolerance
    Mulcher: Lion's Mane tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
