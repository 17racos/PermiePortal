  description: "Lion's mane fruits as a cascading mass of white spines from hardwood
    wounds, dead trunks, and log ends — beech and oak are classic hosts, maple
    works too. The fruiting body looks like nothing else in the forest; misidentification
    risk is very low, which makes it a good species for careful beginners. In subtropical
    Florida, outdoor log inoculation works in shaded, humid microclimates — north-facing
    lean-tos and canopy shade are your allies. Indoor kit grows are how most Florida
    growers meet this species and they are genuinely beginner-friendly. Brain health
    marketing is louder than the evidence, but the flavor — crab-like, meaty, sweet
    — needs no advertising.\n\n☀️💧 Sun and Water:\n- Shade stacks and forest edge;
    protect from desiccating wind and afternoon sun.\n- Logs need consistent moisture
    retention without waterlogging; vertical stacking improves drainage.\n- Indoor:
    high humidity (85-95%) at pinning, strong fresh air exchange to prevent long
    spiny teeth from balling up into blobs.\n\n✂️ Propagation:\n- Sawdust or plug
    spawn into fresh-cut hardwood logs; seal holes with cheese wax.\n- Supplemented
    sawdust blocks for indoor production.\n- Save clean genetics on agar if you find
    an exceptional wild strain."
  purpose: |-
    Lion's mane is one of the most distinctive edible fungi for home cultivation
    and wild harvest:

    - Edible: Flavor and texture are genuinely excellent — shreds like crab or
      lobster when sautéed in butter; no hype required.
    - Medicinal: East Asian traditional use is real; modern NGF (nerve growth factor)
      research is promising but early — keep claims honest.
    - Mulcher: White-rot saprobe accelerates deadwood breakdown in the system.
  substrate:
  - Oak (primary outdoor)
  - Beech (primary outdoor)
  - Maple
  - Supplemented hardwood sawdust (indoor)
  - Sterilized straw/hardwood blend (indoor)
  mycelium_type: White rot saprobe
  fruiting_season: Fall through early spring outdoors; year-round indoors with
    temperature control
  cultivation_difficulty: Beginner to intermediate — kits are very forgiving; log
    inoculation requires shade management in subtropical climates
  spawn_type: Plug spawn or sawdust spawn for logs; grain or sawdust spawn for indoor
    blocks; liquid culture for cloning
  companions:
