  description: 'Wood apple (Aegle marmelos) is a thorny deciduous tree from South and Southeast Asia, widely cultivated in
    tropical lowlands for hard-shelled aromatic fruit with fibrous pulp used in drinks, jams, and traditional medicine where
    preparation knowledge exists. Trees reach 30–40 feet (9–12 m), with trifoliate leaves and a crooked trunk that laughs
    at symmetry. Heat and seasonal dryness shape its rhythm more than temperate calendars.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable flowering and fruiting; young plants accept partial shade. Deep, well-drained soils with deep irrigation
    in dry seasons support fruit sizing. Drought-tolerant once established but yields drop without honest moisture through
    flowering and fruit swell.


    ✂️ Propagation:

    Graft known cultivars; seedlings vary in pulp quality and acid balance. Prune thorns carefully for orchard access—eyes
    and tires are not negotiable.


    🌾 Harvest / Best Use Timing:

    Collect fruit when shell color shifts and aroma peaks—crack shells with tools, not molars. Process pulp quickly; fermentation
    waits for no one. Peak harvest tracks tropical heat and local wet-dry patterns.'
