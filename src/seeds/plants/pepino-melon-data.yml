  description: "Pepino melon (Solanum muricatum) is a short-lived shrubby nightshade
    from the Andean highlands, grown across frost-free parts of the Americas for
    melon-like fruits streaked purple when ripe. Soft, broad leaves and a sprawling
    habit resemble a polite eggplant cousin. It suits protected courtyards, polytunnels,
    and mild coastal gardens where tomatoes thrive but true melons sulk.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun to very light shade; fruit colors best
    with strong light.\n- Moderate, even moisture during fruit swell; reduce if nights
    stay cool and humid to limit rot.\n- Rich, well-drained loam; container culture
    needs disciplined drainage, not souvenir saucers.\n\n✂️ Propagation:\n- Semi-hardwood
    cuttings rooted under humidity in warm seasons.\n- Seeds possible but variable;
    named selections stay truer to cuttings.\n- Pinch tips to branch bushy plants;
    stake heavy fruiting stems.\n\n🌾 Harvest / Best Use Timing:\n- Pick when fruits
    yield slightly to pressure and striping purples; flavor is bland if picked green.\n-
    Ripen indoors off-plant like a tomato if borderline and nights turn cool.\n-
    Overripe fruits split—check daily during peak season."
