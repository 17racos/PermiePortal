  description: 'Pepino melon (Solanum muricatum) is a short-lived shrubby nightshade from the Andean highlands, grown across
    frost-free parts of the Americas for melon-like fruits streaked purple when ripe. Soft, broad leaves and a sprawling habit
    resemble a polite eggplant cousin. It suits protected courtyards, polytunnels, and mild coastal gardens where tomatoes
    thrive but true melons sulk.


    ☀️💧 Sun and Water Requirements:

    - Full sun to very light shade; fruit colors best with strong light.

    - Moderate, even moisture during fruit swell; reduce if nights stay cool and humid to limit rot.

    - Rich, well-drained loam; container culture needs disciplined drainage, not souvenir saucers.


    ✂️ Propagation:

    - Semi-hardwood cuttings rooted under humidity in warm seasons.

    - Seeds possible but variable; named selections stay truer to cuttings.

    - Pinch tips to branch bushy plants; stake heavy fruiting stems.


    🌾 Harvest / Best Use Timing:

    - Pick when fruits yield slightly to pressure and striping purples; flavor is bland if picked green.

    - Ripen indoors off-plant like a tomato if borderline and nights turn cool.

    - Overripe fruits split—check daily during peak season.'
