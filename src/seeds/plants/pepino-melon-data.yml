description: |-
  Pepino melon (Solanum muricatum) is a short-lived shrubby nightshade from the Andean highlands, grown across frost-free parts of the Americas for melon-like fruits streaked purple when ripe. Soft, broad leaves and a sprawling habit resemble a polite eggplant cousin. It suits protected courtyards, polytunnels, and mild coastal gardens where tomatoes thrive but true melons sulk.

  - Full sun to very light shade; fruit colors best with strong light.
  - Moderate, even moisture during fruit swell; reduce if nights stay cool and humid to limit rot.
  - Rich, well-drained loam; container culture needs disciplined drainage, not souvenir saucers.

  - Semi-hardwood cuttings rooted under humidity in warm seasons.
  - Seeds possible but variable; named selections stay truer to cuttings.
  - Pinch tips to branch bushy plants; stake heavy fruiting stems.

  - Pick when fruits yield slightly to pressure and striping purples; flavor is bland if picked green.
  - Ripen indoors off-plant like a tomato if borderline and nights turn cool.
  - Overripe fruits split—check daily during peak season.
purpose: |-
  Edible: Solanum muricatum pepinos ripen to melon-cucumber sweetness with purple striping when nights stay warm -- pick at full color and slight yield; flavor stays bland if harvested green like supermarket tomatoes.
  Ornamental: Soft gray-green leaves and egg-shaped fruit make tidy container specimens on patios -- stake sprawling stems so striped fruit hangs at eye level instead of mud-splashing on pavers.
  Pollinator: Purple-streaked star flowers offer pollen to bumble workers and generalist bees during warm months -- avoid broad-spectrum sprays during bloom if you want fruit set in polytunnels.
companions:
- Scarlet Eggplant — matches nightshade soil prep, timing, and staking habits in warm
