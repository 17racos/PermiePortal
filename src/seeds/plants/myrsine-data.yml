    Ornamental: Myrsine earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Pollinator: Pollinator service is measurable at the flower: Small leaves, inconspicuous flowers, and dark fruits make it a workhorse texture plant  --  not a Instagram blossom bomb, but the insects notice. -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
    Border Plant: Myrsine tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
