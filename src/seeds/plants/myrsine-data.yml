  description: "*Myrsine cubana* is a compact evergreen shrub native to South Florida
    and the Caribbean, often used in native and wildlife plantings. Small leaves,
    inconspicuous flowers, and dark fruits make it a workhorse texture plant — not
    a Instagram blossom bomb, but the insects notice.\n\nIn Florida and Puerto Rico it is
    marginal: microclimate, south wall, or container overwintering are the honest
    options. Subtropical cosplay without protection ends in brown leaves and blame
    games.\n\n☀️💧 Sun and Water:\n- Sun to part shade; avoid deepest dry shade in
    poor soil.\n- Moderate water; established plants tolerate short dry periods.
    Well-drained soil.\n\n✂️ Propagation:\n- Seeds: sow fresh seed in warm, humid
    conditions.\n- Cuttings: semi-hardwood cuttings with bottom heat and humidity.\n-
    Nursery transplants for reliable landscape starts."
  purpose: |-
    - Wildlife Attractor: Supports pollinators and fruit-eating birds where it fruits reliably.
    - Ornamental: Fine-textured evergreen filler in layered plantings.
    - Pollinator: Small flowers feed a steady trickle of insects in warm months.
    - Border Plant: Defines edges between paths and beds in native-themed designs.
