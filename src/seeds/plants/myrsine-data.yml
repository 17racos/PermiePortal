  description: |-
    *Myrsine cubana* is a compact evergreen shrub native to tropical and subtropical zones and the Caribbean, often used in native and wildlife plantings. Small leaves, inconspicuous flowers, and dark fruits make it a workhorse texture plant — not a Instagram blossom bomb, but the insects notice.
    
    In subtropical and tropical Americas it is marginal: microclimate, south wall, or container overwintering are the honest options. Subtropical cosplay without protection ends in brown leaves and blame games.
    
    ☀️💧 Sun and Water:
    - Sun to part shade; avoid deepest dry shade in poor soil.
    - Moderate water; established plants tolerate short dry periods. Well-drained soil.
    
    ✂️ Propagation:
    - Seeds: sow fresh seed in warm, humid conditions.
    - Cuttings: semi-hardwood cuttings with bottom heat and humidity.
    - Nursery transplants for reliable landscape starts.
    
    🌾 Harvest / Best Use Timing:
    - For Myrsine, harvest timing follows the primary function you planted for -- flowers, fodder, mulch, or structure.
    - Coppice or prune dormant windows where winters exist; subtropical plants often prefer dry-season cuts.
    - Always sanitize tools between diseased and clean plants -- drama spreads faster than newsletters.
  purpose: |-
