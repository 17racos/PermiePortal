description: |-
  Toothache plant is a low, spreading aster relative with golden pom-pom flowers packed with spilanthol—the compound that makes your mouth buzz like you licked a nine-volt battery. Traditional use for oral numbness is where the common name comes from; cocktail nerds know it as a prank garnish.

  Annual unless winter is mild; reseeds freely; loves heat when temperate herbs are on strike.

  Full sun to very light shade; fertile, moist, well-drained soil; do not let containers dry to concrete in summer.

  Seeds (easy, many per flower head); cuttings root quickly; overwinter a pot indoors for early spring buzz crop.

  Pick flowers fresh for garnish or traditional mouth-numbing trials—use sparingly if you have Asteraceae allergies.
purpose: |-
  Edible: Fresh golden pom-pom heads supply the signature spilanthol "buzz" for salsas, drinks, and garnish -- heat-loving Acmella oleracea laughs at weather that makes temperate herbs sulk.
  Medicinal: Spilanthol drives the folk tooth-numbing effect behind the common name -- start tiny if you have Asteraceae sensitivities and research interactions before therapeutic ambition.
  Pollinator: Dense yellow disc florets pull small native bees and syrphids through brutal summer -- reseeds freely, so site where wanderers are welcome.
  Ornamental: Low, spreading mats and electric flowers read as living carnival in hot-season beds -- fertile, moist soil keeps bloom cycles generous.
