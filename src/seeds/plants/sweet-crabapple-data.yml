  description: 'Sweet crabapple (Malus coronaria) is a native North American tree of moist woods and edges, bearing fragrant
    white to pink spring flowers and yellow to green crabapples that can be sweeter than many wild crabs when fully ripe.
    Heights of 20–30 feet (6–9 m) are typical, with a broad crown and occasional thorns on wild forms. It is a pollinizer
    and wildlife tree for hedgerows where cedar-apple rust is managed.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best fruiting with strong light. Moist, well-drained, humus-rich soils suit it; tolerates periodic
    wet feet better than desert species. Mulch to reduce grass competition.


    ✂️ Propagation:

    Sow stratified seed; graft selections for predictable landscape traits. Prune for open vase shape to reduce disease pressure.


    🌾 Harvest / Best Use Timing:

    Pick fruit when fully colored and aromatic—quality varies by genotype. Process into sauces and jellies; leave some for
    wildlife. Bloom follows last hard frosts near 24°F (-4°C) in northern climates.'
