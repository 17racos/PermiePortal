  description: |-
    Duck potato is the edible pond potato North America forgot it had — starchy tubers on rhizomes, arrow leaves, and zero patience for drought cosplay. In Florida and Puerto Rico it colonizes marshy edges; harvest only where water is not a runoff confessional.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade in shallow water or saturated mud.
    - 6–18 inches water typical; tolerates drawdowns that trigger tuber formation.
    - Spreads by rhizome — liner or embrace wetland empire.

    ✂️ Methods to Propagate:
    - Rhizome division: move sections with growing tips in spring.
    - Seeds: sow in wet mud; variable timeline, good for restoration scale.
  purpose: |-
    Duck potato is calories at the water's edge:

    - Edible: Tubers after cooking traditions; verify clean water like your reputation depends on it.
    - Water Purifier: Roots and rhizomes trap sediment and cycle nutrients in plant tissue.
    - Wildlife Attractor: Ducks and waterfowl historically keyed to wapato — share or fence mentally.
