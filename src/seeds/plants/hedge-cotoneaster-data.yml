description: |-
  Hedge cotoneaster (Cotoneaster lucidus) is an upright deciduous to semi-evergreen shrub from East Asia, widely used in temperate hedges for glossy dark green leaves, small pink-white flowers, and persistent red berries into winter. Plants commonly reach 6–10 feet (1.8–3 m) if unpruned. It tolerates clipping and provides dense structure for wind buffering and wildlife snacks where the species is not listed as problematic.

  ☀️💧 Sun and Water Requirements:
  Full sun for best fruiting and compact habit; partial shade works but reduces berries. Average, well-drained soils; tolerates urban conditions once established. Avoid waterlogged sites that invite root rots masked as sudden death.

  ✂️ Propagation:
  Semi-hardwood cuttings root under mist in summer. Sow seed after stratification if experimenting with seedlings—cultivars should be cloned. Shear formally or rejuvenate old hedges with staged hard pruning in late winter.

  🌾 Harvest / Best Use Timing:
  Berries persist for winter interest and bird food—delay heavy shearing until after wildlife use if possible. Flowers are modest; fruit is the winter paycheck. Prune crossing branches inside hedges to maintain airflow.
purpose: |-
  Ornamental: Cotoneaster lucidus holds dark glossy leaves through much of the year and hangs clusters of shiny red pomes into winter -- reads as formal hedge geometry when clipped, loose fountain when left alone.
  Wildlife Attractor: Pink-white late-summer flowers feed bees and small pollinators, while persistent red drupes feed fruit-eating birds through frost -- delay heavy shearing until after wildlife strips fruit if ethics allow.
  Border Plant: Upright stems tolerate repeated shearing for property lines and alley screens -- open the hedge interior occasionally so air moves and fire blight strikes are easier to spot on rosaceous wood.
  Erosion Control: Fibrous root mats stabilize sunny slopes when massed on well-drained soil -- soggy bottoms still invite phytophthora-style sudden death masked as mysterious wilt.
companions:
- Lavender — sun-loving front edge with contrasting texture along informal hedge faces
- Rosemary — drought-tolerant accent at corners where drainage is sharp
- Yarrow — shallow insectary layer along the hedge toe that tolerates sun and occasional
  drought
cautions:
