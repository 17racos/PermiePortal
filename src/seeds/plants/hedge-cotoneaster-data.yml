  description: "Hedge cotoneaster (Cotoneaster lucidus) is an upright deciduous to semi-evergreen shrub from East Asia, widely used in temperate hedges for glossy dark green leaves, small pink-white flowers, and persistent red berries into winter. Plants commonly reach 6–10 feet (1.8–3 m) if unpruned. It tolerates clipping and provides dense structure for wind buffering and wildlife snacks where the species is not listed as problematic.\n\n☀️💧 Sun and Water Requirements:\nFull sun for best fruiting and compact habit; partial shade works but reduces berries. Average, well-drained soils; tolerates urban conditions once established. Avoid waterlogged sites that invite root rots masked as sudden death.\n\n✂️ Propagation:\nSemi-hardwood cuttings root under mist in summer. Sow seed after stratification if experimenting with seedlings—cultivars should be cloned. Shear formally or rejuvenate old hedges with staged hard pruning in late winter.\n\n🌾 Harvest / Best Use Timing:\nBerries persist for winter interest and bird food—delay heavy shearing until after wildlife use if possible. Flowers are modest; fruit is the winter paycheck. Prune crossing branches inside hedges to maintain airflow."
  purpose: |-
    - Ornamental: Glossy foliage and red winter berries give structure when deciduous neighbors are naked.
    - Wildlife Attractor: Fruit feeds birds; flowers support pollinators in late warm season.
    - Border Plant: Shearable habit defines property lines and screens without solid walls.
    - Erosion Control: Fibrous roots stabilize slopes when planted in masses on well-drained soils.
  companions:
