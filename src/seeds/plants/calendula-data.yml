  practitioner_notes: |-
    Deadhead hard if you hate volunteers—one missed head drops enough seed to paint the path orange next year.
    Cool soil germinates in days; hot soil stalls—shade cloth over seed rows buys emergence in warm shoulder seasons.
    Sticky green flower buds are resin-rich—harvest for salve before full petal drop if oil infusion is the goal.
    Powdery mildew hits old tired plants first—succession-sow every four to six weeks for clean blooms all season.
