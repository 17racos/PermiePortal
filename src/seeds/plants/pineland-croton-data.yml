  description: 'Pineland croton (Croton linearis) is a wiry subtropical shrub of sandy scrub and pineland edges, with narrow
    aromatic leaves, inconspicuous flowers, and a habit that reads as silver-green texture more than flower fireworks. Plants
    typically reach 2–5 feet (0.6–1.5 m), often broader than tall, rooting where drainage is sharp and organic matter is humble.
    In restoration and xeric food forests it stabilizes sand, feeds specialist insects, and marks dry boundaries without irrigation
    entitlement.


    ☀️💧 Sun and Water Requirements:

    Full sun for densest growth and silver leaf color; leggy in shade. Extremely well-drained sandy or rocky soils are native
    truth; wet clay is a slow funeral. Drought-tolerant once established; occasional deep watering in extreme dry seasons
    keeps foliage from browning at tips.


    ✂️ Propagation:

    Sow fresh seed after scarification trials; germination can be irregular. Take semi-hardwood cuttings in warm months with
    bottom heat. Prune lightly after flowering waves to keep plants compact along paths.


    🌾 Harvest / Best Use Timing:

    Primarily a functional and wildlife plant—avoid casual internal use of Euphorbiaceae sap. Collect seed when capsules split
    if expanding restoration patches. Growth flushes follow warm wet periods rather than temperate spring calendars.'
  purpose: |-
    Wildlife Attractor: Pineland Croton layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Erosion Control: Erosion control needs roots that grip: Plants typically reach 2 - 5 feet (0.6 - 1.5 m), often broader than tall, rooting where drainage is sharp and organic matter is humble. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Border Plant: Pineland Croton tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Ornamental: Pineland Croton earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight

