  description: |-
    Ivy gourd is a heat-loving cucurbit vine with glossy leaves, night-blooming white flowers, and small fruits that go from crunchy green veg to soft red sweetness. In Florida it is a regulated invasive in many areas—birds and forgotten fruit spread it into tree canopies. Grow only with containment discipline; do not unleash it on neighbors or public greenways.

    ☀️💧 Sun and Water Requirements:
    - Full sun for heaviest fruiting; part shade slows production but vines still climb.
    - Well-drained, fertile soil; consistent moisture during vine run—less when cool.

    ✂️ Methods to Propagate:
    - Cuttings root readily in warm, humid weather—this is also why escapes succeed.
    - Seeds from ripe fruit; label lines if you are trialing varieties.

    🌾 Harvest notes:
    - Pick young green fruit for curry-style use; allow red fruit for seed saving in controlled settings only.
  purpose: |-
    - Edible: Leaf, tendril, and fruit uses in South and Southeast Asian kitchens—cook unfamiliar parts cautiously.
    - Ground Cover: Fast summer cover on trellis—not a replacement for native ground layers near wildlands.
    - Wildlife Attractor: Flowers for night pollinators; fruit feeds birds—hence the invasion caution.
  companions:
