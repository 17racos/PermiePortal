  description: "Little brown jug (Hexastylis arifolia) is a low evergreen woodland perennial of acidic eastern North American forests, with heart-shaped or arrow-shaped leaves and odd brownish jug-shaped flowers hidden at ground level. Spreads by rhizomes into quiet mats a few inches tall. It is a native shade groundcover for naturalistic plantings where ephemerals need a calm evergreen base.\n\n☀️💧 Sun and Water Requirements:\nShade to dappled sun; direct midday sun burns leaves. Moist, organic, well-drained acidic soils typical of oak-pine woods; tolerates dry shade once established but not desert drought. Mulch with leaf mold, not dyed chunks.\n\n✂️ Propagation:\nDivide rhizomes in early spring or fall; keep divisions moist. Sow fresh seed after cleaning; germination is slow and shady in personality. Avoid frequent disturbance once colonies stabilize.\n\n🌾 Harvest / Best Use Timing:\nOrnamental use is primary; flowers are cryptic treasures for kneeling botanists. Leave leaf litter for amphibians and soil fauna—power-blowing every week is hostile architecture. Edit spread at edges if paths are invaded."
