  description: "Butia capitata is the cold-toughest feather palm many subtropical
    growers bet on—blue-green recurving fronds, a stout trunk, and olive-sized yellow
    fruit that range from ‘pleasantly apricot’ to ‘fermented sock’ depending on genetics
    and patience. The flesh makes jelly and wine; the kernel is like a tiny coconut
    project.\n\nsubtropical and tropical Americas / subtropical: Young plants need frost protection until
    established; mature specimens often take brief dips into the teens °F with damage
    scaling with duration and humidity. Plant high and dry; wet feet rot kings.\n\nSun
    and water: Full sun once established; tolerates some shade when young. Well-drained
    soil; drought-tolerant after establishment but fruits better with deep occasional
    watering in dry spells.\n\nPropagation: From seed (slow, variable); transplant
    container-grown specimens—field-dug palms sulk for years."
  purpose: |-
    Landscape palm with edible fruit and serious windbreak energy:

