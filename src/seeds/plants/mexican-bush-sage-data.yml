  description: "Mexican bush sage is the fuzzy purple fireworks plant hummingbirds
    treat like a VIP lounge. Upright spikes of velvety flowers ride above aromatic
    foliage from late summer into frost. In subtropical and tropical Americas it often behaves as a die-back
    shrub: freezes to the ground in hard winters, rebounds when soil warms if roots
