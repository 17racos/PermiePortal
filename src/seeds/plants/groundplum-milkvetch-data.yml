  description: "Groundplum milkvetch is a prairie legume with pinnate silvery-green
    leaves, purple-pea flowers, and inflated pods that bury themselves and swell into
    plum-like underground fruits. The subterranean \"plums\" were a known Indigenous
    food on the Plains; above-ground parts of many Astragalus spp. are not snack
    material—know your plant.\n\nThis is a sun-loving Great Plains / tallgrass personality,
    not a swamp queen. In humid subtropical Florida it is mostly a curiosity unless
    you simulate its fast-draining, lean conditions.\n\nSun and water: Full sun;
    dry to mesic, well-drained soils; drought-tolerant deep taproot once established.
    Wet feet rot it faster than optimism.\n\nPropagation: Scarified seed in spring;
    transplant young taprooted seedlings carefully. Slow from seed; patience is not
    optional."
  purpose: |-
    N-fixing herb layer in dry prairie mimic gardens, food forest edges on sand,
