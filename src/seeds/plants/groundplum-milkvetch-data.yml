  description: 'Groundplum milkvetch is a prairie legume with pinnate silvery-green leaves, purple-pea flowers, and inflated
    pods that bury themselves and swell into plum-like underground fruits. The subterranean "plums" were a known Indigenous
    food on the Plains; above-ground parts of many Astragalus spp. are not snack material—know your plant. This is a sun-loving
    Great Plains / tallgrass personality, not a swamp queen. In humid lowland heat it is mostly a curiosity unless you simulate
    its fast-draining, lean conditions.


    ☀️💧 Sun and Water Requirements:


    Full sun; dry to mesic, well-drained soils; drought-tolerant deep taproot once established. Wet feet rot it faster than
    optimism.


    ✂️ Propagation:


    Scarified seed in spring; transplant young taprooted seedlings carefully. Slow from seed; patience is not optional.


    🌾 Harvest / Best Use Timing:


    Gather underground plums when pods signal maturity and only with positive ID—never confuse random milkvetches with locoweed-type
    species.'
