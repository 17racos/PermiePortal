  description: 'Gulf muhly (Muhlenbergia capillaris) is a warm-season bunchgrass of coastal plain prairies, roadsides, and
    open pine woodlands in the southeastern United States, famous for airy pink-purple inflorescences that backlight beautifully
    in autumn sun. Clumps typically reach 2–3 feet (0.6–1 m) with clouds of flowers rising higher. It is a low-input ornamental
    grass for sunny, well-drained beds and mass plantings in humid subtropical to warm-temperate climates.


    ☀️💧 Sun and Water Requirements:

    Full sun for strongest flowering and fall color; too much shade yields green fluff without the blush. Well-drained sandy
    to loamy soils; tolerates drought after establishment but benefits from occasional deep watering in prolonged dry spells.
    Avoid constantly wet clay that rots crown tissue.


    ✂️ Propagation:

    Divide dormant clumps in early spring before new growth accelerates. Sow seed in warm soil; seedlings take time to reach
    blooming size. Cut back old foliage in late winter before new shoots emerge.


    🌾 Harvest / Best Use Timing:

    Ornamental peak is autumn bloom—plan photography and tours then. Leave standing through winter for structure; cut back
    before spring flush if neatness matters. Collect seed ethically from restoration-appropriate sources when expanding mixes.'
  purpose: |-
    Ornamental: Gulf Muhly earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Erosion Control: Gulf Muhly networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Wildlife Attractor: Gulf Muhly layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Border Plant: Gulf Muhly tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
