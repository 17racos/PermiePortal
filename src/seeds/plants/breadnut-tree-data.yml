  description: 'Breadnut or ramón (Brosimum alicastrum) is a large tropical evergreen tree from Mexico through Central America
    and the Caribbean, historically cultivated for starchy seeds roasted or ground, edible young leaves, and fodder during
    dry seasons. Mature specimens reach 80–115 feet (24–35 m) in forest settings with smooth gray bark and milky latex like
    other Moraceae. In agroforestry it is a calorie-dense canopy species that feeds people, livestock, and wildlife while
    producing deep shade for understory crops—plan spacing before the crown owns the field.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade depending on seed source; forest ecotypes tolerate shade juveniles. Prefers deep, well-drained
    soils with steady moisture during establishment; mature trees endure seasonal drought but fruit and leaf fodder decline
    without rain. Frost sensitivity limits production to frost-free climates for reliable yields.


    ✂️ Propagation:

    Sow fresh seed immediately; desiccation kills viability quickly. Air-layer or graft superior nut lines once identified.
    Protect young plants from grazing until stems lignify above browse height.


    🌾 Harvest / Best Use Timing:

    Collect fallen ripe fruit and extract seeds for drying and roasting; timing follows local wet–dry rhythm. Young leaves
    can be cut during fodder pinch periods if management plans avoid stripping crowns. Prune for clearance only with sharp
    tools and respect for latex mess.'
