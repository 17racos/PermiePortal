  description: 'Aguaje palm is the swamp beauty of western Amazonia—stilt roots, huge feather leaves, and red-scaled fruit
    pulp that shows up in drinks, ice creams, and local economies. This is not a balcony palm unless your balcony overlooks
    a peat swamp. Not realistic outdoors. Think botanical garden greenhouse or move to Iquitos.


    ☀️💧 Sun and Water Requirements:


    Full sun in wet settings; roots tolerate seasonal flooding.

    Needs tropical humidity and space—lots of space.


    ✂️ Propagation:


    Fresh seed; very slow early growth; patience measured in decades for canopy form.


    🌾 Harvest / Best Use Timing:


    Harvest ripe fruit for pulp, drinks, and local processing when clusters mature; oil uses follow regional practice.'
