description: |-
  Henequen is Yucatán's fiber agave — huge rosettes, sword leaves with terminal spines, and historical henequen rope industry sweat. Related to sisal but its own species and industrial story. Flowers once then declines like agave drama demands. subtropical and tropical Americas: dry berm plant, not swamp roommate.

  Full sun; shade makes floppy leaves unworthy of rope fantasies. Sharp drainage essential; summer wet on cold soil invites rot. Drought-tolerant once established; irrigation is for establishment and drought emergencies only.

  Bulbils and basal pups: detach, dry cuts, plant in gritty mix. Seeds rare in cultivation — pups are the practical currency.

  Piña harvest is a years-long commitment -- mark planting dates and size targets before you commit tools. Cut leaves close to the core with sharp pikes; sap irritates skin for many people -- gloves and eye sense. After harvest, dry or cook processing lines matter as much as field timing; sweet agave work is not a midnight whim.
purpose: |-
  Mulcher: Agave fourcroydes sheds thick, fibrous leaves and eventually a massive flowering stalk -- chip dry material into coarse mulch for succulent beds where you want long-carbon decomposition, not instant nitrogen hit.
  Erosion Control: Rosettes of sword leaves anchor rocky, well-drained slopes across Yucatán-style sites -- mass plants on berms where summer wet on cold soil would rot lesser succulents.
  Animal Fodder: Historical systems occasionally grazed trimmed leaves in quantity-limited contexts -- verify saponin and oxalate tolerance for your livestock class before turning animals into fiber-agave experiments.
