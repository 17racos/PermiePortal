  description: |-
    Henequen is Yucatán's fiber agave — huge rosettes, sword leaves with terminal spines, and historical henequen rope industry sweat. Related to sisal but its own species and industrial story. Flowers once then declines like agave drama demands. subtropical and tropical Americas: dry berm plant, not swamp roommate.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun; shade makes floppy leaves unworthy of rope fantasies.
    - Sharp drainage essential; summer wet on cold soil invites rot.
    - Drought-tolerant once established; irrigation is for establishment and drought emergencies only.
    
    ✂️ Methods to Propagate:
    - Bulbils and basal pups: detach, dry cuts, plant in gritty mix.
    - Seeds rare in cultivation — pups are the practical currency.
    
    🌾 Harvest / Best Use Timing:
    - Piña harvest is a years-long commitment -- mark planting dates and size targets before you commit tools.
    - Cut leaves close to the core with sharp pikes; sap irritates skin for many people -- gloves and eye sense.
    - After harvest, dry or cook processing lines matter as much as field timing; sweet agave work is not a midnight whim.
  purpose: |-
    Mulcher: Henequen tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Erosion Control: Henequen networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Animal Fodder: Henequen offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan

  companions:
  - Prickly pear
  - Blue agave
  - Yucca
  cautions:
  - Walking barefoot near leaf tips — this is not a metaphor
  - Heavy clay bowls in rainy cool winters
  pests:
  - Asparagus Beetle
  - Mealybugs
  - Palmetto Weevil
  - Scale Insects
  practitioner_notes: 'Leaf margins are saw honest—fiber harvest uses hooked blades and leg guards.

    Pups ring the rosette like agave—remove with dry-callus protocol before potting.

    Monocarpic head dies after bloom—track which rosette is shooting so you keep replacements.'
