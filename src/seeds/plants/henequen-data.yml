  description: |-
    Henequen is Yucatán's fiber agave — huge rosettes, sword leaves with terminal spines, and historical henequen rope industry sweat. Related to sisal but its own species and industrial story. Flowers once then declines like agave drama demands. subtropical and tropical Americas: dry berm plant, not swamp roommate.

    ☀️💧 Sun and Water Requirements:
    - Full sun; shade makes floppy leaves unworthy of rope fantasies.
    - Sharp drainage essential; summer wet on cold soil invites rot.
    - Drought-tolerant once established; irrigation is for establishment and drought emergencies only.

    ✂️ Methods to Propagate:
    - Bulbils and basal pups: detach, dry cuts, plant in gritty mix.
    - Seeds rare in cultivation — pups are the practical currency.
  purpose: |-
    Henequen is fiber and biomass for frost-light sites:

    - Mulcher: Spent leaves and flower stalks compost into coarse carbon for beds.
    - Erosion Control: Massive root systems stabilize dry slopes and berms.
    - Animal Fodder: Limited historical forage contexts — verify toxicity and quantity before livestock experiments.
