  description: "Carambola, commonly known as star fruit, is a tropical evergreen tree
    native to Southeast Asia. It typically reaches heights of 6–9 meters (20–30 feet)
    with a bushy, rounded canopy. The tree produces distinctive, star-shaped fruits
    when sliced crosswise, measuring 5–15 centimeters (2–6 inches) in length. The
    fruit's skin is thin, waxy, and turns from green to yellow upon ripening, while
    the flesh is juicy, crisp, and ranges from sweet to tangy in flavor.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Prefers full sun exposure for optimal fruit production.\n-
    Thrives in well-drained, loamy soils with a pH between 5.5 and 6.5.\n- Requires
    consistent moisture; regular watering is essential, especially during dry periods.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Seeds: Fresh seeds can be sown but may not produce true-to-type
    fruit.\n- Grafting: Commonly used to propagate desired cultivars and ensure fruit
    quality.\n- Air Layering: Effective for producing clones of the parent tree.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Fruits are ready for harvest when they turn uniformly yellow.\n-
    Typically, harvesting occurs 60–75 days after fruit set.\n- Handle fruits carefully
    to avoid bruising; they can be stored in the refrigerator for up to two weeks."
  purpose: |-
    Edible: Averrhoa carambola crisp yellow ribs slice into star-shaped plates for salads and juice once fruit sugars rise and oxalate-sensitive guests are screened from shared platters.
    Medicinal: Averrhoa carambola fruit acids and oxalates underpin traditional cooling teas and wound washes in Southeast Asia where clinicians still flag renal risk for susceptible people.
    Wildlife Attractor: Averrhoa carambola nectar feeds small bees on clustered flowers while ripe thin-skinned stars draw birds and fruit flies unless picked at color break.
    Ornamental: Averrhoa carambola keeps a rounded evergreen oxalidaceous canopy with compound leaves and pendant fruit that reads sculptural in frost-free courtyards and conservatory borders.
