  practitioner_notes: |-
    Sweet cultivars exist—seedling fruit can be painfully tart; graft known varieties if dessert is the target.
    Ribs go yellow-orange at ripeness—green ribs mean kitchen panic and face-scrunching taste tests.
    Kidney-risk people exist for starfruit oxalates—label shared fruit honestly at potlucks.
    Anthracnose scars fruit in wet years—open canopy, fruit bagging, or accept cosmetically ugly slices.
