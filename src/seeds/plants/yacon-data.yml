description: |-
  Yacon is the sunflower relative that stashes inulin in crunchy tubers — sweet on the tongue, polite on the glycemic gossip if you believe the brochures. Top growth dies with frost; underground crowns come back where winters are mild. subtropical and tropical Americas: mulch crowns, hedge bets on freezes.

  ☀️💧 Sun and Water Requirements:
  - Full sun to light afternoon shade in brutal heat.
  - Steady moisture during tuber swell; drought makes woody, sullen roots.
  - Deep loose soil; compaction fights tuber expansion like bureaucracy.

  ✂️ Methods to Propagate:
  - Rhizome crowns: divide dormant storage organs before spring growth.
  - Stem cuttings: possible in warm humid conditions — slower than crown division.

  🌾 Harvest / Best Use Timing:
  - Yacon: dig tubers or roots after tops senesce or frost signals storage shift -- curing a few days at 50-60°F (10-16°C) sweetens some starches.
  - Loosen soil wide first -- snapped necks invite rot in storage.
  - Brush-dry before long storage; plastic totes without airflow grow penicillin cosplay.
purpose: |-
  Edible: Smallanthus sonchifolius crisp tubers store fructooligosaccharides -- sweet crunch raw, gentle on the glycemic gossip; gas is the honest side effect.
  Mulcher: 2 m stems die back to frost -- chop tops for mulch rings before wind shreds leaves across the county.
  Dynamic Accumulator: Large root system mines moist loam -- harvest crowns separately from edible tubers so replant stock survives.
companions:
