  description: 'Yacon is the sunflower relative that stashes inulin in crunchy tubers — sweet on the tongue, polite on the
    glycemic gossip if you believe the brochures. Top growth dies with frost; underground crowns come back where winters are
    mild. subtropical and tropical Americas: mulch crowns, hedge bets on freezes.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light afternoon shade in brutal heat.

    - Steady moisture during tuber swell; drought makes woody, sullen roots.

    - Deep loose soil; compaction fights tuber expansion like bureaucracy.


    ✂️ Methods to Propagate:

    - Rhizome crowns: divide dormant storage organs before spring growth.

    - Stem cuttings: possible in warm humid conditions — slower than crown division.'
  purpose: 'Yacon is crunch and biomass without potato monoculture cosplay:


    - Edible: Raw or cooked tubers; inulin ferments guts — pace yourself socially.

    - Mulcher: Tall leafy stems chop-and-drop into beds after harvest.

    - Dynamic Accumulator: Mines deep with robust root system when soil allows.'
  companions:
  - Comfrey
  - Beans
  - Nasturtium
  cautions:
  - Harvesting all crowns — leave propagules or buy again like a tourist
  - Waterlogged winter soil on frozen crowns
  pests:
