  practitioner_notes: |-
    Rhizomes rot in cold wet winter soil—lift in zone 7 margins, store barely moist in breathable bags above 45°F (7°C).
    Edible types need clean cultivar lines—ornamental cannas are not automatic food security without explicit ID.
    Leafrollers stitch leaves into flags—unroll and crush the first tents or they multiply into confetti.
    Divide every three years or centers go flower-shy; chainsaw through dense clumps if diplomacy fails.
