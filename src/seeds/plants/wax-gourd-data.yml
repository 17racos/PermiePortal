  description: "Benincasa hispida is the cucurbit that coats immature fruit in a pale
    waxy bloom and matures into huge melons used across Asian kitchens for soup,
    tea, candy, and ‘I need a wheelbarrow’ harvest jokes. Flesh stays firm when cooked;
    flavor is mild—canvas for broth and spice.\n\nFlorida and Puerto Rico: Needs
    a long warm season; start early under cover if you want big fruit before frost.
    Humidity means downy mildew is a calendar event, not a surprise.\n\nSun and water:
    Full sun, fertile well-drained soil, steady moisture while vines run; reduce
    watering as fruits mature for storage types.\n\nPropagation: Direct-sow warm soil
    or transplant carefully; trellis small types, ground culture for monsters if
    you have space and slug patrol."
