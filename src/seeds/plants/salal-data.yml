  description: "Salal (Gaultheria shallon) is a Pacific Northwest evergreen shrub
    forming thickets of leathery, oval, alternate leaves on arching stems; small
    white to pink urn-shaped flowers yield dark purple edible berries. In the wild
    it ranges from ground-hugging mats in sun to 3–5 foot thickets in shade, spreading
    by rhizomes into extensive colonies under conifers and oaks.\n\n☀️💧 Sun and Water
    Requirements:\n- Part shade to full shade in hot climates; cool, humid air mimics
    its native coast. Morning sun with afternoon shade works in milder subtropical
    microclimates.\n- Likes evenly moist, acidic, organic-rich soil with good mulch;
    in subtropical and tropical Americas lowland heat it is marginal—treat as a specialty plant
    in shaded, misted courtyards or cool high-elevation-style beds, not as a bulk groundcover.\n\n✂️
    Methods to Propagate:\n- Rhizome division: lift and separate rooted sections in
    cool wet weather, keeping roots moist.\n- Seeds: cold stratify, surface-sow in acidic
    mix; slow but useful for breeding diversity.\n\n🌾 When to Harvest:\n- Berries
    ripen dark and slightly soft in late summer to fall where climate allows; leaves
    are used decoratively year-round. Harvest leaves selectively so colonies regenerate."
  purpose: |-
    Salal is a classic acidic-shade food forest understory in maritime climates.

    - Edible: Berries are sweet-tart fresh or preserved; young leaves are used in floral work.
    - Ground Cover: Rhizomatous growth excludes weeds under trees where grass struggles.
    - Wildlife Attractor: Flowers and fruit support birds and native pollinators in its range.
    - Erosion Control: Dense mats stabilize forest edges and cut slopes in cool, wet sites.
