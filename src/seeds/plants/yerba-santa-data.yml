  description: "Yerba santa (Eriodictyon californicum) is an evergreen California
    chaparral shrub with lance-shaped, sticky-resinous leaves and clusters of white
    to pale lavender flowers attractive to native pollinators. Plants typically
    reach 1–2 m (3–6 ft), forming stiff mounds on slopes and road cuts. Traditional
    medicinal use is well documented in western herbal histories; modern use belongs
    with trained practitioners. In subtropical and tropical Americas it is not native—grow
    only if you can mimic Mediterranean-dry summers and excellent drainage; humid wet
    season without dry-down invites decline.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun for compact resin production; part shade acceptable in hottest deserts.\n-
    Very well-drained soil; drought-tolerant once established—think gravel mulch,
    not lawn sprinklers.\n- Reduce summer irrigation after establishment to mimic
    native dry season.\n\n✂️ Methods to Propagate:\n- Sow seed in fall; smoke treatment
    sometimes improves germination in fire-adapted chaparral species.\n- Semi-hardwood
    cuttings in late summer with bottom heat and low humidity around leaves.\n-
    Layer pliant stems where they touch mineral soil on slopes.\n\n🌾 Harvest / Best
    Use Timing:\n- Harvest leafy stems for drying before intense mid-summer stress
    if cultivating for traditional preparations—follow ethical wildcrafting principles
    even in garden stock.\n- Leave flowers for pollinators during peak bloom; prune
    lightly for shape after flowering."
