  description: |-
    Swamp milkweed (Asclepias incarnata) is a native North American milkweed with upright stems, lance-shaped leaves, and rounded clusters of fragrant pink flowers that scream “monarch brunch.” Plants commonly reach 3–5 feet in moist settings, forming clumps from fibrous roots and politely spreading where soil stays damp.

    subtropical and tropical Americas: This species shines in rain gardens, pond margins, and bioswales across subtropical Florida—wet summers are basically its personality. In Puerto Rico, match it to similarly moist, sunny edges; ensure drainage does not flip to anaerobic muck in the lowest spots. It is a functional native bridge plant, not a turf replacement on a dry berm.

    ☀️💧 Sun and Water Requirements:
    - Full sun for strongest bloom and upright habit; light shade only if water is reliable.
    - Likes consistent moisture; tolerates brief flooding better than drought—mulch helps even moisture in sand.

    ✂️ Propagation:
    - Sow seeds in fall outdoors or cold-stratify 30 days before spring sowing; milkweed fluff is nature’s chaos—contain it.
    - Divide dormant crowns in early spring; keep divisions moist until new shoots anchor.

    🌾 Harvest / Best Use Timing:
    - Leave flowers for pollinators; collect seed when pods split on the plant if you want to propagate responsibly.
    - Cut back dead stems in late winter to leave overwintering insects hotel space—lazy gardeners win here.
  purpose: |-
    Pollinator: Nectar-rich umbels feed bees, wasps, butterflies, and other mobile pollen addicts.
    Wildlife Attractor: Monarch larvae use milkweeds as required food—plant patches, not lonely singles.
    Water Retention: Deep fibrous roots and love of damp soil help stabilize soggy margins and filter runoff.
  companions:
  - Joe-Pye Weed — matches moisture and height for layered wetland color without root combat.
  - Cardinal Flower — red tubular flowers at the water’s edge complement pink milkweed and share hummingbird traffic.
  - Switchgrass — roots knit soil behind the milkweed line; stems hide leggy lower stems when aesthetics matter.
  cautions:
  - Cattail — tall clones shade out milkweed in shallow pond margins where light is already scarce.
  - Johnsongrass — aggressive rhizomes and allelopathic habits invade moist ditches and bully slower perennials.
  pests:
  - Aphids
  - Caterpillars
  - Mealybugs
  growth_habit: Upright clumping perennial; moist-soil specialist; showy pink umbels
