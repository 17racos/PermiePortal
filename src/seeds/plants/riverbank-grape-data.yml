  description: 'Riverbank grape (Vitis riparia) is a cold-hardy North American wild grape of floodplains, riverbanks, and
    fencerows from the Atlantic to the Rockies. Small blue-black berries cluster tightly; leaves are often glossy with a skunky
    note when crushed. It is the rootstock ancestor behind many cultivated grapes and a resilient native for riparian buffers
    and pergolas in harsh winters.


    ☀️💧 Sun and Water Requirements:

    - Full sun for reliable fruit; tolerates partial shade along woods edges.

    - Moisture-loving compared to dune grapes; tolerates seasonal flooding yet needs drainage between events.

    - Average to rich soils; vigorous in alluvium.


    ✂️ Propagation:

    - Hardwood cuttings in late winter; extremely easy with bottom heat.

    - Layering canes to soil in spring.

    - Seeds stratify and sprout in year two—clonal propagation dominates.


    🌾 Harvest / Best Use Timing:

    - Pick fruit at full color for jelly and wine trials; acid and tannin are high—balance in the kitchen.

    - Leave plenty for birds migrating along rivers.

    - Prune hard in dormancy on trellises to improve airflow and access for organic disease management.'
  purpose: '- Edible: Berries process into preserves and country wines where sugar and acid are adjusted.

    - Wildlife Attractor: Fruit feeds birds and mammals; foliage hosts native grape insects.

    - Erosion Control: Roots stabilize bare banks after floods and ice scour.

    - Shade Provider: Summer canopy on arbors and livestock shade structures when trained.'
  companions:
  - Roughleaf Dogwood — native shrub accepts vine layers along moist edges
  - Peppervine — contrasting compound leaves teach ID on the same fence line
  - Moonseed Vine — another native vine for side-by-side fruit and leaf comparison
  cautions:
