  description: "Bigleaf magnolia (Magnolia macrophylla) is a deciduous tree of moist
    eastern North American forests famous for leaves that can exceed 20 inches (50
    cm) in length, with silvery undersides that flash in wind. Creamy, fragrant flowers
    up to a foot across open in late spring, followed by cone-like fruits with scarlet
    seeds. Mature trees often reach 30–40 feet (9–12 m) in cultivation, shorter in
    the wild understory, and they bring instant rainforest drama to large lots, parks,
    and woodland gardens with deep organic soil.\n\n☀️💧 Sun and Water Requirements:\nPartial
    shade to full sun in climates with adequate soil moisture; young trees scorch in
    hot dry exposures without irrigation. Deep, moist, well-drained, acidic loam high
    in organic matter is ideal; root collars must stay cool. Mulch widely; avoid compacted
    root zones under pavement.\n\n✂️ Propagation:\nSow fresh seed after removing red
    coat; never allow seed to dry completely. Warm stratification followed by cold may
    improve germination in some seed lots. Grafting of superior forms is practiced
    by specialists; seedlings vary in flower size.\n\n🌾 Harvest / Best Use Timing:\nOrnamental
    use peaks at bloom; collect seeds when follicles split and show red arils if propagating.
    Prune only for clearance or damaged wood—central leader form is often best left
    natural. Rake thick leaf drops if they smother delicate ground-layer plantings."
