  description: 'Goat''s rue is a tall perennial legume with bluish flowers and a résumé that includes “livestock poison if
    mishandled” and “historical galactagogue folklore.” It fixes nitrogen with rhizobia suited to the genus—not a generic
    bean inoculant guess. Several regions list it as invasive weed; subtropical and tropical Americas heat can stress it compared
    to cooler strongholds. Grow as a managed hedgerow experiment, not a salad bar.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light shade; best vigor in cooler summers.

    - Moist, fertile, well-drained soils; tolerates wetter spots better than drought deserts.


    ✂️ Methods to Propagate:

    - Seeds: scarify and soak; germination improves with treatment.

    - Division in spring for known lines.


    🌾 Harvest notes:

    - Not a casual harvest crop—toxicity profile means hands-off unless you are following expert guidance for specific prepared
    uses.'
