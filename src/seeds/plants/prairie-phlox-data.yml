  description: "Prairie phlox (Phlox pilosa) is a clump-forming perennial of North American prairies and open woods, bearing clusters of fragrant pink to lavender flowers in late spring and early summer atop stems usually under 2 feet (60 cm). Narrow leaves are softly hairy, giving a gray-green haze at ground level. It excels in sunny borders, meadow strips, and any garden that wants long-tongued pollinator service without importing neon annuals.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light partial shade; bloom count drops in deep shade. Average, well-drained soils are ideal; tolerates lean prairie soils and short drought once established. Avoid wet clay that rots crowns; mulch lightly to keep roots cool in hot summers.\n\n✂️ Propagation:\nDivide clumps after flowering or in early fall; replant promptly. Sow seed with light press into soil—some populations need cold-moist stratification. Pinch early tips if you want bushier cushions before bloom.\n\n🌾 Harvest / Best Use Timing:\nCut flowers in the morning for short vases when half the cluster is open. Deadhead lightly if self-sowing is unwelcome near paths. Peak bloom follows local late-spring warmth, often after last frosts near 28°F (-2°C)."
