  description: "Prairie phlox (Phlox pilosa) is a clump-forming perennial of North American prairies and open woods, bearing clusters of fragrant pink to lavender flowers in late spring and early summer atop stems usually under 2 feet (60 cm). Narrow leaves are softly hairy, giving a gray-green haze at ground level. It excels in sunny borders, meadow strips, and any garden that wants long-tongued pollinator service without importing neon annuals.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light partial shade; bloom count drops in deep shade. Average, well-drained soils are ideal; tolerates lean prairie soils and short drought once established. Avoid wet clay that rots crowns; mulch lightly to keep roots cool in hot summers.\n\n✂️ Propagation:\nDivide clumps after flowering or in early fall; replant promptly. Sow seed with light press into soil—some populations need cold-moist stratification. Pinch early tips if you want bushier cushions before bloom.\n\n🌾 Harvest / Best Use Timing:\nCut flowers in the morning for short vases when half the cluster is open. Deadhead lightly if self-sowing is unwelcome near paths. Peak bloom follows local late-spring warmth, often after last frosts near 28°F (-2°C)."
  purpose: |-
    Pollinator: Phlox pilosa salverform clusters feed pipevine swallowtails, sphinx moths, and long-tongued bees during late-spring windows -- morning light shows nectar guides; evening perfume pulls hawkmoth shifts.
    Ground Cover: Hairy gray-green clumps knit between little bluestem bunches without mint-style stolon rampage -- divide every few years when centers go woody and flower count drops.
    Ornamental: Pink-lavender cushions read softer than neon annual flats in designed meadow strips -- powdery mildew shows on crowded humid nights, so give wind slots between clumps.
    Wildlife Attractor: Night fragrance supports hawkmoth pollination syndromes while diurnal bees still work open faces -- leave a few seed heads if you want finch snacks, deadhead walkways if self-sowing annoys pavers.
  companions:
  - Little Bluestem — warm-season grass scaffold sharing sun and drainage
  - Orange Coneflower — complementary yellow blooms later in the season for extended color
  - Wild Bergamot — mint-family neighbor extending pollinator hours with different floral architecture
  cautions:
  - Powdery Mildew — improve airflow; avoid evening overhead watering
  - Over-fertilization — lush foliage, fewer flowers, same old story
  pests:
  - Aphids
  - Spider Mites
  - Powdery Mildew
  practitioner_notes: |-
    Fragrance spikes at dusk—design seating upwind if you like perfume, downwind if you do not.
    Mildew shows up fashionably late—choose resistant spacing over panic sprays when possible.
    Clumps expand politely—divide before the center dies of old age in tight beds.
    Seedlings can vary in color—select and divide favorites if uniformity matters to signage.
