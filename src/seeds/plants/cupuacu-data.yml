description: |-
  Cupuacu is cacao's loud cousin in the rainforest — big fuzzy brown fruit, pulp that tastes like pear crossed with pineapple propaganda, and seeds that become confectionery butter in countries that actually process it. True lowland humid tropical; continental subtropical and tropical Americas is "nice try" unless you own a conservatory and a therapist.

  Understory youth in nature; in cultivation often given bright shade then more sun with humidity. Constant moisture, high organic matter, excellent drainage on slopes to avoid root suffocation. Wind protection; brittle architecture when young.

  Seeds: recalcitrant — plant fresh, short viability window. Grafting selected clones for fruit quality and vigor control.

  Cupuacu: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both. Clip or lower fruit with padding; bruised pulp oxidizes fast in humid heat above 85°F (29°C). Process pulp or freeze flat within a day or two -- half-open fruit does not improve from fridge neglect.
purpose: |-
  Edible: Theobroma grandiflorum pulp is aromatic pear-pineapple -- scoop fresh, blend into juices, or process seeds into cupulate butter where facilities exist.
  Wildlife Attractor: Understory flowers and large fuzzy fruit engage tropical pollinators and frugivores in humid lowland systems.
  Shade Provider: Medium canopy filters harsh tropical sun for cacao, bananas, and shade-tolerant understory herbs once the tree sizes up.
