  description: |-
    Cupuacu is cacao's loud cousin in the rainforest — big fuzzy brown fruit, pulp that tastes like pear crossed with pineapple propaganda, and seeds that become confectionery butter in countries that actually process it. True lowland humid tropical; continental subtropical and tropical Americas is "nice try" unless you own a conservatory and a therapist.

    ☀️💧 Sun and Water Requirements:
    - Understory youth in nature; in cultivation often given bright shade then more sun with humidity.
    - Constant moisture, high organic matter, excellent drainage on slopes to avoid root suffocation.
    - Wind protection; brittle architecture when young.

    ✂️ Methods to Propagate:
    - Seeds: recalcitrant — plant fresh, short viability window.
    - Grafting selected clones for fruit quality and vigor control.
  purpose: |-
    Cupuacu is canopy dessert for equatorial honesty:

    - Edible: Pulp fresh or in drinks; seeds for butter and chocolate-adjacent industry — processing matters.
    - Wildlife Attractor: Flowers and fruit engage tropical pollinators and frugivores.
    - Shade Provider: Medium tree for understory guilds where humidity stays rude year-round.
