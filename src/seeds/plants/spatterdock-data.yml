  description: "Spatterdock is the chunky yellow waterlily of Florida ponds — big
    heart-shaped leaves that often stand above the water, and globular yellow flowers
    that look nothing like a fancy hybrid lily. Rhizomes, young leaves, and seeds
    have a long record of human use where people knew the local species and cooking
    methods; always confirm ID and processing — this is not drive-through nuggets.\n\n
    It anchors muck, gives turtles something to sun on, and makes a pond look like
    a place that predates HOAs.\n\n☀️💧 Sun and Water:\n- Full sun for heavy bloom
    and growth.\n- Shallow to several feet of still or slow water over rich bottom
    mud.\n- Spreads by thick rhizomes; plan space or plan to thin.\n\n✂️ Propagation:\n-
    Rhizome chunks with growing tips planted into submerged soil.\n- Seed after
    ripe collection; slow compared to division."
  purpose: |-
    Spatterdock is a keystone edible-aquatic for warm wetlands:

    - Edible: Historically used plant parts where properly prepared.
    - Wildlife Attractor: Pollinators, fish cover, herp habitat, duck food potential.
    - Erosion Control: Rhizome mats stabilize soft shorelines.
    - Border Plant: Major visual and ecological structure at pond edge.
  companions:
  - Duck Potato
  - Pickerelweed
  - Watershield
  cautions:
