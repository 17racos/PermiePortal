    Wildlife Attractor: Wildlife shows up for calories and cover: Rhizomes, young leaves, and seeds have a long record of human use where people knew the local species and cooking methods; always confirm ID and processing  --  this is not drive-through nuggets. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Erosion Control: Spatterdock networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Border Plant: Spatterdock tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate

