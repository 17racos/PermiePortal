    twice their price. Possible in warm pockets; protect young trees
    from hard freezes.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for best flowering
    and fruit.\nDeep, fertile, well-drained soil with even moisture during fruit
    set.\nWind protection while young.\n\n✂️ Propagation:\n\nSeeds:
    variable offspring, easy sprouting when fresh.\nAir-layering and grafting for
    known types.\n\n🌾 Harvest / Best Use Timing:\n\nWhen fruit lightens, yields slightly, and
    smells sweet — overripe goes mushy fast in heat."
