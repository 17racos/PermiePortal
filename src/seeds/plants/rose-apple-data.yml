  description: 'Syzygium jambos is the pom-pom flowering myrtle tree whose waxy fruit smells like roses and tastes like subtle
    pear-water — not a sugar bomb, more a porch snack for people who like quiet flavors. Fluffy flowers embarrass ornamentals
    twice their price. Possible in warm pockets; protect young trees from hard freezes.


    ☀️💧 Sun and Water Requirements:


    Full sun for best flowering and fruit.

    Deep, fertile, well-drained soil with even moisture during fruit set.

    Wind protection while young.


    ✂️ Propagation:


    Seeds: variable offspring, easy sprouting when fresh.

    Air-layering and grafting for known types.


    🌾 Harvest / Best Use Timing:


    When fruit lightens, yields slightly, and smells sweet — overripe goes mushy fast in heat.'
  purpose: '- Edible: Mild rose-scented fruit for porch snacks and quiet-flavor people.

