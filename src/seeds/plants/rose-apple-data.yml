description: |-
  Syzygium jambos is the pom-pom flowering myrtle tree whose waxy fruit smells like roses and tastes like subtle pear-water — not a sugar bomb, more a porch snack for people who like quiet flavors. Fluffy flowers embarrass ornamentals twice their price. Possible in warm pockets; protect young trees from hard freezes.

  ☀️💧 Sun and Water Requirements:

  Full sun for best flowering and fruit.
  Deep, fertile, well-drained soil with even moisture during fruit set.
  Wind protection while young.

  ✂️ Propagation:

  Seeds: variable offspring, easy sprouting when fresh.
  Air-layering and grafting for known types.

  🌾 Harvest / Best Use Timing:

  When fruit lightens, yields slightly, and smells sweet — overripe goes mushy fast in heat.
purpose: |-
  Edible: Syzygium jambos waxy pomes carry rose perfume and crisp water-pear flesh for porch snacks that bruise to mush in deep bags -- harvest when color lightens, skin yields slightly, and aroma peaks before heat turns them to scented sludge.
  Wildlife Attractor: Cedar waxwings and mynas strip canopies of ripe fruit in warm districts; fluffy cream inflorescences pull bees hard during dry weeks -- net individual limbs if human share beats bird queue on small trees.
  Ornamental: Powder-puff flower clusters and smooth gray bark stage a myrtle showpiece before first fruit -- surface roots want wide wood-chip mulch, not turf to trunk, or chlorosis and mower rash advertise neglect.
companions:
