  description: "American elderberry is a suckering deciduous shrub with compound
    leaves, flat white flower clusters in late spring, and heavy bunches of small
    purple-black berries. Flowers and ripe, cooked berries are traditional food;
    raw unripe berries, bark, and leaves are not your friend—cyanogenic glycosides
    mean basic kitchen chemistry matters. Across much of the eastern US it makes an
    excellent rain garden edge, ditch stabilizer, and bird buffet. Fruit quality
    jumps with named cultivars and a second genetically distinct clone for pollination.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for maximum fruit; tolerates part shade with fewer berries.
    Moist, fertile soil preferred; handles seasonal wet feet better than desert plants.\n\n✂️ Propagation:\n\nHardwood cuttings in dormancy; root suckers; seed (variable). Commercial growers
    use selected clones—wild seedlings can be sparse-fruiting.\n\n🌾 Harvest / Best Use Timing:\n\nPick flower clusters for fritters or cordials when fully open; strip ripe berries for syrup, wine, or cooked preserves—cook or ferment properly and skip raw unripe fruit."
  purpose: |-
    - Edible: Spring flowers and ripe, properly cooked or fermented berries for syrup, wine, and preserves—skip raw shortcuts and folklore mistakes.
    - Medicinal: Traditional use leans on flowers and properly prepared fruit; respect cyanogenic chemistry in unripe fruit, bark, and leaves.
    - Wildlife Attractor: Flowers feed pollinators; berry clusters feed birds and other frugivores—plan for heavy wildlife traffic.
    - Mulcher: Fast suckering growth delivers chop-and-drop biomass for wet-edge guilds.
