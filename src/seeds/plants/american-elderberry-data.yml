description: |-
  American elderberry is a suckering deciduous shrub with compound leaves, flat white flower clusters in late spring, and heavy bunches of small purple-black berries. Flowers and ripe, cooked berries are traditional food; raw unripe berries, bark, and leaves are not your friend—cyanogenic glycosides mean basic kitchen chemistry matters. Across much of the eastern US it makes an excellent rain garden edge, ditch stabilizer, and bird buffet. Fruit quality jumps with named cultivars and a second genetically distinct clone for pollination.

  Full sun for maximum fruit; tolerates part shade with fewer berries. Moist, fertile soil preferred; handles seasonal wet feet better than desert plants.

  Hardwood cuttings in dormancy; root suckers; seed (variable). Commercial growers use selected clones—wild seedlings can be sparse-fruiting.

  Pick flower clusters for fritters or cordials when fully open; strip ripe berries for syrup, wine, or cooked preserves—cook or ferment properly and skip raw unripe fruit.
purpose: |-
  Edible: Sambucus canadensis flower cymes fry into fritters or steep for cordial while ripe purple-black berries demand cooking or fermentation for syrup -- unripe berries, bark, and leaves carry cyanogenic glycosides that do not care about your influencer syrup thread.
  Medicinal: Dried flowers and cooked fruit enter North American materia medica for winter immune teas where practitioners track species differences from Sambucus nigra -- internal use belongs with vetted dosing, not casual leaf nibbling.
  Wildlife Attractor: Flat white cymes feed syrphid flies and native bees in late spring while heavy berry umbels feed catbirds and robins in summer -- plan netting or a sacrificial row because traffic is loud.
  Mulcher: Fast suckering canes produce soft stems and compound leaves for chop-and-drop along rain-garden berms -- cut after flowering if you need mulch without sacrificing every berry cluster on that cane.
