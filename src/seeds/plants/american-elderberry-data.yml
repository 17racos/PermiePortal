  description: "American elderberry is a suckering deciduous shrub with compound
    leaves, flat white flower clusters in late spring, and heavy bunches of small
    purple-black berries. Flowers and ripe, cooked berries are traditional food;
    raw unripe berries, bark, and leaves are not your friend—cyanogenic glycosides
    mean basic kitchen chemistry matters.\n\nNorth Florida through the eastern US:
    excellent rain garden edge, ditch stabilizer, and bird buffet. Fruit quality
    jumps with named cultivars and a second genetically distinct clone for pollination.\n\nSun
    and water: Full sun for maximum fruit; tolerates part shade with fewer berries.
    Moist, fertile soil preferred; handles seasonal wet feet better than desert plants.\n\nPropagation:
    Hardwood cuttings in dormancy; root suckers; seed (variable). Commercial growers
    use selected clones—wild seedlings can be sparse-fruiting."
  purpose: |-
