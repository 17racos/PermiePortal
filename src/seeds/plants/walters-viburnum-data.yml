  description: "Walter's viburnum is a Florida-native evergreen to semi-evergreen
    shrub with small glossy leaves, creamy spring flowers, and bird-feeding drupes.
    It ranges from formal hedge height to small-tree form depending on genotype and
    pruning—coastal ecotypes stay tighter; inland forms can stretch.\n\nWarm humid Southeast workhorse hedge, understory, or wetland edge plant. Tolerates
    wet feet better than many ornamentals, which is why it keeps getting planted by
    people who actually read site conditions.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to moderate
    shade; adaptable soils from sand to limestone to seasonal wet; salt tolerance
    moderate—coastal spray okay, not a dune pioneer.\n\n✂️ Propagation:\n\nSeeds (double
    dormancy—slow); softwood/hardwood cuttings; dig suckers with roots.\nNursery liners
    save years of waiting.\n\n🌾 Harvest / Best Use Timing:\n\nDrupes feed birds first; human use is occasional—prune after fruiting if you want a tidy native hedge."
  purpose: |-
    Edible: Viburnum obovatum drupes are mealy-tart bird food -- occasional jelly trials exist, but humans pick beautyberry first; leave fruit for migrating thrushes.
    Wildlife Attractor: Creamy spring cymes become dense blue-black clusters -- catbirds and mockingbirds strip hedges in weeks if you skip netting.
    Ornamental: Small glossy leaves shear into formal native hedges or leave loose for informal scrub -- tolerates limestone and wet feet better than many East Coast viburnums.
    Erosion Control: Fibrous roots knit sandy ditch banks and pond shelves -- classic Florida rain-garden backbone shrub.
