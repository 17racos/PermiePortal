    dormancy—slow); softwood/hardwood cuttings; dig suckers with roots.\nNursery liners
    save years of waiting.\n\n🌾 Harvest / Best Use Timing:\n\nDrupes feed birds first; human use is occasional—prune after fruiting if you want a tidy native hedge."
