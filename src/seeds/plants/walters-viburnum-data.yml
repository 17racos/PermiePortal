  description: "Walter's viburnum is a Florida-native evergreen to semi-evergreen
    shrub with small glossy leaves, creamy spring flowers, and bird-feeding drupes.
    It ranges from formal hedge height to small-tree form depending on genotype and
    pruning—coastal ecotypes stay tighter; inland forms can stretch.\n\nFlorida and Puerto Rico
    through the peninsula: workhorse hedge, understory, or wetland edge plant. Tolerates
    wet feet better than many ornamentals, which is why it keeps getting planted by
    people who actually read site conditions.\n\nSun and water: Full sun to moderate
    shade; adaptable soils from sand to limestone to seasonal wet; salt tolerance
    moderate—coastal spray okay, not a dune pioneer.\n\nPropagation: Seeds (double
    dormancy—slow); softwood/hardwood cuttings; dig suckers with roots. Nursery liners
    save years of waiting."
  purpose: |-
    Native privacy screen, pollinator bridge, and bird candy factory. Edible fruit
