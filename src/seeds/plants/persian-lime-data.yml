  description: "Persian lime (Citrus × latifolia) is a thornless, typically seedless lime hybrid grown worldwide for consistent
    fruit size, thick rind, and reliable bearing in humid subtropical orchards and backyard rows. Trees run taller than many
    key lime selections but share the glossy evergreen look and heavy spring bloom that perfumes an entire yard. It is the
    workhorse lime in markets because the fruit ships and juices with fewer seed surprises than seedy types.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun for dense canopies and productive wood; interior shading reduces fruiting twigs.\n- Even
    soil moisture with excellent drainage—classic citrus rhythm of deep, less frequent water once roots establish.\n- Tolerates
    brief cold slightly better than key lime in many sites, but flowering wood still burns when advective freezes line up with
    bloom.\n\n✂️ Propagation:\n- Grafted nursery trees are the norm for thornless habit and seedless fruit expression.\n-
    Vegetative cloning keeps the hybrid traits; seedlings wander genetically.\n- Topworking an older citrus frame is possible
    for skilled grafters with compatible stock.\n\n🌾 Harvest / Best Use Timing:\n- Pick green for classic lime punch; allow
    slight yellowing if you want softer acid for some drinks.\n- Clip with pruners to avoid torn peel openings for decay.\n-
    Juice freezes in cubes; zest first because the freezer steals perfume faster than acid."
  purpose: |-
    Persian lime serves multiple functions in a permaculture system:

    - Edible: Bar-grade juice, zest, and candied peel for year-round acid without dairy-industry sweeteners.
    - Medicinal: Vitamin C and citrus bioactives show up in teas and tonics—check interactions if you are on steady meds.
    - Pollinator: Bloom stacks with other citrus and early herbs for bee flights in warm months.
    - Wildlife Attractor: Fallen fruit feeds ground birds if policy allows.
    - Border Plant: Orchard-scale spacing or patio tree form when pruned for walkable skirts.
  companions:
  - Comfrey — chop-and-drop outside the trunk zone to feed fungi without suffocating feeder roots.
  - Nasturtium — aphid magnet at the row edge; edible flowers for salads while scouts watch pressure.
  - Marigold — bright ground-level indicator plantings that pair with citrus guild aesthetics and insect observation.
