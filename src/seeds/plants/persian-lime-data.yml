  practitioner_notes: |-
    Seedless does not mean pestless—scout the undersides like you mean it.
    Heavy crops bend limbs; summer thinning saves winter breakage.
    If rinds look rough but leaves look fine, mites may be doing cosmetic work without asking permission.
    Rotate harvest tests across canopy quadrants—sun exposure rewrites Brix on the same tree.
  growth_habit: Evergreen broadleaf tree; rounded crown, often thornless in commerce
