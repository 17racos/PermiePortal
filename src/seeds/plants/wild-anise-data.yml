  description: |-
    Aniseroot is a native eastern woodland perennial with soft, divided leaves and tiny white flowers — roots and early foliage carry a sweet anise note that made it a forager's spice cabinet long before big-box seeds. In subtropical and tropical Americas it fits shaded edges, food forest understory, and moist rich pockets where summer sun would cook true alpine herbs. Respect look-alikes: if you are not solid on ID, admire with your eyes and buy your spices from someone boring.
    
    ☀️💧 Sun and Water:
    - Part shade to shade; eastern light or high canopy dapple works.
    - Consistent moisture; mimics bottomland and rich woods.
    - Leaf mulch and organic soil beat bare baked clay.
    
    ✂️ Propagation:
    - Seed: needs cold-moist stratification or winter sowing; patience required.
    - Division: split dormant crowns in cool weather.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Wild Anise growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
