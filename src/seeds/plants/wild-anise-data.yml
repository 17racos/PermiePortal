  description: "Aniseroot is a native eastern woodland perennial with soft, divided
    leaves and tiny white flowers — roots and early foliage carry a sweet anise note
    that made it a forager's spice cabinet long before big-box seeds. In subtropical and tropical Americas it fits shaded edges, food forest understory, and moist rich pockets
    where summer sun would cook true alpine herbs. Respect look-alikes: if you are
    not solid on ID, admire with your eyes and buy your spices from someone boring.\n\n☀️💧
    Sun and Water:\n- Part shade to shade; eastern light or high canopy dapple works.\n-
    Consistent moisture; mimics bottomland and rich woods.\n- Leaf mulch and organic
    soil beat bare baked clay.\n\n✂️ Propagation:\n- Seed: needs cold-moist stratification
    or winter sowing; patience required.\n- Division: split dormant crowns in cool
    weather."
  purpose: |-
    Wild anise is forest-floor flavor for humid subtropical edges:

    - Edible: Young leaves and aromatic root used sparingly; ID confidence required.
    - Medicinal: Historical carminative uses; modern default is culinary caution.
    - Pollinator: Small flowers for early-season tiny insects.
    - Wildlife Attractor: Native understory plant that belongs in layered systems.
