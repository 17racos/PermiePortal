  description: 'Calamondin is the patio-sized citrus that fruits like it has something to prove—small, thin-skinned, mouth-puckering
    sour oranges used across Southeast Asian and Filipino cooking, drinks, and preserves. It behaves like a dense shrubby
    citrus, which makes it easier to shove under eaves when frost threatens.


    9a is negotiation territory. Plant on south walls, in pots you can move, or accept periodic dieback like a citrus-themed
    trust exercise. Greenhouse people sleep better.


    ☀️💧 Sun and Water Requirements:


    Full sun for flowers and fruit.

    Even, deep watering in porous soil; let the root zone breathe—Phytophthora does not need your help.


    ✂️ Propagation:


    Budded or grafted onto appropriate citrus rootstock for trueness and soil adaptation; seedlings are a genetic lottery
    and often extra thorny.


    🌾 Harvest / Best Use Timing:


    Pick fruit when fully colored and aromatic for marmalade, beverages, and marinades.'
