description: |-
  Calamondin is the patio-sized citrus that fruits like it has something to prove—small, thin-skinned, mouth-puckering sour oranges used across Southeast Asian and Filipino cooking, drinks, and preserves. It behaves like a dense shrubby citrus, which makes it easier to shove under eaves when frost threatens.

  9a is negotiation territory. Plant on south walls, in pots you can move, or accept periodic dieback like a citrus-themed trust exercise. Greenhouse people sleep better.

  Full sun for flowers and fruit.
  Even, deep watering in porous soil; let the root zone breathe—Phytophthora does not need your help.

  Budded or grafted onto appropriate citrus rootstock for trueness and soil adaptation; seedlings are a genetic lottery and often extra thorny.

  Pick fruit when fully colored and aromatic for marmalade, beverages, and marinades.
purpose: |-
  Edible: thin-skinned sour oranges juice into calamansi drinks, marmalade, and marinades after picking fully colored fruit that is still acid-forward.
  Ornamental: stays a dense evergreen shrub on dwarfing rootstock, giving year-round structure to patios and small yards in citrus-hardy zones.
  Wildlife Attractor: white citrus flowers offer nectar and pollen to bees and hoverflies during warm-season bloom before tiny fruits set along twigs.
