  description: "Slash pine (Pinus elliottii) is a fast-growing southern pine of flatwoods and commercial plantations, with long needles in bundles of two or three and tall straight trunks when given sun and moisture. Heights exceed 80 feet (24 m) in favorable sites, producing timber, pine straw, and habitat structure for wildlife. Ecotypes vary—coastal vs interior forms differ in salt and frost tolerance.\n\n☀️💧 Sun and Water Requirements:\nFull sun for straight growth and dense crowns. Moist, acidic, well-drained sandy soils are classic; tolerates seasonal water tables in flatwoods. Drought-stressed trees invite bark beetles—irrigate young plantations during establishment droughts.\n\n✂️ Propagation:\nSow seed from selected orchards for timber traits. Plant bareroot seedlings in winter dormancy in warm climates. Prune only for clearance; never top mature pines.\n\n🌾 Harvest / Best Use Timing:\nPine straw raking should sustain soil organic matter—avoid stripping crowns. Timber harvest follows forestry plans, not impulse weekends. Growth peaks during long warm seasons with adequate rainfall."
  purpose: |-
    - Windbreaker: Rows protect crops, livestock, and structures on exposed coastal-plain sites.
