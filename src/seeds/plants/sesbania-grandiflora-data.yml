  description: 'Sesbania grandiflora is a fast-growing tropical legume tree with soft wood, pinnate leaves, and spectacular
    large white or red flowers depending on cultivar, followed by long narrow pods. It commonly reaches 15–30 feet in a few
    years under warm, moist conditions, making it a classic chop-and-drop and alley-cropping species in humid lowlands; flowers
    and young pods are eaten as vegetables in South and Southeast Asian cuisines.


    ☀️💧 Sun and Water Requirements:

    - Full sun for maximum growth and flowering; tolerates heat if soil moisture is steady.

    - Likes fertile, well-drained soils with reliable water during establishment; in subtropical and tropical Americas’s wet
    season watch drainage to reduce sudden wilt from waterlogging on heavy sites.


    ✂️ Methods to Propagate:

    - Seeds: soak seed in warm water 24 hours, sow in hot weather; inoculate with compatible rhizobia if available.

    - Cuttings: large hardwood cuttings strike during warm rainy periods in sandy loam kept humid.


    🌾 When to Harvest:

    - Pick flowers and tender pods continuously during flush cycles; prune branches for mulch when height threatens understory
    crops. Leave some blooms for pollinators and seed if saving genetics.'
