  description: 'Buddha’s hand is a citron that forgot what “normal fruit shape” means—fused segments look like citrus cosplaying
    as a cephalopod. Almost no pulp: it is zest, candy, liqueur, and temple offering fuel. Treat like other citrus for culture;
    subtropical and tropical Americas needs frost strategy, drainage, and realistic expectations about greening-era scouting.


    ☀️💧 Sun and Water Requirements:

    - Full sun for oil-rich rind and solid wood.

    - Well-drained soil; even moisture during fruit swell, never chronic sogginess.


    ✂️ Methods to Propagate:

    - Budding/grafting onto appropriate citrus rootstock—standard for true-to-type trees.

    - Seeds are a genetic dice roll and slow—fine for curiosity, not deadlines.


    🌾 Harvest notes:

    - Pick when yellow and intensely fragrant; color and oil aroma beat calendar dates.'
  purpose: |-
    Edible: Citrus medica var. sarcodactylis rind oils concentrate in the fingers, so candied peel and liqueur use the whole fruit because juice sacks barely develop inside the segments.
    Ornamental: Yellow tentacle fruit hangs for months like citrus cosplay, giving porch conversation even when the tree is young and not yet heavy bearing.
    Border Plant: Compact dwarfing stocks keep the canopy at eye level along warm courtyard walls where standard oranges would shade windows too hard.
    Wildlife Attractor: White citrus flowers release the same heavy fragrance as other citrons, pulling honeybees during warm nights if you skip broad-spectrum sprays during bloom.
