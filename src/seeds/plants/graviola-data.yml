  description: |-
    Graviola is soursop under its passport name — spiny green football fruit, custard pulp with pineapple-strawberry propaganda, and a tropical tree that sulks at any whisper of frost. subtropical and tropical Americas outdoor culture is denial outside deep 10b pockets; greenhouse gang stays winning.

    ☀️💧 Sun and Water Requirements:
    - Full sun once established; young trees appreciate partial shade in scorch microclimates.
    - Deep, fertile, well-drained soil with steady moisture; hates drought during fruit set.
    - Wind protection for large soft leaves; mulch to feed soil microbiome without lecture.

    ✂️ Methods to Propagate:
    - Seeds: plant fresh; variable juvenility — commercial clones grafted for quality.
    - Grafting selected cultivars for yield and flavor consistency.
  purpose: |-
    Graviola is canopy dessert and shade where winter behaves:

    - Edible: Fresh pulp, juices, and ice creams on ripe fruit — seeds are not crunch goals.
    - Medicinal: Heavy internet miracle branding — separate tradition from FDA fantasies.
    - Wildlife Attractor: Flowers attract beetles and other pollinators in annona style; fruit feeds frugivores if shared.
    - Shade Provider: Open canopy for understory guilds in humid tropics.
