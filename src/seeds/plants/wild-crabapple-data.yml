  description: "Wild crabapple (Malus fusca) is a Pacific Northwest native crabapple of moist woods and stream edges, bearing white to pink spring flowers and small yellow to red fruit used historically for preserves and pectin. Plants reach 20–40 feet (6–12 m), often multi-stemmed along riparian corridors. This entry uses Malus fusca to reduce duplicate confusion with eastern sweet crabapple entries—verify regional stock tags against your planting goals.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best fruiting with strong light. Moist, well-drained soils suit it; tolerates seasonal high water tables near streams. Mulch to reduce competition during establishment.\n\n✂️ Propagation:\nSow stratified seed; graft selections for landscape consistency. Prune for open centers to reduce disease pressure.\n\n🌾 Harvest / Best Use Timing:\nPick fruit when colored and aromatic—process into jelly; leave some for birds. Bloom follows local spring warmth after frost risk declines."
  purpose: |-
    - Edible: Tart fruit supports jellies and pectin sources where sugar balances acid.
    - Wildlife Attractor: Flowers feed early pollinators; fruit feeds birds and mammals.
    - Pollinator: Spring bloom offers pollen and nectar in riparian corridors.
    - Erosion Control: Roots stabilize moist banks along streams and seeps.
