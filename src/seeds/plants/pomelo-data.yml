  description: "Pomelo is the thick-rinded ancestor of modern grapefruit, bearing
    huge, mild to sweet segments under a peel you could use as body armor. Trees are
    big, evergreen, and long-lived in frost-free sites with good drainage.\n\nCoastal and warm microclimates can push the envelope with cold-hardy
    rootstocks and protection, but this is still a citrus—greening, canker, and
    assorted psyllid drama are part of the package now. Plant only if you accept the
    maintenance and regulatory reality.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun.\nDeep watering on
    well-drained soil; less frequent but thorough beats daily sips.\nMulch wide, keep
    mulch off the trunk, and do not let it sit in a bathtub of irrigation.\n\n✂️ Propagation:\n\nCommercial trees are grafted onto selected rootstocks.\nSeedlings are fun experiments
    but take years and may not match parent fruit.\nAir layering and budding are
    nursery skills—home growers usually buy a tested tree.\n\n🌾 Harvest / Best Use Timing:\n\nPick heavy fruit when rind yields color and internal segments sweeten—thick peel buys shipping time in warm-climate yards."
  purpose: |-
