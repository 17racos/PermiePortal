    maintenance and regulatory reality.\n\nSun and water: Full sun. Deep watering on
    well-drained soil; less frequent but thorough beats daily sips. Mulch wide, keep
    mulch off the trunk, and do not let it sit in a bathtub of irrigation.\n\nPropagation:
