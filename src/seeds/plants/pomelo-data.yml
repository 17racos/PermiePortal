  description: 'Pomelo is the thick-rinded ancestor of modern grapefruit, bearing huge, mild to sweet segments under a peel
    you could use as body armor. Trees are big, evergreen, and long-lived in frost-free sites with good drainage.


    Coastal and warm microclimates can push the envelope with cold-hardy rootstocks and protection, but this is still a citrus—greening,
    canker, and assorted psyllid drama are part of the package now. Plant only if you accept the maintenance and regulatory
    reality.


    ☀️💧 Sun and Water Requirements:


    Full sun.

    Deep watering on well-drained soil; less frequent but thorough beats daily sips.

    Mulch wide, keep mulch off the trunk, and do not let it sit in a bathtub of irrigation.


    ✂️ Propagation:


    Commercial trees are grafted onto selected rootstocks.

    Seedlings are fun experiments but take years and may not match parent fruit.

    Air layering and budding are nursery skills—home growers usually buy a tested tree.


    🌾 Harvest / Best Use Timing:


    Pick heavy fruit when rind yields color and internal segments sweeten—thick peel buys shipping time in warm-climate yards.'
  purpose: '- Edible: Heavy-producing canopy citrus with mild, thick-rinded fruit.

    - Ornamental: Big evergreen frame for warm yards that accept citrus homework.

    - Wildlife Attractor: Flowers and ripe fruit engage pollinators and frugivores.

    - Shade Provider: Tall frame throws shade for understory guilds once the canopy lifts.'
