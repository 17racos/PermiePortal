  description: "Turkey oak (Quercus laevis) is a small to medium deciduous oak of deep sandy ridges, scrub, and open pine\
    \ woodlands across the southeastern United States. Twisted branches, deeply lobed leaves reminiscent of turkey tracks,\
    \ and harsh dry sites define its attitude. Acorns feed wildlife where taller oaks struggle on droughty sand; the species\
    \ anchors fire-adapted ecosystems and low-input silvopasture edges.\n\n☀️\U0001F4A7 Sun and Water Requirements:\nFull\
    \ sun for strong structure and acorn production; tolerates open canopy pine shade as a seedling. Extremely drought-tolerant\
    \ on deep sands once taproots descend; hates prolonged wet feet and heavy clay unless bermed sharply. Heat-tolerant—classic\
    \ humid subtropical sandhill specialist.\n\n ✂️ Propagation:\nSow acorns immediately after fall collection; discard floaters.\
    \ Protect seedlings from rodents with wire guards. Transplant small trees while roots are still manageable; older scrub\
    \ oaks resent bare-root moves.\n\n\U0001F33E Harvest / Best Use Timing:\nAcorns require leaching if used as human food;\
    \ wildlife priority is simpler. Prune for clearance in dormant season; avoid lion-tailing that weakens scrubby crowns.\
    \ Gather leaf litter for mulch under acid-loving companions."
  purpose: |-
    Wildlife Attractor: Wildlife shows up for calories and cover: Acorns feed wildlife where taller oaks struggle on droughty sand; the species anchors fire-adapted ecosystems and low-input silvopasture edges. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Erosion Control: Turkey Oak networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Mulcher: Turkey Oak tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Shade Provider: Turkey Oak throws enough canopy to run ginger-class understory or to blunt afternoon heat on west-facing beds -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below

  companions:
  - Longleaf Pine — classic sandhill pairing; pine needles reinforce acidity and light shade
  - Sparkleberry — understory blueberry relative tolerates dry shade at oak margins
  - Little Bluestem — bunchgrass matrix stabilizes sand between oak crowns; shared fire-adapted ecology
  cautions:
  - Black Walnut — not a typical associate; juglone and soil texture mismatch on sand vs walnut riparian habits
  - Oak wilt risk regions — follow local pruning timing rules; minimize wounds during vector-active seasons
  pests:
