  description: "Turkey oak (Quercus laevis) is a small to medium deciduous oak of
    deep sandy ridges, scrub, and open pine woodlands across the southeastern United
    States. Twisted branches, deeply lobed leaves reminiscent of turkey tracks, and
    harsh dry sites define its attitude. Acorns feed wildlife where taller oaks struggle
    on droughty sand; the species anchors fire-adapted ecosystems and low-input silvopasture
    edges.\n\n☀️💧 Sun and Water Requirements:\nFull sun for strong structure and acorn
    production; tolerates open canopy pine shade as a seedling. Extremely drought-tolerant
    on deep sands once taproots descend; hates prolonged wet feet and heavy clay
    unless bermed sharply. Heat-tolerant—classic humid subtropical sandhill specialist.\n\n
    ✂️ Propagation:\nSow acorns immediately after fall collection; discard floaters.
    Protect seedlings from rodents with wire guards. Transplant small trees while
    roots are still manageable; older scrub oaks resent bare-root moves.\n\n🌾 Harvest
    / Best Use Timing:\nAcorns require leaching if used as human food; wildlife priority
    is simpler. Prune for clearance in dormant season; avoid lion-tailing that weakens
    scrubby crowns. Gather leaf litter for mulch under acid-loving companions."
  purpose: |-
    - Wildlife Attractor: Acorns support jays, turkeys, squirrels, and deer where present; foliage hosts many Lepidoptera larvae.
    - Erosion Control: Taproot and lateral roots bind deep sand against wind and water erosion.
    - Mulcher: Tough leaves build slow-decomposing mulch that moderates soil temperature in open sites.
    - Shade Provider: Open canopy gives patchy shade for understory blueberries and wiregrass gardens.
  companions:
  - Longleaf Pine — classic sandhill pairing; pine needles reinforce acidity and light shade
  - Sparkleberry — understory blueberry relative tolerates dry shade at oak margins
  - Little Bluestem — bunchgrass matrix stabilizes sand between oak crowns; shared fire-adapted ecology
  cautions:
