  description: "Holy Basil (Ocimum tenuiflorum) is a highly aromatic, bushy herb that
    grows between 30–90 cm (1–3 feet) tall. It produces small purple or white flowers
    that attract bees and other pollinators. The leaves have a strong, clove-like
    scent and are widely used in Ayurvedic medicine.\n\nHoly Basil is a heat-loving
    plant that thrives in warm, humid environments with well-drained, fertile soil.
    It is often grown as a medicinal herb, companion plant, or natural pest deterrent.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun (at least
    6–8 hours of direct sunlight daily).\n- Requires well-drained, fertile soil with
    moderate water needs.\n- Drought-tolerant once established but benefits from regular
    watering.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Direct sow after the
    last frost or start indoors 4–6 weeks before transplanting.\n- Cuttings: Can be
    propagated from stem cuttings placed in water or soil.\n- Self-seeding: Readily
    self-seeds in warm climates.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When
    to Harvest:\n- Harvest leaves regularly throughout the growing season for fresh
    use.\n- Flowers should be pinched off to encourage bushier growth.\n- Entire plants
    can be harvested before flowering for drying and medicinal use."
