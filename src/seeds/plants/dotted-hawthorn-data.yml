  description: 'Dotted hawthorn (Crataegus punctata) is a native North American rosaceous tree or large shrub of old fields,
    woodland edges, and limestone openings, bearing white spring blossoms and red to yellowish pome fruits dotted with glandular
    specks. Mature height is often 20–30 feet (6–9 m) with a rounded crown and formidable thorns on many individuals. It is
    a backbone species for wildlife hedgerows, pasture edges, and restoration blocks where hawthorn diversity is welcome.


    ☀️💧 Sun and Water Requirements:

    Full sun to light shade; more sun equals heavier flowering and fruiting. Adapts to many soils if drainage is reasonable;
    tolerates alkaline substrates better than some eastern Crataegus. Young trees benefit from mulch to reduce grass competition
    at the root flare.


    ✂️ Propagation:

    Sow cleaned seed after warm-cold stratification cycles; hawthorns are patient germinators. Chip budding or grafting is
    used for selected fruit lines in orchard contexts. Transplant small bareroot specimens in cool moist weather to limit
    transplant shock.


    🌾 Harvest / Best Use Timing:

    Pick fruit after color change when slightly soft for processing into jelly or fruit leather—flavor is tart. For wildlife-first
    plantings, leave clusters until birds schedule their banquet. Prune crossing branches in late winter; avoid heavy summer
    topping that invites water sprouts.'
  purpose: '- Edible: Fruits are small but processable for preserves where sugar and acid balance is understood.

    - Wildlife Attractor: Flowers feed pollinators; fruits feed birds and mammals through lean seasons.

    - Erosion Control: Deep roots and thorny stems stabilize disturbed edges animals shortcut through.

    - Border Plant: Thorny habit defines boundaries without plastic signage pretense.'
