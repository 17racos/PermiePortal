  description: |-
    Mayhaw is the southern hawthorn that parties in wet woods and coughs up jelly so tart it makes grocery jam feel like lying. Thorns, white spring flowers, red fall fruit—classic permaculture “work for your sugar.”
    
    Native along swamp margins and low ground; plant where summer humidity and wet feet are features, not bugs.
    
    Sun and water: Full sun to part shade. Tolerates periodic inundation; fruiting improves with sun and steady soil moisture during spring growth.
    ✂️ Propagation:
    Seeds (double dormancy—slow); grafting selected cultivars onto seedling hawthorn roots for known jelly performance.
    
    🌾 Harvest / Best Use Timing:
    - Mayhaw: pick when full color, slight give, and aroma align -- early picks often ripen off-tree in a 65-72°F (18-22°C) room.
    - Taste-test one fruit per tree sector; sun-exposed shoulders ripen faster than shaded interiors.
    - Process windfalls within hours for jam or pulp; leaving them invites fruit fly internships.
