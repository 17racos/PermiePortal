    subtropical and tropical Americas / subtropical: Native along swamp margins and low ground; plant where summer humidity and wet feet are features, not bugs.

    Sun and water: Full sun to part shade. Tolerates periodic inundation; fruiting improves with sun and steady soil moisture during spring growth.

    Propagation: Seeds (double dormancy—slow); grafting selected cultivars onto seedling hawthorn roots for known jelly performance.
