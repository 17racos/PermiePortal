  description: "Butterfly cassia (Senna bicapsularis) is a fast-growing deciduous-to-semi-evergreen shrub in warm climates,
    smothered in bright yellow flowers during cool-season months when many plants are visually on strike. As a legume, it can
    contribute to soil-biology partnerships in diverse hedgerows; as a landscape plant it earns space by feeding Cloudless Sulphur
    and other sulphur butterflies that use Senna as host plants. Size it honestly—fast growth and heavy bloom mean regular pruning
    if paths must stay walkable.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for maximum flower load; thin interior if
    mildew pressures show in humid air.\n- Well-drained soil; tolerates drought once established but looks sharper with occasional
    deep watering.\n- Hard freezes can kill stems to the ground in marginal zones; mulch protects crowns where resprouting is
    part of the plan.\n\n✂️ Propagation:\n- Seeds germinate warm and fast; scarify if dormancy stalls.\n- Take cuttings from
    semi-hardwood in warm seasons with humidity support.\n- Rejuvenate old plants by hard cutback after frost risk passes.\n\n🌾
    Harvest / Best Use Timing:\n- This is primarily a habitat and ornamental shrub—harvest expectations are ecological, not
    pantry, unless you know local Senna food traditions and toxicity boundaries.\n- If collecting seed for propagation, wait
    until pods brown and rattle honestly.\n- Prune spent inflorescences if self-seeding becomes a neighborhood debate."
