description: |-
  Murici (nance) is the little yellow cherry that ferments in buckets, perfumes the yard when flowering, and laughs at drought once established. Flavor is polarizing—like cheese had an argument with a flower.

  True tropical lean; warmest coastal pockets only for in-ground permanence. Everyone else keeps it mobile or admits defeat gracefully.

  Sun and water: Full sun for heaviest flowering and fruit. Tolerates poor, sandy soils; appreciates deep occasional watering when fruiting in dry spells.

  Seeds (variable juvenility); grafted selections for known fruit quality where available.

  Murici: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both. Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer. Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Byrsonima crassifolia drupes are thin-fleshed around a large stone yet ferment into regional chicha, cordials, and candies once sugar and heat tame the polarizing cheese-floral note -- harvest yellow clusters on aroma and slight give before monsoon rains split skins.
  Wildlife Attractor: Tanagers, orioles, and other frugivores strip golden clusters fast in dry tropical yards -- leave perimeter strings of fruit if you want seed dispersal into fence lines without netting every limb.
  Ornamental: Rough gray bark, drought-leathery foliage, and foamy yellow inflorescences sell the small tree along driveways where irrigation is honest sand-country sparse -- fruiting ornament that still reads as food forest, not purely decorative fluff.
