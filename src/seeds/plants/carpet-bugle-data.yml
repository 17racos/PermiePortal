description: |-
  Carpet bugle (Ajuga reptans) is a mat-forming perennial mint relative with rosettes of spoon-shaped leaves—green, bronze, or variegated depending on cultivar—and short spikes of blue-violet flowers in spring. It typically stays under 15 cm (6 inches) tall and spreads by stolons to knit shady ground.

  Part shade to full shade in hot climates; morning sun with afternoon shade works in subtropical and tropical Americas. Moist, humus-rich, well-drained soil; tolerates brief dry spells once established but not desert conditions. Wet-season humidity favors crown rot in heavy clay—improve drainage or plant on slight mounds. Mulch lightly with leaf mold to mimic forest edge.

  Division: Lift and tear mats in spring or early wet season; replant pieces with soil contact and keep damp. Stolons: Pin runners into moist soil to layer; separate when rooted.

  Shear spent flower spikes if you dislike the look; spring bloom feeds pollinators best if left briefly. Thin aggressive edges away from delicate neighbors in summer.
purpose: |-
  Ground Cover: stolons weave evergreen rosettes that smother weeds under trees, along shady paths, and around pond margins where humidity stays moderate and drainage is honest.
  Ornamental: cultivars flash bronze, purple, or variegated spoon leaves so the mat reads decorative even after short blue-violet spring spikes finish blooming.
  Pollinator: early-spring flower spikes open tubular blues when forest canopies are still thin -- giving small bees their first nectar after winter dormancy in temperate zones.
  Pest Management: tight mat leaves fewer bare soil niches for annual weeds and pairs with predatory ground beetles when mulch gaps are kept narrow along the spreading edge.
