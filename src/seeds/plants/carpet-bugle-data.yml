  description: "Carpet bugle (Ajuga reptans) is a mat-forming perennial mint relative
    with rosettes of spoon-shaped leaves—green, bronze, or variegated depending on
    cultivar—and short spikes of blue-violet flowers in spring. It typically stays
    under 15 cm (6 inches) tall and spreads by stolons to knit shady ground.\n\n🌞💧
    Sun and Water Requirements:\n- Part shade to full shade in hot climates; morning
    sun with afternoon shade works in subtropical and tropical Americas.\n- Moist, humus-rich,
    well-drained soil; tolerates brief dry spells once established but not desert
    conditions. Wet-season humidity favors crown rot in heavy clay—improve drainage
    or plant on slight mounds.\n- Mulch lightly with leaf mold to mimic forest edge.\n\n✂️
    Methods to Propagate:\n- Division: Lift and tear mats in spring or early wet
    season; replant pieces with soil contact and keep damp.\n- Stolons: Pin runners
    into moist soil to layer; separate when rooted.\n\n🌾 Harvest / Best Use Timing:\n-
    Shear spent flower spikes if you dislike the look; spring bloom feeds pollinators
    best if left briefly. Thin aggressive edges away from delicate neighbors in summer."
