description: "Wild coffee (*Psychotria nervosa*) is a Florida-native understory shrub with glossy leaves and small white flowers followed by red berries (not a caffeine crop — the name is botanical teasing). It spreads politely by suckers, making a textured ground-to-midlayer mat under oaks and palms.\n\nIt is the native answer to “something green that survives under my tree without sod crime.”\n\n💧 Sun and Water:\nShade to dappled light; avoid blasting afternoon sun unless soil stays moist. Likes even moisture and organic mulch; not a desert plant.\n\n  Propagation: \nSeeds: sow fresh seed; viability drops as seed dries. Division: separate rooted suckers with some roots attached in warm wet seasons. Cuttings: softwood to semi-hardwood with humidity. Transplants: very forgiving from pots if kept moist.\n\n🌾 Harvest / Best Use Timing:\nBerries ripen to glossy red on female plants -- coffee processing is a fermentation and drying discipline, not a five-minute hack. Harvest for wildlife if you are not running clean processing lines. Prune for shape after fruiting slows; shade-houseplants get repot timing instead of field frost."
purpose: |-
  Wildlife Attractor: Psychotria nervosa tiny white flowers feed native bee guilds; red drupes fuel thrushes -- berries are not arabica; caffeine is essentially absent.
  Shade Provider: Glossy 15 cm leaves layer 1--2 m high under oak canopy -- breaks up sod deserts without demanding sun.
  Ornamental: Looks like a coffee cousin for Florida yards -- no Hemileia rust, no berry pickers expecting espresso.
  Ground Cover: Suckers form polite colonies that hold mulch and block weeds -- steady moisture required; dry berms crisp the edges.
