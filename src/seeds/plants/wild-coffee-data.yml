description: "Wild coffee (*Psychotria nervosa*) is a Florida-native understory shrub\
  \ with glossy leaves and small white flowers followed by red berries (not a caffeine\
  \ crop — the name is botanical teasing). It spreads politely by suckers, making\
  \ a textured ground-to-midlayer mat under oaks and palms.\n\nIt is the native answer\
  \ to “something green that survives under my tree without sod crime.”\n\n\U0001F4A7\
  \ Sun and Water:\n- Shade to dappled light; avoid blasting afternoon sun unless\
  \ soil stays moist.\n- Likes even moisture and organic mulch; not a desert plant.\n\
  \n  Propagation: \n- Seeds: sow fresh seed; viability drops as seed dries.\n\
  - Division: separate rooted suckers with some roots attached in warm wet seasons.\n\
  - Cuttings: softwood to semi-hardwood with humidity.\n- Transplants: very forgiving\
  \ from pots if kept moist.\n\n\U0001F33E Harvest / Best Use Timing:\n- Berries ripen\
  \ to glossy red on female plants -- coffee processing is a fermentation and drying\
  \ discipline, not a five-minute hack.\n- Harvest for wildlife if you are not running\
  \ clean processing lines.\n- Prune for shape after fruiting slows; shade-houseplants\
  \ get repot timing instead of field frost."
purpose: |-
  Wildlife Attractor: Psychotria nervosa tiny white flowers feed native bee guilds; red drupes fuel thrushes -- berries are not arabica; caffeine is essentially absent.
  Shade Provider: Glossy 15 cm leaves layer 1--2 m high under oak canopy -- breaks up sod deserts without demanding sun.
  Ornamental: Looks like a coffee cousin for Florida yards -- no Hemileia rust, no berry pickers expecting espresso.
  Ground Cover: Suckers form polite colonies that hold mulch and block weeds -- steady moisture required; dry berms crisp the edges.
