  description: |-
    Wild coffee (*Psychotria nervosa*) is a Florida-native understory shrub with glossy leaves and small white flowers followed by red berries (not a caffeine crop — the name is botanical teasing). It spreads politely by suckers, making a textured ground-to-midlayer mat under oaks and palms.
    
    It is the native answer to “something green that survives under my tree without sod crime.”
    
    ☀️💧 Sun and Water:
    - Shade to dappled light; avoid blasting afternoon sun unless soil stays moist.
    - Likes even moisture and organic mulch; not a desert plant.
    
    ✂️ ✂️ Propagation: 
    - Seeds: sow fresh seed; viability drops as seed dries.
    - Division: separate rooted suckers with some roots attached in warm wet seasons.
    - Cuttings: softwood to semi-hardwood with humidity.
    - Transplants: very forgiving from pots if kept moist.
    
    🌾 Harvest / Best Use Timing:
    - Berries ripen to glossy red on female plants -- coffee processing is a fermentation and drying discipline, not a five-minute hack.
    - Harvest for wildlife if you are not running clean processing lines.
    - Prune for shape after fruiting slows; shade-houseplants get repot timing instead of field frost.
