  description: "Wild coffee (*Psychotria nervosa*) is a Florida-native understory
    shrub with glossy leaves and small white flowers followed by red berries (not
    a caffeine crop — the name is botanical teasing). It spreads politely by suckers,
    making a textured ground-to-midlayer mat under oaks and palms.\n\nIt is the
    native answer to “something green that survives under my tree without sod crime.”\n\n☀️💧
    Sun and Water:\n- Shade to dappled light; avoid blasting afternoon sun unless
    soil stays moist.\n- Likes even moisture and organic mulch; not a desert plant.\n\n✂️
✂️ Propagation:
\n- Seeds: sow fresh seed; viability drops as seed dries.\n- Division:
    separate rooted suckers with some roots attached in warm wet seasons.\n- Cuttings:
    softwood to semi-hardwood with humidity.\n- Transplants: very forgiving from pots
    if kept moist."
  purpose: |-
    - Wildlife Attractor: Flowers and berries feed insects and birds.
    - Shade Provider: Fills understory and cools soil microclimate.
    - Ornamental: Clean, coffee-like foliage without importing actual coffee pests into every bed.
    - Ground Cover: Suckering habit stabilizes mulch and excludes weeds in shade.
  companions:
  - Marlberry
  - Simpson Stopper
  - Coontie
  - Ferns
  cautions:
  - Full sun on hot dry berms
  pests:
