  practitioner_notes: |-
    Fruiting pseudostem dies after harvest—cut it at ground level and let the next sucker take leadership.
    Water trapped in leaf axils breeds mosquitoes—pour out or flush cups after storms in patio plantings.
    Heavy bunches need a pole Y or second pseudostem tie—wind gusts snap necks without support.
