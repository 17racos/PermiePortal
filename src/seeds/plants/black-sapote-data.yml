  description: "Black sapote is the persimmon that cosplays as dessert—green skin, pulp
    that ripens to brown and spoonable, flavor that is mild-sweet and not actually chocolate
    no matter what the brochures claim. Evergreen to semi-evergreen tree with glossy
    leaves and the quiet confidence of something that fruits in the tropics.\n\nTrue tropical. 9b explorers need serious microclimate or
    accept occasional insult from cold snaps. Coastal tropical and subtropical zones and keys energy.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for fruiting.\nDeep, regular watering when young; established
    trees tolerate short dry periods but not salt spray bravado without selection.\n\n✂️ Propagation:\n\nSeedlings variable; grafted trees for known fruit quality. Fresh seed germinates
    readily in warm mix.\n\n🌾 Harvest / Best Use Timing:\n\nPick mature-green fruit with a tight calyx and ripen off the tree until pulp softens and darkens; fully green hard fruit will not rescue itself on the counter."
  purpose: |-
    - Edible: Spoonable ripe pulp for frost-free systems—mild-sweet, not actual chocolate no matter the brochures.
    - Ornamental: Evergreen gloss and reliable tropical fruiting presence in home orchards.
    - Wildlife Attractor: Drops and splits feed wildlife when you miss the harvest window.
