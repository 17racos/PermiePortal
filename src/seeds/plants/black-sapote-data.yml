  description: 'Black sapote is the persimmon that cosplays as dessert—green skin, pulp that ripens to brown and spoonable,
    flavor that is mild-sweet and not actually chocolate no matter what the brochures claim. Evergreen to semi-evergreen tree
    with glossy leaves and the quiet confidence of something that fruits in the tropics.


    True tropical. 9b explorers need serious microclimate or accept occasional insult from cold snaps. Coastal tropical and
    subtropical zones and keys energy.


    ☀️💧 Sun and Water Requirements:


    Full sun for fruiting.

    Deep, regular watering when young; established trees tolerate short dry periods but not salt spray bravado without selection.


    ✂️ Propagation:


    Seedlings variable; grafted trees for known fruit quality. Fresh seed germinates readily in warm mix.


    🌾 Harvest / Best Use Timing:


    Pick mature-green fruit with a tight calyx and ripen off the tree until pulp softens and darkens; fully green hard fruit
    will not rescue itself on the counter.'
