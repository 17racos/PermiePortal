  description: |-
    Hairy indigo is the warm-season cover crop for people tired of bare soil baking like parking lots. It is hairier than your uncle's vacation photos and fixes nitrogen while smothering weeds if you give it heat and time. Not the same as the perennial false indigo gang — this one behaves like an annual hero in Florida summer rotations. Seed in warm soil; frost finishes it without tears.

    ☀️💧 Sun and Water Requirements:
    - Full sun for maximum biomass and nodulation.
    - Tolerates poor sandy soils; drought-tolerant once established but grows faster with moderate water.
    - Avoid waterlogged fields — roots need air between rains.

    ✂️ Methods to Propagate:
    - Seeds: scarify lightly; drill or broadcast after soil hits reliable warmth.
    - Incorporate before seed set if you are not breeding a weedy sequel.
  purpose: |-
    Hairy indigo is cheap soil insurance in hot climates:

    - Nitrogen Fixer: Feeds the next crop without bagged fantasy numbers.
    - Green Manure: Mow and incorporate or mulch-in-place.
    - Animal Fodder: Grazed carefully in systems that know legume bloat basics.
    - Cover Crop: Fast canopy beats summer weeds.
    - Wildlife Attractor: Flowers feed small bees when allowed to bloom briefly.
  companions:
