  description: |-
    Hairy indigo is the warm-season cover crop for people tired of bare soil baking like parking lots. It is hairier than your uncle's vacation photos and fixes nitrogen while smothering weeds if you give it heat and time. Not the same as the perennial false indigo gang — this one behaves like an annual hero in Florida summer rotations. Seed in warm soil; frost finishes it without tears.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for maximum biomass and nodulation.
    - Tolerates poor sandy soils; drought-tolerant once established but grows faster with moderate water.
    - Avoid waterlogged fields — roots need air between rains.
    
    ✂️ Methods to Propagate:
    - Seeds: scarify lightly; drill or broadcast after soil hits reliable warmth.
    - Incorporate before seed set if you are not breeding a weedy sequel.
    
    🌾 Harvest / Best Use Timing:
    - For Hairy Indigo, harvest timing follows the primary function you planted for -- flowers, fodder, mulch, or structure.
    - Coppice or prune dormant windows where winters exist; subtropical plants often prefer dry-season cuts.
    - Always sanitize tools between diseased and clean plants -- drama spreads faster than newsletters.
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: It is hairier than your uncle's vacation photos and fixes nitrogen while smothering weeds if you give it heat and time. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Green Manure: Hairy Indigo terminates on schedule into soil-covering green manure that feeds microbes before the next crop occupies the row -- terminates into soil-covering residue that feeds biology before the next cash crop moves in
    Animal Fodder: Hairy Indigo offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Cover Crop: Hairy Indigo fills gaps between cash crops with living roots that intercept leaching and keep aggregates from collapsing -- fits tight rotations between main crops to protect soil structure and capture leaked nutrients
    Wildlife Attractor: Wildlife shows up for calories and cover: Hairy indigo is the warm-season cover crop for people tired of bare soil baking like parking lots. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot

