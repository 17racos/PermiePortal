  description: "Marlberry (*Ardisia escallonioides*) is a native Florida shrub to
    small tree with leathery leaves, drooping clusters of small white flowers, and
    dark berries. It is shade-tolerant and often found in hardwood hammocks — exactly
    the kind of layered, low-light niche where grass worship fails and ecology wins.\n\nDo
    not confuse it with invasive coral ardisia (*Ardisia crenata*). This one belongs
    here; that one is the yard-invading cosplay.\n\n☀️💧 Sun and Water:\n- Part shade
    to shade; tolerates some morning sun with adequate moisture.\n- Likes steady
    organic moisture but needs drainage; mulch and humus mimic hammock floor conditions.\n\n✂️
    Propagation:\n- Seeds: sow ripe cleaned seed in a humid, well-drained medium;
    can be slow.\n- Cuttings: hardwood or semi-hardwood with rooting hormone under
    humidity.\n- Transplants: container plants; keep moist while roots establish."
  purpose: |-
    - Wildlife Attractor: Flowers and fruits support birds and insects in forest-edge systems.
    - Ornamental: Handsome evergreen foliage and graceful fruiting habit.
    - Shade Provider: Contributes to mid-story shade in food forests.
    - Edible: Fruit is technically edible but sparse and not a primary crop — forage realistically.
  companions:
  - Wild Coffee
  - Simpson Stopper
  - Coontie
  - Ferns
  avoid:
  - Invasive ground covers that smother seedlings
  pests:
  - Scale Insects
  - Mealybugs
  - Whiteflies
  - Aphids
  growth_habit: Shrub
  data_quality_score: 0.75
