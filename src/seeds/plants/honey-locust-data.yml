  description: |-
    Honey locust is the legume tree that dropped medieval armor for suburbia: wild types bristle with thorns; nursery cultivars go bare-legged and polite. Drought-tough, sun-hungry, and happy on poor soils — it fixes nitrogen enough to matter in polyculture talk without pretending to be a bean patch.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for strong form and pod production.
    - Tolerates drought once established; wet feet invite decline.
    - pH flexible; compaction bothers it less than most ornamentals.
    
    ✂️ Methods to Propagate:
    - Seeds: scarify and soak — hard seed coat is a gatekeeper.
    - Grafted cultivars: propagate by budding to keep thornless, predictable habits.
    - Transplant young bareroot trees in cool, wet seasons.
    
    🌾 Harvest / Best Use Timing:
    - Livestock pods: collect when pods rattle but before heavy worm damage -- taste-test livestock response in small increments.
    - Coppice wood on multi-year rotations for fence posts where thorns are acceptable.
    - Flowers feed pollinators -- avoid wholesale canopy removal during peak bloom.
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: Honey locust is the legume tree that dropped medieval armor for suburbia: wild types bristle with thorns; nursery cultivars go bare-legged and polite. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Animal Fodder: Honey Locust offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Wildlife Attractor: Honey Locust layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Timber: Honey Locust fits long-rotation timber lanes where straight stems or durable wood justify spacing that would starve annual beds -- delivers structural wood cycles in long-rotation zones without pretending every tree is dessert
    Shade Provider: Shade design leans on real canopy behavior: Drought-tough, sun-hungry, and happy on poor soils  --  it fixes nitrogen enough to matter in polyculture talk without pretending to be a bean patch. -- creates understory microclimate for shade-tolerant herbs and roots while cutting moisture loss below
