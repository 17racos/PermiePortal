  description: 'Honey locust is the legume tree that dropped medieval armor for suburbia: wild types bristle with thorns;
    nursery cultivars go bare-legged and polite. Drought-tough, sun-hungry, and happy on poor soils — it fixes nitrogen enough
    to matter in polyculture talk without pretending to be a bean patch.


    ☀️💧 Sun and Water Requirements:

    - Full sun for strong form and pod production.

    - Tolerates drought once established; wet feet invite decline.

    - pH flexible; compaction bothers it less than most ornamentals.


    ✂️ Methods to Propagate:

    - Seeds: scarify and soak — hard seed coat is a gatekeeper.

    - Grafted cultivars: propagate by budding to keep thornless, predictable habits.

    - Transplant young bareroot trees in cool, wet seasons.'
  purpose: 'Honey locust is overstory infrastructure with snacks:


    - Nitrogen Fixer: Nodules on roots feed the system modestly, not miracle hype.

    - Animal Fodder: Sweet pods fed livestock historically; verify cultivar and quantity.

    - Wildlife Attractor: Flowers for pollinators; pods for mammals and bold foragers.

    - Timber: Dense wood where straight stems exist — often more windbreak than lumber mill.

    - Shade Provider: Light, dappled shade compared to oak — understory still breathes.'
  companions:
