  description: "Wild petunia (Ruellia caroliniensis) is a low, spreading perennial of southeastern North American dry woodlands and glades, with lavender funnel flowers that last a day but repeat through warm months. Plants reach roughly 6–18 inches (15–45 cm), rooting at nodes. It suits dry shade borders, path edges, and pollinator strips where heat is honest.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light partial shade; more sun increases bloom in humid climates. Well-drained, lean to average soils suit it; tolerates drought once established. Avoid wet clay.\n\n✂️ Propagation:\nDivide clumps in spring; sow seed after frost with surface press.\n\n🌾 Harvest / Best Use Timing:\nPrimarily ornamental—peak bloom tracks heat waves through warm months."
