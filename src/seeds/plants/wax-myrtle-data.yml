  description: "Wax myrtle (Morella cerifera) is an aromatic evergreen to semi-evergreen
    shrub or small tree native to the southeastern United States, including coastal
    Florida and similar humid sites. It typically reaches 3–6 m (10–20 ft), often
    multi-stemmed, with narrow leaves that smell resinous when crushed and waxy gray
    berries enjoyed by birds. Root nodules partner with actinobacteria to fix nitrogen—a
    quiet soil upgrade in sandy, lean ground.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun to light shade; denser in sun, looser in shade.\n- Tolerates wet feet
    better than many shrubs once established; still prefers oxygenated soil over
    permanent stagnation.\n- Salt spray tolerant—useful near coasts in Florida and
    Puerto Rico maritime exposures.\n\n✂️ Methods to Propagate:\n- Softwood cuttings
    in summer under humidity; dip in rooting hormone for consistency.\n- Collect
    ripe berries, clean seed, sow promptly—germination improves with moist-warm
    stratification experiments.\n- Dig root suckers in dormant season with some roots
    attached; pot until established.\n\n🌾 Harvest / Best Use Timing:\n- Berries
    historically rendered for bayberry-type wax—small-scale craft, not industrial
    yield.\n- Prune for hedge shape in late winter before spring flush; avoid heavy
    shearing during nesting peak if wildlife is a goal."
