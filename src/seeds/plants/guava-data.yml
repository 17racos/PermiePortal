    young plants appreciate light shade during brutal heat.\n- Deep, well-drained
    soil; steady moisture in fruit fill, but not boggy roots.\n- Mulch hard to buffer
    soil temps and cut weed competition.\n\n✂️🌱 Methods to Propagate:\n- Seeds: fresh
    seed germinates quickly; offspring variable.\n- Cuttings and air-layering: clone
    a known good cultivar — do not roll dice on seedling fruit quality.\n- Grafted
    or named varieties from nurseries: fastest path to dessert.\n\n🧺 When to Harvest:\n-
    Pick when fruit gives slightly under gentle pressure and aroma develops — guavas
    are masters of the 'one day perfect, next day mush' timeline."
