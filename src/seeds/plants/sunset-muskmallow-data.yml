  description: 'Sunset muskmallow is the dramatic hibiscus-relative that hands you huge soft leaves for soups and wraps while
    pretending to be landscaping. Flowers are showy enough to confuse your HOA into thinking you care about curb appeal. In
    true tropics it is a short-lived shrubby perennial; in subtropical and tropical Americas it often freezes to the crown
    then rebounds with mulch — unless winter is petty.


    ☀️💧 Sun and Water Requirements:

    - Full sun to bright partial shade; more sun equals bigger plants if water matches.

    - Rich, moisture-retentive, well-drained soil; steady water prevents leaf flagging in heat.

    - Wind protection helps enormous leaves from shredding cosmetically.


    ✂️ Methods to Propagate:

    - Seeds: nick or soak; start warm, transplant after frost.

    - Cuttings: easy in humid summer conditions — root in water or moist media.'
  purpose: 'Sunset muskmallow is a subtropical leaf vegetable with flower flair:


    - Edible: Young leaves and mucilaginous texture for okra-adjacent dishes.

    - Pollinator: Large flowers attract bees and hummingbirds.

    - Ornamental: Tropical look without a palm budget.

    - Mulcher: Huge leaves feed soil when pruned sensibly.'
  companions:
  - Okra
  - Basil
  - Papaya
  cautions:
  - Drought and neglect in peak summer
  - Heavy clay without organic fluff
  pests:
  - Aphids
  - Banded Winged Whitefly
  - Cocoa Pod Borer
  - Japanese beetles
  - Whiteflies
  practitioner_notes: 'Blanch or process within hours if you are freezing—enzymes keep chewing while paperwork waits.

    Cluster patches three feet or wider—tiny one-offs get ignored by bees cruising for volume.

    Notebook one weird year—weather anomalies repeat; memory lies, scribbles do not.

    Harvest texture changes faster than color—nip one sample before you commit the whole row to a pick date.'
