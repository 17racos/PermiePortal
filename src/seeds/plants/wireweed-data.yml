  description: "Wireweed (Polygonum aviculare) is a prostrate annual knotweed of
    compacted paths, crop edges, and disturbed ground worldwide, including agricultural
    regions across the Americas. Thin wiry stems with tiny leaves and papery sheaths
    form resilient mats that tolerate foot traffic and poor soil. It is better known
    as a tenacious weed than a crop, yet young tips have minor traditional food use
    where contamination is absent.\n\n☀️💧 Sun and Water Requirements:\nFull sun
    to part shade; thrives in compacted, droughty microsites where other plants surrender.
    Tolerates brief flooding along paths after storms. Fertile irrigated beds increase
    growth rate—usually the opposite of what gardeners want.\n\n✂️ Propagation:\nSelf-sows
    abundantly; seeds survive soil disturbance cycles. Mechanical cultivation fragments
    rarely help—plants reroot from nodes. Mulch and reduce compaction for long-term
    suppression.\n\n🌾 Harvest / Best Use Timing:\nIf exploring edible tips, collect
    only from clean, unsprayed sites early in growth; wash thoroughly. Stop harvesting
    once stems toughen. For management, pull or hoe before seed set to reduce the soil
    seed bank."
  purpose: |-
    - Edible: Young tips are eaten sparingly in some traditions; never harvest from contaminated roadsides or sprayed fields.
    - Ground Cover: Temporary living mulch on brutal soils where intentional plants struggle to establish first.
    - Dynamic Accumulator: Scavenges and concentrates nutrients from poor substrates into biomass that can be composted if seed-free.
  companions:
  - White Clover — low legume matrix can outcompete knotweed gaps in lawn conversion projects with proper mowing height
  - Ryegrass — quick cover crop to stabilize disturbed soil while perennial sod establishes
  - Buckwheat — smother crop in rotation; shades and outcompetes early-season knotweed in vegetable fallows
  cautions:
  - Agricultural weed — seed bank persistence; prevent seed set in production fields
  - Pesticide residues — do not forage from sprayed rights-of-way
