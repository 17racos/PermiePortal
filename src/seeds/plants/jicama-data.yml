  description: "Jicama is the crunchy root that wants to be an apple but is secretly
    a legume vine. You eat the swollen root; you do not snack the seeds or pods like
    edamame unless you enjoy rotenone-era bad decisions—those parts are toxic.\n\nTreat as a long warm-season annual. Plant after soil warms;
    harvest before hard frost. Daylength varieties exist; short-day types tuberize
    when you need them in our latitude if you pick the right cultivar.\n\nSun and water:
    Full sun, loose deep soil for chunky roots. Regular water during vine growth; ease
    up near harvest to reduce splitting.\n\nPropagation: Soak seed overnight; direct
    sow or transplant carefully—roots hate disturbance once they decide to swell."
