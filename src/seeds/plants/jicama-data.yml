  description: 'Jicama is the crunchy root that wants to be an apple but is secretly a legume vine. You eat the swollen root;
    you do not snack the seeds or pods like edamame unless you enjoy rotenone-era bad decisions—those parts are toxic.


    Treat as a long warm-season annual. Plant after soil warms; harvest before hard frost. Daylength varieties exist; short-day
    types tuberize when you need them at your latitude if you pick the right cultivar.


    ☀️💧 Sun and Water Requirements:


    Full sun, loose deep soil for chunky roots.

    Regular water during vine growth; ease up near harvest to reduce splitting.


    ✂️ Propagation:


    Soak seed overnight; direct sow or transplant carefully—roots hate disturbance once they decide to swell.


    🌾 Harvest / Best Use Timing:


    Dig roots before hard frost when tops begin to yellow—toxic seeds and pods are never the snack.'
  purpose: '- Edible: Crisp raw root vegetable once peeled; keep seed pods out of the kitchen.

    - Nitrogen Fixer: Rhizobia partnership if you let nodules form—balance that with tuber sizing goals.

    - Ground Cover: Living mulch while vines run before harvest clears the bed.'
