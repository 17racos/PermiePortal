  description: "Inkberry (Ilex glabra) is a spineless evergreen holly valued in northeastern
    to mid-Atlantic landscapes as a native alternative to sheared exotic hedges, forming
    compact clones with glossy leaves and black berries that persist into winter on
    pollinated female plants. Ecologically it is the same species often called gallberry
    farther south—common names shift with latitude and beekeeper slang. It tolerates
    wet acidic soils, feeds birds when berries set, and asks only that you stop pretending
    alkaline urban fill is forest duff.\n\n☀️💧 Sun and Water Requirements:\nFull sun
    to partial shade; densest habit in bright light with adequate moisture. Tolerates
    poorly drained acidic soils and periodic inundation in natural settings; in gardens,
    avoid droughty roof runoff without irrigation. Wind exposure desiccates foliage
    in winter—site with protection in coldest zones. Mulch roots; surface roots resent
    mower strikes.\n\n✂️ Propagation:\nSoftwood cuttings under mist root reliably in
    late spring.\nSuckering clones expand hedges—transplant suckers with roots in early
    spring.\n\n🌾 Harvest / Best Use Timing:\nPrune after winter if shaping formal hedges;
    light renewal pruning keeps interior wood from going bare. For berries, plant a
    known male pollinator near female clones and skip heavy shearing that removes flowers."
  purpose: |-
    - Border Plant: Evergreen, mostly spineless foliage creates neat screens along paths and property lines.
    - Wildlife Attractor: Winter berries feed birds when pollinizer pairs are present.
    - Ornamental: Dark green leaves suit minimalist native designs without boxwood cosplay.
    - Erosion Control: Fibrous roots stabilize moist, acidic banks in multispecies buffers.
  companions:
  - Red Osier Dogwood — red winter stems contrast ink-green holly in wet shrub borders
  - Highbush Blueberry — shares acidic mulch and supports early pollinators before holly bloom peaks
  - Sweetfern — aromatic nitrogen-fixer ground layer on sandy acidic sites beneath open holly skirts
  cautions:
  - Grayanotoxins in leaves and berries—do not market as livestock forage or child-safe snacks
  pests:
