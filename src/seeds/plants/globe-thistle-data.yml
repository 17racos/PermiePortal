  description: 'Globe thistle (*Echinops ritro*) is a spiny-leaved perennial from Eurasia, grown for steel-blue spherical
    flower heads on branching stems 3–4 feet tall. Deep roots and silvery foliage suit dry borders. In subtropical and tropical
    Americas it is best in winter-spring display with sharp drainage—summer humidity and heavy clay often trigger foliar decline,
    so treat it as a seasonal star in raised beds or Mediterranean-style plantings.


    🌞💧 **Sun and Water Requirements:**

    Full sun and excellent drainage. Water deeply but infrequently; avoid wet foliage overnight in humid subtropical rainy
    season.


    ✂️ **Methods to Propagate:**

    - **Root cuttings:** Take thick root pieces in late winter, bury horizontally in sandy mix, and keep warm until shoots
    appear.

    - **Seeds:** Sow in spring; seedlings may take a couple of years to reach flowering size.


    🧑‍🌾 **Harvest / Best Use Timing:**

    Cut flowers for drying when color is fully blue and bracts are tight. Leave late heads for goldfinches and other seed
    eaters if you are not worried about self-sowing.'
