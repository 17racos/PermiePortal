  description: "Java apple (Syzygium samarangense) is a tropical myrtle-family tree bearing bell-shaped, often waxy fruits in red to pale green, with crunchy, mild, watery flesh valued for fresh eating and salads in humid Asia and the Americas tropics. Trees commonly reach 25–40 feet (7.5–12 m) unless kept smaller by pruning. White to pink flowers are showy; new leaves are often reddish. It suits backyard orchards where fruit flies are managed and frost is absent.\n\n☀️💧 Sun and Water Requirements:\nFull sun for best flowering and fruiting; partial shade works in hottest deserts with humidity. Rich, well-drained soils with steady irrigation in dry seasons; mulch buffers roots from heat. Wind protection reduces fruit scuffing.\n\n✂️ Propagation:\nAir-layering and grafting preserve elite selections; seedling variability is real. Prune after major harvest waves to size-manage. Remove water sprouts that steal structure from scaffold limbs.\n\n🌾 Harvest / Best Use Timing:\nPick when color peaks and fruit feels firm-crisp; overripe apples go mushy fast in heat. Net clusters if birds and flies schedule parties without inviting you. Flowers can flush multiple times per year in warm climates."
  purpose: |-
    - Edible: Crisp mild fruit extends tropical fruit salads and pickles without heavy sweetness.
    - Ornamental: Fluffy flowers and colorful fruit make honest yard candy in humid climates.
    - Wildlife Attractor: Flowers and fruit engage birds and insects where management allows sharing.
    - Shade Provider: Dense crown gives understory shade for herbs and young trees.
