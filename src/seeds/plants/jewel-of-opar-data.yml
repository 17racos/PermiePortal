  description: "Jewel of Opar (Talinum paniculatum) is a succulent-flavored herbaceous perennial from Central America and
    the southern United States, beloved for lime-green leaves, airy panicles of tiny pink flowers, and jewel-like seed pods
    that catch light like beads on a string. Plants form loose mounds roughly 30–60 cm (12–24 inches) tall and wider with
    age in lean, sunny beds. Young leaves read like mild purslane in texture; mature plants shift energy into showy inflorescences
    that belong in the ornamental-edible border where drought honesty is a virtue.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun keeps stems stiff and flowering honest; shade invites lank growth and fewer sparkles.\n- Drought-tolerant once
    established; water deeply then let soil approach dry between irrigations rather than misting daily.\n- Sharp drainage
    is non-negotiable—gritty mix or raised beds beat soggy clay that cooks crowns in warm wet winters.\n\n✂️ Methods to Propagate:\n-
    Seeds: surface sow in warm trays; light aids germination, usually within 1–2 weeks at roughly 70–80°F (21–27°C).\n-
    Soft tip cuttings in warm months root in perlite or sand with gentle bottom heat.\n- Division of older clumps after the
    dry season break resets woody bases and multiplies planting stock.\n\n🌾 Harvest / Best Use Timing:\n- Snip young leaves
    before flowering for the tenderest kitchen trials; flavor intensifies as plants age.\n- Harvest decorative seed stems
    when capsules color but before they shatter if you want clean arrangements or saved seed.\n- Shear spent inflorescences
    in long-season climates to encourage another flush before short days slow growth."
