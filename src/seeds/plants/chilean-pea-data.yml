  description: 'Lathyrus chilensis, commonly known as the Chilean Pea or Perennial Sweet Pea, is a herbaceous perennial vine
    native to Chile. It is renowned for its vibrant red to pink pea-like flowers that bloom profusely during the summer months.
    The plant exhibits a climbing habit, using tendrils to support itself on nearby structures or plants, and can reach heights
    of up to 2 meters (6.5 feet). Its compound leaves are composed of multiple leaflets, providing a delicate and feathery
    appearance.


    🌞💧 Sun and Water Requirements:

    - Prefers full sun to partial shade.

    - Thrives in well-drained soils with moderate moisture levels.

    - Once established, it exhibits some drought tolerance but benefits from regular watering during prolonged dry periods.


    ✂️🫘 Methods to Propagate:

    - **Seeds**: Sow seeds in the spring after the last frost. Soaking seeds overnight can enhance germination rates.

    - **Division**: Established clumps can be divided in early spring or fall to propagate new plants.


    🧑‍🌾👩‍🌾 When to Harvest:

    - While the plant is primarily ornamental, young shoots and tendrils can be harvested in early spring for culinary uses,
    similar to other pea tendrils.

    - Harvest edible parts before flowering for the best texture and flavor.'
