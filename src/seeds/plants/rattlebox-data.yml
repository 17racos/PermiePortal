  description: 'Rattlebox (*Crotalaria spectabilis*) is an annual herbaceous plant in the Fabaceae family, known for its vibrant
    yellow flowers and distinctive seed pods that rattle when shaken. It typically grows to a height of 1.2 to 1.5 meters
    (4 to 5 feet) with erect, ridged stems covered in short hairs. The leaves are simple, obovate, and alternately arranged,
    measuring 3.3 to 9.2 centimeters in length and 1 to 3.8 centimeters in width. Flowering occurs from August to November,
    producing bright yellow blooms that attract various pollinators. The plant thrives in full sun and prefers sandy, well-drained
    soils. Propagation is primarily through seeds, which can be sown directly into the soil after the last frost. Harvesting
    for green manure purposes is best done before the plant sets seed to maximize nutrient content.


    ✂️🫘 Methods to Propagate:

    - **Seed Propagation:** Sow seeds directly into the soil after the last frost. Scarification of seeds can improve germination
    rates.


    🌞💧 Sun and Water Requirements:

    - **Sun:** Prefers full sun exposure.

    - **Water:** Requires moderate watering; drought-tolerant once established but performs best with regular moisture.


    🧑‍🌾👩‍🌾 When to Harvest:

    - For green manure, incorporate the plant into the soil before it sets seed to maximize nutrient content.'
  purpose: '- **Nitrogen Fixer:** Enhances soil fertility by fixing atmospheric nitrogen, reducing the need for synthetic
    fertilizers.

    - **Green Manure:** Improves soil structure and organic matter when used as a cover crop and incorporated back into the
    soil.

    - **Ornamental:** Adds aesthetic value to gardens with its bright yellow flowers and unique seed pods.'
