  description: |-
    Chinese water chestnut is a sedge, not the spiky invasive Trapa monster. It grows in shallow paddies and tubs, forming crisp corms that crunch in stir-fries—if you keep the water warm enough through the growing season.

    North Florida / subtropical: Treat as a long-season annual crop in ponds, stock tanks, or IBC rigs; winter chill can shut the party down—harvest corms before cold stalls growth.

    Sun and water: Full sun for best corm fill. Shallow flooded soil or saturated muck 4–8 inches deep over a loamy bottom; never let the invasive floating types confuse your ethics or your ecology.

    Propagation: Corms replanted in spring after last frost; division of clumps where legal and contained.
