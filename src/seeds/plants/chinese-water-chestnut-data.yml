  description: |-
    Chinese water chestnut (Eleocharis dulcis) is a sedge, not the spiky invasive Trapa monster. It grows in shallow paddies and tubs, forming crisp corms that crunch in stir-fries—if you keep the water warm enough through the growing season.

    subtropical and tropical Americas: Treat as a long-season annual crop in ponds, stock tanks, or IBC rigs; winter chill at the cooler end of its Florida range can shut the party down—harvest corms before cold stalls growth. In Puerto Rico's wet season, watch for overheated shallow water and top up evaporation losses.

    ☀️💧 Sun and Water Requirements:
    - Full sun for best corm fill; partial sun works but yields slacken.
    - Shallow flooded soil or saturated muck 4–8 inches deep over a loamy bottom; keep invasive floating "water chestnuts" (Trapa spp.) out of your ethics and your ecology.

    ✂️ Propagation:
    - Replant sound corms after the last cool snap in frost pockets; in zone 10+ start whenever water stays steadily warm.
    - Divide dense clumps inside contained systems only—never open storm drains.

    🌾 Harvest / Best Use Timing:
    - Drain beds in late season, dig corms, and cure briefly before refrigeration; eat peeled and sliced raw or cooked.
