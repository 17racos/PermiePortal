  description: |-
    Chinese water chestnut (Eleocharis dulcis) is a sedge, not the spiky invasive Trapa monster. It grows in shallow paddies and tubs, forming crisp corms that crunch in stir-fries—if you keep the water warm enough through the growing season.

    subtropical and tropical Americas: Treat as a long-season annual crop in ponds, stock tanks, or IBC rigs; winter chill at the cooler end of its Florida range can shut the party down—harvest corms before cold stalls growth. In Puerto Rico's wet season, watch for overheated shallow water and top up evaporation losses.

    ☀️💧 Sun and Water Requirements:
    - Full sun for best corm fill; partial sun works but yields slacken.
    - Shallow flooded soil or saturated muck 4–8 inches deep over a loamy bottom; keep invasive floating "water chestnuts" (Trapa spp.) out of your ethics and your ecology.

    ✂️ Propagation:
    - Replant sound corms after the last cool snap in frost pockets; in zone 10+ start whenever water stays steadily warm.
    - Divide dense clumps inside contained systems only—never open storm drains.

    🌾 Harvest / Best Use Timing:
    - Drain beds in late season, dig corms, and cure briefly before refrigeration; eat peeled and sliced raw or cooked.
  purpose: |-
    Controlled aquatic carbohydrate for humid systems:

    - Edible: Crisp corms add crunch to stir-fries and salads once peeled; flavor is mild and starchy, not a chestnut tree fraud.
    - Water Purifier: Roots and rhizosphere strip dissolved nutrients from shallow water, giving you a harvest instead of an algae bloom when beds are sized honestly.
    - Aquatic: Sedges define the water edge layer in food forests that include chinampas-style tubs or paddy sections.
    - Biomass: Spent foliage and root sheath debris compost into mulch for nearby dryland beds after harvest drains down.
  companions:
  - Duckweed
  - Pickerelweed
  - Cattail
  cautions:
  - Open waterways where escape is possible
  - Confusion with invasive water chestnut (Trapa species)
  pests:
  - Aphids
  - Fungus Gnats
  - Nematodes
  practitioner_notes: |-
    Corms form late—wait until tops brown before draining harvest tubs or you get water chestnut pencils, not disks.
    Running rhizomes need bounded containers—pond liners or stock tanks beat escaped sedge in natural wetlands.
    Gnat clouds mean soggy stale media—refresh water, add aeration, and skim algae mats that breed larvae.
    Rinse corms cold after harvest—any warmth moisture invites mold before kitchen peel.
  growth_habit: Rush-like sedges in shallow water; edible underground corms
