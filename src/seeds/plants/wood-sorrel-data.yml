description: |-
  Wood sorrel is the shamrock-shaped sour nibble that pops up in shade like it pays rent in oxalic acid. Native forms are delicate; some weedy Oxalis cousins are bulldozers—know which crew you invited.

  Native violet wood sorrel behaves like a spring ephemeral in parts of its range; in mild winters it can linger. Do not confuse ornamental purple oxalis pots with local ecology unless you enjoy regret.

  Sun and water: Part shade to dappled shade; moist, woodsy, well-drained soil. Dries back in heat—often just dormancy, not a personal attack.
  ✂️ Propagation:
  Bulblets and self-seeding; divide small clumps when dormant if you must rearrange the furniture.

  🌾 Harvest / Best Use Timing:
  - Snip tender Wood Sorrel growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
  - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
  - Dry herbs in thin layers; deep piles steam themselves into compost.
purpose: |-
  Edible: Oxalis violacea leaves and flowers taste lemon-sour from oxalic acid -- nibble sparingly; kidney-stone-prone eaters should flirt elsewhere.
  Ground Cover: Corm-based clumps emerge after spring rains -- violet-pink flowers open before tree canopy closes.
  Wildlife Attractor: Native bees visit small flowers at low height -- ant-dispersed seeds expand patches where mulch is deep.
companions:
- Ferns
- Wild ginger
- Shade grasses
cautions:
- Livestock-heavy grazing (oxalate concerns at volume)
- Letting invasive oxalis species pose as “the same thing”
pests:
- aphids
- slugs
- spider mites
growth_habit: Low perennial from corms; trifoliate leaves, pink to violet flowers
data_quality_score: 0.75
