  - Ferns
  - Wild ginger
  - Shade grasses
  cautions:
  - Livestock-heavy grazing (oxalate concerns at volume)
  - Letting invasive oxalis species pose as “the same thing”
  pests:
  - aphids
  - slugs
  - spider mites
  practitioner_notes: |-
    Harvest texture changes faster than color—nip one sample before you commit the whole row to a pick date.
    Edge containment beats regret—runners respect metal or deep trench more than promises.
    Sharp tools and clean cuts beat torn stems; disease spores love frayed tissue more than rhetoric.
    Foot traffic after establishment only—early walks tear stems and invite weeds in the wounds.
  growth_habit: Low perennial from corms; trifoliate leaves, pink to violet flowers
