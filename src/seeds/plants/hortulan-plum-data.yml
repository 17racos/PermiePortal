  description: 'Hortulan plum (Prunus hortulana) is a wild or feral-type plum of central North American uplands and stream
    edges, forming small trees or thicket-forming shrubs with white spring flowers and red to yellow dotted fruit reported
    as pleasantly sweet when ripe. Heights often reach 15–20 feet (4.5–6 m). It is a rose-family hedge component for wildlife
    and foragers who tolerate thorns and variability.


    ☀️💧 Sun and Water Requirements:

    Full sun for best flowering and fruit; edge light woodland contexts still fruit with reduced density. Adaptable soils
    if drainage is reasonable; tolerates periodic moisture near streams. Mulch young plants to reduce grass competition at
    the trunk.


    ✂️ Propagation:

    Sow pits after stratification; seedlings vary—graft named selections if you find them. Root suckers can expand thickets—remove
    or transplant if space is finite. Prune in late winter for open structure and reduced disease pressure.


    🌾 Harvest / Best Use Timing:

    Pick fruit when fully colored and slightly soft—taste before bucket commitment. Process quickly for jam or wine; fruit
    can ferment on the ground if ignored. Leave some for wildlife if your pantry ethics allow.'
  purpose: '- Edible: Wild-type plums diversify preserves and small-scale fruit trials where variability is acceptable.

