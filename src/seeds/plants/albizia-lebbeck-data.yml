  description: 'Albizia lebbeck is a fast-growing, heat-loving legume tree with a wide native range across tropical Asia to
    northern Australia. It carries bipinnate, mimosa-like foliage, cream-white powderpuff flowers with a sweet scent, and
    flat woody pods; mature specimens can exceed 15–18 m in open sites with a broad, somewhat irregular crown.


    subtropical and tropical Americas are on-brand habitats in frost-free zones—coastal tropical and subtropical zones and
    most of Puerto Rico suit it if hurricanes and brittle wood are in your risk calculus. Humid summers are normal for the
    species; root drowning is not.


    ☀️💧 Sun and Water Requirements:

    - Full sun for strong growth, flowering, and reliable nodulation.

    - Tolerates a range of soils but insists on drainage; deep watering establishes young trees, then back off to encourage
    deep roots.


    ✂️ Methods to Propagate:

    - Seeds: pour near-boiling water over seeds, soak until swollen, sow warm—classic hard-seeded legume choreography.

    - Seedlings from nursery liners for known provenance if invasive potential is a concern in your county—check local guidance
    before romanticizing fast shade.


    🌾 Harvest / Best Use Timing:

    - For fodder or mulch, coppice or pollard on a planned rotation during the wet season when recovery is fastest.

    - Pods mature brown on the tree; collect before total shatter if you want seed for propagation, not a yard full of volunteers.'
