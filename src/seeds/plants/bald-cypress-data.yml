  description: "Bald cypress (Taxodium distichum) is a deciduous conifer of southeastern
    North American swamps and river bottoms, famous for buttressed trunks, rusty fall
    needles, and knees in flooded soils. It reaches 60–100+ feet (18–30+ m) with a strong
    straight bole when given room, tolerating long seasonal inundation that drowns
    lesser trees. In permaculture it is a cornerstone riparian and rain-garden canopy
    for temperate to subtropical zones, sequestering carbon and stabilizing banks while
    dropping acidic needle mulch.\n\n☀️💧 Sun and Water Requirements:\nFull sun for
    fastest height growth; tolerates wet feet for extended periods and also grows on
    moist uplands once established. Prefers acidic to neutral soils; chlorosis appears
    on high-pH sites without organic mulch or appropriate amendments. Drought on sandy
    uplands works only after deep rooting—irrigate the first several growing seasons.\n\n
    ✂️ Propagation:\nSow fresh seed in moist sand; seedlings transplant easily if kept
    humid. Take hardwood cuttings in late winter with bottom heat for clonal trials.
    Bare-root conservation stock is common in wetland restoration—handle roots gently
    and plant at correct depth.\n\n🌾 Harvest / Best Use Timing:\nTimber-grade harvest
    belongs to long rotations and forest plans, not impulse chainsaw afternoons. For
    landscape systems, value is ongoing: mulch drop, shade, and bank binding. Collect
    fallen needles for acid mulch around blueberries where pH goals align."
  purpose: |-
    - Wildlife Attractor: Cavities and bark texture host insects and birds in mature stands.
    - Erosion Control: Roots and buttresses armor streambanks and pond edges against shear flow.
    - Shade Provider: High canopy cools water and understory in humid climates.
    - Mulcher: Fine needles build acidic litter that suits ericaceous neighbors on appropriate soils.
    - Ornamental: Feathery summer foliage and copper fall color beat lawn monoculture on wet sites.
  companions:
  - Highbush Blueberry — appreciates cypress needle mulch and partial shade from high canopy
  - Elderberry — wet-tolerant shrub layer along margins without matching final tree height
  - Duck Potato — emergent edge species shares riparian aesthetics where water levels fluctuate
  cautions:
