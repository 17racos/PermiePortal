  description: 'The Lime Tree is a small, evergreen tree reaching heights of 4.5 to 6 meters (15 to 20 feet). It has glossy,
    dark green leaves and bears fragrant white flowers, leading to small, green to yellowish-green fruit known for their tart
    flavor. Limes are rich in vitamin C and are utilized in various culinary and medicinal applications. The tree thrives
    in well-drained, slightly acidic soils and requires full sun exposure.


    🌞💧 Sun and Water Requirements:

    Lime Trees require full sun, receiving at least 6 to 8 hours of direct sunlight daily. They prefer consistent moisture
    but are sensitive to waterlogged conditions. Regular watering is essential, especially during dry periods, to maintain
    soil moisture without oversaturation.


    ✂️🫘 Methods to Propagate:

    Propagation is commonly achieved through grafting onto compatible rootstocks to ensure desired fruit characteristics and
    disease resistance. Seed propagation is possible but may not produce true-to-type plants and can result in variable fruit
    quality.


    🧑‍🌾👩‍🌾 When to Harvest:

    Limes can be harvested when they have developed full coloration and are slightly soft to the touch. Depending on the variety
    and climate, this can occur multiple times a year, with some trees bearing fruit year-round.'
