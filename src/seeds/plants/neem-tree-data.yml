  description: "Neem (Azadirachta indica) is a fast-growing broadleaf evergreen tree from South Asia, naturalized across dry tropics and subtropics for deep shade, drought endurance, and bitter chemistry that underpins organic sprays and traditional medicine. Mature specimens often reach 50–70 feet (15–21 m) with a wide, rounded crown and compound leaves that smell sharply when crushed. In warm-climate permaculture it supplies leaf mulch for pest-confusing teas, high shade for understory crops, and biomass for chop-and-drop cycles where neighbors tolerate the scent.\n\n☀️💧 Sun and Water Requirements:\nFull sun for strongest form and heaviest leaf production; tolerates harsh heat once roots are established. Thrives in well-drained soils from sandy to rocky; tolerates seasonal drought but grows faster with deep irrigation in dry seasons. Sensitive to waterlogging; avoid planting in compacted swales without drainage fixes.\n\n✂️ Propagation:\nSow fresh seed promptly; viability declines within weeks in hot climates. Root cuttings and stump coppice in favorable sites for rapid biomass. Prune for clearance along paths and to keep leaf harvest reachable without ladders forever.\n\n🌾 Harvest / Best Use Timing:\nCollect young tender leaves for extracts and mulches during active growth flushes. Seeds yield oil where processing equipment exists—handle only with training. Expect peak leaf chemistry and growth during long days with heat above roughly 70°F (21°C)."
  purpose: |-
    - Medicinal: Leaves and oil enter Ayurvedic and folk protocols—respect legal and medical guidance before dosing humans or animals.
    - Shade Provider: Wide crown cools poultry yards, nurseries, and outdoor work areas in tropical dry seasons.
    - Pest Management: Azadirachtin-rich leaf teas and seed extracts underpin organic IPM when prepared and timed correctly.
    - Biomass: Rapid leaf turnover feeds compost piles and alley-cropping mulch banks in warm climates.
  companions:
  - Moringa — complementary fast biomass tree with different chemistry and leaf texture in a multi-story windbreak
  - Lemongrass — perimeter aromatic grass tolerating heat along the neem dripline without root trenching the tree
  - Pigeon Pea — drought-tolerant understory legume fixing nitrogen outside the deepest shade core
  cautions:
  - Allelopathy and bitter residues—avoid planting delicate salad beds directly in fresh neem mulch without composting first
  - Frost—young trees burn near 32°F (0°C); protect on marginal sites
  pests:
  - Scale Insects
  - Aphids
  - Whiteflies
  practitioner_notes: |-
    Neem oil in the bottle and neem shade in the yard are cousins, not twins—spray recipes follow label math, not vibes.
    Seed viability is a countdown timer in heat—plant fresh or store like you mean it.
    Overhead neem leaf tea on delicate seedlings can stunt—test on a sacrificial row first.
    Wide crowns eat fence lines—prune early if property lines matter to humans more than to roots.
  growth_habit: Fast tropical/subtropical evergreen tree; compound leaves; drought-tolerant; bitter aromatic tissues
