  description: 'Hairawn muhly (Muhlenbergia sericea) is a warm-season bunchgrass of coastal dunes, pine flatwoods, and sandy
    roadsides in the southeastern United States and Caribbean, forming fine-textured clumps with silky inflorescences that
    catch light. Height is often 1–3 feet (0.3–1 m) depending on ecotype and moisture. It suits native coastal gardens, bioswale
    margins, and low-fertility beds where turf would demand a hose and a therapist.


    ☀️💧 Sun and Water Requirements:

    Full sun for best flowering and upright habit; partial shade stretches stems. Well-drained sandy soils are home territory;
    tolerates salt spray and short drought after establishment. Avoid heavy clay unless you amend for drainage like you mean
    it.


    ✂️ Propagation:

    Divide clumps in early spring; keep divisions moist until rooted. Sow seed warm; establishment is faster with weed control
    the first season. Cut back old growth in late winter before new shoots emerge.


    🌾 Harvest / Best Use Timing:

    Ornamental peak aligns with warm-season flowering—plan views and paths accordingly. Leave standing for winter texture
    if you accept a brief messy phase. Collect seed for restoration only from appropriate local ecotypes with permits if required.'
  purpose: |-
    Ornamental: Hairawn Muhly earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Erosion Control: Hairawn Muhly networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Wildlife Attractor: Hairawn Muhly layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Border Plant: Hairawn Muhly tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
