  description: "Chamomile (Matricaria chamomilla and Chamaemelum nobile) is a small herbaceous plant known for its daisy-like\
    \ flowers with yellow centers and white petals. It grows between 15–60 cm (6–24 inches) tall, depending on the variety,\
    \ and emits a sweet, apple-like fragrance.\n\nGerman Chamomile is an annual that self-seeds easily, while Roman Chamomile\
    \ is a low-growing perennial. Both varieties thrive in well-drained, sandy, or loamy soils and tolerate drought conditions\
    \ once established. Chamomile attracts pollinators and beneficial insects while repelling certain pests.\n\n \U0001F31E\
    \U0001F4A7 Sun and Water Requirements:\n- Prefers full sun but tolerates partial shade.\n- Grows best in well-drained,\
    \ light, and sandy soils.\n- Requires moderate watering; drought-tolerant once established.\n\n✂️\U0001FAD8 Methods to\
    \ Propagate:\n- Seeds: Direct sow in early spring; does not require deep planting.\n- Division: Roman Chamomile can be\
    \ divided in spring or fall.\n- Self-seeding: German Chamomile reseeds naturally and returns yearly.\n\n\U0001F9D1‍\U0001F33E\
    \U0001F469‍\U0001F33E When to Harvest:\n- Flowers are harvested when fully open, typically in late spring to early summer.\n\
    - Regular harvesting encourages continuous blooming.\n- Dry flowers in a well-ventilated area for medicinal and culinary\
    \ use."
