    - Well-drained soil; moderate moisture—tolerates short drought once deep-rooted.

    ✂️ Methods to Propagate:
    - Seeds: cold-moist stratify or fall-sow; germinates in cool-warm swings.
    - Soft tip cuttings in spring root under humidity.

    🌾 Harvest notes:
    - Cut flowering stems for bouquets; deadheading prolongs bloom in longer seasons.
