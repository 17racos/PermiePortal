  description: |-
    Blue sage is a tall prairie perennial with spikes of true sky-blue flowers that make monarchs and bees look like they planned the photo shoot. Not as thirsty as lawn culture; not as drought-mean as desert succulents. In subtropical and tropical Americas give it air movement and drainage—powdery mildew shows up to parties when nights stay sticky and leaves never dry.

    ☀️💧 Sun and Water Requirements:
    - Full sun for strong stems; plants flop in shade like they lost the will to stand.
    - Well-drained soil; moderate moisture—tolerates short drought once deep-rooted.

    ✂️ Methods to Propagate:
    - Seeds: cold-moist stratify or fall-sow; germinates in cool-warm swings.
    - Soft tip cuttings in spring root under humidity.

    🌾 Harvest notes:
    - Cut flowering stems for bouquets; deadheading prolongs bloom in longer seasons.
  purpose: |-
    - Pollinator: Late-season nectar when many ornamentals clock out early.
    - Wildlife Attractor: Hummingbirds and long-tongued bees on tubular blooms.
    - Border Plant: Vertical blue accents at the back of sunny beds.
    - Medicinal: Salvia traditions vary widely—do not freestyle medical claims; research seriously if you consume.
  companions:
