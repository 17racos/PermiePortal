  description: "Turkey tail is the rainbow paper fan on dead sticks — thin, flexible
    brackets with concentric zones. It is everywhere there is rotting hardwood, including
    subtropical and tropical Americas's humid woodlands. Not a big edible texture winner (tough), but
    a famous decoction mushroom; quality and adulteration in commerce are their own
    rabbit hole. Ecologically it is a workhorse decomposer prepping carbon for soil
    life.\n\n☀️💧 Sun and Water:\n- Naturally on shaded logs, stumps, and branches.\n-
    Moisture from environment; outdoor cultivation uses inoculated logs like other
    polypores.\n- Good airflow reduces mold competitors on thin brackets.\n\n✂️ Propagation:\n-
    Plug logs or bury inoculated blocks near woody debris pathways.\n- Species ID
    matters — Trametes versicolor has a smooth pore surface when young; verify with
    a key."
  purpose: |-
    Turkey tail hosts are decomposition infrastructure with a tea habit:

    - Medicinal: Long traditional use; modern extracts vary wildly in honesty.
    - Mulcher: Breaks lignin and prepares woody carbon for humus.
    - Soil Improvement: Feeds the belowground network as wood softens.
  companions:
  - Oak
  - Sweetgum
  - Willow
  cautions:
