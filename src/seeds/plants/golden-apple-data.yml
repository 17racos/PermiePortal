  description: 'Golden apple (Spondias dulcis), commonly called ambarella or June plum in many markets, is a fast-growing
    tropical tree from Melanesia through Southeast Asia, now widely planted in the humid tropics and subtropics for crisp-tart
    fruit used green in pickles and ripe in juices. Trees often reach 30–50 feet (9–15 m) unless coppiced or kept in containers.
    It fills the hungry gap between mangos with a fruit that doubles as vegetable when immature.


    ☀️💧 Sun and Water Requirements:

    Full sun for best fruiting; partial shade acceptable for juvenile establishment. Deep, fertile, well-drained soils with
    steady moisture in the warm season; reduce watering when growth slows in cooler months. Shelter from desiccating wind
    on dry-season margins.


    ✂️ Propagation:

    Sow fresh seed; polyembryonic seedlings can yield variable fruit—graft known cultivars for quality control. Air-layering
    and grafting are common in commercial propagation. Tip-prune young trees to encourage low branching for harvest reach.


    🌾 Harvest / Best Use Timing:

    Pick green fruit for crunchy salads and pickles; allow yellowing for sweeter fresh eating and juice. Expect heavy fruit
    drop—site pathways outside the splat zone. Net or bag if fruit flies audit your neighborhood.'
  purpose: '- Edible: Green and ripe stages diversify kitchen use from savory to sweet without planting a second species.

    - Shade Provider: Broad canopy shelters understory in humid tropical food forests.

    - Wildlife Attractor: Flowers and fruit engage birds and insects where that aligns with management goals.

    - Windbreaker: Flexible branching helps blunt steady trade winds on exposed lots.'
  companions:
  - Banana — quick biomass and partial shade during early years before ambarella canopy expands
  - Papaya — fast fruiting neighbor that uses vertical space differently at the row edge
  - Lemongrass — herbaceous perimeter that marks irrigation and harvest lanes
  cautions:
  - Related to mango and cashew family chemistry — sensitive individuals should research sap and fruit handling
  - Frost — young trees burn below roughly 28°F (-2°C); protect or containerize on margins
  pests:
  - Caribbean Fruit Fly
  - Mango Seed Weevil
  - Scale Insects
  practitioner_notes: 'Fruit flies treat golden apple like a festival—sanitize drops and harvest on schedule.

