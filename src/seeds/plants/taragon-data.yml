  description: "Tarragon is a bushy, aromatic perennial herb reaching heights of 60–120
    cm. It has narrow, slightly hairy, lanceolate leaves that are green and pointed.
    The plant produces small yellow-green flower buds in panicles from May to June.
    Tarragon is prized for its distinctive anise-like flavor and is commonly used
    in French cuisine to enhance dishes like chicken, fish, and eggs. French tarragon
    (Artemisia dracunculus var. sativa) is the preferred culinary variety, known for
    its superior flavor but is typically sterile and does not produce viable seeds.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nPrefers full sun to partial shade and thrives in
    well-drained soil. It is drought-tolerant once established but benefits from regular
    watering during prolonged dry periods.\n\n✂️\U0001FAD8 Methods to Propagate:\nFrench
    tarragon is propagated through root division or stem cuttings, as it rarely produces
    viable seeds. Divide plants in spring or take cuttings in late spring to early
    summer.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nHarvest
    leaves as needed during the growing season, ideally before the plant flowers for
    the best flavor. Regular harvesting encourages bushier growth."
  purpose: |-
    - **Edible**: Enhances flavor in various dishes, especially in French cuisine.
    - **Medicinal**: Traditionally used to stimulate appetite and alleviate digestive issues.
