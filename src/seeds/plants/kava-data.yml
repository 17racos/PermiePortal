description: |-
  Kava is a sterile Pacific Islands shrub grown from cuttings for roots that become the famous earthy beverage — not a party drug from a gas station. Legality and quality control vary; some jurisdictions side-eye extracts. Humid heat lover; subtropical and tropical Americas is marginal outside frost-free microclimates or greenhouse wintering. Needs shade, moisture, and patience — harvest on multi-year cycles traditionally.

  Understory part shade to dappled light; full sun burns leaves. Consistent moisture, high humidity; mulch and wind protection help.

  Stem cuttings in moist mix; seeds essentially do not exist in crop clones.

  Respect local laws and your liver; permaculture includes adult decision-making.

  Harvest lateral roots after documented years in ground -- traditional timing is measured in seasons, not influencer weeks. Dry roots slowly with airflow; powder when fully brittle and store labeled. Respect local law and cultural sourcing ethics; this is not a stealth backyard pharma plot.
purpose: |-
  Medicinal: Piper methysticum lateral roots yield kavalactones for traditional Pacific beverages that ease social nerves -- legality and liver risk vary by extract type, so research local law before backyard processing scales up.
  Ground Cover: Sterile clones spread by cuttings into broad-leafed mats under banana shade -- keeps soil cool and weed pressure low in humid understory guilds if snails stay under control.
  Mulcher: Large heart-shaped leaves and soft stems compost fast in tropical piles -- chop prunings green so they break down with banana trash instead of drying into thatch.
