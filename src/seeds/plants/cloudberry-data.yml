  description: "Cloudberry (Rubus chamaemorus) is a circumboreal rhizomatous bramble of sphagnum bogs, fens, and wet tundra\
    \ edges, producing single white flowers on dioecious or functionally dioecious plants and amber to red aggregate fruit\
    \ prized where jams and sauces tradition still exists. Leaves are crinkled and maple-like; height is low, usually under\
    \ 12 inches (30 cm) excluding flower stalks. In cool, acidic, high-water-table sites it is a delicacy crop and wildlife\
    \ food—not a row-crop berry for hot, dry backyards without serious habitat mimicry.\n\n☀️\U0001F4A7 Sun and Water Requirements:\n\
    Full sun in boreal climates; partial shade where heat spikes occur at the southern edge of range. Requires consistently\
    \ moist, acidic organic soils resembling bog conditions; drainage must still allow oxygen between waterings in constructed\
    \ beds. Warm, dry summers stress plants; afternoon shade and mulch help marginally hardy plantings.\n\n✂️ Propagation:\n\
    Divide rhizomes in early spring with buds attached; keep both sexes if fruit is the goal. Sow seed after cold stratification\
    \ for breeding—seedlings take years to fruit. Peat-sand beds with steady moisture mimic natural rooting zones better than\
    \ average garden loam.\n\n\U0001F33E Harvest / Best Use Timing:\n Pick berries when color fully shifts toward amber-orange\
    \ and they detach willingly; flavor is tart-apricot. Process quickly into jam or freeze; fresh shelf life is short. Leave\
    \ a percentage for wildlife where harvest ethics include rent payment."
