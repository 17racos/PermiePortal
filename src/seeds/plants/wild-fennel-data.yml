  description: "Wild fennel is fennel that stopped asking permission — perennial
    crowns in mild climates, anise perfume, yellow umbels that swallow swallowtails.
    Pollen, seeds, and young shoots enter kitchens; older stems get woody. It is
    listed invasive in parts of the world; in Florida and Puerto Rico manage spread if you
    plant the fertile type, or use bulbing selections where you need manners.\n\n
    Sun and drainage make the difference between lush and sulky. It pairs with
    Mediterranean herbs but keep it away from dill if you are saving either for seed
    — cross-pollination makes boring offspring.\n\n☀️💧 Sun and Water:\n- Full sun.\n-
    Well-drained average to poor soil; over-fertilized fluff attracts aphids.\n-
    Drought-tolerant once established; water young plants.\n\n✂️ Propagation:\n-
    Seed (fresh is best).\n- Division of crowns in cool weather."
  purpose: |-
    Wild fennel is insectary aromatics with attitude:

    - Edible: Seeds, pollen, tender growth; classic fish and sausage pairing.
    - Medicinal: Carminative tradition for digestive complaints.
    - Pollinator: Non-stop insect traffic in bloom.
    - Wildlife Attractor: Swallowtail host plant — plant extra for caterpillars.
    - Border Plant: Tall, feathery screens and backdrops.
    - Dynamic Accumulator: Deep roots + copious leaf drop.
  companions:
