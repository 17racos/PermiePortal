  description: "Sand blackberry (Rubus cuneifolius) is a thorny deciduous bramble
    native to sandy pinelands and scrub in the southeastern United States. Narrow
    leaves and fierce prickles defend small dark berries that reward birds and patient
    humans. It is a native barrier plant for sunny edges where blackberries are wanted
    but wetland species would sulk.\n\n☀️💧 Sun and Water Requirements:\n- Full
    sun for best flowering and fruit; shade reduces yield.\n- Drought tolerant once
    established in deep sand; irrigate young plants through first dry season.\n-
    Sandy, well-drained acidic soils; tolerates poor fertility typical of scrub.\n\n✂️
    Propagation:\n- Root cuttings in winter; tip layering in early summer.\n- Seeds
    need scarification and stratification—slow compared to vegetative methods.\n-
    Remove old canes after fruiting to renew growth like other brambles.\n\n🌾 Harvest
    / Best Use Timing:\n- Pick berries when glossy black and release with a gentle
    tug; flavor is tart.\n- Wear gauntlets—thorns are not negotiable.\n- Leave some
    fruit for wildlife and seeding if managing a thicket for habitat."
  purpose: |-
    - Edible: Berries are eaten fresh, cooked, or preserved like other blackberries.
    - Wildlife Attractor: Fruit feeds birds and mammals; flowers feed pollinators.
    - Border Plant: Thorny canes create livestock and pedestrian barriers without plastic.
    - Erosion Control: Rhizomes and roots stabilize sandy banks and disturbed scrub.
  companions:
