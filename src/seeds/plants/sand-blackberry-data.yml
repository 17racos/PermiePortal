description: |-
  Sand blackberry (Rubus cuneifolius) is a thorny deciduous bramble native to sandy pinelands and scrub in the southeastern United States. Narrow leaves and fierce prickles defend small dark berries that reward birds and patient humans. It is a native barrier plant for sunny edges where blackberries are wanted but wetland species would sulk.

  ☀️💧 Sun and Water Requirements:
  - Full sun for best flowering and fruit; shade reduces yield.
  - Drought tolerant once established in deep sand; irrigate young plants through first dry season.
  - Sandy, well-drained acidic soils; tolerates poor fertility typical of scrub.

  ✂️ Propagation:
  - Root cuttings in winter; tip layering in early summer.
  - Seeds need scarification and stratification—slow compared to vegetative methods.
  - Remove old canes after fruiting to renew growth like other brambles.

  🌾 Harvest / Best Use Timing:
  - Pick berries when glossy black and release with a gentle tug; flavor is tart.
  - Wear gauntlets—thorns are not negotiable.
  - Leave some fruit for wildlife and seeding if managing a thicket for habitat.
purpose: |-
  Edible: Rubus cuneifolius yields small glossy black drupes with tart punch for jam after you beat the birds to ripe clusters on narrow-leaf scrub canes.
  Wildlife Attractor: White rosaceous blossoms feed native bees ahead of summer fruit that feeds scrub jays and mammals moving through pine sandhills.
  Border Plant: Dense ankle- to chest-high thickets armed with fierce prickles slow livestock and casual foot traffic along scrub roadsides.
  Erosion Control: Rhizomatous roots grab deep sand on banks and disturbed cuts where lighter soils would slide after hard rain.
companions:
- Sand Live Oak — evergreen oak canopy over bramble understory on coastal ridges
- Myrtle Oak — scrub oak neighbor sharing sand and sun ecology
- Southern Dewberry — lower trailing Rubus layer for staggered fruiting times
