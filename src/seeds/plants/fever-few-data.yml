  description: 'Feverfew is the bitter daisy your herbalist cousin mentions when migraines show up. Science on parthenolide
    is messy; tradition is loud. It self-sows like it pays rent in seeds — deadhead if you dislike chaos. In subtropical and
    tropical Americas it grows as a short-lived perennial or enthusiastic biennial depending on summer cruelty; afternoon
    shade reduces melt.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light afternoon shade in hot humid summers.

    - Average, well-drained garden soil; tolerates lean conditions once established.

    - Moderate water; soggy winter crowns rot quietly.


    ✂️ Methods to Propagate:

    - Seeds: sow on surface; light for germination.

    - Division: split crowns in spring or fall for clones with known chemistry (still variable).'
  purpose: 'Feverfew is insectary + medicine-cabinet folklore:


