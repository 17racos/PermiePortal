description: |-
  This is not one species — it is the vertical layer in a food forest. Vines turn fence lines, trellises, and young trees (carefully) into production space: passionfruit, grapes, yams, beans, and gourds all climb somewhere. subtropical and tropical Americas gets brutal sun and sudden downpours, so trellis engineering matters as much as the plant list.

  Match each vine: fruiting passionfruit wants sun; some yams tolerate shade. Heavy feeders need fertile soil and mulch; drought-tough natives need less fuss. Never let a woody vine girdle a support tree — manage or regret.

  Species-dependent: seeds, tubers, hardwood cuttings, layering. Install trellis first; scrambling chaos without structure is how sheds learn to fly.

   PermieBro voice: if it is only ornamental ivy, you skipped lunch money on the vertical real estate.

  Fruiting vines: pick on flavor markers for each species -- color lies more often than smell. Leaf and shoot vines: harvest tips during active growth; pause hard cuts during extreme heat or drought stress. Mulch vines after major pruning so roots stay cool while new laterals form.
purpose: |-
  Shade Provider: Passionfruit, chayote, and yam foliage laminate vertical trellis space -- afternoon shade for west walls without waiting decades for a tree crown.
  Edible: Layer picks grapes for fresh fruit, Dioscorea for tubers, Phaseolus for dry beans -- match species to frost window and support load before romantic arches.
  Wildlife Attractor: Bird-planted smilax and coral honeysuckle berries feed migrants -- native vines beat English ivy for actual calories in hedgerows.
  Pollinator: Large cucurbit and passiflora blossoms open dawn-ready for specialist bees -- night-flowering yams shift the shift for sphinx moths where included.
  Erosion Control: Wisteria-class roots and kudzu-grade cover armor cut banks only when you contain spread -- otherwise you traded erosion for invasion paperwork.
