    forest. Vines turn fence lines, trellises, and young trees (carefully) into
    production space: passionfruit, grapes, yams, beans, and gourds all climb
    somewhere. North Florida gets brutal sun and sudden downpours, so trellis
    engineering matters as much as the plant list.\n\n☀️💧 Sun and Water:\n- Match
    each vine: fruiting passionfruit wants sun; some yams tolerate shade.\n- Heavy
    feeders need fertile soil and mulch; drought-tough natives need less fuss.\n-
    Never let a woody vine girdle a support tree — manage or regret.\n\n✂️ Propagation:\n-
    Species-dependent: seeds, tubers, hardwood cuttings, layering.\n- Install
    trellis first; scrambling chaos without structure is how sheds learn to fly.\n\n
