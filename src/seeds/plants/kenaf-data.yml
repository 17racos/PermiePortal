  description: "Kenaf is a monster malvaceous annual that grows like it is trying to outrun climate guilt. Tall stems, big\
    \ palmate leaves, and bast fiber historically used like jute. In subtropical and tropical Americas treat it as a warm-season\
    \ biomass crop: long day heat, fertile soil, and irrigation through dry spells stack tonnage. It is not a subtle backyard\
    \ accent unless your backyard is measured in acres.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun.\n\
    - Rich, well-drained soil with steady moisture during explosive growth.\n- Heavy feeders — compost and mulch are cheaper\
    \ than regret.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Direct sow after soil is warm.\n- Start indoors in short seasons\
    \ to gain height.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- For fiber: harvest at early bloom\
    \ before stems lignify too hard.\n- For forage/biomass: cut earlier for quality, later for volume."
  purpose: |-
    Fiber: Hibiscus cannabinus stems yield long bast fibers for rope and paper pulp -- harvest near early bloom before stems lignify into hemp-like stiffness that hates hand processing.
    Cover Crop: Dense stands close canopy in six-week heat, smothering pigweed and morning glory -- plan termination before seed rain unless volunteer kenaf next year sounds fun.
    Animal Fodder: Young leaves approach 20 percent crude protein acceptable to cattle as minority forage -- wilt slightly to reduce mucilage gag and avoid pure kenaf diets that unbalance rumen microbes.
    Green Manure: Eight-foot stalks chop into massive green manure when disked before frost -- balance with brown carbon because wet kenaf slime can go anaerobic in unturned piles.
  companions:
  - Pigeon Pea
  - Sunflower
  - Buckwheat
  cautions:
  - Cold wet soil at sowing — seeds rot, dreams die
  pests:
  - Aphids
  - Banded Winged Whitefly
  - Cocoa Pod Borer
  - Japanese Beetles
  - Whiteflies
  practitioner_notes: 'Fiber quality wants dense stands—wide spacing makes woody stems, not ribbon bark.

    Days-to-flower sets height—short-season types exist; check label before midsummer sowing.

    Chop before hard frost if using green biomass—frozen stalks pulp poorly.'
