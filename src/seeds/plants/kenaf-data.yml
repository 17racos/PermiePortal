  description: "Kenaf is a monster malvaceous annual that grows like it is trying to outrun climate guilt. Tall stems, big\
    \ palmate leaves, and bast fiber historically used like jute. In subtropical and tropical Americas treat it as a warm-season\
    \ biomass crop: long day heat, fertile soil, and irrigation through dry spells stack tonnage. It is not a subtle backyard\
    \ accent unless your backyard is measured in acres.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun.\n\
    - Rich, well-drained soil with steady moisture during explosive growth.\n- Heavy feeders — compost and mulch are cheaper\
    \ than regret.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Direct sow after soil is warm.\n- Start indoors in short seasons\
    \ to gain height.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n- For fiber: harvest at early bloom\
    \ before stems lignify too hard.\n- For forage/biomass: cut earlier for quality, later for volume."
  purpose: |-
    Fiber: Fiber harvests stay honest about processing labor: Tall stems, big palmate leaves, and bast fiber historically used like jute. -- supplies harvestable fiber for cordage, crafts, or mulch substitutes where woody biomass is scarce
    Cover Crop: Kenaf fills gaps between cash crops with living roots that intercept leaching and keep aggregates from collapsing -- fits tight rotations between main crops to protect soil structure and capture leaked nutrients
    Animal Fodder: Kenaf offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Green Manure: Kenaf terminates on schedule into soil-covering green manure that feeds microbes before the next crop occupies the row -- terminates into soil-covering residue that feeds biology before the next cash crop moves in

