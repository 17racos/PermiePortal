  description: "Kenaf is a monster malvaceous annual that grows like it is trying
    to outrun climate guilt. Tall stems, big palmate leaves, and bast fiber historically
    used like jute. In Florida and Puerto Rico treat it as a warm-season biomass crop: long day
    heat, fertile soil, and irrigation through dry spells stack tonnage. It is not
    a subtle backyard accent unless your backyard is measured in acres.\n\n \U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Full sun.\n- Rich, well-drained soil with steady
    moisture during explosive growth.\n- Heavy feeders — compost and mulch are cheaper
    than regret.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Direct sow after soil is
    warm.\n- Start indoors in short seasons to gain height.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- For fiber: harvest at early bloom before stems lignify too
    hard.\n- For forage/biomass: cut earlier for quality, later for volume."
  purpose: |-
    Kenaf is industrial biomass you can grow without pretending it is subtle:

    - Fiber: Bast fiber for cordage, paper pulp experiments, and mulch strips.
    - Cover Crop: Rapid canopy smothers weeds when managed.
    - Animal Fodder: Young growth can feed livestock contexts where appropriate.
    - Green Manure: Chop and drop or compost huge tonnage.
