  description: |-
    Marsh pennywort (Hydrocotyle umbellata) is a low, creeping wetland plant with round, peltate leaves like green coins and delicate umbels of tiny flowers. Stolons root at nodes, matting pond margins, ditches, and the wet shoulders of swales; in deep water it can form floating rafts. It is smaller and more herbaceous than the infamous giant floating pennywort (different species, worse manners).

    Florida and Puerto Rico: Common in subtropical and tropical wet habitats; useful for wildlife ponds, rain gardens, and constructed wetlands where you want living green pavement instead of algae sermons.

    ☀️💧 Sun and Water Requirements:
    - Full sun to part shade; intense tropical sun may yellow leaves if water fluctuates wildly—some midday shade helps.
    - Saturated soil to shallow standing water; tolerates periodic drawdown but not prolonged desert cosplay.

    ✂️ Propagation:
    - Divide mats anytime in warm weather; anchor sections with a stone until roots grab.
    - Stolons: pin a runner to wet soil or submerged gravel; sever from parent once anchored.

    🌾 Harvest / Best Use Timing:
    - Some cultures use related Hydrocotyle as a potherb; confirm ID and local toxicity guidance before nibbling—this database is not your stomach’s lawyer.
    - For habitat use, trim rampant edges in wet season to guide spread and toss excess into compost or mulch berms while still fresh.
  purpose: |-
    - Ground Cover: Living mesh that knits bare mud, reducing erosion when rains hammer your swale.
    - Aquatic: Tolerates inundation, making it a transition species between open water and upland plants.
    - Wildlife Attractor: Cover for small amphibians and invertebrates; flowers feed minute pollinators often ignored in big-flower propaganda.
    - Edible: Where culturally appropriate and safely identified, tender growth can enter the human calorie stream—verify with local references first.
  companions:
  - Cattail — vertical structure and deep rhizosphere contrast with pennywort’s carpet; together they clarify “deep water vs. splash zone” in a pond guild.
  - Pickerelweed — emergent spikes and showy flowers stack height classes for pollinators while pennywort seals the mud gap at the toe of the slope.
  - Duckweed — floating layer + creeping layer = two niches of nutrient uptake and shade that calm algae’s main-character syndrome.
  avoid:
