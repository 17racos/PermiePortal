  description: "This is the Caribbean kitchen's answer to cilantro that does not
    faint in heat — saw-toothed rosettes and bold flavor, sometimes sold as culantro
    or recao. It is a staple in subtropical and tropical Americas subtropical plots where true cilantro
    bolts before you find the salsa bowl. Flavor is stronger and more resinous than
    Coriandrum; chop fine for sofrito, beans, and marinades. Flowers are understated
    but pull small beneficials; it reseeds freely in mulch.\n\n☀️💧 Sun and Water:\n-
    Part sun to light shade in peak summer; morning sun + afternoon relief reduces
    tip burn.\n- Steady moisture; stress invites thrips and ugly foliage.\n- Loose,
    compost-rich soil; tolerates humidity better than desert herbs.\n\n✂️ Propagation:\n-
    Seed: needs fresh seed and warmth; germination can be slow.\n- Volunteer seedlings:
    let one plant finish if you want free replacements."
  purpose: |-
    Wild coriander is the humid South's cilantro workaround:

    - Edible: Leaf is the main crop; classic in Latin Caribbean and Southeast Asian
      cooking.
    - Medicinal: Traditional uses vary by culture; not a substitute for real care.
    - Pollinator: Small flowers still feed tiny insects in the understory.
    - Border Plant: Low rosettes edge paths and shade beds without looking precious.
  companions:
