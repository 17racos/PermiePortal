  description: 'This is the Caribbean kitchen''s answer to cilantro that does not faint in heat — saw-toothed rosettes and
    bold flavor, sometimes sold as culantro or recao. It is a staple in subtropical and tropical Americas subtropical plots
    where true cilantro bolts before you find the salsa bowl. Flavor is stronger and more resinous than Coriandrum; chop fine
    for sofrito, beans, and marinades. Flowers are understated but pull small beneficials; it reseeds freely in mulch.


    ☀️💧 Sun and Water:

    - Part sun to light shade in peak summer; morning sun + afternoon relief reduces tip burn.

    - Steady moisture; stress invites thrips and ugly foliage.

    - Loose, compost-rich soil; tolerates humidity better than desert herbs.


    ✂️ Propagation:

    - Seed: needs fresh seed and warmth; germination can be slow.

    - Volunteer seedlings: let one plant finish if you want free replacements.'
