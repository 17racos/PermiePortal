  description: 'Woodland sunflower (Helianthus divaricatus) is a rhizomatous perennial sunflower of dry to mesic woodland
    edges, openings, and savannas in eastern North America. Slender stems carry bright yellow sunflowers in mid to late summer;
    leaves are rough and often sessile. It spreads into sunny drifts without demanding swamp soils, filling a gap between
    prairie sunflowers and deep-shade forbs.


    ☀️💧 Sun and Water Requirements:

    Full sun to bright part shade; more shade reduces flowering and encourages taller reach. Average moisture suits it; tolerates
    dry shade once established better than many Helianthus. Avoid standing water unless slope drains; rhizomes rot in anaerobic
    muck.


    ✂️ Propagation:

    Divide rhizomes in early spring or late fall; replant pieces with buds. Sow seed after cold stratification; germination
    in warm soil. Cut back dead stems in late winter for tidy gardens or leave standing for overwintering insects.


    🌾 Harvest / Best Use Timing:

    Cut flowers for bouquets when petals fully open; stems may need support in rich soil. Leave seedheads for finches if you
    are not collecting. Chop fallen stems for mulch after frost where expansion is welcome.'
