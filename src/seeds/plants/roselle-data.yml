  description: |-
    Roselle is hibiscus that files taxes as a vegetable: tart calyces for tea and jam, edible leaves if you are not boring, and a clock that screams annual once frost finds subtropical and tropical Americas. Plant after soil warms — cool roots make a sulk factory.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for thick stems and heavy calyx production.
    - Even moisture; drought shrinks calyx size and your winter pantry dreams.
    - Well-drained fertile soil; responds to compost without corporate fertilizer poetry.
    
    ✂️ Methods to Propagate:
    - Seeds: direct sow warm soil or start indoors 4–6 weeks before last frost.
    - Cuttings: take semi-hardwood in warm months — roots with humidity, not hope alone.
    
    🌾 Harvest / Best Use Timing:
    - Roselle: pick peak flavor when fruits soften slightly and detach easily -- birds are a parallel calendar.
    - Harvest after dew dries to reduce mold in baskets.
    - Jam batches same day if humidity is high; acid and sugar balance matter more than Instagram gloss.
