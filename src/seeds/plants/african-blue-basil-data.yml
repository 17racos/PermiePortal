description: |-
  African blue basil is the sterile hybrid that flowers until the bees need traffic control—camphor-clove scent, purple stems, and none of that bolt-to-seed anxiety because the plant is mostly living in the perpetual bloom timeline. Tender perennial; often overwinters in 9b with mulch and dry spells; pots come indoors when polar nonsense threatens.

  Full sun for dense color; afternoon shade inland reduces leaf scorch.
  Even moisture; good drainage.

  Cuttings—seeds are not the plan on sterile types. Share with neighbors like a bee lobbyist.

  Pick leaves for kitchen use anytime growth is vigorous; shear or pinch flowering stems if you want to push fresh foliage over endless bloom.
purpose: |-
  Edible: Ocimum basilicum × O. kilimandscharicum leaves carry a camphor-clove oil punch suited to bold pestos and herb syrups -- taste a leaf before batching because the profile overpowers sweet Genovese recipes without warning.
  Pollinator: Sterile hybrids keep pushing lavender flower spikes for months so bees, syrphids, and small butterflies return to the same plant instead of hunting scattered annual basil bolts.
  Pest Management: Volatile-rich foliage slots into aromatic edge strips beside solanums where growers report fewer settling aphids -- results track site humidity and spray history, not Instagram certainty.
  Ornamental: Purple stems and stacked blooms read as designed landscape filler in subtropical yards while still paying pollinator rent through heat that collapses common sweet basil.
