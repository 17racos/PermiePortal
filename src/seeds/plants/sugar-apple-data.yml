description: |-
  Sugar apple is the lumpy green custard bomb of the annona clan — sweeter and more segmented than its relatives, with a perfume that follows you indoors. Small tree, often semi-deciduous in cool snaps. subtropical and tropical Americas: coastal 10a/b only for in-ground success; inland trials need frost fabric, microclimate, and low expectations.

  Full sun once established; young trees benefit from partial shade. Regular deep watering in dry spells; hates waterlogging — mound in heavy soils.

  Seeds variable; grafting and air-layering used for known cultivars. Prune for structure and airflow; dense twiggy growth invites fungal leaf drama.

  Fruit splits when overripe; ants approve.

  Sugar Apple: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both. Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer. Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Annona squamosa creamy white pulp segments pull free from green scaly rinds when fully soft -- spit shiny black seeds because acetogenins hit hard if you chew them.
  Wildlife Attractor: Nitidulid beetles pollinate pendant flowers at dusk -- while squirrels and fruit bats raid any cluster you neglect to bag in the humid lowlands.
  Shade Provider: Open irregular crown throws dappled shade on understory cacao and ginger -- without the deep darkness of mango.
  Ornamental: Bumpy syncarp globes hang like lattice lanterns along grey branches -- for designers who stage tropical courtyards.
