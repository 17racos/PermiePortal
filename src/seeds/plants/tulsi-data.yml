  description: "Tulsi is the basil Hindu kitchens and Ayurvedic shelves agree on—clove-pepper
    aroma, fuzzy stems, terminal flower spikes the bees treat like a buffet. Several
    forms exist (Rama, Krishna, Kapoor types); all want heat and sun.\n\nPerennial in frost-free pockets;
    everywhere else grow as a warm-season annual or overwinter cuttings on a windowsill
    like a civilized mammal.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun, well-drained fertile soil.
    Consistent moisture; do not drown crowns.\n\n✂️ Propagation:\n\nSeed in warm soil; softwood
    cuttings root fast in summer; tip pinching delays bloom and stretches leaf harvest.\n\n🌾 Harvest / Best Use Timing:\n\nHarvest leafy tops for tea and kitchen use before heavy flowering unless seed is the goal."
