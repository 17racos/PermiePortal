  description: "Tulsi is the basil Hindu kitchens and Ayurvedic shelves agree on—clove-pepper
    aroma, fuzzy stems, terminal flower spikes the bees treat like a buffet. Several
    forms exist (Rama, Krishna, Kapoor types); all want heat and sun like they are billing
    it to Florida.\n\nsubtropical and tropical Americas / subtropical: Perennial in frost-free pockets;
    everywhere else grow as a warm-season annual or overwinter cuttings on a windowsill
    like a civilized mammal.\n\nSun and water: Full sun, well-drained fertile soil.
    Consistent moisture; do not drown crowns.\n\nPropagation: Seed in warm soil; softwood
    cuttings root fast in summer; tip pinching delays bloom and stretches leaf harvest."
