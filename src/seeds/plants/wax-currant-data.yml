  description: "Wax currant (Ribes cereum) is a deciduous shrub of western North
    American foothills, canyons, and open coniferous woods, forming arching stems
    with lobed leaves and dangling clusters of tubular pink to white flowers followed
    by waxy, often palatable berries. It fruits in dry, cold-winter climates where
    many Ribes prefer more moisture, making it useful for xeric hedgerows and mountain
    food forests.\n\n☀️💧 Sun and Water Requirements:\nFull sun to bright part shade;
    more sun in cool high elevations, more afternoon shade in hot low valleys. Drought-tolerant
    relative to other currants once established; prefers well-drained rocky or sandy
    loams. Avoid soggy heavy clay unless bermed.\n\n✂️ Propagation:\nSow cleaned seed
    after cold stratification; germination can be slow. Hardwood cuttings in late
    fall or dormant season. Layer low branches to start clumps on slopes.\n\n🌾 Harvest
    / Best Use Timing:\nPick berries when fully colored and slightly soft; flavor
    varies by population from insipid to tart-sweet. Use fresh, cook into jams, or
    dry like small raisins. Prune old canes after several years to renew fruiting wood."
