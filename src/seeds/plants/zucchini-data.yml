  description: |-
    Zucchini (Cucurbita pepo) is a warm-season summer squash grown for tender, fast-harvest fruits picked before seeds get fully hard. It is native to the Americas and is widely cultivated across temperate and warm climates for quick edible returns throughout summer. Plants typically grow as bushy or semi-vining forms reaching about 60–120 cm (2–4 ft) tall depending on variety, with large leaves that spread shade across the bed. In permaculture, zucchini matters because it produces reliable edible biomass quickly and its flowers help keep pollinator activity strong while the canopy shades soil and reduces evaporation.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for strong flowering and consistent fruit set; partial shade reduces yield.
    - Water consistently while plants grow; drought makes fruit smaller and more bitter.
    - Prefers fertile, well-drained soil enriched with compost.
    - Avoid waterlogged areas; soggy soil increases rot and disease.
    
    ✂️ Propagation:
    - Seeds (direct sow): sow after soil warms; germination often occurs in 5–10 days.
    - Start indoors: transplant after warm conditions are stable if your season is short.
    - Succession sow: small repeated plantings keep harvest going longer.
    
    🌾 Harvest / Best Use Timing:
    - Harvest fruits young and tender; pick frequently (often every 1–3 days in peak season).
    - Cut fruit with a short stem to avoid damaging vines.
    - Cook or preserve: sauté, roast, grill; store short-term in the fridge or freeze sliced pieces.
