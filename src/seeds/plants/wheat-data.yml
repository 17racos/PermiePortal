  description: |-
    Wheat (Triticum aestivum) is a cool-season cereal grown for edible grain and sturdy straw. Native to the Fertile Crescent, it has spread worldwide and adapts to many temperate climates, especially where winter conditions support reliable tillering. Plants typically reach 60–120 cm (24–47 in) tall, forming upright stalks and heads that mature into grain. In permaculture, wheat matters because it provides stored calories plus a bulky residue that can become mulch, animal fodder, and compost inputs, while its dense cover reduces erosion during winter transitions.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for the best grain fill; partial shade reduces yield.
    - Water for establishment and early growth; taper moisture as plants mature.
    - Prefers well-drained loam with compost and organic matter.
    - Avoid waterlogged ground which increases root stress and disease.
    
    ✂️ Propagation:
    - Seeds (fall sow): direct-sow in autumn for overwintering cover and spring grain development.
    - Seeds (spring sow): work where winters are too harsh; expect shorter stands.
    - Optional: sow thick if your goal is biomass/mulch, thin for grain.
    
    🌾 Harvest / Best Use Timing:
    - Grain harvest when heads are mature and kernels are dry and hard.
    - Straw/mulch: cut after grain harvest or when straw is at usable stage; cure for storage if needed.
    - Green fodder: cut earlier for fresh feed-style biomass if your system supports it.
  purpose: |-
    Edible: Wheat (Triticum aestivum) in the edible role draws on field reality: Wheat (Triticum aestivum) is a cool-season cereal grown for edible grain and sturdy straw. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Animal Fodder: Wheat offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
    Erosion Control: Erosion control needs roots that grip: In permaculture, wheat matters because it provides stored calories plus a bulky residue that can become mulch, animal fodder, and compost inputs, while its dense cover reduces erosion during winter transitions. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains

  companions:
  - Crimson Clover (Trifolium incarnatum) — legume partner that adds nitrogen and boosts cover-crop performance.
  - Garlic (Allium sativum) — rotation partner that helps diversify plant scents and reduce continuous host pressure.
  - Comfrey (Symphytum officinale) — supports soil fertility with chop-and-drop, improving wheat growth when placed nearby.
  cautions:
  - Rotate away from other cereals if possible; continuous cereal growth increases pest/disease carryover.
  practitioner_notes: |-
    Sow at the right density for your goal: thick for mulch, thin for grain.
    Don’t harvest too early—shriveled kernels are a “patience pays” lesson.
    Keep weeds down early; wheat seedlings lose to competition.
