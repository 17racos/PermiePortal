  description: "Highbush cranberry (Viburnum opulus var. americanum), often still called Viburnum trilobum in older references, is a deciduous North American shrub of moist woods, lake edges, and cool temperate climates, bearing maple-like leaves, flat white flower clusters, and bright red sour fruit. Height commonly reaches 8–12 feet (2.4–3.6 m). It is a classic edible hedge for cold regions where true cranberries need peat and you prefer upright fruit at picking height.\n\n☀️💧 Sun and Water Requirements:\nFull sun to light shade; more sun improves flowering and fruit if soil moisture holds. Rich, moist, well-drained soils mirror natural sites; tolerates seasonal wet feet better than desert shrubs. Mulch roots to buffer summer heat on marginally cool sites.\n\n✂️ Propagation:\nSow seed after warm-cold stratification; germination is slow. Softwood cuttings under mist can clone known selections. Prune after fruiting to open interior for light—dense twig mats invite viburnum beetles to party.\n\n🌾 Harvest / Best Use Timing:\nPick berries after full color for sauces and jellies—flavor is tart, not candy. Leave some fruit for birds if diplomacy matters. Flowers are showy in late spring—avoid spraying during pollinator activity."
  purpose: |-
    - Edible: Fruit processes like tart cranberries for sauces and preserves with honest sugar.
    - Wildlife Attractor: Flowers and berries support insects and birds through the season.
    - Ornamental: Lacecap-like blooms and red fruit give three-season interest in cool climates.
    - Border Plant: Upright habit suits fencerows and windbreak understories.
  companions:
  - Serviceberry — earlier fruiting shrub neighbor staggering harvests for wildlife and humans
  - Elderberry — complementary moist-soil shrub with different bloom timing at the row edge
  - Yarrow — insectary forb along sunny margins without competing for shrub root space
  cautions:
  - Viburnum Leaf Beetle — skeletonized leaves signal inspection time, not denial
  - Hot dry summers — marginal without irrigation; not a Mojave volunteer
  pests:
  - Japanese Beetles
  - Aphids
  practitioner_notes: |-
    European Viburnum opulus differs—buy American var. americanum if regional ecology is the point.
    Fruit smells odd when cooking—finish the sauce before you judge the aroma mid-pot.
    Two genetically distinct plants improve fruiting in some settings—plan pairs, not solo statues.
    Birds may strip fruit overnight—harvest with intent, not hope.
