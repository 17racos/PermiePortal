  description: "Angel's Trumpet (*Brugmansia* species) are large shrubs or small trees
    that can reach heights of 6-20 feet (1.8-6 meters) in frost-free areas. They have
    many branching trunks with simple, alternately arranged leaves that can be toothed
    or entire. The large, pendulous, trumpet-shaped flowers, ranging from 6 to 24
    inches (15-60 cm) long, come in shades of white, cream, yellow, peach, orange,
    pink, and red. Most species are fragrant, especially in the evening, attracting
    pollinators such as moths and hummingbirds. All parts of the plant are highly
    toxic if ingested.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nThrive
    in full sun to partial shade. Require moist, fertile, well-drained soil. Regular
    watering is essential, especially during dry periods, but overwatering should
    be avoided to prevent root rot.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nEasily
    propagated by rooting 4-6 inch (10-15 cm) cuttings taken from the end of a branch
    during the summer. Cuttings should be placed in moist, well-drained soil and kept
    in a warm, shaded area until roots develop.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nAs ornamental plants, they are not typically harvested.
    Pruning can be done to maintain shape and encourage bushier growth. Any pruning
    should be done with caution due to the plant's toxicity."
