  description: 'Sensitive briar (Mimosa nuttallii) is a prostrate to low-climbing legume of prairies, roadsides, and open
    sandy ground in central North America, bearing powder-puff pink flowers and leaves that fold on touch. Tiny recurved prickles
    snag socks honestly. It fixes nitrogen while living low, a useful component of meadow mixes and disturbed-site recovery
    where taller partridge peas would dominate visually.


    ☀️💧 Sun and Water Requirements:

    - Full sun; shade reduces bloom and nodulation.

    - Drought tolerant once established; benefits from occasional rain after establishment.

    - Sandy to loamy well-drained soils; tolerates poor ground where turf gives up.


    ✂️ Propagation:

    - Scarified seed direct-sown after soil warms.

    - Division of crowns with care—taproot resents rough handling.

    - Protect young plants from aggressive mulch smothering; crowns want light and air.


    🌾 Harvest / Best Use Timing:

    - Not a primary food crop; value is soil and pollinator service.

    - Collect seed when pods brown and before full shatter if managing a seed increase plot.

    - Mow or burn per local prairie protocol—always follow regulations and safety training.'
