  description: "Eugenia brasiliensis is a dark, glossy-leaved myrtle tree with purple-black
    fruit that reads 'forest blackberry meets cherry' when you are lucky with genetics.
    Slower and less famous than pitanga, but fruit quality can be excellent from selected
    plants. North Florida: warm-site tree; protect young wood from hard freezes.\n\n🌞💧
    Sun and Water Requirements:\n- Full sun for flowering and fruiting.\n- Deep, fertile,
    well-drained soil with even moisture during fruit swell.\n- Mulch to protect surface
    roots.\n\n✂️🌱 Methods to Propagate:\n- Seeds: variable juvenility.\n- Grafting
    superior selections when you can find scion.\n\n🧺 When to Harvest:\n- Fully ripe
    dark fruit — like most myrtaceae, birds are the secondary QC department."
  purpose: |-
    Grumixama diversifies the myrtle fruit guild beyond guava and jaboticaba clichés.
    Treat it as a long-game canopy/undercanopy fruit tree for frost-lite food forests.
