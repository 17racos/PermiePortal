- common_name: Grumixama
  picture: grumixama.jpg
  scientific_name: Eugenia brasiliensis
  aka:
  - Brazilian cherry (name collision alert — not Surinam cherry)
  family: Myrtaceae
  zone: 9-11
  ideal_temp_min: 60
  ideal_temp_max: 95
  min_temp: 26
  max_temp: 110
  perennial: true
  layers:
  - Tree
  plant_function:
  - Edible
  - Wildlife Attractor
  - Ornamental
  description: 'Eugenia brasiliensis is a dark, glossy-leaved myrtle tree with purple-black fruit that reads ''forest blackberry
    meets cherry'' when you are lucky with genetics. Slower and less famous than pitanga, but fruit quality can be excellent
    from selected plants. Warm-site tree; protect young wood from hard freezes.


    ☀️💧 Sun and Water Requirements:


    Full sun for flowering and fruiting.

    Deep, fertile, well-drained soil with even moisture during fruit swell.

    Mulch to protect surface roots.


    ✂️ Propagation:


    Seeds: variable juvenility.

    Grafting superior selections when you can find scion.


    🌾 Harvest / Best Use Timing:


    Fully ripe dark fruit — like most myrtaceae, birds are the secondary QC department.'
  purpose: '- Edible: Dark myrtle fruit diversifies the guild beyond guava and jaboticaba clichés.

    - Wildlife Attractor: Birds queue up as soon as fruit colors—plan netting or sharing.

    - Ornamental: Glossy foliage and long-game structure in frost-lite food forests.'
  companions:
  - Jaboticaba
  - Guava
  - Pitanga
  cautions:
  - Planting tiny seedlings in open wind without stake discipline
  - Drought stress during fruit set — splits and sulking follow
  pests:
  - Aphids
  - Caribbean Fruit Fly
  - Oriental Fruit Fly
  - Scale Insects
  practitioner_notes: 'Thin skin cracks from rough handling—pick into single layers like blueberries, not buckets.

    Seed is large relative to pulp—spitters make clean juice; crushers need fine sieves.

    Young plants fruit lighter in shade—sun builds sugar once roots are deep.'
