  description: "Eugenia brasiliensis is a dark, glossy-leaved myrtle tree with purple-black
    fruit that reads 'forest blackberry meets cherry' when you are lucky with genetics.
    Slower and less famous than pitanga, but fruit quality can be excellent from selected
    plants. Warm-site tree; protect young wood from hard freezes.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun for flowering and fruiting.\nDeep, fertile,
    well-drained soil with even moisture during fruit swell.\nMulch to protect surface
    roots.\n\n✂️ Propagation:\n\nSeeds: variable juvenility.\nGrafting
    superior selections when you can find scion.\n\n🌾 Harvest / Best Use Timing:\n\nFully ripe
    dark fruit — like most myrtaceae, birds are the secondary QC department."
  purpose: |-
    - Edible: Dark myrtle fruit diversifies the guild beyond guava and jaboticaba clichés.
    - Wildlife Attractor: Birds queue up as soon as fruit colors—plan netting or sharing.
