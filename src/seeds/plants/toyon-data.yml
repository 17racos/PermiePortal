description: |-
  Toyon (Heteromeles arbutifolia) is an evergreen shrub native to California and nearby regions, prized for its dense branching and clusters of bright red berries. Plants typically grow 2–6 m (7–20 ft) tall depending on conditions and management. In permaculture, toyons matter because they provide long-lived habitat structure in shrub layers while offering berry forage for wildlife and a persistent living boundary that reduces erosion and bare soil. Its year-round foliage and seasonal fruit help stabilize ecosystem rhythms across mixed plantings.

  Full sun to partial shade; more sun generally supports denser growth and better berry production. Water moderately while establishing; once rooted it tolerates dry spells. Prefers well-drained soil; avoid waterlogged beds. Handles warm conditions well; protect young plants from severe cold snaps if needed.

  Seeds: collect ripe berries, clean and extract seed; sow with stratification as needed for germination timing (often weeks to months). Cuttings: take semi-hardwood cuttings in warm seasons and root under humidity (often 6–12 weeks). Layering: bend lower branches to moist soil and pin until roots form.

  Berries ripen in late season; you can harvest selectively or leave for wildlife depending on your goal. Use fruit as a food input only when properly identified and prepared for safety; process fruit if your sources recommend it. Prune for shape after flowering/fruiting so you keep berries in the right cycle.
purpose: |-
  Edible: Heteromeles arbutifolia berries need cooking or leaching strategies where tannins run high -- harvest red clusters in late season for jelly experiments on known-clean plants, not mystery hedgerow roulette.
  Wildlife Attractor: Persistent red pomes and dense evergreen cover feed songbirds and small mammals through winter dry spells -- leave fruit if your goal is cedar waxwing theater.
  Border Plant: Twisting 2--6 m evergreen shrub canes knit drought-tolerant screens along paths and chaparral edges -- prickly structure slows casual foot traffic without looking like ornamental boxwood cosplay.
companions:
  - Rosemary (Salvia rosmarinus) — aromatic evergreen companion that prefers sun and drainage.
  - Lavender (Lavandula angustifolia) — supports dry, sunny understory conditions and brings nectar for pollinators.
  - Thyme (Thymus vulgaris) — low herb that stabilizes soil on shrub edges and adds edible/medicinal harvest.
cautions:
  - Be careful with fruit processing and plant identification; do not assume all similar red berries are safe.
pests:
  - Aphids
  - Scale Insects
  - Root Rot
  - Caterpillars
