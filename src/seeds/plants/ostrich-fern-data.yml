    fronds with edible \"fiddleheads\" in spring—**only** harvest species you have
    positively identified; some ferns are not brunch. The brown fertile fronds persist
    like little woody flags after the green blades die back.\n\nIt wants cold winters
    and cool, moist soils; humid lowland tropics sit south of its happy place
    unless you simulate mountain creek conditions and accept marginal performance.\n\n☀️💧 Sun and Water Requirements:\n\nPart to full shade; rich, moist, slightly acidic soil with steady
    humus.\nNever let a clump dry to dust in summer if you want lush crowns.\n\n✂️ Propagation:\n\nDivision of crowns in early spring; spores (slow, specialist fun); transplant
