  description: "Ostrich fern forms big, vase-shaped clumps of bright green sterile
    fronds with edible \"fiddleheads\" in spring—**only** harvest species you have
    positively identified; some ferns are not brunch. The brown fertile fronds persist
    like little woody flags after the green blades die back.\n\nIt wants cold winters
    and cool, moist soils; subtropical subtropical and tropical Americas is south of its happy place
    unless you simulate mountain creek conditions and accept marginal performance.\n\nSun
    and water: Part to full shade; rich, moist, slightly acidic soil with steady
    humus. Never let a clump dry to dust in summer if you want lush crowns.\n\nPropagation:
    Division of crowns in early spring; spores (slow, specialist fun); transplant
    rhizome sections with buds. Fiddlehead patches are long-term investments, not
    instant noodles."
  purpose: |-
    Spring edible where tradition and ID skills exist; lush shade ground layer in
    temperate food forests; streambank stabilization in appropriate climates. If you
    are in steamy Florida lowlands, this fern may sulk while native wetland ferns party.
