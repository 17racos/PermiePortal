  practitioner_notes: |-
    Strain selection is the most important single decision for Florida growers —
    warm-weather strains (WW strains from suppliers like Field & Forest or Fungi
    Perfecti) handle the heat that kills standard temperate strains; buy for your
    climate, not the catalog photo.
    Shock-soaking triggers flushes — submerge logs for 12-24 hours in cold water,
    then stand upright in a humid shaded area; most logs flush within 7-10 days.
    Harvest by texture and veil: pick when the veil under the cap is still intact
    or just beginning to tear; fully open flat caps are past peak flavor and shelf
    life drops sharply.
    Dry at low heat (95-105°F) with strong airflow rather than dehydrating hot and
    fast — slow drying concentrates flavor and produces the glossy dried shiitake
    that rehydrates cleanly.
    Log production runs 3-5 years; stagger inoculation across multiple seasons
    so you always have logs in different production stages and never face a gap year.
