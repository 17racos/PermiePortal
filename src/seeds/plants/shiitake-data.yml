description: |-
  Shiitake on logs is the entry point for serious food forest fungal production — dense hardwood, slow colonization, years of flushes if you manage the soak schedule and keep logs in honest shade. In subtropical Florida, live oaks, water oaks, and sweetgum all work when logs are cut fresh with bark intact. Warm winters shorten log storage life; shade, airflow, and off-ground stacking on pallets or rails are not optional aesthetics, they are the production system. Strain selection matters: warm-weather strains (WW designations) handle Florida summers significantly better than standard temperate strains, which sulk and abort above 80°F. The flavor of a log-grown shiitake — earthy, rich, slightly smoky when dried — has no indoor bag equivalent.

  Deep shade under canopy or north-facing lean-to; afternoon sun on thin Florida logs is a death sentence. Shock-soaking (12-24 hr submersion) or heavy sustained rain triggers pinning; do not leave logs waterlogged for extended periods. End-sealing or waxing cut ends reduces cracking in dry seasons.

  Drill-and-fill with sawdust or plug spawn into freshly cut green hardwood (within a few weeks of cutting). Cycle logs: soak a subset while others rest; stagger inoculation dates to distribute flushes across the season.

  Flush Shiitake before caps flatten and spores dust -- younger tissue holds better flavor for most logs and beds. Twist or cut at base; second flushes often follow if humidity stays honest. Refrigerate in paper bags and use within days; saute or pickle rather than letting slimy regret arrive.
purpose: |-
  Edible: Lentinula edodes log-run fruit bodies carry smoky fifth-flavor depth when dried -- slice caps before gills flatten so summer strains do not bake off quality in humid shade houses.
  Medicinal: Hot-water extracts concentrate beta-glucans studied alongside lentinan protocols -- separate supplement paperwork from weeknight stir-fry batches before making health claims out loud.
  Mulcher: White-rotted oak rounds finish as spongy hugel cores that hold moisture for perennial roots once mushroom yields taper off.
substrate:
- Oak (primary — white, red, water, live oak all viable)
- Sweetgum
- Hickory
- Alder
- Most dense, tannic hardwoods; avoid soft woods and conifers
mycelium_type: White rot saprobe
fruiting_season: Fall through spring in Florida; warm-weather strains extend production into summer; peak flushes October through April
cultivation_difficulty: Beginner to intermediate — log inoculation is well-documented and forgiving; strain selection for subtropical climate is the critical variable
spawn_type: Plug spawn or sawdust spawn for logs; grain or supplemented sawdust for indoor blocks; warm-weather (WW) strains recommended for Florida
companions: []
cautions:
- None documented for properly prepared specimens
- Rare shiitake dermatitis reaction exists from raw or undercooked consumption — cook thoroughly
pests:
