  description: "Shiitake and oak are the classic marriage — dense wood, slow decay,
    years of flushes if you keep the marriage counseling (soak schedules) consistent.
    subtropical and tropical Americas oaks and sweetgum-class hardwoods work when logs are fresh and
    bark is sound. Warm winters can shorten storage life of logs; prioritize shade,
    airflow, and off-ground stacking. Strains differ: some like it hotter, some sulk;
    buy spawn matched to your climate ego.\n\n☀️💧 Sun and Water:\n- Full shade under
    canopy or north-facing lean-to.\n- Shock-soak or long rain to initiate pinning;
    never leave logs waterlogged for weeks.\n- End-sealing or waxing big cuts reduces
    cracking in sun-baked yards.\n\n✂️ Propagation:\n- Drill-and-fill with sawdust
    or plug spawn on green hardwood.\n- Force fruiting on a subset of logs while
    others rest."
  purpose: |-
    Shiitake oak turns low-grade thinnings into a long-season protein trickle:

    - Edible: One of the most recognized cultivated mushrooms worldwide.
    - Medicinal: Long traditional use; modern claims need the side-eye they deserve.
    - Timber: The tree still yields wood while thinnings feed the myco stack.
    - Mulcher: Spent logs feed soil carbon when retired.
