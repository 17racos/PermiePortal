description: |-
  Mandarin (Citrus reticulata) is an evergreen citrus tree grown for sweet, easy-to-peel fruit and glossy foliage. It typically forms a rounded canopy about 3–6 m (10–20 ft) tall in managed landscapes, producing fragrant flowers and then fruit that ripens in warm seasons depending on cultivar. In permaculture, it matters because you get regular, vitamin-rich calories from a woody structure plant, plus nectar for pollinators and an aromatic canopy that cools the understory.

  Full sun is best for flowering and fruit set; shade reduces yield. Water consistently through bloom and early fruit sizing; avoid long drought swings during that window. Prefers deep, well-drained soil amended with compost; waterlogged roots cause trouble. Protect from frost; cold damage can knock fruit trees off schedule.

  Grafting/budding: the standard method for producing reliable fruit; do it on compatible citrus rootstock. Seeds: can germinate, but fruit quality and timing can vary widely. Layering or cuttings may root in ideal conditions but are less common than grafting.

  Harvest when fruit is fully colored and tastes sweet; pick in rounds because ripeness can vary. Store cool for short-term eating or juice; zest stores well for cooking and baking. Use peels for aromatic household inputs after composting or proper use in recipes.
purpose: |-
  Edible: Citrus reticulata peels slip free from segments with less pith than sweet oranges -- eat out of hand, can segments, or candy peel because oils in the zest carry more aroma than juice alone.
  Medicinal: Flavedo oils and flavonoids enter marmalade and digestive bitters -- vitamin C supports dietary wellness; check drug interactions if you consume large daily citrus loads with certain medications.
  Wildlife Attractor: Split fruit and dropped peels draw wasps and mockingbirds -- pick before full drop if ground-forager traffic conflicts with barefoot traffic.
  Shade Provider: Rounded evergreen canopy cools lettuce and herbs in the drip line -- mulch wide but keep mulch back from bark to avoid phytophthora collars in humid climates.
