  description: |-
    Common snowberry (Symphoricarpos albus) is a suckering deciduous shrub from North America, famous for chalk-white berries that hang into winter like nature’s cheap pearls. Arching stems carry simple opposite leaves and small pink flowers, maturing around 3–6 feet tall and wider by underground runners in moist soils.

    Heat and relentless humidity are not this plant’s love language. In warm lowlands it is, at best, a trial for collectors in cool microclimates; true tropical lowlands are a hard no for long-term success. If you insist, picture it as a temporary novelty, not a backbone species.

    ☀️💧 Sun and Water Requirements:

    Part sun to light shade in warm areas; full sun only where summers stay mild.
    Evenly moist, well-drained humus; avoid baking sand without irrigation and organic matter.

    ✂️ Propagation:

    Softwood cuttings in early summer; keep humidity high until roots callus and hold.
    Dig suckers in dormancy with some roots attached; replant immediately and mulch the crown.

    🌾 Harvest / Best Use Timing:

    Berries are wildlife food, not a human snack—do not confuse “pretty” with “salad.”
    Prune out old stems after fruiting display if you want tidy thickets; leave structure for nesting birds.
  purpose: |-
    Wildlife Attractor: Snowberry layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Erosion Control: Erosion control needs roots that grip: Arching stems carry simple opposite leaves and small pink flowers, maturing around 3 - 6 feet tall and wider by underground runners in moist soils. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ornamental: Snowberry earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
