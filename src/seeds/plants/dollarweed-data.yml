  description: "Dollarweed (Hydrocotyle bonariensis) is a creeping perennial with round, peltate leaves often described as\
    \ silver-dollar sized, common in moist lawns, pond margins, and brackish-influenced ground along warm coasts from the\
    \ United States through the Caribbean and parts of South America. It is a salad green and survival forage in some traditions—mild\
    \ when young, mucilaginous when older—and an indicator plant that laughs at over-irrigation. In design terms it is either\
    \ a living mulch in wet polycultures or a symptom of drainage fiction; the plant does not care which story you tell.\n\
    \n☀️\U0001F4A7 Sun and Water Requirements:\nFull sun to partial shade. Thrives in consistently moist to wet soils and\
    \ tolerates brief inundation; not a desert ground cover. Brackish exposure is tolerated on some sites—coastal swales are\
    \ its résumé. Reduce irrigation frequency if you want it less enthusiastic in turf.\n\n✂️ Propagation:\nStem fragments\
    \ with nodes root freely in wet media—accidental propagation is the default mode.\nDivision of mats in cool, moist weather\
    \ transplants cleanly into pond edges or rain gardens.\n\n \U0001F33E Harvest / Best Use Timing:\nGather young leaves\
    \ before flowering for the best texture in salads or cooked greens. In managed wetlands, thin mats seasonally to maintain\
    \ open water for amphibians if biodiversity is the goal."
  purpose: |-
    Edible: Hydrocotyle bonariensis young round leaves are mild salad or pot herbs when ID is certain -- avoid chemically treated lawns.
    Aquatic: Creeping stems root in saturated soil along pond shelves, swales, and brackish-influenced margins.
    Ground Cover: Peltate leaves tile wet ground, reducing splash erosion and suppressing some weeds in rain gardens.
    Wildlife Attractor: Wet-edge cover shelters tadpoles, snails, and aquatic invertebrates at the waterline.
  companions:
