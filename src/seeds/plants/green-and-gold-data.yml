  description: 'Green and gold is a low, spreading native aster-family perennial from eastern North America, forming bright
    yellow daisy-like blooms over evergreen rosettes of hairy leaves. Mature patches stay under about 8 inches tall in bloom
    and slowly colonize by short stolons, making a polite woodland edge ground layer rather than a turf replacement thug.


    In subtropical and tropical Americas it is most useful in partial shade with steady organic mulch—humid summers favor
    foliar issues if air stagnates, while Puerto Rico’s dry season asks for occasional irrigation in bright exposures. Treat
    it as a filler between shrubs and small trees where you want nectar for small bees without opening a buffet for deer monoculture.


    ☀️💧 Sun and Water Requirements:

    - Part shade to light shade is ideal; morning sun with afternoon shade works in hot humid sites.

    - Moist, well-drained, humus-rich soil; avoid baking drought on sandy berms without mulch.

    - Increase water during establishment; mature mats tolerate short dry spells better with shade.


    ✂️ Propagation:

    - Divide crowns in cool, moist weather (late fall through early spring in subtropical/tropical cycles when plants are
    not heat-stressed).

    - Soft tip cuttings in spring under humidity; root in perlite/peat before potting up.

    - Dig rooted offsets at the edge of a clump after rains when soil is friable.


    🌾 Harvest / Best Use Timing:

    - Clip spent flower stems after peak bloom to keep the patch tidy and encourage a lighter rebloom where climate allows.

    - For propagation, take divisions just before a rainy spell so transplants root without irrigation marathons.'
  purpose: 'Green and gold earns its spot as a layered understory worker:


    - Ground Cover: Spreading habit knits soil under shrubs without forming a solid sod that excludes other guild members.

    - Pollinator: Small composite flowers supply nectar to native bees and syrphids during the shoulder seasons when canopy
    is still thin.

    - Ornamental: Gold blooms against deep green foliage read clean along paths and pond margins where turf fails.

    - Erosion Control: Fibrous roots and matting stems reduce splash erosion on shaded slopes after heavy subtropical and
    tropical Americas rains.'
  companions:
  - Oak — dappled shade and leaf mulch mirror this plant’s woodland edge niche while roots occupy deeper horizons.
