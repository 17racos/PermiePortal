description: |-
  Green and gold is a low, spreading native aster-family perennial from eastern North America, forming bright yellow daisy-like blooms over evergreen rosettes of hairy leaves. Mature patches stay under about 8 inches tall in bloom and slowly colonize by short stolons, making a polite woodland edge ground layer rather than a turf replacement thug.

  In subtropical and tropical Americas it is most useful in partial shade with steady organic mulch—humid summers favor foliar issues if air stagnates, while Puerto Rico’s dry season asks for occasional irrigation in bright exposures. Treat it as a filler between shrubs and small trees where you want nectar for small bees without opening a buffet for deer monoculture.

  Part shade to light shade is ideal; morning sun with afternoon shade works in hot humid sites. Moist, well-drained, humus-rich soil; avoid baking drought on sandy berms without mulch. Increase water during establishment; mature mats tolerate short dry spells better with shade.

  Divide crowns in cool, moist weather (late fall through early spring in subtropical/tropical cycles when plants are not heat-stressed). Soft tip cuttings in spring under humidity; root in perlite/peat before potting up. Dig rooted offsets at the edge of a clump after rains when soil is friable.

  Clip spent flower stems after peak bloom to keep the patch tidy and encourage a lighter rebloom where climate allows. For propagation, take divisions just before a rainy spell so transplants root without irrigation marathons.
purpose: |-
  Ground Cover: Chrysogonum virginianum spreads by short stolons into evergreen rosettes under shrubs -- it knits soil without forming a turf monoculture that blocks interplanting ferns or ginger between clumps.
  Pollinator: Small yellow composite heads offer nectar and pollen to native bees and syrphid flies in partial shade -- useful when canopy is leafing out and sun-loving meadow plants are still waking up.
  Ornamental: Bright gold stars against deep green, hairy foliage read clean along woodland paths and pond margins -- reads intentional where lawn would demand irrigation and mowing for the same visual line.
  Erosion Control: Fibrous roots and low stems intercept rain splash on shaded slopes -- pair with mulch to keep soil from washing between downpours in humid climates.
companions:
  - Oak — dappled shade and leaf mulch mirror this plant’s woodland edge niche while roots occupy deeper horizons.
  - Fern — shares moisture-retentive, shady conditions without outcompeting for low light the way turf grasses would.
  - Wild Ginger — complementary low ground layer that occupies slightly different soil chemistry and spacing, reducing bare mud between clumps.
