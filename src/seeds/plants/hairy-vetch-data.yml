  description: |-
    Hairy vetch (Vicia villosa) is a fast-growing legume cover crop known for its ability to fix nitrogen and for its ability to cover bare ground quickly. It forms a spreading, trailing mat of vines and feathery leaves, often reaching about 30–90 cm (12–35 in) long during cover-crop growth. In permaculture, it matters because it converts otherwise idle winter soil into living soil armor: it shades the ground, suppresses weeds, and turns into nitrogen-rich mulch for the next planting.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun; growth slows in heavy shade.
    - Moderate water helps germination and establishment; once rooted, it tolerates typical cool-season rainfall.
    - Prefers well-drained soil with decent fertility; it does best when soil biology is active.
    - Avoid long waterlogged periods that reduce legume vigor.
    
    ✂️ Propagation:
    - Seeds (fall sow): direct-seed in early autumn for winter cover; germination often starts within 5–10 days with consistent moisture.
    - Seeds (spring sow): works in milder periods, but you usually lose time and cover quality to heat.
    - Optional: inoculate seed with rhizobium (where appropriate) to improve nitrogen-fixation performance.
    
    🌾 Harvest / Best Use Timing:
    - Cut or mow when plants are actively growing and before seed pods mature.
    - Leave residues on the surface as chop-and-drop mulch; for beds, you can crimp/lay down cover instead of deep turning.
    - If you let it seed, expect future volunteer growth—manage it or remove as needed.
  purpose: |-
    Nitrogen Fixer: Root nodules host nitrogen-fixing microbes, converting atmospheric nitrogen into plant-available forms that become fertilizer when biomass decomposes.
    Mulcher: Fast leaf and vine production gives you quick carbon-rich cover that protects soil from rain impact and heat spikes.
    Ground Cover: A spreading canopy reduces evaporation, keeps soil life active, and limits weed germination by blocking light.
  companions:
  - Oats (Avena sativa) — cereal bulk plus vetch nitrogen creates a balanced, easier-to-manage cover mix.
  - Radish (Raphanus sativus) — roots break up compaction while vetch cover keeps the surface from washing out.
  - Garlic (Allium sativum) — fits well after cover-crop windows; vetch mulch helps suppress weeds and stabilize soil moisture.
  cautions:
  - Avoid letting it fully seed if you want clean transitions; it can volunteer later and crowd seedlings.
  practitioner_notes: |-
    Plant thick enough to close the ground fast—thin vetch leaves gaps that weeds exploit.
    Cut at the “green switch” stage (active growth, before tough seed pods) for best mulch breakdown.
    Don’t deep-till; lay residues down so soil biology stays intact.
  pests:
  - Aphids
  - Caterpillars
  - Root Rot
  - Slugs
