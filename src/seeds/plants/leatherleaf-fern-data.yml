  description: "Leatherleaf fern (Rumohra adiantiformis) is a robust, glossy evergreen
    fern with leathery fronds widely used in the cut-greens trade and common in subtropical
    to tropical woodlands of the Americas, Africa, and islands—check regional provenance
    before planting because non-native stock can escape in mild climates. It forms
    clumps from scaly rhizomes, tolerates low light and coastal humidity, and provides
    year-round texture under trees where delicate ferns desiccate. For permaculture,
    it is primarily an ornamental ground layer and erosion mat on shady, well-drained
    slopes—not a calorie crop.\n\n☀️💧 Sun and Water Requirements:\nPartial to full
    shade; tolerates bright shade on humid coasts. Prefers moist, well-drained, humus-rich
    soils; tolerates short dry spells once established but fronds brown at tips in
    drought. Salt spray tolerance is moderate on some coastal sites. Avoid freezing
    exposures without protection—hardy through warm-temperate frost pockets at best.\n\n
    ✂️ Propagation:\nDivision of rhizome clumps in cool, moist weather resets crowded
    specimens.\nSpores are slow; use for nursery work, not instant landscapes.\n\n🌾
    Harvest / Best Use Timing:\nCut fronds sparingly for arrangements from cultivated
    clumps; overcutting weakens plants. In gardens, remove winter-damaged fronds before
    spring fiddleheads emerge on other species nearby."
