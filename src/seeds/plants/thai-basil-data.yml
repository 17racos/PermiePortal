description: |-
  Thai basil is the liquorice-mint square-stemmed workhorse of stir-fries and phở—purple stems, pointed leaves, and flower spikes bees treat like a runway. Distinct from sweet basil; do not substitute unless you enjoy flavor chaos.

  Grow spring through fall; bolts in heat but keeps producing if you steal tips. Frost ends the party—extend with row cover or pots.

  Full sun, rich well-drained soil, steady moisture.
  Wilts fast in pots—mulch and check daily in August.

  Seed indoors after last frost or direct sow warm soil; cuttings root in water in a week if you forget to label them.

  Pinch tips and flower spikes for continuous kitchen harvest until frost stops growth.
purpose: |-
  Edible: Ocimum basilicum var. thyrsiflorum liquorice spikes strip into beef salads and chili oil -- harvest before woodiness because stems toughen faster than Italian sweet types.
  Pollinator: Purple whorled blooms spike late summer basil rows -- if you dare delay pesto cuts for bee forage gaps.
  Pest Management: Eugenol-rich leaf volatiles mask tomato-to-moth cues -- when tight tomato-basil guilds breathe together in humid frames.
