description: |-
  Mizuna (Brassica rapa var. nipposinica) is a useful annual species in the Brassicaceae family, native or long-naturalized across parts of the Americas and Eurasia depending on lineage. Mature growth is typically a herbaceous form suited to layered guilds, with reliable productivity when site conditions match its ecology. In a permaculture system it contributes food, habitat, and system resilience rather than single-crop output.

  Best performance comes with full sun to light partial shade, depending on heat intensity. Keep soil moisture steady during establishment, then water by seasonal demand. Well-drained fertile soil works for most upland entries, while wetland species require saturated margins. Most growth accelerates between 45°F (7°C) and 72°F (22°C), with stress rising near 88°F (31°C).

  Direct seeding is the simplest method where climate allows; sow at the start of the local favorable season and keep the seed zone evenly moist through germination. A second pathway is transplanting nursery starts or divisions once roots are active and temperatures are stable. Woody entries can also be established from dormant bare-root stock or grafted material for cultivar reliability.

  Harvest edible portions at peak maturity for intended use: leafy crops before heat stress, fruiting types at full color, root crops after starch set, and nuts or grains once fully mature and dry. For ecological functions, the strongest value appears after canopy closure, flowering, and annual residue cycling, when soil cover and habitat effects become consistent.
purpose: |-
  Edible: Finely serrated Brassica rapa var. nipposinica leaves give mild mustard-nuanced salad cuts, quick stir-fry greens, and pickle-friendly twists in the cool window -- succession-sow every few weeks because heat turns flavor harsh faster than heading kales forgive drought.
  Ground Cover: Shallow rosettes carpet bed edges, orchard aisles, and polytunnel shoulders where mowing stops -- paired with mulch, the leaves cap soil evaporation between taller companions without forming a sod-thick mat.
  Pollinator: Small yellow four-petaled flowers on bolting stems offer pollen and nectar to early honeybees, solitary bees, and hoverflies -- leaving a few plants to bolt supports beneficials even while you prioritize younger leaves for the kitchen.
