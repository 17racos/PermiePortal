description: |-
  Royal fern (Osmunda regalis) is a large deciduous fern of wet woods, seeps, and streambanks across the northern hemisphere, including eastern North America. Sterile fronds arch like green fountains; fertile pinnae cluster at the tips, earning old names about flowering. It is a signature plant for rain gardens, pond margins, and shaded bioswales where scale and texture replace lawn.

  Part shade to light shade; morning sun acceptable if soil stays moist. Moisture-loving; tolerates shallow water at the root margin in quiet sites. Rich, acidic, organic soils; mulch with leaf mold to mimic forest floor.

  Division of crowns in early spring before croziers expand. Spores from fertile segments on sterile medium under humidity—slow. Transplant divisions with minimal root breakage; water consistently the first year.

  Not a crop fern; leave fronds for structure and habitat. Cut browned sterile fronds after frost if tidiness matters; leave some for insect shelter. For nursery increase, divide when fiddleheads are fist-high.
purpose: |-
  Ground Cover: Osmunda regalis sterile fronds arch in wide fountains that shade soil under alders and pond margins, excluding turf wannabes where spores would rather not compete -- keep crowns at original depth; buried crowns rot fast.
  Wildlife Attractor: Constantly damp litter under fronds hosts salamanders, slugs, and crane flies that wading birds pick along shaded seeps -- not nectar hype, but honest amphibian real estate.
  Erosion Control: Dense crown roots grip mucky organic banks on shaded stream bends where sun-loving sedges would fry -- pair with leaf mold mulch that mimics forest floor instead of baking bare clay.
  Ornamental: Fertile pinnae cluster like rusty “flowers” at frond tips, giving vertical scale rain gardens lack when only short sedges show up -- cut browned sterile blades after frost if tidy edges matter more than winter insect hotels.
