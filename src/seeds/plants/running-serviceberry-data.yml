  description: 'Running serviceberry (Amelanchier stolonifera) is a low, stoloniferous deciduous shrub of northern North American
    bogs, shores, and moist woods, bearing white spring flowers and small dark edible pomes in early summer. Plants typically
    stay 1–3 feet (30–90 cm) tall while spreading into colonies via runners. It is a ground-layer fruit for cold, acidic,
    moist sites where taller serviceberries would sulk or shade too aggressively.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; best fruiting with good light and steady moisture. Acidic, organic, moist but well-drained
    soils suit it; tolerates short dry spells once established in cool climates. Mulch with leaf mold; avoid hot, dry berms
    without irrigation.


    ✂️ Propagation:

    Divide stolon sections with roots in early spring. Sow stratified seed for diversity. Prune out old stems after several
    years to renew fruiting wood and reduce interior twig tangle.


    🌾 Harvest / Best Use Timing:

    Pick pomes when dark and softening—yield is modest, so plan small-batch jams. Bloom tracks late spring after hard frost
    risk near 28°F (-2°C) in northern sites. Leave some fruit for ground birds if colony ethics matter.'
  purpose: '- Edible: Small sweet-tart berries reward patient pickers in cool, moist microclimates.

    - Wildlife Attractor: Flowers feed early pollinators; fruit feeds birds and small mammals.

    - Ground Cover: Stoloniferous habit fills moist openings under taller shrubs without bamboo vibes.

    - Border Plant: Low height defines wet garden edges and pond margins.'
  companions:
