description: |-
  Running serviceberry (Amelanchier stolonifera) is a low, stoloniferous deciduous shrub of northern North American bogs, shores, and moist woods, bearing white spring flowers and small dark edible pomes in early summer. Plants typically stay 1–3 feet (30–90 cm) tall while spreading into colonies via runners. It is a ground-layer fruit for cold, acidic, moist sites where taller serviceberries would sulk or shade too aggressively.

  ☀️💧 Sun and Water Requirements:
  Full sun to partial shade; best fruiting with good light and steady moisture. Acidic, organic, moist but well-drained soils suit it; tolerates short dry spells once established in cool climates. Mulch with leaf mold; avoid hot, dry berms without irrigation.

  ✂️ Propagation:
  Divide stolon sections with roots in early spring. Sow stratified seed for diversity. Prune out old stems after several years to renew fruiting wood and reduce interior twig tangle.

  🌾 Harvest / Best Use Timing:
  Pick pomes when dark and softening—yield is modest, so plan small-batch jams. Bloom tracks late spring after hard frost risk near 28°F (-2°C) in northern sites. Leave some fruit for ground birds if colony ethics matter.
purpose: |-
  Edible: Dark Amelanchier stolonifera pomes ripen in early summer with sweet-tart juice suited to small-batch jam where harvest volume stays modest but flavor is sharp and clean.
  Wildlife Attractor: White spring blooms feed early pollinators ahead of many summer crops; soft fruit feeds ground-foraging birds when colonies run along bog margins.
  Ground Cover: Runnering stems knit into knee-high mats that occupy moist acidic openings without the wall of shade taller serviceberries cast.
  Border Plant: Low stature visually anchors pond lips and wet woodland edges while defining paths where taller shrubs would read as barriers.
companions:
- Highbush Cranberry — taller moist-site neighbor providing winter fruit interest
  above low serviceberry mats
- Marsh Blazingstar — upright forb contrast in moist sun beyond the shrub drip line
- Wild Columbine — spring forb at the colony edge before leaves fully close the canopy
cautions:
- Hot dry sites — chlorosis and colony collapse without moisture honesty
- Cedar-apple rust complex—mind alternate hosts when designing disease-quiet guilds
