  description: "Golden currant (Ribes aureum) is a deciduous ribes shrub of riparian
    thickets, rocky slopes, and prairie edges across much of North America, famous
    for clove-scented yellow spring flowers and tart golden to black berries on
    spine-free stems. It is a food forest understory fruit for cold and continental
    climates where citrus is greenhouse gossip. White pine blister rust regulations
    still matter in some jurisdictions—check local rules before planting near five-needle
    pines in restricted areas.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial
    shade; best fruiting with strong light and even soil moisture through bloom and
    berry swell. Tolerates drought once established but berries shrink without water.
    Prefers well-drained, fertile soils; tolerates alkaline sites better than many
    Ribes. Winter-hardy deep into cold zones; late spring frosts can damage flowers—site
    with air drainage on frost pockets.\n\n✂️ Propagation:\nHardwood cuttings in late
    winter root with bottom heat.\nSeeds require cold-moist stratification; germination
    stretches across weeks.\n\n🌾 Harvest / Best Use Timing:\nPick berries when fully
    colored, soft, and aromatic; use fresh, in jams, or fermented. Prune old wood after
    harvest to renew fruiting wood and open the center for air."
  purpose: |-
    - Edible: Tart fruit suits jams, syrups, and baking; flowers are edible garnish in moderation.
    - Wildlife Attractor: Berries feed birds; early flowers feed bees emerging in cool springs.
    - Pollinator: Fragrant yellow clusters draw bees and hummingbirds where ranges overlap.
    - Border Plant: Arching habit and spring scent define paths in edible hedgerows.
