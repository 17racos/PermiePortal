  description: "Pond apple is a native Florida annonaceous tree of swamps, mangrove
    edges, and sloughs, with yellow fruit that looks temptingly like a tiny cherimoya
    and historically fed wildlife more than discerning humans. Flavor is often insipid
    or funky; seeds and unreliable fruit quality keep it off the gourmet podium.\n\nEcological
    workhorse: roots in wet, brackish-to-fresh muck; canopy for wading birds; not
    something you casually plant far outside its range.\n\nSun and water: Full sun
    to part shade; tolerates seasonal inundation and brackish influence; wants heat
    and humidity.\n\nPropagation: Seeds from ripe fruit; transplant seedlings from
    ethical local sources if restoring wetland habitat—check regulations for coastal
    projects."
  purpose: |-
