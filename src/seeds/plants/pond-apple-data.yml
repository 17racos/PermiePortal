description: |-
  Pond apple is a native Florida annonaceous tree of swamps, mangrove edges, and sloughs, with yellow fruit that looks temptingly like a tiny cherimoya and historically fed wildlife more than discerning humans. Flavor is often insipid or funky; seeds and unreliable fruit quality keep it off the gourmet podium.

  Ecological workhorse: roots in wet, brackish-to-fresh muck; canopy for wading birds; not something you casually plant far outside its range.

  ☀️💧 Sun and Water Requirements:

  Full sun to part shade; tolerates seasonal inundation and brackish influence; wants heat and humidity.

  ✂️ Propagation:

  Seeds from ripe fruit; transplant seedlings from ethical local sources if restoring wetland habitat—check regulations for coastal projects.

  🌾 Harvest / Best Use Timing:

  Fruit historically feeds wildlife more than discerning humans—sample only with ID clarity and low flavor expectations.
purpose: |-
  Edible: Annona glabra yellow syncarps tempt foragers with cherimoya-like shape but often insipid or resinous flesh -- historical human use stayed cautious; sample only with positive ID and low expectations while respecting wetland harvest rules.
  Wildlife Attractor: Fruit feeds wading birds, raccoons, and manatees where stands ring sloughs; canopy hosts orchids and bromeliads in humid subtropical swamps -- plant only in native restoration contexts, not random upland lots.
  Erosion Control: Buttressed trunks and adventitious roots armor pond banks against sheet flow and minor storm surge -- tolerates brackish pulses better than true freshwater-only hardwoods on the same site.
  Shade Provider: Open Annona crown gives broken shade to sawgrass, pickerelweed, and marsh fern understory -- juvenile growth tolerates seasonal inundation that would drown pecans on the same berm.
companions:
- Mangrove
- Buttonwood
- Bald Cypress
- Pickerelweed
cautions:
- Dry upland sand without irrigation
pests:
- Scale Insects
- Mealybugs
- Aphids
