  description: 'American Beauty plum is a named European plum cultivar (Prunus domestica) grown for large, freestone purple-red
    fruit with amber flesh and sweet-tart fresh-eating quality. Trees are typical deciduous orchard plums, forming a rounded
    crown roughly 12–18 feet (3.5–5.5 m) under standard rootstocks and pruning, with white spring blossoms that open before
    full leaf expansion. It suits temperate backyard orchards and food forests where winter chill hours accumulate and late
    frosts are managed.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable bloom, fruit set, and sugar development. Deep, well-drained loam is ideal; avoid chronic wet feet
    that invite root rots. Provide steady soil moisture from bloom through pit hardening, then taper before harvest to concentrate
    flavor. Mulch to preserve even soil moisture.


    ✂️ Propagation:

    Commercial trees are grafted onto Prunus rootstocks; bench graft in late winter or bud in summer using scion wood from
    known-true trees. Seedlings vary wildly and are useful only for rootstock experiments. Hardwood cuttings of plums are
    unreliable for beginners compared with grafting.


    🌾 Harvest / Best Use Timing:

    Pick when fruit yields slightly to gentle pressure and background color shifts from green to full purple-red—timing varies
    by season heat. Use immediately for fresh eating, or process into jam, sauce, and dried prunes within days of peak ripeness.'
