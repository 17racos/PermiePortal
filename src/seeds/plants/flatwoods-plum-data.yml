  description: 'Flatwoods plum (Prunus umbellata) is a thorny, deciduous wild plum of sandy pine woodlands, scrub, and old
    fields in the southeastern United States, forming dense thickets that flower profusely before leaves fully expand and
    produce small dark plums with astringent skins. It is a wildlife cafeteria and a hedgerow backbone—less a dessert orchard
    tree than a resilience shrub that feeds early pollinators and late-summer birds. Humans can jam or ferment fruit with
    sugar and patience; straight off the tree is a tannin education.


    ☀️💧 Sun and Water Requirements:

    Full sun for best bloom and fruit; tolerates partial shade with fewer plums. Prefers well-drained sandy or loamy soils;
    tolerates drought once established compared with many Prunus. Avoid chronic wet feet—root rots follow poor drainage. Hardy
    in warm-temperate to subtropical climates; late freezes can nip flowers on early-blooming forms.


    ✂️ Propagation:

    Sow cleaned pits after cold stratification or plant fresh seed in fall outdoor beds.

    Root suckers can be separated in dormancy to start new thickets where thorns are welcome.


    🌾 Harvest / Best Use Timing:

    Pick fruit when fully colored and slightly soft for jam; wildlife takes the rest if you delay. Prune to open centers for
    air flow and reduce brown rot pressure in humid years.'
