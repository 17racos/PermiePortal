  description: "Flatwoods plum (Prunus umbellata) is a thorny, deciduous wild plum of
    sandy pine woodlands, scrub, and old fields in the southeastern United States,
    forming dense thickets that flower profusely before leaves fully expand and produce
    small dark plums with astringent skins. It is a wildlife cafeteria and a hedgerow
    backbone—less a dessert orchard tree than a resilience shrub that feeds early
    pollinators and late-summer birds. Humans can jam or ferment fruit with sugar
    and patience; straight off the tree is a tannin education.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun for best bloom and fruit; tolerates partial shade with
    fewer plums. Prefers well-drained sandy or loamy soils; tolerates drought once
    established compared with many Prunus. Avoid chronic wet feet—root rots follow
    poor drainage. Hardy in warm-temperate to subtropical climates; late freezes
    can nip flowers on early-blooming forms.\n\n✂️ Propagation:\nSow cleaned pits after
    cold stratification or plant fresh seed in fall outdoor beds.\nRoot suckers can
    be separated in dormancy to start new thickets where thorns are welcome.\n\n🌾
    Harvest / Best Use Timing:\nPick fruit when fully colored and slightly soft for
    jam; wildlife takes the rest if you delay. Prune to open centers for air flow
    and reduce brown rot pressure in humid years."
  purpose: |-
    - Edible: Fruit is tart and astringent raw; suitable for jelly, wine trials, and heavy-handed sweetening.
    - Wildlife Attractor: Early flowers feed bees; fruit feeds birds and mammals in scrub ecosystems.
    - Border Plant: Thorny thickets create living fences along rough edges.
    - Pollinator: Massed bloom provides abundant pollen and nectar in late winter to early spring windows.
  companions:
