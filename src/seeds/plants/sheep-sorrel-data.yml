  description: 'Rumex acetosella is the tangy little dock relative that colonizes acidic, lean, disturbed ground while larger
    plants are still writing business plans. Leaves pack oxalic acid zing — nice in moderation in salads or soups, less nice
    if you mainline pounds daily. Common in sandy, worn pastures and garden edges.


    ☀️💧 Sun and Water Requirements:


    Full sun to part shade.

    Tolerates drought once established; thrives where grass pretends it is too hard.

    Acidic soils are its love language.


    ✂️ Propagation:


    Seeds: abundant; surface or shallow sow.

    Root fragments resprout — think before rototilling a patch you dislike.


    🌾 Harvest / Best Use Timing:


    Young leaves; smaller plants before flowering for milder flavor.'
