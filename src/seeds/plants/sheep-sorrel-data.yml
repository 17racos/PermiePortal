common_name: Sheep Sorrel
picture: sheep_sorrel.webp
scientific_name: Rumex acetosella
aka:
- Field sorrel
- Red sorrel
family: Polygonaceae
zone: 3-9
ideal_temp_min: 40
ideal_temp_max: 80
min_temp: -35
max_temp: 95
perennial: true
layers:
- Herbaceous
- Ground Cover
plant_function:
- Edible
- Dynamic Accumulator
- Ground Cover
description: |-
  Rumex acetosella is the tangy little dock relative that colonizes acidic, lean, disturbed ground while larger plants are still writing business plans. Leaves pack oxalic acid zing — nice in moderation in salads or soups, less nice if you mainline pounds daily. Common in sandy, worn pastures and garden edges.

  Full sun to part shade.
  Tolerates drought once established; thrives where grass pretends it is too hard.
  Acidic soils are its love language.

  Seeds: abundant; surface or shallow sow.
  Root fragments resprout — think before rototilling a patch you dislike.

  Young leaves; smaller plants before flowering for milder flavor.
purpose: |-
  Edible: Rumex acetosella spoon-shaped leaves carry oxalic snap for winter soups -- keep portions modest if kidney stones are part of your medical chart.
  Dynamic Accumulator: Deep taproots mine phosphorus and micronutrients from worn pasture sod -- scythe tops before seed if you compost the acidity into alkaline beds deliberately.
  Ground Cover: Creeping mats tile acidic alleyways where turf dies out yet tiny green blooms still feed pollinators if you tolerate spread into crop rows.
companions:
- Yarrow
- Dutch Clover
- Plantain
cautions:
- Bulk diets for oxalate-sensitive people or livestock
- Letting it smother tiny seedlings you actually wanted
pests:
- Aphids
- Leafhoppers
- Rhubarb Curculio
- Slugs