    Acidic soils are its love language.\n\n✂️🌱 Methods to Propagate:\n- Seeds: abundant;
    surface or shallow sow.\n- Root fragments resprout — think before rototilling
    a patch you dislike.\n\n🧺 When to Harvest:\n- Young leaves; smaller plants before
    flowering for milder flavor."
  purpose: |-
