  description: 'Rumex acetosella is the tangy little dock relative that colonizes acidic, lean, disturbed ground while larger
    plants are still writing business plans. Leaves pack oxalic acid zing — nice in moderation in salads or soups, less nice
    if you mainline pounds daily. Common in sandy, worn pastures and garden edges.


    ☀️💧 Sun and Water Requirements:


    Full sun to part shade.

    Tolerates drought once established; thrives where grass pretends it is too hard.

    Acidic soils are its love language.


    ✂️ Propagation:


    Seeds: abundant; surface or shallow sow.

    Root fragments resprout — think before rototilling a patch you dislike.


    🌾 Harvest / Best Use Timing:


    Young leaves; smaller plants before flowering for milder flavor.'
  purpose: '- Edible: Tangy leaves in moderation—weed or crop depending on your ego.

    - Dynamic Accumulator: Mines acidic lean ground for minerals that return with cuts.

    - Ground Cover: Holds soil and feeds pollinators on inconspicuous flowers—manage spread in beds you care about.'
  companions:
  - Yarrow
  - Dutch Clover
  - Plantain
  cautions:
  - Bulk diets for oxalate-sensitive people or livestock
  - Letting it smother tiny seedlings you actually wanted
  pests:
  - Aphids
  - Leafhoppers
  - Rhubarb Curculio
  - Slugs
  practitioner_notes: 'Oxalic tang means moderation—large raw salads are GI roulette.

    Taproot breaks and resprouts—dig whole crown or accept return visits.

    Indicator of acid low-fertility spots—lime and fertility shift community if you want grass.'
