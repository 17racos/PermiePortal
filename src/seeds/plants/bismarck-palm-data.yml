    Coastal tropical and subtropical zones and warmest 10b pockets; 9a is mostly fantasy without heroic protection. Wet cold
    is worse than dry cold.


    ☀️💧 Sun and Water Requirements:


    Full sun for best color once established.

    Deep watering while young; somewhat drought-tolerant with maturity but not a cactus.


    ✂️ Propagation:


    Seed; growth is slow enough to teach children patience.


    🌾 Harvest / Best Use Timing:


    Trim old fronds for mulch or fuel when safe for crew and structures; timing follows estate maintenance plans, not annual
    crop schedules.'
