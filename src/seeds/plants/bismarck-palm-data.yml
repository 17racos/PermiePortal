description: |-
  Bismarck palm is the silver-blue fan palm that landscape architects love and lot sizes fear—massive costate leaves, stout trunk, and a presence that says “estate” even when your HOA says “no.”

  Coastal tropical and subtropical zones and warmest 10b pockets; 9a is mostly fantasy without heroic protection. Wet cold is worse than dry cold.

  Full sun for best color once established.
  Deep watering while young; somewhat drought-tolerant with maturity but not a cactus.

  Seed; growth is slow enough to teach children patience.

  Trim old fronds for mulch or fuel when safe for crew and structures; timing follows estate maintenance plans, not annual crop schedules.
purpose: |-
  Ornamental: Bismarckia nobilis costapalmate silver-blue fronds read instant estate even on modest lots -- adult spread and petiole spines mean HOA promises should include crane rental humor.
  Windbreaker: Stiff fans flex instead of shattering in coastal gusts once lignified -- still plan setbacks from glass pool cages because falling fronds are not gentle reminders.
  Shade Provider: High crown throws dappled shade for bromeliad tapestries and understory trials after trunk elongates -- juvenile green phase in shade resolves to powder blue once full sun arrives.
