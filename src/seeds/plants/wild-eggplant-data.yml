  description: "Wild eggplant (Solanum americanum) is a warm-season annual or short-lived perennial nightshade of disturbed\
    \ fields, gardens, and roadsides across the Americas and many tropical regions. Small white flowers yield clusters of\
    \ glossy black berries on branching plants. Some populations have a history of careful culinary use after ripeness checks;\
    \ others are best treated as toxic look-alike practice dummies—identification and local genotype knowledge matter more\
    \ than optimism.\n\n ☀️\U0001F4A7 Sun and Water Requirements:\nFull sun for fruiting; tolerates part shade with fewer\
    \ berries. Average to moist, fertile disturbed soils accelerate growth—classic garden gate-crasher. Water evenly during\
    \ fruit fill if studying domestication potential; drought during flowering reduces set.\n\n✂️ Propagation:\nSelf-sows\
    \ freely; sow seed after last frost indoors or direct where trials are isolated. Do not distribute outside regions where\
    \ it is regulated. Clone via cuttings only for controlled research, not casual sharing.\n\n\U0001F33E Harvest / Best Use\
    \ Timing:\nIf pursuing documented edible use, harvest only fully ripe, soft black berries with verified population edibility;\
    \ discard green or partially green fruit. Cooked preparations are traditional in some cultures—never experiment casually.\
    \ Leave plants for wildlife where human use is uncertain."
  purpose: |-
    Edible: Solanum americanum ripe soft black berries enter some Caribbean and Asian kitchens after parboiling -- green berries contain solanine; genotype edibility varies by population, not optimism.
    Wildlife Attractor: Small white star flowers feed syrphids; birds paint fences purple with seed-filled droppings -- plan containment if neighbors hate nightshades.
    Medicinal: Steroidal glycoalkaloid research exists -- leave clinical use to labs; home experiments with nightshades age poorly.
  companions:
  - Okra — shared warm-season garden timing; tall okra shades soil and marks rows in mixed annual beds
  - Amaranth — fast leafy matrix competes with weed pressure around nightshades without identical pest overlap
  - Marigold — root exudate folklore in vegetable gardens; visual trap crop for some insects near Solanum rows
  cautions:
  - Toxic look-alikes and green fruit — Solanum identification errors can hospitalize people; verify with regional experts
  - Livestock poisoning — berries and foliage risky to grazers; not a poultry forage plant
  - Invasive potential — prolific seeders; remove unwanted plants before fruit drop
