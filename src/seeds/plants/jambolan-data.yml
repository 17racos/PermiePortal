    Florida: listed invasive in parts of the state — birds seed it everywhere. If
    you already have it, harvest hard; if planting new, read county guidance like an
    adult.\n\n🌞💧 Sun and Water Requirements:\n- Full sun for dense growth and fruiting.\n-
    Tolerates a range of soils; prefers deep drainage over permanent bog.\n- Drought
    tolerance improves with age but young trees want steady moisture.\n\n✂️🌱 Methods
    to Propagate:\n- Seeds germinate easily — which is part of the invasive story.\n-
    Air-layering for known trees.\n\n🧺 When to Harvest:\n- When fruit darkens fully
    and separates easily — expect purple rain on pavement."
