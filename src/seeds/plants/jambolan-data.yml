  description: 'Syzygium cumini is the fast-growing myrtle tree with dark fruits that stain fingers, sidewalks, and innocence.
    Evergreen in warm climates, salt-tolerant enough for some coastal contexts, and famous for purple fruit mess underfoot.
    Florida: listed invasive in parts of the state — birds seed it everywhere. If you already have it, harvest hard; if planting
    new, read county guidance like an adult.


    ☀️💧 Sun and Water Requirements:


    Full sun for dense growth and fruiting.

    Tolerates a range of soils; prefers deep drainage over permanent bog.

    Drought tolerance improves with age but young trees want steady moisture.


    ✂️ Propagation:


    Seeds germinate easily — which is part of the invasive story.

    Air-layering for known trees.


    🌾 Harvest / Best Use Timing:


    When fruit darkens fully and separates easily — expect purple rain on pavement.'
