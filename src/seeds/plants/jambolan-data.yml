    tolerance improves with age but young trees want steady moisture.\n\n✂️ Propagation:\n\nSeeds germinate easily — which is part of the invasive story.\nAir-layering for known trees.\n\n🌾 Harvest / Best Use Timing:\n\nWhen fruit darkens fully
