description: |-
  Syzygium cumini is the fast-growing myrtle tree with dark fruits that stain fingers, sidewalks, and innocence. Evergreen in warm climates, salt-tolerant enough for some coastal contexts, and famous for purple fruit mess underfoot. Florida: listed invasive in parts of the state — birds seed it everywhere. If you already have it, harvest hard; if planting new, read county guidance like an adult.

  ☀️💧 Sun and Water Requirements:

  Full sun for dense growth and fruiting.
  Tolerates a range of soils; prefers deep drainage over permanent bog.
  Drought tolerance improves with age but young trees want steady moisture.

  ✂️ Propagation:

  Seeds germinate easily — which is part of the invasive story.
  Air-layering for known trees.

  🌾 Harvest / Best Use Timing:

  When fruit darkens fully and separates easily — expect purple rain on pavement.
purpose: |-
  Edible: Syzygium cumini fruits shift from astringent magenta to sweet-black when fully ripe -- cook into jam, ferment into wine, or eat out of hand while accepting purple tooth stains as temporary ink.
  Wildlife Attractor: Starlings and fruit bats move seeds into fence lines -- harvest drops before monsoon floods volunteers along drainage ditches if your region lists jambolan as a landscape escape risk.
  Shade Provider: Glossy evergreen canopy casts dense shade for understory coffee or vanilla -- roots are surface-grabbing, so mulch wide and keep heavy tillage away from trunks.
companions:
