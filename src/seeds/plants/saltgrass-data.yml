  description: "Saltgrass (Distichlis spicata) is a low, stiff, salt-tolerant grass
    of coastal salt marshes, alkali flats, and brackish margins, spreading by rhizomes
    into dense turf-like stands. Blades are gray-green, often sharply pointed, and
    inflorescences are narrow spikes held just above the foliage; height is usually
    under about 18 inches in turf form but can vary with ecotype and moisture.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun; tolerates periodic inundation with brackish
    or saline water and also seasonal dry downs.\n- In subtropical and tropical Americas it
    belongs in true coastal swales, living shorelines, and rain gardens that receive
    some salt—not in ordinary raised vegetable beds unless you are deliberately simulating
    a saline niche.\n\n✂️ Methods to Propagate:\n- Rhizome divisions: dig plugs during
    the less stressful season for your site, keep roots wet, replant into prepared
    mud or sand.\n- Seeds: collect when ripe; germination may be improved with wet/cold
    stratification depending on population.\n\n🌾 Best Use Timing:\n- Establish during
    calm tidal or irrigation windows so plugs are not washed out. Trim or graze lightly
    if managing for wildlife structure; avoid heavy machinery on saturated rhizome
    mats."
  purpose: |-
    Saltgrass is a foundational native matrix for saline wetlands and erosion control.

    - Erosion Control: Rhizomes knit soil along shorelines and canal banks against wave wash.
    - Ground Cover: Forms continuous cover where conventional lawn species die from salt.
    - Wildlife Attractor: Provides cover and nesting material for marsh birds, crabs, and other estuarine life.
    - Water Retention: Slows sheet flow in swales, spreading storm surge energy across the marsh platform.
