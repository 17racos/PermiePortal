  description: "Coral honeysuckle (Lonicera sempervirens) is a native North American
    twining vine valued for clusters of tubular red to coral flowers with yellow interiors,
    blooming heavily in late spring with scattered rebloom in summer where happy. Semi-evergreen
    in mild winters, deciduous in cold climates, it climbs 10–20 feet (3–6 m) on trellises,
    arbors, and shrubs without the strangulation reputation of invasive Asian honeysuckles.
    Hummingbirds treat it as infrastructure.\n\n☀️💧 Sun and Water Requirements:\nFull
    sun to partial shade; best flowering in high light. Average, well-drained garden
    soil with moderate moisture; tolerates short dry spells once established but not
    desert conditions. Mulch roots; avoid overhead irrigation that promotes mildew on
    crowded foliage.\n\n✂️ Propagation:\nSoftwood cuttings in early summer with hormone
    under mist. Layer low stems to soil; detach rooted portions next year. Sow seed
    after cold stratification; seedlings vary in flower color intensity.\n\n🌾 Harvest
    / Best Use Timing:\nBerries are sparse and not a human food focus—leave for birds
    if formed. Prune after main bloom to shape trellises; light summer trims encourage
    rebloom. Train new growth horizontally for more flower spur formation."
  purpose: |-
    - Pollinator: Tubular flowers target hummingbirds and long-tongued bees in early summer.
    - Wildlife Attractor: Cover for nesting birds; occasional berries for songbirds.
    - Ornamental: Clean habit and vivid color suit formal arbors without exotic invasives.
    - Erosion Control: Twining stems help cloak trellis screens on steep garden access paths.
  companions:
  - Crossvine — complementary trumpet vines on large arbor posts with staggered bloom peaks
  - Passionflower — finer textured vine for mixed vertical polycultures on sturdy supports
  - Scarlet Bee Balm — herb layer beneath trellis draws hummingbirds to a two-story buffet
  cautions:
  - Powdery Mildew — improve air flow; avoid wetting foliage late in the day
  - Asian Bush Honeysuckle nearby — do not confuse seedlings; remove invasives to reduce hybridization risk where documented
  pests:
