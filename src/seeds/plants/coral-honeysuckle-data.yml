description: |-
  Coral honeysuckle (Lonicera sempervirens) is a native North American twining vine valued for clusters of tubular red to coral flowers with yellow interiors, blooming heavily in late spring with scattered rebloom in summer where happy. Semi-evergreen in mild winters, deciduous in cold climates, it climbs 10–20 feet (3–6 m) on trellises, arbors, and shrubs without the strangulation reputation of invasive Asian honeysuckles. Hummingbirds treat it as infrastructure.

  Full sun to partial shade; best flowering in high light. Average, well-drained garden soil with moderate moisture; tolerates short dry spells once established but not desert conditions. Mulch roots; avoid overhead irrigation that promotes mildew on crowded foliage.

  Softwood cuttings in early summer with hormone under mist. Layer low stems to soil; detach rooted portions next year. Sow seed after cold stratification; seedlings vary in flower color intensity.

  Berries are sparse and not a human food focus—leave for birds if formed. Prune after main bloom to shape trellises; light summer trims encourage rebloom. Train new growth horizontally for more flower spur formation.
purpose: |-
  Pollinator: Coral-red tubes with yellow throat flare peak in late spring for ruby-throated hummingbirds moving north -- summer rebloom happens if you deadhead spent clusters before berry energy locks in.
  Wildlife Attractor: Finches pick sparse red berries when ripe -- dense twining gives cardinals nest sites off the ground without the strangulation habit of Asian bush honeysuckle.
  Ornamental: Semi-evergreen leaves stay neat on trellis compared with trumpet creeper -- good for HOA-visible posts where you still want a native plant stamp.
  Erosion Control: Root crown mulched thick at the top of a retaining wall holds soil behind lattice -- while stems veil concrete with living green.
