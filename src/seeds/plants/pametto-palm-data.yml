  description: "The Palmetto Palm (*Sabal palmetto*), also known as the Cabbage Palm,
    is native to the southeastern United States. It can reach heights of up to 20
    meters (65 feet) with a sturdy trunk and a canopy of fan-shaped fronds. The tree
    produces small, white flowers that develop into black drupes.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nPrefers full sun but can tolerate partial shade.
    Highly drought-tolerant once established but benefits from regular watering during
    prolonged dry periods.\n\n✂️\U0001FAD8 **Methods to Propagate:**\nPropagation
    is primarily through seeds, which should be cleaned and planted in moist soil.
    Germination can take several months.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nThe terminal bud, known as the \"cabbage,\" can be harvested
    for consumption, but this process kills the tree. Berries can be collected when
    ripe for propagation or wildlife feed."
  purpose: |-
    - Edible: The terminal bud is edible and known as "heart of palm."
