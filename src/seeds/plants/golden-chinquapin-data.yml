  description: "Golden chinquapin (Chrysolepis chrysophylla) is an evergreen tree to
    large shrub of moist to dry montane forests along the Pacific coast of North America,
    with leathery leaves, golden leaf undersides, and spiny burs enclosing sweet
    nuts prized by wildlife and foragers willing to negotiate spines. It fills a
    chestnut-like niche in evergreen oak-madrone matrices, feeding bears and jays
    while stabilizing steep, organic soils. For permaculture west of the Rockies,
    it is a long-lived mast source where summer drought and winter rain define the
    hydrology.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; juvenile
    plants appreciate afternoon shade in hot exposures. Prefers well-drained, acidic
    to neutral forest soils rich in organic matter; tolerates summer drought once
    established with deep mulch. Not for alkaline deserts or compacted urban fill without
    soil reconstruction. Coastal fog patterns suit its physiology; inland heat demands
    moisture access.\n\n✂️ Propagation:\nSow fresh nuts immediately; delay invites
    desiccation and rodent heists.\nTransplant only small seedlings with intact long
    roots—large specimens sulk.\n\n🌾 Harvest / Best Use Timing:\nCollect burs when
    they split; use gloves. Roasted nuts are sweet but labor-intensive—budget time
    like chestnut processing. Prune for clearance only; natural form supports wildlife
    perching and epiphyte niches."
