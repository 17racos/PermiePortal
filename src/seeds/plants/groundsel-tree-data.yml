  description: "Groundsel tree (Baccharis halimifolia) is a deciduous to semi-evergreen
    asteraceous shrub of coastal salt marshes, ditches, and wet roadsides in eastern
    North America and the Caribbean, with salt-tolerant leaves and fluffy white seed
    heads on female plants that look like cotton exploded politely. It stabilizes berms
    and brackish edges where less salt-honest shrubs die of chemistry. Some regions
    list it as invasive in disturbed wetlands—check local guidance before planting
    outside native range.\n\n☀️💧 Sun and Water Requirements:\nFull sun; tolerates
    brackish soils, periodic inundation, and sandy coastal berms. Freshwater wet ditches
    also suit it; drought on upland sand is tolerable once established but reduces
    lushness. Avoid deep shade. Hardy through warm-temperate freezes; tip burn follows
    extreme cold snaps at range edges.\n\n✂️ Propagation:\nSeeds float on wind; sow on
    moist sand for restoration plugs.\nHardwood cuttings stuck in wet media root readily
    in warm weather.\n\n🌾 Harvest / Best Use Timing:\nFor erosion control, plant before
    storm season; stake small liners in surge zones. Prune female clones near patios
    if cottony seed offends tidy aesthetics—know sex when purchasing."
  purpose: |-
