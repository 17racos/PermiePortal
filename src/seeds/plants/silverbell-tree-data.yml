  description: "Silverbell tree (Halesia carolina) is a small to medium deciduous
    tree of eastern North American rich woods and stream slopes, famous for bell-shaped
    white flowers dangling along branches before leaves fully hide them. Bark is
    subtly striped; fruits are dry drupes with wings. It is an understory-friendly
    canopy for food forests on moist, acidic sites where showy spring bloom beats
    another Bradford pear sermon.\n\n☀️💧 Sun and Water Requirements:\n- Part shade
    to full sun in cool climates; afternoon shade helps in hot summer areas.\n-
    Moisture-loving; tolerates short dry spells once established but not desert ethics.\n-
    Acidic, organic, well-drained soils; mulch with leaf mold, not dyed chunks.\n\n✂️
    Propagation:\n- Seeds: double dormancy is common—sow fresh or stratify in stages.\n-
    Softwood cuttings under mist in early summer.\n- Transplant young trees; older
    specimens resent bare-root moves.\n\n🌾 Harvest / Best Use Timing:\n- Not a crop
    tree; ornamental and wildlife values lead.\n- Prune for clearance after flowering
    to preserve next year’s bloom wood.\n- Collect seeds when capsules color and
    begin to split if propagating."
