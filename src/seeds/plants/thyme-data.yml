  description: "Thyme is a low-growing, aromatic perennial herb with woody stems and
    small, fragrant leaves. It thrives in well-drained soil and full sun, making it
    an excellent choice for borders, rock gardens, and companion planting. The plant
    produces small purple or pink flowers that attract pollinators such as bees and
    butterflies.\n\nThis hardy herb is drought-tolerant and adapts well to poor soils,
    making it a low-maintenance addition to gardens. Thyme has antimicrobial properties
    and is commonly used in culinary dishes, herbal teas, and natural medicine.\n\n
    \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Prefers full sun (6-8 hours
    of direct sunlight daily).\n- Thrives in dry, well-drained sandy or loamy soil.\n-
    Drought-tolerant; requires minimal watering once established.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- **Seeds**: Sow indoors in early spring or direct sow
    after the last frost.\n- **Cuttings**: Take softwood cuttings in spring and root
    in moist soil.\n- **Division**: Separate mature plants in early spring or fall.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Harvest leaves throughout the growing season.\n- Best flavor
    is achieved just before flowering.\n- Cut stems and dry them for long-term storage."
  purpose: |-
    Thyme serves multiple roles in permaculture systems:

    - Edible: Used fresh or dried in culinary dishes.
    - Medicinal: Has antibacterial, antifungal, and immune-boosting properties.
    - Pollinator: Attracts bees and butterflies.
    - Wildlife Attractor: Provides nectar for beneficial insects.
    - Mulcher: Can be used as a ground cover to retain moisture.
    - Dynamic Accumulator: Draws minerals from the soil and enriches compost.
    - Border Plant: Helps define garden edges and pathways.
    - Pest Management: Repels cabbage worms, mosquitoes, and other pests.
