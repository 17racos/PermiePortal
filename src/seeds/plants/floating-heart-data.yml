  description: |-
    Nymphoides aquatica is a Southeast native floating-leaf plant with round, lily-pad-like foliage and small white flowers held above the water. It spreads by runners and can carpet quiet pond bays — excellent shade for fish, frog perches, and dragonfly drama. The "banana plant" nickname comes from chunky winter tubers the aquarium hobby loves; in nature those tubers help it survive dry-downs.
    
    In subtropical and tropical Americas it is right at home in sheltered, acidic to neutral ponds. In tiny water features, thin runners so it does not smother everything.
    
    ☀️💧 Sun and Water:
    - Full sun to light shade; flowers best with sun.
    - Still or slow water; rooted in bottom muck with floating leaves.
    - Do not let the pond dry completely for long if you want to keep stands.
    
    ✂️ Propagation:
    - Detach plantlets from runners.
    - Tubers can be planted in submerged substrate in spring.
    
    🌾 Harvest / Best Use Timing:
    - Thin floating mats when coverage blocks light for submersed plants you value.
    - Work in cool morning air so broken fragments drift less.
    - Compost removed biomass in active piles; do not toss live pieces into new water bodies.
  purpose: |-
    Wildlife Attractor: Floating Heart layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
