  description: "Nymphoides aquatica is a Southeast native floating-leaf plant with
    round, lily-pad-like foliage and small white flowers held above the water. It
    spreads by runners and can carpet quiet pond bays — excellent shade for fish,
    frog perches, and dragonfly drama. The \"banana plant\" nickname comes from
    chunky winter tubers the aquarium hobby loves; in nature those tubers help it
    survive dry-downs.\n\nIn subtropical and tropical Americas it is right at home in sheltered, acidic
    to neutral ponds. In tiny water features, thin runners so it does not smother
    everything.\n\n☀️💧 Sun and Water:\n- Full sun to light shade; flowers best with
    sun.\n- Still or slow water; rooted in bottom muck with floating leaves.\n- Do
    not let the pond dry completely for long if you want to keep stands.\n\n✂️ Propagation:\n-
    Detach plantlets from runners.\n- Tubers can be planted in submerged substrate in
    spring."
  purpose: |-
    Floating heart is living pond infrastructure:

    - Wildlife Attractor: Pollinators to flowers; habitat structure under pads.
    - Border Plant: Visual and ecological transition in shallow, quiet water.
  companions:
  - Watershield
  - Spatterdock
  - Duck Potato
  cautions:
  - None documented
  pests:
  - Aphids
  - Snails
  practitioner_notes: |-
    Free-floating leaves travel with wind—skim escapees before they clog intakes.
    Overwinters as dormant bud on bottom in hard freeze zones—spring looks empty until warm days.
    Fish graze tender leaves—expect holes if stocked with large herbivores.
