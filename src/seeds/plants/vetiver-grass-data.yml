  description: "Vetiver Grass (Chrysopogon zizanioides) is a fast-growing, clump-forming
    perennial grass native to India. It can grow up to about 5 feet (1.5 m) tall with
    a dense, fibrous root system that can extend over 10 feet (3 m) deep, making
    it highly effective for erosion control. Unlike many grasses, it does not run
    by rhizomes but stays in a tight clump, limiting invasive spread.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun; tolerates poor and degraded soils when drainage stays honest.\nDrought-resistant once established but benefits from regular watering during early growth.\n\n✂️ Propagation:\n\nPrimarily root divisions; seeds are often sterile.\nPlant at the start of the rainy season for fastest establishment.\n\n🌾 Harvest / Best Use Timing:\n\nCut for mulch or fodder several times per year when stands reach about 3–5 feet (about 1–1.5 m)."
  purpose: |-
    - Erosion Control: Deep roots bind slopes and riverbanks without running off-site.
    - Mulcher: Long leaves chop into nutrient-rich mulch for moisture and weed suppression.
    - Dynamic Accumulator: Mines phosphorus and other nutrients useful for rehabilitating poor soils.
    - Windbreaker: Dense linear hedges deflect wind across field edges.
    - Animal Fodder: Leaves feed stock best when cut young for nutrition.
    - Pest Management: Aromatic roots repel some termites and insects in traditional use.
    - Water Purifier: Hedgerows slow runoff and polish water moving through vegetated filter strips.
    - **Water Purifier**:  Used in phytoremediation to remove toxins from soil and water.
