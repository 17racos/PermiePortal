  description: 'Vetiver Grass (Chrysopogon zizanioides) is a fast-growing, clump-forming perennial grass native to India.
    It can grow up to about 5 feet (1.5 m) tall with a dense, fibrous root system that can extend over 10 feet (3 m) deep,
    making it highly effective for erosion control. Unlike many grasses, it does not run by rhizomes but stays in a tight
    clump, limiting invasive spread.


    ☀️💧 Sun and Water Requirements:


    Full sun; tolerates poor and degraded soils when drainage stays honest.

    Drought-resistant once established but benefits from regular watering during early growth.


    ✂️ Propagation:


    Primarily root divisions; seeds are often sterile.

    Plant at the start of the rainy season for fastest establishment.


    🌾 Harvest / Best Use Timing:


    Cut for mulch or fodder several times per year when stands reach about 3–5 feet (about 1–1.5 m).'
