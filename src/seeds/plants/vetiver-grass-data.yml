  description: "Vetiver Grass (Chrysopogon zizanioides) is a fast-growing, clump-forming
    perennial grass native to India. It can grow up to 1.5 meters (5 feet) tall with
    a dense, fibrous root system that can extend over 3 meters (10 feet) deep, making
    it highly effective for erosion control. Unlike other grasses, it does not spread
    via rhizomes but remains in a tight clump, preventing it from becoming invasive.
    \n\nVetiver prefers full sun and can tolerate a wide range of soils, including
    poor and degraded soils, as long as they are well-draining. It is drought-resistant
    but benefits from regular watering in its early growth stages. Propagation is
    primarily done through root divisions, as its seeds are often sterile. It is best
    planted at the start of the rainy season for optimal establishment.\n\nVetiver
    can be harvested for mulch or fodder multiple times a year, typically when it
    reaches about 1–1.5 meters (3–5 feet) in height."
  purpose: |-
    - **Erosion Control**: Vetiver's deep root system binds soil effectively, preventing erosion on slopes and riverbanks.
    - **Mulcher**: The long leaves can be cut and used as a nutrient-rich mulch to retain moisture and suppress weeds.
    - **Dynamic Accumulator**: Vetiver accumulates nutrients like phosphorus, making it useful for rehabilitating poor soils.
    - **Windbreaker**: Its dense growth creates a natural wind barrier, protecting crops from strong winds.
    - **Animal Fodder**: The leaves provide fodder for livestock, although they should be cut young for higher nutritional value.
    - **Pest Management**: Vetiver is known to repel certain pests, including termites and some insect species, due to its aromatic roots.
    - **Water Purifier**:  Used in phytoremediation to remove toxins from soil and water.
