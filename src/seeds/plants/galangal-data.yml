  description: "Galangal (*Alpinia galanga*) is a tropical perennial herb native to
    Southeast Asia, belonging to the ginger family, Zingiberaceae. The plant typically
    reaches heights of 1.5 to 2 meters, featuring long, lanceolate green leaves measuring
    approximately 25-35 cm in length. It produces small, aromatic flowers that are
    white with deep-red streaks, blooming at the top of the plant. The rhizomes are
    similar in appearance to ginger but are smaller and have a distinct, pungent aroma
    with flavors reminiscent of citrus, black pepper, and pine needles.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nGalangal thrives in partial shade and requires moist,
    fertile, well-drained soil. Regular watering is essential to maintain consistent
    soil moisture, but ensure the soil is not waterlogged to prevent root rot.\n\n✂️\U0001FAD8
    Methods to Propagate:\nPropagation is primarily achieved through division of the
    rhizomes. Select healthy rhizomes with at least two \"eyes\" or growth nodes.
    Plant the rhizome sections approximately 5 cm deep in well-prepared soil during
    the warm season, ensuring adequate spacing to accommodate mature plant size.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nThe rhizomes are typically ready for harvest 10 to 12 months
    after planting, once the plant's aerial parts begin to yellow and die back. Carefully
    dig around the base to extract the rhizomes without causing damage."
