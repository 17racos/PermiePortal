  description: 'Blanket flower (Gaillardia aristata) is a showy, drought-tolerant perennial wildflower from the Great Plains
    of North America, widely grown in gardens for daisy-like blooms with red-brown centers and yellow-tipped ray petals. Plants
    form low clumps of hairy gray-green leaves and typically reach 30–60 cm (12–24 inches) tall in bloom, with a similar spread.


    🌞💧 Sun and Water Requirements:

    - Full sun (6+ hours) for strongest flowering; leggy growth in shade.

    - Well-drained soil; highly drought-tolerant once established. In subtropical and tropical Americas, avoid constantly
    wet roots during humid wet season; raised beds or sandy mix reduce rot risk.

    - Water deeply but infrequently during establishment; mature plants tolerate dry spells.


    ✂️ Methods to Propagate:

    - Seeds: Sow indoors 6–8 weeks before last cool period or direct-sow after soil warms; germination in about 2–3 weeks.

    - Division: Split mature clumps in late winter or early spring before strong growth resumes; replant immediately and keep
    moist until rooted.


    🌾 Harvest / Best Use Timing:

    - Cut flowers for bouquets when petals are fully open. Deadhead spent blooms to prolong flowering in warm months. Leave
    some seedheads if you want self-sowing and finch feed.'
