description: |-
  Lemon basil is the citrus-leaning Ocimum hybrid group sold for teas, fish, and salads—bright lemon aroma without stealing a tree’s thunder. Flowers still feed bees if you stop pinching for a week.

  Grow spring through fall like other basils; bolts in heat waves—harvest tips and flower spikes to stretch production. Frost is the hard stop.

  Full sun, fertile well-drained soil, steady moisture.
  Container culture works if you accept daily water checks in August.

  Seed; soft cuttings root in water or moist media.

  Pinch tips and flower spikes through the season for continuous leaves; harvest before hard frost stops growth.
purpose: |-
  Edible: Ocimum × citriodorum leaves carry citral-forward aroma for fish, teas, and sorbet -- pinch tips weekly; flowering shifts oil profile, so harvest before buds open if pesto clarity is the goal.
  Pollinator: Small white lipped flowers feed honeybees when you stop deadheading -- allow a few stems to bloom at season end if seed-saving matters more than soft-tip harvest.
  Pest Management: Lemon volatiles join other aromatic rows to blur host-finding cues for aphids -- still inspect undersides because scent is one tool, not a force field.
