  purpose: |-
    Ornamental: Blue Flag Iris earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Wildlife Attractor: Blue Flag Iris layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
