  description: "Southern crabapple (Malus angustifolia) is a native thorny shrub to small tree of southeastern North American wood margins, bearing fragrant pink-white spring flowers and small yellow-green crabapples that hang into winter for wildlife. Heights of 10–25 feet (3–7.5 m) occur, often multi-stemmed with suckers. Fruit is tart for human preserves; birds treat it as winter currency.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best flowering with morning sun. Moist, well-drained soils suit it; tolerates periodic dry spells once established with mulch. Avoid waterlogging on heavy clay without grade work.\n\n✂️ Propagation:\nSow stratified seed; graft selections for landscape consistency. Prune for open centers to reduce scab and fire blight pressure.\n\n🌾 Harvest / Best Use Timing:\nPick crabapples when fully colored for jelly; leave some for birds. Bloom follows local spring warmth after frost risk near 28°F (-2°C) declines."
  purpose: |-
    - Edible: Tart fruit supports jellies and pectin sources where sugar balances acid.
    - Wildlife Attractor: Flowers feed pollinators; fruit feeds birds through lean seasons.
    - Pollinator: Spring bloom fills an early nectar window at forest edges.
    - Border Plant: Thorns and suckers define hedgerows when managed.
  companions:
