  description: 'Florida paintbrush (Carphephorus corymbosus) is a robust herbaceous perennial of sandy pine flatwoods, scrubby
    edges, and ruderal openings in the southeastern United States, crowned in late warm season by flat-topped clusters of
    bright pink to lavender disc florets that pull butterflies from across the county. Stems often reach 2–4 feet (0.6–1.2
    m) when blooming, with alternate leaves and a slightly hairy texture that reads honest, not manicured. It is a flagship
    forb for native meadow mixes in humid subtropical climates where irrigation is optional and drainage is not negotiable.


    ☀️💧 Sun and Water Requirements:

    Full sun to very light shade; shade quickly reduces flowering. Dry to mesic, well-drained sandy soils match natural sites;
    tolerates drought after establishment but not chronic bogging. Avoid heavy clay unless you enjoy watching asteraceous
    optimism drown.


    ✂️ Propagation:

    Sow seed in fall where winters provide natural stratification, or cold-stratify before spring sowing. Divide basal rosettes
    during cool moist weather; keep roots damp until replanted. First-year plants are modest—design for second-year drama.


    🌾 Harvest / Best Use Timing:

    Leave inflorescences standing for late pollinators and winter structure; cut back in late winter before new growth if
    tidy edges matter. Collect ripe seed heads for propagation projects once achenes mature—expect fluff and patience.'
