  description: "Banana passionfruit is a high-vigor passionflower vine with soft,
    lobed leaves and pink to rose flowers followed by elongated, yellow, aromatic
    fruit with tart, seedy pulp. Taxonomy is a moving target—**P. tarminiana** and
    related **P. tripartita** types show up under similar common names. Fruit quality
    varies; some selections are genuinely delicious, others are feral cat energy in
    fruit form.\n\nInvasion alert: this group has wreaked havoc in Hawaii and parts
    of the Pacific. In mainland subtropical and tropical Americas treat it like a supervised exotic:
    prune hard, harvest every fruit, do not let it run into wild hammocks or parks.\n\nSun
    and water: Full sun to light afternoon shade in brutal heat. Rich, well-drained
    soil with steady moisture during growth; reduce water somewhat in cool winter if
    leaves yellow. Wind protection helps tender new growth.\n\nPropagation: Seeds
    (variable offspring); semi-hardwood cuttings; layering. Named types are best kept
    from cuttings for predictable fruit."
  purpose: |-
    Vertical food on a sturdy trellis or fence; flowers feed bees and passion-vine
    specialists. The permie tradeoff is yield vs. vigilance—if you will not manage
    it, plant a less hungry native passiflora instead.
