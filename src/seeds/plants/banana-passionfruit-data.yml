  description: "Banana passionfruit is a high-vigor passionflower vine with soft,
    lobed leaves and pink to rose flowers followed by elongated, yellow, aromatic
    fruit with tart, seedy pulp. Taxonomy is a moving target—**P. tarminiana** and
    related **P. tripartita** types show up under similar common names. Fruit quality
    varies; some selections are genuinely delicious, others are feral cat energy in
    fruit form.\n\nInvasion alert: this group has wreaked havoc in Hawaii and parts
    of the Pacific. On the mainland, treat it like a supervised exotic:
    prune hard, harvest every fruit, do not let it run into wild hammocks or parks.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to light afternoon shade in brutal heat.\nRich, well-drained
    soil with steady moisture during growth; reduce water somewhat in cool winter if
    leaves yellow.\nWind protection helps tender new growth.\n\n✂️ Propagation:\n\nSeeds
    (variable offspring); semi-hardwood cuttings; layering. Named types are best kept
    from cuttings for predictable fruit.\n\n🌾 Harvest / Best Use Timing:\n\nPick elongated fruit when color and aroma say ripe; eat, process, or destroy every fruit before drop where seed spread is a liability."
  purpose: |-
    - Edible: Vertical food on a sturdy trellis or fence when fruit is managed every cycle.
