  description: 'Milk vetch (Astragalus canadensis) is a long-lived leguminous perennial of prairies and open woodland edges,
    bearing pinnate gray-green leaves and upright spikes of cream to pale yellow pea-flowers followed by inflated pods. Mature
    plants often reach 2–3 feet tall with a deep taproot and rhizomatous spread in favorable sites—classic “fix nitrogen first,
    ask questions later” energy.


    subtropical and tropical Americas: Outside its core range it is a specialty plant; humid heat and poorly drained clay
    can invite root grief. If trialed, give full sun, sharp drainage on a slope or berm, and accept that it may sulk where
    tropical legumes would party.


    ☀️💧 Sun and Water Requirements:

    - Full sun for honest flowering and nodulation; shade reduces vigor and rhizobia paychecks.

    - Medium to dry-mesic, well-drained soil once established; young plants need steady moisture to install their taproot
    elevator.


    ✂️ Propagation:

    - Scarify seed (file or hot water soak) and direct-sow in late fall or early spring; inoculate with appropriate rhizobia
    if your soil is rhizobia-poor.

    - Division of mature crowns is possible but slower than seed; take pieces with buds in cool, wet weather.


    🌾 Harvest / Best Use Timing:

    - For fodder or mulch, cut before full seed set if you want to limit spread; pods are ornamental but self-sowing can get
    chatty.

    - Seed harvest when pods rattle but before explosive dehiscence turns your shirt into a seed bank.'
  purpose: |-
    Nitrogen Fixer: Nitrogen fixation is the point on lean ground: Mature plants often reach 2 - 3 feet tall with a deep taproot and rhizomatous spread in favorable sites -- classic “fix nitrogen first, ask questions later” energy. -- feeds guild neighbors through root turnover, nodule decay, and leaf litter instead of bagged inputs
    Wildlife Attractor: Milk Vetch layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- feeds insect and bird guilds so edges read as habitat instead of tidy monoculture voids
    Pollinator: Pollinator service is measurable at the flower: Milk vetch (Astragalus canadensis) is a long-lived leguminous perennial of prairies and open woodland edges, bearing pinnate gray-green leaves and upright spikes of cream to pale yellow pea-flowers followed by inflated pods. -- keeps nectar and pollen online through the heat when weaker flowers quit, stabilizing yields on adjacent crops
    Animal Fodder: Milk Vetch offers palatable leaves, pods, or seeds for poultry and ruminants when introduced slowly like any new forage -- cuts purchased feed pressure when offered fresh, wilted, or ensiled alongside your main forage plan
  companions:
