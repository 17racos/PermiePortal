  description: |-
    Milk vetch (Astragalus canadensis) is a long-lived leguminous perennial of prairies and open woodland edges, bearing pinnate gray-green leaves and upright spikes of cream to pale yellow pea-flowers followed by inflated pods. Mature plants often reach 2–3 feet tall with a deep taproot and rhizomatous spread in favorable sites—classic “fix nitrogen first, ask questions later” energy.

    subtropical and tropical Americas: Outside its core range it is a specialty plant; humid heat and poorly drained clay can invite root grief. If trialed, give full sun, sharp drainage on a slope or berm, and accept that it may sulk where tropical legumes would party.

    ☀️💧 Sun and Water Requirements:
    - Full sun for honest flowering and nodulation; shade reduces vigor and rhizobia paychecks.
    - Medium to dry-mesic, well-drained soil once established; young plants need steady moisture to install their taproot elevator.

    ✂️ Propagation:
    - Scarify seed (file or hot water soak) and direct-sow in late fall or early spring; inoculate with appropriate rhizobia if your soil is rhizobia-poor.
    - Division of mature crowns is possible but slower than seed; take pieces with buds in cool, wet weather.

    🌾 Harvest / Best Use Timing:
    - For fodder or mulch, cut before full seed set if you want to limit spread; pods are ornamental but self-sowing can get chatty.
    - Seed harvest when pods rattle but before explosive dehiscence turns your shirt into a seed bank.
  purpose: |-
    - Nitrogen Fixer: Rhizobia in root nodules convert atmospheric N into plant-available forms, quietly subsidizing neighbors.
    - Wildlife Attractor: Flowers feed native bees; pods feed seed-eating birds willing to work for lunch.
    - Pollinator: Pea-family architecture specializes in bee tripping mechanics—efficient, no TED talk required.
    - Animal Fodder: Palatability varies; rotational grazing contexts exist, but verify local Astragalus toxicity lore before feeding the herd a science experiment.
  companions:
  - Echinacea — complementary prairie forb; milk vetch banks nitrogen while echinacea handles retail pollinator traffic up top.
  - Yarrow — deep, droughty pockets beside mesic milk vetch create micro-niches so one bed supports multiple water personalities.
  - Comfrey — chop-and-drop feeds the soil food web that protects legume roots from stupid human neglect.
  cautions:
  - None documented
  pests:
