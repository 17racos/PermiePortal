  description: |-
    Daikon radish (Raphanus sativus var. longipinnatus) is a cool-season root crop grown for its long, crisp taproot and peppery leaves. It originates in East Asia and is widely cultivated across temperate climates for fresh eating, stir-fries, and pickling. Plants typically form a rosette of foliage and a root that can reach 30–60 cm (12–24 in) depending on variety. In permaculture, it earns its keep by punching into compacted soil, feeding the food chain with edible biomass, and improving bed structure when harvested and composted.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for best root development; partial shade slows growth.
    - Keep soil evenly moist; drought stresses roots and makes them woody.
    - Prefers loose, deep, well-drained soil with compost; remove stones that deform roots.
    - Cool weather is the friend; heat can shorten roots and trigger bolting.
    
    ✂️ Propagation:
    - Seeds (direct sow): sow in rows after soil cools to workable temperatures; germination often occurs in 3–7 days.
    - Succession sow: repeat every 2–3 weeks in mild weather for staggered harvest.
    - Thinning: thin to final spacing early so roots have room to expand.
    
    🌾 Harvest / Best Use Timing:
    - Harvest when roots reach usable diameter and length; many varieties mature in 50–70 days.
    - For greens: cut outer leaves earlier and let the plant keep leaf-producing until you pull the root.
    - Store cool; keep slightly humid so roots don’t shrivel.
