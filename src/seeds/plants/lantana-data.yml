  description: "Lantana is a perennial flowering shrub native to Central and South
    America, growing between 0.3 to 1.8 meters (1-6 feet) tall. It features clusters
    of small, brightly colored flowers that can change hues as they mature, attracting
    butterflies, bees, and hummingbirds. The leaves are coarse, lightly toothed, and
    emit a pungent scent when crushed. Lantana is highly adaptable, tolerating heat,
    drought, and salt, making it suitable for various landscapes. However, in certain
    regions, it is considered invasive due to its rapid growth and ability to outcompete
    native vegetation.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nThrives
    in full sun, requiring at least six hours of direct sunlight daily. Prefers well-drained
    soil and is drought-tolerant once established. Overwatering should be avoided
    to prevent root rot.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagated through
    seeds or semi-hardwood cuttings. Seeds should be sown in warm conditions, while
    cuttings taken in late spring or early summer can root in moist, well-draining
    soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nWhile lantana
    is primarily ornamental, if harvesting for decorative purposes or traditional
    uses, collect flowers when in full bloom. Note: All parts of the plant are toxic
    if ingested; handle with care."
  purpose: |-
    Pollinator: Lantana camara flower heads change color as they age, signaling nectar status to butterflies and skippers -- mass drifts because hummingbirds and hawkmoths cruise for volume, not singleton stems.
    Wildlife Attractor: Dense twigs give cover to small reptiles while ripe black drupes feed songbirds -- invasive warnings apply in humid subtropics, so check regional lists before letting berries reach fence lines.
    Ground Cover: Trailing cultivars knit hot, dry banks where turf fails -- still plan editing because stems root where tips touch soil.
    Border Plant: Mounding types edge paths with continuous bloom -- all parts are toxic if eaten, so site away from toddler forage curricula and pet chew toys.
