  description: "Black chokeberry (Aronia melanocarpa) is a suckering North American shrub cultivated for dense clusters of\
    \ purple-black, astringent berries used in juice, wine, and antioxidant-rich products, plus red fall foliage and white\
    \ May blossoms. Plants commonly reach 3–6 feet (0.9–1.8 m), forming thickets useful in hedgerows, rain-garden margins,\
    \ and multifunctional borders. Unlike sweet dessert bushes, aronia tells the truth in the mouth—tannins first, sugar in\
    \ the kitchen.\n\n ☀️\U0001F4A7 Sun and Water Requirements:\nFull sun maximizes flowering, anthocyanins, and yield; partial\
    \ shade works but thins fruit. Tolerates wet, acidic soils better than many fruit shrubs; still avoid permanently stagnant\
    \ crowns. Organic mulch maintains soil moisture and feeds the shallow root mat.\n\n✂️ Propagation:\nSoftwood cuttings\
    \ in early summer root under humidity. Divide suckers in spring with roots attached for fast hedge extension. Seeds require\
    \ cold stratification; clones preserve named cultivar traits like larger berries or upright habit.\n\n\U0001F33E Harvest\
    \ / Best Use Timing:\n Pick when berries are fully black, glossy, and detach with a gentle tug test on sample clusters.\
    \ Freeze before pressing for juice to improve yield. Renew pruning by removing oldest canes after several years to keep\
    \ production on vigorous wood."
