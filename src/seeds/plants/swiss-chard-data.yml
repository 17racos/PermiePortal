  description: |-
    Swiss chard (Beta vulgaris subsp. cicla) is a leafy biennial grown as a perennial-in-use green in mild climates, valued for its colorful stems and nutritious, tender leaves. It is native to the Mediterranean region and has been cultivated for centuries as a kitchen vegetable. Plants typically reach about 30–90 cm (12–35 in) tall depending on harvest style. In permaculture, Swiss chard matters because it keeps producing leaf biomass through cool seasons, shades soil with its canopy, and turns that leafy energy into edible nutrition and compost inputs.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to partial shade; partial shade reduces bolting and bitterness in warmer periods.
    - Keep soil consistently moist; drying triggers tougher leaves and faster flowering.
    - Prefers fertile, well-drained soil with compost.
    - Avoid waterlogged beds; root issues reduce leaf output.
    
    ✂️ Propagation:
    - Seeds: direct-sow in cool weather; germination often occurs in 7–14 days.
    - Thin seedlings early so leaves have room to expand.
    - Succession sow: repeat every 1–2 weeks to spread harvest and prevent “one day everything is done.”
    
    🌾 Harvest / Best Use Timing:
    - Harvest outer leaves as needed; cut near the base so the crown keeps pushing new growth.
    - For tender leaves, harvest young and frequently.
    - Store in the fridge and use promptly for best texture.
  purpose: |-
    Edible: Leaf harvest provides consistent nutrition from small bed footprints across cool-season windows.
    Medicinal: Leaf-based traditional use supports supportive dietary patterns; in permaculture it becomes on-site kitchen herb/green.
    Water Retention: Dense leaf canopy shades soil and moderates evaporation, keeping root-zone moisture steadier.
  companions:
  - Garlic (Allium sativum) — allium aroma helps diversify pest landscape and supports rotation scheduling.
  - Lettuce (Lactuca sativa) — shared cool-season timing and manageable moisture needs for layered bed planting.
  - Radish (Raphanus sativus) — quick roots loosen soil and create a rotation-friendly rhythm for successive greens.
  cautions:
  - Heat triggers bolting; use partial shade and succession sowing when temperatures rise.
  practitioner_notes: |-
    Harvest outer leaves often; leaving them too long turns leaves fibrous.
    Keep soil moisture steady—chard punishes dry swings with bitterness.
    If leaves look pale, top-dress compost and check drainage before blaming “bad genetics.”
  pests:
  - Aphids
  - Slugs
  - Caterpillars
  - Root Rot
