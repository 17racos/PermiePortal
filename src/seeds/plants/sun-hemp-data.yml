  description: "Sun Hemp (*Crotalaria juncea*) is a fast-growing annual legume primarily
    cultivated as a cover crop and green manure. It grows upright, reaching heights
    of 1 to 3.5 meters (3 to 11.5 feet) with fibrous, ridged stems. The leaves are
    oblong-lanceolate, spirally arranged along the stem, measuring 4 to 12 centimeters
    (1.5 to 4.7 inches) in length. It produces bright yellow, pea-like flowers in
    terminal clusters, followed by small seed pods containing black or brown seeds.
    Its deep taproot improves soil aeration while fixing nitrogen into the soil. \n\n✂️\U0001FAD8
    Methods to Propagate:\nSun Hemp is best propagated through direct seeding. Seeds
    should be sown at a depth of 1.5 to 2.5 centimeters (0.6 to 1 inch) in warm, well-drained
    soil when temperatures exceed 20°C (68°F). Germination occurs within 3 to 7 days.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nThis plant thrives in full sun and prefers well-drained
    sandy or loamy soils with a neutral to slightly acidic pH. It is drought-tolerant
    but benefits from occasional watering in dry conditions.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nIf used as green manure, Sun Hemp should be incorporated into
    the soil before flowering (around 8 to 12 weeks after planting). For fiber production,
    it should be harvested at full bloom when stems are at their strongest."
  purpose: |-
    In permaculture, Sun Hemp serves multiple functions:
    - Nitrogen Fixer: Improves soil fertility by fixing atmospheric nitrogen through root nodules.
    - Mulcher: Provides biomass for mulch, suppressing weeds and enhancing soil moisture retention.
    - Dynamic Accumulator: Extracts deep soil nutrients, making them available for future crops.
    - Erosion Control: Its deep root system stabilizes soil and prevents erosion.
    - Biofuel: Has potential for biomass-based fuel production.
