  description: "Beaked hazelnut (Corylus cornuta) is a cold-hardy deciduous shrub
    of northern and montane North America, recognizable by elongated leafy husks that
    project like a beak beyond the small nut. Plants form thickets roughly 6–15 feet
    (2–4.5 m) in sunnier openings or woodland edges, flowering in very early spring
    when catkins shed pollen on wind. The nuts are prized by wildlife and patient humans,
    fitting hedgerows, forest gardens, and slope stabilization projects in cool-temperate
    climates.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; best
    nut production with strong light. Prefers moist, well-drained, humus-rich soils;
    tolerates rocky slopes and cold winters far better than heat. Mulch to protect
    shallow roots; drought during kernel fill reduces quality.\n\n✂️ Propagation:\nSow
    fresh nuts after cold stratification or outdoors in rodent-excluding beds. Layer
    low stems to ground; separate rooted shoots after one growing season. Dig suckers
    with roots in early spring.\n\n🌾 Harvest / Best Use Timing:\nCollect when husks
    begin to brown and nuts loosen inside, typically late summer to fall in northern
    areas. Dry before storage; roast to improve flavor and shelling. Expect heavy losses
    to jays and squirrels unless you time harvest aggressively."
  purpose: |-
    - Edible: Small kernels reward roasting and baking where commercial hazels are marginal.
    - Wildlife Attractor: Catkins, pollen, and nuts support early-season insects and vertebrates.
    - Erosion Control: Suckering roots stabilize forest roadsides and cut banks.
    - Mulcher: Leaf litter feeds soil fungi typical of northern hardwood edges.
  companions:
  - Paper Birch — light canopy and shared mycorrhizal networks on cool slopes
  - Highbush Blueberry — acidic organic understory without overshading hazels
  - Wild Strawberry — ground cover that tolerates nut drop and seasonal shade
  cautions:
  - Eastern Filbert Blight — less susceptible than some Corylus avellana cultivars but not immune; scout cankers
  - Competing turf right to the trunk — mower damage and vole cover increase risk
  pests:
  - Japanese Beetles
  - Borers
  practitioner_notes: |-
    The “beak” on the husk is the field ID—if it is round and squat, you are holding a different hazel story.
    Pollen flies on wind—planting density improves nut set more than a single lonely hero shrub.
    Jays are louder than squirrels and steal with daylight confidence; listen for your harvest alarm.
    Northern genetics hate sudden southern heat waves—expect tip burn at the warm edge of the range.
  growth_habit: Suckering deciduous shrub; long-beaked husks; early catkins
