description: |-
  Bacupari is a rainforest Garcinia relative — small to medium tree, latex, and tart aromatic fruit used fresh and in preserves. This is not grocery-store mango reliability; it is a collector’s lowland fruit for humid tropics. subtropical and tropical Americas is basically a greenhouse cosplay unless you have serious protection and patience. Part shade when young, rich organic soil, and steady moisture mirror its native understory-to-canopy trajectory.

   🌞💧 Sun and Water Requirements:
  - Young trees: bright shade transitioning to full sun as canopy develops.
  - Consistent moisture; intolerant of long drought while establishing.
  - Mulch heavily; roots appreciate cool, fungal soil.

  ✂️🫘 Methods to Propagate:
  - Fresh seeds.
  - Grafting superior selections where available.

  🧑‍🌾👩‍🌾 When to Harvest:
  - Pick when color and aroma say ripe for your landrace/cultivar — Garcinias punish guessing.
purpose: |-
  Edible: Garcinia gardneriana thin-skinned yellow fruit runs tart-aromatic for fresh nibbling and high-acid preserves -- bruises in deep harvest bins, so use trays and process same day in humid heat.
  Wildlife Attractor: Ripe soft fruit pulls tanagers and fruit bats in lowland forest margins -- net outdoor collections if humans need a fair share beyond what falls to the ground crew.
  Shade Provider: Small rainforest tree crown starts bright-shade for young cacao and understory ginger before the canopy matures -- root zone wants heavy mulch, not string-trimmer scalpels.
companions:
- Cacao
