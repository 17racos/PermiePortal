  description: 'Bay bean (Canavalia rosea) is a pantropical creeping legume of beaches, dunes, and coastal roadsides, forming
    long trailing stems with trifoliate leathery leaves and pink-purple pea flowers followed by long pods. It carpets sand
    where salt spray and shifting substrate exclude most crops, stabilizing foredunes and berm edges in humid subtropical
    to tropical climates. Growth is low and spreading, rooting at nodes, with stems potentially spanning many feet along the
    ground.


    ☀️💧 Sun and Water Requirements:

    Full sun; requires free-draining sand and tolerates salt aerosols and occasional saltwater overwash better than inland
    legumes. Low to moderate rainfall once established; irrigate young plantings in dry season to speed coverage. Avoid heavy
    clay inland soils that hold cold wet in marginal winters.


    ✂️ Propagation:

    Direct-sow scarified seed into warm sand after frost danger in marginal zones; year-round in true tropics. Take nodal
    cuttings with roots attached from runners; keep humid until anchored. Do not move beach collections where local laws protect
    native dunes—use nursery-grown seed sources.


    🌾 Harvest / Best Use Timing:

    Pods and seeds can be toxic if unprepared; treat as erosion-control and wildlife plant unless you have expert processing
    knowledge. Trim runners to direct growth along desired dune lines before wet season storms. Document coverage seasonally
    for restoration monitoring.'
