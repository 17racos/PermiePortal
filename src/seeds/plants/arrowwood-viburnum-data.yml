    Border Plant: Arrowwood Viburnum tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate
    Erosion Control: Erosion control needs roots that grip: It is a workhorse for hedgerows, utility strips, and rain-garden berms where soil fluctuates between moist and average. -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ornamental: Arrowwood Viburnum earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
