  description: "Arrowwood viburnum (Viburnum dentatum) is a durable deciduous shrub
    native across much of eastern North America, forming a rounded clump typically
    6–10 feet (2–3 m) with coarsely toothed leaves and flat white flower clusters in
    late spring. Metallic blue-black drupes ripen in late summer to fall, a critical
    fat source for migrating birds. It is a workhorse for hedgerows, utility strips,
    and rain-garden berms where soil fluctuates between moist and average.\n\n☀️💧 Sun
    and Water Requirements:\nFull sun to partial shade; best fruiting with at least
    several hours of direct sun. Adapts to a wide soil range from sandy to heavy clay
    if drainage is not stagnant; tolerates periodic wet feet better than many upland
    shrubs. Mulch to reduce weed competition while young.\n\n✂️ Propagation:\nSow cleaned
    seed after warm-moist then cold-moist stratification, or direct-sow in fall. Softwood
    cuttings in early summer with hormone under mist. Layer low branches; detach after
    rooting.\n\n🌾 Harvest / Best Use Timing:\nBerries are astringent for humans—leave
    them for wildlife or use only in experimental preserves with heavy sweetening. Prune
    immediately after flowering if you must reduce height; late cuts remove next year’s
    blooms. Renew old thickets by removing a few oldest canes at the base yearly."
  purpose: |-
