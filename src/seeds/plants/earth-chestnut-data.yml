description: |-
  Earth chestnut (*Lathyrus tuberosus*) is a climbing perennial legume from Europe and western Asia, grown for small edible tubers and as a nitrogen-fixing vine along fences and trellises. Compound leaves and pink pea flowers appear in summer; underground, it forms chains of starchy tubers resembling small potatoes. Vines can reach 4–6 feet with support. In subtropical and tropical Americas it is best treated as a cool-season or high-elevation crop—lowland humid summers can stress it, while winter in subtropical zones is often mild enough for establishment if drainage is good.

  🌞💧 **Sun and Water Requirements:**
  Sun to light afternoon shade. Soil should be fertile but well drained; constant wet feet invite rot. In hot humid periods, mulch and morning sun reduce leaf stress.

  ✂️ **Methods to Propagate:**
  - **Tubers:** Plant dormant tubers in late winter or early spring at several inches deep, oriented like small potatoes.
  - **Seeds:** Scarify and soak seed; sow after soil warms. Seedlings take a year or more to form harvestable tubers.

  🧑‍🌾 **When to Harvest:**
  Dig tubers after tops yellow in late summer or fall, or during mild winter in frost-free areas. Cure briefly in shade, then store cool and dry. Like other *Lathyrus* species, eat earth chestnut as a normal part of a varied diet—do not rely on huge daily quantities of raw legume tissue long term.
purpose: |-
  Edible: Lathyrus tuberosus chains small starchy tubers -- boil or roast like mini potatoes; keep Lathyrus intake varied to avoid chronic neurotoxin risk from some species.
  Nitrogen Fixer: Rhizobia on climbing roots feed neighboring heavy feeders when vines are pruned in place on fences.
  Ground Cover: Twining stems shade soil along trellis feet, suppressing summer weeds on vertical growing space.
  Pollinator: Pink pea flowers supply summer nectar and pollen to bumblebees along fence lines.
  Wildlife Attractor: Ripening pods feed small birds and insects when some vines run to seed at season's end.
