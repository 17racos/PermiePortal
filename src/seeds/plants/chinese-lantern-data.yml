  description: 'Chinese Lantern (*Physalis alkekengi*) is a vigorous herbaceous perennial native to Europe and Asia. It grows
    up to 60 cm (24 inches) tall, featuring ovate leaves and nodding, creamy-yellow bell-shaped flowers that bloom in summer.
    The plant is renowned for its distinctive, bright orange to red, papery calyces that encase the fruit, resembling lanterns.
    These calyces appear in autumn and are often used in dried floral arrangements. Chinese Lantern thrives in full sun to
    partial shade and prefers moist, well-drained soils. It spreads by underground rhizomes and can become invasive if not
    managed properly.


    🌞💧 Sun and Water Requirements:

    - **Sun:** Prefers full sun but tolerates partial shade.

    - **Water:** Requires moist, well-drained soil; regular watering is beneficial, but avoid waterlogging.


    ✂️🫘 Methods to Propagate:

    - **Seed:** Sow seeds indoors in early spring. Transplant seedlings outdoors after the last frost.

    - **Division:** Divide rhizomes in early spring or autumn to control spread and propagate new plants.


    🧑‍🌾👩‍🌾 When to Harvest:

    - Harvest the vibrant calyces in autumn when they are fully colored for use in decorations. Handle with care, as unripe
    fruits and other plant parts can be toxic if ingested.'
