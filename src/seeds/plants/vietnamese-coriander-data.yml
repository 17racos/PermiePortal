  description: |-
    Vietnamese coriander is the cilantro substitute that laughs at heat — long leaves with dark chevrons, punchy aroma, and a love of moisture that makes it a pond-edge herb in permaculture stacks. Spreads by runners; contain mentally. subtropical and tropical Americas: dies back in hard frost, often returns from roots in 9b with mulch.
    
    ☀️💧 Sun and Water Requirements:
    - Part sun to light shade in brutal summers; full sun ok if soil stays moist.
    - Rich, wet-to-moist, well-drained soil; dries fast in pots on hot patios.
    - Mulch to buffer roots from temperature whiplash.
    
    ✂️ Methods to Propagate:
    - Cuttings: root in water or damp soil anytime it's warm.
    - Division: split rooted runners in spring when actively growing.
    
    🌾 Harvest / Best Use Timing:
    - Snip tender Vietnamese Coriander growth in cool mornings for best texture -- heat-stressed leaves taste like their day job.
    - Flowers at full color for peak volatiles; seeds when pods rattle but before they self-sow across paths.
    - Dry herbs in thin layers; deep piles steam themselves into compost.
  purpose: 'Vietnamese coriander is swamp-adjacent flavor:


    - Edible: Salads, soups, noodle bowls, and herb wraps — cilantro haters need not apply anyway.

    - Medicinal: Traditional digestive uses — modern claims need receipts, not vibes.

    - Wildlife Attractor: Small flowers attract pollinators when allowed to bloom briefly.'
