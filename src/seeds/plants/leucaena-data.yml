description: |-
  Leucaena is a fast legume tree that grows like it owes money—fine bipinnate leaves, creamy flowers, flat pods. It fixes nitrogen, feeds ruminants in managed systems, and contains mimosine, which is toxic to non-ruminants and requires real forage science, not backyard cowboy cosplay. In Florida it is invasive in parts of the south; subtropical and tropical Americas frosts check it more but ethics of planting still matter.

  ☀️💧 Sun and Water Requirements:
  - Full sun; lanky and disappointing in shade.
  - Tolerates poor soils but fruits and biomass ramp with deep moisture access—avoid stagnant wet root zones.

  ✂️ Methods to Propagate:
  - Seeds: hot-water soak or scarify; germinates fast in warm wet media.
  - Cuttings possible for some lines; seed is the norm at scale.

  🌾 Harvest notes:
  - For fodder systems, follow rotational grazing and variety guidance—this is livestock nutrition, not a meme.
purpose: |-
  Nitrogen Fixer: Leucaena leucocephala fixes atmospheric nitrogen through rhizobia while producing huge volumes of bipinnate leaf litter -- coppice on rotation so fixed N enters soil without letting seed pods colonize fence lines.
  Animal Fodder: Leaves run 20-25 percent crude protein for cattle and goats accustomed to mimosine -- never feed to horses or single-stomached pets because toxicity is documented, not anecdotal.
  Mulcher: Six-month regrowth after cutting yields soft green mulch for banana circles -- chip stems before lignin stiffens so material breaks down instead of tying up nitrogen on the surface.
  Windbreaker: Fast upright form knits into shelterbelts across trade-wind farms -- verify regional invasive status before planting because seeds move downstream into natural areas.
