  practitioner_notes: 'Chop-and-drop timing matters: green mulch feeds soil; woody brown mulch ties up surface nitrogen briefly.

    Soil smell and root color tell more than gadget overload—dig a small hole twice a season.

    Watch the plant’s own signals first—catalog zone numbers do not replace your site’s microclimate truth.

    Inoculate with the correct rhizobia group—wrong packet gives pretty leaves and empty nodules.'
