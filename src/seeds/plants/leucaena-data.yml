  description: 'Leucaena is a fast legume tree that grows like it owes money—fine bipinnate leaves, creamy flowers, flat pods.
    It fixes nitrogen, feeds ruminants in managed systems, and contains mimosine, which is toxic to non-ruminants and requires
    real forage science, not backyard cowboy cosplay. In Florida it is invasive in parts of the south; subtropical and tropical
    Americas frosts check it more but ethics of planting still matter.


    ☀️💧 Sun and Water Requirements:

    - Full sun; lanky and disappointing in shade.

    - Tolerates poor soils but fruits and biomass ramp with deep moisture access—avoid stagnant wet root zones.


    ✂️ Methods to Propagate:

    - Seeds: hot-water soak or scarify; germinates fast in warm wet media.

    - Cuttings possible for some lines; seed is the norm at scale.


    🌾 Harvest notes:

    - For fodder systems, follow rotational grazing and variety guidance—this is livestock nutrition, not a meme.'
  purpose: '- Nitrogen Fixer: Chop-and-drop biomass and nodules feed guilds where management prevents weed-tree chaos.

    - Animal Fodder: High-protein browse for adapted ruminants with trained oversight.

    - Mulcher: Frequent coppice yields leafy mulch in warm climates.

    - Windbreaker: Fast shelterbelt component where legal and appropriate.'
