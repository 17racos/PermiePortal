description: |-
  Mazus (Mazus reptans) is a mat-forming perennial herb with small scalloped leaves and snapdragon-ish purple-blue flowers held just above the foliage in spring. It spreads by slender stolons into a dense, walk-tolerant lawn alternative in cool, moist sites—typically only a few inches tall, best where turf pretends to be civilized but secretly wants shade and water.

  subtropical and tropical Americas: Treat as a cool-season or shaded microclimate ground cover; humid heat can stress it, so favor morning sun, afternoon shade, and consistent moisture—think path edges under trees, not beach parking medians.

  Part shade to full shade in hot climates; cooler regions accept more sun if soil stays evenly moist. Medium water; avoid drought cycles that turn the mat crispy; improve organic matter so roots do not cook.

  Division in early spring or autumn; reset small plugs on 6–8 inch centers for faster closure. Soft cuttings: take runners with a heel, stick into moist potting mix under humidity in warm weather.

  Ornamental use: shear lightly after main flush if you dislike the seedy look; avoid scalping into bare mud. Best establishment window is the mild shoulder seasons when evaporation is not running a shakedown racket.
purpose: |-
  Ground Cover: Mazus reptans stolons knit moist shade into walk-tolerant mats a few inches tall -- tolerates light foot traffic better than turf where sun is weak.
  Ornamental: Tiny purple-blue snapdragon faces hover just above scalloped leaves -- reads as a low constellation along stepping-stone grids.
  Pollinator: Small blooms offer nectar to halictid bees and minute syrphids -- plant drifts because micro-pollinators cruise for patch volume.
  Border Plant: Edges paths and pond cobbles without mowing -- shear after seed set if volunteers crack orderly joints.
companions:
  - Creeping Phlox — different texture and spring color stack; phlox handles slightly drier toes while mazus takes the shadier, wetter interstices.
  - Carpet Bugle — complementary mat with contrasting foliage color; together they confuse the eye of weed seedlings looking for open real estate.
  - Maidenhair Fern — fine fronds cast dappled shade and raise humidity at ground level, which keeps mazus from auditioning as hay.
cautions:
  - None documented
pests:
  - Slugs
  - Aphids
growth_habit: Low stoloniferous mat; evergreen to semi-evergreen depending on winter
