  description: |-
    Mazus (Mazus reptans) is a mat-forming perennial herb with small scalloped leaves and snapdragon-ish purple-blue flowers held just above the foliage in spring. It spreads by slender stolons into a dense, walk-tolerant lawn alternative in cool, moist sites—typically only a few inches tall, best where turf pretends to be civilized but secretly wants shade and water.

    subtropical and tropical Americas: Treat as a cool-season or shaded microclimate ground cover; humid heat can stress it, so favor morning sun, afternoon shade, and consistent moisture—think path edges under trees, not beach parking medians.

    ☀️💧 Sun and Water Requirements:
    - Part shade to full shade in hot climates; cooler regions accept more sun if soil stays evenly moist.
    - Medium water; avoid drought cycles that turn the mat crispy; improve organic matter so roots do not cook.

    ✂️ Propagation:
    - Division in early spring or autumn; reset small plugs on 6–8 inch centers for faster closure.
    - Soft cuttings: take runners with a heel, stick into moist potting mix under humidity in warm weather.

    🌾 Harvest / Best Use Timing:
    - Ornamental use: shear lightly after main flush if you dislike the seedy look; avoid scalping into bare mud.
    - Best establishment window is the mild shoulder seasons when evaporation is not running a shakedown racket.
  purpose: |-
    - Ground Cover: Tight weave excludes many weeds in shady, irrigated strips where grass sulks.
    - Ornamental: Flowers read as a grounded constellation—low enough not to block sight lines on paths.
    - Pollinator: Small blooms feed tiny bees and flies that larger flowers snub.
    - Border Plant: Edges paths and stepping-stone grids without the tyranny of weekly mowing theology.
  companions:
  - Creeping Phlox — different texture and spring color stack; phlox handles slightly drier toes while mazus takes the shadier, wetter interstices.
  - Carpet Bugle — complementary mat with contrasting foliage color; together they confuse the eye of weed seedlings looking for open real estate.
  - Maidenhair Fern — fine fronds cast dappled shade and raise humidity at ground level, which keeps mazus from auditioning as hay.
