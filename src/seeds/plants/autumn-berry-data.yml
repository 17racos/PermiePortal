  description: "Autumn berry is the fruiting face of autumn olive (Elaeagnus umbellata),
    a fast, thorny nitrogen-fixing shrub with silvery leaves, sweet spring scent, and
    speckled red berries high in lycopene. It spreads aggressively in many temperate
    regions via bird-dropped seed and suckers, outcompeting native shrubs on disturbed
    ground. This profile is for identification and legacy-site management—not a planting
    endorsement where the species is invasive. If you already have it, harvest and
    disturbance strategy matter more than Instagram recipes.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun to light shade; tolerates drought, sand, and lean soil once actinorhizal
    roots establish. Avoid encouraging new plantings near natural areas, wetlands, or
    conservation corridors. Over-fertility speeds rank growth and heavy fruit loads
    that amplify seed rain.\n\n✂️ Propagation:\nTechnically hardwood cuttings and suckers
    root easily—which is why it became a problem. Do not distribute seed or cuttings
    in regions where the species is regulated. On managed sites, remove fruiting wood
    after harvest if local guidance recommends reducing spread pressure.\n\n🌾 Harvest
    / Best Use Timing:\nPick berries when fully red-speckled and slightly soft; they
    are tart raw and shine in jams, fruit leathers, and fermented experiments. Strip
    plants you are phasing out before birds move seed into fence lines and neighbor drama."
  purpose: |-
    - Edible: Berries process into high-acid preserves where harvest does not increase regional spread.
    - Nitrogen Fixer: Actinorhizal roots add nitrogen to associated soil on sites where the plant already exists.
    - Wildlife Attractor: Flowers feed insects; fruit feeds birds—understand that feeding includes seed dispersal.
    - Windbreaker: Dense twiggy habit slows wind along old hedgerows and field edges.
    - Animal Fodder: Fruit and browse can feed poultry or livestock in systems already managing the plant.
