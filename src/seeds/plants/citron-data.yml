  description: |-
    Citron is the thick-rinded citrus ancestor that cares more about zest and pith than juice. Religious, culinary, and candied-peel traditions all want a piece; greening and psyllid politics want a piece of you.
    
    Same citrus reality as the rest of the genus—9a is negotiation, microclimate helps, pot-and-shelter is honesty. Check local guidance on citrus pests and diseases before you commit yard space.
    
    Sun and water: Full sun for dense rind and oil glands. Deep, infrequent watering in well-drained soil; avoid mulch volcanoes against the trunk.
    ✂️ Propagation:
    Budded or grafted onto compatible rootstock for trueness and soil adaptation; seedlings are a lottery.
    
    🌾 Harvest / Best Use Timing:
    - Pick Citron fruit when sugar-acid balance peaks for your use -- marmalade wants different timing than fresh slices.
    - Color is a hint, not a contract; sample one fruit from each sector of the canopy.
    - Store fresh citrus cool and dry; zest freezes well if you strip peel before shrivel sets in.
  purpose: |-
    Edible: Massive fragrant rind and pith are the crop; candy peels, salt-preserve wedges, and zest for arak and sweets while the juice sacs stay modest.
    Ornamental: Big warty yellow fruits hang for months on open, thorny scaffolding that reads like living sculpture in a frost-free courtyard.
    Medicinal: Etrog traditions and old Mediterranean herbals assign ritual and digestive roles to peel oil and albedo; modern use still hinges on clean fruit and peel hygiene.
