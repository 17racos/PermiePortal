  description: "Thorny buffaloberry (Shepherdia argentea) is a cold-hardy actinorhizal shrub of North American prairies and river terraces, with silvery leaves, thorny stems on many plants, and red or yellow tart berries that feed birds and traditional kitchens where processing is understood. Plants reach 6–12 feet (1.8–3.5 m), often forming thickets. Thorns vary by individual—assume gloves until proven otherwise.\n\n☀️💧 Sun and Water Requirements:\nFull sun for densest silver foliage and heaviest fruiting. Tolerates poor, alkaline, sandy soils; prefers consistent moisture but withstands cold dry winters. Avoid waterlogged clay without percolation.\n\n✂️ Propagation:\nSow stratified seed; hardwood cuttings with hormone. Prune to manage thicket density along paths.\n\n🌾 Harvest / Best Use Timing:\nPick berries when fully colored—process into sauces or jellies per traditional methods. Leave some fruit for wildlife. Peak ripening tracks mid-to-late summer warmth."
  purpose: |-
    - Nitrogen Fixer: Actinorhizal roots enrich lean soils for neighbors when prunings return as mulch.
    - Wildlife Attractor: Berries feed birds; thorny thickets provide cover.
    - Border Plant: Defines hedgerows and livestock screens in cold climates.
    - Erosion Control: Roots stabilize riverbanks and disturbed cuts.
  companions:
  - Silverberry Shrub — related Elaeagnaceae neighbor with similar silver foliage at shrub height
  - Wild Plum — thicket fruit neighbor extending successional harvests
  - Raspberry — bramble edge at sunnier margins of buffaloberry thickets
  cautions:
  - Thorns — plan paths, ladders, and vet visits accordingly
  - Dioecious fruiting—plant male and female individuals if fruit is the goal
  pests:
  - Scale Insects
  - Aphids
  - Spider Mites
  practitioner_notes: |-
    Thorns vary by individual—seed-grown plants are roulette; clone known lines if spines matter to your shins.
    Dioecious biology means lonely females set no fruit—pollen planning is not optional.
    Saponin tang is real—sugar without testing is how jam becomes regret.
    Silver leaves read drought—overhead sprinklers still invite scale if dust persists.
