description: |-
  Thorny buffaloberry (Shepherdia argentea) is a cold-hardy actinorhizal shrub of North American prairies and river terraces, with silvery leaves, thorny stems on many plants, and red or yellow tart berries that feed birds and traditional kitchens where processing is understood. Plants reach 6–12 feet (1.8–3.5 m), often forming thickets. Thorns vary by individual—assume gloves until proven otherwise.

  ☀️💧 Sun and Water Requirements:
  Full sun for densest silver foliage and heaviest fruiting. Tolerates poor, alkaline, sandy soils; prefers consistent moisture but withstands cold dry winters. Avoid waterlogged clay without percolation.

  ✂️ Propagation:
  Sow stratified seed; hardwood cuttings with hormone. Prune to manage thicket density along paths.

  🌾 Harvest / Best Use Timing:
  Pick berries when fully colored—process into sauces or jellies per traditional methods. Leave some fruit for wildlife. Peak ripening tracks mid-to-late summer warmth.
purpose: |-
  Nitrogen Fixer: Shepherdia argentea Frankia roots fix nitrogen on alkaline Great Plains terraces -- green mulch returned after pruning feeds elderberries without urea subsidy.
  Wildlife Attractor: Scarlet drupes hang into winter for cedar waxwings while thicket architecture hides sharp-tailed grouse from avian predators.
  Border Plant: Wolf-height hedges clothed in silver needles stop drifting snow faster than woven wire along northern lanes.
  Erosion Control: Suckering roots weld Missouri River cobble bars where cottonwood seedlings still lack footing.
companions:
- Silverberry Shrub — related Elaeagnaceae neighbor with similar silver foliage at
  shrub height
- Wild Plum — thicket fruit neighbor extending successional harvests
- Raspberry — bramble edge at sunnier margins of buffaloberry thickets
cautions:
- Thorns — plan paths, ladders, and vet visits accordingly
- Dioecious fruiting—plant male and female individuals if fruit is the goal
pests:
- Scale Insects
- Aphids
