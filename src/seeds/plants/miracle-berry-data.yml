description: |-
  Synsepalum dulcificum is the small glossy shrub whose red berries make lemons taste like candy for an hour—miraculin messes with sweet receptors, not sugar content. Party trick first, plant second.

  subtropical and tropical Americas: Container culture or greenhouse north of ~10b in Florida; brief chill can defoliate young plants. Puerto Rico’s steady warmth suits in-ground shrubs with humidity and wind protection. Likes humidity and hates salt wind.

  Part sun to bright shade in hot climates; acidic, organic, well-drained soil. Even moisture; no wet feet.

  Fresh seed; clean medium and warmth improve germination. Air-layering and grafted selections for compact habit where collectors want predictable form.

  Pick fully colored berries; effect is time-limited—use fresh for tastings or freeze small batches quickly. Protect ripe fruit from birds if you want human-first harvests.
purpose: |-
  Edible: Single red drupes eaten fresh coat sweet taste receptors with miraculin for roughly 30–60 minutes so sour citrus reads candy-sweet -- metabolic sugar load does not change; anyone managing glucose still counts real carbohydrates in the meal.
  Ornamental: Glossy small leaves on a compact evergreen shrub suit patio pots, greenhouse benches, or protected understory out of salt wind -- chlorotic yellowing on alkaline water responds to chelated iron and organic mulch.
  Wildlife Attractor: Fully colored Synsepalum berries pull frugivorous birds and small mammals in humid yards -- net the shrub or plan a shared-drop harvest because ripe fruit is a high-sugar beacon.
companions:
