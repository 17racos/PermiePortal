  description: "Red stopper (Eugenia rhombea) is a compact evergreen tree or large
    shrub native to the Caribbean and parts of extreme southern Florida and the
    Keys, often on limestone and coastal rockland. Small leaves, smooth bark, and
    red to black berry-like fruit mark it as classic myrtle family material. It suits
    salt-tolerant hedges, bird gardens, and edible landscaping in frost-free climates
    where larger stoppers need not dominate every view.\n\n☀️💧 Sun and Water Requirements:\n-
    Full sun to light shade; densest habit in bright light.\n- Moderate moisture;
    drought tolerant once established in humid maritime air.\n- Well-drained, often
    alkaline rocky soils; container plants need fast mix, not peat soup.\n\n✂️ Propagation:\n-
    Seeds cleaned and sown fresh; germination can be slow.\n- Semi-hardwood cuttings
    under humidity in warm seasons.\n- Light shaping after flowering if hedging;
    avoid heavy shearing into old wood without buds.\n\n🌾 Harvest / Best Use Timing:\n-
    Fruit is eaten out of hand when fully colored and soft; flavor is mild, more
    bird snack than supermarket berry.\n- Pick for trials before birds strip clusters
    in peak season.\n- Mulch root zone to reduce evaporative stress in dry-season
    heat."
  purpose: |-
