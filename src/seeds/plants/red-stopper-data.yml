  description: 'Red stopper (Eugenia rhombea) is a compact evergreen tree or large shrub native to the Caribbean and parts
    of extreme southern Florida and the Keys, often on limestone and coastal rockland. Small leaves, smooth bark, and red
    to black berry-like fruit mark it as classic myrtle family material. It suits salt-tolerant hedges, bird gardens, and
    edible landscaping in frost-free climates where larger stoppers need not dominate every view.


    ☀️💧 Sun and Water Requirements:

    - Full sun to light shade; densest habit in bright light.

    - Moderate moisture; drought tolerant once established in humid maritime air.

    - Well-drained, often alkaline rocky soils; container plants need fast mix, not peat soup.


    ✂️ Propagation:

    - Seeds cleaned and sown fresh; germination can be slow.

    - Semi-hardwood cuttings under humidity in warm seasons.

    - Light shaping after flowering if hedging; avoid heavy shearing into old wood without buds.


    🌾 Harvest / Best Use Timing:

    - Fruit is eaten out of hand when fully colored and soft; flavor is mild, more bird snack than supermarket berry.

    - Pick for trials before birds strip clusters in peak season.

    - Mulch root zone to reduce evaporative stress in dry-season heat.'
  purpose: '- Edible: Ripe fruit is nibbled fresh or in preserves where sweetness is boosted.

    - Wildlife Attractor: Berries feed birds and small mammals in native rockland communities.

    - Border Plant: Tolerates pruning into informal screens along paths and patios.

    - Ornamental: Evergreen polish suits formal and wildish tropical gardens alike.'
