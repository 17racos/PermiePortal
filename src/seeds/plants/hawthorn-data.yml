  description: |-
    Hawthorn (Crataegus monogyna) is a thorny deciduous shrub or small tree valued for wildlife habitat and long-term landscape structure. It grows on temperate sites and forms dense branching with strong thorns, fragrant spring flowers, and small edible fruits that ripen later. In permaculture, it matters because you get a living security fence: birds nest and feed in it, pollinators work the blossoms, and the pruned wood becomes usable biomass while the plant tolerates neglect better than many “gentle” ornamentals.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun is best for flowers and fruit; partial shade reduces performance.
    - Water moderately during establishment; once established it can handle some dry spells.
    - Prefers well-drained soil; waterlogged ground stresses roots.
    - Handles seasonal temperature swings well when mature.
    
    ✂️ Propagation:
    - Seeds: cold-stratify for several months; germination can be slow and uneven.
    - Cuttings: take semi-hardwood cuttings in warm seasons; root under humidity.
    - Grafting or suckers: use rooted suckers or graft for quicker structure and reliable fruiting.
    
    🌾 Harvest / Best Use Timing:
    - Harvest berries when fully colored and soft; pick in rounds over a few days.
    - Leaves and flowers can be gathered in early bloom for tea-style infusions.
    - Use fruit for jelly, syrups, or dried snacks; store dried material cool and sealed.
  purpose: |-
    Medicinal: Flowers and berries are used in traditional tea preparations; in permaculture, that gives you an on-site herbal harvest rather than a “store it later” fantasy.
    Wildlife Attractor: Thorny structure provides safe nesting cover, while flowers and fruits feed pollinators and fruit-eaters across seasons.
    Border Plant: Dense, thorny branching marks boundaries and protects vulnerable beds without needing constant replacement.
  companions:
  - Comfrey (Symphytum officinale) — chop-and-drop near the base helps build soil and keeps the understory productive.
  - Garlic (Allium sativum) — strong scent can help reduce nearby pest pressure and supports rotation timing in garden edges.
  - Yarrow (Achillea millefolium) — drought-tolerant perennial companion that attracts beneficial insects alongside hawthorn bloom cycles.
  cautions:
  - It’s thorny: plan pruning access and place it where you want a barrier, not where people trip through it.
  practitioner_notes: |-
    Prune with gloves and purpose: light shaping keeps flowers on productive wood.
    Fruit ripeness comes in waves; harvesting too early gives “dry lesson” berries.
    If you want a hedge, keep spacing tight early, then thin later for airflow.
  pests:
  - Aphids
  - Scale Insects
  - Borers
  - Caterpillars
  - Root Rot
