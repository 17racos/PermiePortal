  practitioner_notes: |-
    Fronds trim heavy—use pole saw harnesses, not ladders on soft sand; dropped spathes concuss confidence and clavicles.
    Rhinoceros beetle damage shows V-cuts on new spears—remove trapped organic debris in crown after storms.
    Root weevil larvae girdle roots silently—watch for sudden wilt with green crown; probe soil for chewed root cuffs.
    Spiraling whitefly under fronds rains honeydew—wash periodically or groundcovers below turn black and spiteful.
