  description: "The Coconut Tree is a tall, tropical palm reaching up to 30 meters
    (98 feet) in height, characterized by its slender, ringed trunk and a crown of
    large, feather-like fronds. It produces coconuts, which are versatile fruits used
    for their water, milk, oil, and meat. The tree thrives in sandy, well-drained
    soils with high humidity and requires full sun exposure.\n\n\U0001F31E\U0001F4A7
    Sun and Water Requirements:\nCoconut Trees require full sun, with at least 6–8
    hours of direct sunlight daily. They prefer areas with annual rainfall between
    1,500–2,500 mm (59–98 inches) but can tolerate periods of drought once established.
    Regular watering is essential during the initial growth stages to establish a
    deep and extensive root system.\n\n✂️\U0001FAD8 Methods to Propagate:\nPropagation
    is typically achieved through planting mature seeds. Select fully ripened coconuts
    and soak them in water for two days to soften the shell. Plant the seed horizontally,
    burying about one-third of its length in well-drained soil. Ensure the planting
    site remains consistently moist but not waterlogged.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nCoconuts can be harvested at different stages, depending on
    their intended use. For coconut water, young, green coconuts are harvested at
    6–7 months. For coconut meat and oil, mature coconuts are harvested at around
    11–12 months when the husk turns brown."
  purpose: |-
    - Edible: Provides coconut water, milk, oil, and meat, which are staples in many tropical diets.
    - Medicinal: Coconut oil and water have been used traditionally for their antimicrobial and hydrating properties.
    - Mulcher: Coconut husks and leaves can be used as mulch to retain soil moisture and suppress weeds.
    - Biofuel: The shells and husks can be processed into charcoal and biofuels.
    - Wildlife Attractor: The tree offers habitat and food for various wildlife, including birds and insects.
    - Windbreaker: When planted in rows, coconut trees can act as effective windbreaks, protecting other crops from strong winds.
