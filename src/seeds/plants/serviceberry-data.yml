description: |-
  Serviceberry (Amelanchier canadensis) is a multistemmed eastern North American shrub to small tree of moist woods edges and old fields, bearing white early-spring flowers and sweet reddish-purple pomes in early summer. Heights of 15–25 feet (4.5–7.5 m) occur in ideal sites, often with suckering colonies along fencerows. It bridges forest and field in permaculture designs, offering human fruit, bird food, and early pollinator support.

  ☀️💧 Sun and Water Requirements:
  Full sun to partial shade; heavier fruiting with more light and airflow. Moist, well-drained, humus-rich soils suit it; tolerates clay if drainage is not stagnant. Mulch to reduce competition; water during drought in the first two years.

  ✂️ Propagation:
  Sow stratified seed; suckers transplant in early spring. Softwood cuttings under mist for clones. Prune for an open vase shape to reduce disease pressure.

  🌾 Harvest / Best Use Timing:
  Pick berries when fully colored and softening—process quickly for pies and jams. Bloom follows last hard frosts near 24°F (-4°C) in northern climates. Leave some fruit for birds if hedgerow sharing matters.
purpose: |-
  Edible: Amelanchier canadensis reddish-purple pomes ripen to sweet-tart balance for pies early summer -- harvest windows overlap with cedar waxwing migrations so netting ethics matter.
  Wildlife Attractor: Early summer fruit fuels birds along forest margins while multistem thickets hide nests at eye level.
  Pollinator: Drooping white racemes open before hardwood canopy closure to feed mason bees and early hoverflies in cool soil situations.
  Border Plant: Suckering rows trace woodland edges, hedgerows, and pond skirts where taller timber would shade field crops.
companions:
- Wild Plum — thicket neighbor extending fruit succession along fencerows
- Highbush Cranberry — later fruit interest at moister margins
- Wild Columbine — spring forb at the shrub skirt before canopy closes
cautions:
- Cedar-apple rust — separate from alternate juniper hosts when disease pressure is
  high
- Bird competition — plan netting ethics or shared harvest rows
