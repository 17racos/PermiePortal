  description: "Serviceberry (Amelanchier canadensis) is a multistemmed eastern North American shrub to small tree of moist woods edges and old fields, bearing white early-spring flowers and sweet reddish-purple pomes in early summer. Heights of 15–25 feet (4.5–7.5 m) occur in ideal sites, often with suckering colonies along fencerows. It bridges forest and field in permaculture designs, offering human fruit, bird food, and early pollinator support.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; heavier fruiting with more light and airflow. Moist, well-drained, humus-rich soils suit it; tolerates clay if drainage is not stagnant. Mulch to reduce competition; water during drought in the first two years.\n\n✂️ Propagation:\nSow stratified seed; suckers transplant in early spring. Softwood cuttings under mist for clones. Prune for an open vase shape to reduce disease pressure.\n\n🌾 Harvest / Best Use Timing:\nPick berries when fully colored and softening—process quickly for pies and jams. Bloom follows last hard frosts near 24°F (-4°C) in northern climates. Leave some fruit for birds if hedgerow sharing matters."
  purpose: |-
    - Edible: Sweet-tart berries support fresh eating and preserves where bird negotiations succeed.
    - Wildlife Attractor: Flowers feed early pollinators; fruit feeds birds and mammals.
    - Pollinator: Profuse white blooms provide pollen and nectar in cool-to-warm spring transitions.
    - Border Plant: Suckering habit defines woodland edges and screens.
  companions:
