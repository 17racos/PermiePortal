  description: 'Serviceberry (Amelanchier canadensis) is a multistemmed eastern North American shrub to small tree of moist
    woods edges and old fields, bearing white early-spring flowers and sweet reddish-purple pomes in early summer. Heights
    of 15–25 feet (4.5–7.5 m) occur in ideal sites, often with suckering colonies along fencerows. It bridges forest and field
    in permaculture designs, offering human fruit, bird food, and early pollinator support.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade; heavier fruiting with more light and airflow. Moist, well-drained, humus-rich soils suit it;
    tolerates clay if drainage is not stagnant. Mulch to reduce competition; water during drought in the first two years.


    ✂️ Propagation:

    Sow stratified seed; suckers transplant in early spring. Softwood cuttings under mist for clones. Prune for an open vase
    shape to reduce disease pressure.


    🌾 Harvest / Best Use Timing:

    Pick berries when fully colored and softening—process quickly for pies and jams. Bloom follows last hard frosts near 24°F
    (-4°C) in northern climates. Leave some fruit for birds if hedgerow sharing matters.'
