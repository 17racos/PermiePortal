description: |-
  Portulaca pilosa is the low, slightly hairy purslane cousin of flashy moss rose—prostrate stems, tiny yellow flowers, succulent leaves, and a talent for colonizing hot disturbed ground including sun-baked sidewalks.

  Explodes in warm wet weather; tolerates drought by going crisp then bouncing back. Edible like common purslane—ID carefully and skip sprayed lots.

  Full sun; lean to average soil; excellent drainage. Occasional deep watering beats chronic sprinkle.

  Stem pieces root casually; seed after summer heat—do not invite it if you hate editing volunteers.

  Snip young tips in moderation when sourcing is clean—oxalates still matter.
purpose: |-
  Edible: Portulaca pilosa succulent tips add lemony crunch to clean-site salads when picked young -- oxalate load matches other purslanes; skip foraged city cracks if spray history is unknown.
  Ground Cover: Hairy prostrate stems root at nodes across sun-baked pavers, rockery gaps, and tomato berms where irrigation is sporadic -- goes crisp-dormant in drought then greens after the first honest rain.
  Wildlife Attractor: Minute yellow portulaca flowers feed small native bees and micro syrphids in heat when larger blossoms pause -- cluster mats three feet wide so pollinators find volume worth revisiting.
