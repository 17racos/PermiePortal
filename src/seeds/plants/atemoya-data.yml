description: |-
  Atemoya is the cherimoya × sugar apple hybrid crowd — often Annona cherimola × A. squamosa — bred for smoother, knobbly fruit with killer texture and serious sweetness. Small tree, semi-evergreen, hand-pollination improves set where natural pollinators slack. subtropical and tropical Americas: same frost reality as other annonas — protect young wood, site warm, accept risk north of true tropics.

  Full sun for fruit; some afternoon shade OK inland. Deep regular watering; excellent drainage mandatory.

  Grafting onto seedling annona rootstock for true-to-type fruit. Seeds grow but won’t match parent quality.

  If pollination was lazy, do not blame the tree — get a paintbrush.

  Atemoya: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both. Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer. Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
purpose: |-
  Edible: Annona × atemoya pulp ripens soft like cherimoya with fewer seeds in many selections -- pick at slight give and finish indoors because skin cracks invite fruit flies faster than social media notifications.
  Shade Provider: Small semi-evergreen canopy throws filtered light for understory papaya, turmeric, and shade ginger until the scaffold lifts -- young bark sun-scalds without whitewash on southwest trunks.
  Wildlife Attractor: Custard-scented flowers draw nitidulid beetles for pollination while ripe fruit pulls fruit flies and raccoons -- bag clusters or accept wildlife tax in warm yards.
  Ornamental: Knobby green fruit and glossy leaves read as tropical sculpture along paths -- hand-pollinate with a paintbrush where native beetle counts stay low or set stays shy.
