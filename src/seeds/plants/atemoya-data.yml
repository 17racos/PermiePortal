  description: |-
    Atemoya is the cherimoya × sugar apple hybrid crowd — often Annona cherimola × A. squamosa — bred for smoother, knobbly fruit with killer texture and serious sweetness. Small tree, semi-evergreen, hand-pollination improves set where natural pollinators slack. subtropical and tropical Americas: same frost reality as other annonas — protect young wood, site warm, accept risk north of true tropics.
    
     ☀️💧 Sun and Water:
    - Full sun for fruit; some afternoon shade OK inland.
    - Deep regular watering; excellent drainage mandatory.
    
    ✂️ Propagation:
    - Grafting onto seedling annona rootstock for true-to-type fruit.
    - Seeds grow but won’t match parent quality.
    
    If pollination was lazy, do not blame the tree — get a paintbrush.
    
    🌾 Harvest / Best Use Timing:
    - Atemoya: pick when color, aroma, and a gentle yield to pressure agree for that species -- impatient fruit keeps starch, latex, or both.
    - Clip clusters with clean tools; shallow trays beat deep piles that bruise the optimistic bottom layer.
    - Rain splits thin skins -- pick before monsoon weeks if weather apps cooperate.
  purpose: |-
