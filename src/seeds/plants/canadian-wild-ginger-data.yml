  description: "Canadian wild ginger (Asarum canadense) is a low rhizomatous perennial
    of eastern North American deciduous forests, with fuzzy heart-shaped leaves hugging
    the ground and odd maroon flowers hidden at the base in spring. It spreads into
    glossy carpets under shade, rarely exceeding 6 inches (15 cm) tall. In food forests
    it is a native ground layer for sugar maple–beech–oak moods, feeding early pollinators
    that know where to look while outcompeting bare soil under shrubs.\n\n☀️💧 Sun and
    Water Requirements:\nFull to partial shade; direct midday sun burns leaves. Likes
    moist, humus-rich, well-drained soils typical of woodland edges; tolerates dry
    shade once established but grows slower. Mulch with leaf mold to mimic forest floor;
    avoid standing water around rhizomes.\n\n✂️ Propagation:\nDivide rhizomes in early
    spring as shoots emerge; keep pieces with buds and roots. Sow fresh seed after brief
    warm-cold cycles following regional practice. Transplant plugs under established
    canopy to reduce shock.\n\n🌾 Harvest / Best Use Timing:\nNot a bulk crop; traditional
    uses exist but modern safety guidance varies—research before any ingestion. For
    ecology, enjoy flowers at soil level with a hand lens and leave rhizomes to spread
    quietly."
  purpose: |-
