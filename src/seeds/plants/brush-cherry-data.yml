  description: "Brush cherry (Syzygium paniculatum) is an Australian myrtle relative grown as an evergreen shrub or small\
    \ tree with glossy leaves, fluffy white flowers, and magenta to purple pear-shaped fruit. It reaches 15–40 feet (4.5–12\
    \ m) if unpruned but accepts repeated shearing as a formal hedge in frost-free climates. Fruit is edible when ripe with\
    \ variable sweetness; in food forests it doubles as a privacy screen and bird buffet—plan interior thinning so hedges\
    \ do not become fungal apartments.\n\n ☀️\U0001F4A7 Sun and Water Requirements:\nFull sun to partial shade; dense shade\
    \ reduces flowering and fruit. Prefers rich, moist, well-drained soil with mulch; tolerates coastal exposure in humid\
    \ subtropical climates. Protect from hard frost; young wood burns near 28°F (-2°C) without shelter.\n\n✂️ Propagation:\n\
    Sow fresh seed; semi-hardwood cuttings under mist during warm months for clones. Hedge plants need periodic thinning cuts,\
    \ not only shearing skin, to keep inner wood alive.\n\n\U0001F33E Harvest / Best Use Timing:\n Pick fruit when deep magenta,\
    \ slightly yielding, and aromatic—flavor varies by clone. Use for jams, jellies, or fresh sampling; seeds are small. Prune\
    \ after main fruiting flush if you need size control without sacrificing all next season’s wood."
