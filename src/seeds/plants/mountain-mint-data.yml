  description: "Mountain mint here refers to Pycnanthemum muticum, a native eastern
    North American perennial mint relative with silvery bracts that look frosted even
    at noon. Stems are square, leaves aromatic, and late-summer flower heads pull
    in pollinators like a magnet. It is a workhorse edge plant for herb spirals,
    orchard understories, and insectary strips where aggressive true mints would
    cause regret.\n\n☀️💧 Sun and Water Requirements:\n- Full sun to light shade;
    tighter spacing and more sun yield stiffer, upright clumps.\n- Moderate moisture;
    tolerates short drought once deep roots establish but blooms heavier with even
    water.\n- Average garden soil; tolerates clay if drainage is not stagnant.\n\n✂️
    Propagation:\n- Division in spring or fall; replant vigorous outer ring pieces.\n-
    Softwood cuttings in late spring root quickly under mist or humidity dome.\n-
    Seeds: cold stratify; germination variable—division is faster for landscape use.\n\n🌾
    Harvest / Best Use Timing:\n- Snip leafy flowering tops just as bracts color
    for tea or drying; aroma peaks before full brownout.\n- Leave at least a third
    of stems for late pollinators and winter structure.\n- Dry bundles upside down
    in shade with airflow to preserve volatile oils."
