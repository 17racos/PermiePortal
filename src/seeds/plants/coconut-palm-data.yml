  description: 'Coconut palm (Cocos nucifera) is a tall single-trunk palm of tropical coasts and humid lowlands, famous for
    copra, cooking oil, sap, fiber, and the iconic nut that floats between islands. Mature specimens commonly reach 50–80
    feet (15–24 m) in cultivation, with pinnate fronds forming a high crown. In permaculture it is a long-lived staple tree
    for humid tropics and frost-free subtropical margins where salt spray and wind are part of daily weather.


    ☀️💧 Sun and Water Requirements:

    Full sun drives best growth and fruiting; young plants tolerate light shade while establishing. Likes deep, well-drained
    soils and steady moisture in the warm season; tolerates short dry spells once roots run deep but not prolonged drought
    on sandy sites. Salt-laden wind is normal habitat—avoid chronically waterlogged pits that suffocate roots.


    ✂️ Propagation:

    Sow whole mature nuts on their side in warm, humid media; germination is slow and variable but reliable when heat stays
    above roughly 70°F (21°C). Select seed from productive, disease-free mother palms when possible. Tall varieties are not
    practical to move once large—plan spacing for falling fronds and fruit from day one.


    🌾 Harvest / Best Use Timing:

    Pick drinking coconuts while husks are still green; wait for brown husks when targeting copra or oil. Cut inflorescences
    for sap only on trees you understand—tapping stresses palms and needs clean technique. Prune dead fronds for safety, not
    vanity; green fronds feed the crown.'
