  description: "Longawn muhly (Muhlenbergia rigida) is a warm-season bunchgrass from the southwestern United States into Mexico, forming dense metallic blue-green clumps with narrow leaves and narrow panicles bearing long awns that shimmer in light. Height is often 2–3 feet (0.6–1 m) with inflorescences taller. It suits xeric ornamental beds, green roofs with depth, and southwestern meadow mixes where drainage is honest and irrigation is optional.\n\n☀️💧 Sun and Water Requirements:\nFull sun for upright habit and best flowering; shade invites flop. Well-drained, lean to average soils; excellent drought tolerance after establishment. Wet clay in winter is a crown-rot accomplice.\n\n✂️ Propagation:\nDivide dormant clumps in spring; keep divisions moist until rooted. Sow seed warm; weed control early matters. Cut back old foliage in late winter before new growth.\n\n🌾 Harvest / Best Use Timing:\nOrnamental peak is warm-season bloom with long awns—plan backlight views. Leave standing for winter texture if desired; cut back before spring flush. Collect seed ethically from appropriate ecotypes for restoration."
  purpose: |-
    - Ornamental: Metallic foliage and awned inflorescences add desert-modern texture without thirsty turf.
    - Erosion Control: Fibrous roots stabilize slopes in sunny dry plantings.
    - Wildlife Attractor: Seeds and cover support small wildlife in arid grassland patches.
    - Border Plant: Clumping habit defines edges along paths and xeric beds.
  companions:
  - Little Bluestem — complementary warm-season grass with overlapping cultural needs
  - Yarrow — shallow insectary forb at the bed edge with drought tolerance
  - Lavender — Mediterranean shrub neighbor sharing sun and dry feet at perimeter
  cautions:
  - Overwatering and rich compost — lanky growth with reduced metallic color
  - Heavy wet clay — not a swamp specialist despite grass stereotypes
  pests:
