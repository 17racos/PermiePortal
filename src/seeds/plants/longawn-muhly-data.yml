  description: 'Longawn muhly (Muhlenbergia rigida) is a warm-season bunchgrass from the southwestern United States into Mexico,
    forming dense metallic blue-green clumps with narrow leaves and narrow panicles bearing long awns that shimmer in light.
    Height is often 2–3 feet (0.6–1 m) with inflorescences taller. It suits xeric ornamental beds, green roofs with depth,
    and southwestern meadow mixes where drainage is honest and irrigation is optional.


    ☀️💧 Sun and Water Requirements:

    Full sun for upright habit and best flowering; shade invites flop. Well-drained, lean to average soils; excellent drought
    tolerance after establishment. Wet clay in winter is a crown-rot accomplice.


    ✂️ Propagation:

    Divide dormant clumps in spring; keep divisions moist until rooted. Sow seed warm; weed control early matters. Cut back
    old foliage in late winter before new growth.


    🌾 Harvest / Best Use Timing:

    Ornamental peak is warm-season bloom with long awns—plan backlight views. Leave standing for winter texture if desired;
    cut back before spring flush. Collect seed ethically from appropriate ecotypes for restoration.'
  purpose: |-
    Ornamental: Longawn Muhly earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Erosion Control: Longawn Muhly networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Wildlife Attractor: Longawn Muhly layers flowers, seeds, or thicket shelter so beneficial insects and small vertebrates find steady forage along hedgerows -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Border Plant: Longawn Muhly tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate

