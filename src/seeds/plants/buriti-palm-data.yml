  description: |-
    Buriti is the swamp monarch of Amazonian palm imagination—feathery crown, seasonal flooding tolerance, and oil-rich fruit that powers local economies where it actually belongs. Not a patio plant unless your patio is a seasonally flooded savanna.
    
    Wrong continent for honest outdoor permanence; greenhouse curiosity or botanical brag only for most readers.
    
    Sun and water: Full sun in humid tropics. Roots tolerate long inundation in native systems; in cultivation mimic wet-dry rhythms with excellent drainage between floods if you are simulating habitat.
    ✂️ Propagation:
    Fresh seeds; extremely slow early growth; plan generational timelines.
    
    🌾 Harvest / Best Use Timing:
    - Buriti Palm: harvest fruit when fully colored and aromatic -- underripe jelly fruit stays stubbornly starchy.
    - Use pole baskets or hooks on tall trunks; ripe heads bruise if they free-fall onto concrete morality plays.
    - Pulp ferments fast -- process within a day or two, or freeze puree in flat bags for later.
