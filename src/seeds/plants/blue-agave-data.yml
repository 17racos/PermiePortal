common_name: Blue Agave
picture: blue_agave.webp
scientific_name: Agave tequilana
aka:
  - Weber blue agave
family: Asparagaceae
zone: 9-11
ideal_temp_min: 55
ideal_temp_max: 95
min_temp: 25
max_temp: 110
perennial: true
layers:
  - Herbaceous
plant_function:
  - Edible
  - Mulcher
  - Erosion Control
description: |-
  Blue agave is the spiky fountain of desert capitalism — same species behind tequila, same drama in the landscape. Rosette for years, then a telegraph pole of bloom and death. In subtropical and tropical Americas it is a dry microclimate pet, not a swamp roommate.

  Full blasting sun; shade makes weak, etiolated leaves that offend aesthetics and ethics. Sharp drainage — sand, gravel, berms, contempt for clay bowls. Drought-tolerant once established; summer wet on cold soil is rot karaoke.

  Bulbils and offsets: remove pups when sizable, dry cuts, plant in gritty mix. Seeds: slow and variable; novelty path, not production timeline.

  Piña harvest is a years-long commitment -- mark planting dates and size targets before you commit tools. Cut leaves close to the core with sharp pikes; sap irritates skin for many people -- gloves and eye sense. After harvest, dry or cook processing lines matter as much as field timing; sweet agave work is not a midnight whim.
purpose: |-
  Edible: Agave tequilana cores yield sweet sap for slow-roasted piña and syrup lines where harvest crews already plan years between replant after monocarpic bloom.
  Mulcher: Thick spent leaves strip to coarse fiber bundles that brown fast on berms, so chop-and-drop cycles add carbon without fine turf thatch.
  Erosion Control: Fibrous roots grip rocky slopes in dry climates where shallow-rooted annuals wash out after the first monsoon burst.
companions:
  - Prickly pear
  - Desert sage
  - Yucca
cautions:
  - Heavy irrigation in cool seasons
  - Planting in low frost pockets without grit amendment
pests:
  - Asparagus Beetle
  - Mealybugs
  - Palmetto Weevil
  - Scale Insects
