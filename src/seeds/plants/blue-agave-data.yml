  description: |-
    Blue agave is the spiky fountain of desert capitalism — same species behind tequila, same drama in the landscape. Rosette for years, then a telegraph pole of bloom and death. In subtropical and tropical Americas it is a dry microclimate pet, not a swamp roommate.
    
    ☀️💧 Sun and Water Requirements:
    - Full blasting sun; shade makes weak, etiolated leaves that offend aesthetics and ethics.
    - Sharp drainage — sand, gravel, berms, contempt for clay bowls.
    - Drought-tolerant once established; summer wet on cold soil is rot karaoke.
    
    ✂️ Methods to Propagate:
    - Bulbils and offsets: remove pups when sizable, dry cuts, plant in gritty mix.
    - Seeds: slow and variable; novelty path, not production timeline.
    
    🌾 Harvest / Best Use Timing:
    - Piña harvest is a years-long commitment -- mark planting dates and size targets before you commit tools.
    - Cut leaves close to the core with sharp pikes; sap irritates skin for many people -- gloves and eye sense.
    - After harvest, dry or cook processing lines matter as much as field timing; sweet agave work is not a midnight whim.
  purpose: |-
    Edible: Blue Agave (Agave tequilana) in the edible role draws on field reality: Rosette for years, then a telegraph pole of bloom and death. -- stacks calories and culinary diversity into guilds and annual rotations without leaning on imported fertility theater
    Mulcher: Blue Agave tolerates periodic hard cuts that land leafy residue exactly where soil biology wants it -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Erosion Control: Blue Agave networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains

  companions:
  - Prickly pear
  - Desert sage
  - Yucca
  cautions:
  - Heavy irrigation in cool seasons
  - Planting in low frost pockets without grit amendment
  pests:
  - Asparagus Beetle
  - Mealybugs
  - Palmetto Weevil
  - Scale Insects
  practitioner_notes: 'Rosette dies after flowering—plan offsets before the spike swallows the center; harvest pups when they
    have their own roots.

    Sap harvesting wounds invite rot; sterile tools and several dry days after cuts beat rushing syrup cosplay.

    Cold-wet soil above about 50°F (10°C) for weeks triggers basal rot faster than a single night at 28°F (-2°C) with dry
    grit.

    Margins and terminal spines go through gloves—roll leaves, don’t grab; weevil-damaged hearts smell fermented before they
    collapse.'
