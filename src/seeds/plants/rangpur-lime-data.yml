  description: 'Rangpur lime is a mandarin–citron hybrid that fruits like a sour orange got caffeinated: acidic juice, wrinkly
    red-orange fruit, and more cold tolerance than most sweet oranges—still not a polar bear, but subtropical and tropical
    Americas growers sometimes lean on it when fancy navels throw a tantrum after a hard freeze.


    ☀️💧 Sun and Water Requirements:

    - Full sun (6+ hours) for best flowering and fruit set; some afternoon shade is fine in brutal heat.

    - Well-drained soil; steady moisture when fruiting, less once established. Never leave roots swimming—citrus hates wet
    feet.


    ✂️ Methods to Propagate:

    - Budding and grafting onto trifoliate or other citrus rootstock (standard for true-to-type trees).

    - Seeds grow but are genetically variable and slow to fruit—fine for experiments, not for predictable harvests.


    🌾 Harvest notes:

    - Pick when fully colored; juice is tart and aromatic—marmalade, marinades, and “why is this lemon wearing a peel suit”
    moments.'
  purpose: '- Edible: Sour juice, zest, and marmalade; not a lazy substitute for a sweet navel but a flavor weapon.

    - Wildlife Attractor: Flowers pull pollinators when you are not blasting everything with broad-spectrum sprays.

    - Border Plant: Evergreen structure at the edge of a food forest or yard.

    - Windbreaker: Young plantings can join mixed wind buffers with realistic expectations—wood hardens with age.'
  companions:
