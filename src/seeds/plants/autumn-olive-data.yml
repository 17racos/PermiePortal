  description: "Autumn olive is a fast, thorny shrub with silvery-scaly leaves,
    fragrant spring flowers, and speckled red berries that birds broadcast everywhere.
    It fixes nitrogen via actinorhizal roots and laughs at poor soil—which is exactly
    why it became an invasive nightmare across much of eastern North America. Present and spreading in disturbed edges; do not plant new specimens if
    you respect nearby natural areas. If you inherited one, heavy fruit removal and
    replacement with native **Elaeagnus** relatives (where appropriate) is the adult
    move.\n\n☀️💧 Sun and Water Requirements:\n\nFull sun to light shade; tolerant of drought and sand
    once established; avoid planting in wetlands you care about.\n\n✂️ Propagation:\n\nSeed (bird-dispersed—please do not help); hardwood cuttings; suckers. Again: this
    profile exists for ID and legacy sites, not as a planting recommendation.\n\n🌾 Harvest / Best Use Timing:\n\nIf managing legacy plants, strip fruit before bird spread to cut seed rain; berries are tart raw and want processing, not careless encouragement."
  purpose: |-
