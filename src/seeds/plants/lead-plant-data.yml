  description: |-
    Lead plant is a silvery prairie shrub that fixes nitrogen without asking for applause. Purple flower spikes read "native insect disco" in June. Name is about leaf color, not heavy-metal soil — though it handles tough, dry soils like a champ. In subtropical and tropical Americas it is more a sandhill / open-edge experiment than default understory; match it to full sun and drainage, not bog life.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun for compact form and flowers; leggy in shade.
    - Dry to medium moisture; excellent drought tolerance once established.
    - Well-drained sandy or rocky soils preferred; hates wet feet.
    
    ✂️ Methods to Propagate:
    - Seeds: scarify and stratify for reliable germination; direct sow in prepared beds.
    - Cuttings: semi-hardwood in summer with rooting hormone and humidity.
    
    🌾 Harvest / Best Use Timing:
    - For mulch and chop-and-drop, harvest leafy growth after flowering when biomass is high but before seed shatter if you want less spread.
    - Wildlife value peaks if you leave some stands uncut each year.
    - Never strip more than a third of canopy on small plants.
  purpose: 'Lead plant is a workhorse legume shrub for lean sites:


    - Nitrogen Fixer: Feeds guild neighbors on poor ground.

    - Wildlife Attractor: Flowers for pollinators; seeds for birds.

    - Erosion Control: Deep roots stabilize slopes and disturbed prairie patches.

    - Mulcher: Fine leaf drop builds mulch over time.

    - Ornamental: Silver foliage contrasts darker greens.'
