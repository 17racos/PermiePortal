  description: 'Atlantic white cedar (Chamaecyparis thyoides) is a columnar evergreen conifer of acidic wetlands along the
    Atlantic and Gulf Coastal Plains, forming dense groves on peat and sandy peat where groundwater fluctuates but roots stay
    cool. Mature trees often reach 40–60 feet (12–18 m) with fine scale-like foliage and shreddy bark, historically prized
    for rot-resistant timber and now for restoration of bog forests, bioswales, and windbreaks on wet ground.


    ☀️💧 Sun and Water Requirements:

    Full sun to light shade; best development in high light. Requires consistently moist, acidic soil; tolerates seasonal
    high water tables but not prolonged deep stagnant flooding without aeration periods. Salt spray tolerance is modest—site
    inland of primary dunes unless using known coastal ecotypes.


    ✂️ Propagation:

    Sow seed in fall outdoors on moist peat-sand mix or stratify moist-cold and sow in spring. Hardwood cuttings from young
    stock root slowly under mist with bottom heat. Transplant container-grown liners into prepared wet sites; bare-root large
    specimens poorly.


    🌾 Harvest / Best Use Timing:

    Timber rotations are decades long—home scale uses focus on living hedgerows and carbon-dense biomass. Prune leaders only
    for formal screens; natural form is narrow already. Collect cones when scales begin to open if saving seed.'
