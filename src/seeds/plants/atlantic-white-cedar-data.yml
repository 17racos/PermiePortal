  practitioner_notes: 'If the tag says “cedar” but needles are juniper-sharp, you are in the wrong genus conversation.

    Peaty acidity is a feature, not a bug—do not lime a white cedar swamp cosplay bed.

    Caterpillar and scale scouts save conifer screens—damage shows as thin tops before bags are obvious everywhere.

    Narrow habit means tight spacing works until it does not—plan access paths before walls close.'
