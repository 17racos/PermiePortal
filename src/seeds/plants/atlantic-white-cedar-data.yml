  description: "Atlantic white cedar (Chamaecyparis thyoides) is a columnar evergreen
    conifer of acidic wetlands along the Atlantic and Gulf Coastal Plains, forming
    dense groves on peat and sandy peat where groundwater fluctuates but roots stay
    cool. Mature trees often reach 40–60 feet (12–18 m) with fine scale-like foliage
    and shreddy bark, historically prized for rot-resistant timber and now for restoration
    of bog forests, bioswales, and windbreaks on wet ground.\n\n☀️💧 Sun and Water
    Requirements:\nFull sun to light shade; best development in high light. Requires
    consistently moist, acidic soil; tolerates seasonal high water tables but not prolonged
    deep stagnant flooding without aeration periods. Salt spray tolerance is modest—site
    inland of primary dunes unless using known coastal ecotypes.\n\n✂️ Propagation:\nSow
    seed in fall outdoors on moist peat-sand mix or stratify moist-cold and sow in
    spring. Hardwood cuttings from young stock root slowly under mist with bottom heat.
    Transplant container-grown liners into prepared wet sites; bare-root large specimens
    poorly.\n\n🌾 Harvest / Best Use Timing:\nTimber rotations are decades long—home
    scale uses focus on living hedgerows and carbon-dense biomass. Prune leaders only
    for formal screens; natural form is narrow already. Collect cones when scales begin
    to open if saving seed."
  purpose: |-
    - Windbreaker: Evergreen wall slows wind across fields, livestock lanes, and coastal farms.
    - Wildlife Attractor: Dense cover shelters birds; wetland structure supports amphibians and insects.
    - Erosion Control: Root networks bind peat and sandy banks in engineered wetlands.
    - Biomass: Fast juvenile growth on suitable sites produces chips and mulch cycles in managed blocks.
  companions:
  - Sweetbay Magnolia — shared acidic wet soils and layered canopy structure
  - Inkberry — lower evergreen layer beneath cedar edges without root trench warfare
  - Red Maple — associates in natural swamps; maple handles slightly wider moisture swings
  cautions:
  - Deer browsing — can girdle leaders on young plantations in heavy pressure areas
  - Drought on upland fill — needles bronze and trees fail without irrigation
  pests:
  - Borers
  - Scale Insects
  practitioner_notes: |-
    If the tag says “cedar” but needles are juniper-sharp, you are in the wrong genus conversation.
    Peaty acidity is a feature, not a bug—do not lime a white cedar swamp cosplay bed.
    Caterpillar and scale scouts save conifer screens—damage shows as thin tops before bags are obvious everywhere.
    Narrow habit means tight spacing works until it does not—plan access paths before walls close.
  growth_habit: Columnar evergreen conifer; scale leaves; moist acidic wetland affinity
