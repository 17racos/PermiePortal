  description: "Agave is a genus of succulent plants known for their rosette of thick,
    fibrous leaves that end in sharp points. Sizes vary from small species measuring
    30 cm (1 foot) to larger ones reaching up to 2.5 meters (8 feet) in height. Agaves
    are monocarpic, flowering once at the end of their life cycle, which can range
    from 8 to 30 years. The flowering stalk can grow several meters tall, bearing
    numerous tubular flowers. After flowering, the main plant dies, but it often produces
    offsets or \"pups\" around its base.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nAgaves
    thrive in full sun and well-drained soils. They are drought-tolerant and require
    minimal watering once established. Overwatering can lead to root rot. :contentReference[oaicite:2]{index=2}\n\n✂️\U0001FAD8
    **Methods to Propagate:**\nAgaves are commonly propagated by:\n- **Offsets (Pups):**
    Small plants that grow around the base can be removed and replanted.\n- **Bulbils:**
    Some species produce bulbils on the flowering stalk, which can be planted after
    detachment.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E **When to Harvest:**\nFor
    species used in fiber or biofuel production, leaves are harvested from mature
    plants, typically before flowering. In species like *Agave tequilana* (used for
    tequila), the central \"piña\" is harvested after 7 to 14 years."
  purpose: |-
    - Biofuel: Certain agave species are cultivated for bioethanol production due to their high sugar content.
    - Fiber: Agave leaves yield strong fibers, such as sisal, used in ropes and textiles.
    - Ornamental: Many agaves are grown for their architectural form and drought tolerance in landscaping.
