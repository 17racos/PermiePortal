  practitioner_notes: 'Monocarpic rosettes: the shoot that rockets upward is the plant finishing its life—plan replacements
    from pups or bulbils.

    Winter rain on cold roots kills faster than drought—shed water off the crown or slope grade away from the heart.

    Fiber species reward tighter spacing for long straight leaves; landscape specimens need more air for rot prevention.'
