description: |-
  Winter savory (Satureja montana) is a hardy perennial herb grown for its peppery, savory flavor used in cooking and for its aromatic value in garden systems. Native to the Mediterranean region, it forms a low, woody-based shrub with small flowers that attract pollinators. Plants typically reach 20–50 cm (8–20 in) tall and spread in a manageable mound. In permaculture, winter savory matters because it gives you an aromatic, edible herb harvest from a durable perennial bed edge, and its flowers support beneficial insects that also help around your food crops.

  Full sun is best; partial shade reduces aroma intensity. Water lightly during establishment; once rooted it handles drought well. Prefers well-drained soil and dislikes wet winters. Avoid heavy, waterlogged ground; crown rot is the common failure.

  Cuttings: take semi-hardwood cuttings in warm months and root under humidity (often 4–8 weeks). Seeds: direct-sow or start indoors; germination can take several weeks with steady moisture. Division: split in spring for faster, uniform plants.

  Harvest leaves frequently by pinching tips for branching. Harvest flowers during bloom for teas/infusions. Dry leaves in airflow and store cool for flavor retention.
purpose: |-
  Edible: Satureja montana leaves carry peppery thyme-savory bite -- woody base resists winter cold better than annual summer savory.
  Medicinal: Thymol and carvacrol support traditional digestive teas -- pregnancy-sensitive; keep doses culinary unless working with a clinician.
  Pollinator: Small white-lipped flowers feed tiny bees in summer -- trim after bloom to keep mounds tight.
companions:
  - Rosemary (Salvia rosmarinus) — shared sun/drainage needs and aromatic guild cohesion.
  - Thyme (Thymus vulgaris) — low groundcover reduces evaporation and keeps the border edible.
  - Marigold (Tagetes patula) — adds nectar and visual monitoring for pest activity.
cautions:
  - Avoid waterlogged soil; raised beds and airflow matter in humid climates.
pests:
  - Aphids
  - Spider Mites
  - Root Rot
