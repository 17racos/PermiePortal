  description: "Blue porterweed (Stachytarpheta jamaicensis) is a low, spreading perennial of sandy coastal and disturbed
    ground in the subtropics and tropics, carrying slender spikes of small blue-purple flowers that keep visiting butterflies
    honest almost year-round in frost-free sites. It fills sunny gaps where turf pretends to be ecology, rooting easily from
    cuttings and self-seeding where winters stay mild. Traditional medicine uses enter local practice—verify identity and
    contraindications before you brew for guests.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for tight growth and continuous
    bloom; shade stretches stems and reduces flowers.\n- Tolerates drought once established; looks fresher with occasional
    deep watering in sand.\n- Well-drained soil; tolerates poor fertility but not chronic bog.\n\n✂️ Propagation:\n- Cuttings
    root readily in warm, humid seasons.\n- Seeds self-sow; thin volunteers to prevent monoculture boredom.\n- Hard cutback
    after frost risk to refresh woody bases.\n\n🌾 Harvest / Best Use Timing:\n- If harvesting for documented herbal traditions,
    collect flowering tops in morning dryness and dry with airflow.\n- Leave abundant bloom for skippers and hummingbirds if
    your goal is habitat, not jars.\n- Deadhead only if local rules demand tidiness over seeds."
