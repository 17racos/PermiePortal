  description: "Beach bean (Canavalia maritima) is a robust coastal legume of tropical
    and subtropical shorelines, producing thick trailing stems, large leathery trifoliate
    leaves, and showy pink to purple pea flowers followed by long woody pods. It colonizes
    upper beaches and frontal dunes where salt spray, heat, and shifting sand stress
    ordinary crops, knitting sand with nodal roots and feeding succession with nitrogen-rich
    litter. Individual patches can spread widely along favorable coasts in the wet season
    growth pulse.\n\n☀️💧 Sun and Water Requirements:\nFull sun essential; thrives
    in well-drained sandy soils with occasional salt exposure. Tolerates drought between
    rains once rooted; supplemental water speeds establishment during dry season stabilization
    projects. Poor performance on waterlogged muck or heavy inland clays without excellent
    drainage.\n\n✂️ Propagation:\nSow scarified seed into warm sand; protect from crabs
    and rodents on restoration sites with temporary mesh. Root stem cuttings with at
    least one node buried. Coordinate collections with local conservation rules—wild
    dunes are not a free nursery.\n\n🌾 Harvest / Best Use Timing:\nTreat primarily
    as stabilization and ecology; seeds require careful preparation and are not casual
    food. Clip excessive runners to steer mats along design contours before storm season.
    Photograph phenology for grant reporting rather than chasing edible yields."
  purpose: |-
    - Nitrogen Fixer: Nodules improve nitrogen status of otherwise oligotrophic beach sand.
    - Erosion Control: Stem networks reduce surface creep and capture wrack after high tides.
    - Ground Cover: Rapid coverage lowers sand temperature and protects hatchling habitat niches.
    - Wildlife Attractor: Flowers support bees; dense cover shelters small vertebrates and invertebrates.
  companions:
