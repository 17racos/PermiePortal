  description: "Gaura (*Oenothera lindheimeri*, long sold as *Gaura lindheimeri*) is
    a clump-forming perennial from the southern Great Plains with wiry stems, butterfly-like
    white to pink flowers, and narrow leaves that can redden in stress. Mature plants
    reach 2–4 feet tall and wide, swaying in wind. In Florida and Puerto Rico it flowers
    heavily during drier, sunnier months; heavy wet-season humidity can shorten lifespan—plant
    on berms with air movement and avoid overwatering.\n\n\U0001F31E\U0001F4A7 **Sun
    and Water Requirements:**\nFull sun for strongest stems and bloom. Well-drained,
    lean to average soil; drought-tolerant once established. Wet feet in the warm
    rainy season leads to crown rot—gravel mulch helps.\n\n✂️ **Methods to Propagate:**\n-
    **Seeds:** Sow in warm conditions; some cultivars come partly true from seed.\n-
    **Spring divisions:** Split crowns before major new growth; replant shallowly
    and water lightly until rooted.\n\n\U0001F9D1‍\U0001F33E **Harvest / Best Use
    Timing:**\nCut stems for long-lasting airy bouquets when half the buds are open.
    Deadheading prolongs bloom on some selections; allow late seed if you want self-sowing
    volunteers."
  purpose: |-
    - **Ornamental:** Floating flowers and fine texture soften hardscape and contrast with bold-leaf tropicals.
    - **Pollinator:** Night-flying moths and daytime bees visit the open, nectar-rich blooms.
    - **Wildlife Attractor:** Seeds feed small birds when heads mature if not sheared.
    - **Border Plant:** Upright wands define bed edges and meadow strips without forming solid walls.
    - **Erosion Control:** Fibrous roots hold sandy berms and rain-garden shoulders between storm events.
