  practitioner_notes: |-
    Running types need 24–30 inch (60–76 cm) deep rhizome barrier or they will visit the neighbor’s foundation.
    New shoots are calorie food in some cultures—ID the species before stir-fry experiments; bitterness varies.
    Culm harvest timing is species-specific—too early walls are soft, too late wood is tool-grade hard.
