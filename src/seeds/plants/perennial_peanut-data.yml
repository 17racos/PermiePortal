  description: 'Perennial peanut (*Arachis glabrata*) is a low-growing, rhizomatous perennial legume native to South America.
    It features dense, mat-forming foliage with bright green, oval leaflets and produces small, vibrant yellow, pea-like flowers
    throughout the summer months. The plant typically reaches a height of 15-20 cm (6-8 inches) and spreads via underground
    rhizomes, making it an excellent ground cover that effectively suppresses weeds and prevents soil erosion. Perennial peanut
    thrives in sandy, well-drained soils and is highly drought-tolerant once established. It is suitable for USDA hardiness
    zones 8b through 11 and can tolerate temperatures as low as -9°C (15°F). The plant prefers full sun exposure and requires
    minimal maintenance, making it an attractive option for sustainable landscapes.


    ✂️🫘 Methods to Propagate:

    Perennial peanut is primarily propagated through rhizome division or the planting of rhizome cuttings, as seed production
    is limited and unreliable. To establish new plants, obtain healthy rhizome segments from a mature, disease-free plant.
    Plant the rhizome pieces 2.5-5 cm (1-2 inches) deep in well-prepared soil, spacing them approximately 30-60 cm (12-24
    inches) apart to allow for adequate spread. Ensure the planting area is free of weeds and irrigate regularly until the
    plants are well-established, which typically takes one growing season.


    🌞💧 Sun and Water Requirements:

    Perennial peanut flourishes in full sun, requiring at least 6-8 hours of direct sunlight daily for optimal growth and
    flowering. While it can tolerate partial shade, reduced sunlight may lead to decreased flowering and less vigorous growth.
    The plant is drought-tolerant once established but benefits from regular watering during prolonged dry periods. In the
    initial establishment phase, consistent moisture is essential to promote healthy root development. Avoid overwatering,
    as perennial peanut prefers well-drained soils and can be susceptible to root rot in waterlogged conditions.


    🧑‍🌾👩‍🌾 When to Harvest:

    As an ornamental ground cover, perennial peanut does not require harvesting. However, if used as forage for livestock,
    mowing or grazing can commence once the stand is well-established, typically within 3-6 months after planting. For optimal
    nutritional value and palatability, harvest the foliage when it reaches a height of 15-20 cm (6-8 inches). Regular harvesting
    or grazing encourages new growth and maintains the plant''s dense, low-growing habit. Avoid overgrazing or cutting the
    plants too short, as this can stress the plants and reduce their vigor.'
