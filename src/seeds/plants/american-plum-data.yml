  description: "American plum (Prunus americana) is a thicket-forming native fruit
    tree of North American prairies, edges, and disturbed ground, producing masses of
    fragrant white spring flowers followed by red to yellow plums with tart golden flesh.
    Height varies with genetics and site—often 15–25 feet (4.5–7.5 m)—but the real
    habit is colonial suckers that build wildlife hedges faster than fence installers
    quote jobs. It belongs in food forests as an early-succession fruiting screen and
    soil-stabilizing edge plant where you accept some chaos.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun yields the heaviest fruit; light shade still flowers but crops thin. Tolerates
    poor soils if drainage exists; benefits from mulch and occasional deep watering
    during fruit swell in dry years. Avoid chronic wet feet that stress roots and invite
    rots on compromised bark.\n\n✂️ Propagation:\nSow cleaned pits after cold stratification
    or plant pits in fall beds for natural cycles. Dig suckers with roots in early spring
    before budbreak for instant thickets. Chip budding or grafting onto seedling roots
    captures elite fruit clones without replanting the whole row.\n\n🌾 Harvest / Best
    Use Timing:\nPick when color deepens and flesh yields slightly to pressure—flavor
    swings from tart to jam-sweet quickly. Process into jam, shrub syrups, or wine;
    fresh eating quality is seed-forward. Thin old canes periodically to renew fruiting
    wood inside the thicket."
  purpose: |-
    - Edible: Small plums support fresh eating (spit seeds), preserves, and fermentations with high acid.
    - Wildlife Attractor: Flowers feed pollinators; fruit feeds birds, mammals, and insects in succession.
    - Border Plant: Suckering habit creates living fences and wind-slowing edge structure.
    - Erosion Control: Fibrous roots and thicket density hold soil on banks and old fields.
    - Pollinator: Early-season bloom overlaps with hungry bees after winter carbohydrate debt.
  companions:
