  description: |-
    Miner’s lettuce (Claytonia perfoliata) is a cool-season, succulent-textured annual or short-lived perennial (behaving annual in heat) famous for the perfoliate leaf pair that cups a slender flower stalk. Plants form loose rosettes and low mats, often volunteering in disturbed, moist shade; flavor is mild and lettuce-ish when young, before the plant gets stringy and philosophical.

    subtropical and tropical Americas: Grow as a winter–early spring green in shade; summer heat ends the romance quickly unless you have misty microclimate privilege.

    ☀️💧 Sun and Water Requirements:
    - Light shade to bright indirect light; direct tropical midday sun bleaches leaves faster than a tourism brochure.
    - Steady moisture; excellent in irrigated food forests under deciduous canopy edges or along north faces of mulched paths.

    ✂️ Propagation:
    - Broadcast ripe seed on raked, moist soil in fall; self-sowers will colonize mulch if you stop weeding like a control freak.
    - Transplant volunteers in cool weather; water in and mulch to reduce shock.

    🌾 Harvest / Best Use Timing:
    - Pick small rosettes and stems before flowering for the tenderest salads; after bloom, texture goes from silk to sisal.
    - Stagger plantings or harvest aggressively in mild winters to keep the patch producing before heat calls the season.
  purpose: |-
    - Edible: Nutrient-dense winter green where tomatoes are still drawing retirement plans.
    - Ground Cover: Living mulch that respects tree roots better than shallow-tilled annual beds.
    - Wildlife Attractor: Flowers feed small pollinators; foliage feeds the occasional slug (nature’s rude rebate).
    - Dynamic Accumulator: Juicy tissues shuttle minerals from soil to salad bowl when soils are decent—no mystic claims, just green chemistry.
  companions:
  - Apple — dappled understory of a young orchard row; miner’s lettuce fills the winter light gap without competing for deep water like grass.
  - Comfrey — mulch factory uphill; miner’s lettuce catches nutrients released in runoff after rains.
  - Ostrich Fern — taller fronds create the cool, humid microclimate that keeps miner’s lettuce from rage-quitting in early spring heat.
