  description: "Good King Henry (*Blitum bonus-henricus*, formerly *Chenopodium bonus-henricus*)
    is a European perennial vegetable related to spinach, forming a low mound of
    arrow-shaped leaves and tall flower spikes of tiny green blooms. Young shoots
    are eaten like asparagus; leaves are used as a cooking green. Plants spread slowly
    by rhizomes to form a patch 1–2 feet tall. In subtropical and tropical Americas it performs
    as a cool-season perennial—plant in part shade with steady moisture and harvest
    heavily before the steamy wet season stresses foliage.\n\n\U0001F31E\U0001F4A7
    **Sun and Water Requirements:**\nMorning sun and afternoon shade in hot climates.
    Rich, humusy soil that stays evenly moist but not flooded. Mulch keeps roots cool
    during warm months.\n\n✂️ **Methods to Propagate:**\n- **Root divisions:** Split
    crowns in early spring or fall; replant with buds just below the surface.\n-
    **Seeds:** Sow in cool weather; germination can be slow—keep seed trays from baking
    in direct tropical sun.\n\n\U0001F9D1‍\U0001F33E **When to Harvest:**\nPick shoots
    when pencil-thick in spring; harvest young leaves before flowering for mildest
    flavor. Blanch or cook like spinach; rotate harvest across the patch to avoid
    weakening the stand."
