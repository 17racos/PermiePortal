description: |-
  Water mimosa (Neptunia oleracea) is an aquatic, floating or semi-submerged legume grown for its edible leaves and pods and for its ability to thrive where water is available. Native to tropical regions, it forms fine, feathery foliage that spreads across wet areas and can cover the surface of small ponds or water-storing basins. In permaculture, it matters because it turns excess water into plant biomass: you can harvest edible greens while the canopy shades the water surface, reducing evaporation and helping stabilize shallow wetland systems. Plants are typically low-growing and spread horizontally across water surfaces.

  ☀️💧 Sun and Water Requirements:
  - Full sun is best for growth; shade slows canopy expansion.
  - Water-based cultivation: keep roots in standing water; don’t allow complete drying.
  - Prefers nutrient-rich, warm water; stagnant conditions are typical in its habitat.
  - Handles tropical heat well but may decline in cold spells.

  ✂️ Propagation:
  - Division/fragmentation: break off healthy growing tips and re-root them in shallow water; this is the quickest method.
  - Cuttings: take fresh stem segments and float them until they establish.
  - Seeds: sow in warm, wet conditions; germination depends on temperature stability.

  🌾 Harvest / Best Use Timing:
  - Harvest leaves regularly during warm months to encourage new growth.
  - For pods/seed: allow some plants to mature in place if you want seed production.
  - Use fresh leaves or process gently; aquatic greens can lose quality quickly if stored warm.
purpose: |-
  Aquatic: Neptunia oleracea floats feathery mimosa foliage on warm ponds -- entire life cycle happens on water, so site it in lined pools or controlled wetlands, not seasonal swales that dry to cracked clay.
  Edible: Young leaves and shoots enter Thai and Vietnamese soups as rau nhut -- harvest tips weekly for tenderness; older stems lignify fast.
  Water Retention: Floating mats shade stock ponds and reduce evaporative loss -- rhizosphere oxygenation is modest compared with true oxygenators, so pair with submerged plants if fish load is high.
companions:
- Water Hyacinth (Eichhornia crassipes) — supports wetland habitat complexity in many
  warm regions.
- Duckweed (Lemna minor) — small floating neighbor that fills water-surface micro-space
  while mimosa provides bigger foliage.
- Comfrey (Symphytum officinale) — nearby dry-bed companion; chop-and-drop can feed
  soil around pond edges.
cautions:
- Avoid cold conditions; aquatic legumes can struggle if water temperatures drop sharply.
pests:
- Aphids
- Spider Mites
- Whiteflies
diseases:
- Root Rot
