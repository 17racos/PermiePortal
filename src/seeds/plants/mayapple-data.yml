  description: "Mayapple (Podophyllum peltatum) is a spring ephemeral of eastern
    North American deciduous forests, spreading by underground rhizomes into colonies
    of twin umbrella leaves. A single nodding white flower hides beneath the forked
    leaf pair; ripe golden fruit is edible only when fully soft, while other tissues
    remain toxic. It is a signature ground layer for rich, shady food forests and
    native plantings where summer canopy keeps soil cool.\n\n☀️💧 Sun and Water Requirements:\n-
    Shade to dappled light; full sun burns foliage unless soil stays very moist and
    cool.\n- Moderate moisture; likes rich, well-drained humus that never bakes dry
    for weeks.\n- Cold winters required for dormancy; not suited to frost-free lowland
    tropics.\n\n✂️ Propagation:\n- Division of rhizome segments with at least one
    bud in autumn after leaves yellow.\n- Seeds: clean pulp from ripe fruit, cold-moist
    stratify several months, sow in deep flats; seedlings take years to flower.\n-
    Transplant small offsets in early spring with plenty of root mass and leaf litter
    mulch.\n\n🌾 Harvest / Best Use Timing:\n- Only fully ripe, soft yellow fruit
    is eaten in tiny amounts by those who know the plant; unripe fruit and other
    parts stay toxic.\n- For propagation, collect fruit when fragrant and yielding,
    not when firm and green.\n- Leave most fruit for wildlife and seeding—colonies
    expand slowly from overharvest."
  purpose: |-
    - Wildlife Attractor: Flowers and ripe fruit feed native pollinators and woodland frugivores.
    - Medicinal: Resin historically used with extreme care in professional herbal contexts—toxicity is real.
    - Ground Cover: Dense leaf pairs exclude many weeds in moist shade before canopy closure.
  companions:
  - Wild Leek — staggered phenology shares rich woodland soil without root trench warfare
  - Wild Ginger — low evergreen texture under mayapple umbrellas
  - Roughleaf Dogwood — shrub edge gives dappled light that mayapple expects
  cautions:
  - All plant parts except fully ripe fruit are toxic if eaten
  practitioner_notes: |-
    Colonies can take a decade from seed to bloom—division is the honest propagation path for mortals.
    “Edible” hype skips the part where wrong timing sends someone to urgent care—teach ripeness, not trends.
    Soil compaction from foot traffic collapses rhizomes; stake paths, not fantasies.
  growth_habit: Rhizomatous spring ephemeral with paired peltate leaves and hidden flowers
