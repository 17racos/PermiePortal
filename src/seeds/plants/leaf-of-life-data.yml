  description: "Leaf of life (Kalanchoe pinnata) is a succulent perennial with thick, scalloped leaves that produce complete
    plantlets along leaf notches—each baby can root where it falls, which is why the species spreads fast in warm, dry garden
    floors. Native to Madagascar and naturalized across humid tropics and subtropics, it shows up in Caribbean and Latin American
    food–medicine traditions for teas, poultices, and topical use stories you should verify with clinicians before treating
    anything serious. In permaculture it is a drought-honest ground-layer herb for bright shade to sun edges where drainage is
    sharp and irrigation is not a hobby.\n\n☀️💧 Sun and Water Requirements:\n- Bright light to partial shade; soft morning
    sun and afternoon shade reduces tip burn in hottest zones.\n- Extremely drought-tolerant once established; water deeply
    then let soil dry—wet feet rot crowns faster than aphid drama.\n- Sandy, rocky, or gravelly well-drained soil; containers
    need drainage holes that actually drain, not symbolic ones.\n\n✂️ Propagation:\n- Plantlets: detach marginal plantlets once
    they show roots and pot or tuck into soil—clonal and fast.\n- Leaf sections: lay thick cuttings on moist gritty mix until
    plantlets initiate.\n- Stem cuttings: use clean, callused ends in warm seasons; avoid crowding that hides mealybug condos.\n\n🌾
    Harvest / Best Use Timing:\n- Harvest mature leaves any season in frost-free cycles; younger leaves are often milder for
    kitchen experiments.\n- For topical use folk practice sometimes scores the waxy cuticle—research safe preparation before
    you paste leaves on skin.\n- Dry leaves in airflow, not sealed plastic bags, if you store for tea—mold is not a fermentation
    flex.\n\nBufadienolide-type compounds in the plant can be toxic to livestock and pets at quantity; human use overlaps with
    pregnancy contraindications in some references—treat identity and dosage as serious chemistry, not patio gossip."
