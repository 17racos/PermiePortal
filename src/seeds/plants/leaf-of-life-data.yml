  practitioner_notes: |-
    Bufadienolides mean livestock and dogs are not your test audience—fence, pot, or own the risk honestly.
    Pregnancy and heart-medication questions belong to clinicians, not your group chat.
    Plantlets self-deploy—harvest containment before neighbors learn your species via their fence line.
    Mealybugs love leaf axils—alcohol swabs beat denial spirals when populations stay small.
    If naturalizing is illegal in your region, keep it in pots and collect drops like you mean it.
