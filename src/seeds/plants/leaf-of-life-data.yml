  description: >-
    Leaf of Life (Kalanchoe pinnata) is a succulent perennial producing
    baby plantlets along the margins of its thick fleshy leaves — each
    notch sprouts a fully formed plant ready to root wherever it lands.
    Widely used in Caribbean and Latin American traditional medicine for
    respiratory conditions, wound healing, kidney stones, and fever reduction.
    Leaves are applied topically for burns, insect bites, and skin infections.
    Extremely drought-tolerant and thrives in Florida's sandy well-drained
    soils with minimal care. Propagates aggressively from leaf cuttings and
    dropped plantlets — a true set-it-and-forget-it medicinal herb for the
    food forest floor. Also known as Air Plant, Miracle Leaf, and Cathedral
    Bells in different regions.
  harvest_notes: >-
    Harvest mature leaves as needed throughout the year. Fresh leaves can
    be juiced, made into tea, or applied directly as a poultice. Remove
    the waxy cuticle before applying topically for better absorption. In
    Florida produces year-round with no seasonal dormancy.
