  description: "Frogfruit (*Phyla nodiflora*) is a low, mat-forming native perennial
    of the Americas, including Florida, with small opposite leaves and tiny white-to-lavender
    flowers in round heads. It tolerates mowing, foot traffic, and periodic flooding
    better than most turf alternatives, spreading by stolons to knit soil. Height
    is usually under 4 inches with flowers on short vertical stalks. In Puerto Rico
    and coastal Florida it is a workhorse for swales, pond edges, and hot pavement
    strips where salt spray occasionally occurs.\n\n\U0001F31E\U0001F4A7 **Sun and
    Water Requirements:**\nFull sun to light shade. Established mats are drought-tolerant
    but look freshest with occasional irrigation during dry season. Saturated wet
    season soils are fine if sunlight is adequate.\n\n✂️ **Methods to Propagate:**\n-
    **Stolons:** Press rooted runners into moist soil anytime it is warm; they root
    at nodes quickly.\n- **Cuttings:** Snip pieces with nodes, lay on damp sand or
    soil, and keep humid until anchored.\n\n\U0001F9D1‍\U0001F33E **Harvest / Best
    Use Timing:**\nFor living mulch establishment, plant before rainy season for
    fastest spread. Trim or roll mats after flowering if you need a tighter look;
    leave some flowers for pollinators during peak heat."
