  description: |-
    Common arrowhead is the pond plant with leaves shaped like the tip jar sign and tubers ducks would vote for. Edible use is real but water quality is the sermon — only forage from clean systems you would actually swim in on a brave day. In subtropical and tropical Americas it handles hot summers in shallow water and dies back in winter while rhizomes wait.
    
    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade at pond edges.
    - Shallow water a few inches to a foot or saturated mud; tolerates fluctuation.
    - Fertile muck increases tuber size; poor sites yield decorative leaves only.
    
    ✂️ Methods to Propagate:
    - Rhizome/tuber division during dormancy or early spring.
    - Seeds: sow on wet mud; keep flooded lightly as seedlings establish.
    
    🌾 Harvest / Best Use Timing:
    - Harvest Arrowhead in warm active growth when leaves or shoots look crisp, before yellow water-stress marches in.
    - Morning picks ship better than wilted afternoon drama -- rinse grit in clean water, not pond soup.
    - Use quickly or blanch and freeze; aquatic tissues turn slimy faster than upland herbs in plastic bags.
