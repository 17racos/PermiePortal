  description: 'Longleaf pine (Pinus palustris) is a southeastern United States pine of sandy savannas and flatwoods, famous
    for long needles in bundles of three, a grass stage seedling era, and dependence on fire-maintained openness. Mature trees
    reach 80–100 feet (24–30 m) with open crowns in savanna contexts. It is a keystone for biodiversity when prescribed fire
    returns on ecologically meaningful intervals—not when fear owns the deed.


    ☀️💧 Sun and Water Requirements:

    Full sun; shade during grass stage comes from frequent fire, not shade trees. Deep, acidic, well-drained sands typical
    of coastal plains; tolerates seasonal moisture swings. Compaction and lawn culture under mature pines kill the ground
    layer you supposedly planted for wildlife.


    ✂️ Propagation:

    Plant container or bareroot seedlings from local genotypes for restoration fidelity. Protect grass-stage juveniles from
    browse with cages. Thin competing hardwoods where savanna restoration is the actual goal.


    🌾 Harvest / Best Use Timing:

    Timber rotations are long—enter with eyes open. Collect cones for seed when scales open; handle with ethics and permits
    on public lands. Needle mulch benefits acid-loving companions if harvested without stripping green crowns.'
  purpose: |-
    Wildlife Attractor: Wildlife shows up for calories and cover: Longleaf pine (Pinus palustris) is a southeastern United States pine of sandy savannas and flatwoods, famous for long needles in bundles of three, a grass stage seedling era, and dependence on fire-maintained openness. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Windbreaker: Longleaf Pine builds a living wind-skin tall enough to protect tender crops and tunnel houses from desiccating gusts -- slows desiccating wind at edges and livestock lanes so understory crops keep turgor and transpiration sane
    Mulcher: Mulch workflows love predictable biomass: Needle mulch benefits acid-loving companions if harvested without stripping green crowns. -- turns fast leaf/stem turnover into mulch that feeds soil life and buffers moisture swings in mixed beds
    Biomass: Longleaf Pine prioritizes tons of organic matter for compost piles, deep mulch, or chop-and-drop under fruiting canopies -- feeds compost, biochar feedstock, or bulk mulch systems where volume matters more than gourmet calories

  companions:
