  description: "Longleaf pine (Pinus palustris) is a southeastern United States pine of sandy savannas and flatwoods, famous for long needles in bundles of three, a grass stage seedling era, and dependence on fire-maintained openness. Mature trees reach 80–100 feet (24–30 m) with open crowns in savanna contexts. It is a keystone for biodiversity when prescribed fire returns on ecologically meaningful intervals—not when fear owns the deed.\n\n☀️💧 Sun and Water Requirements:\nFull sun; shade during grass stage comes from frequent fire, not shade trees. Deep, acidic, well-drained sands typical of coastal plains; tolerates seasonal moisture swings. Compaction and lawn culture under mature pines kill the ground layer you supposedly planted for wildlife.\n\n✂️ Propagation:\nPlant container or bareroot seedlings from local genotypes for restoration fidelity. Protect grass-stage juveniles from browse with cages. Thin competing hardwoods where savanna restoration is the actual goal.\n\n🌾 Harvest / Best Use Timing:\nTimber rotations are long—enter with eyes open. Collect cones for seed when scales open; handle with ethics and permits on public lands. Needle mulch benefits acid-loving companions if harvested without stripping green crowns."
  purpose: |-
    - Wildlife Attractor: Open savanna structure supports gopher tortoise associates, red-cockaded woodpecker habitat where ranges overlap, and diverse ground flora.
    - Windbreaker: Mature stands blunt wind along fields and rural homesteads in warm climates.
    - Mulcher: Pine straw cycles nutrients and maintains acidic duff layers.
    - Biomass: Timber and straw products where markets and stewardship align.
  companions:
  - Loblolly Pine — different life history; avoid mixing goals unless land plan explains the contrast
  - Little Bluestem — warm-season grass layer in fire-maintained savanna plantings
  - Florida Paintbrush — native forb contributing late-season pollinator resources in open pine systems
  cautions:
  - Fire exclusion — savanna becomes dense woods and groundlayer biodiversity collapses
  - Wrong site clay — poor growth and root disease; match genotype to soil drainage
  pests:
  - Borers
  - Scale Insects
  practitioner_notes: |-
    Grass stage can last years—protect it like the bottleneck it is.
    Fire is a tool, not arson—train, permits, neighbors, weather windows.
    Longleaf savanna is a community project measured in decades—calendar like a land trust.
    Needles in threes, cones big—learn field marks before planting hundreds for “wildlife.”
  growth_habit: Tall pine; long needles in threes; savanna and flatwoods; fire-adapted grass stage
