  description: "The tangerine tree is a small to medium-sized evergreen, typically
    reaching heights of 4.5–6 meters (15–20 feet). It bears glossy, lance-shaped leaves
    and fragrant white flowers that give way to bright orange, easily peelable fruits.
    Tangerines thrive in full sun and well-draining, slightly acidic soils. They require
    regular watering, especially during dry periods, but are sensitive to waterlogged
    conditions.\n\n✂️\U0001FAD8 Methods to Propagate:\nTangerines are commonly propagated
    through grafting onto rootstocks, which ensures disease resistance and desired
    fruit characteristics. They can also be grown from seeds, but seedlings may not
    produce true-to-type fruit.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nTangerine
    trees require full sun exposure, receiving at least 6–8 hours of direct sunlight
    daily. They prefer consistent moisture but need well-draining soil to prevent
    root rot.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nThe
    fruits are typically ready for harvest from late fall to early spring. Mature
    tangerines should be firm and heavy for their size, with a deep orange color.
    They do not continue to ripen after picking, so ensure they are fully mature before
    harvesting."
  purpose: |-
    - **Edible:** Tangerines provide nutritious fruits rich in vitamin C and antioxidants, suitable for fresh consumption or use in various culinary applications.
    - **Pollinator:** The fragrant blossoms attract bees and other pollinators, supporting the health of the local ecosystem.
    - **Wildlife Attractor:** The tree offers habitat and food for various bird species and beneficial insects.
