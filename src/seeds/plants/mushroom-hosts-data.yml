  description: "This is not one species — it is the cheat sheet for where gourmet
    wood-decay fungi meet your food forest. Living trees, thinned trunks, stumps,
    hugelkultur bones, and hardwood chips are all fungal real estate; the trick is
    matching species to substrate and moisture. North Florida's long warm season can
    speed colonization but also dry logs — shade, mulch skirts, and irrigation pulses
    beat crispy mycelium. Identify every fruit before you sauté; the PermieBro move
    is certainty, not bravado.\n\n☀️💧 Sun and Water:\n- Fruiting blocks and logs:
    indirect light or dappled shade; avoid baking afternoon sun on small stacks.\n-
    Substrate should stay moist like a wrung sponge, never anaerobic soup.\n- Airflow
    matters — stale pockets invite molds you did not invite.\n\n✂️ Propagation:\n-
    Plug spawn or sawdust spawn into fresh hardwood logs; wax holes.\n- Chip beds:
    layer woody mulch, inoculate, keep moist through colonization.\n- Stumps:
    drill-and-fill or natural colonization from nearby sources."
  purpose: |-
    Mushroom hosts turn wood and waste carbon into food and living soil:

    - Edible: Many choice species on logs, stumps, and chips once colonized.
    - Medicinal: Species-dependent; research the actual fungus, not the Pinterest
      thumbnail.
    - Mulcher: Mycelium pre-digests lignin and feeds the soil food web.
    - Soil Improvement: Hyphal networks and spent substrate build structure and
      biology.
