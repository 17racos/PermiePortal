  description: "Yellow dock is a robust perennial weed with wavy-edged leaves,
    tall rust-colored seed spikes, and a taproot that laughs at your hoe. Young leaves
    are edible when cooked (oxalates—do not mainline raw salads). Roots are the classic
    bitter alterative of herbalism; seeds feed birds and your socks.\n\nIt shows up
    in compacted, disturbed, or slightly acidic soils across subtropical and tropical Americas pastures
    and garden edges. You can fight it or employ it—either way it has opinions.\n\nSun
    and water: Full sun to part shade; tolerates poor fertility and seasonal wet/dry.
    Moderate moisture is fine; it is not an aquatic.\n\nPropagation: Seeds by the
    million; root fragments resprout; transplant young rosettes in wet season if you
    insist on domesticating a feral accountant."
  purpose: |-
    Dynamic accumulator and compaction probe; edible/medicinal herb for people who
    read oxalate warnings; wildlife seed source. In a manicured lawn it is the villain;
    in a polyculture alley it is free biomass.
