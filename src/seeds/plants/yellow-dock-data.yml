  description: 'Yellow dock is a robust perennial weed with wavy-edged leaves, tall rust-colored seed spikes, and a taproot
    that laughs at your hoe. Young leaves are edible when cooked (oxalates—do not mainline raw salads). Roots are the classic
    bitter alterative of herbalism; seeds feed birds and your socks.


    It shows up in compacted, disturbed, or slightly acidic soils across pastures and garden edges. You can fight it or employ
    it—either way it has opinions.


    ☀️💧 Sun and Water Requirements:


    Full sun to part shade; tolerates poor fertility and seasonal wet/dry. Moderate moisture is fine; it is not an aquatic.


    ✂️ Propagation:


    Seeds by the million; root fragments resprout; transplant young rosettes in wet season if you insist on domesticating
    a feral accountant.


    🌾 Harvest / Best Use Timing:


    Gather young leaves cooked for greens; dig roots on traditional schedules if medicine is your lane—oxalates still apply.'
  purpose: '- Edible: Young cooked leaves for people who respect oxalate math.

