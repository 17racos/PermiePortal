description: |-
  Crimson Clover (Trifolium incarnatum) is a fast-growing, nitrogen-fixing annual or biennial plant. It reaches heights of 30–60 cm (12–24 inches) with bright red, tubular flower clusters that bloom in early spring or fall. The plant has hairy, trifoliate leaves and an extensive root system that enhances soil structure.

  This clover is widely used as a cover crop, green manure, and erosion control plant. It thrives in well-drained soils with moderate fertility and prefers cooler temperatures. Its vibrant flowers attract pollinators such as bees and butterflies, making it a beneficial plant for food forests and agricultural systems.

  Prefers full sun but tolerates partial shade. Requires well-drained soil with moderate fertility. Drought-tolerant once established but benefits from consistent moisture.

  Seeds: Direct sow in late summer to early fall for a winter cover crop or in early spring for a summer crop. Self-seeding: Can reseed itself in favorable conditions. No transplanting: Best grown from direct sowing rather than transplants.

  Harvest as a green manure before flowering for optimal nitrogen fixation. Can be cut for mulch when plants reach 30 cm (12 inches) in height. Flowers can be left to attract pollinators or harvested for seed collection.
purpose: |-
  Nitrogen Fixer: Trifolium incarnatum nodulates with rhizobia -- mow or incorporate at early bloom if you want green manure without hard seed filling the seedbank.
  Pollinator: Bright red tubular flower heads are nectar-heavy for bumblebees and honeybees in cool spring or fall cover-crop windows.
  Wildlife Attractor: Blooming strips feed diverse bees and seed-eating birds if some heads mature on field margins.
  Mulcher: Soft tops break down fast when flail-mowed -- use residues as surface mulch before woody crops or vegetable turnover.
  Dynamic Accumulator: Hairy trifoliate leaves and stems return phosphorus and potassium in ash-green tissue when cut green.
  Erosion Control: Fibrous roots bind soil on slopes and road shoulders during the cool-season growth window.
  Animal Fodder: High-protein forage for ruminants when harvested before stems lignify -- confirm local guidance on bloat risk with lush legume stands.
  Border Plant: Dense rows mark field edges and orchard alleys with crimson color while fixing nitrogen between tree rows.
  Pest Management: Thick stands smother winter annual weeds early -- rotate away from other legumes to break pest cycles, not magic.
