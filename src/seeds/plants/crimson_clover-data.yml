  practitioner_notes: 'Sow six to eight weeks before frost kill for winter cover—late planting gives skimpy rosettes that
    frost erases.

    Mow or crimp at early bloom if avoiding seed set—full crimson is pretty but volunteers follow.

    Inoculate with appropriate rhizobia—generic bean mix may nodulate poorly on true clovers.

    Root rot shows in wet heavy soil—raise beds or mix sand before expecting crimson carpets on clay vanity.'
