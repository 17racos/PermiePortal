  description: "Western miner's lettuce (*Claytonia perfoliata*) is a cool-season
    annual (sometimes overwintering) salad green recognized by perfoliate leaves—pairs
    fused into a disk around the stem—and loose clusters of tiny white flowers. Plants
    form low carpets under 40 cm (16 in) in favorable cool weather. Native to western
    North America, it has naturalized in many mild climates and can be grown in Florida
    and Puerto Rico during the cooler part of the subtropical/tropical year when
    night temperatures drop enough to suppress bolting; it will finish fast when
    heat arrives.\n\n☀️💧 **Sun and Water Requirements:**\nBright shade to half-day
    sun in warm climates; full morning sun with afternoon shade reduces tip burn.
    Keep soil evenly moist but not stagnant; rich loam with compost mimics forest
    edges where it thrives.\n\n✂️ **Methods to Propagate:**\n- **Seeds:** Direct-sow
    in fall through early winter in warm regions, or succession-sow every few weeks
    during the cool window.\n- **Volunteers:** Allow a few plants to set seed; scattered
    seedlings appear next season in mulched beds.\n\n🌾 **When to Harvest:**\nClip
    young rosettes and stem tips before flowers toughen; harvest in the cool part
    of the day for crisp texture. Pull whole plants if heat spike causes bitterness
    and replan with the next cool spell."
  purpose: |-
