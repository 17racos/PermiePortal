    \ or aquaponics water speeds growth.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Stem cuttings root at nodes in water or\
    \ wet media.\n- Never release plants or water to natural systems.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to\
    \ Harvest:\n- Cut tips repeatedly; plant responds bushy.\n- Cook before eating; some contexts recommend caution with heavy-metal\
    \ uptake — know your water source."
  purpose: 'Water spinach is high-yield greens with regulatory baggage:


    - Edible: Fast leafy vegetable for warm, wet cultivation.

    - Ground Cover: Dense mat along pond edges in controlled systems.

    - Water Purifier: Can uptake nutrients in constructed wetlands (managed systems only).

    - Green Manure: Excess biomass can be composted on-site — not exported to wild water.'
