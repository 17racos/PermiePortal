  description: 'Purple lovegrass (Eragrostis spectabilis) is a short-lived to perennial bunchgrass of eastern North American
    dry roadsides, glades, and prairie edges, famous for airy panicles that blush reddish purple in late summer and catch
    backlight like smoke. Clumps reach 1–2 feet (30–60 cm), seeding gently into gravel and sunny gaps. It is a staple for
    green roofs, hellstrips, and meadow matrices that need fine texture without bamboo ambition.


    ☀️💧 Sun and Water Requirements:

    Full sun for strongest color and flowering; shade yields green anonymity. Lean, well-drained soils are ideal; tolerates
    drought and occasional salt splash along paths. Avoid wet clay that rots crowns; water only to establish.


    ✂️ Propagation:

    Sow seed in fall or early spring; lightly cover—germination improves with warmth. Divide small clumps in spring if you
    must; plants often perform better from seed in lean sites. Cut back seed heads before they tumble into neighbor’s perfection
    if needed.


    🌾 Harvest / Best Use Timing:

    Cut inflorescences for dried arrangements when color peaks but before shattering. Leave some seed for ground-feeding birds.
    Peak display tracks late-summer heat and shortening days, not imported holiday schedules.'
