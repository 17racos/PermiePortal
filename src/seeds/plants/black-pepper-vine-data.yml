  description: |-
    Black pepper vine (Piper nigrum) is a warm-climate climbing perennial that grows with support, producing peppercorns in tiers along the vine. It is native to tropical wet regions of South and Southeast Asia, where humid forests give it bright shade and stable moisture. In permaculture, it turns a living trellis into both food and a long-lived aromatic canopy connection, with leaves contributing biomass and the vine moderating harsh sun below.
    
    ☀️💧 Sun and Water Requirements:
    - Partial shade to filtered light; full sun without moisture stresses the vine.
    - Needs consistently moist conditions during active growth; drought reduces yields.
    - Prefers fertile, well-drained soil rich in organic matter and leaf litter.
    - Avoid cold snaps and frost; growth slows when temperatures drop.
    
    ✂️ Propagation:
    - Seeds: soak and sow in warm starter mix; germination commonly takes 3–8 weeks in steady warmth.
    - Cuttings: take stem cuttings with nodes and root under humidity; plan on 6–10 weeks to establish.
    - Layering: pin a flexible vine into moist soil until it forms roots.
    
    🌾 Harvest / Best Use Timing:
    - Harvest pepper when berries shift from green to red; pick in rounds as clusters ripen unevenly.
    - Dry peppercorns in airflow until fully dry, then grind as needed.
    - Light pruning after harvest redirects growth up the trellis.
