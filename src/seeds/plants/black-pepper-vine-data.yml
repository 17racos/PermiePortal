description: |-
  Black pepper vine (Piper nigrum) is a warm-climate climbing perennial that grows with support, producing peppercorns in tiers along the vine. It is native to tropical wet regions of South and Southeast Asia, where humid forests give it bright shade and stable moisture. In permaculture, it turns a living trellis into both food and a long-lived aromatic canopy connection, with leaves contributing biomass and the vine moderating harsh sun below.

  Partial shade to filtered light; full sun without moisture stresses the vine. Needs consistently moist conditions during active growth; drought reduces yields. Prefers fertile, well-drained soil rich in organic matter and leaf litter. Avoid cold snaps and frost; growth slows when temperatures drop.

  Seeds: soak and sow in warm starter mix; germination commonly takes 3–8 weeks in steady warmth. Cuttings: take stem cuttings with nodes and root under humidity; plan on 6–10 weeks to establish. Layering: pin a flexible vine into moist soil until it forms roots.

  Harvest pepper when berries shift from green to red; pick in rounds as clusters ripen unevenly. Dry peppercorns in airflow until fully dry, then grind as needed. Light pruning after harvest redirects growth up the trellis.
purpose: |-
  Edible: Piper nigrum spikes produce green berries that sun-dry into black peppercorns with sharp piperine heat -- pick whole pendules when one berry reddens, then strip before sun-ferment splits quality.
  Medicinal: Essential oil from berries shows up in warming topical rubs and old malaria-era tonics -- internal essential oil use stays outside sane kitchen experiments.
  Shade Provider: Lianas trained on rough posts throw moving shade over coffee and ginger understories while leaf litter keeps humidity honest -- avoid deep shade on juvenile vines or flowering collapses.
  Wildlife Attractor: Slender catkin-like flower spikes feed gnats and small bees that evolved with Piperaceae in Asian forests -- minimal bird use compared with fruit-heavy canopy vines.
companions:
  - Coffee (Coffea arabica) — shares warm, shaded understory needs and benefits from coordinated moisture management.
  - Ginger (Zingiber officinale) — understory companion that likes warm, humid soil and uses leaf litter as mulch.
  - Banana (Musa acuminata) — provides vertical structure and leaf biomass that supports a humid microclimate edge.
cautions:
  - Vulnerable to frost and prolonged cold; plan for protection or warm-wall trellises in cool climates.
pests:
  - Aphids
  - Spider Mites
  - Scale Insects
  - Borers
