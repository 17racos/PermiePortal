  description: "California poppy (Eschscholzia californica) is a famous western North
    American annual or short-lived perennial (behavior varies by climate) with finely
    divided blue-green foliage and satiny orange, yellow, or cream cup-shaped flowers
    that close on cloudy days. Plants typically reach 15–45 cm (6–18 inches) tall
    and reseed freely in open, lean soils.\n\n🌞💧 Sun and Water Requirements:\n-
    Full sun; blooms close in shade.\n- Excellent drainage; highly drought-tolerant
    once established. In subtropical and tropical Americas, grow during the cooler dry season
    for best color—humid wet-season heat often shuts down flowering and encourages
    root decline unless soil is very sharp and airy.\n- Water lightly during establishment;
    avoid overhead irrigation that keeps foliage wet overnight.\n\n✂️ Methods to Propagate:\n-
    Seeds: Direct-sow in fall (subtropical/tropical) or early spring after last cool
    spell; barely cover; germinates quickly in warm soil.\n- Transplants: Move young
    seedlings while small; taproots resent disturbance.\n\n🌾 Harvest / Best Use Timing:\n-
    Collect dry capsules before they shatter if you want controlled reseeding. Flowers
    are delicate in arrangements; use fresh in morning. Some people use aerial parts
    as a mild nervine—confirm local regulations and personal tolerance."
