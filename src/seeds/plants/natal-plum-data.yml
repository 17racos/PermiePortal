description: |-
  Natal plum is the salt-tolerant hedge with milky sap and red fruit that tastes like cranberry propaganda — glossy leaves, thorns for trespasser feedback, and flowers that perfume evenings. Fruit is edible ripe; unripe and other plant parts are not snack material. subtropical and tropical Americas coastal 9b+ often works inland with mulch on cold nights.

  Full sun for dense growth and fruit; tolerates light shade with fewer flowers. Well-drained soil; tolerates sandy coastal sites and moderate salt spray. Drought-tolerant when established; occasional deep watering improves fruit plumpness.

  Semi-hardwood cuttings with warmth and humidity root reliably. Seeds: slow and variable; cuttings win the backyard timeline.

  Natal Plum: pick peak flavor when fruits soften slightly and detach easily -- birds are a parallel calendar. Harvest after dew dries to reduce mold in baskets. Jam batches same day if humidity is high; acid and sugar balance matter more than Instagram gloss.
purpose: |-
  Edible: Ripe Carissa macrocarpa “num-num” drupes taste tart-sweet out of hand or cook into jelly once fully colored and slightly yielding -- milky sap and unripe fruit stay toxic, so harvest discipline beats bravado in hedgerow snacks.
  Ornamental: Glossy opposite leaves, jasmine-scented starry flowers, and thorny architecture train into formal coastal hedges or sculptural shrubs -- salt spray tolerance keeps foliage crisp on dunes where inland shrubs bleach.
  Wildlife Attractor: Night-fragrant flowers call sphinx moths and other evening pollinators; ripe red fruit feeds mockingbirds and thrashers -- net interior scaffolds or accept shared drops along fencelines.
  Erosion Control: Deep, fibrous roots bind shifting sand on coastal cuts and overwash berms while foliage sheds salt -- pair with dune sunflower or seagrape for staggered root depths on storm-prone slopes.
