  description: |-
    Dasheen is the starchy aroid corm crop behind poi dreams and calcium oxalate lectures. Raw tissue irritates — cook it like an adult. It loves heat, humidity, and wet feet options from boggy edges to well-watered beds. In North Florida treat as perennial with heavy winter mulch in marginal years; freezes set tops back but established corms often return if rot does not win first.

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; intense afternoon sun wants extra water.
    - Consistently moist soil; pond margins or irrigation ditches are classic.
    - Rich organic matter; fertility shows up in leaf size and corm yield.

    ✂️ Methods to Propagate:
    - Offshoots: separate keiki-like pups from parent clumps in warm season.
    - Corm sections: traditional propagation where sanitation is strict to avoid rot.
  purpose: |-
    Dasheen is calories from wet ground without pretending to be wheat:

    - Edible: Corms and properly prepared leaves in cultures that know the recipes.
    - Aquatic: Sedges-and-bogs aesthetics with actual food output.
    - Erosion Control: Roots stabilize muddy margins where aesthetics matter.
    - Mulcher: Large leaves chop-and-drop into wet guilds.
