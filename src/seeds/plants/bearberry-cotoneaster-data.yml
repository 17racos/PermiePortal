  description: 'Bearberry cotoneaster (Cotoneaster dammeri) is a low, creeping evergreen shrub widely used as a ground cover
    on slopes, walls, and urban hellstrips where mowing is a religion you reject. Small white spring flowers yield bright
    red berries that persist into winter for birds; stems root where they touch soil, knitting banks. Height typically stays
    under 12–18 inches (30–45 cm) with spreads much wider over time. In permaculture it stabilizes sun-baked slopes and provides
    winter bird food—check regional invasive guidance because some cotoneasters seed aggressively where climates match.


    ☀️💧 Sun and Water Requirements:

    Full sun to light partial shade; dense dry shade thins coverage. Tolerates drought once established; prefers well-drained
    soil and sulks in constantly soggy clay. Mulch during establishment reduces weed pressure until stems mesh.


    ✂️ Propagation:

    Layer stems by pinning to soil in spring; sever rooted pieces the following season. Semi-hardwood cuttings in summer root
    with humidity cover. Divide large mats carefully in early spring before sap runs hard.


    🌾 Harvest / Best Use Timing:

    Berries are bird food first; human use is limited and often bland or mealy—plan for wildlife value. Prune back edges that
    climb walls or swallow paths; renewal prune every few years if centers thin out.'
