  description: "Watercress (*Nasturtium officinale*) is a fast-growing, aquatic or
    semi-aquatic perennial herb native to Europe and Asia. It typically grows up to
    60 cm (24 inches) in length, with hollow, branching stems that float in water
    or sprawl over moist ground. The leaves are pinnately compound with oval to egg-shaped
    leaflets, and it produces small, white flowers in clusters. Known for its peppery,
    tangy flavor, watercress is one of the oldest known leaf vegetables consumed by
    humans.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nWatercress thrives
    in full sun to partial shade and requires constant moisture, often growing in
    shallow water or damp soil. It prefers slightly alkaline water conditions and
    is well-suited to hydroponic cultivation. :contentReference[oaicite:0]{index=0}\n\n✂️\U0001FAD8
    Methods to Propagate:\nWatercress can be propagated through seeds or cuttings.
    Seeds should be sown in moist soil or directly in water, while cuttings can root
    easily when placed in water or wet soil.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\nHarvest young shoots and leaves regularly to encourage bushier
    growth. Continuous harvesting is possible due to its rapid growth rate."
