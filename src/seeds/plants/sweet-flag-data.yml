  description: |-
    Sweet flag (Acorus calamus) is a sword-leaved marginal aquatic: fans of aromatic, parallel-veined leaves rising from thick rhizomes at pond edges, ditches, and bog gardens. European and Asian lineages differ in ploidy; North American gardeners sometimes grow Acorus americanus for native plant pedigrees—both read as “cattail’s stylish cousin.”

    subtropical and tropical Americas: Excellent for pond shelves, rain-garden swales, and container water features where roots stay wet but crowns get air. Puerto Rico’s wet season is native habitat energy if pots do not cook in full sun without water movement. Heat plus stagnant water invites stink and mosquitoes—design circulation like you mean it.

    ☀️💧 Sun and Water Requirements:
    - Full sun to part shade; afternoon shade helps foliage color in hottest sites.
    - Saturated roots or shallow submersion; never let potted specimens dry to straw.

    ✂️ Propagation:
    - Divide rhizomes in spring; each section needs growing tips and immediate placement in moist soil or shallow water.
    - Offsets from container clumps separate easily after a season of growth.

    🌾 Harvest / Best Use Timing:
    - Rhizomes historically used in tiny amounts for flavoring and herbal traditions—modern safety varies by chemotype; research before internal use.
    - Clip yellow leaves anytime; major division doubles stock better than wishful thinking.
  purpose: |-
    Medicinal: Traditional aromatic rhizome uses span cultures—treat it as a serious plant, not a spice rack stunt.
    Water Retention: Rhizomes knit soggy margins, slowing erosion and filtering fines from runoff.
    Ornamental: Vertical leaves and gold or variegated cultivars structure pond edges without pretending to be lawn.
  companions:
  - Pickerelweed — emergent spikes contrast leaf shape while sharing shallow water culture.
  - Cattail — taller backdrop behind sweet flag’s shorter fans if you manage spread legally and ethically.
  - Water Iris — rhizomes on similar shelves; stagger depths so neither rots the other’s crown.
  cautions:
  - Water hyacinth — floating mats shade marginals and crash dissolved oxygen when unmanaged in still water.
  - Alligatorweed — aggressive stems smother shallow shelves and turn pond edges into monoculture soup.
  pests:
  - Aphids
  - Fungus Gnats
  - Snails
  growth_habit: Rhizomatous marginal aquatic; fanning aromatic leaves; clumps expand slowly
