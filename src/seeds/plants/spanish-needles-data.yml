description: |-
  Spanish needles (Bidens bipinnata) is a warm-season annual composite native to the Americas and naturalized widely, famous for barbed seeds that hitchhike on socks and dog fur. Ferny leaves and small yellow daisies read delicate until you meet the burrs. It is a disturbance plant with real pollinator value, a salad green in cautious traditions, and a lesson in footwear.

  Full sun; shade reduces bloom and weakens stems. Moderate moisture; tolerates short drought once established in warm months. Average to poor soils; thrives in disturbed ground where competition is temporarily low.

  Seeds require no pampering—often volunteers too well near trails. Thin dense stands to improve airflow if mildew appears. Remove before burr set if managing playgrounds or dog parks.

  Young leaves are eaten as a cooked green where water quality is clean and ID is certain. Pick flowers at peak for pollinators, not bouquets—vase life is humble. Stop seed before burrs form if you regret last year’s sock archaeology.
purpose: |-
  Edible: Bidens bipinnata young ferny greens enter southern foraging lore after careful ID -- nearby highway ROW harvests fail every heavy-metal sniff test.
  Pollinator: Tiny yellow disk flowers drip nectar for sweat bees along disturbed field margins through late summer heat.
  Wildlife Attractor: Barbed achenes stick to deer fur while foliage hosts painted lady larvae in weedy succession plots.
  Dynamic Accumulator: Fast annual biomass lifts nutrients from compacted alley soils -- mow before bur marigold seeds deploy if compost piles need the carbon.
