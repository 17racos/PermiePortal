  description: "Spanish needles (Bidens bipinnata) is a warm-season annual composite
    native to the Americas and naturalized widely, famous for barbed seeds that
    hitchhike on socks and dog fur. Ferny leaves and small yellow daisies read delicate
    until you meet the burrs. It is a disturbance plant with real pollinator value,
    a salad green in cautious traditions, and a lesson in footwear.\n\n☀️💧 Sun and
    Water Requirements:\n- Full sun; shade reduces bloom and weakens stems.\n- Moderate
    moisture; tolerates short drought once established in warm months.\n- Average
    to poor soils; thrives in disturbed ground where competition is temporarily low.\n\n✂️
    Propagation:\n- Seeds require no pampering—often volunteers too well near trails.\n-
    Thin dense stands to improve airflow if mildew appears.\n- Remove before burr
    set if managing playgrounds or dog parks.\n\n🌾 Harvest / Best Use Timing:\n-
    Young leaves are eaten as a cooked green where water quality is clean and ID
    is certain.\n- Pick flowers at peak for pollinators, not bouquets—vase life
    is humble.\n- Stop seed before burrs form if you regret last year’s sock archaeology."
