  description: 'Lychee is the soapberry-family diva: glossy evergreen leaves, panicles of cream flowers, and fruit that spoils
    faster than your weekend plans. Wind, soggy roots, and winter nerves are how dreams die.


    In-ground reliability needs serious frost-free microclimate; marginal zones mean potted culture or periodic dieback. True
    tropical lowlands suit lychee where drainage and wind protection are handled—dry-season irrigation discipline matters
    everywhere.


    ☀️💧 Sun and Water Requirements:


    Full sun for flowering and fruit set once hardened off.

    Deep, acidic, well-drained soil; careful irrigation—Phytophthora does not need encouragement.


    ✂️ Propagation:


    Air-layering and grafting for true-to-type trees.

    Seeds for rootstock experiments, not fruit patience.


    🌾 Harvest / Best Use Timing:


    Pick clusters when skin rouges and sugars peak; handle gently—pericarp browning is the clock ticking.

    Eat or refrigerate promptly; “lychee logistics” is why backyard fruit beats grocery roulette.'
