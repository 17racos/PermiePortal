description: |-
  Lychee is the soapberry-family diva: glossy evergreen leaves, panicles of cream flowers, and fruit that spoils faster than your weekend plans. Wind, soggy roots, and winter nerves are how dreams die.

  In-ground reliability needs serious frost-free microclimate; marginal zones mean potted culture or periodic dieback. True tropical lowlands suit lychee where drainage and wind protection are handled—dry-season irrigation discipline matters everywhere.

  ☀️💧 Sun and Water Requirements:

  Full sun for flowering and fruit set once hardened off.
  Deep, acidic, well-drained soil; careful irrigation—Phytophthora does not need encouragement.

  ✂️ Propagation:

  Air-layering and grafting for true-to-type trees.
  Seeds for rootstock experiments, not fruit patience.

  🌾 Harvest / Best Use Timing:

  Pick clusters when skin rouges and sugars peak; handle gently—pericarp browning is the clock ticking.
  Eat or refrigerate promptly; “lychee logistics” is why backyard fruit beats grocery roulette.
purpose: |-
  Edible: Litchi chinensis arils are crisp-grape sweet with floral perfume when skin turns rough red -- eat or chill within hours because pericarp browning marks enzymatic clock, not patience.
  Ornamental: Glossy even-pinnate leaves and red new flushes read subtropical luxe -- protect young trees from desiccating wind or leaf margins bronze while fruit set aborts.
  Wildlife Attractor: Raccoons and birds strip color-break clusters overnight -- net entire canopies or harvest slightly green-ripe for cooking if vertebrate tithe is not budgeted.
companions:
- Longan — similar sapindaceous culture and pest scouting; pairing simplifies irrigation
  and organic spray timing at the orchard edge.
- Pigeon Pea — fixes nitrogen on the orchard perimeter without running roots under
  the lychee crown if you give it offset planting.
- Comfrey — chop-and-drop mulch and nutrient cycling under the drip line where grass
  competition would steal water.
cautions:
- High pH water and soil without amendment
- Lawn herbicide drift
pests:
- Aphids
- Boxelder Bug
- Caribbean Fruit Fly
- Scale Insects
growth_habit: Medium to large evergreen tree; dense rounded crown when managed
