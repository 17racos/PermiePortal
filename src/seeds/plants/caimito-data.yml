common_name: Caimito
picture: caimito.webp
scientific_name: Chrysophyllum cainito
aka:
- Star apple
- Milk fruit
family: Sapotaceae
zone: 10-11
ideal_temp_min: 65
ideal_temp_max: 95
min_temp: 28
max_temp: 110
perennial: true
layers:
- Tree
plant_function:
- Edible
- Shade Provider
- Wildlife Attractor
description: |-
  Chrysophyllum cainito is tropical dessert architecture: glossy leaves with bronze undersides, latex milky sap, and fruit that splits into a star-shaped interior when you behave and cut it horizontally. Truly tender when young; mature trees tolerate brief chills better but this is still a south-of-the-line gamble outside protected 10a microclimates.

  ☀️💧 Sun and Water Requirements:

  Full sun for best fruiting once established.
  Deep, fertile, well-drained soil; steady moisture during fruit development.
  Wind protection while young — snapping leaders is not on-brand.

  ✂️ Propagation:

  Seeds: viable fresh seed; juvenility is long — brace yourself.
  Grafting selected cultivars: the adult-in-the-room option.
  Air-layering works on known good trees.

  🌾 Harvest / Best Use Timing:

  When color matures (purple or green types) and flesh yields slightly — overripe goes mushy fast.
purpose: |-
  Edible: fruits yield sweet, milky-sap flesh for fresh slices when fully colored and slightly yielding -- latex stains knives but signals ripeness in green and purple types.
  Shade Provider: holds a glossy evergreen crown that throws dense shade for shade-tolerant understory crops once the tree reaches fruiting size in zone 10a+ microclimates.
  Wildlife Attractor: Ripe Chrysophyllum cainito star apples attract birds and mammals to the canopy and groundfalls, so harvest timing competes directly with frugivores in humid sites.
companions:
- Banana
- Papaya
- Guava
cautions:
- Exposed frost bowls on young trees
- Waterlogged heavy clay without drainage fixes
pests:
- Scale Insects
- Mealybugs
- Caribbean Fruit Fly
- Anthracnose
