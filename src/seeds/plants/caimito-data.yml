    cultivars: the adult-in-the-room option.\nAir-layering works on known good trees.\n\n🌾 Harvest / Best Use Timing:\n\nWhen color matures (purple or green types) and flesh yields
    slightly — overripe goes mushy fast."
  purpose: |-
    Edible: fruits yield sweet, milky-sap flesh for fresh slices when fully colored and slightly yielding -- latex stains knives but signals ripeness in green and purple types.
