  description: "Yellow jessamine (Gelsemium sempervirens) is a twining evergreen
    vine of woods edges, fences, and streamside thickets in the humid subtropical
    Gulf–Atlantic coastal plain and related climates where winters stay mild. Fragrant
    yellow trumpet flowers open in late winter to spring, a beacon for early pollinators.
    All parts contain toxic alkaloids—beautiful, useful for trellises, and absolutely
    not a salad ingredient.\n\n☀️💧 Sun and Water Requirements:\nFull sun to part shade;
    best flowering with morning sun and some afternoon relief in hottest zones. Average
    moisture with good drainage; tolerates brief dry spells once established. Mulch
    roots in marginal cold pockets; avoid salt spray saturation on foliage.\n\n✂️
    Propagation:\nSemi-hardwood cuttings in warm months root with humidity. Layer
    low stems to ground. Sow seed only if legally sourced and identified—slow and
    variable. Train on trellis; prune after main bloom to control size.\n\n🌾 Harvest
    / Best Use Timing:\nDo not harvest for food. Cut flowers sparingly for indoor
    display with wash hands after; keep arrangements away from pets and kids. Prune
    to direct growth away from gutters and power equipment."
