description: |-
  Saskatoon (Amelanchier alnifolia) is a useful perennial species in the Rosaceae family, native or long-naturalized across parts of the Americas and Eurasia depending on lineage. Mature growth is typically a shrub form suited to layered guilds, with reliable productivity when site conditions match its ecology. In a permaculture system it contributes food, habitat, and system resilience rather than single-crop output.

  ☀️💧 Sun and Water Requirements:
  Best performance comes with full sun to light partial shade, depending on heat intensity. Keep soil moisture steady during establishment, then water by seasonal demand. Well-drained fertile soil works for most upland entries, while wetland species require saturated margins. Most growth accelerates between 45°F (7°C) and 75°F (24°C), with stress rising near 90°F (32°C).

  ✂️ Propagation:
  Direct seeding is the simplest method where climate allows; sow at the start of the local favorable season and keep the seed zone evenly moist through germination. A second pathway is transplanting nursery starts or divisions once roots are active and temperatures are stable. Woody entries can also be established from dormant bare-root stock or grafted material for cultivar reliability.

  🌾 Harvest / Best Use Timing:
  Harvest edible portions at peak maturity for intended use: leafy crops before heat stress, fruiting types at full color, root crops after starch set, and nuts or grains once fully mature and dry. For ecological functions, the strongest value appears after canopy closure, flowering, and annual residue cycling, when soil cover and habitat effects become consistent.
purpose: |-
  Edible: Amelanchier alnifolia purple pomes sweeten into early-summer pies and pemmican trials on the same shrub sold as Saskatoon berry -- treat it as Amelanchier genetics, not a novel superfood template.
  Pollinator: Opening white clusters offer pollen and nectar during the handoff from spring fruit trees to summer vegetable rows in cool short-season zones.
  Wildlife Attractor: Soft fruit disappears to waxwings and robins the same week it ripens -- plan harvest windows or accept the birds as your sorting crew.
companions:
- Currant - similar moisture needs and partial-shade tolerance.
- Comfrey - mulch cycling improves berry yields over time.
- Chive - may reduce some fungal pressure and fits shrub guild edges.
cautions:
- Black Walnut - juglone can stress saskatoon in mixed orchards.
pests:
- Aphids
diseases:
- Leaf Spot
- Rust Mite
