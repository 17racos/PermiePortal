  description: "Creeping Jenny is a low, mat-forming perennial with round, bright
    green to golden leaves and small yellow cup-shaped flowers in late spring and
    summer. It roots at nodes and can spread aggressively in moist, fertile spots—fine
    for a contained bog edge or pot splash zone, less funny if it escapes into your
    whole yard. In warm humid climates it often behaves as a lush cool-season ground
    cover and can melt back in brutal heat unless it has steady moisture and some
    afternoon shade.\n\n☀️💧 Sun and Water Requirements:\n\nPart sun to full sun in cool climates; in
    hot humid sites, morning sun and afternoon shade keeps the foliage from frying.\nLikes consistently moist to wet soil; tolerates brief dry spells once established
    but looks trashy if you drought-stress it.\n\n✂️ Propagation:\n\nDivide mats any time;
    soft stem cuttings root in water or damp mix in days; pieces with nodes reroot
    if accidentally (or deliberately) scattered.\n\n🌾 Harvest / Best Use Timing:\n\nClip or divide mats as needed to manage spread and refresh appearance through the season."
