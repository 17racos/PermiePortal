  description: "Creeping Jenny is a low, mat-forming perennial with round, bright
    green to golden leaves and small yellow cup-shaped flowers in late spring and
    summer. It roots at nodes and can spread aggressively in moist, fertile spots—fine
    for a contained bog edge or pot splash zone, less funny if it escapes into your
    whole yard.\n\nIn subtropical and tropical Americas it often behaves as a lush winter–spring ground
    cover and can melt back in brutal heat unless it has steady moisture and some
    afternoon shade.\n\nSun and water: Part sun to full sun in cool climates; in
    the subtropics, morning sun and afternoon shade keeps the foliage from frying.
    Likes consistently moist to wet soil; tolerates brief dry spells once established
    but looks trashy if you drought-stress it.\n\nPropagation: Divide mats any time;
    soft stem cuttings root in water or damp mix in days; pieces with nodes reroot
    if accidentally (or deliberately) scattered."
  purpose: |-
    Dense living mulch along pond margins, paths, or shady wet pockets. Holds soil
    on slopes where turf is a bad joke. Flowers feed small pollinators. Treat it like
    a pet eel: pretty, useful, and capable of taking over the tank if you stop paying
    attention.
