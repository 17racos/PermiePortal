  description: 'Penguin gourds are Lagenaria siceraria selections bred for silly upright fruits that look like a kindergarten
    art project—same species as bottle gourds, different silhouette. Young fruit is edible like summer squash; most people
    grow them for crafts, birdhouses, and porch comedy.


    Long frost-free window helps fruits fully size and shells cure hard before cold. Trellis for cleaner fruit and fewer soil-borne
    scars.


    ☀️💧 Sun and Water Requirements:


    Full sun, fertile soil, even moisture while growing; back off water as fruits mature for curing.


    ✂️ Propagation:


    Direct-sow warm soil or careful transplant; fragile roots.


    🌾 Harvest / Best Use Timing:


    Pick young fruit for kitchen use; leave upright shapes on-vine until shells cure for crafts.'
