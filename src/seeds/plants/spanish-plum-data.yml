  description: 'Spanish plum (Spondias purpurea) is a market label for jocote, a tropical deciduous tree bearing tart-sweet
    plum-like fruit ripening through warm wet-to-dry seasonal cycles across Latin America and the Caribbean. Trees commonly
    reach 15–30 feet (4.5–9 m), flowering on leafless wood before new growth flushes. It belongs with other Spondias in diversified
    warm orchards where acid-forward fruit diversifies drinks and preserves.


    ☀️💧 Sun and Water Requirements:

    Full sun for reliable fruiting; partial shade only for juveniles. Deep, well-drained soils with irrigation in dry seasons
    prevent fruit drop. Wind protection helps when loads peak.


    ✂️ Propagation:

    Graft known selections; seedlings vary. Prune after harvest for structure and height control.


    🌾 Harvest / Best Use Timing:

    Pick when color and gentle yield align—lines vary from yellow to red. Process windfalls quickly to reduce fly pressure.
    Peak loads track local rainfall and heat, not temperate months.'
  purpose: '- Edible: Fruit supports fresh eating, pickles, and candies where regional recipes guide sugar and acid.

    - Wildlife Attractor: Flowers and fruit engage birds and insects where sharing is planned.

    - Shade Provider: Canopy shelters understory during wet-season leaf cover.

    - Windbreaker: Rows blunt steady winds on exposed tropical lots.'
  companions:
