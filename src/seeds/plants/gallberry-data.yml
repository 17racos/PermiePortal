  description: "Gallberry (Ilex glabra) is an evergreen holly of acidic wetlands, pine
    barrens, and coastal scrub in eastern North America, forming suckering thickets
    with spineless leaves, small greenish flowers, and black berries that persist
    into winter for birds. Historically tied to regional beekeeping as a honey plant,
    it also screens views and stabilizes organic banks where boxwood fantasies drown.
    The foliage is not a salad—treat grayanotoxins like the Ericaceae contract they
    are.\n\n☀️💧 Sun and Water Requirements:\nFull sun to partial shade; tolerates wet,
    acidic soils and periodic inundation better than many evergreens. Drought tolerance
    improves after establishment on sandy acid sites but not on alkaline fill. Mulch
    with organic acidity; chlorosis on lime is a predictable protest. Cold-hardy
    into northern temperate zones; southern forms handle heat with adequate soil moisture.\n\n
    ✂️ Propagation:\nSoftwood cuttings under mist root cleanly in warm months.\nSuckers
    can be separated with roots in early spring to expand hedges.\n\n🌾 Harvest / Best
    Use Timing:\nFor bee forage, leave extensive bloom in late spring. For landscape,
    prune after berry drop if you need a formal outline—heavy shearing reduces flowers
    and wildlife value."
  purpose: |-
    - Wildlife Attractor: Winter berries feed birds; early nectar supports diverse pollinators.
    - Border Plant: Evergreen thickets create living fences on wet, acidic ground.
