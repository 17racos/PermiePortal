  description: 'Groundnut (Apios—not peanut) is the native legume vine with edible tubers and beans if you cook them like
    a responsible primate. Twining stems, showy burgundy pea flowers, and a permaculture darling for eastern food forests.


    Temperate eastern North America aligns with its core range better than deep tropical lowlands; still triable with shade
    and moisture management.


    ☀️💧 Sun and Water Requirements:


    Full sun to light shade.

    Moist, rich soils produce heavier tubers; drought slows the party.


    ✂️ Propagation:


    Tubers, rhizome divisions, or scarified seed—harvest on a multi-year schedule so stands persist.


    🌾 Harvest / Best Use Timing:


    Dig tubers on multi-year rotations and replant small tubers so stands persist; cook beans responsibly.'
  purpose: '- Edible: Perennial protein and starch from tubers and properly cooked beans.

    - Nitrogen Fixer: Rhizobia on roots feed the guild nitrogen while vines run.

    - Wildlife Attractor: Showy pea flowers support pollinators in native-ish guilds.'
