  practitioner_notes: 'Tubers size over several seasons—rotate harvest patches and replant small tubers so the stand does
    not vanish.

    Scarify thick seed coats or soak changing water for a day—raw sowing often waits months for a single sprout.

    Japanese beetles cluster on new leaves—knock into soapy water at dawn during peak flights.

    Trellis twining stems or they knot neighbors—cattle panel gives airspace without daily untangling drama.'
