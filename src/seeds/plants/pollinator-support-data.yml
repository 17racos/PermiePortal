  description: "This is not one species — it is a design move. Pollinator support
    means stacking successive bloom, shallow drinking water, bare soil patches for
    ground-nesters, and a ban on panic-spraying every beetle. In Florida and Puerto Rico that
    translates to early brassica-family flowers, native asters and mistflower in
    fall, passion vines, basil left to bolt, and clumps of sunflower-ish chaos the
    HOA would hate if they knew what happiness looks like.\n\nSun and water track
    whatever you plant; the pattern is: 3+ seasons of nectar or pollen, night-blooming
    options where possible, and dead stems left overwinter for cavity-nesting bees.\n\n
    ☀️💧 Sun and Water (general):\n- Mix full-sun and part-shade species along edges.\n-
    Group by water need so you are not drowning dry-adapted plants.\n- Shallow dish
    with pebbles beats a deep bucket of bee drownings.\n\n✂️ Propagation:\n- Start
    with plugs, divisions, and seed of region-appropriate forbs and shrubs.\n- Repeat
    yearly — pollinator plantings are a habit, not a one-off flat from the box store."
  purpose: |-
    Pollinator support is stackable ecosystem service:

    - Pollinator: Continuous bloom feeds bees, wasps, flies, butterflies, moths.
    - Wildlife Attractor: Birds show up for insects and seeds.
    - Nitrogen Fixer: Legumes in the mix feed the guild cheaply.
    - Pest Management: Predatory insects camp where the nectar bar stays open.
    - Border Plant: Hedgerows and bed edges become habitat, not decoration.
    - Mulcher: Biomass from tall forbs feeds soil life when chopped and dropped.
