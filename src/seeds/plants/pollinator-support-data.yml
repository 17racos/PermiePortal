  description: |-
    This is not one species — it is a design move. Pollinator support means stacking successive bloom, shallow drinking water, bare soil patches for ground-nesters, and a ban on panic-spraying every beetle. In subtropical and tropical Americas that translates to early brassica-family flowers, native asters and mistflower in fall, passion vines, basil left to bolt, and clumps of sunflower-ish chaos the HOA would hate if they knew what happiness looks like.
    
    Sun and water track whatever you plant; the pattern is: 3+ seasons of nectar or pollen, night-blooming options where possible, and dead stems left overwinter for cavity-nesting bees.
    
     ☀️💧 Sun and Water (general):
    - Mix full-sun and part-shade species along edges.
    - Group by water need so you are not drowning dry-adapted plants.
    - Shallow dish with pebbles beats a deep bucket of bee drownings.
    
    ✂️ Propagation:
    - Start with plugs, divisions, and seed of region-appropriate forbs and shrubs.
    - Repeat yearly — pollinator plantings are a habit, not a one-off flat from the box store.
    
    🌾 Harvest / Best Use Timing:
    - For seed mixes and insectary strips, stagger bloom so something is open from frost-safe weeks through heat.
    - Cut spent flower heads before invasive self-sowers drop seed where you will regret diplomacy later.
    - Collect your own clean seed labeled by year; cheap mixes age out faster than hope.
  purpose: |-
    Pollinator: Successive bands of phacelia, sunflower, native asters, and bolting basils keep nectar or pollen on offer from last frost through first frost -- three-season overlap beats one-week monoculture flats for bee foraging budgets.
    Wildlife Attractor: Seed heads on composites and grasses feed finches while predatory wasps hunt caterpillars on the same stems -- leave standing dead stalks until spring warm so cavity-nesting bees keep rent-free apartments.
    Nitrogen Fixer: Clover, vetch, and partridge-pea pockets in the same strip fix atmospheric nitrogen that later crops access through mulch decay -- mow before hard seed if you need to hold volunteers inside the original bed geometry.
    Pest Management: Open flowers and extrafloral nectaries on sunflower family plants sustain syrphid flies and parasitoid wasps that suppress aphids on nearby vegetables -- still scout brassicas because habitat raises biocontrol odds, not certainties.
    Border Plant: Hedgerow depth of 8–15 feet along field edges replaces fence-line turf with layered forbs, shrubs, and small trees -- equipment gates stay planned so habitat does not block legal access lanes.
    Mulcher: Tall forb stems from sunflower and cosmos chop-and-drop after bloom to feed soil fungi ahead of winter cover crops -- shred coarse stems if you need faster worm integration on sand-rich beds.
