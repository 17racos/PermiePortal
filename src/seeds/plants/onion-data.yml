  description: "Onion (*Allium cepa*) is a biennial plant typically grown as an annual
    for its edible bulb. It produces narrow, hollow green leaves that grow from the
    base and can reach heights of 30–45 cm (12–18 inches). The plant forms a rounded
    bulb beneath the soil composed of fleshy, layered scales. Onions produce white
    or purple flowers arranged in umbels that rise from a hollow stalk in their second
    year. The strong aroma and flavor of onions are due to sulfur compounds present
    in the bulbs.\n\n\U0001F31E\U0001F4A7 **Sun and Water Requirements:**\nOnions
    thrive in full sun, needing at least 6–8 hours of direct sunlight daily. They
    prefer well-drained soil with moderate moisture levels. Overwatering can cause
    bulb rot, so soil should be allowed to dry between waterings.\n\n✂️\U0001FAD8
    **Methods to Propagate:**\nOnions are propagated through:\n- **Seeds:** Sown directly
    in the garden or started indoors 6–8 weeks before the last frost.\n- **Sets:**
    Small immature bulbs can be planted directly into the soil.\n- **Transplants:**
    Seedlings started indoors can be transplanted once the soil is workable.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    **When to Harvest:**\nOnions are ready to harvest when the tops begin to fall
    over and dry out. Carefully lift the bulbs from the soil and cure them in a dry,
    well-ventilated location for 2–3 weeks before storage."
  purpose: |-
    - **Edible:** Onions are consumed raw, cooked, pickled, and used to flavor a wide range of dishes.
    - **Medicinal:** Onions have antimicrobial and anti-inflammatory properties. They are also high in antioxidants and sulfur compounds, which may support cardiovascular health.
    - **Pest Management:** Onions produce sulfur compounds that deter many garden pests, including aphids, carrot flies, and beetles.
