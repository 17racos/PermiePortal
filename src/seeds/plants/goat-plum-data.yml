  description: "Goat plum (Terminalia ferdinandiana), widely known as Kakadu plum, is a semi-deciduous tree of northern Australian savannas and monsoon margins, bearing oval leaves, cream flower spikes, and pale green to yellow fruit famous for extreme vitamin C content. Cultivated specimens often reach 15–40 feet (4.5–12 m) with a spreading crown. It belongs in tropical dry-season/wet-season food systems where heat is reliable and frost is a rumor.\n\n☀️💧 Sun and Water Requirements:\nFull sun for flowering and heavy fruiting; young plants appreciate partial shade during establishment in blazing sites. Deep sandy to loamy soils with good drainage; tolerates seasonal moisture swings typical of monsoon climates. Avoid waterlogged heavy clay that suffocates roots during wet periods.\n\n✂️ Propagation:\nSow fresh seed soon after cleaning; desiccated seed loses viability quickly. Select parent trees with known fruit quality if establishing orchards. Prune for a single leader in cyclone-prone regions to reduce wind sail.\n\n🌾 Harvest / Best Use Timing:\nCommercial harvest timing follows local Indigenous protocols and fruit softening cues—respect cultural knowledge where it leads. Process fruit soon after picking for products that depend on vitamin stability. Protect young bark from machinery and livestock that treat trunks as scratching posts."
