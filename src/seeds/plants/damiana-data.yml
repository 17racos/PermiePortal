    hates wet feet in winter. Coastal dryness is fine; inland bog is not.\n\nSun and
    water: Full sun for dense growth and oils. Low to moderate water once established;
    behaves like it read the xeriscape pamphlet.\n\nPropagation: Semi-hardwood cuttings,
    seed in warm conditions; light scarification can help stubborn seed."
