description: |-
  Kiwi (Actinidia deliciosa) is a vigorous deciduous climbing vine grown for its fuzzy fruit and strong trellis habit. It is native to Asia and is now widely cultivated in temperate and warm temperate climates. Plants can reach 4–8 m (13–26 ft) on support, producing white flowers in spring and the familiar green-gold fruit in late season. In permaculture, it matters because it converts vertical space into edible harvest and creates a living canopy that cools understory crops.

  - Full sun for best fruit set; partial shade is tolerated but reduces yields.
  - Water consistently during flowering and fruit sizing; drought can shrink fruit.
  - Prefers deep, fertile, well-drained soil; avoid waterlogged roots.
  - Protect young vines from cold snaps and windy exposure.

  - Seeds: cold-stratify and expect variable fruit traits; germination may take weeks to months.
  - Cuttings: take semi-hardwood cuttings in warm season and root under humidity.
  - Grafting: commonly used to match fruit quality and pollination strategy.

  - Harvest fruit when it softens slightly and aroma is strong (it finishes ripening after picking).
  - Pick in rounds since ripeness can vary across the trellis.
  - Store cool for short-term use; longer storage keeps fruit firmer, then ripens off-vine.
purpose: |-
  Edible: Actinidia deliciosa ripens fuzzy berries with emerald flesh and black seeds -- finish ripening off-vine in the kitchen, and plant at least one male vine for every eight females so pollination math works.
  Pollinator: Creamy, saucer-shaped spring flowers offer pollen and nectar to honeybees before apples peak -- avoid insecticide during bloom if you want fruit set on marginal microclimates.
  Wildlife Attractor: Overripe windfalls feed opossums and raccoons along trellis bases -- pick early or net rows if vertebrate tithe conflicts with harvest goals.
companions:
- Comfrey (Symphytum officinale) — deep roots and chop-and-drop mulch help keep vine
  feeding consistent.
- Garlic (Allium sativum) — helps diversify smells around the trellis and supports
  rotation scheduling.
- Crimson Clover (Trifolium incarnatum) — cool-season ground cover that adds organic
  matter while you wait on fruiting.
cautions:
- Kiwi vines need appropriate male/female planting for fruiting (or reliable pollination
  partners).
pests:
- Aphids
- Scale Insects
- Spider Mites
- Root Rot