  description: |-
    Texas persimmon (Diospyros texana) is a drought-hardy, often multi-trunked small tree or large shrub with smooth gray bark, small leaves, and black juicy fruit when female plants find a pollinator partner. Heights commonly range 10–25 feet in the wild, tighter in harsh sites—roots laugh at limestone where other fruit trees send resignation letters.

    subtropical and tropical Americas: Best matches are dry, well-drained Florida sites with lean soil and sun—think scrub-adjacent yards, not swamp lots. Puerto Rico’s drier south coast microclimates may trial it with drainage discipline; humid cloud-forest moods invite anthracnose side quests. Fruit is astringent until fully ripe; patience is a ingredient.

    ☀️💧 Sun and Water Requirements:
    - Full sun for fruiting; partial sun tolerates but reduces crop swagger.
    - Extremely drought-tolerant once established; deep occasional watering beats daily spritz culture on sand.

    ✂️ Propagation:
    - Sow cleaned seed after pulp ferments off; germination can be slow—warm stratification experiments welcome.
    - Softwood cuttings with bottom heat in warm months for clonal females if you already know the parent’s sex and fruit quality.

    🌾 Harvest / Best Use Timing:
    - Pick fruit fully soft and deep black for fresh eating; underripe fruit will pucker your soul.
    - Prune for openness in humid areas to improve airflow and reduce leaf diseases.
  purpose: |-
    - Edible: Jam, syrup, and fresh fruit where female trees and pollinators coexist—treat like a persimmon, not a berry lie.
    - Wildlife Attractor: Birds and mammals spread seeds; you share or fight—choose zen or netting.
    - Erosion Control: Deep roots stabilize thin soils on slopes where turf would die of honesty.
  companions:
  - Agarita — fellow thorny drought shrub guild member; contrasting berries and layered bird food.
  - Texas Mountain Laurel — evergreen structure and spring flowers frame deciduous persimmon without chemical grudges.
  - Blackbrush Acacia — nitrogen-friendly spacing in dry thickets; both respect limestone and contempt for irrigation.
  cautions:
  - Cattail — flags a hydrology mismatch; persimmon roots suffocate in soggy muck while cattail thrives.
  - Japanese honeysuckle — twining stems girdle young trunks and shade out lower branches along fencerows.
  pests:
  - Persimmon Borer
  - Scale Insects
  - Aphids
