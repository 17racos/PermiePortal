  description: "Wild passionvine (Passiflora incarnata) is a herbaceous to semi-woody
    tendril vine of field edges, fencerows, and sunny thickets across the eastern
    and southeastern United States. Intricate lavender fringed flowers appear in summer,
    followed by egg-sized fruits that ripen yellow and pop when stepped on—hence maypop.
    Larvae of several fritillary butterflies specialize on the foliage, making this
    a non-negotiable plant for native butterfly gardens.\n\n☀️💧 Sun and Water Requirements:\n
    Full sun for heaviest flowering and fruiting; tolerates bright part shade with
    fewer fruits. Average moisture suits it; tolerates short drought once roots run
    deep. Heavy clay that stays wet in winter can rot crowns in cold zones—slope or
    amend.\n\n✂️ Propagation:\nSow seed after soaking and scarifying; germination
    improves with warmth. Layer stems that touch soil; divide crowns in early spring.
    Transplant dormant roots carefully—sprouts late, grows fast once heat arrives.\n\n
    🌾 Harvest / Best Use Timing:\nCollect fallen ripe maypops when fragrant and
    yielding; scoop pulp for jelly or out-of-hand eating if acidity suits you. Leave
    foliage for caterpillars during butterfly flight periods; prune hard in late winter
    to renew growth."
  purpose: |-
    - Edible: Ripe fruit pulp is tart-sweet and used in jams and drinks; unripe fruit is not the snack you want.
    - Pollinator: Complex flowers attract bees and other pollinators; architectural blooms support insect diversity visually and nutritionally.
    - Wildlife Attractor: Foliage feeds fritillary larvae; fruits feed mammals and people who tolerate seeds.
    - Ornamental: Flowers are living geometry lessons on trellises and mailbox posts.
  companions:
