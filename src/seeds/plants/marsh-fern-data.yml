  description: "Marsh fern (Thelypteris palustris) is a clump-forming deciduous fern
    of wet woods, seeps, and marsh edges across much of North America and parts of
    temperate Eurasia. Fronds are lance-shaped, deeply lobed, and rise from creeping
    rhizomes that knit damp soil. It fills a niche in restoration and food forests
    where standing water is rare but soil stays spongy for much of the year.\n\n☀️💧
    Sun and Water Requirements:\n- Part shade to light shade; tolerates brief sun
    only if roots stay cool and moist.\n- Moisture-loving; prefers consistently
    damp, humus-rich soil that never dries to dust.\n- Tolerates seasonal flooding
    better than drought; acidic to neutral pH is typical in its native sites.\n\n✂️
    Propagation:\n- Division of crowns in early spring before fiddleheads unfurl;
    keep divisions wet.\n- Spore sowing on sterile moist medium under humidity dome;
    gametophyte stage is slow and needs patience.\n- Transplant young clumps into
    prepared bog gardens or rain-garden berms with mulch to lock moisture.\n\n🌾
    Harvest / Best Use Timing:\n- Fronds are not a food crop; value is ecological
    and visual.\n- For nursery increase, lift divisions after last hard frost when
    new croziers appear.\n- In design, mass plant in year two once irrigation rhythm
    is proven—dry spells brown fronds fast."
