  description: |-
    Russian olive is a silvery, drought-tough shrub or small tree that fixes nitrogen with the quiet confidence of something listed invasive in multiple U.S. states. Edible fruit is mealy-sweet to some palates, bird candy to others. If you are in subtropical and tropical Americas, check regional invasive lists before planting—this entry is education-first, not a cheerleader for ecosystem roulette.

    ☀️💧 Sun and Water Requirements:
    - Full sun for dense silver foliage and fruiting.
    - Tolerates poor, alkaline, and salty soils; drought-tolerant once established—over-irrigation is unnecessary flattery.

    ✂️ Methods to Propagate:
    - Seeds: dispersed by birds in the wild; cold stratify for controlled sowing.
    - Hardwood cuttings and suckers can expand colonies—manage boundaries if you plant at all.

    🌾 Harvest notes:
    - Fruit when fully ripe; texture divides humans—try small batches before committing a pantry.
