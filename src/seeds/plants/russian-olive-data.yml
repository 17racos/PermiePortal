common_name: Russian Olive
picture: russian_olive.webp
scientific_name: Elaeagnus angustifolia
aka:
  - Oleaster
  - Silver berry
  - Russian Olive Seedless
family: Elaeagnaceae
zone: 2-7
ideal_temp_min: 55
ideal_temp_max: 80
min_temp: -30
max_temp: 105
perennial: true
layers:
  - Tree
  - Shrub
plant_function:
  - Nitrogen Fixer
  - Wildlife Attractor
  - Windbreaker
  - Animal Fodder
description: |-
  Russian olive is a silvery, drought-tough shrub or small tree that fixes nitrogen with the quiet confidence of something listed invasive in multiple U.S. states. Edible fruit is mealy-sweet to some palates, bird candy to others. If you are in subtropical and tropical Americas, check regional invasive lists before planting—this entry is education-first, not a cheerleader for ecosystem roulette.

  Full sun for dense silver foliage and fruiting. Tolerates poor, alkaline, and salty soils; drought-tolerant once established—over-irrigation is unnecessary flattery.

  Seeds: dispersed by birds in the wild; cold stratify for controlled sowing. Hardwood cuttings and suckers can expand colonies—manage boundaries if you plant at all.

  Fruit when fully ripe; texture divides humans—try small batches before committing a pantry.
purpose: |-
  Nitrogen Fixer: Elaeagnus angustifolia fixes nitrogen on saline alkaline ground where many trees fail -- time green mulch returns so leaf litter feeds biology instead of briefly tying surface nitrogen.
  Wildlife Attractor: Heavily scented pale flowers feed bees after many orchard blooms fade; birds distribute silver olive-shaped drupes far and fast, which is exactly why regional invasive lists exist.
  Windbreaker: Tall multistem habit and narrow silvery leaves blunt desiccating wind across dry corridors, berms, and poultry yards while winter light still passes after leaf drop.
  Animal Fodder: Managed browse of tender stems appears in pastoral trials for sheep and goats -- verify stocking rules and palatability tests before leaning on it as primary forage.
companions:
  - Yarrow
  - Lavender cotton
  - Drought-tolerant grasses at the drip line
cautions:
  - Wetlands and riparian zones where spread is socially unacceptable
  - Planting where regional conservation groups will rightfully glare
pests:
  - Scale Insects
  - Japanese Beetles
  - Borers
