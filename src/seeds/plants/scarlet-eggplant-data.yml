    color.\n\n☀️💧 Sun and Water Requirements:\n- Full sun for compact growth and
    better fruit set.\n- Moderate moisture; erratic drought invites spider mites
    and bitter leaves.\n- Rich, well-drained soil; containers need fast mix and
    daily checks in heat.\n\n✂️ Propagation:\n- Seeds started indoors 6–8 weeks before
    last warm weather; transplant after soil warms.\n- Semi-hardwood cuttings for
    perennial clones in frost-free climates.\n- Stake branching types when fruit loads
    stems.\n\n🌾 Harvest / Best Use Timing:\n- Harvest young leaves for cooking
