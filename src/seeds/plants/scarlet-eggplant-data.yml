  description: 'Scarlet eggplant (Solanum aethiopicum) is a variable African nightshade grown across tropical and subtropical
    Americas as a leafy green, a gourd-shaped fruit type, or an ornamental with lobed leaves and bright orange-red berries.
    Forms differ wildly—buy labeled seed. It suits warm kitchen gardens, poultry forage strips, and novelty beds where true
    eggplant needs fewer thorns and more color.


    ☀️💧 Sun and Water Requirements:

    - Full sun for compact growth and better fruit set.

    - Moderate moisture; erratic drought invites spider mites and bitter leaves.

    - Rich, well-drained soil; containers need fast mix and daily checks in heat.


    ✂️ Propagation:

    - Seeds started indoors 6–8 weeks before last warm weather; transplant after soil warms.

    - Semi-hardwood cuttings for perennial clones in frost-free climates.

    - Stake branching types when fruit loads stems.


    🌾 Harvest / Best Use Timing:

    - Harvest young leaves for cooking where the chosen cultivar is bred for greens.

    - Pick fruit forms at the stage your cultivar demands—many types are bitter if wrong maturity.

    - Wear gloves around hairy prickly forms; solanaceous spines are earnest.'
