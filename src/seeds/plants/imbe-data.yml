description: |-
  Imbe is a shrubby Garcinia with orange, pleasantly tart fruit and a knack for looking tidy while being picky about cold. Dioecious — you need a male pollinator for female fruiting plants unless your nursery sold you a grafted cheat code. In subtropical and tropical Americas it is a protected coastal 10a mood, not an inland gamble. Sun, heat, drainage, and mulch make the difference between ‘cute plant’ and ‘actually fruiting.’

  Full sun for best flowering and fruit set once established. Regular moisture; drought during fruit swell is how you get disappointment for free. Sandy loam with organic matter; avoid standing water.

  Seeds; slow juvenility. Grafting known cultivars when you can find them.

  Pick when color peaks and fruit yields slightly to pressure.
purpose: |-
  Edible: Garcinia livingstonei bears small orange globes with tart, aromatic pulp related to mangosteen -- eat fresh when fully soft or cook into sauces; remember dioecious plants need a pollen partner for female fruit set.
  Ornamental: Thick, dark leaves on a compact shrub read tidy in evergreen hedges -- site in frost-free pockets because cold snaps brown foliage faster than marketing photos admit.
  Wildlife Attractor: Fallen fruit feeds hornbills and fruit doves where ranges overlap -- harvest promptly or accept losses because pulp ferments on pavement within hours in tropical heat.
