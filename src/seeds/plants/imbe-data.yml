    Sun, heat, drainage, and mulch make the difference between ‘cute plant’ and ‘actually
    fruiting.’\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n- Full sun for
    best flowering and fruit set once established.\n- Regular moisture; drought during
    fruit swell is how you get disappointment for free.\n- Sandy loam with organic
