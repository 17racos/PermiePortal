  description: "Yellow water lily (Nymphaea mexicana) is a tropical to subtropical aquatic perennial with floating round leaves and bright yellow flowers held above the water on long peduncles. Plants spread by rhizomes through shallow ponds and constructed water gardens, providing shade that moderates algae and cover for fish and invertebrates. Some cultures use plant parts in traditional foods—verify safety, water quality, and regulations before harvesting.\n\n☀️💧 Sun and Water Requirements:\nFull sun for maximum flowering; too much shade reduces bud count. Still, shallow freshwater over rich bottom muck—typically 6–24 inches (15–60 cm) of water above rhizomes in warm months—is the basic contract. Avoid moving water so fast it tears leaves; avoid saltwater.\n\n✂️ Propagation:\nDivide rhizomes when water warms; anchor sections in containers for controlled ponds. Sow seed only where local rules allow collection and sale.\n\n🌾 Harvest / Best Use Timing:\nOrnamental use is primary—edible traditions vary by culture and must be researched carefully. Peak bloom tracks heat and long days in tropical and subtropical climates."
