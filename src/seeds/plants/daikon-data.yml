description: |-
  Daikon Radish (Raphanus sativus var. longipinnatus) is a fast-growing, cool-season root vegetable known for its long, white, cylindrical taproot that can grow up to 60 cm (24 inches) deep. The plant has lush green leaves and small white or yellow flowers that bloom if left to bolt.

  Daikon Radish thrives in loose, well-drained soil and is often used as a cover crop to break up compacted soil, prevent erosion, and scavenge nutrients. It is widely grown in temperate and subtropical climates and can be used for culinary, medicinal, and soil improvement purposes.

  Prefers full sun but tolerates partial shade. Requires loose, well-drained soil to allow root development. Moderate water needs; avoid waterlogging to prevent rot.

  Seeds: Direct sow in early spring or late summer for fall crops. Succession Planting: Sow every 2–3 weeks for a continuous harvest. Self-seeding: Can reseed if left to flower and set seed.

  Harvest 50–70 days after planting when roots reach 20–60 cm (8–24 inches) in length. Pull roots before they become too fibrous or woody. Leaves can be harvested throughout the growing season for salads or animal fodder.
purpose: |-
  Edible: Raphanus sativus var. longipinnatus roots are mild, crisp daikon for pickles, kimchi, and stir-fry -- harvest before heat turns them pithy.
  Medicinal: Brassica-family glucosinolates show up in leaf and root traditions for digestion and liver support -- thyroid-sensitive people should track brassica load.
  Dynamic Accumulator: Long white taproots scavenge nitrate and potassium from deep horizons -- winter-killed residues leave channels and recycled nutrients on the surface.
  Erosion Control: Thick fall-sown stands cover soil before winter rains on sloping beds -- bio-drilling action breaks compaction when roots rot in place.
  Animal Fodder: Large tops and trimmed roots accept chopping for poultry, pigs, and ruminants -- when introduced gradually to brassica-rich feeds.
  Pest Management: Fast canopy smothers winter annual weeds -- rotate away from other brassicas to avoid building clubroot and flea-beetle banks.
