  description: 'Hyacinth bean is the purple-flowered vine that makes fences look goth and edible at the same time — if you
    cook the right cultivar stage because raw dry seeds are not a prank worth trying. In frost-free climates it is a short-lived
    perennial vine; in subtropical and tropical Americas treat it as a long annual unless winter is mild and you mulch the
    crown. Heat lover; sulks in cold soil.


    ☀️💧 Sun and Water Requirements:

    - Full sun for flowers and pods.

    - Fertile, well-drained soil with steady moisture during climb and pod fill.

    - Strong trellis; this is not a polite pea tendril — it has plans.


    ✂️ Methods to Propagate:

    - Seeds: nick and soak; direct sow after soil warms or start indoors for head start.

    - Save seed only from known food-grade lines — ornament types can be decorative lies.'
  purpose: 'Hyacinth bean stacks beauty and protein where it is warm enough:


    - Edible: Young pods and leaves in some cultures; mature seeds only with proper preparation knowledge.

    - Nitrogen Fixer: Feeds the trellis guild.

    - Animal Fodder: Forage varieties exist for livestock systems.

    - Ornamental: Purple foliage cultivars for vertical drama.

    - Pollinator: Flowers attract bees in late season.'
