  description: "Autumn olive (Elaeagnus umbellata) is a fast-growing actinorhizal shrub from East Asia, widely naturalized in parts of North America, with silvery leaves, fragrant spring flowers, and red speckled berries ripening in fall. It tolerates poor soils and drought, which made it a historic windbreak plant—and also an invasive problem in many regions. This entry documents the plant for sites where planting is legal and ethically reviewed; prefer native alternatives when conservation goals demand.\n\n☀️💧 Sun and Water Requirements:\nFull sun for heaviest fruiting and silver leaf color. Lean to average, well-drained soils suit it; drought-tolerant once established. Avoid waterlogging; mulch to reduce competition during establishment.\n\n✂️ Propagation:\nOften regulated—verify law before propagating. If legal, hardwood cuttings root readily. Remove root suckers to reduce spread where containment matters.\n\n🌾 Harvest / Best Use Timing:\nBerries are tart and seedy—jams and fruit leathers appear in foraging literature where harvesting is permitted. Peak fruit tracks early autumn cooling after warm summers."
  purpose: |-
    - Nitrogen Fixer: Actinorhizal roots enrich degraded soils when management prevents escape.
    - Wildlife Attractor: Fruit feeds birds—also aiding seed spread, the ecological double-edged sword.
    - Windbreaker: Fast growth blunts wind on tough sites when natives are unavailable or establishing slowly.
    - Erosion Control: Roots stabilize cuts on poor soils—paired with monitoring for spread.
  companions:
