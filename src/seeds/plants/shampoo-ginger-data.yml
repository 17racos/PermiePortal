  description: "Shampoo Ginger (*Zingiber zerumbet*) is a tropical perennial native
    to Southeast Asia, recognized for its lush, lanceolate leaves and distinctive,
    pinecone-shaped inflorescences. The plant typically grows to heights of 1.2 to
    1.8 meters, forming dense clumps. In late summer to early fall, it produces green
    cone-like bracts that mature to a vibrant red, exuding a fragrant, soapy liquid
    traditionally used as a natural shampoo. The plant thrives in warm, humid environments
    and prefers nutrient-rich, well-draining soil with consistent moisture.\n\n✂️\U0001FAD8
    Methods to Propagate:\nPropagation is primarily achieved through division of rhizomes.
    Sections of the rhizome with at least one bud are planted in well-draining soil
    during the spring.\n\n\U0001F31E\U0001F4A7 Sun and Water Requirements:\nPrefers
    partial shade but can tolerate full sun in areas with high humidity. Requires
    consistently moist soil; regular watering is essential, especially during dry
    periods.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\nThe rhizomes
    can be harvested in late fall when the above-ground parts begin to die back. The
    red inflorescences, used for their aromatic liquid, are best harvested when fully
    matured and vibrant in color."
