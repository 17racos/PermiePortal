  description: "Showy partridge pea (Chamaecrista fasciculata) is a warm-season annual
    legume native to open sandy soils, prairies, and roadsides across much of eastern
    and central North America. Bright yellow flowers with red nectar guides flag
    down pollinators; feathery leaves fold at night like it still has secrets. It
    is a standard insectary annual for vegetable edges, meadow mixes, and disturbed-site
    recovery where fast nitrogen and color beat waiting on slow perennials.\n\n☀️💧
    Sun and Water Requirements:\n- Full sun; shade reduces bloom and root nodulation.\n-
    Drought tolerant once established in warm months; irrigate germinating seeds
    until first true leaves.\n- Sandy or well-drained soils; intolerant of prolonged
    waterlogging.\n\n✂️ Propagation:\n- Direct-sow after soil warms; scarify hard
    seed lots.\n- Thin crowded rows to reduce powdery mildew pockets.\n- Allow end-of-season
    pods to shatter for volunteer stands where desired.\n\n🌾 Harvest / Best Use Timing:\n-
    For green manure, mow or crimp before seeds mature if you do not want volunteers.\n-
    Collect dry pods for intentional resowing in spring.\n- Leave patches blooming
    for sulphur butterflies and specialist bees that read the nectar guides."
  purpose: |-
    - Nitrogen Fixer: Root nodules enrich soil during a single fast warm-season cycle.
    - Pollinator: Showy flowers with nectar guides attract bees and other pollinators.
    - Wildlife Attractor: Foliage hosts sulphur caterpillars; seeds feed birds if left standing.
    - Ground Cover: Branching stems shade soil between slower perennials in young meadows.
