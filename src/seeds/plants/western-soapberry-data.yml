  description: 'Western soapberry (Sapindus drummondii) is a deciduous tree or large shrub of south-central North American
    woodlands and limestone hills, bearing compound leaves and translucent yellow berries rich in saponins. Plants reach 20–40
    feet (6–12 m), often multi-stemmed. Berries support traditional soap demonstrations—not casual snacks—while birds handle
    the chemistry fine.


    ☀️💧 Sun and Water Requirements:

    Full sun to partial shade. Well-drained soils, including rocky limestone, suit it; tolerates drought once established.
    Occasional deep watering speeds establishment.


    ✂️ Propagation:

    Sow scarified seed after soaking. Transplant young seedlings with root integrity.


    🌾 Harvest / Best Use Timing:

    Berries for soap demos follow vetted methods—avoid ingestion experiments. Wildlife peak follows warm-season ripening.'
