  description: "Barbados plum commonly refers to jocote or red mombin (Spondias purpurea), a small to medium tropical fruit\
    \ tree from Mexico through northern South America and the Caribbean, bearing tart-sweet fruits in colors from yellow to\
    \ red and purple depending on selection. Trees are often 15–30 feet (4.5–9 m), sometimes deciduous in dry seasons, with\
    \ pinnate leaves and prolific fruit on bare wood during bloom flushes. It slots into home orchards and alley systems where\
    \ a quick-return fruit tree tolerates heat and seasonal drought better than pampered temperate imports.\n\n ☀️\U0001F4A7\
    \ Sun and Water Requirements:\nFull sun for heaviest fruiting; partial shade reduces yield. Tolerates poor, rocky soils\
    \ once established but fruits better with mulch and occasional deep watering during fruit swell. Protect young trees from\
    \ frost; mature wood survives brief cool events in marginal zones but not hard freezes.\n\n ✂️ Propagation:\nSow fresh\
    \ seed; polyembryonic lines may come partly true from seed. Air-layer or graft known selections for fruit color and eating\
    \ quality. Root cuttings work for some tropical Spondias clones under mist.\n\n\U0001F33E Harvest / Best Use Timing:\n\
    \ Pick when skin color saturates and fruit yields slightly—texture shifts fast from crunchy-tart to soft-sweet. Eat out\
    \ of hand, pickle green, or reduce into sauces; fruiting waves can be heavy, so schedule processing."
  purpose: '- Edible: Fruit supports fresh eating, pickles, and cooked sauces through warm-season flushes.

    - Wildlife Attractor: Flowers and fruit feed insects, birds, and mammals where trees are not netted.

    - Shade Provider: Open canopy gives shifting shade for understory herbs during wet season growth.

    - Ornamental: Florescences on leafless wood are visually loud in a useful way.

    - Mulcher: Leaf drop recycles minerals if left under the canopy instead of bagged for landfill cosplay.'
  companions:
