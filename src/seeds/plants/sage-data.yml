  description: "Sage (Salvia officinalis) is a hardy, woody-stemmed perennial herb
    known for its aromatic gray-green leaves and purple-blue flowers. It grows in
    a bushy, compact form, reaching about 30-60 cm (12-24 inches) in height. Sage
    is a drought-tolerant plant that thrives in well-drained soil and full sun.\n\nIt
    has a long history of culinary and medicinal use, particularly for flavoring meats
    and teas. The plant attracts pollinators such as bees and butterflies while also
    repelling common garden pests.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n-
    Prefers full sun (at least 6 hours per day).\n- Requires well-drained, sandy or
    loamy soil.\n- Drought tolerant once established; water sparingly to prevent root
    rot.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Slow to germinate; best started
    indoors before the last frost.\n- Cuttings: Take softwood cuttings in spring or
    summer and root in moist soil.\n- Division: Older plants can be divided in early
    spring or fall.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E When to Harvest:\n-
    Harvest leaves once the plant is established, typically in its second year.\n-
    Best harvested in the morning when oils are most concentrated.\n- Flowers can
    also be harvested for teas or garnishes."
