  description: 'Meadowsweet (Filipendula ulmaria) is a robust rosaceous perennial of damp meadows and streambanks, bearing
    deeply veined, often whitish beneath leaves and foamy, sweet-scented cream flower plumes in summer. Plants commonly reach
    3–4 feet tall with a clumping habit; they are the botanical answer to “cottagecore, but actually likes mud.”


    subtropical and tropical Americas: Not a default landscape plant for steamy lowlands—if you try it, treat it as an experiment
    in bright shade, constant soil moisture, and enriched organic soil, similar to how you might coddle other cool-temperate
    refugees.


    ☀️💧 Sun and Water Requirements:

    - Full sun in cool climates; in heat, morning sun and afternoon shade reduce leaf scorch.

    - Consistently moist, humus-rich soil; never let the root zone bake—this is not a xeriscape mascot.


    ✂️ Propagation:

    - Division in early spring or autumn; slice thick crowns with a sharp spade and replant immediately.

    - Seed: surface-sow; light-dependent germination; stratify if indoor-starting stubborn lots.


    🌾 Harvest / Best Use Timing:

    - Traditional harvest of flowering tops in full bloom for drying; leaves earlier in season if your practice specifies.

    - Deadheading limits self-sowing if you dislike free volunteers colonizing your path like optimistic teenagers.'
