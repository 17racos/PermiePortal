  description: "Lemon Balm (Melissa officinalis) is a bushy, aromatic herb that grows
    up to 90 cm (3 feet) tall. It has bright green, oval-shaped, serrated leaves with
    a strong lemon scent. The small white or pale yellow flowers bloom in late summer
    and attract bees and other beneficial pollinators.\n\nThis plant thrives in a
    variety of soils but prefers moist, well-drained, fertile conditions. It spreads
    easily by seed and root division, making it an excellent companion plant but also
    potentially invasive if not managed.\n\n \U0001F31E\U0001F4A7 Sun and Water Requirements:\n-
    Prefers full sun to partial shade.\n- Requires well-drained, fertile soil with
    moderate moisture.\n- Drought-tolerant once established but benefits from consistent
    watering.\n\n✂️\U0001FAD8 Methods to Propagate:\n- Seeds: Start indoors 6–8 weeks
    before last frost or direct sow in spring.\n- Cuttings: Root cuttings in water
    or soil.\n- Division: Established plants can be divided and replanted.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Leaves can be harvested throughout the growing season for
    fresh use.\n- Best harvested in the morning before flowering for maximum essential
    oil concentration.\n- Can be dried or used fresh for tea, tinctures, and culinary
    applications."
  purpose: |-
    Lemon Balm serves multiple functions in a permaculture system:

    - Edible: Leaves are used in teas, flavoring, and herbal medicine.
    - Medicinal: Traditionally used for stress relief, digestive support, and antiviral properties.
    - Pollinator: Flowers attract bees and other beneficial insects.
    - Wildlife Attractor: Provides nectar for butterflies and bees.
    - Dynamic Accumulator: Enhances soil fertility by accumulating minerals like potassium.
    - Border Plant: Works well in herb gardens, edges, and companion planting.
    - Pest Management: Repels mosquitoes and other insects with its strong lemon scent.
