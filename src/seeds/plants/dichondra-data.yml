  description: "Dichondra is a creeping coin-leaf ground cover that reads ‘lawn’ to
    people allergic to grass monocultures. It mats low, tolerates light foot traffic,
    and laughs at mowing schedules. In Florida and Puerto Rico humidity, give it drainage and
    airflow or it will invite fungal drama like any other mat-forming plant.\n\n \U0001F31E\U0001F4A7
    Sun and Water Requirements:\n- Part sun to light shade in hot climates; coastal
    plantings often take more sun with irrigation.\n- Regular moisture for lush mats;
    established patches endure short dry spells.\n- Avoid soggy, stagnant low spots.\n\n✂️\U0001FAD8
    Methods to Propagate:\n- Plug trays or stolons pressed into prepared soil.\n- Divide
    mats in spring.\n- Seed possible for some selections; plugs are faster.\n\n\U0001F9D1‍\U0001F33E\U0001F469‍\U0001F33E
    When to Harvest:\n- Mow or clip lightly to thicken; not a food crop for humans."
  purpose: |-
    Dichondra is living mulch with manners:

    - Ground Cover: Dense, low layer under shrubs and paths.
    - Ornamental: Clean texture without turfgrass cosplay.
    - Erosion Control: Holds soil on gentle slopes with irrigation.
    - Drought Tolerant: Once established compared to conventional turf.
