  description: 'Pineland heather (Ceratiola ericoides) is an aromatic evergreen shrub of deep sandy scrub, with needle-like
    leaves that smell resinous when crushed and a rounded form usually 3–6 feet (0.9–1.8 m) tall. It is not a culinary rosemary
    despite one common name—think ericaceous chemistry and habitat specialization. In xeric permaculture it anchors sandhill
    plantings, supports native bee and specialist insect relationships, and refuses to pretend it enjoys lawn sprinklers.


    ☀️💧 Sun and Water Requirements:

    Full sun and excellent drainage are non-negotiable; shade yields sparse, uneven plants. Pure sand or sandy gravel with
    low fertility matches native sites. Drought-tolerant; irrigation should mimic summer thunderstorms, not perpetual soggy
    mulch.


    ✂️ Propagation:

    Difficult from cuttings for beginners; seed after appropriate treatments per native-plant guides. Avoid heavy root disturbance
    when transplanting container plants. Prune lightly to shape; hard shearing removes interior buds slowly.


    🌾 Harvest / Best Use Timing:

    Not a food crop—handle as habitat and ornamental. Growth pulses follow warm wet periods. Collect seed ethically only where
    regulations and population health permit.'
  purpose: |-
    Wildlife Attractor: Wildlife shows up for calories and cover: It is not a culinary rosemary despite one common name -- think ericaceous chemistry and habitat specialization. -- adds berries, seeds, cover, or insects so birds and beneficials treat your site like habitat, not a parking lot
    Erosion Control: Pineland Heather networks fibrous or deep roots through disturbed soil so rain energy meets biology instead of bare mud -- binds slopes, banks, and disturbed cuts where bare soil would otherwise sheet during hard rains
    Ornamental: Pineland Heather earns ornamental placement where bloom color, bark, or form matter in courtyard and border designs without abandoning ecology -- gives structure, bloom timing, and texture you can design around while still pulling ecological weight
    Border Plant: Pineland Heather tolerates foot traffic, mower splash, and microclimate swings along paths and hedgerows where interior crops fail -- defines paths, hedgerows, and transition zones while tolerating the edge abuse most crops hate

  companions:
