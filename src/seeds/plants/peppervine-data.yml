description: |-
  Peppervine (Nekemias arborea, formerly Ampelopsis arborea) is a deciduous climbing vine of eastern and central North America, common in floodplains, fencerows, and woodland edges. Compound leaves with glossy, pepper-scented foliage can smother small supports if ignored. Birds spread seeds after eating fruit; humans should treat berries as questionable snacks—this is habitat vine, not trail mix.

  Full sun to partial shade; fruiting and color better with strong light. Moderate moisture; tolerates seasonal wet feet along streams. Average to rich soil; mulched roots handle heat better on pergolas.

  Seeds from ripe fruit cleaned and cold stratified; germination can be slow. Hardwood cuttings in dormancy with bottom heat. Layering low stems where you want a thicket for wildlife.

  Do not harvest fruit for human food without authoritative ID and local knowledge—GI upset is common. For habitat, leave fruit for migrating birds in late summer and autumn. Prune hard in winter to keep posts and small trees from structural damage.
purpose: |-
  Wildlife Attractor: Dark Nekemias arborea berries feed migrating songbirds that swallow seeds whole; dense tangles shelter rabbits and snakes along floodplain edges -- humans should skip berries because GI upset is documented.
  Ornamental: Glossy trifoliolate leaves and porcelain-blue fruit clusters turn pergolas into eastern woodland theater -- crush foliage for pepper scent ID before confusing with poison ivy novices still fear.
  Erosion Control: Fast twining growth knits riprap and disturbed levee toes after floods while slower shrubs resprout -- cut back hard each winter if you need to keep supports from collapsing under weight.
  Shade Provider: Summer canopy on trellis cuts glare on west windows and livestock lanes -- winter dormancy returns light for solar gain when you actually want it.
