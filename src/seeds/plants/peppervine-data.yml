  description: 'Peppervine (Nekemias arborea, formerly Ampelopsis arborea) is a deciduous climbing vine of eastern and central
    North America, common in floodplains, fencerows, and woodland edges. Compound leaves with glossy, pepper-scented foliage
    can smother small supports if ignored. Birds spread seeds after eating fruit; humans should treat berries as questionable
    snacks—this is habitat vine, not trail mix.


    ☀️💧 Sun and Water Requirements:

    - Full sun to partial shade; fruiting and color better with strong light.

    - Moderate moisture; tolerates seasonal wet feet along streams.

    - Average to rich soil; mulched roots handle heat better on pergolas.


    ✂️ Propagation:

    - Seeds from ripe fruit cleaned and cold stratified; germination can be slow.

    - Hardwood cuttings in dormancy with bottom heat.

    - Layering low stems where you want a thicket for wildlife.


    🌾 Harvest / Best Use Timing:

    - Do not harvest fruit for human food without authoritative ID and local knowledge—GI upset is common.

    - For habitat, leave fruit for migrating birds in late summer and autumn.

    - Prune hard in winter to keep posts and small trees from structural damage.'
  purpose: '- Wildlife Attractor: Fruit feeds birds; dense growth shelters small animals along edges.

    - Ornamental: Lacy compound leaves and pink to blue fruit clusters suit naturalistic arbors.

    - Erosion Control: Fast cover stabilizes disturbed banks until slower natives establish.

    - Shade Provider: Summer leaf cover cools arbors, fences, and outdoor work areas when trained overhead.'
  companions:
  - Moonseed Vine — native vine guild for teaching leaf and fruit differences on the same fence
  - Riverbank Grape — true grape nearby clarifies bark, tendrils, and fruit for learners
  - Roughleaf Dogwood — stiff shrub accepts light vine layers without collapsing
  cautions:
  - Fruit can cause digestive upset in humans if eaten
  pests:
  - Japanese Beetles
  - Leafhoppers
  - Scale Insects
  - Spotted Lanternfly
  practitioner_notes: 'Sap can irritate skin on sensitive people—long sleeves beat social media rash photos.

    It will eat a weak trellis; build like you mean it or regret it by August.

    Birds plant it everywhere; pull volunteers from gutters before they own the fascia.'
