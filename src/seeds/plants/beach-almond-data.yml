  description: "Beach almond (Terminalia catappa) is a large, spreading tropical tree
    of coastal strand and lowland areas in many warm regions, valued for dense horizontal
    tiers of glossy leaves that color bronze-red before dropping, and for fibrous fruit
    kernels eaten roasted or incorporated into snacks. Heights of 40–60 feet (12–18
    m) are common with a broad crown that casts deep shade; roots are strong enough for
    coastal wind. In food forests near shorelines it is a salt-tolerant canopy anchor—plan
    understory for shade, not sun-loving vegetables, once the crown matures.\n\n☀️💧
    Sun and Water Requirements:\nFull sun for symmetrical crowns; tolerates coastal
    exposure and sandy soils. Young trees need steady moisture to establish deep roots;
    mature specimens endure seasonal dry spells but fruit better with occasional deep
    irrigation. Avoid planting where litter drop will clog critical drainage structures
    you refuse to maintain.\n\n✂️ Propagation:\nSow fresh seed; viability drops if
    kernels dry too long. Air-layering works on mature limbs in humid weather. Select
    local coastal ecotypes when possible for salt and wind performance.\n\n🌾 Harvest
    / Best Use Timing:\nCollect fallen fruit when husks color and begin to dry; crack
    shells to roast kernels. Leaves drop seasonally—use as mulch or compost feedstock.
    Prune for clearance along paths and structures before low branches become head hazards."
  purpose: |-
    - Edible: Kernels roast like snack nuts; verify preparation guidance for your cultivar and region.
