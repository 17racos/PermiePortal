description: |-
  Black medic (Medicago lupulina) is a low, trailing annual or short-lived perennial legume found in lawns, paths, and disturbed ground worldwide. Trifoliate leaves resemble clover, yellow pea flowers cluster into small globes, and pods form tight black coils that stick in shoelaces—plants typically sprawl under roughly 6–12 inches unless competing for light.

  subtropical and tropical Americas know it as a warm-season weed ally or cover crop on poor soil—humid summers do not faze it if drainage exists; winter cool in subtropical and tropical Americas slows but rarely erases it. Respect its seed bank: once present, it whispers “management,” not “one-time pull.”

  Full sun to light shade; dense shade weakens flowering and nitrogen payoff. Tolerates poor, compacted soil—classic pioneer—still benefits from not being underwatered into dust in Puerto Rico’s dry season if you want cover.

  Seeds: scarify lightly, sow in warm soil; it will often self-sow if you simply stop mowing and pay attention. Transplant young volunteers in wet season to fill bare patches—free biology beats seed packets.

  For green manure, mow or crimp before heavy seed set if you want less future volunteering—late flowering is the decision point. For poultry forage, allow patches to flower for insect traffic, then graze or cut-and-carry before stems lignify.
purpose: |-
  Nitrogen Fixer: Medicago lupulina nodules fix nitrogen on compacted paths and orchard alleys where turf thins -- mow before black coil pods mature if you want less future shoe-lace seed bank.
  Ground Cover: Trailing trifoliate mats tile low-traffic edges and reduce splash onto tomato leaves -- tolerates poor soil better than pampered clover mixes on beaten dog paths.
  Animal Fodder: Soft leaves accept poultry grazing rotations when mixed with taller forage -- pure medic monocrops invite boring nutrition, so rotate birds weekly.
  Pollinator: Tiny yellow globes feed small halictid bees in summer heat -- delay mower one week on sacrifice strips if pollinator rent matters more than stripe aesthetics.
  Biomass: Quick topsoil green manure breaks down in weeks, not months -- pair with straw when folding into beds so carbon-nitrogen math stays honest in compost.
