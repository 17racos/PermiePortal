  description: |-
    Black medic (Medicago lupulina) is a low, trailing annual or short-lived perennial legume found in lawns, paths, and disturbed ground worldwide. Trifoliate leaves resemble clover, yellow pea flowers cluster into small globes, and pods form tight black coils that stick in shoelaces—plants typically sprawl under roughly 6–12 inches unless competing for light.

    Florida and Puerto Rico know it as a warm-season weed ally or cover crop on poor soil—humid summers do not faze it if drainage exists; winter cool in Florida and Puerto Rico slows but rarely erases it. Respect its seed bank: once present, it whispers “management,” not “one-time pull.”

    ☀️💧 Sun and Water Requirements:
    - Full sun to light shade; dense shade weakens flowering and nitrogen payoff.
    - Tolerates poor, compacted soil—classic pioneer—still benefits from not being underwatered into dust in Puerto Rico’s dry season if you want cover.

    ✂️ Methods to Propagate:
    - Seeds: scarify lightly, sow in warm soil; it will often self-sow if you simply stop mowing and pay attention.
    - Transplant young volunteers in wet season to fill bare patches—free biology beats seed packets.

    🌾 Harvest / Best Use Timing:
    - For green manure, mow or crimp before heavy seed set if you want less future volunteering—late flowering is the decision point.
    - For poultry forage, allow patches to flower for insect traffic, then graze or cut-and-carry before stems lignify.
  purpose: |-
    Black medic is a sidewalk philosopher teaching nitrogen and humility.

    - Nitrogen Fixer: Rhizobia on roots feed the soil food web—useful in beaten paths and orchard alleys if managed.
    - Ground Cover: Low mat reduces bare soil and splash in disturbed microsites.
    - Animal Fodder: Leaves are palatable to poultry and small livestock in moderation—rotate, do not monocrop your chicken run on it alone.
    - Pollinator: Small yellow flowers feed tiny bees when you allow bloom before mowing.
    - Biomass: Chopped tops add quick green manure—carbon-light but fast-cycling.
  companions:
  - Dutch Clover — complementary legume layer with different height and persistence; shared pollinators.
  - Plantain — deep-taproot nutrient pump in the same disturbed niche without chemical feud documented here.
  - Dandelion — early-season resource for pollinators alongside medic’s summer yellow; both outrage lawn purists equally.
