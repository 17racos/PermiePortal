---
- name: Southern Green Stink Bug
  slug: southern-green-stink-bug
  picture: southern_green_stink_bug.jpg
  scientific_name: Nezara viridula
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, southern green stink bug may already
    be on the plant. This pest often builds quietly, then damage appears all at once. Feeding
    stress weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup
    is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Weed hosts near fields before fruit set; use row cover on beans and solanums until flowering.
    biological_controls: Egg parasitoids including Trissolcus basalis and Telenomus spp. are key; flowering strips support
      them.
    cultural_practices: Trap crops of millet, buckwheat, or mustard timed ahead of cash crop can pull adults.
    mechanical_physical: Shake bushes into soapy water; vacuum aggregations on trap rows.
    organic_sprays: Neem or soap directed at nymphs; kaolin on fruit may reduce feeding.
  natural_enemies:
  - Trissolcus basalis
  - Telenomus spp.
  - Assassin Bugs
