---
- name: Southern Green Stink Bug
  slug: southern-green-stink-bug
  picture: southern_green_stink_bug.jpg
  scientific_name: Nezara viridula
  description: A large bright green shield bug that feeds on many fruiting crops, causing dimpling, cloud spots, and aborted
    seeds in legumes. Adults overwinter and often aggregate before moving to crops.
  characteristics: Adults are shield-shaped, plain green with red banding on antennae in some forms; nymphs pass through black-and-red
    to green stages.
  control_methods:
    preventive_methods: Weed hosts near fields before fruit set; use row cover on beans and solanums until flowering.
    biological_controls: Egg parasitoids including Trissolcus basalis and Telenomus spp. are key; flowering strips support
      them.
    cultural_practices: Trap crops of millet, buckwheat, or mustard timed ahead of cash crop can pull adults.
    mechanical_physical: Shake bushes into soapy water; vacuum aggregations on trap rows.
    organic_sprays: Neem or soap directed at nymphs; kaolin on fruit may reduce feeding.
  natural_enemies:
  - Trissolcus basalis
  - Telenomus spp.
  - Assassin Bugs
