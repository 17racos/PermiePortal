---
- name: Oriental Fruit Moth
  slug: oriental-fruit-moth
  picture: oriental_fruit_moth.jpg
  scientific_name: Grapholita molesta
  description: Small tortricid whose larvae tunnel twig tips ('flags') of stone fruit and later bore fruit near the stem end—often
    confused with codling moth on apple but OFM shows the characteristic twig dieback first.
  characteristics: Adults are mottled gray; larvae are pink with a dark head. Multiple generations per year in warm regions;
    overwintering as mature larvae in silk cocoons under bark.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki or spinosad timed to egg hatch on shoots; kaolin on young fruit reduces
      stings—reapply after rains.
    biological_controls: Trichogramma releases target eggs in research and IPM blocks; Macrocentrus ancylivorus and other
      braconids parasitize larvae—preserve with selective timing.
    cultural_practices: Prune and destroy flagged shoots during spring; remove wild plum thickets near orchards; pheromone
      mating disruption works at adequate acreage blocks.
    mechanical_physical: Tree bands can intercept some crawling larvae; corrugated cardboard wraps collect overwintering larvae
      for removal.
    preventive_methods: Hang pheromone traps for biofix; tie sprays to degree-day models instead of holidays.
  natural_enemies:
  - Macrocentrus ancylivorus
  - Trichogramma spp.
  - Predatory Beetles
