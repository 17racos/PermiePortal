---
- name: Corn Earworm
  slug: corn-earworm
  picture: corn_earworm.jpg
  scientific_name: Helicoverpa zea
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, corn earworm may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki (Bt) on small larvae; spinosad where allowed—cover undersides and silking
      corn before larvae tunnel deep; neem has limited knockdown once inside ears.
    biological_controls: Trichogramma egg parasitoids, parasitic flies (Tachinidae), and predatory bugs—support them with
      floral resources and selective sprays.
    cultural_practices: Plant corn in a tight window to avoid prolonged moth flights; interplant with repellent companions
      modestly; destroy crop residues that harbor pupae.
    mechanical_physical: Corn varieties with tight long husks; for home garden, oil drops on silks or physical ear bags timed
      after pollination reduce ear entry.
    preventive_methods: Pheromone traps for monitoring flight peaks; rotate away from continuous solanaceous/corn sequences
      in small plots.
  natural_enemies:
  - Trichogramma spp.
  - Tachinid flies
  - Predatory stink bugs
  - Birds
