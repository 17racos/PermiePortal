---
- name: Rice Blast Fungus
  slug: rice-blast-fungus
  picture: rice_blast_fungus.jpg
  scientific_name: Magnaporthe oryzae
  description: The world’s heavyweight rice pathogen—diamond-shaped necrotic lesions with gray centers on leaves, collar rot
    that kills tillers, and panicle blast that turns grain heads white overnight. Spores ride dew and wind through humid canopies.
  characteristics: Lesions enlarge under 25–28 °C nights with long leaf wetness; neck blast girdles panicles below the head.
    The fungus overwinters on stubble and weed grasses, so rice monoculture keeps the party funded.
  control_methods:
    organic_sprays: Copper and sulfur have partial activity; Bacillus-based biofungicides and silicate nutrition can strengthen
      cell walls—integrate with resistance and spacing; no organic rescue for panicle blast once necks girdle.
    biological_controls: Antagonistic bacteria (Pseudomonas, Bacillus) applied as seed treatments or foliar teas show variable
      blast suppression in trials.
    cultural_practices: Plant resistant varieties; optimize nitrogen—lush rice invites blast; widen spacing in home gardens;
      destroy infected stubble; avoid overlapping crops.
    mechanical_physical: Upland or SRI-style intermittent irrigation reduces leaf wetness duration compared to constant deep
      flood—where water control exists.
    preventive_methods: Use clean seed; scout at tillering and boot; avoid excessive shade from weeds that extend morning
      dew.
  natural_enemies:
  - Antagonistic Bacteria
  - Competitive Fungi in Residue
  - Soil Antagonistic Microbes
