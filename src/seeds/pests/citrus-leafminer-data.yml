---
- name: Citrus Leafminer
  slug: citrus-leafminer
  picture: citrus_leafminer.jpg
  scientific_name: Phyllocnistis citrella
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, citrus leafminer may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Avoid heavy summer pruning that forces untimed flushes; coordinate fertilizer to reduce overlapping
      vulnerable growth in peak moth periods if regional models exist.
    biological_controls: Native and released parasitoid wasps (e.g., Ageniaspis citricola) attack larvae; avoid sprays harmful
      to tiny wasps during flush.
    cultural_practices: On small trees, remove and destroy mined terminals if infestation is localized; maintain tree vigor
      with proper irrigation.
    mechanical_physical: Not practical at scale; monitoring with pheromone traps where available helps time avoidance of flushes.
    organic_sprays: Neem or spinosad (where permitted organically) timed to egg-lay on new flush can reduce miners; oils must
      be used carefully on citrus to avoid phytotoxicity.
  natural_enemies:
  - Parasitoid Wasps
  - Predatory Ants
