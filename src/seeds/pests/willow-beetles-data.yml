---
- name: Willow Beetles
  slug: willow-beetles
  picture: willow_beetles.webp
  scientific_name: Chrysomelidae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, willow beetles may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain optimal tree health with balanced watering and fertilization; monitor willows regularly for
      early signs of defoliation.
    biological_controls: Encourage natural predators such as birds, parasitic wasps, and predatory beetles that target willow
      beetle larvae and adults.
    cultural_practices: Prune and remove heavily infested branches; practice proper sanitation by clearing leaf litter from
      around trees.
    mechanical_physical: Use sticky traps and manual removal during peak activity to reduce beetle populations.
    organic_sprays: Apply neem oil or insecticidal soap during early infestation stages to deter feeding without harming beneficial
      organisms.
  natural_enemies:
  - Birds
  - Parasitic Wasps
  - Predatory Beetles
