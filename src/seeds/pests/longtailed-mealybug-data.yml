---
- name: Longtailed Mealybug
  slug: longtailed-mealybug
  picture: longtailed_mealybug.jpg
  scientific_name: Pseudococcus longispinus
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, longtailed mealybug may already be
    on the plant. This pest often builds quietly, then damage appears all at once. Feeding
    stress weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup
    is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Quarantine new plants; control ants that defend mealybugs.
    biological_controls: Same predators and parasitoids as other mealybugs—Anagyrus and Acerophagus wasps where present.
    cultural_practices: Open canopy for air movement; avoid over-fertilization.
    mechanical_physical: Wipe stems and fruit with soapy cloth on small holdings.
    organic_sprays: Repeated soap, neem, or horticultural oil applications timed to crawler emergence.
  natural_enemies:
  - Lady Beetles
  - Parasitic Wasps
  - Lacewings
