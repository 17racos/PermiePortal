---
- name: Leek Moth
  slug: leek-moth
  picture: leek_moth.webp
  scientific_name: Acrolepiopsis assectella
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, leek moth may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Monitor allium crops early and maintain proper spacing and sanitation to reduce larval habitats.
    biological_controls: Encourage natural enemies such as parasitic wasps and insectivorous birds that target leek moth larvae.
    cultural_practices: Practice crop rotation and promptly remove infected plant debris to break the pest’s life cycle.
    mechanical_physical: Utilize floating row covers to prevent adult moths from laying eggs, and hand-pick larvae when observed.
    organic_sprays: Apply neem oil or insecticidal soap during peak larval activity to control infestations organically.
  natural_enemies:
  - Parasitic Wasps
  - Insectivorous Birds
