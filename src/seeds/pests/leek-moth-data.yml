---
- name: Leek Moth
  slug: leek-moth
  picture: leek_moth.jpg
  scientific_name: Acrolepiopsis assectella
  description: Leek Moths are small moths whose larvae feed on leeks, garlic, and related alliums. Their presence is marked
    by serpentine mines in the leaves and overall reduction in plant vigor.
  characteristics: These moths are modest in size and coloration, while their larvae create winding, silvery trails on foliage.
    The damage disrupts photosynthesis and can significantly lower yields in allium crops.
  control_methods:
    preventive_methods: Monitor allium crops early and maintain proper spacing and sanitation to reduce larval habitats.
    biological_controls: Encourage natural enemies such as parasitic wasps and insectivorous birds that target leek moth larvae.
    cultural_practices: Practice crop rotation and promptly remove infected plant debris to break the pest’s life cycle.
    mechanical_physical: Utilize floating row covers to prevent adult moths from laying eggs, and hand-pick larvae when observed.
    organic_sprays: Apply neem oil or insecticidal soap during peak larval activity to control infestations organically.
  natural_enemies:
  - Parasitic Wasps
  - Insectivorous Birds
