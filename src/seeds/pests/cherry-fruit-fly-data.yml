---
- name: Cherry Fruit Fly
  slug: cherry-fruit-fly
  picture: cherry_fruit_fly.jpg
  scientific_name: Rhagoletis cingulata
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, cherry fruit fly may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Spinosad or kaolin clay applied to fruit surfaces beginning at straw color through harvest can deter oviposition
      when coverage is maintained; reapply after rain per label. Some growers use neem in rotation for repellency—always check
      crop and PHI statements for cherry. Combine sprays with sanitation because no organic spray replaces picking up drops.
    biological_controls: Ants, birds, and ground beetles consume fallen larvae and pupae in soil; parasitic wasps attack pupae
      weakly compared to sanitation. Chickens or ducks under supervised orchard runs can reduce ground-stage survival where
      food safety rules allow.
    cultural_practices: Remove and destroy infested and fallen fruit at least twice weekly during ripening—this breaks the
      life cycle more reliably than any spray. Prune for open canopy to improve spray deposition and expose fruit to bird
      predation. Mow or mulch drops in U-pick operations to deny larvae easy soil entry.
    mechanical_physical: Fine mesh netting entire dwarf trees after pollination excludes flies if edges are buried or clipped.
      Red sticky spheres plus ammonium bait traps monitor timing; mass trapping helps only at small scale. Solarize shallow
      pupation zones in nursery blocks with clear plastic between seasons where feasible.
    preventive_methods: Hang monitoring traps from petal fall to track first catches; log growing degree days if local extension
      models exist. Coordinate with neighbors—untended feral trees are fly reservoirs. Document hot rows for earlier net deployment
      next year.
