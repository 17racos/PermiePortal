---
- name: Fungus Gnats
  slug: fungus-gnats
  picture: fungus_gnats.jpg
  scientific_name: Sciaridae
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, fungus gnats may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Allow the soil surface to dry between waterings, use well-drained mix, and pasteurize or use reputable
      sterile media for starts. Screen greenhouse vents.
    biological_controls: Apply Bacillus thuringiensis israelensis (Bti) drench for larvae; Steinernema feltiae nematodes parasitize
      larvae in moist soil. Hypoaspis miles predatory mites feed on eggs and young larvae.
    cultural_practices: Remove algae and debris on benches, avoid unfinished compost in seed mix, and bottom-water seedlings
      to keep the surface drier.
    mechanical_physical: Yellow sticky cards trap adults for monitoring and slight reduction; top-dress pots with sand or
      fine grit to block egg-laying.
    organic_sprays: Insecticidal soap or neem as soil drench can suppress larvae where labels allow; hydrogen peroxide dilutions
      are sometimes used cautiously—test on a few plants first.
  natural_enemies:
  - Predatory Mites
  - Rove Beetles
  - Nematodes
