---
- name: Carrot Weevil
  slug: carrot-weevil
  picture: carrot_weevil.webp
  scientific_name: Listronotus oregonensis
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, carrot weevil may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Maintain proper soil moisture and avoid excessive nitrogen fertilization which can attract weevils.
      Regular field monitoring helps detect early infestations.
    biological_controls: Encourage natural predators such as ground beetles, parasitic wasps, and insectivorous birds to help
      control weevil populations.
    cultural_practices: Practice crop rotation and interplant with repellent species. Remove and destroy infected plant debris
      to minimize breeding sites.
    mechanical_physical: Use row covers to prevent adult weevils from accessing the soil for egg-laying and employ hand-picking
      during peak activity.
    organic_sprays: Apply neem oil or insecticidal soap during early infestation stages to deter weevil activity without harming
      beneficial insects.
  natural_enemies:
  - Ground Beetles
  - Parasitic Wasps
  - Insectivorous Birds
