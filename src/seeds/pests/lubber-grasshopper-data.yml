---
- name: Lubber Grasshopper
  slug: lubber-grasshopper
  picture: lubber_grasshopper.jpg
  scientific_name: Romalea microptera
  description: Large, slow-moving flightless grasshoppers of the southeastern United States that gather in open sunny areas
    and strip vegetation. Bright warning coloration signals toxicity to many predators.
  characteristics: Adults are 2–3 inches long, yellow-orange with black pattern (color morphs vary). Nymphs are black with
    yellow or red stripes.
  control_methods:
    preventive_methods: Reduce weedy margins preferred for egg-laying; rotate disturbance of known egg beds in fall.
    biological_controls: Natural enemies include birds, mammals, and parasitic flies; chemical defenses limit insect predators
      but do not stop all mortality.
    cultural_practices: On small sites, concentrate effort when nymphs are localized in black bands.
    mechanical_physical: Hand-pick or stomp (gloves recommended); knock into buckets of soapy water. Fence valuable beds with
      smooth metal or fine mesh extending above hop height.
    organic_sprays: Sprays are marginally effective on adults; target young nymphs with spinosad or neem on ornamental or
      food gardens per label, accepting that large adults may need physical removal.
  natural_enemies:
  - Tachinid Flies
  - Birds
  - Mammals
