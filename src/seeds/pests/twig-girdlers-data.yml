---
- name: Twig Girdlers
  slug: twig-girdlers
  picture: twig_girdlers.jpg
  scientific_name: Oncideres spp.
  description: Twig Girdlers are beetles that lay eggs in small branches, causing the adults to girdle the twig to create
    a suitable environment for their larvae. This girdling cuts off nutrient flow, leading to branch dieback and loss of structural
    integrity.
  characteristics: These beetles are moderately sized with robust bodies and distinctive markings. Their feeding creates narrow,
    girdled sections on twigs, which eventually die and break off, reducing overall plant vigor.
  control_methods:
    preventive_methods: Monitor trees for early signs of girdling and maintain overall tree health with proper watering and
      balanced fertilization.
    biological_controls: Encourage natural predators such as birds, parasitic wasps, and predatory beetles that feed on twig
      girdler larvae.
    cultural_practices: Prune and promptly remove girdled branches, and avoid excessive nitrogen fertilization which leads
      to soft, vulnerable wood.
    mechanical_physical: Use protective wraps or physical barriers on susceptible branches and hand-pick adult beetles during
      their peak activity.
    organic_sprays: Apply neem oil or insecticidal soap to deter egg-laying and reduce adult beetle activity.
  natural_enemies:
  - Birds
  - Parasitic Wasps
  - Predatory Beetles
