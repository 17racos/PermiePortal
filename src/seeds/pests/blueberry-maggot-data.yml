---
- name: Blueberry Maggot
  slug: blueberry-maggot
  picture: blueberry_maggot.jpg
  scientific_name: Rhagoletis mendax
  description: Blueberry maggots are the larval stage of a small fly that infests blueberries. They are identifiable by tiny
    puncture marks and tunnels in the fruit, which eventually lead to decay and loss of marketable yield.
  characteristics: These maggots are creamy white with dark head capsules. Their feeding creates tunnels in the fruit that
    result in premature fruit drop and reduced quality, severely impacting crop yield.
  control_methods:
    preventive_methods: Maintain strict orchard sanitation by removing overripe and fallen fruit. Use netting to protect blueberry
      bushes from adult flies, and monitor regularly to catch early infestations.
    biological_controls: Encourage natural enemies such as parasitic wasps, predatory beetles, and insectivorous birds which
      help reduce fly populations.
    cultural_practices: Implement crop rotation and interplant with repellent species to minimize breeding sites. Remove volunteer
      plants that can serve as alternate hosts.
    mechanical_physical: Utilize sticky traps and fine netting to capture adult flies and block egg-laying on fruit.
    organic_sprays: Apply organic insecticidal soaps or neem oil during peak adult activity to deter oviposition and lower
      larval survival.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Beetles
  - Insectivorous Birds
