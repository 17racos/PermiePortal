---
- name: Pickleworm
  slug: pickleworm
  picture: pickleworm.jpg
  scientific_name: Diaphania nitidalis
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, pickleworm may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Plant parthenocarpic types under cover; destroy infested fruit daily; end-season tillage may reduce
      pupae where appropriate.
    biological_controls: Trichogramma spp. egg parasitoids; generalist predators on flowers.
    cultural_practices: Harvest frequently before full size to reduce egg-lay sites; interplanting has modest effects—cover
      is more reliable.
    mechanical_physical: Row cover until bloom; slit fruit to destroy larvae when few plants are affected.
    organic_sprays: Bt kurstaki on flowers and small fruit; spinosad where labeled—timing before bore-in is critical.
  natural_enemies:
  - Trichogramma spp.
  - Predatory Bugs
