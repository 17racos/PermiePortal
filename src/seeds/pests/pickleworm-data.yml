---
- name: Pickleworm
  slug: pickleworm
  picture: pickleworm.jpg
  scientific_name: Diaphania nitidalis
  description: The larva of a tropical crambid moth that bores into cucumber, squash, melon, and related fruit after feeding
    on flowers. Frass at entry holes and collapsing fruit are telltales in warm-season gardens.
  characteristics: Greenish caterpillar with two translucent bands and a dark head; moth is white with dark wing margins.
    Multiple generations per year in hot climates.
  control_methods:
    preventive_methods: Plant parthenocarpic types under cover; destroy infested fruit daily; end-season tillage may reduce
      pupae where appropriate.
    biological_controls: Trichogramma spp. egg parasitoids; generalist predators on flowers.
    cultural_practices: Harvest frequently before full size to reduce egg-lay sites; interplanting has modest effects—cover
      is more reliable.
    mechanical_physical: Row cover until bloom; slit fruit to destroy larvae when few plants are affected.
    organic_sprays: Bt kurstaki on flowers and small fruit; spinosad where labeled—timing before bore-in is critical.
  natural_enemies:
  - Trichogramma spp.
  - Predatory Bugs
