---
- name: Dill Worms
  slug: dill-worms
  picture: dill_worms.jpg
  scientific_name: Lepidoptera larva
  description: Dill Worms are caterpillars that feed on dill and other umbelliferous plants. Their feeding results in skeletonized
    leaves and significant reductions in plant vigor, affecting both yield and quality.
  characteristics: These larvae are typically green and slender, blending in with the foliage. Their feeding creates irregular
    holes and can cause extensive defoliation if infestations are severe.
  control_methods:
    preventive_methods: Inspect dill plants regularly and promptly remove egg clusters to prevent larval establishment. Maintain
      healthy plants through balanced nutrition.
    biological_controls: Promote beneficial predators like parasitic wasps and predatory beetles that target caterpillar stages.
    cultural_practices: Utilize companion planting with repellent species and practice crop rotation to minimize buildup of
      pest populations.
    mechanical_physical: Hand-pick larvae from plants and use floating row covers during vulnerable periods to prevent adult
      moths from laying eggs.
    organic_sprays: Apply organic insecticidal soap or neem oil early in the infestation cycle to control larval populations.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Beetles
  - Birds
