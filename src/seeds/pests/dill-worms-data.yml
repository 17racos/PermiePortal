---
- name: Dill Worms
  slug: dill-worms
  picture: dill_worms.webp
  scientific_name: Lepidoptera larva
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, dill worms may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Inspect dill plants regularly and promptly remove egg clusters to prevent larval establishment. Maintain
      healthy plants through balanced nutrition.
    biological_controls: Promote beneficial predators like parasitic wasps and predatory beetles that target caterpillar stages.
    cultural_practices: Utilize companion planting with repellent species and practice crop rotation to minimize buildup of
      pest populations.
    mechanical_physical: Hand-pick larvae from plants and use floating row covers during vulnerable periods to prevent adult
      moths from laying eggs.
    organic_sprays: Apply organic insecticidal soap or neem oil early in the infestation cycle to control larval populations.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Beetles
  - Birds
