---
- name: Striped Cucumber Beetle
  slug: striped-cucumber-beetle
  picture: striped_cucumber_beetle.jpg
  scientific_name: Acalymma vittatum
  description: A yellow beetle with three black stripes lengthwise down each wing cover; skeletonizes cotyledons, shreds flowers,
    and vectors cucurbit bacterial wilt in the eastern U.S. Often the first pest you meet when cucurbits emerge.
  characteristics: Slender compared to spotted cucumber beetle; strong flier; aggregates on blossoms. Larvae feed on roots
    of cucurbits and some weeds but are less studied than corn rootworm cousins.
  control_methods:
    organic_sprays: Kaolin barrier sprays on stems and leaves; neem or pyrethrin for knockdown—repeat after wash-off; soaps
      have limited persistence on beetles.
    biological_controls: Generalist predators and parasitic flies help at margins; conserve ground cover that supports them
      without boosting alternate hosts excessively.
    cultural_practices: Row covers until bloom; trap crop of preferred cultivar on edges; remove wilted vines promptly to
      reduce bacterial inoculum.
    mechanical_physical: Shake adults into soapy water mornings; fine mesh exclusion where pollination is hand-assisted.
    preventive_methods: Yellow sticky cards for arrival timing; destroy crop residues that shelter overwintering adults.
  natural_enemies:
  - Tachinid flies
  - Ground beetles
  - Predatory bugs
