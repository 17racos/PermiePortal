- name: "Root aphids"
  slug: "root-aphids"
  picture: "root_aphids.webp"
  scientific_name: "Pemphigus and related genera"
  description: >-
    Root aphids are small soft-bodied insects that feed on roots and sometimes stem bases, causing stunting, wilting under
    heat, and unexplained poor growth above ground. They are common in container production, hydroponic media, and heavy
    soils where winged forms migrate between alternate hosts. Honeydew in soil is not visible like on leaves, so diagnosis
    comes from washing roots or finding white cast skins in the root ball.
  characteristics: >-
    Knock plants from pots and rinse roots over a white tray -- look for pear-shaped aphids, pale to greenish, with
    cornicles on some species. Compare with springtail confusion by movement speed and body shape. Winged morphs on soil
    surface signal migration timing. Sticky traps at canopy height catch dispersing adults in greenhouses.
  symptoms:
  - wilting
  - yellowing-leaves
  - root-damage
  - distorted-growth
  - sticky-residue
  control_methods:
    biological_controls: >-
      Aphidius and Praon parasitoids attack some root aphid flights when they occur above ground briefly. Hypoaspis and
      Stratiolaelaps soil mites consume small soil insects including young aphids in media. Steinernema feltiae nematodes
      can infect root-zone stages when moisture and temperature align with labels. Preserve ground beetle habitat at bed
      edges outdoors.
    preventive_methods: >-
      Screen greenhouse vents and use clean bagged media. Avoid reusing outdoor soil in propagation without treatment plans.
      Quarantine new batches of mother plants. Manage ants that farm root aphids indirectly by tending honeydew-producing
      partners on stems.
    cultural_practices: >-
      Let containers dry slightly between irrigations to reduce algae that some species cue on. Repot rootbound plants
      with fresh mix when populations explode. In field systems, rotate away from known alternate hosts when extension
      maps show local cycles.
    mechanical_physical: >-
      Wash roots gently and replant into clean media for high-value houseplants. Solarize small batches of suspect mix
      before reuse. For hydroponics, clean sumps and replace media per system protocols when aphids appear.
    organic_sprays: >-
      Azadirachtin and Beauveria drenches reach root zones better than pyrethrin foliar sprays. Insecticidal soap drenches
      help on light infestations but may affect tender roots if repeated. Always confirm crop and system label allowances
      for recirculating hydro. Rotate chemistry classes where resistance is possible in protected crops.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Mites
  - Nematodes
  affected_plants: []
