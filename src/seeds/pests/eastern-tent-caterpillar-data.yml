---
- name: Eastern Tent Caterpillar
  slug: eastern-tent-caterpillar
  picture: eastern_tent_caterpillar.webp
  scientific_name: Malacosoma americanum
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, eastern tent caterpillar
    may be feeding right now. These larvae can eat fast and strip a healthy plant in a short
    window. Young stages are easy to miss, then damage suddenly explodes as they grow. Catch
    them early to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki applied when larvae are small and actively feeding gives excellent control
      with minimal non-target impact. Neem or spinosad can follow label directions on orchard trees. Spot-spray only tents
      and surrounding foliage to preserve early-season pollinators on understory blooms.
    biological_controls: Parasitic flies (Tachinidae) and wasps (Ichneumonidae, Braconidae) attack larvae; birds tear open
      tents. Avoid destroying occupied tents right before parasitoid emergence unless trees are critically defoliated.
    cultural_practices: Prune out winter egg bands when seen on young trees. Maintain orchard floor diversity without letting
      wild cherry thickets touch drip lines of nursery blocks. Accept light defoliation on mature trees to preserve biological
      control reservoirs.
    mechanical_physical: Strip small tents by hand on reachable limbs and drop into soapy water—early removal prevents branch
      stripping. For backyard cherries, a gloved hand crushing early instars inside tents works fast. Power-wash is not recommended;
      it damages bark more than larvae.
    preventive_methods: Walk blocks in dormant season to flag twigs with egg masses. Map chronic crotches that held tents
      for targeted winter pruning. Educate clients that one bad spring does not mandate calendar sprays every year—monitor
      larval size before choosing Bt.
