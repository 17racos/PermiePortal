---
- name: Harlequin Ladybird
  slug: harlequin-ladybird
  picture: harlequin_ladybird.jpg
  scientific_name: Harmonia axyridis
  description: A large lady beetle introduced for aphid control that now ranks as a pest in its own right in many
    contexts. It contaminates grape and berry harvests with bitter alkaloids, stains soft fruit, nips thin-skinned grapes,
    and aggregates by thousands on buildings in late fall. Larvae still eat aphids—so the species is a paradox, a biocontrol
    ally in vegetables and a nuisance in vineyards and homes. Present across temperate North America and increasingly reported
    in Central and South America—zones roughly 4–10 for outdoor pressure, with indoor aggregations wherever winters are
    cold enough to drive sun-seeking behavior.
  characteristics: Highly variable—black with red spots, red with many spots, or nearly spotless. The pale M- or W-shaped
    mark on the pronotum separates it from most native Coccinellidae. Adults are round, about 1/4–5/16 inch (6–8 mm). Larvae
    are black with orange markings and alligator-shaped like other lady beetles but larger and more bristly.
  control_methods:
    organic_sprays: No spray fixes aggregations on siding; vacuum or broom-and-soapy-water removal is primary. On small
      fruit plots before harvest, kaolin clay can reduce landing and probing where labeled. Insecticidal soap is not a
      responsible mass-control tool for adult beetles because non-target lady beetles and pollinators share the same
      habitat—reserve soaps for spot problems on non-crop surfaces if at all.
    biological_controls: Encourage diverse native predators so aphid control does not depend solely on Harmonia—lacewings,
      syrphids, and parasitic wasps fill gaps without winery taint risk. Long term, landscape diversity reduces boom-bust
      aphid cycles that trigger explosive Harmonia reproduction.
    cultural_practices: Harvest grapes and berries promptly when sugar rises—beetles concentrate on ripest clusters. Avoid
      leaving damaged fruit in rows. In new vineyards, consider proximity to large overwintering structures; windbreaks
      of mixed species may spread aggregations compared with a single warm wall.
    mechanical_physical: Seal attics, soffits, and window gaps before fall flights with fine mesh and caulking. Use a
      shop vacuum with a soapy tank for indoor masses—release outdoors only if regulations and neighbor relations allow,
      otherwise freeze the bag. Row cover on seed beds excludes beetles when hoops are tight and edges weighted.
    preventive_methods: Monitor clusters weekly from véraison onward; flag rows near known overwintering buildings. Train
      pickers to drop beetle-heavy clusters into culls. Document pressure years to time netting or early picks next season.
  natural_enemies:
  - Parasitic Wasps (Dinocampus coccinellae)
  - Pathogenic Fungi (Beauveria bassiana)
  - Insectivorous Birds
  - Assassin Bugs (Reduviidae)
