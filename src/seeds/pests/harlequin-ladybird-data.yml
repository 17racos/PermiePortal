---
- name: Harlequin Ladybird
  slug: harlequin-ladybird
  picture: harlequin_ladybird.jpg
  scientific_name: Harmonia axyridis
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, harlequin ladybird may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: No spray fixes aggregations on siding; vacuum or broom-and-soapy-water removal is primary. On small fruit
      plots before harvest, kaolin clay can reduce landing and probing where labeled. Insecticidal soap is not a responsible
      mass-control tool for adult beetles because non-target lady beetles and pollinators share the same habitat—reserve soaps
      for spot problems on non-crop surfaces if at all.
    biological_controls: Encourage diverse native predators so aphid control does not depend solely on Harmonia—lacewings,
      syrphids, and parasitic wasps fill gaps without winery taint risk. Long term, landscape diversity reduces boom-bust
      aphid cycles that trigger explosive Harmonia reproduction.
    cultural_practices: Harvest grapes and berries promptly when sugar rises—beetles concentrate on ripest clusters. Avoid
      leaving damaged fruit in rows. In new vineyards, consider proximity to large overwintering structures; windbreaks of
      mixed species may spread aggregations compared with a single warm wall.
    mechanical_physical: Seal attics, soffits, and window gaps before fall flights with fine mesh and caulking. Use a shop
      vacuum with a soapy tank for indoor masses—release outdoors only if regulations and neighbor relations allow, otherwise
      freeze the bag. Row cover on seed beds excludes beetles when hoops are tight and edges weighted.
    preventive_methods: Monitor clusters weekly from véraison onward; flag rows near known overwintering buildings. Train
      pickers to drop beetle-heavy clusters into culls. Document pressure years to time netting or early picks next season.
