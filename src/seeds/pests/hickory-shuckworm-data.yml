---
- name: Hickory Shuckworm
  slug: hickory-shuckworm
  picture: hickory_shuckworm.webp
  scientific_name: Cydia caryana
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, hickory shuckworm may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki or spinosad aimed at small larvae after nut set—coverage inside shucks
      is tough, so time sprays to egg hatch using pheromone trap biofix.
    biological_controls: Trichogramma egg parasitoids in research settings; braconid and ichneumonid parasitoids of larvae—preserve
      with selective timing.
    cultural_practices: Remove alternate hosts like late corn near orchards; destroy fallen infested nuts; open canopy modestly
      for predator access without sun-scalding fruit.
    mechanical_physical: Mating disruption with pheromones works at adequate contiguous acreage—less practical for single
      backyard trees.
    preventive_methods: Hang pheromone traps to monitor flights; scout shucks for entry holes and frass two weeks after peak
      catch.
  natural_enemies:
  - Trichogramma spp.
  - Braconid Wasps
  - Ichneumonid Wasps
  affected_plants:
  - slug: pecan-tree
    name: Pecan Tree
  - slug: scrub-hickory
    name: Scrub Hickory
  - slug: walnut-tree
    name: Walnut Tree
