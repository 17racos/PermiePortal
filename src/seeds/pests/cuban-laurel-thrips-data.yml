---
- name: Cuban Laurel Thrips
  slug: cuban-laurel-thrips
  picture: cuban_laurel_thrips.jpg
  scientific_name: Gynaikothrips ficorum
  description: A thrips species tied to Ficus (especially Cuban laurel and weeping fig), causing leaf rolling, bronzing, and
    black fecal spotting. Damage is mostly aesthetic on large trees but can stress ornamentals.
  characteristics: Dark-bodied thrips about 1.5 mm inside tightly rolled leaf galls they induce; adults are winged and dark.
  control_methods:
    preventive_methods: Inspect new Ficus material; avoid shearing that produces the soft flush thrips prefer if timing draws
      outbreaks.
    biological_controls: Minute pirate bugs and lacewing larvae feed on thrips when they can reach them inside rolls; conserve
      generalist predators.
    cultural_practices: Prune and remove heavily rolled terminals and destroy them; improve airflow in dense canopies.
    mechanical_physical: Strong water blast on accessible shrubs dislodges some adults.
    organic_sprays: Insecticidal soap or neem with pressure to penetrate rolled leaves; systemic organics are limited—repeat
      applications often needed.
  natural_enemies:
  - Minute Pirate Bugs
  - Lacewings
  - Predatory Mites
