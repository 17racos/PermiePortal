---
- name: Vegetable Leafminer
  slug: vegetable-leafminer
  picture: vegetable_leafminer.webp
  scientific_name: Liriomyza sativae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, vegetable leafminer may already be
    on the plant. This pest often builds quietly, then damage appears all at once. Feeding
    stress weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup
    is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Neem, insecticidal soap, or spinosad-based OMRI-listed products directed at adults and young mines—repeat
      on a short interval while flights continue, with attention to leaf undersides.
    biological_controls: Parasitoid wasps in the Diglyphus and Chrysonotomyia groups commonly recycle populations in unsprayed
      plantings; flowering insectary strips help maintain them.
    cultural_practices: Strip mined leaves on small plants; rotate away from susceptible hosts; avoid over-fertilizing with
      quick-release nitrogen that pushes soft, attractive foliage.
    mechanical_physical: Floating row cover excludes adults from seedling beds; yellow traps for monitoring and mass-trapping
      in tunnels or greenhouses.
    preventive_methods: Start clean transplants; rogue reservoir weeds in the aster family and other agromyzid hosts near
      fields.
  natural_enemies:
  - Diglyphus spp.
  - Chrysonotomyia spp.
  - Green Lacewings
