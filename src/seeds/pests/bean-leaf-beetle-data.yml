---
- name: Bean Leaf Beetle
  slug: bean-leaf-beetle
  picture: bean_leaf_beetle.jpg
  scientific_name: Cerotoma trifurcata
  description: A small leaf beetle that punches round holes in soybean and bean foliage and can scar pods; color morphs range
    from red to yellow to tan with a black triangle behind the head—same pest, different paint jobs.
  characteristics: Adults chew round holes; larvae feed underground on roots and nodules. Overwinters as adults in leaf litter;
    colonizes early beans in spring.
  control_methods:
    organic_sprays: Neem and pyrethrin provide short residual knockdown on adults; kaolin can deter feeding on seedling beans
      when applied thoroughly.
    biological_controls: Ground beetles, crickets, and spiders reduce adults; conserve residue management that supports predators
      without boosting slugs unduly.
    cultural_practices: Avoid very early ultra-isolated bean rows; plant perimeter trap rows; rotate with non-legumes.
    mechanical_physical: Row covers on garden beans until flowering; shake adults into water trays.
    preventive_methods: Scout cotyledons for shot-hole feeding; watch first trifoliates for thresholds.
  natural_enemies:
  - Ground beetles
  - Crickets
  - Spiders
