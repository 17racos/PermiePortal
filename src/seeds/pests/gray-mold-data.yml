---
- name: Gray Mold
  slug: gray-mold
  picture: gray_mold.jpg
  scientific_name: Botrytis cinerea
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, gray mold may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Reduce humidity with spacing, pruning, and morning irrigation; use drip; heat or vent greenhouses
      before nightfall.
    biological_controls: Apply Ulocladium, Gliocladium, or Bacillus-based biological fungicides to flowers or fruit clusters
      where products are labeled.
    cultural_practices: Remove spent blossoms and infected fruit promptly, mulch berries off soil, and avoid bruising at harvest.
    mechanical_physical: Berry clamshells or tunnels with good airflow; fans in high tunnels.
    organic_sprays: Bacillus subtilis, Streptomyces, or botanical extracts labeled for Botrytis; sulfur or potassium bicarbonate
      on some crops. Repeat before wet spells.
  natural_enemies:
  - Hyperparasitic Fungi
  - Antagonistic Bacteria
