---
- name: Cocoa Pod Borer
  slug: cocoa-pod-borer
  picture: cocoa_pod_borer.jpg
  scientific_name: Conopomorpha cramerella
  description: A small moth whose larvae tunnel cocoa pods, stitch chambers with silk, and turn beans into fermenting regret.
    External entry is a tiny scar; inside is frass, webbing, and quality loss you cannot sort away.
  characteristics: Multiple larvae per pod in heavy pressure; damaged pods ripen unevenly and harbor rot. Adults are twilight
    fliers—monitor with pheromone traps where programs exist.
  control_methods:
    organic_sprays: Bt aizawai or spinosad timed to egg hatch—coverage must wet pod surface; neem rotations help in low-input
      blocks when labels allow export residue rules.
    biological_controls: Trichogramma spp. releases for egg parasitism; ants (Azteca complexes in some agroforestry systems)
      reduce larval survival—context-specific but real.
    cultural_practices: Black pod hygiene—remove mummies; shade management to slow borer activity windows; harvest ripe pods
      every two weeks so larvae do not graduate.
    mechanical_physical: Pod stripping in outbreak zones; baited traps for monitoring, not miracle eradication.
    preventive_methods: Synchronize farm sanitation; coordinate area-wide pheromone monitoring so neighbors are not breeding
      moths for your farm.
  natural_enemies:
  - Trichogramma spp.
  - Ants (species-dependent)
