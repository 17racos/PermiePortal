---
- name: Leaf Curl
  slug: leaf-curl
  picture: leaf_curl.jpg
  scientific_name: Taphrina deformans
  description: Peach leaf curl shows up as thick, puckered, reddish leaves on peaches, nectarines, and almonds before they
    look like a failed origami project. The fungus overwinters in bark and bud scales; cool wet springs release spores that
    infect new tissue.
  characteristics: Infected leaves swell, curl, and may yellow or drop; fruit can crack or show raised corky spots. Repeated
    defoliation weakens trees. The pathogen is host-specific to Prunus; you will not confuse it with herbicide drift once
    you see the classic blistered foliage.
  control_methods:
    organic_sprays: Copper sprays (fixed copper or Bordeaux) applied during dormancy and at bud swell—before leaves emerge—are
      the backbone of organic programs; lime sulfur dormant applications also suppress overwintering inoculum. Re-treat per
      label if wet weather drags on.
    biological_controls: No silver-bullet biocontrol exists for Taphrina; soil and canopy biodiversity still supports overall
      tree vigor and limits secondary stress pests.
    cultural_practices: Plant resistant cultivars where available; avoid excessive nitrogen that pushes lush susceptible growth.
      Improve drainage and air flow; rake and compost or remove heavily infected leaf fall to cut secondary spore loads.
    mechanical_physical: Prune out dead wood and crowded interior branches to speed drying; destroy severely infected shoots
      when practical.
    preventive_methods: Site trees in full sun with spacing; monitor buds and apply the dormant copper window religiously
      in wet climates—missing that window is how the fungus wins.
  natural_enemies:
  - Beneficial Microbes
  - Soil Antagonistic Microbes
