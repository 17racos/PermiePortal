---
- name: Pea Moth
  slug: pea-moth
  picture: pea_moth.jpg
  scientific_name: Cydia nigricana
  description: A small tortricid whose caterpillars live inside pea pods, eating seeds and leaving frass that ruins shelling
    day. You notice the moth never—you find the crime at the kitchen bowl.
  characteristics: Single creamy larva per pod usually; tiny entry hole near calyx or suture. Flight peaks tie to degree-days;
    pheromone traps catch males for timing, not mass murder.
  control_methods:
    organic_sprays: Bt kurstaki or spinosad during egg hatch—must contact fresh pods; repeat after rain; evening sprays spare
      some daytime flyers.
    biological_controls: Trichogramma releases target eggs in research and specialty fields; generalist parasitoids help at
      margins—preserve flowering strips.
    cultural_practices: Early-maturing cultivars escape late flights; destroy crop residues; wide rotation away from Vicia/Pisum
      neighbors.
    mechanical_physical: Floating row cover until flowering—remove for pollination if needed, then accept some loss or hand-pollinate
      tunnels.
    preventive_methods: Trap thresholds vary by region—learn your local biofix instead of guessing from a meme chart.
  natural_enemies:
  - Trichogramma spp.
  - Braconid Wasps
