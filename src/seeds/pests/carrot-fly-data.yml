---
- name: Carrot Fly
  slug: carrot-fly
  picture: carrot_fly.jpg
  scientific_name: Psila rosae
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, carrot fly may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Spinosad or neem drenches aimed at the soil surface during egg-lay windows—after thinning and after rain
      resets—rotate to preserve efficacy.
    biological_controls: Ground beetles and rove beetles scavenge eggs; parasitic nematodes (Heterorhabditis/Steinernema)
      can suppress larvae in light soils when soil temps cooperate.
    cultural_practices: Floating row cover sealed at edges; rotate Apiaceae blocks; delay planting to dodge peak flight; inter-row
      onions only help morale, not geometry—barrier fabric wins.
    mechanical_physical: Fine mesh cages over beds; sticky cards at canopy height for monitoring, not control.
    preventive_methods: Scout with traps in May–June (latitude-dependent); remove spent umbels that attract flies to seed
      fields.
  natural_enemies:
  - Ground Beetles
  - Rove Beetles
  - Entomopathogenic Nematodes
