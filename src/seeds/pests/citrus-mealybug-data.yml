---
- name: Citrus Mealybug
  slug: citrus-mealybug
  picture: citrus_mealybug.jpg
  scientific_name: Planococcus citri
  description: Oval, wax-coated sucking insects that colonize leaf axils, fruit clusters, and bark, producing honeydew and
    sooty mold. Ants often tend them and protect them from predators.
  characteristics: Pinkish body under white mealy wax; filaments along the margin; crawlers spread to new growth.
  control_methods:
    preventive_methods: Exclude ants with sticky barriers or tanglefoot on trunks; inspect nursery stock.
    biological_controls: Cryptolaemus montrouzieri lady beetle and parasitoids such as Anagyrus spp. are effective if ants
      are controlled.
    cultural_practices: Prune crowded interior branches to improve spray penetration and predator access.
    mechanical_physical: Scrub localized colonies with alcohol swab or toothbrush on small trees.
    organic_sprays: Insecticidal soap or neem plus thorough coverage into crevices; repeat to catch crawlers.
  natural_enemies:
  - Cryptolaemus montrouzieri
  - Parasitic Wasps
  - Lacewings
