---
- name: Citrus Mealybug
  slug: citrus-mealybug
  picture: citrus_mealybug.jpg
  scientific_name: Planococcus citri
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, citrus mealybug may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Exclude ants with sticky barriers or tanglefoot on trunks; inspect nursery stock.
    biological_controls: Cryptolaemus montrouzieri lady beetle and parasitoids such as Anagyrus spp. are effective if ants
      are controlled.
    cultural_practices: Prune crowded interior branches to improve spray penetration and predator access.
    mechanical_physical: Scrub localized colonies with alcohol swab or toothbrush on small trees.
    organic_sprays: Insecticidal soap or neem plus thorough coverage into crevices; repeat to catch crawlers.
  natural_enemies:
  - Cryptolaemus montrouzieri
  - Parasitic Wasps
  - Lacewings
