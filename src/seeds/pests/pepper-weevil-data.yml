---
- name: Pepper Weevil
  slug: pepper-weevil
  picture: pepper_weevil.jpg
  scientific_name: Anthonomus eugenii
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    pepper weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Pyrethrin or spinosad can knock down adults when applied with thorough canopy coverage and repeated intervals
      during peak flight—always verify crop and setting labels for pepper. Kaolin on foliage may deter feeding and oviposition
      where permitted. No organic spray replaces aggressive sanitation in infested blocks.
    biological_controls: Generalist predators including minute pirate bugs, lacewing larvae, and spiders take some adults
      and larvae but rarely stop outbreaks. Parasitoids are limited; focus biocontrol budget on preventing entry via clean
      transplants and perimeter weed hosts.
    cultural_practices: Destroy cull fruit and aborted buds daily in infested fields; till in finished rows promptly. Remove
      nightshade weeds that support off-season reproduction. Rotate houses to a non-host break between pepper crops when economically
      possible.
    mechanical_physical: Vacuum adults from canopy in cool morning trials has niche use on research scales; for farms, emphasis
      stays on removal of infested fruit and exclusion netting on high tunnels with sealed sides.
    preventive_methods: Pheromone-baited traps monitor adults at field edges; zero tolerance near packing sheds. Source transplants
      from certified clean houses. Inspect flowers with a hand lens weekly during first fruit set.
