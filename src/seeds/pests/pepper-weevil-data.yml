---
- name: Pepper Weevil
  slug: pepper-weevil
  picture: pepper_weevil.jpg
  scientific_name: Anthonomus eugenii
  description: A small snout beetle that lays eggs in pepper buds, flowers, and young fruit; larvae feed inside, causing
    yellowing, abortion, and internal rot that shows up as mystery drop in the row. It is a regulated and economically
    devastating pest of bell and chile peppers in warm production belts from the southern United States through Mexico,
    Central America, and the Caribbean, with intercepted populations sometimes appearing in greenhouses farther north.
    Outdoor pressure concentrates in roughly zones 8–12; tunnels can harbor weevils year-round if infested transplants
    enter clean houses.
  characteristics: Adults are dark gray, about 1/8 inch (3 mm), with a long curved snout and elbowed antennae. Eggs are
    laid under calyx tissue; larvae are white, legless, and confined inside pods. Field ID is the combination of aborted
    buds, hole-punched fruit shoulders, and adults hiding in canopy heat.
  control_methods:
    organic_sprays: Pyrethrin or spinosad can knock down adults when applied with thorough canopy coverage and repeated
      intervals during peak flight—always verify crop and setting labels for pepper. Kaolin on foliage may deter feeding
      and oviposition where permitted. No organic spray replaces aggressive sanitation in infested blocks.
    biological_controls: Generalist predators including minute pirate bugs, lacewing larvae, and spiders take some adults
      and larvae but rarely stop outbreaks. Parasitoids are limited; focus biocontrol budget on preventing entry via clean
      transplants and perimeter weed hosts.
    cultural_practices: Destroy cull fruit and aborted buds daily in infested fields; till in finished rows promptly.
      Remove nightshade weeds that support off-season reproduction. Rotate houses to a non-host break between pepper crops
      when economically possible.
    mechanical_physical: Vacuum adults from canopy in cool morning trials has niche use on research scales; for farms,
      emphasis stays on removal of infested fruit and exclusion netting on high tunnels with sealed sides.
    preventive_methods: Pheromone-baited traps monitor adults at field edges; zero tolerance near packing sheds. Source
      transplants from certified clean houses. Inspect flowers with a hand lens weekly during first fruit set.
  affected_plants:
  - slug: chiltepin-pepper
    name: Chiltepin Pepper
  - slug: ground-cherry
    name: Ground Cherry
  - slug: pepino-melon
    name: Pepino Melon
  natural_enemies:
  - Minute Pirate Bugs (Orius spp.)
  - Lacewing larvae (Chrysopidae)
  - Orb-weaver Spiders
  - Ground Beetles (Carabidae)
