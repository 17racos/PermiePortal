---
- name: Greenhouse Whitefly
  slug: greenhouse-whitefly
  picture: greenhouse_whitefly.jpg
  scientific_name: Trialeurodes vaporariorum
  description: A greenhouse and outdoor pest on vegetables and ornamentals; adults and nymphs suck sap from leaf undersides,
    excrete honeydew, and can vector some plant viruses. Often confused with Bemisia until you note the wings lie flatter
    and the waxy late nymphs look more like tiny scale insects.
  characteristics: Adults are small, white, moth-like, and hold wings roof-like over the body; nymphs are flat, oval, and
    sessile on the underside of leaves. Thrives in warm, protected environments and can explode when natural enemies are scarce.
  control_methods:
    organic_sprays: Insecticidal soap, horticultural or plant-based oils, and neem where labeled—spot-treat and avoid broad
      coverage that wipes out parasitoids; Beauveria bassiana can help on nymphs in humid conditions.
    biological_controls: Encarsia formosa and Eretmocerus spp. are standard parasitoids in protected culture; Delphastus catalinae
      and lacewings supplement control—conserve them by avoiding unnecessary sprays.
    cultural_practices: Avoid excess nitrogen that produces lush, attractive foliage; remove heavily infested lower leaves;
      use reflective mulches in row crops to repel settling adults where practical.
    mechanical_physical: Yellow sticky cards for monitoring and modest adult capture; gentle vacuuming of adults in enclosed
      spaces; strong water rinse can dislodge some adults and crawlers.
    preventive_methods: Inspect brought-in plants and cuttings; maintain banker plants or early releases of parasitoids in
      greenhouses; keep weeds that harbor whiteflies mowed back near structures.
  natural_enemies:
  - Encarsia formosa
  - Eretmocerus spp.
  - Delphastus catalinae
  - Lacewings
