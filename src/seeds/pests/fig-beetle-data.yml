---
- name: Fig Beetle
  slug: fig-beetle
  picture: fig_beetle.jpg
  scientific_name: Cotinis mutabilis
  description: Big metallic green scarabs that show up when fruit gets soft—figs, grapes, stone fruit, even tomatoes with
    a split. Adults are the visible stage; they do not skeletonize leaves like Japanese beetles, they drill into ripe flesh
    and invite rot and wasp parties.
  characteristics: Chunky, shiny green-bronze beetles roughly 3/4 inch long with faint lateral stripes; larvae are C-shaped
    white grubs in compost and soil. Flight is loud and clumsy—easy to spot at dusk on ripening clusters.
  control_methods:
    organic_sprays: Kaolin clay on fruit clusters before ripening reduces landing; neem or pyrethrin only as spot treatments—avoid
      blanketing flowering plants. Nothing beats picking fruit on time.
    biological_controls: Birds, toads, and robber flies pick off adults; skunks and moles dig grubs—accept some lawn archaeology
      as the price of free beetle control.
    cultural_practices: Harvest daily during peak ripeness; remove windfalls and split fruit; keep compost piles away from
      fruiting zones so grubs are not under your best trees.
    mechanical_physical: Floating row cover over small plantings until harvest; hand-collect adults into soapy water during
      evening feeding binges.
    preventive_methods: Sanitation breaks the party—no forgotten fruit, no fermentation perfume calling in every scarab in
      the zip code.
  natural_enemies:
  - Birds
  - Toads
  - Robber Flies
