---
- name: Rhinoceros Beetle
  slug: rhinoceros-beetle
  picture: rhinoceros_beetle.webp
  scientific_name: Oryctes rhinoceros
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, rhinoceros beetle may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Metarhizium anisopliae or Beauveria bassiana formulations aimed at breeding sites and adults—works where
      moisture keeps spores viable; neem on traps as a weak backup kiss.
    biological_controls: Oryctes nudivirus where approved and available; pigs and poultry turn compost piles; mongooses and
      monitor lizards—controversial guests—also eat grubs in the wild.
    cultural_practices: Sanitize palm debris; chip and compost hot; kill standing stumps larvae use as condos; light trapping
      only as monitoring—mass outdoor lights call beetles to party.
    mechanical_physical: Pheromone-baited bucket traps; hand-remove adults from crowns on short trees at night.
    preventive_methods: No idle palm logs; coordinate community cleanup after storms—your neighbor’s woodpile is your immigration
      office.
  natural_enemies:
  - Scoliid Wasps
  - Birds
