---
- name: Brown Citrus Aphid
  slug: brown-citrus-aphid
  picture: brown_citrus_aphid.jpg
  scientific_name: Toxoptera citricida
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, brown citrus aphid may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Avoid excessive nitrogen flushes; screen greenhouse citrus; release biological controls in enclosed
      structures.
    biological_controls: Lady beetles, lacewings, syrphid larvae, and parasitic wasps (Lipolexis spp.) commonly suppress outbreaks
      if not disrupted.
    cultural_practices: Preserve flowering groundcovers for predators; knock down early colonies with water on small trees.
    mechanical_physical: Strong spray of water on backyard trees; prune heavily infested flush into soapy water.
    organic_sprays: Insecticidal soap or narrow-range horticultural oil on new growth—avoid applications during bloom heat
      that harm natural enemies.
  natural_enemies:
  - Parasitic Wasps
  - Ladybugs
  - Lacewings
  - Hoverfly Larvae
