---
- name: Soybean Looper
  slug: soybean-looper
  picture: soybean_looper.jpg
  scientific_name: Chrysodeixis includens
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, soybean looper may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt kurstaki on small loopers; spinosad for larger stages—good canopy penetration matters in soybeans.
    biological_controls: Parasitic wasps and tachinids; fungal pathogens during humid spells.
    cultural_practices: Diverse rotations; avoid consecutive susceptible hosts; support beneficials with border plantings.
    mechanical_physical: Row covers on high-value vegetables before canopy closure.
    preventive_methods: UV or blacklight monitoring; threshold-based scouting in legumes.
  natural_enemies:
  - Braconid wasps
  - Tachinid flies
  - Entomopathogenic fungi
