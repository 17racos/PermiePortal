---
- name: Coconut Mite
  slug: coconut-mite
  picture: coconut_mite.jpg
  scientific_name: Aceria guerreronis
  description: Eriophyid mites that colonize the meristem under bracts, scarring young nuts and causing distortion, abortion,
    or cosmetic russeting. Damage hides until you peel the bracts—then it is a furry city.
  characteristics: Brown necrotic patches at the button; nuts may fall early or grow lopsided. Dry winds and continuous fruiting
    canopies favor explosions.
  control_methods:
    organic_sprays: Sulfur or horticultural oils directed into the spear/bract zone—repeat carefully to avoid phytotoxicity
      on hot days; soap works on tender tissues if coverage is surgical.
    biological_controls: Predatory mites (Amblyseius largoensis) and thrips predators are studied/released in some regions;
      conserve generalists by skipping calendar sprays.
    cultural_practices: Remove heavily infested bunches when practical; maintain ground cover to cut dust; balanced nutrition—stressed
      palms host more mites.
    mechanical_physical: High-pressure rinse of young bunches where reachable—logistics laugh at 60-foot palms, but backyard
      coconuts exist.
    preventive_methods: Scout new plantings monthly; flag first russeted buttons before the whole headland matches.
  natural_enemies:
  - Amblyseius largoensis
  - Predatory Thrips
