---
- name: Scale Insects
  slug: scale-insects
  picture: scale_insects.jpg
  scientific_name: Coccoidea
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, scale insects may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain robust plant health with balanced watering and nutrient management, and inspect plants regularly
      for early scale signs.
    biological_controls: Introduce natural enemies such as ladybugs, parasitic wasps, and lacewings which feed on scale insects.
    cultural_practices: Prune infested branches and remove severely affected parts to reduce scale populations.
    mechanical_physical: Use a strong water spray or soft brushing to dislodge scales from plant surfaces.
    organic_sprays: Apply horticultural oils or insecticidal soap during dormant periods to manage scale infestations organically.
  natural_enemies:
  - Ladybugs
  - Parasitic Wasps
  - Lacewings
