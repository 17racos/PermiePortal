---
- name: Japanese Beetles
  slug: japanese-beetles
  picture: japanese_beetles.jpg
  scientific_name: Popillia japonica
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, japanese beetles may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain plant vigor with proper watering and fertilization, and inspect plants early in the season
      to detect and manage beetle populations.
    biological_controls: Encourage natural predators such as parasitic wasps, birds, and beneficial nematodes that target
      beetle larvae.
    cultural_practices: Practice crop rotation and use trap crops to lure beetles away from valuable plants. Remove and destroy
      infested foliage promptly.
    mechanical_physical: Deploy pheromone traps and hand-pick beetles during peak activity periods, and consider physical
      barriers for sensitive plants.
    organic_sprays: Apply neem oil or insecticidal soap early in infestations to minimize feeding damage while preserving
      beneficial insects.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Beneficial Nematodes
