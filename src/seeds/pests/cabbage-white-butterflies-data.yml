---
- name: Cabbage White Butterflies
  slug: cabbage-white-butterflies
  picture: cabbage_white_butterflies.jpg
  scientific_name: Pieris rapae
  description: Cabbage White Butterflies are common pests of brassica crops. The adult butterflies have white wings with small
    black spots, and their eggs hatch into caterpillars that feed voraciously on leaves, causing extensive defoliation.
  characteristics: These butterflies are medium-sized with predominantly white wings accented by black markings. Their larvae,
    known as cabbage worms, are green and can cause significant damage by skeletonizing leaves.
  control_methods:
    preventive_methods: Monitor brassica crops for egg clusters and early larval stages, and maintain plant health with balanced
      watering and fertilization.
    biological_controls: Encourage natural predators such as parasitic wasps, birds, and predatory insects that target cabbage
      worms.
    cultural_practices: Employ crop rotation, interplant with repellent species, and use reflective mulches to deter adult
      butterflies from ovipositing.
    mechanical_physical: Use floating row covers to prevent egg-laying and hand-pick larvae from infested plants.
    organic_sprays: Apply insecticidal soap or neem oil during peak infestation periods to control larvae while protecting
      beneficial insects.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Insects
