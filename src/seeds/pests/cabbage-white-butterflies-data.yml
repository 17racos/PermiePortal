---
- name: Cabbage White Butterflies
  slug: cabbage-white-butterflies
  picture: cabbage_white_butterflies.webp
  scientific_name: Pieris rapae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, cabbage white butterflies may
    already be on the plant. This pest often builds quietly, then damage appears all at once.
    Feeding stress weakens growth, reduces yield, and opens the door to secondary disease. Early
    cleanup is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  symptoms:
  - yellowing-leaves
  - wilting
  - leaf-spots
  - dropping-leaves
  control_methods:
    biological_controls: >-
      Parasitic wasps such as Cotesia species turn Pieris larvae into mummies; birds pick off
      large caterpillars on outer leaves. Minute pirate bugs eat eggs when sprays stay selective.
      If you see cocoons on a caterpillar, leave it -- free biocontrol. Calendar pyrethrin kills
      parasitoids faster than it kills imported cabbageworms.
    preventive_methods: >-
      Scout brassicas for yellow egg clusters and young green larvae -- check undersides first.
      Balanced watering and fertility help plants tolerate feeding; they do not hide insects from
      your eyes. Flag rows that exploded last season; walk those first each spring.
    cultural_practices: >-
      Rotate brassicas with non-host crops; continuous broccoli bridges generations. Reflective
      mulches disorient some adults in bright sun; bury edges. Interplanting repellent species is
      weak evidence; rotation and covers win. Remove wild mustard near fields that hosts the same
      butterflies.
    mechanical_physical: >-
      Floating row covers from transplant until cover removal for head space block egg-laying
      adults when sealed. Hand-pick larvae into soapy water on small beds -- fast when numbers are
      low, comic when numbers are high.
    organic_sprays: >-
      Bacillus thuringiensis kurstaki kills small caterpillars that ingest treated leaf -- spray
      before larvae tunnel into heads. Insecticidal soap and neem contact young larvae on leaf
      surfaces. Spray at dusk to spare bees on open brassica flowers. Reapply after rain; Bt
      washes off fast.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Insects
