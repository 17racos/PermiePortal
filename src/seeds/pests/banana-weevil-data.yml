---
- name: Banana Weevil
  slug: banana-weevil
  picture: banana_weevil.jpg
  scientific_name: Cosmopolites sordidus
  description: The banana corm borer—black weevils that tunnel galleries in rhizomes and pseudostems, weakening mats and inviting
    topple or snapped bunches. Grubs live in frass-packed tunnels; adults hide in leaf sheaths by day.
  characteristics: Notched leaf margins from adult feeding, sawdust-like frass at the base, and mats that decline slowly until
    one storm flattens them. Trap catches spike after mulching or harvest disturbance.
  control_methods:
    organic_sprays: Neem or pyrethrin drenches into pseudostem traps or cut stumps can knock down adults—rotate actives and
      respect label intervals; focus on breeding sites, not canopy fogging.
    biological_controls: Beauveria bassiana formulations targeted to trap catches; ants and earwigs scavenge eggs in mulch;
      poultry scratch at bases where legal and practical.
    cultural_practices: Clean harvest—split and remove old corms; solarize or hot-water treat sword suckers before replanting;
      puddle fields only where drainage otherwise invites rot.
    mechanical_physical: Pseudostem traps (split stem baited with fermenting fruit or pheromone where available); chop and
      destroy infested material off-site.
    preventive_methods: Use certified tissue-culture plants; isolate new mats; monitor with traps monthly—early numbers beat
      late mat collapse.
  natural_enemies:
  - Ants
  - Earwigs
  - Ground Beetles
  affected_plants:
  - slug: banana
    name: Banana
