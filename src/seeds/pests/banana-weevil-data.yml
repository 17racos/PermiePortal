---
- name: Banana Weevil
  slug: banana-weevil
  picture: banana_weevil.webp
  scientific_name: Cosmopolites sordidus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    banana weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Neem or pyrethrin drenches into pseudostem traps or cut stumps can knock down adults—rotate actives and
      respect label intervals; focus on breeding sites, not canopy fogging.
    biological_controls: Beauveria bassiana formulations targeted to trap catches; ants and earwigs scavenge eggs in mulch;
      poultry scratch at bases where legal and practical.
    cultural_practices: Clean harvest—split and remove old corms; solarize or hot-water treat sword suckers before replanting;
      puddle fields only where drainage otherwise invites rot.
    mechanical_physical: Pseudostem traps (split stem baited with fermenting fruit or pheromone where available); chop and
      destroy infested material off-site.
    preventive_methods: Use certified tissue-culture plants; isolate new mats; monitor with traps monthly—early numbers beat
      late mat collapse.
  natural_enemies:
  - Ants
  - Earwigs
  - Ground Beetles
  affected_plants:
  - slug: banana
    name: Banana
