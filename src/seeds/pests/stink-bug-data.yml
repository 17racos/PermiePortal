---
- name: Stink Bug
  slug: stink-bug
  picture: stink_bug.jpg
  scientific_name: Pentatomidae
  description: Shield-shaped true bugs that pierce fruit, pods, and nuts and inject enzymes, causing catfacing, dimpling,
    sunken spots, or internal white pithy areas. Several native and invasive species share this habit; identification matters
    for monitoring but management themes overlap.
  characteristics: Broad flattened body, five-segmented antennae, scent glands that produce a sharp odor when disturbed. Nymphs
    are rounded and often brightly patterned before the adult shield shape appears.
  control_methods:
    preventive_methods: Exclude small plantings with fine mesh, keep weeds and alternate hosts managed near crops, and hand-remove
      overwintering adults from structures when practical.
    biological_controls: Conserve egg parasitoids such as tiny scelionid and platygastrid wasps; reduced broad-spectrum disturbance
      helps. Some regions have released or naturally occurring parasitoids that attack eggs of invasive species.
    cultural_practices: Trap cropping with sunflower, millet, or mustard can concentrate bugs for removal or vacuuming; timely
      harvest reduces exposure on ripe fruit.
    mechanical_physical: Shake bugs into soapy water mornings or evenings; shop-vacuum dense aggregations on trap plants.
      Row covers on young transplants exclude feeding.
    organic_sprays: Neem-based products or insecticidal soap can deter nymphs with thorough coverage; repeat applications
      are usually needed. Kaolin clay on fruit may reduce probing damage.
  natural_enemies:
  - Egg Parasitoid Wasps
  - Assassin Bugs
  - Spiders
