---
- name: Cowpea Curculio
  slug: cowpea-curculio
  picture: cowpea_curculio.jpg
  scientific_name: Chalcodermus aeneus
  description: A small dark snout beetle whose grubs ruin southern pea and cowpea seeds from inside the pod, leaving sunken,
    discolored kernels you notice at shelling time—after the weevil has already won.
  characteristics: Adults are bronzy-black weevils about 3 mm long; females chew holes in pods to oviposit. Larvae develop
    inside individual seeds. Multiple generations in long summers.
  control_methods:
    organic_sprays: Pyrethrin or neem timed to peak adult activity before heavy pod set—coverage of blooms and young pods
      is critical; repeat per label after rain.
    biological_controls: Field crickets and ants prey on larvae and pupae at soil surface; generalist predators limited once
      larvae are inside seeds.
    cultural_practices: Destroy crop residues and volunteer peas; rotate away from legumes; harvest promptly; deep plow or
      bury residue where erosion allows.
    mechanical_physical: Floating row covers on bush types until bloom, then hand-pollinate or remove covers accepting some
      risk; pick pods frequently.
    preventive_methods: Pheromone or sweep-net monitoring for adults; avoid staggered plantings that bridge generations.
  natural_enemies:
  - Field crickets
  - Ants
  - Ground beetles
