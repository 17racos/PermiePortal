---
- name: Caterpillars
  slug: caterpillars
  picture: caterpillars.jpg
  scientific_name: Lepidoptera Larvae
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, caterpillars may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Monitor plants for eggs and young caterpillars, and maintain healthy growth with proper watering and
      balanced fertilization.
    biological_controls: Encourage natural predators like parasitic wasps, birds, and predatory insects such as ladybugs and
      lacewings.
    cultural_practices: Employ crop rotation and interplant with repellent species to disrupt caterpillar populations and
      remove infected plant debris.
    mechanical_physical: Hand-pick caterpillars from plants and use row covers to prevent adult moths from laying eggs.
    organic_sprays: Apply Bacillus thuringiensis (Bt) or neem oil during early infestation stages to target caterpillars without
      affecting beneficial organisms.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Insects
