---
- name: Reniform Nematode
  slug: reniform-nematode
  picture: reniform_nematode.jpg
  scientific_name: Rotylenchulus reniformis
  description: >-
    If plants stay stunted, yellow, and thirsty even with good care, reniform nematode may be
    attacking below ground. These microscopic pests damage roots, so the top growth declines
    before the cause is obvious. Yield drops and wilting worsen in heat because damaged roots
    cannot keep up. Once populations build in soil, control gets harder, so early detection is
    critical.
  characteristics: >-
    Gently lift a struggling plant and inspect roots for knots, lesions, branching distortion,
    or weak root mass. Affected plants often appear in patches rather than uniformly across the
    bed. Symptoms can mimic nutrient stress, but damaged roots with poor feeder growth are a key
    clue. Lab or microscope confirmation is best, but root injury patterns strongly indicate
    nematode pressure.
  control_methods:
    biological_controls: >-
      Pasteuria penetrans is a bacterial parasite of reniform nematodes that
      attaches to nematode cuticle and prevents reproduction — it builds up
      naturally in infested soil over years and is available commercially in
      some regions. Purpureocillium lilacinum (formerly Paecilomyces) is a
      fungus that parasitizes nematode eggs and is available as a biological
      nematicide. French marigolds (Tagetes patula specifically, not T. erecta)
      planted densely as a cover crop for a full season suppress reniform nematode
      populations significantly — the roots exude nematicidal compounds.
    preventive_methods: >-
      Reniform nematodes are microscopic and move in water, on tools, and on
      transplant roots. Infected plants show no distinctive above-ground symptoms
      initially — just generalized stunting, yellowing, and poor response to
      fertilizer and water. By the time symptoms are obvious the population is
      established. Test soil before planting in new areas. Never move soil from
      infested fields on boots, tools, or equipment. Use certified nematode-free
      transplants. Reniform nematodes build up fastest in warm, moist, sandy soils.
    cultural_practices: >-
      Long rotations with non-host or poor-host crops are the most practical
      management tool — sorghum-sudangrass hybrids grown as biofumigant cover
      crops and incorporated while still green significantly reduce nematode
      populations. Organic matter additions feed the soil food web including
      predatory nematodes and fungi that attack plant-parasitic nematodes.
      Summer fallow with repeated tillage desiccates eggs in the top soil
      layer where temperatures are highest. Avoid moving infested subsoil
      between beds.
    mechanical_physical: >-
      Soil solarization with clear plastic over moist soil for 6-8 weeks in
      summer reduces reniform nematode populations in the top 12 inches — most
      effective in Florida and Gulf Coast states where solar gain is highest.
      Steam treatment of propagation beds eliminates nematodes before planting.
      Deep tillage in late summer exposes eggs and juvenile nematodes to
      desiccation and temperature extremes.
    organic_sprays: >-
      Neem cake (the byproduct of neem oil pressing) worked into soil at 200-400
      lbs per acre has documented nematicidal activity — it releases compounds
      that suppress nematode egg hatching and juvenile mobility. Mustard seed
      meal incorporated into soil releases glucosinolates with fumigant activity
      against nematodes. Neither is an instant fix — effects build over multiple
      applications and seasons. Pasteurized compost topdressings support competitive
      microbial communities that suppress nematode populations over time.
  natural_enemies:
  - Pasteuria spp.
  - Purpureocillium lilacinum
  - Predatory Nematodes
