---
- name: Reniform Nematode
  slug: reniform-nematode
  picture: reniform_nematode.jpg
  scientific_name: Rotylenchulus reniformis
  description: Semi-endoparasitic nematode that embeds its front half in cotton, soybean, and vegetable roots while the swollen
    rear stays outside—causing stunting, nutrient deficiency symptoms, and yield loss in warm sandy soils.
  characteristics: Females are kidney-shaped on roots; eggs in gelatinous masses; damage combines with Fusarium wilt complexes
    on cotton. Soil assays quantify eggs per gram before you commit cash crops.
  control_methods:
    organic_sprays: Neem cake and mustard seed meal soil amendments show nematicidal activity in trials; pasteurized compost
      topdressings support competitive microbiomes—not instant fixes.
    biological_controls: Pasteuria spp. and Purpureocillium lilacinum (Paecilomyces) products; cover crops of marigold (Tagetes
      patula) and certain sorghum-sudangrass biofumigant cycles.
    cultural_practices: Long rotations with poor hosts; summer fallow with tillage timed to desiccate eggs where erosion risk
      allows; organic matter to feed antagonists; avoid moving infested subsoil on equipment.
    mechanical_physical: Solarization of beds; steam treatment of propagation mix.
    preventive_methods: Test fields before lease; clean boots and blades between blocks; use nematode-free transplants.
  natural_enemies:
  - Pasteuria spp.
  - Purpureocillium lilacinum
  - Predatory Nematodes
