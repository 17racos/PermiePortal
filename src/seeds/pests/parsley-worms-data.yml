---
- name: Parsley Worms
  slug: parsley-worms
  picture: parsley_worms.jpg
  scientific_name: Depressaria sp.
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, parsley worms may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Regularly inspect parsley plants for eggs and early larval signs. Remove any egg clusters and maintain
      plant health through optimal watering and fertilization.
    biological_controls: Encourage natural enemies such as parasitic wasps, birds, and predatory insects that target caterpillars.
    cultural_practices: Practice intercropping with repellent species and ensure adequate spacing to reduce humidity and deter
      moth oviposition.
    mechanical_physical: Hand-pick caterpillars from affected plants and consider the use of floating row covers to block
      adult moths from laying eggs.
    organic_sprays: Use Bacillus thuringiensis (Bt) or neem oil as an organic spray during early infestation to control larval
      populations.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Insects
