---
- name: Gall Mite
  slug: gall-mite
  picture: gall_mite.jpg
  scientific_name: Eriophyidae
  description: Microscopic eriophyid mites that hijack plant cells to build erineum, finger galls, or bigleaf blisters—often
    on maples, grapes, or buds you swore were healthy yesterday. You will need a hand lens or patience to see the mites; the
    distorted tissue advertises their presence.
  characteristics: Worm-like two-legged mites (four legs total) compared to spider mites; feeding induces felty patches, pouch
    galls, or witches’-broom growth. Populations explode on succulent new growth and can vector some viruses in certain crops.
  control_methods:
    organic_sprays: Horticultural oil or neem during dormant or pre-bud stages on deciduous hosts; summer oils at low rates
      on tolerant species—always check phytotoxicity on small test shoots first.
    biological_controls: Predatory mites (e.g., Amblyseius spp.), minute pirate bugs, and lacewing larvae consume eriophyids
      where they can reach them inside galls.
    cultural_practices: Prune out heavily galled shoots and destroy them; avoid over-fertilizing with quick-release nitrogen
      that pushes soft growth; diversify understory to harbor generalist predators.
    mechanical_physical: Power wash erineum from grape leaves early season to set populations back; remove isolated galled
      branches before mites spread.
    preventive_methods: Inspect nursery stock; avoid moving infected scion wood; monitor bud break on known hosts.
  natural_enemies:
  - Predatory Mites (Phytoseiidae)
  - Minute Pirate Bugs
  - Lacewings
