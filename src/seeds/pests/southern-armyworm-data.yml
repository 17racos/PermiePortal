---
- name: Southern Armyworm
  slug: southern-armyworm
  picture: southern_armyworm.jpg
  scientific_name: Spodoptera eridania
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, southern armyworm may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt products on young larvae; spinosad or neem for later instars when coverage is thorough.
    biological_controls: Parasitic wasps and flies, plus ground beetles—foster diversity along field margins.
    cultural_practices: Till or incorporate weeds before larvae large-march; synchronize planting to outrun local peaks where
      historical data exist.
    mechanical_physical: Ditches or barriers are marginal for flyers; hand collection on small plots at dusk.
    preventive_methods: Monitor with blacklight or sweep nets; watch weedy margins as sources.
  natural_enemies:
  - Braconid wasps
  - Tachinid flies
  - Ground beetles
