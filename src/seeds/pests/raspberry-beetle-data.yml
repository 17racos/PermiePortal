---
- name: Raspberry Beetle
  slug: raspberry-beetle
  picture: raspberry_beetle.webp
  scientific_name: Glischrochilus sanguinolentus
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, raspberry beetle may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain orchard hygiene and monitor fruit for early signs of beetle activity; ensure optimal plant
      nutrition to reduce stress.
    biological_controls: Encourage natural predators such as birds, parasitic wasps, and predatory beetles that target both
      larvae and adults.
    cultural_practices: Practice proper pruning and thinning to improve air circulation and reduce habitat for beetles.
    mechanical_physical: Deploy sticky traps and hand-pick beetles during peak activity to lower populations.
    organic_sprays: Apply neem oil or insecticidal soap at the onset of infestation to deter feeding without affecting beneficial
      organisms.
  natural_enemies:
  - Birds
  - Parasitic Wasps
  - Predatory Beetles
