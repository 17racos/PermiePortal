---
- name: Pear Psylla
  slug: pear-psylla
  picture: pear_psylla.jpg
  scientific_name: Cacopsylla pyricola
  description: Pear Psylla are tiny, sap-sucking insects that infest pear trees, causing leaf yellowing, curling, and the
    secretion of sticky honeydew that can promote sooty mold.
  characteristics: These insects are less than 2 mm long, with a mottled appearance. Their piercing-sucking mouthparts leave
    behind characteristic stippling on leaves and can lead to reduced fruit quality over time.
  control_methods:
    preventive_methods: Maintain orchard hygiene and balanced fertilization to keep trees vigorous; monitor regularly for
      early infestations.
    biological_controls: Encourage predators like ladybugs, lacewings, and parasitic wasps that feed on psylla.
    cultural_practices: Remove heavily infested leaves and practice crop rotation to minimize population buildup.
    mechanical_physical: Deploy sticky traps and use targeted pruning to reduce psylla habitats.
    organic_sprays: Apply insecticidal soap or neem oil during early infestation to deter feeding.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
