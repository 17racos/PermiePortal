---
- name: Citrus Root Weevil
  slug: citrus-root-weevil
  picture: citrus_root_weevil.jpg
  scientific_name: Pachnaeus litus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    citrus root weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Heterorhabditis bacteriophora, Steinernema riobrave) applied under irrigation
      target soil larvae; molasses-based bait sprays plus pathogens are used in some organic citrus programs—follow local
      guidance.
    biological_controls: Ants and ground beetles scavenge eggs and young larvae; fungal epizootics after wet cycles.
    cultural_practices: Maintain mulch depth that favors nematodes but avoid trunk contact; remove excessive weed hosts; proper
      irrigation to limit stressed, attractive flush.
    mechanical_physical: Shake adults onto sheets for manual removal on small trees; band trunks with sticky barriers where
      ants are not protected species of concern.
    preventive_methods: Inspect nursery stock; monitor notching on new flush; coordinate with biological control releases
      in groves.
  natural_enemies:
  - Heterorhabditis bacteriophora
  - Steinernema riobrave
  - Ground beetles
