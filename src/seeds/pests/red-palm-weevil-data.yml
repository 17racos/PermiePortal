---
- name: Red Palm Weevil
  slug: red-palm-weevil
  picture: red_palm_weevil.jpg
  scientific_name: Rhynchophorus ferrugineus
  description: A giant red-brown palm borer invasive in many palm-growing regions; larvae hollow the apical meristem until
    the crown folds like a failed umbrella. Pheromone trapping is central to area-wide programs.
  characteristics: Adults are rusty red with an elongated snout; larvae are legless grubs packed in frass-filled galleries.
    Often first detected by oozing holes and chewed fibers at crown base.
  control_methods:
    organic_sprays: Beauveria bassiana and Metarhizium applied as crown drenches or sprays in repeated campaigns; chitosan
      and other biofilm disruptors show promise in trials—pair with sanitation.
    biological_controls: Egg parasitoids (e.g., hymenopteran specialists) used in classical programs overseas; woodpeckers
      and ants incidentally reduce life stages.
    cultural_practices: Remove and destroy infested palms; avoid leaving cut stumps as brood sites; quarantine nursery material
      from infested regions.
    mechanical_physical: Pheromone trapping for male mass capture; acoustic probes to locate active larvae before crown failure.
    preventive_methods: Strict palm quarantine and inspection; public reporting of suspect palms; zero tolerance for off-movement
      of untreated chips.
  natural_enemies:
  - Scelionid egg parasitoids
  - Beauveria bassiana
  - Metarhizium spp.
