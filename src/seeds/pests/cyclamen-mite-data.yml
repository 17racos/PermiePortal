---
- name: Cyclamen Mite
  slug: cyclamen-mite
  picture: cyclamen_mite.jpg
  scientific_name: Steneotarsonemus pallidus
  description: Translucent tarsonemid that hides in folded young leaves and buds of strawberries, geraniums, African violets,
    and peppers, causing severe stunting and crinkling. Infestations spread on hands, clothing, and propagation cuttings.
  characteristics: Too small for most hand lenses; look for 'toadskin' texture on strawberry leaves or deformed flowers. Unlike
    aphids, there is no honeydew—just progressive distortion of meristems.
  control_methods:
    organic_sprays: Sulfur dusts or sprays, insecticidal soap, or horticultural oil on ornamentals where labeled—strawberries
      need label care; repeat to catch emerging generations.
    biological_controls: Amblyseius californicus and Neoseiulus cucumeris can suppress in enclosed production if introduced
      before damage peaks.
    cultural_practices: Hot-water treatment of strawberry crowns at certified temperatures for commercial stock; discard hopelessly
      twisted plants rather than nursing vectors.
    mechanical_physical: Isolate infested benches; avoid working wet plants that stick mites to tools.
    preventive_methods: Buy certified plants; work from clean to dirty blocks; dip pruners in alcohol between varieties.
  natural_enemies:
  - Neoseiulus cucumeris
  - Amblyseius californicus
  - Minute Pirate Bugs
