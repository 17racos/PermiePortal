---
- name: Aphids
  slug: aphids
  picture: aphids.jpg
  scientific_name: Aphidoidea
  description: Aphids are small, soft-bodied insects that come in various colors such as green, black, yellow, or pink. They
    are typically found on the undersides of leaves or on new plant growth and feed on plant sap, which can weaken plants
    and cause leaves to curl or yellow.
  characteristics: Aphids have pear-shaped bodies and are often less than 1/8 inch long. They possess long, slender mouthparts
    designed for piercing plant tissue and sucking sap. Some species have wings, which they use for migration, and they excrete
    a sticky substance called honeydew that can attract ants and promote sooty mold growth.
  control_methods:
    preventive_methods: Adopt preventive measures by ensuring optimal plant health through balanced watering and fertilization,
      along with regular inspections to catch infestations early. Set clear thresholds for intervention before populations
      become problematic.
    biological_controls: Encourage natural predators such as ladybugs, lacewings, parasitic wasps, hoverfly larvae, and predatory
      beetles to help keep aphid populations in check.
    cultural_practices: Utilize companion planting with species like garlic, chives, or marigolds to naturally repel aphids.
      Incorporate crop rotation and diverse planting to interrupt the aphid life cycle and reduce habitat suitability.
    mechanical_physical: Use a strong jet of water to physically dislodge aphids from plants, and consider hand-picking for
      smaller infestations.
    organic_sprays: Apply organic treatments like neem oil, insecticidal soap, or a diluted solution of water with a few drops
      of dish soap. These remedies target aphids without harming beneficial insects.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
  - Hoverfly Larvae
  - Predatory Beetles
