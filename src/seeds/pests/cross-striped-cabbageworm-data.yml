---
- name: Cross-striped Cabbageworm
  slug: cross-striped-cabbageworm
  picture: cross_striped_cabbageworm.jpg
  scientific_name: Evergestis rimosalis
  description: A crambid caterpillar that feeds on brassica leaves and buds, named for bold black cross-stripes on a gray-green
    body—easy to separate from imported cabbageworm and diamondback larvae with a glance.
  characteristics: Young larvae mine; older stages chew large holes and may web frass. Adult is a yellowish moth with brown
    markings. Two or more generations where summers are long.
  control_methods:
    organic_sprays: Bt kurstaki on small caterpillars; spinosad if populations spike—cover inner leaves thoroughly.
    biological_controls: Generalist parasitoids and predators in diverse systems; avoid wiping border vegetation unnecessarily.
    cultural_practices: Crop rotation among families; destroy brassica stumps after harvest; manage wild mustard reservoirs.
    mechanical_physical: Row covers; night collection on smaller plots.
    preventive_methods: Scout seedlings for mines and window feeding; watch first heads for hidden larvae.
  natural_enemies:
  - Ichneumonid wasps
  - Braconid wasps
  - Predatory beetles
