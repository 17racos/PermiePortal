---
- name: Onion Fly
  slug: onion-fly
  picture: onion_fly.jpg
  scientific_name: Delia antiqua
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, onion fly may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Spinosad or neem directed at the base of plants during egg-laying windows; insecticidal soap has limited
      reach—focus on soil line and repeat after heavy rain per label.
    biological_controls: Encourage rove beetles, ground beetles, and parasitic wasps (e.g., Aphaereta species) that attack
      fly pupae in soil; Steinernema feltiae nematodes against larvae in moist soil.
    cultural_practices: Rotate alliums on at least a three-year cycle; delay planting until soils warm slightly to shorten
      vulnerable seedling stage; interplant carrots or other masking crops; destroy culls and bolting onions that attract
      flies.
    mechanical_physical: Floating row cover sealed at edges excludes egg-laying females; fine mesh over seedbeds until plants
      size up.
    preventive_methods: Avoid fresh manure before allium beds; use clean sets and transplants; scout for eggs at soil cracks
      near plants.
  natural_enemies:
  - Parasitic Wasps (Braconidae)
  - Rove Beetles (Staphylinidae)
  - Ground Beetles (Carabidae)
  - Entomopathogenic Nematodes
