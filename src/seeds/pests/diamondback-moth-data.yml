---
- name: Diamondback Moth
  slug: diamondback-moth
  picture: diamondback_moth.jpg
  scientific_name: Plutella xylostella
  description: A tiny moth whose larvae mine and window-feed brassica leaves, buds, and heads; infamous for evolving resistance
    to anything you lean on too hard—rotate modes and lean on biology first.
  characteristics: Adults are slender gray moths with a cream band that forms diamonds when wings fold; larvae are tapered
    green caterpillars that wriggle violently when touched. Many generations per year in warm weather.
  control_methods:
    organic_sprays: Bt aizawai or kurstaki on small larvae; spinosad as a rotated option; neem and soaps suppress light infestations—never
      rely on a single material all season.
    biological_controls: Diadegma insulare and other ichneumonids, Microplitis plutellae, and predatory bugs—preserve with
      selective spot sprays.
    cultural_practices: Destroy crop residues promptly; avoid overlapping brassica plantings; use trap crops on plot edges.
    mechanical_physical: Row covers until heads form; vacuums have niche use in high tunnels.
    preventive_methods: Pheromone traps for timing; scout for shot-holed cotyledons.
  natural_enemies:
  - Diadegma insulare
  - Microplitis plutellae
  - Minute pirate bugs
