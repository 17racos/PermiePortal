---
- name: Diamondback Moth
  slug: diamondback-moth
  picture: diamondback_moth.jpg
  scientific_name: Plutella xylostella
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, diamondback moth may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Bt aizawai or kurstaki on small larvae; spinosad as a rotated option; neem and soaps suppress light infestations—never
      rely on a single material all season.
    biological_controls: Diadegma insulare and other ichneumonids, Microplitis plutellae, and predatory bugs—preserve with
      selective spot sprays.
    cultural_practices: Destroy crop residues promptly; avoid overlapping brassica plantings; use trap crops on plot edges.
    mechanical_physical: Row covers until heads form; vacuums have niche use in high tunnels.
    preventive_methods: Pheromone traps for timing; scout for shot-holed cotyledons.
  natural_enemies:
  - Diadegma insulare
  - Microplitis plutellae
  - Minute pirate bugs
