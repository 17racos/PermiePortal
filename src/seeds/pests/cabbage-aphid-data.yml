---
- name: Cabbage Aphid
  slug: cabbage-aphid
  picture: cabbage_aphid.jpg
  scientific_name: Brevicoryne brassicae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, cabbage aphid may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil penetrates wax best with firm water pressure pre-rinse and thorough
      spray to hearts; repeat on a short interval while new colonies appear. Neem reduces feeding on open-leaf types. Avoid
      spraying open brassica flowers visited by pollinators; treat inner leaves with directed nozzles where possible.
    biological_controls: Parasitic wasps including Diaeretiella rapae lay eggs inside aphids, forming bronze mummies; syrphid
      larvae and lady beetles clean exposed colonies. Release or conserve lacewings in tunnels. Skip soaps the day beneficial
      eggs are abundant on leaves.
    cultural_practices: Use floating row cover on transplants until plants outgrow cover or temperatures demand removal. Remove
      old brassica residues promptly—volunteer mustards bridge seasons. Blend flowering insectary rows on farm edges to feed
      parasitoids through summer.
    mechanical_physical: Direct a strong jet into leaf axils on savoy and open kale types every few days for organic market
      gardens. For small heads, peel and submerge outer leaves in cold salt or soap water as a last-step wash protocol, not
      a field cure.
    preventive_methods: Scout the growing point weekly, especially downwind of fall brassica debris. Flag tunnels that ran
      hot on cabbage aphid last cycle for earlier biocontrol releases. Rotate brassica blocks with non-host families to avoid
      overlapping generations on adjacent fields.
