---
- name: Slugs
  slug: slugs
  picture: slugs.jpg
  scientific_name: Gastropoda
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, slugs may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Keep the garden free of debris and provide proper drainage to reduce moist conditions that attract
      slugs.
    biological_controls: 'Promote natural predators such as ground beetles, birds, frogs, and toads that feed on slugs. Pro
      Tip: If possible use ducks as a control'
    cultural_practices: Utilize companion planting with repellent species like garlic and chives, and reduce dense ground
      cover that offers shelter for slugs.
    mechanical_physical: Hand-pick slugs in the evening, use copper barriers around garden beds, and set beer traps to lure
      and drown them.
    organic_sprays: Apply organic deterrents like diatomaceous earth or homemade garlic and hot pepper sprays to discourage
      slug activity.
  natural_enemies:
  - Ground Beetles
  - Birds
  - Frogs
  - Toads
