---
- name: Slugs
  slug: slugs
  picture: slugs.jpg
  scientific_name: Gastropoda
  description: Slugs are soft-bodied, shell-less mollusks that feed on plant tissues, leaving behind slimy trails and irregular
    feeding damage. They are most active in damp, cool conditions.
  characteristics: Slugs have elongated, slimy bodies without a protective shell. Their feeding results in irregular holes
    in leaves, and they can quickly defoliate vulnerable plants.
  control_methods:
    preventive_methods: Keep the garden free of debris and provide proper drainage to reduce moist conditions that attract
      slugs.
    biological_controls: 'Promote natural predators such as ground beetles, birds, frogs, and toads that feed on slugs. Pro
      Tip: If possible use ducks as a control'
    cultural_practices: Utilize companion planting with repellent species like garlic and chives, and reduce dense ground
      cover that offers shelter for slugs.
    mechanical_physical: Hand-pick slugs in the evening, use copper barriers around garden beds, and set beer traps to lure
      and drown them.
    organic_sprays: Apply organic deterrents like diatomaceous earth or homemade garlic and hot pepper sprays to discourage
      slug activity.
  natural_enemies:
  - Ground Beetles
  - Birds
  - Frogs
  - Toads
