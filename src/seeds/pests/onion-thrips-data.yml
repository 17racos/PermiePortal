---
- name: Onion Thrips
  slug: onion-thrips
  picture: onion_thrips.webp
  scientific_name: Thrips tabaci
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, onion thrips may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain optimal plant health with correct watering and balanced fertilization, and inspect crops
      regularly for early signs of infestation.
    biological_controls: Introduce beneficial predators such as minute pirate bugs, lacewings, and parasitic wasps to naturally
      suppress thrip populations.
    cultural_practices: Practice crop rotation, remove crop residues that may harbor thrips, and use reflective mulches to
      deter their movement.
    mechanical_physical: Deploy sticky traps and fine netting to protect plants during vulnerable growth stages.
    organic_sprays: Apply insecticidal soap, neem oil, or horticultural oils during peak activity to control their numbers.
  natural_enemies:
  - Minute Pirate Bugs
  - Lacewings
  - Parasitic Wasps
