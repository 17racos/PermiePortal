---
- name: Late Blight
  slug: late-blight
  picture: late_blight.jpg
  scientific_name: Phytophthora infestans
  description: The oomycete that helped rewrite Irish history—still demolishes tomatoes and potatoes when cool nights, warm
    days, and leaf wetness align. Water-soaked spots turn brown from the edges inward; white sporulation shows on leaf undersides
    in humid mornings.
  characteristics: Fuzzy pathogen growth on abaxial surfaces; stems show dark lesions; fruit and tubers rot firm then fuzzy
    secondary chaos. Spores blow miles on storms, so your neighbor’s neglect becomes your emergency.
  control_methods:
    organic_sprays: Copper fungicides on a tight protectant schedule; some regions allow additional biologicals—reapply after
      rain. No organic silver bullet once epidemics explode; removal beats denial.
    biological_controls: Compost teas and microbial antagonists are backup singers only; hyperparasites exist in soil but
      do not rescue foliage under invasion pressure.
    cultural_practices: Choose resistant cultivars where available; widen row spacing; trellis tomatoes for airflow; avoid
      overhead water; destroy infected plants in sealed bags—not the compost pile.
    mechanical_physical: Upland tomatoes under high tunnels with leaf dryness protocols; rogue hot spots immediately.
    preventive_methods: Use certified seed potatoes; eliminate cull piles and volunteer solanums; track regional disease maps
      and start copper before wet spells if history is bad.
  natural_enemies:
  - Hyperparasitic Fungi (soil-borne, limited foliar effect)
  - Competitive Microbes in Mulch Systems
