---
- name: Tent Caterpillar
  slug: tent-caterpillar
  picture: tent_caterpillar.jpg
  scientific_name: Malacosoma spp.
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, tent caterpillar may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki on small larvae feeding outside tight silk gives strong control with low
      non-target risk. Neem or spinosad follows labeled hosts where Bt is insufficient on late instars. Spot applications
      to tents and adjacent foliage beat whole-forest sprays.
    biological_controls: Tachinid flies and ichneumonid wasps parasitize larvae; cuckoos and other birds rip colonies apart.
      Leaving low-level tents on wild hosts can reservoir parasitoids that later help orchards—balance aesthetics with biocontrol
      banking on diversified farms.
    cultural_practices: Prune winter egg masses on young trees during dormancy. Avoid planting single-species windbreaks of
      highly favored hosts without planning for cyclical outbreaks. Accept light defoliation on mature shade trees when safety
      is not an issue.
    mechanical_physical: Remove tents on reachable limbs into soapy water in early morning when larvae cluster inside. For
      high-value nursery stock, this hand work is cheaper than repeat sprays.
    preventive_methods: Map tents each spring; some fence lines predictably reignite. Walk orchards during bloom lull to catch
      colonies while larvae are still small for Bt.
