---
- name: Tent Caterpillar
  slug: tent-caterpillar
  picture: tent_caterpillar.jpg
  scientific_name: Malacosoma spp.
  description: Social caterpillars in the genus Malacosoma that spin silk tents in branch forks (western and eastern types)
    or march in groups on forest and fruit trees (forest tent caterpillar habits differ but managers lump them at the
    roadside). Larvae strip leaves in spring and early summer; healthy trees usually releaf, but young stock and drought-
    stressed trees suffer more. Species mix shifts by latitude and coast—collectively these caterpillars matter across
    temperate North America into Mexican highlands and similar zones roughly 3–9 wherever rosaceous hosts, oaks, and
    aspens dominate hedgerows, orchards, and shelterbelts.
  characteristics: Adults are chunky, furry moths; larvae carry distinctive pattern sets—eastern tent shows a gold dorsal
    stripe with blue spots, western tent larvae bear dotted sides, forest tent has keyhole-shaped dorsal markings and does
    not build a classic tent. Winter egg bands encircle twigs like varnished collars. Match your local extension photos
    because treatment timing aligns with larval size, not common name arguments.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki on small larvae feeding outside tight silk gives strong control with
      low non-target risk. Neem or spinosad follows labeled hosts where Bt is insufficient on late instars. Spot applications
      to tents and adjacent foliage beat whole-forest sprays.
    biological_controls: Tachinid flies and ichneumonid wasps parasitize larvae; cuckoos and other birds rip colonies apart.
      Leaving low-level tents on wild hosts can reservoir parasitoids that later help orchards—balance aesthetics with
      biocontrol banking on diversified farms.
    cultural_practices: Prune winter egg masses on young trees during dormancy. Avoid planting single-species windbreaks
      of highly favored hosts without planning for cyclical outbreaks. Accept light defoliation on mature shade trees when
      safety is not an issue.
    mechanical_physical: Remove tents on reachable limbs into soapy water in early morning when larvae cluster inside. For
      high-value nursery stock, this hand work is cheaper than repeat sprays.
    preventive_methods: Map tents each spring; some fence lines predictably reignite. Walk orchards during bloom lull to
      catch colonies while larvae are still small for Bt.
  natural_enemies:
  - Tachinid Flies (Tachinidae)
  - Ichneumonid Wasps
  - Braconid Wasps
  - Insectivorous Birds
