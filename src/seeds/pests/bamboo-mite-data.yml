---
- name: Bamboo Mite
  slug: bamboo-mite
  picture: bamboo_mite.webp
  scientific_name: Schizotetranychus longus
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, bamboo mite is a
    likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    organic_sprays: Horticultural oil or insecticidal soap with a surfactant—double-hit undersides of unfurling leaves; repeat
      on a short interval until humidity wins.
    biological_controls: Predatory mites (Phytoseiulus persimilis, Neoseiulus fallacis) establish in stable groves if sprays
      stay selective; minute pirate bugs join the buffet.
    cultural_practices: Rinse foliage during drought; avoid nitrogen dumps that push succulent growth mites love; thin interior
      culms for air movement.
    mechanical_physical: Hard water blast on portable clumps; wipe heavy infestations off specimen pots before predators arrive.
    preventive_methods: Quarantine new bamboo divisions; scout the sheath fold—early mites are cheaper than late ones.
  natural_enemies:
  - Predatory Mites (Phytoseiidae)
  - Minute Pirate Bugs
