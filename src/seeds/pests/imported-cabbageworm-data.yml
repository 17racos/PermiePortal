---
- name: Imported Cabbageworm
  slug: imported-cabbageworm
  picture: imported_cabbageworm.jpg
  scientific_name: Pieris rapae
  description: The green caterpillar of the small white butterfly that drills holes in cabbage, kale, and nasturtium leaves
    and fouls heads with frass. Butterflies look innocent; your brassicas disagree.
  characteristics: Velvety green larva with faint yellow stripe along each side; adult is white with charcoal forewing tips
    (female has two spots). Caterpillars often feed openly in canopy interior.
  control_methods:
    organic_sprays: Bt kurstaki while larvae are small; spinosad for stubborn instars—hit undersides where eggs hatch.
    biological_controls: Cotesia glomerata and other parasitic wasps frequently collapse outbreaks—mark parasitized 'mummies'
      and leave them.
    cultural_practices: Red undersurface varieties slightly reduce oviposition; till residues; time plantings between flights
      if monitored.
    mechanical_physical: Floating row covers exclude adults; hand smash eggs and larvae in gardens.
    preventive_methods: Yellow sticky traps catch some adults; scout for netting damage on leaves.
  natural_enemies:
  - Cotesia glomerata
  - Cotesia rubecula
  - Birds
