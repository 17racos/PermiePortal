---
- name: Imported Cabbageworm
  slug: imported-cabbageworm
  picture: imported_cabbageworm.jpg
  scientific_name: Pieris rapae
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, imported cabbageworm may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt kurstaki while larvae are small; spinosad for stubborn instars—hit undersides where eggs hatch.
    biological_controls: Cotesia glomerata and other parasitic wasps frequently collapse outbreaks—mark parasitized 'mummies'
      and leave them.
    cultural_practices: Red undersurface varieties slightly reduce oviposition; till residues; time plantings between flights
      if monitored.
    mechanical_physical: Floating row covers exclude adults; hand smash eggs and larvae in gardens.
    preventive_methods: Yellow sticky traps catch some adults; scout for netting damage on leaves.
  natural_enemies:
  - Cotesia glomerata
  - Cotesia rubecula
  - Birds
