---
- name: Texas Citrus Mite
  slug: texas-citrus-mite
  picture: texas_citrus_mite.jpg
  scientific_name: Eutetranychus banksi
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, texas citrus
    mite is a likely suspect. Mites are tiny but can multiply fast, especially during heat and
    dry air. Plants lose vigor as feeding drains cell contents from leaves and tender growth.
    Early action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    organic_sprays: Horticultural or narrow-range oils applied with thorough coverage; soap sprays for low populations on
      backyard trees.
    biological_controls: Predatory mites in the Phytoseiidae family and minute pirate bugs—conserve by delaying sprays until
      monitoring shows rising ratios of pest to predator.
    cultural_practices: Reduce dust; avoid nitrogen flushes that prolong tender leaf availability; do not alternate unrelated
      miticides that harm beneficials without cause.
    mechanical_physical: Water rinse of foliage on small specimens can lower numbers short term.
    preventive_methods: Regular scouting on interior canopy leaves where mites colonize first.
  natural_enemies:
  - Euseius spp.
  - Minute Pirate Bugs
  - Predatory Mites
