- name: "Azalea Caterpillar"
  slug: "azalea-caterpillar"
  picture: "azalea_caterpillar.webp"
  scientific_name: "Datana major"
  description: "Datana larvae gang-rush rhododendrons and azaleas in late summer—black bodies with broken yellow stripes and a habit of rearing both ends when disturbed like a confused inchworm committee. One colony can skeletonize a branch before your coffee cools."
  characteristics: "Early instars feed together in tight groups; later they spread. Yellow-and-black adults are nondescript hand-moth types you will never notice unless you are trapping lights."
  control_methods:
    organic_sprays: "Bt kurstaki while larvae are small and actively feeding—spray leaf undersides; spinosad as a backup if they are nearing full size (mind pollinator rules on blooming plants)."
    biological_controls: "Tachinid flies and ichneumonid wasps stitch up late instars; spiders and songbirds snack on stragglers."
    cultural_practices: "Accept minor nibbles on native plantings; on specimen shrubs, scout the interior canopy where clusters hide from polite society."
    mechanical_physical: "Clip infested terminals into a bucket of soapy water—fast, smug, and chemical-free."
    preventive_methods: "Walk lines in August; early removal of one cluster prevents headline defoliation."
  natural_enemies:
    - "Tachinid Flies"
    - "Ichneumonid Wasps"
    - "Spiders"
    - "Songbirds"
  # Image attribution: Plant Image Library / Wikimedia Commons / CC BY-SA 2.0
  # Image source: wikimedia
- name: "Bamboo Mite"
  slug: "bamboo-mite"
  picture: "bamboo_mite.webp"
  scientific_name: "Schizotetranychus longus"
  description: "Bamboo-specialist spider mites that turn culm sheaths and new shoots stippled and dusty—feeding hides on the pale inner side of unfolding leaves, so the plant looks mysteriously tired before you flip anything over."
  characteristics: "Fine silk, pale flecking, and bronzed patches along midribs; populations explode in hot, dry, dusty wind corridors—classic mite weather."
  control_methods:
    organic_sprays: "Horticultural oil or insecticidal soap with a surfactant—double-hit undersides of unfurling leaves; repeat on a short interval until humidity wins."
    biological_controls: "Predatory mites (Phytoseiulus persimilis, Neoseiulus fallacis) establish in stable groves if sprays stay selective; minute pirate bugs join the buffet."
    cultural_practices: "Rinse foliage during drought; avoid nitrogen dumps that push succulent growth mites love; thin interior culms for air movement."
    mechanical_physical: "Hard water blast on portable clumps; wipe heavy infestations off specimen pots before predators arrive."
    preventive_methods: "Quarantine new bamboo divisions; scout the sheath fold—early mites are cheaper than late ones."
  natural_enemies:
    - "Predatory Mites (Phytoseiidae)"
    - "Minute Pirate Bugs"
  # Image attribution: (c) Susan J. Hewitt, some rights reserved (CC BY-NC), uploaded by Susan J. Hewitt
  # Image source: inaturalist
- name: "Banana Weevil"
  slug: "banana-weevil"
  picture: "banana_weevil.webp"
  scientific_name: "Cosmopolites sordidus"
  description: "The banana corm borer—black weevils that tunnel galleries in rhizomes and pseudostems, weakening mats and inviting topple or snapped bunches. Grubs live in frass-packed tunnels; adults hide in leaf sheaths by day."
  characteristics: "Notched leaf margins from adult feeding, sawdust-like frass at the base, and mats that decline slowly until one storm flattens them. Trap catches spike after mulching or harvest disturbance."
  control_methods:
    organic_sprays: "Neem or pyrethrin drenches into pseudostem traps or cut stumps can knock down adults—rotate actives and respect label intervals; focus on breeding sites, not canopy fogging."
    biological_controls: "Beauveria bassiana formulations targeted to trap catches; ants and earwigs scavenge eggs in mulch; poultry scratch at bases where legal and practical."
    cultural_practices: "Clean harvest—split and remove old corms; solarize or hot-water treat sword suckers before replanting; puddle fields only where drainage otherwise invites rot."
    mechanical_physical: "Pseudostem traps (split stem baited with fermenting fruit or pheromone where available); chop and destroy infested material off-site."
    preventive_methods: "Use certified tissue-culture plants; isolate new mats; monitor with traps monthly—early numbers beat late mat collapse."
  natural_enemies:
    - "Ants"
    - "Earwigs"
    - "Ground Beetles"
  # Image attribution: Dirk Hölscher, Andreas Buerkert, Bernd Schneider / Wikimedia Commons / CC BY 4.0
  # Image source: wikimedia
- name: "Locust Borer"
  slug: "locust-borer"
  picture: "locust_borer.webp"
  scientific_name: "Megacyllene robiniae"
  description: "A longhorn beetle that uses black locust as a nursery—yellow-and-black adults mimic wasps on goldenrod in fall while larvae chew heartwood tunnels for years. Stressed street trees snap in ice loads; healthy thickets just host wildlife drama."
  characteristics: "Oval exit holes and coarse frass in bark crevices; crown dieback in heavily infested lollipop trees. Adults appear late summer through early autumn on flowers."
  control_methods:
    organic_sprays: "Sprays barely reach larvae—limit neem or pyrethrin to protecting high-value young trees when adults are mating on trunks, not as a forest-scale fantasy."
    biological_controls: "Woodpeckers excavate larvae; parasitoids attack smaller cerambycids but are not a silver bullet here—think habitat, not hero product."
    cultural_practices: "Avoid planting Robinia as a specimen where limb failure risks property; diversify street-tree palettes; prune deadwood that concentrates beetles."
    mechanical_physical: "Remove and chip badly infested trunks before emergence season; solarize small logs if local regulations allow."
    preventive_methods: "Do not wound trunks; keep trees vigorous with mulch—not volcano mulch—to reduce stress that favors reinvasion."
  natural_enemies:
    - "Woodpeckers"
    - "Parasitic Wasps (Cerambycidae associates)"
  # Image attribution: Lindemom1 / Wikimedia Commons / CC BY-SA 4.0
  # Image source: wikimedia
- name: "Locust Leaf Miner"
  slug: "locust-leaf-miner"
  picture: "locust_leaf_miner.webp"
  scientific_name: "Odontota dorsalis"
  description: "A small leaf beetle whose larvae blotch-mine black locust leaflets—brown windows that make the canopy look drought-struck even when soil is fine. Adults chew elongated holes before the real mining starts."
  characteristics: "Upper-surface mines with frass trapped inside; late-season leaves can look scorched. Beetles are dark with a pale stripe—easy to miss until damage scales up."
  control_methods:
    organic_sprays: "Neem or spinosad on new flush when adults first scar leaves—timing beats volume; oils can smother young larvae if coverage hits mines early."
    biological_controls: "Parasitic wasps attack leafminer larvae in other systems—preserve them by avoiding calendar sprays; songbirds pick adult beetles where canopies are low."
    cultural_practices: "Accept cosmetic damage on timber/wildlife plantings; do not confuse miner injury with herbicide drift—mines are bounded blotches."
    mechanical_physical: "Not practical on tall trees; shear nursery liners and destroy mined foliage if selling clean stock matters."
    preventive_methods: "Scout the first full leaf expansion after bloom—that is when adults RSVP."
  natural_enemies:
    - "Parasitic Wasps"
    - "Songbirds"
  # Image attribution: (c) Katja Schulz, some rights reserved (CC BY)
  # Image source: inaturalist
- name: "Leaf Spot"
  slug: "leaf-spot"
  picture: "leaf_spot.webp"
  scientific_name: "Multiple species (e.g., Cercospora, Septoria, Alternaria)"
  description: "A symptom, not a single villain—round to angular lesions with yellow halos, dark fruiting dots, or shot holes depending on which fungus or bacterium won the lottery on your leaves. Wet leaves plus spores equals a new pattern by morning."
  characteristics: "Spots start small, may merge, and often appear first on lower, older foliage after splashing rain or overhead love from the hose. Purely cosmetic until defoliation weakens the plant or opens sunscald."
  control_methods:
    organic_sprays: "Copper, sulfur, or potassium bicarbonate on a protectant schedule during wet spells; neem or Bacillus-based products as part of rotation—identify host to pick rate and interval."
    biological_controls: "Antagonistic microbes (Bacillus subtilis, Trichoderma products) colonize leaf surfaces; healthy phyllosphere communities outcompete sloppy pathogens when humidity is managed."
    cultural_practices: "Water at soil line, mulch to stop splash, widen spacing, prune for airflow, and choose resistant cultivars when breeders bothered to."
    mechanical_physical: "Strip and hot-compost or remove the bottom infected layer; sanitize tools between plants if bacterial spot is suspected."
    preventive_methods: "Avoid evening irrigation; scout after storms; destroy crop debris that overwinters Pseudocercosporella and friends."
  natural_enemies:
    - "Antagonistic Bacteria"
    - "Hyperparasitic Fungi"
  # Image attribution: Savina Jo / Wikimedia Commons / CC BY-SA 4.0
  # Image source: wikimedia
- name: "Heart Rot"
  slug: "heart-rot"
  picture: "heart_rot.webp"
  scientific_name: "Ganoderma zonatum (palms); other wood-decay basidiomycetes on trees"
  description: "Internal trunk or stem rot—often flagged by conks, sudden wilt, or a hollow thunk when you rap the wood. In palms, Ganoderma butt rot eats structural tissue while the canopy still waves hello; in broadleaf trees, many white-rot fungi play the same long game."
  characteristics: "Shelf fungi at the base, dark internal staining, frass from borers that follow weakness, or a spear leaf that pulls like bad teeth. Progress is months to years—denial is not a structural plan."
  control_methods:
    organic_sprays: "No spray fixes hollow wood—copper or phosphite tools sometimes support palm health debates, but removal of hazard trees is the honest organic move when load-bearing tissue is gone."
    biological_controls: "Competitive fungi like Trichoderma spp. are researched for wound protection—not a cure for advanced decay; keep expectations soil-level."
    cultural_practices: "Avoid trunk wounds from mowers, spikes, or lion-tailing palms; maintain drainage; do not pile soil or mulch against bark or palm boots."
    mechanical_physical: "Remove and replace hazard specimens; chip infested wood off-site; sterilize chains between cuts if moving between healthy and sick trees."
    preventive_methods: "Inspect bases after storms; never plant a new palm over old palm roots—Ganoderma persists in stumps and root pieces."
  natural_enemies:
    - "Competitive Saprotrophic Fungi"
    - "Trichoderma spp."
  # Image attribution: Plant pests and diseases / Wikimedia Commons / CC0
  # Image source: wikimedia
- name: "Cocoa Pod Borer"
  slug: "cocoa-pod-borer"
  picture: "cocoa_pod_borer.webp"
  scientific_name: "Conopomorpha cramerella"
  description: "A small moth whose larvae tunnel cocoa pods, stitch chambers with silk, and turn beans into fermenting regret. External entry is a tiny scar; inside is frass, webbing, and quality loss you cannot sort away."
  characteristics: "Multiple larvae per pod in heavy pressure; damaged pods ripen unevenly and harbor rot. Adults are twilight fliers—monitor with pheromone traps where programs exist."
  control_methods:
    organic_sprays: "Bt aizawai or spinosad timed to egg hatch—coverage must wet pod surface; neem rotations help in low-input blocks when labels allow export residue rules."
    biological_controls: "Trichogramma spp. releases for egg parasitism; ants (Azteca complexes in some agroforestry systems) reduce larval survival—context-specific but real."
    cultural_practices: "Black pod hygiene—remove mummies; shade management to slow borer activity windows; harvest ripe pods every two weeks so larvae do not graduate."
    mechanical_physical: "Pod stripping in outbreak zones; baited traps for monitoring, not miracle eradication."
    preventive_methods: "Synchronize farm sanitation; coordinate area-wide pheromone monitoring so neighbors are not breeding moths for your farm."
  natural_enemies:
    - "Trichogramma spp."
    - "Ants (species-dependent)"
  # Image attribution: (c) jniogret, some rights reserved (CC BY-NC)
  # Image source: inaturalist
- name: "Carrot Fly"
  slug: "carrot-fly"
  picture: "carrot_fly.webp"
  scientific_name: "Psila rosae"
  description: "The carrot rust fly—low-flying, weak-jumping flies whose maggots rasp tunnels in roots, parsley, parsnip, and celery family volunteers. Above ground the crop looks fine; below is a subway map of brown scarring and rot."
  characteristics: "Rust-colored pupae near crowns; larval streaks stained with frass; wilting in seedlings when tunnels sever the taproot. Second generations hit late plantings hardest."
  control_methods:
    organic_sprays: "Spinosad or neem drenches aimed at the soil surface during egg-lay windows—after thinning and after rain resets—rotate to preserve efficacy."
    biological_controls: "Ground beetles and rove beetles scavenge eggs; parasitic nematodes (Heterorhabditis/Steinernema) can suppress larvae in light soils when soil temps cooperate."
    cultural_practices: "Floating row cover sealed at edges; rotate Apiaceae blocks; delay planting to dodge peak flight; inter-row onions only help morale, not geometry—barrier fabric wins."
    mechanical_physical: "Fine mesh cages over beds; sticky cards at canopy height for monitoring, not control."
    preventive_methods: "Scout with traps in May–June (latitude-dependent); remove spent umbels that attract flies to seed fields."
  natural_enemies:
    - "Ground Beetles"
    - "Rove Beetles"
    - "Entomopathogenic Nematodes"
  # Image attribution: (c) Emanuele Santarelli, some rights reserved (CC BY-SA), uploaded by Emanuele Santarelli
  # Image source: inaturalist
- name: "Wireworm"
  slug: "wireworm"
  picture: "wireworm.webp"
  scientific_name: "Elateridae (larvae; e.g., Agriotes spp.)"
  description: "Click beetle larvae—shiny amber tubes that hollow out seeds, shred roots, and drill tubers like they paid rent. Damage shows as wilting transplants, missing stands, and potatoes that look shot."
  characteristics: "Live many years in soil; prefer cool, moist, grassy fields recently flipped to vegetables. Bait potato slices disappear overnight when populations are real."
  control_methods:
    organic_sprays: "Entomopathogenic nematodes (Steinernema feltiae/carpocapsae) in moist warm soil; spinosad on bait stations or seed treatments where labeled for organic production."
    biological_controls: "Ground beetles, spiders, and birds; fungal pathogens (Metarhizium, Beauveria) show variable field success—moisture is the gatekeeper."
    cultural_practices: "Summer fallow + frequent shallow tillage to desiccate larvae; delay planting until soil warms; convert weedy sod slowly—sudden plow is a wireworm invitation."
    mechanical_physical: "Flame or solarize seed beds in high tunnels; hand-sort transplants if only a few beds are infested."
    preventive_methods: "Soil bioassay with wheat germination or potato baits before committing the heirloom tomatoes."
  natural_enemies:
    - "Ground Beetles"
    - "Entomopathogenic Nematodes"
    - "Birds"
  # Image attribution: (c) Denis Doucet, some rights reserved (CC BY-NC), uploaded by Denis Doucet
  # Image source: inaturalist
- name: "Cassava Mealybug"
  slug: "cassava-mealybug"
  picture: "cassava_mealybug.webp"
  scientific_name: "Phenacoccus manihoti"
  description: "Pale wax-coated mealybugs that cluster shoot tips and undersides, sucking sap until cassava yellows, stunts, and drops leaves like a bad joke. Famous outbreak species in Africa; related Phenacoccus taxa occur in the Americas—scout, do not assume passport."
  characteristics: "White flocculent colonies, ant attendance, and deformed young leaves; sooty mold follows honeydew. Dry seasons let populations ride thermals across fields."
  control_methods:
    organic_sprays: "Horticultural oil or soap penetrates wax—repeat twice weekly until crawlers slow; neem suppresses feeding but needs thorough coverage."
    biological_controls: "Anagyrus lopezi and other encyrtid parasitoids are classical heroes where established; lady beetles, lacewings, and syrphid larvae finish stragglers—never torch the hedgerow."
    cultural_practices: "Clean planting material; intercrop with repellent or banker plants that shelter predators; rogue heavily infested stems early."
    mechanical_physical: "Pressure-wash nursery stock; prune tip infestations into soapy buckets."
    preventive_methods: "Quarantine new cuttings; monitor shoot tips after transport—mealybugs travel like tourists with luggage."
  natural_enemies:
    - "Anagyrus lopezi"
    - "Lady Beetles"
    - "Lacewings"
  # Image attribution: (c) Erik Delaquis, some rights reserved (CC BY-NC), uploaded by Erik Delaquis
  # Image source: inaturalist
- name: "Cassava Green Mite"
  slug: "cassava-green-mite"
  picture: "broad_mite.webp"
  scientific_name: "Mononychellus tanajoa"
  description: "Tiny green spider mites that stipple cassava leaves from the bottom up, bronzing canopies during dry weather when plants cannot sweat out the insult. Populations spike where drought meets dust."
  characteristics: "Fine speckling, leaf roll, and early defoliation; silk is sparse compared to tetranychids but injury pattern rhymes. Mites hide on lower leaf surfaces."
  control_methods:
    organic_sprays: "Sulfur or horticultural oil where temperature labels allow; insecticidal soap with thorough underside coverage—three passes beat one heroic soak."
    biological_controls: "Typhlodromalus aripo and other phytoseiids are introduced/banker predators in programs abroad; minute pirate bugs and staphylinids contribute locally."
    cultural_practices: "Irrigate to raise humidity in nurseries; avoid excessive nitrogen that pushes succulent growth; plant windbreaks to cut dust."
    mechanical_physical: "Overhead rinse in early morning on small plots—cheap humidity bump."
    preventive_methods: "Scout the third leaf from the shoot apex—early mites are cheaper than naked stems."
  natural_enemies:
    - "Typhlodromalus aripo"
    - "Minute Pirate Bugs"
  # Image attribution: No image found
  # Image source: none
- name: "Pea Moth"
  slug: "pea-moth"
  picture: "pea_moth.webp"
  scientific_name: "Cydia nigricana"
  description: "A small tortricid whose caterpillars live inside pea pods, eating seeds and leaving frass that ruins shelling day. You notice the moth never—you find the crime at the kitchen bowl."
  characteristics: "Single creamy larva per pod usually; tiny entry hole near calyx or suture. Flight peaks tie to degree-days; pheromone traps catch males for timing, not mass murder."
  control_methods:
    organic_sprays: "Bt kurstaki or spinosad during egg hatch—must contact fresh pods; repeat after rain; evening sprays spare some daytime flyers."
    biological_controls: "Trichogramma releases target eggs in research and specialty fields; generalist parasitoids help at margins—preserve flowering strips."
    cultural_practices: "Early-maturing cultivars escape late flights; destroy crop residues; wide rotation away from Vicia/Pisum neighbors."
    mechanical_physical: "Floating row cover until flowering—remove for pollination if needed, then accept some loss or hand-pollinate tunnels."
    preventive_methods: "Trap thresholds vary by region—learn your local biofix instead of guessing from a meme chart."
  natural_enemies:
    - "Trichogramma spp."
    - "Braconid Wasps"
  # Image attribution: (c) Greg Wood, some rights reserved (CC BY-NC), uploaded by Greg Wood
  # Image source: inaturalist
- name: "Onion Maggot"
  slug: "onion-maggot"
  picture: "onion_maggot.webp"
  scientific_name: "Delia antiqua"
  description: "Seedcorn maggot’s onion-obsessed cousin—flies lay eggs at the base of seedlings; larvae tunnel stems and bulbs until plants flop like cheap props. Onions planted too deep into cold mud send a VIP invite."
  characteristics: "Linear scars and hollow hearts in sets; wilting that pulls easily from soft necks. Three flights a year in many zones—spring sets and late scallions both get hit."
  control_methods:
    organic_sprays: "Spinosad or neem soil drenches during egg-lay peaks; entomopathogenic nematodes around crowns when soil is moist and warm enough for nematode mobility."
    biological_controls: "Ground beetles and rove beetles; parasitic nematodes reduce maggot counts in trials—field moisture makes or breaks them."
    cultural_practices: "Avoid fresh manure before planting; rotate Allium blocks; wait for soil warm-up; disk in overwintered culls before flies wake."
    mechanical_physical: "Floating row cover on seedbeds and transplants—edges buried, no gaps for romantic flies."
    preventive_methods: "Yellow sticky stakes for flight monitoring; delay planting until soils dry slightly—soggy fields smell like fly perfume."
  natural_enemies:
    - "Ground Beetles"
    - "Rove Beetles"
    - "Entomopathogenic Nematodes"
  # Image attribution: (c) Barsark Jarl, all rights reserved, uploaded by Barsark Jarl
  # Image source: inaturalist
- name: "Coconut Mite"
  slug: "coconut-mite"
  picture: "coconut_mite.webp"
  scientific_name: "Aceria guerreronis"
  description: "Eriophyid mites that colonize the meristem under bracts, scarring young nuts and causing distortion, abortion, or cosmetic russeting. Damage hides until you peel the bracts—then it is a furry city."
  characteristics: "Brown necrotic patches at the button; nuts may fall early or grow lopsided. Dry winds and continuous fruiting canopies favor explosions."
  control_methods:
    organic_sprays: "Sulfur or horticultural oils directed into the spear/bract zone—repeat carefully to avoid phytotoxicity on hot days; soap works on tender tissues if coverage is surgical."
    biological_controls: "Predatory mites (Amblyseius largoensis) and thrips predators are studied/released in some regions; conserve generalists by skipping calendar sprays."
    cultural_practices: "Remove heavily infested bunches when practical; maintain ground cover to cut dust; balanced nutrition—stressed palms host more mites."
    mechanical_physical: "High-pressure rinse of young bunches where reachable—logistics laugh at 60-foot palms, but backyard coconuts exist."
    preventive_methods: "Scout new plantings monthly; flag first russeted buttons before the whole headland matches."
  natural_enemies:
    - "Amblyseius largoensis"
    - "Predatory Thrips"
  # Image attribution: Hartford Hammond Keifer / Wikimedia Commons / Public domain
  # Image source: wikimedia
- name: "Rhinoceros Beetle"
  slug: "rhinoceros-beetle"
  picture: "rhinoceros_beetle.webp"
  scientific_name: "Oryctes rhinoceros"
  description: "A large dynastine scarab whose larvae compost palm debris and whose adults bore into crowns, snapping unopened fronds like spiteful umbrellas. Famous across coconut and oil palm regions; other horned scarabs worldwide are harmless decomposers—context matters."
  characteristics: "Adults are dark with a horn on males; crown damage shows V-cuts and chewed hearts. Grubs are fat C-shapes in mulch piles—do not panic at every grub unless palms scream too."
  control_methods:
    organic_sprays: "Metarhizium anisopliae or Beauveria bassiana formulations aimed at breeding sites and adults—works where moisture keeps spores viable; neem on traps as a weak backup kiss."
    biological_controls: "Oryctes nudivirus where approved and available; pigs and poultry turn compost piles; mongooses and monitor lizards—controversial guests—also eat grubs in the wild."
    cultural_practices: "Sanitize palm debris; chip and compost hot; kill standing stumps larvae use as condos; light trapping only as monitoring—mass outdoor lights call beetles to party."
    mechanical_physical: "Pheromone-baited bucket traps; hand-remove adults from crowns on short trees at night."
    preventive_methods: "No idle palm logs; coordinate community cleanup after storms—your neighbor’s woodpile is your immigration office."
  natural_enemies:
    - "Scoliid Wasps"
    - "Birds"
