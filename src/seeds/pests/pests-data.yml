# aphid_seed.yml

- name: "Spider Mites"
  slug: "spider-mites"
  picture: "spider_mites.webp"
  scientific_name: "Tetranychidae"
  description: "Spider mites are tiny arachnids that feed on plant sap, often identified by their fine webbing on the undersides of leaves and rapid reproduction. Their feeding can cause leaves to yellow, develop stippling, and drop prematurely."
  characteristics: "These mites are less than 1 mm in size, with a rounded or oval body that may appear red, green, or yellow. They are distinguished by their prolific webbing and fast reproductive cycle, which can lead to sudden and severe infestations."
  control_methods:
    integrated_preventive_methods: "Maintain proper plant hydration and avoid over-fertilization to prevent plant stress that attracts spider mites. Regularly inspect plants and clean off dust to reduce favorable conditions for mite proliferation."
    biological_controls: "Introduce beneficial organisms such as predatory mites (e.g., Phytoseiulus persimilis), ladybugs, lacewings, and minute pirate bugs. Insectivorous birds can also contribute to controlling spider mite populations."
    cultural_practices: "Implement companion planting with species that repel spider mites, rotate crops to break their life cycle, and promptly remove and destroy heavily infested leaves to reduce population buildup."
    mechanical_physical: "Utilize a strong water spray to wash off mites and their webbing from the undersides of leaves. Sticky traps can help capture mites that become airborne."
    organic_sprays: "Apply organic remedies such as neem oil, insecticidal soap, or horticultural oils directly to infested plants. Diluted solutions of garlic or hot pepper can also serve as natural deterrents."
  natural_enemies:
    - "Predatory Mites"
    - "Ladybugs"
    - "Lacewings"
    - "Minute Pirate Bugs"
    - "Insectivorous Birds"

- name: "Codling Moth"
  slug: "codling-moth"
  picture: "codling_moth.webp"
  scientific_name: "Cydia pomonella"
  description: "Codling moths are small moths that are a major pest of fruit orchards. The adults are gray-brown with a modest wingspan, while the larvae are creamy white with dark head capsules. Larvae tunnel into fruits like apples and pears, creating entry holes and leaving behind frass, which leads to decay and reduced fruit quality."
  characteristics: "Codling moths have a wingspan of about 1/2 inch. Their forewings are mottled with shades of gray and brown, providing camouflage against tree bark. The larvae are particularly damaging as they burrow into fruit, compromising both appearance and nutritional value."
  control_methods:
    preventive_methods: "Implement strict orchard sanitation by removing fallen and infested fruit. Use pheromone traps to monitor adult moth activity and establish early intervention thresholds. Prune trees to improve air circulation and reduce favorable conditions for infestation."
    biological_controls: "Encourage natural enemies such as parasitic wasps, predatory beetles, and insectivorous birds. Consider using Bacillus thuringiensis (Bt) formulations to target larvae without harming beneficial organisms."
    cultural_practices: "Practice crop rotation and intercropping to disrupt the codling moth life cycle. Use trap cropping to lure moths away from high-value fruit trees, and maintain proper fertilization practices to avoid overly vigorous, pest-prone growth."
    mechanical_physical: "Utilize physical barriers like fruit bags to protect individual fruits. Deploy sticky traps to capture adult moths, and routinely remove and destroy infested fruit to prevent further spread."
    organic_sprays: "Apply organic treatments such as neem oil, insecticidal soap, or horticultural oils during peak moth activity. Garlic-based or hot pepper sprays can also deter moths while preserving beneficial insect populations."
  natural_enemies:
    - "Parasitic Wasps"
    - "Predatory Beetles"
    - "Insectivorous Birds"


- name: "Aphids"
  slug: "aphids"
  picture: "aphids.webp"
  scientific_name: "Aphidoidea"
  description: "Aphids are small, soft-bodied insects that come in various colors such as green, black, yellow, or pink. They are typically found on the undersides of leaves or on new plant growth and feed on plant sap, which can weaken plants and cause leaves to curl or yellow."
  characteristics: "Aphids have pear-shaped bodies and are often less than 1/8 inch long. They possess long, slender mouthparts designed for piercing plant tissue and sucking sap. Some species have wings, which they use for migration, and they excrete a sticky substance called honeydew that can attract ants and promote sooty mold growth."
  control_methods:
    preventive_methods: "Adopt preventive measures by ensuring optimal plant health through balanced watering and fertilization, along with regular inspections to catch infestations early. Set clear thresholds for intervention before populations become problematic."
    biological_controls: "Encourage natural predators such as ladybugs, lacewings, parasitic wasps, hoverfly larvae, and predatory beetles to help keep aphid populations in check."
    cultural_practices: "Utilize companion planting with species like garlic, chives, or marigolds to naturally repel aphids. Incorporate crop rotation and diverse planting to interrupt the aphid life cycle and reduce habitat suitability."
    mechanical_physical: "Use a strong jet of water to physically dislodge aphids from plants, and consider hand-picking for smaller infestations."
    organic_sprays: "Apply organic treatments like neem oil, insecticidal soap, or a diluted solution of water with a few drops of dish soap. These remedies target aphids without harming beneficial insects."
  natural_enemies:
    - "Ladybugs"
    - "Lacewings"
    - "Parasitic Wasps"
    - "Hoverfly Larvae"
    - "Predatory Beetles"

- name: "Apple Maggot"
  slug: "apple-maggot"
  picture: "apple_maggot.webp"
  scientific_name: "Rhagoletis pomonella"
  description: "Apple maggots are the larval stage of a small fly that infests apples by burrowing into the fruit. They can be identified by small entry holes, tunnels within the fruit, and the presence of frass, which makes the fruit unmarketable."
  characteristics: "These pests are creamy white larvae with a dark head capsule, typically causing extensive internal damage to the fruit. Their feeding creates tunnels that reduce the quality and shelf-life of the fruit, leading to significant economic losses in orchards."
  control_methods:
    preventive_methods: "Implement strict orchard sanitation by removing and destroying fallen and infested fruit to break the pest's life cycle. Use baited traps to monitor adult fly activity and establish intervention thresholds early."
    biological_controls: "Encourage natural enemies such as parasitic wasps, beneficial flies, and insectivorous birds which target apple maggot larvae."
    cultural_practices: "Practice proper orchard hygiene, crop rotation, and consider intercropping with repellent plants or trap crops to divert the pests from high-value fruit trees."
    mechanical_physical: "Use sticky traps and physical barriers like netting to prevent adult flies from laying eggs on fruit. Bagging individual fruits can also help protect them during peak infestation periods."
    organic_sprays: "Apply organic insecticidal soaps or neem oil during the adult flight period to deter oviposition, ensuring treatments are timed with peak pest activity."
  natural_enemies:
    - "Parasitic Wasps"
    - "Beneficial Flies"
    - "Insectivorous Birds"

- name: "Fire Blight"
  slug: "fire-blight"
  picture: "fire_blight.webp"
  scientific_name: "Erwinia amylovora"
  description: "Fire Blight is a bacterial disease that affects apple and pear trees, causing branches and blossoms to appear scorched by fire. It is identified by the rapid wilting and blackening of blossoms and shoots, often accompanied by a bacterial ooze."
  characteristics: "The disease presents as water-soaked lesions that quickly darken and spread, leading to the characteristic 'shepherd’s crook' bend of infected branches. It thrives in warm, humid conditions and can rapidly decimate orchard yields if not controlled."
  control_methods:
    preventive_methods: "Maintain tree health through proper watering and balanced fertilization. Prune and remove infected branches promptly, and sanitize tools between cuts to reduce bacterial spread."
    biological_controls: "Employ beneficial microbes and antagonistic bacteria that suppress Erwinia amylovora populations. Insectivorous birds may help by reducing vector populations."
    cultural_practices: "Ensure proper tree spacing and pruning to improve air circulation. Avoid excessive nitrogen fertilization which can increase susceptibility to infection, and remove mummified fruits that harbor the bacteria."
    mechanical_physical: "Utilize physical barriers such as protective coverings during high-risk periods and remove all infected material from the orchard to reduce inoculum sources."
    organic_sprays: "Apply copper-based organic sprays or other approved biological treatments during bloom periods to minimize infection. Neem oil can also be used as part of an integrated management strategy."
  natural_enemies:
    - "Beneficial Microbes"
    - "Antagonistic Bacteria"

- name: "Apple Scab"
  slug: "apple-scab"
  picture: "apple_scab.webp"
  scientific_name: "Venturia inaequalis"
  description: "Apple Scab is a fungal disease that causes dark, velvety lesions on the leaves, fruit, and sometimes twigs of apple trees. It is recognized by the appearance of olive-green to black spots that can eventually lead to defoliation and fruit drop."
  characteristics: "The fungus produces spots that enlarge and merge, causing leaves to distort and drop prematurely. This disease significantly reduces fruit quality by affecting both the appearance and nutritional value of the fruit."
  control_methods:
    preventive_methods: "Implement strict sanitation practices by removing fallen leaves and mummified fruit to lower the source of fungal spores. Choose resistant apple varieties and ensure proper fertilization and watering to reduce plant stress."
    biological_controls: "Introduce microbial antagonists such as Bacillus subtilis that can inhibit fungal growth, and encourage beneficial fungi that compete with Venturia inaequalis."
    cultural_practices: "Practice proper pruning and spacing to increase air circulation, and use mulch to minimize soil splash that transfers spores onto foliage. Crop rotation can also help reduce disease pressure."
    mechanical_physical: "Remove and destroy infected plant material to reduce inoculum levels. Physical barriers, like row covers during wet periods, can help prevent spore dispersal."
    organic_sprays: "Apply organic fungicides such as sulfur or copper-based products during early infection periods. Neem oil and horticultural oils can also help manage the spread of apple scab when used according to recommended guidelines."
  natural_enemies:
    - "Beneficial Microbes"
    - "Competitive Fungi"

- name: "Whiteflies"
  slug: "whiteflies"
  picture: "whiteflies.webp"
  scientific_name: "Aleyrodidae"
  description: "Whiteflies are tiny, sap-sucking insects that typically cluster on the undersides of leaves. They are usually white or yellowish and can be identified by their powdery appearance and rapid movement when disturbed."
  characteristics: "Whiteflies are very small and winged, with a powdery, dust-like coating. Their feeding excretes honeydew, which promotes sooty mold growth and weakens plant health over time."
  control_methods:
    preventive_methods: "Maintain plant health through proper watering and balanced fertilization, and monitor plants regularly to detect early infestations."
    biological_controls: "Encourage beneficial insects such as ladybugs, lacewings, parasitic wasps (e.g., Encarsia formosa), and minute pirate bugs to naturally reduce whitefly populations."
    cultural_practices: "Practice crop rotation and interplant with repellent species like marigolds or garlic. Remove and destroy heavily infested leaves to minimize spread."
    mechanical_physical: "Deploy yellow sticky traps to capture adult whiteflies and use a strong water spray to dislodge them from plant surfaces."
    organic_sprays: "Apply organic treatments like neem oil or insecticidal soap during early infestation periods to control whitefly numbers."
  natural_enemies:
    - "Ladybugs"
    - "Lacewings"
    - "Parasitic Wasps"
    - "Minute Pirate Bugs"

- name: "Slugs"
  slug: "slugs"
  picture: "slugs.webp"
  scientific_name: "Gastropoda"
  description: "Slugs are soft-bodied, shell-less mollusks that feed on plant tissues, leaving behind slimy trails and irregular feeding damage. They are most active in damp, cool conditions."
  characteristics: "Slugs have elongated, slimy bodies without a protective shell. Their feeding results in irregular holes in leaves, and they can quickly defoliate vulnerable plants."
  control_methods:
    preventive_methods: "Keep the garden free of debris and provide proper drainage to reduce moist conditions that attract slugs."
    biological_controls: "Promote natural predators such as ground beetles, birds, frogs, and toads that feed on slugs. Pro Tip: If possible use ducks as a control"
    cultural_practices: "Utilize companion planting with repellent species like garlic and chives, and reduce dense ground cover that offers shelter for slugs."
    mechanical_physical: "Hand-pick slugs in the evening, use copper barriers around garden beds, and set beer traps to lure and drown them."
    organic_sprays: "Apply organic deterrents like diatomaceous earth or homemade garlic and hot pepper sprays to discourage slug activity."
  natural_enemies:
    - "Ground Beetles"
    - "Birds"
    - "Frogs"
    - "Toads"

- name: "Powdery Mildew"
  slug: "powdery-mildew"
  picture: "powdery_mildew.webp"
  scientific_name: "Erysiphales"
  description: "Powdery mildew is a fungal disease characterized by a white or gray powdery coating on leaves and stems. It spreads quickly in warm, dry conditions and can significantly reduce plant vigor."
  characteristics: "The fungus produces a distinct powdery residue that covers leaf surfaces, leading to distorted growth, premature leaf drop, and reduced photosynthesis."
  control_methods:
    preventive_methods: "Improve air circulation through proper pruning and spacing, and avoid excessive nitrogen fertilization which promotes lush, vulnerable growth."
    biological_controls: "Encourage beneficial microbes and antagonistic fungi that compete with the mildew, such as Bacillus subtilis."
    cultural_practices: "Remove and destroy infected leaves, practice crop rotation, and choose resistant plant varieties when available."
    mechanical_physical: "Hand-remove infected material and use a strong water spray to wash away spores, reducing the fungal load on plant surfaces."
    organic_sprays: "Apply organic fungicides like sulfur, neem oil, or potassium bicarbonate during early infection stages to suppress the spread of powdery mildew."
  natural_enemies:
    - "Beneficial Fungi"
    - "Antagonistic Bacteria"
    - "Competitive Microbes"

- name: "Leafhoppers"
