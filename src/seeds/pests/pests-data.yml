  scientific_name: "Oncideres spp."
  description: "Twig Girdlers are beetles that lay eggs in small branches, causing the adults to girdle the twig to create a suitable environment for their larvae. This girdling cuts off nutrient flow, leading to branch dieback and loss of structural integrity."
  characteristics: "These beetles are moderately sized with robust bodies and distinctive markings. Their feeding creates narrow, girdled sections on twigs, which eventually die and break off, reducing overall plant vigor."
  control_methods:
    preventive_methods: "Monitor trees for early signs of girdling and maintain overall tree health with proper watering and balanced fertilization."
    biological_controls: "Encourage natural predators such as birds, parasitic wasps, and predatory beetles that feed on twig girdler larvae."
    cultural_practices: "Prune and promptly remove girdled branches, and avoid excessive nitrogen fertilization which leads to soft, vulnerable wood."
    mechanical_physical: "Use protective wraps or physical barriers on susceptible branches and hand-pick adult beetles during their peak activity."
    organic_sprays: "Apply neem oil or insecticidal soap to deter egg-laying and reduce adult beetle activity."
  natural_enemies:
    - "Birds"
    - "Parasitic Wasps"
    - "Predatory Beetles"

- name: "Leafrollers"
  slug: "leafrollers"
  picture: "leafrollers.webp"
  scientific_name: "Tortricidae"
  description: "Leafrollers are caterpillars that roll or fold leaves to create a sheltered feeding site. They are commonly found on fruit trees and shrubs, and their rolled leaves are a clear sign of infestation."
  characteristics: "Typically small and green or brown, these larvae use silk to roll leaves. Their feeding damages the leaf structure and reduces photosynthetic capacity, weakening the plant over time."
  control_methods:
    preventive_methods: "Maintain vigorous plant health with proper watering and balanced fertilization, and inspect plants regularly for early signs of leaf rolling."
    biological_controls: "Encourage natural predators such as parasitic wasps, lacewings, and predatory beetles that target leafroller larvae."
    cultural_practices: "Practice crop rotation and remove rolled leaves to eliminate larval hiding places."
    mechanical_physical: "Hand-pick larvae when possible and use row covers during peak periods to prevent adult moths from laying eggs."
    organic_sprays: "Apply neem oil or insecticidal soap during early infestation to disrupt larval development."
  natural_enemies:
    - "Parasitic Wasps"
    - "Lacewings"
    - "Predatory Beetles"

- name: "Cutworms"
  slug: "cutworms"
  picture: "cutworms.webp"
  scientific_name: "Noctuidae"
  description: "Cutworms are the larval stage of moths that sever young seedlings at the soil line. They are most active at night and can cause significant damage to emerging plants."
  characteristics: "These robust, hairy caterpillars are typically brown or gray. Their nocturnal feeding makes them hard to detect until significant damage has been done."
  control_methods:
    preventive_methods: "Keep garden beds clean and use protective collars around seedlings to deter cutworm feeding."
    biological_controls: "Promote natural predators such as ground beetles, birds, and parasitic wasps that feed on cutworms."
    cultural_practices: "Practice crop rotation and remove plant debris that may harbor cutworms."
    mechanical_physical: "Hand-pick cutworms during the evening and use physical barriers like seedling collars."
    organic_sprays: "Apply neem oil or insecticidal soap during early infestation periods to minimize damage."
  natural_enemies:
    - "Ground Beetles"
    - "Birds"
    - "Parasitic Wasps"

- name: "Pomegranate Butterfly"
  slug: "pomegranate-butterfly"
  picture: "pomegranate_butterfly.webp"
  scientific_name: "Hypolimnas bolina"  # (Placeholder; actual species may vary)
  description: "The Pomegranate Butterfly is a pest of pomegranate plants, where the adult lays eggs on foliage and fruit. Its larvae feed on the tissues, causing blemishes and reduced fruit quality."
  characteristics: "Adults are medium-sized with distinctive wing patterns, while the larvae are caterpillars that can cause significant damage by skeletonizing leaves and mummifying fruit."
  control_methods:
    preventive_methods: "Maintain plant health through balanced watering and fertilization and monitor plants regularly for egg clusters."
    biological_controls: "Encourage natural enemies such as parasitic wasps, birds, and predatory insects that target the larvae."
    cultural_practices: "Remove and destroy infested foliage and practice crop rotation to reduce pest buildup."
    mechanical_physical: "Use row covers or netting during the egg-laying period and hand-pick larvae when detected."
    organic_sprays: "Apply neem oil or insecticidal soap early in the infestation to deter larval feeding."
  natural_enemies:
    - "Parasitic Wasps"
    - "Birds"
    - "Predatory Insects"

- name: "Cabbage Root Fly"
  slug: "cabbage-root-fly"
  picture: "cabbage_root_fly.webp"
  scientific_name: "Delia radicum"
  description: "Cabbage Root Flies are small flies whose larvae infest the roots of cabbage and related crops, leading to wilting and stunted growth. Their presence is often indicated by discolored, damaged roots."
  characteristics: "Adults are small and dark, while larvae are creamy white maggots that tunnel through roots, disrupting water and nutrient uptake."
  control_methods:
    preventive_methods: "Practice crop rotation and remove plant debris to reduce larval habitat; monitor fields early in the season."
    biological_controls: "Encourage beneficial soil microbes, parasitic nematodes, and predatory insects that target the larvae."
    cultural_practices: "Improve soil health with organic amendments and ensure proper drainage to deter breeding."
    mechanical_physical: "Use floating row covers to block adult flies and deploy sticky traps to capture them."
    organic_sprays: "Apply neem oil or bio-nematicides during early infestation to reduce egg laying and larval survival."
  natural_enemies:
    - "Parasitic Nematodes"
    - "Beneficial Soil Microbes"
    - "Predatory Insects"

- name: "Swede Midge"
  slug: "swede-midge"
  picture: "swede_midge.webp"
  scientific_name: "Contarinia nasturtii"
  description: "Swede Midge is a tiny fly that infests swede and other brassicas, where its larvae feed within plant tissues, causing distortion, curling, and stunted growth."
  characteristics: "These minute flies are barely visible to the naked eye. Their larvae tunnel within leaves and stems, leading to deformed and weakened plants."
  control_methods:
    preventive_methods: "Monitor brassica crops closely and maintain healthy plants with balanced watering and fertilization."
    biological_controls: "Introduce parasitic wasps and predatory insects that specialize in midge larvae control."
    cultural_practices: "Practice crop rotation and interplant with repellent species to disrupt the midge lifecycle."
    mechanical_physical: "Use fine mesh netting to protect crops during high-risk periods and remove infested tissues promptly."
    organic_sprays: "Apply insecticidal soap or neem oil early in the infestation to curb larval development."
  natural_enemies:
    - "Parasitic Wasps"
    - "Predatory Insects"

- name: "Raspberry Beetle"
  slug: "raspberry-beetle"
  picture: "raspberry_beetle.webp"
  scientific_name: "Glischrochilus sanguinolentus"
  description: "Raspberry Beetles feed on raspberry fruits, puncturing the skin and causing blemishes that reduce the fruit’s marketability and quality."
  characteristics: "Small and oval-shaped, these beetles often display mottled brown and red coloration. Their feeding results in distinct holes or scars on fruit surfaces, which can lead to secondary infections."
  control_methods:
    preventive_methods: "Maintain orchard hygiene and monitor fruit for early signs of beetle activity; ensure optimal plant nutrition to reduce stress."
    biological_controls: "Encourage natural predators such as birds, parasitic wasps, and predatory beetles that target both larvae and adults."
    cultural_practices: "Practice proper pruning and thinning to improve air circulation and reduce habitat for beetles."
    mechanical_physical: "Deploy sticky traps and hand-pick beetles during peak activity to lower populations."
    organic_sprays: "Apply neem oil or insecticidal soap at the onset of infestation to deter feeding without affecting beneficial organisms."
  natural_enemies:
    - "Birds"
    - "Parasitic Wasps"
    - "Predatory Beetles"

- name: Iguana
  slug: iguana
  picture: iguana.webp
  scientific_name: Iguana iguana
  description: >
    Iguanas are large, herbivorous lizards commonly found in tropical and subtropical regions. 
    They are known for their distinctive long tails, spiky crests, and powerful legs. 
    In gardens and permaculture landscapes, they can become significant pests by feeding 
    on vegetables, fruits, and ornamental plants.
  characteristics: >
    Iguanas are characterized by their long bodies, strong limbs, and distinctive dorsal spines 
    running along their backs. They typically range from 3 to 6 feet in length. Their sharp claws 
    enable them to climb trees and fences easily. They are mostly herbivorous, feeding on leafy greens, 
    flowers, and soft fruits. Their feeding habits can cause severe damage to crops and delicate plants, 
    leading to defoliation and plant loss.
  control_methods:
    preventive_methods: >
      - Install barriers such as wire mesh or fencing to prevent iguanas from entering gardens.
      - Maintain a clean yard, removing fallen fruit and dense vegetation that may attract iguanas.
      - Use motion-activated sprinklers to deter iguanas from foraging in key areas.
      - Reduce water sources since iguanas are drawn to ponds, birdbaths, and other water bodies.
    biological_controls: >
      - Encourage the presence of natural predators like birds of prey (hawks, owls) and large snakes.
      - Promote the presence of domesticated pets such as dogs, which can help deter iguanas.
    cultural_practices: >
      - Plant iguana-resistant species such as citrus, tough-leaved plants, crops like onions, garlic, lemongrass, and strong-smelling herbs (they dislike these).
      - Use sacrificial plants like hibiscus or certain leafy greens to divert iguana feeding away from crops.
    mechanical_physical: >
      - Install tree guards around trunks to prevent climbing.
      - Use netting or chicken wire to protect vulnerable crops.
      - Apply reflective objects, such as aluminum foil or CDs, to scare iguanas away.
    organic_sprays: >
      - Spray a mixture of garlic, hot pepper, and vinegar around garden beds to create an unappealing taste.
      - Use neem oil as a deterrent to make leaves less palatable.
  natural_enemies:
    - Hawks
    - Owls
    - Large snakes
    - Domestic dogs

- name: "Cytospora Canker"
  slug: "cytospora-canker"
  picture: "cytospora_canker.webp"
  scientific_name: "Cytospora spp."
  description: "Cytospora Canker is a fungal disease affecting stressed woody plants and trees, identified by sunken, discolored bark lesions. These cankers often exude sap or resin and cause girdling, resulting in branch dieback or even tree death."
  characteristics: "Cytospora infections create distinctive elongated, sunken areas on tree bark, often leaking a gummy sap or amber-colored resin. It primarily attacks trees already under stress from drought, injury, or poor management."
  control_methods:
    preventive_methods: "Promote optimal tree health through proper watering, balanced nutrition, avoiding injury to bark, and regular monitoring for early detection of infections."
    biological_controls: "Use beneficial microbes like Trichoderma spp. to suppress the fungal pathogens naturally."
    cultural_practices: "Promptly prune and remove infected limbs to reduce disease spread. Avoid overcrowding plants to improve airflow and reduce humidity around susceptible plants."
    mechanical_physical: "Sterilize pruning tools between cuts and remove infected debris promptly from the garden area."
    organic_sprays: "Apply neem oil treatments at early signs of infection to inhibit fungal growth and protect surrounding healthy tissues."
  natural_enemies:
    - "Trichoderma spp."
    - "Beneficial Soil Microbes"


- name: "Squash Vine Borer"
  slug: "squash-vine-borer"
  picture: "squash_vine_borer.webp"
  scientific_name: "Melittia cucurbitae"
  description: "The larva of a clearwing moth that bores into squash and pumpkin stems (and sometimes melons), often killing vines when tunnels girdle the plant. Look for sawdust-like frass at the base of stems, wilting that does not recover overnight, and entry holes near soil level."
  characteristics: "Adults resemble small wasps: orange and black with clear wings. Cream-colored larvae with a dark head tunnel inside stems. One generation is typical in the North; multiple generations occur in warm regions."
  control_methods:
    preventive_methods: "Time plantings to avoid peak egg-lay, use floating row cover until flowering (then remove for pollination), and rotate cucurbit locations. Destroy crop debris at season end."
    biological_controls: "Encourage generalist predators and parasitoids; soil-dwelling beneficial nematodes (e.g., Steinernema spp.) applied against pupae can reduce next-season pressure where labeled for organic use."
    cultural_practices: "Choose parthenocarpic or bush types under cover when possible; hill soil around stems to encourage adventitious roots past damage; trap crops of very attractive squash can pull egg-lay away from main plantings."
    mechanical_physical: "Slit stems carefully to remove larvae with a knife, then bury or pack moist soil over wounds. Crush eggs on stems and petioles. Yellow sticky traps help monitor adult flight."
    organic_sprays: "Bt kurstaki has limited reach to borers inside stems; neem or kaolin on stems and leaf undersides may deter egg-laying if reapplied after rain. Focus sprays on the lower stem during adult flight."
  natural_enemies:
    - "Braconid Wasps"
    - "Ichneumonid Wasps"
    - "Beneficial Nematodes"
  # Image attribution: Unknown / Wikimedia Commons / CC BY-SA 3.0
  # Image source: wikimedia
- name: "Stink Bug"
  slug: "stink-bug"
  picture: "stink_bug.webp"
  scientific_name: "Pentatomidae"
  description: "Shield-shaped true bugs that pierce fruit, pods, and nuts and inject enzymes, causing catfacing, dimpling, sunken spots, or internal white pithy areas. Several native and invasive species share this habit; identification matters for monitoring but management themes overlap."
  characteristics: "Broad flattened body, five-segmented antennae, scent glands that produce a sharp odor when disturbed. Nymphs are rounded and often brightly patterned before the adult shield shape appears."
  control_methods:
    preventive_methods: "Exclude small plantings with fine mesh, keep weeds and alternate hosts managed near crops, and hand-remove overwintering adults from structures when practical."
    biological_controls: "Conserve egg parasitoids such as tiny scelionid and platygastrid wasps; reduced broad-spectrum disturbance helps. Some regions have released or naturally occurring parasitoids that attack eggs of invasive species."
    cultural_practices: "Trap cropping with sunflower, millet, or mustard can concentrate bugs for removal or vacuuming; timely harvest reduces exposure on ripe fruit."
    mechanical_physical: "Shake bugs into soapy water mornings or evenings; shop-vacuum dense aggregations on trap plants. Row covers on young transplants exclude feeding."
    organic_sprays: "Neem-based products or insecticidal soap can deter nymphs with thorough coverage; repeat applications are usually needed. Kaolin clay on fruit may reduce probing damage."
  natural_enemies:
    - "Egg Parasitoid Wasps"
    - "Assassin Bugs"
    - "Spiders"
  # Image attribution: Kramthenik27 / Wikimedia Commons / CC BY-SA 4.0
  # Image source: wikimedia
- name: "Fungus Gnats"
  slug: "fungus-gnats"
  picture: "fungus_gnats.webp"
  scientific_name: "Sciaridae"
  description: "Small dark flies whose thread-like larvae live in moist organic-rich media, feeding on fungi, decaying matter, and tender roots and stems. Indoors and in propagation they signal overwatering; heavy larval feeding can stunt seedlings."
  characteristics: "Adults run on soil surfaces and fly in short hops when disturbed. Larvae are translucent white with a black head, found in the top inch of potting mix."
  control_methods:
    preventive_methods: "Allow the soil surface to dry between waterings, use well-drained mix, and pasteurize or use reputable sterile media for starts. Screen greenhouse vents."
    biological_controls: "Apply Bacillus thuringiensis israelensis (Bti) drench for larvae; Steinernema feltiae nematodes parasitize larvae in moist soil. Hypoaspis miles predatory mites feed on eggs and young larvae."
    cultural_practices: "Remove algae and debris on benches, avoid unfinished compost in seed mix, and bottom-water seedlings to keep the surface drier."
    mechanical_physical: "Yellow sticky cards trap adults for monitoring and slight reduction; top-dress pots with sand or fine grit to block egg-laying."
    organic_sprays: "Insecticidal soap or neem as soil drench can suppress larvae where labels allow; hydrogen peroxide dilutions are sometimes used cautiously—test on a few plants first."
  natural_enemies:
    - "Predatory Mites"
    - "Rove Beetles"
    - "Nematodes"
  # Image attribution: Andy Murray / Wikimedia Commons / CC BY-SA 2.0
  # Image source: wikimedia
- name: "Whitefly"
  slug: "whitefly"
  picture: "whitefly.webp"
  scientific_name: "Aleyrodidae"
  description: "Tiny white-winged sap feeders on leaf undersides; when brushed, adults flutter up in a cloud. Honeydew leads to sooty mold. Many crops are hosts; species-level ID often needs magnification or expert keys."
  characteristics: "About 1 mm long, wings held roof-like over the body, often coated with white wax. Nymphs are flat, oval, and sessile after the first instar."
  control_methods:
    preventive_methods: "Inspect new plants, quarantine greenhouse additions, and avoid excess nitrogen that produces soft growth."
    biological_controls: "Encourage Encarsia spp. and Eretmocerus spp. parasitoids, lacewings, lady beetles, and Delphastus catalinae where present."
    cultural_practices: "Remove heavily infested leaves, intersperse less-preferred species, and clean up crop residues that harbor adults."
    mechanical_physical: "Yellow sticky traps catch adults; a strong water rinse on leaf undersides dislodges nymphs and eggs on sturdy plants."
    organic_sprays: "Insecticidal soap, neem, or horticultural oil (avoid phytotoxicity in heat or on hairy leaves) with thorough undersides coverage; repeat on a short interval until cleared."
  natural_enemies:
    - "Parasitic Wasps"
    - "Ladybugs"
    - "Lacewings"
    - "Minute Pirate Bugs"
  # Image attribution: Richard Bartz, Munich aka Makro Freak / Wikimedia Commons / CC BY-SA 2.5
  # Image source: wikimedia
- name: "Citrus Leafminer"
  slug: "citrus-leafminer"
  picture: "citrus_leafminer.webp"
  scientific_name: "Phyllocnistis citrella"
  description: "A micro-moth whose larva tunnels in young citrus flush, leaving silvery serpentine mines and curled, distorted leaves. Damage is mostly cosmetic on mature trees but can set back young trees; open mines may allow fungal entry."
  characteristics: "Mines are narrow and winding on the leaf surface; larvae are tiny yellow-green caterpillars inside the leaf. Adults are minute moths active at dawn and dusk."
  control_methods:
    preventive_methods: "Avoid heavy summer pruning that forces untimed flushes; coordinate fertilizer to reduce overlapping vulnerable growth in peak moth periods if regional models exist."
    biological_controls: "Native and released parasitoid wasps (e.g., Ageniaspis citricola) attack larvae; avoid sprays harmful to tiny wasps during flush."
    cultural_practices: "On small trees, remove and destroy mined terminals if infestation is localized; maintain tree vigor with proper irrigation."
    mechanical_physical: "Not practical at scale; monitoring with pheromone traps where available helps time avoidance of flushes."
    organic_sprays: "Neem or spinosad (where permitted organically) timed to egg-lay on new flush can reduce miners; oils must be used carefully on citrus to avoid phytotoxicity."
  natural_enemies:
    - "Parasitoid Wasps"
    - "Predatory Ants"
  # Image attribution: (c) Alice Abela, all rights reserved
  # Image source: inaturalist
- name: "Asian Citrus Psyllid"
  slug: "asian-citrus-psyllid"
  picture: "citrus_greening.webp"
  scientific_name: "Diaphorina citri"
  description: "A small jumping plant-louse that feeds on citrus flush and is the vector of the bacterium causing huanglongbing (HLB). Adults tilt their bodies when disturbed; nymphs produce waxy tubules on tender growth."
  characteristics: "Brownish adult about 3–4 mm, feeds with head down at a 45° angle. Yellow-orange nymphs on new growth; feeding causes twisted tips (psyllid burn)."
  control_methods:
    preventive_methods: "Do not move uncertified citrus material; scout flush weekly; in HLB areas, follow regional quarantine and removal guidance for infected trees."
    biological_controls: "Conserve Tamarixia radiata and Diaphorencyrtus aligarhensis parasitoids and generalist predators; flowering insectaries near groves support biocontrol."
    cultural_practices: "Avoid synchronized heavy flushes when possible; reflective mulches and pruning strategies are sometimes used experimentally to alter psyllid landing."
    mechanical_physical: "Fine mesh on container citrus excludes adults; sticky traps monitor populations."
    organic_sprays: "Oils, soaps, neem, or pyrethrin (botanical) may knock down adults with good coverage; none replace area-wide IPM—timing to flush protects beneficials as much as possible."
  natural_enemies:
    - "Tamarixia radiata"
    - "Diaphorencyrtus aligarhensis"
    - "Lady Beetles"
    - "Lacewings"
  # Image attribution: USDAgov / Wikimedia Commons / Public domain
  # Image source: wikimedia
- name: "Citrus Canker"
  slug: "citrus-canker"
  picture: "citrus_canker.webp"
  scientific_name: "Xanthomonas citri subsp. citri"
  description: "A bacterial disease causing raised, corky lesions on leaves, fruit, and twigs surrounded by oily yellow halos. Wind-driven rain splashes bacteria; leafminer tunnels can increase infection courts. Report suspect trees where the disease is regulated."
  characteristics: "Lesions are tan to brown with a water-soaked margin on both leaf surfaces; fruit spots crack and roughen. Severe infections defoliate and weaken trees."
  control_methods:
    preventive_methods: "Plant windbreaks to reduce tearing wounds, use certified nursery stock, and disinfect tools. In quarantine areas, comply with removal orders to protect neighbors."
    biological_controls: "Copper-tolerant antagonists and competitive leaf microflora are research targets; healthy soil biology supports overall tree resilience."
    cultural_practices: "Prune for airflow but avoid excessive wounding; manage leafminer to reduce entry points; avoid working wet foliage."
    mechanical_physical: "Remove and destroy infected branches and fruit on a small scale when allowed; bag material for disposal per local guidance."
    organic_sprays: "Copper-based bactericides (approved for organic in your program) applied on calendar or infection-risk windows; limited efficacy means integration with sanitation and resistant varieties where available."
  natural_enemies:
    - "Antagonistic Bacteria"
    - "Beneficial Leaf Microbes"
  # Image attribution: APHIS.gov / Wikimedia Commons / Public domain
  # Image source: wikimedia
- name: "Root Rot"
  slug: "root-rot"
  picture: "root_rot.webp"
  scientific_name: "Various (e.g., Pythium spp., Phytophthora spp., Rhizoctonia spp., Fusarium spp.)"
  description: "A syndrome of wilting, stunting, yellowing, and collapse from decayed roots and crowns. Above-ground symptoms mimic drought or nutrient issues; inspection shows brown, mushy roots and often a lack of fine feeder roots."
  characteristics: "Wet, heavy, or poorly drained soil favors oomycetes (Pythium, Phytophthora); Rhizoctonia often shows as reddish-brown lesions on subterranean stems. Exact pathogen usually needs lab diagnosis."
  control_methods:
    preventive_methods: "Ensure drainage, avoid overwatering, use raised beds, and plant at correct depth. Choose resistant rootstocks or varieties when known."
    biological_controls: "Trichoderma spp., Bacillus subtilis, and mycorrhizal inoculants can improve root health and competitive exclusion when used as part of a soil-health program."
    cultural_practices: "Rotate susceptible crops, incorporate organic matter to improve soil structure, and fix low spots or install French drains."
    mechanical_physical: "Remove severely affected plants with surrounding soil; do not compost. Sterilize containers and trays between seedling batches."
    organic_sprays: "Biological fungicides based on Trichoderma or Bacillus as drench; potassium phosphite may be allowed in some organic programs as a plant-defense enhancer—verify certifier rules."
  natural_enemies:
    - "Trichoderma spp."
    - "Competitive Soil Bacteria"
    - "Mycorrhizal Fungi"
  # Image attribution: Diego Delso / Wikimedia Commons / CC BY-SA 3.0
  # Image source: wikimedia
- name: "Downy Mildew"
  slug: "downy-mildew"
  picture: "downy_mildew.webp"
  scientific_name: "Peronosporaceae (oomycetes; host-specific species)"
  description: "Not a true fungus—oomycete pathogens that cause yellow angular leaf spots (often vein-limited) and fuzzy gray-purple sporulation on the undersides in humid conditions. Cucurbits, grapes, lettuce, basil, and others each have specialized species."
  characteristics: "Morning inspection shows purplish mold under leaves while tops look blotchy yellow. Spores spread on cool wet nights; epidemics follow prolonged leaf wetness."
  control_methods:
    preventive_methods: "Choose resistant cultivars, space plants for drying, water at soil line in morning, and use high tunnels with sides that vent."
    biological_controls: "Compost teas and Bacillus-based products are used with variable results; strong soil and foliar biology supports plant vigor."
    cultural_practices: "Remove infected leaves early in outbreaks, avoid overhead irrigation, and destroy crop debris that harbors oospores where the pathogen overwinters that way."
    mechanical_physical: "Row covers can delay exposure on direct-seeded crops; vertical trellising improves air movement."
    organic_sprays: "Copper, sulfur, or biological fungicides per crop label; potassium bicarbonate solutions sometimes suppress mild infections. Reapply before rain events per local organic rules."
  natural_enemies:
    - "Hyperparasitic Fungi"
    - "Competitive Microbes"
  # Image attribution: Kembangraps / Wikimedia Commons / CC BY-SA 4.0
  # Image source: wikimedia
- name: "Gray Mold"
  slug: "gray-mold"
  picture: "gray_mold.webp"
  scientific_name: "Botrytis cinerea"
  description: "A necrotrophic fungus that colonizes dead or senescing tissue and then spreads into healthy parts, producing fuzzy gray spore masses. Common on strawberries, grapes, tomatoes, and cut flowers during cool, humid weather."
  characteristics: "Soft brown rot with gray-brown dusty sporulation; infected tissues may show concentric rings. Spreads rapidly in crowded, wet canopies."
  control_methods:
    preventive_methods: "Reduce humidity with spacing, pruning, and morning irrigation; use drip; heat or vent greenhouses before nightfall."
    biological_controls: "Apply Ulocladium, Gliocladium, or Bacillus-based biological fungicides to flowers or fruit clusters where products are labeled."
    cultural_practices: "Remove spent blossoms and infected fruit promptly, mulch berries off soil, and avoid bruising at harvest."
    mechanical_physical: "Berry clamshells or tunnels with good airflow; fans in high tunnels."
    organic_sprays: "Bacillus subtilis, Streptomyces, or botanical extracts labeled for Botrytis; sulfur or potassium bicarbonate on some crops. Repeat before wet spells."
  natural_enemies:
    - "Hyperparasitic Fungi"
    - "Antagonistic Bacteria"
  # Image attribution: (c) Tig, all rights reserved, uploaded by Tig
  # Image source: inaturalist

- name: "Harlequin Bug"
  slug: "harlequin-bug"
  picture: "harlequin_bug.webp"
  scientific_name: "Murgantia histrionica"
  description: "A striking black-and-orange stink bug specialized on mustards and other brassicas. Both adults and nymphs suck sap, causing white blotches, wilting, and seedling death."
  characteristics: "Shield-shaped bug about 8–10 mm with bold orange-red and black pattern. Barrel-shaped black-and-white eggs in double rows on leaf undersides."
  control_methods:
    preventive_methods: "Use row cover over spring brassicas; destroy crop residues where adults overwinter in garden debris."
    biological_controls: "Egg parasitoids such as Trissolcus and Telenomus spp. occur; preserve them by avoiding broad-spectrum sprays."
    cultural_practices: "Trap crop with mustard or rape at field edge; time removal or flame when bugs aggregate."
    mechanical_physical: "Hand-pick into soapy water; knock adults into a bucket mornings when sluggish."
    organic_sprays: "Insecticidal soap or neem on nymphs with thorough coverage; repeat every few days during outbreaks."
  natural_enemies:
    - "Egg Parasitoid Wasps"
    - "Spiders"
    - "Birds"
  # Image attribution: Mary Foley Benson / Wikimedia Commons / Public domain
  # Image source: wikimedia
- name: "Kudzu Bug"
  slug: "kudzu-bug"
  picture: "kudzu_bug.webp"
  scientific_name: "Megacopta cribraria"
