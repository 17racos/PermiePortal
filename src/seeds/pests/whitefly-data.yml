---
- name: Whitefly
  slug: whitefly
  picture: whitefly.webp
  scientific_name: Aleyrodidae
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, whitefly may already
    be feeding. The larval stage does most of the damage, often hidden where you cannot see it
    at first glance. By the time yellowing or rot appears, feeding may be well underway. Move
    quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    preventive_methods: Inspect new plants, quarantine greenhouse additions, and avoid excess nitrogen that produces soft
      growth.
    biological_controls: Encourage Encarsia spp. and Eretmocerus spp. parasitoids, lacewings, lady beetles, and Delphastus
      catalinae where present.
    cultural_practices: Remove heavily infested leaves, intersperse less-preferred species, and clean up crop residues that
      harbor adults.
    mechanical_physical: Yellow sticky traps catch adults; a strong water rinse on leaf undersides dislodges nymphs and eggs
      on sturdy plants.
    organic_sprays: Insecticidal soap, neem, or horticultural oil (avoid phytotoxicity in heat or on hairy leaves) with thorough
      undersides coverage; repeat on a short interval until cleared.
  natural_enemies:
  - Parasitic Wasps
  - Ladybugs
  - Lacewings
  - Minute Pirate Bugs
