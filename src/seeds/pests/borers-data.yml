---
- name: Borers
  slug: borers
  picture: borers.jpg
  scientific_name: Various (e.g., Cerambycidae, Sesiidae)
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, borers may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain plant health through proper watering, balanced fertilization, and regular monitoring. Prune
      and remove infested material promptly to reduce the spread.
    biological_controls: Encourage natural predators such as parasitic wasps, birds, and beneficial beetles that target borer
      larvae.
    cultural_practices: Implement crop rotation, use resistant varieties, and practice strict sanitation by removing and destroying
      infected debris.
    mechanical_physical: Utilize physical barriers like sticky bands on trunks and hand-pick or drill out infested sections
      to prevent further damage.
    organic_sprays: Apply neem oil or insecticidal soap during periods of adult activity to deter egg-laying and lower larval
      survival.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Beneficial Beetles
