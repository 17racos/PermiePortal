---
- name: Nematodes
  slug: nematodes
  picture: nematodes.jpg
  scientific_name: Meloidogyne spp.
  description: >-
    If plants stay stunted, yellow, and thirsty even with good care, nematodes may be attacking
    below ground. These microscopic pests damage roots, so the top growth declines before the
    cause is obvious. Yield drops and wilting worsen in heat because damaged roots cannot keep
    up. Once populations build in soil, control gets harder, so early detection is critical.
  characteristics: >-
    Gently lift a struggling plant and inspect roots for knots, lesions, branching distortion,
    or weak root mass. Affected plants often appear in patches rather than uniformly across the
    bed. Symptoms can mimic nutrient stress, but damaged roots with poor feeder growth are a key
    clue. Lab or microscope confirmation is best, but root injury patterns strongly indicate
    nematode pressure.
  control_methods:
    preventive_methods: Utilize crop rotation with non-host plants and practice rigorous soil management to minimize nematode
      populations.
    biological_controls: Introduce beneficial nematodes and soil microbes that outcompete or prey on harmful nematodes.
    cultural_practices: Enhance soil organic matter with compost and maintain balanced soil pH to create unfavorable conditions
      for nematode proliferation.
    mechanical_physical: Employ soil solarization in warm climates and implement strict sanitation to prevent the spread of
      nematodes.
    organic_sprays: Apply neem-based products or compost teas as bio-nematicides to suppress harmful nematode activity.
  natural_enemies:
  - Beneficial Nematodes
  - Soil Microbes
  - Predatory Fungi
