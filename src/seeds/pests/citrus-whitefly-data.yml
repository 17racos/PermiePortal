---
- name: Citrus Whitefly
  slug: citrus-whitefly
  picture: citrus_whitefly.jpg
  scientific_name: Dialeurodes citri
  description: A whitefly strongly associated with citrus, feeding on undersides of leaves and excreting honeydew that supports
    sooty mold. Often part of a complex with other sucking pests.
  characteristics: Adults are slightly larger and less active than some other whiteflies; nymphs are flat, oval, and semitransparent
    on leaf undersides.
  control_methods:
    preventive_methods: Avoid broad-spectrum sprays that flare whiteflies; monitor with yellow traps.
    biological_controls: Encarsia and Eretmocerus parasitoids, Delphastus beetle, lacewings.
    cultural_practices: Prune dense interiors; remove heavily infested leaves on young trees.
    mechanical_physical: Water rinse on small trees.
    organic_sprays: Soaps and horticultural oils with excellent undersides coverage; repeat on crawler schedule.
  natural_enemies:
  - Encarsia spp.
  - Eretmocerus spp.
  - Delphastus catalinae
