---
- name: Ulluco Weevil
  slug: ulluco-weevil
  picture: ulluco_weevil.webp
  scientific_name: Premnotrypes latithorax
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    ulluco weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Neem and Beauveria bassiana applications targeting adults during evening activity; soil drenches with
      approved microbial products where organic certification permits.
    biological_controls: Entomopathogenic nematodes in moist beds after harvest incorporation; encourage generalist predators
      in mulch-rich systems.
    cultural_practices: Rotate ulluco with non-hosts; use only clean propagation material; harvest carefully and cull infested
      tubers before storage; deep clean tools between plots.
    mechanical_physical: Floating row cover over new plantings until vines establish; pitfall traps along bed edges; solarization
      of small nursery beds in sunny sites.
    preventive_methods: Inspect imported Andean germplasm; isolate new lines one season; monitor adults with white sheets
      shaken over foliage at dusk.
  natural_enemies:
  - Ground Beetles (Carabidae)
  - Entomopathogenic Nematodes
  - Entomopathogenic Fungi
  affected_plants:
  - slug: malabar-spinach
    name: Malabar Spinach
  - slug: tropical-spinach
    name: Tropical Spinach
  - slug: ulluco
    name: Ulluco
