---
- name: Asian Citrus Psyllid
  slug: asian-citrus-psyllid
  picture: citrus_greening.jpg
  scientific_name: Diaphorina citri
  description: A small jumping plant-louse that feeds on citrus flush and is the vector of the bacterium causing huanglongbing
    (HLB). Adults tilt their bodies when disturbed; nymphs produce waxy tubules on tender growth.
  characteristics: Brownish adult about 3–4 mm, feeds with head down at a 45° angle. Yellow-orange nymphs on new growth; feeding
    causes twisted tips (psyllid burn).
  control_methods:
    preventive_methods: Do not move uncertified citrus material; scout flush weekly; in HLB areas, follow regional quarantine
      and removal guidance for infected trees.
    biological_controls: Conserve Tamarixia radiata and Diaphorencyrtus aligarhensis parasitoids and generalist predators;
      flowering insectaries near groves support biocontrol.
    cultural_practices: Avoid synchronized heavy flushes when possible; reflective mulches and pruning strategies are sometimes
      used experimentally to alter psyllid landing.
    mechanical_physical: Fine mesh on container citrus excludes adults; sticky traps monitor populations.
    organic_sprays: Oils, soaps, neem, or pyrethrin (botanical) may knock down adults with good coverage; none replace area-wide
      IPM—timing to flush protects beneficials as much as possible.
  natural_enemies:
  - Tamarixia radiata
  - Diaphorencyrtus aligarhensis
  - Lady Beetles
  - Lacewings
