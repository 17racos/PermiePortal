---
- name: Anthracnose
  slug: anthracnose
  picture: anthracnose.jpg
  scientific_name: Colletotrichum spp.
  description: A group of fungal diseases causing sunken, water-soaked lesions on leaves, stems, and fruit—often with salmon-pink
    spore masses in humid weather. Tomatoes, beans, cucurbits, and many tree fruits each host different Colletotrichum species.
  characteristics: Circular leaf spots with tan centers and dark margins; fruit rots start as round sunken craters; cankers
    girdle stems on seedlings. Spreads by splash, tools, and infected seed.
  control_methods:
    organic_sprays: Copper, sulfur, or Bacillus subtilis-based biofungicides on a protectant schedule during wet periods;
      neem has limited curative value—start before infection periods.
    biological_controls: Trichoderma and Pseudomonas products as seed treatments or soil amendments may reduce soilborne phases
      on beans and vegetables.
    cultural_practices: Wider spacing and trellising for airflow; drip instead of overhead water; rotate out of susceptible
      families; use certified seed; remove crop debris.
    mechanical_physical: Mulch to reduce soil splash; prune low branches on trees to lift fruit above splash zone.
    preventive_methods: Avoid working wet canopies; sanitize stakes and ties; choose resistant cultivars where breeding has
      delivered them.
  natural_enemies:
  - Trichoderma spp.
  - Pseudomonas fluorescens
  - Bacillus subtilis
