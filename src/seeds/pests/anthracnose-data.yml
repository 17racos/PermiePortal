---
- name: Anthracnose
  slug: anthracnose
  picture: anthracnose.jpg
  scientific_name: Colletotrichum spp.
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, anthracnose may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Copper, sulfur, or Bacillus subtilis-based biofungicides on a protectant schedule during wet periods;
      neem has limited curative value—start before infection periods.
    biological_controls: Trichoderma and Pseudomonas products as seed treatments or soil amendments may reduce soilborne phases
      on beans and vegetables.
    cultural_practices: Wider spacing and trellising for airflow; drip instead of overhead water; rotate out of susceptible
      families; use certified seed; remove crop debris.
    mechanical_physical: Mulch to reduce soil splash; prune low branches on trees to lift fruit above splash zone.
    preventive_methods: Avoid working wet canopies; sanitize stakes and ties; choose resistant cultivars where breeding has
      delivered them.
  natural_enemies:
  - Trichoderma spp.
  - Pseudomonas fluorescens
  - Bacillus subtilis
