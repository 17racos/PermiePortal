---
- name: Carrot Rust Fly
  slug: carrot-rust-fly
  picture: carrot_rust_fly.webp
  scientific_name: Psila rosae
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, carrot rust fly may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Utilize crop rotation and install fine mesh netting to exclude adult flies from laying eggs on carrot
      crops. Remove volunteer carrots that may serve as alternate hosts.
    biological_controls: Encourage natural predators such as parasitic wasps, ground beetles, and other insectivorous organisms
      that target fly larvae.
    cultural_practices: Maintain garden hygiene by clearing decaying plant matter and rotating crops to prevent the buildup
      of pest populations.
    mechanical_physical: Employ floating row covers and sticky traps to intercept adult flies before they can infest the crops.
    organic_sprays: Apply organic insecticidal soap or neem oil during the adult fly period to deter egg-laying and reduce
      subsequent larval development.
  natural_enemies:
  - Parasitic Wasps
  - Ground Beetles
  - Insectivorous Birds
