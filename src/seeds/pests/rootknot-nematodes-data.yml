---
- name: Rootknot Nematodes
  slug: rootknot-nematodes
  picture: root_knot_nematodes.jpg
  scientific_name: Meloidogyne spp.
  description: >-
    If plants stay stunted, yellow, and thirsty even with good care, rootknot nematodes may be
    attacking below ground. These microscopic pests damage roots, so the top growth declines
    before the cause is obvious. Yield drops and wilting worsen in heat because damaged roots
    cannot keep up. Once populations build in soil, control gets harder, so early detection is
    critical.
  characteristics: >-
    Gently lift a struggling plant and inspect roots for knots, lesions, branching distortion,
    or weak root mass. Affected plants often appear in patches rather than uniformly across the
    bed. Symptoms can mimic nutrient stress, but damaged roots with poor feeder growth are a key
    clue. Lab or microscope confirmation is best, but root injury patterns strongly indicate
    nematode pressure.
  control_methods:
    preventive_methods: Use certified nematode-free transplants, practice crop rotation with non-host plants, and implement
      proper soil management techniques to minimize nematode buildup.
    biological_controls: Introduce beneficial nematodes and soil microbes that antagonize rootknot nematodes, thereby enhancing
      overall soil health.
    cultural_practices: Incorporate organic matter to improve soil structure, and employ crop rotation strategies to break
      the nematode life cycle.
    mechanical_physical: Utilize soil solarization in warm climates to reduce nematode populations and consider physical barriers
      in greenhouse settings.
    organic_sprays: Apply bio-nematicides such as neem-based products and compost teas to promote beneficial soil organisms
      and suppress nematode activity.
  natural_enemies:
  - Beneficial Nematodes
  - Soil Microbes
  - Predatory Fungi
