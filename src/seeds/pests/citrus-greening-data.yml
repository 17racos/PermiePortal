---
- name: Citrus Greening
  slug: citrus-greening
  picture: citrus_greening.jpg
  scientific_name: Candidatus Liberibacter asiaticus
  description: 'Huanglongbing (HLB): a phloem-limited bacterium spread chiefly by Asian citrus psyllid, causing blotchy mottled
    leaves, twig dieback, small lopsided fruit with aborted seeds, and eventual tree decline. There is no cure—management
    is vector and nutrition pressure.'
  characteristics: Asymmetrical yellow blotches crossing veins, corky midribs on fruit, and zinc-like deficiency patterns
    on one side of the canopy only. Lab PCR confirms suspect trees because nutrient stress can mimic early signs.
  control_methods:
    organic_sprays: Copper, neem, or soap-based sprays targeting psyllid adults and nymphs on flush—timed to new growth flushes;
      surround sprays on borders may help in small plantings.
    biological_controls: Tamarixia radiata and Diaphorencyrtus aligarhensis parasitoid wasps attack psyllid nymphs in classical
      programs; generalist predators include lady beetles and lacewings.
    cultural_practices: Remove infected trees in regulated areas when required; optimize irrigation and controlled nutrition
      to keep productive trees functioning longer in endemic regions.
    mechanical_physical: Screen houses exclude psyllids for high-value young trees; sticky traps monitor movement.
    preventive_methods: Only plant certified disease-free budwood; scout every flush for psyllid eggs and nymphs on tender
      leaves.
  natural_enemies:
  - Tamarixia radiata
  - Diaphorencyrtus aligarhensis
  - Lady Beetles
