---
- name: Cassava Mealybug
  slug: cassava-mealybug
  picture: cassava_mealybug.webp
  scientific_name: Phenacoccus manihoti
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, cassava mealybug may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Horticultural oil or soap penetrates wax—repeat twice weekly until crawlers slow; neem suppresses feeding
      but needs thorough coverage.
    biological_controls: Anagyrus lopezi and other encyrtid parasitoids are classical heroes where established; lady beetles,
      lacewings, and syrphid larvae finish stragglers—never torch the hedgerow.
    cultural_practices: Clean planting material; intercrop with repellent or banker plants that shelter predators; rogue heavily
      infested stems early.
    mechanical_physical: Pressure-wash nursery stock; prune tip infestations into soapy buckets.
    preventive_methods: Quarantine new cuttings; monitor shoot tips after transport—mealybugs travel like tourists with luggage.
  natural_enemies:
  - Anagyrus lopezi
  - Lady Beetles
  - Lacewings
  affected_plants:
  - slug: candle-nut-tree
    name: Candle Nut Tree
  - slug: cassava
    name: Cassava
