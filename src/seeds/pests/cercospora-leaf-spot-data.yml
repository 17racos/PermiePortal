---
- name: Cercospora Leaf Spot
  slug: cercospora-leaf-spot
  picture: cercospora_leaf_spot.jpg
  scientific_name: Cercospora spp.
  description: Fungal leaf spots with ash-gray to tan centers, reddish borders, and tiny dark fungal fruiting bodies visible
    with a lens—common on beet, chard, peanut, rose, and many ornamentals. Defoliation follows prolonged humid, warm spells.
  characteristics: Lesions often angular on veined leaves; spores spread by wind-driven rain and irrigation splash. Consecutive
    wet nights rapidly build epidemics.
  control_methods:
    organic_sprays: Copper or sulfur protectants; Bacillus-based products; neem as a supplemental rotation—apply before forecast
      wetting events.
    biological_controls: Compost extracts and competitive leaf surface microbes show anecdotal help; strongest gains come
      from reducing leaf wetness duration.
    cultural_practices: Increase row spacing; orient rows with prevailing wind; destroy crop residue; rotate away from hosts
      for two years where feasible.
    mechanical_physical: Drip irrigation; avoid late-day overhead watering.
    preventive_methods: Deep plow or remove infected debris in intensive beet/chard rotations; scout lower canopy first.
  natural_enemies:
  - Bacillus subtilis
  - Pseudomonas spp.
  - Trichoderma spp.
