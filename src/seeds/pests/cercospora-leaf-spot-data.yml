---
- name: Cercospora Leaf Spot
  slug: cercospora-leaf-spot
  picture: cercospora_leaf_spot.jpg
  scientific_name: Cercospora spp.
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, cercospora leaf spot
    may already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Copper or sulfur protectants; Bacillus-based products; neem as a supplemental rotation—apply before forecast
      wetting events.
    biological_controls: Compost extracts and competitive leaf surface microbes show anecdotal help; strongest gains come
      from reducing leaf wetness duration.
    cultural_practices: Increase row spacing; orient rows with prevailing wind; destroy crop residue; rotate away from hosts
      for two years where feasible.
    mechanical_physical: Drip irrigation; avoid late-day overhead watering.
    preventive_methods: Deep plow or remove infected debris in intensive beet/chard rotations; scout lower canopy first.
  natural_enemies:
  - Bacillus subtilis
  - Pseudomonas spp.
  - Trichoderma spp.
