---
- name: Celery Leaf Miner
  slug: celery-leaf-miner
  picture: celery_leaf_miner.jpg
  scientific_name: Gracillariidae sp.
  description: Celery Leaf Miners are the larvae of a small moth that tunnel through celery leaves. Their feeding creates
    winding, serpentine trails that can lead to distorted, discolored foliage.
  characteristics: These tiny larvae leave behind narrow mines in the leaves, which are visible as sinuous, discolored trails.
    Heavy infestations can severely impair the plant's ability to photosynthesize, reducing overall crop quality.
  control_methods:
    preventive_methods: Regularly inspect celery plants and remove early signs of mining. Ensure optimal growing conditions
      to reduce plant stress and susceptibility.
    biological_controls: Encourage parasitoid wasps and other predatory insects that specifically target leaf miner larvae.
    cultural_practices: Practice crop rotation and interplant with repellent species to deter adult moths from laying eggs
      on celery.
    mechanical_physical: Remove and destroy mined leaves promptly, and use row covers to prevent adult moths from accessing
      the plants.
    organic_sprays: Apply neem oil or insecticidal soap during early infestation periods to reduce larval populations without
      harming beneficial organisms.
  natural_enemies:
  - Parasitoid Wasps
  - Predatory Insects
