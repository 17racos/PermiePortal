---
- name: Root Aphid
  slug: root-aphid
  picture: root_aphid.jpg
  scientific_name: Pemphigus spp.
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, root aphid may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil drenches through growing media can reach colonies when applied
      slowly with follow-up irrigation per label; repeat on a short interval because eggs hide in pores. Neem drenches may
      reduce feeding on potted stock. Avoid soaking dry peat too fast—media shrinkage leaves untreated channels.
    biological_controls: Entomopathogenic fungi such as Beauveria bassiana or Metarhizium spp. incorporated into irrigation
      can suppress soil-dwelling stages where moisture and temperature fit product specs. Hypoaspis miles and other soil predatory
      mites target some pest mite and insect eggs—verify compatibility with your crop system before purchase.
    cultural_practices: Never reuse unsterilized coir or compost from infested houses; solarize or steam small batches when
      feasible. Improve drainage and avoid overwatering that favors anaerobic pockets where aphids still thrive but roots
      cannot. Rotate tunnel crops to a non-host break between solanaceous or lettuce runs.
    mechanical_physical: Submerge root balls of valuable transplants in warm soapy water briefly as a rescue tactic—test on
      a few plants first. For outdoor rows, cultivate lightly around crowns to disrupt ant mutualists without destroying feeder
      roots excessively.
    preventive_methods: Inspect plug trays at purchase with a hand lens; reject batches with crusting honeydew on cells. Blue
      sticky cards at bench level catch winged forms early. Log houses that needed root drenches—start next season with clean
      floors and new capillary mat.
