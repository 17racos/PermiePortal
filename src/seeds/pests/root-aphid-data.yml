---
- name: Root Aphid
  slug: root-aphid
  picture: root_aphid.jpg
  scientific_name: Pemphigus spp.
  description: Aphids that feed underground on fine roots, crown tissue, or gall-forming species that tie into soil biology—
    not the flashy green crowd on leaf tips. Infested plants yellow, wilt in heat despite wet media, and may show honeydew
    or ant tunnels at the crown. In container, greenhouse, and high-tunnel production they spread through reused substrate;
    in fields, species such as the corn root aphid associate with soil compaction and heavy organic matter. Anywhere
    temperate to subtropical crops grow across the Americas (zones 3–13), suspect root aphids when foliage symptoms
    mismatch soil moisture readings.
  characteristics: Wingless forms are plump, dull, and wax-coated; winged migrants may appear at the soil line in summer.
    Shake roots over a white tray when lifting transplants—slow pale aphids contrast with fast springtails. Galls on roots
    indicate Pemphigus-type life cycles tied to specific alternate hosts in some regions.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil drenches through growing media can reach colonies when applied
      slowly with follow-up irrigation per label; repeat on a short interval because eggs hide in pores. Neem drenches
      may reduce feeding on potted stock. Avoid soaking dry peat too fast—media shrinkage leaves untreated channels.
    biological_controls: Entomopathogenic fungi such as Beauveria bassiana or Metarhizium spp. incorporated into irrigation
      can suppress soil-dwelling stages where moisture and temperature fit product specs. Hypoaspis miles and other soil
      predatory mites target some pest mite and insect eggs—verify compatibility with your crop system before purchase.
    cultural_practices: Never reuse unsterilized coir or compost from infested houses; solarize or steam small batches when
      feasible. Improve drainage and avoid overwatering that favors anaerobic pockets where aphids still thrive but roots
      cannot. Rotate tunnel crops to a non-host break between solanaceous or lettuce runs.
    mechanical_physical: Submerge root balls of valuable transplants in warm soapy water briefly as a rescue tactic—test
      on a few plants first. For outdoor rows, cultivate lightly around crowns to disrupt ant mutualists without destroying
      feeder roots excessively.
    preventive_methods: Inspect plug trays at purchase with a hand lens; reject batches with crusting honeydew on cells.
      Blue sticky cards at bench level catch winged forms early. Log houses that needed root drenches—start next season
      with clean floors and new capillary mat.
  affected_plants:
  - slug: carrot
    name: Carrot
  - slug: parsnip
    name: Parsnip
  - slug: iceberg-lettuce
