---
- name: Rice Water Weevil
  slug: rice-water-weevil
  picture: rice_water_weevil.jpg
  scientific_name: Lissorhoptrus oryzophilus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    rice water weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Limited organic options in flooded rice; neem-based materials may be used on labels for nursery or aerobic
      systems—check certifier before treating aquatic production.
    biological_controls: Beauveria bassiana can infect overwintering adults and larvae in some studies; mermithid nematodes
      have been evaluated against larvae. Wolf spiders (e.g., Pardosa spp.) and other generalist predators take adults and
      larvae at field margins.
    cultural_practices: Delay permanent flood to let plants outgrow vulnerable stages; drill-seeded delayed flood reduces
      injury; destroy volunteer rice and weed grasses that bridge populations.
    mechanical_physical: Maintain levees to prevent stray water that spreads adults; flush fields briefly in some systems
      to move larvae—extension-specific.
    preventive_methods: Monitor with floating traps or sweep nets along levees at establishment; rotate to soybeans or other
      non-hosts.
  natural_enemies:
  - Wolf Spiders (Lycosidae)
  - Ground Beetles (Carabidae)
  - Spiders
  - Entomopathogenic Fungi
