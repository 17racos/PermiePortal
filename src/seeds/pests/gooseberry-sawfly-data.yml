---
- name: Gooseberry Sawfly
  slug: gooseberry-sawfly
  picture: gooseberry_sawfly.jpg
  scientific_name: Nematus ribesii
  description: Sawfly larvae that can strip currants and gooseberries bare overnight—green caterpillar look-alikes with more
    legs than a butterfly kid and none of the charm. Adults are wasp-mimic sawflies that lay eggs along leaf veins in spring.
  characteristics: Young larvae cluster; later instars scatter and eat everything but midribs. Frass pellets and naked stems
    are the giveaway; damage peaks before berries color.
  control_methods:
    organic_sprays: Insecticidal soap or spinosad directed into leaf axils when larvae are small—Bt is unreliable on sawflies;
      neem can suppress early clusters if coverage is thorough.
    biological_controls: Small parasitic wasps (e.g., Athalia species and other ichneumonoids) attack larvae; ground beetles
      and birds clean up dropped individuals—avoid broad-spectrum sprays that nuke these allies.
    cultural_practices: Scout undersides weekly during leaf burst; shear heavily infested canes after harvest if renovation
      timing allows; strong plant vigor helps bushes outgrow light attacks.
    mechanical_physical: Rub or blast off egg ribbons and young clusters with gloved hands or sharp water spray before they
      fan out.
    preventive_methods: Know your emergence window—sticky traps near bushes catch clueless adults and remind you to look underneath
      leaves.
  natural_enemies:
  - Parasitic Wasps (Ichneumonoidea)
  - Ground Beetles
  - Birds
