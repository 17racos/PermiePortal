---
- name: Onion Maggot
  slug: onion-maggot
  picture: onion_maggot.webp
  scientific_name: Delia antiqua
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, onion maggot may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Spinosad or neem soil drenches during egg-lay peaks; entomopathogenic nematodes around crowns when soil
      is moist and warm enough for nematode mobility.
    biological_controls: Ground beetles and rove beetles; parasitic nematodes reduce maggot counts in trials—field moisture
      makes or breaks them.
    cultural_practices: Avoid fresh manure before planting; rotate Allium blocks; wait for soil warm-up; disk in overwintered
      culls before flies wake.
    mechanical_physical: Floating row cover on seedbeds and transplants—edges buried, no gaps for romantic flies.
    preventive_methods: Yellow sticky stakes for flight monitoring; delay planting until soils dry slightly—soggy fields smell
      like fly perfume.
  natural_enemies:
  - Ground Beetles
  - Rove Beetles
  - Entomopathogenic Nematodes
