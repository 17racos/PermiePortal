---
- name: Squash Bug
  slug: squash-bug
  picture: squash_bug.jpg
  scientific_name: Anasa tristis
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, squash bug may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Insecticidal soap or neem directed to nymph clusters on leaf undersides works best before hard cuticle
      development; repeat every 3–5 days while hatches continue. Pyrethrin offers short knockdown for adults when labels allow
      cucurbits—time applications for dusk to spare foraging bees on adjacent flowers.
    biological_controls: Tachinid flies (Trichopoda pennipes) parasitize adults; egg predators include tiny wasps and generalist
      insects. Maintain flowering strips at field margins to support parasitoids through the cucurbit window.
    cultural_practices: Rotate cucurbit blocks away from last year’s debris; till lightly in spring after final frost to expose
      overwintering adults—balance erosion risk on slopes. Choose parthenocarpic types under row cover where pollination logistics
      allow, removing cover at bloom.
    mechanical_physical: Hand-crush eggs on scouting passes—fast on small plots. Board or burlap traps laid beside vines collect
      hiding adults in morning heat; shake into soapy water. Row cover until female bloom excludes migrants if edges are buried
      daily.
    preventive_methods: Scout undersides of cotyledons and first true leaves twice weekly—egg rows appear early. Destroy crop
      residues promptly after final pick. Flag weedy cucurbit volunteers along compost piles for removal.
