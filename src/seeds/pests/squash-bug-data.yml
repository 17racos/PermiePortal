---
- name: Squash Bug
  slug: squash-bug
  picture: squash_bug.jpg
  scientific_name: Anasa tristis
  description: A large, flat true bug that pierces cucurbit leaves, stems, and fruit, causing wilting that mimics vine
    borer or disease because injected enzymes disrupt xylem. Nymphs cluster in gray masses on leaf undersides; adults
    hide under debris. Heavy pressure collapses melons, squash, and pumpkins during hot, dry spells. Present throughout
    North America wherever cucurbits grow and through Mexico and Central America in warm-season production—roughly zones
    3–11 outdoors—with extra generations in long summers.
  characteristics: Adults are dark gray-brown, about 5/8 inch (16 mm), with pointed abdomens extending past wings; eggs
    are bronze, laid in tidy rows on undersides. Early nymphs are light green with spindly legs; later instars darken.
    Field ID is the rowed eggs plus sudden midday wilt on otherwise dry-looking vines.
  control_methods:
    organic_sprays: Insecticidal soap or neem directed to nymph clusters on leaf undersides works best before hard cuticle
      development; repeat every 3–5 days while hatches continue. Pyrethrin offers short knockdown for adults when labels
      allow cucurbits—time applications for dusk to spare foraging bees on adjacent flowers.
    biological_controls: Tachinid flies (Trichopoda pennipes) parasitize adults; egg predators include tiny wasps and
      generalist insects. Maintain flowering strips at field margins to support parasitoids through the cucurbit window.
    cultural_practices: Rotate cucurbit blocks away from last year’s debris; till lightly in spring after final frost to
      expose overwintering adults—balance erosion risk on slopes. Choose parthenocarpic types under row cover where
      pollination logistics allow, removing cover at bloom.
    mechanical_physical: Hand-crush eggs on scouting passes—fast on small plots. Board or burlap traps laid beside vines
      collect hiding adults in morning heat; shake into soapy water. Row cover until female bloom excludes migrants if
      edges are buried daily.
    preventive_methods: Scout undersides of cotyledons and first true leaves twice weekly—egg rows appear early. Destroy
      crop residues promptly after final pick. Flag weedy cucurbit volunteers along compost piles for removal.
  natural_enemies:
  - Trichopoda pennipes
  - Minute Pirate Bugs (Orius spp.)
  - Ground Beetles (Carabidae)
  - Orb-weaver Spiders
