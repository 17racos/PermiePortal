---
- name: Rust Mite
  slug: rust-mite
  picture: rust_mite.jpg
  scientific_name: Eriophyidae
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, rust mite is a
    likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    organic_sprays: Sulfur, lime sulfur (dormant timing on deciduous hosts where appropriate), or superior oil sprays—follow
      crop-specific labels and temperature restrictions.
    biological_controls: Typhlodromus and other predatory mites help on grapes and some tree fruit; generalist predators matter
      less than with spider mites but still avoid broad-spectrum sprays.
    cultural_practices: Prune to open canopy for coverage; remove localized 'witches brooms' on conifers when gall mites are
      suspected.
    mechanical_physical: Power washing is rarely sufficient—focus on timed dormant or delayed-dormant applications on perennial
      crops.
    preventive_methods: Scout early spring on susceptible cultivars; track years when bronzing appeared after bloom.
  natural_enemies:
  - Typhlodromus pyri
  - Amblyseius spp.
  - Minute Pirate Bugs
