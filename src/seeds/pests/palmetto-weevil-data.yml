---
- name: Palmetto Weevil
  slug: palmetto-weevil
  picture: palmetto_weevil.jpg
  scientific_name: Rhynchophorus cruentatus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    palmetto weevil may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Beauveria bassiana or Metarhizium sprays into crown where labeled for palm borers; repeat during flight
      periods—coverage deep in crown is everything.
    biological_controls: Woodpeckers extract larvae in natural settings; entomopathogenic fungi the main intentional biocontrol.
    cultural_practices: Avoid wounding trunks during lift; brace transplants properly; do not spike declining palms for 'support';
      remove and destroy severely infested specimens to reduce aggregation cues.
    mechanical_physical: Probe and extract larvae where crowns are accessible; chipping infested material on-site versus hauling.
    preventive_methods: Monitor stressed transplants weekly; systemic stress reduction (water, nutrients) lowers attraction.
  natural_enemies:
  - Woodpeckers
  - Beauveria bassiana
  - Metarhizium anisopliae
