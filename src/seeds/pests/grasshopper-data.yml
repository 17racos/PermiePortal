---
- name: Grasshopper
  slug: grasshopper
  picture: grasshopper.jpg
  scientific_name: Acrididae
  description: Chewing orthopterans that clip leaves, silk, and fruit on field crops, forages, and gardens—outbreaks follow
    warm, dry springs that favor egg survival. Migratory species can appear suddenly along field margins.
  characteristics: Enlarged hind femurs for jumping; short antennae on most pest species; nymphs resemble adults without wings.
    Economic damage is often edge-concentrated until swarms form.
  control_methods:
    organic_sprays: Semispore bait (Nosema locustae) or Beauveria bassiana bran baits for young hoppers; azadirachtin or pyrethrum
      for knockdown on high-value rows—read labels for bee restrictions.
    biological_controls: Blister beetle larvae (Meloidae) eat egg pods; robber flies, ground beetles, spiders, and vertebrates
      thin populations if unsprayed refuges exist.
    cultural_practices: Mow fallow strips to reduce attractive rank grass; till margins to destroy undisturbed egg beds; trap
      crops of lush cereals at field edges can pull hoppers off vegetables.
    mechanical_physical: Row cover on seedlings; bug vacuums on narrow beds—mostly morale boosting except at small scale.
    preventive_methods: Scout ditches and roadsides in late spring; flag increasing nymph bands before adults can fly.
  natural_enemies:
  - Robber Flies
  - Ground Beetles
  - Spiders
