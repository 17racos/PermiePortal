---
- name: Vine Weevil
  slug: vine-weevil
  picture: vine_weevil.jpg
  scientific_name: Otiorhynchus sulcatus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    vine weevil may be the cause. Adults chew above ground while larvae often feed out of sight
    inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots are
    heavily hit. Act early so a small weevil problem does not become a season-long infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Insecticidal soap or pyrethrin directed to leaf bases and pots can knock down adults when applied at dusk;
      repeat on a tight schedule during peak flight because eggs keep arriving. Larvae in media respond better to biological
      drenches than to surface sprays.
    biological_controls: Entomopathogenic nematodes (Steinernema kraussei, Heterorhabditis bacteriophora) applied as media
      drenches kill larvae when temperature thresholds are met; some growers rotate nematode species seasonally. Beauveria
      bassiana products labeled for soil use can supplement where moisture persists.
    cultural_practices: Inspect incoming liners for notching; quarantine batches. Empty and refresh heavily infested media
      rather than endlessly treating. Raise benches and keep pots on gravel to reduce adult daytime hiding directly under
      plants.
    mechanical_physical: Place boards or burlap on benches; shake trapped adults into soapy water each morning. For backyard
      berries, hand-pick at night with a headlamp—slow but satisfying.
    preventive_methods: Hang sticky monitoring traps at canopy height in houses to time nematode applications. Track which
      cultivars show first notches; treat adjacent pots preemptively. Never dump old coir onto fields without composting protocols
      that kill grubs.
