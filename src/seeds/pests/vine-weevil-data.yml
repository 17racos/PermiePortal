---
- name: Vine Weevil
  slug: vine-weevil
  picture: vine_weevil.jpg
  scientific_name: Otiorhynchus sulcatus
  description: A European-origin weevil now widespread in nursery stock and berry operations—adults chew notched leaf
    margins at night while larvae hollow roots of container plants, strawberries, and many ornamentals. Sudden wilt in
    otherwise moist media is a classic calling card. Established in temperate North America, parts of South America where
    nursery trade moves plants, and greenhouse belts year-round—outdoor pressure concentrates roughly zones 6–10, with
    larvae continuing in heated houses farther north.
  characteristics: Adults are matte black, about 3/8 inch (9 mm), with small yellowish flecks on elytra and no ability to
    fly. Larvae are legless, creamy C-shaped grubs with tan heads. Notches on rhododendron, bergenia, or strawberry leaves
    with matching root damage confirm the complex; do not confuse adult feeding with slug slime trails.
  control_methods:
    organic_sprays: Insecticidal soap or pyrethrin directed to leaf bases and pots can knock down adults when applied at
      dusk; repeat on a tight schedule during peak flight because eggs keep arriving. Larvae in media respond better to
      biological drenches than to surface sprays.
    biological_controls: Entomopathogenic nematodes (Steinernema kraussei, Heterorhabditis bacteriophora) applied as media
      drenches kill larvae when temperature thresholds are met; some growers rotate nematode species seasonally. Beauveria
      bassiana products labeled for soil use can supplement where moisture persists.
    cultural_practices: Inspect incoming liners for notching; quarantine batches. Empty and refresh heavily infested
      media rather than endlessly treating. Raise benches and keep pots on gravel to reduce adult daytime hiding directly
      under plants.
    mechanical_physical: Place boards or burlap on benches; shake trapped adults into soapy water each morning. For
      backyard berries, hand-pick at night with a headlamp—slow but satisfying.
    preventive_methods: Hang sticky monitoring traps at canopy height in houses to time nematode applications. Track which
      cultivars show first notches; treat adjacent pots preemptively. Never dump old coir onto fields without composting
      protocols that kill grubs.
  affected_plants:
  - slug: strawberry
    name: Strawberry
  - slug: blueberry
    name: Blueberry
