---
- name: Walnut Husk Fly
  slug: walnut-husk-fly
  picture: walnut_husk_fly.jpg
  scientific_name: Rhagoletis completa
  description: Tephritid relative of apple maggot that stings walnut husks, causing dark sunken stings, stuck hulls that stain
    the shell, and premature drop. Larvae feed in the husk, not the kernel—damage is market grade and handler annoyance.
  characteristics: Adults have patterned wings with clear apical spots; larvae are white maggots in the husk in late summer.
    Emergence tracks growing degree-days after spring soil warming.
  control_methods:
    organic_sprays: Spinosad or kaolin clay targeted at adult flies during the pre-oviposition window; repeat after rain washes
      kaolin—organic programs demand obsessive timing versus calendar sprays.
    biological_controls: Parasitoid guilds on Rhagoletis spp. are modest; generalist predators pick off adults at feeding
      sites.
    cultural_practices: Destroy fallen husks promptly; remove alternate hosts if any exist nearby; coordinate neighborhood
      sanitation because adults fly orchard to orchard.
    mechanical_physical: Yellow sticky spheres or panels baited with ammonium carbonate for monitoring and some mass capture.
    preventive_methods: Track biofix with traps; treat only when catches cross regional thresholds.
  natural_enemies:
  - Parasitic Wasps
  - Robber Flies
  - Spiders
