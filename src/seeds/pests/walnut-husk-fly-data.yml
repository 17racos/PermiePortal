---
- name: Walnut Husk Fly
  slug: walnut-husk-fly
  picture: walnut_husk_fly.webp
  scientific_name: Rhagoletis completa
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, walnut husk fly may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Spinosad or kaolin clay targeted at adult flies during the pre-oviposition window; repeat after rain washes
      kaolin—organic programs demand obsessive timing versus calendar sprays.
    biological_controls: Parasitoid guilds on Rhagoletis spp. are modest; generalist predators pick off adults at feeding
      sites.
    cultural_practices: Destroy fallen husks promptly; remove alternate hosts if any exist nearby; coordinate neighborhood
      sanitation because adults fly orchard to orchard.
    mechanical_physical: Yellow sticky spheres or panels baited with ammonium carbonate for monitoring and some mass capture.
    preventive_methods: Track biofix with traps; treat only when catches cross regional thresholds.
  natural_enemies:
  - Parasitic Wasps
  - Robber Flies
  - Spiders
  affected_plants:
  - slug: pecan-tree
    name: Pecan Tree
  - slug: scrub-hickory
    name: Scrub Hickory
  - slug: walnut-tree
    name: Walnut Tree
