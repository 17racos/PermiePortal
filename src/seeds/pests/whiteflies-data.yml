---
- name: Whiteflies
  slug: whiteflies
  picture: whiteflies.jpg
  scientific_name: Aleyrodidae
  description: Whiteflies are tiny, sap-sucking insects that typically cluster on the undersides of leaves. They are usually
    white or yellowish and can be identified by their powdery appearance and rapid movement when disturbed.
  characteristics: Whiteflies are very small and winged, with a powdery, dust-like coating. Their feeding excretes honeydew,
    which promotes sooty mold growth and weakens plant health over time.
  control_methods:
    preventive_methods: Maintain plant health through proper watering and balanced fertilization, and monitor plants regularly
      to detect early infestations.
    biological_controls: Encourage beneficial insects such as ladybugs, lacewings, parasitic wasps (e.g., Encarsia formosa),
      and minute pirate bugs to naturally reduce whitefly populations.
    cultural_practices: Practice crop rotation and interplant with repellent species like marigolds or garlic. Remove and
      destroy heavily infested leaves to minimize spread.
    mechanical_physical: Deploy yellow sticky traps to capture adult whiteflies and use a strong water spray to dislodge them
      from plant surfaces.
    organic_sprays: Apply organic treatments like neem oil or insecticidal soap during early infestation periods to control
      whitefly numbers.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
  - Minute Pirate Bugs
