---
- name: Whiteflies
  slug: whiteflies
  picture: whiteflies.jpg
  scientific_name: Aleyrodidae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, whiteflies may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain plant health through proper watering and balanced fertilization, and monitor plants regularly
      to detect early infestations.
    biological_controls: Encourage beneficial insects such as ladybugs, lacewings, parasitic wasps (e.g., Encarsia formosa),
      and minute pirate bugs to naturally reduce whitefly populations.
    cultural_practices: Practice crop rotation and interplant with repellent species like marigolds or garlic. Remove and
      destroy heavily infested leaves to minimize spread.
    mechanical_physical: Deploy yellow sticky traps to capture adult whiteflies and use a strong water spray to dislodge them
      from plant surfaces.
    organic_sprays: Apply organic treatments like neem oil or insecticidal soap during early infestation periods to control
      whitefly numbers.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
  - Minute Pirate Bugs
