---
- name: Earwig
  slug: earwig
  picture: earwig.jpg
  scientific_name: Forficula auricularia
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, earwig may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Insecticidal soap or spinosad directed into crown zones and under foliage can reduce nymphs on
      vegetables and soft fruit; treat after dark when earwigs are active for better contact. Diatomaceous earth bands
      around raised beds or trunks abrade waxy cuticle when kept dry—reapply after irrigation.
    biological_controls: Birds, toads, ground beetles, and centipedes consume earwigs; tachinid flies parasitize adults
      in some regions. Diverse groundcover that supports these predators beats bare, soggy mulch that favors earwig
      breeding.
    cultural_practices: Reduce excessive organic mulch against stems; pull weeds that create humid skirts. Tie up strawberry
      clusters or use clean straw lifts to keep fruit off damp refugia. Avoid over-head watering late in the day on
      susceptible flowers.
    mechanical_physical: Trap with rolled newspaper, corrugated cardboard, or short PVC sections baited with a dab of
      soy sauce or oil—shake occupants into soapy water each morning. Place boards along bed edges and flip before noon.
      On small trees, wrap trunks with sticky barriers where labels allow, excluding earwigs climbing to fruit.
    preventive_methods: Scout refugia weekly during wet spells; count earwigs per trap to decide if damage likely. Clean up
      debris piles near greenhouse doors. Rotate trap lines so populations do not learn one permanent hiding spot.
  affected_plants:
  - slug: strawberry
    name: Strawberry
  - slug: basil
    name: Basil
  - slug: marigold
    name: Marigold
  - slug: iceberg-lettuce
    name: Iceberg Lettuce
  natural_enemies:
  - Tachinid Flies (Tachinidae)
  - Ground Beetles (Carabidae)
  - Toads and Frogs (Anura)
  - Centipedes (Chilopoda)
