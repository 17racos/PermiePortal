---
- name: Pecan Weevil
  slug: pecan-weevil
  picture: pecan_weevil.webp
  scientific_name: Curculio caryae
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    pecan weevil may be the cause. Adults chew above ground while larvae often feed out of sight
    inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots are
    heavily hit. Act early so a small weevil problem does not become a season-long infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Steinernema carpocapsae, S. riobrave) applied to soil under canopy during
      larval drop and pupation windows—timing beats chemistry in organic blocks.
    biological_controls: Same nematodes plus fungal pathogens (Beauveria, Metarhizium) on soil surface; chickens or guinea
      fowl under trees scratch larvae and pupae where permitted.
    cultural_practices: Shake or pole adult weevils onto sheets in July–August evenings; destroy infested nuts; maintain bare
      soil or short sod under trees during emergence to improve nematode contact.
    mechanical_physical: Tree bands are ineffective for adults that fly; focus on ground treatments and sanitation.
    preventive_methods: Monitor with circle traps on trunks; track degree-days for emergence; harvest as soon as nuts mature
      to shorten exposure.
  natural_enemies:
  - Entomopathogenic Nematodes
  - Entomopathogenic Fungi
  - Ground Beetles (Carabidae)
  affected_plants:
  - slug: pecan-tree
    name: Pecan Tree
  - slug: scrub-hickory
    name: Scrub Hickory
  - slug: walnut-tree
    name: Walnut Tree
