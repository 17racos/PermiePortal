---
- name: Broad Mite
  slug: broad-mite
  picture: broad_mite.jpg
  scientific_name: Polyphagotarsonemus latus
  description: Microscopic tarsonemid mite that distorts new growth—crinkled, hardened, 'bronzed' leaves and scarred fruit
    on peppers, tomatoes, citrus, and many ornamentals. Damage often appears before mites are seen.
  characteristics: Adults are nearly invisible without 15x magnification; eggs are pearly and studded on peppers. Feeding
    toxic saliva causes the characteristic downward cupping and narrow 'strap' leaves.
  control_methods:
    organic_sprays: Sulfur, horticultural oil, or soap—applied early at first distortion—can suppress broad mite; repeat on
      tight intervals because eggs are protected.
    biological_controls: Neoseiulus cucumeris and Amblyseius swirskii predatory mites are used commercially in protected crops;
      outdoors, conserve generalist predators by avoiding unnecessary sprays.
    cultural_practices: Remove and destroy first symptomatic terminals; avoid moving infested transplants between houses;
      lower humidity extremes that favor tarsonemids in tunnels.
    mechanical_physical: Nothing reliable besides exclusion in greenhouses—focus on biocontrol and sanitation.
    preventive_methods: Quarantine new plant batches; sticky tape on boots between houses; scout growing points with random
      leaf pulls.
  natural_enemies:
  - Neoseiulus cucumeris
  - Amblyseius swirskii
  - Minute Pirate Bugs
