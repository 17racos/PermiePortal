---
- name: Tobacco Budworm
  slug: tobacco-budworm
  picture: tobacco_budworm.jpg
  scientific_name: Chloridea virescens
  description: A noctuid caterpillar that mines buds, flowers, and fruit of tobacco, cotton, tomatoes, and ornamentals; closely
    related in damage habit to corn earworm but with distinct larval microspines and head color patterns for the brave with
    a hand lens.
  characteristics: Larvae show sparse, large microspines compared to Helicoverpa zea and often retain a tan or orange-brown
    head in many instars; adults are greenish to brown moths with lighter hindwings.
  control_methods:
    organic_sprays: Bt kurstaki against young larvae; spinosad on exposed feeding stages—timing beats potency once larvae
      are sheltered in squares or buds.
    biological_controls: Egg and larval parasitoids including Trichogramma and various braconids; generalist predators in
      diverse plantings.
    cultural_practices: Remove crop debris; avoid sequential host crops in the same pocket garden; encourage flowering insectaries.
    mechanical_physical: Hand removal on small plantings; row covers over transplants until flowering if pollination allows.
    preventive_methods: Blacklight or pheromone monitoring where available; scout terminals and buds for earliest hits.
  natural_enemies:
  - Trichogramma spp.
  - Braconid wasps
  - Predatory bugs
