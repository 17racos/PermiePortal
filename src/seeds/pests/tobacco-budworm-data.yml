---
- name: Tobacco Budworm
  slug: tobacco-budworm
  picture: tobacco_budworm.jpg
  scientific_name: Chloridea virescens
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, tobacco budworm may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt kurstaki against young larvae; spinosad on exposed feeding stages—timing beats potency once larvae
      are sheltered in squares or buds.
    biological_controls: Egg and larval parasitoids including Trichogramma and various braconids; generalist predators in
      diverse plantings.
    cultural_practices: Remove crop debris; avoid sequential host crops in the same pocket garden; encourage flowering insectaries.
    mechanical_physical: Hand removal on small plantings; row covers over transplants until flowering if pollination allows.
    preventive_methods: Blacklight or pheromone monitoring where available; scout terminals and buds for earliest hits.
  natural_enemies:
  - Trichogramma spp.
  - Braconid wasps
  - Predatory bugs
