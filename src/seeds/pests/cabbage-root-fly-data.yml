---
- name: Cabbage Root Fly
  slug: cabbage-root-fly
  picture: cabbage_root_fly.jpg
  scientific_name: Delia radicum
  description: Cabbage Root Flies are small flies whose larvae infest the roots of cabbage and related crops, leading to wilting
    and stunted growth. Their presence is often indicated by discolored, damaged roots.
  characteristics: Adults are small and dark, while larvae are creamy white maggots that tunnel through roots, disrupting
    water and nutrient uptake.
  control_methods:
    preventive_methods: Practice crop rotation and remove plant debris to reduce larval habitat; monitor fields early in the
      season.
    biological_controls: Encourage beneficial soil microbes, parasitic nematodes, and predatory insects that target the larvae.
    cultural_practices: Improve soil health with organic amendments and ensure proper drainage to deter breeding.
    mechanical_physical: Use floating row covers to block adult flies and deploy sticky traps to capture them.
    organic_sprays: Apply neem oil or bio-nematicides during early infestation to reduce egg laying and larval survival.
  natural_enemies:
  - Parasitic Nematodes
  - Beneficial Soil Microbes
  - Predatory Insects
