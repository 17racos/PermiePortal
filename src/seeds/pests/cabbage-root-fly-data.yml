---
- name: Cabbage Root Fly
  slug: cabbage-root-fly
  picture: cabbage_root_fly.jpg
  scientific_name: Delia radicum
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, cabbage root fly may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    preventive_methods: Practice crop rotation and remove plant debris to reduce larval habitat; monitor fields early in the
      season.
    biological_controls: Encourage beneficial soil microbes, parasitic nematodes, and predatory insects that target the larvae.
    cultural_practices: Improve soil health with organic amendments and ensure proper drainage to deter breeding.
    mechanical_physical: Use floating row covers to block adult flies and deploy sticky traps to capture them.
    organic_sprays: Apply neem oil or bio-nematicides during early infestation to reduce egg laying and larval survival.
  natural_enemies:
  - Parasitic Nematodes
  - Beneficial Soil Microbes
  - Predatory Insects
