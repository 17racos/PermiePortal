---
- name: Spotted Lanternfly
  slug: spotted-lanternfly
  picture: spotted_lanternfly.jpg
  scientific_name: Lycorma delicatula
  description: A large planthopper that sucks sap from trunks, stems, and fruit clusters while excreting massive honeydew
    that fuels sooty mold. Nymphs are black with white spots early, then red with white patches; adults are gray-winged with
    bold black spots and brick-red hindwings in flight. It uses tree-of-heaven (Ailanthus) and many crop and forest hosts,
    stressing vines, stone fruit, apples, and maples. Established in parts of the eastern United States and under active containment
    efforts elsewhere—growers in zones roughly 5–9 should assume it can travel on vehicles and nursery stock across the Americas
    until monitoring proves otherwise.
  characteristics: Egg masses look like smeared gray mud on smooth bark, vehicles, and outdoor furniture. Adults are about
    1 inch (25 mm) long with a blocky head. Late instar nymphs gather in dense groups on stems—distinct from native fulgorids
    and large leafhoppers once you learn the spot pattern.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil targets clusters of nymphs on trunks and suckers with thorough
      wetting; repeat on intervals while crawlers move. Neem-based products may reduce feeding on banded trunks. For Ailanthus
      trap trees, cut-and-treat stems with labeled organic herbicide options where regulations allow to remove preferred hosts—this
      is habitat work, not a foliar silver bullet on every crop.
    biological_controls: Generalist predators including spiders, praying mantids, and birds take some individuals; egg parasitoids
      are under study but not a field-scale fix yet. Building diverse understory supports steady predator populations near
      vineyard and orchard edges.
    cultural_practices: Remove or girdle female tree-of-heaven strategically as part of community programs; replace with native
      canopy where possible. Band trunks with sticky guards to intercept nymphs moving up and down—check bands so non-target
      animals do not become trapped; refresh or use wildlife-excluding mesh covers per best local guidance.
    mechanical_physical: Vacuum adults from low trunks and walls in cool mornings for high-traffic public sites; on farms,
      prioritize destruction of egg masses by scraping into alcohol or soapy jars during dormant surveys.
    preventive_methods: Train crews to recognize egg masses on vehicles and equipment before moving between counties. Scout
      vineyard posts, pallets, and stone fruit trunks in early spring. Coordinate with neighbors—SLF ignores fence lines.
