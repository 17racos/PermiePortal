---
- name: Cabbage Root Maggots
  slug: cabbage-root-maggots
  picture: cabbage_root_maggots.jpg
  scientific_name: Delia radicum
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, cabbage root maggots
    may already be feeding. The larval stage does most of the damage, often hidden where you
    cannot see it at first glance. By the time yellowing or rot appears, feeding may be well
    underway. Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    preventive_methods: Utilize crop rotation and remove crop residues to minimize larval habitat. Monitor fields early in
      the season to detect initial infestations.
    biological_controls: Introduce parasitic nematodes and beneficial soil microbes that suppress maggot populations.
    cultural_practices: Practice intercropping with repellent plants and maintain proper soil health through organic amendments.
    mechanical_physical: Use physical barriers like row covers and apply soil solarization in warmer climates to reduce larval
      numbers.
    organic_sprays: Apply compost teas or neem-based bio-nematicides during vulnerable growth stages to deter infestation.
  natural_enemies:
  - Parasitic Nematodes
  - Predatory Beetles
  - Ground Beetles
