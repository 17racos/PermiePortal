---
- name: Cabbage Root Maggots
  slug: cabbage-root-maggots
  picture: cabbage_root_maggots.jpg
  scientific_name: Delia radicum
  description: Cabbage Root Maggots are the larval stage of flies that infest the roots of brassica crops. They tunnel through
    root tissues, causing stunting and wilting, which can lead to significant crop loss.
  characteristics: These maggots are creamy white and soft-bodied, typically found in the soil near the roots. Their feeding
    creates tunnels and galls on roots, severely disrupting nutrient and water uptake.
  control_methods:
    preventive_methods: Utilize crop rotation and remove crop residues to minimize larval habitat. Monitor fields early in
      the season to detect initial infestations.
    biological_controls: Introduce parasitic nematodes and beneficial soil microbes that suppress maggot populations.
    cultural_practices: Practice intercropping with repellent plants and maintain proper soil health through organic amendments.
    mechanical_physical: Use physical barriers like row covers and apply soil solarization in warmer climates to reduce larval
      numbers.
    organic_sprays: Apply compost teas or neem-based bio-nematicides during vulnerable growth stages to deter infestation.
  natural_enemies:
  - Parasitic Nematodes
  - Predatory Beetles
  - Ground Beetles
