---
- name: Cucumber Mosaic Virus
  slug: cucumber-mosaic-virus
  picture: cucumber_mosaic_virus.webp
  scientific_name: Cucumber mosaic virus (CMV)
  description: >-
    If leaves show irregular yellow-green mosaic patterns, distorted crinkled
    growth, and stunted plants despite good care, Cucumber Mosaic Virus is a
    strong suspect. CMV is the most widespread plant virus in the world — it
    infects over 1200 plant species including cucumbers, tomatoes, peppers,
    squash, beans, spinach, and many ornamentals and herbs. There is no cure
    once a plant is infected. Aphids spread it in seconds while feeding —
    a single aphid probe transmits the virus before any aphid control can stop it.
    Remove infected plants immediately to reduce spread to healthy ones.
  characteristics: >-
    Look for irregular mosaic patterns of light green, yellow, and dark green on
    leaves — the pattern looks like someone smeared different shades of green
    together. Leaves may be distorted, curled, or smaller than normal. Fruit
    on infected plants develops mottled patterns and may be deformed or bitter.
    Stems show stunted internodes making plants look compact and bushy rather
    than their normal shape. Symptoms appear on new growth first. Unlike
    nutrient deficiencies, mosaic patterns are irregular and do not follow
    leaf veins. Symptoms worsen in warm weather and may partially mask in
    cool conditions.
  control_methods:
    biological_controls: >-
      There is no biological control for CMV once plants are infected. The
      only biological strategy is aggressive aphid management — aphids are
      the primary vector and transmit CMV within seconds of probing a plant.
      Parasitic wasps, lacewings, and ladybug larvae that control aphid
      populations reduce transmission rates. Plant dill, fennel, and sweet
      alyssum near susceptible crops to attract these beneficials. Reflective
      mulch under susceptible crops confuses alate (winged) aphids landing
      from above and reduces initial infection rates by up to 50% in research
      trials. Healthy diverse plantings with strong biological communities
      have lower CMV incidence than monocultures.
    preventive_methods: >-
      CMV has no cure — prevention is everything. Aphids transmit it in
      10-30 seconds of probing, meaning insecticide sprays cannot stop
      transmission because they kill aphids too slowly. Control strategies
      must focus on excluding aphids physically or repelling them before
      they land. Row covers on susceptible crops completely exclude aphid
      vectors — remove for pollination then replace. Reflective silver
      mulch disorients flying aphids and is one of the most effective
      preventive tools available. Avoid planting susceptible crops near
      known CMV reservoirs — weedy areas, old cucurbit plantings, and
      ornamentals showing mosaic symptoms.
    cultural_practices: >-
      Remove infected plants immediately including roots and bag for
      disposal — do not compost. CMV persists in plant tissue and aphids
      feeding on infected plant debris pick up and transmit the virus.
      Wash hands and sanitize tools after handling infected plants before
      touching healthy ones — CMV can also spread mechanically. Resistant
      varieties exist for cucumber, squash, tomato, and pepper — check
      seed catalogs for CMV resistance ratings, often listed as C or CMV.
      Avoid working in the garden when aphids are actively flying on warm
      calm days. Interplant with strongly aromatic herbs and alliums that
      confuse aphid navigation.
    mechanical_physical: >-
      Row covers installed before aphid pressure builds are the most
      effective physical control — they completely block the vector.
      Remove infected plants with gloves and bag immediately. Silver
      reflective mulch laid before planting repels alate aphids from
      landing — one of the highest-return investments for CMV-susceptible
      crops. Sticky yellow traps monitor aphid flight pressud transmission risk and the
      need for extra vigilance.
    organic_sprays: >-
      No spray cures CMV. Insecticidal soap and neem oil manage aphid
      populations but do not prevent CMV transmission because aphids
      transmit the virus before they are killed by contact sprays.
      Mineral oil sprays (1-2% solution) applied to foliage create
      a coating that interferes with aphid stylet probing and reduces
      transmission rates — this is one of the few spray strategies
      with documented CMV prevention efficacy. Apply every 5-7 days
      during high aphid pressure periods. Kaolin clay on foliage
      deters aphid landing and feeding. Focus spray effort on aphid
      prevention before infection rather than treatment after symptoms appear.
  natural_enemies:
  - Parasitic Wasps
  - Ladybugs
  - Lacewings
  - Hoverfly Larvae
