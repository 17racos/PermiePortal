---
- name: Peachtree Borer
  slug: peachtree-borer
  picture: peachtree_borer.jpg
  scientific_name: Synanthedon exitiosa
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, peachtree borer may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Entomopathogenic nematodes applied as trunk drenches into active galleries kill larvae when substrate
      moisture and temperature match product specs. Kaolin trunk barriers may reduce egg-laying where labeled. Reapply nematodes
      after irrigation events that improve soil contact around the crown.
    biological_controls: Braconid and ichneumonid parasitoids attack clearwing larvae; woodpeckers excavate shallow galleries.
      Maintain flowering groundcovers in orchard alleys to feed adult parasitoids without encouraging ant-tended pests on
      trunks.
    cultural_practices: Hill soil slightly away from scaffolds after planting to expose the crown for inspection; avoid burying
      graft unions. Use trunk guards and white paint to limit sunscald that precedes egg deposition. Remove suckers that hide
      borer entries at the soil line.
    mechanical_physical: Probe and crush larvae in accessible galleries on young trees when detected early. Pheromone traps
      monitor male flights for nematode timing. For severe infestations on single trees, consider removal to protect neighboring
      trunks.
    preventive_methods: Inspect crowns monthly during growing season, especially on 2–4 year plantings. Flag blocks with history
      of gum spots for early summer nematode passes. Train crews to distinguish borer gum from bacterial canker ooze by frass
      presence.
