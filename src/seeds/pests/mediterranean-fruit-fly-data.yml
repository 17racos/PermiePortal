---
- name: Mediterranean Fruit Fly
  slug: mediterranean-fruit-fly
  picture: mediterranean_fruit_fly.webp
  scientific_name: Ceratitis capitata
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, mediterranean fruit
    fly may already be feeding. The larval stage does most of the damage, often hidden where you
    cannot see it at first glance. By the time yellowing or rot appears, feeding may be well
    underway. Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Bait sprays combining protein lure with spinosad or other approved botanical/microbial actives—applied
      to spots or alternate rows to kill searching females and males.
    biological_controls: Parasitoids such as Psyttalia concolor and Diachasmimorpha spp. used in augmentative and classical
      programs; preserve native parasitoids with bait-focused tactics.
    cultural_practices: Sanitation picking of fallen fruit; host removal in abandoned orchards; coordinated neighborhood cleanup—Medfly
      does not respect fence lines.
    mechanical_physical: Fruit bagging; trapping for monitoring (Jackson traps, etc.); heat or cold treatment of fruit for
      trade where certified.
    preventive_methods: Early trapping; legal restrictions on moving homegrown fruit from quarantine zones; education on hitchhiking
      larvae.
  natural_enemies:
  - Psyttalia concolor
  - Diachasmimorpha tryoni
  - Diachasmimorpha longicaudata
