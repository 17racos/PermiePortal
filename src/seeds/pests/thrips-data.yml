---
- name: Thrips
  slug: thrips
  picture: thrips.jpg
  scientific_name: Thysanoptera
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, thrips may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain optimal plant health with proper watering and fertilization, and monitor regularly for early
      signs of thrip activity.
    biological_controls: Introduce beneficial predators such as minute pirate bugs, lacewings, and predatory mites to naturally
      control thrips.
    cultural_practices: Practice crop rotation and interplant with repellent species, and remove infested foliage to reduce
      thrip populations.
    mechanical_physical: Use blue or yellow sticky traps to capture adult thrips and reduce their numbers.
    organic_sprays: Apply insecticidal soap, neem oil, or horticultural oils during peak activity to control infestations
      without harming beneficial insects.
  natural_enemies:
  - Minute Pirate Bugs
  - Lacewings
  - Predatory Mites
