---
- name: Citrus Canker
  slug: citrus-canker
  picture: citrus_canker.jpg
  scientific_name: Xanthomonas citri subsp. citri
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, citrus canker may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Plant windbreaks to reduce tearing wounds, use certified nursery stock, and disinfect tools. In quarantine
      areas, comply with removal orders to protect neighbors.
    biological_controls: Copper-tolerant antagonists and competitive leaf microflora are research targets; healthy soil biology
      supports overall tree resilience.
    cultural_practices: Prune for airflow but avoid excessive wounding; manage leafminer to reduce entry points; avoid working
      wet foliage.
    mechanical_physical: Remove and destroy infected branches and fruit on a small scale when allowed; bag material for disposal
      per local guidance.
    organic_sprays: Copper-based bactericides (approved for organic in your program) applied on calendar or infection-risk
      windows; limited efficacy means integration with sanitation and resistant varieties where available.
  natural_enemies:
  - Antagonistic Bacteria
  - Beneficial Leaf Microbes
