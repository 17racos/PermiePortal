---
- name: Spider Mites
  slug: spider-mites
  picture: spider_mites.jpg
  scientific_name: Tetranychidae
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, spider mites is
    a likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    integrated_preventive_methods: Maintain proper plant hydration and avoid over-fertilization to prevent plant stress that
      attracts spider mites. Regularly inspect plants and clean off dust to reduce favorable conditions for mite proliferation.
    biological_controls: Introduce beneficial organisms such as predatory mites (e.g., Phytoseiulus persimilis), ladybugs,
      lacewings, and minute pirate bugs. Insectivorous birds can also contribute to controlling spider mite populations.
    cultural_practices: Implement companion planting with species that repel spider mites, rotate crops to break their life
      cycle, and promptly remove and destroy heavily infested leaves to reduce population buildup.
    mechanical_physical: Utilize a strong water spray to wash off mites and their webbing from the undersides of leaves. Sticky
      traps can help capture mites that become airborne.
    organic_sprays: Apply organic remedies such as neem oil, insecticidal soap, or horticultural oils directly to infested
      plants. Diluted solutions of garlic or hot pepper can also serve as natural deterrents.
  natural_enemies:
  - Predatory Mites
  - Ladybugs
  - Lacewings
  - Minute Pirate Bugs
  - Insectivorous Birds
