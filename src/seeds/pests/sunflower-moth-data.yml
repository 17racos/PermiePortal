---
- name: Sunflower Moth
  slug: sunflower-moth
  picture: sunflower_moth.webp
  scientific_name: Homoeosoma electellum
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, sunflower moth may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki or spinosad directed at larvae while heads are still vertical and spray
      penetration is possible—timing is tighter than for most field crops.
    biological_controls: Trichogramma egg parasitoids released at oviposition; native braconid and ichneumonid wasps attack
      larvae—preserve them by avoiding broad-spectrum night sprays across headlands.
    cultural_practices: Plant uniform stands to synchronize flowering; destroy crop residue; rotate away from sunflower where
      regional populations build.
    mechanical_physical: Nothing practical at field scale beyond timing harvest before excessive webbing—accept some threshold
      loss.
    preventive_methods: Pheromone monitoring traps in the region; scout five random heads per field at R5–R6.
  natural_enemies:
  - Trichogramma spp.
  - Braconid Wasps
  - Ichneumonid Wasps
