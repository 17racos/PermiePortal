---
- name: Citrus Red Mite
  slug: citrus-red-mite
  picture: citrus_red_mite.jpg
  scientific_name: Panonychus citri
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, citrus red mite
    is a likely suspect. Mites are tiny but can multiply fast, especially during heat and dry
    air. Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    organic_sprays: Horticultural oil or narrow-range summer oil timed to avoid tree stress; insecticidal soap for light infestations—never
      mix oil and sulfur close together.
    biological_controls: Euseius and other phytoseiid predatory mites, sixspotted thrips, and small lady beetles—preserve
      them by avoiding pyrethroids on citrus skirts.
    cultural_practices: Dust control on orchard roads; adequate irrigation during drought; selective pruning for air movement
      without exposing fruit to sunburn.
    mechanical_physical: High-volume water wash can dislodge mites temporarily on small trees.
    preventive_methods: Monitor with hand lens weekly in hot months; treat only when counts cross established thresholds,
      not on calendar autopilot.
  natural_enemies:
  - Euseius tularensis
  - Stethorus picipes
  - Scolothrips sexmaculatus
