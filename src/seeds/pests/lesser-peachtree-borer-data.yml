---
- name: Lesser Peachtree Borer
  slug: lesser-peachtree-borer
  picture: lesser_peachtree_borer.webp
  scientific_name: Synanthedon pictipes
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, lesser peachtree borer may already
    be on the plant. This pest often builds quietly, then damage appears all at once. Feeding
    stress weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup
    is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Steinernema spp. and Heterorhabditis spp.) injected or sprayed into active
      borer galleries can kill larvae when moisture is adequate and temperatures stay within product ranges. Surround kaolin
      on trunks may deter egg-laying where labels allow. Repeat nematode applications after irrigation or rain per supplier
      guidance—timing matters more than brand loyalty.
    biological_controls: Braconid and ichneumonid parasitoids attack clearwing larvae in some regions; woodpeckers probe galleries.
      Keeping orchard floors flowering supports parasitoid adults. Avoid broad-spectrum sprays on trunks during peak flight
      if alternative tactics are available.
    cultural_practices: Paint trunks white or use tree guards to reduce sunscald that precedes infestation; avoid mower and
      string-trimmer strikes. Prune in dry weather and do not leave stubs that heal slowly. Remove severely infested scaffold
      branches during dormancy and burn or chip on site where regulations allow.
    mechanical_physical: Wire or flexible probe to crush larvae in accessible galleries when detected early—labor-heavy but
      effective on backyard trees. Traps baited with commercially available lesser peachtree borer lures monitor flight for
      timing nematode or trunk sprays of approved materials.
    preventive_methods: Walk orchards monthly in summer, feeling for gum spots and frass. Map trees with repeat attacks for
      priority painting and guard maintenance. Train crews to flag damage at harvest when foliage is thin and holes are visible.
