---
- name: Cranberry Tipworm
  slug: cranberry-tipworm
  picture: cranberry_tipworm.jpg
  scientific_name: Dasineura oxycoccana
  description: A gall midge whose maggots stunt upright tips into blackened crooks—classic ‘cranberry tip burn’ that growers
    curse during warm, humid stretches. Adults are tiny flies you will never see without a sweep net and optimism.
  characteristics: Injured tips swell then blacken; multiple generations can occur, slowing vine recovery. Damage is cosmetic
    early but repeated strikes reduce canopy and yield on stressed beds.
  control_methods:
    organic_sprays: Neem or spinosad timed to adult emergence—harder than Lepidoptera because adults are short-lived; oils
      risk phytotoxicity on bloom—check labels and bee restrictions.
    biological_controls: Platygastrid and other tiny parasitic wasps attack midge larvae inside galls; lacewing larvae and
      minute pirate bugs pick off exposed eggs and young larvae when humidity supports them.
    cultural_practices: Avoid excessive nitrogen that pushes succulent tips; prune or mow vines to reset growth after heavy
      damage where bed management allows; improve drainage to reduce fungal follow-up in blackened tips.
    mechanical_physical: Flooding can drown some larvae in tips if timed with extension guidance—do not improvise on commercial
      bogs without a plan.
    preventive_methods: Sticky traps in uprights for adult monitoring; scout weekly during shoot elongation in problem beds.
  natural_enemies:
  - Platygastrid Wasps
  - Minute Pirate Bugs
  - Lacewings
