---
- name: Tomato Hornworms
  slug: tomato-hornworms
  picture: tomato_hornworms.jpg
  scientific_name: Manduca quinquemaculata
  description: Tomato hornworms are large, green caterpillars that feed voraciously on tomato plants. They are easily recognized
    by their prominent horn-like projection on the rear and their rapid defoliation of leaves.
  characteristics: These caterpillars can reach up to 4 inches in length and display a bright green body with distinct white
    stripes. Their heavy feeding can quickly strip plants of foliage, reducing photosynthetic capacity and fruit yield.
  control_methods:
    preventive_methods: Regularly inspect tomato plants for early signs of hornworm eggs or larvae and remove them promptly
      to prevent rapid population growth.
    biological_controls: Introduce natural predators such as parasitic wasps (e.g., Cotesia congregata), birds, and other
      beneficial insects that target hornworms.
    cultural_practices: Practice crop rotation and interplant with repellent species to deter adult moths from laying eggs
      on tomato foliage.
    mechanical_physical: Hand-pick hornworms from plants and employ row covers during vulnerable growth stages to prevent
      moth access.
    organic_sprays: Use organic insecticidal soap or Bacillus thuringiensis (Bt) during early infestation stages to control
      larvae without harming beneficial organisms.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Insects
