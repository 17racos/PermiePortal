---
- name: Pecan Scab
  slug: pecan-scab
  picture: pecan_scab.webp
  scientific_name: Fusicladium effusum
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, pecan scab may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Sulfur rotations and copper products per organic rules; lime sulfur may be used in dormant windows on
      tolerant timing. Biofungicides with Bacillus subtilis or Reynoutria extracts can supplement—not replace—sanitation in
      wet years.
    biological_controls: Antagonistic bacteria and yeasts applied to foliage compete for infection sites when humidity is
      high.
    cultural_practices: Plant resistant cultivars; widen spacing and prune for sun and air movement; destroy fallen leaves
      where practical; avoid overhead irrigation.
    mechanical_physical: Shake limbs after harvest to dislodge old foliage in small plantings; use reflective ground cover
      in research trials to speed drying.
    preventive_methods: Scout at leaf out and nut sizing; begin protectant programs before first spring rains on susceptible
      varieties.
  natural_enemies:
  - Antagonistic Bacteria
  - Competitive Yeasts
  - Hyperparasitic Fungi
  affected_plants:
  - slug: pecan-tree
    name: Pecan Tree
  - slug: scrub-hickory
    name: Scrub Hickory
  - slug: walnut-tree
    name: Walnut Tree
