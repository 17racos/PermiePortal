---
- name: Persimmon Borer
  slug: persimmon-borer
  picture: persimmon_borer.webp
  scientific_name: Sannina uroceriformis
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, persimmon borer may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Sprays rarely reach larvae; trunk sprays of neem or spinosad can deter egg-lay on fresh wounds if timed
      to adult flight—monitor with pheromone or blacklight traps where available.
    biological_controls: Braconid parasitoids attack larvae in some regions; woodpeckers excavate shallow borers.
    cultural_practices: Avoid bark injury from mowers and string trimmers; paint trunks white in hot climates to reduce sunscald;
      remove and burn/chip heavily infested limbs during dormant season.
    mechanical_physical: Probe live galleries with flexible wire to crush larvae; bag infested cut wood before adults emerge.
    preventive_methods: Inspect trunks in late spring for frass; maintain tree vigor with mulch out to dripline—not against
      the bark.
  natural_enemies:
  - Braconid Wasps
  - Woodpeckers
  - Ants
  affected_plants:
  - slug: american-persimmon
    name: American Persimmon
  - slug: black-sapote
    name: Black Sapote
  - slug: persimmon-tree
    name: Persimmon Tree
  - slug: texas-persimmon
    name: Texas Persimmon
