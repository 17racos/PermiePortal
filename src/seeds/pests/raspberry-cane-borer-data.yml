---
- name: Raspberry Cane Borer
  slug: raspberry-cane-borer
  picture: raspberry_cane_borer.jpg
  scientific_name: Oberea perspicillata
  description: A longhorned beetle whose larvae tunnel in raspberry and blackberry primocanes, causing swellings (galls) a
    few inches long, often mid-cane, followed by weak or dying tips above the injury. Infested canes break in wind and produce
    fewer fruiting laterals. Common in temperate bramble regions of North America—roughly zones 4–8—where wild Rubus and cultivated
    rows intermingle, and in similar climates in upland Central and South America where cane berries are grown.
  characteristics: Adults are slender, gray-brown longhorns about 1/2 inch (12 mm) with faint bands; larvae are legless, cream-colored
    grubs inside pith. The gall is the hallmark—split it lengthwise to find sawdust-like frass and a larva. Egg niches appear
    as small punctures near the gall base in early season.
  control_methods:
    organic_sprays: Insecticidal soap or neem directed into gall zones has limited reach once larvae are deep—target newly
      hatched larvae during early gall formation if monitoring shows fresh punctures. Spinosad on young canes may contact
      adults during flight if label allows brambles. Sprays are secondary to cutting out galls.
    biological_controls: Woodpeckers and small parasitic wasps occasionally attack larvae; diverse hedgerows support generalist
      predators. Avoid burning entire hedgerows of wild brambles if they harbor beneficial complexes that also move into fields.
    cultural_practices: Cut infested canes at ground level during dormancy or as soon as galls are found in summer and destroy
      canes by burning where allowed or hot composting. Thin plantings for airflow so scouts can see swellings. Select less
      susceptible cultivars when regional trials exist.
    mechanical_physical: Hand removal of galled sections on small patches reduces local emergence—bag debris immediately.
      Mow wild Rubus along fence lines to lower adult reservoirs, balancing habitat goals with economic thresholds.
    preventive_methods: Walk primocanes twice per month from knee height until flowering, feeling for swellings. Flag problem
      rows for earlier cuts next year. Train pickers to report odd cane thickness during harvest passes.
