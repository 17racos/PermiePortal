---
- name: Rugose Spiraling Whitefly
  slug: rugose-spiraling-whitefly
  picture: rugose_spiraling_whitefly.webp
  scientific_name: Aleurodicus rugioperculatus
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, rugose spiraling
    whitefly may already be feeding. The larval stage does most of the damage, often hidden
    where you cannot see it at first glance. By the time yellowing or rot appears, feeding may
    be well underway. Move quickly when symptoms begin to prevent another wave of eggs and
    larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Oils and soaps aimed at crawlers on new growth; repeat applications needed under heavy wax—time to crawler
      emergence for best effect.
    biological_controls: Encourage established predators and parasitoids in the landscape; avoid broad-spectrum organic treatments
      across entire yards.
    cultural_practices: Prune severely infested terminals when tolerable; reduce plant stress; manage ant partners that defend
      honeydew producers.
    mechanical_physical: Strong rinsing on smaller specimens; remove fallen leaves that carry crawlers in confined sites.
    preventive_methods: Nursery inspections and quarantine of new installs; early detection walks focusing on favored host
      species.
  natural_enemies:
  - Lady beetles (including specialist whitefly feeders)
  - Lacewings
  - Parasitic wasps (Encarsia/Eretmocerus where they establish)
