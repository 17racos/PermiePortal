---
- name: Azalea Caterpillar
  slug: azalea-caterpillar
  picture: azalea_caterpillar.jpg
  scientific_name: Datana major
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, azalea caterpillar may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt kurstaki while larvae are small and actively feeding—spray leaf undersides; spinosad as a backup if
      they are nearing full size (mind pollinator rules on blooming plants).
    biological_controls: Tachinid flies and ichneumonid wasps stitch up late instars; spiders and songbirds snack on stragglers.
    cultural_practices: Accept minor nibbles on native plantings; on specimen shrubs, scout the interior canopy where clusters
      hide from polite society.
    mechanical_physical: Clip infested terminals into a bucket of soapy water—fast, smug, and chemical-free.
    preventive_methods: Walk lines in August; early removal of one cluster prevents headline defoliation.
  natural_enemies:
  - Tachinid Flies
  - Ichneumonid Wasps
  - Spiders
  - Songbirds
