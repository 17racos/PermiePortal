---
- name: Clover Mites
  slug: clover-mites
  picture: clover_mites.webp
  scientific_name: Bryobia praetiosa
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, clover mites is
    a likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    preventive_methods: Maintain proper garden hygiene by reducing excess moisture and removing debris that can harbor mites.
      Avoid over-fertilization to prevent lush, mite-prone growth.
    biological_controls: Encourage natural predators such as predatory mites, spiders, and insectivorous insects that help
      keep clover mite populations under control.
    cultural_practices: Implement regular garden maintenance and ensure proper plant spacing to improve air circulation and
      reduce favorable conditions for mite proliferation.
    mechanical_physical: Use a strong water spray to dislodge mites from plant surfaces and deploy sticky traps around the
      garden perimeter to capture dispersing individuals.
    organic_sprays: Apply horticultural oils or a diluted insecticidal soap solution to affected plants during early infestation
      periods to manage mite populations organically.
  affected_plants:
  - slug: dutch-clover
    name: Dutch Clover
  - slug: crimson-clover
    name: Crimson Clover
  - slug: strawberry
    name: Strawberry
  - slug: iceberg-lettuce
    name: Iceberg Lettuce
  natural_enemies:
  - Predatory Mites
  - Spiders
  - Insectivorous Insects
