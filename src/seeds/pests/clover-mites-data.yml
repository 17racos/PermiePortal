---
- name: Clover Mites
  slug: clover-mites
  picture: clover_mites.jpg
  scientific_name: Bryobia praetiosa
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, clover mites is
    a likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    biological_controls: >-
      Pause for 48 hours after first detection and scout for local helpers before spraying: lady beetle larvae, lacewings, minute pirate bugs, predatory mites, and parasitoid wasps often arrive quickly when nectar plants are nearby. Build that support system with dill, fennel, alyssum, cilantro, and yarrow around the bed edges so beneficials stay on site. Avoid buying bulk beneficial insects unless monitoring shows a true gap, because many purchased releases disperse fast and rarely match local timing.
    preventive_methods: >-
      Clover Mites pressure rises fastest on stressed plants with dense, humid canopies and frequent flushes of soft growth from overfeeding nitrogen. Keep fertility moderate, inspect new growth and leaf undersides weekly, and act when you see the first cluster instead of waiting for visible plant decline. Early warning signs include stippling, curled tips, sticky residue, frass, webbing, eggs, or small feeding scars around tender tissue.
    cultural_practices: >-
      Break the life cycle by removing heavily infested plant parts first, then reduce shelter with better spacing, strategic pruning, and cleanup of weeds or crop residue that can host carryover stages. Use companion strips such as garlic, chives, basil, marigold, nasturtium, or calendula to disrupt host-finding and concentrate pests where scouting is easier. Recheck in 3-4 days, because many warm-weather pest cycles can go from egg to reproducing adult in about a week.
    mechanical_physical: >-
      Start with a strong water spray on leaf undersides or stems to dislodge soft-bodied stages, and hand-remove egg masses, rolled leaves, or bored tissue into soapy water. Add yellow or blue sticky cards at canopy height to track adult flights and verify whether pressure is dropping. If counts keep rising after two mechanical passes in one week, escalate quickly rather than repeating labor that no longer changes population trend.
    organic_sprays: >-
      For contact control, mix insecticidal soap at 1-2 teaspoons pure castile soap per quart of water and spray directly on pests, especially undersides and hidden clusters. Neem oil can be layered as a growth regulator at about 1 tablespoon neem plus 1 teaspoon soap per quart, applied at dusk every 3-7 days based on pressure. These sprays are non-selective on soft-bodied insects, so avoid open flowers, avoid spraying when beneficials are active, and expect suppression through repeated coverage rather than instant eradication.
  natural_enemies:
  - Predatory Mites
  - Spiders
  - Insectivorous Insects
