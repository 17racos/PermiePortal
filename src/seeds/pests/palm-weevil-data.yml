---
- name: Palm Weevil
  slug: palm-weevil
  picture: palm_weevil.jpg
  scientific_name: Rhynchophorus palmarum
  description: Large snout beetles whose creamy grubs hollow palm crowns—often after pruning wounds or stress invite them
    in. Related species like the red palm weevil cause similar drama worldwide; the giveaway is oozing holes, fermented odor,
    and frass at the crown.
  characteristics: Adults are dark, often with orange markings on the shoulder; larvae are legless and can exceed finger length.
    Infested palms may show wilting fronds that collapse from the center outward once the meristem is turned to pulp.
  control_methods:
    organic_sprays: Neem and Beauveria bassiana directed into crown axils and wounds; repeat applications during rainy periods
      when adults are active—no miracle spray once the heart is fully mined.
    biological_controls: Entomopathogenic nematodes and fungi applied into galleries can kill larvae if moisture holds; woodpeckers
      and ants sometimes pick off weakened adults.
    cultural_practices: Sterilize pruning tools; avoid unnecessary crown trimming during flight peaks; remove and chip infested
      palms before beetles emerge; trap with pheromone/kairomone buckets for monitoring (not a cure-all).
    mechanical_physical: Insert approved trap spikes or probe galleries to destroy larvae where regulations allow; screen
      greenhouse palms with fine mesh.
    preventive_methods: Do not transport untreated palm debris; inspect transplants; maintain palm vigor with proper potassium
      nutrition—stressed palms scream ‘buffet open’ in weevil.
  natural_enemies:
  - Woodpeckers
  - Ants
  - Entomopathogenic Nematodes
  - Entomopathogenic Fungi
