---
- name: Sooty Mold
  slug: sooty-mold
  picture: sooty_mold.jpg
  scientific_name: Capnodium spp.
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, sooty mold may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Horticultural oil or soap aimed at the honeydew producers; light potassium bicarbonate or soap rinses
      can wash film on small plants—repeat as sap insects return.
    biological_controls: Parasitoids and predators that collapse scale and aphid populations indirectly clear sooty mold;
      ants must be excluded or baited so natural enemies can work.
    cultural_practices: Prune dense interior branches to improve coverage when spraying; reduce nitrogen that prolongs soft
      aphid-prone growth.
    mechanical_physical: Soft brush and water on ornamentals; pressure wash sturdy foliage where it will not strip bark.
    preventive_methods: Monitor sticky traps and new flush for the first whiteflies or aphids; band trees for ants where appropriate.
  natural_enemies:
  - Parasitic Wasps
  - Lady Beetles
  - Lacewings
