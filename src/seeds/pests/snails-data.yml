---
- name: Snails
  slug: snails
  picture: snails.jpg
  scientific_name: Gastropoda
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, snails may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Reduce garden moisture by ensuring proper drainage and removing debris that serves as snail habitat.
      Limit overwatering and clear ground cover regularly.
    biological_controls: Encourage natural predators such as birds, ground beetles, and small mammals which feed on snails.
    cultural_practices: Utilize companion planting with repellent species like garlic and chives, and practice crop rotation
      to reduce favorable conditions for snails.
    mechanical_physical: Hand-pick snails during damp evenings, install copper barriers around plants, and set beer traps
      to lure and drown them.
    organic_sprays: Sprinkle diatomaceous earth around plant bases or apply homemade garlic and hot pepper sprays to deter
      snail activity.
  natural_enemies:
  - Birds
  - Ground Beetles
  - Small Mammals
