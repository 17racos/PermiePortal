---
- name: Fall Armyworm
  slug: fall-armyworm
  picture: fall_armyworm.jpg
  scientific_name: Spodoptera frugiperda
  description: A migratory moth caterpillar that damages corn, sorghum, turf, and many vegetables, often boring into whorls
    or fruit. Larvae show a distinctive inverted Y on the head capsule and four dark spots in a square on the rear segment.
  characteristics: Color varies from green to brown to nearly black; smooth-bodied with longitudinal stripes. Feeding leaves
    ragged holes and abundant frass in whorls.
  control_methods:
    preventive_methods: Plant early or use transplants to outpace late-season flights; destroy crop stubble; encourage bats
      and insectivorous birds with habitat.
    biological_controls: Trichogramma spp. attack eggs; Bacillus thuringiensis kurstaki or aizawai on small larvae; nuclear
      polyhedrosis viruses build in outbreaks naturally.
    cultural_practices: Intercrop with diverse flowering plants to support parasitoids; hand-crush egg masses and young larvae
      on garden scale.
    mechanical_physical: For corn, apply mineral oil to silks to limit ear entry where appropriate; exclude moths from small
      plots with netting.
    organic_sprays: Bt products applied to whorls and leaf axils; spinosad for tougher infestations where organic-approved;
      avoid spraying open flowers.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Stink Bugs
  - Ground Beetles
  - Birds
