---
- name: Silverleaf Whitefly
  slug: silverleaf-whitefly
  picture: silverleaf_whitefly.jpg
  scientific_name: Bemisia tabaci
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, silverleaf whitefly
    may already be feeding. The larval stage does most of the damage, often hidden where you
    cannot see it at first glance. By the time yellowing or rot appears, feeding may be well
    underway. Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    preventive_methods: Inspect propagation material aggressively; rogue virus-susceptible plants showing early symptoms.
    biological_controls: Encarsia formosa, Eretmocerus spp., Delphastus, and lacewings—release in greenhouses or conserve
      outdoors.
    cultural_practices: Remove lower leaves that harbor nymphs; reflective mulches may repel adults in vegetable rows.
    mechanical_physical: Vacuum adults from greenhouse crops evenings; sticky cards for monitoring.
    organic_sprays: Soaps, oils, neem, and Beauveria bassiana where labeled—rotate modes and protect beneficials by spot-treating
      hotspots.
  natural_enemies:
  - Encarsia formosa
  - Eretmocerus spp.
  - Delphastus catalinae
  - Lacewings
