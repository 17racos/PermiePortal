---
- name: Plum Curculio
  slug: plum-curculio
  picture: plum_curculio.jpg
  scientific_name: Conotrachelus nenuphar
  description: A snout beetle that scars and drops stone and pome fruit with crescent-shaped oviposition cuts, then larvae
    tunnel flesh until fruit falls. Adults overwinter in brushy margins and move into orchards during warm, humid spells—
    management is all about timing those flights. Eastern North American native that also damages apples, pears, and quinces
    where ranges overlap; similar curculio complexes occur in other regions, but this species drives management across temperate
    zones roughly 4–8 in commercial and backyard orchards throughout the U.S. and southern Canada.
  characteristics: Adults are mottled gray-black, about 1/4 inch (6 mm), with a pronounced snout. Females score fruit and
    lay eggs in the flap; larvae are cream-colored, C-shaped grubs inside fallen fruit. Early season dimpling without crescents
    may be frost or other insects—cut fruit to confirm.
  control_methods:
    organic_sprays: Kaolin clay (particle film) on fruit surfaces deters feeding and egg-laying when applied before migration
      and maintained after rain per label. Pyrethrin or spinosad can target adult flights in small plantings if allowed on
      crop stage—check PHI and pollinator precautions. Surround programs work best with diligent reapplication and thorough
      coverage to stem bowls.
    biological_controls: Birds, toads, and ground beetles consume adults and larvae on the orchard floor; chickens under supervised
      runs can pick larvae from drops where food safety rules permit. Encourage diverse groundcover to support these predators
      between trees.
    cultural_practices: Clean drops at least every other day during curculio season—this starves larvae and reduces next year’s
      adults. Mow or mulch understory to expose fallen fruit. Prune for open canopy to improve spray deposition and predator
      access.
    mechanical_physical: Shake adults onto ground cloths in cool morning and collect—feasible on dwarf trees for demonstration
      sites. Fine exclusion netting entire trees after petal fall excludes beetles if seams are sealed.
    preventive_methods: Use black pyramid traps or trunk wraps with monitoring protocols from local extension to time first
      sprays or kaolin. Track temperature–humidity windows when adults move—same weather that comforts you brings curculio.
