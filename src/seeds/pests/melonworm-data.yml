---
- name: Melonworm
  slug: melonworm
  picture: melonworm.jpg
  scientific_name: Diaphania hyalinata
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, melonworm may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Same as pickleworm—exclude with cover early, remove crop debris, scout leaf undersides for eggs.
    biological_controls: Parasitoid wasps attack eggs and larvae; preserve them by limiting broad-spectrum sprays.
    cultural_practices: Avoid excess nitrogen that produces lush, attractive foliage.
    mechanical_physical: Hand-remove larvae and egg clusters; crush webbed leaves harboring young larvae.
    organic_sprays: Bt products or spinosad on young larvae; thorough coverage to leaf undersides and inside webs.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Beetles
