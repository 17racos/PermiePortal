---
- name: Oriental Fruit Fly
  slug: oriental-fruit-fly
  picture: oriental_fruit_fly.jpg
  scientific_name: Bactrocera dorsalis
  description: A highly polyphagous tephritid that stings ripening fruit to lay eggs; larvae liquefy pulp and trigger quarantines.
    Adults are strong fliers drawn to protein and male lure traps—your orchard's least welcome tourist.
  characteristics: Yellow to brown body with dark wing patterns and a yellow thorax with dark stripes; slightly larger than
    house flies. Larvae are creamy maggots tunneling fruit.
  control_methods:
    organic_sprays: Protein bait sprays using approved organic protein hydrolysate plus botanical toxicants (e.g., spinosad)
      target feeding adults—spot or strip applications spare many non-targets; no broad-spectrum cover sprays needed for compliance
      in many programs.
    biological_controls: Classical parasitoids such as Fopius arisanus (egg), Diachasmimorpha longicaudata, and D. tryoni
      (larval) where released; augmentative releases occur in area-wide programs.
    cultural_practices: Strip roadside and backyard hosts; harvest fruit at proper maturity; double-bag or solarize infested
      fruit; host-free periods where regulations allow.
    mechanical_physical: Male annihilation with lure-based devices in regulatory frameworks; fine mesh fruit bagging on high-value
      trees.
    preventive_methods: Trapping networks for early detection; public education on host fruit movement; cooperate with regulatory
      boundaries—this is a community-scale pest.
  natural_enemies:
  - Fopius arisanus
  - Diachasmimorpha longicaudata
  - Diachasmimorpha tryoni
