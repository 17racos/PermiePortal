---
- name: Persimmon Psylla
  slug: persimmon-psylla
  picture: persimmon_psylla.jpg
  scientific_name: Cacopsylla persimmonica
  description: Persimmon Psylla are small, sap-sucking insects that attack persimmon trees, leading to leaf discoloration
    and honeydew buildup. Their feeding can weaken trees and affect fruit quality.
  characteristics: They are very small (around 1–2 mm) with a delicate build and subtle color variations. Their feeding punctures
    the leaf surface, causing yellowing and curling, and sometimes leading to sooty mold development.
  control_methods:
    preventive_methods: Keep trees healthy with proper watering and fertilization, and conduct regular inspections to detect
      early infestations.
    biological_controls: Encourage natural predators such as ladybugs, lacewings, and parasitic wasps that naturally control
      psylla populations.
    cultural_practices: Prune infested branches and remove affected foliage promptly to reduce breeding sites.
    mechanical_physical: Use sticky traps to capture adult psylla and consider physical barriers on vulnerable branches.
    organic_sprays: Apply neem oil or insecticidal soap at the onset of infestation to mitigate damage.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
  affected_plants:
