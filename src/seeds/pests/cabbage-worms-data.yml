---
- name: Cabbage Worms
  slug: cabbage-worms
  picture: cabbage_worms.jpg
  scientific_name: Pieris rapae
  description: Cabbage worms are the larvae of the cabbage white butterfly, notorious for damaging brassica crops. They are
    identified by their green, camouflaged appearance and the characteristic holes they create in leaves.
  characteristics: These larvae are bright green with subtle white stripes that help them blend with leafy plants. Their feeding
    causes significant defoliation and reduces crop quality by creating unsightly holes in leaves.
  control_methods:
    preventive_methods: Use floating row covers to prevent adult butterflies from laying eggs on crops and remove egg clusters
      as soon as they appear.
    biological_controls: Promote natural enemies such as parasitic wasps, birds, and predatory beetles. Bacillus thuringiensis
      (Bt) can also target the larvae effectively.
    cultural_practices: Rotate crops and interplant with repellent species like dill or mint to deter cabbage butterflies,
      and practice proper spacing for good air circulation.
    mechanical_physical: Hand-pick the larvae from plants and use insect netting to block further egg deposition.
    organic_sprays: Apply organic neem oil or insecticidal soap early in the infestation to reduce larval numbers while protecting
      beneficial insects.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Beetles
