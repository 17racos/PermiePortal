---
- name: Cabbage Worms
  slug: cabbage-worms
  picture: cabbage_worms.jpg
  scientific_name: Pieris rapae
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, cabbage worms may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    preventive_methods: Use floating row covers to prevent adult butterflies from laying eggs on crops and remove egg clusters
      as soon as they appear.
    biological_controls: Promote natural enemies such as parasitic wasps, birds, and predatory beetles. Bacillus thuringiensis
      (Bt) can also target the larvae effectively.
    cultural_practices: Rotate crops and interplant with repellent species like dill or mint to deter cabbage butterflies,
      and practice proper spacing for good air circulation.
    mechanical_physical: Hand-pick the larvae from plants and use insect netting to block further egg deposition.
    organic_sprays: Apply organic neem oil or insecticidal soap early in the infestation to reduce larval numbers while protecting
      beneficial insects.
  natural_enemies:
  - Parasitic Wasps
  - Birds
  - Predatory Beetles
