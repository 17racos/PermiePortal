name: Banded Winged Whitefly
slug: banded-winged-whitefly
picture: whitefly.webp
scientific_name: Trialeurodes abutiloneus
description: If leaves show trails, fruit turns soft, or roots collapse from inside,
  banded winged whitefly may already be feeding. The larval stage does most of the
  damage, often hidden where you cannot see it at first glance. By the time yellowing
  or rot appears, feeding may be well underway. Move quickly when symptoms begin to
  prevent another wave of eggs and larvae.
characteristics: 'Watch for tiny eggs near plant tissue, pale legless larvae inside
  mines or fruit, and sudden soft spots or tunnels. Adults are usually small flies
  that hover or dart when disturbed. Check around wounds, blossoms, and moist plant
  debris where egg-laying is common. Cut open suspect tissue: live maggots or fresh
  tunnels are the clearest field confirmation.'
symptoms:
- sticky-residue
- yellowing-leaves
- curling-leaves
- sooty-deposits
control_methods:
  biological_controls: Encarsia and Eretmocerus parasitic wasps attack banded winged
    whitefly nymphs — the same species used for greenhouse whitefly control. Support
    them with dill, fennel, and sweet alyssum nearby. Lacewings, minute pirate bugs,
    and ladybug larvae eat whitefly eggs and young nymphs. Preserve these beneficials
    by avoiding broad-spectrum sprays and treating only hot spots rather than whole
    plants. Beauveria bassiana fungal spray infects and kills nymphs in humid conditions
    — effective complement to parasitoid releases.
  preventive_methods: Banded winged whitefly is primarily an outdoor pest that migrates
    from weedy areas and alternate hosts along field edges. Mow weedy margins near
    the garden to reduce local reservoirs. Yellow sticky cards at plant height are
    essential monitoring tools — more than 10 adults per card per week signals a population
    is building. Dusty plants along roads and paths attract whiteflies — leaf dust
    interferes with natural enemy activity. Reflective mulch under susceptible plants
    confuses adult whiteflies and reduces settling rates.
  cultural_practices: Remove heavily infested lower leaves and bag immediately — nymphs
    on removed leaves will still develop into adults if composted. Avoid excess nitrogen
    which produces the lush soft growth whiteflies prefer. Time new plantings to avoid
    peak migration periods if patterns are known locally. Interplant basil and strongly
    aromatic herbs near susceptible crops — volatile oils confuse whitefly navigation.
  mechanical_physical: Yellow sticky cards at plant height trap large numbers of adults
    and serve as early warning. High-pressure water jet dislodges adults and nymphs
    from leaf undersides — repeat every 2-3 days during active infestation. A handheld
    vacuum in early morning when adults are sluggish removes large numbers quickly.
    Row covers before whitefly pressure builds prevent establishment entirely.
  organic_sprays: Insecticidal soap (1-2 teaspoons castile soap per quart water) kills
    nymphs on contact — saturate leaf undersides where they cluster. Apply every 3
    days for 2 weeks. Neem oil disrupts development and reduces egg-laying — mix 1
    tablespoon neem plus 1 quart warm water, weekly. Apply sprays at dusk to protect
    beneficial insects. Rotate between soap and neem to prevent resistance. Never
    spray open flowers.
natural_enemies:
- Encarsia spp.
- Eretmocerus spp.
- Green lacewings
- Minute pirate bugs
