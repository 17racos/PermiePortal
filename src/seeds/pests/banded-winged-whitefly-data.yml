---
- name: Banded Winged Whitefly
  slug: banded-winged-whitefly
  picture: whitefly.jpg
  scientific_name: Trialeurodes abutiloneus
  description: A warm-climate whitefly that attacks cotton, cucurbits, beans, and many ornamentals; feeding causes chlorosis
    and honeydew with sooty mold. Adults show a gray band across each forewing—your cue it is not the greenhouse or silverleaf
    crowd.
  characteristics: Small white adults with distinct dark wing bands; immatures on leaf undersides like other whiteflies. Outbreaks
    favor drought-stressed or nitrogen-flush hosts in hot weather.
  control_methods:
    organic_sprays: Soaps, oils, and neem directed at undersides; rotate with Beauveria bassiana where humidity supports infection—always
      shield or release beneficials when treating hotspots only.
    biological_controls: Encarsia and Eretmocerus parasitoids, lacewings, minute pirate bugs, and lady beetles—preserve them
      with selective timing and partial-row treatment.
    cultural_practices: Time planting to avoid peak migration if known locally; reduce dust on leaves along roads; avoid over-fertilization
      that produces succulent growth.
    mechanical_physical: Yellow sticky traps for monitoring; high-pressure water can knock down adults on sturdy plants.
    preventive_methods: Control alternate hosts near fields; scout undersides early in the season; maintain hedgerows that
      support generalist predators without harboring pest reservoirs.
  natural_enemies:
  - Encarsia spp.
  - Eretmocerus spp.
  - Green lacewings
  - Minute pirate bugs
