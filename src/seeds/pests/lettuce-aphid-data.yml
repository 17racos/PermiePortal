---
- name: Lettuce Aphid
  slug: lettuce-aphid
  picture: lettuce_aphid.jpg
  scientific_name: Nasonovia ribisnigri
  description: A blue-green to olive aphid that colonizes lettuce heads, endive, escarole, and related composites—often
    deep inside wrapper leaves where washing misses it. Feeding causes stunting, contamination, and rejection at market;
    it tolerates cool weather better than many aphids, so it dominates in spring and fall tunnels and coastal fields.
    Worldwide distribution includes intensive production zones across the United States, Mexico, Central America, and
    Andean cool highlands wherever lettuce ships year-round—roughly zones 3–11 in field contexts, with greenhouse pressure
    beyond.
  characteristics: Adults and nymphs are somewhat tuberculate and waxy, often hiding near the meristem and heart. Cornicles
    are short and dark; antennae are long relative to green peach aphid. Winged forms disperse between blocks—sticky cards
    in tunnels spike before colonies explode inward.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil with high-pressure rinse opens rosettes enough for contact;
      repeat every 2–3 days while migrating alates arrive. Neem and azadirachtin reduce reproduction on outer leaves. Avoid
      spraying open lettuce flowers if bolting plants are near insectary rows; dawn or dusk applications reduce bee
      overlap on adjacent crops.
    biological_controls: Aphidius spp., Aphelinus spp., and generalist predators such as syrphid larvae and minute pirate
      bugs attack lettuce aphid in open heads if outer leaves are not stripped too aggressively. Banker plants in greenhouses
      support parasitoids when compatible with food safety plans.
    cultural_practices: Choose resistant cultivars where seed is available for your market class. Increase between-row
      airflow in tunnels to reduce humid pockets aphids love. Remove cull piles and bolting lettuce at field edges that
      host winged stages.
    mechanical_physical: For small plantings, submerge harvested heads briefly in cold water with gentle agitation—this
      is post-harvest quality control, not a field fix. Blowers and leaf separators in pack sheds remove some aphids after
      careful wash line design.
    preventive_methods: Scout hearts twice weekly by peeling two wrapper leaves on sample plants. Blue sticky traps at
      tunnel doors track incoming flights. Rotate tunnel houses with a host-free break when possible to starve residual
      populations.
  affected_plants:
  - slug: iceberg-lettuce
    name: Iceberg Lettuce
  - slug: miners-lettuce
    name: Miner's Lettuce
  - slug: western-miners-lettuce
    name: Western miner's lettuce
  natural_enemies:
  - Aphidius spp. (Braconidae)
  - Aphelinus spp.
  - Syrphid Fly Larvae (Syrphidae)
  - Minute Pirate Bugs (Orius spp.)
