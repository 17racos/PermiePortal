---
- name: Lettuce Aphid
  slug: lettuce-aphid
  picture: lettuce_aphid.jpg
  scientific_name: Nasonovia ribisnigri
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, lettuce aphid may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Insecticidal soap or horticultural oil with high-pressure rinse opens rosettes enough for contact; repeat
      every 2–3 days while migrating alates arrive. Neem and azadirachtin reduce reproduction on outer leaves. Avoid spraying
      open lettuce flowers if bolting plants are near insectary rows; dawn or dusk applications reduce bee overlap on adjacent
      crops.
    biological_controls: Aphidius spp., Aphelinus spp., and generalist predators such as syrphid larvae and minute pirate
      bugs attack lettuce aphid in open heads if outer leaves are not stripped too aggressively. Banker plants in greenhouses
      support parasitoids when compatible with food safety plans.
    cultural_practices: Choose resistant cultivars where seed is available for your market class. Increase between-row airflow
      in tunnels to reduce humid pockets aphids love. Remove cull piles and bolting lettuce at field edges that host winged
      stages.
    mechanical_physical: For small plantings, submerge harvested heads briefly in cold water with gentle agitation—this is
      post-harvest quality control, not a field fix. Blowers and leaf separators in pack sheds remove some aphids after careful
      wash line design.
    preventive_methods: Scout hearts twice weekly by peeling two wrapper leaves on sample plants. Blue sticky traps at tunnel
      doors track incoming flights. Rotate tunnel houses with a host-free break when possible to starve residual populations.
