---
- name: Kudzu Bug
  slug: kudzu-bug
  picture: kudzu_bug.jpg
  scientific_name: Megacopta cribraria
  description: A small mottled brown plataspid bug that feeds on legumes including kudzu, soybeans, and wisteria, and aggregates
    on houses in fall. On beans it can reduce yield; some people have skin irritation from contact.
  characteristics: Broadly oval, slightly wider at the rear, with a noticeable 'hump' profile. Nymphs are round and red-marked
    before darkening.
  control_methods:
    preventive_methods: Seal home gaps in fall; remove nearby kudzu and early-season wisteria hosts when feasible.
    biological_controls: Parasitoid wasps (e.g., Paratelenomus saccharalis) have followed the pest into North America; avoid
      sprays during peak parasitism.
    cultural_practices: Early-planted trap crops of preferred legumes can concentrate bugs for vacuum or removal before main
      crop flowering.
    mechanical_physical: Soapy water traps under aggregated shrubs; shop-vac for porch swarms.
    organic_sprays: Neem or pyrethrin (botanical) on legume crops only when thresholds warrant and label allows; scout for
      beneficials first.
  natural_enemies:
  - Parasitoid Wasps
  - Assassin Bugs
