---
- name: Kudzu Bug
  slug: kudzu-bug
  picture: kudzu_bug.jpg
  scientific_name: Megacopta cribraria
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, kudzu bug may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Seal home gaps in fall; remove nearby kudzu and early-season wisteria hosts when feasible.
    biological_controls: Parasitoid wasps (e.g., Paratelenomus saccharalis) have followed the pest into North America; avoid
      sprays during peak parasitism.
    cultural_practices: Early-planted trap crops of preferred legumes can concentrate bugs for vacuum or removal before main
      crop flowering.
    mechanical_physical: Soapy water traps under aggregated shrubs; shop-vac for porch swarms.
    organic_sprays: Neem or pyrethrin (botanical) on legume crops only when thresholds warrant and label allows; scout for
      beneficials first.
  natural_enemies:
  - Parasitoid Wasps
  - Assassin Bugs
