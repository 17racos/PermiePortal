---
- name: Parsnip Canker
  slug: parsnip-canker
  picture: parsnip_canker.jpg
  scientific_name: Sclerotinia sclerotiorum
  description: Parsnip Canker is a fungal disease affecting parsnip plants, causing sunken, discolored lesions on stems and
    roots. It leads to tissue decay and plant collapse if not managed.
  characteristics: The disease is characterized by dark, water-soaked lesions that eventually turn dry and brittle. Infected
    areas may develop a fuzzy mycelium, and the damage disrupts the plant’s vascular system.
  control_methods:
    preventive_methods: Practice crop rotation, ensure proper soil drainage, and avoid overwatering to prevent conditions
      favorable to infection.
    biological_controls: Introduce antagonistic microbes and beneficial fungi that compete with the pathogen.
    cultural_practices: Remove and destroy infected plant material and sanitize gardening tools between uses.
    mechanical_physical: Employ physical barriers in high-risk areas and remove plant debris promptly.
    organic_sprays: Use copper-based organic fungicides or neem oil at early signs of infection to curb disease development.
  natural_enemies:
  - Beneficial Fungi
  - Antagonistic Bacteria
