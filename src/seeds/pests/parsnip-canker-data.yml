---
- name: Parsnip Canker
  slug: parsnip-canker
  picture: parsnip_canker.jpg
  scientific_name: Sclerotinia sclerotiorum
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, parsnip canker may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Practice crop rotation, ensure proper soil drainage, and avoid overwatering to prevent conditions
      favorable to infection.
    biological_controls: Introduce antagonistic microbes and beneficial fungi that compete with the pathogen.
    cultural_practices: Remove and destroy infected plant material and sanitize gardening tools between uses.
    mechanical_physical: Employ physical barriers in high-risk areas and remove plant debris promptly.
    organic_sprays: Use copper-based organic fungicides or neem oil at early signs of infection to curb disease development.
  natural_enemies:
  - Beneficial Fungi
  - Antagonistic Bacteria
