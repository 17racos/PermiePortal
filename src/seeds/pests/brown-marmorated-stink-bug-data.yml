---
- name: Brown Marmorated Stink Bug
  slug: brown-marmorated-stink-bug
  picture: brown_marmorated_stink_bug.jpg
  scientific_name: Halyomorpha halys
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, brown marmorated stink bug may
    already be on the plant. This pest often builds quietly, then damage appears all at once.
    Feeding stress weakens growth, reduces yield, and opens the door to secondary disease. Early
    cleanup is much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Pyrethrin, neem, or kaolin clay can deter feeding and must be applied with excellent coverage to fruit
      zones; reapply after rain. Insecticidal soap has limited effect on adults but can suppress nymphs on tender growth.
      Rotate materials and respect pre-harvest intervals on edible crops.
    biological_controls: Native parasitoids such as Trissolcus spp. (egg parasitoid wasps) attack eggs where established;
      generalist predators including spiders, assassin bugs, and birds take nymphs. Avoid orchard-wide sprays that flatten
      beneficial complexes during egg-laying windows.
    cultural_practices: Plant perimeter trap crops of sunflower, sorghum, or millet to concentrate bugs away from high-value
      rows; destroy or mow trap strips after peak aggregation. Manage weedy hosts along field edges. Harvest tree fruit promptly
      when monitors show rising captures—delayed picking accumulates stink bug injury.
    mechanical_physical: Shake adults and nymphs from shrubs into a wide bucket of soapy water during cool mornings. Fine
      exclusion netting on high tunnels and individual fruit trees reduces oviposition when vents are managed for heat. Sticky
      monitoring traps help time sprays without replacing scouting on fruit.
    preventive_methods: Deploy pheromone-baited traps where legal and available to track adult movement into blocks. Seal
      homes and outbuildings before fall flights. Keep detailed maps of hot spots—BMSB uses the same sun-warmed fence lines
      year after year.
