---
- name: Spiraling Whitefly
  slug: spiraling-whitefly
  picture: spiraling_whitefly.webp
  scientific_name: Aleurodicus dispersus
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, spiraling whitefly
    may already be feeding. The larval stage does most of the damage, often hidden where you
    cannot see it at first glance. By the time yellowing or rot appears, feeding may be well
    underway. Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Thorough coverage with insecticidal soap or horticultural oil on new flushes—repeat on crawler peaks;
      neem can reduce feeding—expect multiple applications on dense wax.
    biological_controls: Coccinellids such as Nephaspis oculatus and parasitic fungi in humid microclimates; conserve generalist
      predators by avoiding calendar sprays.
    cultural_practices: Prune out heavily infested fronds or branches when feasible; improve air movement in canopy interiors;
      avoid overhead patterns that leave prolonged leaf wetness without benefit.
    mechanical_physical: Water wash of accessible foliage can dislodge wax and some stages on small plants; pressure-wash
      trucks not included.
    preventive_methods: Inspect new landscape material; isolate suspect plants; remove abandoned hosts that bridge generations.
  natural_enemies:
  - Nephaspis oculatus
  - Generalist lady beetles
  - Lacewings
