---
- name: Mango Seed Weevil
  slug: mango-seed-weevil
  picture: mango_seed_weevil.jpg
  scientific_name: Sternochetus mangiferae
  description: Curculionid weevil whose grub completes development inside the mango seed while the fruit still looks fine
    on the tree—international quarantine pest because larvae survive in shipped fruit. Exit holes may appear only after ripening.
  characteristics: Adults are dark gray-brown with a long snout; females drill into young fruit to lay eggs. Infested seeds
    are hollowed to powder; multiple larvae can share one seed in heavy pressure.
  control_methods:
    organic_sprays: Neem seed kernel extracts or azadirachtin timed to peak adult activity and flush can reduce oviposition;
      pyrethrum bursts for knockdown where permitted—coverage of inflorescences and pea-sized fruit is critical.
    biological_controls: Ant predation on adults is inconsistent; research releases of parasitoids are regional—home orchards
      rely more on sanitation and timing.
    cultural_practices: Remove fallen fruit weekly; destroy infested fruit off-site; prune to manageable height for thorough
      coverage; harvest prompt to shorten window for late oviposition.
    mechanical_physical: Bagging fruit in areas where labor is cheap; pheromone trapping for monitoring where lures exist.
    preventive_methods: Do not move fruit from quarantine zones; hot-water treatment protocols exist for commercial disinfestation—not
      a backyard project.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Ants
  - Carabid Beetles
