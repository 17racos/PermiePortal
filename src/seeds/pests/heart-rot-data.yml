---
- name: Heart Rot
  slug: heart-rot
  picture: heart_rot.jpg
  scientific_name: Ganoderma zonatum (palms); other wood-decay basidiomycetes on trees
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, heart rot may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    biological_controls: >-
      Start by protecting leaf-surface microbes and predators that naturally suppress disease spread. Keep flowering strips with dill, yarrow, alyssum, and cilantro nearby so hoverflies, lacewings, and parasitoids stay active against the insects that open infection wounds. Add microbial inoculants like Bacillus subtilis or Trichoderma at first symptom, then wait 48 hours before layering more treatments so you can see whether biology is already reducing new lesions.
    preventive_methods: >-
      This problem usually explodes when leaves stay wet for long periods, airflow is poor, and plants are pushed with excess nitrogen into soft growth that infects easily. Water the soil early in the day, not the foliage at night, and keep mulch from touching stems so humidity does not sit on tissue. Treat the first two to three spots as an outbreak warning, because spores or bacteria can cycle fast and turn one patch into field-wide infection in under a week.
    cultural_practices: >-
      Remove the worst infected leaves first and bag them immediately so you are not shaking spores across healthy plants. Thin crowded canopies, prune crossing branches, and space replacements so leaves dry quickly after rain or dew. Rotate susceptible crops for at least one season and avoid planting the same host family back-to-back, because many disease organisms survive in debris and splash back onto new growth.
    mechanical_physical: >-
      Prune at least 6 inches below visible symptoms with clean tools, then disinfect blades between cuts so you do not spread infection plant to plant. For low-level pressure, strip isolated lesions and improve airflow; for fast-moving lesions on multiple plants, mechanical removal alone is not enough. Escalate to targeted organic sprays when new spots keep appearing after two cleanup rounds within the same week.
    organic_sprays: >-
      Use potassium bicarbonate at 1 tablespoon per gallon as a knockdown spray, or wettable sulfur where label-safe, and cover both leaf surfaces until just before runoff. Apply at dusk or early morning when sun is mild, then repeat every 5-7 days while new symptoms appear. Do not spray oils within two weeks of sulfur, and keep sprays off open flowers and active beneficial-insect habitat because repeated broad coverage can disrupt pollinators and microbial balance.
  natural_enemies:
  - Competitive Saprotrophic Fungi
  - Trichoderma spp.
