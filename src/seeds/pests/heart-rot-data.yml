---
- name: Heart Rot
  slug: heart-rot
  picture: heart_rot.webp
  scientific_name: Ganoderma zonatum (palms); other wood-decay basidiomycetes on trees
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, heart rot may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: No spray fixes hollow wood—copper or phosphite tools sometimes support palm health debates, but removal
      of hazard trees is the honest organic move when load-bearing tissue is gone.
    biological_controls: Competitive fungi like Trichoderma spp. are researched for wound protection—not a cure for advanced
      decay; keep expectations soil-level.
    cultural_practices: Avoid trunk wounds from mowers, spikes, or lion-tailing palms; maintain drainage; do not pile soil
      or mulch against bark or palm boots.
    mechanical_physical: Remove and replace hazard specimens; chip infested wood off-site; sterilize chains between cuts if
      moving between healthy and sick trees.
    preventive_methods: Inspect bases after storms; never plant a new palm over old palm roots—Ganoderma persists in stumps
      and root pieces.
  natural_enemies:
  - Competitive Saprotrophic Fungi
  - Trichoderma spp.
