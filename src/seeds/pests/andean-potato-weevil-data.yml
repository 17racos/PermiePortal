---
- name: Andean Potato Weevil
  slug: andean-potato-weevil
  picture: andean_potato_weevil.webp
  scientific_name: Premnotrypes suturicallus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    andean potato weevil may be the cause. Adults chew above ground while larvae often feed out
    of sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when
    roots are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    organic_sprays: Neem-based products and entomopathogenic fungi (Beauveria bassiana, Metarhizium) directed at adults on
      foliage and at soil-contact stages—repeat after rain when labels allow.
    biological_controls: Entomopathogenic nematodes (Steinernema, Heterorhabditis) against pupae and larvae in moist soil;
      preserve ground beetles and field crickets that scavenge eggs and weak adults.
    cultural_practices: Deep plowing or timely tillage to bury adults; rotate out of solanaceae; use clean seed tubers; harvest
      promptly and remove cull piles; solarize or flood fields where feasible in highland systems.
    mechanical_physical: Trenches with vertical plastic barriers; hand collection at peak adult flights; sift soil from infested
      lots before moving machinery.
    preventive_methods: Quarantine seed potatoes; pheromone or food-baited traps for monitoring; destroy volunteer potatoes
      that bridge generations.
  natural_enemies:
  - Ground Beetles (Carabidae)
  - Entomopathogenic Nematodes
  - Entomopathogenic Fungi
