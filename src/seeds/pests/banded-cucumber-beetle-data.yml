---
- name: Banded Cucumber Beetle
  slug: banded-cucumber-beetle
  picture: banded_cucumber_beetle.jpg
  scientific_name: Diabrotica balteata
  description: A greenish beetle with cream or yellow bands across the wing covers, common in the southern United States and
    tropics. Adults chew leaves and transmit bacterial wilt in cucurbits; larvae feed on roots and tubers.
  characteristics: About 6–7 mm, longitudinal bands may be partial; looks similar to striped cucumber beetle but banding pattern
    differs. Larvae are thin white wireworms with dark heads.
  control_methods:
    preventive_methods: Use floating row cover until pollination; delay planting slightly to pass early adult peak where feasible.
    biological_controls: Beneficial nematodes (Steinernema spp.) against soil larvae; Microsporidian pathogens occur in populations.
    cultural_practices: Trap crop with preferred squash or blue hubbard; rotate away from cucurbits; clean debris to reduce
      overwintering.
    mechanical_physical: Sticky traps or yellow cups with soapy water; hand-pick adults evenings.
    organic_sprays: Kaolin clay on leaves reduces feeding; spinosad or neem for adults—reapply after rain.
  natural_enemies:
  - Beneficial Nematodes
  - Ground Beetles
  - Braconid Wasps
