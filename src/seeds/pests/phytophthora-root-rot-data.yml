---
- name: Phytophthora Root Rot
  slug: phytophthora-root-rot
  picture: phytophthora_root_rot.jpg
  scientific_name: Phytophthora spp.
  description: Aggressive oomycete root and crown rots affecting avocado, citrus, tomato, pepper, raspberry, and landscape
    trees—often tied to prolonged wet crowns, heavy clay, or contaminated surface water. Aboveground symptoms mimic drought
    or salinity.
  characteristics: Dark necrotic lesions advancing up the crown; fine roots absent; outer xylem stains in cross-section on
    woody hosts. Zoospores swim to new infection sites in standing water.
  control_methods:
    organic_sprays: Copper hydroxide on crowns of woody plants where labeled; phosphorous acid (phosphite) trunk injections
      or foliar/crown sprays on some crops as a systemic trigger of host defenses—follow organic certification rules.
    biological_controls: Compost teas and Trichoderma drenches show variable suppression; combine with cultural fixes or you
      are rearranging deck chairs.
    cultural_practices: Plant on mounds; redirect runoff; use clean mulch away from trunks; graft onto tolerant rootstocks;
      avoid over-irrigation; choose well-drained sites.
    mechanical_physical: Remove soil from infected crowns carefully, air-dry briefly where appropriate, then replace with
      clean mulch—paired with irrigation changes.
    preventive_methods: Buy certified clean nursery stock; test irrigation sources; do not propagate from known-positive blocks.
  natural_enemies:
  - Trichoderma asperellum
  - Streptomyces spp.
  - Competitive Saprophytes
