---
- name: Boxelder Bug
  slug: boxelder-bug
  picture: boxelder_bug.jpg
  scientific_name: Boisea trivittata
  description: A flat, elongate true bug that feeds on developing seeds of boxelder and other maples, plus occasionally fruits
    of apple, cherry, plum, and grape. Outdoors it is mostly a nuisance; feeding can cause leaf stippling, fruit dimpling,
    or seed abortion when numbers are high. The real drama is mass aggregation on sunny walls in late summer and fall, when
    adults seek overwintering cracks—common across temperate North America and into Mexico wherever host maples occur, roughly
    zones 3–10. It does not breed indoors but stains surfaces and startles people when it wanders inside.
  characteristics: Adults are about 1/2 inch (12 mm), black with red-orange lines on thorax and wing margins; nymphs are bright
    red when small, darkening with wing pads as they molt. They cluster openly on trunks, fences, and structures. Western
    boxelder bug (Boisea rubrolineata) looks similar in western regions—same management principles apply.
  control_methods:
    organic_sprays: Exterior applications of insecticidal soap or horticultural oil can knock down aggregations on siding
      and foundation plantings when thorough contact is achieved; repeat after rain. Diatomaceous earth dusts labeled for
      perimeter use may reduce insects crawling through dry cracks—avoid inhalation and follow label placement. Indoor sprays
      are rarely justified; vacuuming is safer and faster.
    biological_controls: Birds, spiders, and predatory ground beetles take some individuals, but natural enemies rarely collapse
      large outdoor aggregations. Encouraging diverse yard habitat still trims steady pressure on nymph clusters on seed-bearing
      maples.
    cultural_practices: Remove female boxelder trees near homes if replacements are acceptable—seedless cultivars greatly
      reduce breeding sites. Rake and compost fallen samaras to lower nymph food near patios. On orchards adjacent to maples,
      harvest promptly and remove ground fruit to avoid secondary congregation points.
    mechanical_physical: Vacuum or sweep adults and nymphs from living spaces and sun-warmed walls into soapy water. Seal
      exterior gaps around windows, vents, and siding with caulk or fine mesh before late summer flights. Heat-treat or sun-dry
      stored items that harbor overwintering adults in sheds.
    preventive_methods: Plan exterior repairs in late winter before spring sun draws bugs to warm surfaces. Turn off bright
      night lighting near doors during peak flight weeks. Teach clients that boxelder bugs are not structural destroyers—management
      targets comfort, not tree mortality.
