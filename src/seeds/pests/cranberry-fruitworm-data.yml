---
- name: Cranberry Fruitworm
  slug: cranberry-fruitworm
  picture: cranberry_fruitworm.jpg
  scientific_name: Acrobasis vaccinii
  description: A cranberry specialist whose larvae web blossom clusters and bore fruit, stitching berries with silk and frass—your
    pick for ‘why my berries are glued together.’ Moths fly in early summer when bog temperatures stabilize.
  characteristics: Small gray moths; pinkish larvae with dark heads tunnel flowers and green berries. Infested clusters turn
    brown and may hang on vines as flagging flags for scouts.
  control_methods:
    organic_sprays: Bacillus thuringiensis kurstaki or spinosad during early bloom to petal fall when eggs hatch—coverage
      into the canopy is critical on low vines.
    biological_controls: Trichogramma releases target eggs in IPM bogs; braconid parasitoids of caterpillars—preserve with
      selective spray windows.
    cultural_practices: Increase flooding duration where regulations allow to kill overwintering larvae; remove wild blueberry/vaccinium
      hosts near edges; synchronize bee-safe spray timing.
    mechanical_physical: Vacuum or sweep adults at lights in research settings—impractical at scale but amusing at parties.
    preventive_methods: Pheromone traps for biofix; scout for webbed tips and entry holes before larvae move into multiple
      berries.
  natural_enemies:
  - Trichogramma spp.
  - Braconid Wasps
  - Ground Beetles (Carabidae)
