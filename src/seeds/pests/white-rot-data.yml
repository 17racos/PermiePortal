---
- name: White Rot
  slug: white-rot
  picture: white_rot.jpg
  scientific_name: Sclerotinia sclerotiorum
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, white rot may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Maintain proper spacing, reduce excess moisture, and remove infected plant debris to lower the fungal
      inoculum.
    biological_controls: Encourage antagonistic microbes and beneficial fungi that inhibit Sclerotinia sclerotiorum growth.
    cultural_practices: Practice crop rotation, choose resistant varieties, and avoid overhead irrigation to reduce leaf wetness.
    mechanical_physical: Promptly remove and destroy infected tissues and use physical barriers in high-risk areas.
    organic_sprays: Apply organic fungicides such as copper-based products, sulfur, or bicarbonate solutions at the early
      stages of infection.
  natural_enemies:
  - Beneficial Microbes
  - Antagonistic Fungi
