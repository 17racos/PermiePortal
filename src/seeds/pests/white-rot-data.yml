---
- name: White Rot
  slug: white-rot
  picture: white_rot.jpg
  scientific_name: Sclerotinia sclerotiorum
  description: White Rot is a fungal disease that affects a wide range of plants, characterized by a white, cottony mold that
    leads to tissue decay. It can affect stems, leaves, and roots, severely weakening plant health.
  characteristics: The fungus produces a distinctive white, fluffy mycelium and forms hard, black sclerotia on infected tissues.
    As the disease progresses, plant parts become water-soaked, soft, and ultimately collapse.
  control_methods:
    preventive_methods: Maintain proper spacing, reduce excess moisture, and remove infected plant debris to lower the fungal
      inoculum.
    biological_controls: Encourage antagonistic microbes and beneficial fungi that inhibit Sclerotinia sclerotiorum growth.
    cultural_practices: Practice crop rotation, choose resistant varieties, and avoid overhead irrigation to reduce leaf wetness.
    mechanical_physical: Promptly remove and destroy infected tissues and use physical barriers in high-risk areas.
    organic_sprays: Apply organic fungicides such as copper-based products, sulfur, or bicarbonate solutions at the early
      stages of infection.
  natural_enemies:
  - Beneficial Microbes
  - Antagonistic Fungi
