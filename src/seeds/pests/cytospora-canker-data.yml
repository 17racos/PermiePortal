---
- name: Cytospora Canker
  slug: cytospora-canker
  picture: cytospora_canker.jpg
  scientific_name: Cytospora spp.
  description: Cytospora Canker is a fungal disease affecting stressed woody plants and trees, identified by sunken, discolored
    bark lesions. These cankers often exude sap or resin and cause girdling, resulting in branch dieback or even tree death.
  characteristics: Cytospora infections create distinctive elongated, sunken areas on tree bark, often leaking a gummy sap
    or amber-colored resin. It primarily attacks trees already under stress from drought, injury, or poor management.
  control_methods:
    preventive_methods: Promote optimal tree health through proper watering, balanced nutrition, avoiding injury to bark,
      and regular monitoring for early detection of infections.
    biological_controls: Use beneficial microbes like Trichoderma spp. to suppress the fungal pathogens naturally.
    cultural_practices: Promptly prune and remove infected limbs to reduce disease spread. Avoid overcrowding plants to improve
      airflow and reduce humidity around susceptible plants.
    mechanical_physical: Sterilize pruning tools between cuts and remove infected debris promptly from the garden area.
    organic_sprays: Apply neem oil treatments at early signs of infection to inhibit fungal growth and protect surrounding
      healthy tissues.
  natural_enemies:
  - Trichoderma spp.
  - Beneficial Soil Microbes
