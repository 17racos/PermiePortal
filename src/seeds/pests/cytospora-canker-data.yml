---
- name: Cytospora Canker
  slug: cytospora-canker
  picture: cytospora_canker.webp
  scientific_name: Cytospora spp.
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, cytospora canker may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Promote optimal tree health through proper watering, balanced nutrition, avoiding injury to bark,
      and regular monitoring for early detection of infections.
    biological_controls: Use beneficial microbes like Trichoderma spp. to suppress the fungal pathogens naturally.
    cultural_practices: Promptly prune and remove infected limbs to reduce disease spread. Avoid overcrowding plants to improve
      airflow and reduce humidity around susceptible plants.
    mechanical_physical: Sterilize pruning tools between cuts and remove infected debris promptly from the garden area.
    organic_sprays: Apply neem oil treatments at early signs of infection to inhibit fungal growth and protect surrounding
      healthy tissues.
  natural_enemies:
  - Trichoderma spp.
  - Beneficial Soil Microbes
