---
- name: Sweet Potato Weevil
  slug: sweet-potato-weevil
  picture: sweet_potato_weevil.jpg
  scientific_name: Cylas formicarius
  description: A serious sweet potato pest whose larvae tunnel storage roots and vines, leaving frass, rot, and bitter flavor;
    adults are ant-like snout beetles. Infested roots fail market and home-kitchen tests alike.
  characteristics: Reddish-brown adults about 6 mm long with a narrow snout; legless grubs curve inside roots. Breeds year-round
    in frost-free zones on roots and vines.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Steinernema carpocapsae) to soil targeting pupae near harvest where permitted;
      neem soil drenches show partial suppression in research—combine with sanitation.
    biological_controls: Ant predation on larvae/pupae at soil line; fungal pathogens in moist soils—avoid waterlogging that
      favors rot instead.
    cultural_practices: Use certified slips; deep bury culls; rotate fields; hill soil to cover exposed cracks; harvest on
      time and cure quickly.
    mechanical_physical: Pheromone trapping reduces males in small plots when combined with removal of wild Ipomoea hosts.
    preventive_methods: Eliminate wild morning glories near beds; inspect slips; do not compost infested roots in warm climates.
  natural_enemies:
  - Predatory ants
  - Entomopathogenic nematodes
  - Entomopathogenic fungi
