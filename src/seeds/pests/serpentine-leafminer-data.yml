---
- name: Serpentine Leafminer
  slug: serpentine-leafminer
  picture: serpentine_leafminer.jpg
  scientific_name: Liriomyza trifolii
  description: Tiny fly larvae tunnel between leaf surfaces, leaving pale, winding 'serpentine' mines that widen as the maggot
    grows. Adults are small black-and-yellow agromyzid flies; damage shows up first on lower, sheltered foliage and can stunt
    seedlings.
  characteristics: Mines are narrow trails that snake and often end in a blister; frass appears as dark specks in the tunnel.
    Several Liriomyza species look alike—confirm with host and region—but the signature is always the epidermal leaf mine,
    not holes chewed from the edge.
  control_methods:
    organic_sprays: Insecticidal soap, neem oil, or botanical pyrethrum timed to adult activity can reduce egg-laying; thorough
      coverage of leaf undersides matters more than drenching the canopy once.
    biological_controls: Diglyphus and Chrysonotomyia parasitic wasps attack leafminer larvae inside mines; avoid broad-spectrum
      sprays during peak wasp activity. Minute pirate bugs and lacewings take some eggs and young larvae.
    cultural_practices: Remove and compost or destroy heavily mined leaves; avoid continuous solanaceous or legume blocks
      that let flies build year-round; reflective mulches may disorient some adults in vegetable rows.
    mechanical_physical: Yellow sticky cards near canopy help monitor and knock down adults; row cover over transplants blocks
      oviposition until plants outgrow vulnerable stages.
    preventive_methods: Inspect seedlings and new transplants; quarantine greenhouse starts; keep weeds that host Liriomyza
      mowed or removed around crop edges.
  natural_enemies:
  - Diglyphus isaea
  - Chrysonotomyia punctiventris
  - Minute Pirate Bugs
  - Green Lacewings
