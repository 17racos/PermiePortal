---
- name: Strawberry Root Weevil
  slug: strawberry-root-weevil
  picture: strawberry_root_weevil.jpg
  scientific_name: Otiorhynchus ovatus
  description: A flightless weevil whose whitish larvae chew fine roots and crowns of strawberry, brambles, and some ornamentals,
    while adults notch leaf edges at night. Plants decline in patches, wilt in heat, and produce small fruit before collapsing—symptoms
    mimic root rot until you find crescent feeding on leaves. Common in temperate berry regions of North America—roughly zones
    4–9—and in similar climates in the Andes and Mexican highlands where strawberries are grown on plasticulture or matted
    rows.
  characteristics: Adults are dark, about 1/4 inch (6 mm), with elbowed antennae and fused wing covers—no flight. Feeding
    notches have smooth edges; look with a flashlight after dusk. Larvae are legless, C-shaped, cream-colored grubs in soil
    and crown tissue. Field ID pairs leaf notching with poor row vigor in irregular patches.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Steinernema spp. and Heterorhabditis spp.) applied as drench or through drip
      when soil temperature and moisture match product labels can kill larvae in root zones. Repeat applications are often
      needed in sandy, fast-draining beds.
    biological_controls: Ground beetles, ants, and birds consume adults and some larvae; fungal pathogens occasionally suppress
      weevils in moist soils. Keep flowering groundcovers in drive rows to support generalist predators without letting tall
      weeds shade berries.
    cultural_practices: Rotate strawberry fields to new ground on a planned cycle; avoid bringing infested soil on tools.
      Clean plasticulture between seasons; solarize shallow beds where feasible. Flame or mow old foliage after renovation
      to reduce adult cover, timing to avoid crown damage.
    mechanical_physical: Shake night-feeding adults from canopy edges into soapy trays—feasible on small farms. Fine mesh
      fencing buried a few inches may slow walking adults entering clean blocks; combine with nematodes because fencing alone
      rarely stops established populations.
    preventive_methods: Scout leaf notching weekly after fruit set; sticky bands on legs or posts catch some walkers. Flag
      weak patches for nematode passes before renovation. Inspect nursery plugs for notched leaves at planting.
