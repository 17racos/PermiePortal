---
- name: Harlequin Bug
  slug: harlequin-bug
  picture: harlequin_bug.jpg
  scientific_name: Murgantia histrionica
  description: A striking black-and-orange stink bug specialized on mustards and other brassicas. Both adults and nymphs suck
    sap, causing white blotches, wilting, and seedling death.
  characteristics: Shield-shaped bug about 8–10 mm with bold orange-red and black pattern. Barrel-shaped black-and-white eggs
    in double rows on leaf undersides.
  control_methods:
    preventive_methods: Use row cover over spring brassicas; destroy crop residues where adults overwinter in garden debris.
    biological_controls: Egg parasitoids such as Trissolcus and Telenomus spp. occur; preserve them by avoiding broad-spectrum
      sprays.
    cultural_practices: Trap crop with mustard or rape at field edge; time removal or flame when bugs aggregate.
    mechanical_physical: Hand-pick into soapy water; knock adults into a bucket mornings when sluggish.
    organic_sprays: Insecticidal soap or neem on nymphs with thorough coverage; repeat every few days during outbreaks.
  natural_enemies:
  - Egg Parasitoid Wasps
  - Spiders
  - Birds
