---
- name: Mites
  slug: mites
  picture: mites.jpg
  scientific_name: Acari
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, mites is a
    likely suspect. Mites are tiny but can multiply fast, especially during heat and dry air.
    Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  control_methods:
    preventive_methods: Maintain optimal plant health with balanced watering and fertilization, and inspect plants regularly
      for early signs of mite activity.
    biological_controls: Introduce predatory mites, ladybugs, and lacewings, which naturally suppress harmful mite populations.
    cultural_practices: Improve air circulation through proper spacing and pruning to reduce humidity levels that favor mite
      proliferation.
    mechanical_physical: Use a strong water spray to remove mites from plants and deploy sticky traps to capture dislodged
      individuals.
    organic_sprays: Apply neem oil or insecticidal soap as organic treatments to control mites without harming beneficial
      predators.
  natural_enemies:
  - Predatory Mites
  - Ladybugs
  - Lacewings
