---
- name: Shore Fly
  slug: shore-fly
  picture: shore_fly.jpg
  scientific_name: Scatella stagnalis
  description: Small moth-like flies that breed in algae and biofilm on wet greenhouse floors, capillary mats, and saucers.
    Adults speckle foliage with fly specks and are a nuisance indicator of chronic overwatering, not always direct feeders.
  characteristics: Chunky body, short antennae, wings often spotted or smoky; larvae live in slimy green algae films. Often
    confused with fungus gnats but run on surfaces more like tiny houseflies and associate with standing wet, not just moist
    peat.
  control_methods:
    organic_sprays: Soap or neem directed at adults is secondary—focus on habitat removal; Bacillus thuringiensis israelensis
      drenches target larvae in algae films where labeled for that use.
    biological_controls: Predatory rove beetles (e.g., Dalotia coriaria) and hypoaspis soil mites reduce larvae sharing the
      same algae habitat; nematodes help in some propagation systems.
    cultural_practices: Dry the bench top between waterings; improve drainage; pressure-wash algae from walkways; avoid bottom
      heat that keeps mats soggy.
    mechanical_physical: Yellow sticky cards catch adults for monitoring; vacuum adults during peak emergence in enclosed
      houses.
    preventive_methods: Sterilize reused trays; fix leaks and puddles; keep hose ends off the floor.
  natural_enemies:
  - Dalotia coriaria
  - Stratiolaelaps scimitus
  - Rove Beetles
