---
- name: Shore Fly
  slug: shore-fly
  picture: shore_fly.webp
  scientific_name: Scatella stagnalis
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, shore fly may
    already be feeding. The larval stage does most of the damage, often hidden where you cannot
    see it at first glance. By the time yellowing or rot appears, feeding may be well underway.
    Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    organic_sprays: Soap or neem directed at adults is secondary—focus on habitat removal; Bacillus thuringiensis israelensis
      drenches target larvae in algae films where labeled for that use.
    biological_controls: Predatory rove beetles (e.g., Dalotia coriaria) and hypoaspis soil mites reduce larvae sharing the
      same algae habitat; nematodes help in some propagation systems.
    cultural_practices: Dry the bench top between waterings; improve drainage; pressure-wash algae from walkways; avoid bottom
      heat that keeps mats soggy.
    mechanical_physical: Yellow sticky cards catch adults for monitoring; vacuum adults during peak emergence in enclosed
      houses.
    preventive_methods: Sterilize reused trays; fix leaks and puddles; keep hose ends off the floor.
  natural_enemies:
  - Dalotia coriaria
  - Stratiolaelaps scimitus
  - Rove Beetles
