---
- name: Wireworm
  slug: wireworm
  picture: wireworm.jpg
  scientific_name: Elateridae (larvae; e.g., Agriotes spp.)
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, wireworm may be feeding
    right now. These larvae can eat fast and strip a healthy plant in a short window. Young
    stages are easy to miss, then damage suddenly explodes as they grow. Catch them early to
    avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Entomopathogenic nematodes (Steinernema feltiae/carpocapsae) in moist warm soil; spinosad on bait stations
      or seed treatments where labeled for organic production.
    biological_controls: Ground beetles, spiders, and birds; fungal pathogens (Metarhizium, Beauveria) show variable field
      success—moisture is the gatekeeper.
    cultural_practices: Summer fallow + frequent shallow tillage to desiccate larvae; delay planting until soil warms; convert
      weedy sod slowly—sudden plow is a wireworm invitation.
    mechanical_physical: Flame or solarize seed beds in high tunnels; hand-sort transplants if only a few beds are infested.
    preventive_methods: Soil bioassay with wheat germination or potato baits before committing the heirloom tomatoes.
  natural_enemies:
  - Ground Beetles
  - Entomopathogenic Nematodes
  - Birds
