---
- name: Beet Armyworm
  slug: beet-armyworm
  picture: beet_armyworm.jpg
  scientific_name: Spodoptera exigua
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, beet armyworm may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt aizawai or kurstaki on small larvae; spinosad for tougher instars—penetrate webbed feeding shelters
      with directed spray.
    biological_controls: Nuclear polyhedrosis viruses occur naturally in outbreaks; parasitoids and predators build after
      initial flare—avoid nuking the whole field.
    cultural_practices: Disk or remove residue after harvest; manage weeds that are Spodoptera hosts; avoid staggered lettuce
      that bridges generations.
    mechanical_physical: Hand picking in gardens; flush larvae from crowns with directed water then collect.
    preventive_methods: Pheromone monitoring in commercial settings; scout for egg masses and early webbing.
  natural_enemies:
  - Ichneumonid and braconid parasitoids
  - Tachinid flies
  - Predatory beetles
