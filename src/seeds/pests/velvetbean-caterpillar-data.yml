---
- name: Velvetbean Caterpillar
  slug: velvetbean-caterpillar
  picture: velvetbean_caterpillar.jpg
  scientific_name: Anticarsia gemmatalis
  description: A southern soybean and legume defoliator with a velvet-textured larva that feeds openly on leaflets, sometimes
    leaving only veins. Populations can explode in late summer beans when predators lag.
  characteristics: Bright green to dark larvae with sparse hairs giving a velvety look; narrow yellow stripes along the body;
    adults are dull brown moths with a silvery spot on each forewing.
  control_methods:
    organic_sprays: Bt kurstaki or aizawai while larvae are small; spinosad if thresholds justify and beneficials are considered.
    biological_controls: Nuclear polyhedrosis virus (AgNPV) often crashes outbreaks naturally; preserve infected cadavers
      to spread inoculum.
    cultural_practices: Avoid ultra-late double-cropped beans touching prior infestations; maintain floral resources for parasitoids.
    mechanical_physical: Limited—large acreages rely on biology; garden scale hand pick.
    preventive_methods: Scout undersides of leaflets weekly during pod fill; note migrating moths with light traps.
  natural_enemies:
  - Anticarsia gemmatalis nucleopolyhedrovirus
  - Braconid wasps
  - Predatory bugs
