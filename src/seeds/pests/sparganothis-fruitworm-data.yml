---
- name: Sparganothis Fruitworm
  slug: sparganothis-fruitworm
  picture: sparganothis_fruitworm.jpg
  scientific_name: Sparganothis sulfureana
  description: A tortricid whose larvae bore cranberry berries and web uprights—sulfur-yellow adults give away the species
    name while larvae give away your yield. It overwinters as partially grown larvae in bog litter.
  characteristics: Larvae are greenish with a tan head and tie leaves to fruit; entry holes ooze frass. Second-generation
    larvae often damage mature fruit right before harvest.
  control_methods:
    organic_sprays: Bt kurstaki or spinosad at petal fall and against summer broods—use enough water volume to penetrate vine
      canopy; reapply after heavy rain per label.
    biological_controls: Trichogramma spp. for egg parasitism; larval parasitoids such as Macrocentrus and other braconids—preserve
      with selective timing.
    cultural_practices: Sand covering in winter management can reduce overwintering survival where practiced; remove excessive
      litter in renovation years; synchronize sprays with bee-safe intervals.
    mechanical_physical: Mating disruption with pheromones in large contiguous acres—less feasible on single home bogs.
    preventive_methods: Pheromone traps for biofix and flight peaks; scout fruit for webbing and holes two weeks after catches
      rise.
  natural_enemies:
  - Trichogramma spp.
  - Braconid Wasps
  - Ichneumonid Wasps
