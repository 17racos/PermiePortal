---
- name: Mealybugs
  slug: mealybugs
  picture: mealybugs.jpg
  scientific_name: Pseudococcidae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, mealybugs may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Ensure plants are well-maintained with proper watering and fertilization, and inspect them regularly
      to catch early infestations.
    biological_controls: Promote natural enemies such as ladybugs, lacewings, and parasitic wasps that prey on mealybugs.
    cultural_practices: Practice crop rotation and remove severely infested plant parts to reduce breeding sites.
    mechanical_physical: Wipe off mealybugs with a damp cloth or spray them off with water, and use sticky traps to capture
      mobile stages.
    organic_sprays: Apply insecticidal soap or neem oil to control mealybug populations while preserving beneficial insects.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
