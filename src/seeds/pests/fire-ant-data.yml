---
- name: Fire Ant
  slug: fire-ant
  picture: fire_ant.jpg
  scientific_name: Solenopsis invicta
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, fire ant may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: D-limonene and other botanically derived mound drenches can kill colonies on contact when the entire
      nest is thoroughly soaked per label. Insecticidal soap drenches may suppress shallow nursery mounds. Avoid
      treating near water; repeat checks because satellite mounds often reform after incomplete kill.
    biological_controls: Phorid flies (Pseudacteon spp.) decapitate workers and reduce foraging where established;
      microsporidian pathogens and nematodes (Steinernema spp.) contribute in research and some commercial programs.
      Encourage ant diversity off production blocks so biological pressure on fire ants can build in surrounding rough areas.
    cultural_practices: Deep mulch and steady irrigation away from trunks can favor some ant species—manage moisture to
      avoid seedling collars sitting against constantly damp, ant-friendly berms. Remove crop residues that harbor
      mealybugs and scales ants protect. Rotate field entrances so equipment does not spread mound soil between farms.
    mechanical_physical: Pour boiling water into small, accessible mounds as a non-chemical knockdown when safe and legal
      on the site—scald risk is real, so train crews. Cultivate or slice mounds before planting rows, then monitor for
      relocation. Flood irrigation can drive colonies upward temporarily; follow with targeted treatment if policy allows.
    preventive_methods: Inspect balled-and-burlapped stock and potted liners for ants before shipping. Quarantine new
      compost piles that include sod from infested yards. Post maps of chronic mound lines along fence rows and treat
      early before swarming season.
