---
- name: Caribbean Fruit Fly
  slug: caribbean-fruit-fly
  picture: caribbean_fruit_fly.webp
  scientific_name: Anastrepha suspensa
  description: >-
    If leaves show trails, fruit turns soft, or roots collapse from inside, caribbean fruit fly
    may already be feeding. The larval stage does most of the damage, often hidden where you
    cannot see it at first glance. By the time yellowing or rot appears, feeding may be well
    underway. Move quickly when symptoms begin to prevent another wave of eggs and larvae.
  characteristics: >-
    Watch for tiny eggs near plant tissue, pale legless larvae inside mines or fruit, and sudden
    soft spots or tunnels. Adults are usually small flies that hover or dart when disturbed.
    Check around wounds, blossoms, and moist plant debris where egg-laying is common. Cut open
    suspect tissue: live maggots or fresh tunnels are the clearest field confirmation.
  control_methods:
    preventive_methods: Use regional trapping guidelines; harvest at proper maturity and remove fallen fruit daily; bag fruit
      in high-value plantings.
    biological_controls: Sterile insect technique is area-wide; parasitoid braconids attack larvae in some systems.
    cultural_practices: Clean orchard floor; host-free periods where regulations require; grow early varieties that mature
      before peak fly.
    mechanical_physical: Fruit bagging or fine mesh enclosures on individual trees.
    organic_sprays: Bait sprays combining protein hydrolysate plus approved organic insecticide (e.g., spinosad) target adults—follow
      local extension recipes and organic certification rules.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Ants
