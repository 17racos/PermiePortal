---
- name: Leafrollers
  slug: leafrollers
  picture: leafrollers.jpg
  scientific_name: Tortricidae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, leafrollers may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Maintain vigorous plant health with proper watering and balanced fertilization, and inspect plants
      regularly for early signs of leaf rolling.
    biological_controls: Encourage natural predators such as parasitic wasps, lacewings, and predatory beetles that target
      leafroller larvae.
    cultural_practices: Practice crop rotation and remove rolled leaves to eliminate larval hiding places.
    mechanical_physical: Hand-pick larvae when possible and use row covers during peak periods to prevent adult moths from
      laying eggs.
    organic_sprays: Apply neem oil or insecticidal soap during early infestation to disrupt larval development.
  natural_enemies:
  - Parasitic Wasps
  - Lacewings
  - Predatory Beetles
