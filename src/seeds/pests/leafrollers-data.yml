---
- name: Leafrollers
  slug: leafrollers
  picture: leafrollers.jpg
  scientific_name: Tortricidae
  description: Leafrollers are caterpillars that roll or fold leaves to create a sheltered feeding site. They are commonly
    found on fruit trees and shrubs, and their rolled leaves are a clear sign of infestation.
  characteristics: Typically small and green or brown, these larvae use silk to roll leaves. Their feeding damages the leaf
    structure and reduces photosynthetic capacity, weakening the plant over time.
  control_methods:
    preventive_methods: Maintain vigorous plant health with proper watering and balanced fertilization, and inspect plants
      regularly for early signs of leaf rolling.
    biological_controls: Encourage natural predators such as parasitic wasps, lacewings, and predatory beetles that target
      leafroller larvae.
    cultural_practices: Practice crop rotation and remove rolled leaves to eliminate larval hiding places.
    mechanical_physical: Hand-pick larvae when possible and use row covers during peak periods to prevent adult moths from
      laying eggs.
    organic_sprays: Apply neem oil or insecticidal soap during early infestation to disrupt larval development.
  natural_enemies:
  - Parasitic Wasps
  - Lacewings
  - Predatory Beetles
