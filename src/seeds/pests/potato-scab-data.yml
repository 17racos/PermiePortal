---
- name: Potato Scab
  slug: potato-scab
  picture: potato_scab.jpg
  scientific_name: Streptomyces scabies
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, potato scab may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: No reliable foliar cure; soil applications of competitive microbials (certain Bacillus and Streptomyces
      antagonist products) show variable trial results—read OMRI listings.
    biological_controls: Green manures of mustard or sudangrass biofumigation can suppress inoculum when incorporated properly;
      maintain diverse rotations to build suppressive soil communities.
    cultural_practices: Keep soil pH near 5.2–5.5 for scab-sensitive varieties if crops allow; avoid fresh manure before potatoes;
      use scab-resistant cultivars; ensure consistent soil moisture during tuber initiation.
    mechanical_physical: Increase organic matter to buffer moisture swings; avoid excessive tillage that leaves cloddy dry
      pockets around young tubers.
    preventive_methods: Use certified seed; lengthen rotation away from potatoes and beets; irrigate during knobby tuber formation
      in dry springs.
  natural_enemies:
  - Antagonistic Streptomyces spp.
  - Competitive Bacillus spp.
