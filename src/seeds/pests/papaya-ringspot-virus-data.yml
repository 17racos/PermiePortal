---
- name: Papaya Ringspot Virus
  slug: papaya-ringspot-virus
  picture: papaya_ringspot_virus.jpg
  scientific_name: Papaya ringspot virus (PRSV; genus Potyvirus)
  description: A potyvirus spread by aphids in non-persistent fashion—meaning it hitchhikes on stylets for minutes, not lifetimes.
    Leaves show mosaic, shoestring distortion, and water-soaked rings; fruit develops ugly circular scars that scream ‘unmarketable.’
  characteristics: Symptoms vary with strain (P vs W biotypes) and host age; young plants can stunt severely. Because spread
    is aphid-driven, insecticides do little; the virus moves plot-to-plot on tools and infected planting material too.
  control_methods:
    organic_sprays: Kaolin clay on foliage can reduce probing by aphids; neem or soap are marginal for non-persistent viruses—use
      them as part of general aphid suppression, not as a cure.
    biological_controls: Parasitic wasps, ladybugs, lacewings, and hoverflies that knock down aphid numbers indirectly lower
      probing events; preserve them by avoiding broad-spectrum sprays.
    cultural_practices: Plant upwind of infection sources; use tall non-host barriers; rogue infected plants immediately;
      time plantings to avoid peak aphid flights; in commercial systems transgenic resistance exists—home growers rely on
      hygiene and timing.
    mechanical_physical: Fine insect netting over tunnels excludes aphid vectors on small plots; reflective mulches may repel
      some alate aphids.
    preventive_methods: Start with virus-indexed seed and tissue culture plants; disinfect tools; eliminate volunteer papayas
      and wild cucurbit reservoirs near the field.
  natural_enemies:
  - Parasitic Wasps (Aphidiinae)
  - Ladybugs
  - Lacewings
  - Hoverfly Larvae
