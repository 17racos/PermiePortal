---
- name: Blackberry Psyllid
  slug: blackberry-psyllid
  picture: blackberry_psyllid.jpg
  scientific_name: Cacopsylla curvata
  description: A tiny sap-feeding true bug related to aphids that specializes on Rubus—blackberries, raspberries, and
    hybrids. Nymphs and adults pierce young growth, causing leaf cupping, bronzing, and stunted canes; severe infestations
    reduce fruiting wood the next season. It overwinters on conifers such as Douglas-fir and western redcedar in parts of
    its range, migrating to brambles in spring—patterns vary, but damage shows up wherever brambles meet suitable conifer
    shelter across temperate North America and similar climates in Central America at elevation. Affects production from
    roughly zones 5–9 where both hosts coexist.
  characteristics: Adults are small (~1/8 inch / 3 mm), holding roof-like wings over a wedge-shaped body; nymphs are flat,
    yellow to green, and produce waxy pellets. Damage is diagnostic—tightly curled leaf margins on primocanes with living
    insects inside folds. Jumping when disturbed separates psyllids from slower aphids.
  control_methods:
    organic_sprays: Narrow-range horticultural oil or insecticidal soap directed into new leaf curls can reach nymphs if
      applied when colonies are young; thorough wetting is essential. Azadirachtin may reduce feeding on tender growth.
      Time sprays to avoid peak pollinator activity on flowering brambles and follow label PHI for fruiting canes.
    biological_controls: Generalist predators including lacewing larvae, minute pirate bugs (Orius spp.), and spiders hunt
      psyllids in curled leaves. Syrphid and predatory mirid bugs contribute in diversified plantings. Avoid broad-spectrum
      organic knockdowns during early nymph flushes when predators are establishing.
    cultural_practices: Separate new bramble plantings from dense conifer windbreaks where local biology ties the pest to
      winter conifers; mixed farmscapes can still work with wider spacing and diverse row ends. Prune and destroy
      severely cupped primocane tips to remove broods when infestation is localized. Maintain cane vigor with balanced
      fertility so plants outgrow light damage.
    mechanical_physical: Pinch and remove the earliest curled tips on a few canes and inspect—if nymphs are abundant,
      continue tipping on small plantings to lower reproduction. Row covers on first-year plantings can exclude migrants
      until canes harden, if supports allow daily venting on hot days.
    preventive_methods: Scout weekly from bud break through early summer, focusing primocane tips near conifers. Flag blocks
      that cupped last year for earlier walks the next season. Do not import nursery canes with tight curls without
      quarantine inspection.
  natural_enemies:
  - Minute Pirate Bugs (Orius spp.)
  - Lacewing larvae (Chrysopidae)
  - Orb-weaver and Crab Spiders
  - Syrphid Fly Larvae (Syrphidae)
