---
- name: Blackberry Psyllid
  slug: blackberry-psyllid
  picture: blackberry_psyllid.jpg
  scientific_name: Cacopsylla curvata
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, blackberry psyllid may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Narrow-range horticultural oil or insecticidal soap directed into new leaf curls can reach nymphs if applied
      when colonies are young; thorough wetting is essential. Azadirachtin may reduce feeding on tender growth. Time sprays
      to avoid peak pollinator activity on flowering brambles and follow label PHI for fruiting canes.
    biological_controls: Generalist predators including lacewing larvae, minute pirate bugs (Orius spp.), and spiders hunt
      psyllids in curled leaves. Syrphid and predatory mirid bugs contribute in diversified plantings. Avoid broad-spectrum
      organic knockdowns during early nymph flushes when predators are establishing.
    cultural_practices: Separate new bramble plantings from dense conifer windbreaks where local biology ties the pest to
      winter conifers; mixed farmscapes can still work with wider spacing and diverse row ends. Prune and destroy severely
      cupped primocane tips to remove broods when infestation is localized. Maintain cane vigor with balanced fertility so
      plants outgrow light damage.
    mechanical_physical: Pinch and remove the earliest curled tips on a few canes and inspect—if nymphs are abundant, continue
      tipping on small plantings to lower reproduction. Row covers on first-year plantings can exclude migrants until canes
      harden, if supports allow daily venting on hot days.
    preventive_methods: Scout weekly from bud break through early summer, focusing primocane tips near conifers. Flag blocks
      that cupped last year for earlier walks the next season. Do not import nursery canes with tight curls without quarantine
      inspection.
