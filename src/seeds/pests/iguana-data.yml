---
- name: Iguana
  slug: iguana
  picture: iguana.jpg
  scientific_name: Iguana iguana
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, iguana may already be on the plant.
    This pest often builds quietly, then damage appears all at once. Feeding stress weakens
    growth, reduces yield, and opens the door to secondary disease. Early cleanup is much easier
    than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: '- Install barriers such as wire mesh or fencing to prevent iguanas from entering gardens. - Maintain
      a clean yard, removing fallen fruit and dense vegetation that may attract iguanas. - Use motion-activated sprinklers
      to deter iguanas from foraging in key areas. - Reduce water sources since iguanas are drawn to ponds, birdbaths, and
      other water bodies.

      '
    biological_controls: '- Encourage the presence of natural predators like birds of prey (hawks, owls) and large snakes.
      - Promote the presence of domesticated pets such as dogs, which can help deter iguanas.

      '
    cultural_practices: '- Plant iguana-resistant species such as citrus, tough-leaved plants, crops like onions, garlic,
      lemongrass, and strong-smelling herbs (they dislike these). - Use sacrificial plants like hibiscus or certain leafy
      greens to divert iguana feeding away from crops.

      '
    mechanical_physical: '- Install tree guards around trunks to prevent climbing. - Use netting or chicken wire to protect
      vulnerable crops. - Apply reflective objects, such as aluminum foil or CDs, to scare iguanas away.

      '
    organic_sprays: '- Spray a mixture of garlic, hot pepper, and vinegar around garden beds to create an unappealing taste.
      - Use neem oil as a deterrent to make leaves less palatable.

      '
  natural_enemies:
  - Hawks
  - Owls
  - Large snakes
  - Domestic dogs
