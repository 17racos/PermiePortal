---
- name: Flea Beetles
  slug: flea-beetles
  picture: flea_beetles.jpg
  scientific_name: Alticini
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, flea beetles may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Ensure healthy plant growth through proper watering and balanced fertilization. Use reflective mulches
      to deter beetles and regularly inspect plants to catch early infestations.
    biological_controls: Promote beneficial predators like ladybugs, lacewings, and parasitic wasps, as well as ground beetles
      that feed on flea beetles.
    cultural_practices: Practice crop rotation and remove plant debris to reduce overwintering sites. Interplant with repellent
      species to divert pest attention.
    mechanical_physical: Employ floating row covers and sticky traps to physically block or capture the beetles during peak
      activity.
    organic_sprays: Apply neem oil or insecticidal soap as an organic treatment during early infestations to minimize damage.
  natural_enemies:
  - Ladybugs
  - Lacewings
  - Parasitic Wasps
  - Ground Beetles
