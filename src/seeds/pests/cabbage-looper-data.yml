---
- name: Cabbage Looper
  slug: cabbage-looper
  picture: cabbage_looper.jpg
  scientific_name: Trichoplusia ni
  description: >-
    If leaves look shredded overnight or fruit has fresh chew holes, cabbage looper may be
    feeding right now. These larvae can eat fast and strip a healthy plant in a short window.
    Young stages are easy to miss, then damage suddenly explodes as they grow. Catch them early
    to avoid severe defoliation and contaminated harvests.
  characteristics: >-
    Check leaf undersides, growing tips, and stem junctions for eggs, frass pellets, and feeding
    scars. Larvae vary in color, but most have a soft segmented body and blend into foliage.
    Look at dusk or early morning when many species feed more actively. Fresh chewing plus live
    larvae or droppings on lower leaves confirms an active caterpillar outbreak.
  control_methods:
    organic_sprays: Bt kurstaki or aizawai while larvae are under half-grown; spinosad as a follow-up—cover leaf axils and
      undersides.
    biological_controls: Trichogramma spp. for eggs; parasitic flies and wasps on larvae—delay broad sprays to let them respond.
    cultural_practices: Interplant with non-host barriers; time brassica successions; remove crop trash that shelters pupae.
    mechanical_physical: Floating row covers over seedlings; hand pick at night.
    preventive_methods: Light traps for adult monitoring; scout for window-pane feeding early.
  natural_enemies:
  - Trichogramma spp.
  - Vespid wasps
  - Tachinid flies
