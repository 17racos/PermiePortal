---
- name: Citrus Rust Mite
  slug: citrus-rust-mite
  picture: citrus_rust_mite.webp
  scientific_name: Phyllocoptruta oleivora
  description: >-
    If leaves look dusty, speckled, bronzed, or curled without obvious chewing, citrus rust mite
    is a likely suspect. Mites are tiny but can multiply fast, especially during heat and dry
    air. Plants lose vigor as feeding drains cell contents from leaves and tender growth. Early
    action matters, because heavy infestations can spread through a bed in days.
  characteristics: >-
    Use a hand lens and check leaf undersides first, especially near veins and new growth. Look
    for pinprick stippling, fine webbing in some species, and tiny moving dots that range from
    pale to red or brown. Tap a leaf over white paper; moving specks suggest active mites.
    Stippled leaves plus mites or eggs clustered under foliage confirms the diagnosis.
  symptoms:
  - yellowing-leaves
  - webbing
  - silvery-streaking
  - brown-edges
  control_methods:
    biological_controls: >-
      Predatory mites in the Phytoseiidae family -- especially Euseius tularensis
      and Typhlodromalus peregrinus -- are the most important natural enemies of
      citrus rust mite and are already present in most citrus plantings. Avoid
      pyrethroids and other hard pesticides that collapse predatory mite populations.
      Never mix sulfur and horticultural oil -- the combination is severely phytotoxic
      to citrus and kills predatory mites. Sulfur fungicide also kills predatory
      mites -- time sulfur sprays carefully to minimize biological impact.
    preventive_methods: >-
      Citrus rust mite causes silvering or bronzing of fruit skin (russeting) and
      leaf damage -- it does not kill trees but reduces fruit appearance. Monitor
      monthly with a hand lens on interior canopy leaves where mites colonize first.
      Populations surge in hot dry weather -- drought-stressed trees are most
      susceptible. Consistent irrigation and avoiding dust on orchard roads reduces
      mite pressure. Sample fruit and foliage regularly rather than spraying on
      a calendar schedule.
    cultural_practices: >-
      Maintain tree vigor with consistent irrigation and balanced nutrition -- avoid
      excessive nitrogen. Reduce dust on orchard roads and paths by mowing or mulching.
      Hedging and pruning that improves spray penetration into dense canopies improves
      control when sprays are necessary. Monitor interior canopy leaves where mites
      establish first before spreading to exterior fruit.
    mechanical_physical: >-
      Water washing of foliage on small backyard trees temporarily reduces mite numbers.
      Remove heavily infested interior shoots during pruning to reduce mite refugia.
      No practical mechanical control exists for large plantings -- monitoring and
      biological control are more effective investments.
    organic_sprays: >-
      Horticultural oil (narrow-range or summer weight) is the primary organic
      spray -- apply with thorough coverage when mite populations exceed threshold,
      avoiding applications before frost or during extreme heat above 95F (35C).
      Never mix horticultural oil and sulfur -- severe phytotoxicity on citrus.
      Insecticidal soap provides temporary knockdown for light infestations on backyard
      trees. Sulfur fungicide also controls rust mite but conflicts with predatory
      mite populations -- use sparingly.
  natural_enemies:
  - Euseius tularensis
  - Typhlodromalus peregrinus
  - Sixspotted Thrips
