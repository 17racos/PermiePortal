---
- name: Pythium Root Rot
  slug: pythium-root-rot
  picture: pythium_root_rot.jpg
  scientific_name: Pythium spp.
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, pythium root rot may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Copper, hydrogen peroxide, or potassium phosphite drenches where organic labels allow; biological fungicides
      with Streptomyces or Trichoderma as preventive drenches.
    biological_controls: Gliocladium catenulatum (e.g., SoilGard) and Trichoderma products colonize rhizosphere competitively;
      Bacillus amyloliquefaciens strains used in some mixes.
    cultural_practices: Increase air porosity in mix; warm germination media; bottom heat; avoid overwatering; disinfect trays;
      use raised beds with French drains in field.
    mechanical_physical: Pasteurize or solarize ground; improve subsurface drainage; use clean irrigation sources—not pond
      water loaded with zoospores without treatment.
    preventive_methods: Test reused mix; space plants for airflow; do not reuse flood tables without sanitation between crops.
  natural_enemies:
  - Trichoderma spp.
  - Streptomyces spp.
  - Gliocladium catenulatum
