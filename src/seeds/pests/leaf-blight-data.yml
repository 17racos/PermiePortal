---
- name: Leaf Blight
  slug: leaf-blight
  picture: leaf_blight.jpg
  scientific_name: Various Fungal Pathogens
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, leaf blight may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Ensure proper spacing and pruning to improve air circulation and reduce leaf wetness. Avoid excessive
      nitrogen fertilization which can promote lush, vulnerable growth.
    biological_controls: Utilize antagonistic microbes and beneficial fungi that inhibit pathogen growth. These natural competitors
      help suppress the spread of the disease.
    cultural_practices: Remove and destroy infected leaves, practice crop rotation, and use resistant varieties where possible
      to limit disease establishment.
    mechanical_physical: Prune heavily infected parts and dispose of them properly to reduce inoculum sources. Implement physical
      barriers if necessary during high-risk periods.
    organic_sprays: Apply organic fungicides such as neem oil, copper-based sprays, or bicarbonate solutions early in the
      infection cycle to curb disease progression.
  natural_enemies:
  - Antagonistic Fungi
  - Beneficial Bacteria
