---
- name: Leafhoppers
  slug: leafhoppers
  picture: leafhoppers.jpg
  scientific_name: Cicadellidae
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, leafhoppers may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Ensure plants are healthy with proper watering and balanced fertilization, and regularly monitor for
      early signs of leafhopper activity.
    biological_controls: Introduce natural predators like spiders, lacewings, and parasitic wasps, which feed on leafhoppers.
    cultural_practices: Implement companion planting with repellent species, and practice crop rotation to reduce the buildup
      of leafhopper populations.
    mechanical_physical: Use yellow sticky traps to capture adults and manually remove infestations when detected.
    organic_sprays: Apply insecticidal soap, neem oil, or horticultural oils during peak activity periods to deter leafhopper
      feeding.
  natural_enemies:
  - Spiders
  - Lacewings
  - Parasitic Wasps
  - Predatory Bugs
