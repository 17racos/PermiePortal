---
- name: Bean Weevil
  slug: bean-weevil
  picture: bean_weevil.jpg
  scientific_name: Acanthoscelides obtectus
  description: The dry bean bruchid—mottled little beetles that complete their entire drama inside stored beans, leaving round
    windows when adults chew out. Field infestations start when females lay eggs on ripening pods in the garden.
  characteristics: Larvae are white grubs inside seeds; adults are short and hairy with a trapezoidal look. Warm pantries
    turn a jar of beans into a emergence chamber.
  control_methods:
    organic_sprays: Pyrethrin or spinosad on pods near dry-down when adults are active; diatomaceous earth in storage bins
      kills crawling adults—food-grade only, keep dry.
    biological_controls: Parasitic wasps (e.g., Dinarmus, Anisopteromalus) attack larvae and pupae inside seeds in warm climates;
      freeze-kill is not a predator but works.
    cultural_practices: Harvest promptly; screen or winnow; freeze beans at 0 °F for a week before long storage; never mix
      new beans with old; clean jars and kill webbing in empty bins.
    mechanical_physical: Hermetic storage (oxygen-poor containers) stops development; solarize small batches in sealed dark
      jars on hot days where safe.
    preventive_methods: Inspect purchased seed; rotate snap/dry bean plots; vacuum storage rooms between seasons.
  natural_enemies:
  - Parasitic Wasps (Pteromalidae)
  - Parasitic Wasps (Braconidae)
