---
- name: Clover Weevils
  slug: clover-weevils
  picture: clover_weevils.jpg
  scientific_name: Sitona lepidus
  description: >-
    If plants are wilting, notching at the edges, or fruit and roots show hidden feeding damage,
    clover weevils may be the cause. Adults chew above ground while larvae often feed out of
    sight inside soil, stems, or fruit. Damage builds quietly, then plants crash fast when roots
    are heavily hit. Act early so a small weevil problem does not become a season-long
    infestation.
  characteristics: >-
    Look for small beetles with a hard body and a distinct snout, usually active at dawn, dusk,
    or night. Check for crescent-shaped leaf notches, punctures in fruit, or tiny entry holes
    near stems. In soil or damaged tissue, larvae are often pale, legless, and curved in a
    C-shape. Fresh chew marks plus snout beetles or C-shaped grubs confirm active weevil
    pressure.
  control_methods:
    preventive_methods: Monitor clover stands regularly and maintain plant health through proper watering and balanced fertilization
      to deter weevil infestations.
    biological_controls: Encourage natural predators such as parasitic wasps, ground beetles, and insectivorous birds that
      feed on weevils.
    cultural_practices: Practice crop rotation and manage clover stands to avoid over-fertilization, which can increase susceptibility.
      Remove heavily infested plant material to reduce weevil numbers.
    mechanical_physical: Use physical barriers where possible and deploy sticky traps to capture adult weevils during peak
      activity.
    organic_sprays: Apply organic insecticides like neem oil or insecticidal soap during high infestation periods to reduce
      weevil populations without affecting beneficial organisms.
  natural_enemies:
  - Parasitic Wasps
  - Ground Beetles
  - Insectivorous Birds
