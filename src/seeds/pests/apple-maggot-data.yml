---
- name: Apple Maggot
  slug: apple-maggot
  picture: apple_maggot.jpg
  scientific_name: Rhagoletis pomonella
  description: Apple maggots are the larval stage of a small fly that infests apples by burrowing into the fruit. They can
    be identified by small entry holes, tunnels within the fruit, and the presence of frass, which makes the fruit unmarketable.
  characteristics: These pests are creamy white larvae with a dark head capsule, typically causing extensive internal damage
    to the fruit. Their feeding creates tunnels that reduce the quality and shelf-life of the fruit, leading to significant
    economic losses in orchards.
  control_methods:
    preventive_methods: Implement strict orchard sanitation by removing and destroying fallen and infested fruit to break
      the pest's life cycle. Use baited traps to monitor adult fly activity and establish intervention thresholds early.
    biological_controls: Encourage natural enemies such as parasitic wasps, beneficial flies, and insectivorous birds which
      target apple maggot larvae.
    cultural_practices: Practice proper orchard hygiene, crop rotation, and consider intercropping with repellent plants or
      trap crops to divert the pests from high-value fruit trees.
    mechanical_physical: Use sticky traps and physical barriers like netting to prevent adult flies from laying eggs on fruit.
      Bagging individual fruits can also help protect them during peak infestation periods.
    organic_sprays: Apply organic insecticidal soaps or neem oil during the adult flight period to deter oviposition, ensuring
      treatments are timed with peak pest activity.
  natural_enemies:
  - Parasitic Wasps
  - Beneficial Flies
  - Insectivorous Birds
