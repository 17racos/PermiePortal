---
- name: Powdery Mildew
  slug: powdery-mildew
  picture: powdery_mildew.jpg
  scientific_name: Erysiphales
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, powdery mildew may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Improve air circulation through proper pruning and spacing, and avoid excessive nitrogen fertilization
      which promotes lush, vulnerable growth.
    biological_controls: Encourage beneficial microbes and antagonistic fungi that compete with the mildew, such as Bacillus
      subtilis.
    cultural_practices: Remove and destroy infected leaves, practice crop rotation, and choose resistant plant varieties when
      available.
    mechanical_physical: Hand-remove infected material and use a strong water spray to wash away spores, reducing the fungal
      load on plant surfaces.
    organic_sprays: Apply organic fungicides like sulfur, neem oil, or potassium bicarbonate during early infection stages
      to suppress the spread of powdery mildew.
  natural_enemies:
  - Beneficial Fungi
  - Antagonistic Bacteria
  - Competitive Microbes
