---
- name: Downy Mildew
  slug: downy-mildew
  picture: downy_mildew.jpg
  scientific_name: Peronosporaceae (oomycetes; host-specific species)
  description: Not a true fungus—oomycete pathogens that cause yellow angular leaf spots (often vein-limited) and fuzzy gray-purple
    sporulation on the undersides in humid conditions. Cucurbits, grapes, lettuce, basil, and others each have specialized
    species.
  characteristics: Morning inspection shows purplish mold under leaves while tops look blotchy yellow. Spores spread on cool
    wet nights; epidemics follow prolonged leaf wetness.
  control_methods:
    preventive_methods: Choose resistant cultivars, space plants for drying, water at soil line in morning, and use high tunnels
      with sides that vent.
    biological_controls: Compost teas and Bacillus-based products are used with variable results; strong soil and foliar biology
      supports plant vigor.
    cultural_practices: Remove infected leaves early in outbreaks, avoid overhead irrigation, and destroy crop debris that
      harbors oospores where the pathogen overwinters that way.
    mechanical_physical: Row covers can delay exposure on direct-seeded crops; vertical trellising improves air movement.
    organic_sprays: Copper, sulfur, or biological fungicides per crop label; potassium bicarbonate solutions sometimes suppress
      mild infections. Reapply before rain events per local organic rules.
  natural_enemies:
  - Hyperparasitic Fungi
  - Competitive Microbes
