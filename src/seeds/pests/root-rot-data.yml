---
- name: Root Rot
  slug: root-rot
  picture: root_rot.jpg
  scientific_name: Various (e.g., Pythium spp., Phytophthora spp., Rhizoctonia spp., Fusarium spp.)
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, root rot may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    preventive_methods: Ensure drainage, avoid overwatering, use raised beds, and plant at correct depth. Choose resistant
      rootstocks or varieties when known.
    biological_controls: Trichoderma spp., Bacillus subtilis, and mycorrhizal inoculants can improve root health and competitive
      exclusion when used as part of a soil-health program.
    cultural_practices: Rotate susceptible crops, incorporate organic matter to improve soil structure, and fix low spots
      or install French drains.
    mechanical_physical: Remove severely affected plants with surrounding soil; do not compost. Sterilize containers and trays
      between seedling batches.
    organic_sprays: Biological fungicides based on Trichoderma or Bacillus as drench; potassium phosphite may be allowed in
      some organic programs as a plant-defense enhancer—verify certifier rules.
  natural_enemies:
  - Trichoderma spp.
  - Competitive Soil Bacteria
  - Mycorrhizal Fungi
