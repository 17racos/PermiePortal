---
- name: Swede Midge
  slug: swede-midge
  picture: swede_midge.webp
  scientific_name: Contarinia nasturtii
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, swede midge may already be on the
    plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    preventive_methods: Monitor brassica crops closely and maintain healthy plants with balanced watering and fertilization.
    biological_controls: Introduce parasitic wasps and predatory insects that specialize in midge larvae control.
    cultural_practices: Practice crop rotation and interplant with repellent species to disrupt the midge lifecycle.
    mechanical_physical: Use fine mesh netting to protect crops during high-risk periods and remove infested tissues promptly.
    organic_sprays: Apply insecticidal soap or neem oil early in the infestation to curb larval development.
  natural_enemies:
  - Parasitic Wasps
  - Predatory Insects
