---
- name: Fungus Gnat
  slug: fungus-gnat
  picture: fungus_gnat.jpg
  scientific_name: Bradysia impatiens
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, fungus gnat may
    already be active. This problem often starts small, then spreads across healthy tissue
    before most growers realize how serious it is. Warmth, moisture, and crowded foliage usually
    speed it up. Treat early, because waiting even a few days can turn a manageable infection
    into major crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    organic_sprays: Bacillus thuringiensis israelensis soil drench kills larvae where products are labeled; neem cake or soil
      drenches with neem can suppress larvae—avoid drowning roots chasing adults.
    biological_controls: Steinernema feltiae nematodes, Stratiolaelaps miles (Hypoaspis) mites, and Dalotia coriaria beetles
      are standard augmentative controls in propagation.
    cultural_practices: Let the surface dry between irrigations; pasteurize or use consistent-quality mix; avoid green compost
      in cell trays; bottom water to keep surface drier.
    mechanical_physical: Yellow sticky traps at rim height; potato slices on media surface lure larvae for monitoring counts.
    preventive_methods: Inspect bought-in plugs; screen house intakes; store bagged mix dry and sealed.
  affected_plants:
  - slug: basil
    name: Basil
  - slug: strawberry
    name: Strawberry
  - slug: iceberg-lettuce
    name: Iceberg Lettuce
  - slug: celery
    name: Celery
  natural_enemies:
  - Steinernema feltiae
  - Stratiolaelaps scimitus
  - Dalotia coriaria
