---
- name: Leaf Spot
  slug: leaf-spot
  picture: leaf_spot.jpg
  scientific_name: Multiple species (e.g., Cercospora, Septoria, Alternaria)
  description: >-
    If leaves, stems, or fruit suddenly look spotted, sunken, or rotting, leaf spot may already
    be active. This problem often starts small, then spreads across healthy tissue before most
    growers realize how serious it is. Warmth, moisture, and crowded foliage usually speed it
    up. Treat early, because waiting even a few days can turn a manageable infection into major
    crop loss.
  characteristics: >-
    Look for a pattern, not one bad leaf: expanding spots, dark or pale halos, fuzzy growth, or
    tissue that collapses when touched. Check both leaf surfaces, stem bases, and fruit scars
    where symptoms first appear. New lesions after rain, overhead watering, or heavy dew are a
    strong clue. When separate spots begin merging into larger dead patches, the disease is
    advancing quickly.
  control_methods:
    biological_controls: >-
      Bacillus subtilis colonizes leaf surfaces and produces antifungal compounds
      that suppress a broad range of leaf spot pathogens — apply preventively
      as a foliar spray every 7-14 days during wet weather. Trichoderma products
      as soil drenches support root health and reduce systemic stress that makes
      plants more susceptible to foliar disease. A diverse phyllosphere microbial
      community naturally suppresses leaf spot — avoid broad-spectrum copper sprays
      that sterilize leaf surfaces and eliminate beneficial competing microbes.
    preventive_methods: >-
      Leaf spot pathogens spread by rain splash and overhead irrigation — water
      at the soil line only, never on foliage. Mulch under plants prevents soil
      splash onto lower leaves. Most leaf spot fungi overwinter in infected crop
      debris — remove and destroy all plant material at season end rather than
      composting. Spores need wet leaf surfaces for 4-12 hours to germinate —
      evening irrigation that leaves foliage wet overnight is the single biggest
      risk factor. Scout after rainstorms when conditions are ideal for infection.
    cultural_practices: >-
      Widen plant spacing for air circulation — leaves dry faster after rain and
      irrigation. Prune lower leaves that touch soil where splash inoculum originates.
      Rotate susceptible crops on 3-4 year cycles — most leaf spot pathogens are
      host-specific and die out in soil without a host plant. Choose resistant
  p the lowest tier of infected leaves immediately
      at first sign to slow upward spread.
    mechanical_physical: >-
      Remove and bag infected leaves — do not compost. Sanitize pruning tools
      between plants with 70% isopropyl alcohol when cutting through infected
      tissue. This is especially important for bacterial leaf spot which spreads
      on dirty tools. Copper-impregnated row covers have some fungistatic effect
      for high-value crops in research settings.
    organic_sprays: >-
      Copper fungicides on a protectant schedule during wet periods are the most
      effective organic spray — apply before infection rather than after symptoms
      appear. Copper has a 7-10 day residual and must be reapplied after rain.
      Sulfur fungicide works on many fungal leaf spots but not bacterial ones —
      identify your pathogen before spraying. Neem oil has some preventive efficacy.
      Potassium bicarbonate raises leaf surface pH and kills fungal spores on
      contact. Rotate materials to prevent resistance — no single spray manages
      all leaf spot pathogens.
  natural_enemies:
  - Antagonistic Bacteria
  - Hyperparasitic Fungi
