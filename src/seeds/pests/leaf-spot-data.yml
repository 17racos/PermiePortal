---
- name: Leaf Spot
  slug: leaf-spot
  picture: leaf_spot.jpg
  scientific_name: Multiple species (e.g., Cercospora, Septoria, Alternaria)
  description: A symptom, not a single villain—round to angular lesions with yellow halos, dark fruiting dots, or shot holes
    depending on which fungus or bacterium won the lottery on your leaves. Wet leaves plus spores equals a new pattern by
    morning.
  characteristics: Spots start small, may merge, and often appear first on lower, older foliage after splashing rain or overhead
    love from the hose. Purely cosmetic until defoliation weakens the plant or opens sunscald.
  control_methods:
    organic_sprays: Copper, sulfur, or potassium bicarbonate on a protectant schedule during wet spells; neem or Bacillus-based
      products as part of rotation—identify host to pick rate and interval.
    biological_controls: Antagonistic microbes (Bacillus subtilis, Trichoderma products) colonize leaf surfaces; healthy phyllosphere
      communities outcompete sloppy pathogens when humidity is managed.
    cultural_practices: Water at soil line, mulch to stop splash, widen spacing, prune for airflow, and choose resistant cultivars
      when breeders bothered to.
    mechanical_physical: Strip and hot-compost or remove the bottom infected layer; sanitize tools between plants if bacterial
      spot is suspected.
    preventive_methods: Avoid evening irrigation; scout after storms; destroy crop debris that overwinters Pseudocercosporella
      and friends.
  natural_enemies:
  - Antagonistic Bacteria
  - Hyperparasitic Fungi
