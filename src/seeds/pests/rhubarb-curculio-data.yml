---
- name: Rhubarb Curculio
  slug: rhubarb-curculio
  picture: rhubarb_curculio.jpg
  scientific_name: Lixus concavus
  description: >-
    If new growth is curling, yellowing, sticky, or chewed, rhubarb curculio may already be on
    the plant. This pest often builds quietly, then damage appears all at once. Feeding stress
    weakens growth, reduces yield, and opens the door to secondary disease. Early cleanup is
    much easier than fighting a full population surge later.
  characteristics: >-
    Inspect the newest growth first: leaf undersides, flower buds, stem joints, and tender tips
    where pests gather. Look for body shape, color, eggs, cast skins, honeydew, webbing, or
    fresh puncture marks. A hand lens and a white paper tap test help reveal small life stages.
    Matching visible pests with fresh plant damage confirms active infestation.
  control_methods:
    organic_sprays: Pyrethrin or neem on stalks and surrounding dock patches during adult activity—focus evenings when weevils
      climb; repeat after rain.
    biological_controls: Birds, predatory beetles, and spiders pick off adults; parasitic wasps attack some Lixus larvae in
      stems of wild hosts.
    cultural_practices: Mow or remove nearby curly dock and sorrel before adults move to rhubarb; harvest stalks promptly;
      avoid leaving split stalks that hold moisture.
    mechanical_physical: Shake adults into soapy water on cool mornings; row cover early spring clumps before migration peaks.
    preventive_methods: Scout margins between rhubarb and wasteland; rotate harvest from outer rows where immigration hits
      first.
  natural_enemies:
  - Birds
  - Ground Beetles (Carabidae)
  - Parasitic Wasps
