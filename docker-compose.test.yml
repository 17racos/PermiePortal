version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    environment:
      - RAILS_ENV=development
      - DATABASE_URL=postgres://postgres:postgres@host.docker.internal:5432/permieportal_development
      - REDIS_URL=redis://host.docker.internal:6379/1
      - OLLAMA_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network

volumes:
  bundle_cache:

networks:
  app_network:
    driver: bridge 