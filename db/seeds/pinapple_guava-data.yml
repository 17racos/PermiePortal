  description: |-
    Pineapple Guava (*Acca sellowiana*), also known as Feijoa, is an evergreen shrub or small tree native to South America. It typically grows 10 to 15 feet (3 to 4.5 meters) tall and wide, featuring dark green, glossy leaves with silvery, slightly fuzzy undersides. The plant produces striking flowers in late spring, characterized by fleshy white or pink petals and prominent burgundy stamens. These flowers are not only ornamental but also edible, adding a sweet flavor to salads. The fruit, maturing between August and October, is egg-shaped, starting gray-green and turning reddish-brown upon ripening. The pulp has a unique taste reminiscent of minty pineapple or guava.

    ✂️🫘 Methods to Propagate:
    - **Seeds:** Sow fresh seeds in well-draining soil. Germination occurs in about three weeks, but seedlings may take several years to bear fruit and might not produce high-quality yields.
    - **Cuttings:** Semi-hardwood cuttings taken in the fall can root successfully with bottom heat and misting, leading to fruiting in a shorter period compared to seedlings.
    - **Grafting:** This method ensures desirable fruit characteristics and can expedite the fruiting process.

    🌞💧 Sun and Water Requirements:
    - **Sun:** Prefers full sun but can tolerate partial shade. Full sun exposure promotes better flowering and fruiting.
    - **Water:** While drought-tolerant once established, regular watering during flowering and fruiting seasons enhances yield and prevents fruit drop. Ensure the soil is well-draining to avoid waterlogging.

    🧑‍🌾👩‍🌾 When to Harvest:
    - **Fruits:** Typically ripen between August and October. Ripe fruits often fall from the plant; they can also be picked when slightly soft to the touch and allowed to ripen off the plant.

  purpose: |-
    - Edible: The sweet, aromatic fruits are consumed fresh or used in jams, jellies, and desserts. The flower petals are also edible and can enhance salads with their sweet flavor.
    - Pollinator: The vibrant flowers attract bees and other pollinators, supporting the ecosystem and enhancing pollination.
    - Wildlife Attractor: Birds are drawn to the plant, feeding on both flowers and fruits, thus promoting biodiversity.
    - Windbreaker: When planted closely, its dense foliage serves as an effective windbreak, protecting other plants and reducing soil erosion.
    - Border Plant: Its attractive appearance and manageable size make it suitable for hedges and landscape borders.

  companions:
    - Lavender
    - Rosemary
    - Thyme
  avoid:
  - None
  pests:
