  scientific_name: Calathea spp.
  aka:
  - Prayer Plant
  family: Marantaceae
  zone: 11-12
  ideal_temp_min: 65
  ideal_temp_max: 80
  min_temp: 60
  max_temp: 85
  perennial: true
  layers:
  - Herbaceous
