- common_name: Cassava
  picture: cassava.jpg
  scientific_name: Manihot esculenta
  aka:
    - Yuca
    - Manioc
    - Mandioca
    - Tapioca Plant
  family: Euphorbiaceae
  zone: 8-12
  ideal_temp_min: 70
  ideal_temp_max: 90
  min_temp: 50
  max_temp: 100
  perennial: true
  layers:
    - Shrub
  plant_function:
    - Edible
    - Animal Fodder
    - Erosion Control
  description: |-
    Cassava (Manihot esculenta) is a shrubby perennial native to South America, reaching heights of 1.8 to 2.4 meters (6 to 8 feet). It features large, palmate leaves with dark green lobes and reddish veins, and produces starchy, tuberous roots that are a staple food in many tropical regions. The plant thrives in full sun and well-drained soils with a pH between 4.0 and 8.0. Propagation is typically through stem cuttings, and roots are harvested 8 to 18 months after planting, depending on growing conditions. It's important to process cassava properly before consumption to remove naturally occurring cyanogenic compounds.
  purpose: |-
    - **Edible**: Cassava roots are a major source of carbohydrates and are consumed worldwide in various forms, including flour, tapioca, and as a boiled vegetable.
    - **Animal Fodder**: The leaves and peels can be used as feed for livestock, providing a source of protein and energy.
    - **Erosion Control**: With its extensive root system, cassava helps in stabilizing soil and preventing erosion, especially in tropical regions.
  companions:
    - Corn
    - Beans
    - Peanuts
  avoid:
    - Sweet Potato
    - Tomato
  pests:
    - Cassava Mealybug
    - Cassava Green Mite
    - Whiteflies
