  description: |-
    Angel's Trumpet (*Brugmansia* species) are large shrubs or small trees that can reach heights of 6-20 feet (1.8-6 meters) in frost-free areas. They have many branching trunks with simple, alternately arranged leaves that can be toothed or entire. The large, pendulous, trumpet-shaped flowers, ranging from 6 to 24 inches (15-60 cm) long, come in shades of white, cream, yellow, peach, orange, pink, and red. Most species are fragrant, especially in the evening, attracting pollinators such as moths and hummingbirds. All parts of the plant are highly toxic if ingested.

    🌞💧 **Sun and Water Requirements:**
    Thrive in full sun to partial shade. Require moist, fertile, well-drained soil. Regular watering is essential, especially during dry periods, but overwatering should be avoided to prevent root rot.

    ✂️🫘 **Methods to Propagate:**
    Easily propagated by rooting 4-6 inch (10-15 cm) cuttings taken from the end of a branch during the summer. Cuttings should be placed in moist, well-drained soil and kept in a warm, shaded area until roots develop.

    🧑‍🌾👩‍🌾 **When to Harvest:**
    As ornamental plants, they are not typically harvested. Pruning can be done to maintain shape and encourage bushier growth. Any pruning should be done with caution due to the plant's toxicity.

  purpose: |-
    - Ornamental: Prized for their large, fragrant, and visually striking flowers that add a tropical feel to gardens and landscapes.
    - Medicinal: Used in traditional medicine for various treatments; however, due to their high toxicity, they should only be used under professional supervision.
    - Wildlife Attractor: The fragrant flowers attract pollinators such as moths and hummingbirds, enhancing garden biodiversity.

  companions:
    - Hibiscus
    - Canna Lily
    - Elephant Ear
    - Banana
  avoid:
  - Nightshade
  pests:
    - Aphid
    - Spider Mite
    - Whitefly