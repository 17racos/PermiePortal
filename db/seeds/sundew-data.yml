- common_name: Sundew
  picture: sundew.jpg
  scientific_name: Drosera spp.
  aka:
    - Drosera
  family: Droseraceae
  zone: 6-9
  ideal_temp_min: 55
  ideal_temp_max: 85
  min_temp: 20
  max_temp: 95
  perennial: true
  layers:
    - Ground Cover
  plant_function:
    - Pest Management
    - Wildlife Attractor
    - Ground Cover
  description: |-
    Sundews are carnivorous plants characterized by glandular trichomes (tentacles) on their leaves that secrete sticky mucilage to trap insects. They are commonly found in bogs and fens with acidic, sandy soils. The leaves form rosettes and can vary in size and shape depending on the species. Sundews produce small flowers, typically pink or white, on tall scapes. They require full sun exposure and consistently moist, nutrient-poor soil to thrive.
  
    ✂️🫘 Methods to Propagate:
    - Seed: Sow seeds on the surface of a moist sphagnum peat and perlite mix; do not cover, as they require light to germinate. Maintain high humidity and temperatures between 70-80°F (21-27°C). Germination may take several weeks.
    - Leaf Cuttings: Place healthy leaves on moist sphagnum moss; new plantlets may form at the leaf margins.

    🌞💧 Sun and Water Requirements:
    - Sun: Full sun exposure is ideal; however, some species can tolerate partial shade.
    - Water: Keep soil consistently moist using distilled or rainwater; avoid tap water due to mineral sensitivity. Outdoor plants do well when planted near a water feature or in soggy soil.

    🧑‍🌾👩‍🌾 When to Harvest:
    - Sundews are primarily cultivated for ornamental purposes and natural pest control rather than harvest.

  purpose: |-
    - Pest Management: Effective in controlling small insect populations, such as gnats and fruit flies, due to their carnivorous nature.
    - Wildlife Attractor: Attracts insects, which can benefit the local ecosystem by supporting insectivorous wildlife.
    - Ground Cover: Provides a unique and attractive ground cover in suitable wetland gardens or terrariums.

  companions:
    - Sphagnum Moss
    - Pitcher Plant
    - Bog Rosemary
  avoid:
    - Plants requiring high nutrient soils
  pests:
    - Aphids
    - Fungus Gnats