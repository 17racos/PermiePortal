  description: |-
    Lantana is a perennial flowering shrub native to Central and South America, growing between 0.3 to 1.8 meters (1-6 feet) tall. It features clusters of small, brightly colored flowers that can change hues as they mature, attracting butterflies, bees, and hummingbirds. The leaves are coarse, lightly toothed, and emit a pungent scent when crushed. Lantana is highly adaptable, tolerating heat, drought, and salt, making it suitable for various landscapes. However, in certain regions, it is considered invasive due to its rapid growth and ability to outcompete native vegetation.

    🌞💧 Sun and Water Requirements:
    Thrives in full sun, requiring at least six hours of direct sunlight daily. Prefers well-drained soil and is drought-tolerant once established. Overwatering should be avoided to prevent root rot.

    ✂️🫘 Methods to Propagate:
    Propagated through seeds or semi-hardwood cuttings. Seeds should be sown in warm conditions, while cuttings taken in late spring or early summer can root in moist, well-draining soil.

    🧑‍🌾👩‍🌾 When to Harvest:
    While lantana is primarily ornamental, if harvesting for decorative purposes or traditional uses, collect flowers when in full bloom. Note: All parts of the plant are toxic if ingested; handle with care.
  purpose: |-
    - **Pollinator**: Attracts butterflies, bees, and hummingbirds, supporting pollination in the garden.
    - **Wildlife Attractor**: Provides nectar for various pollinators and habitat for certain bird species.
    - **Ground Cover**: Some varieties, like trailing lantana, serve as effective ground covers, reducing soil erosion.
    - **Border Plant**: Used in borders and hedges for its vibrant flowers and dense foliage.
