  description: |-
    Alfalfa (*Medicago sativa*), also known as lucerne, is a perennial flowering plant in the legume family Fabaceae. It typically grows up to 1 meter (3.3 feet) tall with a deep root system that can extend more than 4 meters (13 feet) into the soil, enhancing its drought tolerance. The plant has trifoliate leaves with obovate leaflets and produces clusters of small purple flowers, which develop into coiled seed pods containing multiple seeds. Alfalfa is highly valued for its high protein content and digestibility, making it a staple forage crop for livestock. It thrives in well-drained soils with a neutral pH and requires full sun exposure.

    ✂️🫘 Methods to Propagate:
    - **Seeds:** Sow seeds directly into well-prepared soil in early spring or fall. A seeding rate of 13-20 kg per hectare is recommended, depending on soil type and seeding method. Ensure good soil-to-seed contact by lightly covering the seeds with soil and maintaining consistent moisture until germination, which typically occurs within 7-10 days.

    🌞💧 Sun and Water Requirements:
    - **Sun:** Alfalfa requires full sun exposure, needing at least 6-8 hours of direct sunlight daily for optimal growth.
    - **Water:** While alfalfa is drought-tolerant due to its deep root system, consistent moisture is necessary for high yields. It performs best with 800-1,000 mm (31-39 inches) of annual rainfall or equivalent irrigation. Avoid waterlogged conditions, as they can lead to root diseases.

    🧑‍🌾👩‍🌾 When to Harvest:
    - **Forage:** Harvest alfalfa multiple times per growing season, typically when 10% of the plants begin to bloom. This stage balances optimal nutritional content and yield. In temperate regions, this may result in 3-4 cuttings per year, while in warmer climates, up to 12 cuttings are possible.
  purpose: |-
    - Nitrogen Fixer: Alfalfa forms a symbiotic relationship with *Sinorhizobium meliloti* bacteria in its root nodules, fixing atmospheric nitrogen into the soil and enhancing fertility for subsequent crops.
    - Animal Fodder: Due to its high protein content and palatability, alfalfa is a primary feed source for dairy cows, beef cattle, horses, sheep, and goats. It is commonly harvested as hay, silage, or used for grazing.
    - Erosion Control: The extensive root system stabilizes soil, reducing erosion and improving soil structure.
    - Ground Cover: Alfalfa's dense foliage provides effective ground cover, suppressing weed growth and protecting soil from erosion.
  companions:
    - Corn
    - Oats
    - Rye
  avoid:
  - None
  pests:
