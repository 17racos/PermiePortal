  description: |-
    Pineapple (*Ananas comosus*) is a tropical plant known for its edible fruit. It grows as a small shrub, typically reaching 1.0 to 1.5 meters (3.3 to 4.9 feet) in height. The plant has a short, stocky stem surrounded by tough, waxy leaves arranged in a spiral. Each plant produces a single fruit, which is a fusion of up to 200 individual flowers. The fruit is crowned with a tuft of stiff leaves. Pineapples are drought-tolerant but sensitive to cold temperatures. They perform best in well-drained, sandy soils with a pH between 4.5 and 6.5.

    🌞💧 **Sun and Water Requirements:**
    Pineapples require full sun, needing at least 6 hours of bright, indirect sunlight daily. They prefer well-drained soil and should be watered regularly, allowing the soil to dry out between waterings to prevent root rot. Overwatering can lead to root diseases. :contentReference[oaicite:0]{index=0}

    ✂️🫘 **Methods to Propagate:**
    Pineapples can be propagated through various methods:
    - **Crowns:** The leafy top of the fruit can be twisted off and planted after drying for a few days.
    - **Suckers:** Shoots that develop between the leaves of the mature plant can be removed and planted.
    - **Slips:** These are found at the base of the fruit and can be planted similarly to suckers.

    🧑‍🌾👩‍🌾 **When to Harvest:**
    Pineapples are typically ready to harvest 18 to 24 months after planting. Indicators of ripeness include a uniform golden-yellow color and a sweet aroma. The fruit should be firm with a slight give when pressed. :contentReference[oaicite:1]{index=1}

  purpose: |-
    - Edible: Pineapples are cultivated primarily for their sweet, juicy fruit, consumed fresh or processed into juices, jams, and desserts.
    - Mulcher: The plant's leaves and stem residues can be used as mulch to improve soil organic matter.
    - Ground Cover: Pineapple plants can serve as ground cover in tropical regions, helping to suppress weeds and prevent soil erosion.

